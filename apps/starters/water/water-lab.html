<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Chemistry of Water — AP Biology Interactive</title>
<style>
  :root{
    --bg:#0b1020; --panel:#121a30; --panel2:#0f1729; --ink:#e8eefc; --muted:#93a3c4;
    --accent:#4ea1ff; --accent2:#6fe3c4; --pos:#ff6b6b; --neg:#4ea1ff; --line:#26324f;
    --O:#ff4d4d; --H:#e9eef8; --Na:#b06bff; --Cl:#5fd07a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{display:grid;grid-template-columns:1fr 430px;grid-template-rows:auto auto 1fr;height:100vh}
  header{grid-column:1/3;grid-row:1;display:flex;align-items:center;gap:16px;padding:12px 22px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0e1730,#0b1020)}
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
  header .badge{font-size:11px;color:var(--muted);border:1px solid var(--line);
    padding:3px 9px;border-radius:20px}
  nav{grid-column:1/3;grid-row:2;display:flex;gap:6px;padding:8px 22px;border-bottom:1px solid var(--line);
    overflow-x:auto;background:var(--panel2)}
  nav button{white-space:nowrap;background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:6px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;transition:.15s}
  nav button:hover{color:var(--ink);border-color:var(--accent)}
  nav button.active{background:var(--accent);border-color:var(--accent);color:#04122b;font-weight:650}
  nav button .n{opacity:.6;margin-right:5px}
  #stage{grid-row:3;grid-column:1;position:relative;background:radial-gradient(circle at 50% 40%,#16233f,#0a0f1e 75%);overflow:hidden}
  #gl{display:block;width:100%;height:100%}
  #controls{position:absolute;left:16px;bottom:16px;right:70px;display:flex;flex-wrap:wrap;gap:8px;
    align-items:center}
  .ctl{background:rgba(15,23,41,.82);border:1px solid var(--line);border-radius:10px;
    padding:7px 12px;font-size:12.5px;color:var(--ink);cursor:pointer;backdrop-filter:blur(6px);
    display:flex;align-items:center;gap:8px;user-select:none}
  .ctl:hover{border-color:var(--accent)}
  .ctl.on{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset;color:#eafff9}
  .ctl.act{background:var(--accent);color:#04122b;border-color:var(--accent);font-weight:650}
  .hint{position:absolute;top:14px;left:16px;font-size:12px;color:var(--muted);
    background:rgba(15,23,41,.7);padding:5px 10px;border-radius:8px;border:1px solid var(--line)}
  #readout{position:absolute;top:14px;right:16px;font-size:12px;color:var(--accent2);
    background:rgba(15,23,41,.7);padding:6px 11px;border-radius:8px;border:1px solid var(--line);
    font-variant-numeric:tabular-nums;text-align:right;min-width:120px;display:none}
  /* big vertical temperature slider, left of stage */
  #tempbar{position:absolute;left:18px;top:50%;transform:translateY(-50%);display:none;
    flex-direction:column;align-items:center;gap:10px;background:rgba(15,23,41,.82);
    border:1px solid var(--line);border-radius:16px;padding:16px 14px;backdrop-filter:blur(6px)}
  #tempbar .cap{font-size:11px;color:var(--muted);letter-spacing:.5px}
  #tempbar .tval{font-size:16px;font-weight:750;color:#ffb08a;font-variant-numeric:tabular-nums}
  #tempbar input[type=range]{ -webkit-appearance:slider-vertical;appearance:slider-vertical;
    writing-mode:vertical-lr;direction:rtl;width:26px;height:52vh;accent-color:#ff8a5b;cursor:pointer}
  #tempbar .tlabel{font-size:10.5px;color:var(--muted)}
  #tempbar .tlabel.cold{color:#9fd0ff}
  #tempbar .tlabel.hot{color:#ff8a5b}
  #savepng{position:absolute;bottom:16px;right:16px;font-size:12.5px;color:var(--ink);
    background:rgba(15,23,41,.82);border:1px solid var(--line);border-radius:10px;padding:7px 12px;
    cursor:pointer;backdrop-filter:blur(6px)}
  #savepng:hover{border-color:var(--accent)}
  #side{grid-row:3;grid-column:2;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden}
  #card{padding:22px 24px;overflow-y:auto;flex:1}
  #card h2{font-size:20px;margin:0 0 2px}
  #card .tag{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--accent2);font-weight:700}
  #card p{font-size:14px;line-height:1.62;color:#d3ddf3}
  #card .key{background:rgba(78,161,255,.09);border-left:3px solid var(--accent);
    padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0;font-size:13.5px;line-height:1.55}
  #card .key b{color:var(--accent2)}
  #card ul{padding-left:18px;font-size:13.5px;line-height:1.6;color:#d3ddf3}
  #card .try{font-size:12.5px;color:var(--accent2);margin-top:6px;display:flex;gap:7px;align-items:flex-start}
  #card .try::before{content:"▸";color:var(--accent2)}
  footer{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--line);background:var(--panel2)}
  footer button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);font-size:13.5px;cursor:pointer;font-weight:600}
  footer button:hover{border-color:var(--accent)}
  footer button.primary{background:var(--accent);color:#04122b;border-color:var(--accent)}
  footer button:disabled{opacity:.35;cursor:not-allowed}
  @media (max-width:920px){#app{grid-template-columns:1fr;grid-template-rows:auto auto 46vh 1fr}
    #stage{grid-column:1}#side{grid-column:1;grid-row:auto;border-left:none;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>💧 The Chemistry of Water</h1>
    <span class="badge">AP Biology · Interactive</span>
    <span class="badge" style="margin-left:auto">Drag stage to rotate · scroll to zoom</span>
  </header>
  <nav id="nav"></nav>
  <div id="stage">
    <canvas id="gl"></canvas>
    <div class="hint" id="hint"></div>
    <div id="readout"></div>
    <div id="controls"></div>
    <button id="savepng" title="Save transparent PNG">⬇ PNG</button>
  </div>
  <div id="side">
    <div id="card"></div>
    <footer>
      <button id="prev">← Previous</button>
      <button id="next" class="primary">Next →</button>
    </footer>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* =============================================================
 *  THE CHEMISTRY OF WATER — one continuous simulation
 *  Each step adds molecules / reveals controls on the SAME sim.
 * ============================================================= */

/* ---------- scene setup ---------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
const root = new THREE.Group(); scene.add(root);

scene.add(new THREE.AmbientLight(0xffffff, .55));
const keyL = new THREE.DirectionalLight(0xffffff, .9); keyL.position.set(4,6,8); scene.add(keyL);
const fillL = new THREE.DirectionalLight(0x88aaff, .4); fillL.position.set(-6,-2,-4); scene.add(fillL);

const cam = {theta:0.5, phi:1.15, r:9, target:new THREE.Vector3(0,0,0)};
function applyCam(){
  camera.position.set(
    cam.target.x + cam.r*Math.sin(cam.phi)*Math.sin(cam.theta),
    cam.target.y + cam.r*Math.cos(cam.phi),
    cam.target.z + cam.r*Math.sin(cam.phi)*Math.cos(cam.theta));
  camera.lookAt(cam.target);
}
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{ if(!drag)return;
  cam.theta -= (e.clientX-drag.x)*0.008;
  cam.phi = Math.max(0.25, Math.min(2.85, cam.phi-(e.clientY-drag.y)*0.008));
  drag={x:e.clientX,y:e.clientY}; applyCam();});
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();
  cam.r=Math.max(5,Math.min(60,cam.r*(1+Math.sign(e.deltaY)*0.08)));
  S.targetR=cam.r; applyCam();},{passive:false});   // manual zoom sticks

function resize(){ const w=canvas.clientWidth,h=canvas.clientHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(canvas);

/* ---------- geometry helpers ---------- */
const Rsphere = new THREE.SphereGeometry(1,32,24);
const state = {O:0xff4d4d,H:0xe9eef8,Na:0xb06bff,Cl:0x5fd07a};
function atom(color, radius, pos){
  const m=new THREE.Mesh(Rsphere,new THREE.MeshStandardMaterial({color,roughness:.35,metalness:.1}));
  m.scale.setScalar(radius); if(pos)m.position.copy(pos); return m;
}
function bond(a,b,color=0xbfc8dc,rad=0.13){
  const dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
  const g=new THREE.CylinderGeometry(rad,rad,len,16);
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:.5}));
  m.position.copy(a).add(dir.clone().multiplyScalar(.5));
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  return m;
}
// visible dashed hydrogen bond, built from short cylinder segments
const _hbGeo=new THREE.CylinderGeometry(0.07,0.07,1,8);
const _hbMat=new THREE.MeshStandardMaterial({color:0x6fe3c4,emissive:0x2fae90,emissiveIntensity:.6,roughness:.4});
// ion–water (ion–dipole) bonds get their own colour so they read as a distinct
// interaction from the teal hydrogen bonds
const _ionMat=new THREE.MeshStandardMaterial({color:0xffb454,emissive:0xa65e12,emissiveIntensity:.7,roughness:.4});
const _up=new THREE.Vector3(0,1,0);
function dashTube(a,b,mat=_hbMat){
  const g=new THREE.Group();
  const dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
  const n=Math.max(5,Math.round(len/0.26)), q=new THREE.Quaternion().setFromUnitVectors(_up,dir.clone().normalize());
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(_hbGeo,mat);
    m.position.copy(a).add(dir.clone().multiplyScalar((i+0.5)/n));
    m.quaternion.copy(q); m.scale.set(1,len/n*0.6,1); g.add(m);
  }
  return g;
}
const hbondTube=(a,b)=>dashTube(a,b,_hbMat);
function label(txt,color='#e9eef8',size=64){
  const c=document.createElement('canvas'); const x=c.getContext('2d');
  x.font=`bold ${size}px sans-serif`;
  const w=Math.max(128,Math.ceil(x.measureText(txt).width)+24); c.width=w; c.height=128;
  x.font=`bold ${size}px sans-serif`; x.fillStyle=color;
  x.textAlign='center'; x.textBaseline='middle'; x.fillText(txt,w/2,68);
  const t=new THREE.CanvasTexture(c);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  s.scale.set(1.1*w/128,1.1,1); return s;
}
function arrow(from,to,color=0x6fe3c4){
  const dir=new THREE.Vector3().subVectors(to,from);
  return new THREE.ArrowHelper(dir.clone().normalize(),from,dir.length(),color,0.35,0.22);
}
const eGeo=new THREE.SphereGeometry(0.17,16,12);
function electron(pos,color=0xffe14d){
  const m=new THREE.Mesh(eGeo,new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.6,roughness:.3}));
  m.position.copy(pos); return m;
}
function ePair(center,along,color){
  const g=new THREE.Group();
  const perp=new THREE.Vector3(0,0,1).cross(along).normalize();
  if(perp.lengthSq()<0.01) perp.set(1,0,0);
  g.add(electron(center.clone().add(perp.clone().multiplyScalar(0.22)),color),
        electron(center.clone().add(perp.clone().multiplyScalar(-0.22)),color));
  return g;
}

// Water molecule: O at local origin, two H's at 104.5°.
const ANG=104.5*Math.PI/180, HL=1.55, half=ANG/2;
const H1L=new THREE.Vector3(Math.sin(half)*HL,-Math.cos(half)*HL,0);
const H2L=new THREE.Vector3(-Math.sin(half)*HL,-Math.cos(half)*HL,0);
function water(){
  const g=new THREE.Group();
  const O=atom(state.O,0.95,new THREE.Vector3(0,0,0));
  const Ha=atom(state.H,0.55,H1L), Hb=atom(state.H,0.55,H2L);
  g.add(bond(new THREE.Vector3(0,0,0),H1L),bond(new THREE.Vector3(0,0,0),H2L));
  g.add(O,Ha,Hb);
  g.userData={O,Ha,Hb, oWorld:()=>O.getWorldPosition(new THREE.Vector3()),
    hWorld:i=>(i?Hb:Ha).getWorldPosition(new THREE.Vector3())};
  return g;
}

/* ============================================================= *
 *  WaterSim — reusable molecule simulation engine
 * ============================================================= */
function createWaterSim(cfg={}){
  const o=Object.assign({
    centroidPull:0.001, jitter:0.01, MIN:3.3, stericK:0.03,
    EQ:3.9, kHB:0.007, hbThreshold:2.5, hbForce:true, spin:0, collisionMin:0
  },cfg);
  const mols=[]; let lines=[]; const forces=[];
  const V=(x,y,z)=>new THREE.Vector3(x,y,z);
  function spawn(pos,rot){
    const w=water();
    w.position.copy(pos||V((Math.random()-.5)*5,(Math.random()-.5)*5,(Math.random()-.5)*3));
    if(rot)w.rotation.copy(rot); else w.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);
    w.userData.vel=V(0,0,0); root.add(w); mols.push(w); return w;
  }
  function remove(){ if(mols.length){ const w=mols.pop(); root.remove(w); return w; } }
  function clearLines(){ lines.forEach(l=>root.remove(l)); lines=[]; }
  function step({hook, showHbonds=true, hbScale=1}={}){
    const c=V(0,0,0); mols.forEach(m=>c.add(m.position)); if(mols.length)c.multiplyScalar(1/mols.length);
    forces.length=mols.length;
    for(let i=0;i<mols.length;i++) forces[i]=(forces[i]||V()).set(0,0,0);
    mols.forEach((w,i)=>{
      forces[i].add(V().subVectors(c,w.position).multiplyScalar(o.centroidPull));
      forces[i].add(V((Math.random()-.5)*o.jitter,(Math.random()-.5)*o.jitter,(Math.random()-.5)*o.jitter));
      if(hook) hook(w,i,forces[i]);
    });
    for(let i=0;i<mols.length;i++)for(let j=i+1;j<mols.length;j++){
      const d=V().subVectors(mols[i].position,mols[j].position), dist=Math.max(0.4,d.length());
      if(dist<o.MIN){ const push=d.normalize().multiplyScalar((o.MIN-dist)*o.stericK);
        forces[i].add(push); forces[j].sub(push); }
    }
    mols.forEach((w,i)=>{ w.userData.vel.add(forces[i]).multiplyScalar(0.9);
      w.position.add(w.userData.vel); w.rotation.y+=o.spin; });
    if(o.collisionMin>0){ const m=o.collisionMin;
      for(let it=0;it<3;it++)for(let i=0;i<mols.length;i++)for(let j=i+1;j<mols.length;j++){
        const d=V().subVectors(mols[i].position,mols[j].position), dist=d.length();
        if(dist<m&&dist>1e-4){ d.multiplyScalar((m-dist)/dist*0.5);
          mols[i].position.add(d); mols[j].position.sub(d); } } }
    clearLines(); let n=0;
    for(const donor of mols){ const oD=donor.userData.oWorld();
      for(let hi=0;hi<2;hi++){ const h=donor.userData.hWorld(hi);
        let best=null,bestMol=null,bestD=o.hbThreshold,bestLin=0;
        for(const acc of mols){ if(acc===donor)continue;
          const oA=acc.userData.oWorld(), dd=h.distanceTo(oA);
          if(dd<bestD){ const oh=V().subVectors(h,oD).normalize(), ha=V().subVectors(oA,h).normalize();
            const lin=oh.dot(ha); if(lin>0.5){ best=oA;bestMol=acc;bestD=dd;bestLin=lin; } }
        }
        if(best){ n++;
          if(showHbonds){ const l=hbondTube(h,best); lines.push(l); root.add(l); }
          if(o.hbForce&&hbScale>0){ const ax=V().subVectors(bestMol.position,donor.position);
            const dist=ax.length()||1; ax.multiplyScalar((dist-o.EQ)*o.kHB*bestLin*hbScale/dist);
            donor.userData.vel.add(ax); bestMol.userData.vel.sub(ax); }
        }
      }
    }
    return {hbondCount:n, centroid:c};
  }
  return {mols, cfg:o, spawn, remove, clearLines, step};
}

/* ============================================================= *
 *  Persistent simulation + global state
 * ============================================================= */
const sim = createWaterSim({ centroidPull:0.0024, jitter:0.006, MIN:3.0, stericK:0.045,
  EQ:3.6, kHB:0.008, hbThreshold:2.7, hbForce:true, spin:0, collisionMin:1.9 });
const first = sim.spawn(new THREE.Vector3(0,0,0));

const S = { step:0, temperature:22, tempEnabled:false, freezeEnabled:false,
  saltEnabled:false, hbondsOn:true, targetR:9 };

/* ---- live-tunable knobs (step-5 solvent scene); exposed via the 🐛 Debug panel ---- */
const DBG = {
  naRad:0.70,        // Na⁺ display radius (real Na⁺/O ≈ 0.73)
  clRad:1.24,        // Cl⁻ display radius (real Cl⁻/O ≈ 1.29, Cl⁻/Na⁺ ≈ 1.77)
  naShellDist:2.7,   // Na⁺ → water-O resting distance (tight shell)
  clShellDist:3.6,   // Cl⁻ → water-O resting distance (looser shell)
  centroidPull:0.0011, // how strongly the whole cluster collapses inward
  // ion–dipole "bond" stiffness. Real ion–water attraction ≈ several× a
  // hydrogen bond, and Na⁺ (small, dense) grips ~1.5× harder than Cl⁻:
  //   Na⁺–water ≈ 4.5× H-bond, Cl⁻–water ≈ 3× H-bond (kHB below).
  naShellK:0.036,    // Na⁺ shell spring (≈ 4.5 × kHB)
  clShellK:0.024,    // Cl⁻ shell spring (≈ 3 × kHB)
  orientSlerp:0.08,  // how fast shell waters snap to ion-dipole orientation
  screen:0.05,       // residual ion–ion pull after dissociation (water dielectric ≈ ×1/80)
  kHB:0.008,         // hydrogen-bond force strength (shell↔bulk connectivity)
  jitter:0.006,      // thermal jiggle
  stericMIN:3.0,     // water–water minimum spacing
  zoom:26 };         // camera pull-back on this step

/* ---- step-1 molecular-detail decorations (on the first molecule) ---- */
const detail=new THREE.Group(); first.add(detail);
const cloud=atom(0x4ea1ff,1.9,new THREE.Vector3(0,0.2,0));
cloud.material=new THREE.MeshBasicMaterial({color:0x4ea1ff,transparent:true,opacity:0.12}); detail.add(cloud);
const dip=arrow(new THREE.Vector3(0,-1.4,0),new THREE.Vector3(0,1.5,0),0xffd166); detail.add(dip);
const dO=label('δ−','#4ea1ff'); dO.position.set(0,1.35,0);
const dH1=label('δ+','#ff6b6b'); dH1.position.copy(H1L).multiplyScalar(1.35);
const dH2=label('δ+','#ff6b6b'); dH2.position.copy(H2L).multiplyScalar(1.35);
detail.add(dO,dH1,dH2);
const eGroup=new THREE.Group(); detail.add(eGroup);
[H1L,H2L].forEach(H=>{ const mid=new THREE.Vector3().lerp(H,0.42); eGroup.add(ePair(mid,H.clone().normalize(),0xffe14d)); });
const lp1=new THREE.Vector3(0,0.55,0.83).normalize(), lp2=new THREE.Vector3(0,0.55,-0.83).normalize();
[lp1,lp2].forEach(d=>eGroup.add(ePair(d.clone().multiplyScalar(1.35),d,0x6fe3c4)));
const eLbl=label('lone pairs','#6fe3c4',30); eLbl.position.set(0,2.1,0); eGroup.add(eLbl);
const dset={electrons:false,charge:true,dipole:false,cloud:false};
function applyDetail(){
  detail.visible=(S.step===0);
  eGroup.visible=dset.electrons; dO.visible=dH1.visible=dH2.visible=dset.charge;
  dip.visible=dset.dipole; cloud.visible=dset.cloud;
}

/* ---- ice Iₕ lattice (built to fit the current molecule count) ---- */
function frameQuat(u,v){
  const x=u.clone().normalize();
  const z=new THREE.Vector3().crossVectors(u,v); if(z.lengthSq()<1e-6)z.set(0,0,1); z.normalize();
  const y=new THREE.Vector3().crossVectors(z,x).normalize();
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z));
}
const qLocalInv=frameQuat(H1L.clone().add(H2L), H1L.clone()).invert();
function buildIceSites(n){
  const b=4.0,dxy=0.9428*b,alat=Math.sqrt(3)*dxy, R=4;
  const A1x=alat,A1z=0,A2x=alat/2,A2z=1.5*dxy, P=[];
  for(let k=0;k<5;k++){ const base=k*(4*b/3), upA=(k%2===0);
    for(let nn=-R;nn<=R;nn++)for(let mm=-R;mm<=R;mm++){
      const ax=A1x*nn+A2x*mm, az=A1z*nn+A2z*mm, bx=ax, bz=az+dxy;
      const up=upA?[ax,az]:[bx,bz], lo=upA?[bx,bz]:[ax,az];
      P.push(new THREE.Vector3(up[0],base+b/6,up[1]));
      P.push(new THREE.Vector3(lo[0],base-b/6,lo[1]));
    }
  }
  const ctr=new THREE.Vector3(); P.forEach(p=>ctr.add(p)); ctr.multiplyScalar(1/P.length); P.forEach(p=>p.sub(ctr));
  P.sort((a,b)=>a.lengthSq()-b.lengthSq());
  const sites=P.slice(0,n);
  const c2=new THREE.Vector3(); sites.forEach(p=>c2.add(p)); c2.multiplyScalar(1/sites.length); sites.forEach(p=>p.sub(c2));
  const donorDirs=sites.map(()=>[]), neighDirs=sites.map(()=>[]), dc=sites.map(()=>0);
  for(let i=0;i<sites.length;i++)for(let j=i+1;j<sites.length;j++){
    if(sites[i].distanceTo(sites[j])<b*1.15){
      const di=dc[i]<=dc[j]?i:j, aj=di===i?j:i; dc[di]++;
      donorDirs[di].push(sites[aj].clone().sub(sites[di]).normalize());
      neighDirs[i].push(sites[j].clone().sub(sites[i]).normalize());
      neighDirs[j].push(sites[i].clone().sub(sites[j]).normalize());
    }
  }
  const quats=sites.map((_,i)=>{ const dd=donorDirs[i].slice();
    for(const nd of neighDirs[i]){ if(dd.length>=2)break; if(!dd.some(x=>x.distanceTo(nd)<1e-3))dd.push(nd); }
    if(dd.length<2) return new THREE.Quaternion();
    return frameQuat(dd[0].clone().add(dd[1]), dd[0].clone()).multiply(qLocalInv);
  });
  return {sites,quats};
}
let iceFor=-1;
function assignIce(){
  const n=sim.mols.length; const {sites,quats}=buildIceSites(n);
  const free=sites.map((_,i)=>i);
  sim.mols.forEach(w=>{
    let bi=free[0],bk=0,bd=1e9;
    free.forEach((si,k)=>{ const d=w.position.distanceToSquared(sites[si]); if(d<bd){bd=d;bi=si;bk=k;} });
    free.splice(bk,1);
    w.userData.iceSite=sites[bi]; w.userData.iceQuat=quats[bi];
  });
  iceFor=n;
}

/* ---- salt (step 5): Na⁺ / Cl⁻ ions ----
   Each ion holds a first hydration shell of 6 water molecules in an
   octahedral arrangement (the textbook coordination number for both Na⁺
   and Cl⁻ in dilute solution). Waters are RECRUITED from those already in
   the scene — add water first, then add salt.
     • Na⁺ (cation): each water points its O (δ−) straight at the ion.
     • Cl⁻ (anion):  each water points ONE O–H bond (δ+) at the ion —
       a near-linear Cl⁻···H–O hydrogen bond, not the H–H bisector.        */
const salt=[]; const saltBonds=[];
const bisLocal=H1L.clone().add(H2L).normalize();   // molecule bisector (points toward the H's)
const h1Local=H1L.clone().normalize();             // one O–H direction, for anion orientation
const WSHELL=1.15;                                  // water-O half-thickness for contact/shell
const SHELL_N=6;                                    // octahedral coordination number, Na⁺ & Cl⁻
// six octahedral vertex directions for seating the shell
const OCTA=[new THREE.Vector3(1,0,0),new THREE.Vector3(-1,0,0),
            new THREE.Vector3(0,1,0),new THREE.Vector3(0,-1,0),
            new THREE.Vector3(0,0,1),new THREE.Vector3(0,0,-1)];
function addSalt(){
  const base=outerPoint(3);
  const na=atom(state.Na,DBG.naRad, base.clone().add(new THREE.Vector3(-0.9,0,0)));
  const cl=atom(state.Cl,DBG.clRad,base.clone().add(new THREE.Vector3(0.9,0,0)));
  na.userData={charge:+1, vel:new THREE.Vector3(), rad:DBG.naRad, shellCount:0};
  cl.userData={charge:-1, vel:new THREE.Vector3(), rad:DBG.clRad, shellCount:0};
  const naL=label('Na⁺','#c79bff',34); naL.position.set(0,1.4,0); na.add(naL);
  const clL=label('Cl⁻','#8fe6a0',34); clL.position.set(0,1.8,0); cl.add(clL);
  root.add(na,cl); salt.push(na,cl);
  // ionic bond, shown until water wedges the ions apart
  const stick=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,1,12),
    new THREE.MeshStandardMaterial({color:0xe0cf8a,emissive:0x4a3d12,roughness:.45}));
  root.add(stick); saltBonds.push({na,cl,stick});
  dissociated=false;   // fresh crystal starts as a contact ion pair
  assignShells();
}
// true once every ion is (nearly) fully hydrated: the Na⁺–Cl⁻ ionic bond is
// then permanently broken and water's high dielectric screens the ion–ion pull,
// so the free hydrated ions diffuse independently and don't re-pair.
let dissociated=false;
function clearSalt(){ salt.forEach(m=>root.remove(m)); salt.length=0;
  saltBonds.forEach(b=>root.remove(b.stick)); saltBonds.length=0; dissociated=false;
  sim.mols.forEach(w=>{ w.userData.shellIon=null; w.userData.shellSlot=-1; }); clearIonBonds(); }
function checkDissociation(){
  if(dissociated || salt.length===0) return;
  if(!salt.every(m=>m.userData.shellCount>=5)) return;   // wait for near-full shells
  dissociated=true;
  // one-time "pop apart" impulse outward from the salt centroid
  const c=new THREE.Vector3(); salt.forEach(m=>c.add(m.position)); c.multiplyScalar(1/salt.length);
  salt.forEach(m=>{ const d=new THREE.Vector3().subVectors(m.position,c);
    if(d.lengthSq()<1e-4) d.set(Math.random()-.5,Math.random()-.5,Math.random()-.5);
    m.userData.vel.add(d.normalize().multiplyScalar(0.25)); });
}
// ion–dipole bonds: each shell water → its ion, drawn to the atom that faces
// the ion (O for Na⁺, the inward H for Cl⁻) so the polarity reads correctly
let ionBondLines=[];
function clearIonBonds(){ ionBondLines.forEach(l=>root.remove(l)); ionBondLines=[]; }
function updateIonBonds(){
  clearIonBonds();
  sim.mols.forEach(w=>{
    const ion=w.userData.shellIon; if(!ion) return;
    let atomPos;
    if(ion.userData.charge>0){ atomPos=w.userData.oWorld(); }              // Na⁺ ↔ O
    else { const h0=w.userData.hWorld(0), h1=w.userData.hWorld(1);          // Cl⁻ ↔ nearer O–H
      atomPos=h0.distanceToSquared(ion.position)<h1.distanceToSquared(ion.position)?h0:h1; }
    const l=dashTube(atomPos, ion.position, _ionMat); ionBondLines.push(l); root.add(l);
  });
}
// Assign each ion its 6 nearest un-claimed waters as an octahedral shell.
function assignShells(){
  sim.mols.forEach(w=>{ w.userData.shellIon=null; w.userData.shellSlot=-1; });
  const taken=new Set();
  salt.forEach(ion=>{
    const cand=sim.mols.filter(w=>!taken.has(w))
      .sort((a,b)=>a.position.distanceToSquared(ion.position)-b.position.distanceToSquared(ion.position))
      .slice(0,SHELL_N);
    cand.forEach((w,k)=>{ taken.add(w); w.userData.shellIon=ion; w.userData.shellSlot=k; });
    ion.userData.shellCount=cand.length;
  });
}
function updateSaltBonds(){
  const up=new THREE.Vector3(0,1,0);
  saltBonds.forEach(b=>{
    const dist=b.na.position.distanceTo(b.cl.position);
    const bonded = !dissociated && dist < b.na.userData.rad+b.cl.userData.rad+0.9;   // still a contact ion pair
    b.stick.visible=bonded;
    if(bonded){
      const dir=new THREE.Vector3().subVectors(b.cl.position,b.na.position);
      b.stick.position.copy(b.na.position).add(dir.clone().multiplyScalar(.5));
      b.stick.quaternion.setFromUnitVectors(up,dir.clone().normalize());
      b.stick.scale.set(1,dist,1);
    }
  });
}
function ionForceOnWater(w,f){
  for(const ion of salt){
    const d=new THREE.Vector3().subVectors(w.position,ion.position), dist=d.length()||1;
    if(dist<8){
      const shell=ion.userData.rad+WSHELL;                 // resting hydration distance (contact)
      const k = dist<shell ? 0.16 : 0.018;                 // hard repulsion inside, soft pull outside
      f.addScaledVector(d.multiplyScalar(1/dist), -(dist-shell)*k);  // spring toward the shell
    }
  }
}
function orientShells(){
  sim.mols.forEach(w=>{
    const ion=w.userData.shellIon; if(!ion) return;
    const toIon=new THREE.Vector3().subVectors(ion.position,w.position).normalize();
    let q;
    if(ion.userData.charge>0){
      // cation: O (δ−) toward ion → bisector (toward H's) points away
      q=new THREE.Quaternion().setFromUnitVectors(bisLocal, toIon.clone().multiplyScalar(-1));
    } else {
      // anion: one O–H bond (δ+) points straight at the ion (linear Cl⁻···H–O)
      q=new THREE.Quaternion().setFromUnitVectors(h1Local, toIon);
    }
    w.quaternion.slerp(q,DBG.orientSlerp);
  });
}
function updateIons(){
  salt.forEach(a=>{
    const f=new THREE.Vector3().copy(a.position).multiplyScalar(-0.004);   // gentle containment
    salt.forEach(b=>{ if(a===b)return;
      const dir=new THREE.Vector3().subVectors(b.position,a.position), dist=Math.max(1,dir.length()); dir.normalize();
      const sc = dissociated ? DBG.screen : 1;   // water's dielectric screens ion–ion pull once dissolved
      f.addScaledVector(dir, -a.userData.charge*b.userData.charge*0.012*sc/dist);  // unlike attract / like repel
      if(dist<a.userData.rad+b.userData.rad+0.4) f.addScaledVector(dir,-0.05);  // ion–ion steric
      if(dissociated){   // freed ions carry hydration shells that can't interpenetrate → they stay apart
        const ra=a.userData.charge>0?DBG.naShellDist:DBG.clShellDist;
        const rb=b.userData.charge>0?DBG.naShellDist:DBG.clShellDist;
        const reach=ra+rb; if(dist<reach) f.addScaledVector(dir,-(reach-dist)*0.03);
      }
    });
    // water pushes back on the ion — no passing through molecules; also wedges pairs apart
    sim.mols.forEach(w=>{
      const dir=new THREE.Vector3().subVectors(a.position,w.position), dist=dir.length()||1;
      const shell=a.userData.rad+WSHELL;
      if(dist<shell) f.addScaledVector(dir.multiplyScalar(1/dist),(shell-dist)*0.09);
    });
    a.userData.vel.add(f).multiplyScalar(0.9); a.position.add(a.userData.vel);
  });
}

/* ============================================================= *
 *  Temperature model (one continuum: cold → ice, hot → vapour)
 * ============================================================= */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function tempParams(){
  const T=S.tempEnabled ? S.temperature : 22;
  const fz=S.freezeEnabled ? clamp((8-T)/8,0,1) : 0;      // 0 at 8°C → 1 at 0°C
  const warm=clamp((T-20)/80,0,1);
  const kinetic=warm*0.03;               // extra thermal motion, 0 at the cool end
  const evapProb=T>82 ? 0.0009*(T-82) : 0;
  const hbScale=clamp(1-(T-40)/60,0.15,1)*(1-0.7*fz);
  return {T,fz,warm,kinetic,evapProb,hbScale};
}

// a point just outside the settled cluster, so new molecules drift in rather than
// popping into the middle. Radius is estimated from the COUNT (stable) rather than
// the outermost molecule (which balloons while things are still flying inward).
function outerPoint(margin=1.6){
  const n=sim.mols.length+salt.length*0.5;
  const rad=1.6*Math.cbrt(Math.max(1,n))+margin;
  const d=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5);
  if(d.lengthSq()<1e-4)d.set(1,0,0);
  return d.normalize().multiplyScalar(rad);
}

  if(n===4) S.temperature=30;    // solvent step: liquid water, never frozen
  if(S.tempEnabled) setTempRange(S.freezeEnabled?0:20,100);

  }
  if(salt.length){
    const na=salt.find(m=>m.userData.charge>0), cl=salt.find(m=>m.userData.charge<0);
    const saltState = dissociated
      ? '<b style="color:#8fe6a0">fully dissociated</b> — free hydrated ions'
      : '<b style="color:#e0cf8a">contact ion pair</b> — dissolving';
    s+=`<br>🧂 ${salt.length/2} NaCl · <b style="color:#c79bff">Na⁺ ${na.userData.shellCount}/6</b> (O-inward) · `
      +`<b style="color:#8fe6a0">Cl⁻ ${cl.userData.shellCount}/6</b> (H-inward)`
      +`<br>${saltState}`
      +`<br><span style="color:#ffb454">▬ ion–water bonds</span> · <span style="color:#6fe3c4">▬ hydrogen bonds</span>`;
  }
  setReadout(s);
}
function loop(){
  const solvent=(S.step===4);
  // step-5 solvent scene runs looser & more spread out so the shells are legible
  sim.cfg.centroidPull = solvent?DBG.centroidPull:0.0024;
  sim.cfg.kHB          = solvent?DBG.kHB:0.008;
  sim.cfg.MIN          = solvent?DBG.stericMIN:3.0;
  if(solvent) S.targetR = Math.max(S.targetR, DBG.zoom);
  const want=Math.max(solvent?DBG.zoom:S.targetR, fitDistance()); // live auto-fit
  cam.r += (want - cam.r)*0.05; applyCam();
  const p=tempParams();
  sim.cfg.jitter = (S.step===0)?0:(solvent?DBG.jitter:0.006)*(1-p.fz*0.92);   // freezing quiets thermal motion → crisp lattice
  if(S.freezeEnabled && p.fz>0.02){ if(iceFor!==sim.mols.length) assignIce(); } else iceFor=-1;
  let escaping=0;
  const r=sim.step({ showHbonds:S.hbondsOn && S.step>=1, hbScale:p.hbScale, hook:(w,i,f)=>{
    if(S.tempEnabled && p.kinetic>0) f.add(new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).multiplyScalar(p.kinetic));
    if(p.fz>0 && w.userData.iceSite) f.add(new THREE.Vector3().subVectors(w.userData.iceSite,w.position).multiplyScalar(0.035*p.fz));
    if(w.userData.escaped){ if(p.evapProb<=0){ w.userData.escaped=false; } else { f.set(0,0.02,0); escaping++; } }
    else if(p.evapProb>0 && Math.random()<p.evapProb) w.userData.escaped=true;
    if(salt.length){
      const ion=w.userData.shellIon;
      if(ion){ // spring toward this water's octahedral seat in the ion's shell
        const cat=ion.userData.charge>0;
        const sd=cat?DBG.naShellDist:DBG.clShellDist, sk=cat?DBG.naShellK:DBG.clShellK;
        const site=ion.position.clone().addScaledVector(OCTA[w.userData.shellSlot], sd);
        f.add(new THREE.Vector3().subVectors(site,w.position).multiplyScalar(sk));
      } else ionForceOnWater(w,f);
    }
  }});
  if(p.fz>0.02) sim.mols.forEach(w=>{ if(w.userData.iceQuat) w.quaternion.slerp(w.userData.iceQuat,0.08*p.fz); });
  else if(salt.length) orientShells();
  sim.mols.forEach(w=>{ if(w.userData.escaped && w.position.y>9){
    w.position.set((Math.random()-.5)*4,-5,(Math.random()-.5)*4); w.userData.vel.set(0,0,0); w.userData.escaped=false; } });
  if(salt.length){ checkDissociation(); updateIons(); updateSaltBonds(); updateIonBonds(); } else clearIonBonds();
  renderReadout(p,r,escaping);
  renderer.render(scene,camera); requestAnimationFrame(loop);
}

applyCam(); resize(); applyStep(0); requestAnimationFrame(loop);

document.getElementById('savepng').onclick=()=>{
  renderer.render(scene,camera);
  const name=(stepMeta[cur]?.title||'water-scene').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  const a=document.createElement('a'); a.download=`${name}.png`; a.href=canvas.toDataURL('image/png'); a.click();
};
</script>
