<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA — how a base pair holds</title>

<!-- ===================================================================
     STEP 1 of the DNA lesson: the base pair, and why the rule is a rule.

     A BARE STAGE, FOUR BASES, NO PANEL. The student pushes them around
     and finds out which ones stick. Every arrangement is allowed —
     nothing refuses a drag, nothing greys a base out — so the pairing
     rule has to be discovered rather than announced.

     THE CONFLICT THIS FIXES. Textbooks draw base pairing as jigsaw
     tabs, which explains nothing and is not what holds them. What holds
     them is hydrogen bonds, the same bond the water lesson spent a page
     on, drawn here in the same deep blue on purpose.

     NOTHING HERE HARD-CODES A PAIRING. Each pose is solved by
     dna/pairing.js from the bases' own declared donors and acceptors, and
     the bonds are then FOUND by kit/hbond.js — the generic finder. Any
     two bases can be brought together; only two arrangements satisfy
     every site on both edges at once, and those are the pairs.
     =================================================================== -->

<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/sandbox.css">
<style>
  /* No side panel: the stage is the whole page. */
  #app{grid-template-columns:1fr}
  #stage{grid-column:1}

  /* Step nav — a rail down the left, out of the way of the molecules. */
  #steps{position:absolute;left:20px;top:50%;transform:translateY(-50%);z-index:7;
    display:flex;flex-direction:column;gap:9px}
  #steps button{display:flex;align-items:center;gap:10px;cursor:pointer;
    font-family:var(--font-sans);font-size:12.5px;font-weight:600;text-align:left;
    padding:8px 13px 8px 9px;border-radius:10px;width:172px;
    border:2px solid transparent;background:transparent;color:var(--muted)}
  #steps button .n{display:grid;place-items:center;width:21px;height:21px;flex:none;
    border-radius:50%;border:1.5px solid currentColor;
    font-family:var(--font-slab);font-size:11px}
  #steps button:hover:not(:disabled){color:var(--ink);background:rgba(0,0,0,.04)}
  #steps button[aria-current="true"]{color:var(--ink);border-color:var(--ink);
    background:rgba(255,255,255,.62)}
  #steps button:disabled{opacity:.38;cursor:default}

  /* The twist control, shown only on the step that has one. */
  #twistbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:7;
    display:none;align-items:center;gap:12px;
    background:rgba(255,255,255,.82);border:2px solid var(--ink);border-radius:10px;
    padding:9px 17px;font-family:var(--font-sans);font-size:12.5px;color:var(--muted)}
  #twistbar.on{display:flex}
  #twistbar input{width:min(340px,34vw);accent-color:var(--ink)}
  #twistbar label{flex:none}

  /* THE READOUT IS NOT IN THE BAR. Its text changes length on every frame of a
     drag — '34° per rung' against '19° per rung, winding up the strand ·
     backbone stretched 11.2×' — and inside a flex row that re-lays the row out
     under the cursor, so the slider shifts while it is being dragged. Out here
     it is centred over the bar and can say anything it likes. */
  #twistread{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);
    z-index:7;display:none;white-space:nowrap;
    font-family:var(--font-slab);font-size:12.5px;color:var(--ink);
    background:var(--paper);padding:3px 12px;border-radius:7px}
  #twistread.on{display:block}

  /* A base's name, pinned to the molecule it belongs to every frame. */
  .tag{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,0);
    font-family:var(--font-slab);font-size:13px;letter-spacing:.4px;color:var(--ink);
    background:rgba(255,255,255,.66);border-radius:7px;padding:2px 9px;white-space:nowrap}
  .tag.paired{background:#0042aa;color:#fff}
  /* An END of a strand, on the atom that makes it one. */
  .tag.end{font-size:12px;background:#0042aa;color:#fff;transform:translate(-50%,-50%)}

  /* The rung measurement. Reads as a drawing annotation, not a label on a
     molecule — hence the slab face and the paper-coloured backing. */
  .ruler{position:absolute;z-index:5;pointer-events:none;
    transform:translate(-50%,-50%);
    font-family:var(--font-slab);font-size:13px;letter-spacing:.3px;
    color:var(--ink);background:var(--paper);padding:1px 7px;border-radius:5px}

  /* Names the water a condensation releases. Pinned above the molecule and
     fading with it, so the name and the thing it names go together. */
  .leaving{position:absolute;z-index:6;pointer-events:none;
    transform:translate(-50%,-100%);
    font-family:var(--font-slab);font-size:13px;color:var(--ink);
    background:rgba(255,255,255,.72);border-radius:7px;padding:1px 7px;
    white-space:nowrap}

  /* Step 2's running commentary. Same slot as the twist readout — one step is
     ever on stage, so they cannot collide — but it wraps, because it says a
     sentence rather than a number. */
  #note{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);
    z-index:7;display:none;max-width:min(560px,72vw);text-align:center;
    font-family:var(--font-sans);font-size:13.5px;line-height:1.4;color:var(--ink);
    background:var(--paper);padding:7px 16px;border-radius:9px}
  #note.on{display:block}
  #note b{font-weight:600}

</style>

<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <nav id="steps"></nav>
    <div id="twistbar">
      <label>Ladder</label>
      <input id="twist" type="range" min="0" max="1000" value="1000">
      <label>Helix</label>
    </div>
    <div id="twistread"></div>
    <div id="note"></div>
    <div id="brand"><span class="drop"><i class="ph-bold ph-dna"></i></span><h1>Base pairing</h1></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="lib/palette.js"></script>
<script src="lib/tokens-from-palette.js"></script>
<script src="lib/molecules.js"></script>
<script src="lib/skel.js"></script>
<script src="lib/mol-nucleic.js"></script>
<script src="lib/mol-sugars.js"></script>
<!-- mol-small.js is loaded for ONE molecule, water, and the five it brings
     with it are never drawn. The alternative is worse: the only other water in
     the library is mol-solvation.js's, which is family A — a tuned parameter of
     a physics engine rather than a picture of a molecule — and this page draws
     everything else at real ångströms. -->
<script src="lib/mol-small.js"></script>
<script src="lib/scene.js"></script>
<script src="lib/fx.js"></script>
<script src="kit/motion.js"></script>
<script src="kit/molgraph.js"></script>
<script src="lobes/lobes.js"></script>
<script src="kit/hbond.js"></script>
<script src="kit/stagekit.js"></script>
<script src="dna/pairing.js"></script>
<script src="dna/attach.js"></script>
<script src="dna/data/bdna.js"></script>
<script>
"use strict";

const S = MolLib.SCALE;
const M = MolLib.MOLECULES;
const KEYS = ['adenine','thymine','guanine','cytosine'];

// dna/pairing.js works in the record's own ångströms; registered specs are in
// display units. Unscale going in — the module answers in whatever units it
// was given (the molgraph/hbond contract).
const un = s => ({ ...s, atoms:s.atoms.map(a=>({el:a.el,pos:a.pos.map(v=>v/S)})) });

/* DROP `view:` WHEN BUILDING. buildMolecule bakes a spec's view rotation into
 * the atom meshes even at center:false, and VIEW.flatRing tilts a flat ring
 * ~96° out of its own plane — which renders the pair edge-on AND desyncs the
 * mesh from the coordinates dna/pairing.js solved against. This page IS the
 * flat view, so the molecular plane stays the plane. */
const flat = s => ({ ...s, view:null });

// Which step is on stage. Declared up here because the camera's `boxes` and
// `afterFrame` callbacks read it, and those are handed to Lesson.create long
// before the nav below is built.
let step = 1;

const L = Lesson.create(document.getElementById('gl'), {
  cam:{ theta:0, phi:1.5708, r:34 }, rMax:400,
  // NO ORBIT — the drag moves a molecule, and the pointer is projected onto
  // the z=0 plane the bases live in, which only means anything face-on.
  orbit:false,
  boxes:()=>step === 4 ? [{ x:0, y:0, rxz:16, hy:44 }]
         : step === 2 ? [{ x:0, y:-3, rxz:30, hy:27 }]
         // Step 3 reframes once the bond is made: before it, the stage has to
         // hold the loose nucleotide waiting below as well as the one it joins.
         // Step 3 reframes once the rungs are joined: before that the stage
         // also has to hold the lower rung waiting below.
         : step === 3 ? (rung3s[1].joined ? [{ x:0, y:0,   rxz:34, hy:20 }]
                                        : [{ x:0, y:-10, rxz:23, hy:23 }])
                       : [{ x:0, y:0, rxz:26, hy:17 }],
  afterFrame:()=>{                                    // projection reads a matrix refreshed on render
    if(step === 1){ placeTags(); placeRulers(); }
    if(step === 2){ placeTags2(); stepWaters(); }
    if(step === 3){ placeTags3(); stepWaters3(); }
  },
});

// Two bond layers, because opacity is a property of the MATERIAL and the page
// needs to draw two kinds at once: a satisfied pair solid, an incidental
// contact faint. One instance each is cheaper and clearer than per-bond
// materials.
const G1 = new THREE.Group();          // everything belonging to step 1
L.root.add(G1);

const HBpair = HBond.create(THREE, { color:MolLib.PALETTE.bonds.hbond });
const HBnear = HBond.create(THREE, { color:MolLib.PALETTE.bonds.hbond });
HBnear.material.opacity = 0.28;
G1.add(HBpair.group); G1.add(HBnear.group);

/* ---- the four bases ------------------------------------------------------ */
// Row centres. Each pair is laid out along its own row, already turned the
// right way round — see setStartPose() below for why the angles are solved
// rather than typed.
const ROW = { adenine:[8,9,0], guanine:[8,-9,0] };   // the purines, on the right
const GAP = 21;                                       // centre-to-centre at rest

const bases = KEYS.map(key => {
  const spec = M[key];
  const mol = Stage.buildMolecule(flat(spec), { center:false });
  const h = spec.atoms.filter(a=>a.el!=='H');
  // The heavy-atom centroid in the mesh's own frame: a spec's origin is
  // wherever the source record put atom 0, which is not the middle of
  // anything. Labels and grab-tests both want the middle.
  const centre = h.reduce((v,a)=>v.add(new THREE.Vector3(...a.pos)), new THREE.Vector3())
                  .multiplyScalar(1/h.length);
  // How far the molecule reaches from that centre, so its tag can clear it
  // rather than sitting on top of the atoms.
  const reach = spec.atoms.reduce((r,a)=>
    Math.max(r, new THREE.Vector3(...a.pos).distanceTo(centre)), 0) + 1.1;
  G1.add(mol);

  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = spec.name;
  document.getElementById('stage').appendChild(tag);

  return { key, spec, mol, centre, reach, tag, partner:null, wcKeys:null };
});
const byMol = m => bases.find(b => b.mol === m);
const centreOf = b => b.centre.clone().applyQuaternion(b.mol.quaternion).add(b.mol.position);

/* ---- starting poses: already turned the right way round -------------------
 * THIS IS NOT A SHAPE PUZZLE. Making the student hunt for the angle turns a
 * chemistry lesson into a jigsaw — the very thing the textbook figure gets
 * wrong — so both pairs start correctly oriented and the interaction is a
 * straight slide. What remains to discover is WHICH bases stick, which is the
 * actual rule.
 *
 * The angles are still solved, not typed. For each pair, dna/pairing.js gives
 * the partner's pose relative to the purine; from that comes the axis, and
 * everything is turned so that axis is horizontal with the pyrimidine on the
 * left and the purine on the right — the orientation every textbook draws.
 *
 * THE AXIS IS N9→N1, NOT CENTROID TO CENTROID. Both put the pair on its side,
 * but only the glycosidic one is a fact about the chemistry: those are the two
 * atoms the sugars attach to, so levelling them is what makes the backbone
 * run straight and what lets the ruler be horizontal while still measuring
 * the real distance. The centroid axis sits 5.3° off it — enough to leave the
 * rung measurement visibly askew, and off in a direction that means nothing. */
function setStartPose(purineKey, pyrimidineKey){
  const t = pairPoseAt(purineKey, pyrimidineKey,
                       new THREE.Vector3(...ROW[purineKey]), GAP);
  if(!t) return;
  const put = (b, pose) => { b.mol.quaternion.copy(pose.quat);
                             b.mol.position.copy(pose.pos); };
  put(bases.find(b => b.key === purineKey), t.a);
  put(bases.find(b => b.key === pyrimidineKey), t.p);
}

/* The pose of a pair, levelled and laid out from `home`. Step 2 builds its own
 * meshes and wants the same arrangement, so this answers in poses and places
 * nothing — the two steps cannot drift into drawing the rung differently. */
function pairPoseAt(purineKey, pyrimidineKey, home, gap){
  const a = { key:purineKey,     spec:M[purineKey] };
  const p = { key:pyrimidineKey, spec:M[pyrimidineKey] };
  const t = latchWorldFrom(a, p, new THREE.Quaternion(), new THREE.Vector3());
  if(!t) return null;

  // The glycosidic nitrogens in that solved pose, and the axis between them.
  const gi = k => k.spec.names.indexOf(RULER_N[k.key]);
  const ga = new THREE.Vector3(...a.spec.atoms[gi(a)].pos);
  const gp = new THREE.Vector3(...p.spec.atoms[gi(p)].pos)
    .applyQuaternion(t.quat).add(t.pos);
  const axis = gp.clone().sub(ga);
  // Turn the whole pair so the pyrimidine ends up due LEFT of the purine.
  const R = new THREE.Quaternion().setFromAxisAngle(
    new THREE.Vector3(0,0,1), Math.PI - Math.atan2(axis.y, axis.x));

  // A pose is a transform, and it is built from a CENTRE: a spec's origin is
  // wherever its source record left atom 0, which is not the middle of
  // anything, so placing origins would scatter the two bases.
  const centred = (spec, at, quat) => ({ pos:at.clone().sub(
      centroidOf(spec).applyQuaternion(quat)), quat });
  return { a:centred(a.spec, home, R),
           p:centred(p.spec, home.clone().add(new THREE.Vector3(-gap,0,0)),
                     R.clone().multiply(t.quat)) };
}

// Heavy-atom centroid in a spec's own frame.
function centroidOf(spec){
  const h = spec.atoms.filter(a => a.el !== 'H');
  return h.reduce((v,a)=>v.add(new THREE.Vector3(...a.pos)), new THREE.Vector3())
          .multiplyScalar(1/h.length);
}

/* ---- poses, solved once per ordered pair --------------------------------- */
// Lazily, and cached: six pairs, and only the ones actually tried get solved.
const poses = {};
function pose(a, b){
  const k = a.key + '>' + b.key;
  if(!(k in poses)){
    const r = Pairing.pairing(un(a.spec), un(b.spec));
    poses[k] = r.ok ? r : null;
  }
  return poses[k];
}

/* Where `b` must sit to pair with `a`, given where `a` actually is. The solve
 * is relative to `a` at the origin, so it composes with a's live transform —
 * pairing is a relationship between two molecules, not a place on stage. */
const latchWorld = (a, b) => latchWorldFrom(a, b, a.mol.quaternion, a.mol.position);

function latchWorldFrom(a, b, aQuat, aPos){
  const p = pose(a, b);
  if(!p) return null;
  const s = un(b.spec);
  const p0 = p.apply(s.atoms[0].pos), p1 = p.apply(s.atoms[1].pos);
  const q0 = s.atoms[0].pos, q1 = s.atoms[1].pos;
  const th = Math.atan2(p1[1]-p0[1], p1[0]-p0[0]) - Math.atan2(q1[1]-q0[1], q1[0]-q0[0]);
  const co = Math.cos(th), si = Math.sin(th);
  const rx = q0[0]*co - q0[1]*si, ry = q0[0]*si + q0[1]*co;
  const local = new THREE.Vector3((p0[0]-rx)*S, (p0[1]-ry)*S, 0);
  const lq = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), th);
  return { pos: local.applyQuaternion(aQuat).add(aPos),
           quat: aQuat.clone().multiply(lq),
           solved: p };
}

// Does a pose actually hold? Every declared bond found, nothing driven into
// anything. Both numbers come from the solver, not from this page.
const holds = p => p && p.count >= 2 && p.clash == null;

/* ---- drag ---------------------------------------------------------------- */
const canvas = document.getElementById('gl');
const plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hit = new THREE.Vector3();
let held = null;
// A latched pair moves as ONE OBJECT. Every base being dragged carries its own
// offset from the pointer, so the pair keeps its internal geometry exactly —
// re-solving or re-snapping it mid-drag would let the bonds jitter.
let dragging = [];

const toWorld = e => {
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX-r.left)/r.width*2-1, -((e.clientY-r.top)/r.height*2-1));
  ray.setFromCamera(ndc, L.camera);
  ray.ray.intersectPlane(plane, hit);
  return hit;
};

function unpair(b){
  if(b.partner){ b.partner.wcKeys = null; b.partner.partner = null; }
  b.wcKeys = null; b.partner = null;
}

canvas.addEventListener('pointerdown', e => {
  if(step === 2){ down2(e); try{ canvas.setPointerCapture(e.pointerId); }catch(_){} return; }
  if(step === 3){ down3(e); try{ canvas.setPointerCapture(e.pointerId); }catch(_){} return; }
  if(step !== 1) return;
  const w = toWorld(e);
  const near = bases.map(b => ({ b, d:w.distanceTo(centreOf(b)) }))
                    .filter(x => x.d < 7).sort((x,y) => x.d - y.d)[0];
  if(!near) return;
  held = near.b;
  // Grab the whole pair if there is one. Two bases held together by hydrogen
  // bonds ARE one object until something breaks them — double-click to do that.
  const group = held.partner ? [held, held.partner] : [held];
  dragging = group.map(b => ({ b, off:b.mol.position.clone().sub(w) }));
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
});
canvas.addEventListener('pointermove', e => {
  if(step === 2) return move2(e);
  if(step === 3) return move3(e);
  if(!held) return;
  const w = toWorld(e);
  for(const d of dragging){ d.b.mol.position.copy(w).add(d.off); d.b.mol.position.z = 0; }
  tryLatch();
  refresh();
});
// Double-click a pair to pull it apart. Hydrogen bonds are weak — that is most
// of why DNA can be opened and read — but a drag is how the pair gets MOVED,
// so breaking needs its own gesture rather than happening by accident.
canvas.addEventListener('dblclick', e => {
  if(step !== 1) return;
  const w = toWorld(e);
  const near = bases.map(b => ({ b, d:w.distanceTo(centreOf(b)) }))
                    .filter(x => x.d < 7).sort((x,y) => x.d - y.d)[0];
  if(near) unpair(near.b);
  refresh();
});
canvas.addEventListener('pointerup', e => {
  held = null; dragging = []; held2 = null; drag2 = [];
  turning = null; held3 = null; turn3 = null;
  try{ canvas.releasePointerCapture(e.pointerId); }catch(_){}
  refresh();
});

/* THE LATCH. Near the solved pose against ANY other base and it snaps in — but
 * only if that pose is one that holds. A mismatch can be pushed together all
 * day and will not stick, which is the point. */
const LATCH_R = 3.4;
function tryLatch(){
  if(!held || held.partner) return;
  for(const other of bases){
    if(other === held || other.partner) continue;
    // Try it both ways round: the solve is asymmetric in its framing, not in
    // its chemistry, and the student has no idea which base this file happened
    // to solve "from".
    for(const [a, b] of [[other, held], [held, other]]){
      const t = latchWorld(a, b);
      if(!t || !holds(t.solved)) continue;
      if(b.mol.position.distanceTo(t.pos) > LATCH_R) continue;
      // Snap whichever of the two is the one being dragged, so the thing in
      // the student's hand is the thing that clicks into place.
      const move = (b === held) ? b : a;
      const target = (b === held) ? t : latchWorld(b, a);
      if(!target) continue;
      held.partner = other; other.partner = held;
      // WHICH ATOMS. The solve already knows the donor/acceptor pairs that
      // hold this pair together; anything else that drifts within range —
      // a ring N passing an exocyclic O on the far edge — is a contact, not
      // one of the pair's bonds, and drawing it solid would teach that a base
      // pair is however many bonds happen to be short enough.
      held.wcKeys = other.wcKeys = wcKeys(a, b, t.solved);
      // The pair is bonded, so the pose is no longer the pointer's to set.
      // Dropping the drag here lets the tween land it exactly on the solved
      // pose instead of fighting a cursor that is still moving.
      held = null; dragging = [];
      L.motion.cancel('latch:'+move.key);
      const from = move.mol.position.clone(), fq = move.mol.quaternion.clone();
      L.motion.seq([
        { dur:0.28, ease:'outBack', onUpdate:u=>{
            move.mol.position.lerpVectors(from, target.pos, u);
            THREE.Quaternion.slerp(fq, target.quat, move.mol.quaternion, u);
            // The drag is over, so nothing else is redrawing the bonds while
            // the tween runs — and the bonds are what the student is waiting
            // to see. They appear as soon as the geometry earns them.
            refresh();
          }},
        // ONE FLARE PER HYDROGEN BOND, ON THE BOND. Firing a single ring at the
        // molecule's transform origin put it in the middle of a ring system,
        // pointing at nothing — the effect marked "a thing happened here"
        // when what happened was two or three specific bonds forming several
        // ångströms away. Fired after the snap lands, and read from the bonds
        // kit/hbond.js actually finds in the final pose, so two flares mean
        // two bonds and three mean three.
        { call:()=>{
            if(!L.fx) return;
            for(const q of liveBonds()){
              if(q.donor.owner.partner !== q.acceptor.owner || !isWC(q)) continue;
              L.fx.spawnRing(new THREE.Vector3(
                (q.h[0]+q.p[0])/2, (q.h[1]+q.p[1])/2, (q.h[2]+q.p[2])/2),
                MolLib.PALETTE.bonds.hbond, null, 0.5);
            }
          }},
      ], { tag:'latch:'+move.key });
      return;
    }
  }
}

/* The bonds the solve found, as owner-agnostic keys into the two specs.
 * `a` is the pose solver's fixed base and `b` its moved one, which is the
 * framing pairing.js tags its own sites with. */
function wcKeys(a, b, solved){
  const who = o => (o === 'fixed' ? a : b).key;
  return new Set(solved.bonds.map(
    q => who(q.donor.owner) + ':' + q.donor.id + '|' + who(q.acceptor.owner) + ':' + q.acceptor.id));
}
const isWC = q => {
  const s = q.donor.owner.wcKeys;
  return !!s && s.has(q.donor.owner.key + ':' + q.donor.id + '|' +
                      q.acceptor.owner.key + ':' + q.acceptor.id);
};

/* ---- hydrogen bonds, found where the molecules actually are --------------- */
const MAXD = HBond.DEFAULTS.maxDist * S;
function liveBonds(){
  const donors = [], acceptors = [];
  for(const b of bases){
    const moved = { ...b.spec, atoms: b.spec.atoms.map(a=>{
      const v = new THREE.Vector3(...a.pos)
        .applyQuaternion(b.mol.quaternion).add(b.mol.position);
      return { el:a.el, pos:[v.x,v.y,v.z] }; }) };
    const s = HBond.sites(moved, { owner:b });
    donors.push(...s.donors); acceptors.push(...s.acceptors);
  }
  // onePerPair OFF — two bases really do share two or three bonds.
  return HBond.find(donors, acceptors, { maxDist:MAXD, onePerPair:false, order:'best' });
}

/* ---- bonds and tags, from where the molecules actually are --------------- */
function refresh(){
  const live = liveBonds();
  // A bond belongs to the solid layer only if its two owners are a latched
  // pair AND it is one the solve found. Everything else is a real contact that
  // is not a pair — faint, so the two read differently without a word of
  // explanation. The exception is a spare contact INSIDE a latched pair: it is
  // real, but drawn beside the bonds that hold the pair it reads as a fourth
  // one, so it is dropped.
  const latched = q => q.donor.owner.partner === q.acceptor.owner;
  HBpair.set(live.filter(q => latched(q) && isWC(q)));
  HBnear.set(live.filter(q => !latched(q)));
  for(const b of bases) b.tag.classList.toggle('paired', !!b.partner);
}

/* ---- the ruler: how wide a rung is ----------------------------------------
 * THE PAYOFF OF THE WHOLE PAGE. A–T is held by two hydrogen bonds and G–C by
 * three, and the two pairs are still the SAME WIDTH — because each is one wide
 * base plus one narrow one. That constancy is why the ladder has parallel
 * rails, and it is invisible until the two are measured against each other.
 *
 * WHAT IS MEASURED, AND WHY THAT: the distance between the two glycosidic
 * nitrogens — N9 on the purine, N1 on the pyrimidine. Those are the atoms the
 * sugars attach to, so that span IS the rung, and the backbone will hang off
 * exactly those two points in the step that adds one. (The textbook number is
 * usually C1′–C1′, ~10.5 Å; with no sugars yet, the nitrogens they bond to are
 * the honest stand-in, and ~9 Å is the real Watson–Crick value.) The number is
 * measured off the atoms every frame, never typed — CLAUDE.md's rule.
 */
const RULER_N = { adenine:'N9', guanine:'N9', thymine:'N1', cytosine:'N1' };
const glycosidic = b => {
  const i = b.spec.names.indexOf(RULER_N[b.key]);
  return new THREE.Vector3(...b.spec.atoms[i].pos)
    .applyQuaternion(b.mol.quaternion).add(b.mol.position);
};

function makeRuler(){
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color:0x3a342c, transparent:true, opacity:0.8 });
  const bar = new THREE.CylinderGeometry(0.05, 0.05, 1, 6);
  const part = () => { const m = new THREE.Mesh(bar, mat); g.add(m); return m; };
  // dimension line, two end ticks, two extension lines back to the atoms
  const parts = { line:part(), t1:part(), t2:part(), e1:part(), e2:part() };
  const label = document.createElement('div');
  label.className = 'ruler';
  document.getElementById('stage').appendChild(label);
  g.visible = false; label.style.display = 'none';
  return { g, parts, label };
}
const rulers = [makeRuler(), makeRuler()];   // at most two pairs on stage
rulers.forEach(r => G1.add(r.g));

const _rd = new THREE.Vector3();
const UPY = new THREE.Vector3(0,1,0);
function span(mesh, from, to){
  const d = _rd.subVectors(to, from), len = d.length();
  if(len < 1e-6){ mesh.visible = false; return; }
  mesh.visible = true;
  mesh.position.copy(from).addScaledVector(d, 0.5);
  mesh.quaternion.setFromUnitVectors(UPY, d.clone().normalize());
  mesh.scale.set(1, len, 1);
}

const OFFSET = 3.4;      // how far the dimension line sits off the pair
function placeRulers(){
  const pairs = bases.filter(b => b.partner && b.key < b.partner.key);
  rulers.forEach((r, i) => {
    const p = pairs[i];
    if(!p){ r.g.visible = false; r.label.style.display = 'none'; return; }
    r.g.visible = true; r.label.style.display = '';

    // Purine end first, so the ruler always reads the same way round.
    const pur = RULER_N[p.key] === 'N9' ? p : p.partner;
    const pyr = pur === p ? p.partner : p;
    const A = glycosidic(pur), B = glycosidic(pyr);

    /* A DIMENSION LINE IS HORIZONTAL, FULL STOP. It is a drawing convention,
     * and a measurement that tilts to follow its subject reads as part of the
     * subject. Held level, it reads as an annotation about the subject.
     *
     * This costs nothing here because setStartPose levels the N9→N1 axis
     * itself, so the horizontal span and the true separation are the same
     * number — the ruler is not projecting anything away. It is drawn under
     * the pair, below the lowest atom, so it cannot cross what it measures.
     */
    const heavy = [p, p.partner].flatMap(x => x.spec.atoms
      .filter(at => at.el !== 'H')
      .map(at => new THREE.Vector3(...at.pos)
        .applyQuaternion(x.mol.quaternion).add(x.mol.position)));
    // Below the lowest atom AND below the name tags, which hang under each
    // molecule in PIXELS — so the clearance is converted, not guessed, and it
    // survives a zoom or a resize instead of colliding at some other size.
    const tagPx = 30;
    const y0 = Math.min(...heavy.map(v => v.y)) - tagPx * L.worldPerPx() - 1.4;
    const a2 = new THREE.Vector3(A.x, y0, 0), b2 = new THREE.Vector3(B.x, y0, 0);

    span(r.parts.line, a2, b2);
    span(r.parts.e1, A, a2);
    span(r.parts.e2, B, b2);
    const tick = new THREE.Vector3(0, 0.42, 0);
    span(r.parts.t1, a2.clone().sub(tick), a2.clone().add(tick));
    span(r.parts.t2, b2.clone().sub(tick), b2.clone().add(tick));

    // Read the number off the atoms, not off the drawing.
    const rect = canvas.getBoundingClientRect();
    const lm = a2.clone().add(b2).multiplyScalar(0.5).project(L.camera);
    r.label.style.left = ((lm.x*0.5+0.5) * rect.width) + 'px';
    r.label.style.top  = ((-lm.y*0.5+0.5) * rect.height) + 'px';
    r.label.textContent = (A.distanceTo(B) / S).toFixed(1) + ' Å';
  });
}

/* ---- name tags, pinned to their molecules -------------------------------- */
// In afterFrame, never frame: Vector3.project reads a matrix refreshed only on
// render, so a tag positioned before it is pinned to the previous frame.
const _v = new THREE.Vector3(), _lo = new THREE.Vector3();
/* Hang the tag under the molecule's LOWEST ATOM, not under a radius drawn
 * about its centre. `reach` is the distance to the furthest atom in any
 * direction, so on a wide flat base it is much larger than the drop to the
 * bottom edge — the tag ended up level with the ruler and sat on the line. */
function lowestOf(b){
  let best = null;
  for(const a of b.spec.atoms){
    _lo.set(...a.pos).applyQuaternion(b.mol.quaternion).add(b.mol.position);
    if(!best || _lo.y < best.y) best = _lo.clone();
  }
  return best;
}
function placeTags(){
  const r = canvas.getBoundingClientRect();
  for(const b of bases){
    const lo = lowestOf(b);
    _v.copy(centreOf(b)).project(L.camera);
    const x = (_v.x*0.5+0.5) * r.width;
    _v.copy(lo).project(L.camera);
    b.tag.style.left = x + 'px';
    b.tag.style.top  = ((-_v.y*0.5+0.5) * r.height + 8) + 'px';
  }
}



/* =============================================================================
 *  STEP 2 — the nucleotide: base + sugar + phosphate
 * =============================================================================
 *  Same gesture as step 1, a different bond. Drag deoxyribose onto a base and
 *  its C1′ latches to the glycosidic nitrogen; drag a phosphate onto the
 *  sugar's 5′ end and it esterifies. Both are CONDENSATIONS — each one puts a
 *  water on the stage, which is the point being made: the same reaction that
 *  builds a protein and a starch builds this.
 *
 *  WHERE THE POSES COME FROM. dna/attach.js, out of 1BNA — not from a typed
 *  rotation. The glycosidic torsion χ is the angle that decides whether the
 *  base sits over its own sugar or swings away from it, and there is no way to
 *  eyeball it. Reading it off the crystal means the nucleotide this step ends
 *  on is the one step 4's helix is made of.
 *
 *  WHAT LEAVES IS READ FROM `condense:`. Every atom that departs is named by
 *  the spec's own condensation roles — the base's N–H, the sugar's anomeric
 *  –OH, the phosphate's –OH. This page never lists them, so a spec that
 *  renumbers cannot leave this step quietly bonding the wrong atoms.
 *
 *  The join REBUILDS THE MESH from a merged spec rather than parenting one
 *  group under another. Two reasons: the departing atoms have to actually go
 *  (hiding them leaves them in the bond list, and a hidden atom is still a
 *  claim about what the molecule is), and the new bond has to be drawn by the
 *  same code that draws every other bond, so it cannot end up a different
 *  thickness or colour from the ones beside it.
 * ========================================================================== */
const G2 = new THREE.Group();
G2.visible = false;
L.root.add(G2);

/* Everything in this step lives under SPIN, so the finished nucleotides can be
 * turned. SPIN rotates ABOUT THE ASSEMBLY'S CENTRE without any child being
 * moved: the position that cancels the rotation's own translation is computed
 * from the pivot each time. Reparenting or shifting every child would have
 * worked too, and would have invalidated every coordinate the joins were
 * solved in — this way the pieces stay in the frame attach.js placed them in.
 *
 * WHY ROTATION ONLY AT THE END. The drag builds the nucleotide by projecting
 * the pointer onto z = 0; a turned scene makes that plane meaningless and the
 * pieces would slide along a plane the student cannot see. So the gesture
 * changes only once there is nothing left to assemble. */
const SPIN = new THREE.Group();
G2.add(SPIN);
const spinCentre = new THREE.Vector3();
const spinEuler = new THREE.Euler(0, 0, 0, 'YXZ');
function applySpin(){
  SPIN.quaternion.setFromEuler(spinEuler);
  SPIN.position.copy(spinCentre)
    .sub(spinCentre.clone().applyQuaternion(SPIN.quaternion));
}

const SUGAR = M.deoxyribose, PHOS = M.phosphate;

// The pair sits at the TRUE pairing distance, hydrogen-bonded, and the loose
// pieces wait under whichever base they belong to. Keeping the rung intact is
// the point of the step: the backbone is being hung off a pair, not built
// beside one, and the sugars go on the OUTER edges because that is where the
// glycosidic nitrogens point.
const Y_BASE = 7, Y_SUGAR = -5, Y_PHOS = -15;
const COL = {};                       // filled from where the bases actually land

/* ---- assembling one spec out of two -------------------------------------- */
// The atoms that leave, by role, out of the spec's own `condense:` block.
const leaving = (spec, role) => {
  const r = (spec.condense && spec.condense.roles || []).find(x => x.key === role);
  return r ? r.leaves.slice() : [];
};
const keptAtom = (spec, role) => {
  const r = (spec.condense && spec.condense.roles || []).find(x => x.key === role);
  return r ? r.keep : -1;
};

// Drop atoms and renumber. Every index in a spec — bonds included — moves when
// an atom goes, so the map is built once and everything reads through it.
function without(spec, drop){
  const keep = spec.atoms.map((_, i) => i).filter(i => !drop.includes(i));
  return { keep, at:new Map(keep.map((old, ni) => [old, ni])) };
}

/* host + guest, minus one water, plus one bond. Both specs are in display
 * units; `pose` places the guest in the host's frame. */
function assemble(host, guest, pose, dropHost, dropGuest, hostAtom, guestAtom, suffix){
  const H = without(host, dropHost), G = without(guest, dropGuest);
  const v = new THREE.Vector3();
  const atoms = H.keep.map(i => host.atoms[i]).concat(G.keep.map(i => {
    v.set(...guest.atoms[i].pos).applyQuaternion(pose.quat).add(pose.pos);
    return { el:guest.atoms[i].el, pos:[v.x, v.y, v.z] };
  }));
  const off = H.keep.length;
  const names = H.keep.map(i => host.names[i])
    .concat(G.keep.map(i => guest.names[i] + suffix));
  const move = (m, b, d) => [m.get(b[0]) + d, m.get(b[1]) + d, ...b.slice(2)];
  const bonds = host.bonds.filter(b => H.at.has(b[0]) && H.at.has(b[1]))
      .map(b => move(H.at, b, 0))
    .concat(guest.bonds.filter(b => G.at.has(b[0]) && G.at.has(b[1]))
      .map(b => move(G.at, b, off)));
  bonds.push([H.at.get(hostAtom), off + G.at.get(guestAtom)]);
  // `view` and `optH` are dropped: the merged molecule is not either spec any
  // more, and an inherited view would turn it as though it were.
  return { name:host.name, atoms, bonds, names, units:host.units, view:null };
}

/* ---- the pieces on stage -------------------------------------------------- */
// In SPIN's frame, which is the frame every join is solved in. Identity until
// the scene is turned, and `toSpin`/`toWorld` are what convert either way.
const centreOfPiece = p =>
  p.centre.clone().applyQuaternion(p.mol.quaternion).add(p.mol.position);
const worldAtom = (p, i) => new THREE.Vector3(...p.spec.atoms[i].pos)
  .applyQuaternion(p.mol.quaternion).add(p.mol.position);
const spinToWorld = v => SPIN.localToWorld(v.clone());

// A piece is one draggable mesh. A base grows into a nucleotide in place —
// `spec` is replaced at each join and the mesh rebuilt — while a sugar or a
// phosphate exists only until it is absorbed.
function piece(spec, kind, at, quat){
  const p = { kind, spec, mol:null, tag:null, host:null, stage:0 };
  p.tag = document.createElement('div');
  p.tag.className = 'tag';
  document.getElementById('stage').appendChild(p.tag);
  rebuild(p, spec, at, quat || new THREE.Quaternion());
  return p;
}

function rebuild(p, spec, at, quat){
  const old = p.mol;
  p.spec = spec;
  p.mol = Stage.buildMolecule(flat(spec), { center:false });
  p.mol.position.copy(at); p.mol.quaternion.copy(quat);
  SPIN.add(p.mol);
  if(old){ SPIN.remove(old); disposeTree(old); }
  const h = spec.atoms.filter(a => a.el !== 'H');
  p.centre = h.reduce((v,a)=>v.add(new THREE.Vector3(...a.pos)), new THREE.Vector3())
              .multiplyScalar(1/h.length);
  p.tag.textContent = p.kind === 'base'
    ? (p.stage === 0 ? spec.name : p.stage === 1 ? 'Nucleoside' : 'Nucleotide')
    : spec.name;
}

// buildMolecule makes a geometry per atom and per bond, so a rebuilt molecule
// leaks both unless the old tree is disposed. Six joins a session is not a
// leak that shows, but a page left open on step 2 rebuilding on every drag is.
function disposeTree(g){
  g.traverse(o => { if(o.geometry) o.geometry.dispose(); });
}

/* The two bases, in the pair pose step 1 solved, so the rung reads the same
 * way here as it did there. */
const nucleo = {};
{
  // The purine takes the levelled orientation pairPoseAt solves; the pyrimidine
  // then goes exactly where pairing.js says it must sit to be bonded — the same
  // call step 1's latch makes. GAP is step 1's RESTING separation, which is
  // deliberately not the pairing distance, so laying the two out by it would
  // draw an unpaired pair.
  const t = pairPoseAt('adenine', 'thymine',
                       new THREE.Vector3(4, Y_BASE, 0), GAP);
  nucleo.adenine = piece(M.adenine, 'base', t.a.pos, t.a.quat);
  nucleo.adenine.key = 'adenine';
  const w = latchWorldFrom({ key:'adenine', spec:M.adenine },
                           { key:'thymine', spec:M.thymine },
                           t.a.quat, t.a.pos);
  nucleo.thymine = piece(M.thymine, 'base', w.pos, w.quat);
  nucleo.thymine.key = 'thymine';
  for(const k in nucleo) COL[k] = centreOfPiece(nucleo[k]).x;
}

// The loose pieces: one sugar and one phosphate per column. They start face-on
// and unrotated — this is not a shape puzzle, for step 1's reason.
const loose = [];
for(const key of ['adenine','thymine']){
  loose.push(Object.assign(
    piece(SUGAR, 'sugar', new THREE.Vector3(COL[key], Y_SUGAR, 0)), { want:key }));
  loose.push(Object.assign(
    piece(PHOS, 'phosphate', new THREE.Vector3(COL[key], Y_PHOS, 0)), { want:key }));
}

/* The pair's hydrogen bonds, found the same way step 1 finds them and drawn
 * once: nothing in this step moves the bases, so there is nothing to re-solve
 * every frame. Found rather than declared, for step 1's reason. */
const HB2 = HBond.create(THREE, { color:MolLib.PALETTE.bonds.hbond });
SPIN.add(HB2.group);
function pairBonds(){
  const donors = [], acceptors = [];
  for(const p of Object.values(nucleo)){
    const moved = { ...p.spec, atoms:p.spec.atoms.map(a=>{
      const v = new THREE.Vector3(...a.pos)
        .applyQuaternion(p.mol.quaternion).add(p.mol.position);
      return { el:a.el, pos:[v.x,v.y,v.z] }; }) };
    const st = HBond.sites(moved, { owner:p });
    donors.push(...st.donors); acceptors.push(...st.acceptors);
  }
  HB2.set(HBond.find(donors, acceptors,
    { maxDist:MAXD, onePerPair:false, order:'best' })
    .filter(q => q.donor.owner !== q.acceptor.owner));
}

/* ---- the two joins -------------------------------------------------------- */
// Both poses are solved once, in ångströms, and cached. `sugarPose` is in the
// base's frame; `phosPose` is in the SUGAR's — so a phosphate follows a sugar
// that has itself been placed, which is what composing them below does.
const poses2 = {};
function attachPose(key, kind){
  const k = key + ':' + kind;
  if(!(k in poses2)){
    const r = kind === 'sugar'
      ? Attach.sugar(key, un(M[key]), un(SUGAR))
      : Attach.phosphate(key, un(SUGAR), un(PHOS));
    poses2[k] = r.ok ? {
      quat:new THREE.Quaternion(...r.quat),
      pos:new THREE.Vector3(...r.pos).multiplyScalar(S),
      rms:r.rms, length:r.length } : null;
  }
  return poses2[k];
}

// Where a loose piece has to be, in world space, to join `host`.
function joinTarget(host, kind){
  const p = attachPose(host.key, kind);
  if(!p) return null;
  if(kind === 'sugar')
    return { pos:p.pos.clone().applyQuaternion(host.mol.quaternion).add(host.mol.position),
             quat:host.mol.quaternion.clone().multiply(p.quat) };
  // The phosphate's pose is relative to the sugar, and the sugar's to the base.
  const s = attachPose(host.key, 'sugar');
  const q = s.quat.clone().multiply(p.quat);
  const t = p.pos.clone().applyQuaternion(s.quat).add(s.pos);
  return { pos:t.applyQuaternion(host.mol.quaternion).add(host.mol.position),
           quat:host.mol.quaternion.clone().multiply(q) };
}

/* THE LATCH TEST IS IN THE PLANE, and this is not a detail. The pointer is
 * projected onto z = 0 and the drag pins every piece there, but the poses
 * attach.js reads out of 1BNA are three-dimensional: the phosphate's sits 4.9
 * units out of the base's plane. Comparing full 3D distance meant a dragged
 * phosphate could never get closer than 4.9 to its own target — the sugars
 * latched, the phosphates could not be latched at all, at any radius under
 * five. So the test asks the only question the gesture can answer, "is it over
 * the right place", and the tween carries it out of the plane. */
const LATCH2 = 4.2;
const flatDist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function tryJoin(){
  if(!held2) return;
  const host = nucleo[held2.want];
  if(!host) return;
  // A sugar joins a bare base; a phosphate joins the sugar that is now part of
  // the nucleoside. Out of order, nothing happens — the 5′ –OH it needs is not
  // on stage yet.
  const wantStage = held2.kind === 'sugar' ? 0 : 1;
  if(host.stage !== wantStage) return;
  const t = joinTarget(host, held2.kind);
  if(!t || flatDist(held2.mol.position, t.pos) > LATCH2) return;

  const guest = held2;
  held2 = null; drag2 = [];        // the bond is made; the pointer stops driving

  L.motion.seq([
    { dur:0.3, ease:'outBack', onUpdate:u=>{
        guest.mol.position.lerpVectors(guest.from, t.pos, u);
        THREE.Quaternion.slerp(guest.fq, t.quat, guest.mol.quaternion, u);
      }},
    { call:()=>join(host, guest) },
  ], { tag:'join:'+guest.want+':'+guest.kind });
}

function join(host, guest){
  const pose = attachPose(host.key, guest.kind);
  const kind = guest.kind;
  // The three atoms that are about to stop existing, in world space. The O and
  // one H come from whichever half gives up its –OH; the other H from the one
  // that gives up a hydrogen. Their middle is where the water appears.
  const gone = [
    ...leaving(host.spec, kind === 'sugar' ? 'glyco' : 'c5')
      .map(i => worldAtom(host, i)),
    ...leaving(kind === 'sugar' ? SUGAR : PHOS, kind === 'sugar' ? 'c1' : 'ester')
      .map(i => worldAtom(guest, i)) ];
  const waterAt = gone.reduce((v, p) => v.add(p), new THREE.Vector3())
                      .multiplyScalar(1 / gone.length);
  const spec = addPart(host.spec, host.key, kind);

  const at = host.mol.position.clone(), q = host.mol.quaternion.clone();
  host.stage++;
  rebuild(host, spec, at, q);
  bondFx(host, kind, waterAt);
  SPIN.remove(guest.mol); disposeTree(guest.mol);
  guest.tag.remove();
  loose.splice(loose.indexOf(guest), 1);

  pairBonds();
  water(waterAt);
  say(host);
}

/* One part joined to a growing nucleotide, as SPEC ARITHMETIC — no mesh, no
 * stage. Step 3 builds four finished nucleotides by calling this twice each,
 * and it has to be the same code the drag runs or the two would drift into
 * bonding different atoms. */
function addPart(hostSpec, key, kind){
  const pose = attachPose(key, kind);
  if(kind === 'sugar'){
    const spec = assemble(hostSpec, SUGAR, pose,
      leaving(hostSpec, 'glyco'), leaving(SUGAR, 'c1'),
      keptAtom(hostSpec, 'glyco'), keptAtom(SUGAR, 'c1'), '′');
    // The nucleoside keeps the sugar's roles so the NEXT join can read them:
    // the phosphate esterifies an –OH that is now part of the assembled
    // molecule, and `condense:` is where this page asks which atom that is.
    spec.condense = remapRoles(hostSpec, SUGAR, spec);
    return spec;
  }
  // In the sugar's frame, then carried into the base's by the sugar's pose —
  // the same composition joinTarget does, on the atoms rather than the mesh.
  const s = attachPose(key, 'sugar');
  const inBase = { quat:s.quat.clone().multiply(pose.quat),
                   pos:pose.pos.clone().applyQuaternion(s.quat).add(s.pos) };
  return assemble(hostSpec, PHOS, inBase,
    leaving(hostSpec, 'c5'), leaving(PHOS, 'ester'),
    keptAtom(hostSpec, 'c5'), keptAtom(PHOS, 'ester'), 'ᴾ');
}

/* The sugar's `c5` role, renumbered into the assembled spec. Read by NAME:
 * assemble() suffixes the guest's labels, so the sugar's O5 is 'O5′' and its
 * hydroxyl hydrogen 'HO5′' in the molecule that now holds them. */
function remapRoles(host, sugar, merged){
  const i = n => merged.names.indexOf(n);
  const r = (sugar.condense.roles || []).find(x => x.key === 'c5');
  const keep = i(sugar.names[r.keep] + '′');
  const leaves = r.leaves.map(k => i(sugar.names[k] + '′')).filter(k => k >= 0);
  return keep < 0 ? null : { roles:[{ key:'c5', label:r.label, keep, leaves }] };
}

/* ---- the bond that forms ---------------------------------------------------
 * BOTH JOINS ARE THE SAME REACTION, so both get the same effect: fx.js's
 * condense(), which is what a dehydration synthesis looks like everywhere in
 * this repo (SCIENCE.md §5). The glycosidic bond and the phosphoester differ in
 * which groups they are made of and in nothing else, and flaring them
 * differently would be saying they were different chemistry.
 *
 * The ring goes at the BOND MIDPOINT rather than at the molecule, for step 1's
 * reason: a flare at a molecule's transform origin lands in the middle of a
 * ring system and marks "something happened somewhere".
 *
 * NO popGlow. It is the obvious call — "pop a freshly-formed molecule" is what
 * it is for — but it punches the group to 1.7× for a beat, and this molecule is
 * hydrogen-bonded to another one four ångströms away: the nucleoside swells
 * straight through its own partner, and the pair looks broken at the exact
 * moment the page is claiming something was built. */
function bondFx(host, kind, waterAt){
  if(!L.fx) return;
  const [a, b] = kind === 'sugar'
    ? [Attach.glycosidicN(host.key), 'C1′'] : ['O5′', 'Pᴾ'];
  const mid = atomIn(host, a).add(atomIn(host, b)).multiplyScalar(0.5);
  L.fx.condense(spinToWorld(mid), spinToWorld(waterAt), { size:1.1 });
}
const atomIn = (host, name) =>
  new THREE.Vector3(...host.spec.atoms[host.spec.names.indexOf(name)].pos)
    .applyQuaternion(host.mol.quaternion).add(host.mol.position);

/* ---- the water that leaves ------------------------------------------------
 * A REAL WATER, from mol-small.js, drawn by the same builder as everything
 * else on stage. It appears where the three departing atoms actually were —
 * the base's or sugar's hydrogen and the –OH the other half gave up — so the
 * student can see that the water is made OF the two molecules rather than
 * arriving from somewhere. Then it drifts off and fades.
 *
 * `at` is that spawn point, computed before the join because by the time the
 * merged spec exists those atoms are gone from it. */
function water(at){
  const mol = Stage.buildMolecule(flat(M.water), { center:true });
  mol.position.copy(at);
  // Every material scene.js hands out is freshly constructed, so fading these
  // fades this water and nothing else on stage.
  const mats = [];
  mol.traverse(o => { if(o.material){ o.material.transparent = true; mats.push(o.material); } });
  SPIN.add(mol);
  // Named, because three spheres drifting off is a thing happening and 'H₂O'
  // is what happened. The label reads the spec's own formula.
  const el = document.createElement('div');
  el.className = 'leaving';
  el.textContent = M.water.formula;
  document.getElementById('stage').appendChild(el);
  waters.push({ mol, mats, el, at:at.clone(), born:performance.now() });
}
const waters = [];
const WATER_LIFE = 2.2;
/* Aged by the CLOCK, not by summed frame times. A backgrounded tab stops
 * firing requestAnimationFrame, so a water whose age is a running total of dt
 * simply stops ageing — come back to the tab and it is still hanging there.
 * Wall time keeps running, so it is gone when you look. */
function stepWaters(){
  const r = canvas.getBoundingClientRect();
  const now = performance.now();
  for(let i = waters.length - 1; i >= 0; i--){
    const w = waters[i];
    const t = (now - w.born) / 1000, u = t / WATER_LIFE;
    // Out of the plane as well as up: the pieces it came off are flat on z = 0,
    // and a water that only rises slides along the molecule it just left.
    // It has to CLEAR the molecule it came off before it fades, or the whole
    // event happens inside the atoms that made it and reads as a flicker.
    // Hence the distance, and hence holding full opacity for the first third.
    w.mol.position.copy(w.at).add(new THREE.Vector3(u * 6, u * 13, u * 7));
    w.mol.rotation.z = u * 1.6;
    const fade = Math.max(0, Math.min(1, (1 - u) * 1.5));
    for(const m of w.mats) m.opacity = fade;
    // Above the molecule by its own height, so the label clears the oxygen at
    // any zoom rather than by a pixel count that only works at one.
    const v = spinToWorld(w.mol.position.clone().add(new THREE.Vector3(0, 1.6, 0)))
      .project(L.camera);
    w.el.style.left = ((v.x*0.5+0.5) * r.width) + 'px';
    w.el.style.top  = ((-v.y*0.5+0.5) * r.height) + 'px';
    w.el.style.opacity = String(fade);
    if(t > WATER_LIFE){ SPIN.remove(w.mol); disposeTree(w.mol); w.el.remove();
                        waters.splice(i, 1); }
  }
}

/* ---- what the step says --------------------------------------------------- */
// Read off the assembled molecule, never typed: the bond length is measured
// between the two atoms that now hold it.
const note = document.getElementById('note');
function say(host){
  const done = Object.values(nucleo).filter(n => n.stage === 2).length;
  if(host.stage === 0){
    note.innerHTML = 'A base is not a nucleotide. Drag a <b>deoxyribose</b> onto '
      + 'either base, then a <b>phosphate</b> onto the sugar.';
    return;
  }
  const bond = host.stage === 1
    ? measure(host, 'N9', 'C1′') || measure(host, 'N1', 'C1′')
    : measure(host, 'O5′', 'Pᴾ');
  const what = host.stage === 1
    ? `Glycosidic bond, ${bond} Å. The base is on its sugar: a <b>nucleoside</b>.`
    : `Phosphoester bond, ${bond} Å. With a phosphate it is a <b>nucleotide</b>.`;
  if(done === 2) offerSpin();
  note.innerHTML = done === 2
    ? 'Two nucleotides. Each is one base, one sugar, one phosphate, and each '
      + 'bond cost a water. <b>Drag to turn them</b> — the sugars sit under the '
      + 'bases, not across them. Step 3 joins them into a strand.'
    : what + ' A water left for each bond made.';
}
function measure(host, a, b){
  const i = host.spec.names.indexOf(a), j = host.spec.names.indexOf(b);
  if(i < 0 || j < 0) return null;
  return (new THREE.Vector3(...host.spec.atoms[i].pos)
    .distanceTo(new THREE.Vector3(...host.spec.atoms[j].pos)) / S).toFixed(2);
}

/* ---- turning the finished pair --------------------------------------------
 * The nucleotides are flat-on while they are being built, because that is the
 * view the drag needs and the view the rung reads in. Flat-on is also what
 * makes the sugar look like it is drawn over the base rather than sitting
 * under it — the depth is there, and the projection is throwing it away.
 *
 * So when there is nothing left to assemble, the scene starts to turn on its
 * own. The sway is a demonstration, not decoration: it says the model has a
 * third dimension and that the pointer can reach it. It stops for good the
 * moment the student takes hold, which is the whole point of showing it.
 */
let spinning = false, sway = null;
function offerSpin(){
  if(spinning) return;
  spinning = true;
  spinCentre.copy(assemblyCentre());
  // Each beat carries its OWN endpoints. Advancing a shared `from` in the
  // beat's `call` looks equivalent and is not: motion.js fires `call` when a
  // beat STARTS, so the start value became the end value on the first frame
  // and every beat after the first held still.
  const y0 = spinEuler.y;
  // Brisk. It is a hint, not a display: slow enough to read as deliberate,
  // quick enough that the student is not waiting for it before touching
  // anything.
  const arc = (from, to) => ({ dur:1.05, ease:'inOutCubic',
    onUpdate:u=>{ spinEuler.y = from + (to - from) * u; applySpin(); } });
  sway = true;
  L.motion.seq([{ dur:0.25 }, arc(y0, y0 + 0.55), arc(y0 + 0.55, y0 - 0.55),
                 Object.assign(arc(y0 - 0.55, y0),
                               { onDone:()=>{ sway = null; } })], { tag:'sway' });
}
function stopSpin(){ L.motion.cancel('sway'); sway = null; }

// The middle of what is on stage, from the atoms rather than from the layout
// constants — the assembly grew a long way past where the pieces started, and
// turning about the pair alone would swing the phosphates through the frame.
function assemblyCentre(){
  const box = new THREE.Box3();
  for(const p of Object.values(nucleo))
    for(const a of p.spec.atoms)
      box.expandByPoint(new THREE.Vector3(...a.pos)
        .applyQuaternion(p.mol.quaternion).add(p.mol.position));
  return box.getCenter(new THREE.Vector3());
}

/* ---- drag ----------------------------------------------------------------- */
// Only the loose pieces move. The bases are anchors: a student dragging the
// base onto the sugar is making the same bond, but the pair would come apart
// on screen and the rung is what the sugar is being hung off. Once every piece
// is spent the same drag turns the whole thing instead.
let held2 = null, drag2 = [], turning = null;
function down2(e){
  if(spinning){
    stopSpin();
    turning = { x:e.clientX, y:e.clientY };
    return;
  }
  const w = toWorld(e);
  const near = loose.map(p => ({ p, d:w.distanceTo(centreOfPiece(p)) }))
                    .filter(x => x.d < 7).sort((x,y) => x.d - y.d)[0];
  if(!near) return;
  held2 = near.p;
  held2.from = held2.mol.position.clone();
  held2.fq = held2.mol.quaternion.clone();
  drag2 = [{ p:held2, off:held2.mol.position.clone().sub(w) }];
}
function move2(e){
  if(turning){
    // Pixels to radians, and the vertical is CLAMPED: past about a quarter turn
    // the pair is edge-on and the page is showing the one view in which a flat
    // molecule tells you nothing.
    spinEuler.y += (e.clientX - turning.x) * 0.008;
    spinEuler.x = Math.max(-0.7, Math.min(0.7,
      spinEuler.x + (e.clientY - turning.y) * 0.008));
    turning = { x:e.clientX, y:e.clientY };
    applySpin();
    return;
  }
  if(!held2) return;
  const w = toWorld(e);
  for(const d of drag2){ d.p.mol.position.copy(w).add(d.off); d.p.mol.position.z = 0; }
  held2.from = held2.mol.position.clone();
  held2.fq = held2.mol.quaternion.clone();
  tryJoin();
}
function placeTags2(){
  const r = canvas.getBoundingClientRect();
  for(const p of Object.values(nucleo).concat(loose)){
    let lo = null;
    for(const a of p.spec.atoms){
      const v = new THREE.Vector3(...a.pos)
        .applyQuaternion(p.mol.quaternion).add(p.mol.position);
      if(!lo || v.y < lo.y) lo = v;
    }
    const c = spinToWorld(centreOfPiece(p)).project(L.camera);
    const b = spinToWorld(lo).project(L.camera);
    p.tag.style.left = ((c.x*0.5+0.5) * r.width) + 'px';
    p.tag.style.top  = ((-b.y*0.5+0.5) * r.height + 8) + 'px';
  }
}


/* =============================================================================
 *  STEP 3 — the backbone: a second rung, and two bonds that run opposite ways
 * =============================================================================
 *  Step 2 ended holding one rung: a base pair with a nucleotide on each side.
 *  This step puts a second rung under it and joins them, which takes TWO
 *  phosphodiester bonds — one down each side of the ladder.
 *
 *  THE TWO BONDS POINT IN OPPOSITE DIRECTIONS, and that is the whole step. On
 *  the left rail the upper nucleotide's 3′–OH reaches down to the lower one's
 *  phosphate; on the right rail the LOWER one reaches up. Nothing here arranges
 *  that: it is read off 1BNA, whose own bond list runs pair i → i+1 on one
 *  strand and i+1 → i on the other. Antiparallel is a fact about the record.
 *
 *  WHY THE VIEW TURNS. A rung is drawn face-on in steps 1 and 2, and rung3s
 *  stack along the axis pointing at the camera — a second rung placed face-on
 *  sits exactly behind the first. So this step turns the duplex on its side,
 *  where two rung3s read as two rung3s and the rails run down the outside. Drag
 *  the empty paper to turn it further; drag a molecule to move it.
 *
 *  EVERY POSE COMES FROM THE RECORD, all four at once. The first version of
 *  this step composed them — pair pose here, link pose there — and the second
 *  backbone bond came out 31 Å long, because two poses each correct about
 *  their own anchor do not compose into a correct duplex. Fitting each
 *  nucleotide onto the residue it is (`Attach.residueFit`) makes the pairing,
 *  the stacking and both bonds the crystal's at once.
 * ========================================================================== */
const G3 = new THREE.Group();
G3.visible = false;
L.root.add(G3);

// Rotation, on the same pivot trick step 2 uses: no child is reparented, so
// every atom stays in the frame the record placed it in.
const SPIN3 = new THREE.Group();
G3.add(SPIN3);
const pivot3 = new THREE.Vector3();
const euler3 = new THREE.Euler(0, 0, 0, 'YXZ');
function applySpin3(){
  SPIN3.quaternion.setFromEuler(euler3);
  SPIN3.position.copy(pivot3).sub(pivot3.clone().applyQuaternion(SPIN3.quaternion));
}

/* Two consecutive pairs of the dodecamer. 5 and 6 are A·T over T·A — the step
 * whose two letters are the ones step 2 just built, so the student is joining
 * the rung they made to another one and not to a pair of new letters. */
const RUNGS = [
  { pair:5, of:[['adenine', 0], ['thymine', 1]] },
  { pair:6, of:[['thymine', 0], ['adenine', 1]] },
];

/* Our labels out, the record's in. attach.js speaks PDB names because that is
 * what it reads; the merged spec's labels are this page's own invention, so the
 * translation lives here. Hydrogens are dropped: the record has none, and an
 * atom with no counterpart cannot be fitted onto anything. */
function pdbAtoms(spec){
  const out = {};
  for(let i = 0; i < spec.names.length; i++){
    if(spec.atoms[i].el === 'H') continue;
    let n = spec.names[i];
    if(n.endsWith('ᴾ')) n = (n.slice(0, -1) === 'P') ? 'P' : null;   // only the P
    else if(n.endsWith('′')) n = n.slice(0, -1) + "'";
    if(n) out[n] = spec.atoms[i].pos.map(v => v / S);
  }
  return out;
}

const nucleotideSpec = key => addPart(addPart(M[key], key, 'sugar'), key, 'phosphate');

/* ---- the four nucleotides -------------------------------------------------- */
const rung3s = RUNGS.map((r, ri) => {
  const rung = { i:ri, pair:r.pair, res:[], mol:new THREE.Group(), joined:false };
  for(const [key, strand] of r.of){
    const spec = nucleotideSpec(key);
    const f = Attach.residueFit(pdbAtoms(spec), r.pair, strand);
    const res = { key, strand, spec, mol:null };
    build3(res, spec, rung.mol);
    if(f.ok){
      res.mol.quaternion.set(...f.quat);
      res.mol.position.set(...f.pos).multiplyScalar(S);
      res.rms = f.rms;
    }
    rung.res.push(res);
  }
  SPIN3.add(rung.mol);
  rung.tag = document.createElement('div');
  rung.tag.className = 'tag';
  document.getElementById('stage').appendChild(rung.tag);
  return rung;
});

function build3(res, spec, parent){
  const old = res.mol;
  res.spec = spec;
  res.mol = Stage.buildMolecule(flat(spec), { center:false });
  if(old){ res.mol.position.copy(old.position); res.mol.quaternion.copy(old.quaternion);
           parent.remove(old); disposeTree(old); }
  parent.add(res.mol);
}

const named3 = (res, n) => res.spec.names.indexOf(n);
const rungOf = res => rung3s.find(r => r.res.includes(res));
const atIn = (res, i, rungPos) => new THREE.Vector3(...res.spec.atoms[i].pos)
  .applyQuaternion(res.mol.quaternion).add(res.mol.position).add(rungPos);
// WHERE THE RECORD PUTS IT, with the lower rung home. "Which atoms bond" is a
// question about the finished duplex, not about where a rung is being held.
const atHome = (res, i) =>
  atIn(res, i, rungOf(res).i === 1 ? home3 : rungOf(res).mol.position);
const atNow  = (res, i) => atIn(res, i, rungOf(res).mol.position);

/* ---- which way is up, solved from the two rungs ----------------------------
 * NOT A CHOSEN ANGLE. Attach.residueFit places our nucleotides in 1BNA's OWN
 * deposited frame, where the helix axis points wherever the crystallographers'
 * cell put it — turning the group by a typed rotation (step 4's -90°, which is
 * right for step 4 because bake-ladder.js re-expressed every pair in a frame of
 * its own) drew this step at a meaningless angle and was unreadable.
 *
 * Two vectors out of the structure fix it. The line between the two rungs'
 * centres is the stack, and it goes DOWN the screen so the second rung reads as
 * below the first. The line between the two C1′ atoms of a rung is the rung
 * itself, and it goes ACROSS. What is left is a ladder seen from the side: two
 * rungs, and the rails down the outside, which is the picture this step is for.
 */
function solveView(){
  const B = window.BDNA, P = RUNGS.map(r => B.pairs[r.pair]);
  // THE AXIS IS THE PAIRS' OWN NORMAL, averaged over the two. The line between
  // the rungs' centres looks like the same thing and is not: a rung's centre
  // includes its backbone, which spirals, so that line sits 23° off the axis
  // and drew the ladder leaning. bake-ladder.js already computed each pair's
  // normal, and this is what it is for.
  const u = new THREE.Vector3(...P[0].basis[2])
    .add(new THREE.Vector3(...P[1].basis[2])).normalize();
  const o = new THREE.Vector3(...P[1].origin).sub(new THREE.Vector3(...P[0].origin));
  if(o.dot(u) < 0) u.negate();                       // pointing rung 1 → rung 2

  // The rung itself: C1′ to C1′, the two atoms the sugars hang off, which is
  // the same span step 1's ruler measures.
  const dep0 = Attach.residueAt(B, RUNGS[0].pair, 0);
  const dep1 = Attach.residueAt(B, RUNGS[0].pair, 1);
  const wide = new THREE.Vector3(...dep0["C1'"]).sub(new THREE.Vector3(...dep1["C1'"]));
  const w = wide.sub(u.clone().multiplyScalar(wide.dot(u))).normalize();

  // The basis that MAPS those onto the screen axes is the inverse of the basis
  // built FROM them, and a rotation's inverse is its transpose. Stack down the
  // screen, rung across it: a ladder seen from the side.
  const n = new THREE.Vector3().crossVectors(w, u);
  const b = new THREE.Matrix4().makeBasis(w, u.clone().negate(), n.negate());
  G3.quaternion.setFromRotationMatrix(b.transpose());
}

/* Where the lower rung waits: straight down the screen from where it belongs,
 * far enough to read as a separate object. Its HOME is the record's placement,
 * so this is an offset from the answer rather than a pose of its own. */
const home3 = rung3s[1].mol.position.clone();
const AWAY = 21;
{
  solveView();
  G3.updateMatrixWorld(true);
  const down = G3.worldToLocal(G3.localToWorld(home3.clone())
    .add(new THREE.Vector3(0, -AWAY, 0)));
  rung3s[1].mol.position.copy(down);

  /* Centre the group on the FINISHED duplex, not on the staging arrangement:
   * the lower rung is only waiting below for a moment, and framing that would
   * leave the thing the step is about off-centre for good. Box3 works in world
   * space, so the pivot has to be converted back before the group is moved —
   * afterwards the matrix it would convert through is the one being changed. */
  const was = rung3s[1].mol.position.clone();
  rung3s[1].mol.position.copy(home3);
  G3.updateMatrixWorld(true);
  const box = new THREE.Box3();
  for(const r of rung3s) box.expandByObject(r.mol);
  const centre = box.getCenter(new THREE.Vector3());
  pivot3.copy(G3.worldToLocal(centre.clone()));
  G3.position.sub(centre);
  rung3s[1].mol.position.copy(was);
  rung3s[0].tag.textContent = 'A·T';
  rung3s[1].tag.textContent = 'T·A';
}

/* ---- the two bonds --------------------------------------------------------- */
/* WHICH ATOM MEETS WHICH, asked of the geometry rather than declared. With both
 * rung3s at their crystal placements, exactly two O3′···P pairs are within
 * bonding distance, and they run opposite ways. Declaring them from the letters
 * would work and would hide the thing being taught. */
function backbonePairs(){
  const out = [];
  for(const a of rung3s[0].res) for(const b of rung3s[1].res){
    for(const [donor, taker] of [[a, b], [b, a]]){
      const o = named3(donor, 'O3′'), p = named3(taker, 'Pᴾ');
      if(o < 0 || p < 0) continue;
      const d = atHome(donor, o).distanceTo(atHome(taker, p));
      if(d < 2.2 * S) out.push({ donor, taker, o, p, d:d / S });
    }
  }
  return out;
}
const spin3World = v => SPIN3.localToWorld(v.clone());

let bonds3 = null;
function linkRungs(){
  if(rung3s[1].joined) return;
  rung3s[1].joined = true;
  bonds3 = backbonePairs();

  for(const b of bonds3){
    const oh = esterOH(b.taker, atNow(b.donor, b.o));
    const waterAt = [atNow(b.donor, named3(b.donor, 'HO3′')),
                     atNow(b.taker, oh.o), atNow(b.taker, oh.h)]
      .reduce((v, p) => v.add(p), new THREE.Vector3()).multiplyScalar(1/3);
    const bondAt = atNow(b.donor, b.o).add(atNow(b.taker, b.p)).multiplyScalar(0.5);
    // The atoms go; the sticks between the two rung3s are drawn by linkSticks().
    drop3(b.donor, [named3(b.donor, 'HO3′')]);
    drop3(b.taker, [oh.o, oh.h]);
    if(L.fx) L.fx.condense(spin3World(bondAt), spin3World(waterAt), { size:1.1 });
    water3(waterAt);
  }
  linkSticks();
  rung3s[0].tag.style.display = rung3s[1].tag.style.display = 'none';
  endTags();
  say3();
  L.fit();
}

// Which of the phosphate's two spare hydroxyls reacts: the one nearest the
// oxygen replacing it. The three –OH on a phosphate are equivalent, so naming
// one would be an accident of the record it was converted from.
function esterOH(res, toward){
  let best = null;
  for(const n of ['O2ᴾ', 'O3ᴾ']){
    const i = named3(res, n);
    if(i < 0) continue;
    const d = atNow(res, i).distanceTo(toward);
    if(!best || d < best.d) best = { d, o:i, h:named3(res, 'H' + n) };
  }
  return best;
}

// Rebuild one residue without some atoms. The departing atoms have to actually
// go: a hidden atom is still in the bond list, and still a claim about what the
// molecule is.
function drop3(res, drop){
  const keep = res.spec.atoms.map((_, i) => i).filter(i => !drop.includes(i));
  const at = new Map(keep.map((old, ni) => [old, ni]));
  const spec = { ...res.spec,
    atoms: keep.map(i => res.spec.atoms[i]),
    names: keep.map(i => res.spec.names[i]),
    bonds: res.spec.bonds.filter(b => at.has(b[0]) && at.has(b[1]))
             .map(b => [at.get(b[0]), at.get(b[1]), ...b.slice(2)]) };
  const rung = rung3s.find(r => r.res.includes(res));
  build3(res, spec, rung.mol);
}

/* The two bonds BETWEEN the rung3s belong to no single molecule, so they are
 * drawn here and redrawn as the rung3s move — step 4's rails, two rung3s' worth. */
const stickGeo = new THREE.CylinderGeometry(0.13, 0.13, 1, 8);
let sticks3 = [];
function linkSticks(){
  for(const m of sticks3){ SPIN3.remove(m); }
  sticks3 = (bonds3 || []).map(b => {
    const m = new THREE.Mesh(stickGeo, new THREE.MeshStandardMaterial(
      { color:MolLib.PALETTE.bonds.condense, roughness:.5 }));
    SPIN3.add(m); return m;
  });
  placeSticks();
}
const _sd = new THREE.Vector3(), _up3 = new THREE.Vector3(0,1,0);
function placeSticks(){
  (bonds3 || []).forEach((b, i) => {
    const m = sticks3[i]; if(!m) return;
    const from = atNow(b.donor, named3(b.donor, 'O3′'));
    const to   = atNow(b.taker, named3(b.taker, 'Pᴾ'));
    const d = _sd.subVectors(to, from), len = d.length();
    m.position.copy(from).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(_up3, d.clone().normalize());
    m.scale.set(1, len, 1);
  });
}

/* ---- the water that leaves, twice ------------------------------------------ */
const waters3 = [];
function water3(local){
  const mol = Stage.buildMolecule(flat(M.water), { center:true });
  mol.position.copy(local);
  const mats = [];
  mol.traverse(o => { if(o.material){ o.material.transparent = true; mats.push(o.material); } });
  SPIN3.add(mol);
  const el = document.createElement('div');
  el.className = 'leaving';
  el.textContent = M.water.formula;
  document.getElementById('stage').appendChild(el);
  waters3.push({ mol, mats, el, at:local.clone(), born:performance.now() });
}
function stepWaters3(){
  const r = canvas.getBoundingClientRect();
  const now = performance.now();
  for(let i = waters3.length - 1; i >= 0; i--){
    const w = waters3[i];
    const t = (now - w.born) / 1000, u = t / WATER_LIFE;
    // Outward from the duplex, not straight up: the rails are what it just left
    // and the axis is where the next rung goes.
    const away = w.at.clone().setZ(0).normalize().multiplyScalar(u * 9);
    w.mol.position.copy(w.at).add(away);
    const fade = Math.max(0, Math.min(1, (1 - u) * 1.5));
    for(const m of w.mats) m.opacity = fade;
    const v = spin3World(w.mol.position.clone().add(new THREE.Vector3(0, 0, 1.6)))
      .project(L.camera);
    w.el.style.left = ((v.x*0.5+0.5) * r.width) + 'px';
    w.el.style.top  = ((-v.y*0.5+0.5) * r.height) + 'px';
    w.el.style.opacity = String(fade);
    if(t > WATER_LIFE){ SPIN3.remove(w.mol); disposeTree(w.mol); w.el.remove();
                        waters3.splice(i, 1); }
  }
}

/* ---- the two rails, labelled at their ends --------------------------------
 * A rail has a phosphate at one end and a free –OH at the other, and the two
 * rails have them at OPPOSITE ends. Labelling the four ends is the whole claim
 * of the step, so the labels go on the atoms rather than near them. */
const ends3 = [];
function endTags(){
  for(const b of bonds3){
    // Up the rail from the bond: the taker's own 3′ is that rail's free end,
    // and the donor's phosphate is the other.
    for(const [res, name, text] of [[b.taker, 'O3′', '3′'], [b.donor, 'Pᴾ', '5′']]){
      const i = named3(res, name);
      if(i < 0) continue;
      const el = document.createElement('div');
      el.className = 'tag end';
      el.textContent = text;
      document.getElementById('stage').appendChild(el);
      ends3.push({ el, res, i });
    }
  }
}
function placeEnds3(){
  const r = canvas.getBoundingClientRect();
  for(const e of ends3){
    const v = spin3World(atNow(e.res, e.i)).project(L.camera);
    e.el.style.left = ((v.x*0.5+0.5) * r.width) + 'px';
    e.el.style.top  = ((-v.y*0.5+0.5) * r.height) + 'px';
  }
}

/* ---- what the step says ---------------------------------------------------- */
function say3(){
  if(!rung3s[1].joined){
    note.innerHTML = 'The rung you built, and a second one below it. Drag the '
      + 'lower rung up: <b>two</b> bonds will form, one down each side. '
      + '<i>Drag the paper to turn the model.</i>';
    return;
  }
  const d = bonds3.map(b => b.d.toFixed(2)).join(' Å and ');
  note.innerHTML = `Two phosphodiester bonds, ${d} Å — the same condensation as `
    + 'the other two, twice. Each side is now sugar–phosphate–sugar, with the '
    + 'bases hanging inward. <b>And the two sides point opposite ways</b>: one '
    + "rail's 3′ end is level with the other's 5′. That is what antiparallel "
    + 'means, and it is why the strands can be read as templates for each other.';
}

/* ---- drag: a molecule moves, the paper turns ------------------------------- */
let held3 = null, off3 = null, turn3 = null;
function down3(e){
  const w = toWorld(e);
  if(!rung3s[1].joined){
    const c = rungCentre(rung3s[1]);
    if(flatDist(w, c) < 12){
      held3 = rung3s[1];
      off3 = held3.mol.position.clone().sub(toSpin3(w));
      return;
    }
  }
  turn3 = { x:e.clientX, y:e.clientY };
  stopSway3();
}
function move3(e){
  if(turn3){
    euler3.y += (e.clientX - turn3.x) * 0.008;
    euler3.x = Math.max(-0.7, Math.min(0.7, euler3.x + (e.clientY - turn3.y) * 0.008));
    turn3 = { x:e.clientX, y:e.clientY };
    applySpin3();
    return;
  }
  if(!held3) return;
  held3.mol.position.copy(toSpin3(toWorld(e))).add(off3);
  placeSticks();
  tryLinkRungs();
}
// worldToLocal already walks the whole parent chain, so this converts once.
// Composing it with G3's own inverse applied the rotation twice and sent the
// rung further away the harder it was pulled.
const toSpin3 = w => SPIN3.worldToLocal(w.clone());
/* IN WORLD SPACE. Box3.expandByObject works off world matrices, so the box is
 * already placed — adding the rung's own position again double-counted it, and
 * the lower rung's hit test and tag both pointed at the upper one. */
function rungCentre(rung){
  const box = new THREE.Box3();
  for(const res of rung.res) box.expandByObject(res.mol);
  return box.getCenter(new THREE.Vector3());
}

const LATCH3 = 5;
function tryLinkRungs(){
  if(!held3) return;
  if(flatDist(spin3World(held3.mol.position), spin3World(home3)) > LATCH3) return;
  const from = held3.mol.position.clone();
  const rung = held3;
  held3 = null;
  L.motion.seq([
    { dur:0.32, ease:'outBack',
      onUpdate:u=>{ rung.mol.position.lerpVectors(from, home3, u); placeSticks(); } },
    { call:linkRungs },
  ], { tag:'link3' });
}

/* The same offer step 2 makes, for the same reason: this view has depth the
 * projection is throwing away, and the rails are on the near and far sides. */
let sway3 = null, offered3 = false;
function offerSway3(){
  if(offered3) return;
  offered3 = true;
  const y0 = euler3.y;
  const arc = (a, b) => ({ dur:1.05, ease:'inOutCubic',
    onUpdate:u=>{ euler3.y = a + (b - a) * u; applySpin3(); } });
  sway3 = true;
  L.motion.seq([{ dur:0.25 }, arc(y0, y0 + 0.5), arc(y0 + 0.5, y0 - 0.5),
                 Object.assign(arc(y0 - 0.5, y0), { onDone:()=>{ sway3 = null; } })],
               { tag:'sway3' });
}
function stopSway3(){ L.motion.cancel('sway3'); sway3 = null; }

function placeTags3(){
  const r = canvas.getBoundingClientRect();
  for(const rung of rung3s){
    if(rung.tag.style.display === 'none') continue;
    let lo = null;
    for(const res of rung.res) for(const a of res.spec.atoms){
      const v = spin3World(new THREE.Vector3(...a.pos)
        .applyQuaternion(res.mol.quaternion).add(res.mol.position)
        .add(rung.mol.position));
      if(!lo || v.y < lo.y) lo = v;
    }
    const c = rungCentre(rung).project(L.camera);
    const b = lo.project(L.camera);
    rung.tag.style.left = ((c.x*0.5+0.5) * r.width) + 'px';
    rung.tag.style.top  = ((-b.y*0.5+0.5) * r.height + 8) + 'px';
  }
  placeEnds3();
}

/* =============================================================================
 *  STEP 4 — the ladder and the helix, one molecule
 * =============================================================================
 *  Everything here is 1BNA (dna/data/bdna.js, baked by dna/bake-ladder.js).
 *  Each base pair is built ONCE from its atoms in its own frame, then placed
 *  twice: the deposited helix, and the same pairs with the twist set to zero.
 *  The slider interpolates the PLACEMENTS — slerp the rotation, lerp the
 *  origin — so every pair stays rigid at every value. Nothing deforms; the
 *  arrangement is the only thing that changes, which is the claim.
 *
 *  The grooves are therefore not drawn. They appear because a twisted ladder
 *  has gaps of two different sizes between its rails, and disappear when the
 *  twist comes out. That is the entire argument of the step.
 * ========================================================================== */
const G4 = new THREE.Group();
G4.visible = false;
/* STAND THE HELIX UP. The stack grows along the base-pair NORMAL — the mean
 * step's translation is (shift, slide, rise) in the pair's own frame, and the
 * rise component is along that normal, which is local +Z. Left alone the
 * duplex grows straight at the camera and the page shows a view down the axis
 * from one end: a rosette, not a helix. One rotation puts the growth
 * direction along world +Y, where the camera is side-on to it. */
G4.rotation.x = -Math.PI / 2;
L.root.add(G4);

const bdna = window.BDNA;

/* THE HELIX IS BUILT BY TWISTING THE LADDER, not by interpolating toward a
 * deposited structure. Every pair keeps its own REAL atoms from 1BNA; what is
 * idealised is the STEP between them — one mean rigid transform, measured off
 * all eleven real steps, applied over and over.
 *
 * Two things follow, and both were fought for:
 *
 *  · Every step is identical, so the wind cannot seam, reverse, or run ahead
 *    of itself partway up the strand. Those failures are not fixed here; they
 *    are unrepresentable.
 *  · The step carries all six parameters — shift, slide, rise, tilt, roll,
 *    twist — because rise and twist alone leave the finished helix 3.4 Å from
 *    the real one, which is nothing to a 40 Å molecule and fatal to a 1.6 Å
 *    bond. With all six the backbone survives the idealisation at 1.09× its
 *    natural length.
 *
 * The LADDER is the same stack with the turn taken out and the sideways drift
 * dropped: straight up, every rung square. */
const HELIX_Q = new THREE.Quaternion(...bdna.step.q);
const HELIX_T = new THREE.Vector3(...bdna.step.t).multiplyScalar(S);
const LADDER_Q = new THREE.Quaternion();
const LADDER_T = new THREE.Vector3(0, 0, bdna.step.t[2] * S);

const rungs = bdna.pairs.map(p => {
  const spec = { name:p.seq, units:'scene', view:null,
    atoms: p.atoms.map(a => ({ el:a.el, pos:a.p.map(v => v * S) })),
    bonds: p.bonds };
  const mol = Stage.buildMolecule(spec, { center:false });
  G4.add(mol);
  return { p, mol };
});

/* The phosphodiester bonds run BETWEEN base pairs, so they belong to no pair
 * and have to be redrawn as the pairs move. Without them the ladder is twelve
 * floating rungs and the grooves have no rails to be gaps between. */
/* THE BACKBONE TEARS, AND THE PAGE SAYS SO.
 *
 * Every base pair here is rigid, so untwisting can only be done by moving the
 * pairs — and when it is, the O3′→P bonds between them stretch from 1.6 Å to
 * nearly 9. That is not an artefact to hide behind a fade-out. It is the
 * answer to a question the textbook picture never raises: DNA is drawn as a
 * "twisted ladder", and a real ladder is IMPOSSIBLE. The backbone has a fixed
 * length per residue and cannot span a straight stack of pairs 3.5 Å apart.
 * Winding is how it reconciles the two — the helix is not decoration on a
 * ladder, it is the only way the thing can be built.
 *
 * The numbers say it plainly. Winding from the flat ladder to the finished
