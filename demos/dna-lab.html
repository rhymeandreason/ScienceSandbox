<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA — how a base pair holds</title>

<!-- ===================================================================
     STEP 1 of the DNA lesson: the base pair, and why the rule is a rule.

     A BARE STAGE, FOUR BASES, NO PANEL. The student pushes them around
     and finds out which ones stick. Every arrangement is allowed —
     nothing refuses a drag, nothing greys a base out — so the pairing
     rule has to be discovered rather than announced.

     THE CONFLICT THIS FIXES. Textbooks draw base pairing as jigsaw
     tabs, which explains nothing and is not what holds them. What holds
     them is hydrogen bonds, the same bond the water lesson spent a page
     on, drawn here in the same deep blue on purpose.

     NOTHING HERE HARD-CODES A PAIRING. Each pose is solved by
     dna/pairing.js from the bases' own declared donors and acceptors, and
     the bonds are then FOUND by kit/hbond.js — the generic finder. Any
     two bases can be brought together; only two arrangements satisfy
     every site on both edges at once, and those are the pairs.
     =================================================================== -->

<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="sandbox.css">
<style>
  /* No side panel: the stage is the whole page. */
  #app{grid-template-columns:1fr}
  #stage{grid-column:1}

  /* A base's name, pinned to the molecule it belongs to every frame. */
  .tag{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,0);
    font-family:var(--font-slab);font-size:13px;letter-spacing:.4px;color:var(--ink);
    background:rgba(255,255,255,.66);border-radius:7px;padding:2px 9px;white-space:nowrap}
  .tag.paired{background:#0042aa;color:#fff}

  /* The rung measurement. Reads as a drawing annotation, not a label on a
     molecule — hence the slab face and the paper-coloured backing. */
  .ruler{position:absolute;z-index:5;pointer-events:none;
    transform:translate(-50%,-50%);
    font-family:var(--font-slab);font-size:13px;letter-spacing:.3px;
    color:var(--ink);background:var(--paper);padding:1px 7px;border-radius:5px}

</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="brand"><span class="drop"><i class="ph-bold ph-dna"></i></span><h1>Base pairing</h1></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="palette.js"></script>
<script src="molecules.js"></script>
<script src="skel.js"></script>
<script src="mol-nucleic.js"></script>
<script src="scene.js"></script>
<script src="fx.js"></script>
<script src="kit/motion.js"></script>
<script src="kit/molgraph.js"></script>
<script src="lobes/lobes.js"></script>
<script src="kit/hbond.js"></script>
<script src="kit/stagekit.js"></script>
<script src="dna/pairing.js"></script>
<script>
"use strict";

const S = MolLib.SCALE;
const M = MolLib.MOLECULES;
const KEYS = ['adenine','thymine','guanine','cytosine'];

// dna/pairing.js works in the record's own ångströms; registered specs are in
// display units. Unscale going in — the module answers in whatever units it
// was given (the molgraph/hbond contract).
const un = s => ({ ...s, atoms:s.atoms.map(a=>({el:a.el,pos:a.pos.map(v=>v/S)})) });

/* DROP `view:` WHEN BUILDING. buildMolecule bakes a spec's view rotation into
 * the atom meshes even at center:false, and VIEW.flatRing tilts a flat ring
 * ~96° out of its own plane — which renders the pair edge-on AND desyncs the
 * mesh from the coordinates dna/pairing.js solved against. This page IS the
 * flat view, so the molecular plane stays the plane. */
const flat = s => ({ ...s, view:null });

const L = Lesson.create(document.getElementById('gl'), {
  cam:{ theta:0, phi:1.5708, r:34 }, rMax:160,
  // NO ORBIT — the drag moves a molecule, and the pointer is projected onto
  // the z=0 plane the bases live in, which only means anything face-on.
  orbit:false,
  boxes:()=>[{ x:0, y:0, rxz:26, hy:17 }],
  afterFrame:()=>{ placeTags(); placeRulers(); },      // projection reads a matrix refreshed on render
});

// Two bond layers, because opacity is a property of the MATERIAL and the page
// needs to draw two kinds at once: a satisfied pair solid, an incidental
// contact faint. One instance each is cheaper and clearer than per-bond
// materials.
const HBpair = HBond.create(THREE, { color:MolLib.PALETTE.bonds.hbond });
const HBnear = HBond.create(THREE, { color:MolLib.PALETTE.bonds.hbond });
HBnear.material.opacity = 0.28;
L.root.add(HBpair.group); L.root.add(HBnear.group);

/* ---- the four bases ------------------------------------------------------ */
// Row centres. Each pair is laid out along its own row, already turned the
// right way round — see setStartPose() below for why the angles are solved
// rather than typed.
const ROW = { adenine:[8,9,0], guanine:[8,-9,0] };   // the purines, on the right
const GAP = 21;                                       // centre-to-centre at rest

const bases = KEYS.map(key => {
  const spec = M[key];
  const mol = Stage.buildMolecule(flat(spec), { center:false });
  const h = spec.atoms.filter(a=>a.el!=='H');
  // The heavy-atom centroid in the mesh's own frame: a spec's origin is
  // wherever the source record put atom 0, which is not the middle of
  // anything. Labels and grab-tests both want the middle.
  const centre = h.reduce((v,a)=>v.add(new THREE.Vector3(...a.pos)), new THREE.Vector3())
                  .multiplyScalar(1/h.length);
  // How far the molecule reaches from that centre, so its tag can clear it
  // rather than sitting on top of the atoms.
  const reach = spec.atoms.reduce((r,a)=>
    Math.max(r, new THREE.Vector3(...a.pos).distanceTo(centre)), 0) + 1.1;
  L.root.add(mol);

  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = spec.name;
  document.getElementById('stage').appendChild(tag);

  return { key, spec, mol, centre, reach, tag, partner:null };
});
const byMol = m => bases.find(b => b.mol === m);
const centreOf = b => b.centre.clone().applyQuaternion(b.mol.quaternion).add(b.mol.position);

/* Put a base's CENTRE at a world point with a given orientation. Everything
 * below places centres, never mesh origins — a spec's origin is wherever the
 * source record left atom 0. */
function placeCentre(b, at, quat){
  b.mol.quaternion.copy(quat);
  b.mol.position.copy(at).sub(b.centre.clone().applyQuaternion(quat));
}

/* ---- starting poses: already turned the right way round -------------------
 * THIS IS NOT A SHAPE PUZZLE. Making the student hunt for the angle turns a
 * chemistry lesson into a jigsaw — the very thing the textbook figure gets
 * wrong — so both pairs start correctly oriented and the interaction is a
 * straight slide. What remains to discover is WHICH bases stick, which is the
 * actual rule.
 *
 * The angles are still solved, not typed. For each pair, dna/pairing.js gives
 * the partner's pose relative to the purine; from that comes the axis, and
 * everything is turned so that axis is horizontal with the pyrimidine on the
 * left and the purine on the right — the orientation every textbook draws.
 *
 * THE AXIS IS N9→N1, NOT CENTROID TO CENTROID. Both put the pair on its side,
 * but only the glycosidic one is a fact about the chemistry: those are the two
 * atoms the sugars attach to, so levelling them is what makes the backbone
 * run straight and what lets the ruler be horizontal while still measuring
 * the real distance. The centroid axis sits 5.3° off it — enough to leave the
 * rung measurement visibly askew, and off in a direction that means nothing. */
function setStartPose(purineKey, pyrimidineKey){
  const a = bases.find(b => b.key === purineKey);
  const p = bases.find(b => b.key === pyrimidineKey);
  const t = latchWorldFrom(a, p, new THREE.Quaternion(), new THREE.Vector3());
  if(!t) return;

  // The glycosidic nitrogens in that solved pose, and the axis between them.
  const gi = k => k.spec.names.indexOf(RULER_N[k.key]);
  const ga = new THREE.Vector3(...a.spec.atoms[gi(a)].pos);
  const gp = new THREE.Vector3(...p.spec.atoms[gi(p)].pos)
    .applyQuaternion(t.quat).add(t.pos);
  const axis = gp.clone().sub(ga);
  // Turn the whole pair so the pyrimidine ends up due LEFT of the purine.
  const R = new THREE.Quaternion().setFromAxisAngle(
    new THREE.Vector3(0,0,1), Math.PI - Math.atan2(axis.y, axis.x));

  const home = new THREE.Vector3(...ROW[purineKey]);
  placeCentre(a, home, R);
  placeCentre(p, home.clone().add(new THREE.Vector3(-GAP,0,0)),
              R.clone().multiply(t.quat));
}

/* ---- poses, solved once per ordered pair --------------------------------- */
// Lazily, and cached: six pairs, and only the ones actually tried get solved.
const poses = {};
function pose(a, b){
  const k = a.key + '>' + b.key;
  if(!(k in poses)){
    const r = Pairing.pairing(un(a.spec), un(b.spec));
    poses[k] = r.ok ? r : null;
  }
  return poses[k];
}

/* Where `b` must sit to pair with `a`, given where `a` actually is. The solve
 * is relative to `a` at the origin, so it composes with a's live transform —
 * pairing is a relationship between two molecules, not a place on stage. */
const latchWorld = (a, b) => latchWorldFrom(a, b, a.mol.quaternion, a.mol.position);

function latchWorldFrom(a, b, aQuat, aPos){
  const p = pose(a, b);
  if(!p) return null;
  const s = un(b.spec);
  const p0 = p.apply(s.atoms[0].pos), p1 = p.apply(s.atoms[1].pos);
  const q0 = s.atoms[0].pos, q1 = s.atoms[1].pos;
  const th = Math.atan2(p1[1]-p0[1], p1[0]-p0[0]) - Math.atan2(q1[1]-q0[1], q1[0]-q0[0]);
  const co = Math.cos(th), si = Math.sin(th);
  const rx = q0[0]*co - q0[1]*si, ry = q0[0]*si + q0[1]*co;
  const local = new THREE.Vector3((p0[0]-rx)*S, (p0[1]-ry)*S, 0);
  const lq = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), th);
  return { pos: local.applyQuaternion(aQuat).add(aPos),
           quat: aQuat.clone().multiply(lq),
           solved: p };
}

// Does a pose actually hold? Every declared bond found, nothing driven into
// anything. Both numbers come from the solver, not from this page.
const holds = p => p && p.count >= 2 && p.clash == null;

/* ---- drag ---------------------------------------------------------------- */
const canvas = document.getElementById('gl');
const plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hit = new THREE.Vector3();
let held = null;
// A latched pair moves as ONE OBJECT. Every base being dragged carries its own
// offset from the pointer, so the pair keeps its internal geometry exactly —
// re-solving or re-snapping it mid-drag would let the bonds jitter.
let dragging = [];

const toWorld = e => {
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX-r.left)/r.width*2-1, -((e.clientY-r.top)/r.height*2-1));
  ray.setFromCamera(ndc, L.camera);
  ray.ray.intersectPlane(plane, hit);
  return hit;
};

function unpair(b){
  if(b.partner){ b.partner.partner = null; b.partner = null; }
}

canvas.addEventListener('pointerdown', e => {
  const w = toWorld(e);
  const near = bases.map(b => ({ b, d:w.distanceTo(centreOf(b)) }))
                    .filter(x => x.d < 7).sort((x,y) => x.d - y.d)[0];
  if(!near) return;
  held = near.b;
  // Grab the whole pair if there is one. Two bases held together by hydrogen
  // bonds ARE one object until something breaks them — double-click to do that.
  const group = held.partner ? [held, held.partner] : [held];
  dragging = group.map(b => ({ b, off:b.mol.position.clone().sub(w) }));
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
});
canvas.addEventListener('pointermove', e => {
  if(!held) return;
  const w = toWorld(e);
  for(const d of dragging){ d.b.mol.position.copy(w).add(d.off); d.b.mol.position.z = 0; }
  tryLatch();
  refresh();
});
// Double-click a pair to pull it apart. Hydrogen bonds are weak — that is most
// of why DNA can be opened and read — but a drag is how the pair gets MOVED,
// so breaking needs its own gesture rather than happening by accident.
canvas.addEventListener('dblclick', e => {
  const w = toWorld(e);
  const near = bases.map(b => ({ b, d:w.distanceTo(centreOf(b)) }))
                    .filter(x => x.d < 7).sort((x,y) => x.d - y.d)[0];
  if(near) unpair(near.b);
  refresh();
});
canvas.addEventListener('pointerup', e => {
  held = null; dragging = [];
  try{ canvas.releasePointerCapture(e.pointerId); }catch(_){}
  refresh();
});

/* THE LATCH. Near the solved pose against ANY other base and it snaps in — but
 * only if that pose is one that holds. A mismatch can be pushed together all
 * day and will not stick, which is the point. */
const LATCH_R = 3.4;
function tryLatch(){
  if(!held || held.partner) return;
  for(const other of bases){
    if(other === held || other.partner) continue;
    // Try it both ways round: the solve is asymmetric in its framing, not in
    // its chemistry, and the student has no idea which base this file happened
    // to solve "from".
    for(const [a, b] of [[other, held], [held, other]]){
      const t = latchWorld(a, b);
      if(!t || !holds(t.solved)) continue;
      if(b.mol.position.distanceTo(t.pos) > LATCH_R) continue;
      // Snap whichever of the two is the one being dragged, so the thing in
      // the student's hand is the thing that clicks into place.
      const move = (b === held) ? b : a;
      const target = (b === held) ? t : latchWorld(b, a);
      if(!target) continue;
      held.partner = other; other.partner = held;
      L.motion.cancel('latch:'+move.key);
      const from = move.mol.position.clone(), fq = move.mol.quaternion.clone();
      L.motion.seq([
        { dur:0.28, ease:'outBack', onUpdate:u=>{
            move.mol.position.lerpVectors(from, target.pos, u);
            THREE.Quaternion.slerp(fq, target.quat, move.mol.quaternion, u);
          }},
        // ONE FLARE PER HYDROGEN BOND, ON THE BOND. Firing a single ring at the
        // molecule's transform origin put it in the middle of a ring system,
        // pointing at nothing — the effect marked "a thing happened here"
        // when what happened was two or three specific bonds forming several
        // ångströms away. Fired after the snap lands, and read from the bonds
        // kit/hbond.js actually finds in the final pose, so two flares mean
        // two bonds and three mean three.
        { call:()=>{
            if(!L.fx) return;
            for(const q of liveBonds()){
              if(q.donor.owner.partner !== q.acceptor.owner) continue;
              L.fx.spawnRing(new THREE.Vector3(
                (q.h[0]+q.p[0])/2, (q.h[1]+q.p[1])/2, (q.h[2]+q.p[2])/2),
                MolLib.PALETTE.bonds.hbond, null, 0.5);
            }
          }},
      ], { tag:'latch:'+move.key });
      return;
    }
  }
}

/* ---- hydrogen bonds, found where the molecules actually are --------------- */
const MAXD = HBond.DEFAULTS.maxDist * S;
function liveBonds(){
  const donors = [], acceptors = [];
  for(const b of bases){
    const moved = { ...b.spec, atoms: b.spec.atoms.map(a=>{
      const v = new THREE.Vector3(...a.pos)
        .applyQuaternion(b.mol.quaternion).add(b.mol.position);
      return { el:a.el, pos:[v.x,v.y,v.z] }; }) };
    const s = HBond.sites(moved, { owner:b });
    donors.push(...s.donors); acceptors.push(...s.acceptors);
  }
  // onePerPair OFF — two bases really do share two or three bonds.
  return HBond.find(donors, acceptors, { maxDist:MAXD, onePerPair:false, order:'best' });
}

/* ---- bonds and tags, from where the molecules actually are --------------- */
function refresh(){
  const live = liveBonds();
  // A bond belongs to the solid layer only if its two owners are a latched
  // pair. Everything else is a real contact that is not a pair — faint, so the
  // two read differently without a word of explanation.
  const isPair = q => q.donor.owner.partner === q.acceptor.owner;
  HBpair.set(live.filter(isPair));
  HBnear.set(live.filter(q => !isPair(q)));
  for(const b of bases) b.tag.classList.toggle('paired', !!b.partner);
}

/* ---- the ruler: how wide a rung is ----------------------------------------
 * THE PAYOFF OF THE WHOLE PAGE. A–T is held by two hydrogen bonds and G–C by
 * three, and the two pairs are still the SAME WIDTH — because each is one wide
 * base plus one narrow one. That constancy is why the ladder has parallel
 * rails, and it is invisible until the two are measured against each other.
 *
 * WHAT IS MEASURED, AND WHY THAT: the distance between the two glycosidic
 * nitrogens — N9 on the purine, N1 on the pyrimidine. Those are the atoms the
 * sugars attach to, so that span IS the rung, and the backbone will hang off
 * exactly those two points in the step that adds one. (The textbook number is
 * usually C1′–C1′, ~10.5 Å; with no sugars yet, the nitrogens they bond to are
 * the honest stand-in, and ~9 Å is the real Watson–Crick value.) The number is
 * measured off the atoms every frame, never typed — CLAUDE.md's rule.
 */
const RULER_N = { adenine:'N9', guanine:'N9', thymine:'N1', cytosine:'N1' };
const glycosidic = b => {
  const i = b.spec.names.indexOf(RULER_N[b.key]);
  return new THREE.Vector3(...b.spec.atoms[i].pos)
    .applyQuaternion(b.mol.quaternion).add(b.mol.position);
};

function makeRuler(){
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color:0x3a342c, transparent:true, opacity:0.8 });
  const bar = new THREE.CylinderGeometry(0.05, 0.05, 1, 6);
  const part = () => { const m = new THREE.Mesh(bar, mat); g.add(m); return m; };
  // dimension line, two end ticks, two extension lines back to the atoms
  const parts = { line:part(), t1:part(), t2:part(), e1:part(), e2:part() };
  const label = document.createElement('div');
  label.className = 'ruler';
  document.getElementById('stage').appendChild(label);
  g.visible = false; label.style.display = 'none';
  return { g, parts, label };
}
const rulers = [makeRuler(), makeRuler()];   // at most two pairs on stage
rulers.forEach(r => L.root.add(r.g));

const _rd = new THREE.Vector3();
const UPY = new THREE.Vector3(0,1,0);
function span(mesh, from, to){
  const d = _rd.subVectors(to, from), len = d.length();
  if(len < 1e-6){ mesh.visible = false; return; }
  mesh.visible = true;
  mesh.position.copy(from).addScaledVector(d, 0.5);
  mesh.quaternion.setFromUnitVectors(UPY, d.clone().normalize());
  mesh.scale.set(1, len, 1);
}

const OFFSET = 3.4;      // how far the dimension line sits off the pair
function placeRulers(){
  const pairs = bases.filter(b => b.partner && b.key < b.partner.key);
  rulers.forEach((r, i) => {
    const p = pairs[i];
    if(!p){ r.g.visible = false; r.label.style.display = 'none'; return; }
    r.g.visible = true; r.label.style.display = '';

    // Purine end first, so the ruler always reads the same way round.
    const pur = RULER_N[p.key] === 'N9' ? p : p.partner;
    const pyr = pur === p ? p.partner : p;
    const A = glycosidic(pur), B = glycosidic(pyr);

    /* A DIMENSION LINE IS HORIZONTAL, FULL STOP. It is a drawing convention,
     * and a measurement that tilts to follow its subject reads as part of the
     * subject. Held level, it reads as an annotation about the subject.
     *
     * This costs nothing here because setStartPose levels the N9→N1 axis
     * itself, so the horizontal span and the true separation are the same
     * number — the ruler is not projecting anything away. It is drawn under
     * the pair, below the lowest atom, so it cannot cross what it measures.
     */
    const heavy = [p, p.partner].flatMap(x => x.spec.atoms
      .filter(at => at.el !== 'H')
      .map(at => new THREE.Vector3(...at.pos)
        .applyQuaternion(x.mol.quaternion).add(x.mol.position)));
    // Below the lowest atom AND below the name tags, which hang under each
    // molecule in PIXELS — so the clearance is converted, not guessed, and it
    // survives a zoom or a resize instead of colliding at some other size.
    const tagPx = 30;
    const y0 = Math.min(...heavy.map(v => v.y)) - tagPx * L.worldPerPx() - 1.4;
    const a2 = new THREE.Vector3(A.x, y0, 0), b2 = new THREE.Vector3(B.x, y0, 0);

    span(r.parts.line, a2, b2);
    span(r.parts.e1, A, a2);
    span(r.parts.e2, B, b2);
    const tick = new THREE.Vector3(0, 0.42, 0);
    span(r.parts.t1, a2.clone().sub(tick), a2.clone().add(tick));
    span(r.parts.t2, b2.clone().sub(tick), b2.clone().add(tick));

    // Read the number off the atoms, not off the drawing.
    const rect = canvas.getBoundingClientRect();
    const lm = a2.clone().add(b2).multiplyScalar(0.5).project(L.camera);
    r.label.style.left = ((lm.x*0.5+0.5) * rect.width) + 'px';
    r.label.style.top  = ((-lm.y*0.5+0.5) * rect.height) + 'px';
    r.label.textContent = (A.distanceTo(B) / S).toFixed(1) + ' Å';
  });
}

/* ---- name tags, pinned to their molecules -------------------------------- */
// In afterFrame, never frame: Vector3.project reads a matrix refreshed only on
// render, so a tag positioned before it is pinned to the previous frame.
const _v = new THREE.Vector3(), _lo = new THREE.Vector3();
/* Hang the tag under the molecule's LOWEST ATOM, not under a radius drawn
 * about its centre. `reach` is the distance to the furthest atom in any
 * direction, so on a wide flat base it is much larger than the drop to the
 * bottom edge — the tag ended up level with the ruler and sat on the line. */
function lowestOf(b){
  let best = null;
  for(const a of b.spec.atoms){
    _lo.set(...a.pos).applyQuaternion(b.mol.quaternion).add(b.mol.position);
    if(!best || _lo.y < best.y) best = _lo.clone();
  }
  return best;
}
function placeTags(){
  const r = canvas.getBoundingClientRect();
  for(const b of bases){
    const lo = lowestOf(b);
    _v.copy(centreOf(b)).project(L.camera);
    const x = (_v.x*0.5+0.5) * r.width;
    _v.copy(lo).project(L.camera);
    b.tag.style.left = x + 'px';
    b.tag.style.top  = ((-_v.y*0.5+0.5) * r.height + 8) + 'px';
  }
}

setStartPose('adenine','thymine');
setStartPose('guanine','cytosine');
refresh();
L.resize(); L.fit(); L.start();
</script>
</body>
</html>
