      const el = document.createElement('div');
      el.className = 'tag end';
      el.textContent = text;
      document.getElementById('stage').appendChild(el);
      ends3.push({ el, res, i });
    }
  }
}
function placeEnds3(){
  const r = canvas.getBoundingClientRect();
  for(const e of ends3){
    const v = spin3World(atNow(e.res, e.i)).project(L.camera);
    e.el.style.left = ((v.x*0.5+0.5) * r.width) + 'px';
    e.el.style.top  = ((-v.y*0.5+0.5) * r.height) + 'px';
  }
}

/* ---- what the step says ---------------------------------------------------- */
function say3(){
  if(!rung3s[1].joined){
    note.innerHTML = 'The rung you built, and a second one below it, lying flat '
      + '— an unwound ladder. Drag the lower rung up: <b>two</b> bonds will '
      + 'form, one down each side, and the rung has to turn for them to reach.';
    return;
  }
  if(!allJoined3()){
    const d = bonds3.map(b => b.d.toFixed(2)).join(' Å and ');
    note.innerHTML = `Two phosphodiester bonds, ${d} Å, one down each side. `
      + 'A third rung is waiting above. Drag it down: the same bond again, and '
      + 'the rails carry on past the join.';
    return;
  }
  // Read from the bonds, and collapsed when they agree: four identical numbers
  // in a row read as a typed claim rather than as four measurements.
  const ds = [...new Set(bonds3.map(b => b.d.toFixed(2)))];
  const d = ds.length === 1 ? `all ${ds[0]} Å` : ds.join(' Å · ') + ' Å';
  note.innerHTML = `Four phosphodiester bonds, ${d} — the same condensation `
    + 'every time. Each side is now sugar–phosphate–sugar–phosphate–sugar, with the '
    + 'bases hanging inward. <b>And the two sides point opposite ways</b>: one '
    + "rail's 3′ end is level with the other's 5′. That is what antiparallel "
    + 'means, and it is why the strands can be read as templates for each other. '
    + '<b>Drag to turn it.</b>';
}

/* ---- drag: a molecule moves, the paper turns ------------------------------- */
let held3 = null, off3 = null, turn3 = null;
/* ONE GESTURE, ONE MEANING — and which meaning it carries is decided by whether
 * the backbone is joined. Before the join the drag places the rung, and nothing
 * turns: a press that missed the rung would silently spin the model instead of
 * moving the thing the step is about. After the join there is nothing left to
 * place, so the same drag turns the duplex and the two bonds can be looked at
 * from off the side-on view they are drawn in. */
// The rung on offer: the one that is on stage and not yet joined. Nothing is
// on offer between the joins, and then the drag turns the ladder instead.
const openRung = () => loose3.find(r => !r.joined && r.mol.visible);
function down3(e){
  const open = openRung();
  if(!open){ turn3 = { x:e.clientX, y:e.clientY }; return; }
  const w = toWorld(e);
  if(flatDist(w, rungCentre(open)) > 12) return;
  held3 = open;
  off3 = held3.mol.position.clone().sub(toSpin3(w));
}
function move3(e){
  if(turn3){
    // Pixels to radians, and the vertical CLAMPED for step 2's reason: past a
    // quarter turn the duplex is end-on and the two rungs sit behind each other
    // again, which is the one view this step exists to get out of.
    euler3.y += (e.clientX - turn3.x) * 0.008;
    euler3.x = Math.max(-0.7, Math.min(0.7,
      euler3.x + (e.clientY - turn3.y) * 0.008));
    turn3 = { x:e.clientX, y:e.clientY };
    applySpin3();
    placeTags3();
    return;
  }
  if(!held3) return;
  held3.mol.position.copy(toSpin3(toWorld(e))).add(off3);
  placeSticks();
  tryLinkRungs();
}
// worldToLocal already walks the whole parent chain, so this converts once.
// Composing it with G3's own inverse applied the rotation twice and sent the
// rung further away the harder it was pulled.
const toSpin3 = w => SPIN3.worldToLocal(w.clone());
/* IN WORLD SPACE. Box3.expandByObject works off world matrices, so the box is
 * already placed — adding the rung's own position again double-counted it, and
 * the lower rung's hit test and tag both pointed at the upper one. */
function rungCentre(rung){
  const box = new THREE.Box3();
  for(const res of rung.res) box.expandByObject(res.mol);
  return box.getCenter(new THREE.Vector3());
}

// Bigger than step 2's, because the thing being placed is bigger: a whole rung
// half-covering its target still reads as "there", and asking for five units on
// an object twenty across is asking for precision the gesture does not have.
const LATCH3 = 9;
function tryLinkRungs(){
  if(!held3) return;
  const rung = held3;
  if(flatDist(spin3World(rung.mol.position), spin3World(rung.home)) > LATCH3) return;
  const from = rung.mol.position.clone();
  held3 = null;
  L.motion.seq([
    // The slide and the wind-up are ONE motion: the rung arrives already turned,
    // so the bonds form on the crystal's geometry and nothing snaps afterwards.
    { dur:0.42, ease:'outBack',
      onUpdate:u=>{ rung.mol.position.lerpVectors(from, rung.home, u);
                    setTwist3(rung, Math.min(1, u)); placeSticks(); } },
    { call:()=>{ setTwist3(rung, 1); linkRungs(rung); } },
  ], { tag:'link3' });
}

function placeTags3(){
  const r = canvas.getBoundingClientRect();
  for(const rung of rung3s){
    if(rung.tag.style.display === 'none') continue;
    let lo = null;
    for(const res of rung.res) for(const a of res.spec.atoms){
      const v = spin3World(new THREE.Vector3(...a.pos)
        .applyQuaternion(res.mol.quaternion).add(res.mol.position)
        .add(rung.mol.position));
      if(!lo || v.y < lo.y) lo = v;
    }
    const c = rungCentre(rung).project(L.camera);
    const b = lo.project(L.camera);
    rung.tag.style.left = ((c.x*0.5+0.5) * r.width) + 'px';
    rung.tag.style.top  = ((-b.y*0.5+0.5) * r.height + 8) + 'px';
  }
  placeEnds3();
}

/* ---- coming in from step 2 --------------------------------------------------
 * Step 2 leaves a rung face-on; this step reads side-on. Cutting between the
 * two makes them look like different objects, so the view TURNS: the same rung
 * the student just built rolls onto its side, and only then does the second one
 * arrive from below. The order is the argument — this is the rung you made, and
 * here is another one to join it to.
 *
 * The start angle is face-on solved rather than typed: the view already carries
 * TILT3 off edge-on, so a quarter turn less that tilt is the face.
 */
const ENTER_X = Math.PI / 2 - TILT3;
// Where the centring left the group. The entry borrows it and gives it back.
const g3y0 = G3.position.y;
function enter3(){
  const rung = rung3s[1];
  L.motion.cancel('link3');
  L.motion.cancel('rung');
  for(const r of loose3){
    r.mol.position.copy(r.staged);
    r.mol.visible = false;
    r.tag.style.display = 'none';
    setTwist3(r, 0);
  }
  enter3u = 0;
  pivot3.copy(PIVOT_RUNG1);
  euler3.set(ENTER_X, 0, 0);
  applySpin3();
  // Further down the SCREEN, which is what SPIN3's world walk converts: the
  // rung has to come from off the bottom of the frame, not off some axis of
  // the crystal's.
  SPIN3.updateMatrixWorld(true);
  const far = offStage(rung);
  /* AND THE RUNG STARTS WHERE STEP 2 LEFT IT. The two steps centre on different
   * things — step 2 on its assembly, step 3 on the finished duplex — so the
   * same rung sits about 70 px lower here, and the step opened with a lurch.
   * The group is offset to cancel that, and the offset is eased out as the
   * lower rung arrives, which is when the frame is opening anyway. */
  const dy = (() => {
    G3.position.y = g3y0;
    G3.updateMatrixWorld(true);
    const box = new THREE.Box3();
    for(const res of rung3s[0].res) box.expandByObject(res.mol);
    return spinToWorld(assemblyCentre()).y - box.getCenter(new THREE.Vector3()).y;
  })();
  G3.position.y = g3y0 + dy;
  L.motion.seq([
    { dur:0.8, ease:'inOutCubic',
      onUpdate:u=>{ euler3.x = ENTER_X * (1 - u); applySpin3(); } },
    { call:()=>{ pivot3.copy(PIVOT_DUPLEX); applySpin3();
                 rung.mol.visible = true; rung.tag.style.display = ''; } },
    { dur:0.55, ease:'outCubic',
      onUpdate:u=>{ rung.mol.position.lerpVectors(far, rung.staged, u);
                    G3.position.y = g3y0 + dy * (1 - u);
                    enter3u = u; L.fit(); } },
  ], { tag:'enter3' });
}

/* Further along the SCREEN from where the rung waits, which is what SPIN3's
 * world walk converts: a rung comes from off the edge of the frame, not off
 * some axis of the crystal's. */
function offStage(rung){
  SPIN3.updateMatrixWorld(true);
  return SPIN3.worldToLocal(SPIN3.localToWorld(rung.staged.clone())
    .add(new THREE.Vector3(0, AWAY * rung.dir, 0)));
}

/* THE THIRD RUNG, after the first join. Same gesture, the other way up: a
 * backbone is not two nucleotides, and joining the second one is where the
 * student sees the rails carry on rather than the join being a one-off. */
/* WHERE THE VIEW GOES WHEN THE THIRD RUNG ARRIVES. Chosen at the stage, in the
 * browser, the way every default rotation on this page is: the rails stop
 * overlapping and the two backbones read as two. Solving it from the phosphates
 * put the model at a mathematically equal view that read worse. The pitch is at
 * the drag's own clamp, so the student can turn away from this and back. */
const RUNG3_VIEW = { y:-1.053, x:-0.700 };
function enterRung(rung){
  rung.mol.position.copy(offStage(rung));
  rung.mol.visible = true;
  setTwist3(rung, 0);
  const far = rung.mol.position.clone();
  // The turn runs UNDER the arrival, so the student sees one thing happen.
  const y0 = euler3.y, x0 = euler3.x;
  L.motion.seq([
    { dur:0.35 },
    { call:()=>{ rung.tag.style.display = ''; } },
    { dur:0.8, ease:'inOutCubic',
      onUpdate:u=>{ rung.mol.position.lerpVectors(far, rung.staged, Math.min(1, u * 1.25));
                    euler3.y = y0 + (RUNG3_VIEW.y - y0) * u;
                    euler3.x = x0 + (RUNG3_VIEW.x - x0) * u;
                    applySpin3(); L.fit(); } },
  ], { tag:'rung' });
}

setStartPose('adenine','thymine');
setStartPose('guanine','cytosine');
/* =============================================================================
 *  THE STEPS
 * =============================================================================
 *  One stage, one camera, two scenes so far. Each step owns a THREE.Group and
 *  whatever DOM belongs to it; switching hides one set and shows the other,
 *  then refits the camera — the two are very different sizes (four loose bases
 *  against a 40 Å duplex), so a shared frame would waste the stage on one and
 *  crop the other.
 *
 *  Steps 2 and 3 are listed and disabled rather than hidden. A nav that grows
 *  as the lesson is built tells the student what this page is FOR — the base
 *  pair is not the destination — and tells the next person working on it what
 *  the shape of the thing is.
 */
const STEPS = [
  { n:1, title:'A pair holds', sub:'hydrogen bonds', ready:true },
  { n:2, title:'The nucleotide', sub:'sugar + phosphate', ready:true },
  { n:3, title:'The backbone', sub:'joined by dehydration', ready:true },
  // The winding animation this used to hold is whole in
  // tests/ladder-helix-test.html. What the lesson does with it is open: a
  // student who has just built a backbone is not yet asking about grooves.
  { n:4, title:'Ladder to helix', sub:'where grooves come from', ready:false },
];

function showStep(n){
  step = n;
  G1.visible = (n === 1);
  G2.visible = (n === 2);
  G3.visible = (n === 3);
  // DOM that belongs to step 1 has to be hidden by hand — it is not in the
  // scene graph, so nothing else is going to hide it.
  for(const b of bases) b.tag.style.display = (n === 1) ? '' : 'none';
  for(const r of rulers) r.label.style.display = 'none';
  for(const p of Object.values(nucleo).concat(loose))
    p.tag.style.display = (n === 2) ? '' : 'none';
  note.classList.toggle('on', n === 2 || n === 3);
  if(n !== 2 && spinning) stopSpin();
  for(const rung of rung3s) rung.tag.style.display = 'none';
  // The entry only replays from the top. Coming back to a half-built ladder
  // restores what is on stage instead: replaying would unjoin the first rung.
  if(n === 3 && !rung3s[1].joined) enter3();
  else {
    L.motion.cancel('enter3'); enter3u = 1; G3.position.y = g3y0;
    if(n === 3) for(const r of loose3){
      r.mol.visible = true;
      r.tag.style.display = r.joined ? 'none' : '';
    }
  }
  for(const e of ends3) e.el.style.display = (n === 3) ? '' : 'none';
  if(n === 3) say3();
  if(n === 2){ pairBonds(); say(nucleo.adenine); }
  L.fit();
  for(const b of [...document.querySelectorAll('#steps button')])
    b.setAttribute('aria-current', String(+b.dataset.n === n));
}

const navEl = document.getElementById('steps');
for(const st of STEPS){
  const b = document.createElement('button');
  b.dataset.n = st.n;
  b.disabled = !st.ready;
  b.innerHTML = `<span class="n">${st.n}</span><span>${st.title}`
    + `<br><span style="font-weight:400;font-size:11px;opacity:.75">`
    + `${st.ready ? st.sub : 'not built yet'}</span></span>`;
  b.onclick = () => showStep(st.n);
  navEl.appendChild(b);
}

/* STEP 3 WAITS FOR STEP 2. It opens on the rung the student built turning onto
 * its side, which says nothing to someone who has not built one. */
function syncNav(){
  for(const b of document.querySelectorAll('#steps button'))
    if(+b.dataset.n === 3) b.disabled = loose.length > 0;
}
syncNav();

refresh();
showStep(1);
L.resize(); L.fit(); L.start();
</script>
</body>
