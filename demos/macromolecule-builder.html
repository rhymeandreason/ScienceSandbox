<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building a macromolecule — the peptide bond</title>

<!-- ===================================================================
     A BARE STAGE, FOUR MONOMERS, NO PANEL. The student pushes them
     together and finds out what happens. The gesture is dna-lab.html
     step 1's, and so is the reason for it: nothing refuses a drag and
     nothing is greyed out, so the rule is discovered rather than
     announced.

     THREE CARDS, AND THE SHARED PART IS THE SPINE, NOT THE POINT. All
     three join by dehydration synthesis, and meeting that three times
     is what makes the classes one page. But the water is the lesson
     only on the first card. The protein card is about SEQUENCE and
     direction; the carbohydrate card is about the monomer NOT
     determining the polymer; the fat card is the control, and it is
     the one that makes the other two mean something.

     PROTEIN. A residue joins by its carboxyl to the next one's amino
     group. Push two amino ends together and nothing happens — there is
     no reaction there. Once a residue has spent its carboxyl it cannot
     spend it again, so a chain grows one way, and that direction (N to
     C) is not a rule the page states: it is what is left after the
     chemistry. Four DIFFERENT monomers, so the chain has a sequence.

     CARBOHYDRATE. One monomer, repeated, so the chain has no sequence
     at all — only a shape. And the shape is not the monomer's: the same
     glucose gives cellulose or starch depending on which anomer it is.
     Beta-1,4 comes out at a HALF TURN per residue, and a half turn is a
     straight flat ribbon, so a cellulose chain lies down on the tabletop
     and keeps going. Alpha-1,4 is a sixth of a turn, and the chain
     climbs off the plane at the fourth sugar. You can eat one of them.

     NOTHING HERE TYPES A POSE, and the two cards do not get theirs the
     same way. A peptide bond is CONSTRUCTED (macromolecule/peptide.js):
     the amide N goes where the departing hydroxyl O was, at the bond's
     own length, and the one number that leaves free, omega, is asserted
     trans. A glycosidic bond cannot be — its two torsions are what
     decide the polymer's shape and neither has a value it must take —
     so it is READ (macromolecule/glycosidic.js) off the disaccharide the
     library already carries, whose phi/psi were solved against the helix
     the real polymer forms.

     FAT. Three ester bonds onto one glycerol, and then it stops. Nothing
     can attach to a tail, so there is no chain and no sequence — a fat
     is not a polymer, and the stage does that rather than the page
     asserting it. The other three classes are chains BECAUSE their
     monomers have two usable ends; this one has a backbone with three
     slots and no way out. Which is also why the ester's bridge oxygen
     is glycerol's and not the acid's: taken the other way round it
     builds a bond one atom out and renders as a perfectly good ester.
     Three tails, all the same one, and a switch says which: what a
     tail's shape does to a stack of them is the second claim this card
     makes, and neither pure state is reachable off a stage holding a
     mix. Real fats are mixed, and the note says so.

     THE DRAG IS FLAT; THE MOLECULES ARE NOT. A sugar is a chair and an
     amino acid is sp3 at the alpha carbon. The z = 0 plane is the
     tabletop the pointer works on, not a claim about what lies on it —
     which is exactly why a cellulose chain STAYING in it means
     something.
     =================================================================== -->

<style>
  /* No side panel: the stage is the whole page. */
  #app{grid-template-columns:1fr}
  #stage{grid-column:1}

  /* A residue's name, pinned to the molecule it belongs to every frame. */
  .tag{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,0);
    font-family:var(--font-slab);font-size:13px;letter-spacing:.4px;color:var(--ink);
    background:rgba(255,255,255,.66);border-radius:7px;padding:2px 9px;white-space:nowrap}
  .tag.joined{background:#5a4fbf;color:#fff}

  /* Names the water a condensation releases. Pinned above the molecule and
     fading with it, so the name and the thing it names go together. */
  .leaving{position:absolute;z-index:6;pointer-events:none;
    transform:translate(-50%,-100%);
    font-family:var(--font-slab);font-size:13px;color:var(--ink);
    background:rgba(255,255,255,.72);border-radius:7px;padding:1px 7px;white-space:nowrap}

  /* The running commentary, bottom-centre. */
  #note{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    z-index:7;max-width:min(560px,72vw);text-align:center;
    font-family:var(--font-sans);font-size:13.5px;line-height:1.45;color:var(--ink);
    background:var(--paper);padding:8px 18px;border-radius:9px}
  #note b{font-weight:600}

  /* The chain so far, top-centre. Empty until there is one. */
  #seq{position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:7;
    display:none;text-align:center}
  #seq.low{top:64px}
  #seq .label{font-family:var(--font-slab);font-weight:700;font-size:10.5px;
    letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
  #seq .chain{font-family:var(--font-marker);font-size:26px;line-height:1.2;margin-top:1px}
  #seq .ends{font-family:var(--font-slab);font-size:12px;color:var(--muted)}

  /* Which class is on the stage. A rail down the left, out of the way of the
     molecules, the same shape dna-lab's step nav takes. */
  #cards{position:absolute;left:20px;top:50%;transform:translateY(-50%);z-index:7;
    display:flex;flex-direction:column;gap:9px}
  #cards button{display:flex;align-items:center;gap:10px;cursor:pointer;
    font-family:var(--font-sans);font-size:12.5px;font-weight:600;text-align:left;
    padding:8px 13px 8px 9px;border-radius:10px;width:186px;
    border:2px solid transparent;background:transparent;color:var(--muted)}
  #cards button .n{display:grid;place-items:center;width:21px;height:21px;flex:none;
    border-radius:50%;border:1.5px solid currentColor;
    font-family:var(--font-slab);font-size:11px}
  #cards button .sub{display:block;font-weight:400;font-size:11px;opacity:.8}
  #cards button:hover:not(:disabled){color:var(--ink);background:rgba(0,0,0,.04)}
  #cards button[aria-current="true"]{color:var(--ink);border-color:var(--ink);
    background:rgba(255,255,255,.62)}
  #cards button:disabled{opacity:.38;cursor:default}

  /* THE ONE CHOICE A CARD OFFERS, when it offers one: two near-identical
     monomers, so the control has to look like a pair rather than a setting.
     Both cards that use it put every unit on stage in the chosen form, because
     the point each makes is about a stage of ONE monomer. */
  #choose{position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:7;
    display:none;gap:0;border:2px solid var(--ink);border-radius:9px;overflow:hidden}
  #choose button{cursor:pointer;border:0;background:transparent;color:var(--ink);
    font-family:var(--font-sans);font-size:13px;font-weight:600;padding:7px 15px}
  #choose button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  #reset{position:absolute;right:24px;top:22px;z-index:7;cursor:pointer;
    font-family:var(--font-sans);font-size:13px;font-weight:600;
    padding:7px 14px;border-radius:9px;border:2px solid var(--ink);
    background:transparent;color:var(--ink)}
  #reset:hover{background:rgba(0,0,0,.05)}
</style>

<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <nav id="cards"></nav>
    <div id="choose"></div>
    <div id="seq"><div class="label">the chain</div>
      <div class="chain"></div><div class="ends"></div></div>
    <button id="reset">Start over</button>
    <div id="note"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="lib/palette.js"></script>
<script src="lib/tokens-from-palette.js"></script>
<script src="lib/molecules.js"></script>
<script src="lib/skel.js"></script>
<script src="lib/mol-sugars.js"></script>
<script src="lib/mol-aminoacids.js"></script>
<script src="lib/mol-glycans.js"></script>
<script src="lib/mol-lipids.js"></script>
<script src="lib/mol-small.js"></script>
<script src="lib/scene.js"></script>
<script src="lib/fx.js"></script>
<script src="kit/motion.js"></script>
<script src="kit/stagekit.js"></script>
<script src="chain/frame.js"></script>
<script src="macromolecule/spec.js"></script>
<script src="macromolecule/peptide.js"></script>
<script src="macromolecule/glycosidic.js"></script>
<script src="macromolecule/ester.js"></script>
<script src="macromolecule/plane.js"></script>
<script>
"use strict";

const S = MolLib.SCALE;
const M = MolLib.MOLECULES;

/* peptide.js and glycosidic.js work in angstroms; a registered spec is in
 * display units. `key` rides along because glycosidic.js looks up which
 * disaccharide measures this monomer's linkage, and a spec does not carry the
 * name it is registered under. */
const un = p => ({ ...p.spec, key:p.key,
                   atoms:p.spec.atoms.map(a => ({ el:a.el, pos:a.pos.map(v => v/S) })) });
const unSpec = (spec, key) => ({ ...spec, key,
                   atoms:spec.atoms.map(a => ({ el:a.el, pos:a.pos.map(v => v/S) })) });
const rescale = s => ({ ...s, atoms:s.atoms.map(a => ({ el:a.el, pos:a.pos.map(v => v*S) })) });
/* DROP `view:` WHEN BUILDING. buildMolecule bakes a spec's view rotation into
 * the atom meshes even at center:false, which would desync every mesh from the
 * coordinates the pose was solved against. */
const flat = s => ({ ...s, view:null });

const v3 = a => new THREE.Vector3(a[0]*S, a[1]*S, a[2]*S);

/* The disaccharides glycosidic.js reads its linkage off. Unscaled once: the
 * page never draws them, they are only the record the pose is measured from. */
const DISACC = { cellobiose:unSpec(M.cellobiose, 'cellobiose'),
                 maltose:   unSpec(M.maltose,    'maltose') };

/* =============================================================================
 *  THE CARDS
 * =============================================================================
 *  One class each. Everything about the GESTURE is macromolecule/plane.js's and
 *  is shared; a card supplies only what is about chemistry — which monomers are
 *  on the stage, which two roles react, where the guest lands, and what the
 *  chain it builds is called.
 *
 *  A CARD DOES NOT PICK A SHAPE. The carbohydrate card offers two sugars, not
 *  two shapes: `glycosidic.js` looks the linkage up BY MONOMER, so choosing
 *  alpha-glucose gets starch's bond because that is what alpha-glucose makes.
 */
const CARDS = [
  {
    key:'protein', n:1, title:'Protein', sub:'four different monomers',
    donor:'carboxyl', acceptor:'amino', chains:true,
    /* Proline is deliberately absent: its ring holds the alpha carbon's
     * neighbours in place, so a RIGID pose against most partners overlaps
     * (peptide.js's `clash`). That is a cost of drawing residues as fixed
     * conformers, not chemistry refusing, and meeting it as a refusal would
     * teach the wrong thing. */
    monomers:['glycine', 'alanine', 'serine', 'cysteine'],
    home:{ glycine:[-21, 9], alanine:[-7, -10], serine:[9, 9], cysteine:[22, -10] },
    box:{ x:0, y:0, rxz:32, hy:22 },
    solve:(host, guest) => {
      const r = Peptide.pose(un(host), un(guest));
      return (!r || r.clash) ? null : r;
    },
    label:p => p.spec.name,
    unit:'residue', bond:'peptide bond',
    lead:'Push two of them together. Only one pairing of ends does anything &mdash; '
       + 'find which, and watch what comes off.',
    done:c => `<b>${c.length} residues</b>, joined N to C. Four different monomers, so this `
            + 'chain has a <b>sequence</b> &mdash; and the sequence is the whole of what it does.',
    more:'The chain can only grow at the end that still has its &ndash;COOH.',
  },
  {
    key:'carb', n:2, title:'Carbohydrate', sub:'one monomer, repeated',
    donor:'c1', acceptor:'c4', chains:true,
    // Four of the SAME sugar. That a polymer can be one unit over and over is
    // the difference from the card above, and it is visible before anything is
    // joined: all four tags say the same word.
    monomers:['sugar', 'sugar', 'sugar', 'sugar'],
    choose:{ slot:'sugar', key:'glucose',
             opts:[['glucose','\u03b2-glucose'], ['alphaGlucose','\u03b1-glucose']] },
    home:[[-24, 10], [-9, -11], [7, 10], [23, -11]],
    box:{ x:0, y:0, rxz:38, hy:24 },
    solve:(host, guest) => Glycosidic.pose(un(host), un(guest), DISACC),
    // Every sugar is turned so the chain's OWN plane is the tabletop. Nothing
    // is flattened: alpha-1,4 gets the same treatment and still climbs out.
    start:(spec, key) => new THREE.Quaternion(...Glycosidic.startQuat(unSpec(spec, key), DISACC)),
    label:p => p.spec.name,
    unit:'sugar', bond:'glycosidic bond',
    lead:'All four are the same sugar. Push two together &mdash; only one of the five '
       + '&ndash;OH groups reacts, and where the chain goes after that is not up to you.',
    done:(c, card) => {
      const L = Glycosidic.LINKAGE[card.monomerKey];
      return `<b>${c.length} sugars</b>, every one identical, joined ${L.config}-${L.link}. `
        + 'No sequence at all &mdash; the only thing this chain has is a <b>shape</b>, '
        + `and it is <b>${L.polymer}</b>'s.`;
    },
    more:(c, card) => Glycosidic.LINKAGE[card.monomerKey].config === 'beta'
      ? 'A half turn per sugar, so the chain is a flat ribbon and stays on the table.'
      : 'A sixth of a turn per sugar. Watch the fourth one leave the plane.',
  },
  {
    /* THE CONTROL. Every other card builds a chain; this one cannot, and that
     * is what it is for. Glycerol declares three roles and no acceptor of its
     * own, so nothing can attach to a tail once it has landed — the reaction
     * stops at three because the molecule runs out of hydroxyls. "Fat is not a
     * polymer" is therefore something the stage does rather than something the
     * page asserts, and it is the sentence that makes the other three cards
     * mean something: they are chains BECAUSE their monomers have two ends. */
    key:'lipid', n:3, title:'Fat', sub:'not a polymer',
    donor:at => at.pose.slot,       // which hydroxyl reacted — three to choose from
    acceptor:'carboxyl',
    chains:false,
    /* THREE TAILS, ALL THE SAME ONE, and the chooser says which. A fat's tails
     * are usually mixed in life, but the claim this card makes is about what a
     * tail's SHAPE does to a stack of them, and a stage carrying two of each
     * can reach neither pure state: there is no all-saturated fat to build. So
     * the contrast becomes a switch, the way the sugar card's anomer is, and
     * the mixing is said in the note rather than half-built on the table.
     *
     * Exactly three, because glycerol takes exactly three. A spare acid left
     * over is a piece the student keeps trying to attach to a molecule that is
     * finished, which reads as the page being broken. */
    monomers:['glycerol', 'acid', 'acid', 'acid'],
    choose:{ slot:'acid', key:'palmitate',
             opts:[['palmitate','saturated'], ['palmitoleate','unsaturated']] },
    // Glycerol in the middle; the acids are 16 carbons long and need room to be
    // dragged without crossing each other on the way in.
    home:[[0, 0], [-36, 21], [-36, -21], [38, 0]],
    box:{ x:0, y:0, rxz:60, hy:40 },

    /* THREE SLOTS, and the nearest one wins. Which hydroxyl a tail lands on is
     * a question about where the student dragged it, so the card tries every
     * role glycerol still has and takes the closest — rather than filling them
     * in a fixed order, which would move a tail somewhere nobody pointed. */
    solve:(host, guest) => {
      const h = un(host);
      let best = null;
      for(const slot of Ester.slots(h)){
        const r = Ester.pose(h, un(guest), slot);
        if(!r) continue;
        const where = v3(r.pos).applyQuaternion(host.mol.quaternion).add(host.mol.position);
        // Compared in the plane, for plane.js's reason: the tail is dragged on
        // the tabletop and two of the three slots sit well off it, so a 3D
        // distance would rank the slots by how far out of the plane they are
        // rather than by where the student pointed.
        const d = Math.hypot(guest.mol.position.x - where.x,
                             guest.mol.position.y - where.y);
        if(!best || d < best.d) best = { r, d };
      }
      return best && best.r;
    },

    label:p => p.spec.name,
    unit:'tail', bond:'ester bond',
    lead:'One glycerol, three fatty acids. Only the &ndash;COOH end reacts, and glycerol '
       + 'has exactly three places to put one. Fill them.',
    done:(c, card) => {
      const tails = c.filter(p => p.key !== 'glycerol');
      const kind = card.monomerKey === 'palmitate'
        ? 'every tail saturated &mdash; straight chains that stack against each other, '
          + 'which is what makes a fat solid at room temperature'
        : 'every tail unsaturated &mdash; each cis kink stops the chains packing, '
          + 'which is what keeps an oil liquid';
      return tails.length < 3
        ? `Glycerol has ${3 - tails.length} hydroxyl${3-tails.length>1?'s':''} left.`
        : `<b>A fat.</b> Three tails, and glycerol is out of hydroxyls &mdash; nothing `
          + `can attach to a tail, so this is where it stops. No chain, no sequence: ${kind}. `
          + `Switch the tails above. (A real fat usually carries a mix of the two.)`;
    },
    more:(c, card) => card.done(c, card),
  },
];
let card = CARDS[0];

/* ---- stage ---------------------------------------------------------------- */
const noteEl  = document.getElementById('note');
const seqEl   = document.getElementById('seq');
const canvas  = document.getElementById('gl');
const stageEl = document.getElementById('stage');

const L = Lesson.create(canvas, {
  cam:{ theta:0, phi:1.5708, r:36 }, rMax:400,
  // NO ORBIT — the pointer is projected onto the z = 0 plane the monomers are
  // dragged on, which only means anything face-on.
  orbit:false,
  boxes:()=>[card.box],
  afterFrame:()=>{ P.placeTags(); placeSticks(); stepWaters(); },
});

/* ---- the sandbox ---------------------------------------------------------- */
const P = MacroPlane.create({
  canvas, camera:L.camera, root:L.root, motion:L.motion, stageEl,
  tagDrop: 10,
  build: spec => Stage.buildMolecule(flat(spec), { center:false }),

  solve: (host, guest) => {
    const r = card.solve(host, guest);
    if(!r) return null;
    // `slot` rides along: it is the only record of WHICH hydroxyl reacted, and
    // the fat card reads it back off the join to spend that one. Dropped here,
    // glycerol spends nothing, never loses a hydroxyl, and takes a fourth tail.
    return { pos:v3(r.pos), quat:new THREE.Quaternion(...r.quat),
             bondAt:v3(r.bondAt), waterAt:v3(r.waterAt), slot:r.slot };
  },

  // `at` is already in world space: plane.js reads the pose off wherever the
  // host ENDED UP, which is not where it was when the pose was solved if the
  // host is the molecule the student dragged.
  onJoin: (host, guest, at) => {
    // Which role each end spent. Glycerol has THREE, so the card answers with
    // the pose rather than a constant: which hydroxyl reacted is a fact about
    // the join, not about the class.
    const donor = roleOf(card.donor, at), acceptor = roleOf(card.acceptor, at);
    host.spent.add(donor); guest.spent.add(acceptor);
    respec(host); respec(guest);
    stick(host, guest, donor, acceptor);
    if(L.fx) L.fx.condense(at.bondAt, at.waterAt, { size:1.1 });
    water(at.waterAt, 'out');
    say();
  },

  /* HYDROLYSIS, and it is the condensation run backwards rather than an undo.
   * The bond goes, the atoms that left come back, and a water is consumed to
   * put them there — which is the half of the reaction a textbook draws as an
   * afterthought and is the whole reason a cell can take a polymer apart. */
  onBreak: (a, b) => {
    // The stick remembers which roles this particular bond spent, which is the
    // only record of it: `a` may have spent two others as well.
    const i = sticks.findIndex(s => s.host === a && s.guest === b);
    if(i >= 0){
      a.spent.delete(sticks[i].donor); b.spent.delete(sticks[i].acceptor);
      L.root.remove(sticks[i].m); sticks.splice(i, 1);
    }
    respec(a); respec(b);
    const mid = P.centreOf(a).lerp(P.centreOf(b), 0.5);
    if(L.fx) L.fx.spawnRing(mid, MolLib.PALETTE.bonds.condense, null, 0.6);
    water(mid, 'in');
  },

  onMove: say,
});

/* A piece's spec is DERIVED from the one it started as, every time, minus the
 * leaving atoms of whichever roles it has spent. Editing the spec in place
 * would work for the join and leave nothing to restore on the way back: the
 * atoms are only recoverable while something still remembers them. */
function respec(p){
  const base = un({ spec:p.base, key:p.key });
  const drop = [...p.spent].flatMap(k => MacroSpec.role(base, k).leaves);
  P.rebuild(p, rescale(MacroSpec.strip(base, drop)));
}

/* ---- the bonds, drawn between two meshes ----------------------------------
 * The chain is NOT rebuilt into one spec. Each unit keeps its own mesh and the
 * new bond is a stick between them, so a join costs one stick instead of
 * re-triangulating everything already on stage, and the chain stays a chain
 * rather than becoming one rigid object.
 *
 * The two atoms are named by the ROLES, not by index: `strip` renumbered both
 * specs the moment the bond formed. */
const stickGeo = new THREE.CylinderGeometry(0.13*S, 0.13*S, 1, 10);
const sticks = [];
const roleOf = (r, at) => (typeof r === 'function' ? r(at) : r);
function stick(host, guest, donor, acceptor){
  const m = new THREE.Mesh(stickGeo, new THREE.MeshStandardMaterial(
    { color:MolLib.PALETTE.bonds.condense, roughness:.5 }));
  L.root.add(m);
  sticks.push({ m, host, guest, donor, acceptor });
  placeSticks();
}
const _d = new THREE.Vector3(), _up = new THREE.Vector3(0,1,0);
function placeSticks(){
  for(const s of sticks){
    const from = P.atomAt(s.host,  MacroSpec.role(un(s.host),  s.donor).keep);
    const to   = P.atomAt(s.guest, MacroSpec.role(un(s.guest), s.acceptor).keep);
    const d = _d.subVectors(to, from), len = d.length();
    s.m.position.copy(from).addScaledVector(d, 0.5);
    s.m.quaternion.setFromUnitVectors(_up, d.clone().normalize());
    s.m.scale.set(1, len, 1);
  }
}

/* ---- the water ------------------------------------------------------------ */
const WATER_LIFE = 2.4;
const waters = [];
function water(at, way){
  const mol = Stage.buildMolecule(flat(M.water), { center:true });
  mol.position.copy(at);
  const mats = [];
  mol.traverse(o => { if(o.material){ o.material.transparent = true; mats.push(o.material); } });
  L.root.add(mol);
  const el = document.createElement('div');
  el.className = 'leaving';
  el.textContent = M.water.formula;
  stageEl.appendChild(el);
  waters.push({ mol, mats, el, at:at.clone(), way:way||'out', born:performance.now() });
}
const _w = new THREE.Vector3();
function stepWaters(){
  const r = canvas.getBoundingClientRect(), now = performance.now();
  for(let i = waters.length - 1; i >= 0; i--){
    const w = waters[i];
    const u = (now - w.born) / 1000 / WATER_LIFE;
    if(u >= 1){ dropWater(i); continue; }
    // Straight up and out of the way: the chain is what the student is looking
    // at, and a water drifting across it is the thing they would follow. A
    // hydrolysis runs the same path inwards, because it is the same water.
    const t = w.way === 'in' ? 1 - u : u;
    w.mol.position.copy(w.at).addScaledVector(_up, t * 7);
    const fade = w.way === 'in' ? u * u : 1 - u * u;
    for(const m of w.mats) m.opacity = fade;
    w.el.style.opacity = fade;
    _w.copy(w.mol.position).project(L.camera);
    w.el.style.left = ((_w.x*0.5+0.5) * r.width) + 'px';
    w.el.style.top  = ((-_w.y*0.5+0.5) * r.height - 6) + 'px';
  }
}
function dropWater(i){
  const w = waters[i];
  L.root.remove(w.mol); w.el.remove();
  w.mol.traverse(o => { if(o.geometry) o.geometry.dispose(); });
  waters.splice(i, 1);
}

/* ---- what the page says ---------------------------------------------------
 * Read off the pieces every time, never accumulated: a count that is added to
 * on each join is a number that survives a reset it did not hear about. */
function chain(){
  // A fat is not a chain: three tails hang off one glycerol and none of them
  // joins another. The card says so rather than this function guessing.
  if(!card.chains) return P.links.length ? P.pieces.filter(
    p => P.links.some(l => l.a === p || l.b === p)) : [];
  // The chain starts at the unit that has not spent its ACCEPTOR — the
  // N-terminus, or the sugar whose C4 is still free.
  const starts = P.pieces.filter(p => MacroSpec.free(un(p), card.acceptor));
  for(const s of starts){
    const out = [s];
    for(;;){
      const nxt = P.links.find(l => l.a === out[out.length-1]);
      if(!nxt) break;
      out.push(nxt.b);
    }
    if(out.length > 1) return out;
  }
  return [];
}

function say(){
  const c = chain();
  for(const p of P.pieces) p.tag.classList.toggle('joined', c.includes(p));
  if(c.length < 2){
    seqEl.style.display = 'none';
    noteEl.innerHTML = card.lead;
    return;
  }
  // The sequence card is for things that HAVE a sequence. A fat has three
  // tails on one backbone and no order at all, so printing them in a row would
  // invent the one property this card exists to say it does not have.
  seqEl.style.display = card.chains ? '' : 'none';
  if(card.chains){
    seqEl.classList.toggle('low', !!card.choose);
    seqEl.querySelector('.chain').textContent =
      c.map(p => p.spec.res || p.spec.short || p.spec.name).join(' – ');
    seqEl.querySelector('.ends').textContent =
      card.key === 'protein' ? 'N-terminus → C-terminus' : 'non-reducing end → reducing end';
  }
  const n = c.length - 1;
  const tail = P.pieces.length > c.length
    ? (typeof card.more === 'function' ? card.more(c, card) : card.more)
    : (typeof card.done === 'function' ? card.done(c, card) : card.done);
  noteEl.innerHTML = `<b>${n} ${card.bond}${n>1?'s':''}</b>, `
    + `<b>${n} water${n>1?'s':''}</b> gone. ` + tail;
}

/* ---- pointer -------------------------------------------------------------- */
canvas.addEventListener('pointerdown', e => P.down(e));
canvas.addEventListener('pointermove', e => P.move(e));
canvas.addEventListener('pointerup',   e => { P.up(e); say(); });
// Double-click to hydrolyse: a drag is how a chain gets MOVED, so breaking a
// bond needs its own gesture rather than happening by accident.
canvas.addEventListener('dblclick', e => {
  const n = P.nearest(P.toWorld(e));
  if(n) P.breakAt(n.p);
  say();
});

/* ---- laying a card out ----------------------------------------------------
 * Everything on stage is torn down and rebuilt, because a card is a different
 * set of molecules and a different reaction. Leaving pieces behind is how a
 * half-built protein ends up being offered a sugar. */
function clearStage(){
  for(const s of sticks) L.root.remove(s.m);
  sticks.length = 0;
  for(let i = waters.length - 1; i >= 0; i--) dropWater(i);
  for(const p of P.pieces){
    L.root.remove(p.mol);
    p.mol.traverse(o => { if(o.geometry) o.geometry.dispose(); });
    p.tag.remove();
  }
  P.pieces.length = 0; P.links.length = 0;
}

function layOut(){
  clearStage();
  // The chooser's pick fills every slot named for it; anything else on the
  // stage is itself. Glycerol is not a fatty acid and does not become one.
  if(card.choose) card.monomerKey = card.monomerKey || card.choose.key;
  card.monomers.forEach((name, i) => {
    const key = card.choose && name === card.choose.slot ? card.monomerKey : name;
    const spec = M[key];
    const quat = card.start ? card.start(spec, key) : new THREE.Quaternion();
    const c = P.centroid(spec).applyQuaternion(quat);
    const at = Array.isArray(card.home) ? card.home[i] : card.home[name];
    const p = P.add(spec, new THREE.Vector3(at[0] - c.x, at[1] - c.y, -c.z), quat,
                    { key, base:spec, spent:new Set() });
    p.tag.textContent = card.label(p);
  });
  chooseEl.style.display = card.choose ? 'flex' : 'none';
  chooseEl.innerHTML = '';
  for(const [key, label] of (card.choose ? card.choose.opts : [])){
    const b = document.createElement('button');
    b.dataset.key = key; b.innerHTML = label;
    b.setAttribute('aria-pressed', String(key === card.monomerKey));
    b.addEventListener('click', () => { card.monomerKey = key; layOut(); });
    chooseEl.appendChild(b);
  }
  say();
  L.fit();
}

/* ---- the card rail --------------------------------------------------------- */
const cardsEl  = document.getElementById('cards');
const chooseEl = document.getElementById('choose');
for(const c of CARDS){
  const b = document.createElement('button');
  b.innerHTML = `<span class="n">${c.n}</span><span>${c.title}`
              + `<span class="sub">${c.sub}</span></span>`;
  b.addEventListener('click', () => { card = c; syncRail(); layOut(); });
  b.dataset.key = c.key;
  cardsEl.appendChild(b);
}
function syncRail(){
  for(const b of cardsEl.children)
    b.setAttribute('aria-current', String(b.dataset.key === card.key));
}
document.getElementById('reset').addEventListener('click', layOut);

syncRail();
layOut();
L.start();
</script>
