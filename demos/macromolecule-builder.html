<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building a macromolecule — the peptide bond</title>

<!-- ===================================================================
     A BARE STAGE, FOUR MONOMERS, NO PANEL. The student pushes them
     together and finds out what happens. The gesture is dna-lab.html
     step 1's, and so is the reason for it: nothing refuses a drag and
     nothing is greyed out, so the rule is discovered rather than
     announced.

     THREE CARDS, AND THE SHARED PART IS THE SPINE, NOT THE POINT. All
     three join by dehydration synthesis, and meeting that three times
     is what makes the classes one page. But the water is the lesson
     only on the first card. The protein card is about SEQUENCE and
     direction; the carbohydrate card is about the monomer NOT
     determining the polymer; the fat card is the control, and it is
     the one that makes the other two mean something.

     PROTEIN. A residue joins by its carboxyl to the next one's amino
     group. Push two amino ends together and nothing happens — there is
     no reaction there. Once a residue has spent its carboxyl it cannot
     spend it again, so a chain grows one way, and that direction (N to
     C) is not a rule the page states: it is what is left after the
     chemistry. Four DIFFERENT monomers, so the chain has a sequence.

     CARBOHYDRATE. One monomer, repeated, so the chain has no sequence
     at all — only a shape. And the shape is not the monomer's: the same
     glucose gives cellulose or starch depending on which anomer it is.
     Beta-1,4 comes out at a HALF TURN per residue, and a half turn is a
     straight flat ribbon, so a cellulose chain lies down on the tabletop
     and keeps going. Alpha-1,4 is a sixth of a turn, and the chain
     climbs off the plane at the fourth sugar. You can eat one of them.

     NOTHING HERE TYPES A POSE, and the two cards do not get theirs the
     same way. A peptide bond is CONSTRUCTED (macromolecule/peptide.js):
     the amide N goes where the departing hydroxyl O was, at the bond's
     own length, and the one number that leaves free, omega, is asserted
     trans. A glycosidic bond cannot be — its two torsions are what
     decide the polymer's shape and neither has a value it must take —
     so it is READ (macromolecule/glycosidic.js) off the disaccharide the
     library already carries, whose phi/psi were solved against the helix
     the real polymer forms.

     FAT. Three ester bonds onto one glycerol, and then it stops. Nothing
     can attach to a tail, so there is no chain and no sequence — a fat
     is not a polymer, and the stage does that rather than the page
     asserting it. The other three classes are chains BECAUSE their
     monomers have two usable ends; this one has a backbone with three
     slots and no way out. Which is also why the ester's bridge oxygen
     is glycerol's and not the acid's: taken the other way round it
     builds a bond one atom out and renders as a perfectly good ester.
     Three tails, all the same one, and a switch says which: what a
     tail's shape does to a stack of them is the second claim this card
     makes, and neither pure state is reachable off a stage holding a
     mix. Real fats are mixed, and the note says so.

     WHICH CARDS GET A DIAGRAM, and it is a claim rather than a display
     setting. Cellulose earns one: repeating beta-1,4 puts every residue
     centroid in a plane to 0.00 A, so the flat drawing IS the molecule,
     and the round reveal only adds depth the reader already believes.
     A peptide does not. An extended strand is pleated — the alpha
     carbons alternate 0.8 A either side of the backbone plane and the
     side chains alternate 2.0 A — and flattening it would say the side
     chains are coplanar with the backbone. They are not, and that a
     strand has two faces is the thing sheets are built out of. So the
     protein card is the real geometry throughout.

     THE DRAG IS FLAT; THE MOLECULES ARE NOT. A sugar is a chair and an
     amino acid is sp3 at the alpha carbon. The z = 0 plane is the
     tabletop the pointer works on, not a claim about what lies on it —
     which is exactly why a cellulose chain STAYING in it means
     something.
     =================================================================== -->

<style>
  /* No side panel: the stage is the whole page. */
  #app{grid-template-columns:1fr}
  #stage{grid-column:1}

  /* A residue's name, pinned to the molecule it belongs to every frame. */
  .tag{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,0);
    font-family:var(--font-slab);font-size:13px;letter-spacing:.4px;color:var(--ink);
    background:rgba(255,255,255,.66);border-radius:7px;padding:2px 9px;white-space:nowrap}

  /* Names the water a condensation releases. Pinned above the molecule and
     fading with it, so the name and the thing it names go together. */
  .leaving{position:absolute;z-index:6;pointer-events:none;
    transform:translate(-50%,-100%);
    font-family:var(--font-slab);font-size:13px;color:var(--ink);
    background:rgba(255,255,255,.72);border-radius:7px;padding:1px 7px;white-space:nowrap}

  /* The running commentary, bottom-centre. */
  #note{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    z-index:7;max-width:min(560px,72vw);text-align:center;
    font-family:var(--font-sans);font-size:13.5px;line-height:1.45;color:var(--ink);
    background:var(--paper);padding:8px 18px;border-radius:9px}
  #note b{font-weight:600}

  /* The chain so far, top-centre. Empty until there is one. */
  #seq{position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:7;
    display:none;text-align:center}
  #seq.low{top:64px}
  #seq .label{font-family:var(--font-slab);font-weight:700;font-size:10.5px;
    letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
  #seq .chain{font-family:var(--font-marker);font-size:26px;line-height:1.2;margin-top:1px}
  #seq .ends{font-family:var(--font-slab);font-size:12px;color:var(--muted)}

  /* Which class is on the stage. A rail down the left, out of the way of the
     molecules, the same shape dna-lab's step nav takes. */
  #cards{position:absolute;left:20px;top:50%;transform:translateY(-50%);z-index:7;
    display:flex;flex-direction:column;gap:9px}
  #cards button{display:flex;align-items:center;gap:10px;cursor:pointer;
    font-family:var(--font-sans);font-size:12.5px;font-weight:600;text-align:left;
    padding:8px 13px 8px 9px;border-radius:10px;width:186px;
    border:2px solid transparent;background:transparent;color:var(--muted)}
  #cards button .n{display:grid;place-items:center;width:21px;height:21px;flex:none;
    border-radius:50%;border:1.5px solid currentColor;
    font-family:var(--font-slab);font-size:11px}
  #cards button .sub{display:block;font-weight:400;font-size:11px;opacity:.8}
  #cards button:hover:not(:disabled){color:var(--ink);background:rgba(0,0,0,.04)}
  #cards button[aria-current="true"]{color:var(--ink);border-color:var(--ink);
    background:rgba(255,255,255,.62)}
  #cards button:disabled{opacity:.38;cursor:default}

  /* THE ONE CHOICE A CARD OFFERS, when it offers one: two near-identical
     monomers, so the control has to look like a pair rather than a setting.
     Both cards that use it put every unit on stage in the chosen form, because
     the point each makes is about a stage of ONE monomer. */
  #choose{position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:7;
    display:none;gap:0;border:2px solid var(--ink);border-radius:9px;overflow:hidden}
  #choose button{cursor:pointer;border:0;background:transparent;color:var(--ink);
    font-family:var(--font-sans);font-size:13px;font-weight:600;padding:7px 15px}
  #choose button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  /* The reveal. Appears only when the fat is finished, because before that
     there is nothing to look at that the layout does not already show. */
  #dim3d{position:absolute;right:24px;top:66px;z-index:7;display:none;cursor:pointer;
    font-family:var(--font-sans);font-size:13px;font-weight:600;
    padding:7px 14px;border-radius:9px;border:2px solid var(--ink);
    background:var(--ink);color:var(--paper)}
  #dim3d.on{display:block}

  #reset{position:absolute;right:24px;top:22px;z-index:7;cursor:pointer;
    font-family:var(--font-sans);font-size:13px;font-weight:600;
    padding:7px 14px;border-radius:9px;border:2px solid var(--ink);
    background:transparent;color:var(--ink)}
  #reset:hover{background:rgba(0,0,0,.05)}

<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <nav id="cards"></nav>
    <div id="choose"></div>
    <div id="seq"><div class="label">the chain</div>
      <div class="chain"></div><div class="ends"></div></div>
    <button id="reset">Start over</button>
    <button id="dim3d">See it in 3D</button>
    <div id="note"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="lib/palette.js"></script>
<script src="lib/tokens-from-palette.js"></script>
<script src="lib/molecules.js"></script>
<script src="lib/skel.js"></script>
<script src="lib/mol-sugars.js"></script>
<script src="lib/mol-aminoacids.js"></script>
<script src="lib/mol-glycans.js"></script>
<script src="lib/mol-lipids.js"></script>
<script src="lib/mol-small.js"></script>
<script src="lib/scene.js"></script>
<script src="lib/fx.js"></script>
<script src="kit/motion.js"></script>
<script src="kit/stagekit.js"></script>
<script src="chain/frame.js"></script>
<script src="macromolecule/spec.js"></script>
<script src="macromolecule/peptide.js"></script>
<script src="macromolecule/glycosidic.js"></script>
<script src="macromolecule/ester.js"></script>
<script src="macromolecule/flat.js"></script>
<script src="macromolecule/plane.js"></script>
<script>
"use strict";

const S = MolLib.SCALE;
const M = MolLib.MOLECULES;

/* peptide.js and glycosidic.js work in angstroms; a registered spec is in
 * display units. `key` rides along because glycosidic.js looks up which
 * disaccharide measures this monomer's linkage, and a spec does not carry the
 * name it is registered under. */
const un = p => ({ ...p.spec, key:p.key,
                   atoms:p.spec.atoms.map(a => ({ el:a.el, pos:a.pos.map(v => v/S) })) });
const unSpec = (spec, key) => ({ ...spec, key,
                   atoms:spec.atoms.map(a => ({ el:a.el, pos:a.pos.map(v => v/S) })) });
const rescale = s => ({ ...s, atoms:s.atoms.map(a => ({ el:a.el, pos:a.pos.map(v => v*S) })) });
/* DROP `view:` WHEN BUILDING. buildMolecule bakes a spec's view rotation into
 * the atom meshes even at center:false, which would desync every mesh from the
 * coordinates the pose was solved against. */
const flat = s => ({ ...s, view:null });

const v3 = a => new THREE.Vector3(a[0]*S, a[1]*S, a[2]*S);

/* The disaccharides glycosidic.js reads its linkage off. Unscaled once: the
 * page never draws them, they are only the record the pose is measured from. */
const DISACC = { cellobiose:unSpec(M.cellobiose, 'cellobiose'),
                 maltose:   unSpec(M.maltose,    'maltose') };

/* =============================================================================
 *  THE CARDS
 * =============================================================================
 *  One class each. Everything about the GESTURE is macromolecule/plane.js's and
 *  is shared; a card supplies only what is about chemistry — which monomers are
 *  on the stage, which two roles react, where the guest lands, and what the
 *  chain it builds is called.
 *
 *  A CARD DOES NOT PICK A SHAPE. The carbohydrate card offers two sugars, not
 *  two shapes: `glycosidic.js` looks the linkage up BY MONOMER, so choosing
 *  alpha-glucose gets starch's bond because that is what alpha-glucose makes.
 */
/* WHICH LAYOUT THE STAGE IS IN. 'flat' is the tabletop the dragging happens
 * on and the only state a card without `flat:true` is ever in; '3d' is the
 * reveal, where the molecule is its own coordinates and nothing can be built.
 * A card that is not flat is permanently in 'flat', which costs it nothing:
 * its specs are already the model's. */
let dim = 'flat';

const CARDS = [
  {
    key:'protein', n:1, title:'Protein', sub:'four different monomers',
    donor:'carboxyl', acceptor:'amino', chains:true,
    /* Proline is deliberately absent: its ring holds the alpha carbon's
     * neighbours in place, so a RIGID pose against most partners overlaps
     * (peptide.js's `clash`). That is a cost of drawing residues as fixed
     * conformers, not chemistry refusing, and meeting it as a refusal would
     * teach the wrong thing. */
    monomers:['glycine', 'alanine', 'serine', 'cysteine'],
    home:{ glycine:[-21, 9], alanine:[-7, -10], serine:[9, 9], cysteine:[22, -10] },
    box:{ x:0, y:0, rxz:32, hy:22 },
    /* NO FLAT LAYOUT ON THIS CARD, and it is a claim rather than a setting.
     *
     * Cellulose earns the diagram: repeating beta-1,4 puts every residue
     * centroid in one plane to 0.00 A, so drawing it flat is drawing what it
     * is. A peptide does not. An extended strand is PLEATED — measured on this
     * chain, the alpha carbons alternate 0.8 A either side of the backbone
     * plane and the side chains alternate 2.0 A, a 4 A swing. Flattening that
     * says the side chains are coplanar with the backbone, which is false and
     * is exactly the property that matters: a strand has two faces, alternating
     * residues point at different things, and that is how sheets pack.
     *
     * It also happens to be what made an arbitrary sequence collide in 2D. The
     * round build does not: with omega, phi and psi all set, the backbone is
     * sequence-INDEPENDENT, and all 24 orderings of these four residues come
     * out at the same 2.16 A closest contact and the same 10.38 A span. So the
     * student keeps free rein over the order, which is the point of the card. */
    poseIn:(h, g) => Peptide.pose(h, g),
    flat:false,
    solve:(host, guest) => {
      const r = card.poseIn(un(host), un(guest), null, dim === '3d');
      return (!r || r.clash) ? null : r;
    },
    label:p => p.spec.name,
    unit:'residue', bond:'peptide bond',
    lead:'Push two of them together. Only one pairing of ends does anything &mdash; '
       + 'find which, and watch what comes off.',
    round:'The build was a diagram, flat and square-cornered. Every alpha carbon '
        + 'is sp3, and the peptide bond itself is the flat part &mdash; the unit '
        + 'that cannot twist, which is what leaves the chain only two angles per '
        + 'residue to fold with.',
    done:c => `<b>${c.length} residues</b>, joined N to C. Four different monomers, so this `
            + 'chain has a <b>sequence</b> &mdash; and the sequence is the whole of what it does.',
    more:'The chain can only grow at the end that still has its &ndash;COOH.',
  },
  {
    key:'carb', n:2, title:'Carbohydrate', sub:'one monomer, repeated',
    donor:'c1', acceptor:'c4', chains:true,
    // Four of the SAME sugar. That a polymer can be one unit over and over is
    // the difference from the card above, and it is visible before anything is
    // joined: all four tags say the same word.
    monomers:['sugar', 'sugar', 'sugar', 'sugar'],
    choose:{ slot:'sugar', key:'glucose',
             opts:[['glucose','\u03b2-glucose'], ['alphaGlucose','\u03b1-glucose']] },
    home:[[-24, 10], [-9, -11], [7, 10], [23, -11]],
    // Sized for the FINISHED chain, not for the four sugars as dealt: four of
    // them joined run about 41 units down the page, and a box that only covers
    // the deal would have to refit halfway through the build — moving the
    // tabletop out from under the hand still working on it.
    box:{ x:0, y:-4, rxz:42, hy:30 },
    poseIn:(h, g, slot, round) => round ? Glycosidic.pose(h, g, DISACC)
                                        : MacroFlat.glycosidic(h, g),
    flat:true,
    solve:(host, guest) => card.poseIn(un(host), un(guest), null, dim === '3d'),
    // Every sugar is turned so the chain's OWN plane is the tabletop. Nothing
    // is flattened: alpha-1,4 gets the same treatment and still climbs out.
    // Turns each sugar so the CHAIN's own plane is the tabletop — a 3D framing,
    // and meaningless against a layout that is already in the plane.
    start:(spec, key) => dim === 'flat' ? new THREE.Quaternion()
      : new THREE.Quaternion(...Glycosidic.startQuat(unSpec(spec, key), DISACC)),
    label:p => p.spec.name,
    unit:'sugar', bond:'glycosidic bond',
    lead:'All four are the same sugar. Push two together &mdash; only one of the five '
       + '&ndash;OH groups reacts, and where the chain goes after that is not up to you.',
    done:(c, card) => {
      const L = Glycosidic.LINKAGE[card.monomerKey];
      return `<b>${c.length} sugars</b>, every one identical, joined ${L.config}-${L.link}. `
        + 'No sequence at all &mdash; the only thing this chain has is a <b>shape</b>, '
        + `and it is <b>${L.polymer}</b>'s.`;
    },
    round:'Now the linkage decides. Beta-1,4 is a half turn per sugar, so the '
        + 'chain lies flat and keeps going &mdash; cellulose. Alpha-1,4 is a '
        + 'sixth of a turn, and the chain climbs off the page into a helix. The '
        + 'diagram could not tell you that: it drew both the same.',
    more:(c, card) => Glycosidic.LINKAGE[card.monomerKey].config === 'beta'
      ? 'A half turn per sugar, so the chain is a flat ribbon and stays on the table.'
      : 'A sixth of a turn per sugar. Watch the fourth one leave the plane.',
  },
  {
    /* THE CONTROL. Every other card builds a chain; this one cannot, and that
     * is what it is for. Glycerol declares three roles and no acceptor of its
     * own, so nothing can attach to a tail once it has landed — the reaction
     * stops at three because the molecule runs out of hydroxyls. "Fat is not a
     * polymer" is therefore something the stage does rather than something the
     * page asserts, and it is the sentence that makes the other three cards
     * mean something: they are chains BECAUSE their monomers have two ends. */
    key:'lipid', n:3, title:'Fat', sub:'not a polymer',
    donor:at => at.pose.slot,       // which hydroxyl reacted — three to choose from
    acceptor:'carboxyl',
    chains:false,
    /* BUILT IN THE DIAGRAM, THEN LOOKED AT. Glycerol's three hydroxyls point
     * three ways in space, so two of the esters want their tail well out of the
     * z = 0 plane the pointer works on and no amount of aiming reaches them.
     * The build happens in the flat layout (macromolecule/flat.js) and the real
     * pose is what the reveal morphs to — the same move molecule-builder.html
     * makes, for the same reason. Only glycerol is laid out: both acids are
     * already idealised zigzags at z = 0. */
    flat:true,
    /* THREE TAILS, ALL THE SAME ONE, and the chooser says which. A fat's tails
     * are usually mixed in life, but the claim this card makes is about what a
     * tail's SHAPE does to a stack of them, and a stage carrying two of each
     * can reach neither pure state: there is no all-saturated fat to build. So
     * the contrast becomes a switch, the way the sugar card's anomer is, and
     * the mixing is said in the note rather than half-built on the table.
     *
     * Exactly three, because glycerol takes exactly three. A spare acid left
     * over is a piece the student keeps trying to attach to a molecule that is
     * finished, which reads as the page being broken. */
    monomers:['glycerol', 'acid', 'acid', 'acid'],
    choose:{ slot:'acid', key:'palmitate',
             opts:[['palmitate','saturated'], ['palmitoleate','unsaturated']] },
    // Glycerol in the middle; the acids are 16 carbons long and need room to be
    // dragged without crossing each other on the way in.
    home:[[0, 0], [-36, 21], [-36, -21], [38, 0]],
    box:{ x:0, y:0, rxz:60, hy:40 },

    /* THREE SLOTS, and the nearest one wins. Which hydroxyl a tail lands on is
     * a question about where the student dragged it, so the card tries every
     * role glycerol still has and takes the closest — rather than filling them
     * in a fixed order, which would move a tail somewhere nobody pointed. */
    poseIn:(h, g, slot, round) => round ? Ester.pose(h, g, slot) : MacroFlat.pose(h, g, slot),
    solve:(host, guest) => {
      const h = un(host), g = un(guest);
      // Where the tail's carboxyl carbon IS. Every slot is ranked by how far
      // that atom would have to travel, for plane.js's reason: the acid's
      // origin is eight angstroms down its own chain and ranking by it hands
      // back a pose for a hydroxyl nobody pointed at.
      // No free carboxyl, no reaction — and asking where one is would throw.
      // Both orderings reach here, so `guest` is routinely glycerol itself.
      const head = MacroSpec.free(g, 'carboxyl');
      if(!head) return null;
      const now = P.atomAt(guest, head.keep);
      let best = null;
      for(const slot of Ester.slots(h)){
        const r = card.poseIn(h, g, slot, dim === '3d');
        if(!r) continue;
        const where = v3(r.at).applyQuaternion(new THREE.Quaternion(...r.quat))
          .add(v3(r.pos)).applyQuaternion(host.mol.quaternion).add(host.mol.position);
        // Compared in the plane, for plane.js's reason: the tail is dragged on
        // the tabletop and two of the three slots sit well off it, so a 3D
        // distance would rank the slots by how far out of the plane they are
        // rather than by where the student pointed.
        const d = Math.hypot(now.x - where.x, now.y - where.y);
        if(!best || d < best.d) best = { r, d };
      }
      return best && best.r;
    },

    label:p => p.spec.name,
    unit:'tail', bond:'ester bond',
    round:'The build was a diagram: flat backbone, 120&deg; corners. Glycerol is '
        + 'sp3 at every carbon, so the three tails leave the page in three '
        + 'directions &mdash; which is why a fat packs the way it does.',
    lead:'One glycerol, three fatty acids. Only the &ndash;COOH end reacts, and glycerol '
       + 'has exactly three places to put one. Fill them.',
    done:(c, card) => {
      const tails = c.filter(p => p.key !== 'glycerol');
      const kind = card.monomerKey === 'palmitate'
        ? 'every tail saturated &mdash; straight chains that stack against each other, '
          + 'which is what makes a fat solid at room temperature'
        : 'every tail unsaturated &mdash; each cis kink stops the chains packing, '
          + 'which is what keeps an oil liquid';
      return tails.length < 3
        ? `Glycerol has ${3 - tails.length} hydroxyl${3-tails.length>1?'s':''} left.`
        : `<b>A fat.</b> Three tails, and glycerol is out of hydroxyls &mdash; nothing `
          + `can attach to a tail, so this is where it stops. No chain, no sequence: ${kind}. `
          + `Switch the tails above. (A real fat usually carries a mix of the two.)`;
    },
    more:(c, card) => card.done(c, card),
  },
];
let card = CARDS[0];

/* ---- stage ---------------------------------------------------------------- */
const noteEl  = document.getElementById('note');
const seqEl   = document.getElementById('seq');
const canvas  = document.getElementById('gl');
const stageEl = document.getElementById('stage');

const L = Lesson.create(canvas, {
  cam:{ theta:0, phi:1.5708, r:36 }, rMax:400,
  // NO ORBIT — the pointer is projected onto the z = 0 plane the monomers are
  // dragged on, which only means anything face-on.
  orbit:false,
  /* THE CARD'S BOX FRAMES THE DEAL, THE MOLECULE FRAMES ITSELF. The box is
   * where the monomers are laid out, which is the right frame while they are
   * still separate pieces. A chain is bigger than the deal — four sugars run
   * off the bottom of it — and the round molecule is a different size again, so
   * as soon as anything has joined the stage frames what is actually on it. */
  boxes:()=>{
    /* THE CARD'S BOX IS THE WHOLE FLAT BUILD, not just the deal — it is sized
     * for the finished molecule, so the camera never moves while the student is
     * working. A stage that reframes on every join moves the tabletop out from
     * under the hand that is still on it. Only the round view is framed to its
     * content, because the molecule that arrives there is a different size and
     * nobody is holding it. */
    if(dim !== '3d') return [card.box];
    /* IN WORLD SPACE, atom by atom, because that is what the camera sees: the
     * root carries both the turn and the shift that keeps the molecule centred
     * under it, and a box measured before those puts the fit an offset away
     * from the thing it is framing. Fit is called when something lands, not
     * every frame, so a box that grows with the turn costs nothing. */
    const b = new THREE.Box3(), w = new THREE.Vector3();
    for(const p of P.pieces)
      for(let i = 0; i < p.spec.atoms.length; i++)
        b.expandByPoint(L.root.localToWorld(w.copy(P.atomAt(p, i))));
    if(b.isEmpty()) return [card.box];
    const c = b.getCenter(new THREE.Vector3()), sz = b.getSize(new THREE.Vector3());
    // Margin, because a box is measured to atom CENTRES and an atom is drawn
    // with a radius — and a tail that ends exactly at the frame edge reads as
    // cut off rather than as finished.
    return [{ x:c.x, y:c.y, rxz:Math.max(sz.x, sz.z)/2 + 7, hy:sz.y/2 + 7 }];
  },
  // A slow turn once it is round, because a still three-quarter view of a
  // molecule reads as another drawing. Only there: the flat build is a plane
  // the pointer is projected onto, and turning it would put the two out of step.
  afterFrame:()=>{ if(dim === '3d' && !morphing && !turning){ L.root.rotation.y += 0.0022; repivot(); }
                   P.placeTags(); placeSticks(); stepWaters();
                   stepHalos(performance.now() / 1000); },
});

/* ---- the sandbox ---------------------------------------------------------- */
const P = MacroPlane.create({
  canvas, camera:L.camera, root:L.root, motion:L.motion, stageEl,
  tagDrop: 10,
  build: spec => Stage.buildMolecule(flat(spec), { center:false }),
  // Every rebuild — a join, a hydrolysis, the reveal — redraws the mesh, so the
  // halos are put back by the same hand rather than being restored by callers.
  onRebuild: p => dressHalos(p),

  solve: (host, guest) => {
    const r = card.solve(host, guest);
    if(!r) return null;
    // `slot` rides along: it is the only record of WHICH hydroxyl reacted, and
    // the fat card reads it back off the join to spend that one. Dropped here,
    // glycerol spends nothing, never loses a hydroxyl, and takes a fourth tail.
    return { pos:v3(r.pos), quat:new THREE.Quaternion(...r.quat),
             bondAt:v3(r.bondAt), waterAt:v3(r.waterAt), slot:r.slot,
             // Where the bond forms on the guest, so plane.js can measure the
             // latch there instead of at an origin that may be nowhere near it.
             at:r.at && v3(r.at) };
  },

  // `at` is already in world space: plane.js reads the pose off wherever the
  // host ENDED UP, which is not where it was when the pose was solved if the
  // host is the molecule the student dragged.
  onJoin: (host, guest, at) => {
    // Which role each end spent. Glycerol has THREE, so the card answers with
    // the pose rather than a constant: which hydroxyl reacted is a fact about
    // the join, not about the class.
    const donor = roleOf(card.donor, at), acceptor = roleOf(card.acceptor, at);
    host.spent.add(donor); guest.spent.add(acceptor);
    // A bond can change an atom that does NOT leave: an amide nitrogen goes
    // from sp3 to sp2 and its surviving H moves into the peptide plane. The
    // solver says so, and the move is carried on the piece rather than applied
    // here, because respec() rebuilds from `base` on every reveal and would
    // otherwise put the free amino acid's hydrogen back.
    if(at.pose && at.pose.amideH){
      const n = un(guest).names;
      guest.moved = { name:n[at.pose.amideH.index], pos:at.pose.amideH.pos };
    }
    respec(host); respec(guest);
    stick(host, guest, donor, acceptor);
    if(L.fx) L.fx.condense(at.bondAt, at.waterAt, { size:1.1 });
    water(at.waterAt, 'out');
    say();
  },

  /* HYDROLYSIS, and it is the condensation run backwards rather than an undo.
   * The bond goes, the atoms that left come back, and a water is consumed to
   * put them there — which is the half of the reaction a textbook draws as an
   * afterthought and is the whole reason a cell can take a polymer apart. */
  onBreak: (a, b) => {
    // The stick remembers which roles this particular bond spent, which is the
    // only record of it: `a` may have spent two others as well.
    const i = sticks.findIndex(s => s.host === a && s.guest === b);
    if(i >= 0){
      a.spent.delete(sticks[i].donor); b.spent.delete(sticks[i].acceptor);
      L.root.remove(sticks[i].m); sticks.splice(i, 1);
    }
    // Hydrolysis un-flattens the nitrogen too: it is sp3 again, and its H goes
    // back where the free amino acid has it. Dropping the override is all that
    // takes, because respec() derives from `base`.
    b.moved = null;
    respec(a); respec(b);
    const mid = P.centreOf(a).lerp(P.centreOf(b), 0.5);
    if(L.fx) L.fx.spawnRing(mid, MolLib.PALETTE.bonds.condense, null, 0.6);
    water(mid, 'in');
  },

  onMove: say,
});

/* A piece's spec is DERIVED from the one it started as, every time, minus the
 * leaving atoms of whichever roles it has spent. Editing the spec in place
 * would work for the join and leave nothing to restore on the way back: the
 * atoms are only recoverable while something still remembers them. */
function respec(p){
  P.rebuild(p, rescale(spent3d(p)[dim === 'flat' ? 'flat' : 'real']));
}

/* A piece's spec as it stands, in angstroms, both ways round: what it really
 * is, and the same molecule laid out flat. Derived from `base` every time for
 * respec's reason — the leaving atoms are only recoverable while something
 * still remembers them — and the pair is what the reveal morphs between. */
function spent3d(p){
  const base = un({ spec:p.base, key:p.key });
  const drop = [...p.spent].flatMap(k => MacroSpec.role(base, k).leaves);
  // FLATTEN FIRST, THEN STRIP. A peptide bond takes a whole hydroxyl and a
  // glycosidic bond a whole –OH, so a spent residue has FEWER HEAVY ATOMS than
  // its layout has positions, and flat.js rightly refuses it. Laying the base
  // out and then removing the same atoms gives the same answer and always has
  // one: strip works off the base's own indices either way round.
  const flat = card.flat ? MacroFlat.spec(base) : null;
  // An atom the reaction MOVED rather than removed. Applied to the real
  // geometry only: the flat layout is a diagram, and its nitrogen is drawn
  // where the diagram wants it rather than where the amide plane is.
  const move = t => {
    if(!p.moved) return t;
    const i = (t.names || []).indexOf(p.moved.name);
    if(i < 0) return t;
    const atoms = t.atoms.slice();
    atoms[i] = { el:atoms[i].el, pos:p.moved.pos.slice() };
    return { ...t, atoms };
  };
  return { real: move(MacroSpec.strip(base, drop)),
           flat: flat ? MacroSpec.strip(flat, drop) : move(MacroSpec.strip(base, drop)) };
}

/* ---- the bonds, drawn between two meshes ----------------------------------
 * The chain is NOT rebuilt into one spec. Each unit keeps its own mesh and the
 * new bond is a stick between them, so a join costs one stick instead of
 * re-triangulating everything already on stage, and the chain stays a chain
 * rather than becoming one rigid object.
 *
 * The two atoms are named by the ROLES, not by index: `strip` renumbered both
 * specs the moment the bond formed. */
const stickGeo = new THREE.CylinderGeometry(0.13*S, 0.13*S, 1, 10);
const sticks = [];
const roleOf = (r, at) => (typeof r === 'function' ? r(at) : r);
function stick(host, guest, donor, acceptor){
  const m = new THREE.Mesh(stickGeo, new THREE.MeshStandardMaterial(
    { color:MolLib.PALETTE.bonds.condense, roughness:.5 }));
  L.root.add(m);
  sticks.push({ m, host, guest, donor, acceptor });
  placeSticks();
}
const _d = new THREE.Vector3(), _up = new THREE.Vector3(0,1,0);
function placeSticks(){
  for(const s of sticks){
    const from = P.atomAt(s.host,  MacroSpec.role(un(s.host),  s.donor).keep);
    const to   = P.atomAt(s.guest, MacroSpec.role(un(s.guest), s.acceptor).keep);
    const d = _d.subVectors(to, from), len = d.length();
    s.m.position.copy(from).addScaledVector(d, 0.5);
    s.m.quaternion.setFromUnitVectors(_up, d.clone().normalize());
    s.m.scale.set(1, len, 1);
  }
}

/* ---- the ends that can still react ----------------------------------------
 * A HALO ON EVERY FREE ROLE, which is where covalent-drag.js's ghost slots
 * came from and does the same job: the reactive end is a fact about the
 * molecule, so it is drawn on the molecule rather than explained in the
 * caption. Nothing is greyed out and nothing refuses a drag — the halo says
 * where the chemistry is, and pushing the wrong ends together still does
 * nothing.
 *
 * READ OFF `condense:`, so a spec that gains a role gains a halo and the page
 * is not a second list of which atoms react. A spent role has no halo, which
 * is how glycerol visibly runs out: three, then two, then one, then none, and
 * the molecule is finished without a sentence saying so.
 *
 * The halo is a child of the piece's own group, so it rides every drag and
 * every rebuild without a line of per-frame placement.
 */
const haloGeo = new THREE.SphereGeometry(1, 20, 16);
function dressHalos(p){
  for(const r of (p.spec.condense && p.spec.condense.roles) || []){
    // FREE, not merely declared. A spent role keeps its entry — the atom it
    // kept is still there — and haloing it would leave glycerol claiming three
    // open hydroxyls while holding three tails, which is the one thing this
    // card exists to disprove.
    if(!MacroSpec.free(p.spec, r.key)) continue;
    const a = p.spec.atoms[r.keep];
    // The CONDENSATION colour, not the atom's. Every halo on the stage is the
    // same colour as the bond it would make and as the ring the join throws, so
    // the two ends of one reaction read as one thing — and a carbon's halo does
    // not come out as a grey smudge on a grey chain.
    const m = new THREE.Mesh(haloGeo, new THREE.MeshBasicMaterial({
      color: MolLib.PALETTE.bonds.condense,
      transparent:true, opacity:0.16, depthWrite:false }));
    // A MULTIPLE OF THE ATOM'S OWN DRAWN RADIUS, and NOT scaled by SCALE:
    // buildMolecule draws a sphere at the palette radius as it stands (O is
    // 0.95), while atom POSITIONS are the ones SCALE multiplies. Applying it
    // here too made the halo 1.9x bigger than the number said, which is not
    // visible from the number and was tuned against for two rounds.
    m.scale.setScalar((MolLib.PALETTE.radii[a.el] || 0.7) * 1.7);
    m.position.set(...a.pos);
    m.userData.halo = true;
    p.mol.add(m);
  }
}

/* The halos breathe, and brighten when the partner they would bond to is close
 * enough to be caught — the last thing that happens before a snap, so a student
 * who is nearly there can see that they are nearly there. Gone in the round
 * view: there is nothing left to react, and a glowing shell over a finished
 * molecule is a promise the page cannot keep. */
const _h = new THREE.Vector3(), _o = new THREE.Vector3();
const NEAR = 12;
function stepHalos(t){
  for(const p of P.pieces){
    for(const m of p.mol.children){
      if(!m.userData.halo) continue;
      if(dim !== 'flat'){ m.visible = false; continue; }
      m.visible = true;
      m.getWorldPosition(_h);
      let near = false;
      for(const q of P.pieces){
        if(q === p) continue;
        for(const r of (q.spec.condense && q.spec.condense.roles) || []){
          if(!MacroSpec.free(q.spec, r.key)) continue;
          _o.set(...q.spec.atoms[r.keep].pos)
            .applyQuaternion(q.mol.quaternion).add(q.mol.position);
          if(_h.distanceTo(_o) < NEAR) near = true;
        }
      }
      m.material.opacity = (near ? 0.3 : 0.15) + 0.04 * Math.sin(t * 2.2);
    }
  }
}

/* ---- the water ------------------------------------------------------------ */
const WATER_LIFE = 2.4;
const waters = [];
function water(at, way){
  const mol = Stage.buildMolecule(flat(M.water), { center:true });
  mol.position.copy(at);
  const mats = [];
  mol.traverse(o => { if(o.material){ o.material.transparent = true; mats.push(o.material); } });
  L.root.add(mol);
  const el = document.createElement('div');
  el.className = 'leaving';
  el.textContent = M.water.formula;
  stageEl.appendChild(el);
  waters.push({ mol, mats, el, at:at.clone(), way:way||'out', born:performance.now() });
}
const _w = new THREE.Vector3();
function stepWaters(){
  const r = canvas.getBoundingClientRect(), now = performance.now();
  for(let i = waters.length - 1; i >= 0; i--){
    const w = waters[i];
    const u = (now - w.born) / 1000 / WATER_LIFE;
    if(u >= 1){ dropWater(i); continue; }
    // Straight up and out of the way: the chain is what the student is looking
    // at, and a water drifting across it is the thing they would follow. A
    // hydrolysis runs the same path inwards, because it is the same water.
    const t = w.way === 'in' ? 1 - u : u;
    w.mol.position.copy(w.at).addScaledVector(_up, t * 7);
    const fade = w.way === 'in' ? u * u : 1 - u * u;
    for(const m of w.mats) m.opacity = fade;
    w.el.style.opacity = fade;
    _w.copy(w.mol.position).project(L.camera);
    w.el.style.left = ((_w.x*0.5+0.5) * r.width) + 'px';
    w.el.style.top  = ((-_w.y*0.5+0.5) * r.height - 6) + 'px';
  }
}
function dropWater(i){
  const w = waters[i];
  L.root.remove(w.mol); w.el.remove();
  w.mol.traverse(o => { if(o.geometry) o.geometry.dispose(); });
  waters.splice(i, 1);
}

/* ---- what the page says ---------------------------------------------------
 * Read off the pieces every time, never accumulated: a count that is added to
 * on each join is a number that survives a reset it did not hear about. */
function chain(){
  // A fat is not a chain: three tails hang off one glycerol and none of them
  // joins another. The card says so rather than this function guessing.
  if(!card.chains) return P.links.length ? P.pieces.filter(
    p => P.links.some(l => l.a === p || l.b === p)) : [];
  // The chain starts at the unit that has not spent its ACCEPTOR — the
  // N-terminus, or the sugar whose C4 is still free.
  const starts = P.pieces.filter(p => MacroSpec.free(un(p), card.acceptor));
  for(const s of starts){
    const out = [s];
    for(;;){
      const nxt = P.links.find(l => l.a === out[out.length-1]);
      if(!nxt) break;
      out.push(nxt.b);
    }
    if(out.length > 1) return out;
  }
  return [];
}

function say(){
  const c = chain();
  showReveal(); showTags();
  if(c.length < 2){
    seqEl.style.display = 'none';
    noteEl.innerHTML = card.lead;
    return;
  }
  // The sequence card is for things that HAVE a sequence. A fat has three
  // tails on one backbone and no order at all, so printing them in a row would
  // invent the one property this card exists to say it does not have.
  seqEl.style.display = card.chains ? '' : 'none';
  if(card.chains){
    seqEl.classList.toggle('low', !!card.choose);
    seqEl.querySelector('.chain').textContent =
      c.map(p => p.spec.res || p.spec.short || p.spec.name).join(' – ');
    seqEl.querySelector('.ends').textContent =
      card.key === 'protein' ? 'N-terminus → C-terminus' : 'non-reducing end → reducing end';
  }
  const n = c.length - 1;
  if(dim === '3d'){
    // Each card's own sentence: what the diagram could not show is a different
    // fact for a fat, a chain with a sequence, and a chain with a shape.
    noteEl.innerHTML = '<b>The same molecule, where its atoms really are.</b> '
      + (card.round || '');
    return;
  }
  const tail = P.pieces.length > c.length
    ? (typeof card.more === 'function' ? card.more(c, card) : card.more)
    : (typeof card.done === 'function' ? card.done(c, card) : card.done);
  noteEl.innerHTML = `<b>${n} ${card.bond}${n>1?'s':''}</b>, `
    + `<b>${n} water${n>1?'s':''}</b> gone. ` + tail;
}

/* ---- the reveal -----------------------------------------------------------
 * THE SAME SPHERES, MOVED — molecule-viewer.html's transition, on an assembly
 * instead of one molecule. Nothing is swapped and nothing fades: glycerol's
 * atoms slide from the layout they were built in to where they really are, and
 * each tail rides the pose ester.js solves against the molecule that arrives.
 * A cut between two pictures would let a student believe these are two objects.
 *
 * The tails need no morph of their own. Both acids are idealised all-anti
 * zigzags at z = 0 in the library, so the flat build and the round one draw the
 * SAME tail — only where it is attached changes, which is one rigid move.
 *
 * Building is off while the molecule is round: the pointer means a place on the
 * tabletop, and there is no tabletop once the thing has turned.
 */
const dimBtn = document.getElementById('dim3d');
const SPIN = 0.55;                 // radians the stage turns as it lands
let morphing = false;

/* TURN IT ABOUT ITSELF. The root's origin is where the monomers were dealt,
 * not where the molecule ended up, so turning the root swings the molecule
 * across the stage and out of frame. The pivot is the assembly's own centre,
 * and the root is shifted each frame by however far the turn moved that point —
 * which pins it while everything rotates around it. Nothing has to move: the
 * pieces keep the coordinates the poses put them at. */
const pivot = new THREE.Vector3();
const _pv = new THREE.Vector3();
function repivot(){
  // The molecule's own centre goes to the stage's origin, and the turn happens
  // about it. Two things at once, and the second is why: the tabletop's origin
  // is where the monomers were DEALT, so a chain that grew up and to the left
  // is centred nowhere near it — framed by its box it still sits high, because
  // a box's y is not what the fit centres on.
  _pv.copy(pivot).applyEuler(L.root.rotation);
  L.root.position.copy(_pv).multiplyScalar(-1);
}
function setPivot(){
  const b = new THREE.Box3();
  for(const p of P.pieces)
    for(let i = 0; i < p.spec.atoms.length; i++) b.expandByPoint(P.atomAt(p, i));
  if(!b.isEmpty()) b.getCenter(pivot);
}

/* WALK THE JOINS, DON'T ASSUME A SHAPE. A fat is a hub — one glycerol, three
 * tails — and a protein is a chain, so a reveal written for either one is
 * wrong for the other. Starting from a piece nothing bonded TO, each join is
 * re-solved against the layout being arrived at and composed onto where its
 * host lands: a chain therefore rebuilds itself residue by residue, and the
 * fat falls out as the one-level case of the same walk. */
function walk(round){
  // In the layout being ARRIVED at, and unspent. A flat pose refuses a spec
  // that is not in the plane, so handing it the model would silently drop the
  // join and leave that piece behind in the reveal.
  const asked = p => {
    const b = un({ spec:p.base, key:p.key });
    return round ? b : (MacroFlat.spec(b) || b);
  };
  const guests = new Set(sticks.map(k => k.guest));
  const roots = P.pieces.filter(p => !guests.has(p));
  const at = new Map(), order = [];
  for(const r of roots)
    at.set(r, { pos:r.mol.position.toArray(), quat:r.mol.quaternion.toArray() });
  let left = sticks.slice(), moved = true;
  while(left.length && moved){
    moved = false;
    left = left.filter(k => {
      if(!at.has(k.host)) return true;
      /* SOLVED AGAINST THE UNSPENT PAIR. A pose is built out of the atoms the
       * condensation consumed, so neither end can answer once it has spent
       * them. Legitimate because strip() moves no atom: the survivors sit at
       * the same coordinates in both, so base and residue share a frame. */
      const r = card.poseIn(asked(k.host), asked(k.guest), k.donor, round);
      if(!r) return false;
      at.set(k.guest, MacroPlane.compose(at.get(k.host),
        { pos:v3(r.pos).toArray(), quat:r.quat }));
      order.push(k.guest); moved = true;
      return false;
    });
  }
  return at;
}

/* ---- the reveal -----------------------------------------------------------
 * THE SAME SPHERES, MOVED — molecule-viewer.html's transition, on an assembly
 * instead of one molecule. Nothing is swapped and nothing fades: every atom
 * slides from the layout it was built in to where it really is, which is the
 * only thing that can honestly say the diagram and the model are one molecule.
 *
 * Both halves move. A piece changes SHAPE — glycerol's backbone goes sp3, a
 * residue's alpha hydrogen unfolds from the carbon a diagram hid it in — and
 * it changes PLACE, because the pose it sits at is the round one. The first is
 * a per-atom morph, the second a rigid tween, and they run on one clock.
 *
 * Building is off while the molecule is round: the pointer means a place on the
 * tabletop, and there is no tabletop once the thing has turned.
 */
function reveal(to){
  // The same test the button's visibility uses, asserted here too: everything
  // on the stage is one molecule. A reveal of a half-built one morphs what is
  // joined and leaves the rest lying in a layout the molecule has left.
  if(morphing || sticks.length !== P.pieces.length - 1) return;
  const round = to === '3d';
  const at = walk(round);

  const movers = P.pieces.map(p => {
    const dest = rescale(spent3d(p)[round ? 'real' : 'flat']);
    const meshes = p.mol.userData.atomMeshes;
    const target = at.get(p) ||
      { pos:p.mol.position.toArray(), quat:p.mol.quaternion.toArray() };
    return {
      p, dest, meshes,
      from: meshes.map(m => m && m.position.clone()),
      to:   dest.atoms.map(a => new THREE.Vector3(...a.pos)),
      fromPos:p.mol.position.clone(), fromQuat:p.mol.quaternion.clone(),
      toPos:new THREE.Vector3(...target.pos),
      toQuat:new THREE.Quaternion(...target.quat),
    };
  });

  // Set before the turn starts, from where the pieces are now: a tween that
  // rotates around the old origin swings the molecule across the stage on its
  // way in, which is the same fault as turning it by hand did.
  if(round) setPivot(); else pivot.set(0,0,0);
  const spin0 = L.root.rotation.y, spin1 = round ? SPIN : 0;
  morphing = true;
  const put = u => {
    for(const m of movers){
      m.meshes.forEach((x,i) => { if(x) x.position.lerpVectors(m.from[i], m.to[i], u); });
      // Every bond inside a monomer is a single stick, so it can be re-placed
      // rather than rebuilt. scene.js's placeBond refuses a double bond's
      // group, and that refusal is the check — nothing here has one.
      m.p.mol.userData.bondMeshes.forEach(b => {
        const [i,j] = b.userData.pair;
        if(m.meshes[i] && m.meshes[j])
          Stage.placeBond(b, m.meshes[i].position, m.meshes[j].position);
      });
      m.p.mol.position.lerpVectors(m.fromPos, m.toPos, u);
      THREE.Quaternion.slerp(m.fromQuat, m.toQuat, m.p.mol.quaternion, u);
    }
    L.root.rotation.y = spin0 + (spin1 - spin0) * u;
    repivot();
  };
  const land = () => {
    dim = round ? '3d' : 'flat';
    for(const m of movers){
      // Rebuilt from the spec it landed on, so the assembly stops being a
      // molecule held together by a tween: everything downstream reads spec
      // coordinates.
      P.rebuild(m.p, m.dest);
      m.p.mol.position.copy(m.toPos); m.p.mol.quaternion.copy(m.toQuat);
    }
    // Set, not left where the tween's last frame happened to stop: the idle
    // turn is still running underneath it and would keep whatever it added.
    L.root.rotation.y = spin1;
    if(round) setPivot(); else { L.root.rotation.x = 0; pivot.set(0,0,0); }
    repivot();
    morphing = false;
    say(); L.fit();
  };
  L.motion.seq([{ dur:1.1, ease:'inOutCubic', onUpdate:put }, { call:land }], { tag:'reveal' });
}

dimBtn.addEventListener('click', () => reveal(dim === 'flat' ? '3d' : 'flat'));

/* The reveal is offered when there is something to reveal: glycerol out of
 * hydroxyls, or the stage already turned. Asked before that, it would morph a
 * half-built fat into a pose two of its slots have not taken. */
/* THE NAMES BELONG TO THE BUILD, and one rule owns them because two would
 * drift.
 *
 * Round: no labels at all. The molecule turns and a flat label pinned near it
 * reads as a caption on nothing — and by then the naming is done, because the
 * thing on the stage is one molecule.
 *
 * Flat: only what is still LOOSE. A tag says which monomer is which while the
 * student is choosing what to drag; once a unit has reacted its name is the
 * one thing on screen they no longer need, and the tag sits squarely over the
 * bond that just formed, which is what they were looking at. What the finished
 * molecule IS gets said once, in the readout.
 *
 * Joined is read off the LINKS, not off `chain()`: a second, separate chain is
 * just as joined, and its units would keep their labels if this asked the one
 * chain the readout happens to be describing. */
function showTags(){
  const joined = new Set(P.links.flatMap(l => [l.a, l.b]));
  for(const p of P.pieces)
    p.tag.style.display = (dim === 'flat' && !joined.has(p)) ? '' : 'none';
}

function showReveal(){
  // EVERYTHING ON THE STAGE IS ONE MOLECULE — a chain of four, or a glycerol
  // with all three tails on. Offered before that, the reveal would morph a
  // half-built molecule and leave the loose pieces lying in a layout the rest
  // of the stage has left. Same test either shape: n pieces, n-1 joins.
  // A card with no diagram has nothing to reveal: it is already showing the
  // molecule. Leaving the button up would offer a view the page cannot go to.
  dimBtn.style.display = card.flat ? '' : 'none';
  const whole = card.flat && sticks.length === P.pieces.length - 1;
  dimBtn.classList.toggle('on', !!(whole || dim === '3d'));
  dimBtn.textContent = dim === '3d' ? 'Back to the diagram' : 'See it in 3D';
}

/* ---- pointer -------------------------------------------------------------- */
/* TWO GESTURES, ONE POINTER, AND WHICH ONE IT IS DEPENDS ON THE VIEW. Flat, a
 * drag moves a molecule on the tabletop. Round, there is nothing left to build
 * and nothing to drag on, so the same drag turns the model — which is the only
 * way to see that the tails leave the page in three directions, or that one
 * chain is a ribbon and the other a helix. Turning the ROOT rather than the
 * camera keeps the flat build's projection untouched underneath. */
let turning = null;
canvas.addEventListener('pointerdown', e => {
  if(dim === 'flat'){ P.down(e); return; }
  turning = { x:e.clientX, y:e.clientY };
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
});
canvas.addEventListener('pointermove', e => {
  if(dim === 'flat'){ P.move(e); return; }
  if(!turning) return;
  L.root.rotation.y += (e.clientX - turning.x) * 0.008;
  // Clamped: past a quarter turn the model is being looked at edge-on from
  // above, which reads as a different molecule rather than as the same one.
  L.root.rotation.x = Math.max(-1.2, Math.min(1.2,
    L.root.rotation.x + (e.clientY - turning.y) * 0.008));
  repivot();
  turning = { x:e.clientX, y:e.clientY };
});
canvas.addEventListener('pointerup', e => {
  turning = null;
  if(dim === 'flat'){ P.up(e); say(); }
  try{ canvas.releasePointerCapture(e.pointerId); }catch(_){}
});
// Double-click to hydrolyse: a drag is how a chain gets MOVED, so breaking a
// bond needs its own gesture rather than happening by accident.
canvas.addEventListener('dblclick', e => {
  if(dim !== 'flat') return;
  const n = P.nearest(P.toWorld(e));
  if(n) P.breakAt(n.p);
  say();
});

/* ---- laying a card out ----------------------------------------------------
 * Everything on stage is torn down and rebuilt, because a card is a different
 * set of molecules and a different reaction. Leaving pieces behind is how a
 * half-built protein ends up being offered a sugar. */
function clearStage(){
  for(const s of sticks) L.root.remove(s.m);
  sticks.length = 0;
  for(let i = waters.length - 1; i >= 0; i--) dropWater(i);
  for(const p of P.pieces){
    L.root.remove(p.mol);
    p.mol.traverse(o => { if(o.geometry) o.geometry.dispose(); });
    p.tag.remove();
  }
  P.pieces.length = 0; P.links.length = 0;
}

function layOut(){
  // Whatever the stage was turned to, a new set of molecules starts flat: the
  // pieces are dragged on a tabletop and there is not one in the round view.
  if(L.motion) L.motion.cancel('reveal');
  morphing = false; dim = 'flat';
  L.root.rotation.set(0, 0, 0); L.root.position.set(0, 0, 0);
  clearStage();
  // The chooser's pick fills every slot named for it; anything else on the
  // stage is itself. Glycerol is not a fatty acid and does not become one.
  if(card.choose) card.monomerKey = card.monomerKey || card.choose.key;
  card.monomers.forEach((name, i) => {
    const key = card.choose && name === card.choose.slot ? card.monomerKey : name;
    const spec = M[key];
    // Flat cards are dragged in the layout, not in the molecule. `base` stays
    // the real spec, because that is what the reveal has to get back to.
    const shown = card.flat
      ? rescale(MacroFlat.spec(unSpec(spec, key)) || unSpec(spec, key)) : spec;
    const quat = card.start ? card.start(spec, key) : new THREE.Quaternion();
    const c = P.centroid(shown).applyQuaternion(quat);
    const at = Array.isArray(card.home) ? card.home[i] : card.home[name];
    const p = P.add(shown, new THREE.Vector3(at[0] - c.x, at[1] - c.y, -c.z), quat,
                    { key, base:spec, spent:new Set(), moved:null });
    p.tag.textContent = card.label(p);
  });
  chooseEl.style.display = card.choose ? 'flex' : 'none';
  chooseEl.innerHTML = '';
  for(const [key, label] of (card.choose ? card.choose.opts : [])){
    const b = document.createElement('button');
    b.dataset.key = key; b.innerHTML = label;
    b.setAttribute('aria-pressed', String(key === card.monomerKey));
    b.addEventListener('click', () => { card.monomerKey = key; layOut(); });
    chooseEl.appendChild(b);
  }
  say();
  L.fit();
}

/* ---- the card rail --------------------------------------------------------- */
const cardsEl  = document.getElementById('cards');
const chooseEl = document.getElementById('choose');
for(const c of CARDS){
  const b = document.createElement('button');
  b.innerHTML = `<span class="n">${c.n}</span><span>${c.title}`
              + `<span class="sub">${c.sub}</span></span>`;
  b.addEventListener('click', () => { card = c; syncRail(); layOut(); });
  b.dataset.key = c.key;
  cardsEl.appendChild(b);
}
function syncRail(){
  for(const b of cardsEl.children)
    b.setAttribute('aria-current', String(b.dataset.key === card.key));
}
document.getElementById('reset').addEventListener('click', layOut);

syncRail();
layOut();
L.start();
</script>
</body>
</html>
