<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Site-wide chrome: analytics + the foot. Absolute src, because the
     featured pages set <base href="/demos/">. lib/site.js -->
<script defer src="/demos/lib/site.js"></script>
<!-- SERVED AT A SHORT URL BY A vercel.json REWRITE, which does not move the
     file: without this every ../../ path would resolve against `/`.
     Correct at its own path and on the dev server too. docs/deploy.md. -->
<base href="/demos/proteins/">
<title>Proteins — Kodolab</title>

<!-- ===================================================================
     THE COLLECTION, AS A COLLECTION. One card per protein in
     proteins/proteins.js: the structure it opens on, turning, and what
     we have of it.

     EVERYTHING ON A CARD IS READ FROM THE REGISTRY. The name, the blurb
     and each variant's purpose are a human's; the method, the species,
     the residue counts are the baker's, rewritten on every re-bake. This
     page types none of it — which is the point of the registry, and the
     reason a card cannot go stale against the files it describes.

     CONTEXTS ARE RATIONED, NOT COUNTED (ConceptMap.md invariant 1):
     browsers cap WebGL contexts near 8-16 and drop the OLDEST with no
     error, so the boxes come out of a CardStage pool and a card that
     loses its box keeps the last frame it drew. Three proteins fit inside
     the cap today; the tenth would not, and the pool is why nobody will
     find that out from a blank card.
     =================================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../css/kodo.css">
<link rel="stylesheet" href="../kit/proteinbox.css">

<style>
  /* The site sheet owns the paper, the wordmark, the masthead and the gutter.
     What is left here is the shelf: the card, and the one number on the page
     that is counted from the registry rather than typed. */
  :root { --page-max: 1180px }

  /* ---- the grid ------------------------------------------------------- */

  /* 290px, not 330: three columns is the layout this page is composed for,
     and a 330 track dropped to two at ~1150px — a laptop, not a tablet. The
     card is legible narrower than the widest it wants to be. */
  .grid{display:grid;gap:var(--page-gap);
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}

  .card{background:var(--surface-card);border:1px solid var(--border-hair);border-radius:4px;
    overflow:hidden;display:flex;flex-direction:column;
    transition:border-color .18s,transform .18s,box-shadow .18s;cursor:pointer}
  .card:hover{border-color:var(--accent);transform:translateY(-3px);
    box-shadow:0 10px 26px rgba(20,22,26,.07)}
  /* The stage is the top of the card and has a fixed height: a grid whose
     rows are sized by their 3D box is a grid that reflows while the boxes
     fit, and every card jumps. */
  .stage{position:relative;height:230px;background:var(--paper);
    border-bottom:1px solid var(--border-hair)}
  .body{padding:1.5rem 1.4rem 1.6rem;display:flex;flex-direction:column;flex:1}

  .name{font-family:var(--font-display);font-size:1.35rem;font-weight:500;letter-spacing:-0.02em;
    line-height:1.12;margin:0}
  /* One word, above the blurb: what KIND of thing this is, which is the
     first question a reader has and the one a ribbon cannot answer. */
  /* `align-self` because the card is a flex column, where a block child is
     stretched to the full width whatever its display says — a chip that fills
     the card reads as a banner. */
  .does{display:inline-block;align-self:flex-start;margin:0.55rem 0 0;
    font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;
    font-weight:600;color:var(--accent)}
  .does.carrier{color:var(--spark)}

  /* Three lines, hard. The card takes the first sentence, and this is the
     backstop for a protein whose first sentence is a paragraph. */
  .blurb{font-size:0.9rem;color:var(--muted);
    line-height:1.5;margin:0.55rem 0 0.9rem;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
    overflow:hidden}

  .facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 1rem}
  .fact{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;
    font-weight:600;padding:3px 8px;border-radius:999px;
    border:1px solid var(--border-hair);background:var(--paper);color:var(--muted)}
  /* MEASURED AND PREDICTED MUST NOT READ ALIKE. Nothing here is predicted
     yet, and the day one is, it says so in the loudest chip on the card
     rather than in a field a reader has to go looking for. */
  .fact.predicted{background:var(--spark);border-color:var(--spark);color:#faf8f4}

  /* THE CARD ITSELF IS THE CLICK, and it opens the modal, so a pill saying so
     was the same destination twice. What stays on a card is the lesson, where
     one exists: the only thing on a card that leaves the page. The modal prints
     the rest of the routes. */
  .links{margin-top:auto;display:flex;flex-wrap:wrap;gap:0.5rem}
  .open{display:inline-flex;align-items:center;gap:6px;padding:0.6rem 1.2rem;
    border:1px solid var(--accent);border-radius:999px;
    background:var(--accent);color:#faf8f4;font-size:0.8rem;font-weight:600;
    letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;
    transition:background .18s,border-color .18s}
  .open:hover{background:var(--spark);border-color:var(--spark)}

  /* ---- the modal ------------------------------------------------------
     A card opens here rather than navigating: the bigger view is the same
     box under a bigger frame, taken out of the SAME pool, so the modal costs
     one context and the card it evicted keeps its last frame. Its own page is
     a link inside, not the click. */
  .modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;
    justify-content:center;padding:clamp(1rem,4vw,3rem);
    background:rgba(20,22,26,.55);backdrop-filter:blur(3px)}
  .modal[hidden]{display:none}
  /* THE SHEET IS BOUNDED AND THE DETAILS SCROLL INSIDE IT, which is a framing
     rule and not a taste: let the sheet grow to its content and the stage grows
     with the grid row, so a protein with seven depositions hands the box a
     column twice as tall as the frame it solved for and the molecule sits low
     and left in it. A bounded sheet is a stage whose size is settled before the
     box is built and does not move afterwards. */
  .sheet{position:relative;background:var(--surface-card);
    border:1px solid var(--border-hair);border-radius:6px;
    box-shadow:0 24px 70px rgba(20,22,26,.28);
    width:min(980px,100%);height:min(100%,660px);overflow:hidden;
    display:grid;grid-template-columns:1.05fr 1fr}
  /* `min-height:0` on both: a grid item's default `auto` minimum refuses to
     shrink below its content, which is how a bounded sheet still overflows. */
  .mstage{background:var(--paper);border-right:1px solid var(--border-hair);
    min-height:0}
  .mbody{padding:clamp(1.4rem,3vw,2.2rem);display:flex;flex-direction:column;
    min-height:0;overflow-y:auto}
  /* Stacked, the sheet scrolls as one and the stage takes a fixed slice of it:
     side by side there is a column to fill, stacked there is not. */
  @media (max-width:800px){
    .sheet{grid-template-columns:1fr;height:auto;max-height:100%;overflow:auto}
    .mstage{height:320px;border-right:0;border-bottom:1px solid var(--border-hair)}
    .mbody{overflow:visible}
  }
  .mbody .name{font-size:1.9rem}
  .mblurb{font-size:0.95rem;color:var(--muted);line-height:1.6;margin:0.8rem 0 1.2rem}

  /* One row per structure we hold. Every field is the baker's except the
     purpose, so this table is the registry printed, not a description of it. */
  .vars{display:flex;flex-direction:column;gap:0.7rem;margin:0 0 1.4rem}
  .var{border-top:1px solid var(--border-hair);padding-top:0.7rem}
  .var .id{font-family:var(--font-mono,ui-monospace,monospace);font-size:0.82rem;
    font-weight:600;letter-spacing:0.04em;text-decoration:none;color:var(--accent)}
  .var .id:hover{color:var(--spark)}
  .var .purpose{font-size:0.88rem;color:var(--ink);margin:2px 0 0}
  .var .read{font-size:0.72rem;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--muted);margin:4px 0 0}
  .var .badge{margin-left:0.5rem;font-size:0.66rem;letter-spacing:0.1em;
    text-transform:uppercase;font-weight:600;color:var(--spark)}

  /* The close is the only chrome the sheet has; escape and the backdrop do
     the same thing. */
  .x{position:absolute;top:0.6rem;right:0.7rem;z-index:2;
    width:32px;height:32px;border-radius:999px;cursor:pointer;
    border:1px solid var(--border-hair);background:var(--surface-card);
    color:var(--muted);font-size:1.1rem;line-height:1}
  .x:hover{color:var(--ink);border-color:var(--accent)}

  /* One line, under the rule: what a reader is looking at a shelf OF. */
  .lede{font-size:1rem;color:var(--muted);max-width:60ch;line-height:1.6;
    margin:0 0 clamp(1.75rem,4vw,2.5rem)}
</style>
</head>
<body class="kodo">
<div class="page">
  <nav class="sitenav">
    <a class="mark" href="/">kodo<em>lab</em><span class="dot">.</span></a>
    <span class="crumb">biology</span>
  </nav>

  <header class="pagehead">
    <h1>proteins</h1>
    <!-- Counted from the registry at render, so it cannot drift from the cards
         under it — the one number here most likely to be typed and then quietly
         falsified by a fourth protein. -->
    <p class="meta" id="tally">&mdash;</p>
  </header>

  <p class="lede">Proteins are what your genes are for. All of these
    proteins were measured in a lab with x-rays. Their shape is the job the do.</p>

  <main class="grid" id="grid"></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-name">
    <button class="x" id="m-close" aria-label="Close">&times;</button>
    <div class="mstage" id="m-stage"></div>
    <div class="mbody">
      <h2 class="name" id="m-name"></h2>
      <p class="does" id="m-does"></p>
      <p class="mblurb" id="m-blurb"></p>
      <div class="vars" id="m-vars"></div>
      <div class="links" id="m-links"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../lib/palette.js"></script>
<script src="../lib/tokens-from-palette.js"></script>
<script src="../lib/molecules.js"></script>
<script src="../lib/scene.js"></script>
<script src="../folding/folding.js"></script>
<script src="../kit/ribbon.js"></script>
<script src="../kit/card-stage.js"></script>
<script src="../kit/proteinbox.js"></script>
<script src="../kit/nucleic.js"></script>
<script src="proteins.js"></script>
<script src="nucleic-acids.js"></script>
<script>
'use strict';

const $ = id => document.getElementById(id);

/* WHERE A CARD LEADS. The bench, derived as `<dir>/<key>-test.html` — a second
   copy of a filename is a second thing to rename — with `page` naming it for a
   protein whose bench is somewhere else. `lesson` is the optional second link,
   for the one protein here that has already become one. Paths are relative to
   `demos/`, one level up from this page. */
/* EVERY PROTEIN IN THE REGISTRY HAS `/proteins/<key>`, whatever folder its
   files sit in — `vercel.json` rewrites the short URL onto the bench and 301s
   the file path onto the short one. Adding a protein means adding both routes
   and the bench's own `<base>` tag; docs/deploy.md is the procedure. */
const benchOf = p => `/proteins/${p.key}`;
const lessonOf = p => p.lesson ? '../' + p.lesson : null;

/* Every protein's data sits under its own `dir`, which is not always beside
   this page — haemoglobin lives outside `proteins/` because its bakes belong
   to the folding pipeline. */
const dataOf = (p, file) => `../${p.dir}/data/${file}`;

/* CONTEXTS ARE RATIONED (ConceptMap.md invariant 1), and CONTEXTS ARE THE ONLY
   THING RATIONED. An off-screen box already stops its own loop — card-stage's
   observer — so a card scrolled past costs no frame time whether it is live or
   destroyed. What eviction buys is the context, and a destroyed one cannot come
   back on the same canvas, so the card rebuilds from scratch when the reader
   scrolls up. Below the browser's ~8 cap that rebuild is pure loss, which is why
   every card here stays live and the ceiling only bites past eight proteins.
   `onEvict` fires before the destroy, so a card that loses its box keeps the
   last frame it drew and reads as gone quiet rather than gone. */
/* TWO REGISTRIES, ONE GALLERY. `nucleic-acids.js` indexes the bakes that carry
   DNA or RNA, and the ones with a protein in them belong on this page — Zif268
   is a protein that arrives with a duplex, and leaving it off would make the
   gallery incomplete for no reason a reader could see. A structure with no
   protein does NOT come here: this is a gallery of proteins, and its benches
   are reachable from admin.html. `withProtein()` is where that line lives. */
const NA_KEYS = new Set(NucleicAcids.withProtein().map(s => s.key));
const isNA = p => NA_KEYS.has(p.key);
/* THE TWO WITH A PAGE OF THEIR OWN COME FIRST. Everything else on this shelf
   is a structure to look at; these two are already lessons, and a reader who
   scrolls past them to find one is being shown the collection in the order the
   registry happens to be written in. Keys, not indices — reordering
   proteins.js must not silently reorder this. */
const LEAD = ['hemoglobin', 'myoglobin'];
const ENTRIES = [...ProteinLib.PROTEINS, ...NucleicAcids.withProtein()]
  .sort((a, b) => (LEAD.indexOf(a.key) + 1 || 99) - (LEAD.indexOf(b.key) + 1 || 99));
const entryOf = key => isNA({ key }) ? NucleicAcids.byKey(key) : ProteinLib.byKey(key);
const defaultOf = p => isNA(p) ? NucleicAcids.defaultOf(p) : ProteinLib.defaultOf(p);

const POOL_LIMIT = Math.min(ENTRIES.length, 8);
const pool = CardStage.pool({
  limit: POOL_LIMIT,
  onEvict: (key, box) => { const url = box.snapshot && box.snapshot(); still(key, url); },
});

/* The evicted card's last frame, as a plain image behind the (now empty)
   mount. Kept rather than cleared because a still protein still says which
   protein it is. */
function still(key, url) {
  const el = document.querySelector(`.stage[data-key="${key}"]`);
  if (!el || !url) return;
  el.style.backgroundImage = `url(${url})`;
  el.style.backgroundSize = 'contain';
  el.style.backgroundPosition = 'center';
  el.style.backgroundRepeat = 'no-repeat';
}

/* THE BAKED FIRST FRAME. A card that has not had a context yet has nothing to
   keep the last frame OF, so it drew an empty rectangle until it did — the one
   state on this page a reader cannot tell from a broken one, and the one that
   lasts longest on a slow connection because the trace has to arrive first.
   `proteins/tools/stills.html` bakes these from the same box, colour and
   rotation, so the live canvas replaces the picture with the same picture.
   A missing file just fails to load: the card is then as it was. */
const stillSrc = key => `stills/${key}.webp`;

/* One protein's default variant, as chains the box can draw — every protein
   bakes the same shape now, so there is one path and no branch on pipeline.
   Prion was reduced PDB text until the unfold animation was dropped, and the
   card drew it in a different frame from the bench for exactly as long as the
   parse and the solved view happened at load in two places. */
function load(p) {
  const v = defaultOf(p);
  return fetch(dataOf(p, v.read.baked)).then(r => r.json());
}

/* WHAT IT DOES, the registry's word for it, on a card and in the modal both.
   `unknown` draws nothing: it would read as a missing field rather than as the
   answer it is, and the protein it belongs to spends three views on its bench
   saying what is known instead. */
function fillDoes(el, p) {
  if (!el) return;
  if (!p.does || p.does === 'unknown') { el.remove(); return; }
  /* An enzyme says WHICH KIND beside the word, because "enzyme" is a category
     and the class name (hydrolase, transferase) is the thing a reader
     recognizes without a lookup. The description goes in the title where a
     hover reaches it. */
  /* An EC number is a protein-registry fact; a nucleic entry has none and
     asking for one would be reaching into the wrong index. */
  const ec = isNA(p) ? null : ProteinLib.ecOf(p);
  const cls = ec && ProteinLib.EC_CLASS[+ec[0]];
  el.textContent = p.does + (cls ? ` \u00b7 ${cls[0]}` : '');
  el.title = cls ? cls[1] : '';
  el.className = 'does ' + (p.does === 'enzyme' ? 'enzyme' : 'carrier');
}

/* Everything printed below is counted or read, never typed here. */
function card(p) {
  const v = defaultOf(p), r = v.read;
  const el = document.createElement('article');
  el.className = 'card';

  /* HOW MUCH IS MISSING, IN RESIDUES, and not a word for it. "Fragment" is
     true of prion's half a protein and misleading of amylase, which is short
     one residue because its N-terminus is a modified pyroglutamate that rides
     on a HETATM line. A count says both without deciding where the line is. */
  const facts = [v.species, r.method].filter(Boolean);

  el.innerHTML = `
    <div class="stage" data-key="${p.key}" style="background-image:url(${stillSrc(p.key)});background-size:contain;background-position:center;background-repeat:no-repeat"></div>
    <div class="body">
      <h3 class="name"></h3>
      <p class="does"></p>
      <p class="blurb"></p>
      <div class="facts"></div>
      ${lessonOf(p) ? `<div class="links"><a class="open" href="${lessonOf(p)}">the lesson &rarr;</a></div>` : ''}
    </div>`;

  /* THE WHOLE CARD OPENS THE MODAL. The stage is included, so the handler has
     to tell a click from the end of a drag that turned the molecule: a pointer
     that moved more than a few px is the reader steering, not choosing.
     Anchors keep their own destination: a link inside leaves the page. */
  let down = null;
  el.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
  el.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
    openModal(p);
  });

  el.querySelector('.name').textContent = p.name;
  /* WHAT IT DOES, the registry's word for it. `unknown` draws nothing: on a
     card it would read as a missing field rather than as the answer it is,
     and the protein it belongs to has a bench that spends three views saying
     what is known instead. */
  const does = el.querySelector('.does');
  fillDoes(does, p);

  /* THE FIRST SENTENCE, not the whole blurb. The registry's blurb is written
     for the node graph's card, where it is the claim and has room to be one;
     on a shelf, four lines of it is what a reader has to get past to reach the
     next protein. Cut here rather than shortened there — the same text is a
     graph node's claim and is baked into its vector. The clamp in the CSS is
     the backstop for a first sentence that is itself long. */
  el.querySelector('.blurb').textContent = p.blurb.split(/(?<=\.)\s+/)[0];

  const fx = el.querySelector('.facts');
  for (const f of facts) {
    const s = document.createElement('span');
    /* The one chip that is allowed to shout. A predicted structure is a
       different KIND of claim from a measured one, and a gallery that lets the
       two read alike will eventually show a student a guess as a fact. */
    s.className = 'fact' + (f === 'predicted' ? ' predicted' : '');
    s.textContent = f;
    fx.appendChild(s);
  }

  /* WHAT A CARD DOES NOT SAY. The structure ids, what each variant is for and
     how much of the protein its file holds all live on the bench, which is one
     click away and is where a reader deciding between two files actually is.
     On a shelf they were four lines of monospace between the reader and the
     next protein. The tally in the masthead still counts them, so the page
     does not stop knowing they exist.
     The registry is unchanged: nothing here was the only reader of it. */

  return el;
}

const grid = $('grid');
for (const p of ENTRIES) grid.appendChild(card(p));

/* THE TALLY, COUNTED AT RENDER, and it names the two registries separately
   rather than adding them up. A nucleosome IS proteins, so "16 proteins" was
   not wrong — but it flattened the one distinction this page now makes, which
   is that some of these entries arrive with a nucleic acid in the same file.
   A reader who sees "2 complexes" knows there is something here to look for.
   The word is dropped entirely when there are none, so the day this page is
   proteins again it stops advertising an empty category. */
const nComplex = NucleicAcids.withProtein().length;
const variants = ENTRIES.reduce((k, p) => k + p.variants.length, 0);
$('tally').textContent =
  `${ProteinLib.PROTEINS.length} proteins`
  + (nComplex ? ` · ${nComplex} complexes` : '')
  + ` · ${variants} structures`;

/* A BOX IS ACQUIRED WHEN ITS CARD IS SEEN, and re-acquired on a click, because
   acquire is also bring-to-front: a card already live must re-acquire or the
   one being looked at is the next evicted. A zero-sized mount is never handed
   to a box — Stage.frame bails on a missing aspect and leaves THREE's
   constructor frustum, a 30 Å protein in a 2 Å frame. */
const io = new IntersectionObserver(entriesSeen => {
  for (const e of entriesSeen) {
    if (!e.isIntersecting) continue;
    open(e.target.dataset.key, e.target);
  }
}, { rootMargin: '200px' });

const traces = {};                       // key -> the loaded chains

function open(key, mount) {
  if (!mount.clientWidth || !mount.clientHeight) return;
  const p = entryOf(key);
  const draw = t => {
    pool.acquire(key, () => Proteinbox.create({
      mount, orbit: true, pad: 1.15, sub: 8,
      /* Perspective and trackball, matching the benches: a card here is a
         thumbnail a reader is invited to turn, and the turntable's pitch clamp
         runs out exactly where someone looks at the top of a molecule.

         `zoom:false` GIVES THE WHEEL BACK TO THE PAGE. On a bench the wheel is
         the reader's zoom and the canvas is the whole stage; on a gallery it is
         how they get down the grid, and a card that swallows it traps the
         scroll under the pointer. Dragging still turns the molecule. */
      stage: { ortho: false, turn: 'trackball', zoom: false },
      /* PER-CHAIN COLOUR WHERE THE PROTEIN ASKS FOR IT, null everywhere else —
         which keeps the default, and the default is that every protein in the
         repo is drawn the same way. Collagen is the case: its files record no
         secondary structure at all, so the ss palette draws a triple helix as
         one green rope and the braid, which is the whole subject, is invisible
         on the card that indexes it. Read from the registry so this card and
         the bench cannot colour the same molecule two ways. */
      /* Colour is the protein registry's to state; the ladder takes the
         palette's base family, so a nucleic entry leaves it to the box. */
      /* WHICH CHAINS THE CARD IS ABOUT. A partner chain is in the file and
         not in the subject — T7's borrowed thioredoxin is the case — and the
         index says which, so this card, the still baked from it and the bench
         cannot disagree. Null keeps the box's own default, which is every
         chain, and that is what every entry without a partner gets. */
      chains: isNA(p) ? NucleicAcids.drawnOf(p, null, t) : null,
      colors: isNA(p) ? null : ProteinLib.colorsOf(p, ProteinLib.defaultOf(p)),
      /* THE ROTATION IS ASKED OF WHICHEVER REGISTRY HOLDS THE ENTRY. Passing
         null for a nucleic one was right while every nucleic bake carried its
         own solved basis — and it stopped being right the moment one of them
         got a hand-picked rotation, because `Bake.viewFor` then writes NO view
         into the bake and the card would open in the crystal's frame while the
         bench opened in the chosen one. Both indexes answer `viewOf`, and it
         is every consumer calling it that stops this card and that bench
         becoming two opinions about which way one molecule faces. */
      view: (isNA(p) ? NucleicAcids : ProteinLib).viewOf(p),
      data: t,
    }));
    /* THE POCKET, where a protein has one. Myoglobin without its heme is the
       container drawn and the subject left out — and this is the card the
       collection is indexed by, so it has to show what the protein is FOR.
       Fed after the box exists; the box owns how it is drawn. */
    const box = pool.get && pool.get(key);
    if (box && box.setPocket && t.pocket) box.setPocket(t.pocket);
    /* The still gives way to the live box only once that box has drawn. Clearing
       it before the create meant a frame of empty card on every acquire, which
       on a page that re-acquires as you scroll is the flicker. */
    mount.style.backgroundImage = '';
  };
  if (traces[key]) draw(traces[key]);
  else load(p).then(t => { traces[key] = t; draw(t); })
    .catch(e => console.warn(`gallery: ${key} — ${e.message}`));
}

/* THE FIRST FEW OPEN ON LOAD, and the rest wait to be seen. Two reasons, and
   the second is the one that bites: the cards above the fold should be turning
   when the page arrives rather than popping in behind an observer, and a
   document that is never visible — a background tab, a thumbnail capture, an
   automated screenshot — gets no intersection callbacks at all, so a gallery
   that waited for one would render a grid of empty frames and look broken to
   exactly the readers who cannot tell it apart from a bug. */
const EAGER = 4;                         // above the fold; the rest wait to be seen
const stages = [...document.querySelectorAll('.stage')];
stages.forEach((el, i) => {
  if (i < EAGER) open(el.dataset.key, el);
  io.observe(el);
  el.addEventListener('pointerdown', () => open(el.dataset.key, el));
});

/* ===================================================================
   THE MODAL. A card is a thumbnail and a sentence; this is where the rest of
   the registry gets printed, and where the two proteins that already became
   lessons hand the reader off to them.

   IT SHARES THE POOL, on its own key. A modal box is one more WebGL context,
   and the one thing this page is careful about is contexts, so it is acquired
   the same way a card's is: the oldest card loses its box and keeps its last
   frame, and gets it back when the reader scrolls or clicks it. Released on
   close, so the shelf is whole again behind it.
   =================================================================== */

const MODAL_KEY = '\u2318modal';        // cannot collide with a protein key
const modal = $('modal');
let openKey = null;

/* WHERE THE READER GOES FROM HERE, in the order they should read it. The bench
   is every protein's, and it is derived; the lesson is the registry's, and only
   haemoglobin has one. Myoglobin's own page IS what `benchOf` resolves to, so
   the difference between these two and the rest is the WORD, not a second
   route: `vercel.json` rewrites /proteins/myoglobin onto myoglobin.html and
   /proteins/<key> onto a bench for everyone else. A page that stored the
   destination would be the second copy of that table. */
const HAS_PAGE = new Set(['myoglobin']);
function linksFor(p) {
  const out = [];
  if (p.lesson) out.push([lessonOf(p), 'the lesson \u2192']);
  out.push([benchOf(p),
            HAS_PAGE.has(p.key) ? 'the myoglobin page \u2192'
          : p.lesson            ? 'every structure we hold \u2192'
          :                       'open the bench \u2192']);
  return out;
}

function openModal(p) {
  openKey = p.key;
  $('m-name').textContent = p.name;
  fillDoes($('m-does'), p);
  /* THE WHOLE BLURB HERE, where the card takes its first sentence. The clamp on
     a shelf is what a reader has to get past to reach the next protein; in a
     modal they have already chosen this one. */
  $('m-blurb').textContent = p.blurb;

  /* EVERY STRUCTURE WE HOLD, one row each, and not one number typed. `purpose`
     and `label` are the human's, everything under `read` is the baker's, and
     the counts are printed as modelled-of-declared because "fragment" is true
     of prion's half a protein and misleading of a chain short one residue that
     rides on a HETATM line. */
  const vars = $('m-vars');
  vars.innerHTML = '';
  const def = defaultOf(p);
  for (const v of p.variants) {
    const r = v.read || {};
    const bits = [r.method, v.species].filter(Boolean);
    if (r.residues) bits.push(`${r.residues}${r.declared ? ' of ' + r.declared : ''} residues`);
    if (r.pairs) bits.push(`${r.pairs} base pairs`);
    const chains = r.chainsInFile || r.chains;
    if (chains) bits.push(`${chains} chain${chains > 1 ? 's' : ''}`);

    const row = document.createElement('div');
    row.className = 'var';
    const url = isNA(p) ? NucleicAcids.urls(v.id).rcsb : ProteinLib.urls(v).entry;
    row.innerHTML = `
      <a class="id" href="${url}" target="_blank" rel="noopener">${v.id}</a>
      ${v === def ? '<span class="badge">shown</span>' : ''}
      <p class="purpose"></p>
      <p class="read"></p>`;
    row.querySelector('.purpose').textContent = v.purpose || v.label || '';
    row.querySelector('.read').textContent = bits.join(' \u00b7 ');
    vars.appendChild(row);
  }

  const links = $('m-links');
  links.innerHTML = '';
  for (const [href, text] of linksFor(p)) {
    const a = document.createElement('a');
    a.className = 'open'; a.href = href; a.textContent = text;
    links.appendChild(a);
  }

  modal.hidden = false;
  document.body.style.overflow = 'hidden';
  $('m-close').focus();

  /* THE BOX LAST, and only once the sheet is laid out: a zero-sized mount gets
     THREE's constructor frustum, which is the same trap the cards have. */
  const mount = $('m-stage');
  requestAnimationFrame(() => { if (openKey === p.key) openBox(p, mount); });
}

/* The modal's box, on the pool's own terms. Zoom is ON here where a card
   refuses it: the sheet is the whole stage, so the wheel is the reader's zoom
   rather than how they get down a grid. */
function openBox(p, mount) {
  if (!mount.clientWidth || !mount.clientHeight) return;
  const draw = t => {
    const box = pool.acquire(MODAL_KEY, () => Proteinbox.create({
      mount, orbit: true, pad: 1.1, sub: 10,
      stage: { ortho: false, turn: 'trackball', zoom: true },
      chains: isNA(p) ? NucleicAcids.drawnOf(p, null, t) : null,
      colors: isNA(p) ? null : ProteinLib.colorsOf(p, ProteinLib.defaultOf(p)),
      view: (isNA(p) ? NucleicAcids : ProteinLib).viewOf(p),
      data: t,
    }));
    if (box && box.setPocket && t.pocket) box.setPocket(t.pocket);
  };
  if (traces[p.key]) draw(traces[p.key]);
  else load(p).then(t => { traces[p.key] = t; draw(t); })
    .catch(e => console.warn(`modal: ${p.key} \u2014 ${e.message}`));
}

/* CLOSING RELEASES THE CONTEXT. A canvas that has lost one can never be granted
   another, so the pool destroys the box and the next open builds a fresh one on
   a fresh canvas: card-stage.js makes the canvas for exactly this reason. */
function closeModal() {
  if (modal.hidden) return;
  pool.release(MODAL_KEY);
  $('m-stage').innerHTML = '';
  modal.hidden = true;
  openKey = null;
  document.body.style.overflow = '';
}

$('m-close').addEventListener('click', closeModal);
/* The backdrop closes; the sheet does not, so a drag that turns the molecule
   and ends outside the canvas is not a close. */
modal.addEventListener('mousedown', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
