// shift doesn't travel a matching number of pixels, and solving the anchor
// exactly walks the label off the top edge. Damping keeps the solved offset
// (restyle the plate and it follows) without trusting that conversion.
const TOP_PULL=0.5;
// Highest label line in the pathway. Solved once from the specs: a property of
// the pathway, not of the step you are on.
let _pathTop=null;
const pathwayTopY=()=>_pathTop??(_pathTop=Math.max(...STEPS.map(s=>plateY(s.species))));
const topAnchoredY=(R,centredY,topNow)=>FIT.anchorTop(R,centredY,topNow,TOP_PULL);

// Snap to the state at index i, no animation. Restart, rewind, and the settling
// half of every animated transition.
function renderLanes(i){
  // Settled state: these molecules are named. The class goes with the flag, not
  // the next drawPlates — rAF doesn't run in a hidden tab, so the name would be
  // missing for as long as you weren't looking.
  platesOff=false; platesEl.classList.remove('mute');
  // The module carries the OUTGOING lanes' heights onto the incoming ones (one
  // outgoing lane can feed two, at the split), so the swap frame moves nothing.
  lanes=LANES.render(speciesAt(i));
  computeFit();
}

/* ONE LANE'S MOLECULE, replaced in place. renderLanes rebuilds from a state
 * index, which a per-lane step has none of: half-way through step 7 one lane is
 * 3-PGA and the other still 1,3-BPG. The shared plate line is re-solved over
 * the MIXED contents and handed to both (kit/lanes.js), else the two names sit
 * at different heights while the step is half done.
 */
function swapLane(j,key){
  LANES.swapOne(j,key);
  lanes=LANES.lanes;
  computeFit();
}
/* ---- page-local effects (cosmetic only, like everything in fx.js) ---- */
// Every beat this page schedules is a COMMIT on kit/motion.js's two clocks, so
// a step finishes whether or not the tab was watched. Milliseconds in, because
// every beat constant here is in ms.
const RUN='run';                                  // the tag a whole step rides
/* kit/leaving.js takes the meshes and the flight; the chemistry stays here —
 * which atoms go, what colour the event is, where to. */
const GO=Leaving.create({root, camera, motion:MO, tag:RUN});
// A restart sweeps three things: the beats, the meshes still in the air, and
// the DOM riding them — a flyer's fade is itself a beat, so cancelling alone
// would leave the label on screen.
const cancelTimers=()=>{ MO.cancel(RUN); GO.clear(); clearFlyers(); };
function hideAtom(g,i){ if(i!=null) GO.shed(g,[i]); }
// THE PHOSPHATE COMES OFF ATP, and you should see that it does: the flight
// starts (or, at steps 7 and 10, ends) on that tile. Dropping it in from the
// top of the frame would be true of free Pi, not of a kinase step.
// The tile is DOM and the flight is in the scene, so its screen position is
// unprojected AT THE DEPTH OF THE OTHER END: the camera orbits, so there is no
// fixed plane, and matching depth keeps the phosphate one size at both ends.
function tileWorld(key,ref,j){
  const p=carrierPoint(key,j);
  if(!p) return null;
  const c=canvas.getBoundingClientRect();
  if(!c.width || !c.height) return null;
  camera.updateMatrixWorld();
  const z=ref.clone().project(camera).z;
  return new THREE.Vector3(
    (p.x-c.left)/c.width*2-1, -((p.y-c.top)/c.height*2-1), z).unproject(camera);
}
// ATP/ADP are drawn, not carded, so the flight anchors on the γ phosphate
// itself rather than a box.
function carrierPoint(key,j){
  return CARRIER.has(key) && carrierEl.isConnected ? carrierGammaPoint(j) : null;
}
/* =============================================================
 *  THE VERBS — reaction/reaction.js
 * =============================================================
 * A step's `fx` names a verb. The page keeps the stage around it — the lanes,
 * the carriers, the ledger, `done`/`busy`, which carrier a step couples to —
 * and every host entry below is one of those questions.
 */
const RX=Reaction.create({
  three:THREE, root, camera, canvas,
  motion:MO, fx:FXi, leaving:GO, kit:KIT, stage:Stage, palette:PAL,
  molgraph:MolGraph, molLib:MolLib, skelLib:SkelLib, tag:RUN,
  flyersEl:document.getElementById('flyers'),
  specOf:key=>M[key],
  lanes:()=>lanes,
  laneOrigin, laneBase, plateY,
  swapLane, settleLanes:()=>LANES.settle(),
  spawnLanes:(keys,each)=>{ lanes=LANES.render(keys, plateY(keys), each); },
  // WHICH carrier, and where its tile stands, are the page's: `couple.cin` is
  // the lesson's bookkeeping and `tileWorld` unprojects a DOM tile at the
  // scene's depth. The module only ever asks "where does this lane's carrier
  // sit", which is the same question for ATP, NAD⁺, FAD or CoA.
  carrierPoint:(st,ref,j)=>tileWorld(carrierKey(st.couple.cin), ref, j),
  // …and the bond the transfer makes on it, for the ring the arriving end gets.
  // WHICH bond is chemistry and stays here: ATP's is gammaBreak's, derived from
  // the spec. bondMid answers null when the tray is not on screen.
  carrierBond:(st,j)=>CAR.bondMid(j, ...gammaBreak()),
  // THE CARRIER TURNS OVER ON ARRIVAL, not when the step lands — see the `ox`
  // verb. `carrierGone` is the page's, because the tray reads it.
  onCarrierTaken:j=>{ carrierGone.add(j); refresh(); },
  popCarrier:j=>popCarrier(j),
  // …and the two specs the module needs by role rather than by name: what a
  // phosphoryl is copied from when nothing on stage supplies it, and what
  // arrives out of solution.
  donorSpec:()=>ATP,
  freeSpec:()=>M.pi,
});
// The page's own uses of the module's vocabulary, under the names the rest of
// this file already reads by.
const later=RX.later, aboveFrame=RX.offstage, drawFlyers=RX.drawFlyers,
      clearFlyers=RX.clearFlyers, anchorWorld=RX.anchorWorld,
      specWorld=RX.specWorld, junctionWorld=RX.junctionWorld;
const FLY=RX.timing.FLY;

/* =============================================================
 *  RUNNING A STEP
 * ============================================================= */
/* ONE LANE OF A PER-LANE STEP — see PER-LANE STEPS. The `out` beat for that
 * lane only, then that lane alone becomes the product. The step lands when the
 * last lane does, and only then does `done` move — so pips, rail and caption
 * count whole steps while ledger, pools and carriers show the half.
 */
function runLane(j){
  if(busy || intro || done>=nSteps) return;
  const st=stepAt(done);
  if(!isPerLane(st) || laneDone.has(j) || !lanes[j]) return;
  const to=done+1, keys=speciesAt(to), n=lanes.length;
  busy=true;
  platesOff=true; platesEl.classList.add('mute');
  // Instance j belongs to lane j throughout: what leaves this molecule arrives
  // at the carrier standing opposite it. THE SAME BODY the whole-step route
  // runs.
  RX.lane(st, j, keys);
  later(()=>{
    laneDone.add(j);
    swapLane(j, keys[j]);
    platesOff=false; platesEl.classList.remove('mute');
    // THE LAST LANE LANDS THE STEP. `laneDone` is cleared here and nowhere in
    // between, so a step that is half run stays half run across a redraw.
    //
    // BOTH SETS, because both answer `carrierRan` and both are per-STEP. The
    // `ox` verb sets `carrierGone` from the hydride's arrival, so a leftover
    // entry is read by the NEXT step: 7 and 10 charge the carrier (`up:false`),
    // so `carrierRan` true means "already run" and the tray opens on ATP
    // instead of ADP. Only in the linear flow — jumping to a step clears both
    // on the way in, so the step numbers look fine and the arrows do not.
    if(laneDone.size>=n){ done=to; reviewing=true; laneDone.clear(); carrierGone.clear(); }
    busy=false; refresh();
    // only THIS carrier turned over, so only it pops — except on an oxidation,
    // which already popped when the hydride landed. Popping again here is the
    // same tile announcing the same gain twice, the second time for nothing.
    if(st.fx!=='ox') popCarrier(j);
  }, RX.durOf(st));
}

/* THE WHOLE STEP — every lane at once, and the same verb bodies.
 *
 * `RX.all` returns true when the verb owns its own completion. Exactly one
 * does: `split`, because it changes how many lanes there are, so the page must
 * not respawn them behind it.
 */
function runStep(){
  if(busy || intro || done>=nSteps) return;
  const st=stepAt(done), to=done+1;
  const keys=speciesAt(to);
  // THE GROUP LEAVES ON THE CLICK — before the refresh below, so the tray
  // redraws as the discharged carrier on the frame the flight starts.
  if(st.couple && st.couple.up) carrierGone.add(0);
  busy=true; refresh();                       // dim the tray for the duration
  // A NAME BELONGS TO A SETTLED MOLECULE. Hidden for the whole of any
  // animation: mid-beat the thing on stage is neither substrate nor product,
  // so the label would name one of the two it is between.
  platesOff=true; platesEl.classList.add('mute');

  const land=respawn=>()=>{
    done=to; reviewing=true; carrierGone.clear();
    if(respawn) renderLanes(to);
    // renderLanes gives the names back; the branch that skips it must not.
    else { platesOff=false; platesEl.classList.remove('mute'); }
    busy=false; refresh();
  };
  // `split` already has the lanes correct — don't respawn over them.
  if(RX.all(st, keys, land(false))) return;
  later(land(true), RX.durOf(st));
}
function rewind(){
  if(busy) return;
  // the review screen steps back to its own step's explanation — one click,
  // one screen, in both directions
  if(reviewing){ reviewing=false; refresh(); return; }
  // A HALF-RUN STEP REWINDS TO ITS OWN START: one lane already handed over its
  // phosphate, and going back further leaves that ATP banked in a ledger the
  // pips say is untouched.
  if(laneDone.size){ laneDone.clear(); carrierGone.clear();
    renderLanes(done); refresh(); return; }
  if(done===0){ intro=true; refresh(); return; }   // step back off stage 1 onto the intro
  done--; renderLanes(done); refresh();
}
function restart(){ cancelTimers(); busy=false; pressing=false; reviewing=false; done=0; intro=true;
  laneDone.clear(); carrierGone.clear();
  renderLanes(0); refresh(); cam.theta=OPEN_THETA; }

/* =============================================================
 *  UI
 * ============================================================= */
const rxmsgEl=document.getElementById('rxmsg');
// THE CAPTION IS THE STEP YOU ARE ABOUT TO RUN, not the one you just ran —
// read on the beat BEFORE the molecule changes. An explanation after the
// animation already answered it is a caption for something you stopped looking
// at. Still DERIVED, so rewinding works without remembering which toast fired.
// The intro gets the band too, and the finished pathway keeps step 10's, which
// is where the net tally is said.
const INTRO_MSG=`<b>Glucose</b> — six carbons, drawn as the ring it mostly adopts in water. `
  +`Glycolysis runs in the <b>cytosol</b> and needs <b>no oxygen</b>; nearly everything alive has it.`;
const captionAt=i=>intro ? INTRO_MSG
  : i<nSteps ? STEPS[i].msg          // the step about to run — or, while
  : STEPS[nSteps-1].msg;             // reviewing, the one just run (see focusStep)
                                     // pathway finished: the closing tally stands
// The heading over the BUTTON — drawn by drawAct, not here. Which of the ten
// this is plus the one word to carry away, both read off the step, so heading,
// rail and textbook all say the same "step 6".
const headAt=i=>{ const st=STEPS[i]; return st?`Step ${st.n} <em>(${st.hook})</em>`:''; };
let shownCaption=null;
function drawCaption(){
  // NO CAPTION ON THE REVIEW SCREEN — that beat is for looking at what you
  // made; the words were read before it ran.
  // THE BAND IS THE INTRO, and nothing else. Each step's caption lives on the ⓘ
  // on its heading, and the end screen's is the closing tally, which says the
  // same thing in molecules. So the band holds ONE height (zero) from step 1
  // on, which is what usable() wants: no re-frame mid-step.
  const bare = intro;
  const html = bare ? captionAt(focusStep()) : '';
  const show = bare && !reviewing;
  if(html!==shownCaption){                     // don't restart the fade
    shownCaption=html;
    rxmsgEl.querySelector('p').innerHTML=html;
    rxmsgEl.classList.remove('in'); void rxmsgEl.offsetWidth;
    if(show) rxmsgEl.classList.add('in');
  }
  rxmsgEl.classList.toggle('show', show);
}

const ledgerEl=document.getElementById('ledger');

let prevLedger=null;
// AWAY AT THE INTRO, PINNED UP ON BEGIN. Fires on the transition only — a
// restart sends it back to the intro so it goes up again next time; every
// other redraw leaves it alone.
/* THE LEDGER IS BEHIND A TOGGLE, default OFF. The arithmetic is the lesson's
 * punchline, not its running commentary — open from step 1 it reads as a
 * spreadsheet beside a reacting molecule, saying 0 most of the way.
 * EXCEPT ON THE END SCREEN, where the sticker is one of the four cells of the
 * closing tally and the toggle has nothing to say about it. */
let showLedger=false;
const ledgerOn=()=>showLedger||tallyOn();
function placeLedger(){
  const hid=ledgerEl.classList.contains('hid');
  if(intro || !ledgerOn()){ ledgerEl.classList.remove('pin'); ledgerEl.classList.add('hid'); return; }
  if(!hid) return;                       // already up: this is an ordinary redraw
  ledgerEl.classList.remove('hid');
  ledgerEl.classList.remove('pin'); void ledgerEl.offsetWidth;   // restart it
  ledgerEl.classList.add('pin');
}
/* WHAT THE PATHWAY HAS MADE SO FAR, one object. The two PRODUCTS come off the
 * same state everything else reads: NADH from the ledger, pyruvate from what is
 * standing in the lanes — so neither number can drift from the stage. Shared by
 * the ledger rows and the closing tally, so the sticker and the molecules
 * beside it cannot disagree. */
function productsAt(i){
  const L=ledgerAt(i);
  L.net=L.made-L.spent;   // a row like the others, so it flashes by the same rule
  L.pyr=(lanes.length?lanes.map(l=>l.key):speciesAt(i))
          .filter(k=>k==='pyruvate').length;
  return L;
}
function drawLedger(){
  placeLedger();
  const L=productsAt(done), net=L.net, c=speciesAt(done).map(k=>M[k].gly.carbons);
  // A NUMBER THAT CHANGED FLASHES WHERE IT STANDS. The cause is already legible
  // on the stage — the tray tile discharges, the phosphate crosses — so the
  // ledger's job is to be correct when you look at it, not to compete for the
  // look.
  const prev=prevLedger;
  const bumped=k=>prev && prev[k]!==L[k] ? ' bump':'';
  const netStr=v=>`${v>0?'+':v<0?'−':''}${Math.abs(v)}`;
  ledgerEl.innerHTML=
     `<div class="lhead">Running ledger</div>`
    +`<div class="row"><span>ATP spent</span><span class="v${bumped('spent')}" data-row="spent">${L.spent}</span></div>`
    +`<div class="row"><span>ATP made</span><span class="v${bumped('made')}" data-row="made">${L.made}</span></div>`
    // typographic minus, not a hyphen — the dip to −2 is the single number this
    // page is built to make land
    +`<div class="row net"><span>Net ATP</span><span class="v${bumped('net')}" data-row="net">${netStr(net)}</span></div>`
    // THE OTHER TWO THINGS GLYCOLYSIS PRODUCES. ATP is the headline, but a
    // student has to be able to say "2 ATP, 2 NADH and 2 pyruvate". The tray
    // still carries NADH as the loaded half of a pair — the reading that makes
    // NAD⁺ running to 0 mean something; this is the tally beside it.
    +`<div class="row prod"><span>NADH</span><span class="v${bumped('nadh')}" data-row="nadh">${L.nadh}</span></div>`
    +`<div class="row"><span>Pyruvate</span><span class="v${bumped('pyr')}" data-row="pyr">${L.pyr}</span></div>`
    +`<div class="row carb"><span>Carbons</span><span class="v">${c.join(' + ')}${c.length>1?' = 6':''}</span></div>`;
  prevLedger=L;
}

const trayEl=document.getElementById('tray');

/* =============================================================
 *  THE ATP/ADP CARRIER — one object that changes, not two cards
 * =============================================================
 *  ATP and ADP are the same object: three phosphates on the chain or two, spent
 *  at steps 1 and 3, recharged at 7 and 10. Which is showing is read off the
 *  step's `couple` (cin before it runs, cout after).
 *
 *  ONE DRAWING: `atpSkel`, the tetraanion built from ideal geometry (see ATP
 *  at the top of this script for why the built one, not the conformer), in the
 *  main scene so it stands beside the sugar under the same camera. ADP is that
 *  molecule with `gly.gamma` hidden — Pγ and its three terminal O, exactly the
 *  PO₃⁻ a kinase moves. The bridging oxygen stays behind on ADP, because that
 *  is where it actually stays.
 *
 *  NO SCHEMATIC VIEW. Adenosine plus three circles quietly claims what the real
 *  molecule refutes — that ATP is mostly phosphate. It is mostly adenosine;
 *  three atoms in thirty-one are what the cell spends.
 */
/* ---------- THE CARRIER PAIRS ----------
 * The two this page uses: ATP/ADP by the transferring phosphoryl, NADH/NAD⁺ by
 * the hydride on the nicotinamide C4. `group` is hidden to show the discharged
 * state, `anchor` is the atom a flight aims at, both read off the spec's own
 * `gly` block.
 *
 * NAD⁺ IS DRAWN AS NADH MINUS ONE HYDROGEN — a declared schematic
 * (MolecularGeometry.md §1.6). `nic.h` is the PAIR of hydrogens on C4, and
 * taking one away is the chemistry the step teaches: NAD⁺ takes a hydride, C4
 * goes from one H to two. Not shown: the ring going aromatic and flat again,
 * since the spec is built as the dihydro boat (`nadh` in mol-pathways.js) and
 * one drawing cannot be both. The page's claim is about C4's hydrogens.
 */
const PAIRS={
  ATP:{ spec:()=>ATP,    group:s=>s.gly.gamma,      anchor:s=>s.gly.pg,
        on:'ATP',  off:'ADP',
        sub:on=>`${on?ATP.gly.phosphates:ATP.gly.spent.phosphates} phosphates · ${on?'charged':'discharged'}`},
  // BOTH of C4's hydrogens are in nadh's `optH`, and this page builds every
  // molecule setOptionalH(false) — so without `keep` NAD⁺ and NADH are the same
  // 73 atoms and the step shows nothing.
  NAD:{ spec:()=>NADH, group:s=>[s.gly.nic.h[1]], anchor:s=>s.gly.nic.c4,
        keep:s=>[s.gly.nic.h[0]],
        on:'NADH', off:'NAD⁺',
        sub:on=>on?'carrying the hydride':'empty carrier'},
};
// Which pair a step touches, off its couple — never typed at the call site.
const CARRIER=new Set(['ATP','ADP','NAD','NADH']);
function pairOf(st){
  const c=st&&st.couple; if(!c) return null;
  const k=carrierKey(c.cin);
  return (k==='ATP'||k==='ADP') ? PAIRS.ATP : (k==='NAD'||k==='NADH') ? PAIRS.NAD : null;
}
const carrierEl=document.createElement('div');
carrierEl.id='carrier';
carrierEl.innerHTML=
   '<span class="need"></span>'
  +'<div class="cname"></div><div class="csub"></div>'
  +'<div class="cvis"></div><div class="cscale"></div>';

/* ONE MOLECULE PER UNIT THE STEP MOVES, stacked down the column (kit/carriers.js
 * lays them out). Steps 1 and 3 show one; 7 and 10 charge TWO ADP and show two,
 * since after the split everything happens twice and one drawing would say
 * "2 ATP" in words while showing one object. Count comes off the step's own
 * `spent`/`made`, the numbers the ledger adds up.
 * `#carrier` also holds the space the tray reserves, so the camera's left inset
 * is measured off this DOM. */
const CAR=Carriers.create({ root, camera, canvas, host:carrierEl,
  // LEFT, NOT CENTRED. The column is tall and narrow, so every carrier is
  // fitted on its HEIGHT and none fills the width — centred leaves a gutter
  // down both sides, and the right one eats the room the stage wants between
  // the tray and the sugars.
  align:'left',
  build:spec=>{ const g=Stage.buildMolecule(spec,{center:true});
                Stage.setOptionalH(g,false);   // same convention as the pathway lanes
                return g; } });
// how many: the units the step moves, off the fields the ledger adds up
const carrierCount=st=>Math.max(1, (st&&(st.made||st.spent||st.nadh))||1);
// The discharged state is the charged one with the pair's group hidden.
const setCarrierGroup=(g,pair,spec,charged)=>
  CAR.setGroup(g, pair.group(spec), charged, pair.keep && pair.keep(spec));
/* WHICH INSTANCE HAS ALREADY MOVED. On a per-lane step instance j belongs to
 * lane j: click lane 0 and the first ADP becomes an ATP while the second waits,
 * the whole reason there are two. Elsewhere the step is all-or-nothing and
 * `reviewing` answers for every instance at once.
 * `carrierGone` is the same answer for the beat in between: for the FLY ms a
 * phosphate is crossing, the step has not landed and `reviewing` is false, so
 * without it the ATP shows three phosphates while a fourth sails away. The bond
 * was clicked; it broke then. Cleared when the step lands and by every jump out
 * of a step.
 * SET AT WHICHEVER END THE TRANSFER IS VISIBLE FROM — it means "this instance
 * has already moved", not "something left it". A spend sets it when the flight
 * STARTS: the sugar takes the phosphate off ATP the moment it goes. A gain
 * (step 6) sets it when the hydride ARRIVES, because that is when NAD⁺ has it.
 * Same instant either way — the one the student is looking at. */
const carrierGone=new Set();
const carrierRan=j=>reviewing||laneDone.has(j)||carrierGone.has(j);
// a spend starts charged and ends flat; a charge, the reverse
const carrierCharged=(st,j)=>
  (st&&st.couple&&st.couple.up) ? !carrierRan(j) : carrierRan(j);

/* ---------- CLICKING THE BOND THAT BREAKS ----------
 * The disc is the affordance, so the disc is the hit area — exactly what step 2
 * uses on the sugar: a transparent circular button in #spots, pinned to the
 * disc's projected point (placeCarrierGlow places both) and the same size, so
 * what is clickable is what is lit. Never the whole #carrier box: 400×470px of
 * mostly empty column runs the step from nothing in particular.
 * Steps 7 and 10 have no disc HERE — their bond is on the sugar, each lane
 * carrying its own (`spot:{at:'hot'}`). `carrierLive`, set by drawCarrier,
 * separates the two cases.
 */
let carrierLive=false;              // a spend step, ATP showing: the disc is up

// KEEP IT OVER ITS OWN BOX. Being in the scene, it would otherwise swing away
// on an orbit and drift on a zoom; anchoring to the reserved box every frame
// keeps the left column where the layout says. Position only — it still turns
// with the scene, because it is in it.
const cAnchor=new THREE.Vector3();
const popCarrier=j=>CAR.pop(j);
// The page's part is only WHETHER it should be on screen; the module solves
// where and how big, and hands back the fitted scale for the caption below.
function placeCarrierMol(){
  const vis = carrierEl.isConnected && trayEl.style.visibility!=='hidden';
  const k=CAR.place(vis);
  if(vis && CAR.mols.length) setCarrierScaleNote(k, Stage.measure(CAR.spec||ATP));
}
// The line under the drawing. `k` is the shrink applied this frame; the ratio
// beside it is what scale 1 would look like, measured off the same two specs
// the stage draws. Written only when the text changes — this runs every frame.
let scaleNote='';
function setCarrierScaleNote(k, m){
  const gl=Stage.measure(M.glucose);
  const txt = k>=0.995 ? `true size beside the sugar`
    // rounded to 5%: the fit moves a few points as camera insets change, and a
    // caption ticking 41 → 46 while the molecule sits still reads as a
    // measurement. The claim is the order of the number
    : `shown at ${Math.round(k*20)*5}% — really ${(m.rxz/gl.rxz).toFixed(1)}× glucose across`;
  if(txt===scaleNote) return;
  scaleNote=txt;
  carrierEl.querySelector('.cscale').textContent=txt;
}

/* ---------- the bond a phosphoryl transfer makes or breaks, marked ----------
 * Step 2 says "this bond comes apart" with a pulsing disc behind the bond
 * (.sglow, drawSpots); a kinase step gets the same mark behind the bond the
 * enzyme breaks on ATP. Steps 7 and 10 run the same transfer the other way, so
 * the SAME bond is the one that forms as the phosphate lands — see the `out`
 * verb, which rings it there.
 *
 * Neither end is typed. `MolGraph.leavingBond` derives it: the bond a P's
 * departure breaks is P to its BRIDGING oxygen, so the mark and the four atoms
 * that fly cannot disagree about which bond this step is.
 *
 * IT IS Pγ–O, NOT Pβ–O — an easy bond to get wrong. A kinase moves PO₃⁻: Pγ and
 * its three terminal oxygens leave (`gly.gamma`, four atoms) and the β–γ
 * BRIDGING oxygen stays behind as a terminal oxygen of ADP, which is why
 * `gamma` is four atoms and not five and what `setGroup` hides to draw ADP.
 * Marking Pβ–O points at a bond that survives the step and implies ADP loses
 * the oxygen it keeps — one bond off, on the two beats the ATP ledger rests on.
 * Derived, so it is provable: cutting Pγ–O detaches exactly `gamma`; cutting
 * Pβ–O detaches five atoms. kit/check-kit.js asserts that a phosphoryl group
 * leaves its bridging oxygen behind.
 *
 * (Pβ–O cleavage is a real reaction, just not this one: it is adenylyl
 * transfer, which releases pyrophosphate and leaves AMP.)
 */
const cglowEl=document.getElementById('cglow');
let breakBond=null;
function gammaBreak(){
  if(breakBond) return breakBond;
  const b=MolGraph.leavingBond(ATP, ATP.gly.pg);
  return (breakBond = b || [-1,-1]);
}
const cglowV=new THREE.Vector3();
const cspotEl=document.getElementById('cspot');
cspotEl.onclick=()=>press(runStep);
function placeCarrierGlow(){
  // WHICH bond is this page's (gammaBreak); WHERE it is on instance 0 is the
  // module's, and it answers null rather than guessing when there is nothing
  // on screen — so the mark can never end up lit at the origin.
  const mid = carrierLive ? CAR.bondMid(0, ...gammaBreak(), cglowV) : null;
  const on = !!mid;
  cglowEl.style.display = on ? 'block' : 'none';   // '' would fall back to the CSS `none`
  cspotEl.hidden = !on;                            // lit and clickable together
  if(!on) return;
  cglowV.project(camera);
  const x=(cglowV.x*0.5+0.5)*canvas.clientWidth, y=(-cglowV.y*0.5+0.5)*canvas.clientHeight;
  const d=cglowEl.querySelector('.sglow');
  d.style.left=x+'px'; d.style.top=y+'px';
  cspotEl.style.left=x+'px'; cspotEl.style.top=y+'px';
}
// Where the phosphate flight starts or ends, in client pixels: the γ phosphate
// of the instance this click moves — on a per-lane step lane j's own ADP, not
// "the carrier".
function carrierGammaPoint(j){
  if(trayEl.style.visibility==='hidden') return null;
  const pair=pairOf(stepAt(focusStep())) || PAIRS.ATP;
  return CAR.pointAt(j, pair.anchor(pair.spec()));
}
// Carrier for a step. The ELEMENT persists across refreshes (moved, never
// rebuilt) so the molecule in it isn't torn down every step.
function drawCarrier(st, live, showKey){
  const pair=pairOf(st) || PAIRS.ATP, spec=pair.spec();
  const count=carrierCount(st);
  // `live` on the BOX = the box is the button, FALLBACK only when nothing on a
  // molecule runs the step (a spend puts the disc on ATP's own bond, #cspot;
  // other carrier steps on the sugar). A 400×470px column running the step is
  // not "click the bond", so no pointer, no cursor.
  const boxLive = live && !(st && (st.spot || (st.couple && st.couple.up)));
  carrierEl.className = (boxLive?'live':'') + (count>1?' multi':'');
  // THE PROMPT SITS WHEREVER THE TARGET IS: on a spend that's the bond on the
  // stage (#cglow), so this stays empty rather than repeat it.
  carrierEl.querySelector('.need').textContent = boxLive ? `← ${st.need}` : '';
  carrierEl.onclick = boxLive ? ()=>press(runStep) : null;
  // disc and button go up together; placeCarrierGlow reads this. Only the ATP
  // pair has a bond to break HERE — the hydride leaves the sugar, so step 6's
  // target is on G3P.
  carrierLive = live && pair===PAIRS.ATP && showKey==='ATP' && count===1;
  CAR.show(count, spec);
  // EACH INSTANCE ANSWERS FOR ITSELF: on a per-lane step one can be loaded and
  // the other empty — the half-run state, which one headline name cannot say.
  // Name on the slot; a column heading only when there is one object to name.
  const slots=carrierEl.querySelectorAll('.cslot');
  CAR.mols.forEach((g,j)=>{
    const on=carrierCharged(st,j);
    setCarrierGroup(g,pair,spec,on);
    const lab=slots[j] && slots[j].querySelector('.clab');
    if(lab) lab.textContent = on ? pair.on : pair.off;
  });
  const anyOn=carrierCharged(st,0);
  carrierEl.querySelector('.cname').innerHTML = count>1 ? '' : (anyOn?pair.on:pair.off);
  carrierEl.querySelector('.csub').textContent = count>1 ? '' : pair.sub(anyOn);
  placeCarrierMol();
}

function drawTray(){
  // Invisible until Begin, but NOT absent: inert pools beside Begin invite the
  // wrong click. Keeps its SPACE — usable() measures it to place the lesson,
  // and a zero-size tray jumps the opening screen sideways on the first click.
  trayEl.style.display='flex';
  trayEl.style.visibility = intro ? 'hidden' : 'visible';
  trayEl.style.pointerEvents = intro ? 'none' : '';
  // ONLY THE CARRIERS THIS STEP TOUCHES, read off the step, never typed: the
  // ledger carries the arithmetic, so a standing five is four inert tiles
  // competing with the one that matters. Cost: NAD⁺ and Pi walking down to 0
  // are not visible.
  const i=focusStep();
  const st=(!intro&&i<nSteps)?stepAt(i):null;
  const pool=poolAt(done);
  const c=st&&st.couple;
  const want=new Set();
  if(st&&st.reagent) want.add(st.reagent);
  if(c){ want.add(carrierKey(c.cin)); want.add(carrierKey(c.cout)); if(c.plus) want.add(c.plus); }
  // A rearrangement touches no carrier: keep the space, show nothing.
  if(!want.size){ trayEl.style.visibility='hidden'; }
  // NO HEADING. "Carriers" would name a column whose one occupant already
  // carries its own name (ATP, NADH) two lines below it.
  trayEl.innerHTML='<div class="tstrip"></div>';
  const strip=trayEl.children[0];
  // ATP AND ADP ARE ONE ROW, NOT TWO. Which of the pair shows comes off the
  // couple — cin until the step has run, cout after — so the object changes at
  // exactly the moment the phosphate lands.
  const pair = c && CARRIER.has(carrierKey(c.cin)) && CARRIER.has(carrierKey(c.cout));
  if(pair){
    const showKey = carrierKey(reviewing ? c.cout : c.cin);
    // BACK IN THE TRAY FIRST: `trayEl.innerHTML` above detached it, and
    // drawCarrier places molecules by `isConnected` — placing while detached
    // replays the entrance animation on every refresh (see popCarrier).
    strip.appendChild(carrierEl);      // moved, never rebuilt — see drawCarrier
    drawCarrier(st, !!st && CARRIER.has(st.reagent) && !busy && !reviewing, showKey);
  }
  // NO CARD FOR Pi: this step's phosphate drifts out of the cytosol onto the
  // sugar (see aboveFrame). A tray copy = the same molecule on screen twice.
}

/* =============================================================
 *  THE CLOSING TALLY — everything glycolysis made, in one 2x2
 * =============================================================
 *  The sentence the student leaves with — 2 ATP, 2 NADH, 2 pyruvate — is made
 *  of molecules like everything else: each product is its own molecule with its
 *  count under it, and the ledger sticker comes out of the sidebar to sit among
 *  the things it counts.
 *
 *  MOLECULES IN THE SCENE, not pictures: kit/carriers.js, one instance per
 *  cell, projected into the cell's slot under the same camera as the pathway —
 *  so pyruvate here is the size pyruvate was in the lanes.
 *
 *  ONE MOLECULE, A PRINTED COUNT — not n copies. The lanes make the "twice"
 *  visible for the whole lesson; this is the receipt.
 *
 *  THE LANES GO DARK UNDER IT, else the two pyruvate are on screen twice at
 *  different sizes, which reads as four.
 */
const tallyEl=document.getElementById('tally');
const sideEl=document.getElementById('side');
const TALLY=[
  // count is read from the same tally the ledger prints (productsAt), never
  // typed: a re-baked step count must not be able to falsify this line.
  {k:'atp',  spec:()=>ATP,         name:'ATP',      n:L=>L.net},
  {k:'nadh', spec:()=>NADH,        name:'NADH',     n:L=>L.nadh,
   // setOptionalH hides C4's two hydrogens, which are the whole difference
   // between NAD⁺ and NADH — the charged form has to ask for them back.
   keep:PAIRS.NAD},
  {k:'pyr',  spec:()=>M.pyruvate,  name:'Pyruvate', n:L=>L.pyr},
];
TALLY.forEach(t=>{
  t.host=tallyEl.querySelector(`[data-cell="${t.k}"]`);
  t.car=Carriers.create({ root, camera, canvas, host:t.host,
    visClass:'tvis', slotClass:'tslot', slotHTML:()=>'<div class="tslot"></div>',
    build:spec=>{ const g=Stage.buildMolecule(spec,{center:true});
                  Stage.setOptionalH(g,false); return g; } });
});
const tallyOn=()=>!intro && !reviewing && done>=nSteps;
function drawTally(){
  const on=tallyOn();
  tallyEl.hidden=!on;
  // THE STICKER MOVES, never a second copy — drawLedger keeps writing into the
  // same element wherever it is standing. Only on a change of parent, so an
  // ordinary redraw does not re-run its pin-up animation.
  const home = on ? document.getElementById('tledger') : sideEl;
  if(ledgerEl.parentNode!==home){
    if(on) home.appendChild(ledgerEl); else sideEl.insertBefore(ledgerEl, sideEl.firstChild);
  }
  // the pathway, out of the way (see the header)
  lanes.forEach(l=>{ l.g.visible=!on; });
  platesEl.style.visibility = on ? 'hidden' : '';
  const L=productsAt(done);
  TALLY.forEach(t=>{
    if(!on){ t.car.show(0,t.spec()); return; }
    const spec=t.spec();
    t.car.show(1,spec);
    if(t.keep) t.car.mols.forEach(g=>
      t.car.setGroup(g, t.keep.group(spec), true, t.keep.keep(spec)));
    t.host.querySelector('.tcount').textContent='×'+t.n(L);
    t.host.querySelector('.tname').textContent=t.name;
  });
  placeTallyMols();
}
function placeTallyMols(){ const on=tallyOn(); TALLY.forEach(t=>t.car.place(on)); }

/* =============================================================
 *  THE ENZYME — a blob behind the sugar, and its name
 * =============================================================
 *  Every step of this pathway is an enzyme's doing, so one is on screen: a
 *  translucent shape the substrate sits inside, plus the enzyme's name. Behind
 *  a toggle, default OFF — the pathway is the lesson and the catalysts are the
 *  second reading.
 *
 *  DELIBERATELY NOT A PROTEIN. No structure is drawn: the shape is one path,
 *  the same one for all ten, and it makes no claim about fold, size or active
 *  site. A drawn enzyme at this scale would be wrong in every one of those.
 *  (Hemoglobin is where a real protein gets drawn — see hemoglobin-lab.)
 *
 *  ONE PER LANE, sized off the molecule's own measured radius, so the two
 *  halves after step 4 get two enzymes — which is the fact the lanes exist to
 *  teach: after the split, everything happens twice.
 *
 *  THE NAME IS READ OFF THE STEP (`enz`), never typed here.
 */
const BLOB_SVG=`<svg viewBox="0 0 531 528" xmlns="http://www.w3.org/2000/svg"><path d="M14.0403 187.57C-36.6082 307.163 59.7274 415.385 144.526 478.781C237.618 537.923 347.243 542.481 400.031 499.359C466.016 445.457 540.795 289.771 529.943 198.244C512.779 53.4757 415.879 9.91198 323.366 0.81307C225.413 -8.82082 64.6887 67.9781 14.0403 187.57Z" fill="#46B2E5" fill-opacity="0.45"/></svg>`;
// HOW MUCH BIGGER THAN THE MOLECULE. 1 = the blob's box exactly spans the
// molecule's widest extent; tune here. An enzyme really is far bigger than its
// substrate, but a blob that says so fills the stage and buries the sugar the
// lesson is following, so this is a hold, not a scale claim.
const BLOB_K=1.3;
const enzEl=document.getElementById('enzymes');
const enzNameEl=document.getElementById('enzname');
const enzMetaEl=document.getElementById('enzmeta');
const enzNoteEl=document.getElementById('enznote');
const enzBtn=document.getElementById('showenz');
let showEnz=false;
// The enzyme of the step being described — the same index the heading, tray and
// coupling box use, so on the review beat it is still the one that just ran.
const enzOf=()=>{ const i=focusStep(); return (!intro && i<nSteps) ? STEPS[i] : null; };
const enzLive=()=>showEnz && !!enzOf() && !tallyOn();
/* WHICH LANES THE ENZYME IS ON — one GROUP of lanes per blob, not one per lane.
 * An enzyme molecule holds one substrate molecule, so the count of blobs is a
 * claim, and "one per lane" makes the wrong one twice in ten:
 *   · step 4, aldolase: ONE F1,6-BP, one enzyme, and it releases TWO products.
 *     So it is ONE blob, placed on the sugar and then held still while the
 *     halves part (placeEnz freezes it) — which is what an enzyme releasing two
 *     products does. On DHAP alone it would say aldolase kept one half;
 *     tracking both, that the enzyme slid across the stage.
 *   · step 5, triose-phosphate isomerase: acts on DHAP only. The other lane's
 *     G3P is standing in the cytosol, in nothing.
 * Steps 6-10 genuinely run twice, so those get two blobs — the fact the two
 * lanes exist to teach.
 * DERIVED, NEVER TYPED: the lanes whose species this step CHANGES. A step that
 * changes the lane COUNT is one substrate by definition, so it is one group. */
const enzGroupsFor=i=>{
  const before=speciesAt(i), after=STEPS[i].species;
  if(after.length!==before.length) return 'all';
  return before.map((k,j)=>k===after[j]?-1:j).filter(j=>j>=0).map(j=>[j]);
};
const SPLIT_KEY='all';
const enzGroups=()=>{
  const g=enzGroupsFor(focusStep());
  if(g===SPLIT_KEY) return [lanes.map((_,j)=>j)];
  return g.filter(grp=>grp.every(j=>j<lanes.length));
};
/* THE KEY IS THE STEP. A blob is placed ONCE per step and then held still for
 * the whole of it: the sugar moves inside the enzyme, not the other way round.
 * A blob that tracks the molecule slides across the stage as the halves part at
 * step 4 and re-centres at step 1 as the phosphate lands.
 * The lane SET is in the key too, so step 5's single blob and step 6's two are
 * a rebuild; a split keeps one key even though the lane count changes under it. */
const enzKey=()=>{ const g=enzGroupsFor(focusStep());
  return focusStep()+':'+(g===SPLIT_KEY ? SPLIT_KEY : g.map(x=>x.join('+')).join(',')); };
function drawEnz(){
  const st=enzLive()?enzOf():null;
  enzEl.hidden=!st; enzNameEl.hidden=!st;
  if(st) enzNameEl.innerHTML=`<div class="ek">Enzyme</div><div class="en">${st.enz}</div>`;
  else enzEl.innerHTML='';
  drawEnzMeta();
  placeEnz();
}

/* WHAT KIND OF STEP THIS IS — coupled or not, one-way or not — as two words on
 * the stage rather than two headings buried in a card. Both read off the step
 * (`couple`, `rev`), never typed, and both are the door to the card that argues
 * them — otherwise the energy curve is the only place either fact appears, and
 * it only appears on the review beat.
 * Pressing a word opens that card for this step; pressing again closes it.
 * Shown whether or not the enzymes are on: these are facts about the step, not
 * about the catalyst. */
let cplOpen=false, metaStep=null;
function drawEnzMeta(){
  const i=focusStep();
  const st=(!intro && i<nSteps && !tallyOn()) ? stepAt(i) : null;
  // A NEW STEP CLOSES IT. The card describes one step; carrying it open across
  // a click would leave the previous step's verdict standing over a new stage.
  if(metaStep!==i){ metaStep=i; cplOpen=false; }
  enzMetaEl.hidden=!st;
  // the step's one memorable line, on the same schedule as the verdicts
  enzNoteEl.hidden=!(st&&st.takeaway);
  enzNoteEl.textContent=(st&&st.takeaway)||'';
  if(!st){ enzMetaEl.innerHTML=''; return; }
  const on=cplOpen?'true':'false';
  // the mark takes the FIRST word's colour, read off the same two facts that
  // decide which words there are
  const first = st.couple ? 'k-cpl' : (st.rev===false ? 'k-irr' : 'k-rev');
  enzMetaEl.innerHTML=
      `<span class="east ${first}" aria-hidden="true"></span>`
    + (st.couple ? `<button class="estat k-cpl" data-cpl aria-pressed="${on}">Coupled reaction</button>` : '')
    + `<button class="estat ${st.rev===false?'k-irr':'k-rev'}" data-cpl aria-pressed="${on}">${
        st.rev===false?'Irreversible':'Reversible'}</button>`;
}
enzMetaEl.addEventListener('click',e=>{
  if(!e.target.closest('[data-cpl]')) return;
  cplOpen=!cplOpen;
  drawEnzMeta(); drawCouple();
});
const enzV=new THREE.Vector3(), tmpV3=new THREE.Vector3();
// Is every lane in this group on its mark? kit/lanes.js eases position toward
// userData.tx/ty; within a hundredth of a world unit is under a pixel here.
function laneSettled(grp){
  return grp.every(j=>{ const l=lanes[j]; if(!l) return false;
    const u=l.g.userData;
    return (u.tx==null||Math.abs(l.g.position.x-u.tx)<0.01)
        && (u.ty==null||Math.abs(l.g.position.y-u.ty)<0.01); });
}
// Called by onResize; try/catch because a ResizeObserver can fire before this
// half of the script has run and `enzEl` is a const in its dead zone then.
function enzUnfreeze(){
  try{ [...enzEl.children].forEach(el=>delete el.dataset.set); }catch(e){}
}
function placeEnz(){
  if(enzEl.hidden || !lanes.length) return;
  // One blob per OCCUPIED lane. The elements are rebuilt only when the COUNT
  // changes — a running wiggle must not restart because some other readout
  // redrew — and clearing `set` is what re-places them.
  const on=enzGroups(), key=enzKey();
  if(enzEl.dataset.on!==key){
    enzEl.dataset.on=key;
    if(enzEl.children.length!==on.length)
      enzEl.innerHTML=on.map(()=>`<div class="enzblob">${BLOB_SVG}</div>`).join('');
    [...enzEl.children].forEach(el=>delete el.dataset.set);
  }
  const w=canvas.clientWidth, h=canvas.clientHeight;
  if(!w||!h) return;
  camera.updateMatrixWorld();
  // ortho, so one world unit is the same pixels anywhere in the frame
  const pxPerWorld=w/(camera.right-camera.left);
  on.forEach((grp,slot)=>{
    const el=enzEl.children[slot]; if(!el) return;
    if(el.dataset.set) return;                  // placed for this step already
    // MEASURED OFF THE MESHES, not off the lane's bookkeeping. The group's
    // origin is not the drawing's centre (kit/lanes.js parks each species by
    // its own recentring offsets), and a spec measure is the RESTING molecule —
    // step 1's sugar grows a phosphate and its centre moves. The atoms on
    // screen answer both at once.
    let lo=null, hi=null;
    grp.forEach(j=>{ const l=lanes[j]; if(!l) return;
      l.g.userData.atomMeshes.forEach(m=>{
        if(!m||!m.visible) return;
        const p=m.getWorldPosition(tmpV3);
        if(!lo){ lo=p.clone(); hi=p.clone(); return; }
        lo.min(p); hi.max(p);
      });
    });
    if(!lo) return;
    // SQUARE OVER ONE MOLECULE, off the LARGER extent. Sizing width and height
    // separately is worse: these molecules are tall and thin, so the blob
    // becomes a narrow stripe, and stretching the path into a tall ellipse
    // turns the ambient drift into a visible spin.
    const d=Math.max(hi.x-lo.x, hi.y-lo.y, 1.2)*pxPerWorld*BLOB_K;
    enzV.copy(lo).add(hi).multiplyScalar(0.5).project(camera);
    el.style.width=el.style.height=d.toFixed(1)+'px';
    el.style.left=((enzV.x*0.5+0.5)*w).toFixed(1)+'px';
    el.style.top =((-enzV.y*0.5+0.5)*h).toFixed(1)+'px';
    // FREEZE ONLY ONCE THE LANE HAS STOPPED MOVING. A swap drops the product in
    // and eases it to its centring over the next few frames, so freezing on the
    // first frame pins the blob to a molecule still on its way — small and off
    // to one side.
    if(laneSettled(grp)) el.dataset.set='1';
  });
}
const ledgerBtn=document.getElementById('showledger');
const ledgerBox=ledgerBtn.querySelector('input');
ledgerBox.onchange=()=>{ showLedger=ledgerBox.checked; refresh(); };
const enzBox=enzBtn.querySelector('input');
enzBox.onchange=()=>{ showEnz=enzBox.checked; drawEnz(); };

const actEl=document.getElementById('actbtn');
const stepHeadEl=document.getElementById('stephead');
const stepTipEl=document.getElementById('steptip');
const BURST_MS=190;   // just under the .3s press flash
let pressing=false;
// EVERY PRESS: flash first, work under its tail — acting immediately re-renders
// the button out from under its own animation. setTimeout, not transitionend: a
// backgrounded tab must still arrive at the next state (see `later`).
function press(fn){
  if(pressing || busy) return;
  pressing=true;
  actEl.classList.add('burst');
  later(()=>{ pressing=false; fn(); }, BURST_MS);
}
function beginPathway(){
  if(!intro) return;
  press(()=>{
    intro=false; refresh();
    // Framing doesn't change here (Begin is button-sized, tray held its space)
    // but the caption does, and usable() measures #bottombar live.
    computeFit();
  });
}
function drawAct(){
  // THE HEADING TRACKS THE BEAT: step + hook on the way in, step done on the
  // way out, nothing at intro or end. Holds its height when empty.
  const hi=focusStep();
  const head = intro ? ''
             : reviewing ? `Step ${STEPS[done-1].n} complete`
             : hi<nSteps ? headAt(hi)
             : '';
  // THE CAPTION HANGS OFF THE HEADING: the ⓘ carries that step's own text, so
  // there is one caption per step and one place it comes from.
  const tip = head ? captionAt(hi) : '';
  stepHeadEl.innerHTML = head + (tip
    ? `<span class="infowrap"><button class="infobtn" type="button"
         aria-describedby="steptip"
         aria-label="What happens in this step">i</button></span>`
    : '');
  stepTipEl.innerHTML = tip;
  stepHeadEl.classList.toggle('on', !!head);
  // THE REVIEW BEAT ARRIVES AS ONE THING, after the molecule: verdict, button
  // and coupling box share the delay, so none lands while the glow/settle still
  // play. On the state CHANGE only — a refresh mid-review must not replay it.
  const entering = reviewing && !shownReview;
  shownReview = reviewing;
  // Restarted on the way in only, else a mid-flight refresh strips the class
  // and snaps both to full strength halfway through.
  if(entering){ stepHeadEl.classList.remove('revin'); void stepHeadEl.offsetWidth; }
  stepHeadEl.classList.toggle('revin', reviewing);
  // ONE BUTTON, ONE PLACE, ONE WORD. Begin and every step share this element,
  // so the thing to click never jumps between stage and sidebar.
  if(intro){
    actEl.style.visibility='visible';
    actEl.className='';        // the same button, the same size, in the same slot
    actEl.innerHTML=`Begin <i class="ph-bold ph-arrow-right"></i>`;
    actEl.onclick=beginPathway;
    return;
  }
  actEl.className = reviewing ? 'revin' : '';
  // THE REVIEW SCREEN'S ONE CONTROL. Next is how you say you have looked at
  // the molecule. Also step 10's last beat — press it and the closing question
  // comes up.
  if(reviewing){
    actEl.style.visibility='visible';
    actEl.innerHTML=`Next <i class="ph-bold ph-arrow-right"></i>`;
    actEl.onclick=()=>{ reviewing=false; refresh(); };
    return;
  }
  const st=done<nSteps?stepAt(done):null;
  // THE LAST BUTTON IS IN THE SAME SLOT AS EVERY OTHER — so the closing
  // question is here too, not three cards arriving over the pyruvate.
  if(!st && !busy){
    actEl.style.visibility='visible';
    actEl.innerHTML=`What's next? <i class="ph-bold ph-arrow-right"></i>`;
    actEl.onclick=()=>Fork.show();
    return;
  }
  if(!st || busy){ actEl.style.visibility='hidden'; actEl.onclick=null; return; }
  // A REAGENT STEP HAS NO BUTTON: the click belongs on the carrier — you cannot
  // phosphorylate without spending an ATP, and a Next would be an easier way
  // past the lesson. `visibility`, not `display`: usable() reserves
  // #bottombar's height along the bottom edge.
  if(st.reagent){ actEl.style.visibility='hidden'; actEl.onclick=null; return; }
  // A SPOT STEP HAS NO BUTTON EITHER, same reason: the click IS the bond
  // coming apart. The hint beside the circle says where to click.
  if(st.spot){ actEl.style.visibility='hidden'; actEl.onclick=null; return; }
  actEl.style.visibility='visible';
  // THE BUTTON NAMES THE ACTION, not the direction. "Next" moves a slideshow;
  // "Cleave the C3-C4 bond" makes the student work out what is coming — the
  // beat a carrier step gets free from the tray. Words are the step's `act`.
  actEl.innerHTML=`${st.act} <i class="ph-bold ph-arrow-right"></i>`;
  actEl.onclick=()=>press(runStep);
}

// Jump to the state just BEFORE step k, so the student re-runs it rather than
// landing on its aftermath. Shared by the rail and the all-steps list. A
// half-run step is abandoned with the jump — renderLanes rebuilds both lanes
// and `laneDone` would otherwise still claim a lane had run.
const goToStep=k=>{ if(busy) return; intro=false; reviewing=false; done=k;
  laneDone.clear(); carrierGone.clear(); renderLanes(done); refresh(); };

/* ---- ?step=N, the same jump as a URL -------------------------------------
 * Every rail number is reachable by clicking (see drawRail), so this adds no
 * state a click could not; it just survives a reload, which is what editing an
 * animation and refreshing wants. Clamped, so ?step=99 opens the last step
 * rather than an empty stage.
 */
const OPEN_STEP=(()=>{
  const m=/[?&]step=(\d+)/.exec(location.search);
  return m ? Math.max(1, Math.min(nSteps, +m[1])) : null;
})();
const railEl=document.getElementById('rail');
function drawRail(){
  // The rail's only job is "where am I in the ten" (see the CSS header above).
  railEl.innerHTML='';
  STEPS.forEach((st,idx)=>{
    // THREE READINGS, separated by `done` (steps RUN). idx===done is the step
    // you are ON — waiting or in flight, the same to a student, so AWAKE but
    // hollow: filled means MADE, and nothing is made until the transition
    // lands. idx===done-1 is what you just made: filled. Except past ten,
    // where END is the lit stop and 10 is just another number behind you.
    const state = (!intro && !reviewing && idx===done) ? 'run'
                : (!intro && idx===done-1 && !(done>=nSteps && !reviewing)) ? 'cur'
                : (idx < done)             ? 'past'
                :                            'future';
    const b=document.createElement('button');
    b.className='rnum '+state;
    b.textContent=st.n;
    b.setAttribute('aria-label',`Step ${st.n}`);
    if(state==='cur') b.setAttribute('aria-current','step');
    // EVERY NUMBER GOES ANYWHERE, and means one thing: ready to RUN that step,
    // its substrate on stage and its target armed. Forward too — jumping to
    // step 7 hands over a molecule you never made, but it also makes testing
    // step 9 a one-click errand.
    // `goToStep(idx)` is what the ten-steps list does, so both land you BEFORE
    // the number you clicked and the number you click is the one that lights.
    b.onclick=()=>goToStep(idx);
    railEl.appendChild(b);
  });
  // AND THE SCREEN AFTER TEN. `done===nSteps` with nothing reviewing is the
  // ending — pyruvate on stage, "What's next?" in the button slot. The rail
  // owns "where am I", so it owns that place too.
  const e=document.createElement('button');
  const at = !intro && !reviewing && done>=nSteps;
  e.className='rnum rend '+(at?'cur':'future');
  e.textContent='End';
  e.setAttribute('aria-label','End of pathway');
  if(at) e.setAttribute('aria-current','step');
  e.style.cursor='pointer';
  e.onclick=()=>goToStep(nSteps);
  railEl.appendChild(e);
}

/* The panel under the card. EMPTY on every beat — PFK-1 lives behind the
 * ten-steps star and reversibility in the coupling box. Kept as a slot
 * (drawNote collapses it) so the card's layout stays the one the rest of the
 * page measures. */
const noteEl=document.getElementById('stepnote');

/* ---- the coupled-reaction figure ------------------------------------------
 * VERTICAL POSITION IS FREE ENERGY — why there is no axis to read. The coupled
 * arrow ALWAYS runs opposite the main one: uphill happens because something
 * steeper runs downhill beside it, and downhill is worth having because it
 * pushes something uphill.
 *
 * NO NUMBERS — direction, not magnitude, same reason the page prints no
 * per-step ΔG. Appears at FIVE of the ten steps; the other five are
 * rearrangements, and that absence separates steps that move energy from steps
 * that move atoms.
 */
// Species names READ OFF THE MOLECULES, not typed (a name typed twice can
// disagree with the molecule): `from` is what stands in the lanes before the
// step, `to` what it leaves, both the spec's own `short`. `plus` is the one
// step with a second substrate (step 6's Pi).
function resolveCouple(st){
  const i=STEPS.indexOf(st), c=st.couple;
  const nameOf=k=>M[k].short||M[k].name;
  return Object.assign({}, c, {
    from: nameOf(speciesAt(i)[0]) + (c.plus?` + ${c.plus}`:''),
    to:   nameOf(st.species[0]) });
}
function coupleFig(c){
  // Higher-energy species on top: product if uphill, substrate if downhill.
  const topMain = c.up ? c.to : c.from, botMain = c.up ? c.from : c.to;
  // The carrier's charged form (ATP, NADH) is always the higher-energy one.
  const topCpl  = c.up ? c.cin : c.cout, botCpl = c.up ? c.cout : c.cin;
  const mainLine = c.up ? 'M66,116 L66,34' : 'M66,30 L66,112';
  const mainHead = c.up ? 'M66,24 l6.5,13 h-13 z' : 'M66,122 l6.5,-13 h-13 z';
  // Both directions written out: same shape, only the arrowhead end differs —
  // explicit rather than derived by string surgery.
  const CURVE_DOWN='M176,42 C126,48 90,58 90,74 C90,90 126,100 176,106';
  const CURVE_UP  ='M176,106 C126,100 90,90 90,74 C90,58 126,48 176,42';
  const cplLine = c.up ? CURVE_DOWN : CURVE_UP;      // opposite the main arrow
  const cplHead = c.up ? 'M176,106' : 'M176,42';
  // Only a '+' against the preceding character is a CHARGE (NAD+). Spaced, it
  // is arithmetic (G3P + Pi) and stays on the baseline — superscript it and
  // "G3P plus Pi" reads as a cation.
  const sup=t=>t.replace(/(\S)\+/g,'$1<tspan baseline-shift="super" font-size="9">+</tspan>')
                .replace(/Pi\b/,'P<tspan baseline-shift="sub" font-size="9">i</tspan>');
  return `<svg class="cpl ${c.tone==='n'?'n':'p'}" viewBox="0 0 300 152" role="img"
      aria-label="${c.from} to ${c.to} runs ${c.up?'uphill':'downhill'}; coupled to ${c.cin} becoming ${c.cout}, which runs the opposite way">
    <text class="ax" transform="translate(12,88) rotate(-90)">free energy</text>
    <path class="axl" d="M22,134 L22,22"/><path class="axh" d="M22,15 l4.5,10 h-9 z"/>
    <text class="cm" x="66" y="16" text-anchor="middle">${sup(topMain)}</text>
    <path class="ml" d="${mainLine}"/><path class="mh" d="${mainHead}"/>
    <text class="cm" x="66" y="147" text-anchor="middle">${sup(botMain)}</text>
    <path class="cl" d="${cplLine}"/>
    <path class="ch" d="${cplHead} l-11,-4.5 v9 z"/>
    <text class="cs" x="186" y="46">${sup(topCpl)}</text>
    <text class="cs" x="186" y="110">${sup(botCpl)}</text>
  </svg>`;
}
/* The same step as a REACTION COORDINATE, beside the arrows not instead: they
 * say what coupling does, the curve shows the barrier — what a student asks
 * about after the mass-action modal.
 *
 * TWO TRACES, ONE CLAIM. Dashed = the sugar reaction alone; solid = coupled.
 * Uphill: dashed ends ABOVE its start, solid below — coupling turning a
 * reaction that will not go into one that will. Downhill: dashed falls further,
 * and the difference is what was banked into ATP or NADH.
 *
 * STILL NO MAGNITUDES: heights are fixed constants shared by every step, so the
 * figure claims a SIGN only — to scale it would assert ΔG the page cannot
 * source. Same rule as the arrows above.
 */
const RC_Y={ hi:34, mid:76, lo:120, peak:22 };
function coupleCurve(c){
  const Y=RC_Y;
  // Both traces leave the same place: same molecule before the step.
  const start=c.up ? Y.lo : Y.hi;
  const endAlone=c.up ? Y.mid : Y.lo;      // uphill alone / the full drop alone
  const endWith =c.up ? Y.lo+16 : Y.mid;   // coupled: over the top, or part banked
  const peak=Math.min(start,endAlone,endWith)-Y.peak;
  const trace=(y0,y1)=>`M34,${y0} H88 C120,${y0} 126,${peak} 150,${peak}`
                      +` C174,${peak} 180,${y1} 212,${y1} H266`;
  return `<svg class="cpl ${c.tone==='n'?'n':'p'}" viewBox="0 0 300 152" role="img"
      aria-label="${c.from} to ${c.to}: on its own the step runs ${c.up?'uphill':'downhill'};
        coupled to ${c.up?c.cin:c.cout} it runs ${c.up?'downhill':'less far down'}">
    <text class="ax" transform="translate(12,88) rotate(-90)">free energy</text>
    <path class="axl" d="M22,134 L22,22"/><path class="axh" d="M22,15 l4.5,10 h-9 z"/>
    <!-- COUPLED FIRST, ALONE ON TOP. They share a start and peak, so they are
         superimposed for the climb; whichever is drawn second is what you see.
         Dashed on top because dashed-over-solid reads as BOTH — the other
         order hides it and the figure looks like one curve that forks. -->
    <path class="rc with"  d="${trace(start,endWith)}"/>
    <path class="rc alone" d="${trace(start,endAlone)}"/>
    <!-- ABOVE the trace it names: no room to the RIGHT of one running to
         x=266, so the label goes over it. -->
    <text class="et alone" x="266" y="${endAlone-7}" text-anchor="end">on its own</text>
    <text class="et with"  x="266" y="${endWith-7}" text-anchor="end">with ${c.up?c.cin:c.cout}</text>
  </svg>`;
}

/* THE OTHER FIVE STEPS, same axes. Rearrangements — no carrier, so no second
 * trace — but a blank figure makes "energy curve" look like a property of
 * coupled steps rather than of every reaction.
 *
 * FLAT BECAUSE THE DATA SAYS FLAT: the claim is `rev:true` read off the step —
 * near equilibrium means both sides at nearly the same free energy. No
 * magnitudes here either.
 */
function soloCurve(st){
  const Y=RC_Y, nameOf=k=>M[k].short||M[k].name;
  const i=STEPS.indexOf(st);
  const from=nameOf(speciesAt(i)[0]), to=nameOf(st.species[0]);
  const y=Y.mid, peak=y-Y.peak;
  const trace=`M34,${y} H88 C120,${y} 126,${peak} 150,${peak}`
             +` C174,${peak} 180,${y} 212,${y} H266`;
  return `<svg class="cpl" viewBox="0 0 300 152" role="img"
      aria-label="${from} to ${to}: substrate and product sit at nearly the same
        free energy, with a barrier between them">
    <text class="ax" transform="translate(12,88) rotate(-90)">free energy</text>
    <path class="axl" d="M22,134 L22,22"/><path class="axh" d="M22,15 l4.5,10 h-9 z"/>
    <path class="rc solo" d="${trace}"/>
    <text class="et alone" x="34" y="${y+18}">${from}</text>
    <text class="et alone" x="266" y="${y+18}" text-anchor="end">${to}</text>
  </svg>`;
}
const soloLine=`Both sides sit
   at nearly the <b>same energy</b>, so the step runs either way.`;

// Two views of one step. `figTab` is module-level because drawCouple replaces
// #stepnote's innerHTML every refresh — a DOM-stored selection would reset on
// every step.
const FIGTABS=[['pair','Coupling'],['curve','Energy curve']];
// Opens on the CURVE: the view every step has, so the box shows the same kind
// of picture whichever step you are on.
let figTab='curve';
const figTabStrip=()=>`<div class="ftabs">`
  + FIGTABS.map(([k,lb])=>`<button data-figtab="${k}"${figTab===k?' class="on"':''}>${lb}</button>`).join('')
  + `</div>`;

// One line — the picture does the work.
const coupleLine=c=>c.up
  ? `On its own this step runs <b>uphill</b>. <b>ATP</b> provides
     the extra energy needed to complete the reaction.`
  : `This step runs <b>downhill</b>. The drop drives
     <b>${c.cout}</b> the other way, <b>uphill</b>.`;

// Delegated, not bound — drawCouple replaces this element's innerHTML every
// refresh and a bound handler would die with it.
// THE DOOR CARRIES THE STEP THROUGH IT. Opened from a step's verdict, the demo
// opens on the case that verdict just announced — the flat tab under an
// "Irreversible in the cell" heading reads as a contradiction. The step index
// rides in the ATTRIBUTE because drawCouple replaces this markup every refresh:
// a closure captured here would describe whichever step was on screen when the
// handler was written. An empty value is the pathway-wide summary, which
// belongs to no step.
const massLink=st=>`<button class="minfo" data-mass="${st?STEPS.indexOf(st):''}">`
  + (st && st.rev===false ? `Why can't this one go backwards? →`
                          : `What decides the direction? →`)
  + `</button>`;
const noteClick=e=>{
  // the card's own ✕ — the same state the words on the stage toggle, so the
  // two can never disagree about whether it is up
  if(e.target.closest('[data-cplx]')){ cplOpen=false; refresh(); return; }
  const door=e.target.closest('[data-mass]');
  if(door){ const i=door.dataset.mass; Mass.show(i===''?null:STEPS[+i]); return; }
  const t=e.target.closest('[data-figtab]');
  if(t){ figTab=t.dataset.figtab; drawCouple(); }
};
/* THE COUPLING BOX, on the stage: the figure, the reversibility verdict and
 * the way into the mass-action demo. Beside the molecule, not in the sidebar,
 * because it is about what is happening in the lanes. */
const cplEl=document.getElementById('couplebox');
cplEl.addEventListener('click',noteClick);
// The box is REPLACED wholesale every refresh, so the entry animation is
// played on the new element, not transitioned (as with the rail's label flip).
// It plays when the box starts describing a different step — so the figure
// arrives with the molecule it explains.
let shownCplStep=null;
function drawCouple(){
  const i=focusStep();
  // ONLY WHEN ASKED FOR: the two words on the stage (#enzmeta) say what kind of
  // step it was, and this is what they open. Arriving by itself on the review
  // beat puts a paragraph of thermodynamics over the molecule the student was
  // just told to look at.
  const st=(cplOpen&&!intro&&i<nSteps)?stepAt(i):null;
  if(!st){ cplEl.style.display='none'; cplEl.innerHTML=''; shownCplStep=null; return; }
  // Coupled: both views + tab strip. Uncoupled: curve only, no strip — a
  // single tab is a control that does nothing.
  const c = st.couple ? resolveCouple(st) : null;
  cplEl.style.display='block';
  cplEl.innerHTML=`<button class="cx" type="button" data-cplx aria-label="Close">&times;</button>`
    +(c
      ? `<div class="nhead cpl-h">Coupled reaction</div>`
        + figTabStrip()
        + (figTab==='curve' ? coupleCurve(c) : coupleFig(c))
        + `<p class="nbody">${coupleLine(c)}</p>`
      : `<div class="nhead cpl-h">Energy curve</div>`
        + soloCurve(st)
        + `<p class="nbody">${soloLine}</p>`)
    + (st.rev===false
        ? `<div class="nhead irr">Irreversible in the cell</div>`
        : `<div class="nhead rev">Near equilibrium — reversible</div>`)
    + massLink(st);
  const key=`${i}`;
  if(key!==shownCplStep){
    shownCplStep=key;
    cplEl.classList.remove('in'); void cplEl.offsetWidth;   // restart the run
    cplEl.classList.add('in');
  }
}

function drawNote(){
  // NOTHING LEFT TO SAY HERE. PFK-1 is behind the ten-steps star (Pfk.show) and
  // reversibility rides the coupling box, and the end screen belongs to the
  // closing question. Collapsed at both ends, so it costs the card no height.
  noteEl.innerHTML=''; noteEl.style.display='none';
}


/* PFK-1's regulation, behind the ten-steps list's star. Content is PFK's,
 * rendered once — the modal is markup with two holes, so the facts live in one
 * place and the star is only a door onto them. */
const Pfk=(()=>{
  const body=document.getElementById('pfkbody');
  document.getElementById('pfktitle').textContent=PFK.title;
  body.innerHTML=`<p class="mtext">${PFK.body}</p>`
    +`<div class="effrow"><div class="eff on"><div class="eh">Speeds it up</div>`
      +PFK.on.map(([a,b])=>`<div class="e"><b>${a}</b><span>${b}</span></div>`).join('')+`</div>`
    +`<div class="eff off"><div class="eh">Slows it down</div>`
      +PFK.off.map(([a,b])=>`<div class="e"><b>${a}</b><span>${b}</span></div>`).join('')+`</div></div>`
    +`<p class="mtext">${PFK.note}</p>`;
  return Modal.create({el:'pfkmodal'});
})();

/* ---- all ten steps, in one column -----------------------------------------
 * THE MAP, not the rail. The rail hides a step until it has run — that reveal
 * makes each step a finding. A student who asks for all ten has opted out, so
 * this names every product, chip and marker outright. Nothing typed: rows are
 * built from STEPS by productOf/chipOf. A run step rewinds, like the rail. */
const AllSteps=(()=>{
  const body=document.getElementById('stepsbody');
  let self=null;                       // set below; rows close the card they sit in
  const hide=()=>self.hide();
  function draw(){
    body.innerHTML='';
    STAGES.forEach(s=>{
      const steps=stageSteps(s.n);
      if(!steps.length) return;                 // the two step-less states
      const g=document.createElement('div');
      g.className='sgroup';
      g.innerHTML=`<div class="sghead"><span class="bt">${s.block}</span>`
        +`<span class="bd">${s.delta}</span></div>`;
      steps.forEach(st=>{
        const idx=STEPS.indexOf(st);
        const state=(idx===done&&!intro)?'cur':idx<done?'done':'future';
        const r=document.createElement('div');
        r.className='rrow '+state;
        r.innerHTML=`<div class="rdotwrap"><div class="rdot">${st.n}</div></div>`
          +`<div class="rlab">${productOf(st)}</div>`
          +chipOf(st)
          +(st.rev===false
            ? `<div class="rirr" title="effectively irreversible in the cell">⇢</div>` : '')
          +(st.commit
            ? `<button class="rstar" data-pfk aria-label="Why this step is the one the cell controls">★</button>` : '');
        // Every row goes, like every rail number — same meaning, ready to run
        // that step.
        r.onclick=()=>{ hide(); goToStep(idx); };
        const star=r.querySelector('[data-pfk]');
        if(star) star.onclick=e=>{ e.stopPropagation(); hide(); Pfk.show(); };
        g.appendChild(r);
      });
      body.appendChild(g);
    });
  }
  // REDRAWN PER OPEN: the list marks where you are, so it is a view of `done`,
  // not a thing built once. onShow runs before focus moves in — see kit/modal.js.
  self=Modal.create({el:'stepsmodal', onShow:draw});
  document.getElementById('allsteps').onclick=()=>self.show();
  return self;
})();

/* THE MASS-ACTION DEMO. The physics, the box and every control inside the card
 * are massaction/massaction.js; this page supplies only WHICH reactions it runs
 * and the modal it runs in.
 *
 * EACH SCENARIO IS A REAL STEP, not a toy A⇄B: flat is step 2 (genuinely near
 * equilibrium), drop is step 10. Naming them keeps the demo tied to the rail
 * rather than a separate world with its own letters.
 *
 * `ea` is left at the module default: this page's claim is that ΔE decides the
 * direction, so a barrier the student can move would be a second variable in a
 * demo about one. The enzymes page is where it becomes a slider.
 *
 * DROP.drop = ln(200) — the reverse of step 10 is about 1 encounter in 200.
 *
 * TWO EXAGGERATIONS, BOTH IN THIS PAGE'S CHOICE OF SCENARIO (MolecularGeometry.md
 * §1.4 wants them written down):
 *   · flat settles 1:1, because its barrier is the same height both ways. Real
 *     step 2 sits nearer 1 F6P to 2 G6P; an even split is the readable version
 *     of "neither direction is favoured".
 *   · ln(200) is far less lopsided than real step 10, so the reverse is seen
 *     failing to happen rather than declared impossible. You would never catch
 *     the real one going back. */
// THE TABS ARE THE PAGE'S OWN VERDICT VOCABULARY — the same two words the
// coupling box stamps on every step ("Near equilibrium — reversible" /
// "Irreversible in the cell"). Naming them for the physics ("flat", "drop")
// would be a second scheme the student has to map onto the first.
// The KEYS stay flat/drop: they are what the model is about, and what
// check-massaction.js audits.
//
// These two are the DEFAULTS — the canonical example of each case, used when
// the demo is opened from the pathway-wide summary rather than from a step.
// Step 2 and step 10 because they are the least arguable of each kind.
const MASS_STEPS=[
  { key:'flat', tab:'Reversible', drop:0,
    title:'Why a step can run backwards', species:['G6P','F6P'],
    text:`<b>Step 2.</b> The enzyme keeps converting in <b>both</b> directions —
      what changed as the split evened out is only <b>how often</b> each
      direction comes up, which depends on how many of each are around. Crowd
      one side and watch the net flip.` },
  { key:'drop', tab:'One-way', drop:Math.log(200),
    title:'Why three steps cannot', species:['PEP','Pyruvate'],
    text:`<b>Step 10.</b> Finding that much energy at once is <b>steeply</b>
      rarer, not just a bit rarer. Watch which colour glows: blue almost always
      has enough to go forward, violet almost never has enough to go back.
      Adding more pyruvate barely helps. That's what <b>irreversible in the
      cell</b> means, true of only <b>three</b> of these ten steps.` }
];

/* THE SAME DEMO, WEARING THE STEP THE STUDENT IS ON. The tab matching this
 * step's verdict gets this step's own substrate and product, read from the same
 * STEPS data the verdict is — otherwise the box fills with G6P and F6P while
 * the molecules on the stage are nowhere in it. The OTHER tab keeps its
 * default, and is the point of the pair: the contrast makes either case mean
 * something.
 *
 * ΔE STAYS SCHEMATIC. Only the names and the prose change — the drop is ln(200)
 * for every irreversible step, not that step's real ΔG. This page prints no ΔG
 * numbers anywhere on purpose (see the header): reversibility is the claim, and
 * three per-step magnitudes invented for legibility would look like data.
 *
 * STEP 4 FALLS BACK to the defaults. Aldolase is A ⇄ B + C, and a two-species
 * box would draw one F1,6BP becoming one DHAP — a stoichiometry claim the demo
 * cannot make and the student can read straight off the counters. Detected from
 * the lane count rather than step 4's number, so a re-ordered pathway keeps it.
 */
function massScenarios(st){
  if(!st) return MASS_STEPS;
  const i=STEPS.indexOf(st);
  if(st.species.length!==speciesAt(i).length) return MASS_STEPS;
  const nameOf=k=>M[k].short||M[k].name;
  // MID-SENTENCE, a molecule keeps the case it actually has: G6P and 1,3-BPG
  // are abbreviations and stay shouted, glucose and pyruvate are common nouns
  // and "Adding more Pyruvate" reads as a proper noun. Only a plain capitalised
  // word gets lowered — anything with a digit or a second capital is a name.
  // Labels keep the registry's capitalisation: a chip and a curve label are
  // names, not sentences.
  const prose=n=>/^[A-Z][a-z]+$/.test(n)?n.toLowerCase():n;
  const sub=nameOf(speciesAt(i)[0]), prd=nameOf(st.species[0]);
  const subP=prose(sub), prdP=prose(prd);
  const enz=st.enz.replace(/ \(.*\)/,'');           // drop "(PFK-1)" and the like
  const mine=st.rev===false?'drop':'flat';
  return MASS_STEPS.map(s=> s.key!==mine ? s : Object.assign({}, s, {
    species:[sub,prd],
    title: mine==='flat' ? `Why step ${st.n} runs both ways`
                         : `Why step ${st.n} cannot run backwards`,
    text: mine==='flat'
      ? `<b>Step ${st.n}, ${enz.toLowerCase()}.</b> It keeps converting in
         <b>both</b> directions — what changed as the split evened out is only
         <b>how often</b> each direction comes up, which depends on how many of
         each are around. Add ${prdP} and watch the net flip.`
      : `<b>Step ${st.n}, ${enz.toLowerCase()}.</b> Going back means ${prdP}
         finding all the energy this step released, at once — <b>steeply</b>
         rarer, not just a bit rarer. Watch which colour glows: ${subP} almost
         always has enough to go forward, ${prdP} almost never has enough to go
         back. Adding more ${prdP} barely helps. That's what <b>irreversible in
         the cell</b> means, true of only <b>three</b> of these ten steps.`
  }));
}

const Mass=(()=>{
  const box=document.getElementById('massbox');
  let sim=null;
  // REBUILT PER OPEN, not reconfigured: the scenarios change with the step, and
  // the sim is a few dozen elements and one rAF loop. Stop the old one first so
  // its loop cannot outlive the DOM it draws into. `st` is the step the demo
  // wears, handed straight through by show(st).
  return Modal.create({el:'massmodal',
    onShow(st){
      if(sim) sim.stop();
      sim=MassAction.create({ host:box, scenarios:massScenarios(st) });
      sim.setScenario(st && st.rev===false ? 'drop' : 'flat');
      sim.start();
    },
    onHide(){ if(sim) sim.stop(); }});
})();

/* WHERE PYRUVATE GOES, behind the last button. Three fates, not two: the two
 * fermentations are different reactions, products and organisms, and collapsing
 * them into "fermentation" leaves students unable to say why muscle makes
 * lactate and yeast ethanol. All three framed by the SAME question — where does
 * NAD⁺ come from — the constraint that picks one. Rendered once, stateless. */
const Fork=(()=>{
  document.getElementById('forkbody').innerHTML=
     `<div class="door" style="--c:var(--nad)">
        <div class="dk">With O₂</div><div class="dh">Aerobic</div>
        <div class="db">Pyruvate enters the <b>mitochondrion</b>: oxidised to
        acetyl-CoA, then the citric acid cycle and electron transport chain. Each
        <b>NADH</b> is worth roughly <b>2.5 ATP</b> there, so glycolysis's 2 NADH
        outweigh its 2 net ATP — <b>~30 ATP</b> per glucose, and NAD⁺ back.</div></div>`
    +`<div class="door" style="--c:var(--atp)">
        <div class="dk">No O₂</div><div class="dh">Lactic acid</div>
        <div class="db">Pyruvate itself takes the <b>NADH</b>'s electrons and becomes
        <b>lactate</b>. Muscle under load, and most bacteria. <b>No extra ATP</b> —
        the product that matters is <b>NAD⁺</b>.</div></div>`
    +`<div class="door" style="--c:var(--phos)">
        <div class="dk">No O₂</div><div class="dh">Ethanol</div>
        <div class="db">Yeast strips a <b>CO₂</b> from pyruvate, then reduces the
        acetaldehyde to <b>ethanol</b>. Same purpose: regenerate <b>NAD⁺</b> so
        glycolysis keeps turning.</div></div>`;
  return Modal.create({el:'forkmodal'});
})();

// drawTray runs BEFORE drawAct: the tray's visibility decides which element
// usable() measures, and drawAct's Begin state is the stand-in for it.
function refresh(){ drawLedger(); drawTray(); drawTally(); drawEnz(); drawAct(); drawRail();
  drawNote(); drawCouple(); drawCaption(); computeFit(); }

document.getElementById('restart').onclick=restart;
// keyboard: → advances whatever the current step is, ← rewinds.
// NOT WHILE A CARD IS UP: these run the pathway on the stage BEHIND it, so a
// student reading the ten-steps list would come back to a step they never saw.
// Esc and Tab are the modal's own (kit/modal.js); the stage keys are ours to
// withhold, because only this page knows which of its keys move the lesson.
addEventListener('keydown',e=>{
  if(Modal.anyOpen()) return;
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault();
    if(intro){ beginPathway(); }
    else if(reviewing){ reviewing=false; refresh(); }
    else press(runStep); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); rewind(); }
});

/* =============================================================
 *  MAIN LOOP
 * ============================================================= */
// The lerp factors below are PER FRAME, not per second: critically-damped
// follows tuned by eye at 60 Hz, each chasing a target the same loop
// recomputes. Moving them to dt changes how the page FEELS — not a refactor.
L.frame=()=>{
  // Lanes ease toward their slots — x for the split, y for each species' own
  // vertical centring. EASED, NOT SET: a product placed straight onto its lift
  // jumps on the swap frame — the frame the name returns — so it reads as the
  // label shoving the molecule down. (kit/lanes.js, same 0.10 per frame.)
  LANES.step();
  cam.r+=(fitR-cam.r)*0.05;                      // ease to the computed framing
  cam.target.y+=(fitY-cam.target.y)*0.06;        // …and re-centre vertically
  applyCam(); orthoFrustum();
  KIT.faceCamera(camera);        // badges keep their lift as the camera orbits
};
// AFTER the render, never before — Vector3.project() reads a matrix refreshed
// only on render, so anything here run earlier pins its DOM to the PREVIOUS
// frame's camera. The kit's loop is motion → frame → fx → render → afterFrame,
// and EVERYTHING that projects belongs in here — plates, spots, hint, carrier
// column, tally, enzyme blob.
L.afterFrame=()=>{
  drawPlates();
  drawFlyers();                  // names riding something in the air
  drawSpots();
  drawHint();                    // the callout, on the bond the disc marks
  placeCarrierMol();
  placeTallyMols();
  placeEnz();                  // the blob rides its lane
  placeCarrierGlow();          // after it, so the bond is where the mark goes
};

// ?step=N lands here, before the first draw, so the page opens on that state
// rather than opening on glucose and jumping. `intro=false` because the intro
// is a state, not step zero (see `intro`).
if(OPEN_STEP!=null){ intro=false; done=OPEN_STEP-1; }
renderLanes(done); refresh(); applyCam(); resize();
// Re-solve AFTER refresh(). The first computeFit runs inside renderLanes(),
// before the tray has children — it measures a zero-height tray, insets
// nothing, and the page opens one frame too close.
computeFit();
cam.target.y=fitY; cam.r=fitR; applyCam(); orthoFrustum();  // open already framed
L.start();
// The fit depends on camera.aspect, so it is redone whenever the stage reshapes
// (window resize, or the sidebar stacking under it on a narrow screen) — the
// kit's own ResizeObserver, through the `onResize` hook passed to Lesson.create.
// Label HEIGHT is chrome the fit reserves, and it changes when the real font
// replaces the fallback. So re-solve once the font lands.
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(computeFit);

document.getElementById('savepng').onclick=()=>{
  renderer.render(scene,camera);
  // Species labels are DOM, not in the WebGL buffer, so a straight
  // canvas.toDataURL() exports unnamed molecules. Composite them back from the
  // same projected anchors drawPlates() uses.
  const w=canvas.width, h=canvas.height, s=w/(canvas.clientWidth||w);   // DPR
  const out=document.createElement('canvas'); out.width=w; out.height=h;
  const x=out.getContext('2d');
  x.drawImage(canvas,0,0);
  x.textAlign='center';
  const projV=new THREE.Vector3();
  lanes.forEach(l=>{
    const spec=M[l.key];
    projV.set(l.g.position.x,l.topY+laneOffset(l),0).project(camera);
    const px=(projV.x*0.5+0.5)*w, py=(-projV.y*0.5+0.5)*h;
    x.font=`500 ${14*s}px "Zilla Slab", Georgia, serif`;
    x.fillStyle='#8a8073'; x.fillText(spec.formula, px, py-3*s);
    x.font=`700 ${19*s}px "Zilla Slab", Georgia, serif`;
    // whichever spelling the plate shows — an export that renames the
    // molecules is not a picture of what is on screen
    x.fillStyle='#2b2723'; x.fillText(l.nameEl.textContent, px, py-20*s);
  });
  const a=document.createElement('a'); a.download='glycolysis.png';
  a.href=out.toDataURL('image/png'); a.click();
};
</script>

</body>
</html>
