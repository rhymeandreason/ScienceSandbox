      shedPhosphoryl(l, M[l.key].gly[st.anchor]);
    });

  } else if(st.fx==='ox'){
    // the whole lesson of this step: the hydride leaves LEFT onto the NAD⁺ in
    // the tray, a free phosphate drifts DOWN out of the cytosol to fill the
    // gap. Different directions and speeds, so it cannot read as one swap —
    // the drawn NAD⁺ gives the hydride somewhere real to go, which frees the
    // vertical axis for the thing that has no sender.
    lanes.forEach(l=>{
      const hIdx=M[l.key].gly.aldehydeH;
      const hPos=hIdx!=null? l.g.userData.atomWorld(hIdx) : anchorWorld(l,'p3');
      FXi.protonHop(hPos, tileWorld(carrierKey(st.couple.cin),hPos,lanes.indexOf(l))
                          || V(l.g.position.x, OFFSCREEN, 0));
      flyPhosphate(aboveFrame(hPos), hPos, null, null, DRIFT);
      later(()=>FXi.spawnRing(hPos,PAL.atoms.P), DRIFT);
    });
    dur=DRIFT;                        // wait for the slower arrival

  } else if(st.fx==='split'){
    // THE MONEY SHOT: flash at C3–C4, then the halves part into lanes. Both
    // spawn at the centre and are eased outward by the main loop, so the six
    // carbons visibly become 3 + 3 rather than cutting to a new layout.
    const l=lanes[0], cl=M[l.key].gly.cleave;
    const mid=l.g.userData.atomWorld(cl[0]).add(l.g.userData.atomWorld(cl[1])).multiplyScalar(.5);
    FXi.spawnRing(mid,CLEAVE);
    const fromY=l.g.position.y;      // both halves start where the whole sugar was
    clearLanes();
    const top=plateY(keys);
    lanes=keys.map((k,j)=>{ const o=spawnLane(k,j,n,top);
      // x=0 so the halves part from the centre, y where the sugar stood
      o.g.position.set(0,fromY,0);
      o.g.userData.tx=laneOrigin(k,j,n); return o; });
    later(()=>{ done=to; reviewing=true;   // lanes already correct — don't respawn
      // The parting is a rAF ease, so in a hidden tab it never ran; land them on
      // their marks here so the two halves can't come back stacked on each other.
      lanes.forEach(o=>{ o.g.position.x=o.g.userData.tx;
                         o.g.position.y=o.g.userData.ty; });
      // renderLanes normally gives the names back; this branch doesn't call it
      platesOff=false; platesEl.classList.remove('mute');
      busy=false; refresh(); }, SPLIT);
    return;

  } else if(st.fx==='move'){
    // THE MUTASE: the phosphate neither leaves nor comes from the pool — it
    // slides C3→C2 on the same molecule. A short flight between the two sites,
    // so it reads as the SAME phosphate relocating: step 8's whole difference.
    lanes.forEach((l,j)=>{
      const src=anchorWorld(l,st.anchor);
      const dst=siteWorld(keys[j],st.dest,laneOrigin(keys[j],j,n));
      flyPhosphate(src, dst, M[keys[j]], M[keys[j]].gly[st.dest]);
      later(()=>FXi.spawnRing(
        junctionWorld(M[keys[j]], M[keys[j]].gly[st.dest], laneOrigin(keys[j],j,n), laneBase(keys[j])),
        PAL.atoms.P), FLY);
    });

  } else if(st.fx==='lose'){
    // ENOLASE: a water leaves, UP and out — the direction step 6's hydride
    // took, since both are "something departs"; phosphate beats go the other way.
    lanes.forEach(l=>{
      const idx=M[l.key].gly[st.anchor];
      const pos=idx!=null? l.g.userData.atomWorld(idx) : anchorWorld(l,'p2');
      FXi.spawnRing(pos, PAL.atoms.O);
      FXi.protonHop(pos, V(l.g.position.x, OFFSCREEN, 0));
    });

  } else if(st.fx==='open'){
    // THE RING OPENS. The isomerase runs through the open-chain aldehyde, so
    // the hemiacetal at C1 comes apart: C1–O5 breaks, the anomeric –OH gives
    // its proton to the ring oxygen (which leaves as C5's hydroxyl), and the
    // chain rotates out flat. Three beats in one gesture, in order.
    lanes.forEach(l=>{
      const gly=M[l.key].gly, o=gly.open, u=l.g.userData;
      if(!o) return;
      const mid=u.atomWorld(o[0]).clone().add(u.atomWorld(o[1])).multiplyScalar(.5);
      FXi.spawnRing(mid, PAL.atoms.O);
      // the bond goes FIRST — the atoms are about to move as though it had
      u.bondMeshes.forEach(bm=>{ const [i,j]=bm.userData.pair;
        if((i===o[0]&&j===o[1])||(i===o[1]&&j===o[0])) bm.visible=false; });
      if(gly.anomeric) FXi.protonHop(u.atomWorld(gly.anomeric.h), u.atomWorld(o[1]));
      // …then the unfurl, eased so it settles rather than arriving at speed
      // PIXELS: on the render loop, and cancelled with the step if the student
      // restarts mid-turn. (inOutQuad is the ease this hand-rolled inline.)
      // NO REFIT HERE. Framing is fixed for the whole pathway; the camera used
      // to ride topY and pan through the animation.
      const plan=unfurlPlan(l);
      MO.seq([{dur:UNFURL/1000, ease:'inOutQuad',
        onUpdate:e=>unfurlApply(l,plan,e)}],{tag:RUN});
    });
    dur=UNFURL+180;                              // land, then swap to F6P
    // WHAT IS LEFT AT THE SWAP IS THE REACTION, so it gets marked. Backbones
    // superimpose by now (0.19 RMSD, vs 1.67 before the roll was matched), so
    // the only change is what the isomerase did: a proton off C2 onto C1,
    // moving the C=O one carbon in. Fired after the swap, on the molecule
    // that has it.
    later(()=>lanes.forEach(l=>{
      const cN=M[l.key].gly.cN, u=l.g.userData;
      FXi.protonHop(u.atomWorld(cN[1]), u.atomWorld(cN[0]));
    }), dur+40);

  } else dur=280;                              // 'iso': a plain rearrangement

  later(()=>{ done=to; reviewing=true; carrierGone.clear(); renderLanes(to);
    busy=false; refresh(); }, dur);
}

function rewind(){
  if(busy) return;
  // the review screen steps back to its own step's explanation — one click,
  // one screen, in both directions
  if(reviewing){ reviewing=false; refresh(); return; }
  // A HALF-RUN STEP REWINDS TO ITS OWN START: one lane already handed over its
  // phosphate, and going back further leaves that ATP banked in a ledger the
  // pips say is untouched.
  if(laneDone.size){ laneDone.clear(); carrierGone.clear();
    renderLanes(done); refresh(); return; }
  if(done===0){ intro=true; refresh(); return; }   // step back off stage 1 onto the intro
  done--; renderLanes(done); refresh();
}
function restart(){ cancelTimers(); busy=false; pressing=false; reviewing=false; done=0; intro=true;
  laneDone.clear(); carrierGone.clear();
  renderLanes(0); refresh(); userZoom=false; cam.theta=OPEN_THETA; }

/* =============================================================
 *  UI
 * ============================================================= */
const rxmsgEl=document.getElementById('rxmsg');
// THE CAPTION IS THE STEP YOU ARE ABOUT TO RUN, not the one you just ran —
// read on the beat BEFORE the molecule changes. An explanation after the
// animation already answered it is a caption for something you stopped looking
// at. Still DERIVED, so rewinding works without remembering which toast fired.
// The intro gets the band too, and the finished pathway keeps step 10's, which
// is where the net tally is said.
const INTRO_MSG=`<b>Glucose</b> — six carbons, drawn as the ring it mostly adopts in water. `
  +`Glycolysis runs in the <b>cytosol</b> and needs <b>no oxygen</b>; nearly everything alive has it.`;
const captionAt=i=>intro ? INTRO_MSG
  : i<nSteps ? STEPS[i].msg          // the step about to run — or, while
  : STEPS[nSteps-1].msg;             // reviewing, the one just run (see focusStep)
                                     // pathway finished: the closing tally stands
// The heading over the BUTTON — drawn by drawAct, not here. Which of the ten
// this is plus the one word to carry away, both read off the step, so heading,
// rail and textbook all say the same "step 6".
const headAt=i=>{ const st=STEPS[i]; return st?`Step ${st.n} <em>(${st.hook})</em>`:''; };
let shownCaption=null;
function drawCaption(){
  // NO CAPTION ON THE REVIEW SCREEN — that beat is for looking at what you
  // made; the words were read before it ran.
  // THE BAND IS THE TWO SCREENS THAT HAVE NO STEP: the intro and the finished
  // pathway (the closing tally). Each step's caption moved to the ⓘ on its
  // heading — printed permanently it cost four lines of stage height for a
  // paragraph read once. So the band holds ONE height (zero) across the ten
  // steps, which is what usable() wants: the camera never re-frames mid-step.
  const bare = intro || focusStep()>=nSteps;
  const html = bare ? captionAt(focusStep()) : '';
  const show = bare && !reviewing;
  if(html!==shownCaption){                     // don't restart the fade
    shownCaption=html;
    rxmsgEl.querySelector('p').innerHTML=html;
    rxmsgEl.classList.remove('in'); void rxmsgEl.offsetWidth;
    if(show) rxmsgEl.classList.add('in');
  }
  rxmsgEl.classList.toggle('show', show);
}

const ledgerEl=document.getElementById('ledger');

/* ---------- the count flies to the ledger ----------
 * The ledger is 300px from where you are looking, so a number changing there
 * while the molecule lands changes unwatched. The thing counted MAKES THE TRIP:
 * a chip leaves the tile that spent or caught the carrier — or the molecule's
 * name plate, for pyruvate — and the row holds its OLD number until the chip
 * arrives. The tick is the landing, so cause and tally are one event.
 *
 * ONE CHIP PER UNIT, staggered: two lanes each make one ATP, so two chips is
 * what happened. Both take off from the same tile — the tray is one pool.
 *
 * Flights are fire-and-forget and the ledger is replaced wholesale on every
 * refresh, so a landing re-finds its row by `data-row` and checks its
 * generation — a rewind mid-flight drops the tick, since that render already
 * wrote the true number.
 */
const flyLayer=document.createElement('div');
flyLayer.id='flylayer'; document.body.appendChild(flyLayer);
const FLY_MS=FLY, FLY_GAP=110;   // the same flight time the phosphates take
const ROWCOL={spent:'var(--atp)', made:'var(--atp)', nadh:'var(--nad)',
              pyr:'var(--carbon)'};
function flyChip(src,dst,text,color,delay,onLand){
  const a=src&&src.getBoundingClientRect(), b=dst&&dst.getBoundingClientRect();
  if(!a||!b||!b.width){ later(onLand, delay+FLY_MS); return; }   // still tick
  const x0=a.left+a.width/2, y0=a.top+a.height/2;
  const x1=b.left+b.width/2, y1=b.top+b.height/2;
  const outer=document.createElement('div'); outer.className='fchip';
  const fy=document.createElement('div'); fy.className='fy';
  const face=document.createElement('span'); face.className='fb';
  face.textContent=text; face.style.color=color;
  fy.appendChild(face); outer.appendChild(fy); flyLayer.appendChild(outer);
  // start on the source, centred on it (the chip's own box is measured now)
  const r=face.getBoundingClientRect();
  const ox=-r.width/2, oy=-r.height/2;
  outer.style.transform=`translateX(${x0+ox}px)`;
  fy.style.transform=`translateY(${y0+oy}px)`;
  later(()=>{
    // x eases out, y eases with a lift — a throw, which is what the eye follows
    // across a gap this wide
    outer.style.transition=`transform ${FLY_MS}ms cubic-bezier(.25,.6,.3,1)`;
    fy.style.transition=`transform ${FLY_MS}ms cubic-bezier(.5,-0.35,.7,1)`;
    outer.style.transform=`translateX(${x1+ox}px)`;
    fy.style.transform=`translateY(${y1+oy}px)`;
  }, delay);
  later(()=>{ outer.classList.add('land'); onLand(); }, delay+FLY_MS);
  later(()=>outer.remove(), delay+FLY_MS+240);
}
// Where a count takes off from. Every carrier is a drawing, so all three counts
// leave the same column — the one object the step changed. Pyruvate has no
// carrier and leaves from its own molecule's name plate.
function flySource(key,j){
  const carrier=()=>carrierEl.isConnected ? carrierEl : null;
  if(key==='spent'||key==='made'||key==='nadh') return carrier()||platesEl.children[0];
  return platesEl.children[j] || platesEl.children[0];
}
let prevLedger=null, ledgerGen=0;
// set for one draw by a lane that just banked — see the note in drawLedger
let landed=false;
// AWAY AT THE INTRO, PINNED UP ON BEGIN. Fires on the transition only — a
// restart sends it back to the intro so it goes up again next time; every
// other redraw leaves it alone.
function placeLedger(){
  const hid=ledgerEl.classList.contains('hid');
  if(intro){ ledgerEl.classList.remove('pin'); ledgerEl.classList.add('hid'); return; }
  if(!hid) return;                       // already up: this is an ordinary redraw
  ledgerEl.classList.remove('hid');
  ledgerEl.classList.remove('pin'); void ledgerEl.offsetWidth;   // restart it
  ledgerEl.classList.add('pin');
}
function drawLedger(){
  placeLedger();
  const L=ledgerAt(done), net=L.made-L.spent, c=speciesAt(done).map(k=>M[k].gly.carbons);
  // The two PRODUCTS, off the same state everything else reads: NADH from the
  // ledger, pyruvate from what is standing in the lanes — so neither number can
  // drift from the stage.
  L.pyr=(lanes.length?lanes.map(l=>l.key):speciesAt(done))
          .filter(k=>k==='pyruvate').length;
  // A COUNT THAT WENT UP ON A STEP JUST RUN IS FLOWN IN; a rewind, jump or
  // restart is a state change, not an event, so it just appears. `reviewing &&
  // !busy` is the one moment a step has landed.
  const gen=++ledgerGen, prev=prevLedger;
  const flying={};
  // `landed` is the per-lane twin of `reviewing`: one lane banked its ATP —
  // an EVENT, so a chip — though the step has not finished and `done` has not
  // moved.
  if(prev && (reviewing||landed) && !busy) for(const k of ['spent','made','nadh','pyr'])
    if(L[k]>prev[k]) flying[k]=L[k]-prev[k];
  const inFlight=Object.keys(flying).length>0;
  // rows in flight show the number they had until their chip lands
  const shown=k=>flying[k]!=null ? prev[k] : L[k];
  const bumped=k=>!flying[k] && prev && prev[k]!==L[k] ? ' bump':'';
  const netNow = inFlight ? prev.made-prev.spent : net;
  const netStr=v=>`${v>0?'+':v<0?'−':''}${Math.abs(v)}`;
  ledgerEl.innerHTML=
     `<div class="lhead">Running ledger</div>`
    +`<div class="row"><span>ATP spent</span><span class="v${bumped('spent')}" data-row="spent">${shown('spent')}</span></div>`
    +`<div class="row"><span>ATP made</span><span class="v${bumped('made')}" data-row="made">${shown('made')}</span></div>`
    // typographic minus, not a hyphen — the dip to −2 is the single number this
    // page is built to make land
    +`<div class="row net"><span>Net ATP</span><span class="v" data-row="net">${netStr(netNow)}</span></div>`
    // THE OTHER TWO THINGS GLYCOLYSIS PRODUCES. ATP is the headline, but a
    // student has to be able to say "2 ATP, 2 NADH and 2 pyruvate". The tray
    // still carries NADH as the loaded half of a pair — the reading that makes
    // NAD⁺ running to 0 mean something; this is the tally beside it.
    +`<div class="row prod"><span>NADH</span><span class="v${bumped('nadh')}" data-row="nadh">${shown('nadh')}</span></div>`
    +`<div class="row"><span>Pyruvate</span><span class="v${bumped('pyr')}" data-row="pyr">${shown('pyr')}</span></div>`
    +`<div class="row carb"><span>Carbons</span><span class="v">${c.join(' + ')}${c.length>1?' = 6':''}</span></div>`;
  prevLedger=L; landed=false;
  // LAUNCH AFTER THE REST OF THE REFRESH: the tray is redrawn after this, so
  // measuring the old tile would launch from one about to move.
  if(inFlight){
    // a chip ticks its row by ONE, so two ATP count 0→1→2, not 2 twice
    const base={}; for(const k in flying) base[k]=prev[k];
    const baseNet=prev.made-prev.spent;
    later(()=>{
      for(const k in flying){
        const n=flying[k];
        for(let j=0;j<n;j++) flyChip(
          flySource(k,j), ledgerEl.querySelector(`[data-row="${k}"]`),
          '+1', ROWCOL[k], j*FLY_GAP, ()=>{
            if(gen!==ledgerGen) return;      // a rewind or jump already redrew it
            tick(k, base[k]+j+1, true);
            // the net row is the two ATP rows added up, so it ticks with them
            if(k==='spent') tick('net', netStr(baseNet-j-1), true);
            if(k==='made')  tick('net', netStr(baseNet+j+1), true);
          });
      }
    }, 0);
  }
}
// Write a landed number into its row and flash it.
function tick(row,val,bump){
  const el=ledgerEl.querySelector(`[data-row="${row}"]`);
  if(!el) return;
  el.textContent=val;
  if(bump){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}

const trayEl=document.getElementById('tray');

/* =============================================================
 *  THE ATP/ADP CARRIER — one object that changes, not two cards
 * =============================================================
 *  ATP and ADP were two tiles, and the one phosphate distinguishing them was
 *  never drawn. Here they are the same object: three phosphates on the chain
 *  or two, spent at steps 1 and 3, recharged at 7 and 10. Which is showing is
 *  read off the step's `couple` (cin before it runs, cout after).
 *
 *  ONE DRAWING: `atpSkel`, the tetraanion built from ideal geometry (see ATP
 *  at the top of this script for why the built one, not the conformer), in the
 *  main scene so it stands beside the sugar under the same camera. ADP is that
 *  molecule with `gly.gamma` hidden — Pγ and its three terminal O, exactly the
 *  PO₃⁻ a kinase moves. The bridging oxygen stays behind on ADP, because that
 *  is where it actually stays.
 *
 *  A SCHEMATIC BEHIND A TOGGLE was removed: it read well, was never used, and
 *  quietly claimed what the real molecule refutes — that ATP is mostly
 *  phosphate. It is mostly adenosine; three atoms in thirty-one are what the
 *  cell spends. The toggle went with it.
 */
/* ---------- THE CARRIER PAIRS ----------
 * A carrier is ONE object with two states differing by exactly one group:
 * ATP/ADP by the transferring phosphoryl, NADH/NAD⁺ by the hydride on the
 * nicotinamide C4. A pair is named by that group and nothing else, so
 * everything below is shared between them.
 *
 * `group` is hidden to show the discharged state, `anchor` is the atom a flight
 * aims at, both read off the spec's own `gly` block.
 *
 * NAD⁺ IS DRAWN AS NADH MINUS ONE HYDROGEN — a declared schematic
 * (MolecularGeometry.md §1.6). `nic.h` is the PAIR of hydrogens on C4, and
 * taking one away is the chemistry the step teaches: NAD⁺ takes a hydride, C4
 * goes from one H to two. Not shown: the ring going aromatic and flat again,
 * since the spec is built as the dihydro boat (`nadh` in mol-glycolysis.js) and
 * one drawing cannot be both. The page's claim is about C4's hydrogens.
 */
const PAIRS={
  ATP:{ spec:()=>ATP,    group:s=>s.gly.gamma,      anchor:s=>s.gly.pg,
        on:'ATP',  off:'ADP',
        sub:on=>`${on?ATP.gly.phosphates:ATP.gly.spent.phosphates} phosphates · ${on?'charged':'discharged'}`},
  // `keep` IS LOAD-BEARING. This page draws no C–H (see visibleAtoms) and the
  // carrier is built setOptionalH(false) like every lane — but BOTH of C4's
  // hydrogens are in nadh's `optH` and are the entire difference between the
  // states: hidden, NAD⁺ and NADH are the same 73 atoms and the step shows
  // nothing. So this pair asks for its two back.
  NAD:{ spec:()=>NADH, group:s=>[s.gly.nic.h[1]], anchor:s=>s.gly.nic.c4,
        keep:s=>[s.gly.nic.h[0]],
        on:'NADH', off:'NAD⁺',
        sub:on=>on?'carrying the hydride':'empty carrier'},
};
// Which pair a step touches, off its couple — never typed at the call site.
const CARRIER=new Set(['ATP','ADP','NAD','NADH']);
function pairOf(st){
  const c=st&&st.couple; if(!c) return null;
  const k=carrierKey(c.cin);
  return (k==='ATP'||k==='ADP') ? PAIRS.ATP : (k==='NAD'||k==='NADH') ? PAIRS.NAD : null;
}
const carrierEl=document.createElement('div');
carrierEl.id='carrier';
carrierEl.innerHTML=
   '<span class="need"></span>'
  +'<div class="cname"></div><div class="csub"></div>'
  +'<div class="cvis"></div><div class="cscale"></div>';

// THE DRAWING IS A MOLECULE ON THE STAGE, not a picture in a box: same scene,
// scale and camera as the sugar — the claim being that this is another molecule
// in the cytosol, not an icon for one. `#carrier` holds the space the tray
// reserves (and the name and prompt), so the camera's left inset is still
// measured off DOM.
/* ONE MOLECULE PER UNIT THE STEP MOVES, stacked down the column. Steps 1 and 3
 * show one; 7 and 10 charge TWO ADP and show two, since after the split
 * everything happens twice and one drawing would say "2 ATP" in words while
 * showing one object. Count comes off the step's own `spent`/`made`, the
 * numbers the ledger adds up. Each gets its own DOM slot (`.cslot`), so
 * stacking, sizing and label are layout while the molecules stay in the scene.
 */
let cMols=[], cSpec=null;
// how many: the units the step moves, off the fields the ledger adds up
const carrierCount=st=>Math.max(1, (st&&(st.made||st.spent||st.nadh))||1);
function carrierMols(n, spec){
  // A DIFFERENT MOLECULE MEANS A DIFFERENT DRAWING: meshes are torn down when
  // the spec changes — reusing them leaves an ATP wearing a NADH's label.
  if(spec!==cSpec){ while(cMols.length) root.remove(cMols.pop()); cSpec=spec; }
  while(cMols.length>n){ root.remove(cMols.pop()); }
  while(cMols.length<n){
    const g=Stage.buildMolecule(spec,{center:true});
    Stage.setOptionalH(g,false);        // same convention as the pathway lanes
    root.add(g); popCarrier(cMols.length); cMols.push(g);
  }
  // slots rebuilt only when the count changes, so the boxes a running animation
  // measures against do not move under it
  const vis=carrierEl.querySelector('.cvis');
  if(vis.children.length!==n){
    vis.innerHTML=Array.from({length:n},()=>
      '<div class="cslot"><span class="clab"></span></div>').join('');
  }
  return cMols;
}
// The discharged state is the charged one with the pair's group hidden —
// `visible`, not removed: the next step puts it back and a deleted mesh cannot.
function setCarrierGroup(g,pair,spec,charged){
  const u=g.userData, idx=pair.group(spec), set=new Set(idx);
  idx.forEach(i=>{ const mesh=u.atomMeshes[i]; if(mesh) mesh.visible=charged; });
  u.bondMeshes.forEach(bm=>{
    if(bm.userData.pair.some(p=>set.has(p))) bm.visible=charged; });
  // …and the atoms this pair needs on screen in either state, which setOptionalH
  // would take with the rest of the C–H (see `keep`). Re-asserted every draw,
  // because setOptionalH runs on every build.
  const keep=pair.keep && pair.keep(spec);
  if(keep){ const ks=new Set(keep);
    keep.forEach(i=>{ const m=u.atomMeshes[i]; if(m) m.visible=true; });
    u.bondMeshes.forEach(bm=>{
      if(bm.userData.pair.some(p=>ks.has(p))) bm.visible=true; }); }
}
/* WHICH INSTANCE HAS ALREADY MOVED. On a per-lane step instance j belongs to
 * lane j: click lane 0 and the first ADP becomes an ATP while the second waits,
 * the whole reason there are two. Elsewhere the step is all-or-nothing and
 * `reviewing` answers for every instance at once.
 * `carrierGone` is the same answer for the beat in between: for the FLY ms a
 * phosphate is crossing, the step has not landed, so `reviewing` is false and
 * the ATP went on showing three phosphates while a fourth sailed away. The bond
 * was clicked; it broke then. Set when the flight starts, cleared when the step
 * lands and by every jump out of a step. */
const carrierGone=new Set();
const carrierRan=j=>reviewing||laneDone.has(j)||carrierGone.has(j);
// a spend starts charged and ends flat; a charge, the reverse
const carrierCharged=(st,j)=>
  (st&&st.couple&&st.couple.up) ? !carrierRan(j) : carrierRan(j);

/* ---------- CLICKING THE BOND THAT BREAKS ----------
 * The disc is the affordance, so the disc is the hit area. It used to be a
 * raycast against the four γ meshes with the whole #carrier box as fallback —
 * the name, the sub-line and 400×470px of empty column, so a student could run
 * a kinase step by clicking nothing in particular.
 * Now exactly what step 2 uses on the sugar: a transparent circular button in
 * #spots, pinned to the disc's projected point (placeCarrierGlow places both)
 * and the same size, so what is clickable is what is lit.
 * Steps 7 and 10 have no disc HERE — their bond is on the sugar, each lane
 * carrying its own (`spot:{at:'hot'}`). `carrierLive`, set by drawCarrier,
 * separates the two cases.
 */
let carrierLive=false;              // a spend step, ATP showing: the disc is up

// KEEP IT OVER ITS OWN BOX. Being in the scene, it would otherwise swing away
// on an orbit and drift on a zoom; anchoring to the reserved box every frame
// keeps the left column where the layout says. Position only — it still turns
// with the scene, because it is in it.
const cAnchor=new THREE.Vector3();
/* ARRIVING, NOT ALREADY THERE. The carrier used to appear with the tray at full
 * size — a 43-atom molecule simply existing beside the sugar, which reads as
 * page furniture, not as the other reactant turning up. So it grows the last of
 * the way over ARRIVE_MS, once, on the frame it first becomes visible. Slight
 * on purpose: a molecule entering the scene, not a card animating.
 * A MULTIPLIER on the fitted scale, never a scale of its own — placeCarrierMol
 * solves the real one from the column every frame, and an entrance setting
 * `scale` directly would fight it and win for as long as it ran.
 */
const ARRIVE_MS=520, ARRIVE_FROM=0.82;
// PER INSTANCE: with two carriers on screen "something arrived" is a claim
// about ONE of them. Popping both when a single lane hands over its phosphate
// says the other changed too — the reading the two drawings exist to prevent.
let arriveAt=[], wasVis=false;
const easeOut=t=>1-Math.pow(1-t,3);
// Start instance j's entrance: on Begin, when the count grows, and for the ONE
// that just caught a phosphate — never as a side effect of a redraw.
const popCarrier=j=>{ arriveAt[j]=performance.now(); };
function arriveScale(j){
  const t0=arriveAt[j];
  if(!t0) return 1;
  const t=(performance.now()-t0)/ARRIVE_MS;
  if(t>=1){ arriveAt[j]=0; return 1; }
  return ARRIVE_FROM+(1-ARRIVE_FROM)*easeOut(t);
}
function placeCarrierMol(){
  if(!cMols.length) return;
  const vis = carrierEl.isConnected && trayEl.style.visibility!=='hidden';
  // the arrival is the transition INTO visible, never a plain re-layout
  if(vis && !wasVis) cMols.forEach((_,j)=>popCarrier(j));
  wasVis=vis;
  cMols.forEach(g=>g.visible=vis);
  if(!vis) return;
  const slots=carrierEl.querySelectorAll('.cslot');
  const c=canvas.getBoundingClientRect();
  if(!c.width || !c.height) return;
  camera.updateMatrixWorld();
  const z=cAnchor.set(0,0,0).project(camera).z;      // the lanes' own depth
  const m=Stage.measure(cSpec||ATP);
  const pxPerWorld=c.width/(camera.right-camera.left);
  let k=1;
  cMols.forEach((g,j)=>{
    const box=slots[j] && slots[j].getBoundingClientRect();
    if(!box || !box.width) return;
    g.position.copy(new THREE.Vector3(
      ((box.left+box.width/2)-c.left)/c.width*2-1,
      -(((box.top+box.height/2)-c.top)/c.height*2-1), z).unproject(camera));
    // FITTED TO ITS OWN SLOT, never enlarged past true scale — the `1` in this
    // min. The carriers run well over twice glucose across and would take the
    // stage from the molecule the lesson follows, so they shrink and the
    // caption says by how much.
    k=Math.min(box.width *0.94/(2*m.rxz*pxPerWorld),
               box.height*0.94/(2*m.hy *pxPerWorld), 1);
    g.scale.setScalar(k*arriveScale(j));
  });
  // the CAPTION states the fitted scale, not the entrance's frame — a number
  // ticking 35 → 40 → 45 measures the animation, not the molecule it claims
  setCarrierScaleNote(k, m);
}
// The line under the drawing. `k` is the shrink applied this frame; the ratio
// beside it is what scale 1 would look like, measured off the same two specs
// the stage draws. Written only when the text changes — this runs every frame.
let scaleNote='';
function setCarrierScaleNote(k, m){
  const gl=Stage.measure(M.glucose);
  const txt = k>=0.995 ? `true size beside the sugar`
    // rounded to 5%: the fit moves a few points as camera insets change, and a
    // caption ticking 41 → 46 while the molecule sits still reads as a
    // measurement. The claim is the order of the number
    : `shown at ${Math.round(k*20)*5}% — really ${(m.rxz/gl.rxz).toFixed(1)}× glucose across`;
  if(txt===scaleNote) return;
  scaleNote=txt;
  carrierEl.querySelector('.cscale').textContent=txt;
}

/* ---------- the bond that breaks, marked ----------
 * Step 2 says "this bond comes apart" with a pulsing disc behind the bond
 * (.sglow, drawSpots); a kinase step gets the same mark behind the Pβ–O bond
 * the enzyme breaks. Neither end is typed — both derive from `gly.gamma` (see
 * gammaBreak, which has the trap), so the mark and the four atoms that fly
 * cannot disagree about which bond this step is.
 * Only while the step is live and ATP is showing (`carrierLive`): on steps 7
 * and 10 the phosphate is arriving, and there is no bond here to break.
 */
const cglowEl=document.getElementById('cglow');
let breakBond=null;
function gammaBreak(){
  if(breakBond) return breakBond;
  const g=ATP.gly, set=new Set(g.gamma);
  // Pγ's one neighbour that `gamma` does not claim: the β–γ bridging oxygen.
  const b=ATP.bonds.find(b=>(b[0]===g.pg&&!set.has(b[1]))||(b[1]===g.pg&&!set.has(b[0])));
  const o=b ? (b[0]===g.pg?b[1]:b[0]) : -1;
  // AND THE BOND THAT BREAKS IS THE ONE ABOVE IT — Pβ–O, not O–Pγ. A kinase
  // moves PO₃⁻: Pγ and its three terminal oxygens leave, the bridging oxygen
  // STAYS as a terminal oxygen of ADP (why `gamma` is four atoms, not five).
  // O–Pγ survives the step; marking it would say the opposite of what happens.
  return (breakBond = o<0 ? [-1,-1] : [g.pb, o]);
}
const cglowV=new THREE.Vector3();
const cspotEl=document.getElementById('cspot');
cspotEl.onclick=()=>press(runStep);
function placeCarrierGlow(){
  const g0=cMols[0];
  const on = carrierLive && g0 && g0.visible && gammaBreak()[0]>=0;
  cglowEl.style.display = on ? 'block' : 'none';   // '' would fall back to the CSS `none`
  cspotEl.hidden = !on;                            // lit and clickable together
  if(!on) return;
  const u=g0.userData, [i,j]=gammaBreak();
  cglowV.copy(u.atomWorld(i)).add(u.atomWorld(j))
    .multiplyScalar(.5).project(camera);
  const x=(cglowV.x*0.5+0.5)*canvas.clientWidth, y=(-cglowV.y*0.5+0.5)*canvas.clientHeight;
  const d=cglowEl.querySelector('.sglow');
  d.style.left=x+'px'; d.style.top=y+'px';
  cspotEl.style.left=x+'px'; cspotEl.style.top=y+'px';
  // clear of both the disc and the γ oxygens — 29px cleared only the disc's
  // edge and left the text sitting on an atom
  const h=cglowEl.querySelector('.chint');
  h.style.left=(x+52)+'px'; h.style.top=y+'px';
}
// Where the phosphate flight starts or ends, in client pixels: the γ phosphate
// of the instance this click moves — on a per-lane step lane j's own ADP, not
// "the carrier".
function carrierGammaPoint(j){
  if(!carrierEl.isConnected || trayEl.style.visibility==='hidden') return null;
  const g=cMols[Math.min(j||0, cMols.length-1)];
  if(!g) return null;
  const c=canvas.getBoundingClientRect();
  if(!c.width||!c.height) return null;
  const pair=pairOf(stepAt(focusStep())) || PAIRS.ATP;
  const p=g.userData.atomMeshes[pair.anchor(pair.spec())]
    .getWorldPosition(new THREE.Vector3()).project(camera);
  return {x:c.left+(p.x*.5+.5)*c.width, y:c.top+(-p.y*.5+.5)*c.height};
}
// Carrier for a step. The ELEMENT persists across refreshes (moved, never
// rebuilt) so the molecule in it isn't torn down every step.
function drawCarrier(st, live, showKey){
  const pair=pairOf(st) || PAIRS.ATP, spec=pair.spec();
  const count=carrierCount(st);
  // `live` on the BOX = the box is the button, FALLBACK only when nothing on a
  // molecule runs the step (a spend puts the disc on ATP's own bond, #cspot;
  // other carrier steps on the sugar). A 400×470px column running the step is
  // not "click the bond", so no pointer, no cursor.
  const boxLive = live && !(st && (st.spot || (st.couple && st.couple.up)));
  carrierEl.className = (boxLive?'live':'') + (count>1?' multi':'');
  // THE PROMPT SITS WHEREVER THE TARGET IS: on a spend that's the bond on the
  // stage (#cglow .chint), so this stays empty rather than repeat it.
  carrierEl.querySelector('.need').textContent = boxLive ? `← ${st.need}` : '';
  carrierEl.onclick = boxLive ? ()=>press(runStep) : null;
  // disc and button go up together; placeCarrierGlow reads this. Only the ATP
  // pair has a bond to break HERE — the hydride leaves the sugar, so step 6's
  // target is on G3P.
  carrierLive = live && pair===PAIRS.ATP && showKey==='ATP' && count===1;
  carrierMols(count, spec);
  // EACH INSTANCE ANSWERS FOR ITSELF: on a per-lane step one can be loaded and
  // the other empty — the half-run state, which one headline name cannot say.
  // Name on the slot; a column heading only when there is one object to name.
  const slots=carrierEl.querySelectorAll('.cslot');
  cMols.forEach((g,j)=>{
    const on=carrierCharged(st,j);
    setCarrierGroup(g,pair,spec,on);
    const lab=slots[j] && slots[j].querySelector('.clab');
    if(lab) lab.textContent = on ? pair.on : pair.off;
  });
  const anyOn=carrierCharged(st,0);
  carrierEl.querySelector('.cname').innerHTML = count>1 ? '' : (anyOn?pair.on:pair.off);
  carrierEl.querySelector('.csub').textContent = count>1 ? '' : pair.sub(anyOn);
  placeCarrierMol();
}

function drawTray(){
  // Invisible until Begin, but NOT absent: inert pools beside Begin invite the
  // wrong click. Keeps its SPACE — usable() measures it to place the lesson,
  // and a zero-size tray jumped the opening screen sideways on the first click.
  trayEl.style.display='flex';
  trayEl.style.visibility = intro ? 'hidden' : 'visible';
  trayEl.style.pointerEvents = intro ? 'none' : '';
  // ONLY THE CARRIERS THIS STEP TOUCHES: the ledger carries the arithmetic, so
  // a standing five was four inert tiles competing with the one that mattered.
  // Cost: NAD⁺ and Pi walking down to 0 are no longer visible. Read off the
  // step, never typed.
  const i=focusStep();
  const st=(!intro&&i<nSteps)?stepAt(i):null;
  const pool=poolAt(done);
  const c=st&&st.couple;
  const want=new Set();
  if(st&&st.reagent) want.add(st.reagent);
  if(c){ want.add(carrierKey(c.cin)); want.add(carrierKey(c.cout)); if(c.plus) want.add(c.plus); }
  // A rearrangement touches no carrier: keep the space, show nothing.
  if(!want.size){ trayEl.style.visibility='hidden'; }
  trayEl.innerHTML=`<div class="tcue">Carriers</div>`
    +'<div class="tstrip"></div>';
  const strip=trayEl.children[1];
  // ATP AND ADP ARE ONE ROW, NOT TWO. Which of the pair shows comes off the
  // couple — cin until the step has run, cout after — so the object changes at
  // exactly the moment the phosphate lands.
  const pair = c && CARRIER.has(carrierKey(c.cin)) && CARRIER.has(carrierKey(c.cout));
  if(pair){
    const showKey = carrierKey(reviewing ? c.cout : c.cin);
    // BACK IN THE TRAY FIRST: `trayEl.innerHTML` detached it, and drawCarrier
    // places molecules by `isConnected` — placing while detached replayed the
    // entrance animation on every refresh (see popCarrier).
    strip.appendChild(carrierEl);      // moved, never rebuilt — see drawCarrier
    drawCarrier(st, !!st && CARRIER.has(st.reagent) && !busy && !reviewing, showKey);
  }
  // NO CARD FOR Pi: this step's phosphate drifts out of the cytosol onto the
  // sugar (see aboveFrame). A tray copy = the same molecule on screen twice.
}

const actEl=document.getElementById('actbtn');
const stepHeadEl=document.getElementById('stephead');
const stepTipEl=document.getElementById('steptip');
const BURST_MS=190;   // just under the .3s press flash
const pulseEl=document.getElementById('stagepulse');
let pressing=false;
// EVERY PRESS: flash first, work under its tail — acting immediately re-renders
// the button out from under its own animation. setTimeout, not transitionend: a
// backgrounded tab must still arrive at the next state (see `later`).
function press(fn){
  if(pressing || busy) return;
  pressing=true;
  actEl.classList.add('burst');
  // Re-adding a class the element already carries does not restart a CSS
  // animation. Drop it, force a reflow, re-add.
  pulseEl.classList.remove('pulse'); void pulseEl.offsetWidth;
  pulseEl.classList.add('pulse');
  later(()=>{ pressing=false; fn(); }, BURST_MS);
}
function beginPathway(){
  if(!intro) return;
  press(()=>{
    intro=false; refresh();
    // Framing doesn't change here (Begin is button-sized, tray held its space)
    // but the caption does, and usable() measures #bottombar live.
    computeFit();
  });
}
function drawAct(){
  // THE HEADING TRACKS THE BEAT: step + hook on the way in, step done on the
  // way out, nothing at intro or end. Holds its height when empty.
  const hi=focusStep();
  const head = intro ? ''
             : reviewing ? `Step ${STEPS[done-1].n} complete`
             : hi<nSteps ? headAt(hi)
             : '';
  // THE CAPTION HANGS OFF THE HEADING: the ⓘ carries that step's own text,
  // read from the same place the band used to print, so one caption per step.
  const tip = head ? captionAt(hi) : '';
  stepHeadEl.innerHTML = head + (tip
    ? `<span class="infowrap"><button class="infobtn" type="button"
         aria-describedby="steptip"
         aria-label="What happens in this step">i</button></span>`
    : '');
  stepTipEl.innerHTML = tip;
  stepHeadEl.classList.toggle('on', !!head);
  // THE REVIEW BEAT ARRIVES AS ONE THING, after the molecule: verdict, button
  // and coupling box share the delay, so none lands while the glow/settle still
  // play. On the state CHANGE only — a refresh mid-review must not replay it.
  const entering = reviewing && !shownReview;
  shownReview = reviewing;
  // Restarted on the way in only: a mid-flight refresh would otherwise strip
  // the class and snap both to full strength halfway through.
  if(entering){ stepHeadEl.classList.remove('revin'); void stepHeadEl.offsetWidth; }
  stepHeadEl.classList.toggle('revin', reviewing);
  // ONE BUTTON, ONE PLACE, ONE WORD. Begin and every step share this element,
  // so the thing to click never jumps between stage and sidebar.
  if(intro){
    actEl.style.visibility='visible';
    actEl.className='';        // the same button, the same size, in the same slot
    actEl.innerHTML=`Begin <i class="ph-bold ph-arrow-right"></i>`;
    actEl.onclick=beginPathway;
    return;
  }
  actEl.className = reviewing ? 'revin' : '';
  // THE REVIEW SCREEN'S ONE CONTROL. Next is how you say you have looked at
  // the molecule. Also step 10's last beat — press it and the closing question
  // comes up.
  if(reviewing){
    actEl.style.visibility='visible';
    actEl.innerHTML=`Next <i class="ph-bold ph-arrow-right"></i>`;
    actEl.onclick=()=>{ reviewing=false; refresh(); };
    return;
  }
  const st=done<nSteps?stepAt(done):null;
  // THE LAST BUTTON IS IN THE SAME SLOT AS EVERY OTHER — so the closing
  // question is here too, not three cards arriving over the pyruvate.
  if(!st && !busy){
    actEl.style.visibility='visible';
    actEl.innerHTML=`What's next? <i class="ph-bold ph-arrow-right"></i>`;
    actEl.onclick=()=>Fork.show();
    return;
  }
  if(!st || busy){ actEl.style.visibility='hidden'; actEl.onclick=null; return; }
  // A REAGENT STEP HAS NO BUTTON: the click belongs on the carrier — you cannot
  // phosphorylate without spending an ATP, and a Next would be an easier way
  // past the lesson. `visibility`, not `display`: usable() reserves
  // #bottombar's height along the bottom edge.
  if(st.reagent){ actEl.style.visibility='hidden'; actEl.onclick=null; return; }
  // A SPOT STEP HAS NO BUTTON EITHER, same reason: the click IS the bond
  // coming apart. The hint beside the circle says where to click.
  if(st.spot){ actEl.style.visibility='hidden'; actEl.onclick=null; return; }
  actEl.style.visibility='visible';
  // THE BUTTON NAMES THE ACTION, not the direction. "Next" moves a slideshow;
  // "Cleave the C3-C4 bond" makes the student work out what is coming — the
  // beat a carrier step gets free from the tray. Words are the step's `act`.
  actEl.innerHTML=`${st.act} <i class="ph-bold ph-arrow-right"></i>`;
  actEl.onclick=()=>press(runStep);
}

// Jump to the state just BEFORE step k, so the student re-runs it rather than
// landing on its aftermath. Shared by the rail and the all-steps list. A
// half-run step is abandoned with the jump — renderLanes rebuilds both lanes
// and `laneDone` would otherwise still claim a lane had run.
const goToStep=k=>{ if(busy) return; intro=false; reviewing=false; done=k;
  laneDone.clear(); carrierGone.clear(); renderLanes(done); refresh(); };

const railEl=document.getElementById('rail');
function drawRail(){
  // The rail's only job is "where am I in the ten" (see the CSS header above).
  railEl.innerHTML='';
  STEPS.forEach((st,idx)=>{
    // THREE READINGS, separated by `done` (steps RUN). idx===done is the step
    // you are ON — waiting or in flight, the same to a student, so AWAKE but
    // hollow: filled means MADE, and nothing is made until the transition
    // lands. idx===done-1 is what you just made: filled.
    const state = (!intro && !reviewing && idx===done) ? 'run'
                : (!intro && idx===done-1) ? 'cur'
                : (idx < done)             ? 'past'
                :                            'future';
    const b=document.createElement('button');
    b.className='rnum '+state;
    b.textContent=st.n;
    b.setAttribute('aria-label',`Step ${st.n}`);
    if(state==='cur') b.setAttribute('aria-current','step');
    // Only a step that has run can be returned to — skipping to step 7 would
    // hand over a molecule the student never made.
    if(state==='past') b.onclick=()=>goToStep(idx+1);
    else if(state!=='cur') b.disabled=true;
    // a disabled button cannot be styled awake in every browser's default sheet,
    // and the running number is not a control anyway — it is a state
    railEl.appendChild(b);
  });
}

/* The panel under the card. ONE of three, in priority order: PFK-1's regulation
 * when that step is next (the page's one piece of real regulatory biology — it
 * should not compete for attention), else this step's reversibility, else the
 * gluconeogenesis consequence once finished. */
const noteEl=document.getElementById('stepnote');
const irrevSteps=()=>STEPS.filter(s=>s.rev===false);

/* ---- the coupled-reaction figure ------------------------------------------
 * VERTICAL POSITION IS FREE ENERGY — why there is no axis to read. The coupled
 * arrow ALWAYS runs opposite the main one: uphill happens because something
 * steeper runs downhill beside it, and downhill is worth having because it
 * pushes something uphill.
 *
 * NO NUMBERS — direction, not magnitude, same reason the page prints no
 * per-step ΔG. Appears at FIVE of the ten steps; the other five are
 * rearrangements, and that absence separates steps that move energy from steps
 * that move atoms.
 */
// Species names READ OFF THE MOLECULES, not typed (a name typed twice can
// disagree with the molecule): `from` is what stands in the lanes before the
// step, `to` what it leaves, both the spec's own `short`. `plus` is the one
// step with a second substrate (step 6's Pi).
function resolveCouple(st){
  const i=STEPS.indexOf(st), c=st.couple;
  const nameOf=k=>M[k].short||M[k].name;
  return Object.assign({}, c, {
    from: nameOf(speciesAt(i)[0]) + (c.plus?` + ${c.plus}`:''),
    to:   nameOf(st.species[0]) });
}
function coupleFig(c){
  // Higher-energy species on top: product if uphill, substrate if downhill.
  const topMain = c.up ? c.to : c.from, botMain = c.up ? c.from : c.to;
  // The carrier's charged form (ATP, NADH) is always the higher-energy one.
  const topCpl  = c.up ? c.cin : c.cout, botCpl = c.up ? c.cout : c.cin;
  const mainLine = c.up ? 'M66,116 L66,34' : 'M66,30 L66,112';
  const mainHead = c.up ? 'M66,24 l6.5,13 h-13 z' : 'M66,122 l6.5,-13 h-13 z';
  // Both directions written out: same shape, only the arrowhead end differs —
  // explicit rather than derived by string surgery.
  const CURVE_DOWN='M176,42 C126,48 90,58 90,74 C90,90 126,100 176,106';
  const CURVE_UP  ='M176,106 C126,100 90,90 90,74 C90,58 126,48 176,42';
  const cplLine = c.up ? CURVE_DOWN : CURVE_UP;      // opposite the main arrow
  const cplHead = c.up ? 'M176,106' : 'M176,42';
  // Only a '+' against the preceding character is a CHARGE (NAD+). Spaced, it
  // is arithmetic (G3P + Pi) and stays on the baseline — superscripting that
  // one made "G3P plus Pi" read as a cation.
  const sup=t=>t.replace(/(\S)\+/g,'$1<tspan baseline-shift="super" font-size="9">+</tspan>')
                .replace(/Pi\b/,'P<tspan baseline-shift="sub" font-size="9">i</tspan>');
  return `<svg class="cpl ${c.tone==='n'?'n':'p'}" viewBox="0 0 300 152" role="img"
      aria-label="${c.from} to ${c.to} runs ${c.up?'uphill':'downhill'}; coupled to ${c.cin} becoming ${c.cout}, which runs the opposite way">
    <text class="ax" transform="translate(12,88) rotate(-90)">free energy</text>
    <path class="axl" d="M22,134 L22,22"/><path class="axh" d="M22,15 l4.5,10 h-9 z"/>
    <text class="cm" x="66" y="16" text-anchor="middle">${sup(topMain)}</text>
    <path class="ml" d="${mainLine}"/><path class="mh" d="${mainHead}"/>
    <text class="cm" x="66" y="147" text-anchor="middle">${sup(botMain)}</text>
    <path class="cl" d="${cplLine}"/>
    <path class="ch" d="${cplHead} l-11,-4.5 v9 z"/>
    <text class="cs" x="186" y="46">${sup(topCpl)}</text>
    <text class="cs" x="186" y="110">${sup(botCpl)}</text>
  </svg>`;
}
/* The same step as a REACTION COORDINATE, beside the arrows not instead: they
 * say what coupling does, the curve shows the barrier — what a student asks
 * about after the mass-action modal.
 *
 * TWO TRACES, ONE CLAIM. Dashed = the sugar reaction alone; solid = coupled.
 * Uphill: dashed ends ABOVE its start, solid below — coupling turning a
 * reaction that will not go into one that will. Downhill: dashed falls further,
 * and the difference is what was banked into ATP or NADH.
 *
 * STILL NO MAGNITUDES: heights are fixed constants shared by every step, so the
 * figure claims a SIGN only — to scale it would assert ΔG the page cannot
 * source. Same rule as the arrows above.
 */
const RC_Y={ hi:34, mid:76, lo:120, peak:22 };
function coupleCurve(c){
  const Y=RC_Y;
  // Both traces leave the same place: same molecule before the step.
  const start=c.up ? Y.lo : Y.hi;
  const endAlone=c.up ? Y.mid : Y.lo;      // uphill alone / the full drop alone
  const endWith =c.up ? Y.lo+16 : Y.mid;   // coupled: over the top, or part banked
  const peak=Math.min(start,endAlone,endWith)-Y.peak;
  const trace=(y0,y1)=>`M34,${y0} H88 C120,${y0} 126,${peak} 150,${peak}`
                      +` C174,${peak} 180,${y1} 212,${y1} H266`;
  return `<svg class="cpl ${c.tone==='n'?'n':'p'}" viewBox="0 0 300 152" role="img"
      aria-label="${c.from} to ${c.to}: on its own the step runs ${c.up?'uphill':'downhill'};
        coupled to ${c.up?c.cin:c.cout} it runs ${c.up?'downhill':'less far down'}">
    <text class="ax" transform="translate(12,88) rotate(-90)">free energy</text>
    <path class="axl" d="M22,134 L22,22"/><path class="axh" d="M22,15 l4.5,10 h-9 z"/>
    <!-- COUPLED FIRST, ALONE ON TOP. They share a start and peak, so they are
         superimposed for the climb; whichever is drawn second is what you see.
         Dashed on top because dashed-over-solid reads as BOTH — the other
         order hides it and the figure looks like one curve that forks. -->
    <path class="rc with"  d="${trace(start,endWith)}"/>
    <path class="rc alone" d="${trace(start,endAlone)}"/>
    <!-- ABOVE the trace it names: no room to the RIGHT of one running to
         x=266, so the label goes over it. -->
    <text class="et alone" x="266" y="${endAlone-7}" text-anchor="end">on its own</text>
    <text class="et with"  x="266" y="${endWith-7}" text-anchor="end">with ${c.up?c.cin:c.cout}</text>
  </svg>`;
}

/* THE OTHER FIVE STEPS, same axes. Rearrangements — no carrier, so no second
 * trace — but leaving them blank made "energy curve" look like a property of
 * coupled steps rather than of every reaction.
 *
 * FLAT BECAUSE THE DATA SAYS FLAT: the claim is `rev:true` read off the step —
 * near equilibrium means both sides at nearly the same free energy, the same
 * fact as a picture. No magnitudes here either.
 */
function soloCurve(st){
  const Y=RC_Y, nameOf=k=>M[k].short||M[k].name;
  const i=STEPS.indexOf(st);
  const from=nameOf(speciesAt(i)[0]), to=nameOf(st.species[0]);
  const y=Y.mid, peak=y-Y.peak;
  const trace=`M34,${y} H88 C120,${y} 126,${peak} 150,${peak}`
             +` C174,${peak} 180,${y} 212,${y} H266`;
  return `<svg class="cpl" viewBox="0 0 300 152" role="img"
      aria-label="${from} to ${to}: substrate and product sit at nearly the same
        free energy, with a barrier between them">
    <text class="ax" transform="translate(12,88) rotate(-90)">free energy</text>
    <path class="axl" d="M22,134 L22,22"/><path class="axh" d="M22,15 l4.5,10 h-9 z"/>
    <path class="rc solo" d="${trace}"/>
    <text class="et alone" x="34" y="${y+18}">${from}</text>
    <text class="et alone" x="266" y="${y+18}" text-anchor="end">${to}</text>
  </svg>`;
}
const soloLine=`Both sides sit
   at nearly the <b>same energy</b>, so the step runs either way.`;

// Two views of one step. `figTab` is module-level because drawNote replaces
// #stepnote's innerHTML every refresh — a DOM-stored selection would reset on
// every step.
const FIGTABS=[['pair','Coupling'],['curve','Energy curve']];
// Opens on the CURVE: the view every step has, so the box shows the same kind
// of picture whichever step you are on.
let figTab='curve';
const figTabStrip=()=>`<div class="ftabs">`
  + FIGTABS.map(([k,lb])=>`<button data-figtab="${k}"${figTab===k?' class="on"':''}>${lb}</button>`).join('')
  + `</div>`;

// One line — the picture does the work.
const coupleLine=c=>c.up
  ? `On its own this step runs <b>uphill</b>. It happens because <b>ATP</b> is
     running further downhill alongside it — that is <b>coupling</b>.`
  : `This step runs <b>downhill</b>, and the drop is not wasted: it drives
     <b>${c.cout}</b> the other way, <b>uphill</b>.`;

// ONE DOOR, TWO PLACES: every step's verdict, and the closing tally. Delegated,
// not bound — drawNote replaces this element's innerHTML every refresh and a
// bound handler would die with it.
// THE DOOR CARRIES THE STEP THROUGH IT. Opened from a step's verdict, the demo
// must open on the case that verdict just announced — landing on the flat tab
// under an "Irreversible in the cell" heading reads as a contradiction, and the
// student has no reason to press the other tab to resolve it. The step index
// rides in the attribute because drawCouple replaces this markup every refresh:
// a closure captured here would describe whichever step was on screen when the
// handler was written. An empty value is the pathway-wide summary, which
// belongs to no step.
const massLink=st=>`<button class="minfo" data-mass="${st?STEPS.indexOf(st):''}">`
  + (st && st.rev===false ? `Why can't this one go backwards? →`
                          : `What decides the direction? →`)
  + `</button>`;
const noteClick=e=>{
  const door=e.target.closest('[data-mass]');
  if(door){ const i=door.dataset.mass; Mass.show(i===''?null:STEPS[+i]); return; }
  const t=e.target.closest('[data-figtab]');
  if(t){ figTab=t.dataset.figtab; drawCouple(); }
};
noteEl.addEventListener('click',noteClick);

/* THE COUPLING BOX, on the stage: the figure, the reversibility verdict and
 * the way into the mass-action demo. Beside the molecule, not in the sidebar,
 * because it is about what is happening in the lanes. */
const cplEl=document.getElementById('couplebox');
cplEl.addEventListener('click',noteClick);
// The box is REPLACED wholesale every refresh, so the entry animation is
// played on the new element, not transitioned (as with the rail's label flip).
// It plays when the box starts describing a different step — so the figure
// arrives with the molecule it explains.
let shownCplStep=null;
function drawCouple(){
  const i=focusStep();
  // ONLY ON THE REVIEW BEAT — the box arrives WITH Next, describing what just
  // happened. Before the step ran it was a spoiler in the corner, with nothing
  // on the stage to point at yet.
  const st=(reviewing&&!intro&&i<nSteps)?stepAt(i):null;
  if(!st){ cplEl.style.display='none'; cplEl.innerHTML=''; shownCplStep=null; return; }
  // Coupled: both views + tab strip. Uncoupled: curve only, no strip — a
  // single tab is a control that does nothing.
  const c = st.couple ? resolveCouple(st) : null;
  cplEl.style.display='block';
  cplEl.innerHTML=(c
      ? `<div class="nhead cpl-h">Coupled reaction</div>`
        + figTabStrip()
        + (figTab==='curve' ? coupleCurve(c) : coupleFig(c))
        + `<p class="nbody">${coupleLine(c)}</p>`
      : `<div class="nhead cpl-h">Energy curve</div>`
        + soloCurve(st)
        + `<p class="nbody">${soloLine}</p>`)
    + (st.rev===false
        ? `<div class="nhead irr">Irreversible in the cell</div>`
        : `<div class="nhead rev">Near equilibrium — reversible</div>`)
    + massLink(st);
  const key=`${i}`;
  if(key!==shownCplStep){
    shownCplStep=key;
    cplEl.classList.remove('in'); void cplEl.offsetWidth;   // restart the run
    cplEl.classList.add('in');
  }
}

function drawNote(){
  const i=focusStep();
  const st=(!intro&&i<nSteps)?stepAt(i):null;
  if(intro){ noteEl.innerHTML=''; noteEl.style.display='none'; return; }
  noteEl.style.display='block';

  // PFK-1 is behind the ten-steps star now (Pfk.show) and reversibility rides
  // the coupling box — so a step leaves this panel empty.
  if(st){ noteEl.innerHTML=''; return; }
  noteEl.innerHTML=`<div class="nhead irr">The three one-way steps</div>`
    +`<p class="nbody">Only <b>${irrevSteps().map(s=>s.n).join(', ')}</b> —
       ${irrevSteps().map(s=>s.enz.replace(/ \(.*\)/,'')).join(', ')} — are
       irreversible. The other seven run both ways — which is why
       <b>gluconeogenesis</b> reuses seven of these ten enzymes and needs new ones
       only for those three.</p>`
    + massLink(null);
}


/* =============================================================
 *  MASS ACTION — the modal behind the reversibility note
 *
 *  THE CLAIM, and the only one: an enzyme has no preferred direction. It
 *  converts whatever collides with it, so the NET direction is decided by which
 *  species there is more of. Both directions run the whole time — hence the
 *  backward counter, which never reads zero on a flat step. That counter is the
 *  demo: a student watching the split settle assumes the reaction stopped.
 *  THE SECOND TAB: a molecule reacts when it holds enough energy to clear the
 *  barrier (see ENERGY below), so the rare pyruvate that makes it back is
 *  visibly one of the fast ones.
 *
 *  SIMPLIFIED, deliberately and visibly (MolecularGeometry.md §1.4's rule on
 *  explicit exaggerations):
 *    · The flat step's barrier is the SAME height both ways, so it settles 1:1.
 *      Real near-equilibrium settles NEAR even — step 2 sits around 1 F6P to
 *      2 G6P. An even split is the readable version of "neither favoured".
 *    · The drop step's reverse is ~1/200 of forward, not zero: seen failing to
 *      happen, not declared impossible — overwhelmed, not forbidden. A real
 *      step 10 is far more lopsided; you'd never catch one going back.
 *    · Barrier heights are schematic. EA = 0.6 kT is far too low to be a real
 *      activation energy; it is the number that makes about half of arrivals
 *      react. Only the RATIO between the directions carries anything.
 *    · Re-jostled into a new energy every 0.3–0.85 s, keeping its heading. Real
 *      collisions are far more frequent and do re-aim; at 60fps that is a
 *      flicker travelling nowhere, and speed and path must stay readable.
 *    · No volume, no units, no rate law. The counter is conversions per second
 *      in this box, and the box means nothing beyond itself.
 *
 *  Plain 2D canvas — no Three.js, no MolLib, nothing from the pathway's scene.
 *  No coordinates to get right: these dots stand for POPULATIONS, and the
 *  moment they looked like molecules they would make a geometry claim this file
 *  cannot back up.
 * ============================================================= */
/* PFK-1's regulation, behind the ten-steps list's star. Content is PFK's,
 * rendered once — the modal is markup with two holes, so the facts live in one
 * place and the star is only a door onto them. */
const Pfk=(()=>{
  const el=document.getElementById('pfkmodal');
  const body=document.getElementById('pfkbody');
  document.getElementById('pfktitle').textContent=PFK.title;
  body.innerHTML=`<p class="mtext">${PFK.body}</p>`
    +`<div class="effrow"><div class="eff on"><div class="eh">Speeds it up</div>`
      +PFK.on.map(([a,b])=>`<div class="e"><b>${a}</b><span>${b}</span></div>`).join('')+`</div>`
    +`<div class="eff off"><div class="eh">Slows it down</div>`
      +PFK.off.map(([a,b])=>`<div class="e"><b>${a}</b><span>${b}</span></div>`).join('')+`</div></div>`
    +`<p class="mtext">${PFK.note}</p>`;
  let open=false;
  const show=()=>{ el.hidden=false; open=true; el.querySelector('.mclose').focus(); };
  const hide=()=>{ open=false; el.hidden=true; };
  el.querySelector('.mback').onclick=hide;
  el.querySelector('.mclose').onclick=hide;
  addEventListener('keydown',e=>{ if(open&&e.key==='Escape'){ e.stopPropagation(); hide(); } },true);
  return {show, hide, isOpen:()=>open};
})();

/* ---- all ten steps, in one column -----------------------------------------
 * THE MAP, not the rail. The rail hides a step until it has run — that reveal
 * makes each step a finding. A student who asks for all ten has opted out, so
 * this names every product, chip and marker outright. Nothing typed: rows are
 * built from STEPS by productOf/chipOf. A run step rewinds, like the rail. */
const AllSteps=(()=>{
  const el=document.getElementById('stepsmodal');
  const body=document.getElementById('stepsbody');
  let open=false;
  const hide=()=>{ open=false; el.hidden=true; };
  function draw(){
    body.innerHTML='';
    STAGES.forEach(s=>{
      const steps=stageSteps(s.n);
      if(!steps.length) return;                 // the two step-less states
      const g=document.createElement('div');
      g.className='sgroup';
      g.innerHTML=`<div class="sghead"><span class="bt">${s.block}</span>`
        +`<span class="bd">${s.delta}</span></div>`;
      steps.forEach(st=>{
        const idx=STEPS.indexOf(st);
        const state=(idx===done&&!intro)?'cur':idx<done?'done':'future';
        const r=document.createElement('div');
        r.className='rrow '+state;
        r.innerHTML=`<div class="rdotwrap"><div class="rdot">${st.n}</div></div>`
          +`<div class="rlab">${productOf(st)}</div>`
          +chipOf(st)
          +(st.rev===false
            ? `<div class="rirr" title="effectively irreversible in the cell">⇢</div>` : '')
          +(st.commit
            ? `<button class="rstar" data-pfk aria-label="Why this step is the one the cell controls">★</button>` : '');
        if(idx<done) r.onclick=()=>{ hide(); goToStep(idx); };
        const star=r.querySelector('[data-pfk]');
        if(star) star.onclick=e=>{ e.stopPropagation(); hide(); Pfk.show(); };
        g.appendChild(r);
      });
      body.appendChild(g);
    });
  }
  const show=()=>{ draw(); el.hidden=false; open=true; el.querySelector('.mclose').focus(); };
  el.querySelector('.mback').onclick=hide;
  el.querySelector('.mclose').onclick=hide;
  document.getElementById('allsteps').onclick=show;
  addEventListener('keydown',e=>{ if(open&&e.key==='Escape'){ e.stopPropagation(); hide(); } },true);
  return {show, hide, isOpen:()=>open};
})();

/* THE MASS-ACTION DEMO. The physics, the box and every control inside the card
 * are massaction/massaction.js; this page supplies only WHICH reactions it runs
 * and the modal it runs in.
 *
 * EACH SCENARIO IS A REAL STEP, not a toy A⇄B: flat is step 2 (genuinely near
 * equilibrium), drop is step 10. Naming them hands the demo back to the rail
 * instead of being a separate world with its own letters — and stops one fixed
 * pair of names from libelling the isomerase as one-way.
 *
 * `ea` is left at the module default: this page's claim is that ΔE decides the
 * direction, so a barrier the student can move would be a second variable in a
 * demo about one. The enzymes page is where it becomes a slider.
 *
 * DROP.drop = ln(200) — the reverse of step 10 is about 1 encounter in 200. */
// THE TABS ARE THE PAGE'S OWN VERDICT VOCABULARY — the same two words the
// coupling box stamps on every step ("Near equilibrium — reversible" /
// "Irreversible in the cell"). Naming them for the physics instead ("flat",
// "drop") made them a second scheme the student has to map onto the first.
// The KEYS stay flat/drop: they are what the model is about, and what
// check-massaction.js audits.
//
// These two are the DEFAULTS — the canonical example of each case, used when
// the demo is opened from the pathway-wide summary rather than from a step.
// Step 2 and step 10 because they are the least arguable of each kind.
const MASS_STEPS=[
  { key:'flat', tab:'Reversible', drop:0,
    title:'Why a step can run backwards', species:['G6P','F6P'],
    text:`<b>Step 2.</b> The enzyme keeps converting in <b>both</b> directions —
      what changed as the split evened out is only <b>how often</b> each
      direction comes up, which depends on how many of each are around. Crowd
      one side and watch the net flip.` },
  { key:'drop', tab:'One-way', drop:Math.log(200),
    title:'Why three steps cannot', species:['PEP','Pyruvate'],
    text:`<b>Step 10.</b> Finding that much energy at once is <b>steeply</b>
      rarer, not just a bit rarer. Watch which colour glows: blue almost always
      has enough to go forward, violet almost never has enough to go back.
      Adding more pyruvate barely helps. That's what <b>irreversible in the
      cell</b> means, true of only <b>three</b> of these ten steps.` }
];

/* THE SAME DEMO, WEARING THE STEP THE STUDENT IS ON. Opened from step 7 the
 * box used to fill with G6P and F6P, and the two molecules on the stage were
 * nowhere in it — the student has to take on faith that the general fact is
 * about the specific reaction in front of them. So the tab matching this step's
 * verdict gets this step's own substrate and product, read from the same STEPS
 * data the verdict itself is read from. The OTHER tab keeps its default, and is
 * the point of the pair: the contrast is what makes either case mean anything.
 *
 * ΔE STAYS SCHEMATIC. Only the names and the prose change — the drop is ln(200)
 * for every irreversible step, not that step's real ΔG. This page prints no ΔG
 * numbers anywhere on purpose (see the header): reversibility is the claim, and
 * three per-step magnitudes invented for legibility would look like data.
 *
 * STEP 4 FALLS BACK to the defaults. Aldolase is A ⇄ B + C, and a two-species
 * box would draw one F1,6BP becoming one DHAP — a stoichiometry claim the demo
 * cannot make and the student can read straight off the counters. Detected from
 * the lane count rather than step 4's number, so a re-ordered pathway keeps it.
 */
function massScenarios(st){
  if(!st) return MASS_STEPS;
  const i=STEPS.indexOf(st);
  if(st.species.length!==speciesAt(i).length) return MASS_STEPS;
  const nameOf=k=>M[k].short||M[k].name;
  // MID-SENTENCE, a molecule keeps the case it actually has: G6P and 1,3-BPG
  // are abbreviations and stay shouted, glucose and pyruvate are common nouns
  // and "Adding more Pyruvate" reads as a proper noun. Only a plain capitalised
  // word gets lowered — anything with a digit or a second capital is a name.
  // Labels keep the registry's own capitalisation — a chip and a curve label are
  // names, not sentences.
  const prose=n=>/^[A-Z][a-z]+$/.test(n)?n.toLowerCase():n;
  const sub=nameOf(speciesAt(i)[0]), prd=nameOf(st.species[0]);
  const subP=prose(sub), prdP=prose(prd);
  const enz=st.enz.replace(/ \(.*\)/,'');           // drop "(PFK-1)" and the like
  const mine=st.rev===false?'drop':'flat';
  return MASS_STEPS.map(s=> s.key!==mine ? s : Object.assign({}, s, {
    species:[sub,prd],
    title: mine==='flat' ? `Why step ${st.n} runs both ways`
                         : `Why step ${st.n} cannot run backwards`,
    text: mine==='flat'
      ? `<b>Step ${st.n}, ${enz.toLowerCase()}.</b> It keeps converting in
         <b>both</b> directions — what changed as the split evened out is only
         <b>how often</b> each direction comes up, which depends on how many of
         each are around. Add ${prdP} and watch the net flip.`
      : `<b>Step ${st.n}, ${enz.toLowerCase()}.</b> Going back means ${prdP}
         finding all the energy this step released, at once — <b>steeply</b>
         rarer, not just a bit rarer. Watch which colour glows: ${subP} almost
         always has enough to go forward, ${prdP} almost never has enough to go
         back. Adding more ${prdP} barely helps. That's what <b>irreversible in
         the cell</b> means, true of only <b>three</b> of these ten steps.`
  }));
}

const Mass=(()=>{
  const el=document.getElementById('massmodal');
  const box=document.getElementById('massbox');
  let sim=null, open=false;
  // REBUILT PER OPEN, not reconfigured: the scenarios change with the step, and
  // the sim is a few dozen elements and one rAF loop — cheaper to state plainly
  // than to keep a swap path nothing else needs. The old one is stopped first
  // so its loop cannot outlive the DOM it draws into.
  function show(st){
    if(sim) sim.stop();
    sim=MassAction.create({ host:box, scenarios:massScenarios(st) });
    sim.setScenario(st && st.rev===false ? 'drop' : 'flat');
    el.hidden=false; open=true;
    sim.start();
    el.querySelector('.mclose').focus();
  }
  function hide(){ open=false; if(sim) sim.stop(); el.hidden=true; }

  el.querySelector('.mback').onclick=hide;
  el.querySelector('.mclose').onclick=hide;
  // Esc closes; the modal swallows the key so it misses the page's shortcuts.
  addEventListener('keydown',e=>{ if(open&&e.key==='Escape'){ e.stopPropagation(); hide(); } },true);

  return {show, hide, isOpen:()=>open};
})();

/* WHERE PYRUVATE GOES, behind the last button. Three fates, not two: the two
 * fermentations are different reactions, products and organisms, and collapsing
 * them into "fermentation" leaves students unable to say why muscle makes
 * lactate and yeast ethanol. All three framed by the SAME question — where does
 * NAD⁺ come from — the constraint that picks one. Rendered once, stateless. */
const Fork=(()=>{
  const el=document.getElementById('forkmodal');
  document.getElementById('forkbody').innerHTML=
     `<div class="door"><div class="dh">With O₂ <i>— aerobic</i></div>
        <div class="db">Pyruvate enters the <b>mitochondrion</b>: oxidised to
        acetyl-CoA, then the citric acid cycle and electron transport chain. Each
        <b>NADH</b> is worth roughly <b>2.5 ATP</b> there, so glycolysis's 2 NADH
        outweigh its 2 net ATP — <b>~30 ATP</b> per glucose, and NAD⁺ back.</div></div>`
    +`<div class="door"><div class="dh">No O₂ <i>— lactic acid</i></div>
        <div class="db">Pyruvate itself takes the <b>NADH</b>'s electrons and becomes
        <b>lactate</b>. Muscle under load, and most bacteria. <b>No extra ATP</b> —
        the product that matters is <b>NAD⁺</b>.</div></div>`
    +`<div class="door"><div class="dh">No O₂ <i>— ethanol</i></div>
        <div class="db">Yeast strips a <b>CO₂</b> from pyruvate, then reduces the
        acetaldehyde to <b>ethanol</b>. Same purpose: regenerate <b>NAD⁺</b> so
        glycolysis keeps turning.</div></div>`;
  let open=false;
  const show=()=>{ el.hidden=false; open=true; el.querySelector('.mclose').focus(); };
  const hide=()=>{ open=false; el.hidden=true; };
  el.querySelector('.mback').onclick=hide;
  el.querySelector('.mclose').onclick=hide;
  addEventListener('keydown',e=>{ if(open&&e.key==='Escape'){ e.stopPropagation(); hide(); } },true);
  return {show, hide, isOpen:()=>open};
})();

// drawTray runs BEFORE drawAct: the tray's visibility decides which element
// usable() measures, and drawAct's Begin state is the stand-in for it.
function refresh(){ drawLedger(); drawTray(); drawAct(); drawRail();
  drawNote(); drawCouple(); drawCaption(); computeFit(); }

document.getElementById('restart').onclick=restart;
// keyboard: → advances whatever the current step is, ← rewinds
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault();
    if(intro){ beginPathway(); }
    else if(reviewing){ reviewing=false; refresh(); }
    else press(runStep); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); rewind(); }
});

/* =============================================================
 *  MAIN LOOP
 * ============================================================= */
// The per-frame lerp factors below are deliberately still PER FRAME, not per
// second: they are critically-damped follows whose feel was tuned by eye at
// 60 Hz, and every one of them chases a target the same loop recomputes. Moving
// them to dt is a change in how the page FEELS, not a refactor, so it is not
// smuggled in with a port.
L.frame=()=>{
  // lanes ease toward their slots (used by the split, and after any respawn)
  lanes.forEach(l=>{ if(l.g.userData.tx!=null)
    l.g.position.x+=(l.g.userData.tx-l.g.position.x)*0.10;
    // …and toward vertical centring (laneLift). EASED, NOT SET: each species
    // centres at a different height, so a product placed straight onto its lift
    // JUMPS on the swap frame — the frame the name returns, so it reads as the
    // label shoving the molecule down. Starting where the substrate stood, the
    // swap moves nothing and the settle runs under the step's own effects.
    if(l.g.userData.ty!=null)
      l.g.position.y+=(l.g.userData.ty-l.g.position.y)*0.10; });
  if(!userZoom) cam.r+=(fitR-cam.r)*0.05;        // ease to the computed framing
  cam.target.y+=(fitY-cam.target.y)*0.06;        // …and re-centre vertically
  applyCam(); orthoFrustum();
  KIT.faceCamera(camera);        // badges keep their lift as the camera orbits
};
// AFTER the render, never before — Vector3.project() reads a matrix refreshed
// only on render, so everything here would otherwise pin its DOM to the
// PREVIOUS frame's camera. That is `afterFrame`'s whole reason for existing;
// the kit's loop is motion → frame → fx → render → afterFrame.
L.afterFrame=()=>{
  drawPlates();
  drawSpots();
  // anchored to its DOM box, so same schedule as the labels: current camera
  placeCarrierMol();
  placeCarrierGlow();          // after it, so the bond is where the mark goes
};

renderLanes(0); refresh(); applyCam(); resize();
// Re-solve AFTER refresh(). The first computeFit runs inside renderLanes(),
// before the tray has children — it measures a zero-height tray, insets
// nothing, and the page opens one frame too close. refresh() has drawn it.
computeFit();
cam.target.y=fitY; cam.r=fitR; applyCam(); orthoFrustum();  // open already framed
L.start();
// The fit depends on camera.aspect, so it is redone whenever the stage reshapes
// (window resize, or the sidebar stacking under it on a narrow screen) — the
// kit's own ResizeObserver, through the `onResize` hook passed to Lesson.create.
// Label HEIGHT is chrome the fit reserves, and it changes when the real font
// replaces the fallback. So re-solve once the font lands.
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(computeFit);

document.getElementById('savepng').onclick=()=>{
  renderer.render(scene,camera);
  // Species labels are DOM, not in the WebGL buffer, so a straight
  // canvas.toDataURL() exports unnamed molecules. Composite them back from the
  // same projected anchors drawPlates() uses — worth the duplication.
  const w=canvas.width, h=canvas.height, s=w/(canvas.clientWidth||w);   // DPR
  const out=document.createElement('canvas'); out.width=w; out.height=h;
  const x=out.getContext('2d');
  x.drawImage(canvas,0,0);
  x.textAlign='center';
  lanes.forEach(l=>{
    const spec=M[l.key];
    projV.set(l.g.position.x,l.topY+laneOffset(l),0).project(camera);
    const px=(projV.x*0.5+0.5)*w, py=(-projV.y*0.5+0.5)*h;
    x.font=`500 ${14*s}px "Zilla Slab", Georgia, serif`;
    x.fillStyle='#8a8073'; x.fillText(spec.formula, px, py-3*s);
    x.font=`700 ${19*s}px "Zilla Slab", Georgia, serif`;
    // whichever spelling the plate shows — an export that renames the
    // molecules is not a picture of what is on screen
    x.fillStyle='#2b2723'; x.fillText(l.nameEl.textContent, px, py-20*s);
  });
  const a=document.createElement('a'); a.download='glycolysis.png';
  a.href=out.toDataURL('image/png'); a.click();
};
</script>

</body>
