  return (parseFloat(cs.left)||0)+(parseFloat(cs.minWidth)||0)+TRAY_CLEAR_PX;
}
/* WHAT SITS OVER THE CANVAS, in pixels. The whole of this page's contribution
 * to the fit — kit/fit.js does the rest (clamping the reserves against the
 * viewport, the leftover fractions, the half-difference target shift).
 *   top     species labels: HTML, a fixed PIXEL band, not a world-space box the
 *           projection scales — hence reserved here, not in fitFor.
 *   bottom  #bottombar + the caption when it is up.
 *   left    the reagent tray. It sits on one side and is paid on BOTH by the
 *           module, because the lesson belongs on the centre line. */
const RESERVES=()=>({
  top: plateHeightPx(),
  bottom: barReservePx()+capReservePx(),
  left: trayReservePx(),
});
const usable=()=>FIT.usable();
// No horizontal counterpart: heading and button sit on the stage's centre line,
// where the molecule is (see orthoFrustum).
let fitR=24, fitY=0;
function computeFit(){
  // ONE FIT FOR THE PATHWAY, plus a closer one for the opening molecule:
  // glucose alone in a two-lane frame is small, and the intro compares nothing.
  // Pulls back when the first step RUNS — not at Begin, which only shows the
  // tray, so a zoom there moves the molecule for an invisible reason. `busy`
  // starts it on the click that spends the ATP, not when the phosphate lands.
  const close = done===0 && !busy;
  const f = close ? fitFor([['glucose']])
                  : fitFor(STEPS.map(s=>s.species));
  // The PATHWAY'S tallest label line, not this state's: a per-state anchor slid
  // the scene up and down between steps and rode the unfurl frame by frame.
  const top = close ? plateY(['glucose']) : pathwayTopY();
  fitR=f.R; fitY=topAnchoredY(f.R, f.Y, top);
}

// THE CAMERA IS SIZED FOR THE PATHWAY, so no state fills it. The button sits at
// the bottom of the band, so the slack is worth more there than above the name:
// this pulls the state UP, most of the way toward hanging its plate off the top
// of the usable band.
// TOP_PULL is damped, not 1: the camera orbits at an elevation, so a world-Y
// shift doesn't travel a matching number of pixels — solving the anchor exactly
// walked the label off the top edge. Damping keeps the solved offset (restyle
// the plate and it follows) without trusting that conversion.
const TOP_PULL=0.5;
// Highest label line in the pathway. Solved once from the specs: a property of
// the pathway, not of the step you are on.
let _pathTop=null;
const pathwayTopY=()=>_pathTop??(_pathTop=Math.max(...STEPS.map(s=>plateY(s.species))));
const topAnchoredY=(R,centredY,topNow)=>FIT.anchorTop(R,centredY,topNow,TOP_PULL);

// Snap to the state at index i, no animation. Restart, rewind, and the settling
// half of every animated transition.
function renderLanes(i){
  // Settled state: these molecules are named. The class goes with the flag, not
  // the next drawPlates — rAF doesn't run in a hidden tab, so the name would be
  // missing for as long as you weren't looking.
  platesOff=false; platesEl.classList.remove('mute');
  // WHERE THE OUTGOING MOLECULE STOOD, read before teardown. The product starts
  // there and eases to its own height (spawnLane's `ty`); without it every step
  // jumps by the difference between two species' centrings, on the frame the
  // name reappears. Null on first render.
  const fromY = lanes.length ? lanes.map(l=>l.g.position.y) : null;
  clearLanes();
  const keys=speciesAt(i), top=plateY(keys);
  lanes=keys.map((k,j)=>spawnLane(k,j,keys.length,top));
  // one outgoing lane can feed two incoming ones (the split), so clamp the index
  if(fromY) lanes.forEach((l,j)=>{ l.g.position.y=fromY[Math.min(j,fromY.length-1)]; });
  computeFit();
}

/* ONE LANE'S MOLECULE, replaced in place. renderLanes rebuilds from a state
 * index, which a per-lane step has none of: half-way through step 7 one lane is
 * 3-PGA and the other still 1,3-BPG. The shared plate line is re-solved over
 * the MIXED contents and handed to both, else the two names sit at different
 * heights while the step is half done.
 */
function swapLane(j,key){
  const old=lanes[j], n=lanes.length;
  const keys=lanes.map((l,i)=>i===j?key:l.key);
  const top=plateY(keys);
  root.remove(old.g); old.plate.remove();
  const l=spawnLane(key,j,n,top);
  l.g.position.y=old.g.position.y;   // carry the height; the loop eases the rest
  lanes[j]=l;
  lanes.forEach(o=>{ o.topY=top; });
  computeFit();
}

const anchorWorld=(l,which)=>{
  const idx=M[l.key].gly[which];
  return idx==null? l.g.getWorldPosition(new THREE.Vector3())
                  : l.g.userData.atomWorld(idx);
};

/* ---- the charge badge ------------------------------------------------
 * AN EVENT, NOT A LABEL. Every molecule from step 1 on is an anion, so badges
 * that stayed would be up the whole lesson — two lanes of them after the split.
 * (Cf. popGlow: an always-on mark only says "something is true here", which the
 * plate and ledger say better.) So it appears on the beat the charge is
 * ACQUIRED and goes — molecule-builder's mark of an ion FORMING.
 *
 * Text is passed, not derived: it is the GROUP's charge, not the molecule's — a
 * phosphate monoester is 2− on a 2− sugar and a 4− one alike. The molecule's own
 * number is `spec.charge`, checked against the formula (check-molecules.js).
 */
const BADGE_HOLD=1400, BADGE_FADE=500;
// BIGGER THAN THE BUILDER DRAWS IT — a deviation worth naming. atomkit's
// default 0.62 world units reads fine where the frame holds three atoms; this
// frame holds a whole sugar, so it lands 11 px against a 34 px phosphorus: the
// circle visible, the sign inside not. 1.9 ≈ two-thirds of its atom.
const BADGE_SCALE=1.9;
const hexOf=el=>'#'+new THREE.Color(PAL.atoms[el]).getHexString();
function badge(laneIdx, atomIdx, text){
  const l=lanes[laneIdx]; if(!l) return;
  const spec=M[l.key]; if(!spec.atoms[atomIdx]) return;
  // FROM THE MESH, not the spec: the molecule is already built, so `view` and
  // the rest of scene.js are already in its position (see specLocal).
  const m=l.g.userData.atomMeshes[atomIdx]; if(!m) return;
  // A WRAPPER AT THE ATOM: atomkit parks the badge off its atom's shoulder and
  // rewrites that offset every frame (faceCamera), so its position isn't ours
  // to set. Parent it where the atom stands.
  const at=new THREE.Group();
  at.position.copy(m.position);
  const b=KIT.charge(text, hexOf(spec.atoms[atomIdx].el), spec.atoms[atomIdx].el,
                     BADGE_SCALE);
  at.add(b); l.g.add(at);
  // The FADE is pixels (render loop); the REMOVAL is a commit, never the fade's
  // last frame — a hidden tab runs no rAF, so a badge that left only while you
  // watched would still be there when you came back.
  MO.seq([{at:BADGE_HOLD/1000, dur:BADGE_FADE/1000, ease:'linear',
           onUpdate:t=>{ b.material.opacity=1-t; }},
          {at:(BADGE_HOLD+BADGE_FADE+40)/1000,
           call:()=>{ l.g.remove(at); KIT.forget(b); }}],{tag:RUN});
}

/* ---- page-local effects (cosmetic only, like everything in fx.js) ---- */
// TIMERS, NOT FRAMES, ADVANCE THE LESSON. rAF stops in a backgrounded tab, so
// the wall clock owns state changes and rAF only pixels — finishing a
// transition inside a rAF callback would leave `busy` stuck true, the tray dark
// and the lesson unrecoverable without a reload. Worst case: a hidden tab skips
// the animation and you return to the finished step.
//
// That rule is now kit/motion.js's, and this is the one line over it: a `call`
// beat is a COMMIT — scheduled on both clocks, fired once by whichever wins.
// Milliseconds in, because every beat constant on this page is in ms.
const RUN='run';                                  // the tag a whole step rides
const later=(fn,ms)=>MO.after((ms||0)/1000, fn, RUN);
// MESHES IN THE AIR are the other half of a cancel. A flying phosphoryl group
// is removed by its own beat; cancelling that beat used to strand it in the
// scene, because a cancel deliberately does not run what it cancels. So strays
// are registered and swept together.
const strays=new Set();
const stray=g=>{ strays.add(g); root.add(g); return g; };
const unstray=g=>{ if(strays.delete(g)) root.remove(g); };
// Chips in the air ride those beats, so they go with them — a restart
// mid-flight must not leave one parked over the page.
const cancelTimers=()=>{ MO.cancel(RUN);
  strays.forEach(g=>root.remove(g)); strays.clear();
  flyLayer.replaceChildren(); };

const FLY=620, SPLIT=840;
// The ring straightening out. Slower than every other beat on purpose: a whole
// molecule changing shape, not one group arriving — too fast reads as "the
// picture changed".
const UNFURL=1150;
// NO popGlow ON THIS PAGE. The product used to flash as it landed; even at
// quarter strength it lit every atom on the frames the review beat exists for.
// The rings already mark WHERE the chemistry happened — bond, site, departing
// water; a whole molecule glowing only says "something happened", which the
// caption, ledger and rail say. Same choice molecule-builder makes.
const OFFSCREEN=8.5;    // where reagents come from / products go to, in world Y

/* ---- the two colours this page adds to fx.js's defaults ----
 * Orange is phosphate traffic, green the NAD⁺/NADH carrier (#rxmsg .p/.n and
 * the coupling figure). These two name events that are NEITHER: a colour
 * reading as "phosphate" on a beat where none moved is a false claim.
 */
// THE DEPARTING PROTON, steps 1 and 3. Fires on the phosphate flight's beat,
// and fx.js's default gold sits next to phosphate orange — two warm glows on
// one beat read as one event twice. Cool steel is the palette's hydrogen,
// brightened to carry as an additive glow on cream.
const H_LEAVE=0x8fb6d8;
// …and long enough to follow. The default hop is half a second: a TRANSFER
// between atoms a bond-length apart. This crosses the frame, so it outlasts the
// phosphate's flight and is still drifting when the product lands.
const H_LEAVE_MS=3000;
// IT LEAVES ACROSS THE SCREEN, NOT UP IT. World Y is partly INTO the shot at
// this phi, so a proton taking it recedes and shrinks — the reading the size
// profile exists to avoid (fx.js `away`). Screen-right is the camera's X axis:
// same on screen at every orbit angle, perpendicular to depth.
// Distance is the frustum's full width, so the drift clears the frame from
// anywhere. Read off the camera, never typed: the zoom eases through the first
// second, so a fixed length clears at one moment and parks at another.
function screenRight(dist){
  camera.updateMatrixWorld();
  return new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0)
    .normalize().multiplyScalar(dist);
}
// THE CLEAVAGE at step 4. Aldolase cuts a C–C bond; no phosphate moves, so the
// ring must not be phosphate-orange. Violet is the repo's colour for a bond
// coming apart (water-lab's NaCl dissociation — SCIENCE.md §5).
const CLEAVE=0x9a3fe0;

// WHAT FLIES IS A PHOSPHORYL GROUP, not a token — ATP's OWN γ atoms (Pγ + its
// three terminal O, recentred on P), so the thing crossing the stage is the
// four atoms the drawing lost and the sugar gains, same scale and colours. (A
// glowing sphere said "energy moved" when the claim is "this group moved". A
// kinase transfers PO₃⁻; the bridging O stays — `gamma` in mol-glycolysis.js.)
//
// BUILT IN THE GEOMETRY OF THE END IT LANDS ON: the flight ends on the frame
// `renderLanes` swaps substrate for product, so any difference from the
// product's own phosphate — P–O splay, tumble, scale pulse — is a visible jolt.
//
// `terminalO` is derived, never listed: the O's on a P that hang off it and
// nothing else. A BRIDGING O has a second heavy neighbour (C6 on a sugar, Pβ on
// ATP) and stays behind. "Not bonded to a carbon" is not enough; that keeps
// ATP's α–β–γ bridge and flies four oxygens.
// Both are kit/molgraph.js's, under this page's names — the distinction is
// chemistry, not layout, and kit/check-kit.js asserts it on this very step (the
// bridging O stays behind; cutting P–O(bridge) detaches exactly what flies).
const nbOf=(spec,i)=>MolGraph.neighbors(spec,i);
const terminalO=(spec,p)=>MolGraph.terminal(spec,p,'O');
// …and its complement: the O carrying the group, where the bond forms or
// breaks. MARK THE JUNCTION, not the phosphorus — a ring on P sits a bond-
// length off what changed, and P is the biggest sphere here, so it reads as
// decorating the atom rather than pointing at the event.
const bridgeO=(spec,p)=>MolGraph.bridging(spec,p,'O')[0];
// THE PROTON THE PHOSPHATE DISPLACES. Glucose C₆O₆H₁₂ → G6P C₆O₉H₁₁P: C6's
// oxygen keeps its place and becomes the bridge, its hydroxyl H leaves — that H
// used to just be absent on the frame after the swap.
// Derived by SITE, never by index: product's bridging O → the substrate's
// oxygen at the same coordinates → its hydrogen. Both specs come off the same
// Skel scaffold, so shared atoms share coordinates exactly; if that stops
// holding this returns null and the step loses a beat rather than hopping the
// wrong atom.
function leavingH(sub,pro,p){
  const bo=bridgeO(pro,p); if(bo==null) return null;
  const q=pro.atoms[bo].pos;
  const hit=sub.atoms.map((a,i)=>[i,a]).filter(([,a])=>a.el==='O' &&
    Math.hypot(a.pos[0]-q[0], a.pos[1]-q[1], a.pos[2]-q[2])<0.35);
  if(hit.length!==1) return null;
  const hs=nbOf(sub,hit[0][0]).filter(i=>sub.atoms[i].el==='H');
  return hs.length===1 ? hs[0] : null;
}
function phosphorylGroup(spec,p){
  const c=spec.atoms[p].pos;
  const at=i=>V(spec.atoms[i].pos[0]-c[0], spec.atoms[i].pos[1]-c[1],
                spec.atoms[i].pos[2]-c[2]);
  const g=new THREE.Group();
  g.add(Stage.atom(PAL.atoms.P, PAL.radii.P, V(0,0,0), 'P'));
  terminalO(spec,p).forEach(i=>{ const o=at(i);
    g.add(Stage.bond(V(0,0,0), o, PAL.bonds.covalent));
    g.add(Stage.atom(PAL.atoms.O, PAL.radii.O, o, 'O'));
  });
  return g;
}
/* THE SUGAR LOSES IT AS IT LEAVES, as ATP does on a spend (see carrierGone).
 * The lane doesn't become the product until the flight ends, so the phosphate
 * used to sit there the whole trip while a copy of itself sailed off. The set
 * hidden is the set that flies — P + `terminalO`, what phosphorylGroup builds
 * from — so the two can't describe different groups. The bridging O stays: on
 * 1,3-BPG it is the carbonyl O that becomes 3-PGA's carboxylate.
 * Hiding, not removing: rewind mid-flight is impossible (`busy`), but a deleted
 * mesh couldn't come back if that changed.
 */
function shedAtoms(l,idx){
  const u=l.g.userData, set=new Set(idx);
  set.forEach(i=>{ const m=u.atomMeshes[i]; if(m) m.visible=false; });
  u.bondMeshes.forEach(bm=>{
    if(bm.userData.pair.some(q=>set.has(q))) bm.visible=false; });

const shedPhosphoryl=(l,p)=>shedAtoms(l,[p, ...terminalO(M[l.key],p)]);

// Decorative; cleanup on a timer so a hidden tab can't strand a mesh.
// NO TUMBLE, NO SNAP: fixed orientation and size, it simply arrives. `spec`/`p`

// THE CYTOSOL IS SLOWER THAN A HANDOFF. A phosphate off ATP is PASSED — one

const DRIFT=Math.round(FLY*1.6);
/* WHERE THE CYTOSOL STARTS: a SCREEN edge, not a world height. `OFFSCREEN`'s

// THE PHOSPHATE COMES OFF ATP, and you should see that it does. It used to drop
// from the top of the frame — true of free Pi, not of a kinase step. So the
// flight starts (or, at steps 7 and 10, ends) on that tile.
// The tile is DOM and the flight is in the scene, so its screen position is
// unprojected AT THE DEPTH OF THE OTHER END: the camera orbits, so there is no
// fixed plane, and matching depth keeps the phosphate one size at both ends.
function tileWorld(key,ref,j){
  const p=carrierPoint(key,j);
  if(!p) return null;
  const c=canvas.getBoundingClientRect();
  if(!c.width || !c.height) return null;
  camera.updateMatrixWorld();

    (p.x-c.left)/c.width*2-1, -((p.y-c.top)/c.height*2-1), z).unproject(camera);

// ATP/ADP are drawn, not carded, so the flight anchors on the γ phosphate

/* ---------- THE UNFURL: the ring straightening out, atom by atom ----------
 * Step 2 used to CUT from ring to chain, which reads as "the picture changed"
 * rather than "the molecule moved". It is a CONFORMATIONAL CHANGE: with C1–O5
 * gone nothing holds the hexagon, and the carbons rotate about C–C single bonds
 * into the extended chain. Every frame is a real conformation, reached by
 * turning backbone dihedrals to anti (180°), one bond at a time from C1 out.
 *
 * Rotating about bond i moves everything downstream RIGIDLY, leaving every
 * other dihedral untouched — so each target angle is measured once at the start
 * and scaled by t, and each frame replays from the starting coordinates instead
 * of accumulating error over hundreds of small rotations.
 *
 * Conformation changes, not connectivity: the broken bond is broken before
 * frame one, the proton hop is FX, and f6p's new atoms arrive with the swap.
 */
// The IUPAC torsion: ±π is ANTI (extended zigzag), 0 eclipsed. The plane-normal
// form returns these the other way round, and with targets at ±π against that
// convention the chain folds ECLIPSED while every dihedral reads exactly 180° —
// a bug that checks out numerically and is nonsense. f6p's backbone reads ±180
// here, which asserts this is the convention the specs are drawn in.
//
// DELIBERATELY NOT MolGraph.torsion, which is the plane-normal form and returns
// the OTHER sign. That one is right for stereochemistry (a mirrored spec must
// flip it, which kit/check-kit.js asserts); this one is right for driving a chain to
// anti. Swapping them silently folds the sugar eclipsed while every printed
// dihedral still reads 180°.
function dihedralOf(p0,p1,p2,p3){
  const b1=p2.clone().sub(p1).normalize();
  const b0=p0.clone().sub(p1), b2=p3.clone().sub(p2);
  const v=b0.clone().addScaledVector(b1,-b0.dot(b1));   // components across b1
  const w=b2.clone().addScaledVector(b1,-b2.dot(b1));
  return Math.atan2(b1.clone().cross(v).dot(w), v.dot(w));
}
// scratch, reused every frame — this runs per atom per turn per frame
const Q=new THREE.Quaternion(), AX=new THREE.Vector3(), PV=new THREE.Vector3();
// What to turn and by how much. Measured off the built molecule, so the thing
// on screen unfurls, not a second copy.
function unfurlPlan(l){
  const spec=M[l.key], gly=spec.gly, cN=gly.cN, br=gly.open;
  const u=l.g.userData;
  // Everything past a bond, through the GRAPH not index ranges — build order is
  // not chain order. Two cuts: the bond being turned, and `gly.open`, the ring
  // bond this step has already broken.
  const beyond=(from,thru)=>
    MolGraph.component(spec, thru, [[from,thru], br]).filter(i=>i!==from);
  const base=u.atomMeshes.map(m=>m?m.position.clone():null);
  const turns=[];
  // A dihedral needs four atoms; the FIRST bond has no backbone carbon to
  // measure from, so its reference is the anomeric oxygen. Without it C1 keeps
  // its ring pucker and the chain arrives bent at the end the reaction is about.
  for(let i=0;i<cN.length-2;i++){
    const prev = i>0 ? cN[i-1] : (gly.anomeric&&gly.anomeric.o);
    const a=cN[i], b=cN[i+1], next=cN[i+2];
    if(prev==null || !base[prev]) continue;
    const d0=dihedralOf(base[prev],base[a],base[b],base[next]);
    // to anti, the short way round — ±π are the same conformation
    turns.push({a,b,delta:(d0>=0?Math.PI:-Math.PI)-d0, set:beyond(a,b)});
  }
  const plan={base,turns};
  // WHERE IT COMES TO REST. Unfurled chain and the f6p it becomes are the same
  // shape at different angles, so the molecule turns as it opens onto the next
  // spec's axis — the swap then changes only what the reaction changed.
  // A WHOLE FRAME, not just the axis: matching C1→C6 alone leaves the chain free
  // to ROLL, landing the middle carbons on the wrong side (ends agree, C2/C5 2.5
  // units out). Second axis is C3's offset, so the zigzag plane gets matched.
  const pos1=unfurlPos(plan,1);
  const f=M.f6p, fc=f.gly.cN;
  const fp=i=>new THREE.Vector3().fromArray(f.atoms[fc[i]].pos);
  const frame=(p0,pN,pMid)=>{
    const ax=pN.clone().sub(p0).normalize();
    const v=pMid.clone().sub(p0);
    v.addScaledVector(ax,-v.dot(ax));
    if(v.lengthSq()<1e-6) return null;              // a straight line has no plane
    v.normalize();
    return new THREE.Matrix4().makeBasis(ax, v, ax.clone().cross(v));
  };
  const A=frame(pos1[cN[0]], pos1[cN[cN.length-1]], pos1[cN[2]]);
  const B=frame(fp(0), fp(fc.length-1), fp(2));
  plan.qEnd = A&&B
    ? new THREE.Quaternion().setFromRotationMatrix(B.multiply(A.invert()))
    : new THREE.Quaternion();
  // THE LABEL CLIMBS WITH IT. A chain is taller than its ring, so a name pinned
  // at the ring's height ends up written across the molecule. It rides to the
  // same anchor the swap lands on.
  plan.topY0=l.topY;
  plan.topY1=plateY(['f6p']);
  return plan;
}
// Conformation at t, from the starting coordinates every time — each turn
// leaves the others' dihedrals alone, so this cannot drift.
function unfurlPos(plan,t){
  const pos=plan.base.map(p=>p?p.clone():null);
  plan.turns.forEach(tn=>{
    AX.subVectors(pos[tn.b],pos[tn.a]).normalize();
    Q.setFromAxisAngle(AX, tn.delta*t);
    PV.copy(pos[tn.a]);
    tn.set.forEach(i=>{ const p=pos[i]; if(p) p.sub(PV).applyQuaternion(Q).add(PV); });
  });

}
function unfurlApply(l,plan,t){
  const u=l.g.userData;
  const pos=unfurlPos(plan,t);
  // KEEP IT CENTRED ON ITS OWN BOX, as Stage.buildMolecule does. Unfurling about
  // fixed coordinates walks the molecule out of frame and snaps back on the
  // swap. Same rule as centerOf: middle of the extent, not mean of the atoms, so
  // one long arm cannot drag it off centre.
  const lo=[Infinity,Infinity,Infinity], hi=[-Infinity,-Infinity,-Infinity];
  pos.forEach(p=>{ if(!p) return;
    for(let k=0;k<3;k++){ const v=p.getComponent(k);
      lo[k]=Math.min(lo[k],v); hi[k]=Math.max(hi[k],v); } });
  const mid=new THREE.Vector3(...lo.map((v,k)=>(v+hi[k])/2));
  pos.forEach(p=>{ if(p) p.sub(mid); });

  if(plan.qEnd) l.g.quaternion.identity().slerp(plan.qEnd,t);
  if(plan.topY1!=null) l.topY=plan.topY0+(plan.topY1-plan.topY0)*t;
  pos.forEach((p,i)=>{ const m=u.atomMeshes[i]; if(m&&p) m.position.copy(p); });
  u.bondMeshes.forEach(bm=>{
    const [i,j]=bm.userData.pair;
    if(pos[i]&&pos[j]) Stage.placeBond(bm,pos[i],pos[j]);
  });
}

// Where an atom of a not-yet-built species WILL be, so a reagent can fly there
// before the molecule carrying it exists.
function siteWorld(key,which,x){
  return specWorld(M[key], M[key].gly[which], x, laneBase(key));
}
// …AND `view` HAS TO BE APPLIED, which is the whole reason this is a function.
// scene.js bakes `spec.view` into the atom MESHES, not the group rotation, so a
// spec's raw `pos` is NOT where its atom ends up — eight world units apart for
// glucose-6-phosphate. Rotate the same way, same Euler order. The lane offset
// goes on AFTER (it is the group's position, rotation is inside the group) and
// on BOTH axes: laneShift on x, laneLift on y — dropping the y half aims at the
// spec's height instead of the drawn height, the same miss again.
const specLocal=(spec,idx)=>{ const a=spec.atoms[idx];
  const v=V(a.pos[0], a.pos[1], a.pos[2]);
  return spec.view ? v.applyEuler(new THREE.Euler(
    spec.view[0]||0, spec.view[1]||0, spec.view[2]||0, 'ZYX')) : v; };
const specWorld=(spec,idx,x,y=0)=>{ const v=specLocal(spec,idx); v.x+=x; v.y+=y;
  return root.localToWorld(v); };
// WHERE THE EFFECT GOES: middle of the P–O bond that forms or breaks, not the
// phosphorus (see `bridgeO`). Falls back to the P if a spec has no bridge — a
// free phosphate in the pool, not a junction yet.
function junctionWorld(spec,p,x,y=0){
  const bo=bridgeO(spec,p);
  const pp=specWorld(spec,p,x,y);
  return bo==null ? pp : pp.add(specWorld(spec,bo,x,y)).multiplyScalar(0.5);
}

/* =============================================================
 *  RUNNING A STEP
 * ============================================================= */
/* ONE LANE OF A PER-LANE STEP — see PER-LANE STEPS. The `out` beat for that
 * lane only, then that lane alone becomes the product. The step lands when the
 * last lane does, and only then does `done` move — so pips, rail and caption
 * count whole steps while ledger, pools and carriers show the half.
 */
function runLane(j){
  if(busy || intro || done>=nSteps) return;
  const st=stepAt(done);
  if(!isPerLane(st) || laneDone.has(j) || !lanes[j]) return;
  const to=done+1, keys=speciesAt(to), n=lanes.length;
  busy=true;
  platesOff=true; platesEl.classList.add('mute');
  const l=lanes[j], spec=M[l.key];
  // Instance j belongs to lane j throughout: what leaves this molecule arrives
  // at the carrier standing opposite it.
  if(st.fx==='ox'){
    // The lesson is two things in opposite directions: the hydride leaves onto
    // NAD⁺, a free phosphate arrives to fill the gap it left.
    const hIdx=spec.gly.aldehydeH;
    const hPos=hIdx!=null ? l.g.userData.atomWorld(hIdx) : anchorWorld(l,'p3');
    FXi.protonHop(hPos, tileWorld(carrierKey(st.couple.cin),hPos,j)
                        || V(l.g.position.x, OFFSCREEN, 0));
    // IN FROM ABOVE, AND SLOWLY. Nothing hands this phosphate over — it is
    // dissolved in the cytosol — so it drifts down rather than being fired up.
    // The hydride goes LEFT to the drawn NAD⁺, so the two still read apart.
    flyPhosphate(aboveFrame(hPos), hPos, null, null, DRIFT);
    later(()=>FXi.spawnRing(hPos,PAL.atoms.P), DRIFT);
    if(hIdx!=null) shedAtoms(l,[hIdx]);       // it left; it should look left
  } else {
    const src=anchorWorld(l,st.anchor);
    // on the bond that breaks, not on the P that leaves along it
    FXi.spawnRing(junctionWorld(spec, spec.gly[st.anchor],
                                l.g.position.x, l.g.position.y), PAL.atoms.P);
    // …to THIS lane's ADP: the phosphate just released charges the molecule
    // beside it.
    flyPhosphate(src, tileWorld(carrierKey(st.couple.cin),src,j)
                      || V(l.g.position.x,-OFFSCREEN,0),
                 spec, spec.gly[st.anchor]);
    shedPhosphoryl(l, spec.gly[st.anchor]);   // it left; it should look left
  }
  later(()=>{
    laneDone.add(j);
    swapLane(j, keys[j]);
    platesOff=false; platesEl.classList.remove('mute');
    // THE LAST LANE LANDS THE STEP. `laneDone` is cleared here and nowhere in
    // between, so a step that is half run stays half run across a redraw.
    if(laneDone.size>=n){ done=to; reviewing=true; laneDone.clear(); }
    else landed=true;          // a lane banked one: let the ledger fly its chip
    busy=false; refresh();
    // only THIS ADP became an ATP, so only it pops
    popCarrier(j);
    // the lane becomes the product when the last thing in the air lands — on
    // the oxidation that is the drifting phosphate, not FLY
  }, st.fx==='ox' ? DRIFT : FLY);
}

function runStep(){
  if(busy || intro || done>=nSteps) return;
  const st=stepAt(done), to=done+1;
  const keys=speciesAt(to), n=keys.length;
  // THE PHOSPHATE LEAVES ON THE CLICK — before the refresh below, so the tray
  // redraws as ADP on the frame the flight starts. See carrierGone.
  if(st.couple && st.couple.up) carrierGone.add(0);
  busy=true; refresh();                       // dim the tray for the duration
  // A NAME BELONGS TO A SETTLED MOLECULE. Hidden for the whole of any animation:
  // mid-beat the thing on stage is neither substrate nor product, so the label
  // would name one of the two it is between. Cleared by `renderLanes` (and by
  // the split's own completion, which does not call it).
  platesOff=true; platesEl.classList.add('mute');
  let dur=FLY;

  if(st.fx==='in'){
    // a phosphate flies in from the cytosol onto the site it is ABOUT to occupy
    keys.forEach((key,j)=>{
      const x=laneOrigin(key,j,n), tp=siteWorld(key,st.anchor,x);
      // off the ATP giving it up; top of frame if the tray is not on screen
      const from=tileWorld(carrierKey(st.couple.cin),tp) || V(x,OFFSCREEN,0);
      const pIdx=M[key].gly[st.anchor];
      // built as the product's OWN phosphate, so the frame it lands on is the
      // frame the product replaces it and nothing moves
      flyPhosphate(from, tp, M[key], pIdx);
      // the ring marks the BOND that forms, not the atom that arrived
      later(()=>FXi.spawnRing(junctionWorld(M[key],pIdx,x,laneBase(key)), PAL.atoms.P), FLY);
      // AND THE HYDROXYL PROTON LEAVES FIRST. The oxygen the phosphate lands on
      // is the sugar's own and is holding an H. Fired at the START of the
      // flight in `away` mode: snaps off the bond immediately, then drifts out
      // fading. Slower than the phosphate on purpose — a departure that keeps
      // pace with the arrival reads as a swap, and here something is just lost.
      // The H is on the SUBSTRATE, so its height comes from the substrate's
      // own lift, not the product's.
      const subKey=speciesAt(done)[j], sub=M[subKey], hIdx=leavingH(sub,M[key],pIdx);
      if(hIdx!=null){ const h0=specWorld(sub,hIdx,x,laneBase(subKey));
        // …carrying its charge: the sugar went negative because THIS left
        // positive.
        FXi.protonHop(h0, h0.clone().add(screenRight(camera.right-camera.left)),
                      null, {color:H_LEAVE, dur:H_LEAVE_MS/1000, away:true,
                             carry:KIT.charge('+', '#'+H_LEAVE.toString(16), 'H',
                                              BADGE_SCALE)}); }
      // THE CHARGE THE SUGAR JUST ACQUIRED — step 1's caption rests on it ("the
      // negative charge locks the sugar in the cell"), and nothing on screen
      // showed it. On the phosphate, because that carries it: a phosphate
      // monoester is 2− at cytosolic pH whichever sugar it is on.
      // AFTER the swap, not on it: `lanes` still holds the substrate until
      // renderLanes runs at FLY, and the substrate has no phosphate to sit on.
      later(()=>badge(j, pIdx, '2−'), FLY+40);
    });

  } else if(st.fx==='out'){
    // each lane's phosphate flies OUT toward the tray, where an ADP catches it
    lanes.forEach(l=>{
      const src=anchorWorld(l,st.anchor);
      // on the bond that breaks, not on the P that leaves along it
      FXi.spawnRing(junctionWorld(M[l.key], M[l.key].gly[st.anchor], l.g.position.x, l.g.position.y),
                    PAL.atoms.P);
      // ...onto the ADP that catches it — step 1's trip run backwards, which is
      // the point of a coupled pair. The registered end is the TAKEOFF here: it
      // is a copy of the phosphate the sugar is losing, so it leaves from
      // exactly where that one stands.
      flyPhosphate(src, tileWorld(carrierKey(st.couple.cin),src,lanes.indexOf(l))
                        || V(l.g.position.x,-OFFSCREEN,0),
