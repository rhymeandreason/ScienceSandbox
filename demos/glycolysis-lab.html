<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molecule Sandbox — Glycolysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="sandbox.css">
<style>
  :root{ --phos:#e07b1f; --nad:#2f7d5c; --atp:#c8452e; --carbon:#3a3a3a; }

  /* This page's side panel is the tallest in the sandbox — a sixteen-row rail
     plus prose. A grid row of `1fr` still floors at its content's auto height,
     so the row grew past 100vh and #app's overflow:hidden ate the bottom of
     BOTH columns. minmax(0,…) plus min-height:0 lets the row actually shrink;
     the card then takes the overflow and scrolls.

     THE SIDEBAR HAS NO FOOTER. Its two buttons moved onto the stage: Restart to
     the top-right corner, and Begin into the tray's slot, where the thing you
     are meant to click already lives. The old Next button was disabled in every
     state but one — every real step is driven from the stage, so a footer
     button could only ever mirror it — and a permanently greyed control teaches
     students to ignore that corner of the screen. */
  #app{grid-template-rows:minmax(0,1fr)}
  #stage,#side{min-height:0}
  #side{overflow:hidden}
  #card{min-height:0}

  /* ---------- species labels: DOM over the canvas, one per lane ----------
     Positioned every frame from the projected anchor (drawPlates), so they
     track their molecule on orbit the way the old sprites did. `left`/`top`
     are the anchor in canvas pixels; the translate pulls the label up and
     centres it on that point, so the anchor is the label's bottom-middle. */
  #plates{position:absolute;inset:0;z-index:5;pointer-events:none}
  .plate{position:absolute;transform:translate(-50%,-100%);
    text-align:center;white-space:nowrap;line-height:1.15}
  .plate .pn{font-family:var(--font-slab);font-weight:700;font-size:19px;
    color:var(--ink);letter-spacing:.2px}
  .plate .pf{font-family:var(--font-slab);font-weight:500;font-size:14px;color:var(--muted)}
  @media (max-width:920px){
    .plate .pn{font-size:16px}.plate .pf{font-size:12.5px}
  }

  /* ---------- reaction toast, top-center of the stage ---------- */
  #rxmsg{position:absolute;top:76px;left:50%;transform:translateX(-50%);
    z-index:12;pointer-events:none;text-align:center;max-width:72%;opacity:0;
    font-family:var(--font-hand);font-size:21px;color:var(--muted);letter-spacing:.2px;
    background:rgba(255,255,255,.55);padding:8px 16px;border-radius:var(--radius)}
  #rxmsg b{font-weight:600;color:var(--ink)}
  #rxmsg .p{color:var(--phos)}#rxmsg .n{color:var(--nad)}
  #rxmsg.show{animation:rxFade 4.6s ease-out forwards}
  @keyframes rxFade{
    0%{opacity:0;transform:translateX(-50%) translateY(-6px)}
    7%{opacity:1;transform:translateX(-50%) translateY(0)}
    84%{opacity:1;transform:translateX(-50%) translateY(0)}
    100%{opacity:0;transform:translateX(-50%) translateY(-4px)}}

  /* ---------- the ledger: the whole point of the page ---------- */
  /* Always visible, never resets. Students watch ATP dip below its start value
     and climb back past it — that dip is the "investment phase" made physical. */
  #ledger{position:absolute;left:26px;top:74px;z-index:6;min-width:186px;
    background:rgba(255,255,255,.72);border:2px solid var(--ink);
    border-radius:8px 12px 9px 11px;padding:12px 14px 13px;
    box-shadow:0 4px 14px -6px rgba(0,0,0,.35);backdrop-filter:blur(2px)}
  #ledger .lhead{font-family:var(--font-slab);font-weight:700;font-size:10px;letter-spacing:1.3px;
    text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  #ledger .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    font-family:var(--font-slab);font-size:14px;color:#4a443c;padding:2.5px 0}
  #ledger .row .v{font-weight:700;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
  #ledger .row.net{border-top:1.5px dashed var(--hair);margin-top:7px;padding-top:7px}
  #ledger .row.net .v{font-size:20px;color:var(--atp)}
  #ledger .row.carb{border-top:1.5px dashed var(--hair);margin-top:7px;padding-top:7px}
  #ledger .row.carb .v{font-size:15px;color:var(--carbon);letter-spacing:.5px}
  #ledger .bump{animation:bump .7s ease}
  @keyframes bump{0%{color:var(--phos);transform:scale(1.32)}100%{transform:scale(1)}}

  /* ---------- reagent tray, bottom-center: the cell's pools ----------
     THE TRAY IS A LEDGER, NOT A MENU. Every pool stays on screen all the way
     through, because the counts are themselves the lesson and each one only
     reads as one while it is NOT the active reagent: ATP goes 4 → 2 → 6, and
     the dip below its starting value is the net +2 made physical; NAD⁺ runs to
     exactly 0 at step 6, which is the entire setup for the fermentation fork;
     Pi goes 2 → 0, which is the visible proof that step 6's phosphate came from
     the cytosol and not from an ATP.

     So only ONE of them is ever a button, and the styling now says so. An
     inactive pool is a plain readout with no card chrome at all; the card,
     border, pulse and lift belong to the live one alone. They used to all be
     bordered cards, which promised five actions and delivered one. */
  #tray{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:7;
    display:flex;flex-direction:column;align-items:center;gap:6px}
  .tstrip{display:flex;gap:4px;align-items:flex-end}
  /* Named so the group cannot be misread as a toolbar. Sits BELOW the strip:
     the live card's "Spend 1 ATP ↓" prompt occupies the space above it. */
  .tcap{font-family:var(--font-slab);font-weight:700;font-size:9.5px;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--muted);opacity:.8}

  .reag{position:relative;min-width:74px;padding:9px 12px 8px;cursor:default;
    background:none;border:2.5px solid transparent;border-radius:9px;
    text-align:center;user-select:none;transition:transform .15s,border-color .15s,background .15s}
  .reag .rname{font-family:var(--font-slab);font-weight:700;font-size:14px;color:var(--ink);line-height:1.1}
  .reag .rname sub,.reag .rname sup{font-size:.68em}
  .reag .rcount{font-family:var(--font-slab);font-weight:700;font-size:22px;line-height:1.15;
    color:var(--ink);font-variant-numeric:tabular-nums}
  .reag .rsub{font-family:var(--font-sans);font-size:9.5px;letter-spacing:.6px;
    text-transform:uppercase;color:var(--muted)}
  /* A pool at zero is MUTED, never hidden. It used to fade to --hair, which
     erased the two numbers the lesson ends on: NAD⁺ 0 is why fermentation
     exists, and Pi 0 is where step 6's phosphate went. */
  .reag.empty .rname,.reag.empty .rcount{color:var(--muted);opacity:.75}

  /* the reagent this step needs: the only card, and the only button */
  .reag.live{cursor:pointer;border-color:var(--ink);background:rgba(255,255,255,.95);
    box-shadow:0 0 0 4px rgba(224,123,31,.18);animation:reagPulse 1.9s ease-in-out infinite}
  .reag.live:hover{transform:translateY(-3px) scale(1.04)}
  @keyframes reagPulse{0%,100%{box-shadow:0 0 0 3px rgba(224,123,31,.14)}
    50%{box-shadow:0 0 0 8px rgba(224,123,31,.05)}}
  .reag .need{position:absolute;top:-13px;left:50%;transform:translateX(-50%);
    font-family:var(--font-hand);font-size:15px;color:var(--phos);white-space:nowrap;display:none}
  .reag.live .need{display:block}

  /* At the intro the tray is hidden, so Begin takes ITS slot rather than the
     action button's — the student's first click lands exactly where every
     later one will. */
  #actbtn.begin{bottom:40px;font-size:17px;padding:13px 30px}

  /* the no-reagent action button (the split), just above the tray */
  #actbtn{position:absolute;left:50%;bottom:126px;transform:translateX(-50%);z-index:8;display:none;
    font-family:var(--font-slab);font-weight:700;font-size:15px;letter-spacing:.3px;
    padding:11px 24px;border-radius:var(--radius);cursor:pointer;
    border:2.5px solid var(--ink);background:var(--ink);color:var(--paper);
    box-shadow:0 4px 14px -5px rgba(0,0,0,.45)}
  #actbtn:hover{background:#000;transform:translateX(-50%) translateY(-2px)}
  #actbtn .hint{display:block;font-family:var(--font-hand);font-weight:500;font-size:14px;
    letter-spacing:0;opacity:.72;margin-top:1px}

  /* ---------- right panel ---------- */
  /* PATHWAY RAIL — the ten steps, blocked into the five stages.
     The DOTS carry the canonical step numbers 1–10, so the rail lines up with
     the numbering every textbook and lecture uses. The stages are block
     HEADINGS over them, not a second numbered sequence competing with it: two
     numberings on one rail meant "3" could mean step 3 or stage 3, and the one
     a student can check against their book is the step. */
  #rail{display:flex;flex-direction:column;gap:0;margin:6px 0 16px}

  /* block heading: stage name + the bookkeeping delta it is responsible for */
  /* Sixteen rows is the whole pathway on screen at once, which is the point —
     but it is also the tallest this panel gets, and the card underneath is what
     pays for it. Padding here is deliberately tight for that reason. */
  .rblock{display:flex;align-items:baseline;gap:10px;cursor:pointer;
    padding:9px 0 3px;border-top:1px solid rgba(0,0,0,.07)}
  .rblock:first-child{border-top:none}
  .rblock .bt{font-family:var(--font-slab);font-weight:700;font-size:11px;
    letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
  .rblock .bd{margin-left:auto;font-family:var(--font-slab);font-weight:700;
    font-size:11.5px;color:var(--muted);white-space:nowrap}
  .rblock.cur .bt,.rblock.cur .bd{color:var(--phos)}
  .rblock.future{opacity:.5}

  /* one row per step, and the two bookend states either side of the ten */
  .rrow{display:flex;gap:11px;align-items:center;padding:1.5px 0}
  .rrow .rdot{flex:none;width:21px;height:21px;border-radius:50%;
    border:2px solid var(--hair);background:var(--panel);
    font-family:var(--font-slab);font-weight:700;font-size:11.5px;
    display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .rrow.done .rdot{background:var(--ink);border-color:var(--ink);color:var(--panel)}
  .rrow.cur .rdot{border-color:var(--ink);color:var(--ink);border-width:2.5px;
    box-shadow:0 0 0 3px rgba(43,39,35,.1)}
  .rrow .rlab{font-family:var(--font-sans);font-size:14px;color:var(--muted);line-height:1.25}
  .rrow.done .rlab,.rrow.cur .rlab{color:var(--ink)}
  .rrow.cur .rlab{font-weight:600}
  .rrow.done{cursor:pointer}
  .rrow.done:hover .rlab{color:var(--phos)}
  .rrow.future{opacity:.5}
  /* the one-way marker. Only three steps carry it, and that is the lesson. */
  .rrow .rirr{margin-left:auto;flex:none;font-size:14px;color:var(--phos);opacity:.75}
  /* bookends carry no step number, because they are not steps */
  .rrow.bookend{padding:6px 0;border-top:1px solid rgba(0,0,0,.07)}
  .rrow.bookend:first-child{border-top:none}
  .rrow.bookend .rlab{font-weight:600}
  .rrow.bookend .rdelta{margin-left:auto;flex:none;font-family:var(--font-slab);
    font-weight:700;font-size:11.5px;color:var(--muted);white-space:nowrap}

  #card .enz{font-family:var(--font-slab);font-size:13px;color:var(--muted);margin:0 0 12px}
  #card .enz b{color:var(--ink);font-weight:700}
  #card .rxn{font-family:var(--font-slab);font-weight:700;font-size:14.5px;color:var(--phos);
    margin:0 0 14px;line-height:1.45}
  #card .misc{font-size:13.5px;color:var(--muted)}

  /* The note panel under the card. sandbox.css pins a card's footer block to the
     bottom and scrolls only .cardtext, which works for a one-line note — but
     PFK-1's regulation block runs ~400px and squeezed the prose to zero height.
     So this page scrolls #card as ONE column: the note is reading material here,
     not chrome, and it should follow the prose rather than compete with it.
     Safe because this page has no .factwrap lightbulb to spill past the edge. */
  #card{overflow-y:auto}
  #card .cardtext{overflow:visible;flex:none}
  #stepnote{margin-top:18px;padding-top:13px;border-top:1.5px dashed var(--hair)}
  #stepnote .nhead{font-family:var(--font-slab);font-weight:700;font-size:11.5px;
    letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
  #stepnote .nhead.reg{color:var(--phos)}
  #stepnote .nhead.irr{color:var(--atp)}
  #stepnote .nhead.rev{color:var(--nad)}
  #stepnote .nbody{font-size:13px;line-height:1.5;color:#5a5346;margin:0 0 9px}
  #stepnote .nbody:last-child{margin-bottom:0}
  .effrow{display:flex;gap:9px;margin:0 0 10px}
  .eff{flex:1;padding:8px 9px;border-radius:7px;background:rgba(0,0,0,.03)}
  .eff .eh{font-family:var(--font-slab);font-weight:700;font-size:10.5px;letter-spacing:.8px;
    text-transform:uppercase;margin-bottom:5px}
  .eff.on .eh{color:#1f6146}.eff.off .eh{color:#a8371f}
  .eff .e{font-size:12px;line-height:1.35;margin-bottom:5px;color:var(--muted)}
  .eff .e:last-child{margin-bottom:0}
  .eff .e b{display:block;color:var(--ink);font-weight:600}

  /* Restart, top-right of the stage. Mirrors #savepng's chip (bottom-left, from
     sandbox.css) so the two utility controls read as a pair and neither
     competes with the lesson's own button. Quiet by default — it throws work
     away, so it should never be the most inviting thing on screen. */
  #restart{position:absolute;right:26px;top:22px;z-index:9;
    font-family:var(--font-sans);font-weight:600;font-size:13px;letter-spacing:.5px;
    color:var(--muted);background:transparent;border:2px solid var(--hair);
    border-radius:var(--radius);padding:6px 15px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px}
  #restart:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ---------- the ending fork ---------- */
  #fork{position:absolute;left:50%;bottom:126px;transform:translateX(-50%);z-index:8;
    display:none;gap:14px}
  #fork .door{width:184px;padding:12px 14px;background:rgba(255,255,255,.8);
    border:2px solid var(--ink);border-radius:9px 12px 10px 11px;
    box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
  #fork .door .dh{font-family:var(--font-slab);font-weight:700;font-size:14px;color:var(--ink);margin-bottom:4px}
  #fork .door .dh i{color:var(--muted);font-weight:500}
  #fork .door .db{font-family:var(--font-sans);font-size:12.5px;line-height:1.45;color:#5a5346}

  @media (max-width:920px){
    #ledger{top:auto;bottom:96px;left:14px;min-width:0;padding:9px 11px}
    #ledger .row{font-size:12.5px}
    #tray{gap:6px;bottom:14px}.reag{min-width:56px;padding:7px 8px 6px}
    /* Three doors stacked is taller than the stage, so on narrow screens the
       fork scrolls in its own strip rather than growing off the top. */
    #fork{flex-direction:column;bottom:110px;gap:8px;
      max-height:52vh;overflow-y:auto;padding:2px}
    #fork .door{width:250px;flex:none}
    #fork .door .db{font-size:12px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="plates" aria-live="polite"></div>
    <div id="rxmsg" aria-live="polite"></div>
    <div id="brand"><span class="drop"><i class="ph-bold ph-flow-arrow"></i></span><h1>Glycolysis</h1></div>
    <div id="ledger"></div>
    <button id="actbtn"></button>
    <div id="fork"></div>
    <div id="tray"></div>
    <button id="restart"><i class="ph-bold ph-arrow-counter-clockwise"></i> Restart</button>
    <button id="savepng"><i class="ph-bold ph-download-simple"></i> PNG</button>
  </div>
  <div id="side">
    <h1 id="labtitle"></h1>
    <div id="rail"></div>
    <div id="card"><div class="cardtext" id="cardtext"></div>
      <div id="stepnote"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="palette.js"></script>
<script src="molecules.js"></script>
<script src="skel.js"></script>
<script src="mol-glycolysis.js"></script>
<script src="scene.js"></script>
<script src="fx.js"></script>
<script>
"use strict";
/* =============================================================================
 *  GLYCOLYSIS — glucose → 2 pyruvate, and where the ATP/NADH actually come from
 * =============================================================================
 *  PARADIGM: pathway. Not solvation (no water, no H-bond engine, no
 *  electrostatics) and not assembly (nothing is being joined). The mechanic is
 *  a scripted sequence of TRANSFORMATIONS plus a running LEDGER, so this page
 *  shares only scene.js's bootstrap and fx.js's effects — see SCIENCE.md §10.
 *
 *  AUDIENCE: introductory college biology (Bio 101), not AP. That is a content
 *  decision, not a styling one, and it is why this page runs all TEN canonical
 *  steps rather than the five-event summary it used to. An intro college course
 *  holds students to the enzymes, to PFK-1 as the regulated committed step, and
 *  to why a phosphate can charge ADP at steps 7 and 10 but not at step 8.
 *
 *  THE FIVE STAGES SURVIVE AS GROUPING, NOT AS CONTENT. Ten clicks with no
 *  structure is a list; the five stages are what make the ARC legible — spend 2,
 *  cut in half, oxidise once, collect 4. So the rail shows five stages and
 *  expands the current one into its steps. Bookkeeping deltas stay on the stage,
 *  because that is the level at which they mean anything.
 *
 *  NO ΔG NUMBERS ARE PRINTED. The thermodynamics is taught as REVERSIBILITY —
 *  three steps (1, 3, 10) are effectively irreversible in a cell, the other
 *  seven sit near equilibrium — because that is the fact the regulation and the
 *  gluconeogenesis bypass both hang off, and because a per-step kJ/mol table
 *  would be typed numbers that nothing in this repo can check.
 *
 *  THE ×2 IS SHOWN, NEVER LABELLED. After the split, both three-carbon halves
 *  stay on screen in parallel lanes and every later step visibly fires twice.
 *  A "×2" caption is exactly the thing students drop on the exam.
 *
 *  DERIVED STATE, NOT MUTATED STATE. `done` (how many steps are complete) is
 *  the only mutable state; species, pools and ledger are all pure functions of
 *  it (speciesAt/poolAt/ledgerAt). That makes stepping BACKWARD free — rewind
 *  just re-renders at a lower index instead of trying to invert a reaction.
 * ========================================================================== */

/* ---------- shared stage (scene.js) + effects (fx.js) ---------- */
const canvas=document.getElementById('gl');
let userSpun=false, userZoom=false;
const {scene,camera,renderer,root,cam,applyCam,resize}=Stage.create(canvas,{
  cam:{theta:0.10,phi:1.30,r:26}, phiMin:0.4, phiMax:2.6, rMin:9, rMax:80,
  onDrag:()=>{userSpun=true;}, onZoom:()=>{userZoom=true;} });
const FXi=FX.create(THREE,root,camera);
const M=MolLib.MOLECULES, PAL=MolLib.PALETTE;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

/* =============================================================
 *  THE LESSON SCRIPT
 * ============================================================= */

// Cell pools. Chosen so the pools THEMSELVES demonstrate the net yield: ATP
// starts at 4 and ends at 6 (net +2) after dipping to 2, and NAD⁺ runs to
// exactly 0 — which is the setup for the fermentation fork at the end.
const POOL0={ATP:4, ADP:4, NAD:2, NADH:0, Pi:2};

// `sub` says what the MOLECULE is, never what the pathway has done — the number
// above it is a pool, not a running total. ATP and ADP used to read "energy
// spent" and "energy made", which are the ledger's two rows: the tray ended
// showing "ATP 6 · ENERGY SPENT" when 2 had been spent, contradicting the
// ledger directly above it on the one number this page exists to land.
// Charged/discharged also puts ATP:ADP in the same shape as NAD⁺:NADH, which is
// the analogy worth having — both are carriers that cycle, not fuels consumed.
const REAGENTS=[
  {key:'ATP',  name:'ATP',   sub:'charged'},
  {key:'ADP',  name:'ADP',   sub:'discharged'},
  {key:'Pi',   name:'P<sub>i</sub>', sub:'free phosphate'},
  {key:'NAD',  name:'NAD<sup>+</sup>',  sub:'empty carrier'},
  {key:'NADH', name:'NADH',  sub:'loaded carrier'},
];

// One entry per user action — the ten canonical steps. `species` is the
// resulting contents of the lanes, so the lane count doubling at the split falls
// out of the data. `rev:false` marks the three steps that are effectively
// irreversible in a cell; those same three are the regulated ones and the ones
// gluconeogenesis has to bypass, which is not a coincidence and is the point.
const STEPS=[
  { n:1, stage:1, reagent:'ATP', need:'Spend 1 ATP',
    species:['g6p'], enz:'Hexokinase', rev:false,
    pool:{ATP:-1,ADP:+1}, spent:1, fx:'in', anchor:'p3',
    msg:`<b>ATP</b> hands a <span class="p">phosphate</span> to carbon 6, and the ring opens. Phosphorylating a sugar is uphill on its own — <b>coupling</b> it to ATP hydrolysis is what makes it go.` },

  { n:2, stage:1, reagent:null,
    act:'Shift the carbonyl to C2', actHint:'phosphoglucose isomerase · aldose → ketose',
    species:['f6p'], enz:'Phosphoglucose isomerase', rev:true,
    fx:'iso',
    msg:`The C=O moves from carbon 1 to carbon 2. Nothing is spent and nothing is made — but an <b>aldose</b> cannot be cut into two phosphorylatable halves, and a <b>ketose</b> can.` },

  { n:3, stage:1, reagent:'ATP', need:'Spend 1 more ATP',
    species:['f16bp'], enz:'Phosphofructokinase-1 (PFK-1)', short:'Phosphofructokinase-1',
    rev:false, commit:true,
    pool:{ATP:-1,ADP:+1}, spent:1, fx:'in', anchor:'p1',
    msg:`A second <b>ATP</b> phosphorylates carbon 1. This is the <b>committed step</b> — and the one the cell regulates.` },

  { n:4, stage:2, reagent:null,
    act:'Cleave the C3–C4 bond', actHint:'aldolase · 6 carbons → 3 + 3',
    species:['dhap','g3p'], enz:'Aldolase', rev:true,
    fx:'split',
    msg:`Six carbons become <b>3 + 3</b>. Each half keeps one <span class="p">phosphate</span> — which is why two were paid in.` },

  { n:5, stage:2, reagent:null,
    act:'Convert DHAP → G3P', actHint:'triose-phosphate isomerase · the halves are not identical yet',
    species:['g3p','g3p'], enz:'Triose-phosphate isomerase', rev:true,
    fx:'iso',
    msg:`<b>DHAP</b> rearranges into a second <b>G3P</b>. Both lanes are now identical — everything from here happens <b>twice</b>.` },

  { n:6, stage:3, reagent:'NAD', need:'Load both NAD⁺',
    species:['bpg13','bpg13'], enz:'Glyceraldehyde-3-phosphate dehydrogenase',
    short:'G3P dehydrogenase', rev:true,
    pool:{NAD:-2,NADH:+2,Pi:-2}, nadh:2, fx:'ox', anchor:'p1',
    msg:`The <b>only oxidation in the pathway</b>. Each G3P loses two electrons and a proton to <span class="n">NAD⁺</span>, making <span class="n">NADH</span>. A <span class="p">free phosphate</span> from the cytosol fills the spot — <b>no ATP was spent here.</b>` },

  { n:7, stage:4, reagent:'ADP', need:'Charge 2 ADP',
    species:['pga3','pga3'], enz:'Phosphoglycerate kinase', rev:true,
    pool:{ADP:-2,ATP:+2}, made:2, fx:'out', anchor:'p1',
    msg:`The <b>acyl phosphate</b> on carbon 1 has a higher transfer potential than ATP's, so it can be handed straight to <b>ADP</b>. Two lanes → <b>2 ATP</b>. This is <b>substrate-level phosphorylation</b>.` },

  { n:8, stage:4, reagent:null,
    act:'Move the phosphate C3 → C2', actHint:'phosphoglycerate mutase · no ATP, no carbon change',
    species:['pga2','pga2'], enz:'Phosphoglycerate mutase', rev:true,
    fx:'move', anchor:'p3', dest:'p2',
    msg:`The phosphate slides from carbon 3 to carbon 2. On C3 it was an ordinary ester and <b>could not</b> charge ADP — this move sets up the step that changes that.` },

  { n:9, stage:4, reagent:null,
    act:'Remove a water', actHint:'enolase · dehydration creates the high-energy bond',
    species:['pep','pep'], enz:'Enolase', rev:true,
    fx:'lose', anchor:'oh3',
    msg:`A <b>water</b> leaves, forming a C=C and trapping the molecule as an <b>enol</b>. No energy was added — the molecule was <i>rearranged</i> into a strained form, and that strain is now stored in the phosphate bond.` },

  { n:10, stage:4, reagent:'ADP', need:'Charge 2 more ADP',
    species:['pyruvate','pyruvate'], enz:'Pyruvate kinase', rev:false,
    pool:{ADP:-2,ATP:+2}, made:2, fx:'out', anchor:'p2',
    msg:`<b>PEP</b> has the highest phosphoryl-transfer potential of any molecule in the cell — well above ATP's. The phosphate goes to <b>ADP</b> and the enol snaps to the keto form: <b>pyruvate</b>.` },
];

// The five stages, kept as the GROUPING over the ten steps. `delta` is the
// bookkeeping change students should be able to recite for each one — it is
// printed on the rail whether or not they read the prose. `steps` is derived
// from STEPS below rather than typed, so the two can never drift.
const STAGES=[
  { n:0, title:'Glucose', label:'Start: one glucose', delta:'6 C',
    body:`<p>One molecule of <b>glucose</b> — six carbons, drawn as the <b>pyranose
      ring</b> it mostly adopts in water.</p>
      <p>Glycolysis runs in the <b>cytosol</b> and uses <b>no oxygen</b>. Every domain
      of life has it, which is the usual argument that it is very old — older than
      the oxygen it doesn't need.</p>
      <p class="misc">Watch two numbers in the ledger: the <b>carbon count</b>, which
      never changes, and <b>ATP</b>, which is about to go <i>down</i>.</p>` },

  { n:1, title:'Investment', block:'Priming', label:'Priming: spend 2 ATP', delta:'−2 ATP',
    body:`<p>Three steps, two of them spending ATP. Phosphorylating a sugar is
      thermodynamically uphill; <b>coupling</b> each one to ATP hydrolysis is what
      makes the pair go downhill together.</p>
      <p>The phosphates buy two things. Their <b>charge</b> traps the sugar inside the
      cell — GLUT transporters won't carry it back out. And they <b>destabilise</b>
      the molecule, which is what lets step 4 break it in half.</p>
      <p class="misc">Step 2 spends nothing. It moves the carbonyl from C1 to C2,
      turning an aldose into a ketose — without which the six-carbon chain could not
      be cut into two halves that each carry a phosphate.</p>` },

  { n:2, title:'The split', block:'Cleavage', label:'Cleavage: 6C → 3C + 3C', delta:'1 → 2',
    body:`<p>Aldolase cuts the chain between <b>carbon 3 and carbon 4</b>. One molecule
      becomes <b>two</b>: <b>DHAP</b> and <b>G3P</b>.</p>
      <p>They are isomers, not copies — so triose-phosphate isomerase converts DHAP
      into a second G3P. Only then does the pathway have two identical substrates.</p>
      <p class="misc"><i>Glyco-</i> sugar, <i>-lysis</i> splitting: this is where the
      pathway gets its name. From here every step happens <b>twice</b>, once per lane.
      Nothing on screen says "×2" — you just see both.</p>` },

  { n:3, title:'Oxidation', block:'Oxidation', label:'Oxidation: make 2 NADH', delta:'+2 NADH',
    body:`<p>The <b>payoff phase</b> starts here — and it starts with the
      <b>only oxidation in the whole pathway</b>. Worth being precise about: G3P
      <b>loses electrons</b>, so it is oxidised. <b>NAD⁺</b> gains them (two
      electrons and a proton — a hydride) and becomes <b>NADH</b>.</p>
      <p>A <b>free phosphate</b> from the cytosol, not from ATP, fills the vacated
      position. The product is an <b>acyl phosphate</b>, and the oxidation is what
      paid for it.</p>
      <p class="misc">NADH is the larger prize. If oxygen is available, each one is
      worth roughly 2.5 ATP downstream — so these 2 NADH outweigh the pathway's 2
      net ATP several times over.</p>` },

  { n:4, title:'Payoff', block:'Payoff', label:'Payoff: make 4 ATP', delta:'+4 ATP',
    body:`<p>Four steps, two of which charge ADP. Both work by <b>substrate-level
      phosphorylation</b>: an enzyme hands a phosphate straight from a substrate to
      ADP — no membrane, no gradient, no oxygen.</p>
      <p>That only works when the donor's <b>phosphoryl-transfer potential</b> is
      higher than ATP's. The acyl phosphate of 1,3-BPG qualifies; the plain ester on
      3-phosphoglycerate does not, which is exactly why steps 8 and 9 exist — to
      move that phosphate and then dehydrate the molecule into <b>PEP</b>, the
      highest-potential phosphate donor in the cell.</p>
      <p class="misc">Count the phosphates leaving the screen. Four out, and every one
      of them lands on an ADP.</p>` },

  { n:5, title:'The tally', label:'Tally & what comes next', delta:'net +2 ATP',
    body:`<p>Two <b>pyruvate</b>. Six carbons in, six carbons out — nothing was lost;
      it was cut in half and drained of a little energy.</p>
      <p>Per glucose: <b>4 ATP made − 2 ATP spent = net 2 ATP</b>, plus <b>2 NADH</b>.
      That is roughly <b>5%</b> of the energy in the glucose. The rest is still in
      those two pyruvate.</p>
      <p class="misc">Look at the ledger: <b>NAD⁺ is 0</b>. NAD⁺ is a <i>carrier</i>,
      not a fuel — the cell has a fixed, small pool of it. Glycolysis stops dead
      until it is regenerated, and that constraint is what the fork below is really
      about.</p>` },
];

// Which steps sit under a stage — derived, never typed. The rail now prints
// every step number itself, so nothing has to state a range and then be kept
// true; a step moved between stages re-blocks the rail on its own.
const stageSteps=n=>STEPS.filter(s=>s.stage===n);

/* ---- the regulation panel: PFK-1, and why the cell controls step 3 ----------
 * Attached to the step, not the stage, so it appears exactly when the student is
 * about to click PFK-1 and not a moment before. The three irreversible steps are
 * derived from STEPS' `rev` flags rather than listed again here. */
const PFK={
  title:'PFK-1 — the committed step',
  body:`Steps 1 and 2 are reversible detours: G6P can still leave for glycogen or
    the pentose phosphate pathway. Once PFK-1 acts, the carbon has no fate but
    pyruvate. A pathway is regulated at its <b>first irreversible, committed</b>
    step, and that is this one.`,
  on:[ ['AMP','the cell is short of energy'],
       ['Fructose-2,6-bisphosphate','signals plenty of glucose'] ],
  off:[ ['ATP','the cell already has energy'],
        ['Citrate','the Krebs cycle is backed up'] ],
  note:`This is <b>allosteric</b> regulation — the effectors bind away from the
    active site and change the enzyme's shape. Note that ATP is both PFK-1's
    substrate and its inhibitor: at high concentration it binds a second, lower-
    affinity site and slows the enzyme down. That is negative feedback.`
};

/* =============================================================
 *  DERIVED STATE — everything is a function of `done`
 * ============================================================= */
let done=0;                                   // how many STEPS are complete
// `intro` is the one piece of state that ISN'T derived from `done`: at done=0 the
// next action is already a stage-1 step, so without this flag the page would open
// on "Investment" and the student would never meet glucose. It gates the reading,
// not the chemistry — the tray stays dark until Begin is pressed.
let intro=true;
const nSteps=STEPS.length;
const stepAt=i=>STEPS[i];                     // the step that runs NEXT at done=i
const speciesAt=i=>i===0?['glucose']:STEPS[i-1].species;
function poolAt(i){ const p=Object.assign({},POOL0);
  for(let k=0;k<i;k++){ const d=STEPS[k].pool||{}; for(const q in d) p[q]+=d[q]; }
  return p; }
function ledgerAt(i){ const L={spent:0,made:0,nadh:0};
  for(let k=0;k<i;k++){ const s=STEPS[k];
    L.spent+=s.spent||0; L.made+=s.made||0; L.nadh+=s.nadh||0; }
  return L; }
// which stage the student is LOOKING at: the stage of the next step, or the
// final tally stage once every step is done.
const stageAt=i=>intro?0:(i>=nSteps?5:STEPS[i].stage);
const carbonsAt=i=>speciesAt(i).reduce((s,k)=>s+M[k].gly.carbons,0);

/* =============================================================
 *  3D: lanes, labels, transitions
 * ============================================================= */
const LANE=5.6;                               // half-separation of the two lanes
let lanes=[];                                 // [{g, key, label}] left→right
let busy=false;                               // a transition is animating

// SPECIES NAMES ARE HTML, NOT SPRITES. They used to be canvas textures
// billboarded in the scene, so they would follow the molecule on orbit for
// free. The cost was everything else: text resampled at every zoom, the webfont
// baked into a texture (so the first paint had to be thrown away and redrawn
// once the font landed), no selecting or copying a name, and a label whose size
// was tied to the camera rather than to the page's type scale.
//
// So they are DOM now, and the tracking that came free is paid for explicitly:
// every frame, each lane's anchor point is projected through the camera and the
// label is positioned over it (drawPlates, called from the render loop). That
// is the one thing that must not be dropped — an HTML label that is not
// re-projected drifts off its molecule the moment the scene rotates.
const platesEl=document.getElementById('plates');
function makePlate(spec){
  const d=document.createElement('div');
  d.className='plate';
  d.innerHTML=`<div class="pn">${spec.name}</div><div class="pf">${spec.formula}</div>`;
  platesEl.appendChild(d);
  return d;
}
// How tall the label strip is, in PIXELS — the fit reserves this at the top of
// the stage the same way it reserves the tray at the bottom. Measured off a
// live label rather than assumed, so restyling the type moves the camera with
// it. Falls back to a sane guess before the first label exists.
function plateHeightPx(){
  const d=platesEl.firstElementChild;
  return d ? d.getBoundingClientRect().height+PLATE_GAP_PX : 46;
}
const PLATE_GAP_PX=10;

function laneX(i,n){ return n===1?0:(i===0?-LANE:LANE); }

// This page draws no C–H anywhere: the lesson is carbon and phosphate
// bookkeeping, and a hydrogen on every carbon is noise the ledger never counts.
// Glucose is the one spec that carries its C–H (macromolecule-lab.html offers
// them behind a toggle), so they are hidden on build and excluded from every
// measurement below — otherwise a hydrogen nobody can see would still push
// glucose's name plate up and widen the shared camera fit.
// EVERY MEASUREMENT BELOW HAPPENS IN THE ORIENTATION THE MOLECULE IS BUILT IN.
// Stage.buildMolecule applies `spec.view` AFTER laying the atoms out, and
// Stage.measure re-applies it before measuring for precisely this reason. This
// page's fit used to read `a.pos[1]` raw — fine for the pathway's chains, which
// declare no view, and wrong for glucose, the one spec here that does: the page
// opened framed for a molecule in an orientation it is never drawn in, so the
// ring hung off two edges and the name plate landed on top of it.
const viewQuat=spec=>spec.view
  ? new THREE.Quaternion().setFromEuler(
      new THREE.Euler(spec.view[0]||0, spec.view[1]||0, spec.view[2]||0, 'ZYX'))
  : null;
const visibleAtoms=spec=>{
  const opt=new Set(spec.optH||[]), q=viewQuat(spec);
  const keep=spec.atoms.filter((_,i)=>!opt.has(i));
  if(!q) return keep;
  return keep.map(a=>{
    const v=new THREE.Vector3(a.pos[0],a.pos[1],a.pos[2]).applyQuaternion(q);
    return {el:a.el, pos:[v.x,v.y,v.z]};
  });
};

// highest / lowest point of a spec including sphere radii — the specs vary from a
// 5-unit ring to a 10-unit chain, and a phosphate can hang off either end
function moleculeTop(spec){
  return visibleAtoms(spec).reduce((m,a)=>Math.max(m,a.pos[1]+(PAL.radii[a.el]||0.7)),0); }
function moleculeBottom(spec){
  return visibleAtoms(spec).reduce((m,a)=>Math.min(m,a.pos[1]-(PAL.radii[a.el]||0.7)),0); }

// Build one lane's molecule + name plate at slot i of n. `topY` is passed in
// rather than derived per-molecule: DHAP carries its phosphate on C1 and G3P on
// C3, so per-molecule plate heights differed by 3.3 units and the two lane labels
// sat at visibly different heights — which reads as "these are different sizes".
// One shared baseline keeps the lanes looking like a matched pair.
function spawnLane(key,i,n,topY){
  const spec=M[key];
  const g=Stage.buildMolecule(spec);
  Stage.setOptionalH(g,false);          // no C–H on this page — see visibleAtoms
  g.position.set(laneX(i,n),0,0);
  root.add(g);
  return {g,key,plate:makePlate(spec),topY};
}
function clearLanes(){
  lanes.forEach(l=>{ root.remove(l.g); l.plate.remove(); });
  lanes=[];
}

// The world point a lane's label is pinned above. `topY` is shared across the
// lanes rather than derived per molecule: DHAP carries its phosphate on C1 and
// G3P on C3, so per-molecule anchors differed by 3.3 units and the two labels
// sat at visibly different heights — which reads as "these are different sizes".
const PLATE_GAP=0.8;
const plateY=keys=>Math.max(...keys.map(k=>moleculeTop(M[k])))+PLATE_GAP;

// Project each lane's anchor and park its label over it. Called every frame
// from the render loop — see the note on makePlate. `l.g.position.x` is read
// live rather than from laneX() so the labels ride the halves apart during the
// split instead of snapping to the final lane positions.
const projV=new THREE.Vector3();
function drawPlates(){
  const w=canvas.clientWidth, h=canvas.clientHeight;
  camera.updateMatrixWorld();          // safe to call off-loop (restart, resize)
  lanes.forEach(l=>{
    projV.set(l.g.position.x, l.topY, 0).project(camera);
    l.plate.style.left=((projV.x*0.5+0.5)*w)+'px';
    l.plate.style.top =((-projV.y*0.5+0.5)*h)+'px';
  });
}

// ---- framing ---------------------------------------------------------------
// ONE SCALE FOR THE WHOLE PATHWAY. Auto-fitting each state to the frame would
// quietly zoom the two three-carbon halves back up to the size the six-carbon
// molecule had — so the split would look like a rearrangement instead of a
// halving. The camera distance is therefore solved ONCE, from the union of every
// state from priming onward, and never changes again: pyruvate looks small
// because it IS small. Only the intro gets its own closer framing, since a lone
// glucose has nothing on screen to be compared against.
//
// It is solved from the SPECS plus the intended lane offsets rather than from a
// live bounding box, because during the split the halves are still easing apart —
// a measured bbox would fit the stacked pair and be wrong a frame later.
const HALF_FOV=Math.tan(22.5*Math.PI/180);
function fitFor(states){
  let lo=0, hi=0, top=0, wide=0;      // lo/hi = atoms only · top = incl. name plate
  states.forEach(keys=>{
    const n=keys.length;
    keys.forEach((k,j)=>{ const x=Math.abs(laneX(j,n));
      visibleAtoms(M[k]).forEach(a=>{ const r=PAL.radii[a.el]||0.7;
        lo=Math.min(lo,a.pos[1]-r); hi=Math.max(hi,a.pos[1]+r);
        wide=Math.max(wide, x+Math.abs(a.pos[0])+r); }); });
    top=Math.max(top, plateY(keys));
    wide=Math.max(wide, (n>1?LANE:0)+2.0);
  });
  // Centre on the MOLECULES, not on the molecules-plus-label: letting the plate
  // pull the centre up shoved the molecule down into the reagent tray. The plate
  // only gets a say in how far back the camera sits.
  const Y=(lo+hi)/2;
  const halfNeeded=Math.max(top-Y, Y-lo);
  // aspect is NaN until the first ResizeObserver tick, so don't trust it blindly
  const asp=isFinite(camera.aspect)&&camera.aspect>0?camera.aspect:1.26;
  const u=usable();
  const R=Math.max(15, Math.min(90,
    Math.max(halfNeeded/(HALF_FOV*u.v), wide/(HALF_FOV*asp))*1.14));
  // Centre the molecule in the band ABOVE the tray by dropping the camera
  // target, rather than insetting both edges. The tray obstructs ONE edge, so
  // charging the fit at top and bottom paid twice for it — on the stacked
  // narrow layout, where the tray is half the stage's height, that shrank
  // glucose to a speck. A shift costs the fit nothing.
  return { Y: Y - u.shift*R*HALF_FOV, R };
}

// THE STAGE IS NOT AN EMPTY RECTANGLE. The reagent tray sits over its bottom
// edge, dead centre, so a molecule fitted to the raw canvas is fitted to space
// that is already spoken for — which is how glucose's C6 ended up behind the
// tray. The intrusion is MEASURED off the live element rather than typed as a
// constant, so restyling the tray moves the camera with it.
//
// ONLY THE TRAY COUNTS. The ledger overlaps the stage too, but it is
// translucent, sits at the TOP-left rather than down the whole edge, and the
// molecules here are tall and narrow — charging the fit for it halved every
// molecule on screen to buy clearance nothing needed. Vertical only.
// `v` is the fraction of the canvas height left over once the obstructed strips
// at top and bottom are removed; `shift` is how far (as a fraction of full
// canvas height) the camera target must move to centre the molecule in what
// remains. A positive shift drops the target, pushing the molecule up-screen.
//
// TWO STRIPS NOW, NOT ONE. The tray covers the bottom, and since the species
// labels became HTML they occupy a fixed PIXEL band at the top rather than a
// world-space box the projection scaled with — so the top is reserved here, in
// the same units, instead of inside fitFor. That is the whole reason the label
// height is measured off a live element: it is chrome, exactly like the tray.
function usable(){
  const c=canvas.getBoundingClientRect();
  if(!c.height) return {v:1,shift:0};
  // THE TRAY, AND DELIBERATELY NOT the action button or the ending fork, even
  // though both sit above it and are taller. They come and go per step, so
  // measuring them would make the camera distance a function of which chrome
  // happens to be visible — and this page's whole framing rule is that ONE
  // distance covers every state, or the split stops reading as a halving.
  // Measured: with the tray alone the fit is a flat 49.4 across all eleven
  // states and every molecule still clears whatever chrome is up, the tightest
  // being ~14px during priming. The fork only ever had to clear the TRAY, which
  // is a stacking problem (its own `bottom`), not a camera one.
  // …with ONE substitution: the tray is hidden during the intro, and the Begin
  // button stands in its slot, so measure that instead when the tray is gone.
  // This does not reintroduce the state-dependence warned about above — the
  // tray is visible for every one of the ten steps, so the pathway's single
  // distance is still solved against the tray and only the intro, which already
  // has a framing of its own, sees the button.
  const tray=document.getElementById('tray'), begin=document.getElementById('actbtn');
  const e=(tray&&tray.getClientRects().length) ? tray
        : (begin&&begin.getClientRects().length ? begin : null);
  const bottom=e ? Math.max(0, c.bottom-e.getBoundingClientRect().top) : 0;
  const top=plateHeightPx();
  const cap=c.height*0.6;                     // never eat more than 60% in total
  const k=(top+bottom)>cap ? cap/(top+bottom) : 1;
  const t=top*k, b=bottom*k;
  return { v:Math.max(0.4, (c.height-t-b)/c.height), shift:(b-t)/c.height };
}
let fitR=24, fitY=0;
function computeFit(){
  const intro0=fitFor([['glucose']]);
  // every state from the first phosphorylation to the last pyruvate, unioned
  const path=fitFor(STEPS.map(s=>s.species));
  const f=(intro&&done===0)?intro0:path;
  fitR=f.R; fitY=f.Y;
}

// Snap the scene to the state at index i, with no animation. Used by restart,
// rewind, and as the settling half of every animated transition.
function renderLanes(i){
  clearLanes();
  const keys=speciesAt(i), top=plateY(keys);
  lanes=keys.map((k,j)=>spawnLane(k,j,keys.length,top));
  computeFit();
}

const anchorWorld=(l,which)=>{
  const idx=M[l.key].gly[which];
  return idx==null? l.g.getWorldPosition(new THREE.Vector3())
                  : l.g.userData.atomWorld(idx);
};

/* ---- page-local effects (cosmetic only, like everything in fx.js) ---- */
// TIMERS, NOT FRAMES, ADVANCE THE LESSON.
// requestAnimationFrame stops entirely in a backgrounded tab (README says so, and
// document.hidden confirmed it). The first version of this page completed each
// transition from INSIDE the fly animation's rAF callback — so switching tabs
// mid-step left `busy` stuck true forever, the tray permanently dark and the
// lesson unrecoverable without a reload. So: setTimeout owns every state change
// (it still fires while hidden), and rAF owns only the pixels. Worst case a
// hidden tab skips the animation and the student comes back to the finished step,
// which is exactly the right failure mode.
let timers=[];
const later=(fn,ms)=>{ timers.push(setTimeout(fn,ms)); };
const cancelTimers=()=>{ timers.forEach(clearTimeout); timers=[]; };

const FLY=620, SPLIT=840, GLOW=0xffe0b0;
const OFFSCREEN=8.5;    // where reagents come from / products go to, in world Y

// A phosphate arcing in from the cytosol or out toward the tray. This is the
// page's signature beat: the student should be able to SEE that the thing ATP
// gives up and the thing ADP receives are the same object. Purely decorative —
// it reports nothing back, and its cleanup is on a timer so a hidden tab can't
// leak a stranded mesh into the scene.
function flyPhosphate(from,to){
  const p=Stage.atom(PAL.atoms.P, PAL.radii.P*0.8, from.clone(), 'P');
  p.material=Stage.glowMat(PAL.atoms.P,1.6);
  const r0=PAL.radii.P*0.8;
  root.add(p);
  const t0=performance.now();
  (function fly(){
    const k=Math.min((performance.now()-t0)/FLY,1), e=k*(2-k);   // ease-out
    p.position.lerpVectors(from,to,e);
    p.position.y+=2.6*Math.sin(k*Math.PI);                        // arc over the top
    p.scale.setScalar(r0*(0.75+0.45*Math.sin(k*Math.PI)));
    if(k<1) requestAnimationFrame(fly);
  })();
  later(()=>{ root.remove(p); p.material.dispose(); }, FLY+60);
}

// Where an atom of a not-yet-built species WILL be, so a reagent can fly to the
// spot before the molecule carrying it exists. root is never transformed on this
// page (the camera orbits instead), but localToWorld keeps that from mattering.
function siteWorld(key,which,x){
  const idx=M[key].gly[which], a=M[key].atoms[idx];
  return root.localToWorld(V(a.pos[0]+x, a.pos[1], a.pos[2]));
}

/* =============================================================
 *  RUNNING A STEP
 * ============================================================= */
function runStep(){
  if(busy || intro || done>=nSteps) return;
  const st=stepAt(done), to=done+1;
  const keys=speciesAt(to), n=keys.length;
  busy=true; refresh();                       // dim the tray for the duration
  let dur=FLY;

  if(st.fx==='in'){
    // a phosphate flies in from the cytosol onto the site it is ABOUT to occupy
    keys.forEach((key,j)=>{
      const x=laneX(j,n), tp=siteWorld(key,st.anchor,x);
      flyPhosphate(V(x,OFFSCREEN,0), tp);
      later(()=>FXi.spawnRing(tp,PAL.atoms.P), FLY);
    });

  } else if(st.fx==='out'){
    // each lane's phosphate flies OUT toward the tray, where an ADP catches it
    lanes.forEach(l=>{
      const src=anchorWorld(l,st.anchor);
      FXi.spawnRing(src,PAL.atoms.P);
      flyPhosphate(src, V(l.g.position.x,-OFFSCREEN,0));
    });

  } else if(st.fx==='ox'){
    // two things at once, which is the whole lesson of this step: the H leaves
    // UPWARD onto NAD⁺, and a free phosphate arrives from BELOW to fill the gap.
    // Opposite directions, so it can't read as one swap.
    lanes.forEach(l=>{
      const hIdx=M[l.key].gly.aldehydeH;
      const hPos=hIdx!=null? l.g.userData.atomWorld(hIdx) : anchorWorld(l,'p3');
      FXi.protonHop(hPos, V(l.g.position.x, OFFSCREEN, 0));
      flyPhosphate(V(l.g.position.x,-OFFSCREEN,0), hPos);
      later(()=>FXi.spawnRing(hPos,PAL.atoms.P), FLY);
    });

  } else if(st.fx==='split'){
    // THE MONEY SHOT: flash at the C3–C4 bond, then the two halves part into lanes.
    // Both halves are spawned at the centre and eased outward by the main loop, so
    // the six carbons visibly become 3 + 3 rather than cutting to a new layout.
    const l=lanes[0], cl=M[l.key].gly.cleave;
    const mid=l.g.userData.atomWorld(cl[0]).add(l.g.userData.atomWorld(cl[1])).multiplyScalar(.5);
    FXi.spawnRing(mid,PAL.atoms.P);
    clearLanes();
    const top=plateY(keys);
    lanes=keys.map((k,j)=>{ const o=spawnLane(k,j,n,top);
      o.g.position.set(0,0,0); o.g.userData.tx=laneX(j,n); return o; });
    later(()=>{ done=to;                       // lanes already correct — don't respawn
      // The parting is a rAF ease, so in a hidden tab it never ran; land them on
      // their marks here so the two halves can't come back stacked on each other.
      lanes.forEach(o=>{ o.g.position.x=o.g.userData.tx; FXi.popGlow(o.g,GLOW); });
      busy=false; refresh(); flashMsg(st.msg); }, SPLIT);
    return;

  } else if(st.fx==='move'){
    // THE MUTASE: the phosphate does not leave and does not come from the pool —
    // it slides from C3 to C2 on the same molecule. Drawn as a short flight
    // between the two sites so it reads as the SAME phosphate relocating, which
    // is the difference between step 8 and every other phosphate beat here.
    lanes.forEach((l,j)=>{
      const src=anchorWorld(l,st.anchor);
      const dst=siteWorld(keys[j],st.dest,laneX(j,n));
      flyPhosphate(src,dst);
      later(()=>FXi.spawnRing(dst,PAL.atoms.P), FLY);
    });

  } else if(st.fx==='lose'){
    // ENOLASE: a water leaves. It goes UP and out, in the same direction NAD⁺
    // took the hydride at step 6, because both are "something departs" — the
    // phosphate beats all move along the vertical axis in the opposite sense.
    lanes.forEach(l=>{
      const idx=M[l.key].gly[st.anchor];
      const pos=idx!=null? l.g.userData.atomWorld(idx) : anchorWorld(l,'p2');
      FXi.spawnRing(pos, PAL.atoms.O);
      FXi.protonHop(pos, V(l.g.position.x, OFFSCREEN, 0));
    });

  } else dur=280;                              // 'iso': a plain rearrangement

  later(()=>{ done=to; renderLanes(to);
    lanes.forEach(o=>FXi.popGlow(o.g,GLOW));
    busy=false; refresh(); flashMsg(st.msg); }, dur);
}

function rewind(){
  if(busy) return;
  if(done===0){ intro=true; refresh(); return; }   // step back off stage 1 onto the intro
  done--; renderLanes(done); refresh();
}
function restart(){ cancelTimers(); busy=false; done=0; intro=true;
  renderLanes(0); refresh(); userSpun=false; userZoom=false; }

/* =============================================================
 *  UI
 * ============================================================= */
const rxmsgEl=document.getElementById('rxmsg');
function flashMsg(html){ if(!html) return; rxmsgEl.innerHTML=html;
  rxmsgEl.classList.remove('show'); void rxmsgEl.offsetWidth; rxmsgEl.classList.add('show'); }

const ledgerEl=document.getElementById('ledger');
let prevLedger=null;
function drawLedger(){
  const L=ledgerAt(done), net=L.made-L.spent, c=speciesAt(done).map(k=>M[k].gly.carbons);
  const bumped=k=>prevLedger && prevLedger[k]!==L[k] ? ' bump':'';
  ledgerEl.innerHTML=
     `<div class="lhead">Running ledger</div>`
    +`<div class="row"><span>ATP spent</span><span class="v${bumped('spent')}">${L.spent}</span></div>`
    +`<div class="row"><span>ATP made</span><span class="v${bumped('made')}">${L.made}</span></div>`
    // typographic minus, not a hyphen — "−2" is a quantity, and the dip to −2 is
    // the single number this whole page is built to make land
    +`<div class="row net"><span>Net ATP</span><span class="v">${net>0?'+':net<0?'−':''}${Math.abs(net)}</span></div>`
    +`<div class="row"><span>NADH</span><span class="v${bumped('nadh')}">${L.nadh}</span></div>`
    +`<div class="row carb"><span>Carbons</span><span class="v">${c.join(' + ')}${c.length>1?' = 6':''}</span></div>`;
  prevLedger=L;
}

const trayEl=document.getElementById('tray');
function drawTray(){
  // Hidden until Begin. At the intro nothing can be spent, and a row of inert
  // pools sitting next to the Begin button just invites clicking the wrong
  // thing — the tray arriving WITH the first step is also what makes it read as
  // the lesson's instrument rather than as page furniture.
  if(intro){ trayEl.style.display='none'; trayEl.innerHTML=''; return; }
  trayEl.style.display='flex';
  const pool=poolAt(done), st=done<nSteps?stepAt(done):null;
  trayEl.innerHTML='<div class="tstrip"></div><div class="tcap">In the cytosol</div>';
  const strip=trayEl.firstElementChild;
  REAGENTS.forEach(r=>{
    const live=!!st && st.reagent===r.key && !busy;
    const d=document.createElement('div');
    d.className='reag'+(live?' live':'')+(pool[r.key]===0?' empty':'');
    d.innerHTML=(live?`<span class="need">${st.need} ↓</span>`:'')
      +`<div class="rname">${r.name}</div>`
      +`<div class="rcount">${pool[r.key]}</div>`
      +`<div class="rsub">${r.sub}</div>`;
    if(live) d.onclick=runStep;
    strip.appendChild(d);
  });
}

const actEl=document.getElementById('actbtn');
function drawAct(){
  // ONE BUTTON, ONE PLACE. The intro's Begin and every no-reagent step share
  // this element, so the thing to click never jumps between the stage and the
  // sidebar: Begin sits in the tray's slot (the tray is hidden until then), and
  // from the first step on it sits just above the tray.
  if(intro){
    actEl.style.display='block';
    actEl.className='begin';
    actEl.innerHTML=`Begin →<span class="hint">one glucose, ten steps to pyruvate</span>`;
    actEl.onclick=()=>{ intro=false; refresh(); };
    return;
  }
  actEl.className='';
  const st=done<nSteps?stepAt(done):null;
  if(st && !st.reagent && !busy){
    actEl.style.display='block';
    actEl.innerHTML=`${st.act}<span class="hint">${st.actHint}</span>`;
    actEl.onclick=runStep;
  } else actEl.style.display='none';
}

const railEl=document.getElementById('rail');
function drawRail(){
  const cur=stageAt(done);
  railEl.innerHTML='';
  // Jump to the state just BEFORE step k, so the student re-runs the step rather
  // than landing on its aftermath.
  const goStep=k=>{ if(busy) return; intro=false; done=k; renderLanes(done); refresh(); };
  const goStage=s=>{ if(busy||s.n>cur) return;
    const k=STEPS.findIndex(x=>x.stage===s.n);
    intro=(s.n===0);
    done=(s.n===0?0:(s.n===5?nSteps:(k<0?done:k)));
    renderLanes(done); refresh(); };
  const stageCls=n=>n<cur?'done':(n===cur?'cur':'future');

  STAGES.forEach(s=>{
    const steps=stageSteps(s.n);

    // The two bookends — the starting point and the final tally — are STATES,
    // not steps, so they get a mark rather than a number. Numbering them would
    // push the ten out of alignment with the textbook, which is the whole point.
    if(!steps.length){
      const d=document.createElement('div');
      d.className='rrow bookend '+stageCls(s.n);
      d.innerHTML=`<div class="rdot">${s.n===0?'·':'✓'}</div>`
        +`<div class="rlab">${s.label}</div>`
        +`<div class="rdelta">${s.delta}</div>`;
      d.onclick=()=>goStage(s);
      railEl.appendChild(d);
      return;
    }

    const h=document.createElement('div');
    h.className='rblock '+stageCls(s.n);
    h.innerHTML=`<span class="bt">${s.block}</span><span class="bd">${s.delta}</span>`;
    h.onclick=()=>goStage(s);
    railEl.appendChild(h);

    steps.forEach(st=>{
      const idx=STEPS.indexOf(st);
      // `intro` gates the reading, not the chemistry — at done=0 step 1 is
      // already next, so without this check the rail would light step 1 as
      // current while the student is still being introduced to glucose.
      const state=idx<done?'done':(idx===done&&!intro?'cur':'future');
      const r=document.createElement('div');
      r.className='rrow '+state;
      r.innerHTML=`<div class="rdot">${st.n}</div>`
        +`<div class="rlab">${st.short||st.enz}</div>`
        +(st.rev===false
          ? `<div class="rirr" title="effectively irreversible in the cell">⇢</div>` : '');
      if(idx<done) r.onclick=()=>goStep(idx);
      railEl.appendChild(r);
    });
  });
}

const cardEl=document.getElementById('cardtext'), titleEl=document.getElementById('labtitle');
// JUST THE TITLE. This used to carry two more lines above it — a "Stage 2 of 5 ·
// Step 4 of 10" eyebrow and a coloured phase pill — and both restated something
// already on screen. The rail below numbers every stage, marks the current one,
// expands it into its steps and prints each one's bookkeeping delta, so the
// eyebrow was the rail in words; and the pill read "The split" directly under a
// heading reading "The split". The one thing the pill carried that a title does
// not is that stage 3's oxidation already belongs to the payoff phase, so that
// moved into stage 3's own prose, where it is a sentence rather than a label.
function drawCard(){
  const s=STAGES[stageAt(done)], st=(!intro&&done<nSteps)?stepAt(done):null;
  titleEl.textContent=s.title;
  cardEl.innerHTML=(st?`<p class="enz">Next enzyme: <b>${st.enz}</b></p>`:'')+s.body;
}

/* The panel under the card. It shows ONE of three things, in priority order:
 * PFK-1's regulation when that step is next (the page's one piece of real
 * regulatory biology, and it should not have to compete for attention), the
 * current step's reversibility otherwise, and the gluconeogenesis consequence
 * once the pathway is finished. */
const noteEl=document.getElementById('stepnote');
const irrevSteps=()=>STEPS.filter(s=>s.rev===false);
function drawNote(){
  const st=(!intro&&done<nSteps)?stepAt(done):null;
  if(intro){ noteEl.innerHTML=''; noteEl.style.display='none'; return; }
  noteEl.style.display='block';

  if(st && st.commit){
    noteEl.innerHTML=`<div class="nhead reg">${PFK.title}</div>`
      +`<p class="nbody">${PFK.body}</p>`
      +`<div class="effrow"><div class="eff on"><div class="eh">Speeds it up</div>`
        +PFK.on.map(([a,b])=>`<div class="e"><b>${a}</b><span>${b}</span></div>`).join('')+`</div>`
      +`<div class="eff off"><div class="eh">Slows it down</div>`
        +PFK.off.map(([a,b])=>`<div class="e"><b>${a}</b><span>${b}</span></div>`).join('')+`</div></div>`
      +`<p class="nbody">${PFK.note}</p>`;
    return;
  }
  if(st){
    // Reversibility is stated per step because it is the property that decides
    // which steps CAN be regulated — a near-equilibrium step run backwards is
    // just the same enzyme, so controlling it controls nothing.
    noteEl.innerHTML = st.rev===false
      ? `<div class="nhead irr">Irreversible in the cell</div>`
        +`<p class="nbody">This step releases too much free energy to run backwards.
           That makes it a place the cell <b>can</b> regulate — and a place
           gluconeogenesis has to route around with a different enzyme.</p>`
      : `<div class="nhead rev">Near equilibrium — reversible</div>`
        +`<p class="nbody">This step sits close to equilibrium, so the same enzyme
           runs it in either direction depending on which side is more
           concentrated. Nothing here is worth regulating.</p>`;
    return;
  }
  noteEl.innerHTML=`<div class="nhead irr">The three one-way steps</div>`
    +`<p class="nbody">Only <b>${irrevSteps().map(s=>s.n).join(', ')}</b> —
       ${irrevSteps().map(s=>s.enz.replace(/ \(.*\)/,'')).join(', ')} — are
       irreversible. The other seven run in both directions, which is why
       <b>gluconeogenesis</b> reuses seven of these ten enzymes and needs new ones
       only to bypass those three.</p>`;
}

const forkEl=document.getElementById('fork');
function drawFork(){
  if(intro || done<nSteps){ forkEl.style.display='none'; return; }
  forkEl.style.display='flex';
  // Three fates, not two. The two fermentations are different reactions with
  // different products and different organisms, and collapsing them into
  // "fermentation" is what leaves students unable to say why muscle makes
  // lactate and yeast makes ethanol. All three are framed by the SAME question —
  // where does NAD⁺ come from — because that is the constraint that picks one.
  forkEl.innerHTML=
     `<div class="door"><div class="dh">With O₂ <i>— aerobic</i></div>
        <div class="db">Pyruvate enters the <b>mitochondrion</b>: oxidised to
        acetyl-CoA, then the citric acid cycle and the electron transport chain.
        <b>~30 ATP</b> per glucose, and NAD⁺ is regenerated there.</div></div>`
    +`<div class="door"><div class="dh">No O₂ <i>— lactic acid</i></div>
        <div class="db">Pyruvate itself takes the <b>NADH</b>'s electrons and becomes
        <b>lactate</b>. Muscle under load, and most bacteria. <b>No extra ATP</b> —
        the only product that matters is <b>NAD⁺</b>.</div></div>`
    +`<div class="door"><div class="dh">No O₂ <i>— ethanol</i></div>
        <div class="db">Yeast decarboxylates pyruvate to acetaldehyde first, losing
        a <b>CO₂</b>, then reduces that to <b>ethanol</b>. Same purpose: regenerate
        <b>NAD⁺</b> so glycolysis can keep turning.</div></div>`;
}

// drawTray runs BEFORE drawAct: the tray's visibility decides which element
// usable() measures, and drawAct's Begin state is the stand-in for it.
function refresh(){ drawLedger(); drawTray(); drawAct(); drawRail(); drawCard();
  drawNote(); drawFork(); computeFit(); }

document.getElementById('restart').onclick=restart;
// keyboard: → advances whatever the current step is, ← rewinds
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault();
    if(intro){ intro=false; refresh(); } else runStep(); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); rewind(); }
});

/* =============================================================
 *  MAIN LOOP
 * ============================================================= */
function loop(){
  // lanes ease toward their slots (used by the split, and after any respawn)
  lanes.forEach(l=>{ if(l.g.userData.tx!=null)
    l.g.position.x+=(l.g.userData.tx-l.g.position.x)*0.10; });
  if(!userSpun) cam.theta+=0.0013;              // slow idle turn until grabbed
  if(!userZoom) cam.r+=(fitR-cam.r)*0.05;        // ease to the computed framing
  cam.target.y+=(fitY-cam.target.y)*0.06;        // …and re-centre vertically
  applyCam(); FXi.step();
  renderer.render(scene,camera);
  // AFTER the render, never before. Vector3.project() reads the camera's
  // matrixWorldInverse, which only gets refreshed when the scene is rendered —
  // so projecting first positions the labels with the PREVIOUS frame's camera.
  // That is invisible during the idle drift and very visible during the zoom
  // ease and the split, when the camera moves a long way in one frame.
  drawPlates();
  requestAnimationFrame(loop);
}

renderLanes(0); refresh(); applyCam(); resize();
// Re-solve AFTER refresh(). The first computeFit happens inside renderLanes(),
// which runs before the tray has any children — so it measures a zero-height
// tray, insets nothing, and the page would open one frame too close before the
// loop eased it back out. refresh() has drawn the tray by here.
computeFit();
cam.target.y=fitY; cam.r=fitR; applyCam();      // open already framed, don't ease in
requestAnimationFrame(loop);
// the fit depends on camera.aspect, so it has to be redone whenever the stage
// reshapes (window resize, or the sidebar stacking under it on a narrow screen)
new ResizeObserver(computeFit).observe(canvas);
// The labels are DOM, so the webfont swaps into them on its own — but their
// HEIGHT is chrome the fit reserves, and that height changes when the real font
// replaces the fallback. So re-solve once the font lands. (This used to redraw
// the whole scene, because the font had been baked into a canvas texture.)
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(computeFit);

document.getElementById('savepng').onclick=()=>{
  renderer.render(scene,camera);
  // The species labels are DOM now, so they are NOT in the WebGL buffer and a
  // straight canvas.toDataURL() would export unnamed molecules. Composite them
  // back in from the same projected anchors drawPlates() uses. This is the one
  // place canvas text survives, and it is worth the duplication: an export that
  // silently drops the labels is worse than fifteen lines of 2D drawing.
  const w=canvas.width, h=canvas.height, s=w/(canvas.clientWidth||w);   // DPR
  const out=document.createElement('canvas'); out.width=w; out.height=h;
  const x=out.getContext('2d');
  x.drawImage(canvas,0,0);
  x.textAlign='center';
  lanes.forEach(l=>{
    const spec=M[l.key];
    projV.set(l.g.position.x,l.topY,0).project(camera);
    const px=(projV.x*0.5+0.5)*w, py=(-projV.y*0.5+0.5)*h;
    x.font=`500 ${14*s}px "Zilla Slab", Georgia, serif`;
    x.fillStyle='#8a8073'; x.fillText(spec.formula, px, py-3*s);
    x.font=`700 ${19*s}px "Zilla Slab", Georgia, serif`;
    x.fillStyle='#2b2723'; x.fillText(spec.name, px, py-20*s);
  });
  const a=document.createElement('a'); a.download='glycolysis.png';
  a.href=out.toDataURL('image/png'); a.click();
};
</script>
</body>
</html>
