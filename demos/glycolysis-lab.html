<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glycolysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="sandbox.css">
<link rel="stylesheet" href="massaction/massaction.css">
<style>
  :root{ --phos:#e07b1f; --nad:#2f7d5c; --atp:#c8452e; --carbon:#3a3a3a; }

  /* TWO ROWS, TWO COLUMNS: rail across the top, stage takes the rest. */
  @media (min-width:921px){
    #app{grid-template-rows:auto minmax(0,1fr); grid-template-columns:1fr 316px}
    #railbar{grid-column:1 / -1}
    /* STAGE TAKES THE WHOLE WIDTH, NOTES ON TOP: sticky notes, not a panel to
       make room for, so the molecule centres on the PAGE. (They used to own the
       316px column, pushing the lesson left of centre by half that.) */
    #stage{grid-column:1 / -1;grid-row:2}
    #side{grid-column:2;grid-row:2;z-index:9;pointer-events:none;
      /* no paper of its own — an opaque column would cut a rectangle out of
         the scene behind it */
      background:none}
    #side>*{pointer-events:auto}
  }
  #stage,#side{min-height:0}
  /* Scrolls as one column, so no piece needs a fixed height. Paper only when
     stacked — wide, it lies over the stage and takes the stage's. */
  #side{overflow-y:auto; padding:0 20px 30px; box-shadow:none; border:none}
  @media (max-width:920px){
    #side{background-color:var(--paper);
      background-image:radial-gradient(var(--paper-line) 1.4px, transparent 1.4px);
      background-size:26px 26px; background-position:13px 13px}
  }
  #side::before{display:none}
  #card{min-height:0}

  /* ---------- species labels: DOM over the canvas, one per lane ----------
     Placed every frame from the projected anchor (drawPlates) so they track
     the molecule as the camera orbits; the anchor is the label's bottom-middle.
     THE STAGE ANSWERS THE CLICK: a wash of the button's colour from
     bottom-centre. Faint and short — feedback, not an event; cream must still
     be the page's colour a second later. Under the labels, so it tints the
     molecule not its name. */
  #stagepulse{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse 70% 60% at 50% 92%,
      rgba(107,79,216,.26) 0%, rgba(47,125,224,.12) 42%, rgba(47,125,224,0) 74%)}
  #stagepulse.pulse{animation:stagepulse .95s ease-out}
  @keyframes stagepulse{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){ #stagepulse.pulse{animation:none} }

  /* ---------- the hotspot: click the bond that breaks ----------
     A step whose content is "this bond comes apart" should be run BY coming
     apart; a button at the bottom of the screen is a slideshow. Pinned every
     frame to the bond's projected midpoint (drawSpots), like the name plates.
     TWO LAYERS, because the glow is BEHIND the molecule and the click cannot
     be: the canvas is drawn with alpha, so a disc underneath shows through
     wherever the molecule is not, but the canvas takes the pointer (orbit), so
     the target is a transparent button above. Same projected point. */
  #gl{position:relative;z-index:2}          /* over the glow, under everything */
  #spotglow{position:absolute;inset:0;z-index:1;pointer-events:none}
  /* THE SAME DISC, ON THE CARRIER: a kinase step's clickable bond is ATP's β–γ.
     Own container because #spotglow's children are lane spots hidden by index. */
  #cglow{position:absolute;inset:0;z-index:1;pointer-events:none;display:none}
  /* THE PROMPT GOES WITH THE MARK. "Spend 1 ATP" used to sit beside the
     carrier's NAME — the one part here that is not the thing to click. Sized to
     the disc it covers, not the lanes' 74px: what is lit here is small. */
  #cspot{position:absolute;z-index:8;width:50px;height:50px}   /* over the tray */
  #cspot[hidden]{display:none}
  #cglow .chint{position:absolute;transform:translateY(-50%);
    font-family:var(--font-hand);font-size:15px;color:#6b4fd8;white-space:nowrap}
  @media (max-width:920px){ #cglow .chint{display:none} }
  /* A FLAT DISC WITH AN EDGE, not a feathered glow: the edge reads as a target
     you can hit rather than as lighting. */
  .sglow{position:absolute;width:50px;height:50px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:rgba(107,79,216,.30);
    animation:sglowPulse 2.4s ease-in-out infinite}
  @keyframes sglowPulse{
    0%,100%{transform:translate(-50%,-50%) scale(.86);opacity:.75}
    50%    {transform:translate(-50%,-50%) scale(1.12);opacity:1}}

  #spots{position:absolute;inset:0;z-index:6;pointer-events:none}
  /* target invisible: the glow underneath is the affordance; a ring on top
     would be a second one */
  .spot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;
    width:74px;height:74px;padding:0;border:none;border-radius:50%;
    background:none;cursor:pointer;display:block}
  .spot:hover ~ *,.spot:focus-visible{outline:none}
  .spot:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .spot .shint{position:absolute;left:calc(100% + 4px);top:50%;
    transform:translateY(-50%);font-family:var(--font-hand);font-size:15px;
    color:#6b4fd8;white-space:nowrap;pointer-events:none}
  @media (prefers-reduced-motion:reduce){ .sglow{animation:none;opacity:.85} }
  @media (max-width:920px){ .sglow{width:72px;height:72px}
    .spot{width:60px;height:60px} .spot .shint{display:none} }

  #plates{position:absolute;inset:0;z-index:5;pointer-events:none}
  .plate{position:absolute;transform:translate(-50%,-100%);transform-origin:50% 100%;
    text-align:center;white-space:nowrap;line-height:1.15;
    transition:opacity .22s ease}
  /* THE NAME GOES WHILE THE MOLECULE IS BECOMING SOMETHING ELSE — mid-beat the
     thing on stage is between two molecules and the label is still the OLD
     name. Set in runStep, cleared when the product lands. Opacity, never
     display: the label's HEIGHT is the camera's top reserve (plateHeightPx),
     so dropping it from layout re-frames mid-animation. */
  #plates.mute .plate{opacity:0}
  .plate .pn{font-family:var(--font-slab);font-weight:700;font-size:19px;
    color:var(--ink);letter-spacing:.2px}
  .plate .pf{font-family:var(--font-slab);font-weight:500;font-size:14px;color:var(--muted)}
  @media (max-width:920px){
    .plate .pn{font-size:16px}.plate .pf{font-size:12.5px}
  }

  /* ---------- the bottom bar: heading, action button, step caption ----------
     ONE CONTAINER, ONE FIXED HEIGHT — typed, not measured. The camera reserves
     exactly --barh along the bottom edge, so nothing here can re-frame the shot
     by growing: hence `visibility` on #actbtn/#stephead, and #rxmsg out of flow
     above the bar since its height genuinely varies. Grow the button or heading
     → change --barh. Centred like the frustum, so the two agree. */
  #bottombar{--barh:88px;
    position:absolute;left:0;right:0;bottom:18px;z-index:8;height:var(--barh);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    gap:11px;pointer-events:none}
  #bottombar>*{pointer-events:auto}
  /* the step's heading: which of the ten, plus the hook or that it is done. */
  #stephead{visibility:hidden;min-height:15px;
    font-family:var(--font-marker);font-weight:700;font-size:16px;
    letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
  #stephead.on{visibility:visible}

  /* ---------- the caption, on demand ----------
     THE TOOLTIP CHANGES NO LAYOUT: out of flow in a zero-width wrapper,
     opening upward over the stage. */
  .infowrap{position:relative;display:inline-block;width:0;height:0;
    vertical-align:middle}
  .infobtn{position:absolute;left:7px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;padding:0;border-radius:50%;cursor:help;
    border:1.5px solid var(--muted);background:none;color:var(--muted);
    font-family:var(--font-sans);font-weight:700;font-size:10.5px;line-height:1;
    display:grid;place-items:center;transition:color .15s,border-color .15s}
  .infobtn:hover,.infobtn:focus{color:var(--ink);border-color:var(--ink);outline:none}
  #steptip{position:absolute;bottom:calc(100% + 14px);left:50%;
    transform:translateX(-50%) translateY(4px);
    width:min(520px,86%);padding:13px 17px;border-radius:12px;
    background:var(--panel);border:1.5px solid var(--hair);
    box-shadow:0 14px 34px -14px rgba(60,50,28,.55);
    font-family:var(--font-sans);font-size:14.5px;line-height:1.5;
    letter-spacing:0;text-transform:none;color:#5a5346;text-align:center;
    /* never a click target: cannot swallow a press meant for the stage, cannot
       hold itself open once the pointer leaves the icon */
    pointer-events:none;opacity:0;visibility:hidden;
    transition:opacity .16s ease, transform .16s ease}
  /* icon and tooltip are no longer siblings, so the band asks instead. */
  #bottombar:has(.infobtn:hover) #steptip,
  #bottombar:has(.infobtn:focus) #steptip{
    opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  #steptip b{font-weight:700;color:var(--ink)}
  #steptip .p{color:var(--phos)} #steptip .n{color:var(--nad)}
  #steptip:empty{display:none}
  @media (prefers-reduced-motion:reduce){ #steptip{transition:none} }
  /* review beat's shared entry — #couplebox.in's timing, so verdict, button
     and figure arrive together, after the molecule lands */
  .revin{animation:revin .42s cubic-bezier(.2,.9,.3,1) 1.5s backwards}
  @keyframes revin{
    from{opacity:0;transform:translateY(8px)}
    to  {opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ .revin{animation:none} }
  #stephead em{font-style:normal;color:var(--phos)}

  /* THE STEP CAPTION. Never times out — replaced by the next step's. Only the
     intro and closing screen carry text.
     OUT OF FLOW, ABOVE THE BAR: its height is the only one here that varies,
     and in the bar it changed the camera's bottom reserve — so intro and
     closing were framed differently from the ten steps between. Length is now
     a legibility budget only: it opens upward, so a long one hits the molecule.
     --caph is the reserve while showing (capReservePx) — typed, like --barh.
     Two lines at this size, plus the gap. */
  #rxmsg{--caph:70px;
    position:absolute;bottom:calc(100% + 6px);left:50%;
    transform:translateX(-50%);
    width:min(680px,64%);text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--font-sans);font-size:15.5px;line-height:1.55;
    color:#5a5346;letter-spacing:0;opacity:0;pointer-events:none}
  #rxmsg p{margin:0}

  #rxmsg b{font-weight:700;color:var(--ink)}
  #rxmsg .p{color:var(--phos)}#rxmsg .n{color:var(--nad)}
  #rxmsg.show{opacity:1}
  #rxmsg.in{animation:rxIn .5s ease-out}
  /* both keyframes restate the centring transform — `transform:none` would
     snap the caption half its width right on the last frame */
  @keyframes rxIn{from{opacity:0;transform:translateX(-50%) translateY(5px)}
    to{opacity:1;transform:translateX(-50%)}}
  @media (max-width:920px){ #rxmsg{width:88%;font-size:14px} }

  #ledger{position:sticky;top:0;z-index:6;flex:none;margin:0 0 16px;
    background:linear-gradient(168deg,#fdf0a8 0%,#fbe88c 62%,#f6de79 100%);
    padding:13px 15px 15px;transform:rotate(-1.2deg);transform-origin:top right;
    box-shadow:0 1px 1px rgba(0,0,0,.16), 0 10px 18px -10px rgba(0,0,0,.42)}
  /* ledger is not on the opening screen*/
  #ledger.hid{display:none}
  #ledger.pin{animation:pinup .5s cubic-bezier(.2,.9,.3,1) backwards}
  @keyframes pinup{
    from{opacity:0;transform:rotate(-7deg) translateY(-16px) scale(.96)}
    to  {opacity:1;transform:rotate(-1.2deg)}}
  @media (prefers-reduced-motion:reduce){ #ledger.pin{animation:none} }
  /* the lifted bottom-left corner: a triangle of shade folding off the page */
  #ledger::after{content:'';position:absolute;left:0;bottom:0;width:22px;height:18px;
    background:linear-gradient(48deg,rgba(0,0,0,.13) 0%,rgba(0,0,0,.04) 55%,transparent 56%);
    pointer-events:none}
  /* Type warms up to sit on yellow: --muted and --hair are mixed against cream
     and go muddy here, so heading and rules are ink at low alpha. Meaningful
     colours stay — red net, grey carbons. */
  #ledger .lhead{font-family:var(--font-slab);font-weight:700;font-size:10px;letter-spacing:1.3px;
    text-transform:uppercase;color:rgba(60,50,28,.62);margin-bottom:9px}
  #ledger .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    font-family:var(--font-slab);font-size:14px;color:#4a4232;padding:2.5px 0}
  #ledger .row .v{font-weight:700;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
  #ledger .row.net{border-top:1.5px dashed rgba(60,50,28,.3);margin-top:7px;padding-top:7px}
  #ledger .row.net .v{font-size:20px;color:var(--atp)}
  #ledger .row.prod{border-top:1.5px dashed rgba(60,50,28,.3);margin-top:7px;padding-top:7px}
  /* page colours: green for the NAD⁺/NADH carrier, ink for pyruvate */
  #ledger .row.prod .v{color:var(--nad)}
  #ledger .row.carb{border-top:1.5px dashed rgba(60,50,28,.3);margin-top:7px;padding-top:7px}
  #ledger .row.carb .v{font-size:15px;color:var(--carbon);letter-spacing:.5px}
  #ledger .bump{animation:bump .7s ease}
  @keyframes bump{0%{color:var(--phos);transform:scale(1.32)}100%{transform:scale(1)}}
  /* NET ATP SWELLS AND SETTLES: other rows are counts incrementing, this one
     is the arithmetic changing its mind — the beat the whole page is for. */
  #ledger .row.net .v.bump{animation:netpulse .78s cubic-bezier(.3,.8,.3,1)}
  @keyframes netpulse{
    0%  {transform:scale(1)}
    32% {transform:scale(1.55);color:var(--phos)}
    100%{transform:scale(1)}}

  /* ---------- the chip that carries the count to the ledger ----------
     A number appearing in the corner is a fact you must go and find. What the
     step produced FLIES there and the row ticks only on landing, so the tally
     is visibly the reaction's consequence. TWO ELEMENTS, ONE FLIGHT: outer
     carries x, inner y, on different easings — hence an arc, not a slide. */
  #flylayer{position:fixed;inset:0;z-index:20;pointer-events:none}
  #flylayer .fchip,#flylayer .fy{position:absolute;left:0;top:0;will-change:transform}
  #flylayer .fy{position:static;display:block}
  #flylayer .fchip span.fb{display:block;transform-origin:50% 50%;
    font-family:var(--font-slab);font-weight:700;font-size:13px;line-height:1;
    padding:4px 9px;border-radius:999px;background:var(--panel);
    border:1.5px solid currentColor;white-space:nowrap;
    box-shadow:0 3px 10px -3px rgba(60,50,28,.45)}
  #flylayer .fchip.land span.fb{transform:scale(.5);opacity:0;
    transition:transform .18s ease-in, opacity .18s ease-in}
  @media (prefers-reduced-motion:reduce){ #flylayer{display:none} }

  /* ---------- the coupling box, under the ledger ----------
     The step's energy picture — A SHEET OF PAPER */
  #couplebox{display:none;position:relative;margin:0 0 18px;padding:13px 15px 14px;
    background:#fdfaf2;
    /* the faint ruling of the sheet — the sidebar's own grid, one shade softer */
    background-image:linear-gradient(rgba(120,105,75,.09) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,105,75,.09) 1px,transparent 1px);
    background-size:22px 22px;
    border:none;border-radius:2px;
    transform:rotate(.7deg);transform-origin:top left;
    box-shadow:0 1px 1px rgba(0,0,0,.14), 0 10px 18px -10px rgba(0,0,0,.4)}
  /* the lifted corner, bottom-RIGHT — the ledger lifts its bottom-left */
  #couplebox::after{content:'';position:absolute;right:0;bottom:0;width:22px;height:18px;
    background:linear-gradient(-48deg,rgba(0,0,0,.12) 0%,rgba(0,0,0,.04) 55%,transparent 56%);
    pointer-events:none}
  #couplebox .nbody:last-child,#couplebox .minfo:last-child{margin-bottom:0}
  /* arrives with the molecule it explains (drawCouple). Both keyframes carry
     the sheet's .7° tilt: `transform:none` would animate it flat and leave it
     there, the end state winning over the rule above. The delay lets the
     molecule finish arriving — glow and settle still play when `reviewing`
     flips. `backwards` holds the opening keyframe through the wait, so the box
     never pops in at full strength first. */
  #couplebox.in{animation:cplin .42s cubic-bezier(.2,.9,.3,1) .8s backwards}
  @keyframes cplin{
    from{opacity:0;transform:translateY(10px) scale(.985) rotate(.7deg)}
    to  {opacity:1;transform:rotate(.7deg)}}
  @media (prefers-reduced-motion:reduce){ #couplebox.in{animation:none} }

  /* ---------- reagent tray, LEFT EDGE: the cell's pools ----------
     THE FIVE CARRIERS, NOT A MENU. All five stay on screen, so the one a step
     reaches for is read against the four it does not — and only ONE is ever a
     button: card, border, pulse and lift belong to the live one alone.
     A COLUMN ON THE LEFT — the bottom edge belongs to the step caption, which
     needs the width; five short rows do not.
     THE WIDTH IS RESERVED, ALWAYS. usable() measures this element for how far
     right the lesson sits, and the tray shows only the carriers this step
     touches — without a floor its width would change with the step and slide
     the stage sideways. 152px is the tile width; keep the two in step. */
  #tray{position:absolute;left:26px;top:50%;transform:translateY(-50%);z-index:7;
    min-width:152px;
    display:flex;flex-direction:column;align-items:stretch;gap:3px}
  .tstrip{display:flex;flex-direction:column;gap:2px}
  /* A NAME, NOT AN INSTRUCTION — the live tile's "← Spend 1 ATP" arrow already
     instructs, pointing at the thing to click. Being constant, it also keeps
     the tray's height fixed, which usable() measures off. */
  .tcue{font-family:var(--font-sans);font-weight:600;font-size:11.5px;
    letter-spacing:.2px;color:var(--ink);opacity:.8;margin-bottom:5px;padding-left:2px}
  /* Named so the group cannot be misread as a toolbar. */
  .tcap{font-family:var(--font-slab);font-weight:700;font-size:9.5px;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--muted);opacity:.8;margin-top:5px;padding-left:2px}

  /* ---------- ATP/ADP drawn, not carded ----------
     The two ATP tiles were the one place a student could not see what the step
     did to the carrier: a card saying ATP became a card saying ADP, the moved
     phosphate only ever on the molecule's side. So the pair collapses into ONE
     object that changes — three phosphates to two, and back at steps 7 and 10.
     Two ways to draw it, both needed: the SCHEMATIC (adenosine + three circles)
     makes "the end one comes off" readable at a glance; FULL shows what ATP is
     — 31 heavy atoms, most not phosphate at all. The toggle
     NOT A CARD: drawn on the stage, at stage scale, beside the sugar — leaving
     the name, the prompt and the space the camera insets (usable()).
     THE BOX TAKES NO POINTER unless it is the button (steps 7/10, `.live`). At
     z-7 over the whole left column, while interactive it swallowed every click
     aimed at the molecule behind it — including the marked bond. */
  #carrier{width:400px;position:relative;pointer-events:none;
    padding:7px 8px 6px;border:2.5px solid transparent;border-radius:9px;
    background:none;text-align:left;user-select:none}
  /* No card treatment when live either: the thing to click is the γ phosphate,
     so a pulsing box round the NAME points at the wrong object. The cue is the
     `need` prompt plus the disc behind the bond (#cglow). */
  #carrier.live{cursor:pointer;pointer-events:auto}
  #carrier .need{position:absolute;left:calc(100% + 9px);top:50%;transform:translateY(-50%);
    font-family:var(--font-hand);font-size:15px;color:var(--phos);white-space:nowrap;display:none}
  #carrier.live .need{display:block}
  #carrier .cname{font-family:var(--font-slab);font-weight:700;font-size:14px;
    color:var(--ink);line-height:1.15}
  #carrier .csub{font-family:var(--font-sans);font-size:9.5px;letter-spacing:.6px;
    text-transform:uppercase;color:var(--muted);line-height:1.2;margin-bottom:5px}
  /* The slot the molecule stands in. Fixed height whatever the step is doing —
     the camera's left inset measures off it — and takes no pointer: the only
     button on a spend step is the disc over the bond (#cspot). */
  #carrier .cvis{position:relative;height:470px;pointer-events:none;
    display:flex;flex-direction:column}
  /* ONE SLOT PER MOLECULE, stacked. Slots split the column's height, so two ATP
     come out half the size of one with no second constant — placeCarrierMol
     fits each to its own box and the printed scale is measured off it. */
  #carrier .cslot{position:relative;flex:1 1 0;min-height:0}
  /* The name goes on the SLOT once there is more than one: on a half-run step
     one is ATP and the other still ADP, so one heading can only be half right. */
  #carrier .clab{position:absolute;left:0;top:6px;
    font-family:var(--font-slab);font-weight:700;font-size:15px;color:var(--ink)}
  /* …and only then: with one molecule the column heading is already its name. */
  #carrier .clab{display:none}
  #carrier.multi .clab{display:block}
  #carrier.multi .cname,#carrier.multi .csub{display:none}
  #carrier .cname{font-size:17px}
  /* THE SHRINK, STATED. Fitted to the column, so NOT at the sugars' scale — a
     molecule quietly drawn small is a size claim nobody made. Written from the
     measured specs every frame, not typed. */
  #carrier .cscale{font-family:var(--font-sans);font-size:9.5px;
    color:var(--muted);line-height:1.25;margin-top:3px}


  /* the action button (Begin, and every no-reagent step), inside #bottombar.
     ONE SET OF METRICS FOR EVERY STEP: #bottombar's height is usable()'s bottom
     reserve, so a button changing size between steps re-frames the camera. The
     label is one word every step, the simplest way to guarantee it. */
  #actbtn{visibility:hidden;
    font-family:var(--font-sans);font-weight:700;font-size:17px;letter-spacing:.3px;
    padding:15px 34px;border-radius:var(--radius);cursor:pointer;
    border:2.5px solid var(--ink);background:var(--ink);color:var(--paper);
    box-shadow:0 4px 14px -5px rgba(0,0,0,.45)}
  #actbtn:hover{background:#000;transform:translateY(-2px)}
  #actbtn i{font-size:15px;vertical-align:-1px;margin-left:2px}

  /* the press: a short flash in the DOM. Nothing chemical has happened yet, so
     it stays UI feedback, not an fx.js in-scene effect (SCIENCE.md §5). */
  #actbtn.burst{animation:actpress .3s ease-out}
  @keyframes actpress{
    0%  {transform:scale(1)}
    40% {transform:scale(.96)}
    100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){ #actbtn.burst{animation:none} }


  /* ---------- modal chrome ----------
     Shared by three modals: the ten-steps list, PFK-1's regulation, and the
     mass-action demo. The mass-action demo's OWN styling is massaction.css —
     this page supplies the card it sits in and nothing inside it. */
  .modal{position:fixed;inset:0;z-index:60;display:flex;
    align-items:center;justify-content:center;padding:24px}
  .modal[hidden]{display:none}
  .modal .mback{position:absolute;inset:0;background:rgba(38,33,26,.52);
    backdrop-filter:blur(2px);animation:mfade .22s ease-out}
  .modal .mcard{position:relative;width:min(660px,100%);max-height:100%;
    overflow:auto;background:var(--paper);border:2.5px solid var(--ink);
    border-radius:var(--radius);padding:20px 22px 18px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.6);animation:mrise .26s cubic-bezier(.2,.9,.3,1)}
  @keyframes mfade{from{opacity:0}to{opacity:1}}
  @keyframes mrise{from{opacity:0;transform:translateY(14px) scale(.98)}
                   to  {opacity:1;transform:none}}
  .modal .mkick{font-family:var(--font-slab);font-weight:700;font-size:11.5px;
    letter-spacing:1.5px;text-transform:uppercase;color:#4f5bd5;margin:0 0 5px}
  .modal h2{font-family:var(--font-slab);font-weight:700;font-size:19px;
    margin:0 0 3px;color:var(--ink)}
  .modal .msub{font-family:var(--font-sans);font-size:12.5px;color:var(--muted);
    line-height:1.5;margin:0 0 14px}
  .modal .msub b{color:var(--ink);font-weight:600}
  .modal .mclose{position:absolute;top:10px;right:12px;font-size:22px;
    line-height:1;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px}
  .modal .mclose:hover{color:var(--ink)}
  .modal .mtext{font-size:13px;line-height:1.55;color:#5a5346;margin:13px 0 0}
  .modal .mtext b{color:var(--ink)}

  /* ---------- PATHWAY RAIL, across the top ----------
     TEN NUMBERS, and nothing else: canonical textbook 1-10, the lit one is the
     step on stage, an already-run one clicks back. Names, carriers, one-way
     markers and stage blocking live in Show 10 steps, where they read as a
     list rather than squeezed into a strip. */
  #railbar{position:relative;display:flex;align-items:center;justify-content:center;
    padding:12px 22px 10px;z-index:7;
    /* same dotted paper as stage and sidebar — the numbers sit on the page, so
       the bar itself is not a surface */
    background-color:var(--paper);
    background-image:radial-gradient(var(--paper-line) 1.4px, transparent 1.4px);
    background-size:26px 26px; background-position:13px 13px}
  /* absolute so the rail stays centred however wide the word is. */
  #pagetitle{position:absolute;left:22px;top:50%;transform:translateY(-50%);
    margin:0;font-family:var(--font-marker);font-weight:700;font-size:24px;
    letter-spacing:.2px;color:var(--ink)}
  #rail{display:flex;align-items:center;gap:10px}
  .rnum{width:30px;height:30px;padding:0;border-radius:50%;
    border:2px solid var(--hair);background:var(--panel);color:var(--muted);
    font-family:var(--font-slab);font-weight:700;font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  /* a step already run is filled — the trail you can count and click back into */
  .rnum.past{background:var(--ink);border-color:var(--ink);color:var(--panel);
    opacity:.45}
  .rnum.past:hover{opacity:1}
  .rnum.cur{background:var(--ink);border-color:var(--ink);color:var(--panel);
    box-shadow:0 3px 10px -3px rgba(0,0,0,.5);cursor:default}
  /* THE STEP YOU ARE ON: awake but empty, from yours-to-run until it lands.
     Neither dim nor filled — happening, not yet made. */
  .rnum.run{opacity:1;border-color:var(--ink);color:var(--ink);border-width:2.5px;
    box-shadow:0 0 0 3px rgba(43,39,35,.1);cursor:default}
  /* not run yet: keeps its number so the ten are always ten, but not a place
     you can go — skipping ahead hands over a molecule you never made. */
  .rnum.future{opacity:.4;cursor:default}

  /* The sidebar scrolls, not the card. */
  #card{overflow:visible;flex:none}
  #stepnote{padding-top:2px}
  .note .nhead{font-family:var(--font-slab);font-weight:700;font-size:14px;
    letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
  .note .nhead.reg{color:var(--phos)}
  .note .nhead.irr{color:var(--atp)}
  .note .nhead.rev{color:var(--nad)}
  .note .nbody{font-size:13px;line-height:1.5;color:#5a5346;margin:0 0 9px}
  /* the door to the mass-action demo, under the reversibility verdict it backs
     up. The verdict is a heading and nothing else, so this link is its only
     explanation — the demo is the picture, a paragraph is not. */
  .note .minfo{font-family:var(--font-sans);font-weight:600;font-size:12px;
    letter-spacing:.2px;color:#4f5bd5;background:none;border:none;padding:0;
    cursor:pointer;text-decoration:underline;text-underline-offset:3px;
    text-decoration-thickness:1.5px;margin:-4px 0 9px}
  /* after a heading there is no descender to close up, so drop the -4px. */
  .note .nhead + .minfo{margin-top:0}
  .note .minfo:hover{color:#7b3fe4}
  .note .nbody:last-child{margin-bottom:0}
  /* the coupled-reaction figure: two opposed arrows, height standing in for
     free energy — no ticks, no numbers, since it makes no quantitative claim
     (coupleFig). Coupled half tinted orange/green, as #rxmsg .p and .n. */
  .note .nhead.cpl-h{color:var(--ink)}
  .cpl{display:block;width:100%;height:auto;margin:2px 0 9px}
  .cpl .ml{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
  .cpl .mh{fill:var(--ink)}
  .cpl .cl{fill:none;stroke-width:2.2;stroke-linecap:round}
  .cpl.p .cl{stroke:var(--phos)} .cpl.p .ch{fill:var(--phos)} .cpl.p .cs{fill:var(--phos)}
  .cpl.n .cl{stroke:var(--nad)}  .cpl.n .ch{fill:var(--nad)}  .cpl.n .cs{fill:var(--nad)}
  .cpl .cm,.cpl .cs{font-family:var(--font-slab);font-weight:700;font-size:14px}
  .cpl .cm{fill:var(--ink)}
  /* THE CURVE VIEW, a second reading of the same step. No ticks, no numbers:
     the page has no per-step ΔG and a proportioned curve would assert one. It
     adds SHAPE — reaction alone as one trace, coupled as another, so "coupling
     flips the direction" is seen, not inferred. The barrier is drawn because
     the mass-action modal already said a molecule must climb something. */
  .cpl .rc{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .cpl .rc.alone{stroke:var(--muted);stroke-dasharray:5 4;opacity:.85}
  /* uncoupled step's single trace: ink — no carrier to tint it with */
  .cpl .rc.solo{stroke:var(--ink)}
  .cpl.p .rc.with{stroke:var(--phos)} .cpl.n .rc.with{stroke:var(--nad)}
  .cpl .et{font-family:var(--font-sans);font-weight:600;font-size:10px}
  .cpl .et.alone{fill:var(--muted)}
  .cpl.p .et.with{fill:var(--phos)} .cpl.n .et.with{fill:var(--nad)}
  /* tighter than the modal's tabs: a 372px panel, and the strip must not read
     louder than the figure under it. */
  .note .ftabs{display:flex;gap:3px;margin:1px 0 3px}
  .note .ftabs button{font-family:var(--font-sans);font-weight:600;font-size:10.5px;
    letter-spacing:.3px;padding:3px 9px 4px;border:none;background:none;
    color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .note .ftabs button:hover{color:var(--ink)}
  .note .ftabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
  /* the axis is a hint, not a scale — hairline, no ticks */
  .cpl .axl{fill:none;stroke:var(--hair);stroke-width:1.5}
  .cpl .axh{fill:var(--hair)}
  .cpl .ax{font-family:var(--font-sans);font-size:9px;letter-spacing:1.1px;
    text-transform:uppercase;fill:var(--muted)}

  /* base sizing fits the sidebar; #pfkbody takes the modal's extra room. */
  .effrow{display:flex;gap:9px;margin:0 0 10px}
  #pfkbody .mtext{margin:0 0 14px}
  #pfkbody .effrow{margin:0 0 14px;gap:14px}
  #pfkbody .eff{padding:11px 13px}
  #pfkbody .eff .e{font-size:12.5px}
  .eff{flex:1;padding:8px 9px;border-radius:7px;background:rgba(0,0,0,.03)}
  .eff .eh{font-family:var(--font-slab);font-weight:700;font-size:10.5px;letter-spacing:.8px;
    text-transform:uppercase;margin-bottom:5px}
  .eff.on .eh{color:#1f6146}.eff.off .eh{color:#a8371f}
  .eff .e{font-size:12px;line-height:1.35;margin-bottom:5px;color:var(--muted)}
  .eff .e:last-child{margin-bottom:0}
  .eff .e b{display:block;color:var(--ink);font-weight:600}

  /* THE UTILITY CONTROLS SIT IN THE BOTTOM CORNERS, quiet. Restart throws work
     away and PNG is a side errand, so neither may be more inviting than the
     lesson's button between them — and the top of the stage is for the
     molecule's name. PNG takes #restart's muted treatment, overriding
     sandbox.css's ink chip; the pathway map's door stacks above Restart. */
  #allsteps{position:fixed;right:26px;bottom:64px;top:auto}
  #restart,#savepng,#allsteps{z-index:20;
    font-family:var(--font-sans);font-weight:600;font-size:13px;letter-spacing:.5px;
    color:var(--muted);background:transparent;border:2px solid var(--hair);
    border-radius:var(--radius);padding:6px 15px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px}
  /* fixed: holds the SCREEN's corner past the readout column, and the scrolling
     sidebar cannot carry it away */
  #restart{position:fixed;right:26px;bottom:22px;top:auto}
  #savepng{position:absolute;left:26px;bottom:22px;top:auto}
  /* room under the last readout so the buttons never land on it */
  #side{padding-bottom:110px}
  #restart:hover,#savepng:hover,#allsteps:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ---------- all ten steps, in one column ----------
     THE DETAIL LIVES HERE now the rail is ten numbers: each step's product,
     the carrier it moved, the one-way marker, the star into PFK-1's regulation,
     under the four stage headings. Owns these styles outright. */
  #stepsbody .sgroup{margin-top:14px}
  #stepsbody .sgroup:first-child{margin-top:6px}
  #stepsbody .sghead{display:flex;align-items:baseline;gap:9px;
    padding:0 0 4px;border-bottom:1px solid var(--hair);margin-bottom:3px}
  #stepsbody .sghead .bt{font-family:var(--font-slab);font-weight:700;font-size:12px;
    letter-spacing:1.1px;text-transform:uppercase;color:var(--ink)}
  #stepsbody .sghead .bd{font-family:var(--font-slab);font-weight:700;
    font-size:12px;color:var(--muted)}

  #stepsbody .rrow{display:flex;align-items:center;gap:9px;min-height:34px;
    padding:2px 5px;border-radius:6px}
  /* nothing dimmed — the one place showing the whole pathway, so an unrun step
     is still fully legible */
  #stepsbody .rrow.cur{background:rgba(245,196,54,.34)}
  #stepsbody .rdotwrap{flex:none;display:flex;align-items:center}
  #stepsbody .rdot{width:24px;height:24px;border-radius:50%;
    border:2px solid var(--hair);background:var(--panel);
    font-family:var(--font-slab);font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;color:var(--muted)}
  /* filled means RUN — the same reading the rail's numbers use */
  #stepsbody .rrow.done .rdot{background:var(--ink);border-color:var(--ink);
    color:var(--panel)}
  #stepsbody .rrow.cur .rdot{border-color:var(--ink);color:var(--ink);
    border-width:2.5px;box-shadow:0 0 0 3px rgba(43,39,35,.1)}
  #stepsbody .rlab{flex:1;min-width:0;font-family:var(--font-sans);font-size:14px;
    line-height:1.3;color:var(--ink)}
  /* only a COMPLETED row rewinds — the others are not places you can go */
  #stepsbody .rrow.done{cursor:pointer}
  #stepsbody .rrow.done:hover .rlab{color:var(--phos)}
  /* the one-way marker: only three steps carry it, and that is the lesson */
  #stepsbody .rirr{flex:none;padding-left:6px;font-size:14px;line-height:1;
    color:var(--phos);opacity:.75}
  /* THE CARRIER CHIP: which carrier this step spent or made, which way. Page
     colours, and the ledger's sign, so the chips visibly sum to the post-it. */
  #stepsbody .rchip{flex:none;margin-left:6px;padding:1px 5px;border-radius:4px;
    font-family:var(--font-slab);font-weight:700;font-size:11px;letter-spacing:.4px;
    white-space:nowrap}
  #stepsbody .rchip.spend{color:var(--phos);background:rgba(224,123,31,.13)}
  #stepsbody .rchip.atp  {color:var(--atp); background:rgba(200,69,46,.13)}
  #stepsbody .rchip.nadh {color:var(--nad); background:rgba(47,125,92,.13)}
  /* THE STAR IS A DOOR, not a status — one step carries it, the committed one */
  #stepsbody .rstar{flex:none;margin-left:4px;padding:2px 3px;border:none;
    background:none;cursor:pointer;font-size:14px;line-height:1;
    color:var(--phos);opacity:.85}
  #stepsbody .rstar:hover{opacity:1;transform:scale(1.18)}

  /* ---------- the ending fork ----------
     THE THREE FATES ARE A MODAL, behind the last button.  */
  #forkbody{display:flex;gap:14px;align-items:stretch}
  #forkbody .door{flex:1;padding:12px 14px;background:rgba(255,255,255,.6);
    border:2px solid var(--ink);border-radius:9px 12px 10px 11px}
  #forkbody .door .dh{font-family:var(--font-slab);font-weight:700;font-size:14px;color:var(--ink);margin-bottom:4px}
  #forkbody .door .dh i{color:var(--muted);font-weight:500}
  #forkbody .door .db{font-family:var(--font-sans);font-size:12.5px;line-height:1.45;color:#5a5346}
  @media (max-width:920px){ #forkbody{flex-direction:column} }

  @media (max-width:920px){
    /* Stacked: rail, stage, readouts. Ten numbers fit across a phone, which is
       what makes the rail survive one. */
    #app{grid-template-rows:auto 52vh 1fr}
    #railbar{grid-column:1;padding:10px 14px 8px;flex-wrap:wrap;gap:6px}
    /* narrow: the rail needs the full row, so the title sits above it in flow */
    #pagetitle{position:static;transform:none;flex:0 0 100%;font-size:17px}
    #side{padding:0 16px 24px}
    #ledger{padding:9px 12px}
    #ledger .row{font-size:12px;padding:1.5px 0}
    #ledger .lhead{margin-bottom:5px}
    #tray{left:12px;top:16px;transform:none}
    /* Both corners tighten in; the caption band between them is narrower here. */
    #restart,#savepng,#allsteps{padding:5px 12px;font-size:12px}
    #restart,#savepng{bottom:16px}
    #savepng{left:14px} #restart{right:14px}
    #allsteps{right:14px;bottom:54px}
    #bottombar{bottom:18px}
  }
</style>
</head>
<body>
<div id="app">
  <!-- THE PATHWAY RAIL, top, spanning both columns: read left-to-right it costs
       the stage no width, which is what the molecules needed. Title absolutely
       positioned so it costs the rail no width and leaves it centred. -->
  <div id="railbar">
    <h1 id="pagetitle">Glycolysis</h1>
    <div id="rail"></div>
  </div>
  <div id="stage">
    <!-- UNDER the canvas: glow shows through the alpha, so it sits behind the
         molecule rather than over it — see .sglow -->
    <div id="spotglow"></div>
    <!-- the same disc on the carrier's own bond — see #cglow -->
    <div id="cglow"><div class="sglow"></div><span class="chint">Break off a phosphate group</span></div>
    <canvas id="gl"></canvas>
    <div id="stagepulse"></div>
    <div id="plates" aria-live="polite"></div>
    <!-- the click targets that sit ON the molecule — see .spot -->
    <div id="spots"></div>
    <!-- the carrier's own target, on the bond the disc marks — see #cspot -->
    <button id="cspot" class="spot" type="button" hidden></button>
    <div id="tray"></div>
    <!-- ONE element so the camera has one thing to measure. Always full height
         (button hidden with `visibility`, not `display`) so framing is identical
         whether or not a button or caption shows. -->
    <div id="bottombar">
      <!-- THE STEP'S HEADING: "Step 4 (The split)" before, "Step 4 complete"
           after. One slot, so both beats of a step are titled in one place.
           Holds its height when empty (visibility), so the reserved bar never
           changes. -->
      <div id="stephead"></div>
      <!-- step caption, opened by the ⓘ. Child of the BAND, not the heading:
           centred on the stage, and out of reach of the heading's innerHTML. -->
      <div id="steptip" role="tooltip"></div>
      <button id="actbtn"></button>
      <!-- the inner <p> is load-bearing: #rxmsg centres with flex, and flex on
           the element that HOLDS the rich text makes every <b> and bare text
           node its own flex item, which shreds the sentence into columns -->
      <div id="rxmsg" aria-live="polite"><p></p></div>
    </div>
    <button id="savepng"><i class="ph-bold ph-download-simple"></i> PNG</button>
  </div>
  <!-- Restart is PAGE level, not stage: it resets the whole lesson (rail and
       readouts too), so it sits at the screen's bottom-right.
       Above it, the whole pathway at once — the rail is ten numbers, this is
       the map: all ten steps, named and grouped, in one readable column. -->
  <button id="allsteps"><i class="ph-bold ph-list-numbers"></i> Show 10 steps</button>
  <button id="restart"><i class="ph-bold ph-arrow-counter-clockwise"></i> Restart</button>
  <!-- Not a panel with its own voice — a stack of readouts beside the stage:
       tally, the step's energy picture, the step's commentary. -->
  <div id="side">
    <!-- starts away: it is pinned up on Begin — see placeLedger -->
    <div id="ledger" class="hid"></div>
    <div id="couplebox" class="note"></div>
    <div id="card"><div id="stepnote" class="note"></div></div>
  </div>
</div>

<!-- Where pyruvate goes, behind the last button. -->
<div id="forkmodal" class="modal" hidden>
  <div class="mback"></div>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="forktitle">
    <button class="mclose" aria-label="Close">&times;</button>
    <div class="mkick">What's next</div>
    <h2 id="forktitle">Where the two pyruvate go</h2>
    <p class="msub">All three answers are the same question — <b>where does NAD⁺
      come from?</b> — because that is the constraint that picks one.</p>
    <div id="forkbody"></div>
  </div>
</div>

<!-- All ten steps in one column, behind the button above Restart. -->
<div id="stepsmodal" class="modal" hidden>
  <div class="mback"></div>
  <!-- No title, no standfirst: the button and the four stage headings say what
       this is. The list is the whole content. -->
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="stepskick">
    <button class="mclose" aria-label="Close">&times;</button>
    <div class="mkick" id="stepskick">The pathway</div>
    <div id="stepsbody"></div>
  </div>
</div>

<!-- PFK-1's regulation, behind the star on step 3's row in the ten-steps list.
     A MODAL for the mass-action demo's reason: a side road off the pathway,
     which read inline competed with the step the student is running. -->
<div id="pfkmodal" class="modal" hidden>
  <div class="mback"></div>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="pfktitle">
    <button class="mclose" aria-label="Close">&times;</button>
    <div class="mkick">Regulation</div>
    <h2 id="pfktitle"></h2>
    <div id="pfkbody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="palette.js"></script>
<script src="molecules.js"></script>
<script src="skel.js"></script>
<script src="mol-glycolysis.js"></script>
<!-- the carrier is drawn from `atpSkel`, not the conformer — see ATP below -->
<script src="mol-compare.js"></script>
<script src="scene.js"></script>
<script src="fx.js"></script>
<script src="kit/motion.js"></script>
<script src="kit/molgraph.js"></script>
<script src="kit/fit.js"></script>
<script src="kit/stagekit.js"></script>
<script src="atomkit.js"></script>
<!-- the mass-action modal's physics and DOM; this page supplies the scenarios -->
<script src="massaction/massaction.js"></script>
<!-- WHY A STEP CAN RUN BACKWARDS, shown rather than asserted. The page says it
     twice in sentences about "concentration" that land only if you already know
     what concentration DOES. A MODAL, not a panel — a general fact about
     enzymes, not about glycolysis, and this page is already the densest in the
     sandbox. Everything inside #massbox is built by massaction.js. -->
<div id="massmodal" class="modal" hidden>
  <div class="mback"></div>
  <div class="mcard" role="dialog" aria-modal="true" aria-label="Mass action">
    <button class="mclose" aria-label="Close">&times;</button>
    <div id="massbox"></div>
  </div>
</div>
<script>
"use strict";
/* =============================================================================
 *  GLYCOLYSIS — glucose → 2 pyruvate, and where the ATP/NADH actually come from
 * =============================================================================
 *  PARADIGM: pathway. Not solvation (no water/H-bonds/electrostatics), not
 *  assembly. Scripted TRANSFORMATIONS plus a running LEDGER, so this page shares
 *  only scene.js's bootstrap and fx.js's effects — SCIENCE.md §10.
 *
 *  AUDIENCE: intro college biology (Bio 101), not AP — a content decision, and
 *  why all TEN canonical steps run: the course holds students to the enzymes,
 *  PFK-1 as regulated committed step, and why a phosphate charges ADP at 7 and
 *  10 but not 8.
 *
 *  THE FIVE STAGES SURVIVE AS GROUPING, NOT CONTENT. Ten unstructured clicks is
 *  a list; the stages make the ARC legible — spend 2, halve, oxidise once,
 *  collect 4. The ten-steps list groups by stage and hangs each stage's
 *  bookkeeping delta off its heading, the level at which a delta means anything.
 *
 *  NO ΔG NUMBERS. Thermodynamics taught as REVERSIBILITY — steps 1, 3, 10
 *  effectively irreversible, the other seven near equilibrium — because that is
 *  what regulation and the gluconeogenesis bypass hang off, and a per-step
 *  kJ/mol table would be typed numbers nothing here can check.
 *
 *  THE ×2 IS SHOWN, NEVER LABELLED. After the split both halves stay on screen
 *  in parallel lanes and every later step visibly fires twice. A "×2" caption is
 *  exactly what students drop on the exam.
 *
 *  DERIVED STATE, NOT MUTATED STATE. `done` is the only mutable state; species,
 *  pools, ledger are pure functions of it (speciesAt/poolAt/ledgerAt). Stepping
 *  BACKWARD is then free — re-render at a lower index, never invert a reaction.
 * ========================================================================== */

/* ---------- shared stage (kit/stagekit.js over scene.js) + effects (fx.js) ----
 * Lesson.create is Stage.create plus the loop, the resize hook, and the two
 * clocks (kit/motion.js) this page's beats ride — see `later` below, which is
 * now one line over Motion rather than an array of setTimeout handles.
 *
 * THE FIT IS THIS PAGE'S OWN, deliberately: `fitFor` measures LANE LAYOUTS, not
 * a molecule's bounding box, and the reserves below are chrome only this lesson
 * has. So no `boxes` is handed to Lesson; `onResize` runs computeFit instead,
 * and cam.r stays the single measure of "how far back" that orthoFrustum
 * converts. */
const canvas=document.getElementById('gl');
let userZoom=false;
// A constant because restart returns the camera to it. Nothing else moves theta.
const OPEN_THETA=0.10;
const L=Lesson.create(canvas,{
  // Orthographic: under perspective the nearer lane reads as the bigger
  // molecule (why side-by-side pages never swing theta). No foreshortening
  // keeps the two halves after step 4 visibly identical.
  ortho:true,
  cam:{theta:OPEN_THETA,phi:1.30,r:26}, phiMin:0.4, phiMax:2.6, rMin:9, rMax:80,
  onZoom:()=>{userZoom=true;},
  focus:false,                       // nothing on this page ghosts a molecule
  onResize:()=>computeFit(),
});
const {scene,camera,renderer,root,cam,applyCam,resize}=L;
const FXi=L.fx, MO=L.motion;
// atomkit, for ONE thing: the ± badge — the notation the bonding lesson already
// taught (`molecule-builder.html`), so no second notation for the same idea.
// Nothing else used: no valence dots, no element letters, no 2D view.
const KIT=AtomKit.create(THREE);
const M=MolLib.MOLECULES, PAL=MolLib.PALETTE;

/* THE CARRIER IS THE IDEALIZED ATP (`atpSkel`, mol-compare.js), not the PubChem
 * conformer (`atp`) — same molecule, same scale family, same `gly` block, so a
 * one-name switch. A conformer folds its phosphate tail over the ribose: true
 * in solution, unreadable here, where the lesson is a straight chain of three
 * phosphates losing the end one. Declared schematic (MolecularGeometry.md
 * §1.6); both derivations canonicalise to the same PubChem record under
 * tools/check-handedness.js, so no stereochemistry is traded for legibility.
 * Every ATP fact here — `gamma`, `pg`, `spent`, `phosphates` — comes off this
 * spec, so the two never drift. See molecule-viewer.html for both side by side. */
const ATP=M.atpSkel;
// …and NADH for the same reason: a conformer folds its tail over the part the
// step is about — here the nicotinamide C4 and its two hydrogens. So carriers
// are ideal geometry and the sugars beside them measured.
const NADH=M.nadhSkel;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

/* =============================================================
 *  THE LESSON SCRIPT
 * ============================================================= */

// Cell pools, chosen so the pools THEMSELVES show the net yield: ATP 4 → 6
// (net +2) after dipping to 2; NAD⁺ runs to exactly 0, setting up the
// fermentation fork at the end.
const POOL0={ATP:4, ADP:4, NAD:2, NADH:0, Pi:2};

// `sub` says what the MOLECULE is, never what the pathway has done — the number
// above it is a pool, not a running total; "energy spent/made" would duplicate
// and could contradict the ledger's rows. Charged/discharged also puts ATP:ADP
// in the same shape as NAD⁺:NADH — both carriers that cycle, not fuels.
// Couple table names carriers as printed ("NAD+"), the tray as the pools are
// keyed ("NAD"). One place converts.
const carrierKey=n=>n==='NAD+'?'NAD':n;

// One entry per user action — the ten canonical steps. `species` is the lanes'
// resulting contents, so the lane count doubling at the split falls out of the
// data. `rev:false` marks the three effectively irreversible steps; those same
// three are the regulated ones gluconeogenesis must bypass — the point, not a
// coincidence.
const STEPS=[
  { n:1, stage:1, reagent:'ATP', need:'Spend 1 ATP',
    species:['g6p'], enz:'Hexokinase', hook:'Trapping', rev:false,
    pool:{ATP:-1,ADP:+1}, spent:1, fx:'in', anchor:'p3',
    couple:{ up:true, cin:'ATP', cout:'ADP', tone:'p' },
    msg:`<b>Hexokinase.</b> A <span class="p">phosphate</span> from ATP goes onto carbon 6 — the carbon sticking out of the ring, so the <b>ring itself is untouched</b>. The negative charge <b>locks the sugar in the cell</b>: no GLUT transporter will carry a charged molecule back out.` },

  { n:2, stage:1, reagent:null,
    act:'Open the ring and shift the carbonyl',
    species:['f6p'], enz:'Phosphoglucose isomerase', hook:'Shuffling', rev:true,
    fx:'open',
    // RUN BY BREAKING THE BOND. `at` names the spec's own bond (gly.open, the
    // anomeric C1–O5), so the target follows the bond on screen — not a typed
    // coordinate a rebuilt spec would leave behind. Same contract as `anchor`.
    spot:{ at:'open', say:'click to open the ring' },
    msg:`<b>Phosphoglucose isomerase.</b> The ring <b>opens</b> — it has to, because moving the C=O from carbon 1 to carbon 2 happens on the straight chain. Same formula, C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>: a glucose has become a fructose. Worth doing because an <b>aldose</b> cannot be cut into two phosphorylatable halves and a <b>ketose</b> can. <i>Everything from here is drawn open, so the six carbons stay countable.</i>` },

  { n:3, stage:1, reagent:'ATP', need:'Spend 1 more ATP',
    species:['f16bp'], enz:'Phosphofructokinase-1 (PFK-1)', hook:'Symmetry & instability',
    rev:false, commit:true,
    pool:{ATP:-1,ADP:+1}, spent:1, fx:'in', anchor:'p1',
    couple:{ up:true, cin:'ATP', cout:'ADP', tone:'p' },
    msg:`<b>PFK-1.</b> A second ATP phosphorylates carbon 1. Charged at <b>both ends</b>, the molecule is symmetrical and unstable — primed to split. This is the <b>committed step</b>.` },

  { n:4, stage:2, reagent:null,
    act:'Cleave the C3–C4 bond',
    species:['dhap','g3p'], enz:'Aldolase', hook:'The split', rev:true,
    fx:'split',
    // The spec already names the bond aldolase breaks (`gly.cleave`, the one the
    // fx flashes) — no second copy of where it is. Same contract as step 2.
    spot:{ at:'cleave', say:'click to split it' },
    msg:`<b>Aldolase.</b> The unstable six-carbon sugar is cleaved down the middle into <b>two different three-carbon molecules</b>, DHAP and G3P, each keeping one <span class="p">phosphate</span> — which is what the two ATP bought.` },

  { n:5, stage:2, reagent:null,
    act:'Convert DHAP to G3P',
    species:['g3p','g3p'], enz:'Triose-phosphate isomerase', hook:'Streamlining', rev:true,
    fx:'iso',
    msg:`<b>Triose-phosphate isomerase.</b> DHAP becomes a second <b>G3P</b>. The lanes are now identical, so everything from here happens <b>twice</b>.` },

  { n:6, stage:3, reagent:'NAD', need:'Load both NAD⁺',
    species:['bpg13','bpg13'], enz:'Glyceraldehyde-3-phosphate dehydrogenase', hook:'Electron theft', rev:true,
    pool:{NAD:-2,NADH:+2,Pi:-2}, nadh:2, fx:'ox', anchor:'p1',
    couple:{ up:false, plus:'Pi', cin:'NAD+', cout:'NADH', tone:'n' },
    // TWO G3P, TWO NAD⁺ — the arithmetic steps 7 and 10 also make you do.
    // `aldehydeH` is the spec's name for the hydrogen the dehydrogenase takes;
    // spotPair turns it into the C–H bond that breaks.
    perLane:true,
    spot:{ at:'aldehydeH', say:'click the H that NAD⁺ takes' },
    msg:`<b>G3P dehydrogenase.</b> Each G3P gives up two electrons and a proton to <span class="n">NAD⁺</span>, making <span class="n">NADH</span> (2 in all), and a <span class="p">free phosphate</span> from the cytosol takes the empty spot — <b>no ATP spent</b>. The pathway's only oxidation.` },

  { n:7, stage:4, reagent:'ADP', need:'Charge 2 ADP',
    species:['pga3','pga3'], enz:'Phosphoglycerate kinase', hook:'Break-even', rev:true,
    pool:{ADP:-2,ATP:+2}, made:2, fx:'out', anchor:'p1',
    couple:{ up:false, cin:'ADP', cout:'ATP', tone:'p' },
    // THE MIRROR OF STEP 1, same gesture. `hot` is the spec's name for the
    // high-energy phosphate; spotPair makes it the P–O bond that breaks — the
    // same bond step 1 breaks on ATP, only here the phosphate leaves the sugar
    // and makes ATP.
    // ONE CLICK PER LANE — see PER-LANE STEPS. Each lane hands off a phosphate
    // and charges an ADP: 2 ATP, exactly what phase 1 cost. One click plus
    // "counted twice" is the version a student misses.
    perLane:true,
    spot:{ at:'hot', say:'click to hand it to ADP' },
    msg:`<b>Phosphoglycerate kinase.</b> That phosphate has a higher transfer potential than ATP's, so it goes straight to ADP. Two lanes, <b>2 ATP</b> — exactly what phase 1 cost. This is <b>substrate-level phosphorylation</b>.` },

  { n:8, stage:4, reagent:null,
    act:'Move the phosphate to C2',
    species:['pga2','pga2'], enz:'Phosphoglycerate mutase', hook:'Position shift', rev:true,
    fx:'move', anchor:'p3', dest:'p2',
    msg:`<b>Phosphoglycerate mutase.</b> The remaining phosphate simply moves from carbon 3 to carbon 2. On C3 it <b>could not</b> charge ADP; this move sets up the step that changes that.` },

  { n:9, stage:4, reagent:null,
    act:'Remove a water',
    species:['pep','pep'], enz:'Enolase', hook:'High-energy setup', rev:true,
    fx:'lose', anchor:'oh3',
    msg:`<b>Enolase.</b> A <b>water</b> leaves, forming a C=C and trapping the molecule as an <b>enol</b>. Nothing was added — the rearrangement itself loads strain into the phosphate bond.` },

  { n:10, stage:4, reagent:'ADP', need:'Charge 2 more ADP',
    species:['pyruvate','pyruvate'], enz:'Pyruvate kinase', hook:'Net profit', rev:false,
    pool:{ADP:-2,ATP:+2}, made:2, fx:'out', anchor:'p2',
    couple:{ up:false, cin:'ADP', cout:'ATP', tone:'p' },
    // same gesture as 7 — PEP names its phosphate `hot` too, and the same
    // two clicks for the same reason
    perLane:true,
    spot:{ at:'hot', say:'click to hand it to ADP' },
    msg:`<b>Pyruvate kinase.</b> The last phosphate goes to ADP and the enol snaps to keto: <b>pyruvate</b>. Two more ATP, so <b>net 2 ATP and 2 NADH</b> per glucose — about <b>5%</b> of its energy. The rest is still in those two pyruvate.` },
];

// The five stages as GROUPING over the ten steps. `delta` is the bookkeeping
// change students should recite; printed on the rail.
//
const STAGES=[
  // Stage 0 is a STATE, not a group of steps: where the page opens and Restart
  // returns to. No step to list.
  { n:0 },
  { n:1, block:'Priming',    label:'Priming: spend 2 ATP',    delta:'−2 ATP' },
  { n:2, block:'Cleavage',   label:'Cleavage: 6C → 3C + 3C',  delta:'1 → 2' },
  { n:3, block:'Oxidation',  label:'Oxidation: make 2 NADH',  delta:'+2 NADH' },
  { n:4, block:'Payoff',     label:'Payoff: make 4 ATP',      delta:'+4 ATP' },
  // Stage 5 is a STATE too, and step-less: reaching it puts the tally on screen
  // — ledger net, fork, closing note.
  { n:5 },
];

// Derived, never typed, so a step moved between stages re-groups the list.
const stageSteps=n=>STEPS.filter(s=>s.stage===n);

// A STAGE'S DELTA IS A RECORD, NOT A PROMISE — true only once its steps are
// done, so no number ("−2 ATP") is given away early; the dip below zero has to
// stay a surprise.
const stageComplete=n=>{
  const k=stageSteps(n);
  if(!k.length) return done>=nSteps;               // the two step-less states
  return !intro && STEPS.indexOf(k[k.length-1]) < done;
};

/* ---- the regulation panel: PFK-1, and why the cell controls step 3 ----------
 * On the step, not the stage, so it appears exactly when PFK-1 is next. The
 * three irreversible steps come from STEPS' `rev` flags, not a second list. */
const PFK={
  title:'PFK-1 — the committed step',
  body:`Until now the sugar could still leave for glycogen or the pentose phosphate
    pathway. Once PFK-1 acts, the carbon has no fate but pyruvate — and a pathway
    is regulated at its <b>first irreversible step</b>.`,
  on:[ ['AMP','the cell is short of energy'],
       ['Fructose-2,6-bisphosphate','signals plenty of glucose'] ],
  off:[ ['ATP','the cell already has energy'],
        ['Citrate','the Krebs cycle is backed up'] ],
  note:`This is <b>allosteric</b> regulation — the effectors bind away from the
    active site and change the enzyme's shape. ATP is both PFK-1's substrate and
    its inhibitor: at high concentration it binds a second, lower-affinity site
    and slows the enzyme. That is negative feedback.`
};

/* =============================================================
 *  DERIVED STATE — everything is a function of `done`
 * ============================================================= */
let done=0;                                   // how many STEPS are complete
// The one state NOT derived from `done`: at done=0 the next action is already a
// stage-1 step, so without it the page opens on "Investment" and the student
// never meets glucose. Gates the reading, not the chemistry.
let intro=true;
const nSteps=STEPS.length;
const stepAt=i=>STEPS[i];                     // the step that runs NEXT at done=i
const speciesAt=i=>i===0?['glucose']:STEPS[i-1].species;
/* ---------- PER-LANE STEPS ----------
 * After the split everything happens TWICE; steps 7 and 10 are where that costs
 * the student something. One click reporting "+2" is the version where a student
 * reads the two and never counts them. So a `perLane` step is two half-steps:
 * click a lane, its phosphate leaves and one ADP charges; it lands when both do.
 *
 * `laneDone` holds the lane indices converted IN THE CURRENT STEP — the single
 * source for the ledger's partial, which ADP is now ATP, which lanes still have
 * a target. Cleared when the step lands and by rewind/restart. */
let laneDone=new Set();
const isPerLane=st=>!!st&&!!st.perLane&&st.species.length>1;
// Fraction of the current step already run, as lanes. Zero unless a per-lane
// step is half-way — the only state with no step index.
function halfRun(){
  const st=stepAt(done);
  return (isPerLane(st) && laneDone.size) ? laneDone.size/st.species.length : 0;
}
// Both tallies fold it in, so ledger, pools and tray see a half-run step
// without knowing it exists.
function poolAt(i){ const p=Object.assign({},POOL0);
  for(let k=0;k<i;k++){ const d=STEPS[k].pool||{}; for(const q in d) p[q]+=d[q]; }
  if(i===done){ const f=halfRun(), d=(STEPS[i]||{}).pool||{};
    for(const q in d) p[q]+=d[q]*f; }
  return p; }
function ledgerAt(i){ const L={spent:0,made:0,nadh:0};
  for(let k=0;k<i;k++){ const s=STEPS[k];
    L.spent+=s.spent||0; L.made+=s.made||0; L.nadh+=s.nadh||0; }
  if(i===done){ const f=halfRun(), s=STEPS[i]||{};
    L.spent+=(s.spent||0)*f; L.made+=(s.made||0)*f; L.nadh+=(s.nadh||0)*f; }
  return L; }
// stage being LOOKED at: the next step's, or the tally stage once all are done.
const stageAt=i=>intro?0:(i>=nSteps?5:STEPS[i].stage);
const carbonsAt=i=>speciesAt(i).reduce((s,k)=>s+M[k].gly.carbons,0);

// WHAT A STEP LEAVES ON THE STAGE, named as the plate names it, so a numbered
// row and the molecule it made are the same word. The `2 ×` is not decoration:
// it is the only text saying everything after the split happens twice.
// SYSTEMATIC NAME, since the list has the width: "F1,6-BP" means nothing until
// you know what it stands for.
function productOf(st){
  const keys=st.species, nameOf=k=>M[k].name;
  return keys.every(k=>k===keys[0]) && keys.length>1
    ? `${keys.length} × ${nameOf(keys[0])}`
    : keys.map(nameOf).join(' + ');
}

// THE CARRIER A STEP MOVED, read off the step's own `couple`: uphill spends,
// downhill banks. Nothing typed per step, so a changed coupling changes its chip.
function chipOf(st){
  const c=st.couple; if(!c) return '';
  const carrier = c.up ? c.cin : c.cout;              // spent, or made
  const cls = c.up ? 'spend' : (c.tone==='n' ? 'nadh' : 'atp');
  return `<span class="rchip ${cls}">${c.up?'−':'+'}${carrier}</span>`;
}

/* =============================================================
 *  3D: lanes, labels, transitions
 * ============================================================= */
// HALF-SEPARATION OF THE TWO LANES. The camera is sized by the VERTICAL need
// (tallest state ~2× as demanding as widest), so this spread costs nothing —
// the frame doesn't grow until `wide` roughly doubles (fitFor's two terms). It
// buys each name plate its own space, which at 5 they shared.
const LANE=8.0;
let lanes=[];                                 // [{g, key, label}] left→right
let busy=false;                               // a transition is animating
// THE BEAT AFTER A STEP LANDS. A step is three screens: read it, watch it, then
// LOOK AT WHAT YOU MADE — the third needs its own click to leave, or the next
// step's explanation overwrites the result while the student is reading it.
// While `reviewing`, panels describe the step that just RAN (done-1), the tray
// is unarmed, and the only control is Next.
let reviewing=false;
// whether the review beat's entry animation has already played for this beat
let shownReview=false;
// Which step the panels describe: the one just run while reviewing, else the
// one about to run. Everything that reads a step goes through it.
const focusStep=()=>reviewing?done-1:done;

// SPECIES NAMES ARE DOM, NOT SPRITES — sharp at any zoom, selectable, sized by
// the page's type scale not the camera. The tracking a sprite gives free is
// paid explicitly: every frame each lane's anchor is projected and the label
// positioned over it (drawPlates, from the render loop). Never drop that — an
// unprojected HTML label drifts off its molecule the moment the scene rotates.
const platesEl=document.getElementById('plates');
// EVERY MOLECULE HAS TWO NAMES, BOTH ON SCREEN: the plate's systematic name and
// the side panel's abbreviation ("F1,6-BP"). Both from the spec's `name`/`short`
// so they can't disagree. Plate falls back to the abbreviation when the
// systematic name won't fit between the lanes; see drawPlates.
function makePlate(spec){
  const d=document.createElement('div');
  d.className='plate';
  d.innerHTML=`<div class="pn">${spec.name}</div><div class="pf">${spec.formula}</div>`;
  platesEl.appendChild(d);
  return d;
}
// Label strip height in PIXELS, reserved at the top as the tray is at the
// bottom. Measured off a live label, so restyling the type moves the camera
// with it. Falls back to a guess before the first label exists.
function plateHeightPx(){
  const d=platesEl.firstElementChild;
  return d ? d.getBoundingClientRect().height+PLATE_GAP_PX+PLATE_CLEAR_PX : 58;
}
const PLATE_GAP_PX=10;
// Clearance ABOVE the top label: the rail runs along the stage's top edge, so a
// label fitted exactly to the reserve sits against it. Reserve only — the
// anchor's gap is world-space (PLATE_GAP), so raising this pushes the molecule
// down without moving the label up.
const PLATE_CLEAR_PX=14;

function laneX(i,n){ return n===1?0:(i===0?-LANE:LANE); }

// A LANE IS CENTRED ON THE MOLECULE, not on its origin. A spec uses whatever
// origin its source used, so a lopsided one (glucose worst) sat off the lane's
// axis — read as the whole stage being off-centre once the wide sidebar went.
// Measured on VISIBLE atoms after the spec's `view` (fitFor and Stage.measure's
// two rules), cached: a property of the spec, asked per frame.
const XC=new Map();
function laneShift(key){
  if(XC.has(key)) return XC.get(key);
  let lo=Infinity, hi=-Infinity;
  // visibleAtoms hides the C–H and applies `view`: the coordinates seen
  visibleAtoms(M[key]).forEach(a=>{
    const R=PAL.radii[a.el]||0.7;
    lo=Math.min(lo,a.pos[0]-R); hi=Math.max(hi,a.pos[0]+R);
  });
  const c=isFinite(lo)?(lo+hi)/2:0;
  XC.set(key,c); return c;
}
// THE VERTICAL TWIN: a spec is centred on its centroid, not the middle of what
// you SEE. G6P's visible box runs -12.1 to +6.4 (phosphate tail hangs down,
// nothing above to balance), so at y=0 it sits ~3 units low in a shared frame —
// a molecule loitering under its own name. Same fix as laneShift: MOVE THE
// MOLECULE, not the camera. A camera re-centring per state would slide the
// scene between steps and turn step 4's split into a camera move.
const YC=new Map();
function laneLift(key){
  if(YC.has(key)) return YC.get(key);
  let lo=Infinity, hi=-Infinity;
  visibleAtoms(M[key]).forEach(a=>{
    const R=PAL.radii[a.el]||0.7;
    lo=Math.min(lo,a.pos[1]-R); hi=Math.max(hi,a.pos[1]+R);
  });
  const c=isFinite(lo)?(lo+hi)/2:0;
  YC.set(key,c); return c;
}
// where a lane's molecule actually sits — every flight target has to use this,
// not laneX, or a phosphate lands beside the atom it is aiming at
const laneOrigin=(key,i,n)=>laneX(i,n)-laneShift(key);
const laneBase=key=>-laneLift(key);
// Distance from settled height, mid-ease. Anything pinned in world Y (the name
// plate) must add this or it un-sticks for the length of the settle.
const laneOffset=l=>l.g.userData.ty==null?0:l.g.position.y-l.g.userData.ty;

// No C–H anywhere: the lesson is carbon/phosphate bookkeeping. Glucose alone
// carries C–H, hidden on build and excluded from every measurement below — else
// an invisible H widens the shared camera fit.
// EVERY MEASUREMENT BELOW IS IN THE ORIENTATION THE MOLECULE IS BUILT IN.
// buildMolecule applies `spec.view` AFTER layout (so Stage.measure re-applies
// it): raw `a.pos[1]` is fine for the pathway's viewless chains, wrong for
// glucose — measured in an orientation it's never drawn in, so the ring hangs
// off two edges and the plate lands on it.
const viewQuat=spec=>spec.view
  ? new THREE.Quaternion().setFromEuler(
      new THREE.Euler(spec.view[0]||0, spec.view[1]||0, spec.view[2]||0, 'ZYX'))
  : null;
const visibleAtoms=spec=>{
  const opt=new Set(spec.optH||[]), q=viewQuat(spec);
  const keep=spec.atoms.filter((_,i)=>!opt.has(i));
  if(!q) return keep;
  return keep.map(a=>{
    const v=new THREE.Vector3(a.pos[0],a.pos[1],a.pos[2]).applyQuaternion(q);
    return {el:a.el, pos:[v.x,v.y,v.z]};
  });
};

// top/bottom incl. sphere radii — 5-unit ring to 10-unit chain, phosphate can
// hang off either end
function moleculeTop(spec){
  return visibleAtoms(spec).reduce((m,a)=>Math.max(m,a.pos[1]+(PAL.radii[a.el]||0.7)),0); }
function moleculeBottom(spec){
  return visibleAtoms(spec).reduce((m,a)=>Math.min(m,a.pos[1]-(PAL.radii[a.el]||0.7)),0); }

// Lane i of n: molecule + name plate. `topY` passed in, not derived per
// molecule: DHAP's phosphate is on C1, G3P's on C3, so plate heights differed
// by 3.3 units — two labels at different heights read as "different sizes".
function spawnLane(key,i,n,topY){
  const spec=M[key];
  const g=Stage.buildMolecule(spec);
  Stage.setOptionalH(g,false);          // no C–H on this page — see visibleAtoms
  // y is a TARGET: the loop eases into it from where the replaced molecule
  // stood, so the swap frame moves nothing.
  g.position.set(laneOrigin(key,i,n),laneBase(key),0);
  g.userData.ty=laneBase(key);
  root.add(g);
  const plate=makePlate(spec);
  // Natural width, measured ONCE unconstrained — drawPlates can't re-measure a
  // scaled element. Both spellings here: by draw time it carries whichever is
  // showing, so its live width answers the wrong question.
  const nameEl=plate.querySelector('.pn');
  const natW=plate.offsetWidth;
  nameEl.textContent=spec.short||spec.name;
  const shortW=plate.offsetWidth;
  nameEl.textContent=spec.name;
  return {g,key,plate,nameEl,topY,natW,shortW,
          full:spec.name, abbr:spec.short||spec.name, showing:'full'};
}
function clearLanes(){
  lanes.forEach(l=>{ root.remove(l.g); l.plate.remove(); });
  lanes=[];
}

// Where a lane's label is pinned; `topY` shared across lanes — see spawnLane.
const PLATE_GAP=0.8;
// MEASURED WHERE THE MOLECULE IS DRAWN, not where its coordinates say:
// spawnLane recentres each species vertically (laneLift), so the plate must
// come down by the same amount or it floats above nothing.
const plateY=keys=>Math.max(...keys.map(k=>moleculeTop(M[k])-laneLift(k)))+PLATE_GAP;

/* ---------- the hotspot on the bond ----------
 * One per lane, on the projected midpoint of the step's bond. Driven every
 * frame — the camera eases and the molecule turns, so a target that doesn't
 * follow is one you miss. Elements reused, else the pulse restarts 60x/s.
 *
 * WHICH BOND A `spot` MEANS, in the spec's own words. Two spellings, because
 * the specs already name these two ways:
 *   an ARRAY  — the bond itself (`gly.open`, `gly.cleave`: C1–O5, C3–C4)
 *   a NUMBER  — an ATOM that leaves; the bond meant is the one that breaks:
 *                 P (`gly.hot`)       → its bridging O. A kinase moves PO₃⁻,
 *                   the bridge stays — gammaBreak's derivation on ATP.
 *                 H (`gly.aldehydeH`) → the heavy atom it hangs off; a hydride
 *                   has one bond.
 * So steps 7/10 point at the sugar's version of step 1's ATP bond, step 6 at
 * the C–H the dehydrogenase takes — no index typed into the step table.
 */
function spotPair(spec, at){
  const v=spec.gly[at];
  if(Array.isArray(v)) return v;
  if(typeof v!=='number') return null;
  const el=spec.atoms[v] && spec.atoms[v].el;
  const other = el==='H' ? (nbOf(spec,v)||[])[0] : bridgeO(spec,v);
  return other==null ? null : [v,other];
}
const spotsEl=document.getElementById('spots');
const glowEl=document.getElementById('spotglow');
const spotV=new THREE.Vector3();
function drawSpots(){
  const st=(!intro && done<nSteps) ? stepAt(done) : null;
  const live = !!st && !!st.spot && !busy && !reviewing;
  const n = live ? lanes.length : 0;
  while(spotsEl.children.length<n){
    const b=document.createElement('button');
    b.className='spot'; b.type='button';
    b.innerHTML='<span class="shint"></span>';
    // WHICH LANE: a per-lane step runs the one clicked; a whole-step target
    // ignores it, so both share one handler.
    b.onclick=()=>{ const i=+b.dataset.lane;
      press(()=>isPerLane(stepAt(done)) ? runLane(i) : runStep()); };
    spotsEl.appendChild(b);
    const g=document.createElement('div'); g.className='sglow';
    glowEl.appendChild(g);
  }
  const show=(el,on)=>el.style.display = on ? '' : 'none';
  [...spotsEl.children].forEach((el,i)=>show(el, i<n));
  [...glowEl.children].forEach((el,i)=>show(el, i<n));
  if(!n) return;
  const w=canvas.clientWidth, h=canvas.clientHeight;
  let hinted=false;
  lanes.forEach((l,i)=>{
    const el=spotsEl.children[i], gl=glowEl.children[i];
    el.dataset.lane=i;
    const pair=spotPair(M[l.key], st.spot.at);
    // NO SUCH BOND, NO TARGET — not one at the origin. Also retires a per-lane
    // target once its lane has run: the product has no `hot` phosphate.
    if(!pair || laneDone.has(i)){ show(el,false); show(gl,false); return; }
    const u=l.g.userData;
    spotV.copy(u.atomWorld(pair[0])).add(u.atomWorld(pair[1])).multiplyScalar(.5).project(camera);
    const x=(spotV.x*0.5+0.5)*w, y=(-spotV.y*0.5+0.5)*h;
    el.style.left=x+'px'; el.style.top =y+'px';
    gl.style.left=x+'px'; gl.style.top =y+'px';
    // ONE HINT, BESIDE THE FIRST TARGET STILL STANDING — twice shouts, but
    // pinning it to lane 0 left lane 1 unlabelled once lane 0 retired.
    el.querySelector('.shint').textContent = hinted ? '' : (st.spot.say||'');
    hinted=true;
    el.setAttribute('aria-label', st.act || 'run this step');
  });
}

// Project each lane's anchor, park its label over it. `l.g.position.x` read
// live, not from laneX(), so labels ride the halves apart during the split
// instead of snapping to final positions.
const projV=new THREE.Vector3();
const PLATE_GAP_PX_X=14;
// Set for a step's whole animation (#plates.mute). Cleared by renderLanes, when
// there's a settled molecule to name again — and by the split, the one branch
// that finishes without calling it.
let platesOff=false;
function drawPlates(){
  platesEl.classList.toggle('mute', platesOff);
  const w=canvas.clientWidth, h=canvas.clientHeight;
  camera.updateMatrixWorld();          // safe to call off-loop (restart, resize)
  const xs=lanes.map(l=>{
    // BOTH read live: `topY` is the settled anchor, but the lane eases into its
    // centring after a swap (spawnLane's `ty`), so the label must carry that
    // offset or it waits at the destination.
    projV.set(l.g.position.x, l.topY+laneOffset(l), 0).project(camera);
    return {x:(projV.x*0.5+0.5)*w, y:(-projV.y*0.5+0.5)*h};
  });
  // A LABEL'S WIDTH IS IN PIXELS AND THE LANES' SEPARATION IS NOT — a DOM label
  // keeps its width as the camera pulls back, so on a narrow stage the two
  // names run through each other. Give each the space between the lanes.
  const budget = xs.length>1
    ? Math.max(90, Math.abs(xs[1].x-xs[0].x)-PLATE_GAP_PX_X)
    : Math.max(120, w-40);
  // ONE DECISION FOR BOTH LANES: per lane, DHAP abbreviated while the wider
  // "Glyceraldehyde-3-phosphate" stayed systematic, so the pair read as two
  // KINDS of thing (cf. plateY's shared baseline). Widest name wins.
  const wide = lanes.every(l=>budget>=l.natW);
  lanes.forEach((l,i)=>{
    // ABBREVIATE FIRST, THEN SHRINK. "1,3-bisphosphoglycerate" at 0.62 is a
    // smear; "1,3-BPG" full size is what the student writes and the coupling
    // figure uses. No oscillation: `budget` is the lanes' property, not the
    // label's.
    const want = wide?'full':'abbr';
    if(l.showing!==want){ l.nameEl.textContent = wide?l.full:l.abbr; l.showing=want; }
    // SHRINK, don't wrap: no space to break at, so wrapping chopped
    // "bisphosphogl / ycerate" mid-word. Scaling about bottom-centre keeps it
    // anchored to the molecule; the floor stops it becoming unreadable.
    const s=Math.max(0.62, Math.min(1, budget/Math.max(1, wide?l.natW:l.shortW)));
    l.plate.style.left=xs[i].x+'px';
    l.plate.style.top =xs[i].y+'px';
    l.plate.style.transform=`translate(-50%,-100%) scale(${s.toFixed(3)})`;
  });
}

// ---- framing ---------------------------------------------------------------
// ONE SCALE FOR THE WHOLE PATHWAY. Auto-fitting each state would zoom the two
// three-carbon halves back to six-carbon size, so the split would read as a
// rearrangement, not a halving. Distance solved ONCE over every state from
// priming on: pyruvate looks small because it IS. Only the intro gets closer
// framing — a lone glucose is compared to nothing.
// From the SPECS plus intended lane offsets, not a live bbox: mid-split the
// halves are still easing apart, so a bbox fits the stacked pair.
// kit/fit.js owns the arithmetic; `RESERVES` below is the half only this page
// can know — which of ITS elements sit over the canvas. `cam.r` stays the one
// measure of "how far back" even though the camera is orthographic: the module
// converts it into a frustum of the half-height a perspective camera would show
// at r, so fitFor's R, the loop's ease, the wheel clamp and u.shift all keep
// their meaning verbatim.
const FIT=Fit.create({canvas, camera, cam, reserve:()=>RESERVES()});
const HALF_FOV=FIT.HALF_FOV;
// Every frame: cam.r eases, so the frustum is rebuilt from it.
const orthoFrustum=()=>FIT.frustum();
function fitFor(states){
  let lo=0, hi=0, wide=0;             // atoms only — see halfNeeded below
  states.forEach(keys=>{
    const n=keys.length;
    // BOTH axes about the lane's own centre: spawnLane draws recentred, so a
    // fit off raw spec coordinates fits a position nothing occupies.
    keys.forEach((k,j)=>{ const x=Math.abs(laneX(j,n)), xc=laneShift(k), yc=laneLift(k);
      visibleAtoms(M[k]).forEach(a=>{ const r=PAL.radii[a.el]||0.7;
        lo=Math.min(lo,a.pos[1]-yc-r); hi=Math.max(hi,a.pos[1]-yc+r);
        wide=Math.max(wide, x+Math.abs(a.pos[0]-xc)+r); }); });
    wide=Math.max(wide, (n>1?LANE:0)+2.0);
  });
  // Centre on the MOLECULES, not molecules-plus-label: letting the plate pull
  // the centre up shoved the molecule into the reagent tray.
  const Y=(lo+hi)/2;
  // THE LABEL IS NOT IN THE FIT. `halfNeeded` used to reach the plate's world
  // Y, pulling the camera back to contain a piece of HTML — double charging,
  // since the plate is a fixed PIXEL band already reserved off the top by
  // usable() (u.tf). It cost 10% of the opening molecule, 6% of every state
  // after. The plate now says where the scene sits, not how far back we are.
  const halfNeeded=Math.max(hi-Y, Y-lo);
  // The distance and the target come from kit/fit.js: solved per axis against
  // what the chrome leaves, and centred in the leftover band by DROPPING THE
  // TARGET rather than insetting both edges. Safe in world space because Y is
  // the orbit axis; there is no horizontal twin, because a side reserve is paid
  // symmetrically so the subject stays on the centre line.
  const {R,Y:Yfit}=FIT.solve({halfNeeded, wide, centerY:Y, pad:1.10, min:15, max:90});
  return { Y:Yfit, R };
}

// THE STAGE IS NOT AN EMPTY RECTANGLE — chrome on all four edges, so a molecule
// fitted to the raw canvas is fitted to spoken-for space. Intrusions are
// MEASURED off the live element, so restyling moves the camera to match.
//   top     species labels: HTML, a fixed PIXEL band, not a world-space box the
//           projection scales — hence reserved here, not in fitFor.
//   bottom  #bottombar, a RESERVATION: the typed --barh, not what the bar holds.
//           ONE camera covers every state (else the split stops reading as a
//           halving), so the bottom edge must not move as headings/captions come
//           and go. Nothing else is reserved: the ending fork is a modal.
//   left    the reagent tray (absent during the intro, nothing to spend)
// The arithmetic over these numbers is kit/fit.js's; WHICH ELEMENTS they come
// from is the part only this page can know, so that half stays here.
// Bottom reserve px: declared bar height + stand-off, from the STYLESHEET not
// the live box, so bar contents can't re-frame every state.
function barReservePx(){
  const e=document.getElementById('bottombar');
  if(!e) return 106;
  const cs=getComputedStyle(e);
  const h=parseFloat(cs.getPropertyValue('--barh'))||0;
  return h+(parseFloat(cs.bottom)||0);
}
// Caption reserve: the typed --caph or nothing. The caption is only up on the
// intro and closing screen, outside the ten-step run that holds one framing.
// Height never read, so a longer caption can't move the camera — it eats the
// room set aside, then runs over the molecule.
function capReservePx(){
  const e=document.getElementById('rxmsg');
  if(!e||!e.classList.contains('show')) return 0;
  return parseFloat(getComputedStyle(e).getPropertyValue('--caph'))||0;
}
// Tray reserve: left inset + declared column width + clearance. From the
// STYLESHEET, not the live box — the tray is empty at the intro and holds a
// different tile count per step, none of which may move the molecule.
const TRAY_CLEAR_PX=12;
function trayReservePx(){
  const e=document.getElementById('tray');
  if(!e) return 190;
  const cs=getComputedStyle(e);
