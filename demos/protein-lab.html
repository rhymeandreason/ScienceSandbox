<!DOCTYPE html>
<!--
  protein-lab.html — the four levels of protein structure, on one real molecule.

  THE LESSON: levels 1-3 are not four different things. They are the SAME chain,
  described at three scales, and the page never swaps the molecule between them —
  it restyles it. Students who miss that come away thinking tertiary structure is
  a separate object rather than what a chain of amino acids inevitably does.
  Only quaternary changes structure, because quaternary is by definition about
  more than one chain.

  It picks up where aminoacid-lab.html stops. There, residues are joined by
  dehydration synthesis into a chain the student assembles. Here, that chain —
  129 residues of it — is lysozyme, folded.

  WHY THIS PAGE IS NOT LIKE THE OTHERS
  - No Three.js, no scene.js, no MolLib. Deposited structures are 1000+ atoms of
    experimental coordinates, which is a different job from the hand-authored
    specs in mol-*.js. It shares `pdb.js` (orientation) and sandbox.css and
    nothing else. RenderingLibraries.md has the reasoning.
  - It renders through ChemDoodle Web (vendored, GPLv3 — vendor/chemdoodle/).
    THAT MAKES THIS PAGE GPLv3. See vendor/chemdoodle/README.md.
  - Structures are vendored in pdb/ rather than fetched from RCSB: a lesson
    should not stop working because a school's network blocks a domain.

  SCIENTIFIC CHOICES
  - 1LYZ (hen egg-white lysozyme) carries levels 1-3. Small (129 residues), fast,
    historically the second protein structure ever solved, and its substrate cleft
    is visible without a surface renderer.
  - Lysozyme is helix-dominated, so beta sheet is thin until level 4 arrives.
    That is a real limitation of the choice, accepted for speed and familiarity.
  - 1IGT (intact IgG antibody) carries level 4: four chains, and the Y shape is
    recognisable to a student who has seen one diagram of an antibody.
  - 1LYZ's one 3-10 helix (A 80-84) is named in a fact but NOT coloured: ChemDoodle
    has no style for it, and the ribbon's two-tone defaults are face shading, not
    structure. Every colour pair on this page is flattened to one value for that
    reason — a colour change here has to mean something. Colouring 3-10 honestly
    needs 3Dmol plus a HELIX-class parse (PDBLib.helices), which is a reason this
    page might one day move; see RenderingLibraries.md.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molecule Sandbox — Four Levels of Protein Structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="sandbox.css">
<!-- vendored, GPLv3 — see vendor/chemdoodle/README.md -->
<link rel="stylesheet" href="vendor/chemdoodle/ChemDoodleWeb.css">
<style>
  /* The legend is page chrome over the canvas, same idea as contrast-lab's
     molecule names: HTML on top of the viewer, never geometry. */
  #legend{position:absolute;left:26px;bottom:24px;z-index:5;
    display:flex;flex-direction:column;gap:7px;
    background:rgba(255,255,255,.72);border:1.5px solid var(--hair);border-radius:9px;
    padding:11px 14px;backdrop-filter:blur(2px);max-width:230px}
  #legend .lrow{display:flex;align-items:center;gap:9px;font-size:13px;line-height:1.3}
  #legend .sw{width:16px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.28);flex:none}
  #legend .lnote{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}

  /* Top-left, not centred: the stage is landscape and the molecule is framed to
     fill it, so anything centred over the top sits on the structure. */
  #whoami{position:absolute;left:26px;top:20px;z-index:5;
    text-align:left;pointer-events:none;white-space:nowrap}
  #whoami .wname{font-family:var(--font-marker);font-size:26px;line-height:1.05}
  #whoami .wsub{font-family:var(--font-slab);font-weight:700;font-size:13px;color:var(--muted);margin-top:3px}

  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:6;font-family:var(--font-slab);color:var(--muted);pointer-events:none;opacity:0;
    transition:opacity .15s}
  #loading.on{opacity:1}

  /* ChemDoodle writes its own <canvas>; this is just the box it lives in. */
  #cdholder{position:absolute;inset:0}
  /* ChemDoodle sets the canvas's width/height ATTRIBUTES (times devicePixelRatio)
     and no CSS size, so on a retina screen the element lays out at twice its box
     and overflows the stage. Pin the CSS size; the backing store stays sharp. */
  #cdholder canvas{display:block;width:100%;height:100%}

  #credit{position:absolute;right:14px;bottom:8px;z-index:5;font-size:11px;color:var(--muted)}
  #credit a{color:inherit}

  @media (max-width:920px){
    #legend{left:14px;bottom:14px;max-width:180px;padding:9px 11px}
    #whoami .wname{font-size:21px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="cdholder"></div>
    <div id="whoami"></div>
    <div id="legend"></div>
    <div id="loading">loading structure…</div>
    <!-- iChemLabs asks for a visible link from any site using the library -->
    <div id="credit">3D by <a href="https://web.chemdoodle.com" target="_blank" rel="noopener">ChemDoodle Web</a></div>
  </div>
  <div id="side">
    <div id="steps"></div>
    <div id="card"></div>
    <footer>
      <button id="prev">Previous</button>
      <button id="next">Next</button>
    </footer>
  </div>
</div>

<script src="vendor/chemdoodle/ChemDoodleWeb.js"></script>
<script src="pdb.js"></script>
<script>
/* ---------- the lesson ---------------------------------------------------- */

const C = {                       // one palette, used by both the ribbon and the legend
  helix:   '#a03fd8',
  three10: '#34d882',
  // deeper than it looks it should be: ChemDoodle's lighting is glossy, and a
  // pale tan renders as near-white, indistinguishable from an unlit loop
  sheet:   '#c08a4e',
  coil:    '#f2e05a',
  plain:   '#7f9bb5'              // tertiary: one colour, so the SHAPE is the subject
  // NB: no chain palette here — chain colours are ChemDoodle's and cannot be
  // overridden; the legend reads them back instead. See chainLegend().
};

const STEPS = [{
  key: 'primary', file: '1LYZ', style: 'sticks',
  name: 'Lysozyme', sub: '129 amino acids · one chain',
  title: 'Primary structure',
  body: `<p class="lead">A protein starts as one long chain of amino acids, joined
         end to end.</p>
         <p>This is that chain — every atom of lysozyme's backbone and side chains,
         drawn as sticks. It's the same kind of chain you built by hand in the
         amino acid lab, just 129 residues long instead of two.</p>
         <p><b>Primary structure is simply the order</b> those 129 amino acids come
         in. Nothing else. And that order is the only part your DNA actually
         specifies.</p>`,
  fact: `Everything else on this page — every coil, every fold — follows from that
         order. Change one amino acid and the rest can change with it. That's why a
         single DNA base swap can cause sickle-cell anaemia.`,
  legend: [['#8a857a', 'the chain, all atoms']],
  legendNote: 'Hard to read, isn\'t it? That\'s the point — the next step is how chemists cope.'
}, {
  key: 'secondary', file: '1LYZ', style: 'ribbon-ss',
  name: 'Lysozyme', sub: 'the same molecule, simplified',
  title: 'Secondary structure',
  body: `<p class="lead">Same molecule. We've just stopped drawing every atom and
         traced the backbone instead.</p>
         <p>Now two shapes appear over and over: <b>α-helices</b> (spirals) and
         <b>β-sheets</b> (flat arrows lying side by side). Both are held by
         hydrogen bonds between backbone atoms — not side chains, the backbone
         itself.</p>
         <p>Lysozyme is helix-rich, so you'll see more purple than tan here.</p>`,
  fact: `Not every helix is an α-helix. Tucked in at residues 80-84, lysozyme has a
         <b>3₁₀ helix</b> — wound tighter, 3 amino acids per turn instead of 3.6.
         The data file records the difference; this viewer draws both the same, so
         you'd never know it was there from the picture alone.`,
  legend: [[C.helix, 'α-helix'], [C.sheet, 'β-sheet'], [C.coil, 'loop / turn']],
  legendNote: 'Held together by hydrogen bonds along the backbone.'
}, {
  key: 'tertiary', file: '1LYZ', style: 'ribbon-plain',
  name: 'Lysozyme', sub: 'the whole fold',
  title: 'Tertiary structure',
  body: `<p class="lead">One colour now — because the subject is the overall
         <b>shape</b>, not the parts.</p>
         <p>Tertiary structure is how the whole chain packs into one blob: helices
         and sheets folded against each other, held by interactions between the
         <b>side chains</b> this time — hydrophobic clustering inside, hydrogen
         bonds, ionic bonds, and disulfide bridges.</p>
         <p>Look for the groove across the middle. That cleft is where lysozyme
         grabs its target, and its shape is the reason the enzyme works at all.</p>`,
  fact: `Lysozyme cuts open bacterial cell walls, and you're making it right now —
         it's in your tears, saliva and mucus. Fleming discovered it in 1922 after
         a drop from his own runny nose landed on a culture dish and cleared it.`,
  legend: [[C.plain, 'one chain, one shape']],
  legendNote: 'Shape comes from side-chain interactions — and shape is what an enzyme is for.'
}, {
  key: 'quaternary', file: '1IGT', style: 'ribbon-chain',
  name: 'Antibody (IgG)', sub: 'four chains, one molecule',
  title: 'Quaternary structure',
  body: `<p class="lead">A new molecule — because this level needs more than one
         chain.</p>
         <p>Not every protein has quaternary structure. It exists only when
         <b>separate folded chains assemble</b> into a working unit. Here, four
         chains — two long, two short — lock into the Y that recognises one
         specific invader.</p>
         <p>Each chain went through levels 1-3 on its own first. Quaternary is what
         happens after.</p>`,
  fact: `The two tips of the Y are the parts that vary between antibodies; the stem
         is nearly identical in all of them. Your immune system makes millions of
         versions of the tips while reusing the same stem — mass production with
         custom ends.`,
  // built from the file and the rendered colours once it loads — see chainLegend
  legendFromChains: true, legend: [],
  legendNote: 'Four separate chains. Pull them apart and the antibody stops working.'
}];

/* ---------- structures ---------------------------------------------------- */

const raw = new Map();

/* ChemDoodle's camera fit ignores aspect ratio, so a molecule laid out along the
   screen's long axis is clipped whenever the stage is narrower than the molecule
   is wide. Lay the long axis along whichever screen axis has room: vertical fits
   by construction, so anything but a clearly landscape stage gets 'y'. */
function longAxisFor(w, h) { return (w / h) >= 1.5 ? 'x' : 'y'; }

function loadPDB(id, long) {
  const key = `${id}:${long}`;
  if (raw.has(key)) return Promise.resolve(raw.get(key));
  const text = raw.has(id) ? Promise.resolve(raw.get(id))
    : fetch(`pdb/${id}.pdb`)
        .then(r => { if (!r.ok) throw new Error(`${id}.pdb ${r.status}`); return r.text(); })
        .then(t => { raw.set(id, t); return t; });
  // orient before anything renders, so restyling a step never re-frames it
  return text.then(t => { const o = PDBLib.orient(t, { mode: 'pca', long }); raw.set(key, o); return o; });
}

/* ---------- rendering ----------------------------------------------------- */

const holder = document.getElementById('cdholder');
let canvas3d = null, shownFile = null, shownStyle = null, lastMol = null;

/* Chain colours are ChemDoodle's, and they are not ours to set: they are baked
   into the ribbon meshes as they are built, so assigning chainColor — on the
   chain, on the ribbon, before or after loadMolecule — changes the data and
   nothing on screen. macro_rainbowColors doesn't reach them either; that array
   is only for the residue-index gradient.

   So the legend reads the colours back OUT of the molecule instead of dictating
   them. The key then cannot disagree with the picture, which is the property
   that actually matters — and it survives a ChemDoodle upgrade changing its
   palette. Which chain is heavy and which is light comes from the file too:
   the long ones are the heavy chains, by definition. */
function chainLegend(pdbText, mol) {
  const ids = [], seen = new Set();
  const count = {};
  for (const l of pdbText.split('\n')) {
    if (!l.startsWith('ATOM')) continue;
    const id = l.slice(21, 22);
    if (!seen.has(id)) { seen.add(id); ids.push(id); }
    (count[id] = count[id] || new Set()).add(l.slice(22, 27));
  }
  const sizes = ids.map(id => count[id].size);
  const mid = (Math.max(...sizes) + Math.min(...sizes)) / 2;
  return ids.map((id, i) => {
    const ch = mol.chains[i];
    const n = count[id].size;
    return [ch && ch.chainColor || '#999',
            `${n > mid ? 'heavy' : 'light'} chain (${id}) · ${n} residues`];
  });
}

function build(pdbText, style, fileId) {
  // ChemDoodle sizes its canvas in pixels at construction, so any change of size
  // (or of molecule) means building a new one rather than restyling in place.
  holder.innerHTML = '<canvas id="cdcanvas"></canvas>';
  const w = holder.clientWidth, h = holder.clientHeight;
  const c = new ChemDoodle.TransformCanvas3D('cdcanvas', w, h);

  c.styles.backgroundColor = undefined;          // let the paper texture show through
  c.styles.atoms_displayLabels_3D = false;
  c.styles.macro_showWater = false;
  c.styles.proteins_ribbonCartoonize = true;
  c.styles.shapes_color = '#3a352f';

  if (style === 'sticks') {
    c.styles.proteins_displayRibbon = false;
    // BOTH are needed. With macro_displayAtoms false — its default for
    // macromolecules — ChemDoodle draws nothing at all here, bonds included.
    c.styles.macro_displayAtoms = true;
    c.styles.macro_displayBonds = true;
    c.styles.macro_atomToLigandDistance = -1;    // the whole chain, not just near ligands
    c.styles.set3DRepresentation('Ball and Stick');
  } else {
    c.styles.proteins_displayRibbon = true;
    c.styles.macro_displayBonds = false;
    /* ChemDoodle colours the ribbon's two FACES separately — Primary is the
       front, Secondary the underside where it twists away. That is a depth cue
       carrying no chemistry, and its defaults (red/yellow loops, green/purple
       helices) invite a student to invent a meaning for it. So every pair here
       is set to a single colour: in this lesson, a colour change must MEAN
       something. ChemDoodle cannot colour 3-10 helices separately at all —
       it has no style for them. */
    if (style === 'ribbon-ss') {
      c.styles.proteins_residueColor = 'none';
      c.styles.proteins_ribbonCartoonHelixPrimaryColor = C.helix;
      c.styles.proteins_ribbonCartoonHelixSecondaryColor = C.helix;
      c.styles.proteins_ribbonCartoonSheetColor = C.sheet;
      c.styles.proteins_primaryColor = C.coil;
      c.styles.proteins_secondaryColor = C.coil;
    } else if (style === 'ribbon-plain') {
      c.styles.proteins_residueColor = 'none';
      c.styles.proteins_ribbonCartoonHelixPrimaryColor = C.plain;
      c.styles.proteins_ribbonCartoonHelixSecondaryColor = C.plain;
      c.styles.proteins_ribbonCartoonSheetColor = C.plain;
      c.styles.proteins_primaryColor = C.plain;
      c.styles.proteins_secondaryColor = C.plain;
    } else if (style === 'ribbon-chain') {
      c.styles.macro_colorByChain = true;   // the colours themselves: see below
    }
  }

  const mol = ChemDoodle.readPDB(pdbText);
  lastMol = mol;

  /* A PDB file carries no bonds for standard residues — CONECT records cover
     ligands only, and the viewer is expected to work them out from distances.
     ChemDoodle's loadMolecule deliberately SKIPS that deduction on a 3D canvas,
     so without this the sticks step renders 1001 unconnected spheres. The
     ribbon steps don't care: a ribbon is traced from backbone positions, not
     from bonds, which is why only this branch pays the ~30 ms. */
  if (style === 'sticks' && !mol.bonds.length)
    new ChemDoodle.informatics.BondDeducer().deduceCovalentBonds(mol, 1);

  c.loadMolecule(mol);
  canvas3d = c;
  shownFile = fileId; shownStyle = style;
}

/* ---------- steps --------------------------------------------------------- */

const stepsEl = document.getElementById('steps');
const cardEl = document.getElementById('card');
const whoEl = document.getElementById('whoami');
const legendEl = document.getElementById('legend');
const loadEl = document.getElementById('loading');
const prevB = document.getElementById('prev');
const nextB = document.getElementById('next');
let cur = -1, loadToken = 0;

function drawLegend(step, rows) {
  legendEl.innerHTML =
    rows.map(([col, label]) =>
      `<div class="lrow"><span class="sw" style="background:${col}"></span>${label}</div>`).join('') +
    (step.legendNote ? `<div class="lnote">${step.legendNote}</div>` : '');
}

function applyStep(n) {
  const s = STEPS[n];
  cur = n;

  [...stepsEl.children].forEach((b, k) => b.classList.toggle('active', k === n));
  cardEl.innerHTML =
    `<div class="cardtext"><h2>${s.title}</h2>${s.body}</div>` +
    `<div class="factwrap"><img class="bulb" src="sticker_idea.png" alt="reveal fact"
       title="Reveal the interesting bit"><div class="fact">${s.fact}</div></div>`;
  cardEl.querySelector('.cardtext').scrollTop = 0;
  whoEl.innerHTML = `<div class="wname">${s.name}</div><div class="wsub">${s.sub}</div>`;
  drawLegend(s, s.legend);

  prevB.disabled = (n === 0);
  nextB.disabled = (n === STEPS.length - 1);
  nextB.textContent = n === STEPS.length - 1 ? 'Finish' : 'Next';

  // Only levels 1-3 share a molecule; level 4 is a different file by necessity.
  if (s.file === shownFile && s.style === shownStyle) return;
  /* Loads are async and 1IGT is eight times the size of 1LYZ, so clicking
     through the steps can land them out of order — without this guard, step 4's
     antibody arrives late and paints itself over step 3. Only the most recent
     request may touch the canvas. */
  const token = ++loadToken;
  loadEl.classList.add('on');
  loadPDB(s.file, longAxisFor(holder.clientWidth, holder.clientHeight))
    .then(text => {
      if (token !== loadToken) return;          // a later step already won
      build(text, s.style, s.file);
      if (s.legendFromChains) drawLegend(s, chainLegend(text, lastMol));
      loadEl.classList.remove('on');
    })
    .catch(e => {
      if (token !== loadToken) return;
      loadEl.textContent = 'could not load ' + s.file + ': ' + e.message;
    });
}

STEPS.forEach((s, i) => {
  const b = document.createElement('div');
  b.className = 'stepnum'; b.textContent = i + 1;
  b.onclick = () => applyStep(i);
  stepsEl.appendChild(b);
});
prevB.onclick = () => applyStep(Math.max(0, cur - 1));
nextB.onclick = () => applyStep(Math.min(STEPS.length - 1, cur + 1));

// lightbulb reveals its fact — delegated, since each step rebuilds the card
cardEl.addEventListener('click', e => {
  const bulb = e.target.closest('.bulb'); if (!bulb) return;
  const f = bulb.nextElementSibling; if (!f) return;
  bulb.classList.toggle('lit', f.classList.toggle('show'));
});

// the canvas is pixel-sized at construction, so a resize means rebuilding it
let rt = null;
new ResizeObserver(() => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (!shownFile) return;
    // a resize can flip which screen axis has room, so re-orient, not just resize
    loadPDB(shownFile, longAxisFor(holder.clientWidth, holder.clientHeight))
      .then(text => build(text, shownStyle, shownFile));
  }, 150);
}).observe(holder);

applyStep(0);
</script>
</body>
</html>
