<!DOCTYPE html>
<!-- Bio 101 node graph — typed nodes, typed ranked edges, and the scale
     ladder as a first-class axis. docs/Biology-Node-Graph.md is the design;
     graphdata.js is the content (two units: water, proteins, plus the
     macromolecule bridges).

     THE CANVAS HAS SEMANTIC AXES, and that is the design:

       * X is explanatory order, computed by topological layering over the
         directed edge types. Chemistry prerequisites sit far left,
         consequences right, so every causal arrow points rightward and
         reading direction IS explanation direction.
       * Y is the scale ladder. Leveled nodes sit in horizontal bands
         (molecule low, ecosystem high) aligned with the gutter ruler;
         concepts, which have no level, settle at the mean of their
         neighbours. part-of edges therefore run vertically and causal
         edges horizontally — the doc's two axes are the screen's two.
       * The layout is BAKED from the data, identical every load, so
         spatial memory can form. The relax only resolves overlaps; it
         never invents position.

     THE WHOLE MAP EXISTS FROM LOAD; exploration is light, not creation.
     Unvisited nodes render as dim marks — fog of war — and clicking
     illuminates. A theme lights its instances and a unit lights its
     chapter; no reveal special cases. A focused card offers its neighbours grouped
     by direction (why · so what · contrast — the doc's direction of
     learning), and arrow keys walk rank-1 edges with the camera.

     Kept from the composer, as technique only: the card design language,
     the scale()/zoom split, pan/drag/pin, focus dimming. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology 101 node graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../molecule-builder/molecule-builder.css">
<link rel="stylesheet" href="../kit/proteinbox.css">
<style>
  :root {
    --sans: 'Futura', 'Futura PT', 'Jost', -apple-system, 'Segoe UI', sans-serif;
    --ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --serif: 'Literata', Georgia, serif;

    --paper:  #faf8f4;
    --ink:    #14161a;
    --muted:  #6d6f76;
    --line:   #e4e0d7;
    --card:   #ffffff;
    --accent: #1f5f4f;
    --spark:  #e2643a;
    /* the extension door: a blue that belongs to no unit, so it reads as a
       kind of question rather than as a region */
    --ext:    #2f5fb5;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    overflow: hidden;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- chrome --------------------------------------------------------- */

  .mast {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: baseline; gap: 1rem;
    padding: 1.1rem clamp(1rem, 3vw, 2rem) 0.9rem;
    pointer-events: none;
  }
  .mast > * { pointer-events: auto; }
  .logo {
    font-size: 1.5rem; font-weight: 500; letter-spacing: -0.04em;
    margin: 0; text-transform: lowercase; text-decoration: none; color: inherit;
  }
  .logo em { font-style: normal; color: var(--accent); }
  .logo .dot { color: var(--spark); }
  .mast .title { font-family: var(--serif); font-size: 0.95rem; color: var(--muted); }
  .mast .spacer { flex: 1; pointer-events: none; }

  .btn {
    font-family: var(--sans); font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    background: var(--card); border: 1px solid var(--line); border-radius: 3px;
    padding: 0.45rem 0.75rem; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .btn:hover { color: var(--accent); border-color: var(--accent); }
  .btn.on { color: var(--paper); background: var(--accent); border-color: var(--accent); }

  #canvas { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #canvas.panning { cursor: grabbing; }
  /* geometricPrecision: #world is zoomed above k=1, and whole-pixel glyph
     advances rewrap headings as k moves. */
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0;
           text-rendering: geometricPrecision; -webkit-text-size-adjust: none; }
  #edges { position: absolute; overflow: visible; pointer-events: none; }
  #edges text {
    font-family: var(--sans); font-size: 10px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    fill: var(--muted); opacity: 0; transition: opacity .18s;
    paint-order: stroke; stroke: var(--paper); stroke-width: 3px;
  }
  #edges text.on { opacity: 0.95; }
  #edges line.band { stroke: #eeebe2; stroke-width: 1; }

  /* the highlight picker. A native <select> cannot carry a unit's colour, and
     that colour is the whole point of the unit rows, so the menu is ours and
     the <select> stays as the value: every reader of hiliteSel.value and every
     `change` listener is untouched. */
  .hilite { position: relative; margin-right: 0.9rem; }
  .hilite select { display: none; }
  .hbtn {
    font-family: var(--ui); font-size: 0.7rem; letter-spacing: 0.04em;
    color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 0.35rem 0.55rem; cursor: pointer;
    display: inline-flex; align-items: center; gap: 0.5rem; min-width: 9rem;
    transition: border-color .15s;
  }
  .hbtn:hover, .hilite.open .hbtn { border-color: var(--accent); }
  .hbtn .hlabel { flex: 1; text-align: left; }
  .hbtn .caret { color: var(--muted); font-size: 0.55rem; line-height: 1; }
  .hdot {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    display: inline-block;
  }
  .hmenu {
    position: absolute; top: calc(100% + 0.35rem); right: 0; z-index: 20;
    min-width: 13rem; max-height: 62vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 3px;
    box-shadow: 0 14px 34px -12px rgba(20, 22, 26, .28);
    padding: 0.25rem 0;
  }
  .hmenu[hidden] { display: none; }
  /* the rule rides on the heading, so every group is divided from what is
     above it and the first one is divided from the `all` row */
  .hmenu .hgroup {
    font-family: var(--sans); font-size: 0.52rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    padding: 0.55rem 0.7rem 0.25rem;
    border-top: 1px solid var(--line); margin-top: 0.3rem;
  }
  .hmenu .hopt {
    font-family: var(--ui); font-size: 0.72rem; color: var(--ink);
    display: flex; align-items: center; gap: 0.5rem; width: 100%;
    background: none; border: 0; text-align: left; cursor: pointer;
    padding: 0.32rem 0.7rem;
  }
  .hmenu .hopt:hover { background: var(--paper); }
  .hmenu .hopt[aria-selected="true"] { color: var(--accent); }

  /* ---- highlight ------------------------------------------------------
     A reading of the map's own shape, laid over the fog. Only MARKS respond:
     an open card is already making its own case, and focus outranks this
     entirely, so the two dimming systems never fight. */
  body.highlighting:not(.focusing) .node.unlit { opacity: 0.28; }
  body.highlighting:not(.focusing) .node.unlit.hi { opacity: 1; }
  body.highlighting:not(.focusing) .node.card.unlit.hi {
    background: var(--card); border-color: var(--line);
  }
  body.highlighting:not(.focusing) .node.card.unlit.hi .name {
    font-size: 0.92em; color: var(--ink); font-weight: 600;
  }
  /* a highlighted theme is the query itself, so it reads as the source */
  body.highlighting:not(.focusing) .node.theme.unlit.hi {
    background: var(--ink); border-style: solid; border-color: var(--ink);
    color: var(--paper);
  }

  /* ---- the ask bar -----------------------------------------------------
     The extension questions live here instead of on the map, so this is the
     only way to reach one. Bottom centre: the masthead holds the readings of
     the map, and this is the reader's own line. */
  .askbar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: clamp(1rem, 3vh, 1.8rem); z-index: 8;
    width: min(34rem, calc(100vw - 8rem));
  }
  .askrow {
    display: flex; align-items: stretch;
    background: var(--card); border: 1px solid var(--line); border-radius: 3px;
    box-shadow: 0 14px 34px -18px rgba(20, 22, 26, .3);
    transition: border-color .15s;
  }
  .askbar:focus-within .askrow, .askbar.open .askrow { border-color: var(--ext); }
  /* a miss is said by the bar rather than by an alert: the fuzzy match is not
     built yet, and a dead Enter with no answer reads as a broken field */
  .askbar.miss .askrow { border-color: var(--spark); }
  #askinput {
    flex: 1; min-width: 0; font-family: var(--serif); font-size: 1rem;
    color: var(--ink); background: none; border: 0; outline: none;
    padding: 0.6rem 0.85rem;
  }
  /* the placeholder is a QUESTION being offered, not a label, so it carries
     the extension door's italic and steps back in colour */
  #askinput::placeholder { color: var(--muted); font-style: italic; opacity: 1; }
  .askcaret {
    font-size: 0.7rem; color: var(--muted); line-height: 1;
    background: none; border: 0; border-left: 1px solid var(--line);
    padding: 0 0.7rem; cursor: pointer; transition: color .15s;
  }
  .askcaret:hover { color: var(--ext); }
  .asklist {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 0.4rem);
    max-height: 46vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 3px;
    box-shadow: 0 14px 34px -12px rgba(20, 22, 26, .28);
    padding: 0.25rem 0;
  }
  .asklist[hidden] { display: none; }
  .askgroup {
    font-family: var(--sans); font-size: 0.52rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    padding: 0.55rem 0.7rem 0.25rem;
    border-top: 1px solid var(--line); margin-top: 0.3rem;
  }
  .asklist .askgroup:first-child { border-top: 0; margin-top: 0; }
  .askopt {
    font-family: var(--serif); font-size: 0.85rem; color: var(--ink);
    display: block; width: 100%; text-align: left;
    background: none; border: 0; cursor: pointer; padding: 0.34rem 0.7rem;
  }
  /* the same italic blue the door wears on the map, so a row and the card it
     produces are recognisably the same object */
  .askopt.ext { font-style: italic; color: var(--ext); }
  .askopt:hover, .askopt.on { background: var(--paper); }

  /* ---- the scale gutter ------------------------------------------------
     No longer a legend: a RULER. Each rung is pinned to its band's world
     y, repositioned on every pan and zoom, so the label and the cards at
     that scale are always level with each other. */
  .gutter {
    position: fixed; left: clamp(0.9rem, 2vw, 1.6rem); top: 0; bottom: 0;
    z-index: 5; pointer-events: none; user-select: none;
  }
  .gutter .rung {
    position: absolute; transform: translateY(-50%);
    display: flex; align-items: center; gap: 0.5rem; white-space: nowrap;
    font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: #c9c5ba; transition: color .18s;
  }
  .gutter .rung i {
    width: 14px; height: 2px; background: var(--line); flex: none;
    transition: background .18s, width .18s;
  }
  .gutter .rung.on { color: var(--ink); }
  .gutter .rung.on i { background: var(--tint, var(--accent)); width: 22px; }
  .gutter .rung .how {
    font-size: 0.52rem; color: var(--spark); letter-spacing: 0.1em;
    margin-left: 0.15rem;
  }
  .gutter .rung:not(.on) .how { display: none; }

  /* ---- nodes ----------------------------------------------------------- */

  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: zoom-in;
    user-select: none;
    border-radius: 4px;
    transition: border-color .15s, box-shadow .15s, opacity .18s;
  }
  .node.dragging { cursor: grabbing; box-shadow: 0 10px 26px rgba(20,22,26,.12); }

  .node.card {
    width: 17.5rem;
    padding: 0.85rem 1rem 0.9rem;
    background: var(--card);
    border: 1px solid var(--line);
    text-align: left;
  }
  .node.card .name {
    font-size: 0.6rem; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 0.4rem;
  }
  /* the dot is the UNIT; chemistry nodes wear the cross-subject tint */
  .node.card .name::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--dot, var(--line)); flex: none;
  }
  .node.card .claim {
    font-family: var(--serif); font-size: 1rem; line-height: 1.28;
    color: var(--ink); margin-top: 0.35rem; letter-spacing: -0.005em;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* 4:3 and a RATIO on purpose (the composer's rule): the card sets the
     width, the picture follows, so the closed thumb and the open one are
     the same frame at two sizes. The `.ph` shimmer is the loading state
     until the stage mounts; a still of the last frame stands in when the
     pool takes the context back. */
  /* SCOPED TO `.node`, NOT `.node.card`: a question is not a card, and when
     one gained a lesson every rule here missed it — the raw 1600px still laid
     out at its natural size and the door became eleven hundred pixels tall. */
  .node .thumb {
    position: relative; overflow: hidden;
    width: 100%; aspect-ratio: 4 / 3; margin: 0.65rem 0 0.25rem;
    background: #eceae4; border: 1px solid var(--line); border-radius: 3px;
  }
  .node .thumb .ph {
    position: absolute; inset: 0;
    background: linear-gradient(100deg,
      #eceae4 30%, #f6f4ef 48%, #eceae4 66%) 0 0 / 300% 100%;
    animation: thumb-shimmer 1.5s linear infinite;
  }
  @keyframes thumb-shimmer { to { background-position: -300% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .node .thumb .ph { animation: none; }
  }
  .node .thumb.mounted { background: #f2f0ea; }
  .node .thumb.mounted .ph { display: none; }
  .node .thumb > canvas { display: block; width: 100%; height: 100%; }
  .node .thumb .still {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain;
  }
  .node.unlit .thumb { display: none; }

  /* a video's credit: printed, small, and the only outbound link on a card */
  .node.card .credit {
    font-size: 0.55rem; letter-spacing: 0.06em; color: var(--muted);
    margin-top: 0.3rem;
  }
  .node.card .credit a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
  .node.card .credit a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .node.card.unlit .credit { display: none; }
  /* a poster fills its frame; the generated stills are 16:9 in a 4:3 thumb */
  .node .thumb .still.poster { object-fit: cover; }

  .node.card .tags {
    display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.55rem;
  }
  /* em, not rem: a tag shows through the fog on specimen and content marks,
     so it has to ride the mark's counter-scale the way the name does. Left
     in rem it stayed 8px and rendered at five on screen. */
  .node.card .tag {
    font-size: 0.52em; font-weight: 500; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--line); border-radius: 2px;
    padding: 0.14em 0.34em;
  }
  .node.card .tag.chem   { color: #8a5cc0; border-color: #ded2ef; }

  /* ---- type carried by form, not by a tag ------------------------------ */
  /* every card is opaque — paper, not transparent — so an edge line never
     runs under its text; only the WHITE ground is reserved for structures */
  .node.card.concept { background: var(--paper); border-color: transparent; }
  .node.card.concept:hover,
  .node.card.concept.hub { background: var(--card); border-color: var(--line); }
  .node.card.chem { background: var(--paper); border: 1px dashed #cdbfe3; }
  /* evidence is an experiment, not a claim: card ground, and a rule down the
     left the way a process wears one */
  .node.card.evidence { border-left: 3px solid var(--dot, var(--line)); }
  .node.card .tag.eviD { color: var(--dot, var(--accent)); border-color: currentColor; }
  .node.card.process { border-left: 3px solid var(--dot, var(--line)); }
  .node.card.process .name .run {
    color: var(--dot, var(--muted)); font-weight: 600; margin-right: 0.05rem;
  }

  /* THE PILL IS A NODE, so it is a node's shape: sitting on the paper below
     the card it belongs to, with the question written on it. It is the only
     rounded thing on the map, which is what makes opening one feel like an
     event rather than another chip. */
  .node.askpill {
    padding: 0.4rem 0.9rem; border-radius: 999px; cursor: pointer;
    background: var(--card); border: 1px solid var(--dot, var(--accent));
    color: var(--dot, var(--accent));
    font-family: var(--sans); font-size: 0.62rem; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
    box-shadow: 0 6px 18px -10px rgba(20,22,26,.35);
    transition: background .15s, color .15s;
  }
  .node.askpill:hover { background: var(--dot, var(--accent)); color: var(--card); }

  /* a revealed kind: a small card, no dot, no chips. It is a leaf and it
     says so by being visibly lighter than the card it hangs off. */
  .node.card.satellite {
    width: 13rem; padding: 0.6rem 0.75rem;
    background: var(--card); border-color: var(--line);
    box-shadow: 0 6px 18px -12px rgba(20,22,26,.3);
  }
  .node.card.satellite .name { font-size: 0.55em; }
  .node.card.satellite .name::before { width: 0.6em; height: 0.6em; }
  .node.card.satellite .claim {
    font-size: 0.8em; line-height: 1.3; -webkit-line-clamp: 4;
  }

  /* ---- a specimen card -------------------------------------------------
     The composer's, verbatim in spirit: the concept card inverted. Name
     serif and leading, claim demoted to a caption, provenance quiet and
     tabular, EC class as the tag. No dot. */
  .node.card.specimen .name {
    font-family: var(--serif); font-size: 1.1rem; line-height: 1.2;
    font-weight: 400; letter-spacing: -0.01em; text-transform: none;
    color: var(--ink); display: block;
  }
  .node.card.specimen .name::before { display: none; }
  .node.card.specimen .claim {
    font-family: var(--ui); font-size: 0.72rem; line-height: 1.4;
    color: var(--muted); margin-top: 0.5rem; letter-spacing: 0;
    -webkit-line-clamp: 3;
  }
  .node.card.specimen .thumb { margin-top: 0.55rem; }
  .node.card.specimen .prov {
    font-family: var(--ui); font-size: 0.63rem; line-height: 1.35;
    color: #9a9ca3; margin-top: 0.35rem;
    font-variant-numeric: tabular-nums;
  }
  .node.card.specimen .tag {
    display: inline-flex; align-items: baseline; gap: 0.4rem;
    margin-top: 0.3rem; border: 0; padding: 0;
    font-family: var(--sans); font-size: 0.56em; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent);
  }
  .node.card.specimen .tag span {
    letter-spacing: 0.08em; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .node.card.unlit .prov { display: none; }

  /* ---- a content card: a film or a lesson ------------------------------
     The specimen card's shape. Its opener is the card's whole purpose, so
     it does NOT fade with the rest of a card's controls. */
  .node.card.content { width: 15rem; }
  .node.card.content .name {
    font-family: var(--serif); font-size: 1.05rem; line-height: 1.2;
    font-weight: 400; letter-spacing: -0.01em; text-transform: none;
    color: var(--ink); display: block;
  }
  .node.card.content .name::before { display: none; }
  .node.card.content .tag {
    display: inline-block; margin-top: 0.4em;
    font-size: 0.52em; font-weight: 500; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--line); border-radius: 2px; padding: 0.14em 0.34em;
  }
  .node.card.content .thumb { margin-top: 0.55rem; }
  .node.card.content .opens { margin-top: 0.5rem; }
  .node.card.content .opener { opacity: 1; pointer-events: auto; }

  /* ---- A LESSON OUTRANKS EVERYTHING AROUND IT --------------------------
     The lessons are the featured work and a film is somebody else's, so the
     lesson card is the loudest thing on the paper: wider, its name at the
     size of a claim, a rule down the left in its own region's tint, and an
     opener that is filled rather than outlined. It is the only solid button
     on the map, which is the whole point of a call to action. */
  .node.card.content.lesson {
    width: 19rem;
    border-color: var(--line);
    border-left: 3px solid var(--dot, var(--accent));
    box-shadow: 0 10px 30px -14px rgba(20, 22, 26, 0.3);
  }
  .node.card.content.lesson .name { font-size: 1.4em; line-height: 1.16; }
  .node.card.content.lesson .tag {
    color: var(--dot, var(--accent)); border-color: currentColor;
  }
  .node.card.content.lesson .claim {
    font-family: var(--serif); font-size: 0.82em; line-height: 1.34;
    color: var(--muted); margin-top: 0.5em;
  }
  .node.card.content.lesson .opener {
    background: var(--dot, var(--accent)); color: var(--card);
    border-color: transparent; padding: 0.5em 0.85em; font-size: 0.6em;
    box-shadow: none;
  }
  .node.card.content.lesson .opener:hover {
    background: var(--ink); color: var(--card); border-color: transparent;
  }
  /* fogged, a lesson still reads as the biggest mark in its neighbourhood:
     white ground and its region's rule, against everything else's bare text.
     Back to max-content, though — the open card's 19rem left half the mark
     as empty paper. */
  .node.card.content.lesson.unlit {
    width: max-content;
    border-left: 3px solid var(--dot, var(--accent));
    background: var(--card);
  }
  .node.card.content.lesson.unlit .name { font-size: 0.95em; }
  /* THE TAG SURVIVES THE FOG. Everything else on a content card is withheld
     like any other mark, but a fogged film with its tag hidden is bare serif
     text and reads as one more concept: the one thing a reader needs from
     across the map is that this is a film, or a lesson. */
  .node.card.content.unlit .name { display: inline; }
  .node.card.content.unlit .tag { margin: 0 0 0 0.45rem; vertical-align: 0.12em; }
  .node.card.content.unlit .opens { display: none; }

  /* THE BUTTON IS `.opener`, NOT `.lesson`. A content card wears its kind as
     a class, so a lesson card was itself `.lesson` — which the pointerdown
     guard read as "that is a button, do not start a drag". The card could
     then never be lit or focused, and while it stayed unlit its opener was
     display:none. Nothing to click, and clicking did nothing. The name is
     also just truer: this button opens a film as often as a lesson. */
  .node .opener {
    font-family: var(--sans); font-size: 0.55rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 3px;
    padding: 0.3rem 0.5rem; box-shadow: 0 5px 16px -8px rgba(0,0,0,.4);
    transition: opacity .18s ease, color .15s, border-color .15s;
  }
  .node .opener:hover { color: var(--ink); border-color: var(--ink); }

  /* THE PRIMARY PILL. When the lesson had its own card, that card was the
     loudest thing on the paper and its filled button was the only solid one
     on the map. The lesson now rides its concept, so the pill inherits that
     job: filled, in the concept's own region tint, pill-shaped so it reads
     as an action rather than one more tag. It is the concept card's whole
     call to action, so unlike the other controls it does not fade on a card
     that is merely open rather than focused. */
  .node .opener.primary {
    background: var(--dot, var(--accent)); color: var(--card);
    border-color: transparent; border-radius: 999px;
    padding: 0.45em 0.95em; font-size: 0.58rem; font-weight: 500;
    opacity: 1; pointer-events: auto;
    box-shadow: 0 6px 18px -8px rgba(20, 22, 26, 0.55);
  }
  .node .opener.primary:hover {
    background: var(--ink); color: var(--card); border-color: transparent;
  }
  /* fogged, a card is a mark: no thumb, no claim, and no button either */
  .node.unlit > .opens { display: none; }
  .node > .opens { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.5rem; }

  /* a card's controls belong to the card being WORKED ON: everywhere else
     they are faded, not removed, so nothing reflows on focus. The composer
     gates on apparent size; here the focused card is the one being worked
     on, which is simpler and the same idea.

     THE TWO EXCLUSIONS ARE OPENERS THAT ARE THE CARD'S WHOLE PURPOSE, not
     controls on it: the lesson pill (`.primary`) and a film card's play
     button (`.content`, which sets its own `opacity: 1` above). Both are
     written as exclusions here rather than as louder rules elsewhere —
     every one of those selectors ties this one on specificity, so whichever
     came later in the file silently won. */
  .node:not(.hub) .pbox-rep,
  .node:not(.hub) .pbox-play,
  .node:not(.hub):not(.content) .opener:not(.primary),
  .node:not(.hub) .mb-dims { opacity: 0; pointer-events: none; }

  /* a hub reads bigger before it is clicked: five or more rank-1 edges */
  .node.card.big { width: 22rem; }
  .node.card.big .claim { font-size: 1.2rem; line-height: 1.24; -webkit-line-clamp: 5; }

  /* the open card steps up one size, not to a poster: there is no picture
     to make room for yet, so the growth only has to say "you are here" */
  .node.hub { box-shadow: 0 14px 34px -12px rgba(20,22,26,.22); }
  .node.card.hub { width: 21rem; padding: 1.05rem 1.2rem 1.1rem; }
  .node.card:not(.content):not(.specimen).hub .claim {
    font-size: 1.2rem; line-height: 1.24; margin-top: 0.45rem;
    letter-spacing: -0.008em; -webkit-line-clamp: 6;
  }
  .node.card:not(.content):not(.specimen).hub .name { font-size: 0.64rem; letter-spacing: 0.19em; }
  .node.card.big.hub { width: 24rem; }
  .node.card.big.hub .claim { font-size: 1.35rem; }
  /* a content or specimen card is already at the size its own kind sets, so
     focusing one must not step it up again: the card would resize under the
     click that opened it. */
  .node.card.content.hub,
  .node.card.specimen.hub { padding: 0.85rem 1rem 0.9rem; box-shadow: none; }
  .node.card.specimen.hub { width: 17.5rem; }
  .node.card.content.hub { width: 15rem; }
  .node.card.content.lesson.hub {
    width: 19rem; box-shadow: 0 10px 30px -14px rgba(20, 22, 26, 0.3);
  }

  .node.theme {
    width: 20rem; padding: 1.15rem 1.35rem 1.2rem;
    background: var(--ink); border: 1px solid var(--ink);
    color: var(--paper); text-align: center;
  }
  .node.theme .name {
    font-family: var(--serif); font-size: 1.35rem; line-height: 1.15;
    letter-spacing: -0.015em;
  }
  .node.theme .claim {
    font-family: var(--ui); font-size: 0.72rem; color: #b6b2a8;
    margin-top: 0.4rem;
  }

  /* an anchoring question is a door, and it reads at door size: twice the
     card claim, ink, never fogged */
  .node.question {
    width: 26rem;
    padding: 0.7rem 0.9rem;
    background: var(--paper);
    border: 1px solid transparent;
    font-family: var(--serif); font-size: 2rem; line-height: 1.15;
    letter-spacing: -0.015em; color: var(--ink);
    text-align: center;
  }
  /* A BRIDGING QUESTION IS A SMALLER DOOR. An anchor opens a unit and should
     be findable from across the map; a bridging one joins two units already
     in view, so it reads at the scale of the cards it sits between rather
     than competing with the unit it is inside. Narrower too, or a short
     question sets one enormous line. */
  .node.question.bridging, .node.question.extension {
    width: 19rem; max-width: 19rem;
    font-size: 1.25rem; line-height: 1.2; letter-spacing: -0.008em;
    color: var(--muted);
  }
  /* AN EXTENSION DOOR OPENS ONTO A FAN, not onto a claim, so it is marked as
     a different act rather than a smaller one: italic and blue, a colour no
     unit owns. Clicking it deals the kinds of the card it answers into. */
  .node.question.extension { font-style: italic; }
  /* a fogged question is sized by max-content against a max-width, so the
     narrower cap has to be restated here or the fog rule's 26rem wins */
  .node.question.unlit.bridging,
  .node.question.unlit.extension { max-width: 19rem; }
  .node.question.hub {
    width: 28rem; padding: 0.9rem 1rem 0.95rem;
  }

  /* ---- fog of war ------------------------------------------------------
     An unlit node is a MARK: dot and name on the paper, claim withheld.
     The map's shape is always visible; its content is earned by walking
     to it. Same element, so lighting never relayouts the world. */
  /* a mark's ground hugs its title — the full card width would blank out
     edges far beyond the text it is protecting */
  .node.card.unlit {
    background: var(--paper); border-color: transparent;
    width: max-content;
  }
  .node.card.unlit .claim, .node.card.unlit .tags { display: none; }
  .node.card.unlit.process { border-left-color: transparent; }
  .node.theme.unlit {
    background: var(--paper); border: 1px dashed var(--line); color: var(--ink);
    width: max-content;
  }
  /* A MARK IS A MAP LABEL. Below k=1 it counter-scales, so a name stays the
     size the reader is actually looking at while the card it will become
     scales with the rest of the world. Everything inside a mark is sized in
     em off `--markk` so the ground, the dot and the tracking follow the
     name instead of being left behind by it. The cap is why the labels do
     not eventually eat the map: full compensation at k=0.18 would stack
     them on top of each other, and past ~0.4 a label may shrink. */
  .node.card.unlit, .node.theme.unlit {
    font-size: calc(1rem * var(--markk, 1));
    padding: 0.85em 1em 0.9em;
  }
  .node.card.unlit .name { font-size: 0.6em; }
  .node.card.unlit .name::before { width: 0.7em; height: 0.7em; }
  .node.theme.unlit .name { font-size: 1em; }
  .node.theme.unlit .claim { display: none; }
  .node.question.unlit { width: max-content; max-width: 26rem; }
  /* a mark hovers the way a question does: card ground, line border, ink */
  .node.card.unlit:hover,
  .node.theme.unlit:hover,
  .node.question.unlit:hover {
    background: var(--card); border-color: var(--line); border-style: solid;
  }
  /* a focused card's neighbours present themselves: a mark in the hops
     takes the card ground, so the offer reads as an offer rather than as
     fog that happens to be near */
  .focusing .node.card.unlit.lit {
    background: var(--card); border-color: var(--line);
  }
  .focusing .node.theme.unlit.lit {
    background: var(--card); border-style: solid; border-color: var(--line);
  }

  /* the focused card's neighbour groups: the direction of learning */
  .node .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.55rem; }
  .node .chips:empty { display: none; }
  .chip {
    font-family: var(--sans); font-size: 0.55rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
    background: var(--card); border: 1px solid #cfdcd7; border-radius: 2px;
    padding: 0.28rem 0.5rem; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.contrast { color: var(--spark); border-color: #f2cdbd; }
  .chip.contrast:hover { border-color: var(--spark); }
  .node.question .chips { justify-content: center; }
  /* a question that holds a lesson: the picture and the pill sit under the
     words, centred like the chips, and the type comes down because a 2rem
     question over a screenshot is a poster rather than a card */
  .node.question .thumb { margin-top: 0.8rem; }
  .node.question > .opens { justify-content: center; margin-top: 0.6rem; }
  .node.question.haslesson { font-size: 1.5rem; }
  .node.question.haslesson.lit { background: var(--card); border-color: var(--line); }
  .node.theme .chip { background: transparent; }

  .node:hover { border-color: var(--accent); }
  .node.question:hover { background: var(--card); border-color: var(--line); color: var(--ink); }

  .focusing .node { opacity: 0.18; pointer-events: none; }
  .focusing .node.lit { opacity: 1; pointer-events: auto; }
  .focusing .node.hop2 { opacity: 1; }
  .focusing .node.question.lit {
    background: var(--card); border-color: var(--line); color: var(--ink);
  }
  /* the blue is the extension door's identity, so it outlives hover and
     focus — both of which repaint a question in ink. Stated after them
     rather than at the type rule, which they would otherwise win. */
  .node.question.extension,
  .node.question.extension:hover,
  .focusing .node.question.extension.lit { color: var(--ext); }
  .node.question.extension:hover { border-color: var(--ext); }

  /* ---- the lesson, over the map (kit/modal.js reads this markup) ------- */
  .modal {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(0.75rem, 2.5vw, 2rem);
  }
  .modal[hidden] { display: none; }
  .modal .mback {
    position: absolute; inset: 0;
    background: rgba(20, 22, 26, 0.55);
    animation: mfade .2s ease-out;
  }
  .modal .mcard {
    position: relative;
    display: flex; flex-direction: column; min-height: 0;
    width: min(1280px, 100%); height: min(860px, 100%);
    background: var(--card); border-radius: 6px; overflow: hidden;
    box-shadow: 0 30px 70px -24px rgba(0, 0, 0, .5);
    animation: mrise .24s cubic-bezier(.2, .9, .3, 1);
  }
  @keyframes mfade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes mrise { from { opacity: 0; transform: translateY(12px) scale(.99) }
                     to   { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) {
    .modal .mback, .modal .mcard { animation: none; }
  }
  .modal .mhead {
    flex: none; display: flex; align-items: center; gap: 1rem;
    padding: 0.7rem 0.6rem 0.7rem 1.1rem;
    border-bottom: 1px solid var(--line);
  }
  .modal .mhead > span:first-child {
    flex: 1;
    font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
  .modal .mclose {
    font-family: var(--sans); font-size: 1.35rem; line-height: 1;
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 0.2rem 0.5rem;
  }
  .modal .mclose:hover { color: var(--ink); }
  /* Safari sizes a flex iframe from its intrinsic 300x150, not the free
     space, so the height is stated and min-height:0 lets it shrink. */
  #lessonframe { flex: 1 1 auto; width: 100%; height: 100%; min-height: 0;
                 border: 0; display: block; }

  .hint {
    position: fixed; right: clamp(1rem, 3vw, 2rem); bottom: 1.1rem; z-index: 5;
    font-size: 0.7rem; letter-spacing: 0.06em; color: var(--muted);
  }
</style>
</head>
<body>

<header class="mast">
  <a class="logo" href="../index.html">kodo<em>lab</em><span class="dot">.</span></a>
  <span class="title">Biology</span>
  <span class="spacer"></span>
  <div class="hilite" id="hilitewrap">
    <button type="button" class="hbtn" id="hilitebtn"
            aria-haspopup="listbox" aria-expanded="false">
      <span class="hdot" id="hilitedot" hidden></span>
      <span class="hlabel" id="hilitelabel">all</span>
      <span class="caret">&#9660;</span>
    </button>
    <div class="hmenu" id="hilitemenu" role="listbox" hidden></div>
    <select id="hilite">
      <option value="">all</option>
      <!-- one option per unit, appended at load from UNITS -->
      <optgroup label="by unit" id="hiliteunits"></optgroup>
      <optgroup label="by weight">
        <option value="carries">what carries the map</option>
        <option value="through">most paths through</option>
        <option value="degree">most connections</option>
        <option value="bridge">bridges between units</option>
        <option value="all">all of the above</option>
      </optgroup>
      <!-- one option per theme, appended at load from the data -->

<!-- the ask bar: every question on the map is reachable from here, and the
     extension ones are reachable ONLY from here -->
<div class="askbar" id="askbar">
  <div class="asklist" id="asklist" role="listbox" hidden></div>
  <div class="askrow">
    <input id="askinput" type="text" autocomplete="off" spellcheck="false"
           aria-label="ask a question of the map">
    <button type="button" class="askcaret" id="askcaret"
            aria-label="all the questions">&#9662;</button>
  </div>
</div>

<!-- The lesson, over the map. The iframe is empty until it opens and emptied
     on close: a lesson is its own WebGL context and about a megabyte of
     trajectory, and neither should be paid by a reader who never opened it. -->
<div id="lessonmodal" class="modal" hidden>
  <div class="mback"></div>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="lessontitle">
    <div class="mhead">
      <span id="lessontitle">the lesson</span>
      <button class="mclose" aria-label="Close">&times;</button>
    </div>
    <iframe id="lessonframe" title="lesson" allow="fullscreen"></iframe>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="../lib/skel.js"></script>           <!-- mol-pathways and mol-krebs both require it -->
<script src="../lib/mol-pathways.js"></script>   <!-- glucose, pyruvate, ATP, NADH -->
<script src="../lib/mol-krebs.js"></script>      <!-- acetyl-CoA -->
<script src="../lib/scene.js"></script>
<script src="../lib/fx.js"></script>

<script src="../lib/ionic-drag.js"></script>

<script src="../proteins/proteins.js"></script>   <!-- the specimen registry: p: placements name keys in it -->
<script src="../kit/modal.js"></script>
<script src="../kit/card-stage.js"></script>
<script src="../kit/molbox.js"></script>
<script src="../molecule-builder/molecule-builder.js"></script>
<script src="../kit/ribbon.js"></script>
<script src="../kit/proteinbox.js"></script>      <!-- after every library it reads -->
<script src="../kit/surface.js"></script>         <!-- SurfLib, on demand -->
<script src="../hemoglobin/hbfold.js"></script>   <!-- the fold, on demand -->
<script src="../hemoglobin/foldplay.js"></script>
<script src="graphdata.js"></script>
<script src="graphcontent.js"></script>
<script>
'use strict';

const { UNITS, CHEM_TINT, LADDER, NODES, EDGES } = GraphData;

/* ---- graph ------------------------------------------------------------- */

const world = document.getElementById('world');
const svg = document.getElementById('edges');
const NS = 'http://www.w3.org/2000/svg';

const nodes = [], byId = {};
let links = [];                 /* reassigned when a card's kinds collapse */
for (const spec of NODES) {
  const n = { ...spec, deg: 0 };
  nodes.push(n); byId[n.id] = n;
}
for (const [from, type, to, rank] of EDGES) {
  const a = byId[from], b = byId[to];
  if (!a || !b) { console.warn('edge names a missing node:', from, type, to); continue; }
  links.push({ a, b, type, rank });
  a.deg++; b.deg++;
}

/* ---- the deferred doors -------------------------------------------------
   AN EXTENSION QUESTION IS NOT ON THE MAP. It is a query, and a query has no
   seat: it arrives at whatever it asked about and leaves with it. So the node
   and its `answers` edge are pulled out here, BEFORE layout — they are
   authored in graphdata.js like anything else, and `anchorId` is all that
   survives into the page. Leaving them in cost nothing visible and moved
   every neighbour they repelled. */
const QUERIES = nodes.filter(n => n.type === 'question' && n.qtype === 'extension');
for (const q of QUERIES) {
  const answers = links.filter(l => (l.a === q || l.b === q) && l.type === 'answers');
  const best = answers.sort((a, b) => a.rank - b.rank)[0];
  q.anchorId = best ? (best.a === q ? best.b.id : best.a.id) : null;
  if (!q.anchorId) console.warn('extension question answers nothing:', q.id);
  /* the degree was counted when the edge was built, and degree sizes hubs —
     so give it back, or every extension's answer reads one link heavier */
  for (const l of links) if (l.a === q || l.b === q) { l.a.deg--; l.b.deg--; }
  links = links.filter(l => l.a !== q && l.b !== q);
  nodes.splice(nodes.indexOf(q), 1);
}

const neighbours = n => links.flatMap(l => l.a === n ? [l.b] : l.b === n ? [l.a] : []);
const linksOf = n => links.filter(l => l.a === n || l.b === n);

/* RANK IS AUTHORED AND NEVER REWRITTEN. It draws the edge, orders a fan for
   the walk, and sizes a hub, so a node that rewrites it is falsifying all
   three. Reachability is a separate claim and gets its own field: `spine`
   is rank 1 plus, for a node whose best edge is rank 2 or 3, that best edge,
   so nothing on the map is unreachable by a rank-1 walk. Doing
   this by promoting rank was what erased the map's only rank-3 edge — vdw
   part-of rgroup-inter, and rank 3 is exactly the claim it wants to make. */
for (const l of links) l.spine = l.rank === 1;
for (const n of nodes) {
  const mine = linksOf(n);
  if (!mine.length) { console.warn('orphan node:', n.id); continue; }
  const best = Math.min(...mine.map(l => l.rank));
  if (best > 1) for (const l of mine) if (l.rank === best) l.spine = true;
}

/* hub weight is read from the data: five rank-1 edges is the soft budget,
   so a card at or past it is by definition a mechanism hinge */
for (const n of nodes)
  n.big = linksOf(n).filter(l => l.rank === 1).length >= 5;

/* ---- content: what a card can show --------------------------------------
   graphcontent.js is optional — the map is a working page without it. A
   node mounts its best-ranked inline item and no more: a live box is a
   WebGL context and the pool rations four across the whole map. */
const CONTENT = (window.GraphContent || {}).CONTENT || [];
const PLACED = new Map(((window.GraphContent || {}).PLACEMENTS || []));
const BY_CONTENT = new Map(CONTENT.map(c => [c.id, c]));
/* INLINE rides the node: a molbox, a water sim, a builder or a ribbon IS the
   card's own subject drawn, so it belongs in the card's thumb. A LESSON IS
   INLINE TOO, and it is the one that wins the thumb — it arrives as a
   screenshot rather than a live box, so the old objection (two live things
   competing for one thumb, which is what glycolysis carried) is gone, and
   what a reader wants from a concept that HAS a lesson is the lesson.
   CARD is the other kind: a film is somebody else's object and keeps its
   own card, the way a specimen does. */
const INLINE = { water: 1, build: 1, molbox: 1, protein: 1, lesson: 1 };
const CARD = { video: 1 };
const ON_NODE = new Map();
for (const [cid, ranks] of PLACED) {
  if (cid.startsWith('p:')) continue;          // specimens: their own pass below
  const item = BY_CONTENT.get(cid);
  if (!item) { console.warn('placement names missing content:', cid); continue; }
  if (CARD[item.kind]) continue;               // its own card: the pass below
  for (const [nid, rank] of Object.entries(ranks)) {
    if (!byId[nid]) { console.warn('placement names missing node:', cid, nid); continue; }
    (ON_NODE.get(nid) || ON_NODE.set(nid, []).get(nid)).push({ item, rank });
  }
}
/* rank first, then a lesson ahead of a live box at the same rank: `folding`
   places both at 1, and the tie has to break the same way every load or the
   card's face depends on source order. */
for (const list of ON_NODE.values())
  list.sort((a, b) => a.rank - b.rank ||
                      (b.item.kind === 'lesson') - (a.item.kind === 'lesson'));

for (const c of CONTENT)
  if (c.kind === 'lesson' && !c.shot) console.warn('lesson has no shot:', c.id);

/* a card mounts its best-ranked INLINE item and no more; a specimen carries
   its own render, because a card that IS content does not look it up */
/* the lesson a concept holds, if any — the opener under its thumb */
const lessonFor = n => {
  const placed = (ON_NODE.get(n.id) || []).find(x => x.item.kind === 'lesson');
  return placed ? placed.item : null;
};

const viewFor = n => {
  if (n.type === 'specimen') return { kind: 'protein', protein: n.protein, variant: n.variant };
  const placed = (ON_NODE.get(n.id) || []).filter(x => INLINE[x.item.kind]);
  return placed.length ? placed[0].item : null;
};


/* ---- specimens ----------------------------------------------------------
   Spawned from proteins/proteins.js, the registry of what we hold — a `p:`
   placement says WHERE one hangs and WHICH STRUCTURE it hangs there. The
   card prints only what `read` carries (the baker's half), so it cannot
   claim what a re-bake no longer holds. The edge is instance-of, which is
   also what places a specimen one column right of the concept it
   exemplifies.

   `p:<key>` takes the registry's default variant; `p:<key>@<variant>` names
   one. An exemplar has to be able to show the thing it is an exemplar OF —
   hexokinase demonstrates induced fit, and its default is the OPEN form,
   which is the state induced fit has not happened in yet. One card per
   protein either way: the node id is the key, never the variant. */
const SPEC = (window.ProteinLib && window.ProteinLib.PROTEINS) || [];
const specKey = id => id.slice(2).split('@')[0];
const specWant = id => id.slice(2).split('@')[1] || null;
for (const id of PLACED.keys())
  if (id.startsWith('p:') && !SPEC.some(p => p.key === specKey(id)))
    console.warn('placement names no such protein:', id);
for (const p of SPEC) {
  const ids = [...PLACED.keys()].filter(k => k.startsWith('p:') && specKey(k) === p.key);
  if (ids.length > 1) console.warn(p.key + ': placed more than once, using ' + ids[0]);
  const row = PLACED.get(ids[0]);
  if (!row) continue;                          // unplaced: not on the map yet
  const want = specWant(ids[0]);
  const asked = want && p.variants.find(x => x.id === want);
  if (want && !asked) console.warn(ids[0] + ': no such variant, using the default');
  const v = asked || p.variants.find(x => x.default) || p.variants[0];
  const ribbon = v && (v.bake ? v.bake.trace : v.read && v.read.baked);
  if (!ribbon) { console.warn(p.key + ': no baked ribbon'); continue; }
  const ec = v.read.ec || null;
  const cls = ec ? (ProteinLib.EC_CLASS || [])[Number(ec.split('.')[0])] : null;
  const n = {
    id: 'p:' + p.key, type: 'specimen', level: 2, unit: 'proteins', deg: 0,
    name: p.name, claim: p.blurb, does: p.does,
    protein: p.key, variant: v.id,
    species: v.species, method: v.read.method,
    residues: v.read.residues, declared: v.read.declared,
    ec, ecClass: cls ? cls[0] : null, ecDoes: cls ? cls[1] : null,
  };
  nodes.push(n); byId[n.id] = n;
  for (const [nid, rank] of Object.entries(row)) {
    const m = byId[nid];
    if (!m) { console.warn('specimen placed on missing node:', n.id, nid); continue; }
    links.push({ a: n, b: m, type: 'instance-of', rank, spine: rank === 1 });
    n.deg++; m.deg++;
  }
}

/* ---- content cards ------------------------------------------------------
   A film and a lesson are their own objects, so each is its own card, the
   same shape as a specimen. `illustrates` is BACKWARD, which puts the card
   one column right of what it illustrates — the concept is the station, the
   film is the thing hanging off it. No level: a film is not at a scale, so
   it settles at its neighbours' y like any levelless node. */
for (const [cid, ranks] of PLACED) {
  const item = BY_CONTENT.get(cid);
  if (!item || !CARD[item.kind]) continue;
  const n = { ...item, type: 'content', deg: 0 };
  nodes.push(n); byId[n.id] = n;
  for (const [nid, rank] of Object.entries(ranks)) {
    const m = byId[nid];
    if (!m) { console.warn('content placed on missing node:', n.id, nid); continue; }
    /* the card wears the tint of the FIRST region it illustrates, so a lesson
       reads as belonging to its unit rather than floating between them */
    if (!n.tint) n.tint = (UNITS[m.unit] || {}).tint;
    links.push({ a: n, b: m, type: 'illustrates', rank, spine: rank === 1 });
    n.deg++; m.deg++;
  }
}

/* the reachability pass above ran before these existed, so specimens and
   content cards get their own. A protein placed only at rank 2 — collagen,
   gfp and ferritin are each the SECOND exemplar of their concept — would
   otherwise carry no spine edge at all and be unreachable. */
for (const n of nodes) {
  if (n.type !== 'specimen' && n.type !== 'content') continue;
  const mine = linksOf(n);
  if (mine.some(l => l.spine)) continue;
  const best = Math.min(...mine.map(l => l.rank));
  for (const l of mine) if (l.rank === best) l.spine = true;
}

/* ---- edge grammar -------------------------------------------------------
   The type dictionaries below drive BOTH the x-layering and the why/so-what
   grouping, so the layout and the affordances cannot disagree.

   FORWARD: a explains / becomes / builds b — a sits left of b.
   BACKWARD: a acts on / instantiates b — b sits left of a.
   Everything else (contrasts-with, describes, answers, preserves, spends,
   supplies) imposes no order.

   `spends` and `supplies` are the deliberate pair, and the map has now
   earned them three times: active transport's ATP, fermentation's recycled
   NAD⁺, and the sugar the Calvin cycle hands to glycolysis. A RESOURCE
   CLAIM IS NOT AN EXPLANATORY ORDER. Biology's resources genuinely go round
   in loops and the explanation axis is a DAG, so any edge that says "this
   makes the stuff that one over there uses" has to be able to say it
   without also claiming which is read first. instance-of into a THEME is exempted: a theme is a
   view over the map, not a station on the explanation.

   CONTAINMENT IS TWO RELATIONS, and they point opposite ways. `part-of`
   BUILDS: amino acids make a primary structure, phospholipids make a
   bilayer, so the part is read first. `contains` ZOOMS IN: you meet the
   enzyme and then look inside it for the pocket, so the whole is read
   first. One type for both put the entire enzyme subtree six columns
   LEFT of the enzyme and left the walk with nowhere to go from it. */
const FORWARD = {
  'prerequisite-of': 1, 'causes': 1, 'determines': 1, 'enables': 1,
  'produces': 1, 'alters': 1, 'transforms-into': 1, 'evidence-for': 1,
  'part-of': 1, 'contains': 1, 'contributes-to': 1, 'lowers': 1, 'precedes': 1,
  'necessitates': 1,
};
/* LATERAL types sit BESIDE the reading rather than along it, so they impose
   no order, wear the contrast colour and carry no arrowhead. `contrasts-with`
   holds two things apart; `analogous-to` says two things are the same move in
   different systems, which is what NADPH is to NADH. Opposite claims, same
   geometry: neither one is a step. */
const LATERAL = { 'contrasts-with': 1, 'analogous-to': 1 };
const BACKWARD = {
  'consumes': 1, 'destroys': 1, 'explained-by': 1, 'instance-of': 1,
  /* a film hangs off what it illustrates, so it lands to the right of it */
  'illustrates': 1,
};

/* the ordering constraint a link imposes: [earlier, later], or null */
function ordered(l) {
  if (l.type === 'instance-of' && l.b.type === 'theme') return null;
  if (FORWARD[l.type])  return [l.a, l.b];
  if (BACKWARD[l.type]) return [l.b, l.a];
  return null;
}

/* which side of the reading a neighbour sits on, seen from n:
   'why' is upstream (what explains this), 'onward' is downstream (what
   this makes possible), 'contrast' is beside. answers counts as why from
   the concept's side — the question is the motivation. */
function groupOf(l, n) {
  if (LATERAL[l.type]) return 'contrast';
  const o = ordered(l);
  if (o) return o[1] === n ? 'why' : 'onward';
  if (l.type === 'answers') return n === l.b ? 'why' : 'onward';
  return n === l.b ? 'why' : 'onward';
}

/* ---- x: explanatory order ----------------------------------------------
   Longest-path layering over the ordering constraints, with a cycle guard
   (a cycle here is a data bug: usually a causes edge typed backwards).
   Nodes with no upstream constraint are then pulled RIGHT to just before
   their first consequence, so a disulfide bridge does not sit beside
   electronegativity merely because nothing points at it. Questions are
   exempt: a question is a door, placed just left of its best answer. */
const inCons = new Map(nodes.map(n => [n, []]));
const outCons = new Map(nodes.map(n => [n, []]));
for (const l of links) {
  const o = ordered(l);
  if (!o || o[0].type === 'question' || o[1].type === 'question') continue;
  inCons.get(o[1]).push(o[0]);
  outCons.get(o[0]).push(o[1]);
}
const layerOf = new Map();
function layer(n, stack = new Set()) {
  if (layerOf.has(n)) return layerOf.get(n);
  if (stack.has(n)) { console.warn('ordering cycle at', n.id); return 0; }
  stack.add(n);
  const ins = inCons.get(n);
  const v = ins.length ? Math.max(...ins.map(m => layer(m, stack) + 1)) : 0;
  stack.delete(n);
  layerOf.set(n, v);
  return v;
}
for (const n of nodes) if (n.type !== 'question') layer(n);
/* pull sourceless nodes right, to just before their first consequence —
   IGNORING consequences whose only constraint is this node (they trail
   it, so using them is circular: point-mutation would be held at 0 by
   nat-select, whose position comes from point-mutation) — then
   re-propagate the longest path so the trailers follow. */
for (const n of nodes) {
  if (n.type === 'question' || inCons.get(n).length) continue;
  const anchored = outCons.get(n).filter(m =>
    inCons.get(m).some(p => p !== n));
  if (anchored.length)
    layerOf.set(n, Math.max(0, Math.min(...anchored.map(m => layerOf.get(m))) - 1));
}
for (let pass = 0; pass < 12; pass++) {
  let changed = false;
  for (const n of nodes) {
    if (n.type === 'question' || !inCons.get(n).length) continue;
    const v = Math.max(...inCons.get(n).map(m => layerOf.get(m) + 1));
    if (v > layerOf.get(n)) { layerOf.set(n, v); changed = true; }
  }
  if (!changed) break;
}
/* MEDIAN TIGHTENING. Longest-path layering puts every node as far LEFT as
   its constraints allow, which is right for a node whose story starts there
   and wrong for one that is merely reachable early: glucose sat at column 5
   with six columns of slack, nine away from the glycolysis that consumes it,
   because digestion happens to mention it first.

   So each node with slack moves to the median of its RANK-1 neighbours,
   clamped to the range its own constraints still allow. Rank 1 is what makes
   this safe to apply everywhere: bilayer has one late consumer
   (chemiosmosis, sixteen columns right) and two early rank-1 causes, so its
   median stays early and the water unit does not get torn apart chasing it.
   The clamp is what keeps it legal, so no edge can reverse. */
for (let pass = 0; pass < 4; pass++) {
  let moved = false;
  for (const n of nodes) {
    if (n.type === 'question') continue;
    const ins = inCons.get(n), outs = outCons.get(n);
    if (!outs.length) continue;                   /* a sink has nowhere to go */
    const lo = ins.length ? Math.max(...ins.map(m => layerOf.get(m) + 1)) : 0;
    const hi = Math.min(...outs.map(m => layerOf.get(m))) - 1;
    if (hi <= lo) continue;                       /* no slack to spend */
    let near = linksOf(n).filter(l => l.rank === 1)
      .map(l => (l.a === n ? l.b : l.a))
      .filter(m => m.type !== 'question' && layerOf.has(m))
      .map(m => layerOf.get(m));
    if (!near.length) continue;
    near.sort((a, b) => a - b);
    const mid = near.length % 2
      ? near[(near.length - 1) / 2]
      : (near[near.length / 2 - 1] + near[near.length / 2]) / 2;
    const want = Math.round(Math.min(hi, Math.max(lo, mid)));
    if (want !== layerOf.get(n)) { layerOf.set(n, want); moved = true; }
  }
  if (!moved) break;
}

/* authored column nudges apply after the algorithm has spoken, and before
   anything (question anchors, neighbour means) reads the layers */
for (const n of nodes)
  if (n.nudge && layerOf.has(n)) layerOf.set(n, layerOf.get(n) + n.nudge);

/* a node with NO ordering edges (induced-fit, the themes) has no place on
   the explanation axis of its own — it sits at the mean of its neighbours */
for (const n of nodes) {
  if (n.type === 'question') continue;
  if (inCons.get(n).length || outCons.get(n).length) continue;
  const ns = neighbours(n).filter(m => m.type !== 'question');
  if (ns.length)
    layerOf.set(n, ns.reduce((s, m) => s + layerOf.get(m), 0) / ns.length);
}
/* a question is anchored to its RANK-1 answer — the door hangs at its own
   door frame, not at the mean of everything it opens. Among several rank-1
   answers, the earliest layer wins: the question enters the story where
   the story starts. */
for (const n of nodes) {
  if (n.type !== 'question') continue;
  const aLinks = linksOf(n).filter(l => l.type === 'answers');
  if (!aLinks.length) { n.anchor = null; continue; }
  const bestRank = Math.min(...aLinks.map(l => l.rank));
  n.anchor = aLinks.filter(l => l.rank === bestRank)
    .map(l => l.a === n ? l.b : l.a)
    .sort((a, b) => layerOf.get(a) - layerOf.get(b))[0];
}
const COLW = 430;
for (const n of nodes) n.tx =
  ((n.type === 'question' ? (n.anchor ? layerOf.get(n.anchor) - 0.7 : 0)
                          : layerOf.get(n))) * COLW;

/* ---- y: the scale ladder ------------------------------------------------
   Bands from the ladder, top is ecosystem because up is bigger. Bands
   nothing occupies stay thin — present on the ruler, not spent on screen.
   A leveled node sits in its band; a levelless one (concepts, themes,
   questions) settles at the mean of its neighbours, iterated, which is
   what lets polarity float between the water and protein shelves. */
const lvOf = n => n.level || n.occursAt || n.emergesAt || 0;
const used = new Set(nodes.map(lvOf).filter(Boolean));
const bandCentre = {}, bandEdge = [];
{
  let y = 0;
  for (let lv = 10; lv >= 1; lv--) {
    const h = used.has(lv) ? 660 : 130;
    bandEdge.push(y);
    bandCentre[lv] = y + h / 2;
    y += h;
  }
  bandEdge.push(y);
}
for (const n of nodes) n.ty = lvOf(n) ? bandCentre[lvOf(n)] : bandCentre[2];

/* WITHIN A BAND, ORDER BY THE GRAPH. Which rung a node sits on is its scale
   and is not negotiable, but its height ON that rung used to be left to
   repulsion and a jitter — so a membrane protein could sit below the
   tertiary structure it is an instance of, while the selective permeability
   that necessitates it was a whole band above and the edge crossed
   everything in between. Every node now settles at the MEDIAN of its rank-1
   neighbours; a leveled one is then clamped back into its own band. The
   ladder still says which rung, the edges say where along it. */
const BAND_PAD = 110;
const bandLo = {}, bandHi = {};
for (const lv of used) {
  bandLo[lv] = bandCentre[lv] - 330 + BAND_PAD;
  bandHi[lv] = bandCentre[lv] + 330 - BAND_PAD;
}
for (let pass = 0; pass < 12; pass++)
  for (const n of nodes) {
    if (n.type === 'question') continue;
    let ns = linksOf(n).filter(l => l.rank === 1).map(l => (l.a === n ? l.b : l.a));
    if (!ns.length) ns = neighbours(n);
    ns = ns.filter(m => m.type !== 'question');
    if (!ns.length) continue;
    const ys = ns.map(m => m.ty).sort((a, b) => a - b);
    const mid = ys.length % 2
      ? ys[(ys.length - 1) / 2]
      : (ys[ys.length / 2 - 1] + ys[ys.length / 2]) / 2;
    const lv = lvOf(n);
    n.ty = lv ? Math.max(bandLo[lv], Math.min(bandHi[lv], mid)) : mid;
  }
/* after the concepts settle: a question sits level with its anchor */
for (const n of nodes)
  if (n.type === 'question' && n.anchor) n.ty = n.anchor.ty;

/* start positions: the semantic target plus a deterministic nudge, so
   stacked cards separate the same way every load */
nodes.forEach((n, i) => {
  n.x = n.tx;
  n.y = n.ty + ((i * 137) % 97 - 48) * 2.2;
  n.vx = n.vy = 0;
});

/* ---- DOM --------------------------------------------------------------- */

const esc = t => String(t == null ? '' : t)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function paintNode(n) {
  const el = document.createElement('div');
  if (n.type === 'question') {
    /* an anchoring question is the door into a unit; a bridging one links two
       that are already open. Both are questions, so both are doors, but they
       are not the same size of door. */
    el.className = 'node question unlit ' + (n.qtype || 'anchor');
    /* A QUESTION CAN CARRY A LESSON. Where a lesson is a whole unit rather
       than one claim — water-lab is — no concept card is the right host, and
       the door is. The question keeps its own shape and gains a picture and
       the pill under it, the same two things a concept card gains. */
    const qLesson = lessonFor(n);
    if (qLesson) el.classList.add('haslesson');
    el.innerHTML = '<span>' + esc(n.text) + '</span>' +
                   (qLesson
                     ? '<div class="thumb"><span class="ph"></span></div>' +
                       '<div class="opens"><button type="button" ' +
                       'class="opener primary" data-open="' + esc(qLesson.id) +
                       '">view lesson</button></div>' : '') +
                   '<div class="chips"></div>';
  } else if (n.type === 'theme') {
    el.className = 'node theme unlit';
    el.innerHTML = '<div class="name">' + esc(n.name) + '</div>' +
                   '<div class="claim">' + esc(n.claim) + '</div>' +
                   '<div class="chips"></div>';
  } else if (n.type === 'specimen') {
    /* the composer's specimen card, inverted from a concept's: the NAME is
       the card, because a specimen is a thing and its blurb is a label on
       it. No dot — a specimen belongs to every concept that names it. The
       prov line is read from the baker's half of the registry. */
    el.className = 'node card unlit specimen';
    const tag = n.does === 'enzyme' && n.ecClass
      ? '<div class="tag" title="' + esc(n.ecDoes || '') + '">' + esc(n.ecClass)
        + '<span>EC ' + esc(n.ec) + '</span></div>'
      : n.does === 'enzyme' ? '<div class="tag">enzyme</div>' : '';
    const prov = [
      n.method,
      n.residues != null && n.declared != null
        ? n.residues + ' of ' + n.declared + ' residues' : null,
      n.species,
    ].filter(Boolean).map(esc).join(' · ');
    el.innerHTML = '<div class="name">' + esc(n.name) + '</div>' + tag +
                   '<div class="thumb"><span class="ph"></span></div>' +
                   '<div class="claim">' + esc(n.claim) + '</div>' +
                   '<div class="prov">' + prov + '</div>' +
                   '<div class="chips"></div>';
  } else if (n.type === 'ask') {
    el.className = 'node askpill';
    el.dataset.host = n.host.id;
    el.textContent = n.label;
  } else if (n.type === 'satellite') {
    el.className = 'node card satellite';
    if (n.tint) el.style.setProperty('--dot', n.tint);
    el.innerHTML = '<div class="name">' + esc(n.name) + '</div>' +
                   '<div class="claim">' + esc(n.claim) + '</div>';
  } else if (n.type === 'content') {
    /* the specimen card's shape, for the same reason: this card IS a thing,
       so its name leads and its claim is a label on it. A film carries its
       still and its credit; a lesson carries neither and says so. */
    el.className = 'node card unlit content ' + n.kind;
    if (n.tint) el.style.setProperty('--dot', n.tint);
    el.innerHTML = '<div class="name">' + esc(n.name) + '</div>' +
                   '<div class="tag">' + (n.kind === 'video' ? 'film' : 'lesson') + '</div>' +
                   (n.blurb ? '<div class="claim">' + esc(n.blurb) + '</div>' : '') +
                   (n.poster
                     ? '<div class="thumb mounted"><img class="still poster" alt="" src="../' +
                       esc(n.poster) + '"></div>' : '') +
                   (n.credit
                     ? '<div class="credit"><a href="' + esc(n.creditUrl) +
                       '" target="_blank" rel="noopener">' + esc(n.credit) + '</a>' +
                       (n.year ? ' · ' + n.year : '') + '</div>' : '') +
                   '<div class="opens"><button type="button" class="opener" data-open="' +
                     esc(n.id) + '">' + (n.kind === 'video' ? 'play' : 'open lesson') +
                   '</button></div>' +
                   '<div class="chips"></div>';
  } else {
    el.className = 'node card unlit ' + n.type +
                   (n.big ? ' big' : '') +
                   (n.subject === 'chemistry' ? ' chem' : '');
    const tint = n.subject === 'chemistry' ? CHEM_TINT : (UNITS[n.unit] || {}).tint;
    if (tint) el.style.setProperty('--dot', tint);
    n.tint = tint;
    /* no scale tag: the gutter is the ruler, and a card at a rung sits level
       with that rung's label already */
    const lesson = lessonFor(n);
    const tags =
      (n.type === 'evidence' ? '<span class="tag eviD">evidence</span>' : '') +
      (n.subject === 'chemistry' ? '<span class="tag chem">chemistry</span>' : '');
    el.innerHTML = '<div class="name">' +
                     (n.type === 'process' ? '<span class="run">→</span>' : '') +
                     esc(n.name) + '</div>' +
                   '<div class="claim">' + esc(n.claim) + '</div>' +
                   /* a thumb is a promise a picture is coming, so only cards
                      with a view get one; it stays hidden while fogged */
                   (viewFor(n) ? '<div class="thumb"><span class="ph"></span></div>' : '') +
                   /* THE LESSON'S OWN CARD IS GONE, so this button is the
                      only way into it and does not fade with the card's
                      other controls. Under the thumb, because it is what
                      the picture above it is a picture OF. */
                   (lesson
                     ? '<div class="opens"><button type="button" ' +
                       'class="opener primary" data-open="' + esc(lesson.id) +
                       '">view lesson</button></div>' : '') +
                   (tags ? '<div class="tags">' + tags + '</div>' : '') +
                   '<div class="chips"></div>';
  }
  n.el = el;
  world.appendChild(el);
  n.r = Math.hypot(el.offsetWidth, el.offsetHeight) / 2;
}

const wordFor = t => t.replace(/-/g, ' ');

function paintLink(l) {
  const contrast = LATERAL[l.type];
  l.el = document.createElementNS(NS, 'path');
  l.el.setAttribute('fill', 'none');
  if (l.rank >= 3) l.el.setAttribute('stroke-dasharray', '3 4');
  svg.appendChild(l.el);
  if (!contrast) {
    l.arrow = document.createElementNS(NS, 'polygon');
    l.arrow.setAttribute('points', '-3,-3.5 4,0 -3,3.5');
    svg.appendChild(l.arrow);
  }
  l.label = document.createElementNS(NS, 'text');
  l.label.setAttribute('text-anchor', 'middle');
  l.label.textContent = wordFor(l.type);
  svg.appendChild(l.label);
}

/* the one place an edge's resting style is decided. Focus overlays it and
   clearFocus routes back through here, so the states cannot drift. */
/* The current highlight's picks, or null. Edges read it too: a highlighted
   group with its interior edges dropped is a scatter of dots, and what a
   unit looks like IS its wiring. Declared here because edgeRefresh closes
   over it and runs before applyHighlight ever does. */
let hiNodes = null;

function edgeRefresh(l) {
  const contrast = LATERAL[l.type];
  const colour = contrast ? '#e2643a' : '#1f5f4f';
  const both = l.a.on && l.b.on, any = l.a.on || l.b.on;
  let op = both ? (l.rank === 1 ? 0.4 : 0.2) : any ? 0.12 : 0.05;
  let arrowOp = both ? (l.rank === 1 ? 0.55 : 0.35) : any ? 0.12 : 0.05;
  /* INSIDE THE HIGHLIGHT, an edge is drawn as if both ends were lit, so the
     group's shape survives the fog it is lying over. Everything else falls
     back further than the fog alone, which is the same 0.28 the unpicked
     marks take. */
  if (hiNodes) {
    const inside = hiNodes.has(l.a) && hiNodes.has(l.b);
    op = inside ? (l.rank === 1 ? 0.55 : 0.28) : op * 0.3;
    arrowOp = inside ? (l.rank === 1 ? 0.7 : 0.4) : arrowOp * 0.3;
  }
  l.el.setAttribute('stroke', colour);
  l.el.setAttribute('stroke-width', l.rank === 1 ? '2.2' : '1');
  l.el.setAttribute('stroke-opacity', op);
  if (l.arrow) {
    l.arrow.setAttribute('fill', colour);
    l.arrow.setAttribute('fill-opacity', arrowOp);
  }
}

/* ---- the stages ---------------------------------------------------------
   Four live boxes across the whole map, card-stage.js's budget. onEvict
   fires while the box is live, which is the only moment a still can be
   taken — a card that goes quiet must not go blank. */
const stages = CardStage.pool({
  limit: 4,
  onEvict: (id, box) => {
    const n = byId[id];
    const thumb = n && n.el && n.el.querySelector('.thumb');
    if (!thumb) return;
    const png = box.snapshot ? box.snapshot() : null;
    thumb.classList.remove('mounted');
    if (!png) return;
    const img = document.createElement('img');
    img.className = 'still'; img.alt = ''; img.src = png;
    thumb.appendChild(img);
    thumb.classList.add('mounted');
  },
});

function goLive(n) {
  const view = viewFor(n);
  const thumb = view && n.el && n.el.querySelector('.thumb');
  if (!thumb) return;
  /* A LESSON'S THUMB IS A PICTURE. It costs no context and never needs
     reclaiming, so it is written straight in and the pool of four stays for
     the boxes that are actually running something. */
  if (view.kind === 'lesson') {
    if (!thumb.classList.contains('mounted')) {
      const img = document.createElement('img');
      /* no loading="lazy": inside a transformed #world the intersection
         never resolves and the image stays at zero. The card being lit IS
         the laziness — nothing is fetched for a node still in the fog. */
      img.className = 'still shot'; img.alt = '';
      img.src = '../' + view.shot;
      thumb.appendChild(img);
      thumb.classList.add('mounted');
    }
    return;
  }
  if (stages.has(n.id)) {                 // re-front, and resume if paused
    const box = stages.acquire(n.id, null);
    if (box.start) box.start();
    return;
  }
  stages.acquire(n.id, () => {
    thumb.querySelectorAll('.still').forEach(el => el.remove());
    thumb.classList.add('mounted');

    if (view.kind === 'molbox')
      /* no inset frame, no leader: the card is the frame. Spin, because the
         point is that the thing is 3D. */
      return Molbox.create({ mount: thumb, spec: MolLib.MOLECULES[view.spec],
                             spin: true });

    if (view.kind === 'build')
      /* the bonding builder, opened finished and flat — the view that draws
         the electrons. zoomOnComplete because a card is a close-up. */
      return MoleculeBuilder.create({ mount: thumb, recipe: view.recipe,
                                      fill: true, zoomOnComplete: true });

    if (view.kind === 'protein')
      /* proteinbox owns the molecule (trace, surface, fold, its two
         controls); a specimen names a registry key and the box resolves the
         files itself, an r: item names files directly. base because
         nodegraph/ is a directory down. */
      return Proteinbox.create(view.protein
        ? { mount: thumb, base: '../', protein: view.protein, variant: view.variant }
        : { mount: thumb,
            trace: '../' + view.trace,
            chains: view.chains,
            surface: view.surface ? '../' + view.surface : null,
            fold: view.fold ? '../' + view.fold : null });

    /* a water sim: card-stage owns the shell, watersim is the physics */
    let sim = null;
    const box = CardStage.create({
      mount: thumb,
      cam: { theta: 0.5, phi: 1.15, r: 26 },
      step: () => { if (sim) sim.step(Object.assign(
        { solvent: sim.salt.length > 0 }, view.frame)); },
      onDestroy: () => { sim = null; },
    });
    sim = WaterSim.create(THREE, box.root);
    for (let i = 0; i < view.waters; i++) sim.spawn();
    for (let i = 0; i < (view.salt || 0); i++) sim.addSalt('nacl');
    if (view.salt) sim.assignShells();
    box.draw();
    return box;
  });
  reDensify();                  // a card mounted while zoomed in opens sharp
}

/* the canvas measures its unzoomed layout box, so the device ratio carries
   the zoom — idle only, since resizing a drawing buffer reallocates it */
let densityTimer = 0;
function reDensify() {
  const px = Math.min(devicePixelRatio * view.k, 3);
  for (const id of stages.keys()) {
    const box = stages.get(id);
    const stage = box && box.stage;
    if (!stage || !stage.renderer) continue;
    if (stage.renderer.getPixelRatio() === px) continue;
    stage.renderer.setPixelRatio(px);
    stage.resize();
    if (box.draw) box.draw();
  }
}
const densifySoon = () => {
  clearTimeout(densityTimer);
  densityTimer = setTimeout(reDensify, 180);
};

/* ---- light ------------------------------------------------------------- */

function light(n) {
  if (n.on) return;
  n.on = true;
  n.el.classList.remove('unlit');
  n.r = Math.hypot(n.el.offsetWidth, n.el.offsetHeight) / 2;
  for (const l of linksOf(n)) edgeRefresh(l);
  goLive(n);                    // a lit card shows its subject, not a promise
  wake(0.5);
}

function unlightAll() {
  for (const n of nodes) { n.on = false; n.el.classList.add('unlit'); }
}

/* the single-card inverse. A fogged card must not keep a WebGL context, so
   the stage goes back to the pool — same rule start() applies wholesale. */
function unlight(n) {
  if (!n.on) return;
  n.on = false;
  n.el.classList.add('unlit');
  if (stages.has(n.id)) stages.release(n.id);
}

/* ---- relax --------------------------------------------------------------
   Overlap resolution only. X is pinned hard to the layer column, y is
   pulled to the median the layout computed, links align y between their
   endpoints, and repulsion does the rest. No spring invents an x. */
let alpha = 0, settled = true;
const wake = a => { alpha = Math.max(alpha, a); settled = false; };

function step() {
  const REPEL = 22000, VMAX = 16;
  for (const n of nodes) { n.vx *= 0.76; n.vy *= 0.76; }

  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    if (a.satellite) continue;          /* revealed detail pushes nothing */
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      if (b.satellite) continue;
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = (i - j) || 1; dy = 1; d2 = 2; }
      const d = Math.sqrt(d2), ux = dx / d, uy = dy / d;
      const near = a.r + b.r;
      const f = REPEL / d2 + (d < near * 1.1 ? (near * 1.1 - d) * 0.5 : 0);
      a.vx -= ux * f; a.vy -= uy * f;
      b.vx += ux * f; b.vy += uy * f;
    }
  }

  for (const l of links) {
    if (l.a.satellite || l.b.satellite) continue;
    const dy = l.b.y - l.a.y;
    const f = dy * 0.004;                     /* y alignment only */
    l.a.vy += f; l.b.vy -= f;
  }

  let moved = 0;
  for (const n of nodes) {
    n.vx += (n.tx - n.x) * 0.12;
    /* a question holds its anchor harder than a concept holds its mean:
       shoved off it, it reads as attached to whatever it drifted near */
    /* firmer than it was, on both counts: the y target used to be a band
       centre or a neighbour mean, and holding loosely to a vague target was
       right. It is a median now, so holding it is worth more than the room
       repulsion gets — swept 0.05/0.015 through 0.16/0.13 and this is the
       floor of the card-overlap curve. */
    n.vy += (n.ty - n.y) * (n.type === 'question' ? 0.07 : lvOf(n) ? 0.09 : 0.06);
    const v = Math.hypot(n.vx, n.vy);
    if (v > VMAX) { n.vx *= VMAX / v; n.vy *= VMAX / v; }
    if (n === dragNode || n.pinned) continue;
    const dx = n.vx * alpha, dy = n.vy * alpha;
    n.x += dx; n.y += dy;
    moved = Math.max(moved, Math.abs(dx), Math.abs(dy));
  }
  alpha *= 0.985;
  if (alpha < 0.05 && moved < 0.05) { settled = true; alpha = 0; }
}

function draw() {
  /* a satellite has no position of its own: it holds an offset from its host
     and is placed from wherever the host currently is, so dragging a card
     takes its revealed detail with it */
  for (const n of nodes) {
    if (!n.satellite) continue;
    n.x = n.host.x + n.dx;
    n.y = n.host.y + n.dy;
  }
  for (const n of nodes) n.el.style.transform =
    'translate(-50%,-50%) translate(' + n.x.toFixed(1) + 'px,' + n.y.toFixed(1) + 'px)';
  for (const l of links) {
    const x1 = l.a.x, y1 = l.a.y, x2 = l.b.x, y2 = l.b.y;
    const bend = Math.abs(x2 - x1) * 0.42 + 30;
    const s1 = x2 >= x1 ? bend : -bend;
    l.el.setAttribute('d', 'M' + x1.toFixed(1) + ',' + y1.toFixed(1) +
      'C' + (x1 + s1).toFixed(1) + ',' + y1.toFixed(1) +
      ' ' + (x2 - s1).toFixed(1) + ',' + y2.toFixed(1) +
      ' ' + x2.toFixed(1) + ',' + y2.toFixed(1));
    const mx = (x1 + 3 * (x1 + s1) + 3 * (x2 - s1) + x2) / 8;
    const my = (y1 + 3 * y1 + 3 * y2 + y2) / 8;
    l.label.setAttribute('x', mx.toFixed(1));
    l.label.setAttribute('y', (my - 8).toFixed(1));
    if (l.arrow) {
      const deg = Math.atan2(1.5 * (y2 - y1), 1.5 * (x2 - x1 - s1)) * 180 / Math.PI;
      l.arrow.setAttribute('transform',
        'translate(' + mx.toFixed(1) + ',' + my.toFixed(1) + ') rotate(' + deg.toFixed(1) + ')');
    }
  }
}

let follow = null, followFrames = 0, followK = 0;
function followStep() {
  if (!follow || followFrames-- <= 0) { follow = null; followK = 0; return; }
  /* a QUERY arrives from wherever the reader happened to be, which may be the
     whole map at 0.3 — where the card it lands on is a smudge. So a follow
     can carry a zoom, eased on the same frames as the pan. Clicking a card
     sets no `followK` and the zoom is left exactly as the reader had it. */
  if (followK && Math.abs(followK - view.k) > 0.002) {
    const k = view.k + (followK - view.k) * 0.06;
    /* zoom about the screen centre, which is where the pan is taking it */
    view.x = innerWidth / 2 - (innerWidth / 2 - view.x) * (k / view.k);
    view.y = innerHeight / 2 - (innerHeight / 2 - view.y) * (k / view.k);
    view.k = k;
  }
  view.x += (innerWidth * 0.5 - follow.x * view.k - view.x) * 0.05;
  view.y += (innerHeight / 2 - follow.y * view.k - view.y) * 0.05;
  applyView();
}

function frame() {
  if (!settled) { step(); draw(); }
  followStep();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- pan, zoom, drag ---------------------------------------------------- */

const canvas = document.getElementById('canvas');
const hint = document.getElementById('hint');
let view = { x: 0, y: 0, k: 0.6 };

function showHint() { hint.textContent = 'k ' + view.k.toFixed(2); }

const MARKK_MAX = 2.4;
let markk = 1;

const applyView = () => {
  showHint();
  /* the marks' counter-scale, capped — see .node.card.unlit */
  markk = view.k < 1 ? Math.min(1 / view.k, MARKK_MAX) : 1;
  world.style.setProperty('--markk', markk.toFixed(3));
  const zoomed = view.k > 1;
  world.style.zoom = zoomed ? view.k : 1;
  const t = zoomed ? view.k : 1;
  world.style.transform =
    'translate(' + (view.x / t) + 'px,' + (view.y / t) + 'px)' +
    (zoomed ? '' : ' scale(' + view.k + ')');
  placeGutter();
};

let dragNode = null, dragging = null, last = null, travel = 0;

canvas.addEventListener('pointerdown', e => {
  /* a card's own controls keep their pointer — every control must be here.
     The symptom of a missing entry is a button that renders and does
