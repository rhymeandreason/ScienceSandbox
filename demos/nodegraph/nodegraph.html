     nothing while the card behind it opens. */
  if (e.target.closest('.chip, .mb-dims, .pbox-rep, .pbox-play, .opener, .askpill')) return;
  const hit = e.target.closest('.node');
  last = { x: e.clientX, y: e.clientY };
  travel = 0;
  follow = null;
  if (hit) {
    dragNode = nodes.find(n => n.el === hit);
    hit.classList.add('dragging');
    dragging = 'node';
    wake(0.3);
  } else {
    dragging = 'pan';
    canvas.classList.add('panning');
  }
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  last = { x: e.clientX, y: e.clientY };
  travel += Math.hypot(dx, dy);
  if (dragging === 'pan') { view.x += dx; view.y += dy; applyView(); }
  else { dragNode.x += dx / view.k; dragNode.y += dy / view.k; dragNode.vx = dragNode.vy = 0;
         wake(0.3); }
});

function endDrag(e) {
  const click = travel <= 5;
  if (dragging === 'node') {
    dragNode.el.classList.remove('dragging');
    if (click) { light(dragNode); focus(dragNode); }
    else dragNode.pinned = true;
    dragNode = null;
  } else if (dragging === 'pan' && click && focused) {
    clearFocus();
  }
  canvas.classList.remove('panning');
  dragging = null;
  if (e && canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* zoom about a point on the screen, so whatever is under the fingers stays
   under them */
function zoomAt(k, cx, cy) {
  k = Math.min(2.5, Math.max(0.18, k));
  view.x = cx - (cx - view.x) * (k / view.k);
  view.y = cy - (cy - view.y) * (k / view.k);
  view.k = k;
  applyView();
  densifySoon();                 // the canvases follow the zoom, once it stops
}

/* A Mac trackpad's two-finger scroll IS a wheel event, and so is a mouse
   wheel's click, so the handler has to tell them apart: the trackpad pans and
   the wheel zooms, which is what each one is for.

   NO SINGLE EVENT SAYS WHICH. Safari sends a mouse notch as deltaY 4.0002,
   wheelDeltaY -12 — fractional, not a multiple of 120, and the same shape a
   swipe arrives in. What separates them is the STREAM: a notch is one or two
   events, a two-finger scroll is a long burst with a momentum tail behind it.
   So the BURST is what gets classified, the verdict carries to the next one,
   and it is remembered across loads, because otherwise a trackpad reader pays
   the wrong first flick on every visit. The map opens assuming a wheel.

   The two zooms are metered differently: a notch is a step, so it moves k by
   a fixed ratio, while a pinch or a ctrl-scroll is continuous. */
const BURST_GAP = 120;      // ms of quiet that ends a burst
const BURST_PAN = 8;        // events in one burst that only fingers produce
let burstAt = 0, burstN = 0, shortRun = 0;
let trackpad = false;
try { trackpad = localStorage.getItem('nodegraph.trackpad') === '1'; } catch (_) {}
const setTrackpad = on => {
  trackpad = on;
  try { localStorage.setItem('nodegraph.trackpad', on ? '1' : '0'); } catch (_) {}
};

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  follow = null;
  const s = e.deltaMode === 1 ? 16 : 1;             // deltaMode 1 counts lines
  const now = performance.now();

  if (now - burstAt < BURST_GAP) burstN++;
  else {
    /* the burst that just ended: two stubby ones in a row mean the fingers
       left and a wheel took over */
    shortRun = burstN && burstN <= 2 ? shortRun + 1 : 0;
    if (shortRun >= 2 && trackpad) setTrackpad(false);
    burstN = 1;
  }
  burstAt = now;
  if (burstN >= BURST_PAN && !trackpad) setTrackpad(true);

  if (e.ctrlKey || e.metaKey)                       // pinch, in Chrome's dialect
    zoomAt(view.k * Math.exp(-e.deltaY * s * 0.01), e.clientX, e.clientY);
  else if (trackpad || e.deltaX !== 0) {
    view.x -= e.deltaX * s;
    view.y -= e.deltaY * s;
    applyView();
    densifySoon();
  } else {
    const steps = e.wheelDeltaY ? Math.sign(e.wheelDeltaY) : -Math.sign(e.deltaY);
    zoomAt(view.k * Math.exp(steps * 0.14), e.clientX, e.clientY);
  }
}, { passive: false });

/* Safari's pinch. e.scale is cumulative from the gesture's start, so the
   start's k is what it multiplies. preventDefault also stops the page zoom
   the same fingers would otherwise trigger. */
let gestureK = 1;
canvas.addEventListener('gesturestart', e => {
  e.preventDefault(); follow = null; gestureK = view.k;
}, { passive: false });
canvas.addEventListener('gesturechange', e => {
  e.preventDefault(); zoomAt(gestureK * e.scale, e.clientX, e.clientY);
}, { passive: false });
canvas.addEventListener('gestureend', e => e.preventDefault(), { passive: false });

/* ---- focus and the direction chips -------------------------------------- */

let focused = null;

/* A MARK IS MEASURED AT THE SIZE IT REACHES WHEN FULLY COUNTER-SCALED, not
   at the size it happens to be right now. The spacing is baked once and the
   reader zooms freely through it, so sizing marks at the current zoom put
   seventeen labels on top of each other at the zoom the map opens on. Only
   the marks grow: a lit card is a card, and it is already the bigger box. */
function measure() {
  for (const n of nodes) {
    const grow = n.on ? 1 : MARKK_MAX / markk;
    n.r = Math.hypot(n.el.offsetWidth, n.el.offsetHeight) / 2 * grow;
  }
  wake(0.4);
}

/* a theme's fan is dealt whole — a theme is a query, not a place */
function renderChips(n) {
  const box = n.el.querySelector('.chips');
  if (!box) return;
  if (n.type === 'theme') {
    const dark = neighbours(n).filter(m => !m.on);
    box.innerHTML = dark.length
      ? '<button class="chip" data-g="all">show all ' + neighbours(n).length + '</button>' : '';
    return;
  }
  /* a card deals no chips: focusing it already presents its neighbourhood,
     and the row of three read as controls competing with the card's text. */
  box.innerHTML = '';
}

/* the lesson behind a card, opened over the map; src set on show and
   cleared on hide, so the lesson's context belongs to the moment it is open */
const lessonFrame = document.getElementById('lessonframe');
const lessonTitle = document.getElementById('lessontitle');
const lessonModal = Modal.create({
  el: 'lessonmodal',
  onShow: c => {
    lessonTitle.textContent = c.name || 'the lesson';
    /* youtube-nocookie, and the parameters are built here rather than
       authored, so a row carries the id and nothing about playback */
    lessonFrame.src = c.kind === 'video'
      ? 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(c.src) +
        '?rel=0&modestbranding=1&playsinline=1&autoplay=1'
      : '../' + c.href;
  },
  onHide: () => { lessonFrame.src = 'about:blank'; },
});

document.addEventListener('click', e => {
  if (e.target.closest('.credit a')) return;   // the credit goes out, not in
  const ask = e.target.closest('.askpill');
  if (ask) { toggleKinds(byId[ask.dataset.host]); return; }
  const open = e.target.closest('.opener[data-open]');
  if (open) {
    const c = BY_CONTENT.get(open.dataset.open);
    if (c) lessonModal.show(c);
    return;
  }
  const b = e.target.closest('.chip');
  if (!b) return;
  const n = nodes.find(m => m.el.contains(b));
  if (!n) return;
  for (const l of linksOf(n)) {
    if (b.dataset.g !== 'all' && groupOf(l, n) !== b.dataset.g) continue;
    light(l.a === n ? l.b : l.a);
  }
  measure();
  focus(n);
});

function focus(n) {
  focused = n;
  walk = null;                  // a click lands off the fan; goWalk restores its own
  showHint();
  follow = n; followFrames = 700;
  if (n.on) goLive(n);          // the clicked card re-fronts in the pool
  document.body.classList.add('focusing');
  for (const m of nodes) m.el.classList.remove('lit', 'hub', 'hop2');
  for (const m of nodes) { const c = m.el.querySelector('.chips'); if (c) c.innerHTML = ''; }

  const hop1 = new Set(neighbours(n));
  const hop2 = new Set();
  for (const m of hop1) for (const o of neighbours(m))
    if (o !== n && !hop1.has(o)) hop2.add(o);

  n.el.classList.add('lit', 'hub');
  for (const m of hop1) m.el.classList.add('lit');
  for (const m of hop2) m.el.classList.add('lit', 'hop2');

  renderChips(n);
  syncPill(n);
  measure();
  gutterLight(n);

  /* Distance from the focused card is carried by OPACITY ALONE. Focus used
     to wash both hops red, which spent the only colour the edges have:
     red means contrasts-with, and a card whose neighbours all went red
     could not be read for rank either. So route through edgeRefresh for
     the resting colour, width and dash, then dim — and scale the dimming
     by rank, so the spine still separates from the enrichment inside a
     focused neighbourhood. */
  for (const l of links) {
    const first = l.a === n || l.b === n;
    const second = (hop1.has(l.a) && hop2.has(l.b)) || (hop1.has(l.b) && hop2.has(l.a));
    edgeRefresh(l);
    const near = first ? 0.85 : second ? 0.4 : 0;
    const byRank = l.rank === 1 ? 1 : l.rank === 2 ? 0.6 : 0.45;
    l.el.setAttribute('stroke-opacity', near ? (near * byRank).toFixed(2) : '.06');
    if (l.arrow) l.arrow.setAttribute('fill-opacity',
      near ? (near * byRank * 1.1).toFixed(2) : '.06');
    l.label.classList.toggle('on', first);
  }
}

function clearFocus() {
  focused = null;
  walk = null;
  syncPill(null);
  showHint();
  document.body.classList.remove('focusing');
  for (const m of nodes) {
    m.el.classList.remove('lit', 'hub', 'hop2');
    const c = m.el.querySelector('.chips'); if (c) c.innerHTML = '';
  }
  measure();
  gutterLight(null);
  for (const l of links) edgeRefresh(l);
}

/* ---- the walk ------------------------------------------------------------
   Arrow keys step from the focused card: → onward, ← why, ↑/↓ to take a
   different branch out of the same fan. The doc's QA test, playable: if the
   spine is coherent, holding → reads as a course.

   Three rules are what make it read as one course rather than wander.

   ONLY AN EDGE THAT IMPOSES AN ORDER IS A STEP. groupOf() falls through to
   a→b for the types the grammar says order nothing, which is fine for
   grouping a card's chips and fatal for a walk: `denaturation preserves
   primary` became a forward step and the walk fell into
   tertiary→denaturation→primary→secondary→tertiary. So the walk reads
   ordered() directly, plus `answers`, which is the door into a card.
   describes and preserves stay on the chips and are not stations.

   A SPECIMEN AND A THEME ARE DESTINATIONS. Their rank is authored from
   their own side, the asymmetry graphdata.js calls out for the theme fan:
   `p:prion instance-of folding` rank 1 says prion is the best thing we hold
   for folding, not that folding's next word is prion. Walking onward used
   to land on it and stop dead two hops from the unit's own question. They
   are still walkable the other way — from the specimen back up to what it
   exemplifies — and a theme still deals its whole fan from its chip.

   A FAN LEADS WITH ITS LONGEST ARM. hbond deals seven rank-1 properties and
   array order used to pick, so → off the mechanism hub stopped at
   transpiration and the other six were unreachable by walking at all. Now
   equal ranks are broken by how far each branch carries, so the hub runs to
   the bilayer and the fold, and the rest are one ↓ away. */

/* the direction a walk step reads this link, or null if it is not a step */
function walkDir(l, n) {
  if (l.type === 'answers') return n === l.b ? 'why' : 'onward';
  const o = ordered(l);
  if (!o) return null;
  return o[1] === n ? 'why' : 'onward';
}
/* an evidence card shows HOW WE KNOW a claim, which is a destination the
   same way a specimen or a film is: worth clicking, never a station the
   explanation walks through */
const station = n => n.type !== 'specimen' && n.type !== 'theme' &&
                     n.type !== 'content' && n.type !== 'evidence' &&
                     n.type !== 'satellite' && n.type !== 'ask';

/* how far a branch carries: the longest rank-1 chain onward from it. No
   memo — 64 nodes, and only a keypress asks. The seen guard is for a data
   bug the layering pass would already have warned about. */
function reach(n, dir, seen = new Set()) {
  if (seen.has(n)) return 0;
  seen.add(n);
  let best = 0;
  for (const l of linksOf(n)) {
    const m = l.a === n ? l.b : l.a;
    if (l.rank !== 1 || walkDir(l, n) !== dir || !station(m)) continue;
    best = Math.max(best, 1 + reach(m, dir, seen));
  }
  seen.delete(n);
  return best;
}

/* the fan out of n in one direction, best arm first */
function walkCands(n, dir) {
  const out = [];
  for (const l of linksOf(n)) {
    const m = l.a === n ? l.b : l.a;
    if (walkDir(l, n) !== dir || !station(m)) continue;
    out.push({ m, rank: l.rank, far: reach(m, dir) });
  }
  out.sort((a, b) => a.rank - b.rank || b.far - a.far ||
                     a.m.tx - b.m.tx || (a.m.id < b.m.id ? -1 : 1));
  return out.map(x => x.m);
}

/* the fan the current card was reached through, so ↑/↓ can re-pick from it */
let walk = null;

function goWalk() {
  const fan = walk;             /* focus() drops the fan; the walk keeps it */
  light(fan.cands[fan.ix]);
  focus(fan.cands[fan.ix]);
  walk = fan;
  showHint();
}

function stepWalk(dir) {
  if (!focused) return;
  const cands = walkCands(focused, dir);
  if (!cands.length) return;
  walk = { from: focused, dir, cands, ix: 0 };
  goWalk();
}

function stepBranch(d) {
  if (!walk || walk.cands.length < 2) return;
  walk.ix = (walk.ix + d + walk.cands.length) % walk.cands.length;
  goWalk();
}

addEventListener('keydown', e => {
  if (Modal.anyOpen()) return;             // the modal's Esc is the modal's
  if (e.key === 'Escape') { clearFocus(); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); stepWalk('onward'); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); stepWalk('why'); }
  if (e.key === 'ArrowDown')  { e.preventDefault(); stepBranch(1); }
  if (e.key === 'ArrowUp')    { e.preventDefault(); stepBranch(-1); }
});

/* ---- what a card weighs --------------------------------------------------
   Three questions about a card, and they disagree with each other, which is
   the point of offering them separately.

     DEGREE       how much this card has to say for itself.
     THROUGH      how many rank-1 explanations run through it. This is the
                  doc's own discriminating test and the one that separates a
                  hinge from a terminus: hydrolysis has six rank-1 edges and
                  not one path passes through it.
     SPAN         how many units it touches, which is what a bridge is.

   Computed HERE and not beside `big`, because `big` is decided before the
   specimens and the content cards have pushed their links and so counts a
   different graph from this one.

   Ranked by percentile rather than by raw value: the three scales are not
   comparable, and the downstream-style measures explode toward the left of
   the map where everything is eventually a consequence of electronegativity. */
const CARDS = nodes.filter(n =>
  ['concept', 'structure', 'process', 'evidence'].includes(n.type));
{
  const adj = new Map(CARDS.map(n => [n, []]));
  for (const l of links) {
    if (l.rank !== 1) continue;
    for (const n of [l.a, l.b]) {
      const m = l.a === n ? l.b : l.a;
      if (!adj.has(n) || !adj.has(m)) continue;
      if (walkDir(l, n) === 'onward' && station(m)) adj.get(n).push(m);
    }
  }
  /* Brandes, over the rank-1 station graph the walk actually uses */
  const bc = new Map(CARDS.map(n => [n, 0]));
  for (const s of CARDS) {
    const stack = [], pred = new Map(CARDS.map(n => [n, []]));
    const sig = new Map(CARDS.map(n => [n, 0])), dist = new Map(CARDS.map(n => [n, -1]));
    sig.set(s, 1); dist.set(s, 0);
    const q = [s];
    while (q.length) {
      const v = q.shift(); stack.push(v);
      for (const w of adj.get(v)) {
        if (dist.get(w) < 0) { dist.set(w, dist.get(v) + 1); q.push(w); }
        if (dist.get(w) === dist.get(v) + 1) {
          sig.set(w, sig.get(w) + sig.get(v)); pred.get(w).push(v);
        }
      }
    }
    const delta = new Map(CARDS.map(n => [n, 0]));
    while (stack.length) {
      const w = stack.pop();
      for (const v of pred.get(w))
        delta.set(v, delta.get(v) + (sig.get(v) / sig.get(w)) * (1 + delta.get(w)));
      if (w !== s) bc.set(w, bc.get(w) + delta.get(w));
    }
  }
  for (const n of CARDS) {
    const mine = linksOf(n).filter(l => l.rank === 1);
    n.wDeg = mine.length;
    n.wThrough = bc.get(n);
    n.wSpan = new Set(mine.map(l => (l.a === n ? l.b : l.a).unit).filter(Boolean)).size;
  }
  const pct = key => {
    const sorted = CARDS.slice().sort((a, b) => a[key] - b[key]);
    sorted.forEach((n, i) => { n[key + 'P'] = i / (sorted.length - 1); });
  };
  ['wDeg', 'wThrough', 'wSpan'].forEach(pct);
  /* SPAN IS NOT IN THE COMBINED SCORE, though it looks like it belongs. It
     has its own mode already, and counting it twice sank tertiary — the
     single highest-betweenness card on the map — for the crime of living
     entirely inside the protein unit. A card can carry the map without
     leaving its own region. */
  for (const n of CARDS) n.wAll = (n.wDegP + n.wThroughP) / 2;
}

const hiliteSel = document.getElementById('hilite');
const HILITE_TOP = 10;

const HILITE_KEY = { through: 'wThrough', degree: 'wDeg', carries: 'wAll' };

/* A THEME IS A SAVED QUERY, and the doc calls "show me everything connected
   to Structure-Function" one of the most valuable views the graph can offer.
   The options are generated from the data rather than authored, so a new
   theme arrives with its own option and cannot be forgotten here. Kept in
   their own group because this is a different question from the weights:
   `all of the above` unions the four measures and stops there. */
/* A UNIT IS THE COARSEST SAVED QUERY: the chapter, the thing the coloured
   dot already says on every card. Generated from UNITS so a new unit cannot
   be forgotten here, and only units that actually have nodes are offered. */
{
  const group = document.getElementById('hiliteunits');
  const held = new Set(nodes.map(n => n.unit));
  for (const key of Object.keys(UNITS)) {
    if (!held.has(key)) continue;
    const opt = document.createElement('option');
    opt.value = 'unit:' + key;
    opt.textContent = UNITS[key].name.toLowerCase();
    opt.dataset.tint = UNITS[key].tint;   // the custom menu draws the dot
    group.appendChild(opt);
  }
}

{
  const group = document.getElementById('hilitethemes');
  for (const t of nodes.filter(n => n.type === 'theme')) {
    const opt = document.createElement('option');
    opt.value = 'theme:' + t.id;
    opt.textContent = t.name.toLowerCase();
    group.appendChild(opt);
  }
}

/* one mode's picks. `bridge` is a threshold rather than a top-N because
   touching three units means something on its own; the others are ranked. */
function picksFor(mode) {
  /* A QUESTION CARRIES NO UNIT and must not: a bridging one joins two by
     definition, and authoring one unit on it would pick a side. So the door
     is derived — a question joins the unit it answers INTO at rank 1, which
     puts an anchoring question in exactly one unit and a bridging one in
     both, without either being written down twice. */
  if (mode.startsWith('unit:')) {
    const u = mode.slice(5);
    const own = nodes.filter(n => n.unit === u);
    const inside = new Set(own);
    const doors = nodes.filter(n => n.type === 'question' &&
      linksOf(n).some(l => l.rank === 1 && inside.has(l.a === n ? l.b : l.a)));
    return own.concat(doors);
  }
  if (mode.startsWith('theme:')) {
    const t = byId[mode.slice(6)];
    return t ? [t, ...neighbours(t)] : [];
  }
  if (mode === 'bridge') return CARDS.filter(n => n.wSpan >= 3);
  const key = HILITE_KEY[mode];
  return CARDS.slice().sort((a, b) => b[key] - a[key]).slice(0, HILITE_TOP);
}

function applyHighlight() {
  const mode = hiliteSel.value;
  for (const n of nodes) n.el.classList.remove('hi');
  document.body.classList.toggle('highlighting', !!mode);
  if (!mode) {
    hiNodes = null;
    for (const l of links) edgeRefresh(l);
    return;
  }
  /* `all` is the UNION, not a fifth metric: a card earns the highlight by
     any one of the four readings, which is the widest honest answer to
     "which of these matter". */
  const pick = mode === 'all'
    ? new Set(['carries', 'through', 'degree', 'bridge'].flatMap(picksFor))
    : picksFor(mode);
  for (const n of pick) n.el.classList.add('hi');
  hiNodes = new Set(pick);
  /* PICKING A GROUP CLOSES WHAT IS NOT IN IT. A card left open from an
     earlier trail reads as part of the answer, and half a dozen of them
     scattered over a highlighted unit is the loudest thing on screen while
     being exactly the wrong claim. Opened cards inside the pick stay open;
     nothing is opened FOR the reader, because exploration is light and this
     menu is a reading of the map, not a click. */
  for (const n of nodes) if (n.on && !hiNodes.has(n)) unlight(n);
  for (const l of links) edgeRefresh(l);
  measure();

  /* PICKING A THEME IS PICKING ITS CARD. A theme is a query and choosing it
     from the menu should do what clicking it does, so it lights, focuses,
     and the camera frames the fan rather than leaving the reader to find a
     dark card somewhere on a nine-thousand-pixel map. Focus outranks the
     highlight while it lasts, which is why Escape drops back to the
     at-a-glance version instead of clearing it. */
  /* A UNIT IS A BAND, NOT A BLOB. X is explanatory order, so a chapter runs
     the width of the map — proteins spans 11k px — and centre()'s bounding
     box would either clip or floor out at a zoom where it clips anyway. So
     frame the INTERQUARTILE box: where the bulk of the chapter sits, with
     the far outliers left off-screen still highlighted for whoever pans out
     to them. No focus either — opening one card picks a winner out of
     thirty, and the answer to "where is proteins" is the shape of the group.
     Floor is lower than centre()'s: at 0.22 a card is a dot, and the dots
     are what the question was asking about. */
  if (mode.startsWith('unit:')) {
    follow = null;
    if (!pick.length) return;
    /* quantiles need a population; under about eight nodes they just drop
       members, so a small unit gets its true box. */
    const lo = pick.length >= 8 ? 0.15 : 0, hi = pick.length >= 8 ? 0.85 : 1;
    const band = (axis, f) => {
      const v = pick.map(n => n[axis]).sort((p, q) => p - q);
      return v[Math.round((v.length - 1) * f)];
    };
    const x0 = band('x', lo), x1 = band('x', hi);
    const y0 = band('y', lo), y1 = band('y', hi);
    const pad = 320;
    const k = Math.max(0.22, Math.min(0.7,
      Math.min(innerWidth / (x1 - x0 + 2 * pad),
               innerHeight / (y1 - y0 + 2 * pad))));
    view = {
      k,
      x: innerWidth / 2 - (x0 + x1) / 2 * k,
      y: innerHeight / 2 - (y0 + y1) / 2 * k,
    };
    applyView();
    return;
  }

  if (mode.startsWith('theme:')) {
    const t = byId[mode.slice(6)];
    if (!t) return;
    light(t);
    focus(t);
    follow = null;                /* the frame below IS the camera move */
    /* CENTRED ON THE THEME, zoomed to reach its fan. centre() cannot do this
       job: a theme reaches across four units by design, so the bounding box
       of theme-plus-fan is most of the map, it floors out at minimum zoom
       and the card itself gets pushed to an edge. Framing the card alone is
       readable but shows one of nine instances, which is not why anyone
       picks a theme. So the theme is pinned to the centre and the zoom pulls
       back symmetrically until the fan is in shot, with a floor so it never
       becomes unreadable. */
    const fan = neighbours(t);
    const reach = (axis) => Math.max(400, ...fan.map(m => Math.abs(m[axis] - t[axis])));
    const k = Math.max(0.26, Math.min(0.55,
      Math.min(innerWidth / (2 * reach('x') + 700),
               innerHeight / (2 * reach('y') + 500))));
    view = { k, x: innerWidth / 2 - t.x * k, y: innerHeight / 2 - t.y * k };
    applyView();
  }
}
hiliteSel.addEventListener('change', applyHighlight);

/* ---- the highlight menu -------------------------------------------------
   Built from the <select> AFTER the unit and theme options exist, so the
   generated-from-data rule holds for the menu too and nothing is authored
   twice. Clicking a row writes the value and fires `change`, which is the
   only thing the rest of the file knows about. */
const hiliteWrap  = document.getElementById('hilitewrap');
const hiliteBtn   = document.getElementById('hilitebtn');
const hiliteMenu  = document.getElementById('hilitemenu');
const hiliteLabel = document.getElementById('hilitelabel');
const hiliteDot   = document.getElementById('hilitedot');

for (const el of hiliteSel.children) {
  if (el.tagName === 'OPTGROUP') {
    if (!el.children.length) continue;
    const h = document.createElement('div');
    h.className = 'hgroup'; h.textContent = el.label;
    hiliteMenu.appendChild(h);
    for (const opt of el.children) hiliteMenu.appendChild(hiliteRow(opt));
  } else hiliteMenu.appendChild(hiliteRow(el));
}

function hiliteRow(opt) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'hopt'; b.setAttribute('role', 'option');
  b.dataset.value = opt.value;
  if (opt.dataset.tint) {
    const d = document.createElement('span');
    d.className = 'hdot'; d.style.background = opt.dataset.tint;
    b.appendChild(d);
  }
  b.appendChild(document.createTextNode(opt.textContent));
  return b;
}

function syncHilite() {
  const opt = hiliteSel.selectedOptions[0];
  hiliteLabel.textContent = opt ? opt.textContent : 'all';
  const tint = opt && opt.dataset.tint;
  hiliteDot.hidden = !tint;
  if (tint) hiliteDot.style.background = tint;
  for (const row of hiliteMenu.querySelectorAll('.hopt'))
    row.setAttribute('aria-selected', row.dataset.value === hiliteSel.value);
}

function openHilite(on) {
  hiliteMenu.hidden = !on;
  hiliteWrap.classList.toggle('open', on);
  hiliteBtn.setAttribute('aria-expanded', on);
}

hiliteBtn.addEventListener('click', () => openHilite(hiliteMenu.hidden));
hiliteMenu.addEventListener('click', e => {
  const row = e.target.closest('.hopt');
  if (!row) return;
  hiliteSel.value = row.dataset.value;
  hiliteSel.dispatchEvent(new Event('change'));
  openHilite(false);
});
document.addEventListener('pointerdown', e => {
  if (!hiliteWrap.contains(e.target)) openHilite(false);
}, true);
addEventListener('keydown', e => { if (e.key === 'Escape') openHilite(false); });
hiliteSel.addEventListener('change', syncHilite);
syncHilite();

/* ---- kinds: detail that failed the node test -----------------------------
   THE CHAIN IS card → pill → kinds. The pill is a node rather than another
   chip in the card's row, because as a chip it read as one more navigation
   control among three and the thing it does is not navigation. As a node
   hanging off the card it is an event, and the kinds then hang off IT, so
   the map says plainly that these arrived through a question.

   NOTHING HERE IS BAKED, and that is the one invariant worth arguing over.
   The map is laid out once so spatial memory can form, but a satellite is a
   leaf with one edge to one parent: its position says nothing beyond "below
   this card", and nobody remembers the seat of something they have never
   seen. Reserving room for sixty-four of them would cost real geometry to
   protect a memory that cannot form. So they are made on reveal, PINNED,
   and skipped by the relax's repulsion and its link pull, which is why
   opening one moves nothing else on the map.

   The pill follows the focus: focusing a card with `kinds` grows it,
   focusing anything outside that card's own family takes it away again. */
let pillHost = null;

function makePill(host) {
  const pill = {
    id: host.id + '::ask', type: 'ask', satellite: true, pinned: true,
    host, label: 'What kinds are there?', unit: host.unit, tint: host.tint,
    deg: 0, on: true, dx: 0, dy: 0, x: host.x, y: host.y, vx: 0, vy: 0,
  };
  nodes.push(pill); byId[pill.id] = pill;
  paintNode(pill);
  /* focus decided what to light before this existed. It is always family of
     the focused card, so it is always lit. */
  pill.el.classList.add('lit');
  pill.dy = host.el.offsetHeight / 2 + pill.el.offsetHeight / 2 + 34;
  pill.tx = pill.x; pill.ty = pill.y;
  pill.r = Math.hypot(pill.el.offsetWidth, pill.el.offsetHeight) / 2;
  const l = { a: pill, b: host, type: 'asks', rank: 2, spine: false };
  links.push(l); paintLink(l); edgeRefresh(l);
  l.label.style.display = 'none';        /* the pill says it; the line need not */
  host.pill = pill; host.pillLink = l;
  return host;
}

function dropNodes(list) {
  for (const m of list) { m.el.remove(); nodes.splice(nodes.indexOf(m), 1); delete byId[m.id]; }
}
function dropLinks(list) {
  for (const l of list) { l.el.remove(); l.label.remove(); if (l.arrow) l.arrow.remove(); }
  links = links.filter(l => !list.includes(l));
}

function dropPill(host) {
  if (host.sats) collapseKinds(host);
  if (!host.pill) return;
  dropNodes([host.pill]); dropLinks([host.pillLink]);
  host.pill = null; host.pillLink = null;
}

/* the pill belongs to whichever card is being worked on, and survives a click
   on itself or on anything it produced */
function syncPill(n) {
  const family = pillHost &&
    (n === pillHost || n === pillHost.pill || n === pillHost.query ||
     (pillHost.sats || []).includes(n));
  if (family) return;
  if (pillHost) dropPill(pillHost);
  pillHost = (n && n.kinds) ? makePill(n) : null;
}

function collapseKinds(host) {
  dropQuery(host);
  dropNodes(host.sats); dropLinks(host.satLinks);
  host.sats = null; host.satLinks = null;
  if (host.pill) host.pill.el.textContent = host.pill.label;
}

/* THE KINDS HANG OFF THE PILL, not off the card, so the reading is that a
   question produced them. Fanned rather than stacked: five in a column ran
   551px down into a map that is tight in y and roomy in x. */
function toggleKinds(host) {
  if (!host || !host.pill) return;
  if (host.sats) { collapseKinds(host); draw(); return; }

  const GAP = 18, pill = host.pill;
  host.sats = []; host.satLinks = [];
  host.kinds.forEach(([name, claim], i) => {
    const sat = {
      id: host.id + '::' + i, type: 'satellite', satellite: true, pinned: true,
      name, claim, unit: host.unit, tint: host.tint, deg: 0, on: true, host: pill,
      dx: 0, dy: 0, x: pill.x, y: pill.y, vx: 0, vy: 0,
    };
    nodes.push(sat); byId[sat.id] = sat;
    paintNode(sat);
    sat.el.classList.add('lit');
    sat.tx = sat.x; sat.ty = sat.y;
    sat.r = Math.hypot(sat.el.offsetWidth, sat.el.offsetHeight) / 2;
    const l = { a: sat, b: pill, type: 'instance-of', rank: 2, spine: false };
    links.push(l); host.satLinks.push(l); paintLink(l); edgeRefresh(l);
    host.sats.push(sat);
  });

  const count = host.sats.length;
  const wide = Math.max(...host.sats.map(x => x.el.offsetWidth));
  const tall = Math.max(...host.sats.map(x => x.el.offsetHeight));
  const span = Math.min(150, count * 34) * Math.PI / 180;
  const step = count > 1 ? span / (count - 1) : 0;
  const place = (reach) => host.sats.forEach((sat, i) => {
    const a = -span / 2 + i * step;             /* 0 points straight down */
    sat.dx = reach * Math.sin(a);
    sat.dy = reach * Math.cos(a);
  });
  /* THE RADIUS CHECKS ITSELF. Spacing by width along the chord is not enough:
     on an arc adjacent cards are separated diagonally, so a taller card still
     collides vertically at a radius the width formula called clear. Rather
     than a cleverer formula, push the fan out until the boxes really miss. */
  const clash = () => {
    for (let a = 0; a < count; a++) for (let b = a + 1; b < count; b++) {
      const p = host.sats[a], q = host.sats[b];
      if (Math.abs(p.dx - q.dx) < (p.el.offsetWidth + q.el.offsetWidth) / 2 + GAP &&
          Math.abs(p.dy - q.dy) < (p.el.offsetHeight + q.el.offsetHeight) / 2 + GAP)
        return true;
    }
    return false;
  };
  let reach = Math.max(count > 1 ? (wide + GAP) / (2 * Math.sin(step / 2)) : 0,
                       pill.el.offsetHeight / 2 + tall / 2 + GAP);
  place(reach);
  for (let guard = 0; guard < 40 && clash(); guard++) place(reach *= 1.06);

  pill.el.textContent = 'hide the ' + count;
  draw();
}

/* ---- asking ---------------------------------------------------------------
   A QUERY ARRIVES, IT DOES NOT LIVE HERE. Asking an extension question opens
   the card it lands on, deals that card's kinds, and spawns the question
   itself beside the member that answers it — as a satellite, so it rides
   whatever it is attached to and pushes nothing on the map out of place.

   The pill stays in the chain. A reader who arrives by query and one who
   arrived by clicking "what kinds are there?" are looking at the same thing,
   and a second way of drawing it would say they are not. */

function dropQuery(host) {
  if (!host || !host.query) return;
  const q = host.query;
  dropLinks(links.filter(l => l.a === q || l.b === q));
  dropNodes([q]);
  q.el = null;
  host.query = null;
}

function spawnQuery(q, host) {
  if (host.query && host.query !== q) dropQuery(host);
  if (host.query === q) return;

  /* the member that answers it, or the card itself when the question is
     about the whole fan rather than one of it */
  const target = (q.kind && (host.sats || []).find(s => s.name === q.kind)) || host;
  q.satellite = true; q.pinned = true; q.host = target;
  q.on = true; q.deg = 0; q.vx = 0; q.vy = 0;
  q.x = target.x; q.y = target.y;
  nodes.push(q); byId[q.id] = q;
  paintNode(q);
  q.el.classList.add('lit');
  /* below its answer, and left of it, so the question reads before the card
     it points at rather than out of the card's own reading order */
  q.dx = -(target.el.offsetWidth / 2 + q.el.offsetWidth / 2 + 30);
  q.dy = target.el.offsetHeight / 2 + q.el.offsetHeight / 2 + 26;
  q.r = Math.hypot(q.el.offsetWidth, q.el.offsetHeight) / 2;

  const l = { a: q, b: target, type: 'answers', rank: 1, spine: true };
  links.push(l); paintLink(l); edgeRefresh(l);
  host.query = q;
  draw();
}

/* the one entry point: everything that asks goes through here, so the bar,
   the list and anything later that fuzzy-matches all land the same way */
function askQuestion(q) {
  if (!q) return;
  if (q.qtype !== 'extension') { light(q); focus(q); return; }
  const host = byId[q.anchorId];
  if (!host) { console.warn('query has nowhere to land:', q.id); return; }
  light(host);
  focus(host);                         /* syncPill grows the pill from here */
  if (host.kinds && !host.sats) toggleKinds(host);
  spawnQuery(q, host);
  /* the fan and the question were born after focus lit the neighbourhood */
  for (const m of [q, host.pill, ...(host.sats || [])])
    if (m && m.el) m.el.classList.add('lit');
  /* CENTRE THE ANSWER, NOT THE QUESTION. The question sits below its member
     and the card sits above the fan, so following either one puts the rest of
     the chain against an edge. `follow` only ever reads x and y, so a midpoint
     is a legal thing to hand it. */
  const chain = [q, host, host.pill, ...(host.sats || [])].filter(Boolean);
  follow = { x: chain.reduce((t, m) => t + m.x, 0) / chain.length,
             y: chain.reduce((t, m) => t + m.y, 0) / chain.length };
  followFrames = 700;
  followK = Math.max(view.k, 0.85);    /* readable, and never a zoom OUT */
  wake(0.4);
}

/* ---- the ask bar ----------------------------------------------------------
   Every question is reachable from here, not only the deferred ones: an
   anchor or bridging question is already a card, so asking one focuses it
   where it sits. The placeholder rotates so the bar shows what it accepts
   rather than describing it. */
const askBar = document.getElementById('askbar');
const askIn = document.getElementById('askinput');
const askList = document.getElementById('asklist');
const askCaret = document.getElementById('askcaret');

const ASKABLE = NODES.filter(n => n.type === 'question').map(n => byId[n.id]);

/* the unit a question belongs to is DERIVED, the same way the highlight menu
   derives it: a deferred one has no edges left, so it reads `anchorId`. */
function unitOfQuestion(q) {
  if (q.qtype === 'extension') { const h = byId[q.anchorId]; return h && h.unit; }
  const l = linksOf(q).find(x => x.rank === 1);
  const other = l && (l.a === q ? l.b : l.a);
  return other && other.unit;
}

/* SORTED BY UNIT, because the list is grouped by it: a heading starts where
   the unit changes, so an unsorted list prints Genetics four times. Within a
   unit the extensions lead — they are the rows with nowhere else to be found.
   The unit order is UNITS' own, which is the order the map is taught in. */
const UNIT_ORDER = Object.keys(UNITS);
ASKABLE.sort((a, b) => {
  const ua = UNIT_ORDER.indexOf(unitOfQuestion(a)), ub = UNIT_ORDER.indexOf(unitOfQuestion(b));
  if (ua !== ub) return (ua < 0 ? 99 : ua) - (ub < 0 ? 99 : ub);
  const ea = a.qtype === 'extension' ? 0 : 1, eb = b.qtype === 'extension' ? 0 : 1;
  return ea - eb || a.text.localeCompare(b.text);
});

let suggestion = 0, rotateTimer = null;
function rotate() {
  if (document.activeElement === askIn || askIn.value) return;
  suggestion = (suggestion + 1) % ASKABLE.length;
  askIn.placeholder = ASKABLE[suggestion].text;
}
function startRotate() { stopRotate(); rotateTimer = setInterval(rotate, 5000); }
function stopRotate() { if (rotateTimer) clearInterval(rotateTimer); rotateTimer = null; }
askIn.placeholder = ASKABLE[0].text;
startRotate();

let listOpen = false, cursor = -1;
function renderList(filter) {
  const f = (filter || '').trim().toLowerCase();
  const rows = ASKABLE.filter(q => !f || q.text.toLowerCase().includes(f));
  askList.innerHTML = '';
  if (!rows.length) {
    askList.innerHTML = '<div class="askgroup">nothing matches yet</div>';
    return rows;
  }
  let group = null;
  rows.forEach((q, i) => {
    const u = unitOfQuestion(q);
    if (u !== group) {
      group = u;
      const h = document.createElement('div');
      h.className = 'askgroup';
      h.textContent = (UNITS[u] && UNITS[u].name) || 'elsewhere';
      askList.appendChild(h);
    }
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'askopt' + (q.qtype === 'extension' ? ' ext' : '') +
                  (i === cursor ? ' on' : '');
    b.dataset.q = q.id;
    b.textContent = q.text;
    askList.appendChild(b);
  });
  return rows;
}

/* the list is grouped by unit, so the rows are not in ASKABLE's order — the
   keyboard cursor has to walk what is DRAWN */
const drawnRows = () => [...askList.querySelectorAll('.askopt')];

function openList(filter) {
  listOpen = true; askList.hidden = false; askBar.classList.add('open');
  renderList(filter);
}
function closeList() {
  listOpen = false; askList.hidden = true; askBar.classList.remove('open');
  cursor = -1;
}

function ask(id) {
  const q = byId[id];
  if (!q) return;
  closeList();
  askIn.value = '';
  askIn.blur();
  startRotate();
  askQuestion(q);
}

askIn.addEventListener('focus', stopRotate);
askIn.addEventListener('blur', startRotate);
askIn.addEventListener('input', () => {
  cursor = -1;
  if (askIn.value.trim()) openList(askIn.value); else closeList();
});
askIn.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (!listOpen) { openList(askIn.value); cursor = 0; }
    else cursor = Math.min(cursor + 1, drawnRows().length - 1);
    renderList(askIn.value);
    const on = askList.querySelector('.askopt.on');
    if (on) on.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (e.key === 'ArrowUp' && listOpen) {
    e.preventDefault();
    cursor = Math.max(cursor - 1, 0);
    renderList(askIn.value);
    const on = askList.querySelector('.askopt.on');
    if (on) on.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (e.key === 'Escape') { closeList(); askIn.blur(); return; }
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const rows = drawnRows();
  /* A HIGHLIGHTED ROW OUTRANKS THE PLACEHOLDER. Arrowing down puts no text in
     the field, so an empty-field check first sent every keyboard pick to
     whatever the rotation happened to be showing. The placeholder is only the
     offer when the reader has neither typed nor chosen. */
  if (listOpen && cursor >= 0 && rows[cursor]) { ask(rows[cursor].dataset.q); return; }
  /* an empty field asks whatever the placeholder is offering: the rotation
     is a suggestion, and Enter is how you take it */
  if (!askIn.value.trim()) { ask(ASKABLE[suggestion].id); return; }
  const pick = rows[0];
  /* no match is not an error yet — the fuzzy match is the next piece of
     work, and until it lands the bar says so rather than doing nothing */
  if (pick) ask(pick.dataset.q);
  else { askBar.classList.add('miss'); setTimeout(() => askBar.classList.remove('miss'), 600); }
});
askCaret.addEventListener('click', () => {
  if (listOpen) { closeList(); return; }
  openList(askIn.value); askIn.focus();
});
askList.addEventListener('click', e => {
  const b = e.target.closest('.askopt');
  if (b) ask(b.dataset.q);
});
document.addEventListener('pointerdown', e => {
  if (listOpen && !askBar.contains(e.target)) closeList();
});

/* ---- the gutter ruler ---------------------------------------------------- */

const gutter = document.getElementById('gutter');
const rungs = {};
for (const [lv, name] of LADDER) {
  const r = document.createElement('div');
  r.className = 'rung';
  r.innerHTML = '<i></i><span>' + esc(name) + '</span><span class="how"></span>';
  gutter.appendChild(r);
  rungs[lv] = r;
}

function placeGutter() {
  for (const [lv, r] of Object.entries(rungs)) {
    const y = bandCentre[lv] * view.k + view.y;
    r.style.top = y.toFixed(1) + 'px';
    r.style.display = y < 70 || y > innerHeight - 40 ? 'none' : '';
  }
}

function gutterLight(n) {
  for (const r of Object.values(rungs)) {
    r.classList.remove('on');
    r.querySelector('.how').textContent = '';
    r.style.removeProperty('--tint');
  }
  if (!n) return;
  const lv = lvOf(n);
  if (!lv) return;
  const r = rungs[lv];
  r.classList.add('on');
  if (n.tint) r.style.setProperty('--tint', n.tint);
  r.querySelector('.how').textContent =
    n.occursAt ? 'occurs here' : n.emergesAt ? 'emerges here' : '';
}

/* faint band boundaries drawn in world space, so the shelves read even
   where no ruler label is on screen */
{
  const x0 = -900, x1 = Math.max(...nodes.map(n => n.tx)) + 900;
  for (const y of bandEdge) {
    const ln = document.createElementNS(NS, 'line');
    ln.setAttribute('class', 'band');
    ln.setAttribute('x1', x0); ln.setAttribute('x2', x1);
    ln.setAttribute('y1', y);  ln.setAttribute('y2', y);
    svg.insertBefore(ln, svg.firstChild);
  }
}

/* ---- start --------------------------------------------------------------- */

let touched = false;
canvas.addEventListener('pointerdown', () => { touched = true; });
canvas.addEventListener('wheel', () => { touched = true; });
addEventListener('resize', () => { applyView(); if (!touched) centre(); });

function centre(set) {
  const list = set || nodes.filter(n => n.on);
  if (!list.length) return;
  const xs = list.map(n => n.x), ys = list.map(n => n.y);
  const pad = 300;
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad;
  const y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  const k = Math.min(0.9, Math.max(0.3,
    Math.min(innerWidth / (x1 - x0), innerHeight / (y1 - y0))));
  view = {
    k,
    x: innerWidth / 2 - (x0 + x1) / 2 * k,
    y: innerHeight / 2 - (y0 + y1) / 2 * k,
  };
  applyView();
}

for (const n of nodes) paintNode(n);
for (const l of links) paintLink(l);

function start() {
  follow = null;
  hiliteSel.value = '';
  syncHilite();
  hiNodes = null;
  document.body.classList.remove('highlighting');
  for (const n of nodes) n.el.classList.remove('hi');
  clearFocus();
  stages.clear();               // fogged cards must not hold contexts
  unlightAll();
  /* the doors: both anchoring questions and their rank-1 answers lit,
     everything else fog */
  const doors = [];
  for (const q of ['q-medium', 'q-machine']) {
    const n = byId[q];
    light(n); doors.push(n);
    for (const l of linksOf(n)) if (l.spine) {
      const m = l.a === n ? l.b : l.a;
      light(m); doors.push(m);
    }
  }
  /* AND EVERY LESSON, out of the fog at load. The lessons are the featured
     work and the reason the map exists, so a reader who never explores still
     sees all of them; they cost no stage, being screenshots. Not added to
     `doors`, because the camera below frames the opening, and seven cards
     spread over three units would pull it back to a zoom nothing is legible
     at. They are lit where they stand, for whoever pans. */
  for (const n of nodes) if (lessonFor(n)) light(n);
  for (const l of links) edgeRefresh(l);
  measure();
  wake(1);
  for (let i = 0; i < 240; i++) step();   /* pre-settle, so load is calm */
  draw();
  centre(doors);
}
document.getElementById('reset').addEventListener('click', start);
start();
</script>
