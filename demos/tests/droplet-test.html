<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Droplet test</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f6f9fd;}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform vec3  uBalls[10];
uniform float uR[10];
uniform int   uCount;
uniform float uDot;    // rule pitch, world units
uniform float uLine;   // rule width, world units
uniform sampler2D uText;
uniform vec2  uTextC;  // centre of the text plate, world units
uniform vec2  uTextS;  // its size, world units

const float K      = 0.55;   // smooth-union radius: how eagerly droplets merge
// The page sits just behind the droplets, and that distance is the whole
// reason the text looks right. A sphere of water is a ball lens with focal
// length f = n*r / (2(n-1)) ~= 0.7 for r = 0.35. Page further away than f and
// you get a real image: magnified and INVERTED, which is what a drop held up
// in the air does. Page closer than f and you get a virtual image: magnified
// and upright, which is what a drop resting on a page does, and what anyone
// looking at this expects. So keep the gap under f.
const float BACKZ  = -1.2;
const vec3  SUN    = vec3(-0.35, 0.86, 0.37);

float smin(float a, float b, float k){
  float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);
  return mix(b, a, h) - k*h*(1.0-h);
}

// droplets only — the floor is intersected analytically, so refracted rays
// leave the water before they meet it and the floor reads through the lens
float map(vec3 p){
  float d = length(p - uBalls[0]) - uR[0];
  for(int i=1;i<10;i++){
    if(i>=uCount) break;
    d = smin(d, length(p - uBalls[i]) - uR[i], K);
  }
  return d;
}

vec3 grad(vec3 p){
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(
    map(p+e.xyy)-map(p-e.xyy),
    map(p+e.yxy)-map(p-e.yxy),
    map(p+e.yyx)-map(p-e.yyx)));
}

float trace(vec3 ro, vec3 rd, float side){
  float t = 0.02;
  for(int i=0;i<110;i++){
    float d = map(ro + rd*t) * side;
    if(abs(d) < 0.0008*t) return t;
    t += d;
    if(t > 24.0) break;
  }
  return -1.0;
}

// the room the droplets reflect: a cool studio, pale above and dim below, so
// a reflection off a drop sits against the page rather than on top of it
vec3 sky(vec3 rd){
  float y = rd.y*0.5 + 0.5;
  vec3 c = mix(vec3(0.42,0.46,0.52), vec3(0.90,0.94,1.00), smoothstep(0.25,1.0,y));
  c = mix(c, vec3(0.26,0.30,0.36), smoothstep(0.45,0.05,y));
  c += vec3(1.0,1.0,1.0) * smoothstep(0.90, 0.998, dot(rd, SUN)) * 2.4;   // softbox
  return c;
}

// Blue graph paper, ruled procedurally so it stays sharp however far a
// refracted ray wanders off the edge of the text. Fine square, heavier line
// every fifth.
vec3 gridPaper(vec2 q){
  vec3 page  = vec3(0.965, 0.976, 0.992);
  vec3 fine  = vec3(0.784, 0.863, 0.941);
  vec3 major = vec3(0.596, 0.741, 0.886);

  vec2 f = abs(fract(q/uDot - 0.5) - 0.5) * uDot;
  vec2 F = abs(fract(q/(uDot*5.0) - 0.5) - 0.5) * uDot*5.0;
  float w = uLine * 0.8;

  float lf = 1.0 - smoothstep(uLine*0.5 - w, uLine*0.5 + w, min(f.x, f.y));
  float lF = 1.0 - smoothstep(uLine*1.0 - w, uLine*1.0 + w, min(F.x, F.y));
  return mix(mix(page, fine, lf), major, lF);
}

// The sentence, drawn once into a canvas and mapped onto the same plane. Its
// alpha is premultiplied by the draw, so a ray that leaves the text rectangle
// simply sees ruled paper.
vec3 backdrop(vec2 q){
  vec3 c = gridPaper(q);
  vec2 uv = (q - uTextC) / uTextS + 0.5;
  if(uv.x > 0.0 && uv.x < 1.0 && uv.y > 0.0 && uv.y < 1.0){
    vec4 t = texture2D(uText, uv);
    c = mix(c, t.rgb, t.a);
  }
  return c;
}

// everything behind the droplets is that page, held on one plane; rays that
// point away from it (reflections off the top of a drop) see the room instead
vec3 env(vec3 ro, vec3 rd){
  if(rd.z < -0.001){
    float t = (BACKZ - ro.z) / rd.z;
    if(t > 0.0) return backdrop((ro + rd*t).xy);
  }
  return sky(rd);
}

vec3 aces(vec3 x){
  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;
  vec3 ro = vec3(0.0, 0.7, 6.2);
  vec3 rd = normalize(vec3(uv, -1.7));

  vec3 col;
  float t = trace(ro, rd, 1.0);

  if(t > 0.0){
    vec3 p = ro + rd*t;
    vec3 n = grad(p);
    float ndv = max(0.0, dot(-rd, n));
    float fres = 0.02 + 0.98*pow(1.0 - ndv, 5.0);   // Schlick, water F0

    vec3 refracted = vec3(0.0);
    for(int c=0;c<3;c++){
      float ior = 1.330 + float(c)*0.008;           // split by wavelength
      vec3 rin = refract(rd, n, 1.0/ior);
      float t2 = trace(p - n*0.008, rin, -1.0);
      float thick = max(t2, 0.0);
      vec3 p2 = p - n*0.008 + rin*thick;
      vec3 n2 = -grad(p2);
      vec3 rout = refract(rin, n2, ior);
      if(dot(rout,rout) < 0.0001) rout = reflect(rin, n2);   // total internal reflection
      vec3 e = env(p2, rout);
      e *= exp(-thick * vec3(0.30,0.16,0.08));      // Beer-Lambert: thick water goes cyan
      refracted[c] = e[c];
    }

    vec3 refl = env(p, reflect(rd, n));
    col = mix(refracted, refl, fres);

    vec3 h = normalize(SUN - rd);
    col += vec3(1.0,0.97,0.93) * pow(max(0.0, dot(n,h)), 900.0) * 9.0 * fres;  // tight glint
    col += vec3(1.0,0.97,0.93) * pow(max(0.0, dot(n,h)), 60.0)  * 0.35 * fres; // softbox smear
  } else {
    col = env(ro, rd);
  }

  gl_FragColor = vec4(aces(col), 1.0);
}
</script>
<script>
const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

// The title lives on a canvas mapped to a fixed world rectangle, so it holds
// its size against the droplets at any window size. Transparent everywhere but
// the type, so the ruled paper shows through it.
function textPlate(){
  const W = 2048, H = 1024, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.clearRect(0,0,W,H);
  g.fillStyle = '#123a63';
  g.textAlign = 'center';
  g.textBaseline = 'middle';

  const line = 'Water holds on to water. That is cohesion.';
  // shrink to fit rather than trusting a typed size: the plate is a fixed
  // world rectangle, so a line that overflows it is a line the droplets crop
  let px = 100;
  g.font = '600 ' + px + 'px Georgia, "Times New Roman", serif';
  const max = W * 0.86;
  if(g.measureText(line).width > max){
    px = Math.floor(px * max / g.measureText(line).width);
    g.font = '600 ' + px + 'px Georgia, "Times New Roman", serif';
  }
  g.fillText(line, W/2, H*0.16);

  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  return tex;
}

const N = 10;
const uni = {
  uRes:{value:new THREE.Vector2()},
  uTime:{value:0},
  uBalls:{value:Array.from({length:N}, ()=>new THREE.Vector3())},
  uR:{value:new Array(N).fill(0.5)},
  uCount:{value:N},
  uDot:{value:0.16}, uLine:{value:0.012},
  uText:{value:null},
  uTextC:{value:new THREE.Vector2(0, 0.55)},
  uTextS:{value:new THREE.Vector2(9.2, 4.6)}
};
uni.uText.value = textPlate();
scene.add(new THREE.Mesh(new THREE.PlaneBufferGeometry(2,2), new THREE.ShaderMaterial({
  uniforms: uni,
  vertexShader: 'void main(){ gl_Position = vec4(position,1.0); }',
  fragmentShader: document.getElementById('frag').textContent
})));

// each droplet drifts on its own lissajous, and is pulled toward the pointer
const drops = Array.from({length:N}, (_,i)=>({
  ph: i*1.7,
  sp: 0.25 + (i%4)*0.07,
  amp: new THREE.Vector3(1.5 + (i%3)*0.35, 0.85, 0.20),   // shallow in z: see BACKZ
  r: 0.34 + ((i*7)%5)*0.055,
  pos: new THREE.Vector3(), vel: new THREE.Vector3()
}));
drops.forEach((d,i)=>uni.uR.value[i]=d.r);

const pointer = new THREE.Vector3(0,0.4,0);
let attract = 0;
// Unproject the cursor with the shader's own camera, so the gathered blob
// lands under it. The fragment shader builds its ray as ro + k*(uv,-1.7) with
// uv = (frag - res/2)/res.y, so solving that for the plane the droplets swim
// on (z = 0) is exact rather than a fitted constant.
addEventListener('pointermove', e=>{
  const h = innerHeight;
  const uvx = (e.clientX - innerWidth/2) / h;
  const uvy = -(e.clientY - h/2) / h;
  const k = (6.2 - 0.0) / 1.7;                 // ro.z, target z, and the ray's -1.7
  pointer.set(k*uvx, 0.7 + k*uvy, 0.0);
});
addEventListener('pointerdown', ()=>attract = 1);
addEventListener('pointerup',   ()=>attract = 0);

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  uni.uRes.value.set(innerWidth*renderer.getPixelRatio(), innerHeight*renderer.getPixelRatio());
}
addEventListener('resize', resize); resize();

const tmp = new THREE.Vector3();
let last = performance.now();
(function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  uni.uTime.value = now/1000;
  const t = now/1000;

  drops.forEach((d,i)=>{
    tmp.set(
      Math.sin(t*d.sp + d.ph) * d.amp.x,
      Math.sin(t*d.sp*1.31 + d.ph*1.7) * d.amp.y + 0.35,
      Math.cos(t*d.sp*0.83 + d.ph) * d.amp.z
    );
    // pointer wins over the drift while held; otherwise it only grazes them
    tmp.lerp(pointer, attract ? 1.0 : 0.12 / (1 + tmp.distanceTo(pointer)));
    d.vel.multiplyScalar(0.88).addScaledVector(tmp.sub(d.pos), dt*9.0);
    d.pos.addScaledVector(d.vel, dt);
    uni.uBalls.value[i].copy(d.pos);
  });

  renderer.render(scene, cam);
})(last);
</script>
</body>
</html>
