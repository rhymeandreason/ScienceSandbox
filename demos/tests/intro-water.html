<!DOCTYPE html>
<!-- The water card on tests/intro.html, in its own frame. WaterSim draws the
     small molecules from mol-solvation.js and the membrane card draws them
     from mol-small.js; molecules.js refuses both on one page, so this one
     card is an iframe. Nothing else lives here. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>water</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #w { position: absolute; inset: 0; }
  #w canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="w"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../lib/palette.js"></script>
<script src="../lib/tokens-from-palette.js"></script>
<script src="../lib/molecules.js"></script>
<script src="../lib/mol-solvation.js"></script>
<script src="../lib/scene.js"></script>
<script src="../kit/card-stage.js"></script>
<script src="../water/watersim.js"></script>
<script src="../water/watersim-mount.js"></script>
<script>
  WaterSim.mount(document.getElementById('w'), {
    nWater: 14, hbonds: true,
    // warm, so the cluster jostles instead of sitting still
    temperature: 60,
    cam: { theta: 0.6, phi: 1.1, r: 17 },
    stage: { zoom: false },
  });
</script>
</body>
</html>
