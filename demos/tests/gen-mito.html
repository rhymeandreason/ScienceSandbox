<!doctype html>
<!-- requests
1. Show me how a mitochondrion is built and why its folds matter for making ATP
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mitochondrial Structure and Cristae</title>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../kit/app.js" data-shell="steps" data-use="Mitochondrion"></script>
<script>
let M;

const shell = LessonShell.create({
  brand: 'Mitochondrial Architecture',
  hint: 'Drag to orbit · Scroll to zoom',
  ctx: { state: {} },
  steps: [
    {
      eyebrow: 'Architecture',
      title: 'Two distinct membranes',
      body: '<p class="lead"><strong>A mitochondrion is compartmentalised by two concentric membranes.</strong> The outer membrane is freely permeable to small molecules through porin channels, while the inner membrane forms an impermeable boundary that preserves electrochemical gradients.</p><p>Notice the central fluid cavity inside: this is the mitochondrial matrix, housing metabolic enzymes and mitochondrial DNA.</p>',
      nextLabel: 'Explore the folds',
      onEnter(ctx) {
        M.set({ open: 1, cristae: 10, flow: 0.5, uncoupler: false });
        M.notes(['outer', 'inner', 'matrix']);
        ctx.ui.showPanel(M, { only: ['legend'] });
      },
      onExit() {
        M.notes(false);
      }
    },
    {
      eyebrow: 'Cristae Sacs',
      title: 'Folds are enclosed invaginations',
      body: '<p class="lead"><strong>Cristae are not solid shelves, but hollow sacs of inner membrane.</strong> Each fold encloses a lumen that connects back to the intermembrane space through narrow crista junctions.</p><p>Because the inner membrane is folded repeatedly into the matrix, protons pumped into the crista lumen cannot instantly diffuse away into the wider cytosol.</p>',
      nextLabel: 'See the machinery',
      onEnter(ctx) {
        M.set({ open: 1, cristae: 10, flow: 0.6 });
        M.notes(['crista', 'junction', 'ims']);
        ctx.ui.showPanel(M, { zoom: ['crista', 'junction'] });
      },
      onExit() {
        M.notes(false);
      }
    },
    {
      eyebrow: 'Proton Circuit',
      title: 'Pumping protons into cristae',
      body: '<p class="lead"><strong>Electron transport complexes pump protons across the crista membrane.</strong> Protons accumulate within the lumen and return to the matrix exclusively through ATP synthase turbines, driving rotational phosphorylation of ADP.</p>',
      nextLabel: 'Test folding density',
      onEnter(ctx) {
        M.set({ open: 1, flow: 0.8, uncoupler: false });
        M.notes(['complex', 'synthase']);
        ctx.ui.controls('<div class="stats"><div class="stat"><span class="stat-label">ATP synthesized</span><span class="stat-value" id="atp-count" data-live>0</span></div><div class="stat"><span class="stat-label">Organelle length</span><span class="stat-value" id="mito-len" data-live>0 nm</span></div></div>');
        
        const atpEl = ctx.ui.q('#atp-count');
        const lenEl = ctx.ui.q('#mito-len');
        
        const unbind = M.on('frame', s => {
          if (atpEl) atpEl.textContent = s.ledger.atpMade;
          if (lenEl) lenEl.textContent = Math.round(s.lengthNm) + ' nm';
        });
        ctx.state.unbind = unbind;
      },
      onExit(ctx) {
        M.notes(false);
        if (ctx.state.unbind) ctx.state.unbind();
      }
    },
    {
      eyebrow: 'Surface Area',
      title: 'Why extensive folding matters',
      body: '<p class="lead"><strong>More cristae provide more membrane area to mount ATP machinery.</strong> Tissues with intense energy demands, such as cardiac muscle, pack their mitochondria with dozens of dense cristae folds.</p><p>Adjust the cristae slider below to see how increasing membrane folds multiplies the number of respiratory complexes and ATP output.</p>',
      onEnter(ctx) {
        M.notes(false);
        ctx.ui.controls(
          '<div class="slider"><div class="slider-head"><span class="label">Cristae density</span><span class="value" id="cristae-val" data-live>12</span></div><input type="range" id="cristae-slider" min="4" max="22" step="1" value="12"></div>' +
          '<div class="stats"><div class="stat"><span class="stat-label">Synthase count</span><span class="stat-value" id="synth-count" data-live>0</span></div><div class="stat"><span class="stat-label">Complex count</span><span class="stat-value" id="cx-count" data-live>0</span></div><div class="stat"><span class="stat-label">ATP Made</span><span class="stat-value" id="atp-out" data-live>0</span></div></div>'
        );

        const synthEl = ctx.ui.q('#synth-count');
        const cxEl = ctx.ui.q('#cx-count');
        const atpEl = ctx.ui.q('#atp-out');
        const valEl = ctx.ui.q('#cristae-val');
        
        ctx.ui.range(ctx.ui.q('#cristae-slider'), v => {
          valEl.textContent = v;
          M.set({ cristae: parseInt(v, 10), flow: 1 });
        });

        const unbind = M.on('frame', s => {
          if (synthEl) synthEl.textContent = s.counts.synthases;
          if (cxEl) cxEl.textContent = s.counts.complexes;
          if (atpEl) atpEl.textContent = s.ledger.atpMade;
        });
        ctx.state.unbind = unbind;
      },
      onExit(ctx) {
        if (ctx.state.unbind) ctx.state.unbind();
      }
    }
  ]
});

M = Mitochondrion.mount(shell.stage, { viewOffset: shell.viewOffset, flow: 0.6, cristae: 10, open: 1 });
shell.goTo(0);
</script>
</body>
</html>
