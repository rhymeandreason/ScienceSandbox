<!doctype html>
<!-- requests
1. what are the parts of a plant cell, and which ones does an animal cell not have?
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plant vs Animal Cells</title>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../kit/app.js" data-shell="steps" data-use="PlantCell,AnimalCell"></script>
<script>
const shell = LessonShell.create({
  brand: 'Cell Architecture',
  hint: 'Drag to orbit · Scroll to zoom',
  ctx: {},
  steps: [
    {
      eyebrow: 'Plant Cell Anatomy',
      title: 'The eukaryotic foundation',
      scene: 'plant',
      body: '<p><b>Plant cells share the standard eukaryotic organelles with animal cells.</b> Both rely on a membrane-bound nucleus to house DNA, mitochondria for cellular respiration, endoplasmic reticulum and Golgi ribbons for protein synthesis and trafficking, and ribosomes suspended throughout the cytosol.</p>',
      onEnter(ctx) {
        plant.notes(['nucleus', 'mitochondrion', 'er', 'golgi']);
        ctx.ui.showPanel(plant, { notes: ['nucleus', 'mitochondrion', 'er', 'golgi'], zoom: ['nucleus', 'mitochondrion', 'golgi'] });
      },
      onExit() {
        plant.notes(false);
      }
    },
    {
      eyebrow: 'Unique Structures',
      title: 'What makes a plant cell distinct?',
      scene: 'plant',
      body: '<p><b>Three major structures distinguish plant cells from animal cells.</b> A rigid cellulose cell wall provides structural support and withstands internal hydrostatic pressure. A large central vacuole maintains cell turgor and stores solutes, while chloroplasts capture light energy to drive photosynthesis.</p>',
      onEnter(ctx) {
        plant.notes(['wall', 'vacuole', 'chloroplast']);
        ctx.ui.showPanel(plant, { notes: ['wall', 'vacuole', 'chloroplast', 'plasmodesma'], zoom: ['wall', 'vacuole', 'chloroplast'] });
      },
      onExit() {
        plant.notes(false);
      }
    },
    {
      eyebrow: 'Animal Cell Comparison',
      title: 'The animal cell counterpart',
      scene: 'animal',
      body: '<p><b>Animal cells lack a rigid cell wall, chloroplasts, and a central vacuole.</b> Enclosed only by a flexible plasma membrane, they maintain their shape through a dynamic internal cytoskeleton and centrosomes, allowing for diverse shapes and motility that rigid plant cell walls prohibit.</p>',
      onEnter(ctx) {
        animal.notes(['membrane', 'nucleus', 'centrosome']);
        ctx.ui.showPanel(animal, { notes: ['membrane', 'nucleus', 'centrosome', 'mitochondrion'], zoom: ['nucleus', 'centrosome', 'mitochondrion'] });
      },
      onExit() {
        animal.notes(false);
      }
    }
  ]
});

const plant = shell.scene('plant', el => PlantCell.mount(el, { tissue: 'leaf', viewOffset: shell.viewOffset }));
const animal = shell.scene('animal', el => AnimalCell.mount(el, { viewOffset: shell.viewOffset }));

shell.goTo(0);
</script>
</body>
</html>
