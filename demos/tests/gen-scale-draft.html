<!doctype html>
<!-- requests
1. a lesson that starts at the whole leaf cell then goes inside one thylakoid membrane
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>From Leaf Cell to Thylakoid Membrane</title>
<style>
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../kit/app.js" data-shell="steps" data-use="PlantCell,Membrane"></script>
<script>
const shell = LessonShell.create({
  brand: 'Photosynthesis Across Scales',
  hint: 'Drag to orbit · Scroll to zoom',
  ctx: { unsubs: [] },
  steps: [
    {
      eyebrow: 'Cellular Scale',
      title: 'The photosynthetic plant cell',
      body: '<p><b>Photosynthesis begins inside specialised green organelles called chloroplasts.</b> In a leaf mesophyll cell, dozens of chloroplasts circulate through the cytoplasm around a large central vacuole.</p>',
      scene: 'cell',
      onEnter(ctx) {
        cell.notes(['chloroplast']);
        ctx.ui.showPanel(cell, { zoom: ['chloroplast', 'vacuole', 'nucleus'] });
      },
      onExit() {
        cell.notes(false);
      }
    },
    {
      eyebrow: 'Membrane Scale',
      title: 'Inside the thylakoid membrane',
      body: '<p><b>Light energy excites electrons to pump protons into the thylakoid lumen.</b> The bottom compartment represents the enclosed thylakoid lumen, while the top compartment is the chloroplast stroma.</p>',
      scene: 'membrane',
      onEnter(ctx) {
        m.set({ fuel: 'light', fuelRate: 1 });
        m.notes(['complex', 'synthase']);
        ctx.ui.controls(`
          <div class="stat-grid">
            <div class="stat"><span class="stat-label">Lumen pH</span><span class="stat-value" id="ph-in">--</span></div>
            <div class="stat"><span class="stat-label">Stroma pH</span><span class="stat-value" id="ph-out">--</span></div>
          </div>
        `);
        const unsub = m.on('frame', s => {
          if (!s || !s.pH) return;
          const inEl = ctx.ui.q('#ph-in');
          const outEl = ctx.ui.q('#ph-out');
          if (inEl) inEl.textContent = s.pH.inside.toFixed(1);
          if (outEl) outEl.textContent = s.pH.outside.toFixed(1);
        });
        ctx.unsubs.push(unsub);
      },
      onExit(ctx) {
        m.notes(false);
        ctx.unsubs.forEach(u => u());
        ctx.unsubs = [];
      }
    },
    {
      eyebrow: 'ATP Synthesis',
      title: 'Harnessing the proton gradient',
      body: '<p><b>Protons flow down their electrochemical gradient through ATP synthase, turning the rotor to synthesize ATP.</b> Adjust the light intensity to observe how proton-motive force drives turbine speed and ATP production.</p>',
      scene: 'membrane',
      onEnter(ctx) {
        ctx.ui.controls(`
          <div class="slider">
            <div class="slider-head"><span class="label">Light intensity</span><span class="value" id="light-val">100%</span></div>
            <input type="range" id="light-input" min="0" max="1" step="0.05" value="1">
          </div>
          <div class="stat-grid">
            <div class="stat"><span class="stat-label">Proton motive force</span><span class="stat-value" id="pmf-val">--</span><span class="stat-sub">mV</span></div>
            <div class="stat"><span class="stat-label">ATP synthesized</span><span class="stat-value" id="atp-val">0</span></div>
          </div>
        `);
        ctx.ui.range(ctx.ui.q('#light-input'), v => {
          m.set({ fuelRate: v });
          const label = ctx.ui.q('#light-val');
          if (label) label.textContent = Math.round(v * 100) + '%';
        });
        const unsub = m.on('frame', s => {
          if (!s) return;
          const pmfEl = ctx.ui.q('#pmf-val');
          const atpEl = ctx.ui.q('#atp-val');
          if (pmfEl && s.pmf !== undefined) pmfEl.textContent = Math.round(s.pmf);
          if (atpEl && s.atpMade !== undefined) atpEl.textContent = s.atpMade;
        });
        ctx.unsubs.push(unsub);
      },
      onExit(ctx) {
        ctx.unsubs.forEach(u => u());
        ctx.unsubs = [];
      }
    }
  ]
});

const cell = shell.scene('cell', el => PlantCell.mount(el, {
  tissue: 'leaf',
  stream: 1,
  viewOffset: shell.viewOffset
}));

const m = shell.scene('membrane', el => Membrane.mount(el, {
  context: 'thylakoid',
  fuel: 'light',
  fuelRate: 1,
  proteins: { complex: { x: -50 }, synthase: { x: 40 } },
  contents: { inside: { water: 30, H: 22 }, outside: { water: 30, H: 22 } },
  potential: 'nernst',
  viewOffset: shell.viewOffset
}));

shell.goTo(0);
</script>
</body>
</html>
