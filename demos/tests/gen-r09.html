<!doctype html>
<!-- requests
1. plot how the proton gradient builds up while the pump runs
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Building the Proton Gradient</title>
<style>
  .chart-box { width: 100%; height: 140px; margin-top: 10px; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../kit/app.js" data-shell="steps" data-use="Membrane,Graph"></script>
<script>
let g = null;
let unsub = null;

const shell = LessonShell.create({
  brand: 'Chemiosmosis',
  hint: 'Drag to orbit · Scroll to zoom',
  ctx: {},
  steps: [
    {
      eyebrow: 'Mitochondrial Inner Membrane',
      title: 'Proton pumping across the bilayer',
      body: '<p><b>Proton pumps harvest chemical energy to establish a gradient.</b> An electron transport complex consumes fuel (NADH) to translocate protons from the matrix into the intermembrane space.</p>',
      nextLabel: 'Start pumping',
      onEnter(ctx) {
        m.set({
          context: 'mitochondrion',
          fuel: null,
          fuelRate: 0,
          proteins: { complex: { x: -40 }, synthase: null, leak: null },
          contents: { inside: { water: 30, H: 22 }, outside: { water: 30, H: 22 } },
          potential: 'nernst'
        });
        m.reset();
        m.note('complex', { text: 'ETC Complex' });
        ctx.ui.showPanel(m);
      },
      onExit() {
        m.notes(false);
      }
    },
    {
      eyebrow: 'Gradient in Real Time',
      title: 'Plotting the proton-motive force',
      body: '<p><b>As protons accumulate outside, the proton-motive force (pmf) rises.</b> Watch the live trace record both the electrical voltage and chemical pH difference established by the active complex.</p>',
      nextLabel: 'Add ATP Synthase',
      onEnter(ctx) {
        m.set({
          fuel: 'NADH',
          fuelRate: 1,
          proteins: { complex: { x: -40 }, synthase: null, leak: null }
        });
        ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">Proton Motive Force</div><div class="stat-value" id="pmf-val">0 mV</div></div><div class="stat"><div class="stat-label">pH Difference (&Delta;pH)</div><div class="stat-value" id="dp-val">0.0</div></div></div><div id="graph-slot" class="chart-box"></div>');
        
        const el = ctx.ui.q('#graph-slot');
        g = Graph.mount(el, { live: { span: 60 }, height: 130 }).follow(m, 'pmf');

        unsub = m.on('frame', s => {
          const pmfEl = ctx.ui.q('#pmf-val');
          const dpEl = ctx.ui.q('#dp-val');
          if (pmfEl && s.pmf !== undefined) pmfEl.textContent = Math.round(s.pmf) + ' mV';
          if (dpEl && s.dpH !== undefined) dpEl.textContent = s.dpH.toFixed(2);
        });
      },
      onExit() {
        if (unsub) { unsub(); unsub = null; }
        if (g) { g.destroy(); g = null; }
      }
    },
    {
      eyebrow: 'Coupling to Work',
      title: 'Discharging the gradient through ATP synthase',
      body: '<p><b>ATP synthase acts as a turbine driven by the returning protons.</b> Protons flow back down their electrochemical gradient, turning the rotor to synthesize ATP.</p>',
      nextLabel: 'Finish',
      onEnter(ctx) {
        m.set({
          fuel: 'NADH',
          fuelRate: 1,
          proteins: { complex: { x: -45 }, synthase: { x: 45 }, leak: null }
        });
        ctx.ui.controls('<div class="stats"><div class="stat"><div class="stat-label">ATP Made</div><div class="stat-value" id="atp-val">0</div></div><div class="stat"><div class="stat-label">pmf</div><div class="stat-value" id="pmf-val2">0 mV</div></div></div><div id="graph-slot2" class="chart-box"></div>');
        
        const el = ctx.ui.q('#graph-slot2');
        g = Graph.mount(el, { live: { span: 60 }, height: 130 }).follow(m, 'atp');

        unsub = m.on('frame', s => {
          const atpEl = ctx.ui.q('#atp-val');
          const pmfEl = ctx.ui.q('#pmf-val2');
          if (atpEl && s.atpMade !== undefined) atpEl.textContent = s.atpMade;
          if (pmfEl && s.pmf !== undefined) pmfEl.textContent = Math.round(s.pmf) + ' mV';
        });
        
        m.notes(['complex', 'synthase']);
      },
      onExit() {
        m.notes(false);
        if (unsub) { unsub(); unsub = null; }
        if (g) { g.destroy(); g = null; }
      }
    }
  ],
  onStep(step) {}
});

const m = Membrane.mount(shell.stage, {
  viewOffset: shell.viewOffset,
  context: 'mitochondrion',
  potential: 'nernst',
  proteins: { complex: { x: -40 }, synthase: null, leak: null }
});

shell.goTo(0);
</script>
</body>
</html>
