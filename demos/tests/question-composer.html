<!DOCTYPE html>
<!-- Test bench for the door → concept → question → concept hierarchy.
     One door is wired up: "Why is water the foundation of life?"

     The concept table lives in this page, not in lib/questions.js, because
     concepts are the part still being designed — a concept owns a name, a
     question of its own, a kind, a state, and the questions it answers. A
     question naming two concepts is what carries you from one door to the
     next; nothing here links out to a lesson yet.

     A concept card goes LIVE the moment it is REVEALED, not on a click. The map's
     whole claim is that a concept is a thing you can look at, and a placeholder
     asks the reader to take that on faith until they click. `CONTENT` and
     `PLACEMENTS` in mapcontent.js say what each concept has to show; a concept
     with no INLINE content grows no picture box at all, and the ones that do
     show a loading state until the stage mounts.

     They have to RUN rather than be pre-rendered as stills: most are water
     sims, and a freshly spawned one is molecules at random positions, so a
     still taken at t=0 is a scatter — a worse picture than no picture.

     Only four run at once, and kit/card-stage.js owns that budget and why. The
     rest keep a still of their last frame, so every card with something to show
     is showing it. Revealing or clicking re-fronts a card, so what the reader
     just uncovered, or is looking at, is never what gets released. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question composer — Ponder the big questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../molecule-builder/molecule-builder.css">
<link rel="stylesheet" href="../kit/proteinbox.css">
<style>
  :root {
    --sans: 'Futura', 'Futura PT', 'Jost', -apple-system, 'Segoe UI', sans-serif;
    /* Futura is a DISPLAY face here: it carries the logo, the buttons and the
       uppercase letterspaced labels, and it is unreadable as running text at
       11px. Anything that is prose set in sans — a caption, a blurb — takes
       this instead, which is whatever the reader's own system reads best. */
    --ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --serif: 'Literata', Georgia, serif;

    --paper:  #faf8f4;
    --ink:    #14161a;
    --muted:  #6d6f76;
    --line:   #e4e0d7;
    --card:   #ffffff;
    --accent: #1f5f4f;
    --spark:  #e2643a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    overflow: hidden;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- chrome --------------------------------------------------------- */

  .mast {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: baseline; gap: 1rem;
    padding: 1.1rem clamp(1rem, 3vw, 2rem) 0.9rem;
    pointer-events: none;
  }
  .mast > * { pointer-events: auto; }
  .logo {
    font-size: 1.5rem; font-weight: 500; letter-spacing: -0.04em;
    margin: 0; text-transform: lowercase; text-decoration: none; color: inherit;
  }
  .logo em { font-style: normal; color: var(--accent); }
  .logo .dot { color: var(--spark); }
  .mast .title { font-family: var(--serif); font-size: 0.95rem; color: var(--muted); }
  .mast .spacer { flex: 1; pointer-events: none; }

  .btn {
    font-family: var(--sans); font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    background: var(--card); border: 1px solid var(--line); border-radius: 3px;
    padding: 0.45rem 0.75rem; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .btn:hover { color: var(--accent); border-color: var(--accent); }

  #canvas { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #canvas.panning { cursor: grabbing; }
  /* geometricPrecision, because #world is zoomed rather than scaled: with the
     default (optimizeLegibility) WebKit rounds each glyph's advance to whole
     pixels at the zoomed size, so a line's width drifts with k and a heading
     that fits at 1.0 wraps at 0.7. Sub-pixel advances make the text metrics
     scale linearly, which is what keeps the wrap fixed at every zoom. */
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0;
           text-rendering: geometricPrecision; -webkit-text-size-adjust: none; }
  #edges { position: absolute; overflow: visible; pointer-events: none; }

  /* ---- the three altitudes -------------------------------------------- */

  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: zoom-in;          /* a card is something to look closer at */
    user-select: none;
    border-radius: 4px;
    transition: border-color .15s, box-shadow .15s, opacity .18s;
  }
  .node.dragging { cursor: grabbing; box-shadow: 0 10px 26px rgba(20,22,26,.12); }

  /* the door: the only node that is a claim about a whole region */
  .node.door {
    width: 29rem;
    padding: 2rem 2.2rem 2.1rem;
    background: var(--ink);
    border: 1px solid var(--ink);
    color: var(--paper);
    text-align: center;
  }
  .node.door .q {
    font-family: var(--serif);
    font-size: 2.15rem;
    line-height: 1.12;
    letter-spacing: -0.02em;
  }
  .node.door .meta {
    font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--spark); margin-top: 0.5rem;
  }

  .node.concept {
    width: 17.5rem;
    padding: 0.85rem 1rem 0.9rem;
    background: var(--card);
    border: 1px solid var(--line);
    text-align: left;
  }
  /* the name is an eyebrow — which lesson this is — and the claim is the card */
  .node.concept .name {
    font-size: 0.6rem; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 0.4rem;
  }
  /* The dot is the DOOR, not the state: every card here is white, so its door
     is the only thing the dot can carry that the card cannot. State survives in
     the same dot's fill — solid is built, half is an engine with no lesson on
     it, hollow is planned — which is a weaker signal than a colour, and the
     right way round for a map about crossings. `--dot` is set per card in
     paintNode from that concept's door tint. */
  .node.concept .name::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--dot, var(--line)); flex: none;
  }
  .node.concept.engine  .name::before { opacity: 0.5; }
  .node.concept.planned .name::before {
    background: transparent; box-shadow: inset 0 0 0 1.5px var(--dot, var(--line));
  }
  /* the open card: the one you clicked grows and makes room for its picture */
  .node.concept.hub { width: 34rem; padding: 1.7rem 1.9rem 1.75rem; }
  /* the claim: what this lesson asserts, in water-lab's own register — flat,
     present tense, the fact itself rather than a tease of it */
  .node.concept .claim {
    font-family: var(--serif); font-size: 1rem; line-height: 1.28;
    color: var(--ink); margin-top: 0.35rem; letter-spacing: -0.005em;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .node.concept.planned .claim { color: var(--muted); }
  .node.concept.hub .claim {
    font-size: 1.9rem; line-height: 1.18; margin-top: 0.6rem;
    letter-spacing: -0.015em; -webkit-line-clamp: 5;
  }
  .node.concept.hub .name { font-size: 0.68rem; letter-spacing: 0.2em; }

  /* 4:3, the same shape cards-cluster gives its stages, and a RATIO rather than
     a height on purpose: the card sets the width, the picture follows, and the
     closed thumb and the open one are then the same frame at two sizes. A
     molecule solved into a 4:3 box is solved into the same box when the card
     opens, so nothing about its framing changes except the scale. Two typed
     heights could not promise that — 17.5rem wide against 6.6rem tall is 2.4:1,
     which crops a tall molecule to a letterbox. */
  .node.concept .thumb {
    position: relative; overflow: hidden;
    width: 100%; aspect-ratio: 4 / 3; margin: 0.65rem 0 0.25rem;
    background: #eceae4; border: 1px solid var(--line); border-radius: 3px;
  }
  /* A LOADING state, not a label. The thumb only exists on a card that has a
     picture coming, so the box says "arriving" rather than naming an absence:
     an overlay sweeping until the stage mounts over it. Absolutely positioned
     and behind the canvas, so nothing about the layout depends on whether the
     picture is here yet. */
  .node.concept .thumb .ph {
    position: absolute; inset: 0;
    background: linear-gradient(100deg,
      #eceae4 30%, #f6f4ef 48%, #eceae4 66%) 0 0 / 300% 100%;
    animation: thumb-shimmer 1.5s linear infinite;
  }
  @keyframes thumb-shimmer { to { background-position: -300% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .node.concept .thumb .ph { animation: none; }
  }
  .node.concept .thumb.mounted .ph { display: none; }
  /* Every stage this page mounts makes its own canvas inside the thumb —
     card-stage.js and molecule-builder.js both, and for the same reason: a
     destroy that force-loses the context can never give the element back.
     A canvas inside #world is inside a CSS scale, and it measures its LAYOUT
     box, so it renders at 1x and the transform resizes the result: crisp at
     the opening zoom and softening as the reader scrolls in. The card that
     matters is the open one, and opening it grows the thumb, which resizes the
     renderer for real. */
  .node.concept .thumb > canvas { display: block; width: 100%; height: 100%; }
  /* The word goes when the picture arrives, and comes back when it leaves. */
  .node.concept .thumb.mounted { background: #f2f0ea; }
  .node.concept .thumb .still {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: .5;
  }
  /* The open card keeps the ratio and only the width changes, so opening a card
     scales its picture rather than re-composing it. The loading state lives on
     `.ph` above and nowhere else: a rule here on equal specificity beats
     `.mounted`, which is how the placeholder used to come back the moment a
     card was expanded. */
  .node.concept.hub .thumb { margin: 1rem 0 0.35rem; }

  .node.concept .meta {
    font-size: 0.55rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--spark); margin-top: 0.4rem;
  }
  /* state, drawn on the left edge: built is solid, planned is nothing */
  .node.concept.planned { border-style: dashed; }


  /* A card's own controls belong to the `interact` band and nowhere else. Below
     0.75 the reader is placing cards in relation to each other, and a control
     they cannot hit — the buttons are 22px tall before the zoom takes half of
     it — is an invitation to a click that pans instead. `.near` is that test,
     set per card because an open card is twice the width and passes it at half
     the k. The concept keeps deciding whether the control is EARNED
     (mb-dims.armed, a finished molecule); this decides whether it is reachable.
     Faded rather than removed, so nothing reflows as the reader scrolls in. */
  .node.concept .mb-dims { transition: opacity .18s ease; }
  .node.concept:not(.near) .mb-dims { opacity: 0; pointer-events: none; }

  /* Every control a card carries is gated the same way, and the gate is this
     page's: only the map knows how big its card is on screen. What they look
     like is the module's (kit/proteinbox.css) or the builder's. */
  .node.concept:not(.near) .pbox-rep,
  .node.concept:not(.near) .pbox-play,
  .node.concept:not(.near) .lesson,
  .node.concept:not(.near) .mb-dims { opacity: 0; pointer-events: none; }

  .node.concept .lesson {
    position: absolute; left: 8px; bottom: 8px;
    font: inherit; font-size: 0.55rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 3px;
    padding: 0.3rem 0.5rem; box-shadow: 0 5px 16px -8px rgba(0,0,0,.4);
    transition: opacity .18s ease, color .15s, border-color .15s;
  }
  .node.concept .lesson:hover { color: var(--ink); border-color: var(--ink); }

  .node.question {
    width: 13.5rem;
    padding: 0.5rem 0.65rem;
    background: transparent;
    border: 1px solid transparent;
    font-family: var(--serif); font-size: 1rem; line-height: 1.25; color: var(--muted);
    text-align: center;
  }

  /* a question opens the same way a concept does: bigger, with room for a picture */
  /* A question opens the same way a concept does — bigger, and readable — but it
     grows NO picture block. A concept's placeholder is a promise: that card has
     a lesson behind it and a stage is what arrives there. A question has
     neither, so the grey box was only ever an empty rectangle appearing on
     click, and the reader has to read it as meaning something. The question IS
     the card. */
  .node.question.hub {
    width: 17rem; padding: 0.9rem 1rem 0.95rem;
    font-size: 1.28rem; line-height: 1.22; color: var(--ink);
  }

  .node:hover { border-color: var(--accent); }
  .node.question:hover { background: var(--card); border-color: var(--line); color: var(--ink); }

  .focusing .node { opacity: 0.18; pointer-events: none; }
  .focusing .node.lit { opacity: 1; pointer-events: auto; }
  /* Hop 2 is NOT dimmed: it is the concepts the clicked card's questions cross
     to, and the crossing is the point. Depth still reads, in the links. */
  .focusing .node.hop2 { opacity: 1; }
  .focusing .node.question.lit {
    background: var(--card); border-color: var(--line); color: var(--ink);
  }

  /* ---- full screen ----------------------------------------------------- */

  /* It grows out of the card you double-clicked: the origin is set from that
     card's centre, so the sheet expands from where you were looking rather than
     appearing over it. Kept in the layout and hidden by visibility, because
     display:none cannot transition. */
  #full {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    background: var(--paper);
    padding: clamp(1.6rem, 4vw, 3.2rem);
    visibility: hidden; opacity: 0; pointer-events: none;
    transform: scale(0.94);
    transition: opacity .2s ease, transform .34s cubic-bezier(.2,.8,.2,1),
                visibility 0s linear .34s;
  }
  #full.on {
    visibility: visible; opacity: 1; pointer-events: auto;
    transform: none;
    transition: opacity .18s ease, transform .34s cubic-bezier(.2,.8,.2,1),
                visibility 0s;
  }
  #full .lede, #full .stage, #full .x {
    opacity: 0; transform: translateY(10px);
    transition: opacity .26s ease .06s, transform .34s cubic-bezier(.2,.8,.2,1) .06s;
  }
  #full.on .lede, #full.on .stage, #full.on .x { opacity: 1; transform: none; }
  #full.on .stage { transition-delay: .1s; }

  @media (prefers-reduced-motion: reduce) {
    #full, #full .lede, #full .stage, #full .x { transition-duration: .01ms; }
  }
  #full .lede {
    font-family: var(--serif);
    font-size: clamp(1.7rem, 3.6vw, 3.1rem);
    line-height: 1.08; letter-spacing: -0.02em;
    margin: 0 0 clamp(1.1rem, 2.6vw, 1.9rem); max-width: 26ch;
  }
  #full .stage {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    background: #eceae4; border: 1px solid var(--line); border-radius: 4px;
    font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: #b6b2a8;
  }
  #full .x {
    position: absolute; top: clamp(1.1rem, 2.5vw, 1.8rem); right: clamp(1.1rem, 2.5vw, 1.8rem);
    display: flex; align-items: center; justify-content: center;
    width: 2.2rem; height: 2.2rem; padding: 0;
    background: none; border: 0; border-radius: 3px;
    color: var(--muted); cursor: pointer; transition: color .15s;
  }
  #full .x:hover { color: var(--spark); }

  .hint {
    position: fixed; right: clamp(1rem, 3vw, 2rem); bottom: 1.1rem; z-index: 5;
    font-size: 0.7rem; letter-spacing: 0.06em; color: var(--muted);
  }
  .legend {
    position: fixed; left: clamp(1rem, 3vw, 2rem); bottom: 1.1rem; z-index: 5;
    display: flex; gap: 1.1rem; font-size: 0.68rem; letter-spacing: 0.05em;
    color: var(--muted);
  }
  .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 0.4rem; }
  .legend .b { background: var(--accent); }
  .legend .e { background: var(--spark); }
  .legend .p { background: var(--line); }
  /* ---- the composer ---------------------------------------------------
     The typed question is a TEMPORARY DOOR. So the box sits where a door's
     claim would be — top centre, over the map — and what it lands on is the
     same three-level open, composed around a question instead of around one
     of the four written doors. */
  .composer {
    position: fixed; z-index: 6; top: 3.9rem; left: 50%; transform: translateX(-50%);
    width: min(34rem, calc(100vw - 2rem));
  }
  .composer input {
    font-family: var(--serif); font-size: 1rem; color: var(--ink);
    width: 100%; background: var(--card);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 0.75rem 0.9rem;
    box-shadow: 0 6px 20px rgba(20,22,26,.06);
    transition: border-color .15s, box-shadow .15s;
  }
  .composer input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 6px 24px rgba(20,22,26,.10);
  }
  .composer input::placeholder { color: var(--muted); font-style: italic; }

  /* Five, never one: embedding distance collapses contrast pairs, so the fan
     is the honest presentation and the reader picks their own door. */
  .hits {
    margin-top: 0.4rem; background: var(--card);
    border: 1px solid var(--line); border-radius: 3px;
    box-shadow: 0 10px 28px rgba(20,22,26,.10);
    overflow: hidden;
  }
  .hits:empty { display: none; }
  .hits li {
    list-style: none; padding: 0.6rem 0.9rem; cursor: pointer;
    border-top: 1px solid var(--line);
    font-family: var(--serif); font-size: 0.9rem;
  }
  .hits li:first-child { border-top: 0; }
  .hits li:hover, .hits li[aria-selected="true"] { background: var(--paper); }
  .hits li .on {
    display: block; margin-top: 0.2rem;
    font-family: var(--sans); font-size: 0.62rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
  }
  /* A miss is not a failure state, it is the useful artefact — the map has no
     node for what was asked, and that is what says which door to write next. */
  /* A card the reader named outranks both, so it reads as the answer and not
     as one more suggestion. */
  .hits li.card b { font-weight: 500; }
  .hits li.card .on { color: var(--muted); font-family: var(--serif);
                      text-transform: none; letter-spacing: 0; font-size: 0.8rem; }
  .hits li.miss { cursor: default; color: var(--muted); font-style: italic; }
  .hits li.miss:hover { background: var(--card); }

  /* ---- a specimen card ------------------------------------------------
     Built by inverting the concept card. There, the name is an eyebrow and the
     CLAIM is the card, because a lesson is what it asserts. Here the NAME is
     the card, because a specimen is a thing and its blurb is a label on it.

     No dot either: the dot carries which DOOR a concept belongs to, and a
     specimen belongs to no door — it is held by every concept that names it. */
  .node.concept.specimen .name {
    font-family: var(--serif); font-size: 1.1rem; line-height: 1.2;
    font-weight: 400; letter-spacing: -0.01em; text-transform: none;
    color: var(--ink); display: block;
  }
  .node.concept.specimen .name::before { display: none; }
  .node.concept.specimen .claim {
    font-family: var(--ui); font-size: 0.72rem; line-height: 1.4;
    color: var(--muted); margin-top: 0.5rem; letter-spacing: 0;
    -webkit-line-clamp: 3;
  }
  .node.concept.specimen .thumb { margin-top: 0.55rem; }
  /* What made this file, read from the baker's half of the registry. Small,
     tabular, and deliberately quiet: it is provenance, not the point. */
  .node.concept.specimen .prov {
    font-family: var(--ui); font-size: 0.63rem; line-height: 1.35;
    color: var(--faint, #9a9ca3); margin-top: 0.35rem;
    font-variant-numeric: tabular-nums;
  }
  /* An enzyme, marked by its EC class rather than by the word. */
  .node.concept.specimen .tag {
    display: inline-flex; align-items: baseline; gap: 0.4rem;
    margin-top: 0.3rem;
    font-family: var(--sans); font-size: 0.56rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent);
  }
  .node.concept.specimen .tag span {
    letter-spacing: 0.08em; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .node.concept.specimen.hub .prov { font-size: 0.75rem; margin-top: 0.5rem; }
  .node.concept.specimen.hub .tag { font-size: 0.62rem; }
  /* Opened, the name takes the size the claim would have had. */
  .node.concept.specimen.hub .name {
    font-size: 1.9rem; line-height: 1.18; letter-spacing: -0.015em;
  }
  .node.concept.specimen.hub .claim { font-size: 0.85rem; margin-top: 0.7rem; }

  /* ---- a video card ----------------------------------------------------
     Same chassis as every other card — width, border, hover, the .hub growth —
     so it sits in a fan and reads as belonging to the map. Three things make
     it a video and they are the three that carry across the whole zoom range:
     16:9 rather than 4:3, a dark ground rather than paper, and a credit line.
     At k 0.4 the shape alone says it, before a word is legible. */
  .node.concept.video { padding-top: 0.9rem; }
  .node.concept.video .thumb.poster {
    aspect-ratio: 16 / 9; margin-top: 0; background: #0e0f11; border-color: #0e0f11;
  }
  .node.concept.video .thumb.poster img {
    display: block; width: 100%; height: 100%; object-fit: cover;
  }
  /* The play mark is the affordance; the button under it is the hit target and
     only appears when the card is near, like every other control here. */
  .node.concept.video .play {
    position: absolute; left: 50%; top: 50%; width: 2.6rem; height: 2.6rem;
    transform: translate(-50%, -50%);
    border-radius: 50%; background: rgba(14,15,17,.55);
    border: 1px solid rgba(255,255,255,.75);
    transition: background .15s;
  }
  .node.concept.video .play::after {
    content: ''; position: absolute; left: 56%; top: 50%;
    transform: translate(-50%, -50%);
    border: 0.5rem solid transparent; border-left: 0.8rem solid #fff;
  }
  .node.concept.video:hover .play { background: rgba(14,15,17,.8); }
  /* Full bleed and invisible. NOT gated on `.near` like the card's other
     controls: a video card has nothing to show but its poster, so zooming in
     first would be a step that buys the reader nothing. */
  .node.concept.video .playhit {
    position: absolute; inset: 0; width: 100%; height: 100%;
    padding: 0; border: 0; background: none; cursor: pointer;
    font-size: 0; color: transparent;
  }
  .node.concept.video .playhit:focus-visible {
    outline: 2px solid var(--spark); outline-offset: -3px;
  }
  .node.concept.video .name {
    font-family: var(--serif); font-size: 0.95rem; font-weight: 400;
    letter-spacing: 0; text-transform: none; color: var(--ink);
    margin-top: 0.6rem;
  }
  .node.concept.video .name::before { display: none; }
  /* Somebody else's work, and the card says so at the same weight the
     specimen cards give a deposition's provenance. */
  .node.concept.video .prov {
    font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-top: 0.3rem;
  }
  .node.concept.video.hub .name { font-size: 1.5rem; }
  .node.concept.video.hub .prov { font-size: 0.7rem; margin-top: 0.5rem; }

  /* An opener with no picture to sit over needs a row of its own rather than
     absolute position against the whole card. */
  .node.concept .opens { margin: 0.65rem 0 0.1rem; }
  .node.concept .opens .lesson { position: static; }

  /* ---- the title card -------------------------------------------------
     Only for `?q=`. The question is known before any fetch, so the second the
     corpus and the embedding take can be spent READING it rather than looking
     at an empty canvas. It leaves on the later of "the graph is composed" and
     a beat long enough to finish the sentence. */
  /* Everything the reader does not need while a sentence is being read. One
     class, because the intro is a state of the PAGE and not of four widgets. */
  body.intro .mast,
  body.intro .composer,
  body.intro .legend,
  body.intro .hint { opacity: 0; pointer-events: none; }
  .mast, .composer, .legend, .hint { transition: opacity .8s ease; }
  /* A reader who has asked for less motion still gets the beat, just not the
     drift: the pause is the point, the glide is decoration. */
  @media (prefers-reduced-motion: reduce) {
    .mast, .composer, .legend, .hint { transition-duration: .01s; }
  }

  /* The user's question. Aka the Big Question Card. It is what the map
     opens on and what the camera pulls back from, so it carries the sentence at
     a size worth reading and nothing else.

     Paper rather than card, and no border: these are the reader's own words,
     not something the map holds. The fill is only there to mask the edges that
     pass behind it. */
  .node.question.asked {
    background: var(--paper);
    border: 0;
    width: 50rem;
    padding: 0.4rem 0.6rem;
    text-align: left;
    color: var(--ink);
  }
  .node.question.asked > span:first-child {
    display: block;
    font-family: var(--serif); font-size: 4.5rem; line-height: 1.2;
    letter-spacing: -0.015em;
  }
  .node.question.asked:hover { background: var(--paper); }
  .node.question.asked.hub > span:first-child { font-size: 2rem; line-height: 1.14; }

  /* A discovered edge is dashed, and an authored one is not. Both come off the
     same card, so the line is the only thing saying which is which. */
  path.nearline { stroke-dasharray: 5 5; opacity: 0.5; }

  /* ---- the lesson, over the map ---------------------------------------
     kit/modal.js owns opening, closing, focus and the Esc stack, and says the
     markup and the look are the page's. `.modal[hidden]` is the one rule it
     requires. A lesson is a PAGE rather than a readout, so this card is as
     large as the viewport allows and the iframe fills it — the sheet-of-paper
     modals in css/pathways.css are sized for a paragraph and a list. */
  .modal {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(0.75rem, 2.5vw, 2rem);
  }
  .modal[hidden] { display: none; }
  .modal .mback {
    position: absolute; inset: 0;
    background: rgba(20, 22, 26, 0.55);
    animation: mfade .2s ease-out;
  }
  .modal .mcard {
    position: relative;
    display: flex; flex-direction: column;
    width: min(1280px, 100%); height: min(860px, 100%);
    background: var(--card); border-radius: 6px; overflow: hidden;
    box-shadow: 0 30px 70px -24px rgba(0, 0, 0, .5);
    animation: mrise .24s cubic-bezier(.2, .9, .3, 1);
  }
  @keyframes mfade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes mrise { from { opacity: 0; transform: translateY(12px) scale(.99) }
                     to   { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) {
    .modal .mback, .modal .mcard { animation: none; }
  }
  .modal .mhead {
    flex: none; display: flex; align-items: center; gap: 1rem;
    padding: 0.7rem 0.6rem 0.7rem 1.1rem;
    border-bottom: 1px solid var(--line);
  }
  .modal .mhead > span:first-child {
    flex: 1;
    font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
  .modal .mclose {
    font-family: var(--sans); font-size: 1.35rem; line-height: 1;
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 0.2rem 0.5rem;
  }
  .modal .mclose:hover { color: var(--ink); }

  /* A VIDEO is 16:9 and a lesson is a sheet, so the card sizes to the content
     rather than the two sharing one box with the wrong shape for one of them.
     Black behind it: the letterbox belongs to the film, not to the paper. */
  .modal.video .mcard { background: #0e0f11; }
  .modal.video .mhead { border-bottom-color: rgba(255,255,255,.12); }
  .modal.video .mhead > span:first-child { color: #f2f0ea; }
  .modal.video .mclose { color: rgba(242,240,234,.6); }
  .modal.video .mclose:hover { color: #fff; }
  .modal.video .credit {
    font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(242,240,234,.55);
  }
  /* THE VIDEO SETS THE HEIGHT and the column scrolls inside it. `.mcues` has
     `overflow-y`, which zeroes its automatic minimum size, so 19 cues do not
     drag the card taller than the picture — and `max-height` is what stops a
     wide window from pushing the header off the top of the screen. */
  .modal.video .mcard { width: min(1400px, 100%); height: auto;
                        max-height: min(820px, 100%); }
  /* The column is ABSOLUTE so it cannot size the row. A row flex container
     takes its cross-axis height from the tallest item's content, and 19 cues
     are taller than the picture — which held the card at its max height with a
     band of dead black under the video. Out of flow, the video is the only
     thing left to measure, so the card hugs it and the cues scroll in the gap
     the margin leaves. */
  .modal.video .mbody { position: relative; flex: 1; min-height: 0;
                        overflow: hidden; }
  .modal.video .mvideo { margin-right: 24rem; }
  /* ---- our own player chrome -------------------------------------------
     `controls=0` takes YouTube's bar away, and on its own that is not enough:
     the title, the logo and the share button still fade in over the picture on
     hover, which is the covering-the-science problem again in another form. So
     the frame takes no pointer events at all and everything below is ours. The
     cost is real and paid on purpose: fullscreen and the native scrubber are
     gone, so we owe the reader a replacement for each. */
  .modal.video .mstage { position: relative; }
  .modal.video #videoframe, .modal.video #videoframe iframe { pointer-events: none; }
  .modal.video .mtap {
    position: absolute; inset: 0; width: 100%; height: 100%;
    padding: 0; border: 0; background: none; cursor: pointer;
  }
  /* A SCRIM, not a picture. Mid-video this stands in front of YouTube's
     paused overlay for the half second it takes to fade, and throwing the
     title card over a 0:41 scene would be its own wrong. `.first` is the
     pre-play state, where the poster IS the right image and the frame behind
     it has nothing in it yet. */
  .modal.video .mcover {
    position: absolute; inset: 0; pointer-events: none;
    background-color: rgba(14, 15, 17, .96);
    background-position: center; background-size: cover;
    background-repeat: no-repeat;
    opacity: 0; transition: opacity .18s ease;
  }
  .modal.video .mcover.first { background-color: #0e0f11; }
  .modal.video .mcard.covered .mcover { opacity: 1; }

  /* The paused mark, centred. Only while paused, so a playing video is picture
     and nothing else. */
  .modal.video .mbig {
    position: absolute; left: 50%; top: 50%; width: 3.4rem; height: 3.4rem;
    transform: translate(-50%, -50%); pointer-events: none;
    border-radius: 50%; background: rgba(14,15,17,.5);
    border: 1px solid rgba(255,255,255,.7);
    opacity: 0; transition: opacity .18s ease;
  }
  .modal.video .mbig::after {
    content: ''; position: absolute; left: 56%; top: 50%;
    transform: translate(-50%, -50%);
    border: 0.62rem solid transparent; border-left: 1rem solid #fff;
  }
  /* Only while the cover is up. After that YouTube draws its own glyph on a
     pause, and two play marks over one frame is worse than either. */
  .modal.video .mcard.covered .mbig { opacity: 1; }

  .modal.video .mctl {
    display: flex; align-items: center; gap: 0.7rem;
    padding: 0.55rem 0.9rem 0.7rem;
  }
  .modal.video .mctl button {
    flex: none; width: 1.1rem; height: 1.1rem; padding: 0;
    background: none; border: 0; cursor: pointer; position: relative;
  }
  .modal.video .mplay::before {
    content: ''; position: absolute; left: 2px; top: 50%;
    transform: translateY(-50%);
    border: 0.42rem solid transparent; border-left: 0.62rem solid rgba(242,240,234,.75);
  }
  /* Two bars, drawn from one element and its border, so pause needs no glyph. */
  .modal.video .mcard.playing .mplay::before {
    border: 0; width: 0.28rem; height: 0.82rem; left: 1px;
    background: rgba(242,240,234,.75);
    box-shadow: 0.42rem 0 0 rgba(242,240,234,.75);
  }
  .modal.video .mctl button:hover::before { border-left-color: #fff; background-color: #fff; }
  .modal.video .mfull::before {
    content: ''; position: absolute; inset: 2px;
    border: 1px solid rgba(242,240,234,.75); border-radius: 1px;
  }
  .modal.video .mfull:hover::before { border-color: #fff; }
  .modal.video .mtime {
    flex: none; font-family: var(--sans); font-size: 0.6rem;
    letter-spacing: 0.06em; color: rgba(242,240,234,.75);
    font-variant-numeric: tabular-nums;
  }
  .modal.video .mtime.dim { color: rgba(242,240,234,.4); }
  /* Padded above and below so the 2px line is a 14px hit target: a scrubber
     the reader has to aim at is one they will miss. */
  .modal.video .mbar {
    flex: 1; height: 2px; cursor: pointer;
    background: rgba(255,255,255,.16);
    border-top: 6px solid transparent; border-bottom: 6px solid transparent;
    background-clip: padding-box;
  }
  .modal.video .mbar i {
    display: block; height: 100%; width: 0; background: var(--spark);
  }

  /* `height: auto` is load-bearing: the IFrame API stamps width="640"
     height="360" ATTRIBUTES on the iframe it builds, and a presentational
     height beats `aspect-ratio` — the player came out 1030x356 in a box that
     wanted 1030x579. */
  #videoframe, #videoframe iframe {
    display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border: 0;
  }

  /* ---- the caption column ----------------------------------------------
     The reason this modal is not simply a 16:9 box. YouTube's own captions
     burn over the picture, and these videos PRINT their key terms on screen —
     the caption lands on top of the word it is explaining. So captions are off
     in the player and the text is here, beside it, where it can also be longer
     than a caption line and clickable. */
  .modal.video .mside {
    position: absolute; inset: 0 0 0 auto; width: 24rem;
    display: flex; flex-direction: column; min-height: 0;
    border-left: 1px solid rgba(255,255,255,.1);
  }
  /* TWO TRACKS, and which one is showing is a fact about whose words these
     are. The source under the switch is not decoration: the narration is the
     video author's writing carried across, and a column of it with no name on
     it reads as ours. */
  .modal.video .mtracks {
    flex: none; display: flex; align-items: center; gap: 0.35rem;
    padding: 0.7rem 1rem 0.6rem;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .modal.video .mtracks button {
    font-family: var(--sans); font-size: 0.55rem; letter-spacing: 0.14em;
    text-transform: uppercase; cursor: pointer;
    color: rgba(242,240,234,.45);
    background: none; border: 1px solid rgba(255,255,255,.14);
    border-radius: 3px; padding: 0.3rem 0.5rem;
    transition: color .15s, border-color .15s;
  }
  .modal.video .mtracks button:hover { color: rgba(242,240,234,.8); }
  .modal.video .mtracks button[aria-pressed="true"] {
    color: #f4f2ec; border-color: rgba(255,255,255,.45);
  }
  .modal.video .mtracks .src {
    margin-left: auto;
    font-family: var(--sans); font-size: 0.55rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(242,240,234,.35);
  }
  /* Underlined rather than coloured: the column is already two greys and a
     lit line, and a third colour here would read as another state. */
  .modal.video .mtracks .src a,
  .modal.video .credit a {
    color: inherit; text-decoration: underline;
    text-underline-offset: 2px; text-decoration-color: rgba(242,240,234,.3);
  }
  .modal.video .mtracks .src a:hover,
  .modal.video .credit a:hover { color: #f4f2ec; text-decoration-color: currentColor; }
  .modal.video .mcues {
    flex: 1; min-height: 0;
    margin: 0; padding: 0.6rem 0 1.2rem; list-style: none;
    overflow-y: auto; overscroll-behavior: contain;
  }
  /* SERIF, and larger than a caption. This column is the only running prose
     on the page a reader actually reads through, several sentences at a time
     against a dark ground — which is what Literata is for and what a 0.78rem
     system-ui was fighting. The timecode and the step number stay in `--sans`
     below: those are labels, not prose. */
  .modal.video .mcues li {
    display: flex; gap: 0.7rem; align-items: baseline;
    padding: 0.6rem 1.1rem; cursor: pointer;
    color: rgba(242,240,234,.45);
    font-family: var(--serif); font-size: 0.95rem; line-height: 1.6;
    transition: color .18s ease;
  }
  .modal.video .mcues li:hover { color: rgba(242,240,234,.72); }
  /* The lit line is the only one at full strength, so the column can be read
     at a glance without hunting for where the video is. */
  .modal.video .mcues li.on { color: #f4f2ec; }
  .modal.video .mcues li.on .at { color: var(--spark); }
  .modal.video .mcues .at {
    flex: none; width: 2.4rem;
    font-family: var(--sans); font-size: 0.62rem; letter-spacing: 0.06em;
    color: rgba(242,240,234,.35);
  }
  /* A step number ties the line to the lesson's own ten, which is the same
     numbering glycolysis-lab teaches. */
  .modal.video .mcues .st {
    flex: none; font-family: var(--sans); font-size: 0.55rem;
    letter-spacing: 0.1em; color: rgba(242,240,234,.3);
  }
  /* Narrow: the column goes back into flow, under the video. */
  @media (max-width: 900px) {
    .modal.video .mbody { display: flex; flex-direction: column;
                          overflow-y: auto; }
    .modal.video .mvideo { margin-right: 0; }
    .modal.video .mside { position: static; width: auto; flex: 1 1 auto;
                          border-left: 0;
                          border-top: 1px solid rgba(255,255,255,.1); }
  }
  /* The lesson brings its own scrolling and its own chrome, so the frame is
     the whole card below the head and carries no border of its own. */
  #lessonframe { flex: 1; width: 100%; border: 0; display: block; }

</style>
</head>
<body>

<header class="mast">
  <a class="logo" href="../index.html">kodo<em>lab</em><span class="dot">.</span></a>
  <span class="title"></span>
  <span class="spacer"></span>
  <button class="btn" id="reset">Start over</button>
</header>

<div class="composer">
  <input id="ask" type="text" autocomplete="off" spellcheck="false"
         placeholder="Why does ice float?">
  <ul class="hits" id="hits"></ul>
</div>

<script>
  /* Inline and immediate: `?q=` means the map opens on a question rather than a
     door, and the chrome has to be gone before the first paint or it flashes in
     and out. The card itself is drawn by the composer block below. */
  (function () {
    if (new URLSearchParams(location.search).get('q')) document.body.classList.add('intro');
  })();
</script>

<div id="canvas">
  <div id="world"><svg id="edges"></svg></div>
</div>

<!-- The lesson, full size, over the map. Markup and look are the page's and
     the behaviour is kit/modal.js's — focus return, the Esc stack, the trap.
     The iframe is EMPTY until it opens and emptied on close: a lesson is a
     WebGL context and about a megabyte of trajectory, and neither should be
     paid by a reader who never opened it. -->
<div id="lessonmodal" class="modal" hidden>
  <div class="mback"></div>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="lessontitle">
    <div class="mhead">
      <span id="lessontitle">the lesson</span>
      <button class="mclose" aria-label="Close">&times;</button>
    </div>
    <iframe id="lessonframe" title="lesson" allow="fullscreen"></iframe>
  </div>
</div>

<!-- The video, over the map. A SECOND modal rather than the lesson's with a
     different src: the two share nothing but the word "opens". A lesson is a
     page we own, sized as a sheet, carrying its own chrome; a video is 16:9,
     somebody else's, and its header has to say whose. kit/modal.js stacks
     them, which is what it was built for. -->
<div id="videomodal" class="modal video" hidden>
  <div class="mback"></div>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="videotitle">
    <div class="mhead">
      <span id="videotitle">the video</span>
      <span id="videocredit" class="credit"></span>
      <button class="mclose" aria-label="Close">&times;</button>
    </div>
    <div class="mbody">
      <!-- A PLACEHOLDER, not the player. YouTube's IFrame API replaces this
           node with its own iframe, and destroying the player takes that
           iframe with it — which is what stops playback and ends the
           third-party connection when the card closes. `mount()` puts a fresh
           placeholder back. With no API (offline, blocked), `plain()` writes a
           bare iframe here instead and the column simply does not follow. -->
      <div class="mvideo">
        <div class="mstage">
          <div id="videoframe"></div>
          <!-- A PAUSED player draws YouTube's own overlay: title, avatar,
               "More videos", logo. pointer-events stops the HOVER chrome and
               not that one, so the poster covers the frame whenever the video
               is not running. It doubles as the loading state. -->
          <div class="mcover"></div>
          <!-- OUR click target. The frame below it is pointer-events:none, so
               YouTube's hover chrome never appears over the picture; this is
               what gives the click back. -->
          <button type="button" class="mtap" id="videotap" aria-label="Play or pause"></button>
          <span class="mbig" aria-hidden="true"></span>
        </div>
        <div class="mctl">
          <button type="button" class="mplay" id="videoplay" aria-label="Play"></button>
          <span class="mtime" id="videotime">0:00</span>
          <div class="mbar" id="videobar"><i></i></div>
          <span class="mtime dim" id="videodur">0:00</span>
          <button type="button" class="mfull" id="videofull" aria-label="Fullscreen"></button>
        </div>
      </div>
      <div class="mside">
        <div class="mtracks" id="videotracks"></div>
        <ol class="mcues" id="videocues"></ol>
      </div>
    </div>
  </div>
</div>

<div class="legend">
  <span id="fps">— fps</span>
  <span><i class="b"></i>built</span>
  <span><i class="e"></i>engine, no lesson</span>
  <span><i class="p"></i>planned</span>
</div>
<div class="hint" id="hint">k 0.00 · region</div>   <!-- readout while the bands are being tuned -->

<div id="full" aria-modal="true" role="dialog">
  <button class="x" id="fullClose" title="Close" aria-label="Close">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
      <path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>
  <p class="lede" id="fullLede"></p>
  <div class="stage">image</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../lib/palette.js"></script>
<script src="../lib/tokens-from-palette.js"></script>
<script src="../lib/molecules.js"></script>
<script src="../lib/skel.js"></script>          <!-- mol-pathways builds glucose with it -->
<script src="../lib/mol-solvation.js"></script>
<!-- The two ANGSTROM-family domains, for one spec each: popc on the bilayer card
     and glucose on the glycolysis one. mol-solvation above is the display-scale
     family, and the rule is one family per SCENE (MolecularGeometry.md §1.5) —
     these never share one, since every card is its own stage with its own
     camera and no size here is ever read against a size from the other family.
     This comment is the enforcement; no checker can see which scene a spec
     lands in. mol-pathways costs 17 specs to draw one, which is the price of
     the glycolysis card. -->
<script src="../lib/mol-lipids.js"></script>
<script src="../lib/mol-pathways.js"></script>
<script src="../lib/scene.js"></script>
<script src="../lib/fx.js"></script>
<script src="../lib/atomkit.js"></script>
<script src="../lib/covalent-drag.js"></script>
<script src="../lib/ionic-drag.js"></script>
<script src="../water/watersim.js"></script>
<script src="../proteins/proteins.js"></script>   <!-- PLACEMENTS' p: rows resolve their keys here -->
<script src="../lib/mapcontent.js"></script>   <!-- DOORS, CONCEPTS, QUESTIONS, CONTENT, PLACEMENTS -->
<script src="../kit/modal.js"></script>
<script src="../kit/card-stage.js"></script>
<script src="../kit/molbox.js"></script>
<script src="../molecule-builder/molecule-builder.js"></script>
<script src="../kit/ribbon.js"></script>   <!-- protein cards: RibbonLib -->
<script src="../kit/proteinbox.js"></script>   <!-- ...after every library it reads -->
<script src="../kit/surface.js"></script>   <!-- ...and SurfLib, on demand -->
<script src="../hemoglobin/hbfold.js"></script>    <!-- ...and the fold, on demand -->
<script src="../hemoglobin/foldplay.js"></script>  <!-- the ss-from-bonds rule, shared with hemoglobin-lab -->
<script>
/* ---- the content ------------------------------------------------------
   DOORS, CONCEPTS, QUESTIONS, CONTENT and PLACEMENTS all live in lib/mapcontent.js now, so
   they can be edited somewhere better than an HTML file — map-cms.html reads
   and writes that file through the dev server. What is left in this page is
   what DRAWS them, which is the only thing a page should hold.

   QUESTIONS is question-major: one row per question, carrying the rank it has
   on each concept it names. The map is bipartite and a question is the CROSSING,
   so it has to be one node however many concepts name it; concept-major, the same
   text appeared once per concept and a re-wording in one of them split that node
   in two. `mapcontent.js`'s header has the argument. */

const { DOORS, CONCEPTS, QUESTIONS, CONTENT, PLACEMENTS } = MapContent;

/* ---- content, resolved ------------------------------------------------
   PLACEMENTS is content-major — one row per unit, carrying the rank it has on
   each concept. The page needs it both ways round: by content id, to build the
   video and specimen cards, and by concept, to ask a card what it shows. Both
   indexes are built once here rather than by scanning the table at each card,
   which is what keeps a reveal free of work proportional to the whole map. */
const BY_ID = new Map(CONTENT.map(c => [c.id, c]));
const PLACED = new Map(PLACEMENTS.map(([id, ranks, opt]) => [id, { ranks, opt }]));
/* concept id -> [{ item, rank }], best rank first. A card mounts ONE inline
   box, so the sort is what decides which — not table order, which would make
   it an accident of authoring. */
const ON_CONCEPT = new Map();
for (const [id, { ranks }] of PLACED) {
  const item = BY_ID.get(id);
  if (!item) continue;                 // `p:` rows resolve from the registry
  for (const [cid, rank] of Object.entries(ranks || {})) {
    if (!ON_CONCEPT.has(cid)) ON_CONCEPT.set(cid, []);
    ON_CONCEPT.get(cid).push({ item, rank });
  }
}
for (const list of ON_CONCEPT.values()) list.sort((a, b) => a.rank - b.rank);

const INLINE = { water: 1, build: 1, molbox: 1, protein: 1 };
/* Node kinds that are a CARD: same frame, same controls gate, same search
   index, whatever each one holds. A specimen and a video are cards that ARE
   content; a concept is a card that shows some. */
const CARDKIND = { concept: 1, protein: 1, video: 1 };
/* Content a card OPENS rather than draws. A lesson is a button under the
   thumb; a video is its own card, so it is not here. */
const BUTTON = { lesson: 1 };
const DOOR = DOORS.find(d => d.open) || DOORS[0];

/* ---- graph ------------------------------------------------------------
   Bipartite, like the concept map: concepts never link to concepts. A question
   node is shared by every concept that answers it, so the question IS the
   crossing — from Hydrogen bonding to Base pairing, and with it from the
   water door to the information door. */

const world = document.getElementById('world');
const svg = document.getElementById('edges');
const NS = 'http://www.w3.org/2000/svg';

const nodes = [], links = [], byId = {};
let live = [], liveLinks = [];

const door = { id: 'door', kind: 'door', text: DOOR.question, meta: DOOR.label, deg: 0 };
byId.door = door;
nodes.push(door);

for (const m of CONCEPTS) {
  const n = { ...m, kind: 'concept', deg: 0 };
  byId[m.id] = n;
  nodes.push(n);
  if (m.door === DOOR.id) links.push({ a: door, b: n, rank: m.rank });
}

/* PROTEIN SPECIMENS — a protein is a LEAF: it hangs off concepts and off questions and
   never off another leaf, which is what keeps the map layered even though a
   concept may now reach one directly, with no question between.

   THE REGISTRY IS THE LIST. Every protein in proteins/proteins.js gets a node;
   a `p:` PLACEMENT only says where one SITS, and which variant it sits as. So adding
   a protein is a one-file edit, and a protein nobody has placed yet still has a
   home — its own door — rather than being invisible until someone remembers a
   second table exists.

   What it IS comes from the registry and is never restated here; only the
   chosen variant's baked trace is resolved, because a card draws one structure
   and the registry already says which. */
const SPEC = (window.ProteinLib && window.ProteinLib.PROTEINS) || [];
for (const id of PLACED.keys())
  if (id.startsWith('p:') && !SPEC.some(p => 'p:' + p.key === id))
    console.warn(`[composer] PLACEMENTS names no such protein \`${id}\``);

for (const p of SPEC) {
  const { ranks = {}, opt } = PLACED.get('p:' + p.key) || {};
  const v = (opt && opt.variant && p.variants.find(x => x.id === opt.variant))
    || p.variants.find(x => x.default) || p.variants[0];
  if (opt && opt.variant && (!v || v.id !== opt.variant))
    console.warn(`[composer] ${p.key}: no variant \`${opt.variant}\``);
  /* A specimen card is a RIBBON. A `bake` block names roles and is
     authoritative when present (2HBS has no `trace` in it and no ribbon
     exists); without one, the protein is on the shared trace pipeline and
     `read.baked` is that trace. Same rule kit/proteinbox.js applies. Every
     entry is expected to have one now, so a miss is an authoring fault and
     says so rather than vanishing from the map. */
  const ribbon = v && (v.bake ? v.bake.trace : v.read && v.read.baked);
  if (!ribbon) { console.warn(`[composer] ${p.key}/${v ? v.id : '?'}: no baked ribbon`); continue; }
  /* NO PATHS HERE. The map decides WHICH specimen and WHICH variant; every
     file behind that pair is named by role in proteins/proteins.js, and
     kit/proteinbox.js reads it for itself. A page that resolved
     `2HHB.card.surf.bin` would be a second place that has to be right.

     What IS read here is what the card PRINTS — method, residues, species, the
     EC class — because that is copy on a card and not a file to fetch. Every
     number of it comes from `read`, which the baker rewrites from the
     deposition, so a re-bake cannot leave the card claiming a count the file
     no longer has. */
  const ec = v.read.ec || null;
  const cls = ec ? (ProteinLib.EC_CLASS || [])[Number(ec.split('.')[0])] : null;
  const n = {
    id: 'p:' + p.key, kind: 'protein', deg: 0,
    name: p.name, claim: p.blurb, does: p.does,
    protein: p.key, variant: v.id,
    purpose: v.purpose, species: v.species,
    method: v.read.method, residues: v.read.residues, declared: v.read.declared,
    ec, ecClass: cls ? cls[0] : null, ecDoes: cls ? cls[1] : null,
  };
  const edges = [];
  for (const [cid, rank] of Object.entries(ranks)) {
    const m = byId[cid];
    if (!m) continue;
    edges.push({ a: m, b: n, rank });
    n.deg++; m.deg++;
  }
  /* UNPLACED FALLS TO ITS DOOR, at the back rank: a protein nobody has filed
     under a concept belongs to the Proteins question and nowhere else, and the
     map draws one door at a time — so it appears there and never clutters
     Water. Placed elsewhere, it reaches this door through its concepts. */
  if (!edges.length) {
    if (DOOR.id !== 'proteins') continue;   // its door isn't the one on screen
    edges.push({ a: door, b: n, rank: 3 });
    n.deg++; door.deg++;
  }
  byId[n.id] = n;
  nodes.push(n);
  links.push(...edges);
}

/* VIDEO — a card of its own, hanging off the concepts that placed it, exactly
   as a specimen does. A leaf: it never links to another leaf.

   It gets a card rather than a chip on someone else's because a video HAS a
   card's worth of content — a poster, a title, and somebody else's name, which
   is not optional. Costs no WebGL context, so unlike an inline box the map can
   hold as many as it is given. */
for (const c of CONTENT) {
  if (c.kind !== 'video') continue;
  const { ranks = {} } = PLACED.get(c.id) || {};
  const n = { ...c, kind: 'video', deg: 0 };
  const edges = [];
  for (const [cid, rank] of Object.entries(ranks)) {
    const m = byId[cid];
    if (!m) continue;                    // a concept the map does not draw yet
    edges.push({ a: m, b: n, rank });
    n.deg++; m.deg++;
  }
  if (!edges.length) continue;           // placed nowhere the map can reach
  byId[n.id] = n;
  nodes.push(n);
  links.push(...edges);
}

/* One node per question, however many concepts name it — which is what makes a
   question the crossing rather than a leaf on each card. The row already IS one
   per question, so nothing here has to dedupe by text any more. */
for (const [text, ranks] of QUESTIONS) {
  const q = { id: 'q' + nodes.length, kind: 'question', text, deg: 0 };
  byId[q.id] = q;
  nodes.push(q);
  for (const [cid, rank] of Object.entries(ranks)) {
    const m = byId[cid];
    if (!m) continue;              // a concept the map does not draw yet
    links.push({ a: m, b: q, rank });
    q.deg++; m.deg++;
  }
}

const neighbours = n => links.flatMap(l => l.a === n ? [l.b] : l.b === n ? [l.a] : []);

// Browsing beats ranking. A question that is rank 2 or 3 everywhere would never
// open a card, and could only be met by wandering in from a concept that happens
// to name it — so it is promoted to rank 1 on the card that ranks it best. It
// still reads as depth wherever it IS depth; it just gets one card that owns it.
for (const n of nodes) {
  if (n.kind !== 'question') continue;
  const mine = links.filter(l => l.a === n || l.b === n);
  const best = Math.min(...mine.map(l => l.rank));
  if (best > 1) for (const l of mine) if (l.rank === best) l.rank = 1;
}
// the rank of `other` as seen from `from` — a question's rank belongs to the
// edge, not to the question, which is the whole point of the per-concept ranks
const rankFrom = (from, other) => {
  const l = links.find(l => (l.a === from && l.b === other) || (l.b === from && l.a === other));
  return l ? l.rank : 2;
};

/* ---- what a card has to show -------------------------------------------
   `CONTENT` and `PLACEMENTS` are in lib/mapcontent.js with the rest of the
   content: the units a concept can show, and where each one sits. Four INLINE
   kinds, and the page knows how to build each one:

     water  — card-stage.js + water/watersim.js.
     build  — molecule-builder.js, which brings its own ORTHOGRAPHIC stage.
     molbox — kit/molbox.js: one spec, solved into the box, turning.

   A concept with no entry grows no picture box: the empty rectangle was the
   reader's problem to interpret, and its absence says the same thing better. There was a fourth kind, `mol`: one
   built spec on a turntable. It is gone, and nothing replaced it, because it
   was two mistakes at once. It solved its camera at create and never again, so
   a card re-framed for its opening size kept that frame (measured: ethanol
   wants r 6.00 in the thumb and 6.48 open, and would have stayed at 6.00
   forever) — kit/molbox.js does the same job and re-solves on every resize. And
   it was PERSPECTIVE, where Stage.frame floors the distance at 6, so every
   molecule smaller than that floor sat at 49-57% of its frame with no way to
   fill it. The builder answers both by being what it already is: orthographic,
   and about the electrons rather than about a shape turning. */

/* ---- a protein card ------------------------------------------------------
   kit/proteinbox.js owns the molecule and the two questions a reader can ask
   of it (the surface, the fold). This owns what belongs to the MAP: which
   files a concept names, and the button that opens the lesson behind it. */

/* The lesson behind a card, opened over the map. `src` is set on show and
   cleared on hide, so the lesson's context and its megabyte of trajectory
   belong to the moment it is open and to no other. */
const lessonFrame = document.getElementById('lessonframe');
const lessonTitle = document.getElementById('lessontitle');
const lessonModal = Modal.create({
  el: 'lessonmodal',
  onShow: c => {
    lessonTitle.textContent = c.name || 'the lesson';
    lessonFrame.src = '../' + c.href;
  },
  onHide: () => { lessonFrame.src = 'about:blank'; },
});

/* ---- the video, over the map -----------------------------------------
   youtube-nocookie, and the parameters are built here rather than authored in
   mapcontent.js: the table holds the video's ID, which is the fact, and every
   option below is this page's decision about how a card plays one.

     cc_load_policy 0 — THE POINT OF THE COLUMN. These videos print their key
                        terms on the picture, and a burned-in caption lands on
                        top of the word it is explaining. The param is the
                        documented way to ask; a reader whose account defaults
                        captions on can still override it, which is what
                        `unloadModule` on ready is for.
     rel 0            — the end screen offers more of this channel rather than
                        the whole of YouTube. A map is not a place to be
                        recommended out of.
     modestbranding 1 — the card already says whose work it is.
     autoplay 1       — the reader clicked play. */
const YT_VARS = {
  rel: 0, modestbranding: 1, autoplay: 1, playsinline: 1,
  cc_load_policy: 0, iv_load_policy: 3,
  /* No YouTube bar. The strip under the picture is ours, and the frame takes
     no pointer events, so the title and logo never fade in over the animation
     either. `plain()` keeps the native controls, because with no API there is
     nothing to drive a replacement with. */
  controls: 0,
};
const ytSrc = (id, api) =>
  'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?' +
  new URLSearchParams({ ...YT_VARS, ...(api ? { enablejsapi: 1, origin: location.origin } : {}) });

/* The API is loaded ON FIRST OPEN and never before: it is a third-party script,
   and a map nobody has opened a video on should not have fetched one. Resolves
   to null rather than throwing when it cannot load — offline, blocked, no
   network — and the caller falls back to a plain iframe. */
let ytReady = null;
function loadYT() {
  if (ytReady) return ytReady;
  ytReady = new Promise(resolve => {
    if (window.YT && window.YT.Player) return resolve(window.YT);
    const t = setTimeout(() => resolve(null), 6000);
    window.onYouTubeIframeAPIReady = () => { clearTimeout(t); resolve(window.YT); };
    const el = document.createElement('script');
    el.src = 'https://www.youtube.com/iframe_api';
    el.onerror = () => { clearTimeout(t); resolve(null); };
    document.head.appendChild(el);
  });
  return ytReady;
}

const cueList = document.getElementById('videocues');
const trackBar = document.getElementById('videotracks');
let player = null, tracks = [], cues = [], cueEls = [], lit = -1, ticker = 0;

/* Which track the reader last chose, kept for the session only. A default that
   followed them across visits would need storage this page does not otherwise
   touch, and the default matters more than the memory: the video's OWN words
   are what a reader watching somebody else's video should get first. */
let trackPref = 'narration';


const mmss = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');

function renderCues() {
  cueList.textContent = ''; cueEls = []; lit = -1;
  for (const q of cues) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="at">' + mmss(q.t) + '</span>' +
                   '<span class="tx">' + esc(q.text) + '</span>' +
                   (q.step ? '<span class="st">' + q.step + '</span>' : '');
    // Reading ahead is what the column is for, so a line is a seek target.
    li.addEventListener('click', () => {
      if (player && player.seekTo) { player.seekTo(q.t, true); player.playVideo(); }
    });
    cueList.appendChild(li);
    cueEls.push(li);
  }
  // Straight back to where the video is, so switching track never loses the
  // place. Instant rather than smooth: the list was just rebuilt, and animating
  // a scroll from the top of a list the reader never saw is motion for nothing.
  if (player && player.getCurrentTime) {
    litAt(player.getCurrentTime());
    if (cueEls[lit]) cueEls[lit].scrollIntoView({ block: 'nearest' });
  }
}

function pickTrack(id) {
  const t = tracks.find(x => x.id === id) || tracks[0];
  if (!t) return;
  trackPref = t.id;
  cues = t.cues || [];
  for (const b of trackBar.querySelectorAll('button'))
    b.setAttribute('aria-pressed', String(b.dataset.track === t.id));
  const src = trackBar.querySelector('.src');
  if (src) src.innerHTML = t.sourceUrl
    ? '<a href="' + esc(t.sourceUrl) + '" target="_blank" rel="noopener noreferrer">'
      + esc(t.source || '') + '</a>'
    : esc(t.source || '');
  renderCues();
}

/* TWO TRACKS, and the default is the video's own. The narration is the film's
   author writing about their own film, and a reader watching somebody else's
   work should hear it in their words; ours is the same beats rewritten for a
   Bio 101 reader, which is a summary and says so. The switch is only drawn
   when there is more than one, so a single-track video shows no chrome. */
function renderTracks() {
  trackBar.textContent = '';
  trackBar.hidden = tracks.length < 2;
  if (trackBar.hidden) return;
  for (const t of tracks) {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.track = t.id;
    b.textContent = t.label || t.id;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => pickTrack(t.id));
    trackBar.appendChild(b);
  }
  const src = document.createElement('span');
  src.className = 'src';
  trackBar.appendChild(src);
}

/* Fetched per open and not cached: a video is opened once in a session far
   more often than twice, and the file is a couple of KB. An empty column is a
   fine failure — the video still plays. */
async function loadCues(c) {
  tracks = []; cues = []; cueEls = []; lit = -1;
  cueList.textContent = ''; trackBar.textContent = ''; trackBar.hidden = true;
  if (!c.captions) return;
  try {
    const doc = await fetch('../' + c.captions).then(r => r.json());
    tracks = doc.tracks || [];
  } catch (e) { return; }
  renderTracks();
  pickTrack(trackPref);
}

/* Which line is now. Linear from the last one rather than a search over all of
   them: playback moves forward, and a seek is the only jump. */
function litAt(t) {
  let i = cues.length - 1;
  while (i > 0 && cues[i].t > t) i--;
  if (i === lit) return;
  if (cueEls[lit]) cueEls[lit].classList.remove('on');
  lit = i;
  const el = cueEls[i];
  if (!el) return;
  el.classList.add('on');
  /* nearest, so following the video never yanks the column while the reader is
     scrolled somewhere else on purpose. */
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* No API: the video still plays and the column still reads, it just does not
   follow. Better than no video. */
function plain(c) {
  /* Native controls come back with the player, so ours would be a second set
     that does nothing. */
  const strip = document.querySelector('.mctl');
  if (strip) strip.hidden = true;
  const box = document.querySelector('.mstage');
  box.innerHTML = '';
  const f = document.createElement('iframe');
  f.id = 'videoframe';
  f.title = 'video';
  f.allow = 'autoplay; encrypted-media; picture-in-picture';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.src = ytSrc(c.src, false).replace('controls=0', 'controls=1');
  box.appendChild(f);
}

/* WHERE THE CAPTIONS ACTUALLY GO OFF, and the whole reason the cue column can
   exist. `cc_load_policy=0` only ASKS: a reader whose YouTube account defaults
   captions on gets them anyway, and these videos print their key terms on the
   picture, so the burned-in line lands on top of the word it is explaining.

   Two calls because neither is documented and only their combination was
   observed to clear the render. The getters keep reporting a live track
   afterwards, so `getOption` cannot be used to check the result — the picture
   is the only test. Retried on a delay as well as on the module event: the
   module can load after the event that announced the last one. */
function killCaptions(p) {
  const go = () => {
    try { p.setOption('captions', 'track', {}); } catch (e) {}
    for (const m of ['captions', 'cc']) { try { p.unloadModule(m); } catch (e) {} }
  };
  go();
  setTimeout(go, 1200);
}

/* ---- our own transport -----------------------------------------------
   Every one of these exists because `controls=0` took YouTube's away. The
   modal card carries `playing` / `paused` so the CSS can draw the state in two
   places at once (the strip's button and the big centre mark) from one fact. */
const vCard = () => document.querySelector('#videomodal .mcard');
const vPlay = document.getElementById('videoplay');
const vTap  = document.getElementById('videotap');
const vBar  = document.getElementById('videobar');
const vFill = vBar.querySelector('i');
const vTime = document.getElementById('videotime');
const vDur  = document.getElementById('videodur');

function setPlaying(on) {
  const card = vCard();
  if (!card) return;
  card.classList.toggle('playing', on);
  card.classList.toggle('paused', !on);
  vPlay.setAttribute('aria-label', on ? 'Pause' : 'Play');
}

/* THE COVER IS THE PRE-PLAY STATE ONLY, and that limit is a measured result
   rather than a preference.

   YouTube draws its own overlay — big glyph, title, avatar, "More videos",
   logo — on every pause AND every seek, and it does not fade on a timer we can
   wait out: measured at +0.5s, +2s and +8s after a resume, it was still up at
   two and gone by eight. Covering it would mean hiding several seconds of the
   film every time the reader touches a cue, which costs more than the chrome.

   So the cover does the one job it can do cleanly: it hides the player's
   start-up, where there is nothing behind it worth seeing anyway. Once the
   picture has moved it never comes back, and a pause shows YouTube's own UI,
   which is what a paused embed looks like. */
function setCovered(on) {
  const card = vCard();
  if (card) card.classList.toggle('covered', on);
}

function toggle() {
  if (!player || !player.getPlayerState) return;
  const YT = window.YT;
  if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
}
vPlay.addEventListener('click', toggle);
vTap.addEventListener('click', toggle);

/* Seek from anywhere on the track, including the transparent padding that
   makes a 2px line catchable. */
vBar.addEventListener('click', e => {
  if (!player || !player.getDuration) return;
  const r = vBar.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  player.seekTo(f * player.getDuration(), true);
  player.playVideo();
});

/* Ours, because the native button went with the rest of the chrome. The iframe
   itself is what goes fullscreen, so the strip and the column stay behind. */
document.getElementById('videofull').addEventListener('click', () => {
  const f = player && player.getIframe && player.getIframe();
  if (f && f.requestFullscreen) f.requestFullscreen();
});

function paintTime() {
  if (!player || !player.getCurrentTime) return;
  const t = player.getCurrentTime(), d = player.getDuration() || 0;
  vTime.textContent = mmss(t);
  vDur.textContent = mmss(d);
  vFill.style.width = d ? (t / d * 100) + '%' : '0';
  /* Lifted by the PICTURE moving rather than by the player reporting PLAYING,
     which it does while its start-up card is still on screen. */
  if (t >= 0.55) {
    setCovered(false);
    // The poster has done its job once the video is running; every later
    // cover is a scrim over a frame the reader has already seen.
    const cv = document.querySelector('.mcover');
    if (cv && cv.classList.contains('first')) {
      cv.classList.remove('first');
      cv.style.backgroundImage = '';
    }
  }
  litAt(t);
}

function mount(c) {
  loadYT().then(YT => {
    if (!videoModal.isOpen()) return;          // closed while the script loaded
    if (!YT) return plain(c);
    player = new YT.Player('videoframe', {
      /* The API builds its iframe against www.youtube.com unless told
         otherwise, which would quietly undo the nocookie host `plain()` uses. */
      host: 'https://www.youtube-nocookie.com',
      videoId: c.src,
      playerVars: YT_VARS,
      events: {
        onReady: e => { killCaptions(e.target); e.target.playVideo(); },
        // Fires whenever a module loads, which is the only moment the
        // captions one can be taken away. It can fire more than once, and
        // killCaptions is safe to repeat.
        onApiChange: e => killCaptions(e.target),
        onStateChange: e => {
          clearInterval(ticker);
          /* BUFFERING is not PAUSED. YouTube fires it after PLAYING and again
             on every seek, and treating it as a stop threw the poster over a
             running video for as long as the buffer took. The state is left
             exactly as it was and the ticker stops, which is all buffering
             actually means here. */
          if (e.data === YT.PlayerState.BUFFERING) return;
          setPlaying(e.data === YT.PlayerState.PLAYING);
          /* THE END SCREEN IS THE LAST PIECE OF CHROME. `rel=0` narrows it to
             this channel but does not remove it, and a grid of thumbnails over
             the final frame is exactly what the reader came here to get away
             from. Rewinding to the start puts frame 0 back and never lets it
             draw. */
          if (e.data === YT.PlayerState.ENDED) {
            e.target.seekTo(0, true);
            e.target.pauseVideo();
            paintTime();
            return;
          }
          if (e.data !== YT.PlayerState.PLAYING) { paintTime(); return; }
          ticker = setInterval(paintTime, 250);
        },
      },
    });
  });
}

const videoModal = Modal.create({
  el: 'videomodal',
  onShow: c => {
    document.getElementById('videotitle').textContent = c.name;
    /* A link in the MODAL and plain text on the card. On the card, every click
       is the map's — zoom, drag, or open the video — and one that leaves the
       site would be competing with all three. Here the reader has already
       watched it, and going to find more is the reasonable next thing. */
    const credit = document.getElementById('videocredit');
    const label = esc(c.credit) + (c.year ? ' · ' + esc(String(c.year)) : '');
    credit.innerHTML = c.creditUrl
      ? '<a href="' + esc(c.creditUrl) + '" target="_blank" rel="noopener noreferrer">'
        + label + '</a>'
      : label;
    const cover = document.querySelector('.mcover');
    if (cover) {
      cover.classList.add('first');
      cover.style.backgroundImage = 'url("../' + c.poster + '")';
    }
    setPlaying(false);
    setCovered(true);             // and stays up until the picture moves
    loadCues(c);
    mount(c);
  },
  /* DESTROYING the player is what stops it. A hidden iframe keeps playing and
     keeps talking to YouTube, so closing the card has to end both — and the
     placeholder has to come back, because destroy() takes the node with it. */
  onHide: () => {
    clearInterval(ticker); ticker = 0;
    if (player && player.destroy) player.destroy();
    player = null; lit = -1;
    setPlaying(false);
    setCovered(true);
    vFill.style.width = '0'; vTime.textContent = '0:00'; vDur.textContent = '0:00';
    /* destroy() takes the iframe with it, so the STAGE is rebuilt — the frame
       placeholder, our click target and the paused mark. Only the stage: the
       strip below has live listeners bound to its nodes, and rebuilding
       `.mvideo` would silently drop every one of them. */
    const stage = document.querySelector('.mstage');
    if (stage) stage.innerHTML =
      '<div id="videoframe"></div>' +
      '<div class="mcover"></div>' +
      '<button type="button" class="mtap" id="videotap" aria-label="Play or pause"></button>' +
      '<span class="mbig" aria-hidden="true"></span>';
    document.getElementById('videotap').addEventListener('click', toggle);
    const strip = document.querySelector('.mctl');
    if (strip) strip.hidden = false;
  },
});

function protein(thumb, view) {
  /* Two callers, one box. A SPECIMEN names a protein and lets the registry
     answer; an `r:` content item names files directly, because the ones it
     draws (a chain-B fold, a lesson-tier surface) have no role in the registry.
     `base` is this page's own fact: paths are repo-relative and tests/ is a
     directory down. */
  const box = Proteinbox.create(view.protein
    ? { mount: thumb, base: '../', protein: view.protein, variant: view.variant }
    : { mount: thumb,
        trace: '../' + view.trace,
        chains: view.chains,
        surface: view.surface ? '../' + view.surface : null,
        fold: view.fold ? '../' + view.fold : null });

  return box;
}

/* Four, and the number is card-stage.js's rather than this page's: browsers cap
   WebGL contexts near 8-16 and drop the OLDEST with no error, so on a map that
   can reveal twenty cards the one that blanks is the one the reader opened
   first. onEvict fires while the box is still live, which is the only moment a
   still can be taken. */
const stages = CardStage.pool({
  limit: 4,
  onEvict: (id, box) => {
    const n = byId[id];
    if (!n || !n.el) return;
    const thumb = n.el.querySelector('.thumb');
    if (!thumb) return;
    const png = box.snapshot ? box.snapshot() : null;
    thumb.classList.remove('mounted');
    if (!png) return;
    const img = document.createElement('img');
    img.className = 'still'; img.alt = ''; img.src = png;
    thumb.appendChild(img);
    thumb.classList.add('mounted');
  },
});

/* A card's canvas measures its UNZOOMED layout box, so at k = 2.5 it is drawing
   2.5x fewer pixels than the screen shows — the picture goes soft exactly where
   the text now stays sharp. So the device ratio carries the zoom: the renderer
   is asked for dpr * k, capped at 3 because the cost is that number SQUARED and
   a 280px thumb at 3 is already 840px of buffer.
   Idle only. Re-sizing a drawing buffer reallocates it, which is not a thing to
   do on a wheel frame, and the reader cannot judge sharpness mid-zoom anyway. */
const DENSITY_CAP = 3;
let densityTimer = 0;
function reDensify() {
  const px = Math.min(devicePixelRatio * view.k, DENSITY_CAP);
  for (const id of stages.keys()) {
    const box = stages.get(id);
    const stage = box && box.stage;
    if (!stage || !stage.renderer) continue;
    if (stage.renderer.getPixelRatio() === px) continue;
    stage.renderer.setPixelRatio(px);
    stage.resize();
    if (box.draw) box.draw(); else if (box.pump) box.pump(0);
  }
}
/* The cards go quiet while the map is being MOVED. Four live stages is a water
   sim stepping its physics and a renderer drawing, per card, per frame — which
   is the budget the pan is asking for at the same moment. A paused box keeps
   its last frame on screen (kit/card-stage.js's whole bargain), so this costs
   nothing visible while the reader's attention is on where the cards are going
   rather than on what one of them is doing. They come back 220ms after the
   last pan or wheel event. */
let quietTimer = 0, quieted = [];
function cardsQuiet() {
  clearTimeout(quietTimer);
  if (!quieted.length) {
    for (const id of stages.keys()) {
      const b = stages.get(id);
      if (b && b.running && b.stop) { b.stop(); quieted.push(b); }
    }
  }
  const back = () => {
    // Not while the map is still moving: a wave runs for about a second, and
    // restarting into it is what the pause was for.
    if (!settled) { quietTimer = setTimeout(back, 220); return; }
    for (const b of quieted) if (!b.dead && b.start) b.start();
    quieted = [];
  };
  quietTimer = setTimeout(back, 220);
}

const densifySoon = () => {
  clearTimeout(densityTimer);
  densityTimer = setTimeout(reDensify, 180);
};

/* ONE card starts per frame. A wave is up to four concepts, and each one that
   has something to show creates a WebGL context, compiles its shaders and
   builds its geometry — the protein card alone is 80k triangles of ribbon. All
   of that in the frame the wave arrives is a visible stall exactly where the
   reader is watching something move. Spread across frames it is the same total
   work and none of it lands on the animation.
   Order is drain()'s, and it differs between load and a click. */
const liveQueue = [];   // cards waiting for a quiet frame to start in
let opening = true;     // until the load's own cards are up — see drain()
let liveDraining = false;
function goLiveSoon(n) {
  const v = viewFor(n);
  if (!v) return;                        // nothing to start, so nothing to wait for
  /* The bytes can be in flight while the card waits its turn: a fetch costs no
     main thread, and the trace is what the first frame needs. Nothing reads the
     result — this only warms the HTTP cache the card's own fetch will hit. */
  if (v.trace) fetch('../' + v.trace).catch(() => {});
  liveQueue.push(n);
  if (liveDraining) return;
  liveDraining = true;
  /* And not until the map has stopped MOVING. A context is created, shaders
     compile and a geometry is built — tens of milliseconds of main thread that
     no amount of spreading makes free, so it waits for the frames where nothing
     is animating rather than landing in the middle of the wave the click
     started. `waited` is a backstop: a map that never settles (a card being
     dragged, a follow that keeps re-arming) must still get its pictures. */
  let waited = 0;
  const drain = () => {
    /* Except at LOAD. Waiting for quiet frames is about not stalling a motion
       the reader is watching, and on the opening screen there is none — the
