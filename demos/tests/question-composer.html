<!-- The two ANGSTROM-family domains, for one spec each: popc on the bilayer card
     and glucose on the glycolysis one. mol-solvation above is the display-scale
     family, and the rule is one family per SCENE (MolecularGeometry.md §1.5) —
     these never share one, since every card is its own stage with its own
     camera and no size here is ever read against a size from the other family.
     This comment is the enforcement; no checker can see which scene a spec
     lands in. mol-pathways costs 17 specs to draw one, which is the price of
     the glycolysis card. -->
<script src="../lib/mol-lipids.js"></script>
<script src="../lib/mol-pathways.js"></script>
<script src="../lib/scene.js"></script>
<script src="../lib/fx.js"></script>
<script src="../lib/atomkit.js"></script>
<script src="../lib/covalent-drag.js"></script>
<script src="../lib/ionic-drag.js"></script>
<script src="../water/watersim.js"></script>
<script src="../proteins/proteins.js"></script>   <!-- SPECIMENS resolve their keys here -->
<script src="../lib/mapcontent.js"></script>   <!-- DOORS, MODULES, QUESTIONS, VIEWS -->
<script src="../kit/modal.js"></script>
<script src="../kit/card-stage.js"></script>
<script src="../kit/molbox.js"></script>
<script src="../molecule-builder/molecule-builder.js"></script>
<script src="../folding/ribbon.js"></script>   <!-- protein cards: RibbonLib -->
<script src="../kit/proteinbox.js"></script>   <!-- ...after every library it reads -->
<script src="../hemoglobin/surface.js"></script>   <!-- ...and SurfLib, on demand -->
<script src="../hemoglobin/hbfold.js"></script>    <!-- ...and the fold, on demand -->
<script src="../hemoglobin/foldplay.js"></script>  <!-- the ss-from-bonds rule, shared with hemoglobin-lab -->
<script>
/* ---- the content ------------------------------------------------------
   DOORS, MODULES, QUESTIONS and VIEWS all live in lib/mapcontent.js now, so
   they can be edited somewhere better than an HTML file — map-cms.html reads
   and writes that file through the dev server. What is left in this page is
   what DRAWS them, which is the only thing a page should hold.

   QUESTIONS is question-major: one row per question, carrying the rank it has
   on each module it names. The map is bipartite and a question is the CROSSING,
   so it has to be one node however many modules name it; module-major, the same
   text appeared once per module and a re-wording in one of them split that node
   in two. `mapcontent.js`'s header has the argument. */

const { DOORS, MODULES, QUESTIONS, SPECIMENS, VIEWS } = MapContent;
const DOOR = DOORS.find(d => d.open) || DOORS[0];

/* ---- graph ------------------------------------------------------------
   Bipartite, like the concept map: modules never link to modules. A question
   node is shared by every module that answers it, so the question IS the
   crossing — from Hydrogen bonding to Base pairing, and with it from the
   water door to the information door. */

const world = document.getElementById('world');
const svg = document.getElementById('edges');
const NS = 'http://www.w3.org/2000/svg';

const nodes = [], links = [], byId = {};
let live = [], liveLinks = [];

const door = { id: 'door', kind: 'door', text: DOOR.question, meta: DOOR.label, deg: 0 };
byId.door = door;
nodes.push(door);

for (const m of MODULES) {
  const n = { ...m, kind: 'module', deg: 0 };
  byId[m.id] = n;
  nodes.push(n);
  if (m.door === DOOR.id) links.push({ a: door, b: n, rank: m.rank });
}

/* SPECIMENS — a protein is a LEAF: it hangs off modules and off questions and
   never off another specimen, which is what keeps the map layered even though
   a module may now reach one directly, with no question between.

   What it IS comes from proteins/proteins.js and is never restated here; only
   the default variant's baked trace is resolved, because a card draws one
   structure and the registry already says which. A key that does not resolve
   is SKIPPED rather than drawn empty — `--check` is what says so out loud. */
const SPEC = (window.ProteinLib && window.ProteinLib.PROTEINS) || [];
for (const [key, mods] of (SPECIMENS || [])) {
  const p = SPEC.find(x => x.key === key);
  if (!p) continue;
  const v = p.variants.find(x => x.default) || p.variants[0];
  const baked = v && v.read && v.read.baked;
  if (!baked) continue;
  /* Every number on the card comes from `read`, which the baker rewrites from
     the deposition, so a re-bake cannot leave a card claiming a residue count
     the file no longer has. Nothing here is typed. */
  const ec = v.read.ec || null;
  const cls = ec ? (ProteinLib.EC_CLASS || [])[Number(ec.split('.')[0])] : null;
  /* The CARD-tier surface, never the lesson's: hemoglobin's is 362 KB against
     1.5 MB for the same structure at 0.7 A, and a 280 px thumb cannot show the
     difference. Offered only where the registry says a surface EARNS one —
     `surface.bake` is a judgement about whether the skin teaches anything, and
     for most of these it hides the site that is the point. */
  const dir = (p.dir || p.key) + '/data/';
  const stem = baked.replace(/\.(trace\.)?json$/, '');
  const n = {
    id: 'p:' + key, kind: 'protein', deg: 0,
    name: p.name, claim: p.blurb, does: p.does,
    trace: dir + baked,
    surface: p.surface && p.surface.bake ? dir + stem + '.card.surf.bin' : null,
    purpose: v.purpose, species: v.species,
    method: v.read.method, residues: v.read.residues, declared: v.read.declared,
    ec, ecClass: cls ? cls[0] : null, ecDoes: cls ? cls[1] : null,
  };
  byId[n.id] = n;
  nodes.push(n);
  for (const [mid, rank] of Object.entries(mods)) {
    const m = byId[mid];
    if (!m) continue;
    links.push({ a: m, b: n, rank });
    n.deg++; m.deg++;
  }
}

/* One node per question, however many modules name it — which is what makes a
   question the crossing rather than a leaf on each card. The row already IS one
   per question, so nothing here has to dedupe by text any more. */
for (const [text, mods] of QUESTIONS) {
  const q = { id: 'q' + nodes.length, kind: 'question', text, deg: 0 };
  byId[q.id] = q;
  nodes.push(q);
  for (const [mid, rank] of Object.entries(mods)) {
    const m = byId[mid];
    if (!m) continue;              // a module the map does not draw yet
    links.push({ a: m, b: q, rank });
    q.deg++; m.deg++;
  }
}

const neighbours = n => links.flatMap(l => l.a === n ? [l.b] : l.b === n ? [l.a] : []);

// Browsing beats ranking. A question that is rank 2 or 3 everywhere would never
// open a card, and could only be met by wandering in from a module that happens
// to name it — so it is promoted to rank 1 on the card that ranks it best. It
// still reads as depth wherever it IS depth; it just gets one card that owns it.
for (const n of nodes) {
  if (n.kind !== 'question') continue;
  const mine = links.filter(l => l.a === n || l.b === n);
  const best = Math.min(...mine.map(l => l.rank));
  if (best > 1) for (const l of mine) if (l.rank === best) l.rank = 1;
}
// the rank of `other` as seen from `from` — a question's rank belongs to the
// edge, not to the question, which is the whole point of the per-module ranks
const rankFrom = (from, other) => {
  const l = links.find(l => (l.a === from && l.b === other) || (l.b === from && l.a === other));
  return l ? l.rank : 2;
};

/* ---- what a card has to show -------------------------------------------
   `VIEWS` is in lib/mapcontent.js with the rest of the content: which modules
   have something to SHOW and what. Three kinds, and the page knows how to build
   each one:

     water  — card-stage.js + water/watersim.js.
     build  — molecule-builder.js, which brings its own ORTHOGRAPHIC stage.
     molbox — kit/molbox.js: one spec, solved into the box, turning.

   A module with no entry keeps the placeholder, which is the honest signal that
   the lesson behind it has no stage yet. There was a fourth kind, `mol`: one
   built spec on a turntable. It is gone, and nothing replaced it, because it
   was two mistakes at once. It solved its camera at create and never again, so
   a card re-framed for its opening size kept that frame (measured: ethanol
   wants r 6.00 in the thumb and 6.48 open, and would have stayed at 6.00
   forever) — kit/molbox.js does the same job and re-solves on every resize. And
   it was PERSPECTIVE, where Stage.frame floors the distance at 6, so every
   molecule smaller than that floor sat at 49-57% of its frame with no way to
   fill it. The builder answers both by being what it already is: orthographic,
   and about the electrons rather than about a shape turning. */

/* ---- a protein card ------------------------------------------------------
   kit/proteinbox.js owns the molecule and the two questions a reader can ask
   of it (the surface, the fold). This owns what belongs to the MAP: which
   files a module names, and the button that opens the lesson behind it. */

/* The lesson behind a card, opened over the map. `src` is set on show and
   cleared on hide, so the lesson's context and its megabyte of trajectory
   belong to the moment it is open and to no other. */
const lessonFrame = document.getElementById('lessonframe');
const lessonTitle = document.getElementById('lessontitle');
const lessonModal = Modal.create({
  el: 'lessonmodal',
  onShow: v => {
    lessonTitle.textContent = v.name;
    lessonFrame.src = '../' + v.lesson;
  },
  onHide: () => { lessonFrame.src = 'about:blank'; },
});

function protein(thumb, view, id, name) {
  // Paths in mapcontent.js are repo-relative; this page is a directory down.
  const box = Proteinbox.create({
    mount: thumb,
    trace: '../' + view.trace,
    chains: view.chains,
    surface: view.surface ? '../' + view.surface : null,
    fold: view.fold ? '../' + view.fold : null,
  });

  if (view.lesson) {
    const open = document.createElement('button');
    open.type = 'button';
    open.className = 'lesson';
    open.textContent = 'open lesson';
    open.addEventListener('click', e => {
      e.stopPropagation();
      lessonModal.show({ name: name || 'the lesson', lesson: view.lesson });
    });
    thumb.appendChild(open);
  }
  return box;
}

/* Four, and the number is card-stage.js's rather than this page's: browsers cap
   WebGL contexts near 8-16 and drop the OLDEST with no error, so on a map that
   can reveal twenty cards the one that blanks is the one the reader opened
   first. onEvict fires while the box is still live, which is the only moment a
   still can be taken. */
const stages = CardStage.pool({
  limit: 4,
  onEvict: (id, box) => {
    const n = byId[id];
    if (!n || !n.el) return;
    const thumb = n.el.querySelector('.thumb');
    if (!thumb) return;
    const png = box.snapshot ? box.snapshot() : null;
    thumb.classList.remove('mounted');
    if (!png) return;
    const img = document.createElement('img');
    img.className = 'still'; img.alt = ''; img.src = png;
    thumb.appendChild(img);
    thumb.classList.add('mounted');
  },
});

/* A card's canvas measures its UNZOOMED layout box, so at k = 2.5 it is drawing
   2.5x fewer pixels than the screen shows — the picture goes soft exactly where
   the text now stays sharp. So the device ratio carries the zoom: the renderer
   is asked for dpr * k, capped at 3 because the cost is that number SQUARED and
   a 280px thumb at 3 is already 840px of buffer.
   Idle only. Re-sizing a drawing buffer reallocates it, which is not a thing to
   do on a wheel frame, and the reader cannot judge sharpness mid-zoom anyway. */
const DENSITY_CAP = 3;
let densityTimer = 0;
function reDensify() {
  const px = Math.min(devicePixelRatio * view.k, DENSITY_CAP);
  for (const id of stages.keys()) {
    const box = stages.get(id);
    const stage = box && box.stage;
    if (!stage || !stage.renderer) continue;
    if (stage.renderer.getPixelRatio() === px) continue;
    stage.renderer.setPixelRatio(px);
    stage.resize();
    if (box.draw) box.draw(); else if (box.pump) box.pump(0);
  }
}
/* The cards go quiet while the map is being MOVED. Four live stages is a water
   sim stepping its physics and a renderer drawing, per card, per frame — which
   is the budget the pan is asking for at the same moment. A paused box keeps
   its last frame on screen (kit/card-stage.js's whole bargain), so this costs
   nothing visible while the reader's attention is on where the cards are going
   rather than on what one of them is doing. They come back 220ms after the
   last pan or wheel event. */
let quietTimer = 0, quieted = [];
function cardsQuiet() {
  clearTimeout(quietTimer);
  if (!quieted.length) {
    for (const id of stages.keys()) {
      const b = stages.get(id);
      if (b && b.running && b.stop) { b.stop(); quieted.push(b); }
    }
  }
  const back = () => {
    // Not while the map is still moving: a wave runs for about a second, and
    // restarting into it is what the pause was for.
    if (!settled) { quietTimer = setTimeout(back, 220); return; }
    for (const b of quieted) if (!b.dead && b.start) b.start();
    quieted = [];
  };
  quietTimer = setTimeout(back, 220);
}

const densifySoon = () => {
  clearTimeout(densityTimer);
  densityTimer = setTimeout(reDensify, 180);
};

/* ONE card starts per frame. A wave is up to four modules, and each one that
   has something to show creates a WebGL context, compiles its shaders and
   builds its geometry — the protein card alone is 80k triangles of ribbon. All
   of that in the frame the wave arrives is a visible stall exactly where the
   reader is watching something move. Spread across frames it is the same total
   work and none of it lands on the animation.
   Order is drain()'s, and it differs between load and a click. */
const liveQueue = [];   // cards waiting for a quiet frame to start in
let opening = true;     // until the load's own cards are up — see drain()
let liveDraining = false;
function goLiveSoon(n) {
  const v = viewFor(n);
  if (!v) return;                        // nothing to start, so nothing to wait for
  /* The bytes can be in flight while the card waits its turn: a fetch costs no
     main thread, and the trace is what the first frame needs. Nothing reads the
     result — this only warms the HTTP cache the card's own fetch will hit. */
  if (v.trace) fetch('../' + v.trace).catch(() => {});
  liveQueue.push(n);
  if (liveDraining) return;
  liveDraining = true;
  /* And not until the map has stopped MOVING. A context is created, shaders
     compile and a geometry is built — tens of milliseconds of main thread that
     no amount of spreading makes free, so it waits for the frames where nothing
     is animating rather than landing in the middle of the wave the click
     started. `waited` is a backstop: a map that never settles (a card being
     dragged, a follow that keeps re-arming) must still get its pictures. */
  let waited = 0;
  const drain = () => {
    /* Except at LOAD. Waiting for quiet frames is about not stalling a motion
       the reader is watching, and on the opening screen there is none — the
       page is still arriving, the cards are the arrival, and a wave that has
       nowhere to have been seen from is not one worth protecting. The first
       drain therefore runs flat out; every one after it waits. */
    /* Waiting for a full settle was too patient: the relax runs for seconds
       after a click and the card the reader just opened sat on its placeholder
       the whole time, which is the one thing the pool exists to prevent. The
       gate is the WAVE, not the settle — alpha past its first fast decay — and
       the cap is under a second, because a picture late is worse than a frame
       long. */
    if (!opening && alpha > 0.3 && ++waited < 45) { requestAnimationFrame(drain); return; }
    /* Latest first once the map is being read — the reader is looking at what
       just arrived. At load there is no "just arrived": the queue is the
       opening screen in reveal order, which is reading order, so it goes out
       the front. */
    const next = opening ? liveQueue.shift() : liveQueue.pop();
    if (!next) { liveDraining = false; opening = false; return; }
    if (next.visible) goLive(next);
    waited = 0;
    requestAnimationFrame(drain);
  };
  requestAnimationFrame(drain);
}

// The click that opens a card is the click that starts it. A card asked twice
// for its picture is a card the reader never sees move.
/* What a node draws. A module names its view in mapcontent.js; a SPECIMEN
   carries its own, because the file it draws is the registry's answer and
   restating it in VIEWS would be a second source for the same fact. */
function viewFor(n) {
  if (n.kind === 'protein') return { kind: 'protein', trace: n.trace, surface: n.surface };
  return VIEWS[n.id];
}

function goLive(n) {
  const view = viewFor(n);
  if (!view || !n.el) return;
  const thumb = n.el.querySelector('.thumb');
  if (!thumb) return;
  if (stages.has(n.id)) {                       // re-front, and resume if paused
    const box = stages.acquire(n.id, null);
    if (box.start) box.start();
    reDensify();
    return;
  }

  stages.acquire(n.id, () => {
    thumb.querySelectorAll('.still').forEach(el => el.remove());
    thumb.classList.add('mounted');

    if (view.kind === 'molbox') {
      /* No `.inset` frame and no leader: those are the figure convention, for a
         magnification sitting over a scene at another scale. Nothing sits
         behind a card — the card is the frame. Turntable on, which molbox says
         to ask for where the point IS that the thing is 3D. */
      return Molbox.create({ mount: thumb, spec: MolLib.MOLECULES[view.spec],
                             spin: true });
    }

    if (view.kind === 'build') {
      // Its own stage, its own loop, its own context — see the table above.
      // zoomOnComplete: a card is a close-up. The builder's opening frame holds
      // the atoms where they are DEALT, which leaves a finished molecule at 30%
      // of the box — right on the lesson's big stage, wrong here.
      return MoleculeBuilder.create({ mount: thumb, recipe: view.recipe,
                                      fill: true, zoomOnComplete: true });
    }

    if (view.kind === 'protein') return protein(thumb, view, n.id, n.name);

    let sim = null;
    const box = CardStage.create({
      mount: thumb,
      cam: { theta: 0.5, phi: 1.15, r: 26 },
      step: () => { if (sim) sim.step(Object.assign(
        { solvent: sim.salt.length > 0 }, view.frame)); },
      onDestroy: () => { sim = null; },
    });

    sim = WaterSim.create(THREE, box.root);
    for (let i = 0; i < view.waters; i++) sim.spawn();
    for (let i = 0; i < (view.salt || 0); i++) sim.addSalt('nacl');
    if (view.salt) sim.assignShells();
    box.draw();
    return box;
  });
  reDensify();                 // a card mounted while zoomed in opens sharp
}

/* ---- reveal ----------------------------------------------------------- */

const COL = 560;
const FIRST_ARM = 700;   // the door's own reach, scaled per module below
let alpha = 1;
/* The relax used to floor at alpha 0.012 and run for ever, so every frame wrote
   a transform on every card and a `d` on every link whether or not anything had
   moved — which is style + paint work on the whole world, and it is what a pan
   was competing with. Now it settles: below a twitch that no one can see, the
   loop stops touching the DOM until something wakes it. */
let settled = false;
const wake = a => { alpha = Math.max(alpha, a); settled = false; };

function show(n, depth, y, x, ty) {
  if (n.visible) return;
  n.ty = ty;
  n.visible = true;
  n.depth = depth;
  n.tx = x === undefined ? depth * COL : x;
  n.x = n.tx;
  n.y = y;
  n.vx = n.vy = 0;
  paintNode(n);
  live.push(n);
  /* A card arrives showing its subject, not a grey rectangle it has to be asked
   * for. The pool is what makes that affordable: the four most recently
   * revealed or clicked stay live, and everything older keeps a still of its
   * last frame — so there is a picture on every card that has one to show, and
   * only four of them are running. A wave of new modules is by definition the
   * most recent, so it is never the thing evicted. */
  goLiveSoon(n);
  for (const l of links) {
    if (l.painted || !l.a.visible || !l.b.visible) continue;
    paintLink(l);
    liveLinks.push(l);
  }
}

// A card opens once, on its rank 1 questions — and if that is a thin showing,
// the next band comes with it, and the one after that, until four are on screen.
// Whole bands only: "all the rank 1s" is the promise, so the cut never lands
// inside a rank. Clicking again brings the card back into focus and adds nothing,
// which means a question ranked low here may only be reachable from the card that
// ranks it highly — that is the per-card ranking doing its job, not a gap.
const SHOW = 4;

/* A question's best band, not literally rank 1: a question whose modules are
   all rank 2 or 3 there would deal nothing and read as a dead end, so the cut
   is the lowest rank it actually has among the modules still hidden. Whole
   bands only, the same promise a card's own wave makes. `also` narrows the
   field the band is measured over — measuring it before the narrowing picks a
   band that then gets filtered away to nothing. */
const band = also => (q, m) => {
  const up = neighbours(q).filter(x => !x.visible && (!also || also(q, x)));
  if (!up.length || (also && !also(q, m))) return false;
  return rankFrom(q, m) === Math.min(...up.map(x => rankFrom(q, x)));
};
const top1 = band(null);

/* `keep` is the opening screen's only extra: a click passes nothing and takes
   the whole wave, while start() opens three levels deep and has to say which of
   a question's modules belong to the shape it is composing. `next` is the same
   filter one level on: a module's wave carries its questions' first modules
   with it, and start() narrows that to this door — without it the four
   crossings drag their away-door partners in and the door opens on twelve
   cards. */
function expand(n, keep, next = top1) {
  /* The asked card is a root and never a wave: its links make it a genuine
     neighbour of the modules it reached, so without this `start()` deals the
     reader's last question into the door's own map as though someone had
     authored it. Tested as a PROPERTY, not against the `ASKED` binding: this
     runs from start() at the bottom of the map's own script, which is before
     the composer's block below has initialized, and touching the const there
     is a dead-zone throw that takes the whole page down. */
  const pending = neighbours(n).filter(m => !m.visible && !m.ask && (!keep || keep(n, m)))
    .sort((a, b) => rankFrom(n, a) - rankFrom(n, b));
  if (!pending.length) { n.done = true; return; }

  const wave = [];
  for (const m of pending) {
    if (wave.length >= SHOW && rankFrom(n, m) !== rankFrom(n, wave[wave.length - 1])) break;
    wave.push(m);
  }

  const mark = live.length;

  // A card's questions fan out to its RIGHT, on an arc, in rank order top to
  // bottom — the reading direction the whole map already has. They carry a
  // target y as well as an x, so the fan holds its shape instead of sagging
  // toward the middle line the moment the relax touches it.
  const REACH = n.kind === 'door' ? 640 : 580;   // how far right of the card
  /* Gap down the fan, and it has to CLEAR the card or the wave is dealt on top
     of itself and the relax opens with a shove. Measured: a module card is 304
     tall once its picture is 4:3 (it was ~217 when the thumb was a fixed
     6.6rem), a question card 58. So the module step is the card plus a gap, and
     the question step is generous because a question is mostly air — it is
     spacing the ROW, not clearing the box. */
  // A specimen card is a module card, so it steps like one.
  const STEP = m0 => m0 === 'question' ? 215 : 345;   // gap down the fan
  wave.forEach((m, i) => {
    const t = wave.length === 1 ? 0 : (i / (wave.length - 1)) * 2 - 1;   // -1 … +1
    const y = n.y + (i - (wave.length - 1) / 2) * STEP(m.kind);
    const x = n.x + REACH - Math.abs(t) * 70;     // a gentle bow, not an arc
    show(m, n.depth + 1, y, x, y);
  });
  n.done = true;

  /* A module's wave is questions, and a question alone is a dead end on the
     screen — the reader has to click it to learn what it crosses to. So the
     wave carries its own next step: each new question deals its best band of
     modules, which is what makes the crossing visible instead of promised.
     One band, or a click opens a card's entire second neighbourhood. */
  if (n.kind === 'module' && next)
    for (const q of wave) if (q.kind === 'question') expand(q, next);

  wake(0.6);
  cardsQuiet();                 // the wave owns the frame, not four water sims
  // The clicked card leads the shot; what it revealed only decides how far left
  // of centre it sits. The hold runs long, because the relax keeps shoving the
  // arrivals outward well after the camera has arrived — any pointer or wheel
  // event drops it, so it never fights the reader.
  follow = [n, ...live.slice(mark)];
  followFrames = 900;
  for (const m of live) refreshMeta(m);
}

function refreshMeta(n) {
  const el = n.el.querySelector('.meta');
  if (!el) return;
  const hidden = neighbours(n).filter(m => !m.visible).length;
  if (n.kind === 'door') { el.textContent = hidden ? '+' + hidden + ' modules' : DOOR.label; return; }
  /* A specimen's hidden neighbours are MODULES — the concepts that hold it —
     not questions, and the card said "+1 question" over two of them. */
  const noun = n.kind === 'protein'
    ? (hidden === 1 ? ' concept' : ' concepts')
    : (hidden === 1 ? ' question' : ' questions');
  el.textContent = n.done || !hidden ? '' : '+' + hidden + noun;
}

/* ---- DOM -------------------------------------------------------------- */

/* The registry's strings are authored, not typed by a reader — but they go into
   innerHTML beside a title attribute, and a stray quote there would break the
   attribute rather than the sentence. Cheaper to escape than to remember. */
const esc = t => String(t == null ? '' : t)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function paintNode(n) {
  const el = document.createElement('div');
  if (n.kind === 'door') {
    el.className = 'node door';
    el.innerHTML = '<div class="q">' + n.text + '</div><div class="meta"></div>';
  } else if (n.kind === 'module') {
    el.className = 'node module ' + n.state + (n.away ? ' away' : '');
    const tint = (DOORS.find(d => d.id === n.door) || {}).tint;
    if (tint) el.style.setProperty('--dot', tint);
    el.innerHTML = '<div class="name">' + n.name + '</div>' +
                   '<div class="claim">' + n.claim + '</div>' +
                   '<div class="thumb"><span class="ph">image</span></div>' +
                   '<div class="meta"></div>';
  } else if (n.kind === 'protein') {
    /* A specimen, not a claim. Same card frame so it sits in the fan, and its
       own dot colour so a reader can see at a glance that this one is a THING
       we hold rather than something the map asserts. The meta line is the
       registry's own words — method and species — never typed here. */
    el.className = 'node module specimen';
    /* Name first and picture second, with the blurb a caption under it. A
       concept card leads with its CLAIM because the claim is the lesson; a
       specimen leads with its NAME because the thing is the point, and what we
       say about it is a label on the object. */
    /* An enzyme is marked by WHAT IT DOES, not by the word "enzyme": the EC
       number's first digit is a class, and the registry already carries the
       class's own name and gloss. "translocase" says more than "enzyme" and
       costs the same line. */
    const tag = n.does === 'enzyme' && n.ecClass
      ? '<div class="tag" title="' + esc(n.ecDoes || '') + '">' + esc(n.ecClass)
        + '<span>EC ' + esc(n.ec) + '</span></div>'
      : n.does === 'enzyme' ? '<div class="tag">enzyme</div>' : '';
    /* Read at render time from `read`, which is the baker's half of the
       registry — so this line cannot drift from the file it describes. */
    const prov = [
      n.method,
      n.residues != null && n.declared != null
        ? n.residues + ' of ' + n.declared + ' residues' : null,
      n.species,
    ].filter(Boolean).map(esc).join(' · ');
    el.innerHTML = '<div class="name">' + n.name + '</div>' + tag +
                   '<div class="thumb"><span class="ph">image</span></div>' +
                   '<div class="claim">' + n.claim + '</div>' +
                   '<div class="prov">' + prov + '</div>' +
                   '<div class="meta"></div>';
  } else if (n.ask) {
    /* textContent and not innerHTML: this text is typed by the reader. */
    el.className = 'node question asked';
    const mine = document.createElement('span');
    mine.textContent = n.text;
    el.append(mine);
    if (n.said) {
      const said = document.createElement('span');
      said.className = 'said';
      said.textContent = 'the map words it as \u201c' + n.said + '\u201d';
      el.append(said);
    }
  } else {
    el.className = 'node question';
    el.innerHTML = '<span>' + n.text + '</span>';
  }
  n.el = el;
  world.appendChild(el);
  n.r = Math.hypot(el.offsetWidth, el.offsetHeight) / 2;
  refreshMeta(n);
}

function paintLink(l) {
  l.painted = true;
  const planned = l.b.state === 'planned' || l.a.state === 'planned';
  l.el = document.createElementNS(NS, 'path');
  l.el.setAttribute('fill', 'none');
  l.el.setAttribute('stroke', planned ? '#6d6f76' : '#1f5f4f');
  l.el.setAttribute('stroke-width', '1');
  l.el.setAttribute('stroke-opacity', planned ? '.22' : '.30');
  if (planned) l.el.setAttribute('stroke-dasharray', '4 4');
  if (l.near) { l.el.setAttribute('class', 'nearline');
                l.el.setAttribute('stroke', '#e2643a'); }
  svg.appendChild(l.el);
}

/* ---- relax ------------------------------------------------------------ */

function step() {
  const REPEL = 20000, SPRING = 0.012, COLUMN = 0.10, ROW = 0.0012, VMAX = 16;
  // heavy friction: the cards should settle into place, not bounce into it
  for (const n of live) { n.vx *= 0.76; n.vy *= 0.76; }

  for (let i = 0; i < live.length; i++) {
    const a = live[i];
    for (let j = i + 1; j < live.length; j++) {
      const b = live[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = (i - j) || 1; dy = 1; d2 = 2; }
      const d = Math.sqrt(d2), ux = dx / d, uy = dy / d;
      const near = a.r + b.r;
      const f = REPEL / d2 + (d < near * 1.15 ? (near * 1.15 - d) * 0.45 : 0);
      a.vx -= ux * f; a.vy -= uy * f;
      b.vx += ux * f; b.vy += uy * f;
    }
  }

  for (const l of liveLinks) {
    const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
    const d = Math.hypot(dx, dy) || 1;
    const f = (d - 420) * SPRING;
    l.a.vx += (dx / d) * f; l.a.vy += (dy / d) * f;
    l.b.vx -= (dx / d) * f; l.b.vy -= (dy / d) * f;
  }

  let moved = 0;
  for (const n of live) {
    n.vx += (n.tx - n.x) * COLUMN;
    if (n.ty === undefined) n.vy -= n.y * ROW;
    else n.vy += (n.ty - n.y) * 0.04;
    const v = Math.hypot(n.vx, n.vy);
    if (v > VMAX) { n.vx *= VMAX / v; n.vy *= VMAX / v; }
    if (n === dragNode || n.pinned) continue;
    const dx = n.vx * alpha, dy = n.vy * alpha;
    n.x += dx; n.y += dy;
    moved = Math.max(moved, Math.abs(dx), Math.abs(dy));
  }
  alpha *= 0.985;
  // Settled is a claim about MOTION, not about alpha: a card still sliding
  // under a low alpha has to keep being drawn, and a high alpha with nothing
  // moving is a wave that has already landed.
  if (alpha < 0.05 && moved < 0.05) { settled = true; alpha = 0; }
}

function draw() {
  for (const n of live) n.el.style.transform =
    'translate(-50%,-50%) translate(' + n.x.toFixed(1) + 'px,' + n.y.toFixed(1) + 'px)';
  // Cubic, with the handles pulled out horizontally: the map reads left to
  // right, so a curve that leaves and arrives flat says which way the branch
  // is going in a way a straight line does not.
  for (const l of liveLinks) {
    const x1 = l.a.x, y1 = l.a.y, x2 = l.b.x, y2 = l.b.y;
    const bend = Math.abs(x2 - x1) * 0.42 + 30;
    const s1 = x2 >= x1 ? bend : -bend;
    l.el.setAttribute('d', 'M' + x1.toFixed(1) + ',' + y1.toFixed(1) +
      'C' + (x1 + s1).toFixed(1) + ',' + y1.toFixed(1) +
      ' ' + (x2 - s1).toFixed(1) + ',' + y2.toFixed(1) +
      ' ' + x2.toFixed(1) + ',' + y2.toFixed(1));
  }
}

// A pan, never a zoom — refitting on every expansion reads as a jerk. Eases the
// viewport onto the new arrivals instead, recomputed each frame because they are
// still settling under it.
let follow = null, followFrames = 0;

function followStep() {
  if (!follow || followFrames-- <= 0) { follow = null; return; }
  // Framed on the SUBJECT, not on the average of it and what it revealed: a fan
  // of five questions 580px to its right drags an average right with it, which
  // pushes the card into the left margin and leaves the right half empty. The
  // clicked card sits in the middle; its fan runs off to the right, which is
  // where the reader is going next anyway.
  const subject = follow[0];
  const place = 0.5;
  view.x += (innerWidth * place - subject.x * view.k - view.x) * 0.05;
  view.y += (innerHeight / 2 - subject.y * view.k - view.y) * 0.05;
  applyView();
}


/* fps, and the two numbers beside it, because "it feels laggy" has three
   different causes on this page and they need telling apart: how long THIS
   loop's own work takes (relax + link redraw), how many card stages are
   running their own loops, and how many nodes are being laid out. A frame
   budget is 16.7ms; if `map` is 2ms and the fps is 30, the cost is not here.
   Averaged over a second — a per-frame number is unreadable and jitters. */
const fpsEl = document.getElementById('fps');
let fCount = 0, fWork = 0, fWorst = 0, fSince = performance.now();
function frame() {
  const t0 = performance.now();
  if (!settled) { step(); draw(); }
  followStep();
  const spent = performance.now() - t0;
  fWork += spent;
  fWorst = Math.max(fWorst, spent);   // the average hides exactly the frame that hurt
  fCount++;
  const dt = t0 - fSince;
  if (dt >= 1000) {
    let running = 0;
    for (const id of stages.keys()) { const b = stages.get(id); if (b && b.running) running++; }
    fpsEl.textContent = Math.round(fCount * 1000 / dt) + ' fps · map ' +
                        (fWork / fCount).toFixed(1) + '/' + fWorst.toFixed(0) + 'ms · ' +
                        running + '/' + stages.size + ' live · ' + live.length + ' nodes';
    fCount = 0; fWork = 0; fWorst = 0; fSince = t0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- full screen ------------------------------------------------------
   The card at reading size: the same three parts it already has — what it is,
   what it claims, and the picture — with the picture given the room. A module
   also lists the questions it answers, since that is what the map would have
   shown next. Nothing here navigates; closing returns you to where you were. */

const full = document.getElementById('full');

function openFull(n) {
  document.getElementById('fullLede').textContent = n.kind === 'module' ? n.claim : n.text;
  const r = n.el.getBoundingClientRect();
  full.style.transformOrigin =
    (r.left + r.width / 2) + 'px ' + (r.top + r.height / 2) + 'px';
  full.classList.add('on');
}

const closeFull = () => full.classList.remove('on');
document.getElementById('fullClose').addEventListener('click', closeFull);

/* ---- pan, zoom, drag, focus ------------------------------------------- */

const canvas = document.getElementById('canvas');
const hint = document.getElementById('hint');
let view = { x: innerWidth * 0.25, y: innerHeight / 2, k: 0.7 };
/* `zoom`, not `transform: scale()`. A scaled subtree is rasterised once at its
   layout size and stretched by the compositor, so every glyph goes soft the
   moment you zoom past 1 — worst in Safari, which holds the cached layer. Zoom
   is a LAYOUT multiplier: the text is laid out and rasterised at the size you
   are actually looking at, so it stays sharp at any k.
   Everything else is unchanged because all the pan/zoom maths is in screen px
   already; only the translate has to be divided, since zoom multiplies the
   element's own units too. Canvases still measure their unzoomed clientWidth
   (the note on .thumb), which is the same deal scale() gave them. */
/* ---- zoom bands ---------------------------------------------------------
   A map names its zoom levels, and so does this one: `data-zoom` on #world is
   the single place a band is decided, so CSS can hide a claim and JS can budget
   live contexts off the same fact without either polling `view.k`.

   Absolute k, and it can be absolute because centre() no longer solves the
   opening zoom out of the window — it floors at 0.5, which is a decision about
   what a claim is readable at. So a band means the same thing on every screen
   and for every door, however many cards it opens with.

     atlas    < 0.40   the shape, not the words
     region   < 0.75   the opening view: cards readable, whole neighbourhoods
     interact >= 0.75  close enough to work ON a card rather than read it —
                       where a card's own controls belong, and where a live
                       canvas is worth its context.

   centre() reports its own k as `openK`, which is what the readout compares
   against and what keeps a band from silently ending up on the wrong side of
   the view the reader is handed. */
const BAND = [['atlas', 0.4], ['region', 0.75], ['interact', Infinity]];

/* A band is the VIEW's, and a card's controls are the CARD's — and an open card
   is 34rem where the rest are 17.5, so at one zoom the two are not the same
   size on screen at all. What a control needs is apparent size, so that is what
   is measured: k times the card's own width ratio, against one threshold.
   0.95 of a default card, which is very nearly its own 1:1 — the buttons are
   22px tall and letter-spaced, and shrinking them is how a control becomes a
   thing you miss and pan the map instead. The open card clears the same bar at
   k 0.49, because it is nearly twice as wide: opening a card IS most of the way
   to being able to work on it, which is the behaviour the .hub width was
   already promising and nothing was reading. */
const HUB_RATIO = 34 / 17.5;
const CONTROLS_AT = 0.95;
function markNear() {
  for (const n of live) {
    if (!n.el || n.kind !== 'module') continue;
    const f = n.el.classList.contains('hub') ? HUB_RATIO : 1;
    n.el.classList.toggle('near', view.k * f >= CONTROLS_AT);
  }
}
let openK = 0.5;                 // overwritten by the first centre()
const bandFor = k => (BAND.find(b => k < b[1]) || BAND[BAND.length - 1])[0];
let zoomBand = '';                // `band` is taken: the reveal's rank filter
function setZoomBand(next) {
  if (next === zoomBand) return;
  zoomBand = next;
  world.dataset.zoom = zoomBand;
  document.body.dataset.zoom = zoomBand;
}

const applyView = () => {
  setZoomBand(bandFor(view.k));
  markNear();
  hint.textContent = 'k ' + view.k.toFixed(2) + ' · ' + zoomBand +
                     ' · controls ' + (view.k >= CONTROLS_AT ? 'every card'
                       : view.k * HUB_RATIO >= CONTROLS_AT ? 'open card' : 'none');
  /* Zooming OUT is a scale, zooming IN is a zoom. Minifying a layer costs
     nothing in sharpness — there are more source pixels than screen ones — and
     it leaves the layout alone, which is the half that matters below 1: a
     relayout at k 0.7 rewraps a heading and the card is redesigned under the
     reader. Above 1 the trade flips: the stretch is what you can see, and a
     relayout at the size being looked at is the only way the glyphs are drawn
     at it. The two agree exactly at k = 1, so the crossing is invisible. */
  const zoomed = view.k > 1;
  world.style.zoom = zoomed ? view.k : 1;
  const t = zoomed ? view.k : 1;
  world.style.transform =
    'translate(' + (view.x / t) + 'px,' + (view.y / t) + 'px)' +
    (zoomed ? '' : ' scale(' + view.k + ')');
};
applyView();

let dragNode = null, dragging = null, last = null, travel = 0;
let lastHit = null, lastHitAt = 0;

canvas.addEventListener('pointerdown', e => {
  /* A card's own control keeps its pointer. Without this the canvas captures
     the pointer on the way down, the button never sees the pointerup, and the
     click that reaches it is the card's — so the toggle looked dead while the
     card behind it opened. Both controls, since the builder's 3D/2D sits in a
     card the same way. */
  if (e.target.closest('.pbox-rep, .pbox-play, .lesson, .mb-dims')) return;
  const hit = e.target.closest('.node');
  last = { x: e.clientX, y: e.clientY };
  travel = 0;
  follow = null;
  if (hit) {
    dragNode = live.find(n => n.el === hit);
    hit.classList.add('dragging');
    dragging = 'node';
    wake(0.3);
  } else {
    dragging = 'pan';
    canvas.classList.add('panning');
  }
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  last = { x: e.clientX, y: e.clientY };
  travel += Math.hypot(dx, dy);
  if (dragging === 'pan') { view.x += dx; view.y += dy; applyView(); cardsQuiet(); }
  else { dragNode.x += dx / view.k; dragNode.y += dy / view.k; dragNode.vx = dragNode.vy = 0;
         wake(0.3); }   // a dragged card is motion the relax did not cause
});

function endDrag(e) {
  // Settled here rather than on a `click` listener: the pointer capture above
  // retargets that event to the canvas, so the node is only knowable from the
  // pointerdown that started the press. A real click travels a pixel or two.
  const click = travel <= 5;
  if (dragging === 'node') {
    dragNode.el.classList.remove('dragging');
    const now = performance.now();
    const second = click && dragNode === lastHit && now - lastHitAt < 450;
    if (second) openFull(dragNode);
    else if (click) { expand(dragNode); focus(dragNode); goLive(dragNode); }
    if (click) { lastHit = dragNode; lastHitAt = now; }
    else dragNode.pinned = true;
    dragNode = null;
  } else if (dragging === 'pan' && click && focused) {
    clearFocus();
  }
  canvas.classList.remove('panning');
  dragging = null;
  if (e && canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  follow = null;
  const k = Math.min(2.5, Math.max(0.2, view.k * Math.exp(-e.deltaY * 0.0015)));
  view.x = e.clientX - (e.clientX - view.x) * (k / view.k);
  view.y = e.clientY - (e.clientY - view.y) * (k / view.k);
  view.k = k;
  densifySoon();                       // the canvases follow the zoom, once it stops
  cardsQuiet();
  applyView();
}, { passive: false });

let focused = null;

// Two hops: what you clicked, what it reaches, and what THOSE reach — the
// second ring is the point, since it is where the next door shows up.
// The one place a card's SIZE is re-read, which is why the control test lives
// here too: opening and closing a card changes what it is worth showing on it,
// and a card that shrank back to 17.5rem keeping its buttons is a control at
// half the size the threshold exists to guarantee.
function measure() {
  for (const m of live) m.r = Math.hypot(m.el.offsetWidth, m.el.offsetHeight) / 2;
  markNear();
  wake(0.4);
}

function focus(n) {
  focused = n;
  // Every click frames what was clicked, including a card with nothing left to
  // reveal. Adopting only when `follow` is empty left the camera on the PREVIOUS
  // subject, since a shot from the click before is usually still running.
  if (!follow || follow[0] !== n) { follow = [n]; followFrames = 900; }
  document.body.classList.add('focusing');
  for (const m of live) m.el.classList.remove('lit', 'hub', 'hop2');

  const hop1 = new Set(neighbours(n).filter(m => m.visible));
  const hop2 = new Set();
  for (const m of hop1) for (const o of neighbours(m))
    if (o.visible && o !== n && !hop1.has(o)) hop2.add(o);

  n.el.classList.add('lit', 'hub');
  for (const m of hop1) m.el.classList.add('lit');
  for (const m of hop2) m.el.classList.add('lit', 'hop2');

  measure();

  for (const l of liveLinks) {
    const first = l.a === n || l.b === n;
    const second = (hop1.has(l.a) && hop2.has(l.b)) || (hop1.has(l.b) && hop2.has(l.a));
    l.el.setAttribute('stroke-opacity', first ? '.85' : second ? '.4' : '.06');
    if (first || second) l.el.setAttribute('stroke', '#e2643a');
    else l.el.setAttribute('stroke', l.b.state === 'planned' ? '#6d6f76' : '#1f5f4f');
  }
}

function clearFocus() {
  focused = null;
  document.body.classList.remove('focusing');
  for (const m of live) m.el.classList.remove('lit', 'hub', 'hop2');
  measure();
  for (const l of liveLinks) {
    const planned = l.b.state === 'planned' || l.a.state === 'planned';
    l.el.setAttribute('stroke', planned ? '#6d6f76' : '#1f5f4f');
    l.el.setAttribute('stroke-opacity', planned ? '.22' : '.30');
  }
}

addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (full.classList.contains('on')) closeFull();
  else clearFocus();
});

/* ---- start ------------------------------------------------------------ */

// The pane can settle on its size after load, and a view composed against a
// zero-height window leaves the map in a corner. Recentre until the reader moves.
let touched = false;
canvas.addEventListener('pointerdown', () => { touched = true; });
canvas.addEventListener('wheel', () => { touched = true; });
addEventListener('resize', () => { if (!touched) centre(); });

// The opening frame is composed, not chased: it fits the door and its four
// modules exactly once, so the spacing can grow without pushing a card off the
// top. Everything after this is the reader's own panning.
function centre() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of live) {
    const w = n.el.offsetWidth / 2, h = n.el.offsetHeight / 2;
    x0 = Math.min(x0, n.x - w); x1 = Math.max(x1, n.x + w);
    y0 = Math.min(y0, n.y - h); y1 = Math.max(y1, n.y + h);
  }
  if (!isFinite(x0)) return;
  /* 0.5 is the floor as well as the design: three levels of cards do not fit a
     laptop window at any zoom a reader can read, so the fit was solving to its
     old 0.35 floor every load and the opening screen was set by a clamp rather
     than by a decision. Below 0.5 the claim on a card is unreadable, which
     makes the map a diagram of itself — so the opening view is 0.5 and what
     does not fit is off screen, waiting to be panned to. */
  /* DIVERGES from door-map's centre(): the composer is a fixed band across the
     top, and centring on the whole window puts cards under it — measured, the
     root card landed there, which is the one card that must be visible. So the
     frame is the window BELOW the box, and the fit is solved against that
     height rather than the window's. */
  const top = document.querySelector('.composer').getBoundingClientRect().bottom + 18;
  const k = Math.max(0.5, Math.min((innerWidth - 200) / (x1 - x0),
                                   (innerHeight - top - 90) / (y1 - y0), 0.85));
  // The opening fit IS `region`: every band above is measured off it.
  openK = k;
  view = { x: innerWidth / 2 - ((x0 + x1) / 2) * k,
           y: top + (innerHeight - top) / 2 - ((y0 + y1) / 2) * k, k };
  applyView();
}

function start() {
  clearFocus();
  // Every live stage is mounted in a card about to be removed from the DOM, so
  // the contexts have to go back before the elements do — a destroy after the
  // element is gone leaks the context for the life of the tab.
  stages.clear();
  for (const n of nodes) { n.visible = false; n.done = false; n.pinned = false; }
  for (const l of links) l.painted = false;
  live = []; liveLinks = [];
  world.querySelectorAll('.node').forEach(el => el.remove());
  svg.replaceChildren();

  show(door, 0, 0);
  // The opening four hang off a longer arm than the rest of the map and sit on
  // one column, evenly spread. It reads as a set rather than a cascade, and it
  // leaves the room a card needs when it opens and its own questions arrive.
  // Hand-composed rather than evenly stacked: a shallow fan, and the middle two
  // reach further than the outer two. A column of four reads as a list, and the
  // whole point of the door is that these are four ways in, not four steps.
  /* [angle from the door, how far along that arm]. Hand-composed and asymmetric:
     the second card reaches furthest, the outer two least, so four cards read as
     a spread rather than as a column — which is the door's whole claim, that
     these are four ways in and not four steps.

     RESAMPLED, not indexed. It used to be `FAN[i % FAN.length]`, which meant a
     fifth rank 1 module wrapped onto the first slot and was dealt on the exact
     same point (measured: heat landed at 649,-262 on top of polarity). Reading
     the table as CONTROL POINTS on a curve instead, four starters land on the
     hand-composed positions unchanged — exactly, that is what makes this safe —
     and any other count follows the same bow. So how many modules a door opens
     with is a rank in mapcontent.js, not a layout to re-tune. */
  const FAN = [[-22, 1.00], [-8, 1.55], [10, 1.36], [30, 0.94]];
  const fanAt = (i, n) => {
    if (n === 1) return FAN[1];             // the furthest arm, alone
    const u = (i / (n - 1)) * (FAN.length - 1);
    const a = Math.floor(u), b = Math.min(a + 1, FAN.length - 1), f = u - a;
    return [FAN[a][0] + (FAN[b][0] - FAN[a][0]) * f,
            FAN[a][1] + (FAN[b][1] - FAN[a][1]) * f];
  };
  const first = neighbours(door).filter(m => m.rank === 1);
  first.forEach((m, i) => {
    const [deg, reach] = fanAt(i, first.length);
    const a = deg * Math.PI / 180, r = FIRST_ARM * reach;
    show(m, 1, Math.sin(a) * r, Math.cos(a) * r, Math.sin(a) * r);
  });

  /* The water door's claim is a CHAIN, not a fan: everything water does comes
     from polarity, so the door opens already two crossings deep — the rank 1
     module, its rank 1 questions, and the module each of those leads to. The
     ranks in mapcontent.js still choose every card; this only says how many
     levels are dealt before the reader touches anything. A door whose opening
     module has no rank 1 questions just stops, so this costs nothing elsewhere.
     Own-door only, or a crossing hauls its far side in as well. */
  const onward = band((q, m) => m.door === DOOR.id);
  for (const m of first) expand(m, null, onward);
  for (const m of live) refreshMeta(m);
  follow = null;                       // the opening frame is composed, not chased
  touched = false;
  centre();
  wake(1);

}

document.getElementById('reset').addEventListener('click', start);
start();

/* =======================================================================
   The composer — a typed question, resolved to a node on this map.

   TWO HALVES, and only the first one is going to change. `rank()` scores the
   typed text against every authored question; `openFrom()` composes the map
   around whichever one is chosen. The scorer here is LEXICAL — token overlap,
   no network, no key — and it is a stand-in that exists so the OPENING can be
   judged in a browser before any vector is baked. It fails at exactly the
   thing the real one is for: a reader who writes "why does water stick to
   itself" does not share a token with `polarity`, and this returns nothing.
   Swap rank() for cosine over baked embeddings and nothing below it moves.
   ==================================================================== */

const HITS = 5;
const FLOOR = 0.12;          // below this, say so rather than route badly

const STOP = new Set(('a an the is are was were be been do does did of in on to for and or ' +
  'but why how what when where which who that this it its with as at by from ' +
  'can could would should if then than so my your our their there here get got ' +
  'make makes made have has had i you we they me us them about into over under').split(' '));

/* Crude and deliberate: a trailing s is the only inflection worth folding at
   this size, and anything more is a stemmer nobody asked for. */
const toks = s => s.toLowerCase().normalize('NFKD')
  .replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/)
  .filter(w => w.length > 1 && !STOP.has(w))
  .map(w => w.length > 3 && w.endsWith('s') ? w.slice(0, -1) : w);

const QNODES = nodes.filter(n => n.kind === 'question');
const BAG = new Map(QNODES.map(q => [q, new Set(toks(q.text))]));

function lexRank(text) {
  const want = toks(text);
  if (!want.length) return [];
  return QNODES.map(q => {
    const have = BAG.get(q);
    let hit = 0;
    for (const w of want) if (have.has(w)) hit++;
    // Normalised by both sides, so a long question does not win on surface area.
    return { q, score: hit / Math.sqrt(want.length * Math.max(have.size, 1)) };
  }).filter(h => h.score > 0)
    .sort((a, b) => b.score - a.score || a.q.text.length - b.q.text.length)
    .slice(0, HITS);
}

/* What the typed question landed on, and what it crosses to. Same three-level
   shape start() composes for a door, rooted on a question instead: the question,
   every module that answers it, and each of those modules' best band. A question
   IS the crossing, so its own modules are the fan — that is the paradigm, not a
   special case built for the search box. */
function openFrom(q) {
  clearFocus();
  stages.clear();
  for (const n of nodes) { n.visible = false; n.done = false; n.pinned = false; }
  for (const l of links) l.painted = false;
  live = []; liveLinks = [];
  world.querySelectorAll('.node').forEach(el => el.remove());
  svg.replaceChildren();

  show(q, 0, 0);
  /* The door's FAN is hand-composed for four ways in; a question answers two or
     three modules at most, so it gets the same bow read at whatever count it
     has. Reusing start()'s control points would claim a spread this never has. */
  const mods = neighbours(q).sort((a, b) => rankFrom(q, a) - rankFrom(q, b));
  mods.forEach((m, i) => {
    const t = mods.length === 1 ? 0 : (i / (mods.length - 1)) * 2 - 1;
    const y = (i - (mods.length - 1) / 2) * 345;
    const x = FIRST_ARM * 0.9 - Math.abs(t) * 70;
    show(m, 1, y, x, y);
  });
  /* Own-door only, or a crossing hauls its far side in at load — start()'s rule,
     and it is the same rule here for the same reason. */
  const onward = band((qq, m) => m.door === DOOR.id);
  /* A module's neighbours include ITS DOOR, and here the door is hidden — so
     without this every module deals the door into its own wave and three of
     them deal the same one, stacked. start() never sees it because the door is
     already visible by the time anything expands. The composer's root is the
     typed question; the door is not part of the shape it opens. */
  for (const m of mods) expand(m, (n, x) => x.kind === 'question' || x.kind === 'protein', onward);
  for (const m of live) refreshMeta(m);
  follow = null;
  touched = false;
  centre();
  alpha = 1;
}

/* ---- the reader's question as a node ----------------------------------
   ONE card carrying what was typed, and two kinds of edge off it.

     INHERITED (solid) — the modules of the authored question it matched. Real
       crossings, carrying the rank that question already had on each.
     DISCOVERED (dashed) — modules the text reached on its own, that the match
       did not already cover. Proximity, drawn as proximity.

   Both at once, because a question rarely lands entirely in one bucket: the
   match explains what the map already answers, and the discovered edges are
   where this particular wording pulls that the authored one does not. */

const ASKED = { id: 'asked', kind: 'question', ask: true, text: '', said: null, deg: 0 };
byId.asked = ASKED;
nodes.push(ASKED);

const MODNODES = nodes.filter(n => n.kind === 'module');
/* A module's words are its own plus every question filed under it: the name is
   two tokens, and the questions are most of what it is ABOUT. Built before
   ASKED has any links, so it can never contain one. */
const MBAG = new Map(MODNODES.map(m => [m, new Set([
  ...toks(m.name + ' ' + (m.claim || '')),
  ...neighbours(m).filter(x => x.kind === 'question').flatMap(x => toks(x.text)),
])]));

/* Plain token counting made `water` worth as much as `curly`, and `water` is in
   nearly every module on a water door — which is how the first version put
   things on Polarity for saying "water" at all. Weighting by how RARE a word is
   across modules is what makes a shared word evidence instead of noise. */
const DF = new Map();
for (const bag of MBAG.values()) for (const w of bag) DF.set(w, (DF.get(w) || 0) + 1);
const idf = w => Math.log(1 + MODNODES.length / (1 + (DF.get(w) || 0)));

const NEAR = 3;          // most discovered edges a question gets
const NEARFLOOR = 0.18;  // share of the query's WEIGHT a module has to carry

function lexNear(text, skip) {
  const want = toks(text);
  const total = want.reduce((a, w) => a + idf(w), 0);
  if (!total) return [];
  return MODNODES.map(m => {
    if (skip && skip.has(m)) return { m, score: 0 };
    const bag = MBAG.get(m);
    let hit = 0;
    for (const w of want) if (bag.has(w)) hit += idf(w);
    return { m, score: hit / total };
  }).filter(x => x.score >= NEARFLOOR)
    .sort((a, b) => b.score - a.score)
    .slice(0, NEAR);
}

/* Returns how many modules the question reached. ZERO IS THE ONLY MISS, and the
   caller must not open on it: a root with no neighbours draws one card on blank
   paper, which reads as the page being broken rather than as an answer. */
function openAsk(text, best, near) {
  for (let i = links.length - 1; i >= 0; i--)
    if (links[i].a === ASKED || links[i].b === ASKED) links.splice(i, 1);

  // A question may name a specimen, and inheriting it is the point of saying so.
  const inherited = best ? neighbours(best).filter(m => m.kind === 'module' || m.kind === 'protein') : [];
  for (const m of inherited) links.push({ a: m, b: ASKED, rank: rankFrom(best, m) });
  for (const { m } of near) links.push({ a: m, b: ASKED, rank: 1, near: true });

  ASKED.text = text;
  ASKED.said = best && best.text !== text ? best.text : null;
  ASKED.deg = neighbours(ASKED).length;
  if (ASKED.deg) openFrom(ASKED);
  return ASKED.deg;
}

/* ---- the vector backend -----------------------------------------------
   lib/mapcontent-vectors.json is every authored question, embedded once by
   tools/bake-vectors.js. api/find.js embeds the READER's question and returns
   just that vector; the ranking is here, because the corpus vectors ship with
   the page anyway and the floor is the knob worth tuning without a redeploy.

   MODULES COME FROM QUESTIONS, NOT FROM A BAG OF THEIR OWN. The lexical
   scorer below unions every question filed under a module into one token bag,
   which is where its noise came from: `ice` inherited the word `blood` from a
   question about freezing, so anything mentioning blood scored against it.
   Ranking whole questions and reading off THEIR modules is max-pooling instead
   of mean-pooling, and the collision has nowhere to form.

   ABSOLUTE COSINE, and it had to be measured. Everything in this corpus sits
   between 0.75 and 0.99, so the useful range is narrow — but query-to-corpus
   separates cleanly where corpus-to-corpus does not: off-map questions
   ("the capital of France", "how do I bake sourdough") land 0.79-0.83 and real
   ones land 0.87+. Normalising against the query's own distribution was tried
   and is WORSE: it ranks `asdfqwer` above a real membrane question, because a
   flat distribution has a high z at its own top. */

/* THESE FOUR ARE PROVISIONAL. They were set against ten queries, which is
   enough to see the shape and nowhere near enough to trust the numbers; the
   fixture is what should fix them. What the ten DID settle is the shape:

     · an absolute floor alone does not work. Glycolysis's best row for "how
       does my body get energy from sugar" is 0.836 and correct; Base pairing's
       for "what makes hair curly" is 0.841 and noise. No cut separates them.
     · votes alone do not work either. Counting how many of the top rows carry
       a module puts three of them on "how do I bake sourdough bread", which
       the map should refuse outright.

   So a discovered module has to clear a floor AND be corroborated: two of the
   near questions carry it, or one carries it from very close. */
const MATCH = 0.85;     // below this, the map does not answer the question
const NEARABS = 0.83;   // no module below this, however many rows name it
const NEARSOLO = 0.87;  // ...unless one row is this close, which stands alone
const NEARK = 8;        // how deep to read for discovered modules

const VEC = { by: null, key: null, online: false };

/* The tutor's visitor id, on purpose: same key, same uuid, so a reader is one
   visitor across both and clearing site data clears both. It is friction for
   the rate limit and never an identity — the browser minted it for itself. */
const VISITOR = (() => {
  const KEY = 'ss.tutor.visitor';
  try {
    let v = localStorage.getItem(KEY);
    if (!v) localStorage.setItem(KEY, v = (crypto.randomUUID ? crypto.randomUUID() : null));
    return v;
  } catch (e) { return null; }   // private window, or storage blocked
})();

(async function bootVectors() {
  VEC.key = new URLSearchParams(location.search).get('k');
  try {
    const file = await fetch('../lib/mapcontent-vectors.json').then(r => r.ok ? r.json() : null);
    if (!file) return;
    // Baked rows carry their text; the map's nodes are the things we return.
    const byText = new Map(QNODES.map(n => [n.text, n]));
    VEC.by = file.rows.map(r => ({ n: byText.get(r.text), v: r.v })).filter(x => x.n);
    /* A question whose wording changed since the bake has no vector, so it is
       simply ABSENT from search: not a wrong answer, an unreachable card, and
       nothing about it is visible from the page. Said out loud here because the
       only other way to notice is to miss a question you know is there.
       `node tools/bake-vectors.js` fixes it; --check names the rows. */
    if (VEC.by.length < QNODES.length) {
      const have = new Set(VEC.by.map(x => x.n));
      console.warn(`[composer] ${QNODES.length - VEC.by.length} question(s) have no vector `
        + 'and cannot be found by search. Re-bake: node tools/bake-vectors.js\n  '
        + QNODES.filter(n => !have.has(n)).map(n => n.text).join('\n  '));
    }
    const cfg = await fetch('/api/find', { headers: head() }).then(r => r.ok ? r.json() : null);
    VEC.online = !!(cfg && cfg.ok && cfg.task === file.task && cfg.dims === file.dims);
    if (cfg && cfg.ok && !VEC.online) console.warn('[composer] vectors and endpoint disagree; staying lexical');
  } catch (e) { /* keyless checkout, or offline: the lexical path still works */ }
  // Only says anything when it has bad news: an endpoint that is up needs no label.
  if (!VEC.online) askEl.placeholder = 'Why does ice float? (word matching)';
})();

function head() {
  const h = { 'content-type': 'application/json' };
  if (VEC.key) h['x-tutor-key'] = VEC.key;
  return h;
}

const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };

/* Returns {hits, near} the same shape the lexical path does, so nothing
   downstream knows which scorer ran. */
async function search(text) {
  if (VEC.online && VEC.by) {
    try {
      const r = await fetch('/api/find', { method: 'POST', headers: head(),
                                           body: JSON.stringify({ q: text, visitorId: VISITOR }) });
      // 429 included: a cap is not an outage, it is this session doing the rest
      // of its browsing on words. The reader is told once, by the placeholder.
      if (!r.ok) throw new Error('find ' + r.status);
      const { v } = await r.json();
      const ranked = VEC.by.map(x => ({ q: x.n, score: dot(v, x.v) }))
                           .sort((a, b) => b.score - a.score);
      const hits = ranked.filter(h => h.score >= MATCH).slice(0, HITS);
      const best = hits.length ? hits[0].q : null;
      /* Tallied over the top rows, not taken from them in order: a module two
         near questions agree on is a neighbourhood, and a module one question
         mentions is a coincidence. `covered` drops anything the match already
         inherits, so a discovered edge is never a duplicate of a solid one. */
      const covered = new Set(best ? neighbours(best) : []);
      const tally = new Map();
      for (const h of ranked.slice(0, NEARK)) {
        for (const m of neighbours(h.q)) {
          if (m.kind !== 'module' || covered.has(m)) continue;
          const t = tally.get(m) || { votes: 0, score: 0 };
          t.votes++;
          t.score = Math.max(t.score, h.score);
          tally.set(m, t);
        }
      }
      const near = [...tally]
        .filter(([, t]) => t.score >= NEARABS && (t.votes >= 2 || t.score >= NEARSOLO))
        .sort((a, b) => b[1].votes - a[1].votes || b[1].score - a[1].score)
        .slice(0, NEAR)
        .map(([m, t]) => ({ m, score: t.score }));
      return { hits, near };
    } catch (e) {
      // One failure drops this session to words rather than to nothing.
      console.warn('[composer] find failed, falling back to word matching:', e.message);
      VEC.online = false;
      askEl.placeholder = 'Why does ice float? (word matching)';
    }
  }
  const hits = lexRank(text).filter(h => h.score >= FLOOR);
  const best = hits.length ? hits[0].q : null;
  return { hits, near: lexNear(text, new Set(best ? neighbours(best) : [])) };
}

/* ---- a keyword that names a card --------------------------------------
   Measured: "polarity" scores 0.811 against this corpus and "glycolysis" 0.819,
   both under MATCH — the door's own rank 1 module, refused by name. Neither has
   a single near question either, so no floor and no vote rule rescues them: the
   corpus is QUESTIONS, and a module name is not a question. It is the one case
   where knowing beats ranking, so it is answered before any embedding.

   Deliberately narrow. Equality after normalising, or one being the other's
   prefix at five characters or more — enough for "hydrogen bond" to reach
   Hydrogen bonding, and not enough for a stray word to claim a card. */

/* Leading article dropped and each word de-pluralised, because the three things
   that actually get typed are the article ("the hydrophobic effect" as
   "hydrophobic"), the plural ("hydrogen bonds"), and the head word of a longer
   name ("protein folding" for Folding). Measured: without this, all three miss. */
const norm = t => t.toLowerCase().normalize('NFKD')
  .replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim()
  .replace(/^the /, '')
  .split(' ').map(w => (w.length > 3 && w.endsWith('s') ? w.slice(0, -1) : w)).join(' ');

/* Modules AND specimens: "hemoglobin" is a card that exists, and refusing it
   because it is not a concept is the same failure `polarity` had. A specimen's
   id is namespaced (`p:hemoglobin`), so the bare key is what gets matched. */
const CARDS = nodes.filter(n => n.kind === 'module' || n.kind === 'protein');
const NAMED = CARDS.map(m => ({ m, key: norm(m.name), id: norm(m.id.replace(/^p:/, '')) }));

/* The typed text holds the name as WHOLE WORDS: "protein folding" reaches
   Folding, "lipid bilayer" reaches The bilayer. Never a substring — `run` inside
   `running` is how a matcher starts claiming cards nobody named. */
const holds = (hay, needle) => (' ' + hay + ' ').includes(' ' + needle + ' ');

/* Three ways in, and NOT "the name contains the typed word", which was tried and
   is too loose: it let `effect` claim The hydrophobic effect and `levels` claim
   Levels of structure. A tail word is not a name. The cost is that `density`
   no longer reaches Ice & density, which is the right trade — being asked to
   type the head of a name is normal, being answered from its tail is a surprise. */
function cardNamed(text) {
  const k = norm(text);
  if (k.length < 3) return null;
  const hit = NAMED.find(x => x.key === k || x.id === k)
    || (k.length >= 5 && NAMED.find(x => x.key.startsWith(k) || holds(k, x.key)));
  return hit ? hit.m : null;
}

/* What clicking that card would have done, composed from cold: the card, its
   best band of neighbours, and the module each question leads to. Same shape
   start() and openAsk() use, so a keyword lands on a map that reads like every
   other one. */
function openCard(m) {
  clearFocus();
  stages.clear();
  for (const n of nodes) { n.visible = false; n.done = false; n.pinned = false; }
  for (const l of links) l.painted = false;
  live = []; liveLinks = [];
  world.querySelectorAll('.node').forEach(el => el.remove());
  svg.replaceChildren();

  show(m, 0, 0);
  expand(m, null, band((q, x) => x.door === DOOR.id));
  for (const n of live) refreshMeta(n);
  follow = null;
  touched = false;
  centre();
  alpha = 1;
}

/* ---- the box ---------------------------------------------------------- */

const askEl = document.getElementById('ask');
const hitsEl = document.getElementById('hits');
let hits = [], near = [], cursor = -1;
/* What the rows ARE, in the order they are drawn: -1 a named card, 0 the
   reader's own wording, 1+ an authored question. `cursor` indexes THIS, not the
   hits — three kinds of row with three index conventions is how an arrow key
   ends up opening the wrong thing. */
let order = [];

/* NOT draw(). The map's own draw() is what positions every node from the rAF
   loop, and a second `function draw` at this scope silently replaces it — the
   cards stay at the origin, stacked, with no error anywhere. */
function drawHits() {
  hitsEl.replaceChildren();
  order = [];
  const text = askEl.value.trim();
  if (!text) return;

  /* The list is what the map ALREADY says. Putting the reader's own wording on
     the map stays what Enter does, and is not a row: it is the default, so
     drawing it as a suggestion was offering the reader the thing they had
     already typed. `cursor` at -1 means nothing is highlighted and Enter takes
     that default; arrowing down starts at the first row here. */
  const card = cardNamed(text);
  order = (card ? [-1] : []).concat(hits.map((_, i) => i + 1));
  const sel = cursor < 0 ? null : order[cursor];

  if (card) {
    const li = document.createElement('li');
    li.className = 'card';
    li.setAttribute('aria-selected', sel === -1);
    li.append('Open the card: ');
    const b = document.createElement('b');
    b.textContent = card.name;
    li.append(b);
    const on = document.createElement('span');
    on.className = 'on';
    on.textContent = card.claim || '';
    li.append(on);
    li.addEventListener('click', () => choose(-1));
    hitsEl.append(li);
  }

  /* No module chips. Which cards a question opens is what the MAP shows a
     moment later, and saying it twice made a list of questions read as a list
     of metadata. */
  hits.forEach((h, i) => {
    const li = document.createElement('li');
    li.textContent = h.q.text;
    li.setAttribute('aria-selected', sel === i + 1);
    li.addEventListener('click', () => choose(i + 1));
    hitsEl.append(li);
  });

  /* Nothing to list and nothing to place is the one case that still needs a
     line: without it, Enter on a question this map cannot answer does nothing
     at all and reads as a broken box. */
  if (!order.length && !near.length) {
    const li = document.createElement('li');
    li.className = 'miss';
    li.textContent = 'Nothing here answers that yet.';
    hitsEl.append(li);
  }
}

/* Row 0 draws the reader's own question; rows 1+ open the authored one as it
   is written, with no card of the reader's on the map at all. */
function choose(i) {
  const text = askEl.value.trim();
  if (i === -1) {
    const card = cardNamed(text);
    if (!card) return;
    hitsEl.replaceChildren(); askEl.blur();
    openCard(card);
    hits = []; near = []; cursor = -1;
    return;
  }
  if (i > 0) {
    const h = hits[i - 1];
    if (!h) return;
    hitsEl.replaceChildren(); askEl.blur();
    openFrom(h.q);
    hits = []; near = []; cursor = -1;
    return;
  }
  const reach = openAsk(text, hits.length ? hits[0].q : null, near);
  if (!reach) {
    // Never open on nothing: one card on blank paper reads as a broken page.
    console.info('[composer] miss, unreachable:', text);
    return;
  }
  hitsEl.replaceChildren(); askEl.blur();
  hits = []; near = []; cursor = -1;
}

let timer = 0, seq = 0;
askEl.addEventListener('input', () => {
  clearTimeout(timer);
  const text = askEl.value.trim();
  if (!text) { hits = []; near = []; cursor = -1; hitsEl.replaceChildren(); return; }
  // Debounced because the vector path is a network call per keystroke.
  timer = setTimeout(async () => {
    // A slow reply must not overwrite a newer one: the reader has kept typing,
    // and the list they end up looking at has to be the one for what is in the
    // box. Without this the dropdown flickers back to an older query.
    const mine = ++seq;
    const found = await search(text);
    if (mine !== seq || askEl.value.trim() !== text) return;
    hits = found.hits; near = found.near; cursor = -1;
    drawHits();
  }, 220);
});

askEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    // Nothing highlighted: the default, which is the reader's own wording.
    choose(cursor < 0 ? 0 : order[cursor]);
  } else if (e.key === 'Escape') {
    askEl.value = ''; hits = []; near = []; order = []; cursor = -1;
    hitsEl.replaceChildren(); askEl.blur();
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!order.length) return;
    e.preventDefault();
    // From nothing, down lands on the first row and up on the last.
    cursor = cursor < 0
      ? (e.key === 'ArrowDown' ? 0 : order.length - 1)
      : (cursor + (e.key === 'ArrowDown' ? 1 : order.length - 1)) % order.length;
    drawHits();
  }
});

document.addEventListener('pointerdown', e => {
  if (!e.target.closest('.composer')) hitsEl.replaceChildren();
});
</script>
</body>
</html>
