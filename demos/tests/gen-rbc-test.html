<!doctype html>
<!-- requests
1. A red blood cell in three solutions: hypotonic, isotonic and hypertonic. Show what happens to the water and to the cell in each one.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tonicity in Red Blood Cells</title>
<link rel="stylesheet" href="../css/kodo.css">
<link rel="stylesheet" href="../css/lesson-shell.css">
<link rel="stylesheet" href="../graph/graph.css">
<style>
  .readout-box { margin-top: 10px; }
  .status-tag { font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../lib/palette.js"></script>
<script src="../lib/tokens-from-palette.js"></script>
<script src="../lib/molecules.js"></script>
<script src="../lib/mol-small.js"></script>
<script src="../lib/scene.js"></script>
<script src="../lib/atomkit.js"></script>
<script src="../lib/annotate.js"></script>
<script src="../kit/card-stage.js"></script>
<script src="../membrane/parts.js"></script>
<script src="../membrane/pump.js"></script>
<script src="../membrane/chemiosmosis.js"></script>
<script src="../membrane/membrane.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.16/dist/plot.umd.min.js"></script>
<script src="../graph/graph.js"></script>
<script src="../kit/lesson-shell.js"></script>
<script>
let m;
let chart = null;
let unsub = null;

const shell = LessonShell.create({
  brand: 'Cell Membrane & Tonicity',
  hint: 'Drag to rotate · Scroll to zoom',
  ctx: {},
  steps: [
    {
      eyebrow: 'Isotonic Environment',
      title: 'Equilibrium in Normal Blood Plasma',
      body: '<p><b>In an isotonic solution, solute concentration is balanced inside and outside the cell.</b> Water molecules rapidly cross the membrane in both directions via aquaporins and lipid diffusion, but there is no net flow.</p><p>A real human red blood cell is about 8 µm across and maintains its flexible biconcave disc shape in normal 300 mOsm plasma.</p>',
      nextLabel: 'Dilute Solution',
      onEnter(ctx) {
        m.set({
          contents: {
            inside: { K: 130, NA: 15, A: 10 },
            outside: { NA: 140, CL: 140 }
          }
        });
        m.notes(['aquaporin', 'water']);

        ctx.ui.controls(`
          <div class="stats">
            <div class="stat">
              <span class="stat-label">Net Water Movement</span>
              <span class="stat-value" id="net-dir">--</span>
            </div>
          </div>
          <div class="readout-box" id="chart-box"></div>
        `);
        ctx.ui.showPanel(m, { notes: ['aquaporin', 'water'], layers: ['water', 'ions'] });

        chart = Graph.mount(ctx.ui.q('#chart-box'), { live: { span: 60 }, height: 120 }).follow(m, 'water');
        unsub = m.on('frame', s => {
          const dirEl = ctx.ui.q('#net-dir');
          if (dirEl && s) dirEl.textContent = s.net.toUpperCase();
        });
      },
      onExit() {
        if (unsub) { unsub(); unsub = null; }
        if (chart) { chart.destroy(); chart = null; }
      }
    },
    {
      eyebrow: 'Hypotonic Environment',
      title: 'Net Influx in Pure or Dilute Water',
      body: '<p><b>When external solute concentration drops below the cytoplasm, free water concentration outside becomes higher.</b> Water enters down its chemical potential gradient much faster than it leaves.</p><p>Because animal cells lack rigid cell walls, continuous water influx causes a red blood cell to swell, stretch its membrane, and ultimately undergo osmotic lysis (bursting).</p>',
      nextLabel: 'Concentrated Solution',
      onEnter(ctx) {
        m.set({
          contents: {
            inside: { K: 130, NA: 15, A: 10 },
            outside: { NA: 10, CL: 10 }
          }
        });
        m.notes(['aquaporin']);

        ctx.ui.controls(`
          <div class="stats">
            <div class="stat">
              <span class="stat-label">Net Water Movement</span>
              <span class="stat-value" id="net-dir">--</span>
            </div>
          </div>
          <div class="readout-box" id="chart-box"></div>
        `);
        ctx.ui.showPanel(m, { notes: ['aquaporin'], layers: ['water', 'ions'] });

        chart = Graph.mount(ctx.ui.q('#chart-box'), { live: { span: 60 }, height: 120 }).follow(m, 'water');
        unsub = m.on('frame', s => {
          const dirEl = ctx.ui.q('#net-dir');
          if (dirEl && s) dirEl.textContent = s.net.toUpperCase();
        });
      },
      onExit() {
        if (unsub) { unsub(); unsub = null; }
        if (chart) { chart.destroy(); chart = null; }
      }
    },
    {
      eyebrow: 'Hypertonic Environment',
      title: 'Net Efflux in Concentrated Saline',
      body: '<p><b>In a hypertonic solution, external solutes bind water molecules and lower free water concentration outside.</b> Free water inside the cell now exits into the extracellular fluid.</p><p>As water rushes out, the red blood cell loses turgor and internal volume, shrinking and collapsing into a spiky morphology known as crenation.</p>',
      nextLabel: 'Back to Start',
      onEnter(ctx) {
        m.set({
          contents: {
            inside: { K: 130, NA: 15, A: 10 },
            outside: { NA: 420, CL: 420 }
          }
        });
        m.notes(['aquaporin']);

        ctx.ui.controls(`
          <div class="stats">
            <div class="stat">
              <span class="stat-label">Net Water Movement</span>
              <span class="stat-value" id="net-dir">--</span>
            </div>
          </div>
          <div class="readout-box" id="chart-box"></div>
        `);
        ctx.ui.showPanel(m, { notes: ['aquaporin'], layers: ['water', 'ions'] });

        chart = Graph.mount(ctx.ui.q('#chart-box'), { live: { span: 60 }, height: 120 }).follow(m, 'water');
        unsub = m.on('frame', s => {
          const dirEl = ctx.ui.q('#net-dir');
          if (dirEl && s) dirEl.textContent = s.net.toUpperCase();
        });
      },
      onExit() {
        if (unsub) { unsub(); unsub = null; }
        if (chart) { chart.destroy(); chart = null; }
      }
    }
  ]
});

m = Membrane.mount(shell.stage, {
  viewOffset: shell.viewOffset,
  context: 'plasma',
  units: 'mM',
  proteins: { AQP: { x: 0 }, K: null, CL: null, NA: null, pump: null, complex: null, synthase: null, leak: null },
  potential: 'off',
  cut: true
});

shell.goTo(0);
</script>
</body>
</html>
