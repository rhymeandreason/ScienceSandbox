<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mol* evaluation — stage 4 — the zoom-out ladder</title>

<!-- ===================================================================
     STAGE 4 of the Mol* evaluation. See molstar/README.md.

     folding-lab.html's act 3 zooms out at TRUE RELATIVE SCALE:
     HP35 -> villin -> the actin filament it grips -> a measured coda.
     The lesson is entirely in the ratios, so the question here is narrow:

       A. Can one Mol* scene hold four structures from four files?
       B. Does the pull-back stay honest — is a rung's size on screen
          actually its size in angstroms?
       C. Can we drive the camera between rungs from our own buttons?

     (B) is the one worth caring about. Everything here is in real
     angstroms, so "true relative scale" costs nothing as long as nobody
     re-frames each rung to fill the viewport — which is exactly what a
     viewer's "zoom to fit" would do, and would silently destroy the only
     thing act 3 teaches. The extent readout is printed per rung, measured
     from the loaded coordinates, so the claim is checkable on screen.

     NOT DONE: the headpiece rung (61 residues, between HP35 and villin) is
     a residue-range selection on the AlphaFold model rather than its own
     file, and is left out — it tests Mol*'s selection language, not its
     multi-structure or camera behaviour. The eight AlphaFold arrangements
     (villin.js) are likewise out of scope; they are a claim about
     uncertainty, and stage 3 already recorded that Mol* ships a one-click
     way to present uncertainty as motion, which villin.js argues against.
     =================================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../sandbox.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/molstar@5.11.0/build/viewer/molstar.css">

<style>
  :root{ --hb:#0042aa; --core:#c2571b; }
  [hidden]{display:none !important}
  #molstar{position:absolute;inset:0;z-index:1}
  #molstar .msp-plugin, #molstar .msp-viewport{background:transparent}
  #molstar .msp-viewport-controls{display:none !important}

  #zoom{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:6;
    background:rgba(255,255,255,.78);border:2px solid var(--ink);border-radius:10px;
    padding:10px 14px;box-shadow:0 4px 14px -6px rgba(0,0,0,.35);backdrop-filter:blur(2px);
    max-width:min(1000px,94%)}
  .zsteps{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;justify-content:center}
  .zstep{display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;
    background:#fff;border:1.5px solid var(--hair);border-radius:8px;padding:7px 11px;
    font-family:var(--font-sans);min-width:120px}
  .zstep:hover{border-color:var(--ink)}
  .zstep[aria-current="true"]{border-color:var(--hb);box-shadow:0 0 0 2px rgba(0,66,170,.15)}
  .zstep.coda[aria-current="true"]{border-color:var(--core);box-shadow:0 0 0 2px rgba(194,87,27,.15)}
  .zname{font-family:var(--font-marker);font-size:14px}
  .zsize{font-family:var(--font-slab);font-size:11px;color:var(--muted)}
  .zarrow{display:flex;align-items:center;color:var(--muted)}
  .znote{margin-top:8px;padding-top:7px;border-top:1px solid var(--hair);
    font-family:var(--font-sans);font-size:11.5px;line-height:1.45;color:#3a352f;
    text-align:center;min-height:16px}

  #diag{position:absolute;left:22px;top:22px;z-index:6;
    background:rgba(255,255,255,.85);border:1.5px solid var(--hair);border-radius:9px;
    padding:11px 14px;font-family:var(--font-slab);font-size:12px;line-height:1.6;max-width:320px}
  #diag h4{font-family:var(--font-marker);font-size:15px;margin:0 0 6px}
  #diag .row{display:flex;justify-content:space-between;gap:14px}
  #diag .k{color:var(--muted)} #diag .v{font-variant-numeric:tabular-nums;text-align:right}
  #diag .verdict{margin-top:8px;padding-top:7px;border-top:1px solid var(--hair);
    font-family:var(--font-sans);font-size:11.5px;line-height:1.45}
  .pass{color:#1a7f37} .fail{color:#b3261e}
  #diag table{border-collapse:collapse;margin-top:5px;width:100%}
  #diag td{padding:1px 0;font-size:11.5px}
  #diag td.n{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="molstar"></div>

    <div id="diag">
      <h4>stage 4 · the ladder</h4>
      <div class="row"><span class="k">structures in one scene</span><span class="v" id="d-n">—</span></div>
      <div class="row"><span class="k">load, all four</span><span class="v" id="d-load">—</span></div>
      <div class="row"><span class="k">rung switch</span><span class="v" id="d-switch">—</span></div>
      <table id="d-table"></table>
      <div class="verdict" id="d-verdict">loading…</div>
    </div>

    <div id="zoom">
      <div class="zsteps" id="zsteps"></div>
      <div class="znote" id="znote"></div>
      <div style="text-align:center;margin-top:6px;font-family:var(--font-sans);font-size:11.5px">
        <label><input type="checkbox" id="lock" checked> lock scale — show the rungs in true proportion</label>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/molstar@5.11.0/build/viewer/molstar.js"></script>
<script>
'use strict';

/* Rungs. `size` is the claim folding-lab.html makes on screen; `measured` is
   filled in from the coordinates Mol* actually loaded. Printing both is the
   point — a ladder whose rungs are not really in proportion teaches the
   opposite of what it says. */
const RUNGS = [
  { name: 'the chain you folded', size: 'HP35 · 36 residues · ~2 nm',
    url: '../folding/data/1VII.pdb', repr: 'cartoon',
    note: 'The whole of act 1 and 2. Everything past here is what it is part of.' },
  { name: 'the whole protein', size: 'villin · 826 residues · ~10 nm',
    url: '../folding/data/AF-P02640-villin.pdb', repr: 'cartoon',
    note: 'AlphaFold prediction, not a deposited structure — no full-length villin has been solved. HP35 is 4% of it.' },
  { name: 'what it grips', size: 'actin filament · 13 subunits · ~40 nm',
    url: 'data/actin-filament.pdb', repr: 'backbone',
    note: 'Five subunits were observed (9ZZI, cryo-EM 2.06 Å). The other eight are symmetry copies placed by the screw measured from that file.' },
  { name: 'measured, not predicted', size: 'villin gripping actin · X-ray 2.7 Å', coda: true,
    url: 'data/villin-actin-coda.pdb', repr: 'backbone',
    note: '9JUS — the answer the prediction could not give. Its villin is from a deep-sea vent worm; no vertebrate villin–actin structure exists.' },
];

const $ = id => document.getElementById(id);
const set = (id, t, cls) => { const e = $(id); e.textContent = t; if (cls) e.className = 'v ' + cls; };
let plugin, loaded = [], rung = 0, lockScale = true, maxExtent = 1;

boot().catch(e => { $('d-verdict').className = 'verdict fail';
                    $('d-verdict').textContent = 'failed: ' + e.message; console.error(e); });

async function boot() {
  const viewer = await molstar.Viewer.create('molstar', {
    layoutIsExpanded: false, layoutShowControls: false, layoutShowRemoteState: false,
    layoutShowSequence: false, layoutShowLog: false, layoutShowLeftPanel: false,
    viewportShowExpand: false, viewportShowSelectionMode: false,
    viewportShowAnimation: false, viewportShowTrajectoryControls: false,
  });
  plugin = viewer.plugin;

  const t0 = performance.now();
  for (const r of RUNGS) {
    const data = await plugin.builders.data.download({ url: r.url }, { state: { isGhost: true } });
    const traj = await plugin.builders.structure.parseTrajectory(data, 'pdb');
    const model = await plugin.builders.structure.createModel(traj);
    const struct = await plugin.builders.structure.createStructure(model);
    const comp = await plugin.builders.structure.tryCreateComponentStatic(struct, 'polymer');
    /* Keep the REPRESENTATION ref, not the structure's. Hiding a structure
       cell does not hide the representations hanging off it — the previous
       rung stayed on screen as a ghost until this was changed. Visibility
       lives on the thing that draws. */
    const repr = comp
      ? await plugin.builders.structure.representation.addRepresentation(comp, { type: r.repr })
      : null;
    loaded.push({ rung: r, structRef: struct.ref, reprRef: repr && repr.ref, struct });
  }
  set('d-load', (performance.now() - t0).toFixed(0) + ' ms');
  set('d-n', loaded.length + ' / ' + RUNGS.length, loaded.length === RUNGS.length ? 'pass' : 'fail');

  measureAll();
  buildButtons();
  $('lock').addEventListener('change', e => { lockScale = e.target.checked; show(rung); });
  await show(0);
  verdict();
}

/* Extent of each rung, straight off the coordinates Mol* parsed — not from
   the label, and not from anything we wrote. This is the check that the
   ladder is really a ladder. */
function measureAll() {
  const rows = [];
  for (const L of loaded) {
    const st = L.struct.data ? L.struct.data : L.struct.obj.data;
    const c = st.model.atomicConformation;
    let lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
    const n = c.x.length;
    for (let i = 0; i < n; i++) {
      const p = [c.x[i], c.y[i], c.z[i]];
      for (let k = 0; k < 3; k++) { if (p[k] < lo[k]) lo[k] = p[k]; if (p[k] > hi[k]) hi[k] = p[k]; }
    }
    const span = Math.max(hi[0]-lo[0], hi[1]-lo[1], hi[2]-lo[2]);
    L.extent = span; L.atoms = n;
    rows.push(`<tr><td>${L.rung.name}</td><td class="n">${(span/10).toFixed(1)} nm</td></tr>`);
  }
  maxExtent = Math.max(...loaded.map(L => L.extent));
  const base = loaded[0].extent;
  $('d-table').innerHTML =
    '<tr><td colspan="2" style="color:#8a7f70;padding-top:4px">measured extent · ×HP35</td></tr>' +
    loaded.map(L => `<tr><td>${L.rung.name}</td><td class="n">${(L.extent/10).toFixed(1)} nm ` +
      `· ${(L.extent/base).toFixed(1)}×</td></tr>`).join('');
}

function buildButtons() {
  const wrap = $('zsteps');
  RUNGS.forEach((r, i) => {
    if (i) {
      const a = document.createElement('span');
      a.className = 'zarrow';
      a.innerHTML = `<i class="ph-bold ${r.coda ? 'ph-dot-outline' : 'ph-caret-right'}"></i>`;
      wrap.appendChild(a);
    }
    const b = document.createElement('button');
    b.className = 'zstep' + (r.coda ? ' coda' : '');
    b.innerHTML = `<span class="zname">${r.name}</span><span class="zsize">${r.size}</span>`;
    b.addEventListener('click', () => show(i));
    wrap.appendChild(b);
  });
}

/* One rung visible at a time, and the camera pulled back to that rung's real
   extent. THE HONESTY IS IN NOT RE-FITTING: each rung is framed by its own
   angstroms, so a filament that is twenty times HP35 looks twenty times
   HP35. A "zoom to fit" per rung would fill the viewport every time and
   quietly delete the lesson. */
async function show(i) {
  const t0 = performance.now();
  rung = i;
  for (let k = 0; k < loaded.length; k++) {
    const ref = loaded[k].reprRef;
    if (!ref) continue;
    const hide = k !== i;
    if (!!plugin.state.data.cells.get(ref).state.isHidden !== hide) {
      plugin.state.data.updateCellState(ref, { isHidden: hide });
    }
  }
  /* FINDING (stage 4): commit before framing.
     Mol* does not let camera.radius stand — it recomputes it from the scene
     bounding sphere, which is lazy, so right after a visibility change it
     still describes the PREVIOUS rung. Setting a camera against it clipped
     the filament away entirely (radius 10 for a structure needing ~250).
     Committing first makes the sphere describe the rung that is now
     visible, after which our position and target are respected and the
     clipping planes are sane. It costs a scene commit per rung switch —
     acceptable at four clicks, and it would not be at 185 frames, which is
     why stage 3 computes its sphere by hand instead. */
  plugin.canvas3d.commit(true);
  frameOn(loaded[i]);
  set('d-switch', (performance.now() - t0).toFixed(1) + ' ms');

  [...document.querySelectorAll('.zstep')].forEach((b, k) =>
    b.setAttribute('aria-current', String(k === i)));
  $('znote').textContent = RUNGS[i].note;
}

function frameOn(L) {
  const c3 = plugin.canvas3d; if (!c3) return;
  const st = L.struct.data ? L.struct.data : L.struct.obj.data;
  const c = st.model.atomicConformation;
  let cx = 0, cy = 0, cz = 0; const n = c.x.length;
  for (let i = 0; i < n; i++) { cx += c.x[i]; cy += c.y[i]; cz += c.z[i]; }
  cx /= n; cy /= n; cz /= n;
  const V = molstar.lib.math.LinearAlgebra.Vec3;

  /* FINDING (stage 4): the camera direction must be chosen PER RUNG.
     Inheriting the previous rung's direction pointed the camera straight
     down the filament's helical axis, so a 40 nm filament rendered as a
     small disc — the one thing rung 4 exists to show, destroyed by an
     inherited viewing angle rather than by anything Mol* did wrong.

     Cheap fix, no PCA: look along the axis the structure is THINNEST on, so
     its longest axis lies across the screen. Exact for anything roughly
     axis-aligned, which the deposited filament is. */
  let lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  for (let i = 0; i < n; i++) {
    const p = [c.x[i], c.y[i], c.z[i]];
    for (let k = 0; k < 3; k++) { if (p[k] < lo[k]) lo[k] = p[k]; if (p[k] > hi[k]) hi[k] = p[k]; }
  }
  const span = [hi[0]-lo[0], hi[1]-lo[1], hi[2]-lo[2]];
  const thin = span.indexOf(Math.min(...span));
  const long = span.indexOf(Math.max(...span));
  const dir = [0, 0, 0]; dir[thin] = 1;
  const up = [0, 0, 0]; up[long] = 1;

  /* Radius must describe the scene, never lag it — stage 3's clipping trap. */
  /* ================= THE STAGE-4 FINDING =================
     MOL* OVERRIDES THE CAMERA POSITION. Asking for a distance of 959 put
     the camera at 179: it recomputes distance from `radius` and the field
     of view so the scene fits. Position is a suggestion; radius is the
     only real zoom control.

     That matters far more than it sounds. If radius is derived from each
     rung's own extent, every rung fills the viewport equally — HP35 and a
     filament fourteen times its length render the same size on screen, and
     act 3's entire lesson is silently deleted while every label still reads
     correctly. A viewer that always frames the scene is doing the helpful
     thing and the wrong thing.

     So the lock below is not a nicety. With it on, one radius is used for
     every rung (the largest), and the rungs are then in true proportion —
     HP35 really is a speck against the filament, which is the point. With
     it off you get the comfortable, dishonest version, kept so the two can
     be compared side by side. */
  const radius = lockScale ? maxExtent * 0.62 : L.extent * 0.62;
  const d = radius * 3.9;
  c3.camera.setState({
    target: V.create(cx, cy, cz),
    position: V.create(cx + dir[0]*d, cy + dir[1]*d, cz + dir[2]*d),
    up: V.create(up[0], up[1], up[2]),
    radius,
  });
}

function verdict() {
  const all = loaded.length === RUNGS.length && loaded.every(L => L.extent > 0);
  const ratio = loaded[2].extent / loaded[0].extent;   // filament vs HP35
  const e = $('d-verdict');
  if (all) {
    e.className = 'verdict pass';
    e.textContent = `PASS — four files in one scene, each framed by its own ångströms. `
      + `The filament measures ${ratio.toFixed(0)}× HP35, which is the ratio the lesson claims.`;
  } else {
    e.className = 'verdict fail';
    e.textContent = 'FAIL — not every rung loaded.';
  }
}
</script>
</body>
</html>
