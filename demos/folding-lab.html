<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molecule Sandbox — How a Protein Folds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="sandbox.css">
<style>
  :root{ --hb:#0042aa; --core:#c2571b; }

  /* No side panel: the two acts already say what a panel would, and the
     chain is a 121 A rod at t=0 that wants every pixel of width it can get.
     The intro that used to sit in the panel is the card's first state. */
  #app{grid-template-columns:1fr}

  /* The act caption, top-centre — which of the two mechanisms is running. */
  #act{position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:6;
    max-width:min(560px,80%);text-align:center;pointer-events:none;
    background:rgba(255,255,255,.72);border:2px solid var(--ink);border-radius:9px 12px 8px 11px;
    padding:10px 18px 11px;box-shadow:0 4px 14px -6px rgba(0,0,0,.35);backdrop-filter:blur(2px)}
  #act .actname{font-family:var(--font-marker);font-size:20px;line-height:1.1}
  #act .actbody{font-family:var(--font-sans);font-size:13.5px;line-height:1.45;
    color:#3a352f;margin-top:4px}
  #act .actname.a1{color:var(--hb)} #act .actname.a2{color:var(--core)}
  /* Intro state: bigger title, and the caveats visible before play. Once the
     fold starts the card is a running caption and must stay small. */
  #act.intro{max-width:min(640px,84%);padding:14px 22px 16px}
  #act.intro .actname{font-size:29px}
  #act.intro .actbody{font-size:14.5px;margin-top:7px}
  #act .actnote{display:none}
  #act.intro .actnote{display:block;font-family:var(--font-sans);font-size:11.5px;
    line-height:1.45;color:var(--muted);margin-top:10px;padding-top:9px;
    border-top:1px solid var(--hair);text-align:left}

  /* Transport: play/pause + scrub, bottom-centre. */
  #transport{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:6;
    display:flex;align-items:center;gap:12px;width:min(560px,82%);
    background:rgba(255,255,255,.72);border:2px solid var(--ink);border-radius:10px;
    padding:9px 15px;box-shadow:0 4px 14px -6px rgba(0,0,0,.35);backdrop-filter:blur(2px)}
  #playbtn{width:38px;height:38px;flex:0 0 auto;border-radius:50%;cursor:pointer;
    border:2px solid var(--ink);background:#fff;color:var(--ink);
    font-size:16px;display:flex;align-items:center;justify-content:center}
  #playbtn:hover{background:var(--ink);color:#fff}
  #scrub{flex:1;accent-color:var(--hb);cursor:pointer}
  #tlabel{font-family:var(--font-slab);font-size:12.5px;color:var(--muted);
    min-width:74px;text-align:right;font-variant-numeric:tabular-nums}

  /* Live H-bond tally, top-left of the stage. */
  #tally{position:absolute;left:22px;top:22px;z-index:6;pointer-events:none;
    background:rgba(255,255,255,.72);border:1.5px solid var(--hair);border-radius:9px;
    padding:9px 13px;font-family:var(--font-slab);font-size:13px;line-height:1.5}
  #tally .big{font-size:23px;color:var(--hb);font-weight:700;
    font-variant-numeric:tabular-nums}
  #tally .sub{color:var(--muted);font-size:11.5px}

  #toggles{position:absolute;right:20px;bottom:24px;z-index:6;display:flex;
    flex-direction:column;align-items:flex-end;gap:7px}
  #toggles label{display:flex;align-items:center;gap:6px;font-size:12.5px;opacity:.8;
    cursor:pointer;background:rgba(255,255,255,.7);border:1.5px solid var(--hair);
    border-radius:8px;padding:6px 10px}

  /* Load curtain. Only covers two fetches now that the trajectory is a
     committed file (tools/bake-fold.js) — on a warm cache it barely shows. */
  #loading{position:absolute;inset:0;z-index:20;display:flex;align-items:center;
    justify-content:center;background:rgba(253,250,243,.92);
    font-family:var(--font-hand);font-size:22px;color:var(--muted)}
  #loading.done{display:none}

  @media (max-width:920px){
    #act{top:12px;max-width:90%} #transport{width:90%;bottom:14px}
    #tally{left:12px;top:auto;bottom:76px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="act" class="intro"><div class="actname"></div>
      <div class="actbody"></div><div class="actnote"></div></div>
    <div id="tally"><span class="big" id="hbcount">0</span> / 14 hydrogen bonds
      <div class="sub" id="hbsub">holding the chain</div></div>
    <div id="transport">
      <button id="playbtn" aria-label="play or pause"><i class="ph-bold ph-play"></i></button>
      <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="fold progress">
      <span id="tlabel">unfolded</span>
    </div>
    <div id="toggles">
      <label><input type="checkbox" id="showhb" checked> hydrogen bonds</label>
      <label><input type="checkbox" id="showcore" checked> hydrophobic core</label>
      <label><input type="checkbox" id="spin"> spin</label>
    </div>
    <button id="savepng"><i class="ph-bold ph-download-simple"></i> PNG</button>
    <div id="loading">loading…</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="palette.js"></script>
<script src="molecules.js"></script>
<script src="scene.js"></script>
<script src="fx.js"></script>
<script src="folding.js"></script>
<script>
"use strict";
/* =============================================================
 *  HOW A PROTEIN FOLDS — villin headpiece subdomain (PDB 1VII)
 *
 *  The science, the honesty caveats and the solver all live in folding.js;
 *  read its header first. This file is only the page: it renders what the
 *  solver produces and says what is happening.
 *
 *  WHY THIS IS A Three.js PAGE AND NOT A pdb.js ONE. protein-lab.html draws
 *  deposited structures through vendored ChemDoodle, which cannot animate
 *  coordinates or draw our own hydrogen-bond dashes — and which is GPLv3.
 *  Here the chain moves every frame and the dashes ARE the lesson, so the
 *  page draws with scene.js like the rest of the sandbox and stays clear of
 *  the GPL. It loads no mol-*.js: every coordinate comes from pdb/1VII.pdb
 *  at real angstrom scale, so MolLib is here for PALETTE alone.
 *
 *  RELATIONSHIP TO protein-lab.html. That page shows the four LEVELS of
 *  protein structure standing still. This one shows the two MECHANISMS that
 *  produce the first three, and why level 2 and level 3 are not the same
 *  kind of thing. Whichever order they are taught in, this is the "why" and
 *  that is the "what".
 * ============================================================= */

const PAL = MolLib.PALETTE;
const CORE_RESIDUES = [47, 51, 58];        // the three phenylalanines
const CORE_COLOR = 0xc2571b;

/* Display radii, in ANGSTROMS, derived from the house palette rather than
   chosen here. Every other page draws in a space where 1 A = MolLib.SCALE
   units, so PALETTE.radii are in those units; this page works in real
   angstroms, and the conversion is the division. Doing it by hand is what
   went wrong the first time: hand-picked radii came out 1.32x too small
   against real bond lengths, which does not read as "small atoms" but as
   "long bonds", and it also lost the palette's O > N > C ordering. Derived,
   it cannot drift — retune PALETTE and this page follows.

   These are display radii, not van der Waals radii, and they belong to the
   PAGE: folding.js renders nothing and has no business holding them. */
const RADII = {};
for (const el of ['C', 'N', 'O', 'H']) RADII[el] = PAL.radii[el] / MolLib.SCALE;

/* Bond radius is likewise the house ratio, not a free number: the sandbox
   draws sticks at about 0.165x the radius of the atoms they join. */
const STICK = RADII.C * 0.165;
const CORE_STICK = STICK * 0.85;           // side chains a touch finer
const PLAY_SECONDS = 15;                   // wall-clock length of one fold

const canvas = document.getElementById('gl');
let userSpun = false;
/* Once the student wheels the camera themselves, the per-frame auto-framing
   stops for good — otherwise every frame would yank their chosen zoom back,
   which reads as the page fighting them. Orbiting is left alone: it does not
   conflict with a solved distance. */
let userZoom = false;
const { scene, camera, renderer, root, cam, applyCam, resize } = Stage.create(canvas, {
  /* theta=0 is not a taste call. folding.js's orient() rotates the whole
     fold so the extended chain lies along world X, and the orbit's `right`
     vector is (-cos theta, 0, sin theta) — so theta=0 puts `right` exactly on
     X and the chain exactly horizontal on screen, at any elevation. Any other
     azimuth reintroduces the diagonal this page was fighting. */
  cam: { theta: 0, phi: 1.18, r: 46 }, phiMin: 0.3, phiMax: 2.7,
  rMin: 4, rMax: 200,
  onDrag: () => { userSpun = true; },
  onZoom: () => { userZoom = true; } });
const FXi = FX.create(THREE, root, camera);

/* ---------- state ---------- */
let parsed = null, hb = null, traj = null;
let t = 0, playing = false, lastFormed = null;
/* false until the student first plays or scrubs — drives the card's intro state */
let started = false;
const atomMeshes = [], bondMeshes = [], hbGroups = [];

/* ---------- load ----------
   Two fetches, no solving. The PDB gives the topology to draw (which atoms,
   which bonds, which pairs are hydrogen-bonded); the .bin gives the whole
   precomputed trajectory. Nothing here recomputes the fold — see
   tools/bake-fold.js for why it is a committed file rather than work the
   browser repeats on every visit. */
Promise.all([
  fetch('pdb/1VII.pdb').then(r => {
    if (!r.ok) throw new Error('pdb/1VII.pdb — HTTP ' + r.status);
    return r.text(); }),
  fetch('pdb/1VII.fold.bin').then(r => {
    if (!r.ok) throw new Error('pdb/1VII.fold.bin — HTTP ' + r.status +
      ' (run: node tools/bake-fold.js)');
    return r.arrayBuffer(); }),
]).then(([text, bin]) => {
  parsed = FoldLib.parse(text, { sideChains: CORE_RESIDUES });
  hb = FoldLib.hbonds(parsed);
  traj = FoldLib.decode(bin);

  /* The baked file and the structure must describe the same molecule. They
     can drift apart in exactly one way — someone edits CORE_RESIDUES here
     without re-running the bake — and the failure is silent and ugly: atom
     positions read off by an offset, so the protein renders as a tangle.
     Cheap to check, impossible to debug from the picture. */
  if (traj.atoms !== parsed.nodes.length)
    throw new Error(`baked fold has ${traj.atoms} atoms, structure has ` +
      `${parsed.nodes.length} — re-run: node tools/bake-fold.js`);
  if (traj.formed[0].length !== hb.length)
    throw new Error(`baked fold has ${traj.formed[0].length} H-bonds, ` +
      `structure has ${hb.length} — re-run: node tools/bake-fold.js`);

  build(); seek(0);
  document.getElementById('loading').classList.add('done');
}).catch(e => {
  document.getElementById('loading').textContent = 'could not start — ' + e.message;
});

/* ---------- build the scene ---------- */
function build() {
  const isCore = i => CORE_RESIDUES.includes(parsed.nodes[i].res) &&
                      !['N','CA','C','O','H'].includes(parsed.nodes[i].name);

  parsed.nodes.forEach((nd, i) => {
    const col = isCore(i) ? CORE_COLOR : (PAL.atoms[nd.el] || 0x888888);
    const m = Stage.atom(col, RADII[nd.el] || 0.3,
                         new THREE.Vector3(...nd.native), nd.el);
    m.userData.core = isCore(i);
    root.add(m); atomMeshes.push(m);
  });

  /* Bonds are rebuilt in place every frame rather than recreated: one
     cylinder per bond, repositioned and re-aimed. Bond LENGTHS are held
     fixed by the solver's constraints, so a cylinder's scale never has to
     change and the geometry can be shared. */
  parsed.bonds.forEach(([i, j]) => {
    const core = isCore(i) || isCore(j);
    const L = FoldLib._v3.dist(parsed.nodes[i].native, parsed.nodes[j].native);
    const r = core ? CORE_STICK : STICK;
    const geo = new THREE.CylinderGeometry(r, r, L, 10);
    const m = new THREE.Mesh(geo, Stage.bondMat(core ? CORE_COLOR : PAL.bonds.covalent));
    m.userData = { i, j, core };
    root.add(m); bondMeshes.push(m);
  });

  /* One hydrogen bond = a row of short dashes from the carbonyl O to the
     amide H. Dashes rather than a stick, because an H-bond is not a
     covalent bond and must never read as one — the same convention the
     solvation pages use (SCIENCE.md §5). */
  const DASHES = 5;
  hb.forEach(b => {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: PAL.bonds.hbond,
      roughness: .5, transparent: true, opacity: 0 });
    for (let k = 0; k < DASHES; k++) {
      /* Thinner than a covalent stick, and that is chemical rather than
         decorative: a hydrogen bond is the weaker interaction, so it must
         never out-weigh the bonds holding the backbone together. Colour is
         what makes it prominent (SCIENCE.md §5), not width. */
      const d = new THREE.Mesh(new THREE.CylinderGeometry(STICK*0.8, STICK*0.8, 1, 8), mat);
      g.add(d);
    }
    g.userData = { b, mat };
    root.add(g); hbGroups.push(g);
  });
}

/* ---------- camera ----------
   THE CAMERA MOVES IN, because the molecule shrinks 5.4x as it folds. A
   single framing cannot serve both ends: fit the extended chain and the
   folded bundle is a speck for the whole second half; fit the bundle and
   the chain is off-screen for the whole first half. So the framing is
   solved PER FRAME against the chain's actual extent at that moment, which
   keeps it filling the stage throughout and makes the collapse read as the
   protein compacting rather than the camera retreating.

   Still never hand-tuned — every distance comes from Stage.frame solving
   the real frustum (CLAUDE.md). The extents are measured once at load from
   the baked keyframes, so this costs a lerp per frame, not a scan.

   No re-targeting: the fold's centroid does not move (folding.js recentres
   the extended start on the deposited centroid), measured at 0.00 A drift
   across the whole trajectory. Only the distance changes. */
/* Fitted in SCREEN space, not by a bounding cylinder. Stage.frame models a
   molecule as (radius in xz, half-height in y), which is invariant to how the
   camera is turned — fine for a compact molecule, useless here: at t=0 this
   chain is a 121 A rod lying diagonally, and the cylinder model reports it as
   a 54 A-radius blob, framing it as though it were as deep as it is long. The
   result was a rod occupying a third of a wide canvas.

   So project every atom onto the camera's own right/up axes and fit those
   half-extents directly. Still solved from the real frustum rather than
   hand-picked — CLAUDE.md's rule is against magic numbers, not against
   measuring the right thing — and it now exploits a wide stage properly,
   because a rod that is wide and thin is finally described as wide and thin.
   Recomputed per frame from live positions, so it stays correct when the
   student orbits, which a precomputed table could not.

   The reserves are in PIXELS because what they clear is HTML chrome: the
   caption card above and the transport below sit at fixed pixel offsets, so a
   world-space band would over-reserve when zoomed in and under-reserve when
   zoomed out.

   ROTATION DELIBERATELY DOES NOT REFIT. The fit depends on the camera basis,
   so re-solving it while the student drags would change the distance as they
   turn — and on a rod that is violent: a quarter turn about the vertical takes
   the projected width from 64 A to about 2, so the camera lunges. Worse,
   scene.js calls onDrag BEFORE it updates cam.theta/phi, so a refit from
   there solves the previous angle and the distance trails the rotation by one
   pointer event, which is what made it read as a random jolt rather than a
   glide. Distance is driven by `t` alone: dragging turns the molecule and
   nothing else. The next seek refits against whatever angle the student left
   it at, so playback still frames correctly afterwards. */
const RESERVE = { top: 118, intro: 172, bottom: 96 };
const FIT_THETA = cam.theta, FIT_PHI = cam.phi;   // captured before any drag
const _right = new THREE.Vector3(), _up = new THREE.Vector3(), _fwd = new THREE.Vector3();
const MAX_R = Math.max(...Object.values(RADII));   // biggest display radius, in angstroms

function frameFrom(P) {
  if (userZoom || !P) return;
  const h = canvas.clientHeight, w = canvas.clientWidth;
  if (!h || !w) return;

  /* Fitted from the CANONICAL basis, not the live one, so cam.r is a pure
     function of t. Using the live basis is what coupled rotation into
     distance; see the note above. A student who turns the chain end-on now
     simply sees it foreshortened, which is what turning it actually does,
     instead of the camera chasing the projection. */
  _fwd.set(Math.sin(FIT_PHI) * Math.sin(FIT_THETA),
           Math.cos(FIT_PHI),
           Math.sin(FIT_PHI) * Math.cos(FIT_THETA)).normalize();
  _right.crossVectors(_fwd, new THREE.Vector3(0, 1, 0));
  if (_right.lengthSq() < 1e-8) _right.set(1, 0, 0);     // camera straight overhead
  _right.normalize();
  _up.crossVectors(_right, _fwd).normalize();

  let halfW = 0, halfH = 0;
  for (let i = 0; i < P.length; i++) {
    const p = P[i];
    halfW = Math.max(halfW, Math.abs(p.x*_right.x + p.y*_right.y + p.z*_right.z));
    halfH = Math.max(halfH, Math.abs(p.x*_up.x    + p.y*_up.y    + p.z*_up.z));
  }
  // extents are to sphere CENTRES; without this the outer atoms clip in half
  halfW += MAX_R; halfH += MAX_R;

  // give back the pixels the chrome covers, by asking the frustum for more
  const top = (document.getElementById('act').classList.contains('intro')
               ? RESERVE.intro : RESERVE.top);
  const usable = Math.max(0.25, (h - top - RESERVE.bottom) / h);
  halfH /= usable;

  const tan = Math.tan(camera.fov * Math.PI / 360);
  const d = Math.max(halfH / tan, halfW / (tan * camera.aspect)) * 1.06;
  cam.r = Math.max(6, Math.min(220, d));
  applyCam();
}

function frameAt(tt) { if (traj) frameFrom(posOf(tt)); }
new ResizeObserver(() => { resize(); frameAt(t); }).observe(canvas);

/* ---------- sample the baked trajectory ---------- */
/* Playback reads stored coordinates and lerps between keyframes; no physics
   runs after load. That is what makes scrubbing instant, so a student can
   drag back and forth across the moment a helix closes. */
const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _m = new THREE.Vector3();
const posOf = (() => {
  const out = [];
  return function (tt) {
    const x = Math.max(0, Math.min(1, tt)) * (traj.count - 1);
    const k0 = Math.floor(x), k1 = Math.min(traj.count - 1, k0 + 1), f = x - k0;
    const A = traj.key[k0], B = traj.key[k1];
    for (let i = 0; i < traj.atoms; i++) {
      out[i] = out[i] || new THREE.Vector3();
      out[i].set(A[i*3]   + (B[i*3]   - A[i*3])   * f,
                 A[i*3+1] + (B[i*3+1] - A[i*3+1]) * f,
                 A[i*3+2] + (B[i*3+2] - A[i*3+2]) * f);
    }
    return out;
  };
})();

function formedAt(tt) {
  const x = Math.max(0, Math.min(1, tt)) * (traj.count - 1);
  const k0 = Math.floor(x), k1 = Math.min(traj.count - 1, k0 + 1), f = x - k0;
  const A = traj.formed[k0], B = traj.formed[k1];
  return Array.from(A, (v, i) => v + (B[i] - v) * f);
}

function seek(tt) {
  t = Math.max(0, Math.min(1, tt));
  const P = posOf(t), formed = formedAt(t);

  atomMeshes.forEach((m, i) => m.position.copy(P[i]));

  bondMeshes.forEach(m => {
    const a = P[m.userData.i], b = P[m.userData.j];
    _m.addVectors(a, b).multiplyScalar(0.5);
    m.position.copy(_m);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0),
      _a.subVectors(b, a).normalize());
  });

  const showHB = document.getElementById('showhb').checked;
  hbGroups.forEach((g, k) => {
    const b = g.userData.b, amt = formed[k];
    g.visible = showHB && amt > 0.02;
    g.userData.mat.opacity = Math.min(1, amt) * 0.92;
    if (!g.visible) return;
    const O = P[b.o], H = P[b.h];
    const n = g.children.length;
    for (let d = 0; d < n; d++) {
      const f0 = (d + 0.15) / n, f1 = (d + 0.85) / n;
      _a.lerpVectors(O, H, f0); _b.lerpVectors(O, H, f1);
      const seg = g.children[d];
      seg.position.copy(_m.addVectors(_a, _b).multiplyScalar(0.5));
      const dir = new THREE.Vector3().subVectors(_b, _a);
      seg.scale.set(1, dir.length(), 1);
      seg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    }
  });

  // a ring at the moment a bond first closes — the event the lesson is about
  if (lastFormed) hb.forEach((b, k) => {
    if (lastFormed[k] < 0.5 && formed[k] >= 0.5)
      FXi.spawnRing(P[b.h].clone(), PAL.bonds.hbond);
  });
  lastFormed = formed;

  /* Readout first: it sets the card's intro/caption state, and frameFrom
     reserves a different pixel band for each. Framing first would size one
     frame against the state the card is leaving. */
  updateReadout(formed);
  frameFrom(P);
}

/* ---------- the card ----------
   One card, three states. Before play it is the page's title and standfirst
   (there is no side panel to put them in, and a student needs to know what
   they are looking at before it starts moving); during the fold it is a
   running caption for whichever mechanism is currently doing the work. */
const INTRO = {
  name: 'How a protein folds',
  body: 'This is <b>villin headpiece</b> — 36 amino acids, one of the smallest ' +
        'things that folds like a real protein. Press play and watch the chain ' +
        'build itself. <b>Two different forces do the work, one after the ' +
        'other</b>, and telling them apart is the whole lesson.',
  /* The caveats belong where a student can see them, not only in a source
     comment — folding.js's header explains each at length. Shown before play
     because that is when there is room; the running caption must stay small. */
  note: '<b>What this animation fakes:</b> real folding is thermal chaos over about ' +
        '4 microseconds, not a smooth collapse. The <i>order</i> of events is right; ' +
        'the path is not. And act 2’s core is drawn as an attraction between the ' +
        'phenylalanines, when the real cause is water pushing them together.',
};

const ACTS = [
  { name: 'Act 1 · hydrogen bonds coil the chain',
    body: 'Each C=O grabs the N–H four residues down. Three separate stretches spiral into α-helices.' },
  { name: 'Act 2 · water packs the helices together',
    body: 'No hydrogen bond runs between helices. The three phenylalanines hide from water, and the bundle closes.' },
];

function updateReadout(formed) {
  const s = FoldLib.SCHEDULE(t);
  const act = document.getElementById('act');
  const intro = !started;
  const a = intro ? INTRO : ACTS[s.act - 1];

  act.classList.toggle('intro', intro);
  act.querySelector('.actname').className = 'actname' + (intro ? '' : ' a' + s.act);
  act.querySelector('.actname').textContent = a.name;
  act.querySelector('.actbody').innerHTML = a.body;
  act.querySelector('.actnote').innerHTML = intro ? INTRO.note : '';

  const nf = formed.filter(x => x > 0.5).length;
  document.getElementById('hbcount').textContent = nf;
  document.getElementById('hbsub').textContent =
    nf === 0 ? 'chain is extended' :
    s.act === 1 ? 'coiling the helices' : 'helices done — core packing';

  document.getElementById('tlabel').textContent =
    t <= 0.001 ? 'unfolded' : t >= 0.999 ? 'folded' : Math.round(t * 100) + '%';
  document.getElementById('scrub').value = Math.round(t * 1000);
}

/* ---------- transport ---------- */
const playBtn = document.getElementById('playbtn'), scrub = document.getElementById('scrub');
function setPlaying(p) {
  playing = p;
  playBtn.innerHTML = '<i class="ph-bold ph-' + (p ? 'pause' : 'play') + '"></i>';
}
playBtn.addEventListener('click', () => {
  if (!traj) return;
  started = true;
  if (t >= 0.999 && !playing) { lastFormed = null; seek(0); }
  setPlaying(!playing);
});
scrub.addEventListener('input', () => {
  if (!traj) return;
  setPlaying(false);
  started = true;
  lastFormed = null;                       // no ring storm while dragging
  seek(+scrub.value / 1000);
});
document.getElementById('showhb').addEventListener('change', () => seek(t));
document.getElementById('showcore').addEventListener('change', e => {
  atomMeshes.forEach(m => { if (m.userData.core) m.visible = e.target.checked; });
  bondMeshes.forEach(m => { if (m.userData.core) m.visible = e.target.checked; });
});
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
});

/* ---------- render loop ---------- */
let last = performance.now();
(function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (playing && traj) {
    const nt = t + dt / PLAY_SECONDS;
    if (nt >= 1) { seek(1); setPlaying(false); } else seek(nt);
  }
  if (document.getElementById('spin').checked && !userSpun) {
    cam.theta += dt * 0.25; applyCam();
  }
  FXi.step();
  renderer.render(scene, camera);
})(performance.now());

/* ---------- PNG ---------- */
document.getElementById('savepng').addEventListener('click', () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = 'protein-folding.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
});
</script>
</body>
</html>
