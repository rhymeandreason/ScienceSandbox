<!DOCTYPE html>
<!-- Internal tool: edit lib/mapcontent.js's QUESTIONS — the wording, which
     concepts each question names, and the rank it carries on each.

     Saves through the dev server's /api/mapcontent, which lives in
     tools/dev-server.js and nowhere else, so this page can only write on a
     machine running that server. Without it the page is read-only and Export
     hands back the file text instead. Kept out of the deploy by .vercelignore.

     WHAT THIS IS FOR, AND WHY IT COUNTS CROSSINGS. The map goes concept →
     question → concept: a question is the CROSSING, and one that names a single
     concept is a caption that costs a node and leads nowhere. 28 of the 63 are
     still that. So every row wears what it joins, the filters are cut by it,
     and the bar keeps the running score — the editorial work is turning
     captions into crossings, and a tool that did not show the number would hide
     the only thing worth watching.

     It does NOT edit DOORS, CONCEPTS or VIEWS. mapcontent-io.js splices only the
     QUESTIONS array back, so a save cannot touch a concept's claim or the prose
     that states the curation rules. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map — questions and crossings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --sans: 'Futura', 'Futura PT', 'Jost', -apple-system, 'Segoe UI', sans-serif;
    --serif: 'Literata', Georgia, serif;
    --paper:  #faf8f4;
    --ink:    #14161a;
    --muted:  #6d6f76;
    --line:   #e4e0d7;
    --card:   #ffffff;
    --accent: #1f5f4f;
    --spark:  #e2643a;
  }
  * { box-sizing: border-box; }
  body { font-family: var(--sans); background: var(--paper); color: var(--ink);
         margin: 0; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 78rem; margin: 0 auto; padding: 0 clamp(1rem, 3vw, 2rem) 4rem; }

  .mast { display: flex; align-items: baseline; gap: 1rem; padding: 1.1rem 0 0.7rem; }
  .logo { font-size: 1.5rem; font-weight: 500; letter-spacing: -0.04em; margin: 0;
          text-transform: lowercase; text-decoration: none; color: inherit; }
  .logo em { font-style: normal; color: var(--accent); }
  .logo .dot { color: var(--spark); }
  .mast .title { font-family: var(--serif); font-size: 0.95rem; color: var(--muted); }
  .mast .spacer { flex: 1; }

  .btn { font-family: var(--sans); font-size: 0.68rem; font-weight: 500;
         letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
         background: var(--card); border: 1px solid var(--line); border-radius: 3px;
         padding: 0.45rem 0.75rem; cursor: pointer; text-decoration: none;
         transition: color .15s, border-color .15s; }
  .btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.primary { color: var(--card); background: var(--accent); border-color: var(--accent); }
  .btn.primary:hover:not(:disabled) { color: var(--card); }

  .bar[hidden] { display: none; }   /* display:flex below beats the UA rule */
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center;
         gap: 0.5rem; flex-wrap: wrap; padding: 0.7rem 0;
         background: var(--paper); border-bottom: 1px solid var(--line); }
  select, input[type=search] {
    font-family: var(--sans); font-size: 0.8rem; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 3px;
    padding: 0.4rem 0.5rem; }
  input[type=search] { min-width: 14rem; }

  /* The score, and it is the point of the page rather than a decoration. */
  .score { font-size: 0.7rem; letter-spacing: 0.04em; color: var(--muted); }
  .score b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .score .cap { color: var(--spark); }
  .score .cross { color: var(--accent); }
  .dirty { color: var(--spark); font-size: 0.7rem; letter-spacing: 0.1em;
           text-transform: uppercase; }

  .row { display: grid; grid-template-columns: 1fr 22rem; gap: 1rem;
         align-items: start; padding: 0.7rem 0; border-bottom: 1px solid var(--line); }
  .row.caption { background: linear-gradient(90deg, rgba(226,100,58,.05), transparent 60%); }
  .q { width: 100%; font-family: var(--serif); font-size: 1rem; line-height: 1.3;
       color: var(--ink); background: transparent; border: 1px solid transparent;
       border-radius: 3px; padding: 0.3rem 0.4rem; resize: none; overflow: hidden; }
  .q:hover { border-color: var(--line); }
  .q:focus { outline: none; border-color: var(--accent); background: var(--card); }
  .q.bad { border-color: var(--spark); }

  .tag { font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
         color: var(--muted); margin-top: 0.35rem; display: flex; gap: 0.6rem; }
  .tag .cap { color: var(--spark); }

  /* Which concepts a question names, and the rank on each. The rank belongs to
     the EDGE, so it is drawn on the concept chip and never on the question. */
  .edges { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .chip { display: inline-flex; align-items: center; gap: 0.3rem;
          font-size: 0.66rem; letter-spacing: 0.02em;
          background: var(--card); border: 1px solid var(--line); border-radius: 3px;
          padding: 0.15rem 0.2rem 0.15rem 0.45rem; }
  .chip .dr { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
  .chip select { font-size: 0.66rem; padding: 0.05rem 0.1rem; border-color: transparent;
                 background: transparent; }
  .chip button { font-size: 0.75rem; line-height: 1; color: var(--muted);
                 background: none; border: 0; cursor: pointer; padding: 0 0.15rem; }
  .chip button:hover { color: var(--spark); }
  .chip.away { background: var(--paper); }
  .addmod { font-size: 0.66rem; padding: 0.15rem 0.3rem; }

  .tabs { display: flex; gap: 0.3rem; padding: 0.2rem 0 0; }
  .tab { font-family: var(--sans); font-size: 0.68rem; font-weight: 500;
         letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
         background: none; border: 0; border-bottom: 2px solid transparent;
         padding: 0.4rem 0.6rem; cursor: pointer; }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); }

  /* A concept row leads with what the door opens on, because that is the one
     field here that changes the map's first screen. */
  .crow { display: grid; grid-template-columns: 7rem 1fr 11rem; gap: 1rem;
          align-items: start; padding: 0.7rem 0; border-bottom: 1px solid var(--line); }
  .crow.starter { background: linear-gradient(90deg, rgba(31,95,79,.06), transparent 55%); }
  .crow .idc { font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
               color: var(--muted); padding-top: 0.45rem; }
  .crow input.name { width: 100%; font-family: var(--sans); font-size: 0.86rem;
                     font-weight: 500; color: var(--ink); background: transparent;
                     border: 1px solid transparent; border-radius: 3px; padding: 0.25rem 0.4rem; }
  .crow textarea.claim { width: 100%; font-family: var(--serif); font-size: 0.92rem;
                         line-height: 1.3; color: var(--ink); background: transparent;
                         border: 1px solid transparent; border-radius: 3px;
                         padding: 0.25rem 0.4rem; resize: none; overflow: hidden; }
  .crow input:hover, .crow textarea:hover { border-color: var(--line); }
  .crow input:focus, .crow textarea:focus { outline: none; border-color: var(--accent);
                                            background: var(--card); }
  .crow .side { display: flex; flex-direction: column; gap: 0.3rem; align-items: flex-end; }
  .crow .side select { width: 100%; }
  .crow .qn { font-size: 0.62rem; letter-spacing: 0.06em; color: var(--muted); }
  /* Quieter than the claim: an alt list is a lookup key, not a sentence anybody
     reads. Same box, so the row stays one column. */
  .crow input.alt { width: 100%; font-family: var(--sans); font-size: 0.72rem;
                    color: var(--muted); background: transparent;
                    border: 1px solid transparent; border-radius: 3px;
                    padding: 0.2rem 0.4rem; }
  .crow input.alt::placeholder { color: var(--line); }
  /* An id is editable ONLY before its first save, so it looks like a field then
     and like a label ever after. Same column, same size: the row must not jump
     when the concept lands. */
  .crow input.idc { font-family: var(--sans); text-transform: lowercase;
                    background: var(--card); border: 1px solid var(--line);
                    border-radius: 3px; padding: 0.25rem 0.4rem; width: 100%;
                    margin-top: 0.2rem; }
  .crow input.idc.bad { border-color: var(--spark); }
  .crow .why { font-size: 0.58rem; line-height: 1.3; color: var(--spark);
               margin-top: 0.25rem; }
  /* On hover, because it is the rarest thing done on this screen and one per
     row made a destructive action the most repeated element on the page. Faded
     rather than absent, so nothing reflows as the cursor runs down the list. A
     fresh row keeps its own: that row is how you back out of an accidental
     + concept, and hunting for it is not the moment to hide it. */
  .crow .del { align-self: flex-end; padding: 0.1rem 0.35rem;
               opacity: 0; transition: opacity .15s ease; }
  .crow:hover .del, .crow:focus-within .del, .crow.fresh .del { opacity: 1; }
  .crow.fresh { background: linear-gradient(90deg, rgba(193,138,30,.10), transparent 55%); }

  .empty { padding: 3rem 0; text-align: center; color: var(--muted);
           font-family: var(--serif); }
  .note { font-family: var(--serif); font-size: 0.9rem; color: var(--muted);
          margin: 0.8rem 0 0; max-width: 46rem; }
  .note code { font-family: var(--sans); font-size: 0.82rem; color: var(--accent); }
  .msg { margin: 0.6rem 0 0; font-size: 0.8rem; }
  .msg.bad { color: var(--spark); }
  .msg.ok { color: var(--accent); }
  textarea.dump { width: 100%; height: 22rem; font-family: ui-monospace, monospace;
                  font-size: 0.72rem; margin-top: 0.8rem; }
</style>
</head>
<body>
<div class="wrap">

<header class="mast">
  <a class="logo" href="admin.html">kodo<em>lab</em><span class="dot">.</span></a>
  <span class="title">map — questions and crossings</span>
  <span class="spacer"></span>
  <a class="btn" href="tests/door-map.html">Open the map</a>
</header>

<div class="tabs">
  <button class="tab on" data-pane="questions">Questions</button>
  <button class="tab" data-pane="concepts">Concepts</button>
</div>

<div class="bar" id="qbar">
  <select id="door"></select>
  <select id="concept"></select>
  <select id="kind">
    <option value="all">every question</option>
    <option value="caption">captions only (1 concept)</option>
    <option value="cross">crossings only (2+)</option>
    <option value="doors">door crossings (2+ doors)</option>
  </select>
  <input type="search" id="find" placeholder="find a question…">
  <span class="spacer" style="flex:1"></span>
  <span class="score" id="score"></span>
  <span class="dirty" id="dirty"></span>
  <button class="btn" id="add">+ question</button>
  <button class="btn" id="revert">Revert</button>
  <button class="btn" id="export">Export</button>
  <button class="btn primary" id="save">Save</button>
</div>

<!-- The concepts screen. Separate rather than a column on the questions list,
     because the two are edited in different sittings: wording and edges is bulk
     work down a list, and a concept's rank is one decision that changes what the
     door OPENS with. They save independently for the same reason — the io
     splices each array on its own, so one screen never writes back a stale copy
     of the other's. -->
<div class="bar" id="cbar" hidden>
  <select id="cdoor"></select>
  <button class="btn" id="cadd">+ concept</button>
  <span class="spacer" style="flex:1"></span>
  <span class="score" id="cscore"></span>
  <span class="dirty" id="cdirty"></span>
  <button class="btn" id="crevert">Revert</button>
  <button class="btn primary" id="csave">Save</button>
</div>

<p class="note" id="note"></p>
<p class="msg" id="msg"></p>

<div id="list"></div>
<div id="clist" hidden></div>

<script>
/* ---- state -------------------------------------------------------------
   `rows` is the working copy and the file on disk is the other one; nothing
   is written until Save, and Revert throws the working copy away. `mtimeMs`
   is what the save is checked against, so two editors cannot silently
   overwrite each other. */

let rows = [], base = '', concepts = [], doors = [], viewIds = [];
let writable = false, mtimeMs = null;

const $ = id => document.getElementById(id);
const byConcept = id => concepts.find(m => m.id === id);
const say = (t, cls) => { const m = $('msg'); m.textContent = t || ''; m.className = 'msg ' + (cls || ''); };

/* One concept is a caption, two or more is a crossing, and two or more DOORS is
   the crossing the map exists for. Computed the same way tools/mapcontent-io.js
   computes it, because the bar's score and any checker have to agree. */
function reach(r) {
  const ids = Object.keys(r.concepts || {}).filter(byConcept);
  const ds = new Set(ids.map(id => byConcept(id).door));
  return { concepts: ids.length, doors: ds.size };
}

function score() {
  const all = rows.map(reach);
  const cap = all.filter(a => a.concepts === 1).length;
  const cross = all.filter(a => a.concepts > 1).length;
  const dd = all.filter(a => a.doors > 1).length;
  $('score').innerHTML =
    '<b>' + rows.length + '</b> questions · ' +
    '<span class="cross"><b>' + cross + '</b> crossings</span> · ' +
    '<span class="cap"><b>' + cap + '</b> captions</span> · ' +
    '<b>' + dd + '</b> across doors';
  $('dirty').textContent = dirty() ? 'unsaved' : '';
}

const snapshot = () => JSON.stringify(rows);
const dirty = () => snapshot() !== base;

/* ---- drawing ------------------------------------------------------------ */

function matches(r) {
  const d = $('door').value, m = $('concept').value, k = $('kind').value;
  const f = $('find').value.trim().toLowerCase();
  const ids = Object.keys(r.concepts || {}).filter(byConcept);
  if (m !== 'all' && !ids.includes(m)) return false;
  if (d !== 'all' && !ids.some(id => byConcept(id).door === d)) return false;
  const a = reach(r);
  if (k === 'caption' && a.concepts !== 1) return false;
  if (k === 'cross' && a.concepts < 2) return false;
  if (k === 'doors' && a.doors < 2) return false;
  if (f && !r.text.toLowerCase().includes(f)) return false;
  return true;
}

function draw() {
  const list = $('list');
  list.replaceChildren();
  const shown = rows.map((r, i) => [r, i]).filter(([r]) => matches(r));
  if (!shown.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'Nothing matches that.';
    list.appendChild(p);
    score();
    return;
  }
  for (const [r, i] of shown) list.appendChild(rowEl(r, i));
  score();
}

function rowEl(r, i) {
  const a = reach(r);
  const el = document.createElement('div');
  el.className = 'row' + (a.concepts === 1 ? ' caption' : '');

  const left = document.createElement('div');
  const ta = document.createElement('textarea');
  ta.className = 'q' + (r.text.trim().endsWith('?') ? '' : ' bad');
  ta.rows = 1;
  ta.value = r.text;
  // Grown to fit rather than scrolled: a question you cannot read all of is one
  // you cannot judge, and these run to 59 characters.
  const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  ta.addEventListener('input', () => {
    r.text = ta.value;
    ta.classList.toggle('bad', !ta.value.trim().endsWith('?'));
    grow(); score();
  });
  left.appendChild(ta);
  requestAnimationFrame(grow);

  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.innerHTML = a.concepts === 1
    ? '<span class="cap">caption — names one concept</span>'
    : a.doors > 1
      ? '<span>crosses ' + a.doors + ' doors</span>'
      : '<span>joins ' + a.concepts + ' concepts on one door</span>';
  /* TWO DESTRUCTIVE ACTIONS, ALWAYS BOTH, AND THEY MEAN DIFFERENT THINGS. A
     question is ONE row however many concepts name it, so deleting the row takes
     it off all of them — including concepts on doors this view is filtered away
     from. Reading a list filtered to Water and pressing something called
     `delete` on a question that also hangs off Carbon is the mistake the filter
     invites, so the two are named apart and the delete's confirm counts what it
     would actually take.

     UNLINK targets the concept in the filter, because that is the only concept
     this view can be said to be "in". With the filter on every concept there is
     no such target — a door names nine — so it disables and says why rather
     than guessing. The × on a chip is the same action with the target picked by
     hand, and stays the fast path. */
  const here = $('concept').value;
  const linked = here !== 'all' && id_in(r, here);

  const un = document.createElement('button');
  un.className = 'btn'; un.style.padding = '0.1rem 0.35rem';
  un.textContent = 'unlink';
  un.disabled = !linked;
  un.title = linked
    ? 'Take this question off ' + byConcept(here).name + ', leaving it on the others'
    : 'Pick one concept in the filter to unlink from — or use the × on a chip';
  un.addEventListener('click', () => {
    if (!linked) return;
    delete r.concepts[here];
    draw();
  });
  tag.appendChild(un);

  const del = document.createElement('button');
  del.className = 'btn'; del.style.padding = '0.1rem 0.35rem';
  del.textContent = 'delete question';
  del.addEventListener('click', () => {
    const names = Object.keys(r.concepts).filter(byConcept).map(id => byConcept(id).name);
    const scope = names.length > 1
      ? '\n\nIt is named by ' + names.length + ' concepts — ' + names.join(', ')
        + ' — and this takes it off all of them.'
        + '\nTo remove just one, unlink instead.'
      : '';
    if (!confirm('Delete “' + r.text + '”?' + scope)) return;
    rows.splice(i, 1); draw();
  });
  tag.appendChild(del);
  left.appendChild(tag);

  const right = document.createElement('div');
  right.className = 'edges';
  for (const [id, rank] of Object.entries(r.concepts || {})) {
    const m = byConcept(id);
    const chip = document.createElement('span');
    chip.className = 'chip' + (m && m.door !== 'water' ? ' away' : '');
    const dot = document.createElement('span');
    dot.className = 'dr';
    if (m) dot.style.background = m.state === 'built' ? 'var(--accent)'
                                : m.state === 'engine' ? 'var(--spark)' : 'var(--line)';
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(m ? m.name : id + ' (unknown)'));

    const sel = document.createElement('select');
    // The rank is the EDGE's, so it lives on the chip: "is this a good FIRST
    // thing to ask on THIS card?" has a different answer per card, and 27 rows
    // already say so.
    for (const n of [1, 2, 3]) {
      const o = document.createElement('option');
      o.value = n; o.textContent = 'rank ' + n; o.selected = n === rank;
      sel.appendChild(o);
    }
    sel.addEventListener('change', () => { r.concepts[id] = +sel.value; score(); });
    chip.appendChild(sel);

    const x = document.createElement('button');
    x.textContent = '×'; x.title = 'unlink';
    x.addEventListener('click', () => { delete r.concepts[id]; draw(); });
    chip.appendChild(x);
    right.appendChild(chip);
  }

  const add = document.createElement('select');
  add.className = 'addmod';
  add.innerHTML = '<option value="">+ concept…</option>';
  for (const d of doors) {
    const g = document.createElement('optgroup');
    g.label = d.name + (d.open ? '' : ' (not opened)');
    for (const m of concepts.filter(x => x.door === d.id)) {
      if (r.concepts && id_in(r, m.id)) continue;
      const o = document.createElement('option');
      o.value = m.id;
      o.textContent = m.name + (viewIds.includes(m.id) ? ' ◍' : '');
      g.appendChild(o);
    }
    if (g.children.length) add.appendChild(g);
  }
  add.addEventListener('change', () => {
    if (!add.value) return;
    r.concepts[add.value] = 1;      // a new edge opens at rank 1; re-rank on the chip
    draw();
  });
  right.appendChild(add);

  el.appendChild(left);
  el.appendChild(right);
  return el;
}

const id_in = (r, id) => Object.prototype.hasOwnProperty.call(r.concepts || {}, id);

/* ---- filters ------------------------------------------------------------ */

/* Called again after a concepts save, so a new concept is selectable without a
   reload — which means it has to KEEP the selections. Rebuilding the options
   drops each select back to its first, and silently rewinding the filter the
   curator is working in is worse than the stale dropdown it fixes. A value that
   no longer exists (the concept was just deleted) falls back to `all`. */
function fillFilters() {
  const was = { door: $('door').value, cdoor: $('cdoor').value, concept: $('concept').value };
  const dsel = $('door');
  dsel.innerHTML = '<option value="all">every door</option>';
  for (const d of doors) {
    const o = document.createElement('option');
    o.value = d.id;
    o.textContent = d.name + (d.open ? '' : ' (not opened)');
    dsel.appendChild(o);
  }
  const md = $('cdoor');
  md.innerHTML = '<option value="all">every door</option>';
  for (const d of doors) {
    const o = document.createElement('option');
    o.value = d.id;
    o.textContent = d.name + (d.open ? '' : ' (not opened)');
    md.appendChild(o);
  }
  const msel = $('concept');
  msel.innerHTML = '<option value="all">every concept</option>';
  for (const m of concepts) {
    const o = document.createElement('option');
    o.value = m.id;
    o.textContent = m.name + (viewIds.includes(m.id) ? ' ◍' : '');
    msel.appendChild(o);
  }

  const keep = (el, v) => {
    if (!v) return;
    el.value = v;
    if (!el.value) el.value = 'all';   // gone: the option no longer exists
  };
  keep(dsel, was.door); keep(md, was.cdoor); keep(msel, was.concept);
}
['door', 'concept', 'kind', 'find'].forEach(id => $(id).addEventListener('input', draw));

/* ---- concepts -------------------------------------------------------------
   The one field that changes the map's first screen is `rank`: a door opens on
   its rank 1 concepts and reveals the rest a band at a time. That used to be
   capped at four by a hand-composed fan of four positions — a fifth wrapped and
   was dealt on top of the first — so the fan is resampled now and any count
   composes. Which is what makes this screen worth having.

   The id is editable exactly ONCE, while the concept is new and nothing names
   it yet. After the first save it is a label: every question names its concepts
   by id, so changing one would orphan those edges silently. The io catches it,
   but the honest move is not to offer it. `fresh` is what carries that window,
   and it is stripped out of the save rather than written to the file — it is a
   fact about this session, not about the map. */

let draft = [], cbase = '';

const csnapshot = () => JSON.stringify(draft);
const cdirty = () => csnapshot() !== cbase;

function cscore() {
  const d = $('cdoor').value;
  const inDoor = m => d === 'all' || m.door === d;
  const shown = draft.filter(inDoor);
  const starters = shown.filter(m => m.rank === 1);
  const openDoors = doors.filter(x => x.open && (d === 'all' || x.id === d));
  const bad = openDoors.filter(x => draft.some(m => m.door === x.id)
                                 && !draft.some(m => m.door === x.id && m.rank === 1));
  $('cscore').innerHTML =
    '<b>' + shown.length + '</b> concepts · '
    + '<span class="cross"><b>' + starters.length + '</b> open the door</span>'
    + (bad.length ? ' · <span class="cap">' + bad.map(x => x.name).join(', ')
                    + ' opens on nothing</span>' : '');
  $('cdirty').textContent = cdirty() ? 'unsaved' : '';
}

function cdraw() {
  const host = $('clist');
  host.replaceChildren();
  const d = $('cdoor').value;
  // Rank first, so what a door OPENS with is at the top and reads as a set —
  // except a `fresh` row, which floats above all of it. It has no id yet, so
  // rank order would deal a half-typed concept into the middle of the list.
  const shown = draft.map((m, i) => [m, i])
    .filter(([m]) => d === 'all' || m.door === d)
    .sort((a, b) => (!!b[0].fresh - !!a[0].fresh)
                 || (a[0].door.localeCompare(b[0].door))
                 || (a[0].rank - b[0].rank));
  for (const [m, i] of shown) host.appendChild(crowEl(m, i));
  cscore();
}

/* Why a new concept cannot be saved yet, or '' if it can. The io checks all of
   this too and its message is what a save reports; this is the same rule said
   early, so the row shows it while it is being typed rather than at Save. */
function idProblem(m, i) {
  if (!m.id) return 'needs an id';
  if (!/^[a-z][a-z0-9]*$/.test(m.id)) return 'lowercase letters and digits, starting with a letter';
  if (draft.some((x, j) => j !== i && x.id === m.id)) return 'another concept already has this id';
  return '';
}

function crowEl(m, i) {
  const el = document.createElement('div');
  el.className = 'crow' + (m.rank === 1 ? ' starter' : '') + (m.fresh ? ' fresh' : '');

  const idc = document.createElement('div');
  if (m.fresh) {
    const box = document.createElement('input');
    box.className = 'idc'; box.value = m.id; box.placeholder = 'id';
    box.title = 'Questions will name this concept by id, and it is fixed once saved.';
    const why = document.createElement('div');
    why.className = 'why';
    const test = () => {
      const p = idProblem(m, i);
      box.classList.toggle('bad', !!p);
      why.textContent = p;
    };
    box.addEventListener('input', () => { m.id = box.value.trim(); test(); cscore(); });
    test();
    idc.appendChild(box);
    idc.appendChild(why);
  } else {
    idc.className = 'idc';
    idc.textContent = m.id;
    idc.title = 'Questions name this concept by id, so it is not editable here — '
              + 'changing it would orphan every edge that names it.';
  }
  el.appendChild(idc);

  const mid = document.createElement('div');
  const name = document.createElement('input');
  name.className = 'name'; name.value = m.name;
  name.addEventListener('input', () => { m.name = name.value; cscore(); });
  mid.appendChild(name);
  const claim = document.createElement('textarea');
  claim.className = 'claim'; claim.rows = 1; claim.value = m.claim;
  const grow = () => { claim.style.height = 'auto'; claim.style.height = claim.scrollHeight + 'px'; };
  claim.addEventListener('input', () => { m.claim = claim.value; grow(); cscore(); });
  mid.appendChild(claim);
  requestAnimationFrame(grow);
  /* The other words a reader might type. One field, ` · ` separated, the same
     shape `host` has — and the same shape it is stored in, so what is typed here
     is what lands in the file. The checker is what catches two cards claiming
     one word; it is not enforced live, because half a word is a collision while
     it is being typed. */
  const alt = document.createElement('input');
  alt.className = 'alt'; alt.value = m.alt || '';
  alt.placeholder = 'also typed as · one · per · separator';
  alt.title = 'Words a reader might type for this card, beyond its name. '
            + 'Matched exactly, so write the form somebody would type.';
  alt.addEventListener('input', () => { m.alt = alt.value.trim(); cscore(); });
  mid.appendChild(alt);

  const qn = document.createElement('div');
  qn.className = 'qn';
  const n = rows.filter(r => id_in(r, m.id)).length;
  qn.textContent = n + (n === 1 ? ' question' : ' questions')
                 + (viewIds.includes(m.id) ? ' · ◍ has a card' : '');
  mid.appendChild(qn);
  el.appendChild(mid);

  const side = document.createElement('div');
  side.className = 'side';

  const rank = document.createElement('select');
  for (const n2 of [1, 2, 3]) {
    const o = document.createElement('option');
    o.value = n2; o.selected = n2 === m.rank;
    o.textContent = n2 === 1 ? 'rank 1 — opens the door' : 'rank ' + n2;
    rank.appendChild(o);
  }
  rank.addEventListener('change', () => { m.rank = +rank.value; cdraw(); });
  side.appendChild(rank);

  const door = document.createElement('select');
  for (const dd of doors) {
    const o = document.createElement('option');
    o.value = dd.id; o.selected = dd.id === m.door;
    o.textContent = dd.name + (dd.open ? '' : ' (not opened)');
    door.appendChild(o);
  }
  door.addEventListener('change', () => { m.door = door.value; cdraw(); });
  side.appendChild(door);

  const state = document.createElement('select');
  for (const st of ['built', 'engine', 'planned']) {
    const o = document.createElement('option');
    o.value = st; o.selected = st === m.state; o.textContent = st;
    state.appendChild(o);
  }
  state.addEventListener('change', () => { m.state = state.value; cscore(); });
  side.appendChild(state);

  /* Refused rather than cascaded. A concept with questions on it is not a row
     to tidy away: deleting it would drop every one of those crossings, and the
     io rejects the save anyway. So the button says the count and stops, and
     unlinking the questions first is the deliberate path. */
  const del = document.createElement('button');
  del.className = 'btn del';
  del.textContent = 'delete';
  del.addEventListener('click', () => {
    const named = rows.filter(r => id_in(r, m.id));
    if (named.length) {
      say('“' + (m.name || m.id) + '” is named by ' + named.length
        + (named.length === 1 ? ' question' : ' questions')
        + '. Unlink those first — deleting it would drop the crossings.', 'bad');
      return;
    }
    if (viewIds.includes(m.id)
        && !confirm('“' + (m.name || m.id) + '” has a VIEWS entry, which this cannot remove.\n\n'
                  + 'Delete the concept and leave the orphan entry for a hand edit?')) return;
    if (!m.fresh && !confirm('Delete “' + (m.name || m.id) + '”?')) return;
    draft.splice(i, 1);
    say('');
    cdraw();
  });
  side.appendChild(del);

  el.appendChild(side);
  return el;
}

$('cdoor').addEventListener('input', cdraw);

/* A new concept opens on the door being filtered, because that is the one the
   curator is looking at; rank 2 and `planned`, because a rank 1 changes what a
   door OPENS with and a new row has not earned that. It goes to the TOP of the
   list rather than into rank order, so it is not dealt somewhere off screen. */
$('cadd').addEventListener('click', () => {
  const d = $('cdoor').value;
  draft.unshift({ id: '', name: '', claim: '',
                  door: d === 'all' ? doors[0].id : d,
                  rank: 2, state: 'planned', fresh: true });
  say('');
  cdraw();
  const box = $('clist').querySelector('input.idc');
  if (box) box.focus();
});

/* ---- panes -------------------------------------------------------------- */

function pane(which) {
  const q = which === 'questions';
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('on', t.dataset.pane === which));
  $('qbar').hidden = !q; $('list').hidden = !q;
  $('cbar').hidden = q;  $('clist').hidden = q;
  say('');
  if (q) draw(); else cdraw();
}
document.querySelectorAll('.tab').forEach(t =>
  t.addEventListener('click', () => pane(t.dataset.pane)));

/* ---- load, save --------------------------------------------------------- */

async function load() {
  try {
    const r = await fetch('/api/mapcontent', { cache: 'no-store' });
    if (!r.ok) throw new Error('status ' + r.status);
    const data = await r.json();
    rows = data.rows;
    concepts = data.concepts;
    doors = data.doors;
    viewIds = data.views || [];
    mtimeMs = data.mtimeMs;
    writable = !!data.writable;
    // The concepts screen edits a COPY. `concepts` stays the read-only lookup the
    // questions screen resolves ids against, so an unsaved rename on one screen
    // cannot quietly change what the other one is showing.
    draft = data.concepts.map(m => ({ ...m }));
    base = snapshot(); cbase = csnapshot();
    $('note').innerHTML = 'Editing <code>lib/mapcontent.js</code>. '
      + 'A question naming one concept is a caption; the work is turning those into '
      + 'crossings. <b>◍</b> marks a concept whose card has something to show.';
  } catch (e) {
    writable = false;
    $('note').innerHTML = 'No dev server, so this page is read-only — run '
      + '<code>node tools/dev-server.js</code> to save straight to '
      + '<code>lib/mapcontent.js</code>, or use Export.';
    // Fall back to the file the browser can already fetch, so the page is still
    // useful for reading and for an Export/paste on a checkout with no server.
    try {
      const src = await fetch('lib/mapcontent.js', { cache: 'no-store' }).then(x => x.text());
      const sb = { window: {} }; sb.window = sb;
      new Function('global', src)(sb);
      const c = sb.MapContent;
      rows = c.QUESTIONS.map(([text, m]) => ({ text, concepts: { ...m } }));
      concepts = c.CONCEPTS; doors = c.DOORS; viewIds = Object.keys(c.VIEWS || {});
      draft = c.CONCEPTS.map(m => ({ ...m }));
      base = snapshot(); cbase = csnapshot();
    } catch (e2) { say('could not read mapcontent.js: ' + e2.message, 'bad'); }
  }
  $('save').disabled = !writable;
  $('csave').disabled = !writable;
  fillFilters();
  draw();
  cdraw();
}

$('save').addEventListener('click', async () => {
  say('');
  try {
    const r = await fetch('/api/mapcontent', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rows, mtimeMs }),
    });
    const data = await r.json();
    if (!r.ok) {
      if (data.problems) {
        say(data.error + ' — ' + data.problems.map(p => '“' + (p.text || '') + '”: ' + p.problem).join(' · '), 'bad');
      } else say(data.error || ('status ' + r.status), 'bad');
      return;
    }
    mtimeMs = data.mtimeMs;
    base = snapshot();
    say('saved ' + data.rows + ' rows to mapcontent.js', 'ok');
    score();
  } catch (e) { say(e.message, 'bad'); }
});

$('csave').addEventListener('click', async () => {
  say('');
  try {
    // `draft` only. The io leaves QUESTIONS exactly as the file has it, so an
    // unsaved question edit on the other screen is neither written nor lost.
    const r = await fetch('/api/mapcontent', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      // `fresh` never reaches the file: it is this session's note that a row's
      // id is still open, and serialiseConcepts would ignore it anyway.
      body: JSON.stringify({ concepts: draft.map(({ fresh, ...m }) => m), mtimeMs }),
    });
    const data = await r.json();
    if (!r.ok) {
      if (data.problems) {
        say(data.error + ' — ' + data.problems.map(p => '“' + (p.text || '') + '”: ' + p.problem).join(' · '), 'bad');
      } else say(data.error || ('status ' + r.status), 'bad');
      return;
    }
    mtimeMs = data.mtimeMs;
    // Saved is what closes the id window: from here a question can name it.
    for (const m of draft) delete m.fresh;
    cbase = csnapshot();
    // The questions screen resolves ids against this, so it has to follow, and
    // fillFilters is what puts a new concept in its dropdowns.
    concepts = draft.map(m => ({ ...m }));
    fillFilters();
    say('saved ' + data.concepts + ' concepts to mapcontent.js', 'ok');
    cdraw();
  } catch (e) { say(e.message, 'bad'); }
});

$('crevert').addEventListener('click', () => {
  if (cdirty() && !confirm('Throw away the unsaved concept edits?')) return;
  load().then(() => say('reloaded from disk', 'ok'));
});

$('revert').addEventListener('click', () => {
  if (dirty() && !confirm('Throw away the unsaved edits?')) return;
  load().then(() => say('reloaded from disk', 'ok'));
});

/* Seeded from whatever the list is filtered to. A question born with no concept
   is invisible under any filter AND counts as unlinked, so the new row would
   vanish at the moment it was asked for. Concept filter wins; a door falls back
   to what that door opens with. */
$('add').addEventListener('click', () => {
  const m = $('concept').value, d = $('door').value;
  let seed = m !== 'all' ? m : null;
  if (!seed && d !== 'all') {
    const cand = concepts.filter(x => x.door === d).sort((a, b) => a.rank - b.rank)[0];
    if (cand) seed = cand.id;
  }
  rows.unshift({ text: 'New question?', concepts: seed ? { [seed]: 1 } : {} });
  $('kind').value = 'all'; $('find').value = '';
  draw();
  const first = document.querySelector('.q');
  if (first) { first.focus(); first.select(); }
});

/* Export writes the QUESTIONS array the way mapcontent-io.js would, so a paste
   into the file lands identical to a save. The alignment is that concept's, not
   this page's opinion — a diff of 63 re-indented lines would bury the edit. */
const COLUMN = 64;
const quote = s => "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
$('export').addEventListener('click', () => {
  const body = rows.map(r => {
    const head = '    [' + quote(r.text) + ',';
    const pad = ' '.repeat(Math.max(1, COLUMN - head.length));
    const edges = Object.entries(r.concepts || {}).map(([id, n]) => id + ':' + n).join(', ');
    return head + pad + '{ ' + edges + ' }],';
  }).join('\n');
  let ta = document.querySelector('textarea.dump');
  if (!ta) { ta = document.createElement('textarea'); ta.className = 'dump'; $('list').before(ta); }
  ta.value = '  const QUESTIONS = [\n' + body + '\n  ];';
  ta.focus(); ta.select();
  say('paste this over the QUESTIONS array in lib/mapcontent.js', 'ok');
});

addEventListener('beforeunload', e => { if (dirty() || cdirty()) e.preventDefault(); });

load();
</script>
</div>
</body>
</html>
