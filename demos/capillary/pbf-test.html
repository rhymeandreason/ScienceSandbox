<title>capillary action — position-based fluid</title>

<!-- ===================================================================
     TEST BENCH. Not a lesson. THE POSITION-BASED FLUID VERSION of
     nanopore-test.html, which stays as it is: same walls, same molecules, same
     wetting, different solver.

     WHY. The force build cannot hold three things at once. The positional
     contact constraint is what puts the spacing right; the energy that
     constraint injects is what drives the climb; and any thermostat strong
     enough to take that energy out stops the column. Measured: with the
     constraint off the thermal share sits at 0.208 A a step and a thermostat
     holds it easily, with it on 0.369 and nothing holds it.

     The root is that incompressibility is bolted onto a force model as a
     projection, so the pressure that should drive the flow and the correction
     that keeps the liquid dense are two terms fighting. Here they are ONE
     SOLVER: density is a constraint, the constraint's corrections ARE the
     motion, and velocity is read back from how far a molecule actually moved
     (Macklin & Muller's position-based fluids). Nothing is pumped in, so
     nothing has to be taken out.

     WHAT IS KEPT AS A FORCE. Chemistry: the H-bond spring and its torque, the
     wall's hydroxyls, the wall's long-range wetting pull, and cohesion, which
     is the lesson. Those act on the prediction; the solver then makes the
     result incompressible.

     WHERE IT HAS GOT TO, measured against the force build at the same 1200
     steps. This is the better liquid, and by some distance:

                          force build      here      real water
       nearest neighbour     2.85 A        2.73 A      2.76 A
       neighbours <3.4 A      5.2           6.6         ~4.5
       H-bonds a molecule     1.63          2.5-2.6      3.6
       bulk speed             0.55          0.10          -
       molecules thrown        4             0            -

     Nothing is flung, nothing strands on the dry wall, and the calm is not
     the frozen calm the force build could only reach by killing the flow: the
     water still moves, it just moves together.

     WHAT IT DOES NOT DO YET IS LIFT THE MIDDLE. Water climbs the walls — the
     film reaches about 35 A up the dry cellulose at Adhesion 0.06 — and the
     body of the pool stays where it was. That is the FILM problem the force
     build had before it had a pressure term, and it is the next thing to work
     on here; the difference is that this time the thing that has to drag the
     column is the solver, which is where it belongs, rather than a term to be
     tuned against it.

     AND IT IS SLOW: 10.5 ms a step against the force build's 4.5, four solver
     sweeps over the neighbour list being most of it. Untouched so far, because
     nothing is worth optimising until the physics is settled.

     THE QUESTION. Capillarity is on WaterSim.md's list of things that
     must trace back to H-bonding, and the usual picture of it — water
     climbing a stem — cannot be drawn at molecular scale. A xylem
     vessel is 10-100 um, which is 36,000 to 360,000 water molecules
     across, and capillary rise in one is about 1.5 m against a
     redwood's 100. The vessel is not where the lift comes from.

     Where it comes from is the cell-wall pore in the leaf: a few
     nanometres, a few tens of molecules across, holding a curved
     meniscus that evaporation pulls on. THAT is drawable at honest
     scale, and this bench is whether it renders as anything.

     SCALE. Everything here is family B — real angstroms x MolLib.SCALE
     (MolecularGeometry.md 1.5) — because the page makes a size claim
     and only family B may. So the water is mol-small's to-scale
     spectroscopic geometry, NOT water-lab's family-A physics water,
     and the engine constants below are real distances scaled once,
     not tuned numbers.

     THE WALLS ARE REAL CELLULOSE. Not a hydroxyl lattice standing in
     for one: the cellobiose spec repeated by chain-repeat.js, the same
     path chain/glucose-chains-test.html checks, so the -OH groups the
     water bonds to are where beta-1,4 glucose actually puts them. The
     right-hand wall is the left one turned 180 degrees about Y, never
     mirrored: a mirrored sugar is the other enantiomer.

     WHAT IT SHOWS. The wall wets: water reaches the hydroxyl surface,
     sits 2.4-3.0 A from its oxygens, and holds H-bonds to them — which
     is adhesion, drawn as the same bond as cohesion, because it is the
     same bond. The liquid's own numbers are close: nearest neighbours
     settle near 2.55 A against a real 2.8, and about 2.5 H-bonds per
     molecule against a real 3.6, at the seeded bulk density.

     WATER TRAVELS UP THE CHANNEL, AND THAT IS WHAT THE PAGE IS FOR. It
     starts as a pool at the foot of a DRY pore — bare cellulose above it
     — and the front then climbs, as a BODY: over 3000 steps the middle
     of the channel rises about 15 A and the water at the walls about 23,
     with the count growing from 490 to 820 as more is drawn in at the
     base. The wall leads the middle by roughly 17 A, which is the
     meniscus, and nothing is ejected from the top.

     THREE THINGS HAD TO BE FIXED BEFORE IT WOULD MOVE, and all three
     were missing pieces rather than bad numbers.

     One: it seeded the pore ALREADY FULL. A full glass cannot show
     pouring; the wall above the water has to be dry.

     Two: THERE WAS NO SUPPLY. A capillary rises because the tube stands
     in a bath, so the bottom band is now held at liquid density, which
     models the rest of the cell wall as the endless reservoir it
     effectively is.

     Three, and this is the one that took longest to see: THERE WAS NO
     PRESSURE. With those two fixed the wall still only stripped FILMS
     off the pool — measured across the whole adhesion range, the water
     at the wall climbed from -7 A to +38 while the middle of the channel
     never moved at all. Raising adhesion only stripped more; a narrower
     pore did not help; a shorter-ranged wall did nothing at any strength.
     The reason is structural. A liquid held only by pair forces is happy
     to thin out and leave a void, so a wetting wall peels a film off it
     and the body stays where it is. Real filling is the other way round:
     the liquid is effectively incompressible, so the curved surface sets
     up a pressure difference and drags the column behind it. Nothing in
     a neighbour-force model expresses that, which is why no amount of
     tuning found it.

     AN EARLIER READING OF THIS WAS WRONG and the reason is worth
     keeping. Seeded at RANDOM through the pore, the old build reported
     10-17 A, the right order for a hemispherical meniscus. Seeded on a
     lattice instead, the identical run gave 0.0 A and stayed flat for
     thousands of steps: molecules that happened to land against the
     wall had stuck there and never come down. A number that depends on
     the seed is hysteresis, not equilibrium. Approaching from a full
     pore AND an empty one is still the check this has not had.

THERE IS NO GRAVITY HERE, and that is a correction to an earlier
     version rather than a simplification. At 3.5 nm the capillary
     pressure is ~8e7 Pa and the gravitational pressure across the pore
     ~5e-5 Pa, twelve orders of magnitude apart. There is no up in a
     cell-wall pore: water moves toward the EVAPORATING SURFACE, and in
     a leaf those pores face the air spaces in every orientation. An
     earlier build had a g strong enough to hold a column down, which
     drew the dipped-capillary-tube picture — the wrong model for a
     leaf, where the lifting happens in metres of xylem, pulled by the
     tension these menisci generate. This bench is where the grip is,
     not where the rope moves. What holds the liquid now is the wall and
     its own cohesion, which is the only claim it was ever making.

     The page still draws the pore standing upright, and that is now
     only a camera angle: nothing in the physics knows which way is up.

     IT WAS WRONG FIRST, AND THE FAILURE IS THE USEFUL PART. An earlier
     version put the wall's backstop an angstrom BEHIND the face while
     the steric list held only atoms near the surface, so a molecule
     that slipped past the outermost ones found nothing behind them:
     about a quarter of the water ended up inside the cellulose, sitting
     high in its grooves. That leak read as water high at the walls,
     which is what a meniscus also reads as. Every early measurement of
     the surface was measuring the leak, and the shape only became
     honest once the count of molecules past the face was zero.

     Molecule count mattered too. At 300 the free surface was 12 across
     with 2-3 A of thermal roughness, and no measurement of its shape
     meant anything. 900 is the smallest count where a surface is one.

     COHESION HAD THE WRONG SHAPE, and finding it started from noticing the
     water moved too much. The dispersion term was STRONGEST exactly at the
     rest length and fell away outward, so a pair sitting at its own equilibrium
     was pulled inward as hard as the term could pull while contact pushed it
     back out. Force at a potential's minimum is zero; this one was at its
     maximum. Every touching pair was in that tug of war. Corrected — rising
     from nothing at contact, peaking midway, back to nothing at the cutoff —
     the bulk quietens from 0.79 A a step to 0.55 and the molecules thrown clear
     of the surface go from 7 to 4, at the same K_COH.

     It does not overturn what follows, though, and that is the honest reading:
     matched for structure rather than for K_COH, the corrected curve is just as
     agitated. What the liquid does still tracks how hard it is held.

     THE CLIMB IS CURRENTLY DRIVEN BY AGITATION, NOT BY WETTING, and that is
     the most important thing known about this bench. Four independent ways of
     calming the liquid were tried, at the correct spacing, and every one of
     them stopped the column dead while it was still 30 A short of where the
     agitated run takes it:

       feed the constraint's correction back into velocity   no climb
       stop the closing approach at contact (inelastic)      no climb
       couple the thermostat harder (DAMP 0.93 -> 0.85)      no climb
       cap the speed at 0.5-1.0 A a step                     no climb

     Each of those is the textbook-correct treatment of its own term, and each
     leaves the same state behind: 8.6 neighbours inside 3.4 A, bulk speed
     0.02-0.5, bonds up at 2.9. That is not a calm liquid, it is a SOLID. This
     model has no liquid phase in between — it is either being shaken hard
     enough to flow or it is frozen — and the rise on screen is the shaking.

     Which traces back to the same root as everything else here: nothing sets a
     temperature. The thermostat is a floor under the slowest molecules
     (V_THERM 0.05 against a bulk that runs at 0.75), the energy actually
     stirring the liquid comes from the constraint and the forces, and there is
     no window where the water is warm enough to flow and cool enough to stay
     put. Fixing it means the pressure drive and the incompressibility being the
     same solver rather than two terms fighting, which is a different force
     model, not another constant.

     THIS RUNS ABOUT A BILLION TIMES SLOWER THAN THE REAL THING, and the
     mismatch is worth stating plainly because everything on screen invites the
     opposite impression. Washburn puts a 3.5 nm pore drawing water 9 nm in
     roughly 1.3 nanoseconds. The same fill here takes a minute or so of
     watching. Nothing about a minute of wall clock corresponds to anything in a
     leaf.

     BUT THE PHYSICS IS NOT WHAT IS SLOW, which is the part that matters and was
     measured rather than assumed. Compare each front against the molecules
     carrying it, which needs no unit at all: here the front advances at 2.3% of
     the liquid's own thermal speed, and in real water it is 1.2%. If anything
     this fills slightly FASTER than nature, relative to how fast its molecules
     are moving. What is missing is throughput — a real pore gets something like
     1e12 molecular rearrangements a second and this gets a hundred steps.

     So: a student may read the RATE of anything here as a claim, and it is not
     one. What is claimed is the ORDER of things — that the wall wets before the
     column moves, that a narrower pore pulls harder, that water leaves the top
     before more arrives at the base. The clock on the readout is how long you
     have waited, not how long it took.

     WATCHING THE FLOW COSTS THE CURVE. Evaporation flattens the
     meniscus: ~10 A static, and 0-2 A once it is running, at every rate
     tried that still makes the flow watchable. The surface being drawn
     down by flux is real. This flux is not — it is orders above a
     leaf's, set so the flow is watchable — so the flat surface under
     Evaporate is an artefact of that choice, not a result. Watch the
     curve with it OFF and the flow with it ON; this bench cannot
     currently show both at once, and that is the honest state of it.
     =================================================================== -->

<script>
"use strict";

/* ============================================================= *
 *  Scale. One number, and every distance below is a real one.
 * ============================================================= */
const A = MolLib.SCALE;              // scene units per angstrom (family B)
const nm = n => n*10*A;              // nanometres, for the pore itself
const P  = MolLib.PALETTE;

/* ---- the pore, in real numbers ----
 *  Cell-wall pores run about 2-10 nm. 3.5 nm is in that range and is the
 *  width at which a column tall enough to have a meniscus still fits the
 *  molecule budget: water is 33.4 molecules per cubic nm, so the slot's
 *  volume IS the count, and a 5 nm slot at this depth would be a puddle
 *  rather than a column.
 */
/* WIDTH IS A URL PARAMETER, because the one claim this page owes the lesson is
   what a NARROWER pore does — WaterSim.md 3, greater tension rather than higher
   rise — and that cannot be measured without running more than one width.
   `?gap=5` builds a 5 nm slot; no parameter is the 3.5 nm the page is about.

   MEASURED, AND THE LAW HOLDS. Adhesion 0.036 so the pore wets on every run
   rather than landing in the bistable band, 2600 steps, evaporation off. The
   tension is read as the mean of lambda over the column — lambda IS the
   pressure in this solver — away from both walls, below the meniscus and above
   the supply band, so neither the free surface nor the reservoir is in the
   sample:

       pore     tension    1/r would give    climb at wall
       3.5 nm     0.900        0.900             25.4 A
       5 nm       0.635        0.630             11.4 A
       7 nm       0.485        0.450              4.4 A
       10 nm      0.82-0.84    0.315              0.5-2.4 A

   Three points on Young-Laplace to within a few percent. Halve the pore and
   the water pulls twice as hard, which is the claim WaterSim.md 3 makes and
   the reason a leaf's pores are the size they are.

   THE 10 NM POINT IS THE APPARATUS RUNNING OUT, not the law failing, and it
   reproduces: twice, 0.82 and 0.84, with the water 0.5 A up the wall. There is
   no meniscus at that width — the molecule budget cannot fill a 10 x 1.5 nm
   slot deep enough to span it, so the surface is flat and what lambda reports
   is not capillary tension. A wider slot needs a deeper one and a bigger N_MAX,
   which is a different experiment rather than a further point on this one.

   The numbers are in solver units. Saying them in Pa would need gamma pinned by
   a Laplace calibration against water's 72 mN/m, which has not been done — but
   the SCALING is unit-free, and the scaling is the claim. */
const _q=new URLSearchParams(location.search);
const GAP   = nm(Math.min(12, Math.max(2, +_q.get('gap') || 3.5)));
/* The slab is DEEP for a reason that is not chemistry. The water starts as a
   pool at the bottom of a dry pore and has to climb, so it needs to be short
   against a tall wall — and a pool's height is its molecule count divided by
   its cross-section. Widening the pore is not available (3.5 nm is the claim),
   so the depth carries it: at this thickness 900 molecules stand about 50 A
   deep in a pore 125 A tall, and there is somewhere to climb to. */
/* AND SO IS DEPTH, for a different reason. The z faces are plain hard
   boundaries — no hydroxyls, no wetting pull — so the depth carries no part of
   the lesson, while multiplying both the molecules needed per angstrom of rise
   and the cost of every step. Measured: with tension above the draw threshold
   on all 1500 steps, injection into the base failed 1497 times out of 1740,
   because the band was packed. Nothing limits the fill but the volume that has
   to move. `?depth=1.0` is the knob for it. */
const DEPTH = nm(Math.min(3, Math.max(0.6, +_q.get('depth') || 0.9)));
/* 0.9 RATHER THAN 1.5, and it is a choice about the Speed slider rather than
   about water. A step costs about 6 ms at this thickness against 13 at 1.5, and
   the frame budget is 16.7, so the point where more Speed stops buying more
   steps a second moves from about 1.3x out to about 2.7x. Thinner does not fill
   in fewer steps — it fills in more, since the same arriving water has less
   column to raise — but it puts the run in the range where the slider works,
   and 3-4x with a thin slab is the fastest this feels. The liquid does not
   notice: 2.73 A spacing, 2.49 H-bonds a molecule, 17 degrees. */
const FLOOR_MARGIN = 4.0*A;          // the pool's base, above the wall's bottom edge

/* ---- water, from real distances ----
 *  Every one of these is a measured number scaled once. WaterSim.md 4: the
 *  steric floor sits BELOW the H-bond equilibrium, so a bonded pair rests
 *  where the bond wants it rather than in a fight between two forces.
 */
const OO_EQ   = 2.76*A;              // liquid water O...O, the H-bond rest length
/* THE FLOOR SITS BELOW THE EQUILIBRIUM, which is WaterSim.md 4's rule and was
   being broken. With contact AT 2.76 a bonded pair could never be pulled taut:
   the H-bond spring's rest length was exactly where the hard floor stood, so
   the bond had nothing to pull against and K_HB did nothing at any setting.
   Below it, a pair can be stretched, and the bond is what decides where a
   neighbour sits rather than the floor.

   That matters for more than the bond count. An isotropic constraint — be at
   this density, do not overlap — packs like hard spheres, six to twelve
   neighbours, and water does not: it holds 4.5 at 2.8 A, which is far more OPEN
   than close packing, and the openness is why ice floats. Only a directional
   bond can hold a liquid open, so until the bond could pull, the model had no
   route to water's structure and sat 34% too dense. */
let OO_MIN  = 2.70*A;              // how close a BONDED pair may come
let OO_FREE = 3.10*A;              // and an unbonded one: oxygen's van der Waals contact
const HB_MAX  = 2.45*A;              // H...O reach for a bond to register
const HB_LIN  = 0.55;                // O-H...O has to be near enough to straight
const COH_MAX = 6.20*A;              // how far the weak, undirected pull reaches

/* A liquid is not held together by H-bonds alone. Dispersion pulls on every
   neighbour whatever way it is turned, and without it a box of molecules whose
   only attraction is a near-linear O-H...O simply never condenses: each one
   waits for a partner to be aimed correctly and drifts apart in the meantime.
   So there is a weak undirected attraction out to ~6.2 A on top of the bond. */

/* ============================================================= *
 *  Stage
 * ============================================================= */
const canvas=document.getElementById('gl');
const {scene,camera,renderer,root,cam,applyCam,resize}=
  Stage.create(canvas,{cam:{theta:0, phi:Math.PI/2, r:nm(19)}, rMax:nm(60)});

/* ============================================================= *
 *  THE WALLS — cellulose, repeated from the checked linkage
 * ============================================================= */
const V3=(p)=>new THREE.Vector3(p[0],p[1],p[2]);
const cello=MolLib.MOLECULES.cellobiose;
const screw=ChainRepeat.screwOf(cello, ['O5','C1','C4'], 'A','B');
const CHAIN_N=18;                                   // residues; ~5.2 A each, ~94 A of wall
const chain=ChainRepeat.extend(cello, screw, CHAIN_N, 'A');

/* The chain comes out along the screw's own axis, wherever that points. Turn
   it so the axis runs up the page (the pore's long direction) and the ribbon's
   flat face looks into the pore. Both are proper rotations — a reflection here
   would hand back L-glucose. */
const qAxis=new THREE.Quaternion().setFromUnitVectors(
  new THREE.Vector3(screw.axis[0],screw.axis[1],screw.axis[2]).normalize(),
  new THREE.Vector3(0,1,0));
const chainPts=[];
chain.residues.forEach(res=>res.forEach(p=>chainPts.push(V3(p).applyQuaternion(qAxis))));

/* The ribbon's flat face: of the two directions across the chain, the one it
   is thinnest in is the face normal. Measured, not assumed — the spec's own
   torsions decide which way the ribbon lies. */
const mid=new THREE.Vector3();
chainPts.forEach(p=>mid.add(p)); mid.multiplyScalar(1/chainPts.length);
let bestAng=0, bestSpread=Infinity;
for(let k=0;k<180;k++){
  const th=k*Math.PI/180, nx=Math.cos(th), nz=Math.sin(th);
  let s=0; for(const p of chainPts){ const d=(p.x-mid.x)*nx+(p.z-mid.z)*nz; s+=d*d; }
  if(s<bestSpread){ bestSpread=s; bestAng=th; }
}
// turn that thin direction onto +x, so the flat face points across the pore
const qFace=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), -bestAng);
chainPts.forEach(p=>p.applyQuaternion(qFace));

// re-centre, and find the face that will front the pore
const box=new THREE.Box3().setFromPoints(chainPts);
const c=box.getCenter(new THREE.Vector3());
chainPts.forEach(p=>p.sub(c));
const faceX=new THREE.Box3().setFromPoints(chainPts).max.x;   // the pore-facing extreme

/* One wall is this chain, stepped along z at cellulose Ibeta's own chain
   spacing; the other is the same wall turned half a turn about y. */
const CHAIN_SPACING=8.2*A;         // cellulose Ibeta b axis
/* Two chains, not three: the wall has to be as deep as the water slab and no
   deeper. A wall standing proud of the liquid on the near side reads as a gap
   between the two, and the first version of this bench looked non-wetting for
   that reason alone — perspective on a chain 8 A nearer the camera. */
const CHAINS=3;
const wallAtoms=[];                // {el, pos}
const wallBonds=[];                // [a,b] into wallAtoms
const wallOH=[];                   // {o, h} scene positions, the adhesion sites

const perRes=chain.names.length;
const iName=n=>chain.index(n);
const OH_PAIRS=[['O2','HO2'],['O3','HO3'],['O6','HO6']].map(([o,h])=>[iName(o),iName(h)])
  .filter(([o,h])=>o>=0&&h>=0);
const optH=new Set(chain.optH);

function buildWall(side){
  // side = -1 (left) or +1 (right). The right wall is a rotation, never a mirror.
  const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), side>0?Math.PI:0);
  for(let k=0;k<CHAINS;k++){
    const z=(k-(CHAINS-1)/2)*CHAIN_SPACING;
    const base=wallAtoms.length;
    for(let r=0;r<CHAIN_N;r++){
      for(let i=0;i<perRes;i++){
        if(optH.has(i)) continue;                    // C-H's hidden, as every page hides them
        const p=chainPts[r*perRes+i].clone().applyQuaternion(q);
        // slide the wall out so its pore-facing face sits exactly at the gap
        p.x += side*(GAP/2 + faceX);
        p.z += z;
        wallAtoms.push({el:chain.el[i], pos:p});
      }
      const off=base+r*(perRes-optH.size);
      // bonds are per-residue and in residue-local numbering; skip any that
      // touch a hidden hydrogen, the same contract Stage.setOptionalH keeps
      const keep=[]; for(let i=0;i<perRes;i++) if(!optH.has(i)) keep.push(i);
      const localOf={}; keep.forEach((g,l)=>{ localOf[g]=l; });
      chain.bonds.forEach(([a,b])=>{
        if(optH.has(a)||optH.has(b)) return;
        wallBonds.push([off+localOf[a], off+localOf[b]]);
      });
      // this residue's free hydroxyls, as adhesion sites, if they face the pore
      OH_PAIRS.forEach(([oi,hi])=>{
        if(optH.has(oi)||optH.has(hi)) return;
        const o=wallAtoms[off+localOf[oi]].pos, h=wallAtoms[off+localOf[hi]].pos;
        // depth into the wall from its pore-facing plane; a hydroxyl further in
        // than a water molecule is wide can never be reached
        if(side*o.x - GAP/2 > 3.2*A) return;
        wallOH.push({o,h});
      });
    }
  }
}
buildWall(-1); buildWall(+1);

// the modelled region's lower edge, read off the wall rather than guessed
const FLOOR=Math.min(...wallAtoms.map(a=>a.pos.y))+FLOOR_MARGIN;

/* THE SURFACE, NOT A PLANE. A cellulose face is corrugated: the outermost atom
   of the ribbon sits 1-3 A proud of the hydroxyl oxygens behind it. Stopping
   the water at a flat plane through that outermost atom therefore holds every
   molecule just out of reach of the very groups it is supposed to bond to, and
   the wall reads as non-stick. So water is stopped by the ATOMS, at their own
   van der Waals radii, and can settle into the grooves between them.

   Only the atoms within a water's width of the face can ever be touched, and
   they are bucketed by height so a molecule tests a few dozen rather than all
   fifteen hundred. */
/* CONTACT radii, not van der Waals ones. A hydrogen bond is two atoms sitting
   INSIDE each other's van der Waals shells: water's O...O rests at 2.76 A while
   two vdW oxygens sum to 3.04. Give the wall's oxygens their full shell and the
   steric floor holds every water just too far out to bond, which is exactly the
   bug this replaced. So a wall oxygen stops water at the H-bond rest length, a
   hydroxyl hydrogen at the H...O it would form, and carbon — which bonds to
   nothing here — keeps its real vdW radius. */
const CONTACT={O:1.25*A, C:1.70*A, H:0.50*A};
const R_WATER=1.40*A;                       // the water O's radius in these sums
const BUCKET=3.0*A;   // finer than a water is wide, so a lookup returns few atoms
/* AND THE LOOKUP ALLOCATES NOTHING, which is what the drops were. The buckets
   used to be a Map keyed by the STRING `side+'|'+bucket`, and the two helpers
   built a fresh array of the buckets they found. Every near-wall molecule paid
   that every step, and the wetting sum spans nine buckets: roughly five
   thousand strings and two thousand arrays a step, half a million allocations a
   second at the rate this runs. None of it showed up as a slower average — it
   showed up as the frame occasionally stopping to collect them.

   So the wall is flat arrays on the same plan as the water: every atom that can
   ever be touched, counting-sorted by (side, height bucket) once at build, and
   a lookup is a pair of indices into that. Nothing is allocated after load. */
const YB0=Math.floor(Math.min(...wallAtoms.map(a=>a.pos.y))/BUCKET)-1;
const NB=Math.floor(Math.max(...wallAtoms.map(a=>a.pos.y))/BUCKET)+2-YB0;
/* Clamped, and that is safe rather than approximate: there are no wall atoms
   above the wall, so a molecule off the top of the range gets the top bucket,
   whose atoms are then rejected on distance like any others. */
const bucketOf=y=>{ const b=Math.floor(y/BUCKET)-YB0; return b<0?0:(b>=NB?NB-1:b); };

const surfStart=new Int32Array(2*NB+1);
let surfX, surfY, surfZ, surfR;
(function buildSurface(){
  const keep=[];
  for(const a of wallAtoms){
    const side=Math.sign(a.pos.x);
    if(side*a.pos.x - GAP/2 > 4.5*A) continue;   // deeper than this, nothing can reach it
    keep.push([(side>0?NB:0)+bucketOf(a.pos.y), a.pos, CONTACT[a.el]||1.5*A]);
  }
  const cnt=new Int32Array(2*NB);
  for(const k of keep) cnt[k[0]]++;
  let acc=0;
  for(let b=0;b<2*NB;b++){ surfStart[b]=acc; acc+=cnt[b]; }
  surfStart[2*NB]=acc;
  const fill=surfStart.slice(0,2*NB);
  surfX=new Float32Array(acc); surfY=new Float32Array(acc);
  surfZ=new Float32Array(acc); surfR=new Float32Array(acc);
  for(const [b,pos,r] of keep){
    const i=fill[b]++;
    surfX[i]=pos.x; surfY[i]=pos.y; surfZ[i]=pos.z; surfR[i]=r;
  }
})();
/* The hydroxyls, bucketed by height on the same index. Scanning all of them for
   every molecule near a wall was the cost the cell list uncovered: with a tall
   pore there are hundreds of sites and hundreds of near-wall molecules, and
   almost every pair is rejected on the first comparison. */
const ohStart=new Int32Array(2*NB+1);
let ohOX, ohOY, ohOZ, ohHX, ohHY, ohHZ;
function indexOH(){
  const keep=wallOH.map(site=>[(site.o.x>0?NB:0)+bucketOf(site.o.y), site]);
  const cnt=new Int32Array(2*NB);
  for(const k of keep) cnt[k[0]]++;
  let acc=0;
  for(let b=0;b<2*NB;b++){ ohStart[b]=acc; acc+=cnt[b]; }
  ohStart[2*NB]=acc;
  const fill=ohStart.slice(0,2*NB);
  ohOX=new Float32Array(acc); ohOY=new Float32Array(acc); ohOZ=new Float32Array(acc);
  ohHX=new Float32Array(acc); ohHY=new Float32Array(acc); ohHZ=new Float32Array(acc);
  for(const [b,site] of keep){
    const i=fill[b]++;
    ohOX[i]=site.o.x; ohOY[i]=site.o.y; ohOZ[i]=site.o.z;
    ohHX[i]=site.h.x; ohHY[i]=site.h.y; ohHZ[i]=site.h.z;
  }
}

/* ---- drawn as instances ----
 *  A wall is ~1500 spheres and as many sticks and it never moves, so it is one
 *  InstancedMesh per element plus one for the bonds rather than 3000 objects.
 */
const SPHERE=new THREE.SphereGeometry(1,12,8);   // 6 px across on screen; 16x12 was invisible detail
const STICK=new THREE.CylinderGeometry(1,1,1,8,1,true);
STICK.translate(0,0.5,0);            // origin at one end, so a bond is scale+aim

const VDW_DRAW={C:1.70, O:1.52, H:1.20};
function instancedSpheres(list, el){
  const pts=list.filter(a=>a.el===el);
  if(!pts.length) return null;
  const m=new THREE.InstancedMesh(SPHERE,
    new THREE.MeshLambertMaterial({color:P.atoms[el]||0x888888}), pts.length);
  /* Space-filling, at 0.9 of van der Waals. A cell wall is dense matter and a
     ball-and-stick one reads as a wire cage with gaps the water could swim
     through — which is the opposite of what a wall does. Slightly under the
     real shell so the corrugation between chains stays visible; colour, not
     size, is what separates wall from water here. */
  const r=(VDW_DRAW[el]||1.6)*0.9*A;
  const M=new THREE.Matrix4();
  pts.forEach((a,i)=>{ M.makeScale(r,r,r).setPosition(a.pos); m.setMatrixAt(i,M); });
  m.instanceMatrix.needsUpdate=true; root.add(m); return m;
}
const wallMeshes=['C','O','H'].map(el=>instancedSpheres(wallAtoms,el)).filter(Boolean);

const wallBondMesh=(function drawWallBonds(){
  const m=new THREE.InstancedMesh(STICK,
    new THREE.MeshLambertMaterial({color:P.bonds.covalent}), wallBonds.length);
  const M=new THREE.Matrix4(), q=new THREE.Quaternion(), up=new THREE.Vector3(0,1,0);
  const d=new THREE.Vector3(), s=new THREE.Vector3();
  wallBonds.forEach(([a,b],i)=>{
    const pa=wallAtoms[a].pos, pb=wallAtoms[b].pos;
    d.subVectors(pb,pa);
    q.setFromUnitVectors(up, s.copy(d).normalize());
    M.compose(pa, q, new THREE.Vector3(0.09*A, d.length(), 0.09*A));
    m.setMatrixAt(i,M);
  });
  m.instanceMatrix.needsUpdate=true; root.add(m); return m;
})();

/* ============================================================= *
 *  THE WATER
 * ============================================================= */
const wspec=MolLib.MOLECULES.water;             // family B, to scale
const OH=V3(wspec.atoms[1].pos), OH2=V3(wspec.atoms[2].pos);

/* A POOL, AND A SUPPLY BEHIND IT. This is the piece the bench was missing.
   A finite pool in a wetting pore cannot travel anywhere: its equilibrium is to
   spread itself into two thin films and stop, which is exactly what it did. A
   capillary rises because the tube stands in a BATH — as the front climbs, more
   water is drawn up behind it — and modelling the rest of the cell wall as an
   endless supply is not a cheat, it is what the rest of the cell wall is.

   So the bottom band is held at liquid density: whenever it thins, because the
   front above has drawn water out of it, another molecule arrives. Nothing
   pushes. The front climbs because the wall is dry, and the supply only keeps
   the base from emptying while it does. */
/* The pool at the foot of the pore, and it SCALES WITH THE SLOT: a wider pore
   given the same count starts as a puddle rather than a pool, and the width
   comparison would then be between two different experiments. Scaled, every
   width starts with a pool of the same depth and the only thing varying is the
   thing being varied.

   The count itself barely matters to where the run ends up — the supply refills
   the base either way, and the steady state is the wall's business, not the
   seed's. A smaller pool just starts further from it, so more of the filling is
   something you watch happen. */
let N_START=Math.round(300*(GAP/nm(3.5))*(DEPTH/nm(1.5)));
const N_MAX=1800;                      // enough to fill this pore, and a stop
const SUPPLY_BAND=8.0*A;               // the depth of base kept topped up
let N_WATER=N_MAX;                     // buffers are sized for the cap
/* THE WATER IS FLAT ARRAYS, NOT OBJECTS. Every pair the cell list finds is read
   several times a step — once for cohesion, once per H-bond search, twice per
   solver sweep, once for contact, once for viscosity — and through a Vector3
   each of those reads is a pointer hop the engine cannot fold away. Flattened,
   molecule i's position is PX[3i..3i+2] and its two hydrogens are HX[6i..6i+5],
   contiguous and unboxed.

   A molecule's index is its identity, and it never moves: nothing is spliced
   out of these arrays, only flagged GONE or SPENT, which is what the neighbour
   lists and the bond tables already assumed.

   The oxygen is gone as a separate vector, because it never was one: place()
   copied the centre into it every step. The centre IS the oxygen.

   What is not in a pair loop stays an object — the orientation is a
   Quaternion, since it is touched once per molecule per step and the rotation
   maths is worth more than the hop. */
const _v=new THREE.Vector3(), _u=new THREE.Vector3(), _w=new THREE.Vector3();
const PX=new Float32Array(3*N_WATER);        // centres, and the oxygens
const VX=new Float32Array(3*N_WATER);
const HX=new Float32Array(6*N_WATER);        // the two hydrogens, in world space
const FX=new Float32Array(3*N_WATER), TQ=new Float32Array(3*N_WATER);
const PV=new Float32Array(3*N_WATER);        // where a molecule was before the predict
const DPa=new Float32Array(3*N_WATER);       // the solver's correction for this sweep
const VA=new Float32Array(3*N_WATER);        // XSPH's accumulator
const WF=new Float32Array(3*N_WATER);        // the wall's long-range pull, held a few steps
const GONE=new Uint8Array(N_WATER), SPENT=new Uint8Array(N_WATER);
const VAPN=new Int32Array(N_WATER);          // steps spent alone in the channel
const HBN=new Int16Array(N_WATER);           // bonds held this step
const qArr=[];                               // orientation, one per molecule
let nW=0;                                    // molecules in play

const COH_MAX2=COH_MAX*COH_MAX, HB_MAX2=HB_MAX*HB_MAX;

function makeWater(p){
  const i=nW++;
  PX[3*i]=p.x; PX[3*i+1]=p.y; PX[3*i+2]=p.z;
  VX[3*i]=VX[3*i+1]=VX[3*i+2]=0;
  WF[3*i]=WF[3*i+1]=WF[3*i+2]=0;
  GONE[i]=0; SPENT[i]=0; VAPN[i]=0; HBN[i]=0;
  qArr[i]=new THREE.Quaternion().setFromEuler(new THREE.Euler(
    Math.random()*6.28, Math.random()*6.28, Math.random()*6.28));
  return i;
}
/* A POOL AT THE BOTTOM OF A DRY PORE. This is the initial condition the bench
   exists for: everything above the pool is bare cellulose, so the water has
   somewhere to go and whether it climbs is a result rather than a setup. An
   earlier version seeded the pore already full, which cannot show a climb for
   the same reason a full glass cannot show pouring.

   On a lattice at the liquid's own spacing, so nothing collapses or expands on
   the first frames and the only motion is the wetting. */
function seed(){
  nW=0;
  /* At contact, not inside it. The layers used to be stacked at 0.92 of this,
     which is 2.62 A against a 2.70 floor, so the pool was born with 445 pairs
     already overlapping and the first frames were the liquid shoving itself
     apart — visible as a bounce before anything else had happened. */
  /* SEEDED AT WATER'S DENSITY, NOT AT CONTACT. RHO_0 is measured off this
     lattice on the first step and the solver then holds the liquid there for
     ever, so the seed's density IS the model's density. Stacked at 2.85 it was
     0.0446 molecules per cubic angstrom against water's 0.0334 — 34% too dense,
     and every symptom followed: 6.2 neighbours inside 3.4 A against 4.5, 2.5
     H-bonds a molecule against 3.6, and a pore that held 1161 molecules where
     the real thing holds under 900.

     A cube root of 1/0.0334 is 3.10 A, so that is the spacing. Nearest
     neighbours are then meant to come IN to 2.76 on the H-bond's pull, leaving
     the rest further out — which is what an open tetrahedral network is, and
     what the bond now has the leverage to build.

     IT WORKED, on the two numbers that measure structure. Neighbours inside
     3.4 A went 6.2 to 4.9 against water's 4.5, and nearest neighbours sit at
     2.72 against a real 2.76. The liquid is OPEN now, which it has never been:
     that openness is water's anomaly, the reason ice floats, and the reason a
     pore holds fewer molecules than close packing would put in it.

     Bonds a molecule are 2.56 against a real 3.6, so half the story is still
     missing — with 4.9 neighbours and 2.56 bonds, only half of what is in reach
     is bonded, where real water manages four fifths. That is the angular
     criterion rejecting pairs the geometry ought to allow, and it is the next
     thread rather than this one. */
  const d=3.10*A;                                     // water's own density, as a spacing
  const nx=Math.max(1,Math.floor((GAP-2*R_WATER)/d)), nz=Math.max(1,Math.floor(DEPTH/d));
  /* SEEDED WITH THE CURVE ALREADY IN IT. A flat-topped lattice has to grow its
     own meniscus, and at these settings that takes a couple of thousand steps —
     several seconds in which the page is showing a shape that is not its answer.
     The sites are ranked as though the wall were already pulling, so the pool
     arrives concave and the physics only has to relax it. This is an initial
     condition, not a result: turn adhesion down and the same run flattens it out
     again, which is the check that it was not drawn. */
  const CURVE=11*A;                                   // how much lower the middle starts
  const sites=[];
  for(let lay=0;lay<80;lay++) for(let c=0;c<nx;c++) for(let r=0;r<nz;r++){
    const x=(c-(nx-1)/2)*d, y=FLOOR+1.2*A+lay*d, z=(r-(nz-1)/2)*d;
    const t=Math.abs(x)/(GAP/2);
    sites.push({x, y, z, rank:y-CURVE*t*t});
  }
  sites.sort((a,b)=>a.rank-b.rank);
  for(let i=0;i<N_START && i<sites.length;i++){
    const q=sites[i];
    makeWater(new THREE.Vector3(q.x+(Math.random()-0.5)*0.3*A,
                                q.y, q.z+(Math.random()-0.5)*0.3*A));
  }
}
seed();

// world positions of one water's hydrogens, from its own quaternion
const _ph=new THREE.Vector3();
function place(i){
  const q=qArr[i], x=PX[3*i], y=PX[3*i+1], z=PX[3*i+2];
  _ph.copy(OH).applyQuaternion(q);
  HX[6*i]=_ph.x+x; HX[6*i+1]=_ph.y+y; HX[6*i+2]=_ph.z+z;
  _ph.copy(OH2).applyQuaternion(q);
  HX[6*i+3]=_ph.x+x; HX[6*i+4]=_ph.y+y; HX[6*i+5]=_ph.z+z;
}
for(let i=0;i<nW;i++) place(i);

/* THE WATER IS SPACE-FILLING AND THE WALL IS NOT, and that is the one place
   this page departs from the house radii on purpose. PALETTE.radii are
   ball-and-stick sizes, chosen so one molecule's sticks show; at a real liquid's
   spacing (O...O 2.76 A) spheres that size leave gaps you could drive a
   molecule through, and 300 of them read as a gas. These are near van der Waals
   instead (O 1.40 A against a real 1.52, H 0.95 against 1.20), which is how a
   liquid has to be drawn if its density is the claim. The wall stays
   ball-and-stick, so structure and bulk do not look like the same substance. */
const R_O=1.40*A, R_H=0.95*A;
const oMesh=new THREE.InstancedMesh(SPHERE,
  new THREE.MeshLambertMaterial({color:P.atoms.O}), N_WATER);
const hMesh=new THREE.InstancedMesh(SPHERE,
  new THREE.MeshLambertMaterial({color:P.atoms.H}), N_WATER*2);
root.add(oMesh,hMesh);

/* NO DASHED H-BONDS, AND THEY WERE NEVER VISIBLE HERE. WaterSim.md 1's
   convention assumes ball-and-stick, where a dash between two atoms crosses
   open space. This page draws water space-filling instead — that is the note by
   R_O, and it is what makes the liquid read as a liquid — so the dash ran from
   an H's centre to an O's centre with both spheres drawn on top of it.

   Measured on a settled pool: the H...O line is 1.66 to 2.45 A, median 1.93,
   against 2.35 A of sphere (R_H 0.95 + R_O 1.40). 91% of the lines were buried
   whole, and the longest left 0.10 A showing, inside a neighbouring sphere.

   It was not free. computeLineDistances walks the whole line buffer whatever
   the draw range — 0.68 ms a frame — plus six endpoint writes per bond found,
   in the water pass and the wall's both. The bonds are still found and still
   counted; `H-bonds` in the readout is the same number it was.

   To bring them back, the water has to shrink to ball-and-stick first. */

/* ============================================================= *
 *  The physics. Same rules as the solvation engine, at real scale.
 * ============================================================= */
/* NO GRAVITY TERM. At 3.5 nm the capillary pressure is about 8e7 Pa and the
   gravitational pressure across the pore about 5e-5 Pa: twelve orders of
   magnitude, so weight is not a small effect here, it is no effect. A g that
   competes with wetting would have to be ~1e12 times Earth's, and the column it
   made would be a picture of a capillary tube in a dish rather than of a cell
   wall. What holds this liquid in place is the wall and its own cohesion, which
   is the whole claim, so nothing else may hold it. */
/* A THERMOSTAT, so the liquid has a temperature. Damping and jitter used to be
   two independent numbers, which is why neither did what its name said: drag
   and the noise that balances it are one thing, and their ratio IS the
   temperature. Set separately, most pairs of them are no temperature at all,
   and a molecule that lost its neighbours simply stopped — 0.01 A a step
   against the liquid's 0.48 — because nothing was putting energy back.
   Every molecule now takes the same treatment, and that word is load-bearing.
   Thermostatting only the stragglers is a Maxwell demon: energy in where a
   molecule came off the liquid, out everywhere else through the drag, and the
   wall harvested the difference as a film running up it.
   DAMP is the bath coupling now rather than a viscosity, so it says how fast a
   molecule forgets its own velocity, not how thick the water is. */
/* 0.99, NOT THE FORCE BUILD'S 0.93, and the reason is that DAMP does not mean
   what it meant there. It was the viscosity; here XSPH is the viscosity — it
   damps the difference between neighbours, so shear goes and the column's own
   motion stays — and DAMP is only drag on the prediction, which is to say
   friction against nothing.

   Turning it down was costing the whole page. Measured, front rise: 0.0017 A a
   step at 0.93 against 0.0109 at 0.99, six times, and 0.21 A a second against
   0.94 once the extra cost per step is paid. The liquid is not worse for it, it
   is better — nearest neighbours 2.76 A against a real 2.76, 2.58 H-bonds a
   molecule, nothing airborne, and the contact angle settling at 25 degrees,
   inside cellulose's band, where 0.93 gave 13. */
let DAMP=0.99;
/* How long a molecule may stand alone in the channel before it is put back in
   the reservoir. 40 steps is long enough that a surface molecule flickering
   free is left alone, short enough that nothing is seen hanging. */
const VAP_DWELL=40;
let condensed=0;
/* The thermal speed, CALIBRATED rather than converted: this model has no mass,
   no kB and no timestep, so there is no route from 300 K to a number here. What
   it has is one measurable with a real value to hit, the H-bonds a molecule
   holds, and the setting is whichever keeps most of them. Swept on a settled
   pool, 1000 steps, bonds per molecule against a real 3.6:

       off   1.82        0.10   1.69-1.73
       0.05  1.79-1.92   0.15   1.45          0.30  0.74

   0.05 it is: the bond count is the one it started with, and a molecule alone
   in the void moves at 0.07-0.12 A a step where it used to sit at 0.037.
   Above that the water simply heats — by 0.30 it is boiling, at a quarter of
   the bonds and twice the speed, which is what the count is there to catch.

   WHAT THIS DOES NOT DO IS MAKE THE LIQUID THERMAL. The bulk runs at about
   0.3 A a step and only ~0.05 of that is the thermostat; the rest is forces
   stirring it. A setting large enough to dominate tears the H-bond network
   apart, so at these force constants the temperature can be a floor under the
   slowest molecules and not much more. Say floor, not temperature. */
/* Higher than the force build's 0.05, and it has to be: there, thermal noise
   was competing with a liquid the forces were already shaking. Here nothing
   shakes it, so at 0.05 the pool sits genuinely motionless — bulk 0.02 A a
   step, which is a solid. 0.25 is what a liquid costs when nothing else is
   stirring it. */
let V_THERM=0.25*A;
let V_MAX=0;                      // speed ceiling, 0 for none
/* NO THERMOSTAT, AND NOTHING FOR IT TO DO. The force build needed one because
   its constraint pumped energy in: thermal share 0.369 A a step with it on
   against 0.208 with it off, and no setting that held the temperature left the
   column moving. Here the corrections are read back AS motion instead of being
   added on top of it, so there is nothing manufactured to take away. Whether
   that is true is the first thing to measure on this page. */
/* TORQUE, because a bond that only pulls centres together cannot build a
   network. Measured before this existed: 1385 pairs sat close enough to bond
   and 806 of them — 58% — failed the angle test, on a cut already looser than
   real water's (123 degrees against about 140). The molecules were in the right
   places pointing the wrong way, because nothing turned them: forces acted on
   centres and orientation was a random walk. A real H-bond ORIENTS both
   partners, and that is what lets a molecule satisfy four neighbours at once.

   Overdamped, like everything else here: a bond turns its partners toward
   alignment by a fraction each step rather than accumulating angular momentum
   nothing would carry.

   IT DID NOT RAISE THE BOND COUNT, and the reason is the useful part. Settled
   pool, 800 steps: no torque 1.97 bonds a molecule, 0.10 gives 1.92, 0.30 gives
   1.92, 0.60 with the thermal tumbling switched off entirely gives 2.05. All
   one number, against a real 3.6.

   The block is upstream. This liquid sits with 6 neighbours inside 3.4 A where
   real water has about 4.5, and its nearest neighbours are 2.44 A apart against
   2.76 — it is CLOSE-PACKED, not tetrahedral. A molecule with six neighbours
   crowding it cannot point two H's and two lone pairs at four of them, however
   well it is turned, so orientation was never what was short.

   The torque stays because it is right and it is free — 3.5 ms a step either
   way — and because the moment the liquid is opened up to its real spacing it
   is what will let a network form. The thing to fix is the density, and that is
   a steric floor being punched through rather than a constant being wrong:
   raising K_STERIC to hold 2.76 tears the liquid apart in an explicit
   integrator (0.45 bonds a molecule at 1.6). It wants a positional correction
   rather than a stiffer spring. */
let K_TORQ=0.10;                  // how far toward alignment a bond turns per step
const TORQ_MAX=0.25;              // and a cap, so a molecule pulled two ways cannot spin
/* The lone pairs, where the tetrahedron puts them: opposite the H's and out of
   their plane by half the tetrahedral angle. An acceptor turns the NEARER of
   the two toward the incoming H, which is what makes the second bond on an
   oxygen cost the first one nothing. */
const LP_C=Math.cos(54.75*Math.PI/180), LP_S=Math.sin(54.75*Math.PI/180);
/* 0.25, EIGHT TIMES THE OLD ONE, and the first setting of it that has ever
   changed a number. With the floor at the rest length the spring had nothing to
   pull against and 0 to 0.09 all read the same; below it, the bond decides where
   a neighbour sits and 0.03 to 0.25 moves bonds a molecule 2.32 to 2.59. */
let K_HB=0.25;                    // H-bond spring
/* COHESION LIVES AT THE SURFACE HERE, NOT IN THE BULK, and both halves of that
   were measured. Swept 0.010 to 0.140 with the supply held, the bulk does not
   move at all: bonds a molecule 2.55-2.71, nearest neighbour 2.72-2.73 A,
   neighbours inside 3.4 A 6.4-6.7, all flat inside run-to-run noise across a
   fourteen-fold range. The solver holds the liquid together now, so cohesion
   has nothing left to do there.

   The free surface is a different story. Sampling the middle of the pore over
   300 steps and taking how much it ripples — capillary waves, whose amplitude
   goes as sqrt(kT/gamma), the closest thing to a surface tension this bench can
   read:

       cohesion 0.020    ripple 1.11 A
       cohesion 0.072    ripple 0.34 A
       cohesion 0.140    ripple 0.37 A

   A slack surface at the bottom, a stiff one above, and a knee between. That is
   why the meniscus changes with this slider while none of the bulk numbers do.

   AND ADHESION IS NOT CALIBRATABLE BY A SINGLE RUN IN THIS RANGE, which is the
   most important thing on this page. Fed, settled, cohesion 0.072, the readings
   went 0.025 -> 54 degrees, 0.026 -> 31, 0.027 -> 58, 0.028 -> 21. Not a curve:
   the same 0.026 run twice gave 31 degrees with the water 17 A up the wall, and
   70 degrees with it 4 A up. The pore is BISTABLE — it lands wetted or unwetted
   and which one is down to the run — so a single measurement anywhere near here
   is a coin toss being read as a constant.

   That is probably real. Capillary filling in a pore this narrow has a
   nucleation barrier, so it is stochastic near the threshold and shows
   hysteresis; the wall bilayers on the two faces nearly touch, and whether they
   bridge is a matter of chance. But real or not, it means adhesion cannot be
   set by one run. What can be measured here is the PROBABILITY of wetting
   against adhesion, over repeats, and the honest calibration is either that or
   a setting far enough inside the wetted basin that no run escapes it.

   0.072 SITS AT THE KNEE: the lowest setting where the surface is fully stiff.
   That is what defends it, rather than the bond count, which has no opinion.
   Above the knee the measurement saturates and cannot separate 0.072 from
   0.140 — pinning it there would need the real thing, a Laplace measurement of
   the pressure jump across a curved interface against water's 72 mN/m. */
let K_COH=0.072;                // dispersion, the undirected part of cohesion
const K_WALL=0.20;                // the wall is solid
/* Adhesion beats cohesion here, and that is the whole reason the meniscus is
   concave: a hydroxyl surface offers water the same bond another water does,
   and there are more of them per unit area than a curved liquid surface can
   present back. Under-set this and the render tells the waxed-windshield story
   by accident. */
const K_ADHERE=0.075;             // the bond itself, directional
const K_ADHERE_LR=0.075;          // and the undirected pull from one hydroxyl
/* THE WALL AS A WALL, not as a bag of separate atoms. A single hydroxyl's pull
   dies inside about 6 A, so a liquid that once lets go of the surface can never
   feel it again and stays balled up in the middle of the pore — which is the
   waxed windshield, not a cell wall. A solid attracts by the SUM over everything
   behind the surface, and that sum falls off far more slowly than any one pair.
   This is that sum, as a smooth pull toward the face; the drawn dashes still
   come only from real H-bond geometry, so nothing is claimed that is not there. */
/* Set for IMBIBITION, now that there is a supply. Without one, a strong wall
   pull drained the pool into two films and stopped, so the setting had to be
   weak enough to keep the pool a body. Fed from below, that same strong pull is
   the whole point: the film runs up the dry wall, the liquid behind follows,
   and water is drawn in at the base to replace it. From a 420-molecule pool the
   front crosses the pore's 94 A in about 1500 steps and the count climbs past
   700 doing it. Turn it down toward 0.037 and the front creeps; turn it off and
   the pool sits there. */
let K_WET=0.006*A;              // per surface atom, summed; not per molecule
/* RECALIBRATED FOR THE OPEN LIQUID, and the old 0.026 is void: a different
   liquid has a different contact angle, and after the H-bond work 0.026 read 4
   degrees with a 58 A film where it had read 25. Measured again on the new
   one, 1800 steps, supply on:

       0.004   70 deg    climb  -1 A    barely wetting
       0.006   23 deg    climb  15 A    the band, and a meniscus
       0.007   16 deg    climb  23 A
       0.012    8 deg    climb  47 A    films

   THE SIZE OF THE NUMBER MEANS NOTHING. It is per wall atom and summed over
   several hundred of them, so 0.006 is not "small" — only the angle it produces
   is a claim about anything.

   CLIMB AT WALL IS THE SECOND CHECK, and it is the one that separates the two
   regimes by eye. The pore is 35 A across; water standing 15 A higher at the
   faces than in the middle is a meniscus spanning it, and water standing 47 A
   higher is two films with a gap between them, which pulls on nothing. Past
   complete wetting the extra adhesion cannot raise the column — cos(theta) is
   already 1 — so it goes into spreading instead.

   Chosen on one run at each setting, which the bistability note by K_COH says
   is not enough. It wants the same treatment 0.026 got: watched over several. */
const WET_REACH=11.0*A;

let hbCount=0, adCount=0;
const _t1=new THREE.Vector3(), _t2=new THREE.Vector3(), _t3=new THREE.Vector3(),
      _t4=new THREE.Vector3(), _t5=new THREE.Vector3();
const _lpA=new THREE.Vector3(), _lpB=new THREE.Vector3();
// the two lone-pair directions, from where the molecule is pointing now
function lonePairs(i,a,b){
  _t1.set(HX[6*i]-PX[3*i], HX[6*i+1]-PX[3*i+1], HX[6*i+2]-PX[3*i+2]).normalize();
  _t2.set(HX[6*i+3]-PX[3*i], HX[6*i+4]-PX[3*i+1], HX[6*i+5]-PX[3*i+2]).normalize();
  _t3.copy(_t1).add(_t2).normalize();            // the H-O-H bisector
  b.crossVectors(_t1,_t2).normalize();           // and the plane's normal
  a.copy(_t3).multiplyScalar(-LP_C).addScaledVector(b, LP_S);
  b.multiplyScalar(LP_S).addScaledVector(_t3,-LP_C);
}
/* Turn `from` toward `to`, as a rotation vector added to this molecule's share.
   Axis and angle come out of the cross and dot, so a molecule being turned by
   two bonds at once gets the sum and lands between them, which is the
   compromise a real molecule in a network is making. */
function aim(i,from,to,k){
  _t4.crossVectors(from,to);
  const sn=_t4.length();
  if(sn<1e-6) return;
  const s=Math.atan2(sn, from.dot(to))*k/sn;
  TQ[3*i]+=_t4.x*s; TQ[3*i+1]+=_t4.y*s; TQ[3*i+2]+=_t4.z*s;
}
/* A CELL LIST, because every pair is not worth asking about. Testing all 405k
   pairs of 900 molecules cost about 15 ms a step, which made the speed control
   a lie: eight steps a frame ran at eight frames a second and simulated no more
   per second than one step a frame did. Molecules further apart than COH_MAX
   exert nothing, so bin them at that size and only ask about the 27 cells that
   can reach. The pairs actually tested drop to roughly a tenth. */
/* AND THE BINS ARE A FLAT GRID, NOT A Map. Keying a Map by a packed integer
   costs a hash and a lookup, and the walk does 27 of them per molecule per
   step: measured at 800 molecules, building the bins and walking them — with no
   force arithmetic at all — was 2.61 ms of a 2.94 ms cohesion pass. The pore is
   a box of known size, so the bins can be an array indexed by arithmetic, and
   the molecules counting-sorted into one flat list per step rather than pushed
   into 156 little ones.

   Indices are clamped rather than rejected. A molecule outside the box lands in
   the edge bin, which can only ever add pairs to test, never lose one: clamping
   is monotonic, so two molecules within a bin's width of each other cannot be
   clamped into non-adjacent bins. */
const CELL=COH_MAX;
const GRID_X0=-GAP/2-CELL, GRID_Y0=FLOOR-CELL, GRID_Z0=-DEPTH/2-CELL;
const GRID_Y1=Math.max(...wallAtoms.map(a=>a.pos.y))+12*A;   // above this a molecule is gone
const GX=Math.max(1,Math.ceil((GAP+2*CELL)/CELL));
const GY=Math.max(1,Math.ceil((GRID_Y1-GRID_Y0)/CELL));
const GZ=Math.max(1,Math.ceil((DEPTH+2*CELL)/CELL));
const NCELL=GX*GY*GZ;
const cellStart=new Int32Array(NCELL+1), cellFill=new Int32Array(NCELL);
const cellCount=new Int32Array(NCELL), cellItems=new Int32Array(N_WATER);
const cellOf=new Int32Array(N_WATER);
const clamp=(v,hi)=>v<0?0:(v>=hi?hi-1:v);
function gridBuild(n,PX,GONE,cellOf,cellCount,cellStart,cellFill,cellItems){
  cellCount.fill(0);
  for(let i=0;i<n;i++){
    if(GONE[i]){ cellOf[i]=-1; continue; }
    const gx=clamp(Math.floor((PX[3*i]  -GRID_X0)/CELL), GX);
    const gy=clamp(Math.floor((PX[3*i+1]-GRID_Y0)/CELL), GY);
    const gz=clamp(Math.floor((PX[3*i+2]-GRID_Z0)/CELL), GZ);
    const c=(gx*GY+gy)*GZ+gz;
    cellOf[i]=c; cellCount[c]++;
  }
  let acc=0;
  for(let c=0;c<NCELL;c++){ cellStart[c]=acc; cellFill[c]=acc; acc+=cellCount[c]; }
  cellStart[NCELL]=acc;
  for(let i=0;i<n;i++){ const c=cellOf[i]; if(c>=0) cellItems[cellFill[c]++]=i; }
}
const NBR_MAX=48;                                  // a water never has this many inside 6.2 A
const nbr=new Int16Array(N_WATER*NBR_MAX), nbrN=new Int16Array(N_WATER);
const accepted=new Uint8Array(N_WATER), bondedWith=new Int16Array(N_WATER);
/* WHO EACH MOLECULE IS BONDED TO THIS STEP, up to the four an oxygen can manage.
   contacts() needs it: two waters may only approach within van der Waals
   contact if a hydrogen bond is holding them there, and that is the difference
   between a tetrahedral liquid and a heap of spheres. */
const BOND_MAX=4;
const bondTo=new Int16Array(N_WATER*BOND_MAX), bondN=new Uint8Array(N_WATER);
function isBonded(i,j,bondTo,bondN,BOND_MAX){
  for(let k=0;k<bondN[i];k++) if(bondTo[i*BOND_MAX+k]===j) return true;
  return false;
}
/* NO PRESSURE CONSTANT AND NO BATH PRESSURE. Both were the force build's way
   of saying "the liquid is incompressible and the reservoir pushes", and both
   are the solver's job here. The base pushes because it is held at rest density
   while the front is not; that is the same solve, not a second term. */
let stepNo=0;
/* THE HOT LOOPS TAKE THEIR STATE AS ARGUMENTS, and that is a 3x on the pair
   pass rather than a tidy-up. A top-level `const` in a classic script lives in
   the global lexical environment, and every read of one from inside a loop is a
   scope lookup the engine will not hoist out. Measured on the cohesion pass
   alone at 392 molecules: 1.96 ms a step reading them as globals, 0.57 ms with
   the identical code reading them as parameters. Passing them in shadows each
   global with a local of the same name, so the body needs no other change.

   Only what the body never assigns may travel this way. The counters and the
   sliders' own variables stay global, which is also why turning a knob still
   bites on the very next step. */
function step(){
  return _step(PX,VX,HX,FX,TQ,PV,WF,GONE,HBN,VAPN,nbr,nbrN,accepted,
    bondTo,bondN,bondedWith,qArr,nW,
    COH_MAX,COH_MAX2,OO_EQ,NBR_MAX,CELL,HB_MAX,HB_MAX2,HB_LIN,BOND_MAX,
    K_COH,K_HB,K_TORQ,K_WALL,K_WET,K_ADHERE,K_ADHERE_LR,WET_REACH,R_WATER,
    DAMP,V_THERM,V_MAX,TORQ_MAX,VAP_DWELL,GAP,DEPTH,FLOOR);
}
function _step(PX,VX,HX,FX,TQ,PV,WF,GONE,HBN,VAPN,nbr,nbrN,accepted,
    bondTo,bondN,bondedWith,qArr,nW,
    COH_MAX,COH_MAX2,OO_EQ,NBR_MAX,CELL,HB_MAX,HB_MAX2,HB_LIN,BOND_MAX,
    K_COH,K_HB,K_TORQ,K_WALL,K_WET,K_ADHERE,K_ADHERE_LR,WET_REACH,R_WATER,
    DAMP,V_THERM,V_MAX,TORQ_MAX,VAP_DWELL,GAP,DEPTH,FLOOR){
  stepNo++;
  const n=nW;
  FX.fill(0,0,3*n); TQ.fill(0,0,3*n);

  // --- pairwise: steric floor, then the H-bond that pulls them back together
  hbCount=0; adCount=0;
  /* The pair pass keeps a neighbour list, because the H-bond search below wants
     exactly the pairs this loop already found and running it over all n^2 again
     was two thirds of the frame. Counts live in typed arrays rather than a Map
     and a Set of string keys — 180k `i+'|'+j` allocations a frame is most of
     the rest of it. */
  for(let i=0;i<n;i++){ nbrN[i]=0; accepted[i]=0; }

  gridBuild(n,PX,GONE,cellOf,cellCount,cellStart,cellFill,cellItems);

  for(let i=0;i<n;i++){
    if(GONE[i]) continue;
    const ax=PX[3*i], ay=PX[3*i+1], az=PX[3*i+2];
    const bx=clamp(Math.floor((ax-GRID_X0)/CELL),GX),
          by=clamp(Math.floor((ay-GRID_Y0)/CELL),GY),
          bz=clamp(Math.floor((az-GRID_Z0)/CELL),GZ);
    let fx=0, fy=0, fz=0;
    for(let dx=-1;dx<=1;dx++){ const cx=bx+dx; if(cx<0||cx>=GX) continue;
    for(let dy=-1;dy<=1;dy++){ const cy=by+dy; if(cy<0||cy>=GY) continue;
    for(let dz=-1;dz<=1;dz++){ const cz=bz+dz; if(cz<0||cz>=GZ) continue;
    const c=(cx*GY+cy)*GZ+cz;
    for(let q=cellStart[c], qe=cellStart[c+1]; q<qe; q++){
      const j=cellItems[q];
      if(j<=i) continue;               // each pair once, whichever bin finds it
      const rx=ax-PX[3*j], ry=ay-PX[3*j+1], rz=az-PX[3*j+2];
      const d2=rx*rx+ry*ry+rz*rz;
      if(d2>COH_MAX2 || d2<1e-8) continue;
      const d=Math.sqrt(d2);
      if(nbrN[i]<NBR_MAX) nbr[i*NBR_MAX+nbrN[i]++]=j;
      if(nbrN[j]<NBR_MAX) nbr[j*NBR_MAX+nbrN[j]++]=i;
      if(d>OO_EQ){
        /* Dispersion, outside the rest length only — and ZERO AT THE REST
           LENGTH, which is the correction. It used to be strongest exactly
           there: `fade` was 1 at d = OO_EQ and fell away outward, so a pair
           sitting at its own equilibrium was being pulled inward as hard as the
           term could pull, while contact pushed it back out. Every touching
           pair in the liquid was in that tug of war, and the energy it threw
           off is what shook the whole pool — bulk speed 0.79 A a step, molecules
           flung clear of the surface and stranded on the dry wall. Lowering
           K_COH quietened it because it made the fight weaker, which is how the
           fight was spotted.

           Force at a potential's minimum is zero. This one now rises from
           nothing at OO_EQ, peaks midway out, and falls back to nothing at
           COH_MAX. */
        const t=(d-OO_EQ)/(COH_MAX-OO_EQ);      // 0 at contact, 1 at the cutoff
        /* t(1-t) peaks at 0.25, which is what the old curve was worth in the
           middle of its range: the shape changes, the strength a pair feels
           halfway out does not, so K_COH still means what it meant. Normalised
           to 1 instead, the mid-range pull is four times the old one and the
           pool boils out of the pore. */
        const s=-K_COH*t*(1-t)/d;
        const ux=rx*s, uy=ry*s, uz=rz*s;
        fx+=ux; fy+=uy; fz+=uz;
        FX[3*j]-=ux; FX[3*j+1]-=uy; FX[3*j+2]-=uz;
      }
    }
    }}}
    FX[3*i]+=fx; FX[3*i+1]+=fy; FX[3*i+2]+=fz;
  }

  /* NO PRESSURE TERM. Density is the solver's constraint, below, not a force
     added alongside the others: the whole point of this build is that the two
     stop being separate things. */
  // --- H-bonds: a donor H reaching a lone pair, one bond per H, two per oxygen
  for(let i=0;i<n;i++){ HBN[i]=0; bondedWith[i]=-1; bondN[i]=0; }
  for(let i=0;i<n;i++){
    if(GONE[i]) continue;
    const ox=PX[3*i], oy=PX[3*i+1], oz=PX[3*i+2];
    for(let k=0;k<2;k++){
      const hx=HX[6*i+3*k], hy=HX[6*i+3*k+1], hz=HX[6*i+3*k+2];
      // this O-H's direction, which the linearity test measures against
      let ohx=hx-ox, ohy=hy-oy, ohz=hz-oz;
      const ohl=Math.sqrt(ohx*ohx+ohy*ohy+ohz*ohz)||1;
      ohx/=ohl; ohy/=ohl; ohz/=ohl;
      let best=-1, bestD=HB_MAX, bestLin=0;
      for(let q=0;q<nbrN[i];q++){
        const j=nbr[i*NBR_MAX+q];
        if(GONE[j]) continue;
        if(accepted[j]>=2) continue;                 // an oxygen has two lone pairs
        if(bondedWith[i]===j) continue;              // and one pair shares one bond
        const vx=PX[3*j]-hx, vy=PX[3*j+1]-hy, vz=PX[3*j+2]-hz;
        const dd=Math.sqrt(vx*vx+vy*vy+vz*vz);
        if(dd<bestD && dd>1e-6){
          const lin=(ohx*vx+ohy*vy+ohz*vz)/dd;
          if(lin>HB_LIN){ best=j; bestD=dd; bestLin=lin; }
        }
      }
      if(best<0) continue;
      accepted[best]++;
      bondedWith[i]=best;
      HBN[i]++; HBN[best]++; hbCount++;
      if(bondN[i]<BOND_MAX) bondTo[i*BOND_MAX+bondN[i]++]=best;
      if(bondN[best]<BOND_MAX) bondTo[best*BOND_MAX+bondN[best]++]=i;
      const dx=PX[3*best]-ox, dy=PX[3*best+1]-oy, dz=PX[3*best+2]-oz;
      const dist=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
      /* The donor turns this O-H onto the acceptor's oxygen, and the acceptor
         turns its nearer lone pair onto this H. Both, because a bond that only
         straightened the donor would leave the acceptor's other three
         directions pointing wherever they were. */
      aim(i, _t5.set(ohx,ohy,ohz), _t3.set(dx/dist,dy/dist,dz/dist), K_TORQ);
      lonePairs(best,_lpA,_lpB);
      _t3.set(hx-PX[3*best], hy-PX[3*best+1], hz-PX[3*best+2]).normalize();
      aim(best, _lpA.dot(_t3)>=_lpB.dot(_t3)?_lpA:_lpB, _t3, K_TORQ);
      const s=(dist-OO_EQ)*K_HB*bestLin/dist;
      FX[3*i]+=dx*s; FX[3*i+1]+=dy*s; FX[3*i+2]+=dz*s;
      FX[3*best]-=dx*s; FX[3*best+1]-=dy*s; FX[3*best+2]-=dz*s;
    }
  }

  // --- the wall: solid, and covered in hydroxyls that will hold on
  _wallPass(n,PX,HX,FX,TQ,GONE,WF,
    surfX,surfY,surfZ,surfR,surfStart,ohOX,ohOY,ohOZ,ohHX,ohHY,ohHZ,ohStart,NB,
    GAP,DEPTH,FLOOR,R_WATER,K_WALL,WET_REACH,K_WET,COH_MAX,OO_EQ,
    K_ADHERE,K_ADHERE_LR,K_TORQ,HB_MAX2,5.0*A);

  /* ---- PREDICT ----
     Forces move the velocity, the velocity moves a TRIAL position, and nothing
     is committed until the solver has had it. */
  const sd=V_THERM*Math.sqrt(1-DAMP*DAMP);
  for(let i=0;i<n;i++){
    if(GONE[i]) continue;
    let vx=(VX[3*i]  +FX[3*i]  )*DAMP + _gauss()*sd;
    let vy=(VX[3*i+1]+FX[3*i+1])*DAMP + _gauss()*sd;
    let vz=(VX[3*i+2]+FX[3*i+2])*DAMP + _gauss()*sd;
    if(nbrN[i]===0 && HBN[i]===0) VAPN[i]++; else VAPN[i]=0;
    if(VAPN[i]>VAP_DWELL){
      PX[3*i]=(Math.random()-0.5)*(GAP-3*A);
      PX[3*i+1]=FLOOR+0.4*A;
      PX[3*i+2]=(Math.random()-0.5)*DEPTH;
      vx=vy=vz=0; VAPN[i]=0; condensed++;
    }
    VX[3*i]=vx; VX[3*i+1]=vy; VX[3*i+2]=vz;
    PV[3*i]=PX[3*i]; PV[3*i+1]=PX[3*i+1]; PV[3*i+2]=PX[3*i+2];
    PX[3*i]+=vx; PX[3*i+1]+=vy; PX[3*i+2]+=vz;
  }

  solve();

  /* ---- AND THE VELOCITY IS READ BACK OFF THE MOTION ----
     This one line is the whole argument for this build. A molecule's velocity
     is how far it ACTUALLY went, so a molecule the solver held still is still,
     and one the solver carried is carrying. In the force build the correction
     and the velocity were separate stories and the difference between them was
     energy from nowhere. */
  for(let i=0;i<n;i++){
    if(GONE[i]) continue;
    let vx=PX[3*i]-PV[3*i], vy=PX[3*i+1]-PV[3*i+1], vz=PX[3*i+2]-PV[3*i+2];
    if(V_MAX>0){
      const sp=Math.sqrt(vx*vx+vy*vy+vz*vz);
      if(sp>V_MAX){ const s=V_MAX/sp; vx*=s; vy*=s; vz*=s; }
    }
    VX[3*i]=vx; VX[3*i+1]=vy; VX[3*i+2]=vz;
  }
  viscosity();
  for(let i=0;i<n;i++){
    if(GONE[i]) continue;
    const tx=TQ[3*i], ty=TQ[3*i+1], tz=TQ[3*i+2];
    const ang=Math.sqrt(tx*tx+ty*ty+tz*tz);
    if(ang>1e-6) qArr[i].premultiply(_qt.setFromAxisAngle(
      _t5.set(tx/ang,ty/ang,tz/ang), Math.min(ang,TORQ_MAX)));
    qArr[i].multiply(_tumble());
    place(i);
  }


}

/* The wall, as its own pass so that the flat bucket arrays can be locals here
   rather than another dozen parameters on _step. Same reason the rest of the
   step takes its state as arguments. */
function _wallPass(n,PX,HX,FX,TQ,GONE,WF,
    surfX,surfY,surfZ,surfR,surfStart,ohOX,ohOY,ohOZ,ohHX,ohHY,ohHZ,ohStart,NB,
    GAP,DEPTH,FLOOR,R_WATER,K_WALL,WET_REACH,K_WET,COH_MAX,OO_EQ,
    K_ADHERE,K_ADHERE_LR,K_TORQ,HB_MAX2,reach){
  for(let i=0;i<n;i++){
    if(GONE[i]) continue;
    const px=PX[3*i], py=PX[3*i+1], pz=PX[3*i+2];
    let fx=FX[3*i], fy=FX[3*i+1], fz=FX[3*i+2];
    // contact with the wall's own atoms, at their radii
    const side=Math.sign(px)||1;
    const base=side>0?NB:0, bk=bucketOf(py);
    if(Math.abs(px) > GAP/2 - reach){
      const b0=bk-1<0?0:bk-1, b1=bk+1>=NB?NB-1:bk+1;
      for(let bb=b0;bb<=b1;bb++)
      for(let k=surfStart[base+bb], ke=surfStart[base+bb+1]; k<ke; k++){
        const vx=px-surfX[k], vy=py-surfY[k], vz=pz-surfZ[k];
        const d=Math.sqrt(vx*vx+vy*vy+vz*vz), touch=surfR[k]+R_WATER;
        if(d<touch && d>1e-4){
          const s=(touch-d)/d*K_WALL;
          fx+=vx*s; fy+=vy*s; fz+=vz*s;
        }
      }
    }
    /* The surface's long-range share, summed over the atoms themselves rather
       than applied as a push along -x. The direction matters: a sideways-only
       wall force cannot lift anything, so the column sat with a dead flat top
       however strongly it was wetted. Pulled toward real atoms, a molecule at
       the top of the column feels the wall ABOVE it too, and climbs — which is
       the meniscus, and then capillary rise, and neither had to be drawn. */
    /* Summed over a few hundred wall atoms, and REUSED for a few steps. The
       wall does not move and a molecule crosses a fraction of an angstrom per
       step, so recomputing this every step for every molecule was the single
       most expensive thing in the frame and it returned nearly the same vector
       each time. Each molecule refreshes on its own step, so the cost is spread
       and no frame carries all of it. */
    if((stepNo+i)%4===0){
      let wx=0, wy=0, wz=0;
      if(GAP/2-Math.abs(px) < WET_REACH && Math.abs(px) < GAP/2){
        const b0=bk-4<0?0:bk-4, b1=bk+4>=NB?NB-1:bk+4;
        for(let bb=b0;bb<=b1;bb++)
        for(let k=surfStart[base+bb], ke=surfStart[base+bb+1]; k<ke; k++){
          const vx=surfX[k]-px, vy=surfY[k]-py, vz=surfZ[k]-pz;
          const d=Math.sqrt(vx*vx+vy*vy+vz*vz);
          if(d>WET_REACH || d<1e-4) continue;
          const t=1-d/WET_REACH, s=K_WET*t*t/d;
          wx+=vx*s; wy+=vy*s; wz+=vz*s;
        }
      }
      WF[3*i]=wx; WF[3*i+1]=wy; WF[3*i+2]=wz;
    }
    fx+=WF[3*i]; fy+=WF[3*i+1]; fz+=WF[3*i+2];
    /* THE FACE IS THE LIMIT. This backstop used to sit an angstrom BEHIND the
       face, and with the steric list only holding atoms near the surface, a
       molecule that got past the outermost ones found nothing behind them and
       sank into the wall: a quarter of the water ended up inside the cellulose,
       riding high in its grooves, which is also what made an early version look
       like it had a meniscus. It did not. It had a leak. */
    const deep=Math.abs(px)-(GAP/2-R_WATER);
    if(deep>0) fx -= side*deep*K_WALL*8;
    const outZ=Math.abs(pz)-DEPTH/2;
    if(outZ>0) fz -= Math.sign(pz)*outZ*K_WALL;
    // The supply boundary. Not a floor holding anything up — with no gravity
    // nothing falls — but the edge of the modelled region, where water comes in
    // from the rest of the wall and where a molecule fed back in appears.
    if(py<FLOOR) fy += (FLOOR-py)*K_WALL;
    if(Math.abs(px) < GAP/2-reach){      // too far in to feel a hydroxyl
      FX[3*i]=fx; FX[3*i+1]=fy; FX[3*i+2]=fz;
      continue;
    }
    const o0=bk-1<0?0:bk-1, o1=bk+1>=NB?NB-1:bk+1;
    for(let bb=o0;bb<=o1;bb++)
    for(let k=ohStart[base+bb], ke=ohStart[base+bb+1]; k<ke; k++){
      const sox=ohOX[k], soy=ohOY[k], soz=ohOZ[k];
      if(Math.abs(soz-pz)>reach) continue;
      if(Math.abs(soy-py)>reach) continue;
      const vx=sox-px, vy=soy-py, vz=soz-pz;
      const dist=Math.sqrt(vx*vx+vy*vy+vz*vz)||1;
      if(dist>COH_MAX) continue;
      /* Two parts, as the force really has two. A hydroxyl pulls on a water
         whatever way either is turned — that is the electrostatics, and it is
         what wets the wall. The BOND is the strong directional part on top,
         and it is counted separately: `wall contacts` in the readout is real
         bond geometry, not water merely being near. */
      const fade=1-(dist-OO_EQ)/(COH_MAX-OO_EQ);
      if(fade>0){
        const s=K_ADHERE_LR*fade*fade/dist;
        fx+=vx*s; fy+=vy*s; fz+=vz*s;
      }

      const shx=ohHX[k]-px, shy=ohHY[k]-py, shz=ohHZ[k]-pz;
      const donates=shx*shx+shy*shy+shz*shz<HB_MAX2;
      const d0=(HX[6*i]-sox)**2+(HX[6*i+1]-soy)**2+(HX[6*i+2]-soz)**2;
      const d1=(HX[6*i+3]-sox)**2+(HX[6*i+4]-soy)**2+(HX[6*i+5]-soz)**2;
      const accepts=!donates && (d0<HB_MAX2 || d1<HB_MAX2);
      if(!donates && !accepts) continue;
      /* Adhesion is the same bond to a different partner, so it turns the water
         the same way. Only the water turns: the cellulose is a solid. */
      if(donates){
        lonePairs(i,_lpA,_lpB);
        _t3.set(shx,shy,shz).normalize();
        aim(i, _lpA.dot(_t3)>=_lpB.dot(_t3)?_lpA:_lpB, _t3, K_TORQ);
      } else {
        const kk=d0<HB_MAX2?0:1;
        aim(i, _t5.set(HX[6*i+3*kk]-px, HX[6*i+3*kk+1]-py, HX[6*i+3*kk+2]-pz).normalize(),
               _t3.set(vx/dist, vy/dist, vz/dist), K_TORQ);
      }
      const sa=(dist-OO_EQ)*K_ADHERE/dist;
      fx+=vx*sa; fy+=vy*sa; fz+=vz*sa;
      adCount++;
    }
    FX[3*i]=fx; FX[3*i+1]=fy; FX[3*i+2]=fz;
  }
}

/* =============================================================
 *  THE SOLVER. Density is a constraint, not a force.
 *
 *  Each molecule carries C_i = rho_i/rho0 - 1: zero when the water around it is
 *  at liquid density, positive when it is crowded, negative when it is
 *  stretched. The solver finds the smallest set of position changes that drives
 *  every C_i to zero at once, a few sweeps of it, and those changes ARE the
 *  motion — a molecule pushed out of a crowd has moved, and its velocity says
 *  so afterwards.
 *
 *  Which is why pressure and incompressibility stop fighting here: there is no
 *  pressure term left to fight with. A column being drawn up is the same solve
 *  as a crowd relaxing, and the reservoir pushing is nothing but the base being
 *  held at rest density while the front is not.
 *
 *  Macklin & Muller 2013, with the standard poly6/spiky pair.
 * ============================================================= */
const H=COH_MAX;                        // the kernel's reach
const H2=H*H, H6=Math.pow(H,6), H9=Math.pow(H,9);
const POLY6=315/(64*Math.PI*H9), SPIKY=-45/(Math.PI*H6);
const wPoly=r2=>{ const t=H2-r2; return t>0 ? POLY6*t*t*t : 0; };
/* Spiky for the gradient, poly6 for the value, which is not a taste: poly6's
   gradient vanishes as two molecules touch, so a pair sitting on top of each
   other would feel nothing pushing them apart. */
const gSpiky=r=>{ const t=H-r; return t>0 ? SPIKY*t*t : 0; };

/* ONE SWEEP. The density constraint is not what sets this liquid's spacing —
   the contact constraint is, and it runs inside every sweep either way — so
   extra density sweeps refine a number that has already converged. Settled at
   800 molecules, one sweep against two:

       step        5.9 ms      7.3 ms
       nearest     2.72 A      2.73 A       real water 2.76
       coordination 4.48       4.63         real water 4.5
       bonds       2.52        2.57

   A fifth of the whole step, and the coordination lands NEARER the real number
   for it. The pore still wets: 2500 steps with the supply on gave 26 A of climb
   at 16 degrees against 23 A at 18. One run each, and this pore is bistable
   near threshold — see the note by K_COH — so read that as "no worse", not as a
   difference.

   Turn it up when the liquid is being changed rather than watched: a stiffer
   constraint or a different kernel will need the sweeps back while it settles.

   A SKIN ON THE NEIGHBOUR LIST DOES NOT PAY, which is worth recording so nobody
   tries it twice. Molecules move 0.27 A a step against a 6.2 A cutoff, so a
   skin large enough to survive several steps inflates the list faster than it
   saves rebuilds: 0.05 A of skin cost 4.91 ms a step with a 26.8-neighbour
   list, 0.8 A cost 4.82 with 34.6, 1.6 A cost 5.68 with 46.3, 2.4 A cost 6.85
   with 53.7. The one-pass bin build this already does is the right structure
   for a liquid this mobile. */
let SOLVER_ITERS=1;
/* How much of each sweep's correction is applied — a NUMERICAL setting, not a
   physical one, and that is why it may be pushed. Under-relaxing does not make
   the liquid different; it makes the solver arrive at the same answer more
   slowly, and a density deficit therefore travels down the column at a fraction
   of the rate the solve says it should. Since the fill is limited by exactly
   that transport, this is the knob the rise rate hangs on.

   Swept, 3000 steps from the same seed, supply on, evaporation off:

       0.20   front -8.4 A   1.04 A/s   nearest 2.73   bonds 2.50
       0.35   front -2.6     1.47       nearest 2.73   bonds 2.50
       0.45   front -7.6     1.42       nearest 2.71   bonds 2.54
       0.55   front +0.8     1.96       nearest 2.72   bonds 2.47
       0.65   BLOWS APART    —          nearest 3.32   bonds 0.49

   0.45 for about 1.4x the rise with the liquid untouched. 0.55 reads faster
   still and is not taken: 0.65 detonates — 3.32 A between neighbours, half a
   bond a molecule, bulk speed 1.6 A a step, which is a gas — and a default one
   notch from that cliff is a default that will fall off it when something else
   changes. */
let RELAX=0.45;
/* CFM relaxation. It sits in the denominator with the summed gradients, so it
   has to be small against them or every multiplier comes out zero and the pool
   simply falls through itself — measured, at 600 the liquid collapsed to 0.5 A
   spacing with 48 neighbours a molecule. Swept below. */
let EPS_CFM=1e-3;
/* Artificial pressure: a small extra push between very close neighbours,
   because a density constraint alone lets molecules clump into little clusters
   with a gap around them — the tensile instability — and the clusters read as a
   grainy liquid. Standard fix, standard shape. */
let S_CORR=0.02, S_N=4;
/* Delta q is where the extra push stops mattering, and it has to sit at the
   spacing you want held, not at the paper's 0.2h. At 0.2h — 1.24 A here — the
   term is dead by the time two molecules are 2 A apart, and sweeping S_CORR
   over two decades moved nearest neighbours from 1.32 to 1.55 A. The density
   constraint alone will not do it: SPH density is a smoothed quantity, and a
   pair at 1.8 A reads almost the same as one at 2.76. */
let S_DQ_FRAC=0.45;
let S_W=wPoly(Math.pow(S_DQ_FRAC*H,2));
