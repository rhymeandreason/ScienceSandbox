let RHO_0=0;                            // measured off the pool, not typed
const lam=new Float32Array(N_WATER);
const W0=wPoly(0);                      // the kernel at zero, a molecule's own share
/* The gradient factor for every pair, computed in the multiplier pass and read
   back in the displacement pass. Both walk the same neighbour list within one
   sweep and both wanted the same square root and the same kernel; doing it once
   took the solve from 11.8 ms to 7.6 at 870 molecules. Only valid within a
   sweep — positions move between them — which is exactly the scope it is used
   in. */
const pairG=new Float32Array(N_WATER*NBR_MAX);
const pairS=new Float32Array(N_WATER*NBR_MAX);   // the artificial-pressure term

function solve(){
  S_W=wPoly(Math.pow(S_DQ_FRAC*H,2));      // so the console can sweep the reach
  if(RHO_0<=0){ calibrateRho(); if(RHO_0<=0){ collide(); return; } }
  _solve(PX,GONE,nbr,nbrN,lam,pairG,pairS,DPa,nW,NBR_MAX,
         H,H2,POLY6,SPIKY,W0,RHO_0,EPS_CFM,S_CORR,S_N,S_W,RELAX,SOLVER_ITERS);
}
function _solve(PX,GONE,nbr,nbrN,lam,pairG,pairS,DPa,nW,NBR_MAX,
    H,H2,POLY6,SPIKY,W0,RHO_0,EPS_CFM,S_CORR,S_N,S_W,RELAX,SOLVER_ITERS){
  const n=nW;
  for(let it=0; it<SOLVER_ITERS; it++){
    for(let i=0;i<n;i++){
      if(GONE[i]){ lam[i]=0; continue; }
      const ax=PX[3*i], ay=PX[3*i+1], az=PX[3*i+2];
      let rho=W0, sumGrad=0;
      let gx=0, gy=0, gz=0;                            // the molecule's own gradient
      const invRho=1/RHO_0, invSW=1/S_W;
      for(let q=0;q<nbrN[i];q++){
        const j=nbr[i*NBR_MAX+q];
        const rx=ax-PX[3*j], ry=ay-PX[3*j+1], rz=az-PX[3*j+2];
        const r2=rx*rx+ry*ry+rz*rz;
        if(GONE[j]||r2>=H2||r2<1e-12){ pairG[i*NBR_MAX+q]=0; continue; }
        const t=H2-r2, w2=POLY6*t*t*t;
        rho+=w2;
        const r=Math.sqrt(r2);
        const sp=H-r;                          // gSpiky, inlined: r<H here by the test above
        const g=SPIKY*sp*sp*invRho/r;
        pairG[i*NBR_MAX+q]=g;
        /* The artificial pressure's exponent, by squaring rather than through
           Math.pow. A variable exponent makes it a real call, and it runs once
           per pair per sweep: 32k calls a step at 800 molecules, 0.8 ms of a
           6.6 ms solve. S_N stays a knob the console can sweep. */
        const u=w2*invSW;
        let un;
        if(S_N===4){ const u2=u*u; un=u2*u2; } else un=Math.pow(u,S_N);
        pairS[i*NBR_MAX+q]=-S_CORR*un;
        const ex=rx*g, ey=ry*g, ez=rz*g;
        gx-=ex; gy-=ey; gz-=ez;
        sumGrad+=ex*ex+ey*ey+ez*ez;
      }
      sumGrad+=gx*gx+gy*gy+gz*gz;
      lam[i]=-(rho/RHO_0-1)/(sumGrad+EPS_CFM);
    }
    for(let i=0;i<n;i++){
      let dx=0, dy=0, dz=0;
      if(!GONE[i]){
        const ax=PX[3*i], ay=PX[3*i+1], az=PX[3*i+2], li=lam[i];
        for(let q=0;q<nbrN[i];q++){
          const g=pairG[i*NBR_MAX+q];
          if(g===0) continue;
          const j=nbr[i*NBR_MAX+q];
          const s=(li+lam[j]+pairS[i*NBR_MAX+q])*g;
          dx+=(ax-PX[3*j])*s; dy+=(ay-PX[3*j+1])*s; dz+=(az-PX[3*j+2])*s;
        }
      }
      DPa[3*i]=dx; DPa[3*i+1]=dy; DPa[3*i+2]=dz;
    }
    for(let i=0;i<n;i++){
      if(GONE[i]) continue;
      PX[3*i]+=DPa[3*i]*RELAX; PX[3*i+1]+=DPa[3*i+1]*RELAX; PX[3*i+2]+=DPa[3*i+2]*RELAX;
    }
    contacts();
    collide();
  }
}

/* Rest density, measured off the pool's interior the way the force build
   measured its own: away from the walls, only molecules with a full complement
   of neighbours, median rather than mean. Typing a number here would make every
   correction a claim about a constant nobody measured. */
/* OFF THE SEED, ON THE FIRST STEP. Waiting for the pool to settle is what the
   force build did, and here it is a trap: the solver holds whatever density it
   is told is right, so measuring after 120 steps of a liquid with no working
   repulsion locks in the collapse it has already suffered. The seeded lattice
   is at the spacing water actually has, which is the whole point of seeding it
   there. */
function calibrateRho(){
  const inner=[];
  for(let i=0;i<nW;i++){
    if(GONE[i]||nbrN[i]<8) continue;
    const ax=PX[3*i], ay=PX[3*i+1], az=PX[3*i+2];
    if(Math.abs(ax)>GAP/2-5*A) continue;
    let rho=W0;
    for(let q=0;q<nbrN[i];q++){
      const j=nbr[i*NBR_MAX+q];
      if(GONE[j]) continue;
      const rx=ax-PX[3*j], ry=ay-PX[3*j+1], rz=az-PX[3*j+2];
      const r2=rx*rx+ry*ry+rz*rz;
      if(r2<H2) rho+=wPoly(r2);
    }
    inner.push(rho);
  }
  if(inner.length<20) return;
  inner.sort((x,y)=>x-y);
  RHO_0=inner[Math.floor(inner.length/2)];
}

/* CONTACT, AS ONE MORE CONSTRAINT IN THE SAME SOLVE. The density constraint
   will not hold a minimum separation on its own and is not meant to: SPH
   density is a smoothed quantity, so a pair at 1.8 A reads almost the same as
   one at 2.76 and the solver sees nothing wrong. Measured, that is exactly what
   happened — coordination came out right at 5, and nearest neighbours sat at
   1.5 to 1.8 A. The artificial pressure only nibbles at it.

   This is the force build's separate() again, and here it is SAFE, which is the
   whole difference. There it moved positions while velocity kept its own story,
   and the gap between the two was energy from nowhere — the thing that shook
   the pool and drove the climb. Here velocity is read back off the motion after
   every constraint has had its say, so a molecule this pushes apart is simply
   a molecule that moved. */
function contacts(){
  _contacts(PX,GONE,nbr,nbrN,bondTo,bondN,nW,NBR_MAX,BOND_MAX,OO_MIN,OO_FREE);
}
function _contacts(PX,GONE,nbr,nbrN,bondTo,bondN,nW,NBR_MAX,BOND_MAX,OO_MIN,OO_FREE){
  for(let i=0;i<nW;i++){
    if(GONE[i]) continue;
    const ax=PX[3*i], ay=PX[3*i+1], az=PX[3*i+2];
    for(let q=0;q<nbrN[i];q++){
      const j=nbr[i*NBR_MAX+q];
      if(j<i||GONE[j]) continue;
      const rx=ax-PX[3*j], ry=ay-PX[3*j+1], rz=az-PX[3*j+2];
      const d=Math.sqrt(rx*rx+ry*ry+rz*rz);
      /* A BOND IS A LICENCE TO COME CLOSER, and that is the whole of water's
         structure. Two oxygens carrying no bond between them stop at van der
         Waals contact, 3.1 A — which is what keeps a liquid OPEN, since only
         four neighbours can be admitted past it and the rest are held out at
         the second shell. A hydrogen bond overrides it and lets that pair sit
         at 2.76, where the bond's own rest length puts them.

         Without the distinction every neighbour could come to 2.45 and did:
         nearest neighbours collapsed onto the floor at 2.42 A while the
         coordination number was right, which is a tetrahedral network drawn at
         the wrong scale. */
      const floor=isBonded(i,j,bondTo,bondN,BOND_MAX) ? OO_MIN : OO_FREE;
      if(d>=floor||d<1e-4) continue;
      const s=(floor-d)*0.5/d;
      PX[3*i]+=rx*s; PX[3*i+1]+=ry*s; PX[3*i+2]+=rz*s;
      PX[3*j]-=rx*s; PX[3*j+1]-=ry*s; PX[3*j+2]-=rz*s;
    }
  }
}

/* The walls as positions, because everything else in the solve is. Same face
   limit the force build arrived at: nothing gets inside the cellulose. */
function collide(){
  const lim=GAP/2-R_WATER, dlim=DEPTH/2;
  for(let i=0;i<nW;i++){
    if(GONE[i]) continue;
    if(PX[3*i]> lim) PX[3*i]= lim; else if(PX[3*i]<-lim) PX[3*i]=-lim;
    if(PX[3*i+2]> dlim) PX[3*i+2]= dlim; else if(PX[3*i+2]<-dlim) PX[3*i+2]=-dlim;
    if(PX[3*i+1]<FLOOR) PX[3*i+1]=FLOOR;
  }
}

/* XSPH: a molecule is nudged toward what its neighbours are doing. This is the
   viscosity of this build, and it is the piece DAMP could never be — it damps
   the difference between neighbours, so shear goes and the column's own motion
   stays. Applied after velocity has been read off the motion, never before. */
let XSPH=0.02;
function viscosity(){
  if(XSPH<=0||RHO_0<=0) return;
  _viscosity(PX,VX,VA,GONE,nbr,nbrN,nW,NBR_MAX,H2,POLY6,XSPH,RHO_0);
}
function _viscosity(PX,VX,VA,GONE,nbr,nbrN,nW,NBR_MAX,H2,POLY6,XSPH,RHO_0){
  const n=nW;
  for(let i=0;i<n;i++){
    let cx=0, cy=0, cz=0;
    if(!GONE[i]){
      const ax=PX[3*i], ay=PX[3*i+1], az=PX[3*i+2];
      const vx=VX[3*i], vy=VX[3*i+1], vz=VX[3*i+2];
      for(let q=0;q<nbrN[i];q++){
        const j=nbr[i*NBR_MAX+q];
        if(GONE[j]) continue;
        const rx=ax-PX[3*j], ry=ay-PX[3*j+1], rz=az-PX[3*j+2];
        const r2=rx*rx+ry*ry+rz*rz;
        if(r2>=H2) continue;
        const t=H2-r2, wq=POLY6*t*t*t;
        cx+=(VX[3*j]  -vx)*wq;
        cy+=(VX[3*j+1]-vy)*wq;
        cz+=(VX[3*j+2]-vz)*wq;
      }
    }
    VA[3*i]=cx; VA[3*i+1]=cy; VA[3*i+2]=cz;
  }
  const k=XSPH/RHO_0;
  for(let i=0;i<n;i++){
    if(GONE[i]) continue;
    VX[3*i]+=VA[3*i]*k; VX[3*i+1]+=VA[3*i+1]*k; VX[3*i+2]+=VA[3*i+2]*k;
  }
}

/* Unit-variance normal from three uniforms. Box-Muller costs a log and a cos
   per draw and this runs three times per molecule per step. */
function _gauss(){ return (Math.random()+Math.random()+Math.random()-1.5)*2; }

/* Thermal tumbling, the rotational half of the thermostat. It used to be
   divided by the bond count, which was standing in for the torque: a bonded
   molecule was held still because nothing else was holding it. The torque holds
   it now, so the noise is the same for everyone and what a molecule keeps of
   its orientation is a result. */
let TUMBLE=0.05;
const _qt=new THREE.Quaternion(), _qr=new THREE.Quaternion(), _ax=new THREE.Vector3();
function _tumble(){
  _ax.set(Math.random()-0.5,Math.random()-0.5,Math.random()-0.5).normalize();
  return _qr.setFromAxisAngle(_ax,(Math.random()-0.5)*TUMBLE);
}

/* ---- evaporation, which is the whole point ----
 *  A molecule leaves from the free surface, and only if it is weakly bonded,
 *  which is the energy of vaporisation: the bonds go before the molecule does.
 *  Two or fewer, against a bulk molecule's three or four — a stricter cut than
 *  that leaves almost nobody eligible and the flow stops. It then
 *  FLIES OFF, and is only recycled to the bottom once it is out of the frame.
 *
 *  The flying matters. An earlier version teleported it straight from the top
 *  to the bottom, which is the same bookkeeping and shows nothing at all: no
 *  molecule is ever seen leaving, none is seen arriving, and the column looks
 *  static while the whole thing is supposedly flowing.
 *
 *  Feeding it back in at the base is the root's half. Water leaves the leaf and
 *  water enters from below, so the column keeps its length and the water inside
 *  it travels up.
 */
/* MEASURED, AND THERE IS A RATE THE PORE CANNOT EXCEED. Adhesion 0.036, the
   supply on:

     3/s   the loop closes. Parked molecules fall 66 -> 43 -> 5 as the base
           draws them back, 225 go through, and the column keeps its body and
           goes on filling. Water is leaving the top and entering the bottom
           and the middle is travelling: that is transpiration.
     8/s   the pore drains. Live water 421 -> 331 -> 295 -> 236 over 5600
           steps while the parked pile grows to 162 and the meniscus flattens
           from 15 A of climb to 6.

   The difference is not bookkeeping, which is the point of removing the
   teleport: the base draws only when the base is under tension, so the flux is
   limited by how fast a deficit at the surface can propagate down the column.
   Ask for more than that and the column loses water it cannot replace, which is
   what a plant calls cavitation and why a leaf cannot transpire without limit.

   Whether the number here is the plant's number is a separate question — the
   flux is set for watchability, as the note below says — but the CEILING is a
   result rather than a setting, and it was not reachable in a build where a
   molecule leaving the top put one back at the bottom by definition. */
/* It leaves FAST. Every molecule in flight is one the column has lost, so a
   slow escape is a standing deficit: at 0.1 A a frame the vapour held a sixth
   of the liquid at once, the column shrank, and the water went DOWN while
   evaporating — the opposite of the thing being shown. At this speed the
   round trip is about 45 frames and the deficit stays near 1%. */
const ESCAPE_V=0.5*A;
let escapeTop=0;                       // set from the wall's height, below
let evapAcc=0, evapCount=0;
/* A RATE, NOT A SWITCH. Evaporation never stops: at any temperature some
   surface molecules sit in the high end of the energy distribution with enough
   to break their bonds and go, and heat only widens that end. In a leaf it is
   not heat at all but the humidity outside, which is why transpiration runs on
   an ordinary day. So the control is molecules per second, and zero is
   saturated air rather than a cold one. */
let EVAP_RATE=0;                       // molecules leaving per second; starts off
function evaporate(){
  // molecules already on their way out: no bonds, no gravity, just going
  for(let i=0;i<nW;i++){
    /* One that leaves under its own thermal speed rather than through the
       evaporation counter is still gone, and with no ceiling above the pore it
       otherwise flies off forever and the column is quietly one short. */
    if(!GONE[i] && PX[3*i+1]>escapeTop){ GONE[i]=1; VX[3*i]=VX[3*i+1]=VX[3*i+2]=0; }
    if(!GONE[i]) continue;
    PX[3*i+1]+=ESCAPE_V; place(i);
    if(PX[3*i+1]>escapeTop && !SPENT[i]){
      /* OUT OF THE FRAME, AND NOT PUT BACK. The force build teleported it
         straight to the base — water leaves the leaf, water enters from the
         root, and the bookkeeping balanced. But that makes the two ends
         connection a rule rather than a consequence: the column was refilled
         because a molecule had left, not because anything pulled.

         Here it is parked instead, and the base fills only when the base is
         under tension. Evaporation removes, the surface goes short, the solver
         propagates that down the column, and the reservoir draws — which is
         transpiration as a chain rather than as two matched counters. The
         parked ones are the pool injectOne() revives from, so nothing is
         allocated per molecule and the count stays bounded. */
      SPENT[i]=1; VX[3*i]=VX[3*i+1]=VX[3*i+2]=0;
      PX[3*i]=0; PX[3*i+1]=escapeTop+60*A; PX[3*i+2]=0; place(i);   // out of the camera's way
    }
  }
  /* Rate is a real trade-off, not a free knob: evaporating flattens the
     meniscus. Static the surface stands ~10 A higher at the walls; running,
     it sits at 0-2 A at every rate that still shows visible flow. Flux draws
     a surface down, which is true, but even 7 a second here is orders above a
     leaf's, and the curve pays for it. */
  if(EVAP_RATE<=0) return;
  /* Divided by SPEED so the number means molecules a SECOND, not a step. Left
     per-step it multiplied by the speed control: 7/s at 1x was 56/s at 8x, and
     the supply at the base cannot keep up with that, so winding the sim faster
     quietly emptied the pore. Speed now only decides how quickly the physics
     settles; how hard the leaf is transpiring is this slider alone. */
  evapAcc += EVAP_RATE/(60*Math.max(1,SPEED));
  if(evapAcc<1) return;
  evapAcc -= 1;
  /* Anywhere on the free surface, not the single highest molecule. Taking the
     top one always takes the water riding up the wall — the meniscus rim is by
     definition the highest thing there — so evaporating slowly ate the curve
     and flattened it, which real evaporation does not do. Sample the whole
     surface instead: barely bonded, and within a molecule or two of the top. */
  let hi=-Infinity;
  for(let i=0;i<nW;i++) if(!GONE[i] && PX[3*i+1]>hi) hi=PX[3*i+1];
  const free=[];
  for(let i=0;i<nW;i++) if(!GONE[i] && HBN[i]<=2 && PX[3*i+1]>hi-8*A) free.push(i);
  if(free.length){
    const i=free[(Math.random()*free.length)|0];
    GONE[i]=1; VX[3*i]=VX[3*i+1]=VX[3*i+2]=0; evapCount++;
  }
}

indexOH();
escapeTop=Math.max(...wallAtoms.map(a=>a.pos.y))+6*A;   // clear of the pore's mouth

/* One callout, on the thing a student would otherwise read as scenery. The
   green slabs are the load-bearing part of a plant cell wall, and the pore is
   the gap between two of its cellulose fibrils — which is the sentence that
   turns this from an abstract slot into somewhere in a leaf. */
const stageEl=document.getElementById('stage');
const NOTES=Annot.create(THREE, stageEl, camera, {mode:'on'});
(function markWall(){
  // the wall itself, named where it is thickest and unmistakably scenery
  const face=new THREE.Vector3(-GAP/2-4*A, FLOOR+nm(3.4), 0);
  NOTES.add({ text:'plant cell wall', offset:[-150,-34], at:()=>face,
    card:'Cellulose fibrils, the load-bearing part of a plant cell wall. This '
       + 'pore is the gap between two of them. In a leaf, pores like it are '
       + 'where the water column finally meets air.' });

  /* And ONE hydroxyl, by name. The macro label says where we are; this one says
     why the water does not simply fall away from the wall, and it has to point
     at an actual -OH the engine is bonding to rather than at the wall in
     general — so it is picked out of the same wallOH list the physics uses. */
  let best=null;
  for(const site of wallOH){
    if(site.o.x>0) continue;                       // the left wall, facing us
    const score=Math.abs(site.o.z)+Math.abs(site.o.y-(FLOOR+nm(1.6)));
    if(!best || score<best.score) best={site, score};
  }
  if(best) NOTES.add({ text:'adhesion', offset:[-150,26],
    at:()=>best.site.o,
    card:'Every glucose in the wall carries \u2013OH groups, and each one can '
       + 'hydrogen bond a water exactly as another water would. Water holding '
       + 'onto something else is adhesion. Water holding onto itself is cohesion. '
       + 'Which one wins decides whether water climbs a surface or beads up on it.' });
})();

/* THE ONE CONTROL THE PAGE WILL NOT SET FOR YOU, called out the same way the
   wall is: nothing travels up the pore until water starts leaving the top.
   `atElement` is annotate.js's DOM anchor — see its comment for why a callout
   on chrome is the module's business rather than the page's. */

/* THE RESERVOIR, AS A DENSITY BOUNDARY. It used to be a headcount: count the
   molecules in the base band, compare with water's real density times the
   band's volume, top up the difference. That is not what a bath does. A bath
   does not push water into a tube — it holds the liquid at the mouth at rest
   density, and water moves in only when the liquid above is stretched enough to
   pull it. With a headcount there is no such condition, so the old one filled a
   pore that was not wetting at all: with Adhesion at zero the pool pulled away
   into a blob touching neither wall and went on growing, which is a non-wetting
   capillary imbibing, and it cannot.

   The solver already computes the quantity that decides it. Every molecule
   carries rho_i, and rho_i/rho0 - 1 is negative exactly when the liquid there is
   being stretched. So the band is averaged, and water enters only while that
   average says the base is under tension. A non-wetting pore then sits and does
   nothing, because nothing is pulling; a wetting one draws at whatever rate the
   meniscus asks for, which makes the fill rate a result rather than a ceiling
   somebody chose.

   THE BAND'S OWN REFERENCE, because SPH density is biased low at a boundary:
   the kernel is cut off where there is nothing below the floor, so band
   molecules read as stretched even when they are not, and a threshold against
   the bulk rho0 would inject for ever. The reference is measured in the band
   itself off the seeded pool, so the comparison is like for like. Ghost
   molecules below the floor would be the proper answer and are worth it if this
   ever stops being a bench. */
/* MEASURED TWICE, and the second measurement changed the variable. Density was
   the obvious signal — the base draws when the base is stretched — and it does
   not work, for the reason the solver exists: an incompressible liquid barely
   changes density under tension. The base band read between -1.2% and +0.6% of
   its rest density while the column above it was pulling hard, so a 2% threshold
   fired almost never: over 3000 steps the supply asked zero times in five
   intervals out of six and put in 54 molecules against the ~1600 the pore holds.
   The rise was supply-limited and looked like physics.

   Pressure is the right variable and the solver already has it. lambda IS the
   pressure, positive under tension, and in the column it runs to 0.9 where the
   density deficit is one percent. So the band's mean lambda is what the
   reservoir watches: water enters while the liquid at the mouth is being pulled
   on, which is what a bath does, and the signal is large enough to act on.

   THE THRESHOLD IS NOT WHAT LIMITS THE FILL, measured. Mid-fill, 1000 steps,
   the band reads a median of -0.13 against this 0.15 — the gate is shut 84% of
   the time, and it is shut because injected water makes the band dense, which
   is the reservoir working rather than failing. Opening it completely, four
   attempts every step with no early abort, bought 1.6x and no more: injection
   then fails 95% of the time for want of anywhere to put a molecule.

   So the mouth fills as fast as the mouth empties upward, and nothing here can
   raise that. The knob that can is RELAX, above, which is how fast the column
   transmits the deficit in the first place. */
const SUPPLY_PULL=0.15;                // the tension at the mouth that draws
const SUPPLY_PER_STEP=4;               // a ceiling, so nothing arrives as a wave

/* The mean pressure over the base band. Under tension it is positive. */
function bandTension(){
  const top=FLOOR+SUPPLY_BAND;
  let sum=0, n=0;
  for(let i=0;i<nW;i++){
    if(GONE[i]||PX[3*i+1]>top||nbrN[i]<4) continue;
    sum+=lam[i]; n++;
  }
  return n<6 ? null : sum/n;
}

let FEED=true;
function supply(){
  if(!FEED || RHO_0<=0) return;         // the solver has no pressure yet
  const pull=bandTension();
  if(pull===null){ injectOne(); return; }  // the base has emptied; re-establish it
  if(pull < SUPPLY_PULL) return;           // nothing is pulling; nothing enters
  for(let k=0;k<SUPPLY_PER_STEP;k++){
    if(nW>=N_MAX) return;
    if(!injectOne()) return;             // nowhere clear to put one
  }
}
/* A spot in the band that nothing is sitting in — and a molecule to put there,
   taken from the ones evaporation has parked before any new one is made. That
   ordering is what closes the loop: in steady flow every molecule arriving at
   the base is one that left the top, and the count stops climbing. */
function injectOne(){
  for(let tries=0;tries<8;tries++){
    const p=new THREE.Vector3(
      (Math.random()-0.5)*(GAP-2.6*R_WATER),
      FLOOR+0.6*A+Math.random()*SUPPLY_BAND*0.5,
      (Math.random()-0.5)*(DEPTH-2*R_WATER));
    let clear=true;
    const near=(OO_MIN*0.95)**2;
    for(let i=0;i<nW;i++){ if(GONE[i]) continue;
      const rx=PX[3*i]-p.x, ry=PX[3*i+1]-p.y, rz=PX[3*i+2]-p.z;
      if(rx*rx+ry*ry+rz*rz<near){ clear=false; break; } }
    if(!clear) continue;
    let spent=-1;
    for(let i=0;i<nW;i++) if(SPENT[i]){ spent=i; break; }
    if(spent>=0){ SPENT[spent]=0; GONE[spent]=0; VAPN[spent]=0;
      PX[3*spent]=p.x; PX[3*spent+1]=p.y; PX[3*spent+2]=p.z;
      VX[3*spent]=VX[3*spent+1]=VX[3*spent+2]=0; place(spent); return true; }
    if(nW>=N_MAX) return false;
    place(makeWater(p));
    return true;
  }
  return false;
}

/* ============================================================= *
 *  Render
 * ============================================================= */
const _M=new THREE.Matrix4();

function draw(){
  /* The buffers are sized for N_MAX and the pore starts a third full, so the
     rest were being drawn every frame as degenerate spheres at the origin:
     three quarters of the vertex work for nothing. */
  oMesh.count=nW; hMesh.count=nW*2;
  for(let i=0;i<nW;i++){
    _M.makeScale(R_O,R_O,R_O);
    _M.elements[12]=PX[3*i]; _M.elements[13]=PX[3*i+1]; _M.elements[14]=PX[3*i+2];
    oMesh.setMatrixAt(i,_M);
    for(let k=0;k<2;k++){
      _M.makeScale(R_H,R_H,R_H);
      _M.elements[12]=HX[6*i+3*k]; _M.elements[13]=HX[6*i+3*k+1]; _M.elements[14]=HX[6*i+3*k+2];
      hMesh.setMatrixAt(i*2+k,_M);
    }
  }
  oMesh.instanceMatrix.needsUpdate=true;
  hMesh.instanceMatrix.needsUpdate=true;
}

/* The bench's own numbers, off what was built rather than typed: the gap in
   real nm, how many water diameters that is, and the bonds standing this frame. */
const readout=document.getElementById('readout');
// counted rather than filtered: a filter allocates an array a frame to read its length
function countLive(){ let c=0; for(let i=0;i<nW;i++) if(!SPENT[i]) c++; return c; }
function countFlying(){ let c=0; for(let i=0;i<nW;i++) if(GONE[i]&&!SPENT[i]) c++; return c; }
const WATER_DIA=2.80;                       // real angstroms, O...O contact
let frames=0;
/* Frames a second, measured over the interval between reports rather than off
   one frame's delta, which reads as noise. The step count moves at this times
   Speed, so it is also how fast the run is actually going. */
/* STEPS A SECOND IS THE HONEST ONE, and fps is not. How fast the pore fills
   depends on how many steps get taken, and the Speed control does not raise
   that indefinitely: at 1x the loop takes one step a frame and waits out the
   rest of the 16.7 ms, so the frame cap is the limit rather than the physics —
   raise Speed and the idle time is spent. Past the knee, roughly 16.7 divided
   by the cost of a step, a frame's worth of steps overruns the budget and
   further Speed only draws less often.

   Which means the two numbers say different things and both are worth showing.
   fps says whether it looks smooth. Steps a second says whether it is getting
   anywhere, and watching it while turning Speed up shows exactly where that
   stops being true. */
/* And the clock, because every question about this page has turned out to be
   "how long do I have to watch". Wall-clock seconds since the run started, so
   the step count, the rate and the wait are all on the same line. */
let runT0=performance.now();
let fps=0, sps=0, fpsFrames=0, fpsSteps=0, fpsT=performance.now();
function tickFps(){
  fpsFrames++;
  const now=performance.now(), dt=now-fpsT;
  if(dt>=500){
    fps=fpsFrames*1000/dt;
    sps=(stepNo-fpsSteps)*1000/dt;
    fpsFrames=0; fpsSteps=stepNo; fpsT=now;
  }
}
function report(){
  readout.innerHTML =
    `pore  <b>${(GAP/A/10).toFixed(1)} nm</b>  =  <b>${Math.round(GAP/A/WATER_DIA)}</b> molecules across\n`
  + `water <b>${countLive()}</b> of ${N_MAX}   H-bonds <b>${hbCount}</b>   wall contacts <b>${adCount}</b>\n`
  /* Throughput, not level. In steady flow the column keeps its height while
     every molecule in it travels, so the level says nothing and the count of
     molecules that have gone through says everything. */
  + `through  <b>${evapCount}</b> evaporated   <b>${countFlying()}</b> in flight\n`
  /* The step count, because every measurement quoted about this page is "after
     N steps" and there is otherwise no way to tell where a run has got to. */
  + `step  <b>${stepNo}</b>   <b>${((performance.now()-runT0)/1000).toFixed(0)}</b> s`
  + `   <b>${sps.toFixed(0)}</b> steps/s   <b>${fps.toFixed(0)}</b> fps`;
}

let SPEED=3;                           // physics steps per drawn frame; the knee at DEPTH 0.9
/* NO WARM-UP. The seed is a lattice, so the first second is the meniscus
   forming rather than the answer, and an earlier version ran those 200 steps
   before the first paint so a student would not read the lattice as the result.
   It is drawn from the first step instead: the settle is worth watching, and
   hiding it hides the only frames that show the surface being made. */
function loop(){
  requestAnimationFrame(loop);
  /* Speed is steps per FRAME, not a bigger timestep. Scaling the timestep
     instead would let molecules jump through each other and through the wall,
     and the settling distances this page reports would stop being the model's.
     More steps is just watching the same physics from further along. */
  for(let k=0;k<SPEED;k++){ step(); supply(); evaporate(); }
  draw(); stepTint(); NOTES.step(); tickFps();
  if((frames++ & 7)===0){ report(); reportClimb(); }
  renderer.render(scene,camera);
}
/* Each knob names the variable it drives, so the panel cannot drift from the
   physics: the getter and setter are the only place the value lives. */
/* NO H-BOND SLIDER, because it does nothing, and that is a finding rather than
   a tidy-up. Swept across its whole range at 1000 steps, bonds a molecule went
   1.96 at zero, 1.95 at the default, 1.98 at the top — the spring switched off
   entirely changes nothing measurable. The reason: the liquid sits at 2.57 A
   and the spring's rest length is 2.76, so a bonded pair is 0.19 A INSIDE it
   and pulling at 0.006, while the steric floor at that same separation pushes
   at 0.117. Twenty times. Cohesion contributes nothing at all there, being
   gated to distances beyond 2.76 that almost no pair reaches. Every pair in
   this liquid sits in the steric term's pocket, and the bond is a rounding
   error on top of it. K_HB will start to matter when the density is right, and
   the slider can come back then.

   NO STERIC SLIDER either, for the opposite reason: it does far too much. It is
   the density, and through the density it is the fill rate — 0.10 squashes the
   liquid to 2.48 A and runs the column to the top of the pore, 2.50 opens it to
   2.68 and nearly stops it. That is a numerical property of this model being
   dressed as something a student could learn from. Console work, not a knob.

   NO TEMPERATURE KNOB, though the model now has a temperature to put on one.
   Heating the water is a lesson, and a good one, but not this page's: a pore
   that fills faster because it is nearer boiling teaches the wrong thing about
   why the leaf's water moves. V_THERM stays `let` for the console to sweep,
   which is what a bench wants anyway. */
const KNOBS=[
  /* THE THREE THAT TEACH. Capillary action is a competition between water
     holding the wall and water holding itself, so adhesion and cohesion are the
     lesson. Evaporation joins them because it is what the competition acts on:
     nothing travels until water leaves the top. Speed is apparatus and sits
     with the rest. */
  {k:'Speed',      get:()=>SPEED,     set:v=>SPEED=v,      min:1,   max:12,   step:1,     fmt:v=>v+'x'},   // opens at 3, which is the knee at this depth
  {k:'Adhesion',   get:()=>K_WET/A,   set:v=>K_WET=v*A,    min:0,   max:0.09, step:0.001, fmt:v=>v.toFixed(3), main:1},
  {k:'Cohesion',   get:()=>K_COH,     set:v=>K_COH=v,      min:0,   max:0.14, step:0.002, fmt:v=>v.toFixed(3), main:1},
  {k:'Evaporation',get:()=>EVAP_RATE, set:v=>EVAP_RATE=v,  min:0,   max:25,   step:1,     fmt:v=>v?v+'/s':'off', main:1},
  {k:'Solve',      get:()=>SOLVER_ITERS,set:v=>SOLVER_ITERS=v,min:1, max:8,    step:1,     fmt:v=>v+'x'},
  {k:'Viscosity',  get:()=>XSPH,      set:v=>XSPH=v,       min:0,   max:0.40, step:0.01,  fmt:v=>v.toFixed(2)},
];
const knobRows=document.getElementById('knobrows');
let evapInput=null, evapRow=null;
/* The rest are apparatus, folded away: a panel that lists everything says
   everything matters equally, and two of these are the whole point. */
const more=document.createElement('details');
more.innerHTML='<summary>more</summary>';
KNOBS.forEach(kn=>{
  const l=document.createElement('label');
  l.innerHTML=`<span class="row"><span>${kn.k}</span><b></b></span>`
            + `<input type="range" min="${kn.min}" max="${kn.max}" step="${kn.step}">`;
  const out=l.querySelector('b'), input=l.querySelector('input');
  input.value=kn.get();
  out.textContent=kn.fmt(kn.get());
  input.oninput=()=>{ const v=parseFloat(input.value); kn.set(v); out.textContent=kn.fmt(v); };
  (kn.main?knobRows:more).appendChild(l);
  if(kn.k==='Evaporation'){ evapInput=input; evapRow=l; }
});
knobRows.appendChild(more);

if(evapInput&&evapRow){
  const note=NOTES.add({ text:'start the water leaving', offset:[-62,0],
    at:NOTES.atElement(evapRow, {gap:16, yFrom:evapInput}),
    card:'Nothing climbs until water leaves the top. Evaporation at the surface '
       + 'is what draws the column up behind it, and in a leaf it is the dry air '
       + 'outside that does the pulling.' });
  evapInput.addEventListener('input',()=>note.remove(),{once:true});
}

/* The number the knobs are being turned against: how much higher the water
   stands at the wall than in the middle. Measured off the molecules, so the
   panel reports the model rather than the setting. */
function topAt(bin){
  const ys=[];
  for(let i=0;i<nW;i++){ if(GONE[i]) continue;
    if(Math.round(Math.abs(PX[3*i])/A/4)*4===bin) ys.push(PX[3*i+1]/A); }
  if(!ys.length) return null;
  ys.sort((a,b)=>b-a);
  const n=Math.max(1,Math.round(ys.length*0.1));
  return ys.slice(0,n).reduce((a,b)=>a+b,0)/n;
}
/* THE FRONT, DRAWN WHERE IT IS MEASURED. The number on its own is a claim the
   student cannot check against the picture, and "where the water gets to" is
   ambiguous by eye once films run ahead of the body. So the same value that is
   printed also positions a line across the pore: middle-of-channel, which is
   the body rather than the films. */
const frontEl=document.getElementById('front');
const frontMark=(function(){
  const g=new THREE.Group();
  const bar=new THREE.Mesh(new THREE.BoxGeometry(GAP+6*A, 0.5*A, 0.5*A),
    /* The palette's brightest blue, taken here as a POINTER colour rather than
       for what it means elsewhere: nothing on this page draws lone pairs, and
       the marker has to stay legible against red oxygens and a cream ground. */
    new THREE.MeshBasicMaterial({color:P.bonds.lonepair, transparent:true, opacity:0.9}));
  g.add(bar); g.visible=false; root.add(g); return g;
})();
const climbEl=document.getElementById('climb');

/* THE CONTACT ANGLE, WHICH IS THE ONLY NUMBER THE TWO SLIDERS HAVE TO HIT.
   The meniscus's SHAPE is what this page exists to produce, so tuning until it
   looks right would be drawing it — the same thing the seeded curve is
   carefully checked against. The angle is different: water on cellulose has a
   measured one, 20-30 degrees and near zero on a clean surface, and it is set
   by exactly the competition Adhesion and Cohesion are. Hit the angle and the
   curve follows from it and the pore's width, which is the honest order.

   MEASURED AT THE WALL, WHICH IS WHERE THE DEFINITION PUTS IT. The first
   version fitted a parabola across the whole pore, and that reads high — 21
   degrees where the tangent at the contact line is nearer 11 — because a
   wetting meniscus in a pore this narrow is nearly flat through the middle and
   turns up sharply in the last few angstroms. A curve through the flat part
   cannot know about the turn. So the fit is a straight line through the surface
   over the outermost 8 A only, both walls averaged, in bins a molecule wide.

   AND IT NEEDS A LONG TIME. The pool is seeded as a lattice with a curve
   suggested, not a settled meniscus, so the angle starts near 90 and comes
   down for thousands of steps: 78 at step 200, 43 at 600, 26 at 1000, and it
   only stops moving near 2700, at 12. Reading it before then is reading the
   lattice, which is why the panel says `settling` until the drift over 400
   steps is under 3 degrees rather than quietly showing a number in motion.

   WHAT IT SAYS ABOUT THE CURRENT SETTING. Adhesion 0.036 settles at 12
   degrees: wetting, and more so than cellulose's usual 20-30, though clean
   cellulose does go near zero. Adhesion 0.024 is still wandering around 80 at
   step 2000 — barely wetting and not converged. Between those two the model
   swings from almost no meniscus to a film, which is a narrower window than
   the physics should have and is the next thing worth understanding. */
const angleEl=document.getElementById('angle');
const BIN=1.4;                                 // a water's radius, in angstroms
const ANG_BAND=8;                              // how far in from the face the fit looks
function contactAngle(){
  const edge=GAP/2/A-R_WATER/A;
  const pts=[];
  for(let d=0; d<ANG_BAND; d+=BIN){            // d is distance in from the face
    for(const sgn of [-1,1]){
      const lo=edge-d-BIN, hi=edge-d;
      const col=[];
      for(let i=0;i<nW;i++){
        if(GONE[i]) continue;
        const ax=PX[3*i]/A*sgn;
        if(ax>lo && ax<=hi) col.push(PX[3*i+1]/A);
      }
      if(col.length<4) continue;
      col.sort((p,q)=>q-p);
      const n=Math.max(1,Math.round(col.length*0.15));
      pts.push([d+BIN/2, col.slice(0,n).reduce((p,q)=>p+q,0)/n]);
    }
  }
  if(pts.length<4) return null;
  /* Least squares of height against distance in from the wall. The slope is
     the surface's tangent there, which is the contact angle's own definition
     rather than an average of the whole surface's shape. */
  let sx=0,sy=0,sxy=0,sxx=0;
  for(const [x,y] of pts){ sx+=x; sy+=y; sxy+=x*y; sxx+=x*x; }
  const n=pts.length, den=n*sxx-sx*sx;
  if(Math.abs(den)<1e-9) return null;
  const slope=(n*sxy-sx*sy)/den;               // negative: the water is higher at the wall
  return 90-Math.abs(Math.atan(slope))*180/Math.PI;
}
/* SETTLING, JUDGED ON A MEAN RATHER THAN ON THE LAST READING. The surface
   ripples — that is a real liquid and it is what the cohesion sweep measures —
   so the instantaneous fit bounces by several degrees frame to frame. Judging
   drift on single readings then means a shallow meniscus can never settle: the
   noise is bigger than the 3 degree band, and the panel says `settling` for
   ever while the shape on screen is perfectly steady. Measured past step 7000
   at Adhesion 0.018, which is where this came from.

   So what is shown is the mean of the last 150 samples, and what is judged is
   whether that mean has moved between the older half of the window and the
   newer one. A mean over a rippling surface is the quantity that has a value;
   an instant of it is not. */
const angHist=[];
function angleText(){
  const a=contactAngle();
  if(a==null) return '\u2014';
  angHist.push([stepNo,a]);
  while(angHist.length>150) angHist.shift();
  const mean=arr=>arr.reduce((p,q)=>p+q,0)/arr.length;
  const vals=angHist.map(p=>p[1]);
  const shown=Math.round(mean(vals));
  if(angHist.length<80) return shown+'\u00b0 settling';
  const h=Math.floor(vals.length/2);
  const drift=Math.abs(mean(vals.slice(h))-mean(vals.slice(0,h)));
  const span=stepNo-angHist[0][0];
  return (span>=400 && drift<2) ? shown+'\u00b0' : shown+'\u00b0 settling';
}
function reportClimb(){
  const wall=topAt(16), mid=topAt(0);
  climbEl.textContent=(wall==null||mid==null)?'—':(wall-mid).toFixed(1)+' \u00c5';
  frontEl.textContent=(mid==null)?'—':mid.toFixed(1)+' \u00c5';
  angleEl.textContent=angleText();
  if(mid!=null){ frontMark.position.y=mid*A; frontMark.visible=true; }
  else frontMark.visible=false;
}

/* TINT: one colour for the wall, one for the water, instead of one per element.
   Element colours answer "what is this atom"; at 500 molecules against 3000 wall
   atoms the more useful question is "which of the two things am I looking at",
   and the boundary between them is what the whole page is about. Both tints are
   palette entries — chloride's green and the H-bond's blue — rather than typed
   colours, so they cannot drift from the rest of the sandbox.

*/
const TINT_WALL=P.atoms.Cl, TINT_WATER=P.bonds.hbond;
const plain=new Map();
[...wallMeshes, wallBondMesh, oMesh, hMesh].forEach(m=>plain.set(m,m.material.color.getHex()));
/* BLENDED, not replaced. Flooding every atom with one flat colour throws away
   the tone inside a molecule: a hydrogen and the oxygen it hangs off become the
   same sphere and the shape stops reading. Each element keeps its own colour and
   is carried most of the way toward the tint instead, so hydrogens stay pale
   against their oxygens and the wall's carbons stay dark against its hydroxyls.
   One hue per side of the boundary, still two tones within each. */
const TINT_MIX=0.74;
const _c=new THREE.Color(), _t=new THREE.Color();
/* Faded, not switched. A hard cut between two colour schemes reads as the scene
   being replaced; carrying every sphere across in a third of a second reads as
   the same scene being looked at differently, and the eye keeps track of which
   molecule was which. `tintT` is the position along that fade and the render
   loop walks it toward the checkbox. */
let tintT=0, tintTarget=0;
function applyTint(){
  const k=TINT_MIX*tintT;
  const set=(m,c)=>{ _c.setHex(plain.get(m)); m.material.color.copy(_c.lerp(_t.setHex(c),k)); };
  wallMeshes.forEach(m=>set(m,TINT_WALL));
  set(wallBondMesh,TINT_WALL);
  set(oMesh,TINT_WATER); set(hMesh,TINT_WATER);
}
function stepTint(){
  if(tintT===tintTarget) return;
  const d=tintTarget-tintT;
  tintT += Math.sign(d)*Math.min(Math.abs(d), 0.055);   // ~1/3 s at 60fps
  if(Math.abs(tintTarget-tintT)<0.002) tintT=tintTarget;
  applyTint();
}
/* Read the box rather than assume it: a browser restores checkbox state across
   a reload, so a page that only listens for changes can come back with the
   switch off and the variable on. */
(function(){ const b=document.getElementById('feed');
  FEED=b.checked; b.onchange=e=>{ FEED=e.currentTarget.checked; }; })();
document.getElementById('tint').onchange=e=>{ tintTarget=e.currentTarget.checked?1:0; };

resize(); applyCam(); loop();
new ResizeObserver(()=>{ resize(); applyCam(); }).observe(canvas);


document.getElementById('reset').onclick=()=>{
  seed(); for(let i=0;i<nW;i++) place(i);
  evapCount=0; condensed=0; RHO_0=0; stepNo=0; fpsSteps=0; runT0=performance.now(); angHist.length=0; };

/* =============================================================
 *  MEASUREMENTS NOT MADE. Two, both designed and neither run, kept
 *  here because the reasons for wanting them are easy to lose and
 *  expensive to rediscover. Each says what to vary, what to record,
 *  and — the part worth writing down — what each outcome would mean.
 * =============================================================
 *
 *  1. THE WETTING PROBABILITY CURVE. Adhesion is currently set by eye
 *  over many runs, because a single run's settled angle is not the
 *  constant's value: at 0.026 the same setting gives 31 degrees with
 *  the water 17 A up the wall on one run and 70 degrees with 4 A on
 *  the next. The pore lands wetted or unwetted and which one is
 *  chance.
 *
 *    Vary   K_WET over 0.020 to 0.036 in steps of 0.002.
 *    Repeat ten runs a setting, each from Reset, supply on,
 *           evaporation off, to step 4500.
 *    Record ONE BIT per run — wetted or not. `climb at wall` splits
 *           them cleanly: the wetted runs sit near 17 A, the others
 *           near 4. Do not record the angle; it is the thing that
 *           cannot be trusted from one run, which is the whole point.
 *    Read   the fraction wetted against adhesion. A sigmoid, and its
 *           midpoint is the number adhesion actually has.
 *
 *  A curve that rises over 0.004 or less says the transition is
 *  genuinely sharp and the constant sits on a knife edge, so anything
 *  that perturbs the liquid can tip it. One that rises over 0.010 or
 *  more says the bistability is narrow and 0.026 is safely inside the
 *  wetted basin. Either way it replaces a judgement with a
 *  distribution.
 *
 *  2. THE PORE WIDTH TEST, which asks whether that sharpness is
 *  physics or the model. Filling a pore this narrow is a first-order
 *  transition: the wall bilayers on the two faces nearly touch, and
 *  whether they bridge is a matter of chance and of how close they
 *  are. If that is what is happening, widening the pore should soften
 *  it — the walls stop cooperating and the liquid gets to choose an
 *  intermediate state.
 *
 *    Vary   GAP over 3.5 nm, 5 nm, 7 nm, 10 nm, rebuilding the walls
 *           for each. N_START and N_MAX scale with the volume.
 *    Repeat the probability curve above at each width, or at least
 *           five runs at three adhesions spanning the transition.
 *    Record the same bit, plus the wall layer's thickness in
 *           molecules — it should stay near two at every width, since
 *           a wetting layer is a property of the surface and not of
 *           the gap.
 *
 *  If the curve broadens as the pore widens, the sharpness is
 *  confinement and this bench is telling the truth about nanopores —
 *  and the page has a lesson it does not currently teach, which is
 *  why a leaf builds pores of this size rather than larger ones. If
 *  the curve stays a cliff at 10 nm, something in the wall model is
 *  switching rather than balancing, and neither the adhesion value
 *  nor the contact angle should be trusted until it is found. The
 *  wetting layer staying two molecules thick at every width is the
 *  control: if it thickens with the gap, WET_REACH is summing over a
 *  field rather than a surface and that is the thing to fix first.
 *
 *  Both are mechanical enough to run unattended. Neither needs a
 *  change to the physics — only a harness that resets, runs, and
 *  records one number.
 * ============================================================= */
</script>
