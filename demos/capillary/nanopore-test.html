<title>capillary action — test bench</title>

<!-- ===================================================================
     TEST BENCH. Not a lesson.

     THE QUESTION. Capillarity is on WaterSim.md's list of things that
     must trace back to H-bonding, and the usual picture of it — water
     climbing a stem — cannot be drawn at molecular scale. A xylem
     vessel is 10-100 um, which is 36,000 to 360,000 water molecules
     across, and capillary rise in one is about 1.5 m against a
     redwood's 100. The vessel is not where the lift comes from.

     Where it comes from is the cell-wall pore in the leaf: a few
     nanometres, a few tens of molecules across, holding a curved
     meniscus that evaporation pulls on. THAT is drawable at honest
     scale, and this bench is whether it renders as anything.

     SCALE. Everything here is family B — real angstroms x MolLib.SCALE
     (MolecularGeometry.md 1.5) — because the page makes a size claim
     and only family B may. So the water is mol-small's to-scale
     spectroscopic geometry, NOT water-lab's family-A physics water,
     and the engine constants below are real distances scaled once,
     not tuned numbers.

     THE WALLS ARE REAL CELLULOSE. Not a hydroxyl lattice standing in
     for one: the cellobiose spec repeated by chain-repeat.js, the same
     path chain/glucose-chains-test.html checks, so the -OH groups the
     water bonds to are where beta-1,4 glucose actually puts them. The
     right-hand wall is the left one turned 180 degrees about Y, never
     mirrored: a mirrored sugar is the other enantiomer.

     WHAT IT SHOWS. The wall wets: water reaches the hydroxyl surface,
     sits 2.4-3.0 A from its oxygens, and holds H-bonds to them — which
     is adhesion, drawn as the same bond as cohesion, because it is the
     same bond. The liquid's own numbers are close: nearest neighbours
     settle near 2.55 A against a real 2.8, and about 2.5 H-bonds per
     molecule against a real 3.6, at the seeded bulk density.

     WATER TRAVELS UP THE CHANNEL, AND THAT IS WHAT THE PAGE IS FOR. It
     starts as a pool at the foot of a DRY pore — bare cellulose above it
     — and the front then crosses the whole 94 A of pore, films leading
     up the faces and the body following. Nothing pushes it. The
     hydroxyls pull, the H-bonds behind them hold, and water is drawn in
     at the base to replace what left. Adhesion and cohesion doing the
     only two things they can.

     TWO THINGS HAD TO BE FIXED BEFORE IT WOULD MOVE, and both were
     missing pieces rather than bad numbers.

     One: it seeded the pore ALREADY FULL. A full glass cannot show
     pouring; the wall above the water has to be dry.

     Two, and this is the one that mattered: THERE WAS NO SUPPLY. A
     finite pool in a wetting pore has nowhere to go. Its equilibrium is
     to spread into two thin films and stop, which is exactly what it
     did, and no amount of turning the wall up changed it — a stronger
     pull only drained the pool faster. A capillary rises because the
     tube stands in a bath: as the front climbs, more water is drawn up
     behind it. The bottom band is now held at liquid density, which
     models the rest of the cell wall as the endless reservoir it
     effectively is. With that in place the same strong wall pull that
     used to be a failure is the mechanism.

     AN EARLIER READING OF THIS WAS WRONG and the reason is worth
     keeping. Seeded at RANDOM through the pore, the old build reported
     10-17 A, the right order for a hemispherical meniscus. Seeded on a
     lattice instead, the identical run gave 0.0 A and stayed flat for
     thousands of steps: molecules that happened to land against the
     wall had stuck there and never come down. A number that depends on
     the seed is hysteresis, not equilibrium. Approaching from a full
     pore AND an empty one is still the check this has not had.

THERE IS NO GRAVITY HERE, and that is a correction to an earlier
     version rather than a simplification. At 3.5 nm the capillary
     pressure is ~8e7 Pa and the gravitational pressure across the pore
     ~5e-5 Pa, twelve orders of magnitude apart. There is no up in a
     cell-wall pore: water moves toward the EVAPORATING SURFACE, and in
     a leaf those pores face the air spaces in every orientation. An
     earlier build had a g strong enough to hold a column down, which
     drew the dipped-capillary-tube picture — the wrong model for a
     leaf, where the lifting happens in metres of xylem, pulled by the
     tension these menisci generate. This bench is where the grip is,
     not where the rope moves. What holds the liquid now is the wall and
     its own cohesion, which is the only claim it was ever making.

     The page still draws the pore standing upright, and that is now
     only a camera angle: nothing in the physics knows which way is up.

     IT WAS WRONG FIRST, AND THE FAILURE IS THE USEFUL PART. An earlier
     version put the wall's backstop an angstrom BEHIND the face while
     the steric list held only atoms near the surface, so a molecule
     that slipped past the outermost ones found nothing behind them:
     about a quarter of the water ended up inside the cellulose, sitting
     high in its grooves. That leak read as water high at the walls,
     which is what a meniscus also reads as. Every early measurement of
     the surface was measuring the leak, and the shape only became
     honest once the count of molecules past the face was zero.

     Molecule count mattered too. At 300 the free surface was 12 across
     with 2-3 A of thermal roughness, and no measurement of its shape
     meant anything. 900 is the smallest count where a surface is one.

     WATCHING THE FLOW COSTS THE CURVE. Evaporation flattens the
     meniscus: ~10 A static, and 0-2 A once it is running, at every rate
     tried that still makes the flow watchable. The surface being drawn
     down by flux is real. This flux is not — it is orders above a
     leaf's, set so the flow is watchable — so the flat surface under
     Evaporate is an artefact of that choice, not a result. Watch the
     curve with it OFF and the flow with it ON; this bench cannot
     currently show both at once, and that is the honest state of it.
     =================================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../palette.js"></script>
<script src="../tokens-from-palette.js"></script>
<script src="../molecules.js"></script>
<script src="../skel.js"></script>
<script src="../mol-monomers.js"></script>
<script src="../mol-pathways.js"></script>
<script src="../mol-contrast.js"></script>
<script src="../mol-small.js"></script>
<script src="../scene.js"></script>
<script src="../chain/frame.js"></script>
<script src="../chain-repeat.js"></script>
<script src="../annotate.js"></script>
<script>
"use strict";

/* ============================================================= *
 *  Scale. One number, and every distance below is a real one.
 * ============================================================= */
const A = MolLib.SCALE;              // scene units per angstrom (family B)
const nm = n => n*10*A;              // nanometres, for the pore itself
const P  = MolLib.PALETTE;

/* ---- the pore, in real numbers ----
 *  Cell-wall pores run about 2-10 nm. 3.5 nm is in that range and is the
 *  width at which a column tall enough to have a meniscus still fits the
 *  molecule budget: water is 33.4 molecules per cubic nm, so the slot's
 *  volume IS the count, and a 5 nm slot at this depth would be a puddle
 *  rather than a column.
 */
const GAP   = nm(3.5);               // wall face to wall face
/* The slab is DEEP for a reason that is not chemistry. The water starts as a
   pool at the bottom of a dry pore and has to climb, so it needs to be short
   against a tall wall — and a pool's height is its molecule count divided by
   its cross-section. Widening the pore is not available (3.5 nm is the claim),
   so the depth carries it: at this thickness 900 molecules stand about 50 A
   deep in a pore 125 A tall, and there is somewhere to climb to. */
const DEPTH = nm(1.5);
const FLOOR_MARGIN = 4.0*A;          // the pool's base, above the wall's bottom edge

/* ---- water, from real distances ----
 *  Every one of these is a measured number scaled once. WaterSim.md 4: the
 *  steric floor sits BELOW the H-bond equilibrium, so a bonded pair rests
 *  where the bond wants it rather than in a fight between two forces.
 */
const OO_EQ   = 2.76*A;              // liquid water O...O, the H-bond rest length
let OO_MIN  = 2.70*A;              // hard contact; below this they push apart
const HB_MAX  = 2.45*A;              // H...O reach for a bond to register
const HB_LIN  = 0.55;                // O-H...O has to be near enough to straight
const COH_MAX = 6.20*A;              // how far the weak, undirected pull reaches

/* A liquid is not held together by H-bonds alone. Dispersion pulls on every
   neighbour whatever way it is turned, and without it a box of molecules whose
   only attraction is a near-linear O-H...O simply never condenses: each one
   waits for a partner to be aimed correctly and drifts apart in the meantime.
   So there is a weak undirected attraction out to ~6.2 A on top of the bond. */

/* ============================================================= *
 *  Stage
 * ============================================================= */
const canvas=document.getElementById('gl');
const {scene,camera,renderer,root,cam,applyCam,resize}=
  Stage.create(canvas,{cam:{theta:0, phi:Math.PI/2, r:nm(19)}, rMax:nm(60)});

/* ============================================================= *
 *  THE WALLS — cellulose, repeated from the checked linkage
 * ============================================================= */
const V3=(p)=>new THREE.Vector3(p[0],p[1],p[2]);
const cello=MolLib.MOLECULES.cellobiose;
const screw=ChainRepeat.screwOf(cello, ['O5','C1','C4'], 'A','B');
const CHAIN_N=18;                                   // residues; ~5.2 A each, ~94 A of wall
const chain=ChainRepeat.extend(cello, screw, CHAIN_N, 'A');

/* The chain comes out along the screw's own axis, wherever that points. Turn
   it so the axis runs up the page (the pore's long direction) and the ribbon's
   flat face looks into the pore. Both are proper rotations — a reflection here
   would hand back L-glucose. */
const qAxis=new THREE.Quaternion().setFromUnitVectors(
  new THREE.Vector3(screw.axis[0],screw.axis[1],screw.axis[2]).normalize(),
  new THREE.Vector3(0,1,0));
const chainPts=[];
chain.residues.forEach(res=>res.forEach(p=>chainPts.push(V3(p).applyQuaternion(qAxis))));

/* The ribbon's flat face: of the two directions across the chain, the one it
   is thinnest in is the face normal. Measured, not assumed — the spec's own
   torsions decide which way the ribbon lies. */
const mid=new THREE.Vector3();
chainPts.forEach(p=>mid.add(p)); mid.multiplyScalar(1/chainPts.length);
let bestAng=0, bestSpread=Infinity;
for(let k=0;k<180;k++){
  const th=k*Math.PI/180, nx=Math.cos(th), nz=Math.sin(th);
  let s=0; for(const p of chainPts){ const d=(p.x-mid.x)*nx+(p.z-mid.z)*nz; s+=d*d; }
  if(s<bestSpread){ bestSpread=s; bestAng=th; }
}
// turn that thin direction onto +x, so the flat face points across the pore
const qFace=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), -bestAng);
chainPts.forEach(p=>p.applyQuaternion(qFace));

// re-centre, and find the face that will front the pore
const box=new THREE.Box3().setFromPoints(chainPts);
const c=box.getCenter(new THREE.Vector3());
chainPts.forEach(p=>p.sub(c));
const faceX=new THREE.Box3().setFromPoints(chainPts).max.x;   // the pore-facing extreme

/* One wall is this chain, stepped along z at cellulose Ibeta's own chain
   spacing; the other is the same wall turned half a turn about y. */
const CHAIN_SPACING=8.2*A;         // cellulose Ibeta b axis
/* Two chains, not three: the wall has to be as deep as the water slab and no
   deeper. A wall standing proud of the liquid on the near side reads as a gap
   between the two, and the first version of this bench looked non-wetting for
   that reason alone — perspective on a chain 8 A nearer the camera. */
const CHAINS=3;
const wallAtoms=[];                // {el, pos}
const wallBonds=[];                // [a,b] into wallAtoms
const wallOH=[];                   // {o, h} scene positions, the adhesion sites

const perRes=chain.names.length;
const iName=n=>chain.index(n);
const OH_PAIRS=[['O2','HO2'],['O3','HO3'],['O6','HO6']].map(([o,h])=>[iName(o),iName(h)])
  .filter(([o,h])=>o>=0&&h>=0);
const optH=new Set(chain.optH);

function buildWall(side){
  // side = -1 (left) or +1 (right). The right wall is a rotation, never a mirror.
  const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), side>0?Math.PI:0);
  for(let k=0;k<CHAINS;k++){
    const z=(k-(CHAINS-1)/2)*CHAIN_SPACING;
    const base=wallAtoms.length;
    for(let r=0;r<CHAIN_N;r++){
      for(let i=0;i<perRes;i++){
        if(optH.has(i)) continue;                    // C-H's hidden, as every page hides them
        const p=chainPts[r*perRes+i].clone().applyQuaternion(q);
        // slide the wall out so its pore-facing face sits exactly at the gap
        p.x += side*(GAP/2 + faceX);
        p.z += z;
        wallAtoms.push({el:chain.el[i], pos:p});
      }
      const off=base+r*(perRes-optH.size);
      // bonds are per-residue and in residue-local numbering; skip any that
      // touch a hidden hydrogen, the same contract Stage.setOptionalH keeps
      const keep=[]; for(let i=0;i<perRes;i++) if(!optH.has(i)) keep.push(i);
      const localOf={}; keep.forEach((g,l)=>{ localOf[g]=l; });
      chain.bonds.forEach(([a,b])=>{
        if(optH.has(a)||optH.has(b)) return;
        wallBonds.push([off+localOf[a], off+localOf[b]]);
      });
      // this residue's free hydroxyls, as adhesion sites, if they face the pore
      OH_PAIRS.forEach(([oi,hi])=>{
        if(optH.has(oi)||optH.has(hi)) return;
        const o=wallAtoms[off+localOf[oi]].pos, h=wallAtoms[off+localOf[hi]].pos;
        // depth into the wall from its pore-facing plane; a hydroxyl further in
        // than a water molecule is wide can never be reached
        if(side*o.x - GAP/2 > 3.2*A) return;
        wallOH.push({o,h});
      });
    }
  }
}
buildWall(-1); buildWall(+1);

// the modelled region's lower edge, read off the wall rather than guessed
const FLOOR=Math.min(...wallAtoms.map(a=>a.pos.y))+FLOOR_MARGIN;

/* THE SURFACE, NOT A PLANE. A cellulose face is corrugated: the outermost atom
   of the ribbon sits 1-3 A proud of the hydroxyl oxygens behind it. Stopping
   the water at a flat plane through that outermost atom therefore holds every
   molecule just out of reach of the very groups it is supposed to bond to, and
   the wall reads as non-stick. So water is stopped by the ATOMS, at their own
   van der Waals radii, and can settle into the grooves between them.

   Only the atoms within a water's width of the face can ever be touched, and
   they are bucketed by height so a molecule tests a few dozen rather than all
   fifteen hundred. */
/* CONTACT radii, not van der Waals ones. A hydrogen bond is two atoms sitting
   INSIDE each other's van der Waals shells: water's O...O rests at 2.76 A while
   two vdW oxygens sum to 3.04. Give the wall's oxygens their full shell and the
   steric floor holds every water just too far out to bond, which is exactly the
   bug this replaced. So a wall oxygen stops water at the H-bond rest length, a
   hydroxyl hydrogen at the H...O it would form, and carbon — which bonds to
   nothing here — keeps its real vdW radius. */
const CONTACT={O:1.25*A, C:1.70*A, H:0.50*A};
const R_WATER=1.40*A;                       // the water O's radius in these sums
const BUCKET=3.0*A;   // finer than a water is wide, so a lookup returns few atoms
const surface=new Map();                    // side|bucket -> [{pos, r}]
wallAtoms.forEach(a=>{
  const side=Math.sign(a.pos.x);
  if(side*a.pos.x - GAP/2 > 4.5*A) return;  // deeper than this, nothing can reach it
  const key=side+'|'+Math.floor(a.pos.y/BUCKET);
  (surface.get(key)||surface.set(key,[]).get(key)).push({pos:a.pos, r:CONTACT[a.el]||1.5*A});
});
/* The hydroxyls, bucketed by height as well. Scanning all of them for every
   molecule near a wall was the cost the cell list uncovered: with a tall pore
   there are hundreds of sites and hundreds of near-wall molecules, and almost
   every pair is rejected on the first comparison. */
const ohBuckets=new Map();
function indexOH(){
  ohBuckets.clear();
  for(const site of wallOH){
    const key=Math.sign(site.o.x)+'|'+Math.floor(site.o.y/BUCKET);
    const l=ohBuckets.get(key); if(l) l.push(site); else ohBuckets.set(key,[site]);
  }
}
function ohNear(side,y){
  const b=Math.floor(y/BUCKET), out=[];
  for(let k=-1;k<=1;k++){ const l=ohBuckets.get(side+'|'+(b+k)); if(l) out.push(l); }
  return out;
}
function surfaceNear(side,y,span){
  const b=Math.floor(y/BUCKET), out=[];
  const n=span||1;
  for(let k=-n;k<=n;k++){ const l=surface.get(side+'|'+(b+k)); if(l) out.push(l); }
  return out;
}

/* ---- drawn as instances ----
 *  A wall is ~1500 spheres and as many sticks and it never moves, so it is one
 *  InstancedMesh per element plus one for the bonds rather than 3000 objects.
 */
const SPHERE=new THREE.SphereGeometry(1,16,12);
const STICK=new THREE.CylinderGeometry(1,1,1,8,1,true);
STICK.translate(0,0.5,0);            // origin at one end, so a bond is scale+aim

const VDW_DRAW={C:1.70, O:1.52, H:1.20};
function instancedSpheres(list, el){
  const pts=list.filter(a=>a.el===el);
  if(!pts.length) return null;
  const m=new THREE.InstancedMesh(SPHERE,
    new THREE.MeshLambertMaterial({color:P.atoms[el]||0x888888}), pts.length);
  /* Space-filling, at 0.9 of van der Waals. A cell wall is dense matter and a
     ball-and-stick one reads as a wire cage with gaps the water could swim
     through — which is the opposite of what a wall does. Slightly under the
     real shell so the corrugation between chains stays visible; colour, not
     size, is what separates wall from water here. */
  const r=(VDW_DRAW[el]||1.6)*0.9*A;
  const M=new THREE.Matrix4();
  pts.forEach((a,i)=>{ M.makeScale(r,r,r).setPosition(a.pos); m.setMatrixAt(i,M); });
  m.instanceMatrix.needsUpdate=true; root.add(m); return m;
}
const wallMeshes=['C','O','H'].map(el=>instancedSpheres(wallAtoms,el)).filter(Boolean);

const wallBondMesh=(function drawWallBonds(){
  const m=new THREE.InstancedMesh(STICK,
    new THREE.MeshLambertMaterial({color:P.bonds.covalent}), wallBonds.length);
  const M=new THREE.Matrix4(), q=new THREE.Quaternion(), up=new THREE.Vector3(0,1,0);
  const d=new THREE.Vector3(), s=new THREE.Vector3();
  wallBonds.forEach(([a,b],i)=>{
    const pa=wallAtoms[a].pos, pb=wallAtoms[b].pos;
    d.subVectors(pb,pa);
    q.setFromUnitVectors(up, s.copy(d).normalize());
    M.compose(pa, q, new THREE.Vector3(0.09*A, d.length(), 0.09*A));
    m.setMatrixAt(i,M);
  });
  m.instanceMatrix.needsUpdate=true; root.add(m); return m;
})();

/* ============================================================= *
 *  THE WATER
 * ============================================================= */
const wspec=MolLib.MOLECULES.water;             // family B, to scale
const OH=V3(wspec.atoms[1].pos), OH2=V3(wspec.atoms[2].pos);

/* A POOL, AND A SUPPLY BEHIND IT. This is the piece the bench was missing.
   A finite pool in a wetting pore cannot travel anywhere: its equilibrium is to
   spread itself into two thin films and stop, which is exactly what it did. A
   capillary rises because the tube stands in a BATH — as the front climbs, more
   water is drawn up behind it — and modelling the rest of the cell wall as an
   endless supply is not a cheat, it is what the rest of the cell wall is.

   So the bottom band is held at liquid density: whenever it thins, because the
   front above has drawn water out of it, another molecule arrives. Nothing
   pushes. The front climbs because the wall is dry, and the supply only keeps
   the base from emptying while it does. */
const N_START=420;                     // the pool at the foot of the pore
const N_MAX=1800;                      // enough to fill this pore, and a stop
const SUPPLY_BAND=8.0*A;               // the depth of base kept topped up
let N_WATER=N_MAX;                     // buffers are sized for the cap
const waters=[];                                 // {p, v, q, o, h:[2]}
const _v=new THREE.Vector3(), _u=new THREE.Vector3(), _w=new THREE.Vector3();

function makeWater(p){
  const w={ p:p.clone(), v:new THREE.Vector3(),
            q:new THREE.Quaternion().setFromEuler(new THREE.Euler(
              Math.random()*6.28, Math.random()*6.28, Math.random()*6.28)),
            o:new THREE.Vector3(), h:[new THREE.Vector3(), new THREE.Vector3()],
            hb:0 };
  waters.push(w); return w;
}
/* A POOL AT THE BOTTOM OF A DRY PORE. This is the initial condition the bench
   exists for: everything above the pool is bare cellulose, so the water has
   somewhere to go and whether it climbs is a result rather than a setup. An
   earlier version seeded the pore already full, which cannot show a climb for
   the same reason a full glass cannot show pouring.

   On a lattice at the liquid's own spacing, so nothing collapses or expands on
   the first frames and the only motion is the wetting. */
function seed(){
  waters.length=0;
  const d=2.85*A;                                     // liquid spacing, near O...O
  const nx=Math.max(1,Math.floor((GAP-2*R_WATER)/d)), nz=Math.max(1,Math.floor(DEPTH/d));
  for(let i=0;i<N_START;i++){
    const c=i%nx, r=Math.floor(i/nx)%nz, lay=Math.floor(i/(nx*nz));
    makeWater(new THREE.Vector3(
      (c-(nx-1)/2)*d + (Math.random()-0.5)*0.3*A,
      FLOOR + 1.2*A + lay*d*0.92,
      (r-(nz-1)/2)*d + (Math.random()-0.5)*0.3*A));
  }
}
seed();

// world positions of one water's atoms, from its own quaternion
function place(w){
  w.o.copy(w.p);
  w.h[0].copy(OH).applyQuaternion(w.q).add(w.p);
  w.h[1].copy(OH2).applyQuaternion(w.q).add(w.p);
}
waters.forEach(place);

/* THE WATER IS SPACE-FILLING AND THE WALL IS NOT, and that is the one place
   this page departs from the house radii on purpose. PALETTE.radii are
   ball-and-stick sizes, chosen so one molecule's sticks show; at a real liquid's
   spacing (O...O 2.76 A) spheres that size leave gaps you could drive a
   molecule through, and 300 of them read as a gas. These are near van der Waals
   instead (O 1.40 A against a real 1.52, H 0.95 against 1.20), which is how a
   liquid has to be drawn if its density is the claim. The wall stays
   ball-and-stick, so structure and bulk do not look like the same substance. */
const R_O=1.40*A, R_H=0.95*A;
const oMesh=new THREE.InstancedMesh(SPHERE,
  new THREE.MeshLambertMaterial({color:P.atoms.O}), N_WATER);
const hMesh=new THREE.InstancedMesh(SPHERE,
  new THREE.MeshLambertMaterial({color:P.atoms.H}), N_WATER*2);
root.add(oMesh,hMesh);

/* H-bonds, dashed, the convention WaterSim.md 1 sets. The same line is drawn
   for a bond to a wall hydroxyl: adhesion IS this bond, to a different partner,
   and drawing it differently would be inventing a second force. */
const hbGeo=new THREE.BufferGeometry();
const HB_MAX_LINES=N_WATER*4;
hbGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(HB_MAX_LINES*6),3));
const hbLines=new THREE.LineSegments(hbGeo,
  new THREE.LineDashedMaterial({color:P.bonds.hbond, dashSize:0.42*A, gapSize:0.3*A,
    transparent:true, opacity:0.85}));
hbLines.frustumCulled=false; root.add(hbLines);

/* ============================================================= *
 *  The physics. Same rules as the solvation engine, at real scale.
 * ============================================================= */
/* NO GRAVITY TERM. At 3.5 nm the capillary pressure is about 8e7 Pa and the
   gravitational pressure across the pore about 5e-5 Pa: twelve orders of
   magnitude, so weight is not a small effect here, it is no effect. A g that
   competes with wetting would have to be ~1e12 times Earth's, and the column it
   made would be a picture of a capillary tube in a dish rather than of a cell
   wall. What holds this liquid in place is the wall and its own cohesion, which
   is the whole claim, so nothing else may hold it. */
let DAMP=0.93;                    // light: a front that has to travel needs to keep moving
let JITTER=0.004*A;
let K_HB=0.030;                   // H-bond spring
let K_COH=0.108;                // dispersion, the undirected part of cohesion
let K_STERIC=0.90;
const K_WALL=0.20;                // the wall is solid
/* Adhesion beats cohesion here, and that is the whole reason the meniscus is
   concave: a hydroxyl surface offers water the same bond another water does,
   and there are more of them per unit area than a curved liquid surface can
   present back. Under-set this and the render tells the waxed-windshield story
   by accident. */
const K_ADHERE=0.075;             // the bond itself, directional
const K_ADHERE_LR=0.075;          // and the undirected pull from one hydroxyl
/* THE WALL AS A WALL, not as a bag of separate atoms. A single hydroxyl's pull
   dies inside about 6 A, so a liquid that once lets go of the surface can never
   feel it again and stays balled up in the middle of the pore — which is the
   waxed windshield, not a cell wall. A solid attracts by the SUM over everything
   behind the surface, and that sum falls off far more slowly than any one pair.
   This is that sum, as a smooth pull toward the face; the drawn dashes still
   come only from real H-bond geometry, so nothing is claimed that is not there. */
/* Set for IMBIBITION, now that there is a supply. Without one, a strong wall
   pull drained the pool into two films and stopped, so the setting had to be
   weak enough to keep the pool a body. Fed from below, that same strong pull is
   the whole point: the film runs up the dry wall, the liquid behind follows,
   and water is drawn in at the base to replace it. From a 420-molecule pool the
   front crosses the pore's 94 A in about 1500 steps and the count climbs past
   700 doing it. Turn it down toward 0.037 and the front creeps; turn it off and
   the pool sits there. */
let K_WET=0.020*A;              // per surface atom, summed; not per molecule
/* K_WET, K_COH, K_STERIC and OO_MIN are `let` so the console can sweep them
   without a reload. The contact angle lives in the ratio of the first two, and
   sweeping it is what this bench is for. */
const WET_REACH=11.0*A;

let hbCount=0, adCount=0;
const forces=[];
/* A CELL LIST, because every pair is not worth asking about. Testing all 405k
   pairs of 900 molecules cost about 15 ms a step, which made the speed control
   a lie: eight steps a frame ran at eight frames a second and simulated no more
   per second than one step a frame did. Molecules further apart than COH_MAX
   exert nothing, so bin them at that size and only ask about the 27 cells that
   can reach. The pairs actually tested drop to roughly a tenth. */
const CELL=COH_MAX;
const cells=new Map();
const cellKey=(x,y,z)=>((Math.floor(x/CELL)+512)*1024+(Math.floor(y/CELL)+512))*1024
                       +(Math.floor(z/CELL)+512);
const NBR_MAX=48;                                  // a water never has this many inside 6.2 A
const nbr=new Int16Array(N_WATER*NBR_MAX), nbrN=new Int16Array(N_WATER);
const accepted=new Uint8Array(N_WATER), bondedWith=new Int16Array(N_WATER);

let stepNo=0;
function step(){
  stepNo++;
  const n=waters.length;
  for(let i=0;i<n;i++) (forces[i]||(forces[i]=new THREE.Vector3())).set(0,0,0);

  // --- pairwise: steric floor, then the H-bond that pulls them back together
  let lines=0; hbCount=0; adCount=0;
  const pos=hbGeo.attributes.position.array;
  /* The pair pass keeps a neighbour list, because the H-bond search below wants
     exactly the pairs this loop already found and running it over all n^2 again
     was two thirds of the frame. Counts live in typed arrays rather than a Map
     and a Set of string keys — 180k `i+'|'+j` allocations a frame is most of
     the rest of it. */
  for(let i=0;i<n;i++){ nbrN[i]=0; accepted[i]=0; }

  cells.clear();
  for(let i=0;i<n;i++){
    if(waters[i].gone) continue;
    const k=cellKey(waters[i].p.x,waters[i].p.y,waters[i].p.z);
    const c=cells.get(k); if(c) c.push(i); else cells.set(k,[i]);
  }

  for(let i=0;i<n;i++){
    const a=waters[i];
    if(a.gone) continue;
    const bx=Math.floor(a.p.x/CELL), by=Math.floor(a.p.y/CELL), bz=Math.floor(a.p.z/CELL);
    for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) for(let dz=-1;dz<=1;dz++){
    const c=cells.get(((bx+dx+512)*1024+(by+dy+512))*1024+(bz+dz+512));
    if(!c) continue;
    for(let q=0;q<c.length;q++){
      const j=c[q];
      if(j<=i) continue;               // each pair once, whichever cell finds it
      const b=waters[j];
      _v.subVectors(a.p,b.p);
      const d=_v.length();
      if(d>COH_MAX || d<1e-4) continue;
      if(nbrN[i]<NBR_MAX) nbr[i*NBR_MAX+nbrN[i]++]=j;
      if(nbrN[j]<NBR_MAX) nbr[j*NBR_MAX+nbrN[j]++]=i;
      if(d<OO_MIN){
        _u.copy(_v).multiplyScalar((OO_MIN-d)/d*K_STERIC);
        forces[i].add(_u); forces[j].sub(_u);
      } else if(d>OO_EQ){
        /* Dispersion, and only OUTSIDE the H-bond rest length. Letting it pull
           at every separation crushes the liquid: it peaks just above the steric
           floor, so it fights the floor instead of the gap, and the first
           version of this bench settled with its neighbours 2.35 A apart
           against a real 2.8. Attraction beyond equilibrium, repulsion below,
           nothing in between — the shape any pair potential has. */
        const fade=1-(d-OO_EQ)/(COH_MAX-OO_EQ);
        _u.copy(_v).multiplyScalar(-K_COH*fade*fade/d);
        forces[i].add(_u); forces[j].sub(_u);
      }
    }
    }
  }
  // --- H-bonds: a donor H reaching a lone pair, one bond per H, two per oxygen
  for(let i=0;i<n;i++){ waters[i].hb=0; bondedWith[i]=-1; }
  for(let i=0;i<n;i++){
    const don=waters[i];
    for(let k=0;k<2;k++){
      let best=-1, bestD=HB_MAX, bestLin=0;
      for(let q=0;q<nbrN[i];q++){
        const j=nbr[i*NBR_MAX+q];
        const acc=waters[j];
        if(acc.gone) continue;
        if(accepted[j]>=2) continue;                 // an oxygen has two lone pairs
        if(bondedWith[i]===j) continue;              // and one pair shares one bond
        const dd=don.h[k].distanceTo(acc.o);
        if(dd<bestD){
          _u.subVectors(don.h[k],don.o).normalize();
          _w.subVectors(acc.o,don.h[k]).normalize();
          const lin=_u.dot(_w);
          if(lin>HB_LIN){ best=j; bestD=dd; bestLin=lin; }
        }
      }
      if(best<0) continue;
      const acc=waters[best];
      accepted[best]++;
      bondedWith[i]=best;
      don.hb++; acc.hb++; hbCount++;
      _v.subVectors(acc.p,don.p);
      const dist=_v.length()||1;
      _v.multiplyScalar((dist-OO_EQ)*K_HB*bestLin/dist);
      forces[i].add(_v); forces[best].sub(_v);
      if(lines<HB_MAX_LINES){
        don.h[k].toArray(pos, lines*6); acc.o.toArray(pos, lines*6+3); lines++;
      }
    }
  }

  // --- the wall: solid, and covered in hydroxyls that will hold on
  const reach=5.0*A;
  for(let i=0;i<n;i++){
    const w=waters[i], f=forces[i];
    if(w.gone) continue;
    // contact with the wall's own atoms, at their radii
    const side=Math.sign(w.p.x)||1;
    if(Math.abs(w.p.x) > GAP/2 - 5.0*A){
      for(const list of surfaceNear(side,w.p.y)) for(const at of list){
        _v.subVectors(w.p,at.pos);
        const d=_v.length(), touch=at.r+R_WATER;
        if(d<touch && d>1e-4) f.addScaledVector(_v,(touch-d)/d*K_WALL);
      }
    }
    /* The surface's long-range share, summed over the atoms themselves rather
       than applied as a push along -x. The direction matters: a sideways-only
       wall force cannot lift anything, so the column sat with a dead flat top
       however strongly it was wetted. Pulled toward real atoms, a molecule at
       the top of the column feels the wall ABOVE it too, and climbs — which is
       the meniscus, and then capillary rise, and neither had to be drawn. */
    /* Summed over a few hundred wall atoms, and REUSED for a few steps. The
       wall does not move and a molecule crosses a fraction of an angstrom per
       step, so recomputing this every step for every molecule was the single
       most expensive thing in the frame and it returned nearly the same vector
       each time. Each molecule refreshes on its own step, so the cost is spread
       and no frame carries all of it. */
    if(!w.wallF) w.wallF=new THREE.Vector3();
    if((stepNo+i)%4===0){
      w.wallF.set(0,0,0);
      if(GAP/2-Math.abs(w.p.x) < WET_REACH && Math.abs(w.p.x) < GAP/2){
        for(const list of surfaceNear(side,w.p.y,4)) for(const at of list){
          _v.subVectors(at.pos,w.p);
          const d=_v.length();
          if(d>WET_REACH || d<1e-4) continue;
          const t=1-d/WET_REACH;
          w.wallF.addScaledVector(_v, K_WET*t*t/d);
        }
      }
    }
    f.add(w.wallF);
    /* THE FACE IS THE LIMIT. This backstop used to sit an angstrom BEHIND the
       face, and with the steric list only holding atoms near the surface, a
       molecule that got past the outermost ones found nothing behind them and
       sank into the wall: a quarter of the water ended up inside the cellulose,
       riding high in its grooves, which is also what made an early version look
       like it had a meniscus. It did not. It had a leak. */
    const deep=Math.abs(w.p.x)-(GAP/2-R_WATER);
    if(deep>0) f.x -= side*deep*K_WALL*8;
    const dz=Math.abs(w.p.z)-DEPTH/2;
    if(dz>0) f.z -= Math.sign(w.p.z)*dz*K_WALL;
    // The supply boundary. Not a floor holding anything up — with no gravity
    // nothing falls — but the edge of the modelled region, where water comes in
    // from the rest of the wall and where a molecule fed back in appears.
    if(w.p.y<FLOOR) f.y += (FLOOR-w.p.y)*K_WALL;
    if(Math.abs(w.p.x) < GAP/2-reach) continue;      // too far in to feel a hydroxyl
    for(const list of ohNear(side,w.p.y)) for(const site of list){
      if(Math.abs(site.o.z-w.p.z)>reach) continue;
      if(Math.abs(site.o.y-w.p.y)>reach) continue;
      _v.subVectors(site.o,w.p);
      const dist=_v.length()||1;
      if(dist>COH_MAX) continue;
      /* Two parts, as the force really has two. A hydroxyl pulls on a water
         whatever way either is turned — that is the electrostatics, and it is
         what wets the wall. The BOND is the strong directional part on top,
         and only it earns a dash: a line drawn for the general attraction
         would be claiming a hydrogen bond wherever water is merely near. */
      const fade=1-(dist-OO_EQ)/(COH_MAX-OO_EQ);
      if(fade>0) f.addScaledVector(_v, K_ADHERE_LR*fade*fade/dist);

      const donates=site.h.distanceTo(w.o)<HB_MAX;
      const accepts=!donates && (w.h[0].distanceTo(site.o)<HB_MAX || w.h[1].distanceTo(site.o)<HB_MAX);
      if(!donates && !accepts) continue;
      f.addScaledVector(_v,(dist-OO_EQ)*K_ADHERE/dist);
      adCount++;
      if(lines<HB_MAX_LINES){
        if(donates){ site.h.toArray(pos,lines*6); w.o.toArray(pos,lines*6+3); }
        else {
          const k=w.h[0].distanceTo(site.o)<HB_MAX?0:1;
          w.h[k].toArray(pos,lines*6); site.o.toArray(pos,lines*6+3);
        }
        lines++;
      }
    }
  }

  // --- integrate, and let each molecule turn toward the bond it is making
  for(let i=0;i<n;i++){
    const w=waters[i];
    if(w.gone) continue;               // evaporate() is flying this one
    forces[i].x += (Math.random()-0.5)*JITTER;
    forces[i].y += (Math.random()-0.5)*JITTER;
    forces[i].z += (Math.random()-0.5)*JITTER;
    w.v.add(forces[i]).multiplyScalar(DAMP);
    w.p.add(w.v);
    w.q.multiply(_tumble(w));
    place(w);
  }

  hbGeo.setDrawRange(0,lines*2);
  hbGeo.attributes.position.needsUpdate=true;
  hbLines.computeLineDistances();
  return lines;
}
// a small random tumble, damped by how many bonds hold the molecule
const _qt=new THREE.Quaternion(), _ax=new THREE.Vector3();
function _tumble(w){
  const k=0.05/(1+w.hb);
  _ax.set(Math.random()-0.5,Math.random()-0.5,Math.random()-0.5).normalize();
  return _qt.setFromAxisAngle(_ax,(Math.random()-0.5)*k);
}

/* ---- evaporation, which is the whole point ----
 *  A molecule leaves from the free surface, and only if it is weakly bonded,
 *  which is the energy of vaporisation: the bonds go before the molecule does.
 *  Two or fewer, against a bulk molecule's three or four — a stricter cut than
 *  that leaves almost nobody eligible and the flow stops. It then
 *  FLIES OFF, and is only recycled to the bottom once it is out of the frame.
 *
 *  The flying matters. An earlier version teleported it straight from the top
 *  to the bottom, which is the same bookkeeping and shows nothing at all: no
 *  molecule is ever seen leaving, none is seen arriving, and the column looks
 *  static while the whole thing is supposedly flowing.
 *
 *  Feeding it back in at the base is the root's half. Water leaves the leaf and
 *  water enters from below, so the column keeps its length and the water inside
 *  it travels up.
 */
/* It leaves FAST. Every molecule in flight is one the column has lost, so a
   slow escape is a standing deficit: at 0.1 A a frame the vapour held a sixth
   of the liquid at once, the column shrank, and the water went DOWN while
   evaporating — the opposite of the thing being shown. At this speed the
   round trip is about 45 frames and the deficit stays near 1%. */
const ESCAPE_V=0.5*A;
let escapeTop=0;                       // set from the wall's height, below
let evapAcc=0, evapCount=0;
/* A RATE, NOT A SWITCH. Evaporation never stops: at any temperature some
   surface molecules sit in the high end of the energy distribution with enough
   to break their bonds and go, and heat only widens that end. In a leaf it is
   not heat at all but the humidity outside, which is why transpiration runs on
   an ordinary day. So the control is molecules per second, and zero is
   saturated air rather than a cold one. */
let EVAP_RATE=7;                       // molecules leaving per second
function evaporate(){
  // molecules already on their way out: no bonds, no gravity, just going
  for(const w of waters){
    if(!w.gone) continue;
    w.p.y+=ESCAPE_V; place(w);
    if(w.p.y>escapeTop){               // out of the frame; the root sends another
      w.gone=false;
      w.p.set((Math.random()-0.5)*(GAP-3*A), FLOOR+0.4*A, (Math.random()-0.5)*DEPTH);
      w.v.set(0,0.01*A,0); place(w);
    }
  }
  /* Rate is a real trade-off, not a free knob: evaporating flattens the
     meniscus. Static the surface stands ~10 A higher at the walls; running,
     it sits at 0-2 A at every rate that still shows visible flow. Flux draws
     a surface down, which is true, but even 7 a second here is orders above a
     leaf's, and the curve pays for it. */
  if(EVAP_RATE<=0) return;
  evapAcc += EVAP_RATE/60;
  if(evapAcc<1) return;
  evapAcc -= 1;
  /* Anywhere on the free surface, not the single highest molecule. Taking the
     top one always takes the water riding up the wall — the meniscus rim is by
     definition the highest thing there — so evaporating slowly ate the curve
     and flattened it, which real evaporation does not do. Sample the whole
     surface instead: barely bonded, and within a molecule or two of the top. */
  let hi=-Infinity;
  for(const w of waters) if(!w.gone && w.p.y>hi) hi=w.p.y;
  const surface=[];
  for(const w of waters) if(!w.gone && w.hb<=2 && w.p.y>hi-8*A) surface.push(w);
  if(surface.length){
    const w=surface[(Math.random()*surface.length)|0];
    w.gone=true; w.v.set(0,0,0); evapCount++;
  }
}

indexOH();
escapeTop=Math.max(...wallAtoms.map(a=>a.pos.y))+6*A;   // clear of the pore's mouth

/* One callout, on the thing a student would otherwise read as scenery. The
   green slabs are the load-bearing part of a plant cell wall, and the pore is
   the gap between two of its cellulose fibrils — which is the sentence that
   turns this from an abstract slot into somewhere in a leaf. */
const NOTES=Annot.create(THREE, document.getElementById('stage'), camera, {mode:'on'});
(function markWall(){
  // the wall itself, named where it is thickest and unmistakably scenery
  const face=new THREE.Vector3(-GAP/2-4*A, FLOOR+nm(3.4), 0);
  NOTES.add({ text:'plant cell wall', offset:[-150,-34], at:()=>face,
    card:'Cellulose fibrils, the load-bearing part of a plant cell wall. This '
       + 'pore is the gap between two of them. In a leaf, pores like it are '
       + 'where the water column finally meets air.' });

  /* And ONE hydroxyl, by name. The macro label says where we are; this one says
     why the water does not simply fall away from the wall, and it has to point
     at an actual -OH the engine is bonding to rather than at the wall in
     general — so it is picked out of the same wallOH list the physics uses. */
  let best=null;
  for(const site of wallOH){
    if(site.o.x>0) continue;                       // the left wall, facing us
    const score=Math.abs(site.o.z)+Math.abs(site.o.y-(FLOOR+nm(1.6)));
    if(!best || score<best.score) best={site, score};
  }
  if(best) NOTES.add({ text:'adhesion', offset:[-150,26],
    at:()=>best.site.o,
    card:'Every glucose in the wall carries \u2013OH groups, and each one can '
       + 'hydrogen bond a water exactly as another water would. Water holding '
       + 'onto something else is adhesion. Water holding onto itself is cohesion. '
       + 'Which one wins decides whether water climbs a surface or beads up on it.' });
})();

/* The supply. Counts what is in the bottom band and tops it up toward the
   density a liquid has there, one molecule at a time so nothing is injected
   into an occupied space. */
const SUPPLY_TARGET=Math.round(0.0334*(GAP/A)*(DEPTH/A)*(SUPPLY_BAND/A));
let supplyClock=0;
function supply(){
  if(waters.length>=N_MAX) return;
  if(++supplyClock%2) return;
  let inBand=0;
  for(const w of waters) if(!w.gone && w.p.y<FLOOR+SUPPLY_BAND) inBand++;
  if(inBand>=SUPPLY_TARGET) return;
  // a spot in the band that nothing is sitting in
  for(let tries=0;tries<8;tries++){
    const p=new THREE.Vector3(
      (Math.random()-0.5)*(GAP-2.6*R_WATER),
      FLOOR+0.6*A+Math.random()*SUPPLY_BAND*0.5,
      (Math.random()-0.5)*(DEPTH-2*R_WATER));
    let clear=true;
    for(const w of waters){ if(w.gone) continue;
      if(w.p.distanceToSquared(p)<(OO_MIN*0.95)**2){ clear=false; break; } }
    if(clear){ place(makeWater(p)); return; }
  }
}

/* ============================================================= *
 *  Render
 * ============================================================= */
const _M=new THREE.Matrix4();

function draw(){
  waters.forEach((w,i)=>{
    _M.makeScale(R_O,R_O,R_O).setPosition(w.o); oMesh.setMatrixAt(i,_M);
    for(let k=0;k<2;k++){
      _M.makeScale(R_H,R_H,R_H).setPosition(w.h[k]); hMesh.setMatrixAt(i*2+k,_M);
    }
  });
  oMesh.instanceMatrix.needsUpdate=true;
  hMesh.instanceMatrix.needsUpdate=true;
}

/* The bench's own numbers, off what was built rather than typed: the gap in
   real nm, how many water diameters that is, and the bonds standing this frame. */
const readout=document.getElementById('readout');
const WATER_DIA=2.80;                       // real angstroms, O...O contact
let frames=0;
function report(){
  readout.innerHTML =
    `pore  <b>${(GAP/A/10).toFixed(1)} nm</b>  =  <b>${Math.round(GAP/A/WATER_DIA)}</b> molecules across\n`
  + `water <b>${waters.length}</b> of ${N_MAX}   H-bonds <b>${hbCount}</b>   wall contacts <b>${adCount}</b>\n`
  /* Throughput, not level. In steady flow the column keeps its height while
     every molecule in it travels, so the level says nothing and the count of
     molecules that have gone through says everything. */
  + `through  <b>${evapCount}</b> evaporated   <b>${waters.filter(w=>w.gone).length}</b> in flight`;
}

let SPEED=1;                           // physics steps per drawn frame
function loop(){
  requestAnimationFrame(loop);
  /* Speed is steps per FRAME, not a bigger timestep. Scaling the timestep
     instead would let molecules jump through each other and through the wall,
     and the settling distances this page reports would stop being the model's.
     More steps is just watching the same physics from further along. */
  for(let k=0;k<SPEED;k++){ step(); supply(); evaporate(); }
  draw(); stepTint(); NOTES.step();
  if((frames++ & 7)===0){ report(); reportClimb(); }
  renderer.render(scene,camera);
}
/* Each knob names the variable it drives, so the panel cannot drift from the
   physics: the getter and setter are the only place the value lives. */
const KNOBS=[
  /* THE THREE THAT TEACH. Capillary action is a competition between water
     holding the wall and water holding itself, so adhesion and cohesion are the
     lesson and everything else is apparatus. Speed is here because the outcome
     takes a while to arrive and a student should not have to wait for it. */
  {k:'Speed',      get:()=>SPEED,     set:v=>SPEED=v,      min:1,   max:12,   step:1,     fmt:v=>v+'x', main:1},
  {k:'Adhesion',   get:()=>K_WET/A,   set:v=>K_WET=v*A,    min:0,   max:0.09, step:0.001, fmt:v=>v.toFixed(3), main:1},
  {k:'Cohesion',   get:()=>K_COH,     set:v=>K_COH=v,      min:0,   max:0.14, step:0.002, fmt:v=>v.toFixed(3), main:1},
  {k:'Evaporation',get:()=>EVAP_RATE, set:v=>EVAP_RATE=v,  min:0,   max:25,   step:1,     fmt:v=>v?v+'/s':'off', main:1},
  {k:'H-bond',     get:()=>K_HB,      set:v=>K_HB=v,       min:0,   max:0.09, step:0.002, fmt:v=>v.toFixed(3)},
  {k:'Damping',    get:()=>DAMP,      set:v=>DAMP=v,       min:0.70,max:0.99, step:0.01,  fmt:v=>v.toFixed(2)},
  {k:'Jitter',     get:()=>JITTER/A,  set:v=>JITTER=v*A,   min:0,   max:0.03, step:0.001, fmt:v=>v.toFixed(3)},
  {k:'Steric',     get:()=>K_STERIC,  set:v=>K_STERIC=v,   min:0.1, max:2.5,  step:0.05,  fmt:v=>v.toFixed(2)},
];
const knobRows=document.getElementById('knobrows');
/* The rest are apparatus, folded away: a panel of eight sliders says all eight
   matter equally, and two of these are the whole point. */
const more=document.createElement('details');
more.innerHTML='<summary>more</summary>';
KNOBS.forEach(kn=>{
  const l=document.createElement('label');
  l.innerHTML=`<span class="row"><span>${kn.k}</span><b></b></span>`
            + `<input type="range" min="${kn.min}" max="${kn.max}" step="${kn.step}">`;
  const out=l.querySelector('b'), input=l.querySelector('input');
  input.value=kn.get();
  out.textContent=kn.fmt(kn.get());
  input.oninput=()=>{ const v=parseFloat(input.value); kn.set(v); out.textContent=kn.fmt(v); };
  (kn.main?knobRows:more).appendChild(l);
});
knobRows.appendChild(more);

/* The number the knobs are being turned against: how much higher the water
   stands at the wall than in the middle. Measured off the molecules, so the
   panel reports the model rather than the setting. */
function topAt(bin){
  const ys=[];
  for(const w of waters){ if(w.gone) continue;
    if(Math.round(Math.abs(w.p.x)/A/4)*4===bin) ys.push(w.p.y/A); }
  if(!ys.length) return null;
  ys.sort((a,b)=>b-a);
  const n=Math.max(1,Math.round(ys.length*0.1));
  return ys.slice(0,n).reduce((a,b)=>a+b,0)/n;
}
const climbEl=document.getElementById('climb');
function reportClimb(){
  const wall=topAt(16), mid=topAt(0);
  climbEl.textContent=(wall==null||mid==null)?'—':(wall-mid).toFixed(1)+' \u00c5';
}

/* TINT: one colour for the wall, one for the water, instead of one per element.
   Element colours answer "what is this atom"; at 500 molecules against 3000 wall
   atoms the more useful question is "which of the two things am I looking at",
   and the boundary between them is what the whole page is about. Both tints are
   palette entries — chloride's green and the H-bond's blue — rather than typed
   colours, so they cannot drift from the rest of the sandbox.

*/
const TINT_WALL=P.atoms.Cl, TINT_WATER=P.bonds.hbond;
const plain=new Map();
[...wallMeshes, wallBondMesh, oMesh, hMesh].forEach(m=>plain.set(m,m.material.color.getHex()));
/* BLENDED, not replaced. Flooding every atom with one flat colour throws away
   the tone inside a molecule: a hydrogen and the oxygen it hangs off become the
   same sphere and the shape stops reading. Each element keeps its own colour and
   is carried most of the way toward the tint instead, so hydrogens stay pale
   against their oxygens and the wall's carbons stay dark against its hydroxyls.
   One hue per side of the boundary, still two tones within each. */
const TINT_MIX=0.74;
const _c=new THREE.Color(), _t=new THREE.Color();
/* Faded, not switched. A hard cut between two colour schemes reads as the scene
   being replaced; carrying every sphere across in a third of a second reads as
   the same scene being looked at differently, and the eye keeps track of which
   molecule was which. `tintT` is the position along that fade and the render
   loop walks it toward the checkbox. */
let tintT=0, tintTarget=0;
function applyTint(){
  const k=TINT_MIX*tintT;
  const set=(m,c)=>{ _c.setHex(plain.get(m)); m.material.color.copy(_c.lerp(_t.setHex(c),k)); };
  wallMeshes.forEach(m=>set(m,TINT_WALL));
  set(wallBondMesh,TINT_WALL);
  set(oMesh,TINT_WATER); set(hMesh,TINT_WATER);
}
function stepTint(){
  if(tintT===tintTarget) return;
  const d=tintTarget-tintT;
  tintT += Math.sign(d)*Math.min(Math.abs(d), 0.055);   // ~1/3 s at 60fps
  if(Math.abs(tintTarget-tintT)<0.002) tintT=tintTarget;
  applyTint();
}
document.getElementById('tint').onchange=e=>{ tintTarget=e.currentTarget.checked?1:0; };

resize(); applyCam(); loop();
new ResizeObserver(()=>{ resize(); applyCam(); }).observe(canvas);


document.getElementById('reset').onclick=()=>{
  seed(); waters.forEach(w=>{ w.gone=false; }); waters.forEach(place); evapCount=0; };
</script>
</body>
