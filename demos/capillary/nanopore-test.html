<title>capillary action — test bench</title>

<!-- ===================================================================
     TEST BENCH. Not a lesson.

     THE QUESTION. Capillarity is on WaterSim.md's list of things that
     must trace back to H-bonding, and the usual picture of it — water
     climbing a stem — cannot be drawn at molecular scale. A xylem
     vessel is 10-100 um, which is 36,000 to 360,000 water molecules
     across, and capillary rise in one is about 1.5 m against a
     redwood's 100. The vessel is not where the lift comes from.

     Where it comes from is the cell-wall pore in the leaf: a few
     nanometres, a few tens of molecules across, holding a curved
     meniscus that evaporation pulls on. THAT is drawable at honest
     scale, and this bench is whether it renders as anything.

     SCALE. Everything here is family B — real angstroms x MolLib.SCALE
     (MolecularGeometry.md 1.5) — because the page makes a size claim
     and only family B may. So the water is mol-small's to-scale
     spectroscopic geometry, NOT water-lab's family-A physics water,
     and the engine constants below are real distances scaled once,
     not tuned numbers.

     THE WALLS ARE REAL CELLULOSE. Not a hydroxyl lattice standing in
     for one: the cellobiose spec repeated by chain-repeat.js, the same
     path chain/glucose-chains-test.html checks, so the -OH groups the
     water bonds to are where beta-1,4 glucose actually puts them. The
     right-hand wall is the left one turned 180 degrees about Y, never
     mirrored: a mirrored sugar is the other enantiomer.

     WHAT IT SHOWS. The wall wets: water reaches the hydroxyl surface,
     sits 2.4-3.0 A from its oxygens, and holds H-bonds to them — which
     is adhesion, drawn as the same bond as cohesion, because it is the
     same bond. The liquid's own numbers are close: nearest neighbours
     settle near 2.55 A against a real 2.8, and about 2.5 H-bonds per
     molecule against a real 3.6, at the seeded bulk density.

     WATER TRAVELS UP THE CHANNEL, AND THAT IS WHAT THE PAGE IS FOR. It
     starts as a pool at the foot of a DRY pore — bare cellulose above it
     — and the front then climbs, as a BODY: over 3000 steps the middle
     of the channel rises about 15 A and the water at the walls about 23,
     with the count growing from 490 to 820 as more is drawn in at the
     base. The wall leads the middle by roughly 17 A, which is the
     meniscus, and nothing is ejected from the top.

     THREE THINGS HAD TO BE FIXED BEFORE IT WOULD MOVE, and all three
     were missing pieces rather than bad numbers.

     One: it seeded the pore ALREADY FULL. A full glass cannot show
     pouring; the wall above the water has to be dry.

     Two: THERE WAS NO SUPPLY. A capillary rises because the tube stands
     in a bath, so the bottom band is now held at liquid density, which
     models the rest of the cell wall as the endless reservoir it
     effectively is.

     Three, and this is the one that took longest to see: THERE WAS NO
     PRESSURE. With those two fixed the wall still only stripped FILMS
     off the pool — measured across the whole adhesion range, the water
     at the wall climbed from -7 A to +38 while the middle of the channel
     never moved at all. Raising adhesion only stripped more; a narrower
     pore did not help; a shorter-ranged wall did nothing at any strength.
     The reason is structural. A liquid held only by pair forces is happy
     to thin out and leave a void, so a wetting wall peels a film off it
     and the body stays where it is. Real filling is the other way round:
     the liquid is effectively incompressible, so the curved surface sets
     up a pressure difference and drags the column behind it. Nothing in
     a neighbour-force model expresses that, which is why no amount of
     tuning found it.

     AN EARLIER READING OF THIS WAS WRONG and the reason is worth
     keeping. Seeded at RANDOM through the pore, the old build reported
     10-17 A, the right order for a hemispherical meniscus. Seeded on a
     lattice instead, the identical run gave 0.0 A and stayed flat for
     thousands of steps: molecules that happened to land against the
     wall had stuck there and never come down. A number that depends on
     the seed is hysteresis, not equilibrium. Approaching from a full
     pore AND an empty one is still the check this has not had.

THERE IS NO GRAVITY HERE, and that is a correction to an earlier
     version rather than a simplification. At 3.5 nm the capillary
     pressure is ~8e7 Pa and the gravitational pressure across the pore
     ~5e-5 Pa, twelve orders of magnitude apart. There is no up in a
     cell-wall pore: water moves toward the EVAPORATING SURFACE, and in
     a leaf those pores face the air spaces in every orientation. An
     earlier build had a g strong enough to hold a column down, which
     drew the dipped-capillary-tube picture — the wrong model for a
     leaf, where the lifting happens in metres of xylem, pulled by the
     tension these menisci generate. This bench is where the grip is,
     not where the rope moves. What holds the liquid now is the wall and
     its own cohesion, which is the only claim it was ever making.

     The page still draws the pore standing upright, and that is now
     only a camera angle: nothing in the physics knows which way is up.

     IT WAS WRONG FIRST, AND THE FAILURE IS THE USEFUL PART. An earlier
     version put the wall's backstop an angstrom BEHIND the face while
     the steric list held only atoms near the surface, so a molecule
     that slipped past the outermost ones found nothing behind them:
     about a quarter of the water ended up inside the cellulose, sitting
     high in its grooves. That leak read as water high at the walls,
     which is what a meniscus also reads as. Every early measurement of
     the surface was measuring the leak, and the shape only became
     honest once the count of molecules past the face was zero.

     Molecule count mattered too. At 300 the free surface was 12 across
     with 2-3 A of thermal roughness, and no measurement of its shape
     meant anything. 900 is the smallest count where a surface is one.

     COHESION HAD THE WRONG SHAPE, and finding it started from noticing the
     water moved too much. The dispersion term was STRONGEST exactly at the
     rest length and fell away outward, so a pair sitting at its own equilibrium
     was pulled inward as hard as the term could pull while contact pushed it
     back out. Force at a potential's minimum is zero; this one was at its
     maximum. Every touching pair was in that tug of war. Corrected — rising
     from nothing at contact, peaking midway, back to nothing at the cutoff —
     the bulk quietens from 0.79 A a step to 0.55 and the molecules thrown clear
     of the surface go from 7 to 4, at the same K_COH.

     It does not overturn what follows, though, and that is the honest reading:
     matched for structure rather than for K_COH, the corrected curve is just as
     agitated. What the liquid does still tracks how hard it is held.

     THE CLIMB IS CURRENTLY DRIVEN BY AGITATION, NOT BY WETTING, and that is
     the most important thing known about this bench. Four independent ways of
     calming the liquid were tried, at the correct spacing, and every one of
     them stopped the column dead while it was still 30 A short of where the
     agitated run takes it:

       feed the constraint's correction back into velocity   no climb
       stop the closing approach at contact (inelastic)      no climb
       couple the thermostat harder (DAMP 0.93 -> 0.85)      no climb
       cap the speed at 0.5-1.0 A a step                     no climb

     Each of those is the textbook-correct treatment of its own term, and each
     leaves the same state behind: 8.6 neighbours inside 3.4 A, bulk speed
     0.02-0.5, bonds up at 2.9. That is not a calm liquid, it is a SOLID. This
     model has no liquid phase in between — it is either being shaken hard
     enough to flow or it is frozen — and the rise on screen is the shaking.

     Which traces back to the same root as everything else here: nothing sets a
     temperature. The thermostat is a floor under the slowest molecules
     (V_THERM 0.05 against a bulk that runs at 0.75), the energy actually
     stirring the liquid comes from the constraint and the forces, and there is
     no window where the water is warm enough to flow and cool enough to stay
     put. Fixing it means the pressure drive and the incompressibility being the
     same solver rather than two terms fighting, which is a different force
     model, not another constant.

     WATCHING THE FLOW COSTS THE CURVE. Evaporation flattens the
     meniscus: ~10 A static, and 0-2 A once it is running, at every rate
     tried that still makes the flow watchable. The surface being drawn
     down by flux is real. This flux is not — it is orders above a
     leaf's, set so the flow is watchable — so the flat surface under
     Evaporate is an artefact of that choice, not a result. Watch the
     curve with it OFF and the flow with it ON; this bench cannot
     currently show both at once, and that is the honest state of it.
     =================================================================== -->

<div id="stage"><canvas id="gl"></canvas></div>

<!-- The bench's knobs. Everything here is a physics constant except Speed,
     which is how many steps are taken per drawn frame. -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../lib/palette.js"></script>
<script src="../lib/tokens-from-palette.js"></script>
<script src="../lib/molecules.js"></script>
<script src="../lib/skel.js"></script>
<script src="../lib/mol-monomers.js"></script>
<script src="../lib/mol-pathways.js"></script>
<script src="../lib/mol-sugars.js"></script>
<script src="../lib/mol-contrast.js"></script>
<script src="../lib/mol-small.js"></script>
<script src="../lib/scene.js"></script>
<script src="../chain/frame.js"></script>
<script src="../lib/chain-repeat.js"></script>
<script src="../lib/annotate.js"></script>
<script>
"use strict";

/* ============================================================= *
 *  Scale. One number, and every distance below is a real one.
 * ============================================================= */
const A = MolLib.SCALE;              // scene units per angstrom (family B)
const nm = n => n*10*A;              // nanometres, for the pore itself
const P  = MolLib.PALETTE;

/* ---- the pore, in real numbers ----
 *  Cell-wall pores run about 2-10 nm. 3.5 nm is in that range and is the
 *  width at which a column tall enough to have a meniscus still fits the
 *  molecule budget: water is 33.4 molecules per cubic nm, so the slot's
 *  volume IS the count, and a 5 nm slot at this depth would be a puddle
 *  rather than a column.
 */
const GAP   = nm(3.5);               // wall face to wall face
/* The slab is DEEP for a reason that is not chemistry. The water starts as a
   pool at the bottom of a dry pore and has to climb, so it needs to be short
   against a tall wall — and a pool's height is its molecule count divided by
   its cross-section. Widening the pore is not available (3.5 nm is the claim),
   so the depth carries it: at this thickness 900 molecules stand about 50 A
   deep in a pore 125 A tall, and there is somewhere to climb to. */
const DEPTH = nm(1.5);
const FLOOR_MARGIN = 4.0*A;          // the pool's base, above the wall's bottom edge

/* ---- water, from real distances ----
 *  Every one of these is a measured number scaled once. WaterSim.md 4: the
 *  steric floor sits BELOW the H-bond equilibrium, so a bonded pair rests
 *  where the bond wants it rather than in a fight between two forces.
 */
const OO_EQ   = 2.76*A;              // liquid water O...O, the H-bond rest length
/* CONTACT IS THE EQUILIBRIUM DISTANCE, not a little inside it. At 2.70 there
   was a dead band: cohesion switched on only beyond 2.76, repulsion only below
   2.70, and nothing at all in between — so a pair could sit anywhere in that gap
   and the liquid drifted to the bottom of it. Contact at 2.76 removes the gap
   and puts the floor where water's own pair minimum is. */
let OO_MIN  = 2.76*A;              // hard contact; below this they push apart
const HB_MAX  = 2.45*A;              // H...O reach for a bond to register
const HB_LIN  = 0.55;                // O-H...O has to be near enough to straight
const COH_MAX = 6.20*A;              // how far the weak, undirected pull reaches

/* A liquid is not held together by H-bonds alone. Dispersion pulls on every
   neighbour whatever way it is turned, and without it a box of molecules whose
   only attraction is a near-linear O-H...O simply never condenses: each one
   waits for a partner to be aimed correctly and drifts apart in the meantime.
   So there is a weak undirected attraction out to ~6.2 A on top of the bond. */

/* ============================================================= *
 *  Stage
 * ============================================================= */
const canvas=document.getElementById('gl');
const {scene,camera,renderer,root,cam,applyCam,resize}=
  Stage.create(canvas,{cam:{theta:0, phi:Math.PI/2, r:nm(19)}, rMax:nm(60)});

/* ============================================================= *
 *  THE WALLS — cellulose, repeated from the checked linkage
 * ============================================================= */
const V3=(p)=>new THREE.Vector3(p[0],p[1],p[2]);
const cello=MolLib.MOLECULES.cellobiose;
const screw=ChainRepeat.screwOf(cello, ['O5','C1','C4'], 'A','B');
const CHAIN_N=18;                                   // residues; ~5.2 A each, ~94 A of wall
const chain=ChainRepeat.extend(cello, screw, CHAIN_N, 'A');

/* The chain comes out along the screw's own axis, wherever that points. Turn
   it so the axis runs up the page (the pore's long direction) and the ribbon's
   flat face looks into the pore. Both are proper rotations — a reflection here
   would hand back L-glucose. */
const qAxis=new THREE.Quaternion().setFromUnitVectors(
  new THREE.Vector3(screw.axis[0],screw.axis[1],screw.axis[2]).normalize(),
  new THREE.Vector3(0,1,0));
const chainPts=[];
chain.residues.forEach(res=>res.forEach(p=>chainPts.push(V3(p).applyQuaternion(qAxis))));

/* The ribbon's flat face: of the two directions across the chain, the one it
   is thinnest in is the face normal. Measured, not assumed — the spec's own
   torsions decide which way the ribbon lies. */
const mid=new THREE.Vector3();
chainPts.forEach(p=>mid.add(p)); mid.multiplyScalar(1/chainPts.length);
let bestAng=0, bestSpread=Infinity;
for(let k=0;k<180;k++){
  const th=k*Math.PI/180, nx=Math.cos(th), nz=Math.sin(th);
  let s=0; for(const p of chainPts){ const d=(p.x-mid.x)*nx+(p.z-mid.z)*nz; s+=d*d; }
  if(s<bestSpread){ bestSpread=s; bestAng=th; }
}
// turn that thin direction onto +x, so the flat face points across the pore
const qFace=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), -bestAng);
chainPts.forEach(p=>p.applyQuaternion(qFace));

// re-centre, and find the face that will front the pore
const box=new THREE.Box3().setFromPoints(chainPts);
const c=box.getCenter(new THREE.Vector3());
chainPts.forEach(p=>p.sub(c));
const faceX=new THREE.Box3().setFromPoints(chainPts).max.x;   // the pore-facing extreme

/* One wall is this chain, stepped along z at cellulose Ibeta's own chain
   spacing; the other is the same wall turned half a turn about y. */
const CHAIN_SPACING=8.2*A;         // cellulose Ibeta b axis
/* Two chains, not three: the wall has to be as deep as the water slab and no
   deeper. A wall standing proud of the liquid on the near side reads as a gap
   between the two, and the first version of this bench looked non-wetting for
   that reason alone — perspective on a chain 8 A nearer the camera. */
const CHAINS=3;
const wallAtoms=[];                // {el, pos}
const wallBonds=[];                // [a,b] into wallAtoms
const wallOH=[];                   // {o, h} scene positions, the adhesion sites

const perRes=chain.names.length;
const iName=n=>chain.index(n);
const OH_PAIRS=[['O2','HO2'],['O3','HO3'],['O6','HO6']].map(([o,h])=>[iName(o),iName(h)])
  .filter(([o,h])=>o>=0&&h>=0);
const optH=new Set(chain.optH);

function buildWall(side){
  // side = -1 (left) or +1 (right). The right wall is a rotation, never a mirror.
  const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), side>0?Math.PI:0);
  for(let k=0;k<CHAINS;k++){
    const z=(k-(CHAINS-1)/2)*CHAIN_SPACING;
    const base=wallAtoms.length;
    for(let r=0;r<CHAIN_N;r++){
      for(let i=0;i<perRes;i++){
        if(optH.has(i)) continue;                    // C-H's hidden, as every page hides them
        const p=chainPts[r*perRes+i].clone().applyQuaternion(q);
        // slide the wall out so its pore-facing face sits exactly at the gap
        p.x += side*(GAP/2 + faceX);
        p.z += z;
        wallAtoms.push({el:chain.el[i], pos:p});
      }
      const off=base+r*(perRes-optH.size);
      // bonds are per-residue and in residue-local numbering; skip any that
      // touch a hidden hydrogen, the same contract Stage.setOptionalH keeps
      const keep=[]; for(let i=0;i<perRes;i++) if(!optH.has(i)) keep.push(i);
      const localOf={}; keep.forEach((g,l)=>{ localOf[g]=l; });
      chain.bonds.forEach(([a,b])=>{
        if(optH.has(a)||optH.has(b)) return;
        wallBonds.push([off+localOf[a], off+localOf[b]]);
      });
      // this residue's free hydroxyls, as adhesion sites, if they face the pore
      OH_PAIRS.forEach(([oi,hi])=>{
        if(optH.has(oi)||optH.has(hi)) return;
        const o=wallAtoms[off+localOf[oi]].pos, h=wallAtoms[off+localOf[hi]].pos;
        // depth into the wall from its pore-facing plane; a hydroxyl further in
        // than a water molecule is wide can never be reached
        if(side*o.x - GAP/2 > 3.2*A) return;
        wallOH.push({o,h});
      });
    }
  }
}
buildWall(-1); buildWall(+1);

// the modelled region's lower edge, read off the wall rather than guessed
const FLOOR=Math.min(...wallAtoms.map(a=>a.pos.y))+FLOOR_MARGIN;

/* THE SURFACE, NOT A PLANE. A cellulose face is corrugated: the outermost atom
   of the ribbon sits 1-3 A proud of the hydroxyl oxygens behind it. Stopping
   the water at a flat plane through that outermost atom therefore holds every
   molecule just out of reach of the very groups it is supposed to bond to, and
   the wall reads as non-stick. So water is stopped by the ATOMS, at their own
   van der Waals radii, and can settle into the grooves between them.

   Only the atoms within a water's width of the face can ever be touched, and
   they are bucketed by height so a molecule tests a few dozen rather than all
   fifteen hundred. */
/* CONTACT radii, not van der Waals ones. A hydrogen bond is two atoms sitting
   INSIDE each other's van der Waals shells: water's O...O rests at 2.76 A while
   two vdW oxygens sum to 3.04. Give the wall's oxygens their full shell and the
   steric floor holds every water just too far out to bond, which is exactly the
   bug this replaced. So a wall oxygen stops water at the H-bond rest length, a
   hydroxyl hydrogen at the H...O it would form, and carbon — which bonds to
   nothing here — keeps its real vdW radius. */
const CONTACT={O:1.25*A, C:1.70*A, H:0.50*A};
const R_WATER=1.40*A;                       // the water O's radius in these sums
const BUCKET=3.0*A;   // finer than a water is wide, so a lookup returns few atoms
const surface=new Map();                    // side|bucket -> [{pos, r}]
wallAtoms.forEach(a=>{
  const side=Math.sign(a.pos.x);
  if(side*a.pos.x - GAP/2 > 4.5*A) return;  // deeper than this, nothing can reach it
  const key=side+'|'+Math.floor(a.pos.y/BUCKET);
  (surface.get(key)||surface.set(key,[]).get(key)).push({pos:a.pos, r:CONTACT[a.el]||1.5*A});
});
/* The hydroxyls, bucketed by height as well. Scanning all of them for every
   molecule near a wall was the cost the cell list uncovered: with a tall pore
   there are hundreds of sites and hundreds of near-wall molecules, and almost
   every pair is rejected on the first comparison. */
const ohBuckets=new Map();
function indexOH(){
  ohBuckets.clear();
  for(const site of wallOH){
    const key=Math.sign(site.o.x)+'|'+Math.floor(site.o.y/BUCKET);
    const l=ohBuckets.get(key); if(l) l.push(site); else ohBuckets.set(key,[site]);
  }
}
function ohNear(side,y){
  const b=Math.floor(y/BUCKET), out=[];
  for(let k=-1;k<=1;k++){ const l=ohBuckets.get(side+'|'+(b+k)); if(l) out.push(l); }
  return out;
}
function surfaceNear(side,y,span){
  const b=Math.floor(y/BUCKET), out=[];
  const n=span||1;
  for(let k=-n;k<=n;k++){ const l=surface.get(side+'|'+(b+k)); if(l) out.push(l); }
  return out;
}

/* ---- drawn as instances ----
 *  A wall is ~1500 spheres and as many sticks and it never moves, so it is one
 *  InstancedMesh per element plus one for the bonds rather than 3000 objects.
 */
const SPHERE=new THREE.SphereGeometry(1,12,8);   // 6 px across on screen; 16x12 was invisible detail
const STICK=new THREE.CylinderGeometry(1,1,1,8,1,true);
STICK.translate(0,0.5,0);            // origin at one end, so a bond is scale+aim

const VDW_DRAW={C:1.70, O:1.52, H:1.20};
function instancedSpheres(list, el){
  const pts=list.filter(a=>a.el===el);
  if(!pts.length) return null;
  const m=new THREE.InstancedMesh(SPHERE,
    new THREE.MeshLambertMaterial({color:P.atoms[el]||0x888888}), pts.length);
  /* Space-filling, at 0.9 of van der Waals. A cell wall is dense matter and a
     ball-and-stick one reads as a wire cage with gaps the water could swim
     through — which is the opposite of what a wall does. Slightly under the
     real shell so the corrugation between chains stays visible; colour, not
     size, is what separates wall from water here. */
  const r=(VDW_DRAW[el]||1.6)*0.9*A;
  const M=new THREE.Matrix4();
  pts.forEach((a,i)=>{ M.makeScale(r,r,r).setPosition(a.pos); m.setMatrixAt(i,M); });

const wallMeshes=['C','O','H'].map(el=>instancedSpheres(wallAtoms,el)).filter(Boolean);

const wallBondMesh=(function drawWallBonds(){
  const m=new THREE.InstancedMesh(STICK,
    new THREE.MeshLambertMaterial({color:P.bonds.covalent}), wallBonds.length);
  const M=new THREE.Matrix4(), q=new THREE.Quaternion(), up=new THREE.Vector3(0,1,0);
  const d=new THREE.Vector3(), s=new THREE.Vector3();

    const pa=wallAtoms[a].pos, pb=wallAtoms[b].pos;

/* ============================================================= *
 *  THE WATER
 * ============================================================= */
const wspec=MolLib.MOLECULES.water;             // family B, to scale
const OH=V3(wspec.atoms[1].pos), OH2=V3(wspec.atoms[2].pos);

/* A POOL, AND A SUPPLY BEHIND IT. This is the piece the bench was missing.
   A finite pool in a wetting pore cannot travel anywhere: its equilibrium is to
   spread itself into two thin films and stop, which is exactly what it did. A
   capillary rises because the tube stands in a BATH — as the front climbs, more
   water is drawn up behind it — and modelling the rest of the cell wall as an
   endless supply is not a cheat, it is what the rest of the cell wall is.

   So the bottom band is held at liquid density: whenever it thins, because the
   front above has drawn water out of it, another molecule arrives. Nothing
   pushes. The front climbs because the wall is dry, and the supply only keeps
   the base from emptying while it does. */
/* The pool at the foot of the pore. 420 and 350 settle to the same place — 520
   against 526 molecules after 1500 steps at bath 0.06, the same bond count,
   the middle within 2 A — because the supply refills the base either way and
   the steady state is the wall's business, not the seed's. 350 starts further
   from it, so more of the filling is something you watch happen. `let` so the
   console can try another. */
let N_START=300;
const N_MAX=1800;                      // enough to fill this pore, and a stop
const SUPPLY_BAND=8.0*A;               // the depth of base kept topped up
let N_WATER=N_MAX;                     // buffers are sized for the cap
const waters=[];                                 // {p, v, q, o, h:[2]}
const _v=new THREE.Vector3(), _u=new THREE.Vector3(), _w=new THREE.Vector3();

function makeWater(p){
  const w={ p:p.clone(), v:new THREE.Vector3(),
            q:new THREE.Quaternion().setFromEuler(new THREE.Euler(
              Math.random()*6.28, Math.random()*6.28, Math.random()*6.28)),
            o:new THREE.Vector3(), h:[new THREE.Vector3(), new THREE.Vector3()],
            hb:0 };
  waters.push(w); return w;
}
/* A POOL AT THE BOTTOM OF A DRY PORE. This is the initial condition the bench
   exists for: everything above the pool is bare cellulose, so the water has
   somewhere to go and whether it climbs is a result rather than a setup. An
   earlier version seeded the pore already full, which cannot show a climb for
   the same reason a full glass cannot show pouring.

   On a lattice at the liquid's own spacing, so nothing collapses or expands on
   the first frames and the only motion is the wetting. */
function seed(){
  waters.length=0;
  /* At contact, not inside it. The layers used to be stacked at 0.92 of this,
     which is 2.62 A against a 2.70 floor, so the pool was born with 445 pairs
     already overlapping and the first frames were the liquid shoving itself
     apart — visible as a bounce before anything else had happened. */
  const d=2.85*A;                                     // liquid spacing, near O...O
  const nx=Math.max(1,Math.floor((GAP-2*R_WATER)/d)), nz=Math.max(1,Math.floor(DEPTH/d));
  /* SEEDED WITH THE CURVE ALREADY IN IT. A flat-topped lattice has to grow its
     own meniscus, and at these settings that takes a couple of thousand steps —
     several seconds in which the page is showing a shape that is not its answer.
     The sites are ranked as though the wall were already pulling, so the pool
     arrives concave and the physics only has to relax it. This is an initial
     condition, not a result: turn adhesion down and the same run flattens it out
     again, which is the check that it was not drawn. */
  const CURVE=11*A;                                   // how much lower the middle starts
  const sites=[];
  for(let lay=0;lay<80;lay++) for(let c=0;c<nx;c++) for(let r=0;r<nz;r++){
    const x=(c-(nx-1)/2)*d, y=FLOOR+1.2*A+lay*OO_EQ, z=(r-(nz-1)/2)*d;
    const t=Math.abs(x)/(GAP/2);
    sites.push({x, y, z, rank:y-CURVE*t*t});
  }
  sites.sort((a,b)=>a.rank-b.rank);
  for(let i=0;i<N_START && i<sites.length;i++){
    const q=sites[i];
    makeWater(new THREE.Vector3(q.x+(Math.random()-0.5)*0.3*A,
                                q.y, q.z+(Math.random()-0.5)*0.3*A));
  }
}
seed();

// world positions of one water's atoms, from its own quaternion
function place(w){
  w.o.copy(w.p);
  w.h[0].copy(OH).applyQuaternion(w.q).add(w.p);
  w.h[1].copy(OH2).applyQuaternion(w.q).add(w.p);
}
waters.forEach(place);

/* THE WATER IS SPACE-FILLING AND THE WALL IS NOT, and that is the one place
   this page departs from the house radii on purpose. PALETTE.radii are
   ball-and-stick sizes, chosen so one molecule's sticks show; at a real liquid's
   spacing (O...O 2.76 A) spheres that size leave gaps you could drive a
   molecule through, and 300 of them read as a gas. These are near van der Waals
   instead (O 1.40 A against a real 1.52, H 0.95 against 1.20), which is how a
   liquid has to be drawn if its density is the claim. The wall stays
   ball-and-stick, so structure and bulk do not look like the same substance. */
const R_O=1.40*A, R_H=0.95*A;
const oMesh=new THREE.InstancedMesh(SPHERE,
  new THREE.MeshLambertMaterial({color:P.atoms.O}), N_WATER);
const hMesh=new THREE.InstancedMesh(SPHERE,
  new THREE.MeshLambertMaterial({color:P.atoms.H}), N_WATER*2);
root.add(oMesh,hMesh);

/* H-bonds, dashed, the convention WaterSim.md 1 sets. The same line is drawn
   for a bond to a wall hydroxyl: adhesion IS this bond, to a different partner,
   and drawing it differently would be inventing a second force. */
const hbGeo=new THREE.BufferGeometry();
const HB_MAX_LINES=N_WATER*4;
hbGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(HB_MAX_LINES*6),3));
const hbLines=new THREE.LineSegments(hbGeo,

hbLines.frustumCulled=false; root.add(hbLines);

/* ============================================================= *
 *  The physics. Same rules as the solvation engine, at real scale.
 * ============================================================= */
/* NO GRAVITY TERM. At 3.5 nm the capillary pressure is about 8e7 Pa and the
   gravitational pressure across the pore about 5e-5 Pa: twelve orders of
   magnitude, so weight is not a small effect here, it is no effect. A g that
   competes with wetting would have to be ~1e12 times Earth's, and the column it
   made would be a picture of a capillary tube in a dish rather than of a cell
   wall. What holds this liquid in place is the wall and its own cohesion, which
   is the whole claim, so nothing else may hold it. */
/* A THERMOSTAT, so the liquid has a temperature. Damping and jitter used to be
   two independent numbers, which is why neither did what its name said: drag

   temperature. Set separately, most pairs of them are no temperature at all,
   and a molecule that lost its neighbours simply stopped — 0.01 A a step
   against the liquid's 0.48 — because nothing was putting energy back.
   Every molecule now takes the same treatment, and that word is load-bearing.
   Thermostatting only the stragglers is a Maxwell demon: energy in where a
   molecule came off the liquid, out everywhere else through the drag, and the
   wall harvested the difference as a film running up it.

   molecule forgets its own velocity, not how thick the water is. */
let DAMP=0.93;
/* How long a molecule may stand alone in the channel before it is put back in

const VAP_DWELL=40;
let condensed=0;

   holds, and the setting is whichever keeps most of them. Swept on a settled
   pool, 1000 steps, bonds per molecule against a real 3.6:

       0.05  1.79-1.92   0.15   1.45          0.30  0.74

   the bonds and twice the speed, which is what the count is there to catch.

   apart, so at these force constants the temperature can be a floor under the
   slowest molecules and not much more. Say floor, not temperature. */
let V_THERM=0.05*A;
let V_MAX=0;                      // speed ceiling, 0 for none
/* A THERMOSTAT WITH AUTHORITY. The Langevin pair above sets a temperature only
   if the drag can carry off what the forces put in, and at DAMP 0.93 it cannot:

   step with a thermostat asking for 0.05, and K_COH ended up setting the
   temperature. Coupling the drag harder does hold a temperature — and freezes
   the flow with it, because drag cannot tell a molecule's share of the current
   from its share of the heat.

   what it shares with them is flow, what it has on top is thermal. Only the
   thermal part is rescaled, so a column moving as a body is untouched however
   hard the temperature is held. Standard Berendsen from there — one factor for
   the whole liquid, eased in over T_TAU, so the Maxwell spread survives instead
   of every molecule being pinned to the same speed.

   out. What that buys on screen is nothing: bulk speed is 0.55-0.62 either way,
   because what makes the water look busy is the flow share, not the thermal one.
   What it costs is a third of the intake and most of the climb: 508 molecules
   and +13 to +21 A at the wall with it off, 378 and -2 to +9 with it on, over
   four runs.

   and the thermal share falls to 0.208 against a 0.15 target, with the local
   flow at 0.027 — the thermostat holds easily and the liquid is calm. Turn the
   constraint on and it is 0.369 and cannot be held. The constraint IS the pump.
   And the constraint is what puts the spacing right, and the energy it pumps is
   what drives the climb, so the three cannot hold at once in a force model with
   a projection bolted on. That is the case for the pressure and the
   incompressibility being one solver, where the corrections ARE the flow. */
let T_SPEED=0.15*A;               // the thermal speed the liquid is held at
let T_TAU=0;                      // and how quickly it is pulled back to it; 0 is off
const pec=[];
function thermostat(){
  if(T_TAU<=0 || T_SPEED<=0) return;
  const n=waters.length;
  let sum=0, c=0;
  for(let i=0;i<n;i++){
    const w=waters[i];
    if(!w||w.gone) continue;
    const p=pec[i]||(pec[i]=new THREE.Vector3());

    sum+=p.length(); c++;

  if(!c) return;
  const mean=sum/c;
  if(mean<1e-9) return;
  const sc=1+T_TAU*(T_SPEED/mean-1);

    const w=waters[i];
    if(!w||w.gone) continue;
    w.v.addScaledVector(pec[i], sc-1);           // rescale only the thermal share
  }

/* TORQUE, because a bond that only pulls centres together cannot build a

   places pointing the wrong way, because nothing turned them: forces acted on
   centres and orientation was a random walk. A real H-bond ORIENTS both
   partners, and that is what lets a molecule satisfy four neighbours at once.

   Overdamped, like everything else here: a bond turns its partners toward
   alignment by a fraction each step rather than accumulating angular momentum
   nothing would carry.

   IT DID NOT RAISE THE BOND COUNT, and the reason is the useful part. Settled
   pool, 800 steps: no torque 1.97 bonds a molecule, 0.10 gives 1.92, 0.30 gives
   1.92, 0.60 with the thermal tumbling switched off entirely gives 2.05. All
   one number, against a real 3.6.

   The block is upstream. This liquid sits with 6 neighbours inside 3.4 A where
   real water has about 4.5, and its nearest neighbours are 2.44 A apart against
   2.76 — it is CLOSE-PACKED, not tetrahedral. A molecule with six neighbours
   crowding it cannot point two H's and two lone pairs at four of them, however
   well it is turned, so orientation was never what was short.

   is what will let a network form. The thing to fix is the density, and that is
   a steric floor being punched through rather than a constant being wrong:

   by accident. */
const K_ADHERE=0.075;             // the bond itself, directional
const K_ADHERE_LR=0.075;          // and the undirected pull from one hydroxyl
/* THE WALL AS A WALL, not as a bag of separate atoms. A single hydroxyl's pull
   dies inside about 6 A, so a liquid that once lets go of the surface can never
   feel it again and stays balled up in the middle of the pore — which is the
   waxed windshield, not a cell wall. A solid attracts by the SUM over everything
   behind the surface, and that sum falls off far more slowly than any one pair.
   This is that sum, as a smooth pull toward the face; the drawn dashes still
   come only from real H-bond geometry, so nothing is claimed that is not there. */
/* Set for IMBIBITION, now that there is a supply. Without one, a strong wall
   pull drained the pool into two films and stopped, so the setting had to be
   weak enough to keep the pool a body. Fed from below, that same strong pull is
   the whole point: the film runs up the dry wall, the liquid behind follows,
   and water is drawn in at the base to replace it. From a 420-molecule pool the
   front crosses the pore's 94 A in about 1500 steps and the count climbs past
   700 doing it. Turn it down toward 0.037 and the front creeps; turn it off and

let K_WET=0.020*A;              // per surface atom, summed; not per molecule

   without a reload. The contact angle lives in the ratio of the first two, and
   sweeping it is what this bench is for. */
const WET_REACH=11.0*A;

let hbCount=0, adCount=0;
const forces=[], torq=[];
const _t1=new THREE.Vector3(), _t2=new THREE.Vector3(), _t3=new THREE.Vector3(),
      _t4=new THREE.Vector3(), _t5=new THREE.Vector3();
const _lpA=new THREE.Vector3(), _lpB=new THREE.Vector3();
// the two lone-pair directions, from where the molecule is pointing now
function lonePairs(w,a,b){
  _t1.subVectors(w.h[0],w.o).normalize();
  _t2.subVectors(w.h[1],w.o).normalize();
  _t3.copy(_t1).add(_t2).normalize();            // the H-O-H bisector
  b.crossVectors(_t1,_t2).normalize();           // and the plane's normal

  b.multiplyScalar(LP_S).addScaledVector(_t3,-LP_C);

/* Turn `from` toward `to`, as a rotation vector added to this molecule's share.
   Axis and angle come out of the cross and dot, so a molecule being turned by
   two bonds at once gets the sum and lands between them, which is the
   compromise a real molecule in a network is making. */
function aim(i,from,to,k){
  _t4.crossVectors(from,to);

  torq[i].addScaledVector(_t4.multiplyScalar(1/sn), Math.atan2(sn, from.dot(to))*k);

/* A CELL LIST, because every pair is not worth asking about. Testing all 405k

   a lie: eight steps a frame ran at eight frames a second and simulated no more
   per second than one step a frame did. Molecules further apart than COH_MAX
   exert nothing, so bin them at that size and only ask about the 27 cells that
   can reach. The pairs actually tested drop to roughly a tenth. */
const CELL=COH_MAX;
const cells=new Map();
const cellKey=(x,y,z)=>((Math.floor(x/CELL)+512)*1024+(Math.floor(y/CELL)+512))*1024
                       +(Math.floor(z/CELL)+512);
const NBR_MAX=48;                                  // a water never has this many inside 6.2 A
const nbr=new Int16Array(N_WATER*NBR_MAX), nbrN=new Int16Array(N_WATER);
const accepted=new Uint8Array(N_WATER), bondedWith=new Int16Array(N_WATER);
/* ---- PRESSURE, which is what pair forces alone cannot give you ----
   A liquid held only by neighbour attraction will happily thin out and leave a
   void, so a wetting wall strips a film off it and the body never follows. Real
   filling works the other way round: the liquid is effectively incompressible,
   so a curved surface sets up a pressure difference and the whole column is
   dragged along behind it.

   So each molecule carries a local density and a pressure from it, the standard
   weakly-compressible form: P = K(rho - rho0), NEGATIVE when the liquid is
   stretched. That negative branch is the entire point — it is tension, the thing
   that holds a column of water together under pull, and it is what the earlier
   builds had no way to express. rho0 is measured off the seeded pool rather than
   typed, so it is whatever this liquid's own bulk density turns out to be. */
const dens=new Float32Array(N_WATER), press=new Float32Array(N_WATER);

/* Stiffness, and the window is narrow. Below ~0.1 nothing rises; at 0.34 the
   term outweighs every other force in the model and the liquid tears and jets
   out of the pore (H-bonds per molecule fall from 2.3 to 0.8, which is the
   number that catches it). Between those, at 0.22, the front climbs steadily
   and the liquid stays a liquid at about 1.9 bonds a molecule — lower than the
   2.6 it sits at unpressurised, because a column being drawn up IS under
   tension, and stretched water holds fewer bonds. */
let K_PRESS=0.22;                      // stiffness
const P_CLAMP=2.2;                     // no runaway tension when a region tears
/* THE BATH HAS A PRESSURE. A tube stands in a dish and the dish pushes: the
   liquid at the tube's foot is held at the reservoir's pressure whatever the
   column above it is doing. Without that the supply could only refuse to empty
   — it backfilled holes and never pushed — so the only pressure gradient in the
   model lived in the few layers around the front, and everything below was
   dragged along behind them. Held at the foot instead, the gradient runs the
   whole length of the column and the interior has a reason to move.
   Blended in over the band rather than switched on at its edge, because a step
   in pressure is a force no molecule should feel. */
let P_BATH=0.06;                       // the reservoir's pressure, at the floor
const HK=COH_MAX;                      // the kernel's reach, same as cohesion's
const wDens=d=>{ const t=1-d/HK; return t>0 ? t*t*t : 0; };

let stepNo=0;
function step(){
  stepNo++;
