<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molecule Sandbox — Building Proteins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="sandbox.css">
<style>
  :root{ --pep:#6a5acd; }

  /* reaction toast, top-center */
  #rxmsg{position:absolute;top:78px;left:50%;transform:translateX(-50%);
    z-index:12;pointer-events:none;text-align:center;max-width:70%;opacity:0;
    font-family:var(--font-hand);font-size:21px;color:var(--muted);letter-spacing:.2px}
  #rxmsg b{font-weight:600;color:var(--ink)}
  #rxmsg.show{animation:rxFade 4s ease-out forwards}
  @keyframes rxFade{
    0%{opacity:0;transform:translateX(-50%) translateY(-6px)}
    8%{opacity:1;transform:translateX(-50%) translateY(0)}
    82%{opacity:1;transform:translateX(-50%) translateY(0)}
    100%{opacity:0;transform:translateX(-50%) translateY(-4px)}}

  #stats b{color:var(--ink)}

  /* peptide (sequence) card, bottom-right */
  #seqcard{position:absolute;right:24px;bottom:24px;z-index:6;display:none;
    background:rgba(255,255,255,.62);border:2px solid var(--ink);border-radius:7px 11px 8px 10px;
    padding:11px 15px 12px;min-width:172px;box-shadow:0 4px 14px -6px rgba(0,0,0,.35);backdrop-filter:blur(2px)}
  #seqcard .pchead{font-family:var(--font-slab);font-weight:700;font-size:10px;letter-spacing:1.3px;
    text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  #libactions{flex-wrap:wrap}
  #htoggle{display:flex;align-items:center;gap:6px;font-size:13px;opacity:.75;cursor:pointer;flex-basis:100%}
  #seqcard .chain{display:flex;flex-wrap:wrap;align-items:center;gap:3px;font-family:var(--font-slab)}
  #seqcard .rescode{font-weight:700;font-size:15px;color:var(--ink);padding:2px 7px;border-radius:5px;
    background:rgba(106,90,205,.12)}
  #seqcard .rescode.fresh{animation:pcpop .9s ease}
  #seqcard .link{color:var(--pep);font-weight:700;font-size:15px}
  #seqcard .term{font-family:var(--font-slab);font-size:11px;color:var(--muted);font-weight:600}
  @keyframes pcpop{0%{background:rgba(255,214,120,.6)}100%{background:rgba(106,90,205,.12)}}

  /* ---------- right panel ---------- */
  #card{border-top:1.5px dashed var(--hair);padding-top:16px}
  #card .rxn{font-family:var(--font-slab);font-weight:700;color:var(--pep);font-size:15px}

  @media (max-width:880px){#app{grid-template-columns:1fr}#stage{grid-column:1}#side{grid-column:1}#side::before{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="rxmsg" aria-live="polite"></div>
    <div id="brand"><span class="drop"><i class="ph-bold ph-link-simple"></i></span><h1>Building Proteins</h1></div>
    <div id="seqcard"></div>
    <div id="stats"></div>
    <button id="savepng"><i class="ph-bold ph-download-simple"></i> PNG</button>
  </div>
  <div id="side">
    <h1 id="labtitle">Build a peptide</h1>
    <p id="labintro">Amino acids share a backbone — an <b>amino group</b> (–NH₂) and a
      <b>carboxyl group</b> (–COOH) — and differ only by their <b>side chain (R)</b>.
      Add them one at a time: each new residue joins by <b>dehydration synthesis</b>,
      losing a water as a <b>peptide bond</b> forms.</p>
    <div class="libgroup">Amino acids</div>
    <div id="library"></div>
    <div id="libactions">
      <button id="addmol">Add to chain</button>
      <button id="clearmol">Clear</button>
      <label id="htoggle"><input type="checkbox" id="showh"> show C–H hydrogens</label>
    </div>
    <div id="card"><div class="cardtext" id="cardtext"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="palette.js"></script>
<script src="molecules.js"></script>
<script src="mol-monomers.js"></script>
<script src="mol-small.js"></script>
<script src="scene.js"></script>
<script src="fx.js"></script>
<script>
"use strict";
/* =============================================================
 *  BUILDING PROTEINS — amino acids → peptide via dehydration synthesis
 *  Reuses molecules.js (residue specs + palette) and fx.js (reaction
 *  effects). Each residue stays its own group; condensation removes the
 *  leaving –OH / –H, spawns a water, and links residues with a peptide bond.
 *  This is the INVERSE of molecule-lab.html's CO2 + H2O (there water is
 *  consumed; here it's released) — the readout counts one water per bond.
 *
 *  Each residue stays a separate group, relinked every frame by a redrawn
 *  peptide stick rather than merged into one molecule — so a chain makes no
 *  claim about a single rigid conformation.
 *
 *  The side panel spells out the elements on purpose: every residue is C,
 *  H, O, N (S only in cysteine/methionine) — K+ is an intracellular
 *  electrolyte like the Na+/Cl+ elsewhere in the sandbox, never part of the
 *  backbone or a side chain, and students mix the two up.
 * ============================================================= */

/* ---------- shared stage (scene.js) + reaction fx (fx.js) ---------- */
const canvas=document.getElementById('gl');
let userSpun=false, userZoom=false;   // set once the user takes manual control
const {scene,camera,renderer,root,cam,applyCam,resize}=Stage.create(canvas,{
  cam:{theta:0,phi:1.2,r:16}, phiMin:0.35, phiMax:2.6, rMin:7, rMax:70,
  onDrag:()=>{userSpun=true;}, onZoom:()=>{userZoom=true;} });
const FXi=FX.create(THREE,root,camera);   // shared reaction effects

// palette handles + thin aliases onto the shared builder, so call sites below
// read the same as before. buildMolecule already tracks per-atom/bond meshes,
// which is what the condensation reaction needs to pull out the leaving group.
const state=MolLib.PALETTE.atoms, pepColor=MolLib.PALETTE.bonds.peptide;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const buildMol=Stage.buildMolecule, removeAtoms=Stage.removeAtoms, stick=Stage.bond;
const atomWorld=(g,i)=>g.userData.atomWorld(i);

/* ---------- amino-acid picker ---------- */
const AA_KEYS=['glycine','alanine','serine','cysteine'];
// swatch colour = a characteristic atom of the side chain
const AA_SWATCH={glycine:'H',alanine:'C',serine:'O',cysteine:'S'};
let selected='glycine';
const libraryEl=document.getElementById('library');
function hx(n){return '#'+n.toString(16).padStart(6,'0');}
function buildLibrary(){
  libraryEl.innerHTML='';
  AA_KEYS.forEach(k=>{
    const s=MolLib.MOLECULES[k];
    const row=document.createElement('div'); row.className='molrow'+(k===selected?' sel':'');
    row.innerHTML=`<span class="swatch" style="background:${hx(state[AA_SWATCH[k]])}"></span>`
      +`<span class="mname">${s.name}</span><span class="mform">${s.res} · R = ${s.side}</span>`;
    row.onclick=()=>{selected=k; buildLibrary(); refreshCard();};
    libraryEl.appendChild(row);
  });
}
const cardEl=document.getElementById('cardtext');
function refreshCard(){
  const s=MolLib.MOLECULES[selected];
  cardEl.innerHTML=`<h2>${s.name} <span style="color:var(--muted);font-weight:500">${s.res}</span></h2>`
    +`<p>Side chain <b>R = ${s.side}</b>. Backbone is the universal –NH₂ / –COOH.`
    +(selected==='cysteine'?` The <b>sulfur</b> in cysteine's –SH lets two cysteines later cross-link (disulfide bridges).`:'')
    +(selected==='serine'?` The –OH makes serine polar and a common phosphorylation site.`:'')
    +`</p><p class="rxn">–COOH + H₂N– → –CO–NH– + H₂O</p>`
    +`<p style="color:var(--muted);font-size:13px">Every join loses one water — that's <b>dehydration synthesis</b>. In a cell, amino groups (N) come from other amino acids; sulfur (S) comes in with cysteine/methionine. Potassium (K⁺) is vital in cells but is <b>not</b> built into amino acids.</p>`;
}

/* ---------- chain state + peptide-bond reaction ---------- */
const SPACING=8.8;            // residue-to-residue backbone pitch (peptide bond ≈2.6)
const chain=[];              // residue groups, N-terminus → C-terminus
let showH=false;             // nonpolar C–H visibility (spec.optH), user-toggled
const peptideBonds=[];       // {a,b} residue pairs linked by an amide bond
const debris=[];             // released water molecules drifting away
let rxShown=0;

const rxmsgEl=document.getElementById('rxmsg');
function flashMsg(html){ rxmsgEl.innerHTML=html; rxmsgEl.classList.remove('show');
  void rxmsgEl.offsetWidth; rxmsgEl.classList.add('show'); }

function targetX(i){ return i*SPACING-(chain.length-1)*SPACING/2; }   // keep chain centred

function addResidue(key){
  const g=buildMol(MolLib.MOLECULES[key]);
  g.userData.key=key; g.userData.res=MolLib.MOLECULES[key].res;
  const i=chain.length;
  // enter from the right + above, then drift to its slot (lerped in loop)
  g.position.set(targetX(i)+7,5,0);
  g.userData.tx=targetX(i);
  Stage.setOptionalH(g,showH);        // honour the toggle for residues added later
  root.add(g); chain.push(g);
  if(chain.length>=2) condense(chain[chain.length-2],g);
  reflowTargets();
  refreshReadout();
}

// dehydration synthesis: prev's carboxyl + next's amino → peptide bond + water
function condense(prev,next){
  const pp=prev.userData.spec.pep, np=next.userData.spec.pep;
  // capture the leaving atoms' world positions BEFORE removing them (for the water)
  const oPos=atomWorld(prev,pp.oOH), hcPos=atomWorld(prev,pp.hOH), hnPos=atomWorld(next,np.hN[1]);
  removeAtoms(prev,[pp.oOH,pp.hOH]);   // –OH leaves the carboxyl
  removeAtoms(next,[np.hN[1]]);        // one –H leaves the amino group
  prev.userData.cUsed=true; next.userData.nUsed=true;
  peptideBonds.push({a:prev,b:next});
  // the released water, assembled from the very atoms that left, drifting off
  const mid=oPos.clone().add(hcPos).add(hnPos).multiplyScalar(1/3);
  spawnWater(mid);
  // effects: the bond forms — flash at the join, glow both residues
  const bondMid=atomWorld(prev,pp.cC).add(atomWorld(next,np.nN)).multiplyScalar(0.5);
  FXi.spawnRing(bondMid,pepColor);
  FXi.popGlow(prev,0xcfc6ff); FXi.popGlow(next,0xcfc6ff);
  if(rxShown++<2) flashMsg(`<b>Dehydration synthesis</b> — the –OH and an –H leave as <b>H₂O</b>; a <b>peptide bond</b> links the residues.`);
}

function spawnWater(pos){
  const w=buildMol(MolLib.MOLECULES.water);
  w.position.copy(pos); w.scale.setScalar(0.85);
  w.userData.vel=V((Math.random()-.2)*0.05,0.09+Math.random()*0.03,(Math.random()-.5)*0.05);
  w.userData.life=0; root.add(w); debris.push(w);
}

// peptide bonds are redrawn every frame from live world positions (residues are
// still easing into place, and the user can orbit) — cheap for a short chain
let pepSticks=[];
function redrawPeptideBonds(){
  pepSticks.forEach(s=>root.remove(s)); pepSticks=[];
  peptideBonds.forEach(({a,b})=>{
    const c=atomWorld(a,a.userData.spec.pep.cC), n=atomWorld(b,b.userData.spec.pep.nN);
    const s=stick(c,n,pepColor,0.17); pepSticks.push(s); root.add(s);   // world-space
  });
}

function reflowTargets(){ chain.forEach((g,i)=>g.userData.tx=targetX(i)); }

function clearChain(){
  chain.forEach(g=>root.remove(g)); chain.length=0;
  peptideBonds.length=0;
  pepSticks.forEach(s=>root.remove(s)); pepSticks=[];
  debris.forEach(w=>root.remove(w)); debris.length=0;
  refreshReadout();
}

document.getElementById('addmol').onclick=()=>addResidue(selected);
document.getElementById('clearmol').onclick=clearChain;
// The specs carry every real hydrogen (they come from PubChem 3D records), but
// the nonpolar C–H's are clutter for the peptide lesson, so they start hidden.
// Only visibility is flipped — the N–H and O–H that the reaction consumes are
// never in optH, so toggling can't interfere with a chain already built.
document.getElementById('showh').onchange=e=>{
  showH=e.target.checked; chain.forEach(g=>Stage.setOptionalH(g,showH)); };

/* ---------- readouts ---------- */
const statsEl=document.getElementById('stats'), seqEl=document.getElementById('seqcard');
let prevLen=0;
function refreshReadout(){
  const n=chain.length, bonds=Math.max(0,n-1);
  if(!n){ statsEl.innerHTML=''; seqEl.style.display='none'; prevLen=0; return; }
  statsEl.innerHTML=`<b>${n}</b> residue${n===1?'':'s'}<br>`
    +`<b>${bonds}</b> peptide bond${bonds===1?'':'s'}<br>`
    +`<b>${bonds}</b> water released`;
  // sequence card: N-term  Gly–Ala–Ser  C-term, last chip pops when it's new
  let h='<div class="pchead">Peptide chain</div><div class="chain"><span class="term">H₂N–</span>';
  chain.forEach((g,i)=>{
    if(i) h+='<span class="link">–</span>';
    const fresh=(i===n-1 && n>prevLen)?' fresh':'';
    h+=`<span class="rescode${fresh}">${g.userData.res}</span>`;
  });
  h+='<span class="term">–COOH</span></div>';
  seqEl.innerHTML=h; seqEl.style.display='block';
  prevLen=n;
}

/* ---------- main loop ---------- */
function loop(){
  // ease residues toward their (centred) slots
  chain.forEach(g=>{
    g.position.x+=(g.userData.tx-g.position.x)*0.12;
    g.position.y+=(0-g.position.y)*0.12;
    g.position.z+=(0-g.position.z)*0.12;
  });
  // released waters float up and fade, then are removed
  for(let i=debris.length-1;i>=0;i--){ const w=debris[i]; w.userData.life+=1/60;
    w.position.add(w.userData.vel); w.userData.vel.y+=0.0006;
    const op=Math.max(0,1-w.userData.life/2.2);
    w.traverse(o=>{if(o.isMesh&&o.material){o.material.transparent=true;o.material.opacity=op;}});
    if(w.userData.life>2.4){ root.remove(w); debris.splice(i,1); }
  }
  redrawPeptideBonds();
  // gentle idle spin until the user grabs it; auto-fit zoom to chain length
  // (unless the user has taken manual control of the wheel)
  if(!userSpun) cam.theta+=0.0016;
  if(!userZoom){ const fit=chain.length? 12+chain.length*3.1 : 16; cam.r+=(fit-cam.r)*0.05; }
  applyCam();
  FXi.step();
  renderer.render(scene,camera); requestAnimationFrame(loop);
}

buildLibrary(); refreshCard(); applyCam(); resize(); requestAnimationFrame(loop);

document.getElementById('savepng').onclick=()=>{
  renderer.render(scene,camera);
  const a=document.createElement('a'); a.download='peptide.png'; a.href=canvas.toDataURL('image/png'); a.click();
};
</script>
</body>
</html>
