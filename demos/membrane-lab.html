   to infer equilibrium from transits — the voltage holding still, then the
   signed and unsigned transit rates — and both failed for the same reason:
   at half a transit a second the statistics are far too thin. Simulated,
   every threshold that caught a real balance also fired on a one-way flow
   a quarter of the time, purely from Poisson luck in the gaps.

   The drives have no noise in them. Each ion's push is a number, and the
   membrane is at rest when the pushes cancel — weighted by how many ions
   of each kind there are, which is this page's stand-in for conductance
   and is why the balance point moves if the populations do. */
function netPush() {
  let nK = 0, nCl = 0;
  for (const t of travellers) {
    if (t.conducts == null) continue;
    if (t.kind === 'K') nK++; else if (t.kind === 'CL') nCl++;
  }
  const n = nK + nCl;
  return n ? (drive('K') * nK + drive('CL') * nCl) / n : 0;
}
/* COUNTED SEPARATELY, because they run opposite ways. One total with one
   arrow on it would be false whichever way the arrow pointed: this number
   is two currents, K⁺ leaving and Cl⁻ arriving, that happen to push the
   voltage the same way. */
const crossed = { K:0, CL:0 };
/* NERNST FROM THE LIVE COUNTS, on the resting step only.

   E_K is a constant on the channel step and that is fine there: it runs for
   a minute and the gradient it spends is the one it started with. Here the
   pump is actively rebuilding the gradient, so a fixed equilibrium would
   make the leak chase a target that never moves — the two would never
   balance, and the steady state the step exists to show could not happen.
   Reading it off the counts is both the honest version and the one that
   settles: as the pump restores K⁺ inside, E_K goes more negative and the
   leak strengthens; as the leak wins, E_K rises and the leak weakens. */
function nernst(kind) {
  let inside = 0, outside = 0;
  for (const t of travellers) {
    if (t.kind !== kind) continue;
    if (t.y >= 0) outside++; else inside++;
  }
  const z = kind === 'CL' ? -1 : 1;
  return (61 / z) * Math.log10((outside + 0.5) / (inside + 0.5));
}
const equilibriumOf = kind =>
  (STEPS[cur] && STEPS[cur].id === 'rest') ? nernst(kind)
  : kind === 'CL' ? E_CL : E_K;
/* How hard this ion is still being pushed — 0 at its own equilibrium. The
   pore is as open as it ever was; what has run out is the gradient. */
/* With the potential OFF the pore does not push at all: every hop is a
   coin flip, and the net flow comes from the CAPTURE RATE instead — the
   crowded side simply delivers more ions to the mouth. That is diffusion,
   emergent rather than scripted, and it is the same argument the osmosis
   step makes about water. It also ends correctly on its own: once the two
   sides hold equal numbers they deliver equally, and the net stops without
   anything being switched off. */
/* SIGNED. Positive means the gradient still wins and the ion runs the way
   it started; negative means the VOLTAGE has overshot this ion's own
   equilibrium and now drives it back the other way.

   It used to be clamped at zero, so every current was one-directional and
   the voltage could only ever fall — the run ended parked at E_K with both
   pores idle, which is not a resting cell. At −90 the membrane is already
   past chloride's −75, so the electrical force on Cl⁻ beats its
   concentration force and it flows back OUT, depolarising. Potassium pulls
   down, chloride pushes up, and the cell settles where the two currents
   cancel: between the two equilibria, nearer whichever ion moves more
   freely. That is the Goldman result, and it now EMERGES from the same
   coin-flip machinery instead of being imposed by a clamp. */
const drive = kind => !potentialOn() ? 0
  : (mV - equilibriumOf(kind)) / -equilibriumOf(kind);

/* `crowd` is the KNOCK-ON, and it has to be a big enough cut to see. It was
   0.35 against a 0.10–0.30 wait — a knocked-on ion waited 0.19 s on average
   against 0.20 s unpushed, so the mechanism the whole model is named after
   did nothing at all. At 0.06 the pushed ion leaves in roughly a fifth of
   the time, which is what the arrival of a second ion is FOR: two +1
   charges in one narrow file cannot both stay, and the leading one goes. */
const HOP = { wait:[0.10, 0.30], move:0.10, crowd:0.06 };
function tickQueue(t, dt) {
  if (Math.abs(t.y) > T.height) {
    /* Counted ONCE, leaving the far mouth: a completed transit is one
       charge moved across, and that is what the voltage is made of.
       Floored at the most negative equilibrium on stage rather than the
       crossing ion's own — clamping to the crosser's E would let a late
       Cl⁻ drag the voltage back up to −75 after potassium had taken it
       past, which is a current running backwards up its own gradient.
       Each ion stopping at its own equilibrium is drive()'s job. */
    /* SIGNED, AND BY WHICH SIDE IT CAME OUT — not by which way it happened
       to be pointing. A K⁺ leaving at the top took positive charge out of
       the cell (+1); the same ion coming back in at the bottom brought it
       back (−1). Cl⁻ is the mirror: arriving inside hyperpolarises (+1),
       leaving again undoes it. Reading the sign off the ion's own velocity
       made an ion captured on the outer face count as a hyperpolarising
       transit while it was doing the exact opposite. */
    /* COUNTED ALWAYS, APPLIED ONLY WHEN ASKED. Transits used to be counted
       only with the potential on, and enabling it reset the tally — so a
       scene where four K⁺ had visibly left read 0 mV, which is a flat
       contradiction: if charge crossed, there is a potential. The charge
       that moved is a fact about the scene, not about which switch is on.
       What the switch decides is whether that charge pushes back, which is
       drive()'s job and nothing to do with counting. */
    if (t.inPore) {
      const q = (t.kind === 'CL' ? -1 : 1) * Math.sign(t.y);
      chargeOut += q;
      crossed[t.kind] = (crossed[t.kind] || 0) + q;
      mV = Math.min(0, Math.max(Math.min(E_K, E_CL), MV_PER_ION * chargeOut));
    }
    /* RELEASED INTO THE SOLUTION. It is not a queue member any more — it
       swims off, and it can be captured again later, from either face. */
    t.inPore = false; t.hop = null; t.lane = null;
    /* In the simplified mode it goes back round: released on the far side
       it would sit there, its own source compartment would empty, and the
       one-way flow would run itself dry within a few seconds. Wrapping at
       the frame edge returns it upstream — the same recycling the very
       first version of this step used, and the reason it could run all
       day. With the potential on it stays put, because where the ions
       ACCUMULATE is the whole mechanism. */
    /* IT STAYS WHERE IT LANDS, in both modes. The simplified mode used to
       wrap a crossed ion back upstream so the flow could run all day —
       which taught that a gradient never runs out. It does: with the
       potential off this now settles at equal counts either side, and with
       it on it stops far earlier and LEAVES the gradient standing, which
       is the difference between the two modes and the reason a cell can
       spend one later. */
    t.bounded = true;
    /* LEAVES WITH SOMEWHERE TO GO. repick() draws an isotropic direction,
       so half of every arriving ion turned straight back at the pore it had
       just come out of — and the funnel dragged the other half back too.
       They piled up in the mouth.

       So it exits along the axis it was travelling, and is deaf to the
       funnel for a moment afterwards. Both are the same physical fact: an
       ion that has cleared the vestibule is out in the bulk, where the
       pore's attraction is one weak influence among many rather than the
       only thing acting on it. Re-entry still happens — that is how the
       two-way traffic at equilibrium works — it just does not happen on
       the frame it left. */
    if (t.walk) {
      repick(t);
      const sp = (t.speed || WALK_SPEED)[1];
      const away = Math.sign(t.y) || 1;
      t.vy = Math.abs(t.vy) * away + away * sp;         // pushed clear, outward
      /* Where it came out. It ignores the funnel until it is ESCAPE_R from
         here — see funnel(). */
      t.exitPt = { x:t.x, y:t.y, z:t.z };
    }
    return false;                                                 // out in the bulk
  }
  t.inPore = true;
  /* AT EQUILIBRIUM THE FILE KEEPS MOVING — it just stops getting anywhere.

     This used to freeze every ion where it stood, which left them parked
     inside the pore: a stopped ion in an open channel says the channel
     shut, and the tally beside it says "no NET flow". Both cannot be
     right, and the tally is the one that is.

     So the drive sets the ODDS, not the speed. Each hop picks a direction
     with p(forward) = ½ + ½·push: at full drive every hop goes forward, at
     equilibrium it is a coin flip, and net flux comes out proportional to
     driving force — which is the actual relationship, not a stand-in for
     it. A K⁺ at rest still enters and leaves the filter constantly; it
     simply leaves as often as it arrives. */
  const push = drive(t.kind);
  if (!t.hop) t.hop = { wait: rnd(HOP.wait[0], HOP.wait[1]), t:0, moving:false };
  const h = t.hop;
  h.t += dt;
  if (!h.moving) {
    if (h.t < h.wait) { t.obj.position.y = t.y; return true; }    // held at its site
    /* Its turn has come round, but the site ahead is occupied — so it
       waits, which is what a queue is. Nothing is displaced. */
    const gap = Math.max(ION_GAP, bulkRadius(t) * 2 + 1.2);
    if (queueAhead(t) < gap) { t.obj.position.y = t.y; return true; }
    h.moving = true; h.t = 0;
    /* STRAIGHT THROUGH when there is no voltage. With the potential off the
       net flow is carried entirely by the capture rate — the crowded side
       delivers more ions to the mouth — so a coin flip inside the filter
       contributes nothing to the mechanism and only makes the pore look
       like it cannot decide. In-pore direction bias earns its place only
       when a voltage is there to oppose the flow, which is exactly when it
       IS the mechanism. */
    if (!potentialOn()) {
      /* Simplified: it finishes the trip it started. */
      h.dir = Math.sign(t.vy);
    } else {
      /* THE BIAS IS THE SPECIES', NOT THE TRIP'S. This used to weight the
         coin toward the direction the ion happened to ENTER by — and since
         both faces admit, a K⁺ captured on the outside was then pushed
         further IN, depolarising, against the very gradient the voltage is
         supposed to express. The two directions balanced by capture rate
         and the run stalled around −42 mV with both ions still pushing.

         Electrochemistry does not care which door an ion used. K⁺ is
         driven OUT (+y) while the membrane sits above its equilibrium,
         Cl⁻ IN (−y) while it sits above its own, and either reverses once
         the voltage overshoots — which is the sign of `push`. */
      const pref = (t.kind === 'CL' ? -1 : 1) * (push >= 0 ? 1 : -1);
      const p = 0.5 + 0.5 * Math.min(1, Math.abs(push));
      h.dir = Math.random() < p ? pref : -pref;
    }
  }
  /* One site's worth of travel, taken fast — `step` is the file's spacing,
     so a hop lands where the ion ahead was standing. */
  const step = Math.max(ION_GAP, bulkRadius(t) * 2 + 1.2);
  /* One speed, whichever way it goes: a hop is a hop. What the drive
     changes is how often it goes forward, not how fast. */
  t.y += (h.dir || Math.sign(t.vy)) * (step / HOP.move) * dt;
  if (h.t >= HOP.move) {
    h.moving = false; h.t = 0;
    const behind = queueBehind(t);
    /* The wait does NOT stretch with the drive any more. It used to divide
       by push, which sent the wait to infinity at equilibrium — the freeze
       by another route, and the thing that left ions parked in the pore.
       Thermal hopping does not slow down as a gradient runs out; only the
       share of hops that go forward does. */
    h.wait = behind < step * 1.8 ? rnd(HOP.crowd * 0.6, HOP.crowd * 1.4)  // knocked on
                                 : rnd(HOP.wait[0], HOP.wait[1]);
  }
  t.obj.position.y = t.y;
  return true;
}
/* The gap to whatever is IN FRONT, along the direction of travel. A file
   keeps its spacing by waiting its turn, not by being shoved: keepApart()
   enforced spacing by moving ions bodily along y, which pushed the ones in
   front BACKWARDS — visible dithering in a pore whose ions were all
   supposed to be going one way, and occasionally an ion squeezed back out
   of the mouth it came in by. Only ~3.7 hydrated ions fit the lumen, so
   with the funnel delivering several at once that shoving was constant. */
function queueAhead(t) {
  let best = Infinity;
  for (const o of travellers) {
    if (o === t || o.lane !== t.lane) continue;
    const d = (o.y - t.y) * Math.sign(t.vy);      // >0 means o is ahead of t
    if (d > 0 && d < best) best = d;
  }
  return best;
}
function queueBehind(t) {
  let best = Infinity;
  for (const o of travellers) {
    if (o === t || o.lane !== t.lane) continue;
    const d = (t.y - o.y) * Math.sign(t.vy);      // >0 means o is behind t
    if (d > 0 && d < best) best = d;
  }
  return best;
}

/* ONE number for how fast water gets through the tails, used by every step
   that lets it through. It was 1.0 in osmosis and 0.5 at the channel — the
   same molecule crossing the same bilayer at two speeds, which is a claim
   about the membrane that changes when the tab does. */
const WATER_CORE = 1.0;

/* How fast a walker moves between re-picks, per species class. An ion is
   heavier than water and drags a hydration shell with it, so it is slower —
   and it needs to be visibly slower, because "the ion is stuck at the
   surface" is easier to read when the thing bouncing off is not the fastest
   object on screen.

   Raised for the isotropic walk: a direction drawn on the sphere puts only
   part of its speed along y — mean |cos| is ½ — so the numbers that gave a
   brisk vertical walk when vy WAS the speed would halve the crossing rate. */
const WALK_SPEED = [14, 24];       // water
const ION_SPEED  = [8, 16];

/* Ions in single file do not touch: all +1, so they repel, and in a real K⁺
   channel they queue with a water molecule between each pair — roughly this
   gap. It used to be enforced by keepApart(), a relaxation pass that moved
   positions; that is gone, because pushing a file apart shoves the ions in
   front BACKWARDS. Spacing in a pore is now an ion not hopping until the
   site ahead is free — the same rule stated as timing rather than as
   displacement, and it cannot send anyone the wrong way. See queueAhead().
   The gap a PAIR needs is computed from bulkRadius(), since a hydrated ion
   needs more room than the bare K⁺ this constant was measured off. */
const ION_GAP = 2 * Parts.ION.K.r * Parts.ION.exaggeration + 2.6;

/* One draw of a walker's velocity, used at spawn AND at every re-pick, so
   the first second of a step cannot be a different motion from the rest.
   Isotropic — a direction on the sphere, not a coin flip on the sign of vy,
   which made every molecule read as bobbing up and down in place. */
function repick(t) {
  const sp = t.speed || WALK_SPEED;
  const v = rnd(sp[0], sp[1]);
  const cz = rnd(-1, 1), sr = Math.sqrt(1 - cz * cz), ph = rnd(0, Math.PI * 2);
  t.vy = v * cz;
  t.vx = v * sr * Math.cos(ph);
  t.vz = v * sr * Math.sin(ph);
}

/* Sideways drift for the walkers, reflected inside its box. The box is the
   same one the spawn used, so a water can never wander somewhere it was not
   allowed to start — including a channel's column, which rndClear() keeps
   it out of (see CHANNEL_KEEPOUT). */
function lateral(t, dt) {
  /* `band` is [xmin, xmax]. Step 2 sorts the three species into columns so
     they stay tellable apart, and an unbounded drift would shuffle them
     back into the snowstorm that layout exists to avoid. */
  const x0 = t.band ? t.band[0] : -SPREAD, x1 = t.band ? t.band[1] : SPREAD;
  t.x += t.vx * dt; t.z += t.vz * dt;
  if (t.x > x1) { t.x = x1; t.vx = -t.vx; }
  if (t.x < x0) { t.x = x0; t.vx = -t.vx; }
  /* KEEPOUT IS ABSOLUTE, and only the WATER carries it now. Every ion
     approaches the pores — the conducting ones to go through, Na⁺ to be
     turned back at the filter — but water in the lumen would read as a
     third thing the channel passes, and that is step 3's lesson, not this
     one. */
  if (t.keepout && laneGap(t.x) < t.keepout) {
    /* Pushed back out of whichever lane it wandered into, on the side it
       came from — reflecting through the pore would teleport it across. */
    let near = PORES[0].x;
    for (const P of PORES)
      if (Math.abs(t.x - P.x) < Math.abs(t.x - near)) near = P.x;
    t.x = near + Math.sign(t.x - near || 1) * t.keepout;
    t.vx = -t.vx;
  }
  if (t.z >  11) { t.z =  11; t.vz = -t.vz; }
  if (t.z < -11) { t.z = -11; t.vz = -t.vz; }
  t.obj.position.x = t.x; t.obj.position.z = t.z;
}

/* Every traveller tumbles on its own axis at its own rate — see traveller().
   One shared spin made a screenful of water rotate in lockstep, which reads
   as a rendered pattern rather than a jostling crowd. */
function tumble(t, dt) {
  t.obj.rotation.x += dt * t.spin.x;
  t.obj.rotation.y += dt * t.spin.y;
  t.obj.rotation.z += dt * t.spin.z;
}

/* ---- the proteins are solid ----
   Nothing stopped a traveller entering a transporter's WALL. Bystanders are
   held off by `keepout`, but a conducting ion cannot have one — it has to
   reach the mouth — so the funnel walked K⁺ and Cl⁻ straight through the
   barrel, and an ion sat half-buried in the side of a channel.

   The exclusion is an annulus, not a disc: solid from the lumen out to the
   drawn wall, and OPEN down the middle, because the middle is the pore.
   Radii come from the same constants the transporters are built from, so a
   lobe retune cannot leave this behind — and the lobes are ignored on
   purpose, since pushing an ion out to the widest point of a rippled wall
   is the safe direction to be wrong in.

   The vestibule is exempt near the mouths, and only for the species that
   pore admits: that is the one place an ion is meant to be inside the
   protein's outline without being in the file yet. */
/* WHICH PROTEINS ARE ON STAGE. This was a fixed pair at ±LANE, which is
   only true of the channel step — so on the pump step nothing was solid and
   nothing was kept out: ions walked through the barrel's sides and water
   sailed down the middle of a pump that does not pass water at all. The
   list now follows whatever is standing there. */
const PORES_CHAN = [
  { x:-LANE, R:K_R,  lumen:8.8, kind:'K'  },
  { x: LANE, R:CL_R, lumen:8.0, kind:'CL' },
];
const PORES_REST = [
  { x:-REST_LANE,   R:K_R  * REST_SCALE, lumen:8.8 * REST_SCALE, kind:'K' },
  { x: REST_PUMP_X, R:14.5 * REST_SCALE, lumen:7.6 * REST_SCALE, kind:null },
];
const PORES_PUMP = [
  /* The pump's own barrel: membrane/parts.js's defaults, and a mouth rather than a
     site for the lumen — the site is the narrowest point and would let an
     ion sit in the funnel wall. */
  { x:0, R:14.5, lumen:7.6, kind:null },
];
let PORES = PORES_CHAN;
/* THE BARREL IS DOMED, NOT A CYLINDER — the same profile membrane/parts.js
   draws, copied because the page cannot ask the mesh. Treating it as a
   full-height cylinder was what stranded ions on the shoulders: an ion
   coming down to a mouth has to cross the protein's top, and a cylinder put
   a solid wall there, so the funnel pulled it in and this pushed it out and
   it orbited the corner. The real shape gets out of the way — radius falls
   to zero at the pole over the top 30% — which is exactly where the mouth
   is, and why an approach works at all.

   Cl⁻ suffered most: a wider ion against a narrower lumen (8.0 against
   8.8), so its way in was the smallest target on stage. */
function poreRadiusAt(P, y) {
  const H = T.height, u = Math.abs(y) / H, cap = 0.30;
  let sc = 1;
  if (u > 1 - cap) {
    const k = (u - (1 - cap)) / cap;           // 0 at the shoulder, 1 at the pole
    sc = Math.sqrt(Math.max(0, 1 - k * k));
  }
  const waist = 1 - 0.07 * Math.exp(-((y / (HALF * 0.8)) ** 2));
  return P.R * sc * waist;
}

function keepOutOfPores(t) {
  if (t.lane != null || t.aboard) return;      // in the file, or riding: it belongs there
  /* THE ION HAS A RADIUS. Testing its centre against the wall let a sphere
     sit half-buried with its middle legally outside — and a hydrated one is
     seven units across, so most of what the student saw was inside the
     barrel. Every bound below is the wall PLUS the ion, which is also why
     the vertical test uses it: a big ion just above the protein's end can
     still dip into the top of it. */
  const rad = bulkRadius(t);
  if (Math.abs(t.y) >= T.height + rad) return; // clear of the protein entirely
  for (const P of PORES) {
    const dx = t.x - P.x, dz = t.z;
    const r = Math.hypot(dx, dz);
    const wall = poreRadiusAt(P, t.y) + rad;
    if (r >= wall) continue;                   // outside the wall
    /* Down the throat of its OWN pore, at a mouth — leave it alone, it is
       on its way in. */
    /* On its way down its own throat. The test is against the LUMEN plus
       the ion rather than minus it: an ion centred in the mouth is in the
       mouth, and demanding it clear the rim by a whole radius meant the
       only legal approach was a bullseye the funnel could rarely hit. */
    if (r <= P.lumen + rad && t.conducts === P.x &&
        Math.abs(t.y) > T.height * 0.6) continue;
    const push = r > 0.001 ? wall / r : 1;
    t.x = P.x + dx * push;
    t.z = dz * push;
    if (r <= 0.001) t.x = P.x + wall;         // dead on the axis: pick a side
    t.obj.position.x = t.x; t.obj.position.z = t.z;
    /* Turned away from the wall, so it does not grind along it. */
    t.vx = Math.abs(t.vx) * Math.sign(t.x - P.x || 1);
  }
}

/* HYDRATED IONS DO NOT INTERPENETRATE. A shell is 6 A of water and two of
   them overlapping is not a crowd, it is one blob with a sign in it — and
   at this step the shells ARE the argument, so a pair that has merged
   quietly deletes the thing the student is being asked to look at.

   Positions only: a spacing rule, not a force. Radii come
   from bulkRadius(), so an ion that has just shed at the mouth immediately
   needs less room, which is exactly right — a stripped ion IS smaller, and
   that is why it fits. */
/* An ion on final approach is EXEMPT. The funnel aims every candidate at
   one point and this pass shoves them apart again; at the mouth the two
   forces cancelled and the ions balled up into a knot that never entered
   and never left. Inside the vestibule, single file is the correct answer
   anyway — that is what a filter is — and queueAhead() owns spacing there. */
function atMouth(t) {
  return t.conducts != null &&
         Math.hypot(t.x - t.conducts, t.z) < CAPTURE_R * 2 &&
         Math.abs(t.y) < T.height * 1.4;
}
function keepClear(list) {
  for (let pass = 0; pass < 2; pass++)
    for (let i = 0; i < list.length; i++)
      for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j];
        if (atMouth(a) || atMouth(b)) continue;
        const ra = bulkRadius(a), rb = bulkRadius(b);
        const min = ra + rb;
        let dx = b.obj.position.x - a.obj.position.x;
        let dy = b.y - a.y;
        let dz = b.obj.position.z - a.obj.position.z;
        const d2 = dx*dx + dy*dy + dz*dz;
        if (d2 >= min * min || d2 < 1e-6) continue;
        /* A QUEUED ION IS NOT SHOVED OFF ITS LANE — it is in single file
           down a pore, and sideways is the wall. So the free partner takes
           the whole correction; two free ions split it; two queued ions are
           left to the file's own waiting rule, which knows about lanes. */
        const aFree = a.lane == null, bFree = b.lane == null;
        if (!aFree && !bFree) continue;
        const share = (aFree && bFree) ? 0.5 : 1;
        const d = Math.sqrt(d2), push = (min - d) * share / d;
        dx *= push; dy *= push; dz *= push;
        if (aFree) { a.x -= dx; a.y -= dy; a.z -= dz;
                     a.obj.position.set(a.x, a.y, a.z); }
        if (bFree) { b.x += dx; b.y += dy; b.z += dz;
                     b.obj.position.set(b.x, b.y, b.z); }
      }
}

/* The scripted Na⁺ visit that lived here is gone, and its job is done
   properly now: refuseAt() turns a sodium back at the filter after it finds
   the mouth by the same funnel every other ion uses. The old version drove
   the ion along a path while everything around it walked, which read as
   traffic being interrupted rather than as an ion failing a test. */

/* Where a traveller is allowed to be. The bilayer's interior is oily: a
   charged or strongly polar thing does not enter it, and this is the one
   rule that makes step 2 a demonstration instead of a caption. */
function advance(t, dt) {
  if (t.conducts != null || t.seeks) { funnel(t, dt); tryCapture(t); }
  if (t.lane != null && tickQueue(t, dt)) return;   // hopping through the filter
  const inCore = Math.abs(t.y) < HALF;
  if (t.blocked) {
    /* Bounces off the head-group layer. Turned back AT the surface, not
       inside it — an ion that penetrates and returns has already told the
       student the interior is negotiable. */
    const edge = HALF + 2.4;
    if ((t.vy < 0 && t.y <= edge && t.y > 0) || (t.vy > 0 && t.y >= -edge && t.y < 0)) t.vy = -t.vy;
  }
  /* A walker re-picks its direction every so often. Nothing in here reads
     the concentration or knows where the solute is — which is the point,
     and is diffusion.js's point too: a crowd spreads out because there are
     more molecules on the crowded side to wander off it, not because
     anything is pulled. */
  if (t.walk && !inCore) {
    /* Re-picks direction only OUTSIDE the bilayer. Inside, it commits.

       Not a fudge — it is what makes the model work at all, and it is
       physically the right shape: the tails are 30 Å of oil, and a molecule
       part-way in has nothing to collide with that would turn it around.
       Letting it flip mid-membrane made a crossing need ~9 s of sustained
       travel against a 0.35 s flip, so in 30 s of running the counters read
       0-3 and the two sides never changed. The step showed nothing. */
    t.since = (t.since || 0) + dt;
    if (t.since > t.flipEvery) {
      t.since = 0;
      t.flipEvery = rnd(0.55, 1.15);
      /* AN ISOTROPIC DIRECTION, not a coin flip on the sign of vy.

         It used to set vy = ±speed and give x and z a small cosmetic kick,
         which meant the only real motion was along one axis and the sign
         reversed on about every other re-pick — so a molecule read as
         bobbing up and down in place rather than wandering. That is the
         model showing through: a real walker picks a direction on a
         SPHERE, and a reversal is one outcome among many.

         Uniform on the sphere via the z-slice method — cos(theta) uniform
         in [-1,1]. Picking two angles uniformly instead crowds the poles,
         which here would mean biasing every molecule toward straight up
         and straight down: the exact artefact this replaces. */
      repick(t);
    }
  }

  if (t.walk) lateral(t, dt);

  t.y += t.vy * dt * (inCore && !t.blocked ? t.coreSpeed || 1 : 1);

  if (t.bounded) {
    /* `yband` is [lo, hi] — a traveller that belongs to part of a
       compartment rather than all of it. The anions use it to stay deep in
       the cytosol instead of drifting up against the membrane. */
    const far = OFFSCREEN;
    const lo = t.yband ? t.yband[0] : -far, hi = t.yband ? t.yband[1] : far;
    if (t.y > hi) { t.y = hi; t.vy = -Math.abs(t.vy); }
    if (t.y < lo) { t.y = lo; t.vy =  Math.abs(t.vy); }
    t.obj.position.y = t.y;
    tumble(t, dt);
    return;
  }

  /* No separate box for `blocked` any more: it implies `bounded`, so the
     branch above already reflected it at the frame, and its own ±44 box was
     unreachable for every traveller except one spawn that forgot the flag.
     What kept solute in its compartment was never that box — it is the
     head-group bounce at the top of this function. */

  /* Anything that CAN cross wraps rather than being deleted: a traveller
     that vanishes at the edge reads as being consumed, and nothing here
     consumes anything. */
  if (t.y >  OFFSCREEN) t.y = -OFFSCREEN;
  if (t.y < -OFFSCREEN) t.y =  OFFSCREEN;
  t.obj.position.y = t.y;
  tumble(t, dt);
}

/* ---------------------------------------------------------------------
   The steps.
   --------------------------------------------------------------------- */
let crossings = { up:0, down:0 };
/* RECENT net, not lifetime. crossings.up/down are running totals and they
   never come back down, so once the walk built a lead the arrow froze at
   "net 41 out" and went on saying water was leaving long after the two
   sides had evened up — contradicting the tally right beside it, which was
   the one telling the truth.

   This is the same crossings, leaked away over a time constant: every
   crossing adds ±1 and the whole thing decays, so it grows while the
   imbalance is real and fades to nothing once each direction is landing as
   often as the other. That is what equilibrium IS — not a flow that
   switched off, but two equal flows — and it is why the arrow has to be
   able to disappear on its own. */
let netRecent = 0;
const NET_HALFLIFE = 30;                // seconds for a crossing to count half

const STEPS = [
  {
    id:'bilayer',
    tab:'the bilayer',
    cap:'<b>The inside of a membrane is oil.</b>',
    enter() {
      clearTravellers();
      showProtein(null); showMembrane('solid'); setCut(false);
      /* Water on both sides, so "heads face the water" is something on
         screen rather than a word in the caption.

         It walks and it CROSSES, exactly as water does in every other step.
         Two earlier versions were both wrong: vy:0 left the one step where
         water is the subject as the one step it did not move, and blocking
         it said water cannot get through a bilayer — which is false, and
         which step 3 then spends its whole run contradicting. A student
         who learns "the membrane stops water" here has to unlearn it two
         tabs later, and that is worse than a slightly busier picture. */
      let firstW = null;
      for (let i = 0; i < 64; i++) {
        const t = traveller('water', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11),
                             y:inCompartment(i % 2 ? 1 : -1),
                             walk:true, bounded:true, coreSpeed:WATER_CORE });
        if (!i) firstW = t;
      }
      /* Three callouts on a sheet with no protein in it: the two halves of
         a lipid, and the water they are answering to. */
      noteAt(-96, HALF, 'heads', [-34, -30],
             'The head carries charge and sits happily in water, so it turns ' +
             'outward on both faces. That is why a bilayer assembles itself ' +
             'and then holds together.');
      noteAt(-96, 0, 'tails', [-34, 26],
             'The tails are hydrocarbon and will not mix with water, so they ' +
             'hide in the middle. Everything crossing this membrane has to ' +
             'get through that oil.');
      noteOn(firstW, 'water, both sides', [34, -30],
             'Water is out here and in there, and it does cross. ' +
             'A membrane is a barrier, not a wall.');
    },
  },

  {
    id:'through',
    tab:'what gets through',
    cap:'<b>Oily things cross. Charged things do not. Size is not the rule.</b>',
    enter() {
      clearTravellers();
      showProtein(null); showMembrane('solid'); setCut(false);
      /* The two GASES split the width down the middle — O₂ left, CO₂
         right — so the crossings stay tellable apart without leaving dead
         space. Two streams shuffled together is a snowstorm, not a
         comparison; two streams crowded into the left two-thirds is a
         layout the student reads as meaning something. Na⁺ is not banded: it is the one species that does
         NOT cross, and penning it in a column made that look like a
         property of that column rather than of the membrane. Spread the
         full width, the flat sheet of ions stopped at the heads IS the
         claim, and it reads at a glance. */
      let firstO2 = null, firstCO2 = null, firstNa = null;
      for (let i = 0; i < 20; i++) {
        const t = traveller('o2', { x:rnd(-SPREAD, -SPREAD*0.04), z:rnd(-10,10),
                                    y:rnd(-farY(), farY()), vy:rnd(6,10) });
        if (!i) firstO2 = t;
      }
      for (let i = 0; i < 16; i++) {
        const t = traveller('co2', { x:rnd(SPREAD*0.04, SPREAD), z:rnd(-10,10),
                                     y:rnd(-farY(), farY()), vy:-rnd(6,10) });

      for (let i = 0; i < 22; i++) {

      for (let i = 0; i < IONS / 2; i++) {

/* ATP IS NOT AN OBJECT ON STAGE. It was drawn as a body with three beads
   and it did not make sense: at this scale the shape says nothing a
   student can read, and a lilac blob beside a blue protein invites "what
   is that molecule" — a question this step then has to answer instead of
   teaching the pump.

   What matters is the transaction, not the shape, and the student now
   performs it: a chip flies from the Spend button to the pump. */
/* ---- the pump's cargo is REAL IONS ----
   It used to come from a pool of its own: three sodiums faded up at a mouth,
   rode the cycle, faded out. Nothing left one compartment and nothing
   arrived in the other, so "3 Na⁺ out, 2 K⁺ in" was an animation rather
   than a result — and the census in the corner never moved, which meant the
   step could not show the thing it exists to show.

   Now a spend RECRUITS travellers out of the solution: the three nearest
   sodiums on the inside and the two nearest potassiums on the outside. They
   are the same objects the rest of the page walks around, so when they are
   set down on the far side the counts change, the gradient grows, and the
   voltage follows. The pump visibly builds what the channel step spent.

   membrane/pump.js still owns the choreography — this only decides WHICH
   ions ride it. Nothing here can make the pump open at both ends. */
let pumpT = 0, running = false, atpSpent = 0;
/* THE PUMP RUNS ITSELF at rest, because a resting cell's does. The pump step
   keeps its one-turn-per-press rule — there the transaction is the lesson —
   but here the lesson is the standing cost, and a cost you have to click for
   is not a standing cost. The switch is what makes it visible: turn it off
   and watch the gradient come apart. */
let pumpOn = true;
const cargo = { NA: [], K: [] };
const PUMP_LOAD = { NA:-1, K:1 };       // the side each is picked up from

/* Nearest to the pump's axis, on the required side, not already aboard. */
function recruit(kind, n) {
  const side = PUMP_LOAD[kind];
  const pool = travellers
    .filter(t => t.kind === kind && !t.aboard && Math.sign(t.y) === side)
    .sort((a, b) => ((a.x - pumpX) ** 2 + a.y * a.y) -
                    ((b.x - pumpX) ** 2 + b.y * b.y));
  /* ALL OR NOTHING. It used to mark every ion it found as aboard and hand
     back a short list, and the resting step calls this every frame until it
     gets three — so a cell with two sodiums left inside had those two flagged
     as cargo, discarded by the caller, and then stranded: aboard ions are not
     advanced, so they froze in place while the next frame grabbed more. */
  if (pool.length < n) return [];
  const took = pool.slice(0, n);
  for (const t of took) t.aboard = true;
  return took;
}

/* Where a rider sits this frame. `u` is membrane/pump.js's own coordinate, and it is
   mapped to the PROTEIN here rather than to the frame: these ions arrived
   under their own steam and leave the same way, so the ends of the path are
   the two mouths, not the edges of the screen. The old pool needed the
   stretched mapping because its ions had nowhere to come from. */
function seatRider(t, c, i, n) {
  const rr = n > 1 ? ionRadius(t.kind) * 1.15 : 0;
  const th = (i / n) * Math.PI * 2;
  const tx = pumpX + Math.cos(th) * rr, tz = Math.sin(th) * rr;
  const ty = c.u * T.height;
  /* Eased, not snapped: a recruit is somewhere in the cytosol when it is
     called, and it has to be seen arriving at the mouth. */
  const k = 0.16;
  t.x += (tx - t.x) * k; t.z += (tz - t.z) * k; t.y += (ty - t.y) * k;
  t.obj.position.set(t.x, t.y, t.z);
}

/* Set down on the FAR side and let go — ONE SPECIES AT A TIME, as it is
   delivered. Unloading both at the end of the turn was wrong twice over: the
   sodium was already outside by the halfway point and had nothing to do
   until the cycle wrapped, so it was parked back at the mouth it came in
   by — visibly pushed back down into the cell it had just left — and the
   potassium had to be recruited before there was anywhere to put it.

   The cycle already says when each one lands: sodium leaves during
   release-na, potassium during release-k. Deliver on those boundaries and
   the pump does what its own phase table says it does. */
function deliver(kind) {
  const to = -PUMP_LOAD[kind];
  for (const t of cargo[kind]) {
    t.aboard = false;
    t.y = to * T.height * 1.15;
    t.x = pumpX + rnd(-18, 18); t.z = rnd(-8, 8);
    t.obj.position.set(t.x, t.y, t.z);
    repick(t);
    t.vy = Math.abs(t.vy) * to;         // moving away from the pump, not into it
  }
  cargo[kind].length = 0;
}
function finishCycle() {
  /* ELECTROGENIC, and this is the number membrane/pump.js calls un-roundable: three
     positive charges out against two in leaves the inside one charge more
     negative every turn. The pump does not only build the concentration
     gradient the channel step spent — it builds part of the voltage too. */
  chargeOut += 1;
  mV = Math.max(-95, MV_PER_ION * chargeOut);
  atpSpent++;
}

/* Which phase we were in last frame, so a boundary can be acted on once. */
let lastPhase = '';

/* ---- one frame of the cycle ----
   Shared by the pump step and the resting step. They differ in what STARTS a
   turn — a button there, the pump's own appetite here — and in nothing else,
   which is the point: the machine is the same machine. */
function runPumpCycle(dt) {
  if (running) {
    pumpT += dt / 11;                   // seconds for one full turn
    if (pumpT >= 1) {                   // one ATP bought exactly one turn
      pumpT = 0; running = false;
      deliver('K');                     // the last drop-off of the turn
      finishCycle();
      lastPhase = '';
      spendEl.disabled = false;
    }
  }
  const st = Pump.at(pumpT);
  T.setGates(st.gates.top, st.gates.bottom);

  /* THE HANDOVER, ON THE CYCLE'S OWN BOUNDARY. Sodium is outside by the time
     load-k begins, so that is where it is set down and where the potassium is
     called for — the pump attracts one cargo, carries it, lets it go, and
     only then asks for the next. Reading the boundary off the phase name
     means the page cannot get the order wrong: membrane/pump.js decides when, and this
     only decides who. */
  if (running && st.phase !== lastPhase) {
    if (st.phase === 'load-k') {
      deliver('NA');                    // three sodiums land outside
      cargo.K = recruit('K', 2);        // and only now are two K⁺ called
    }
    lastPhase = st.phase;
  }

  /* FAN THE CARGO ROUND THE AXIS, don't stack it up one: membrane/pump.js spreads ions
     in normalised units and has no idea how big one is drawn, so at this
     page's exaggeration the site's two ions fused into a blob. Sideways
     rather than further apart along the path — the site is a round pocket and
     the ions sit BESIDE each other in it. */
  const used = { NA:0, K:0 };
  const seats = st.cargo.reduce((a, c) => (a[c.species] = (a[c.species] || 0) + 1, a), {});
  for (const c of st.cargo) {
    const i = used[c.species]++;
    const t = cargo[c.species][i];
    if (!t) continue;                   // nothing recruited: nothing rides
    seatRider(t, c, i, seats[c.species]);
  }
}

/* ---- spending an ATP ----
   The chip flies from the BUTTON to the pump, so the press and the
   phosphate arriving are visibly one event rather than two things that
   happened near each other. It is a DOM chip: it starts on a DOM button,
   and a mesh would have to be born in mid-air with no explanation. */
function flyATP(done) {
  const b = spendEl.getBoundingClientRect();
  const chip = document.createElement('div');
  chip.className = 'fly';
  chip.textContent = 'ATP';
  chip.style.left = (b.left + b.width / 2) + 'px';
  chip.style.top  = (b.top + b.height / 2) + 'px';
  document.body.appendChild(chip);

  /* Where the pump is, in page pixels — projected, so the chip lands on
     the protein wherever the camera has put it. */
  const p = new THREE.Vector3(0, -HALF * 0.6, 0).project(L.camera);
  const r = canvas.getBoundingClientRect();
  const x = r.left + (p.x * .5 + .5) * r.width;
  const y = r.top + (-p.y * .5 + .5) * r.height;

  requestAnimationFrame(() => {
    chip.style.left = x + 'px';
    chip.style.top = y + 'px';
    chip.style.opacity = '0';
  });
  /* Fires on the transition, with a timer as the backstop: a backgrounded
     tab never runs the transition, and the pump must still start. */
  let fired = false;
  const go1 = () => { if (fired) return; fired = true; chip.remove(); done(); };
  chip.addEventListener('transitionend', go1);
  setTimeout(go1, 1000);
}

spendEl.addEventListener('click', () => {
  if (running) return;
  spendEl.disabled = true;
  flyATP(() => {
    /* RECRUITED WHEN THE ATP LANDS, not before: the ions are called to the
       pump by the spend, so the press and the loading are one event. Three
       sodiums from the cytosol, two potassiums from outside — each taken
       from the side its own gradient would carry it AWAY from, which is
       what "uphill" means and the whole of what a channel cannot do. */
    /* SODIUM ONLY. The potassium is called later, when the pump has turned
       and has somewhere to put it — see the load-k boundary in tick(). A
       pump that gathers both cargoes up front is holding five ions at once,
       which is not what its site does and not what the cycle says. */
    cargo.NA = recruit('NA', 3);
    pumpT = 0; running = true; lastPhase = '';
  });
});

/* ---- the osmosis overlay ----
   EVERY NUMBER HERE IS COUNTED, not typed. The free-water totals are the
   travellers actually on each side this frame, so they drift as water
   crosses and the two sides converge on their own — which is the point of
   the step, and a pair of typed constants would flatly contradict it the
   moment one molecule moved. */
const _op = new THREE.Vector3();
function paintOsmo() {
  /* "water", not "free water": with the shells gone there is no bound
     water to distinguish it from, and the count is simply how many water
     molecules are on that side. */
  let inside = 0, outside = 0;
  for (const t of travellers) {
    if (t.kind !== 'water') continue;
    if (t.y < 0) inside++; else outside++;
  }
  osmoOutEl.firstElementChild.textContent = outside;
  osmoInEl.firstElementChild.textContent = inside;

  /* THE WORD IS READ FROM THE COUNT, like every other number on this page.
     Typing "hypertonic" under the outside would be a claim nothing checks,
     and it would be WRONG by the end of the run — the whole point is that
     the two sides finish isotonic.

     Naming it this way also fixes the misconception the vocabulary usually
     creates. Tonicity is a RELATION between two solutions, not a property
     one of them owns: the same salt water is hypertonic to a cell and
     hypotonic to seawater. Here the labels flip to "isotonic" together,
     because neither side can be it alone. */
  const gap = outside - inside;
  const tone = Math.abs(gap) <= 3 ? ['isotonic', 'isotonic']
             : gap < 0 ? ['hypertonic', 'hypotonic']   // less water outside
                       : ['hypotonic', 'hypertonic'];
  setHTML(osmoOutEl.lastElementChild, 'water · outside<br><em>' + tone[0] + '</em>');
  setHTML(osmoInEl.lastElementChild, 'water · inside<br><em>' + tone[1] + '</em>');

  /* Where the membrane is IN PIXELS. Projected rather than assumed: the
     chrome reserve pushes world y=0 above the centre of the canvas, and a
     tally hard-coded to 25%/75% of the box sits in the wrong compartment
     at some window sizes. */
  const r = canvas.getBoundingClientRect();
  const mid = _op.set(0, 0, 0).project(L.camera);
  const midY = (1 - (mid.y * .5 + .5)) * r.height;
  const x = r.width * 0.20;
  osmoOutEl.style.left = osmoInEl.style.left = x + 'px';
  osmoOutEl.style.top = clampY(midY * 0.5, 70) + 'px';
  osmoInEl.style.top = clampY(midY + (r.height - midY) * 0.5, 70) + 'px';

  /* The arrow states the NET, and only once the net has actually said
     something: at 0-1 crossings it would spin on every molecule and read
     as the sim guessing. It points the way the counter went — it is not
     told which way osmosis "should" go. */
  const net = netRecent;
  const on = Math.abs(net) >= 3;
  /* The arrow FADES WITH THE NET rather than switching on at a threshold.
     A net that halves and an arrow that does not is the same contradiction
     in a smaller form; here the conclusion visibly weakens as the two sides
     even up, and goes out when they have. */
  /* Weakening, not vanishing. The arrow still fades as the sides even up,
     but from a floor high enough to stay legible the whole way — a
     conclusion at 20% opacity looks like a rendering fault rather than a
     small net. The ramp stays tied to the window: a longer half-life means
     netRecent settles proportionally larger, and a divisor left behind
     would pin it at full strength, which is the frozen-arrow problem the
     decay exists to fix. */
  osmoArrowEl.style.opacity =
    on ? Math.min(0.95, 0.62 + Math.abs(net) / (NET_HALFLIFE * 6)) : 0;
  if (on) {
    /* up = out of the cell. The SVG is drawn pointing up, so a downward
       net flips it rather than being drawn twice. */
    osmoArrowG.setAttribute('transform', net > 0 ? '' : 'rotate(180 23 75)');
    osmoNetEl.textContent = 'net ' + Math.abs(net).toFixed(0) + (net > 0 ? ' out' : ' in');
  }
  osmoArrowEl.style.left = (r.width * 0.78) + 'px';
  osmoArrowEl.style.top = midY + 'px';
}

/* THE BAND THE OVERLAYS MAY USE. Their vertical placement is solved from the
   projected membrane, which knows nothing about the caption floating over the
   bottom of the stage — so a tally landing low ended up behind the text. */
function clampY(y, pad) {
  const top = pad, bot = canvas.clientHeight - chromeEl.offsetHeight - pad;
  return Math.max(top, Math.min(bot, y));
}

/* ---- the voltage overlay ----
   NO CHARGE SKINS. Rows of + and − were stamped along the two faces, sized
   as |mV| / |E_K| — a bar gauge drawn with characters. It looked like a
   COUNT and was not one: a student could count eighteen pluses beside a
   tally reading a different number, which is exactly the typed-number
   failure this repo's copywriting rule exists to prevent. The two tallies
   carry the fact, and the caption carries the surface part in words. */
function paintVolt() {
  const r = canvas.getBoundingClientRect();
  const mid = _op.set(0, 0, 0).project(L.camera);
  const midY = (1 - (mid.y * .5 + .5)) * r.height;
  const face = _op.set(0, HALF, 0).project(L.camera);
  const faceY = (1 - (face.y * .5 + .5)) * r.height;
  const half = Math.max(6, Math.abs(midY - faceY));

  /* BOTH NUMBERS ARE COUNTED. The voltage is MV_PER_ION times the transits
     that actually happened, and the transit count is those transits — so
     the second number is the first one's working, and a student who
     doubts the voltage can watch what it is made of. */
  /* THE UNIT RIDES THE NUMBER. Two 46px figures stacked in one overlay
     read as one instrument in one unit, and "mV" was buried in the 12px
     label under only one of them — so the transit count above looked like
     a second voltage. A quantity and its unit are one thing; the label is
     for what it is a measurement OF. */
  setHTML(voltReadEl.firstElementChild, Math.round(mV) + '<small> mV</small>');
  /* "balanced", not "stopped". At equilibrium the pore is still open and
     ions are still moving through it in both directions — what has gone is
     the NET. A label saying the flow stopped would teach that the channel
     shut, which is the one thing this step keeps insisting does not
     happen. And "leaking" named no ion and read as a fault. */
  const stepId = STEPS[cur] && STEPS[cur].id;
  setHTML(voltReadEl.lastElementChild, 'inside<br><em>' +
    (stepId === 'rest'
      ? (pumpOn ? 'held by the pump' : 'running down')
      : stepId === 'pump'
      ? (atpSpent ? atpSpent + ' ATP spent building this' : 'nothing spent yet')
      : drive('K') <= 0.001 ? 'balanced · no net flow' : 'K⁺ still leaving') + '</em>');
  setHTML(voltRefEl.firstElementChild, '0<small> mV</small>');
  setHTML(voltRefEl.lastElementChild, 'outside<br><em>reference</em>');

  /* An arrow PER CURRENT, pointing the way that ion actually went — up is
     out of the cell, down is in, the page's convention throughout. The two
     are read from the transits and always add to the total beside them. */
  setHTML(voltCountEl, stepId === 'rest'
    ? '<span>ATP spent</span><b>' + atpSpent + '</b> · ' +
      'Na⁺ ↑ ' + (atpSpent * 3) + ' · K⁺ ↓ ' + (atpSpent * 2)
    : stepId === 'pump'
    ? '<span>carried uphill</span><b>' + (atpSpent * 5) + '</b> · ' +
      'Na⁺ ↑ ' + (atpSpent * 3) + ' · K⁺ ↓ ' + (atpSpent * 2)
    : '<span>ions crossed</span><b>' + chargeOut + '</b> · ' +
      'K⁺ ↑ ' + crossed.K + ' · Cl⁻ ↓ ' + crossed.CL);

  /* THE VOLTAGE SITS INSIDE, which is the BOTTOM half — the pump's u = −1
     is the cytoplasmic mouth and every other step follows it. This label
     says "mV inside" and was being drawn above the membrane, i.e. in the
     extracellular space, which is the one place it is not true.
     The transit count is not a property of either side, so it takes the
     other half rather than crowding the reading it explains. */
  /* THE VOLTAGE PAIR ON THE LEFT, THE TALLY ON THE RIGHT. They are not the
     same kind of thing: the mV reading and its 0 mV reference are one
     measurement across the membrane, so they belong on one axis facing
     each other. The transit count is a running total of events and belongs
     nowhere in particular — so it sits well clear, where it cannot be read
     as a third value in that comparison. */
  const x = r.width * 0.17;
  voltReadEl.style.left = voltRefEl.style.left = x + 'px';
  voltReadEl.style.top = clampY(midY + half + 74, 64) + 'px';   // inside, below
  voltRefEl.style.top  = clampY(midY - half - 74, 64) + 'px';   // outside, above
  /* No positioning: it is pinned to the stage's bottom-right corner in CSS
     rather than solved against the membrane, because it is not measuring
     anything about a side. */
}

/* ---- the ion census ----
   COUNTED OFF THE TRAVELLERS, every frame, by which side of the membrane
   each one is actually on — including the ones currently in a pore, which
   belong to whichever side they have reached. Nothing here knows what the
   starting numbers were, so the two corners cannot disagree with the scene
   they are describing. */
function paintIons() {
  const n = { out:{ K:0, CL:0 }, in:{ K:0, CL:0 } };
  for (const t of travellers) {
    if (t.kind !== 'K' && t.kind !== 'CL') continue;
    n[t.y >= 0 ? 'out' : 'in'][t.kind]++;
  }
  const line = c => '<b>K⁺ ' + c.K + '</b> · <b>Cl⁻ ' + c.CL + '</b>';
  setHTML(ionsOutEl, '<span>outside</span>' + line(n.out));
  setHTML(ionsInEl, line(n.in) + '<span>inside</span>');
}

/* ---- has it arrived? ----
   TWO MODES, TWO EQUILIBRIA, and saying which is the point of the badge.
   With no voltage the flow stops when the concentrations level: chemical
   equilibrium, gradient spent. With the voltage it stops far earlier, at
   the point where the electrical pull cancels the concentration push —
   electrochemical equilibrium, and the gradient is still standing, which
   is the whole reason the cell has something to spend later.

   Read off the same state the traffic reads, so the badge cannot claim an
   equilibrium over a pore that is still passing ions. */
function equilibrium() {
  /* Not "no current" — two currents that cancel. The badge waits for real
     traffic first (chargeOut) so it cannot fire on the opening frames,
     when the voltage is at 0 and has not moved yet because nothing has
     happened. */
  if (voltOn) return Math.abs(netPush()) < 0.04;
  return crowdedSide('K') === 0 && crowdedSide('CL') === 0;
}
function paintEqBadge() {
  const on = equilibrium();
  eqBadgeEl.classList.toggle('is-on', on);
  if (on) {
    /* TWO DIFFERENT EQUILIBRIA, and the word alone cannot tell them apart.
       With no voltage it is a DIFFUSION equilibrium: concentrations level,
       stored energy gone. With the voltage it is an ELECTROCHEMICAL one,
       and only for the two ions that have pores — the gradient survives,
       which is why the cell still has something to spend. Neither means the
       cell is finished; both mean it has finished LEAKING. */
    eqBadgeEl.firstElementChild.textContent = voltOn
      ? 'K⁺ and Cl⁻ at equilibrium'
      : 'Concentrations at equilibrium';
    eqBadgeEl.lastElementChild.textContent = voltOn
      ? 'two currents cancelling · the gradient survives'
      : 'levelled out · the stored gradient is gone';
  }
}

/* THE CONTROLS SIT ON TOP OF THE CHROME, whose height is whatever the
   tallest caption made it. Measured rather than typed: a fixed bottom offset
   is correct for exactly one caption length and wrong for the rest, and it is
   the kind of wrong that only shows up on one tab. */
function placeControls() {
  const h = chromeEl.offsetHeight;
  ctlEl.style.bottom = (h + 10) + 'px';
  spendEl.style.bottom = (h + 56) + 'px';
  /* The bottom-corner readouts clear the chrome too. They used to sit at a
     fixed 14px from the stage's edge, which was under the caption once the
     chrome started floating over the scene. */
  ionsInEl.style.bottom = (h + 12) + 'px';
  voltCountEl.style.bottom = (h + 12) + 'px';
}

/* WRITE ONLY ON CHANGE. Assigning innerHTML rebuilds the node's children,
   and the captions were being reassigned sixty times a second with the same
   string — which the browser is entitled to reflow, and does: the text
   flickers, most visibly right after something else on the page changes.
   Every live caption on this page goes through here. */
function setHTML(el, html) {
  if (el._html !== html) { el._html = html; el.innerHTML = html; }
}

/* ---- step machinery ---- */
let cur = -1;
STEPS.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = s.tab;
  b.addEventListener('click', () => go(i));
  stepsEl.appendChild(b);
});

function go(i) {
  cur = i;
  const s = STEPS[i];
  s.enter();
  setHTML(capEl, s.cap);
  [...stepsEl.children].forEach((b, j) =>
    j === i ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'));
  L.fit();
  liftScene();
  /* fit() moves the camera, so the offscreen line is only knowable after
     it. Re-enter the step so its molecules are placed against the frame
     that will actually be drawn. */
  solveOffscreen();
  s.enter();
}

function tick(dt) {
  const s = STEPS[cur]; if (!s) return;
  kit.faceCamera(L.camera);               // badges are sprites; they must turn
  /* Only the sheet on stage. The other two are hidden, and stirring a
     hidden bilayer is work nobody sees — with three of them it is most of
     the lipid in the scene. */
  MEM.tick(dt);                           // the bilayer is a liquid, so it moves

  if (s.id === 'rest') {
    /* THE PUMP FEEDS ITSELF HERE. It re-arms the moment a turn ends, so long
       as the switch is on and there is sodium inside to carry — no button,
       because the point is that this never stops while the cell is alive. */
    if (pumpOn && !running && cargo.NA.length === 0) {
      const got = recruit('NA', 3);
      if (got.length) { cargo.NA = got; pumpT = 0; running = true; lastPhase = ''; }
    }
    runPumpCycle(dt);

    for (const t of travellers) if (!t.aboard) advance(t, dt);
    keepClear(travellers.filter(t => (ELEMENT_OF[t.kind] || t.kind === 'A') && !t.aboard));
    for (const t of travellers) keepOutOfPores(t);

    setHTML(capEl, pumpOn
      ? '<b>Standing still costs ATP.</b>'
      : '<b>The pump is off — watch the counts level and the voltage fade.</b>');
  } else if (s.id === 'pump') {
    runPumpCycle(dt);
    /* Everything NOT aboard is ordinary solution and keeps walking — the pump
       is a machine standing in a crowd, not the only thing on stage. */
    for (const t of travellers) if (!t.aboard) advance(t, dt);
    keepClear(travellers.filter(t => ELEMENT_OF[t.kind] && !t.aboard));
    for (const t of travellers) keepOutOfPores(t);
    spendEl.hidden = false;

    /* The caption is READ from the cycle. Nothing on this page can say the
       pump is doing something the geometry is not. */
    const stc = Pump.at(pumpT);
    setHTML(capEl, running || stc.phosphate.on
      ? '<b>' + stc.label + '</b> — ' + stc.caption
      : '<b>The channel step spent this gradient. Press the button to buy it back.</b>');
  } else {
    spendEl.hidden = true;
    for (const t of travellers) {
      const was = t.y;
      advance(t, dt);
      if (s.id === 'osmosis' && !t.blocked) {
        if (was > 0 && t.y <= 0) { crossings.down++; netRecent -= 1; }
        if (was < 0 && t.y >= 0) { crossings.up++;   netRecent += 1; }
      }
    }
    if (s.id === 'osmosis')
      netRecent *= Math.pow(0.5, dt / NET_HALFLIFE);
    if (s.id === 'channel') {
      /* No keepApart() on the lanes any more — the file spaces itself by
         waiting (see queueAhead), and pushing positions on top of that was
         what made the pores dither. */
      /* WALL EXCLUSION RUNS LAST. keepClear() pushes ions apart by moving
         them, and it knows nothing about the proteins — run before it, the
         wall correction was promptly undone by a neighbour shoving an ion
         back into the barrel. Whatever moves a traveller last decides where
         it is, so the hardest constraint has to be the final word. */
      keepClear(travellers.filter(t => ELEMENT_OF[t.kind]));
      for (const t of travellers) keepOutOfPores(t);
      /* WHERE THE COAT COMES OFF: at the mouth, not in the middle. An ion
         that sheds halfway down has already entered the filter wearing a
         shell that does not fit in it.

         Read off the protein's own height rather than a typed depth, so
         resizing the transporter cannot leave the moment stranded in the
         solution above it. */
      const mouth = T.height * 0.9;
      for (const t of travellers) {
        if (!shellsOn) continue;
        /* An ion that has LEFT the pore still has a shell to get back, and
           it is no longer in a lane — releasing it into the bulk cleared
           that. Gating this loop on `lane` alone left every conducted ion
           permanently stripped, wandering the cytosol as a bare charge,
           which is the one thing nothing in a cell is. */
        if (t.lane == null && !t.shellOff) continue;
        if (!t.shellOff && Math.abs(t.y) < mouth) shedShell(t);
        /* And it gets the water back on the far side — the ion pays the
           shell to get through and is repaid by the solution it arrives
           in. Without this the queue would emerge permanently naked, which
           says the channel STRIPPED it, and that a K⁺ in the cytosol is a
           bare ion. It is not; nothing in a cell is. */
        /* Re-dressed on the far side, whichever way it was travelling —
           the K⁺ queue runs up and out, the Cl⁻ queue runs down and in, so
           "past the mouth" is about DISTANCE from the membrane, not sign. */
        else if (t.shellOff && Math.abs(t.y) > mouth) growShell(t);
      }
    }
    tickShells(dt);
  }
  /* Outside the branches: the pump step returns early past them, so a
     toggle hidden only in the non-pump path stayed on screen over the pump. */
  /* The shells belong to both protein steps — an ion the pump drags uphill
     is dressed exactly like one a channel refuses, and the same switch
     should strip both. The POTENTIAL switch is the channel step's alone:
     there it is a choice about the physics, whereas the pump builds a
     voltage whether or not anyone is watching it. */
  placeControls();
  ctlEl.hidden = s.id !== 'channel' && s.id !== 'pump' && s.id !== 'rest';
  /* ON THE RESTING STEP IT IS A STATUS, NOT A SWITCH. The potential is always
     in play there — a resting cell has one by definition — so the pill is
     shown ticked and locked rather than hidden. Hiding it would leave the
     student wondering whether the voltage on screen is the same thing they
     were toggling one tab ago; an unclickable tick answers that, and says the
     step is not withholding a control. */
  /* True of the pump step too: it moves charge every turn and shows the mV
     that results, so the potential is in play there whether or not anyone
     asked for it. Only the channel step gets to switch it off, because only
     there is "what if charge did not push back" a question worth asking. */
  const fixedVolt = s.id === 'rest' || s.id === 'pump';
  voltBox.parentElement.hidden = s.id !== 'channel' && !fixedVolt;
  voltBox.parentElement.classList.toggle('is-fixed', fixedVolt);
  voltBox.disabled = fixedVolt;
  if (fixedVolt) voltBox.checked = true;
  /* The pump switch is the resting step's whole argument — stop paying and
     watch it come apart — so it belongs nowhere else. On the pump step the
     button already is the switch. */
  pumpBox.parentElement.hidden = s.id !== 'rest';
  /* THE SAME INSTRUMENTS AS THE CHANNEL STEP, deliberately. The student
     watched these numbers fall; the pump step is them going back up, and a
     second set of readouts would hide that it is the same quantity. */
  ionsEl.hidden = s.id !== 'channel' && s.id !== 'pump' && s.id !== 'rest';
  if (!ionsEl.hidden) paintIons();
  if (s.id === 'channel') paintEqBadge();      // a pumped cell is never at one
  else eqBadgeEl.classList.remove('is-on');
  voltEl.hidden = (s.id === 'pump' || s.id === 'rest') ? false
                : s.id !== 'channel' || !voltOn;
  if (!voltEl.hidden) paintVolt();
  NOTES.step();                           // trap 1: in the RENDER loop
  osmoEl.hidden = s.id !== 'osmosis';
  if (!osmoEl.hidden) paintOsmo();
}

go(0);
L.start();
</script>

</html>
