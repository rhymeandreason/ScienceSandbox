<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The membrane — what gets through, and what it costs</title>
<link rel="stylesheet" href="sandbox.css">
<style>
  html,body { height:100%; margin:0; }
  #page { display:flex; flex-direction:column; height:100vh; }
  #stage { position:relative; flex:1 1 auto; min-height:0; }
  canvas { width:100%; height:100%; display:block; }

  /* The chrome is ONE block at the bottom. kit/fit.js is told its height in
     pixels, so the camera frames the scene above it rather than behind it. */
  #chrome { flex:0 0 auto; padding:10px 18px 16px; text-align:center; }
  #cap { font-size:17px; line-height:1.35; min-height:2.6em;
         max-width:46em; margin:0 auto 10px; }
  #cap b { font-weight:600; }
  #readout { font-size:13px; opacity:.7; min-height:1.2em; margin:-6px 0 8px; }


  /* The button sits ON the scene, in the gap between the bottom of the
     protein and the top of the chrome. It is the pump's control, so it
     belongs next to the pump — and it is deliberately OUTSIDE #chrome, so
     fit.js's reserve (chromeEl.offsetHeight) does not grow on the one step
     that shows it and re-frame the membrane mid-lesson. */
  #spend { position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
           z-index:4;
           font:inherit; font-size:14px; padding:8px 16px; border-radius:999px;
           border:1px solid #a493cf; background:#e8e2f6; cursor:pointer;
           box-shadow:0 2px 10px rgba(0,0,0,.12); }
  #spend:disabled { opacity:.45; cursor:default; }
  #spend[hidden] { display:none; }

  /* The flying ATP. A DOM chip rather than a mesh: what is being shown is
     the SPENDING, and the spending starts at a button the student pressed.
     A mesh would have to be born in mid-air with nothing to say where it
     came from. */
  .fly { position:fixed; z-index:5; font-size:13px; font-weight:600;
         padding:4px 12px; border-radius:999px; background:#e8e2f6;
         border:1px solid #a493cf; pointer-events:none;
         transform:translate(-50%,-50%);
         transition:left .9s cubic-bezier(.4,0,.5,1), top .9s cubic-bezier(.4,0,.5,1),
                    opacity .9s ease-in; }

  /* NO DOT. annotate.js's dot marks the anchor, but here the anchor is a
     molecule that is already drawn — a ring on top of a sphere reads as a
     second object at the same place, and at this zoom it is about the size
     of the ion it is sitting on. The leader still lands on the anchor, so
     the line points at the molecule. */
  .annot-dot { display:none; }

  #steps { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  #steps button {
    font:inherit; font-size:13px; padding:7px 13px; border-radius:999px;
    border:1px solid rgba(0,0,0,.18); background:transparent; cursor:pointer;
    opacity:.55;
  }
  #steps button[aria-current=step] { opacity:1; font-weight:600;
    border-color:#2a7a6a; box-shadow:inset 0 0 0 1px #2a7a6a; }
  #steps button:hover { opacity:.85; }

  @media (max-width:920px){
    #cap { font-size:15px; }
    #steps button { padding:6px 10px; font-size:12px; }
  }
</style>
</head>
<body>
<div id="page">
  <div id="stage">
    <canvas id="c"></canvas>
    <button type="button" id="spend" hidden>Spend 1 ATP</button>
  </div>
  <div id="chrome">
    <p id="cap"></p>
    <p id="readout"></p>
    <nav id="steps" aria-label="lesson steps"></nav>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="palette.js"></script>
<script src="molecules.js"></script>
<script src="mol-small.js"></script>
<script src="atomkit.js"></script>
<script src="scene.js"></script>
<script src="annotate.js"></script>
<script src="fx.js"></script>
<script src="kit/motion.js"></script>
<script src="kit/focus.js"></script>
<script src="kit/fit.js"></script>
<script src="kit/stagekit.js"></script>
<script src="membrane/parts.js"></script>
<script src="membrane/pump.js"></script>
<script>
'use strict';
/* =====================================================================
 *  membrane-lab.html — the bilayer, what crosses it, and what a crossing
 *  costs.
 *
 *  LESSONS-ROADMAP.md §2's conflict, in its own words: the bilayer drawn
 *  "as two rows of lollipops, at a geometry and scale that are simply
 *  false, proteins drawn as beans wedged in", and water movement drawn
 *  three contradictory ways. This page keeps the lollipops — they are how
 *  a student recognises a membrane — and fixes the two things that were
 *  actually wrong with them: the thickness is the one OPM measured off a
 *  real structure (membrane/tools/bake-pump.js), and nothing crosses
 *  without a reason the student has been shown.
 *
 *  THE ARC. Five steps, and each one exists to break a specific wrong
 *  idea:
 *    1 the bilayer      it is not a wall, it is oil with wet ends
 *    2 what gets through  "the membrane lets small things through" — no:
 *                       it lets OILY things through, and size is second
 *    3 osmosis          water crosses BOTH ways always; the net is the
 *                       only thing that ever changes
 *    4 a channel        a hole does not choose a direction. Down only.
 *    5 the pump         to go the other way, something has to pay
 *
 *  Every step is click-driven. The pump does not loop: it waits until
 *  the student spends an ATP, and one ATP buys exactly one turn.
 *
 *  NO SIDEBAR. All chrome is one block at the bottom, and its height in
 *  pixels goes to kit/fit.js, so the camera frames the scene above the
 *  words instead of behind them.
 * ===================================================================== */

const canvas = document.getElementById('c');
const capEl = document.getElementById('cap');
const readoutEl = document.getElementById('readout');
const stepsEl = document.getElementById('steps');
const spendEl = document.getElementById('spend');
const chromeEl = document.getElementById('chrome');

const HALF = 15.3;                      // OPM's half-thickness, from the bake

/* The bilayer runs off both edges of the frame on purpose. A membrane with
   visible ends is a raft, and a student asks what is holding it together;
   a real one has no edge anywhere near the scale of one protein. The
   camera frames `boxes` below, not the lipids, so widening this overflows
   the view instead of zooming out to fit.

   Sized for a WIDE viewport. The fit is driven by height, so on a 21:9
   window the camera sees far more world horizontally than vertically, and
   150 left the bilayer ending mid-screen. Instances are free here — one
   draw call per leaflet either way — so this is set past the widest
   plausible window rather than tuned to one. */
const MEM_REACH = 340;

/* How far out molecules are scattered. Tied to the membrane's own reach
   rather than typed twice: the bilayer now runs off both edges, and a
   dozen molecules clustered in the middle of it read as a nearly empty
   cell with a crowd at the origin. */
const SPREAD = MEM_REACH * 0.55;

/* OFF THE TOP OF THE FRAME, solved from the camera rather than guessed.

   Molecules used to be spawned inside the view, so entering a step meant a
   crowd blinking into existence — which reads as things being CREATED at
   the membrane, the one thing none of these steps is about. They start
   above the frame and drift in.

   Re-solved on every fit(): the visible half-height depends on the camera
   distance and the chrome reserve, so a resize that changes either would
   otherwise start spawning things in shot again. */
let OFFSCREEN = 90;
function solveOffscreen() {
  /* Measured off the CANVAS, not the camera's nominal distance. The first
     version used tan(fov/2) * cam.r and things still popped in just above
     the protein — because fit() moves cam.r afterwards, and because the
     canvas is not the frustum: the chrome reserve shifts the target off
     centre, so the top edge is further from y=0 than half the frustum is.

     kit/stagekit.js's worldPerPx converts the canvas's own pixel height
     into world units at the target plane, which is the number that
     actually decides what is on screen. */
  const halfH = L.pxToWorld(canvas.clientHeight) / 2;
  OFFSCREEN = halfH + 26;               // clear of the edge, plus a molecule
}

const L = Lesson.create(canvas, {
  cam:{ theta:0, phi:Math.PI/2 - 0.10, r:150 }, fx:false,
  rMin:50, rMax:400,
  reservePx: () => ({ bottom: chromeEl.offsetHeight + 14 }),
  boxes: () => ([{ x:0, y:0, rxz:60, hy:34 }]),
  frame: dt => tick(dt),
});
L.renderer.localClippingEnabled = true;

/* ---- callouts (annotate.js) ----
   Anchors are FUNCTIONS returning a live world point, per annotate.js's
   header: these name travellers that are moving the whole time, so a baked
   coordinate would come adrift on the first frame. */
const NOTES = Annot.create(THREE, document.getElementById('stage'), L.camera,
                           { mode:'on' });
const _np = new THREE.Vector3();
/* Names ONE traveller, not a species. Three labels on three of the forty
   things on screen is a key; a label per molecule is a wall of type. */
function noteOn(t, text, offset) {
  if (!t) return;
  NOTES.add({ text, offset, at: () => t.obj.getWorldPosition(_np) });
}

/* ---- the membrane ----
   TWO of them, and it is not duplication: steps 1-3 have no protein, and
   a membrane with a protein-shaped hole in it and no protein reads as a
   torn membrane. That is a worse lie than the cost of a second instance,
   because a student's first question becomes "what made the gap". Solid
   for the passive steps, holed once there is something standing in it. */
const memSolid = Parts.membrane({ half:HALF, reach:MEM_REACH });
const memHoled = Parts.membrane({ half:HALF, reach:MEM_REACH, exclude:(x,z) => Math.hypot(x,z) - 15.0 });
memHoled.group.visible = false;
L.root.add(memSolid.group, memHoled.group);
function showMembrane(withHole) {
  memSolid.group.visible = !withHole;
  memHoled.group.visible = withHole;
}

/* The cut belongs to the steps with a protein in them, and only those.
   Steps 1-3 are ABOUT the intact bilayer; slicing it there would answer a
   question nobody has asked yet. From step 4 the protein is the subject
   and its lumen is the whole point — uncut, the ions are sealed inside an
   opaque shape and the student is asked to take the pore on faith.

   The plane is the membrane's own (it laid the slab out, so it knows which
   axis is thin); the protein borrows it so one cut governs the scene. */
function setCut(on) {
  memHoled.cut.enable(on);
  for (const P of [CHANNEL, PUMP]) {
    P.mesh.material.clippingPlanes = on ? [memHoled.cut.plane] : [];
    P.mesh.material.side = on ? THREE.DoubleSide : THREE.FrontSide;
    P.mesh.material.needsUpdate = true;
  }
}

/* TWO proteins, and an earlier version had one — "same object, different
   gate rule" is a tidy line and it is wrong. A channel and a pump differ
   in the gates AND in how tightly the path holds an ion, and the second
   difference is why the first one matters: a channel conducts millions of
   ions a second BECAUSE its pore does not grip, and a pump manages a
   hundred BECAUSE its site does. Drawn at one width, the channel looked
   like a pump that had forgotten to close, and the ions queued through a
   pore they visibly did not fit.

   So the channel gets a wide pore and the pump a snug site. The gates
   still carry the argument; the width is what makes each of them the kind
   of protein it is. */
const CHANNEL = Parts.transporter({ half:HALF, site:7.2, mouth:8.8 });
const PUMP    = Parts.transporter({ half:HALF });
CHANNEL.group.visible = PUMP.group.visible = false;
L.root.add(CHANNEL.group, PUMP.group);
let T = PUMP;                                   // whichever is on stage
function showProtein(which) {
  CHANNEL.group.visible = which === CHANNEL;
  PUMP.group.visible    = which === PUMP;
  if (which) T = which;
}

/* ---------------------------------------------------------------------
   Small molecules. Real specs, not spheres — water, O2 and CO2 are in
   mol-small.js with measured geometry, and this page's whole claim in
   step 2 is about what those molecules ARE. Spheres would have made
   "oily slips through, charged does not" an assertion.

   TWO SCALINGS, both declared. molecules.js builds at MolLib.SCALE, so a
   molecule comes out ~1.9x its angstroms while membrane/parts.js works in raw
   angstroms; dividing puts them in one frame. Then everything crossing
   is enlarged by the SAME factor the ions already use, because a true
   3 A water against a 30 A membrane is a speck.
   --------------------------------------------------------------------- */
const SCALE = MolLib.SCALE || 1.9;
/* One exaggeration for everything that crosses, declared here rather than
   taken from membrane/parts.js: this page's stage is ~300 A wide so that the bilayer
   can run off both edges, and at membrane/parts.js's 2.6 an oxygen is about three
   pixels. Raising the single factor scales molecules, ions and their charge
   badges together, so every relative size on stage stays honest — only the
   comparison against the MEMBRANE is exaggerated, and the membrane is the
   one thing here whose size is measured and printed. */
const EXAG = 5.0;

/* ONE SIZE CONVENTION FOR EVERYTHING ON STAGE.

   molecules.js sizes atoms from PALETTE.radii; membrane/parts.js sizes ions from
   Shannon radii. Mixed, Na⁺ drew LARGER than O₂ — so step 2, whose whole
   claim is "charge stops it, not size", was showing a big sodium bouncing
   off and a small oxygen slipping through. It taught a size rule.

   Ions now take their radius from the same palette, through the same
   multiplier the molecule groups get, so every object in the scene is
   comparable and CO₂ is visibly the biggest thing that crosses. */
const ELEMENT_OF = { NA:'Na', K:'K', CL:'Cl', MG:'Mg' };
function ionRadius(kind) {
  const el = ELEMENT_OF[kind] || kind;
  const r = MolLib.PALETTE.radii[el];
  if (r == null) throw new Error('membrane-lab: no palette radius for ' + el);
  return r * (EXAG / SCALE);
}

/* Charge is a BADGE, not a size. atomkit draws the same +/− disc the
   bonding lessons use, so an ion means the same thing on every page. */
const kit = AtomKit.create(THREE);
function chargedIon(kind) {
  const g = new THREE.Group();
  g.add(Parts.ion(kind, { radius: ionRadius(kind) }));
  const el = ELEMENT_OF[kind] || kind;
  /* atomkit sizes badges for the bonding pages, where a handful of atoms
     fill the screen. Here they ride an ion drawn EXAG/SCALE bigger, so the
     badge and its shoulder offset are scaled by the same factor — matched
     to the ion rather than enlarged on its own. */
  const k = EXAG / SCALE;
  /* The badge itself is drawn at TWICE the matched size. The shoulder
     offset below stays at k: this page reads at a whole-membrane zoom
     where a badge sized to the sphere is a few pixels of sign, and the
     sign is the only thing distinguishing K⁺ from Na⁺ from Cl⁻. */
  const b = kit.charge(kind === 'CL' ? '−' : '+',
                       '#' + Parts.ION[kind].color.toString(16).padStart(6, '0'), el, k * 2);
  b.userData.base.multiplyScalar(k);
  b.userData.lift *= k;
  b.position.copy(b.userData.base);
  g.add(b);
  return g;
}

function smallMolecule(name) {
  const spec = MolLib.MOLECULES[name];
  if (!spec) throw new Error('membrane-lab: no spec named ' + name);
  const g = Stage.buildMolecule(spec, { center:true });
  g.scale.setScalar(EXAG / SCALE);
  return g;
}

/* ---------------------------------------------------------------------
   Travellers — one pool, reused by steps 2 and 3. Each carries where it
   is going and how fast, and NOTHING else: a traveller does not know
   which step it is in, so a step cannot leave one behind.
   --------------------------------------------------------------------- */
const travellers = [];
function traveller(kind, opts) {
  const o = Object.assign({ x:0, z:0, y:0, vy:0, blocked:false }, opts);
  const obj = (kind === 'NA' || kind === 'K' || kind === 'CL')
    ? chargedIon(kind) : smallMolecule(kind);
  obj.position.set(o.x, o.y, o.z);
  L.root.add(obj);
  const t = Object.assign({ kind, obj }, o);
  /* BLOCKED IMPLIES BOUNDED, always. A traveller that cannot cross the
     bilayer must also not leave the frame and come back — that is the same
     escape by a different door, and step 3's whole claim is that solute
     stays put. Enforced here rather than at each spawn, because it was
     spelled out four times and one of them forgot. */
  if (t.blocked) t.bounded = true;
  /* Every traveller tumbles on its OWN axis at its OWN rate. One shared
     spin made a screenful of water rotate in lockstep, which reads as a
     rendered pattern rather than a jostling crowd. */
  t.spin = { x:rnd(-.9,.9), y:rnd(-.9,.9), z:rnd(-.9,.9) };
  t.flipEvery = rnd(0.55, 1.15);        // and its own clock, so the crowd
  t.since = Math.random() * t.flipEvery; // never re-picks in unison
  if (t.walk) { t.vx = rnd(-4,4); t.vz = rnd(-4,4); }
  travellers.push(t);
  return t;
}
function clearTravellers() {
  for (const t of travellers) L.root.remove(t.obj);
  travellers.length = 0;
  /* The callouts point AT travellers, so they die with them. go() calls
     enter() twice — once to place, once against the fitted frame — and
     without this the second pass would leave two labels per molecule. */
  NOTES.clear();
}
const rnd = (a, b) => a + Math.random() * (b - a);

/* An x well clear of the protein's column. Anything that is NOT going
   through the channel has to be somewhere the student cannot read as
   going through it: an ion bouncing at the head layer directly above the
   pore is standing inside the protein's upper barrel, and water crossing
   the lipid at x=0 looks like water using the pore. Both made step 4 read
   as "everything gets through", which is the opposite of its claim. */
const CHANNEL_KEEPOUT = 26;
function rndClear(span) {
  const x = rnd(CHANNEL_KEEPOUT, span);
  return Math.random() < .5 ? -x : x;
}

/* Ions in single file do not touch. They are all +1, so they repel — and
   in a real K⁺ channel they queue with a water molecule between each pair,
   which is roughly this gap. Spawning them spaced is not enough on its own:
   any drift in speed closes the line up over a few seconds, so a cheap
   relaxation pass keeps it open. Positions only, no forces — this is a
   spacing rule, not a physics claim. */
/* ONE number for how fast water gets through the tails, used by every step
   that lets it through. It was 1.0 in osmosis and 0.5 at the channel — the
   same molecule crossing the same bilayer at two speeds, which is a claim
   about the membrane that changes when the tab does. */
const WATER_CORE = 1.0;

/* How fast a walker moves between re-picks, per species class. An ion is
   heavier than water and drags a hydration shell with it, so it is slower —
   and it needs to be visibly slower, because "the ion is stuck at the
   surface" is easier to read when the thing bouncing off is not the fastest
   object on screen. */
const WALK_SPEED = [7, 12];        // water
const ION_SPEED  = [4, 8];

const ION_GAP = 2 * Parts.ION.K.r * Parts.ION.exaggeration + 2.6;
function keepApart(list) {
  const line = list.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 3; pass++)
    for (let i = 1; i < line.length; i++) {
      const d = line[i].y - line[i - 1].y;
      if (d < ION_GAP) {
        const push = (ION_GAP - d) / 2;
        line[i].y += push; line[i - 1].y -= push;
      }
    }
  for (const t of line) t.obj.position.y = t.y;
}

/* Sideways drift for the walkers, reflected inside its box. The box is
   the same one the spawn used, so a water can never wander somewhere it
   was not allowed to start — including into the channel's column, which
   rndClear() keeps it out of (see CHANNEL_KEEPOUT). */
function lateral(t, dt) {
  /* `band` is [xmin, xmax]. Step 2 sorts the three species into columns so
     they stay tellable apart, and an unbounded drift would shuffle them
     back into the snowstorm that layout exists to avoid. */
  const x0 = t.band ? t.band[0] : -SPREAD, x1 = t.band ? t.band[1] : SPREAD;
  t.x += t.vx * dt; t.z += t.vz * dt;
  if (t.x > x1) { t.x = x1; t.vx = -t.vx; }
  if (t.x < x0) { t.x = x0; t.vx = -t.vx; }
  if (t.keepout && Math.abs(t.x) < t.keepout) {
    t.x = Math.sign(t.x || 1) * t.keepout; t.vx = -t.vx;
  }
  if (t.z >  11) { t.z =  11; t.vz = -t.vz; }
  if (t.z < -11) { t.z = -11; t.vz = -t.vz; }
  t.obj.position.x = t.x; t.obj.position.z = t.z;
}

function tumble(t, dt) {
  t.obj.rotation.x += dt * t.spin.x;
  t.obj.rotation.y += dt * t.spin.y;
  t.obj.rotation.z += dt * t.spin.z;
}

/* Where a traveller is allowed to be. The bilayer's interior is oily: a
   charged or strongly polar thing does not enter it, and this is the one
   rule that makes step 2 a demonstration instead of a caption. */
function advance(t, dt) {
  const inCore = Math.abs(t.y) < HALF;
  if (t.blocked) {
    /* Bounces off the head-group layer. Turned back AT the surface, not
       inside it — an ion that penetrates and returns has already told the
       student the interior is negotiable. */
    const edge = HALF + 2.4;
    if ((t.vy < 0 && t.y <= edge && t.y > 0) || (t.vy > 0 && t.y >= -edge && t.y < 0)) t.vy = -t.vy;
  }
  /* A walker re-picks its direction every so often. Nothing in here reads
     the concentration or knows where the solute is — which is the point,
     and is diffusion.js's point too: a crowd spreads out because there are
     more molecules on the crowded side to wander off it, not because
     anything is pulled. */
  if (t.walk && !inCore) {
    /* Re-picks direction only OUTSIDE the bilayer. Inside, it commits.

       Not a fudge — it is what makes the model work at all, and it is
       physically the right shape: the tails are 30 Å of oil, and a molecule
       part-way in has nothing to collide with that would turn it around.
       Letting it flip mid-membrane made a crossing need ~9 s of sustained
       travel against a 0.35 s flip, so in 30 s of running the counters read
       0-3 and the two sides never changed. The step showed nothing. */
    t.since = (t.since || 0) + dt;
    if (t.since > t.flipEvery) {
      t.since = 0;
      t.flipEvery = rnd(0.55, 1.15);
      const sp = t.speed || WALK_SPEED;
      t.vy = (Math.random() < .5 ? -1 : 1) * rnd(sp[0], sp[1]);
      /* Sideways too. The y-walk alone is what the osmosis counter reads,
         but a molecule that only ever moves up and down looks like a bead
         on a wire. The lateral kick is cosmetic by design: it never enters
         the crossing count, and it is re-picked on the same clock so a
         water still commits to one path while it is inside the tails. */
      const lat = (t.speed || WALK_SPEED)[1] * 0.42;
      t.vx = rnd(-lat, lat); t.vz = rnd(-lat * .6, lat * .6);
    }
  }

  if (t.walk) lateral(t, dt);

  t.y += t.vy * dt * (inCore && !t.blocked ? t.coreSpeed || 1 : 1);

  if (t.bounded) {
    const far = OFFSCREEN;
    if (t.y >  far) { t.y =  far; t.vy = -Math.abs(t.vy); }
    if (t.y < -far) { t.y = -far; t.vy =  Math.abs(t.vy); }
    t.obj.position.y = t.y;
    tumble(t, dt);
    return;
  }

  /* No separate box for `blocked` any more: it implies `bounded`, so the
     branch above already reflected it at the frame, and its own ±44 box was
     unreachable for every traveller except one spawn that forgot the flag.
     What kept solute in its compartment was never that box — it is the
     head-group bounce at the top of this function. */

  /* Anything that CAN cross wraps rather than being deleted: a traveller
     that vanishes at the edge reads as being consumed, and nothing here
     consumes anything. */
  if (t.y >  OFFSCREEN) t.y = -OFFSCREEN;
  if (t.y < -OFFSCREEN) t.y =  OFFSCREEN;
  t.obj.position.y = t.y;
  tumble(t, dt);
}

/* ---------------------------------------------------------------------
   The steps.
   --------------------------------------------------------------------- */
let crossings = { up:0, down:0 };

const STEPS = [
  {
    id:'bilayer',
    tab:'the bilayer',
    cap:'Two layers of lipid. <b>Heads like water; tails hide from it.</b> ' +
        'The inside of a membrane is oil.',
    enter() {
      clearTravellers();
      showProtein(null); showMembrane(false); setCut(false);
      /* Water on both sides, so "heads face the water" is something on
         screen rather than a word in the caption.

         It walks and it CROSSES, exactly as water does in every other step.
         Two earlier versions were both wrong: vy:0 left the one step where
         water is the subject as the one step it did not move, and blocking
         it said water cannot get through a bilayer — which is false, and
         which step 3 then spends its whole run contradicting. A student
         who learns "the membrane stops water" here has to unlearn it two
         tabs later, and that is worse than a slightly busier picture. */
      for (let i = 0; i < 64; i++)
        traveller('water', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11),
                             y:(i % 2 ? 1 : -1) * rnd(HALF + 6, 42),
                             vy:(i % 2 ? -1 : 1) * rnd(7, 12),
                             walk:true, bounded:true, coreSpeed:WATER_CORE });
    },
    readout: () => 'bilayer ' + (HALF * 2).toFixed(1) + ' Å thick — measured, not drawn to taste',
  },

  {
    id:'through',
    tab:'what gets through',
    cap:'<b>Oily things cross. Charged things do not.</b> ' +
        'CO₂ is the biggest thing here and goes straight through. ' +
        'Na⁺ is the smallest and cannot.',
    enter() {
      clearTravellers();
      showProtein(null); showMembrane(false); setCut(false);
      /* The two GASES split the width down the middle — O₂ left, CO₂
         right — so the crossings stay tellable apart without leaving dead
         space. Two streams shuffled together is a snowstorm, not a
         comparison; two streams crowded into the left two-thirds is a
         layout the student reads as meaning something. Na⁺ is not banded: it is the one species that does
         NOT cross, and penning it in a column made that look like a
         property of that column rather than of the membrane. Spread the
         full width, the flat sheet of ions stopped at the heads IS the
         claim, and it reads at a glance. */
      let firstO2 = null, firstCO2 = null, firstNa = null;
      for (let i = 0; i < 20; i++) {
        const t = traveller('o2', { x:rnd(-SPREAD, -SPREAD*0.04), z:rnd(-10,10), y:rnd(-40,40), vy:rnd(6,10) });
        if (!i) firstO2 = t;
      }
      for (let i = 0; i < 16; i++) {
        const t = traveller('co2', { x:rnd(SPREAD*0.04, SPREAD), z:rnd(-10,10), y:rnd(-40,40), vy:-rnd(6,10) });
        if (!i) firstCO2 = t;
      }
      for (let i = 0; i < 22; i++) {
        const t = traveller('NA', { x:rnd(-SPREAD, SPREAD), z:rnd(-10,10),
                                    y:rnd(HALF + 5, 40), vy:-rnd(4,8),
                                    walk:true, speed:ION_SPEED,
                                    blocked:true, bounded:true });
        if (!i) firstNa = t;
      }
      /* Just the name. The caption already says which crosses and why, and
         a label repeating it turns three callouts into a second caption
         the student has to read while the thing it names moves. What they
         actually cannot do without this is tell which band is which. */
      noteOn(firstO2,  'O₂',  [-30, -22]);
      noteOn(firstCO2, 'CO₂', [ 28, -24]);
      noteOn(firstNa,  'Na⁺', [ 30, -22]);
    },
    readout: () => 'size is not the rule — the largest crosses, the smallest is turned back',
  },

  {
    id:'osmosis',
    tab:'osmosis',
    cap:'<b>Water crosses both ways, always.</b> ' +
        'Salt is outside the cell, and it holds water, so fewer free ' +
        'molecules are up there — and more wander out than in. Nothing pulls.',
    enter() {
      clearTravellers();
      showProtein(null); showMembrane(false); setCut(false);
      crossings = { up:0, down:0 };
      /* THE NET IS NOT SCRIPTED, and an earlier version of this step got
         that wrong in the exact way LESSONS-ROADMAP.md §2 warns about: it
         gave each water a fixed direction with a 58/42 bias, so "more goes
         down" was typed in rather than shown, and over a long run it
         drifted net UPWARD and contradicted its own caption.

         Now every water walks at random and reads nothing. The only
         asymmetry is the COUNT: solute outside binds water, so there is
         less free water outside than in. More free molecules inside means
         more of them wander out. That is osmosis, and it is why water is
         never "pulled toward solute".

         THE SOLUTE IS OUTSIDE, which is where sodium lives — ~145 mM in
         the extracellular fluid against ~12 mM in the cytosol. It used to
         be drawn below, in the cytoplasm, which is the compartment the
         pump step spends an ATP per turn to keep sodium OUT of. Two tabs
         cannot disagree about which side of a cell the salt is on.

         Closed box, not wrapping: a molecule leaving the bottom and
         reappearing at the top is not a crossing, and it made the counter
         mean nothing. */
      const FREE_INSIDE = 42, FREE_OUTSIDE = 18;   // bottom is the cytosol
      for (let i = 0; i < FREE_INSIDE; i++)
        traveller('water', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11), y:rnd(-42, -HALF-3),
                             walk:true, bounded:true, coreSpeed:WATER_CORE });
      for (let i = 0; i < FREE_OUTSIDE; i++)
        traveller('water', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11), y:rnd(HALF+3, 42),
                             walk:true, bounded:true, coreSpeed:WATER_CORE });
      for (let i = 0; i < 28; i++)
        traveller('NA', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11), y:rnd(HALF+5, 40),
                          vy:(Math.random() < .5 ? -1 : 1) * rnd(4,8),
                          walk:true, speed:ION_SPEED,
                          blocked:true, bounded:true });
    },
    readout: () => `water crossings — out ${crossings.up}, in ${crossings.down}, ` +
                   `net ${crossings.up - crossings.down} outward`,
  },

  {
    id:'channel',
    tab:'a channel',
    cap:'<b>A channel is a hole with a preference.</b> ' +
        'K⁺ leaks out of the cell, down its gradient. Na⁺ and Cl⁻ do not go ' +
        'through at all — and Na⁺ is the smaller ion. The channel picks ' +
        'which, never which way.',
    enter() {
      clearTravellers();
      showProtein(CHANNEL); showMembrane(true); setCut(true);
      T.setGates(1, 1);                 // open through: that IS a channel
      /* Spawned already spaced, and at ONE speed. Random speeds meant the
         fast ones drove into the slow ones and the queue fused into a
         single yellow column — which says two K⁺ can occupy the same
         space, and they are both +1. See keepApart(). */
      /* THE QUEUE RUNS OUTWARD, bottom to top. K⁺ is the INSIDE ion —
         ~140 mM in the cytosol against ~4 mM outside — so a K⁺ channel
         leaks it OUT, down the gradient the pump just paid to build. That
         outward leak is what sets the resting membrane potential, which is
         where this lesson goes next. Running the queue inward drew ions
         flowing up a gradient with nothing pushing them, and contradicted
         the pump two tabs over.

         It starts BELOW the frame and walks in, so the first thing the
         student sees is ions arriving at the channel rather than a column
         that was already there. */
      for (let i = 0; i < 8; i++)
        traveller('K', { x:0, z:0, y:-(OFFSCREEN + i * ION_GAP), vy:11, coreSpeed:1 });

      /* THE ONES THAT DO NOT GET IN. Without them "a hole with a
         preference" is a caption over a picture of a hole: everything on
         screen was going through, so nothing was being preferred.

         Na⁺ is deliberately among them, and it is drawn SMALLER than the
         K⁺ sailing past it. That is the real fact — a potassium channel
         excludes sodium — and it is why this page never draws a
         size-sieve pinch: the filter matches the ion's hydration shell,
         and the smaller ion is the one that cannot be matched. The
         student is not told this here; they are just shown that size is
         not doing the work, which is what stops the wrong rule forming.

         These start ALREADY IN THE SCENE — only the K⁺ queue arrives from
         above. A whole compartment's solute raining in from off-frame
         reads as something being added, and the claim here is about what
         is already sitting against the membrane. */
      for (let i = 0; i < 14; i++)
        traveller('NA', { x:rndClear(SPREAD*0.75), z:rnd(-10,10),
                          y:rnd(HALF + 4, OFFSCREEN * 0.8), vy:-rnd(4,8),
                          walk:true, speed:ION_SPEED, keepout:CHANNEL_KEEPOUT,
                          blocked:true, bounded:true });
      for (let i = 0; i < 10; i++)
        traveller('CL', { x:rndClear(SPREAD*0.75), z:rnd(-10,10),
                          y:rnd(HALF + 4, OFFSCREEN * 0.8), vy:-rnd(4,8),
                          walk:true, speed:ION_SPEED, keepout:CHANNEL_KEEPOUT,
                          blocked:true, bounded:true });
      /* Water stays out of the pore too. It genuinely does cross the
         bilayer, and that is step 3's point, not this one — here it would
         only look like a second thing the channel is passing. */
      for (let i = 0; i < 16; i++)
        traveller('water', { x:rndClear(SPREAD), z:rnd(-11,11),
                             keepout:CHANNEL_KEEPOUT,
                             y:(i % 2 ? 1 : -1) * rnd(HALF + 3, OFFSCREEN * 0.85),
                             vy:(Math.random() < .5 ? -1 : 1) * rnd(7, 12),
                             walk:true, bounded:true, coreSpeed:WATER_CORE });
    },
    readout: () => 'K⁺ out · Na⁺ and Cl⁻ turned away · both ends open at once, which a pump never does',
  },

  {
    id:'pump',
    tab:'the pump',
    cap:'',                             // membrane/pump.js writes this, per phase
    enter() {
      clearTravellers();
      showProtein(PUMP); showMembrane(true); setCut(true);
      /* Parked at the start of the cycle, not looping. A pump that runs
         for free contradicts the one thing this step teaches, and a loop
         with an ATP counter ticking up on its own is worse — it says the
         cell pays whether or not anything asked. The student spends the
         ATP, and one ATP buys exactly one turn. */
      pumpT = 0; running = false;
      spendEl.hidden = false; spendEl.disabled = false;
    },
    readout: () => 'ATP is the battery: it carries three phosphates, and spends one per trip. ' +
                    'Per cycle — 3 Na⁺ out, 2 K⁺ in, 1 ATP.',
  },
];

/* ATP IS NOT AN OBJECT ON STAGE. It was drawn as a body with three beads
   and it did not make sense: at this scale the shape says nothing a
   student can read, and a lilac blob beside a blue protein invites "what
   is that molecule" — a question this step then has to answer instead of
   teaching the pump.

   What matters is the transaction, not the shape, and the student now
   performs it: a chip flies from the Spend button to the pump. */
/* ---- the pump's own actors ---- */
let pumpT = 0, running = false;
const pumpPool = { NA: [], K: [] };
function pumpIon(species, i) {
  const p = pumpPool[species];
  while (p.length <= i) {
    const m = Parts.ion(species);
    /* transparent ONCE, at build. pump.js fades cargo in and out at the
       mouths, and flipping material.transparent per frame recompiles the
       shader — which is a dropped frame exactly at a phase boundary, i.e.
       the flicker. depthWrite stays on: these are solid spheres that are
       briefly faint, not glass. */
    m.material.transparent = true;
    m.material.depthWrite = true;
    m.visible = false; L.root.add(m); p.push(m);
  }
  return p[i];
}
function hidePumpIons() {
  Object.values(pumpPool).forEach(list => list.forEach(m => m.visible = false));
}

/* ---- spending an ATP ----
   The chip flies from the BUTTON to the pump, so the press and the
   phosphate arriving are visibly one event rather than two things that
   happened near each other. It is a DOM chip: it starts on a DOM button,
   and a mesh would have to be born in mid-air with no explanation. */
function flyATP(done) {
  const b = spendEl.getBoundingClientRect();
  const chip = document.createElement('div');
  chip.className = 'fly';
  chip.textContent = 'ATP';
  chip.style.left = (b.left + b.width / 2) + 'px';
  chip.style.top  = (b.top + b.height / 2) + 'px';
  document.body.appendChild(chip);

  /* Where the pump is, in page pixels — projected, so the chip lands on
     the protein wherever the camera has put it. */
  const p = new THREE.Vector3(0, -HALF * 0.6, 0).project(L.camera);
  const r = canvas.getBoundingClientRect();
  const x = r.left + (p.x * .5 + .5) * r.width;
  const y = r.top + (-p.y * .5 + .5) * r.height;

  requestAnimationFrame(() => {
    chip.style.left = x + 'px';
    chip.style.top = y + 'px';
    chip.style.opacity = '0';
  });
  /* Fires on the transition, with a timer as the backstop: a backgrounded
     tab never runs the transition, and the pump must still start. */
  let fired = false;
  const go1 = () => { if (fired) return; fired = true; chip.remove(); done(); };
  chip.addEventListener('transitionend', go1);
  setTimeout(go1, 1000);
}

spendEl.addEventListener('click', () => {
  if (running) return;
  spendEl.disabled = true;
  flyATP(() => { pumpT = 0; running = true; });
});

/* ---- step machinery ---- */
let cur = -1;
STEPS.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = s.tab;
  b.addEventListener('click', () => go(i));
  stepsEl.appendChild(b);
});

function go(i) {
  cur = i;
  const s = STEPS[i];
  hidePumpIons();
  s.enter();
  capEl.innerHTML = s.cap;
  [...stepsEl.children].forEach((b, j) =>
    j === i ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'));
  L.fit();
  /* fit() moves the camera, so the offscreen line is only knowable after
     it. Re-enter the step so its molecules are placed against the frame
     that will actually be drawn. */
  solveOffscreen();
  s.enter();
}

function tick(dt) {
  const s = STEPS[cur]; if (!s) return;
  kit.faceCamera(L.camera);               // badges are sprites; they must turn
  memSolid.tick(dt); memHoled.tick(dt);   // the bilayer is a liquid, so it moves

  if (s.id === 'pump') {
    if (running) {
      pumpT += dt / 11;                 // seconds for one full turn
      if (pumpT >= 1) {                 // one ATP bought exactly one turn
        pumpT = 0; running = false;
        spendEl.disabled = false;
      }
    }
    const st = Pump.at(pumpT);
    T.setGates(st.gates.top, st.gates.bottom);
    hidePumpIons();
    /* FAN THE CARGO ROUND THE AXIS, don't stack it up one.

       membrane/pump.js spreads ions by 0.06-0.09 in normalised units — about 2 A —
       because it works in units and has no idea how big an ion is drawn.
       At this page's exaggeration a K⁺ is 4.5 A across, so the site's two
       ions fused into one blob. The page knows the drawn radius, so the
       page is what solves it.

       Sideways rather than further apart along the path: the site is a
       round pocket and the ions sit BESIDE each other in it. Stacking
       them axially would push one out of the pocket and through the wall
       the moment the gates shut. */
    const used = { NA:0, K:0 };
    const seats = st.cargo.reduce((a, c) => (a[c.species] = (a[c.species] || 0) + 1, a), {});
    for (const c of st.cargo) {
      const i = used[c.species]++;
      const n = seats[c.species];
      const m = pumpIon(c.species, i);
      const rr = n > 1 ? ionRadius(c.species) * 1.15 : 0;
      const th = (i / n) * Math.PI * 2;

      /* u = +-1 is OFF THE FRAME, not the protein's rim.

         Mapping u to T.height put the ends of the journey at the mouths,
         so an ion faded up out of nothing at the lip of the pump and faded
         away again a moment later — which says the pump MAKES sodium and
         then destroys potassium. It carries them; they have to come from
         the solution and go back to it.

         Inside the protein the mapping is unchanged, so the site and the
         funnel still line up with the geometry; beyond the rim it stretches
         out to the edge of the frame. Piecewise, because a single linear
         map to OFFSCREEN would drag the site itself off the mid-plane. */
      const uH = T.height / OFFSCREEN;
      const au = Math.abs(c.u), sgn = Math.sign(c.u) || 1;
      const y = au <= uH
        ? c.u * OFFSCREEN                       // within the protein
        : sgn * (T.height + (au - uH) / (1 - uH) * (OFFSCREEN - T.height));
      m.position.set(Math.cos(th) * rr, y, Math.sin(th) * rr);
      /* HONOUR THE FADE. This used to force opacity 1, which threw away
         the one thing alpha is for: an ion appeared and vanished at full
         strength on the frame a phase changed. That pop is what read as a
         flicker, and it also said the pump makes and destroys ions. */
      m.material.opacity = c.alpha;
      m.visible = c.alpha > 0.01;
    }
    spendEl.hidden = false;

    /* The caption is READ from the cycle. Nothing on this page can say
       the pump is doing something the geometry is not. */
    capEl.innerHTML = running || st.phosphate.on
      ? '<b>' + st.label + '</b> — ' + st.caption
      : '<b>One ATP runs the pump once.</b> Press the button and follow it: ' +
        'three sodiums out, two potassiums in, then it stops.';
  } else {
    spendEl.hidden = true;
    for (const t of travellers) {
      const was = t.y;
      advance(t, dt);
      if (s.id === 'osmosis' && !t.blocked) {
        if (was > 0 && t.y <= 0) crossings.down++;
        if (was < 0 && t.y >= 0) crossings.up++;
      }
    }
    if (s.id === 'channel') keepApart(travellers.filter(t => t.kind === 'K'));
  }
  NOTES.step();                           // trap 1: in the RENDER loop
  readoutEl.textContent = s.readout ? s.readout() : '';
}

go(0);
L.start();
</script>
</body>
</html>
