  /* The pump's own barrel: membrane/parts.js's defaults, and a mouth rather
     than a site for the lumen — the site is the narrowest point and would
     let an ion sit in the funnel wall. */
  { x:0, R:14.5, lumen:7.6, kind:null },
];
let PORES = PORES_CHAN;
/* THE BARREL IS DOMED, NOT A CYLINDER — the same profile membrane/parts.js
   draws, copied because the page cannot ask the mesh. A full-height cylinder
   strands ions on the shoulders: an ion coming down to a mouth has to cross
   the protein's top, and a wall there means the funnel pulls it in while
   this pushes it out and it orbits the corner. The real shape gets out of
   the way — radius falls to zero at the pole over the top 30% — which is
   where the mouth is, and why an approach works at all. */
function poreRadiusAt(P, y) {
  const H = T.height, u = Math.abs(y) / H, cap = 0.30;
  let sc = 1;
  if (u > 1 - cap) {
    const k = (u - (1 - cap)) / cap;           // 0 at the shoulder, 1 at the pole
    sc = Math.sqrt(Math.max(0, 1 - k * k));
  }
  const waist = 1 - 0.07 * Math.exp(-((y / (HALF * 0.8)) ** 2));
  return P.R * sc * waist;
}

function keepOutOfPores(t) {
  if (t.lane != null || t.aboard) return;      // in the file, or riding: it belongs there
  /* THE ION HAS A RADIUS. Test its centre alone and a sphere sits half-buried
     with its middle legally outside. Every bound below is the wall PLUS the
     ion, the vertical test included: a big ion just above the protein's end
     can still dip into the top of it. */
  const rad = bulkRadius(t);
  if (Math.abs(t.y) >= T.height + rad) return; // clear of the protein entirely
  for (const P of PORES) {
    const dx = t.x - P.x, dz = t.z;
    const r = Math.hypot(dx, dz);
    const wall = poreRadiusAt(P, t.y) + rad;
    if (r >= wall) continue;                   // outside the wall
    /* Down the throat of its OWN pore, at a mouth — leave it alone, it is on
       its way in. The test is against the LUMEN PLUS the ion, not minus: an
       ion centred in the mouth is in the mouth, and demanding it clear the
       rim by a whole radius leaves only a bullseye the funnel rarely hits. */
    if (r <= P.lumen + rad && t.conducts === P.x &&
        Math.abs(t.y) > T.height * 0.6) continue;
    const push = r > 0.001 ? wall / r : 1;
    t.x = P.x + dx * push;
    t.z = dz * push;
    if (r <= 0.001) t.x = P.x + wall;         // dead on the axis: pick a side
    t.obj.position.x = t.x; t.obj.position.z = t.z;
    /* Turned away from the wall, so it does not grind along it. */
    t.vx = Math.abs(t.vx) * Math.sign(t.x - P.x || 1);
  }
}

/* HYDRATED IONS DO NOT INTERPENETRATE. A shell is 6 A of water, and two
   overlapping read as one blob with a sign in it — at this step the shells
   ARE the argument.

   Positions only: a spacing rule, not a force. Radii come from bulkRadius(),
   so an ion that has just shed at the mouth immediately needs less room,
   which is exactly right — a stripped ion IS smaller, and that is why it
   fits.

   An ion on final approach is EXEMPT: the funnel aims every candidate at one
   point while this pass shoves them apart, and at the mouth the two cancel
   into a knot that never enters and never leaves. Inside the vestibule
   single file is the right answer anyway, and queueAhead() owns spacing. */
function atMouth(t) {
  return t.conducts != null &&
         Math.hypot(t.x - t.conducts, t.z) < CAPTURE_R * 2 &&
         Math.abs(t.y) < T.height * 1.4;
}
function keepClear(list) {
  for (let pass = 0; pass < 2; pass++)
    for (let i = 0; i < list.length; i++)
      for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j];
        if (atMouth(a) || atMouth(b)) continue;
        const ra = bulkRadius(a), rb = bulkRadius(b);
        const min = ra + rb;
        let dx = b.obj.position.x - a.obj.position.x;
        let dy = b.y - a.y;
        let dz = b.obj.position.z - a.obj.position.z;
        const d2 = dx*dx + dy*dy + dz*dz;
        if (d2 >= min * min || d2 < 1e-6) continue;
        /* A QUEUED ION IS NOT SHOVED OFF ITS LANE — it is in single file
           down a pore, and sideways is the wall. So the free partner takes
           the whole correction; two free ions split it; two queued ions are
           left to the file's own waiting rule, which knows about lanes. */
        const aFree = a.lane == null, bFree = b.lane == null;
        if (!aFree && !bFree) continue;
        const share = (aFree && bFree) ? 0.5 : 1;
        const d = Math.sqrt(d2), push = (min - d) * share / d;
        dx *= push; dy *= push; dz *= push;
        if (aFree) { a.x -= dx; a.y -= dy; a.z -= dz;
                     a.obj.position.set(a.x, a.y, a.z); }
        if (bFree) { b.x += dx; b.y += dy; b.z += dz;
                     b.obj.position.set(b.x, b.y, b.z); }
      }
}

/* Where a traveller is allowed to be. The bilayer's interior is oily: a
   charged or strongly polar thing does not enter it, and this is the one
   rule that makes step 2 a demonstration instead of a caption. */
function advance(t, dt) {
  if (t.conducts != null || t.seeks) { funnel(t, dt); tryCapture(t); }
  if (t.lane != null && tickQueue(t, dt)) return;   // hopping through the filter
  const inCore = Math.abs(t.y) < HALF;
  if (t.blocked) {
    /* Bounces off the head-group layer. Turned back AT the surface, not
       inside it — an ion that penetrates and returns has already told the
       student the interior is negotiable. */
    const edge = HALF + 2.4;
    if ((t.vy < 0 && t.y <= edge && t.y > 0) || (t.vy > 0 && t.y >= -edge && t.y < 0)) t.vy = -t.vy;
  }
  /* A walker re-picks its direction every so often. Nothing in here reads
     the concentration or knows where the solute is — which is the point, and
     diffusion.js's too: a crowd spreads out because there are more molecules
     on the crowded side to wander off it, not because anything is pulled. */
  if (t.walk && !inCore) {
    /* Re-picks direction only OUTSIDE the bilayer. Inside, it commits — the
       tails are 30 Å of oil and a molecule part-way in has nothing to
       collide with that would turn it around. Flipping mid-membrane makes a
       crossing need ~9 s of sustained travel against a 0.35 s flip, so
       almost nothing ever crosses. */
    t.since = (t.since || 0) + dt;
    if (t.since > t.flipEvery) {
      t.since = 0;
      t.flipEvery = rnd(0.55, 1.15);
      /* AN ISOTROPIC DIRECTION, not a coin flip on the sign of vy — that
         reads as bobbing up and down in place. A real walker picks a
         direction on a SPHERE, and a reversal is one outcome among many.

         Uniform via the z-slice method (cos θ uniform in [−1,1]). Picking two
         angles uniformly instead crowds the poles, biasing every molecule
         toward straight up and straight down. */
      repick(t);
    }
  }

  if (t.walk) lateral(t, dt);

  t.y += t.vy * dt * (inCore && !t.blocked ? t.coreSpeed || 1 : 1);

  if (t.bounded) {
    /* `yband` is [lo, hi] — a traveller that belongs to part of a
       compartment rather than all of it. The anions use it to stay deep in
       the cytosol instead of drifting up against the membrane. */
    const far = OFFSCREEN;
    const lo = t.yband ? t.yband[0] : -far, hi = t.yband ? t.yband[1] : far;
    if (t.y > hi) { t.y = hi; t.vy = -Math.abs(t.vy); }
    if (t.y < lo) { t.y = lo; t.vy =  Math.abs(t.vy); }
    t.obj.position.y = t.y;
    tumble(t, dt);
    return;
  }

  /* Anything that CAN cross wraps rather than being deleted: a traveller
     that vanishes at the edge reads as being consumed, and nothing here
     consumes anything. */
  if (t.y >  OFFSCREEN) t.y = -OFFSCREEN;
  if (t.y < -OFFSCREEN) t.y =  OFFSCREEN;
  t.obj.position.y = t.y;
  tumble(t, dt);
}

/* ---------------------------------------------------------------------
   The steps.
   --------------------------------------------------------------------- */
let crossings = { up:0, down:0 };
/* RECENT net, not lifetime. crossings.up/down are running totals that never
   come back down, so an arrow driven from them freezes at "net 41 out" long
   after the two sides have evened up.

   This is the same crossings leaked away over a time constant: every
   crossing adds ±1 and the whole thing decays, so it grows while the
   imbalance is real and fades to nothing once each direction lands as often
   as the other. That is what equilibrium IS — not a flow that switched off,
   but two equal flows — which is why the arrow must be able to disappear on
   its own. */
let netRecent = 0;
const NET_HALFLIFE = 30;                // seconds for a crossing to count half

const STEPS = [
  {
    id:'bilayer',
    tab:'the bilayer',
    cap:'<b>The inside of a membrane is oil.</b>',
    enter() {
      clearTravellers();
      showProtein(null); showMembrane('solid'); setCut(false);
      /* Water on both sides, so "heads face the water" is something on
         screen rather than a word in the caption.

         It walks and it CROSSES, exactly as in every other step. Holding it
         still leaves the one step where water is the subject as the one step
         it does not move; blocking it says water cannot get through a
         bilayer, which is false and which step 3 spends its run
         contradicting. */
      for (let i = 0; i < 64; i++)
        traveller('water', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11),
                             y:inCompartment(i % 2 ? 1 : -1),
                             walk:true, bounded:true, coreSpeed:WATER_CORE });
      /* Two callouts, and only two: a sheet with no protein in it, so the
         step names the two halves of a lipid and stops. "Fluid mosaic"
         belongs on the channel step, where the mosaic is on screen. */
      noteAt(-96, HALF, 'phospholipid heads', [-34, -30],
             'The head carries charge and sits happily in water, so it turns ' +
             'outward on both faces. That is why a bilayer assembles itself ' +
             'and then holds together.');
      noteAt(-96, 0, 'phospholipid tails', [-34, 26],
             'The tails are hydrocarbon and will not mix with water, so they ' +
             'hide in the middle. Everything crossing this membrane has to ' +
             'get through that oil.');
    },
  },

  {
    id:'through',
    tab:'what gets through',
    cap:'<b>Oily things cross. Charged things do not. Size is not the rule.</b>',
    enter() {
      clearTravellers();
      showProtein(null); showMembrane('solid'); setCut(false);
      /* The two GASES split the width down the middle — O₂ left, CO₂ right —
         so the crossings stay tellable apart. Two streams shuffled together
         is a snowstorm, not a comparison. Na⁺ is NOT banded: penning the one
         species that does not cross into a column makes that look like a
         property of the column rather than of the membrane. Spread the full
         width, the flat sheet of ions stopped at the heads IS the claim.

         WATER FIRST, and it is not decoration: "CO₂ dissolves through the
         oil" is a claim about something dissolved IN a liquid, so the liquid
         has to be on screen. Same parameters as the bilayer step, so water
         cannot appear to behave differently once other things are in the
         fluid — but fewer of them, since here it is the solvent the
         comparison happens in and a full crowd buries the three species. */
      for (let i = 0; i < 36; i++)
        traveller('water', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11),
                             y:inCompartment(i % 2 ? 1 : -1),
                             walk:true, bounded:true, coreSpeed:WATER_CORE });

      let firstO2 = null, firstCO2 = null, firstNa = null;
      for (let i = 0; i < 20; i++) {
        const t = traveller('o2', { x:rnd(-SPREAD, -SPREAD*0.04), z:rnd(-10,10),
                                    y:rnd(-farY(), farY()), vy:rnd(6,10) });
        if (!i) firstO2 = t;
      }
      for (let i = 0; i < 16; i++) {
        const t = traveller('co2', { x:rnd(SPREAD*0.04, SPREAD), z:rnd(-10,10),

        if (!i) firstCO2 = t;
      }

         This step's claim is that SIZE is not the rule: CO₂ is the biggest
         thing here and crosses, Na⁺ is the smallest and cannot. Draw every
         sodium inside a six-water cage and it becomes the largest object on
         screen, and the size rule the step exists to kill walks back in. The
         comparison ions stay bare, at their true radius.

         The one that is labelled carries the shell because it answers the

         with the real reason rather than "the middle is oily": crossing
         means stripping that shell off, and hydration enthalpy is large.
         That is the dehydration penalty, and it is the same fact step 4
         leans on when a K⁺ filter excludes the smaller sodium. */
      for (let i = 0; i < 22; i++) {
        const t = traveller('NA', { x:rnd(-SPREAD, SPREAD), z:rnd(-10,10),
                                    y:inCompartment(1),
                                    walk:true, speed:ION_SPEED, shell: i === 0,
                                    blocked:true, bounded:true });
        if (!i) firstNa = t;

      /* Just the name. The caption already says which crosses and why; what

      noteOn(firstO2,  'O₂ — passes through',  [-30, -22],
             'Small and nonpolar, so it dissolves into the oil and out the ' +
             'other side. No protein, no cost, no gate.');
      noteOn(firstCO2, 'CO₂ — passes through', [ 28, -24],
             'The biggest thing on screen, and it crosses as easily as O₂. ' +
             'Being oily beats being small.');
      noteOn(firstNa,  'Na⁺ — can not cross', [ 30, -22],
             'The smallest thing here, and it never gets in: a charged ion ' +
             'holds a shell of water around it. Entering the oil means ' +

  {
    id:'osmosis',
    tab:'osmosis',
    /* "TAKES UP ROOM", never "holds water". The binding story is the usual
       textbook line and it predicts something false: osmotic pressure is
       colligative — it goes with the NUMBER of solute particles, not with

       out-pull a weak one at equal concentration, and it does not. What the
       shells on screen honestly show is the kinetic version: the salt and
       its water occupy space, so a smaller share of what is out there is

    cap:'<b>Water crosses both ways. The net flow is a headcount, not a pull.</b>',
    enter() {
      clearTravellers();
      showProtein(null); showMembrane('solid'); setCut(false);
      crossings = { up:0, down:0 };
      netRecent = 0;
      /* THE NET IS NOT SCRIPTED. Every water walks at random and reads
         nothing. The only asymmetry is the COUNT: the salt outside takes up
         room, so fewer of the things out there are water, and more water
         inside means more of it wanders out. That is osmosis, and it is why
         water is never "pulled toward solute". Bias the directions instead
         and the run can drift the wrong way and contradict its own caption.

         THE SOLUTE IS OUTSIDE, where sodium lives — ~145 mM in the
         extracellular fluid against ~12 mM in the cytosol, and the
         compartment the pump step spends an ATP per turn to keep it out of.
         Two tabs cannot disagree about which side the salt is on.

         Closed box, not wrapping: a molecule leaving the bottom and
         reappearing at the top is not a crossing, and it makes the counter
         mean nothing.

         EQUAL PARTICLES, FEWER WATERS WHERE THE SALT IS. Same volume both
         sides, and every solute particle takes up room a water would
         otherwise occupy — so the salty side holds the same number of THINGS

         from more water toward less water. Balancing TOTAL water instead

         particles and does not care how tightly each one hydrates, so a shell
         is a plausible-looking mechanism for something it does not cause. The
         shells belong to step 2, where they ARE the mechanism.

         A STEEP gradient, not a gentle one, or the two sides meet in the
         middle before the student has read the caption — and the interesting
         part is a strong flow visibly weakening as the difference closes.
         Three to one settles at 52 either side, a number neither compartment
         started with, which is the tell that nothing was scripted. */
      const IONS = 52;                          // 26 Na⁺ + 26 Cl⁻, neutral
      const PARTICLES = 78;                     // per side, same volume
      const FREE_INSIDE = PARTICLES;
      const FREE_OUTSIDE = PARTICLES - IONS;
      for (let i = 0; i < FREE_INSIDE; i++)
        traveller('water', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11), y:inCompartment(-1),
                             walk:true, bounded:true, coreSpeed:WATER_CORE });
      for (let i = 0; i < FREE_OUTSIDE; i++)
        traveller('water', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11), y:inCompartment(1),
                             walk:true, bounded:true, coreSpeed:WATER_CORE });
      /* BOTH IONS, in equal number. Sodium alone leaves the compartment with
         unbalanced positive charge, which is not a solution — and water-lab
         dissolves NaCl into a pair. It also matters to the claim: osmosis
         counts PARTICLES, and NaCl gives two per formula unit. */
      for (let i = 0; i < IONS / 2; i++) {
        traveller('NA', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11), y:inCompartment(1),
                          walk:true, speed:ION_SPEED,
                          blocked:true, bounded:true });
        traveller('CL', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11), y:inCompartment(1),
                          walk:true, speed:ION_SPEED,
                          blocked:true, bounded:true });
      }
      /* ONE callout, in the salty compartment it is about: the step already
         carries two compartment tallies and the net-flow overlay, and more
         labels make it chrome with an animation behind it.

         Near the middle of the top half and held clear of its ceiling — the
         label hangs ABOVE the dot, so a higher anchor runs it off stage. */
      noteAt(-SPREAD * 0.06, farY() * 0.34, 'salt takes up room', [-38, -26],
             'Every solute particle sits where a water would have been, so ' +
             'fewer of the molecules up here are water. This side is ' +
             '<b>hypertonic</b> — more solute, less water.');
    },
  },

  {
    id:'channel',
    tab:'a channel',
    /* THE CAPTION IS THE DEFAULT STATE'S CAPTION. Both switches start off,
       so it describes the plain diffusion picture and points at what each

    cap:'<b>Each channel picks an ion. Neither picks a direction. No energy needed, this is also passive transport</b>',

      for (let i = 0; i < 28; i++)

                          y:inCompartment(1), shell:true,
                          walk:true, speed:ION_SPEED, conducts:LANE,

         tighter-held sodium cannot. That is why this page never draws a
         size-sieve pinch — the exclusion is about what an ion arrives
         WEARING, not what it measures. Na⁺ ARRIVES DRESSED AND STAYS
         DRESSED; both ions come to the mouth wearing a shell and only one

         TURNED AWAY BY BOTH PORES, for two different reasons: the K⁺ filter
         on fit, the Cl⁻ pore on charge, since that lining is δ+ and a cation
         is the wrong sign. It is the one ion on stage going nowhere.

         NO KEEPOUT — it is drawn to a mouth like everything else and turned
         back AT the filter (refuseAt()), so the claim is in the picture and
         not only in the caption. Counts keep the compartment neutral:
         16 K⁺ + 12 Na⁺ against 28 Cl⁻. */
      for (let i = 0; i < 11; i++)
        traveller('NA', { x:rnd(-SPREAD*0.9, SPREAD*0.9), z:rnd(-10,10),
                          y:inCompartment(1), shell:true, seeks:true,
                          walk:true, speed:ION_SPEED,
                          blocked:true, bounded:true });
      /* THE LABELLED ONE IS PLACED, not drawn from the scatter: the
         compartment runs well past the top of the frame, so a random pick
         starts off-screen more often than not. Near the membrane and left of
         the pores — in frame, and already on its way to a mouth. */
      const firstNa = traveller('NA', { x:-SPREAD*0.42, z:rnd(-6,6),
                          y:HALF + 20, shell:true, seeks:true,
                          walk:true, speed:ION_SPEED,
                          blocked:true, bounded:true });
      /* NAME THE TWO PORES. Anchors are fixed points at each mouth, not a
         traveller: the protein does not move, and a label on an ion reads as
         a label FOR that ion. Offsets push the two apart, away from the gap
         between the pores where the queues are. */
      const mouthY = () => T.height * 0.95;
      /* NO DIRECTION IN THE NAME. A label saying "out" states a direction as
         a property of the channel, the exact misconception the caption
         exists to kill — and for chloride it is close to false at rest,
         since E_Cl sits near the resting potential and the net flux stalls.
         Direction is shown where it is honest: the corner tally, counted off
         transits that actually happened. */
      NOTES.add({ text:'K⁺ channel', offset:[-40, -30],
                  at:() => _np.set(-LANE, mouthY(), 0),
                  card:'A water-lined pore straight through, so a K⁺ crosses ' +
                       'without ever touching the oil. It is open, it is ' +
                       'free, and nothing about it is switched on.' });
      NOTES.add({ text:'Cl⁻ channel', offset:[ 40, -30],
                  at:() => _np.set( LANE, mouthY(), 0),
                  card:'Chloride is high outside, so it runs inward — the ' +
                       'opposite way to the K⁺ beside it. Direction is set ' +
                       'by the gradient, never by the protein.' });
      /* FLUID MOSAIC BELONGS HERE, not on the bare sheet. Both halves of
         the name are on screen for the first time: the lipids slide (the
         drift in membrane/parts.js) and there are proteins set into them.
         Anchored well left of the pores so it reads as a fact about the
         SHEET rather than a third label on the channels. */
      NOTES.add({ text:'fluid mosaic', offset:[-44, 44],
                  at:() => _np.set(-150, -HALF, 0),
                  card:'The lipids slide against each other — the sheet is a ' +
                       'liquid, not a wall. <b>Mosaic</b> is these proteins ' +
                       'set into it, drifting in the same liquid.' });
      /* ON AN ION, NOT ON A SPOT. This is the one label naming something
         HAPPENING rather than something built: riding a seeking Na⁺ means
         the student watches the labelled ion go to a mouth and come away. */
      noteOn(firstNa, 'Na⁺ passes neither', [34, -26],
             'Smaller than K⁺, and it still cannot use the K⁺ filter: it ' +
             'holds its water too tightly to trade the shell for the pore. ' +
             'The Cl⁻ pore turns it away on charge.');

      mV = 0; chargeOut = 0; crossed.K = crossed.CL = 0;
      voltBox.checked = voltOn;         // a re-entered step keeps the choice
      /* Water stays out of the pore. It does cross the bilayer, but that is
         step 3's point — here it would look like a second thing the channel
         passes. Enough of it to read as liquid: the ions are what the
         student is following, but a near-empty stage is not a solution. */
      for (let i = 0; i < 34; i++)
        traveller('water', { x:rndClear(SPREAD), z:rnd(-11,11),
                             keepout:CHANNEL_KEEPOUT,
                             y:(i % 2 ? 1 : -1) * rnd(HALF + 3, OFFSCREEN * 0.85),
                             walk:true, bounded:true, coreSpeed:WATER_CORE });
    },
  },

  {
    id:'pump',
    tab:'the pump',
    cap:'',                             // written per phase, below
    enter() {
      clearTravellers();
      showProtein(PUMP); showMembrane('pump'); setCut(true);

      /* THE CELL THE CHANNEL STEP LEFT BEHIND. Same cast and counts —
         16 K⁺, 12 Na⁺, 28 Cl⁻ — but levelled, which is where the previous
         tab ends when nothing opposes the leak. The student has just watched
         channels spend a gradient; this step answers who bought it.

         Levelled also means 0 mV, and that is not a staging choice: with
         equal concentrations there is no diffusion potential to have. */
      const half = (kind, n, opts) => {
        for (let i = 0; i < n; i++)
          traveller(kind, Object.assign({
            x:rndClear(SPREAD*0.75), z:rnd(-10,10),
            y:inCompartment(i % 2 ? 1 : -1),
            shell:true, walk:true, speed:ION_SPEED,
            blocked:true, bounded:true,
          }, opts));
      };
      half('K', 16); half('NA', 12); half('CL', 28);
      /* WATER STAYS OUT OF THE PUMP: a pump that passes water is not a pump,
         and this step's claim is that what crosses is chosen and paid for.
         rndClear() places it clear of the barrel and `keepout` holds it
         there; both read the pore list, which names the pump. */
      for (let i = 0; i < 34; i++)
        traveller('water', { x:rndClear(SPREAD), z:rnd(-11,11),
                             y:inCompartment(i % 2 ? 1 : -1),
                             keepout:CHANNEL_KEEPOUT,
                             walk:true, bounded:true, coreSpeed:WATER_CORE });

      /* Parked at the start of the cycle, not looping: a pump that runs for
         free contradicts the one thing this step teaches. The student spends
         the ATP, and one ATP buys exactly one turn. */
      pumpT = 0; running = false;
      for (const t of travellers) t.aboard = false;
      cargo.NA.length = 0; cargo.K.length = 0; lastPhase = '';
      atpSpent = 0;
      mV = 0; chargeOut = 0; crossed.K = crossed.CL = 0;
      spendEl.hidden = false; spendEl.disabled = false;

      /* STATIC, while the caption runs live off the cycle. These name the
         parts, which do not change — the caption already rewrites itself
         every phase, and that is enough moving text. */
      noteAt(0, T.height * 0.98, 'a carrier, not a pore', [-46, -30],
             'It binds its cargo and changes shape, so it is never open to ' +
             'both sides at once. A pore cannot do that, which is why a ' +
             'pore can never push anything uphill.');
      /* ON THE BUTTON, in pixels — the one anchor here that is not a point
         in the scene, allowed because the claim is about the TRANSACTION the
         button performs, not a part of the protein (see annotate.js). Solved
         each frame from the button's own box, since placeControls() moves it
         whenever the caption changes height. */
      NOTES.add({ text:'1 ATP = 1 turn', offset:[-40, -26],
                  atPx: () => {
                    if (spendEl.hidden) return null;
                    const b = spendEl.getBoundingClientRect();
                    /* The LAYER's box, not the stage's — the layer is the
                       coordinate frame annotate.js places into. */
                    const st = NOTES.el.getBoundingClientRect();
                    return [b.left - st.left + b.width / 2, b.top - st.top];
                  },
                  card:'One press buys one turn: 3 Na⁺ out and 2 K⁺ in, both ' +
                       'against their gradients. Uphill is the thing the ATP ' +
                       'is paying for.' });
    },
  },

  {
    id:'rest',
    tab:'a cell at rest',
    cap:'',                             // written live, below
    enter() {
      clearTravellers();
      showProtein('rest'); showMembrane('rest'); setCut(true);

      /* THE CELL AS IT ACTUALLY IS. A channel and a pump in the same sheet,
         both running, the counts holding still while ATP burns. That
         standing-still is the point, and it is NOT equilibrium: stop paying
         and it comes apart, which is what the switch is for.

         K⁺ mostly inside, where it lives. It leaks out through the channel
         because that is what a gradient does, and the pump brings it back —
         a loop, and the reason the cell never finishes paying.

         Na⁺ inside is the mess: it is on the wrong side and the pump throws
         it out three at a time. Nothing brings it back here, so this half is
         a clean-up rather than a cycle, and the copy does not call it one.

         The ANIONS are why the cytosol can hold all that K⁺ without being
         wildly positive. They never move across; that is their whole
         contribution, and it is a real one. */
      for (let i = 0; i < 20; i++)
        traveller('K', { x:rndClear(SPREAD*0.7), z:rnd(-10,10),
                         y:inCompartment(-1), shell:true,
                         walk:true, speed:ION_SPEED, conducts:-REST_LANE,
                         blocked:true, bounded:true });
      for (let i = 0; i < 4; i++)
        traveller('K', { x:rndClear(SPREAD*0.7), z:rnd(-10,10),
                         y:inCompartment(1), shell:true,
                         walk:true, speed:ION_SPEED, conducts:-REST_LANE,
                         blocked:true, bounded:true });
      for (let i = 0; i < 18; i++)
        traveller('NA', { x:rndClear(SPREAD*0.7), z:rnd(-10,10),
                          y:inCompartment(-1), shell:true,
                          walk:true, speed:ION_SPEED,
                          blocked:true, bounded:true });
      /* DOWN IN THE CYTOSOL, not up against the membrane — protein and
         phosphate anions are the bulk of the interior, not a layer lining
         the surface, and at the inner face they sit exactly where the pump
         and channel are working. `yband` keeps them down. */
      for (let i = 0; i < 24; i++)
        traveller('A', { x:rndClear(SPREAD*0.85), z:rnd(-11,11),
                         y:rnd(-farY(), -farY() * 0.42),
                         yband:[-farY(), -farY() * 0.38],
                         walk:true, speed:[2, 5],       // heavy and slow
                         blocked:true, bounded:true });
      for (let i = 0; i < 28; i++)
        traveller('water', { x:rndClear(SPREAD), z:rnd(-11,11),
                             y:inCompartment(i % 2 ? 1 : -1),
                             keepout:CHANNEL_KEEPOUT,
                             walk:true, bounded:true, coreSpeed:WATER_CORE });

      pumpOn = true; pumpBox.checked = true;
      pumpT = 0; running = false;
      for (const t of travellers) t.aboard = false;
      cargo.NA.length = 0; cargo.K.length = 0; lastPhase = '';
      atpSpent = 0; chargeOut = 0; mV = 0;
      spendEl.hidden = true;

      /* The two proteins, and the loop between them. This is the step where
         both halves of the lesson are on stage at once, so the callouts are
         the ones that say which half is which. */
      noteAt(-REST_LANE, T.height * 0.98, 'K⁺ leaks out, free', [-40, -30],
             'K⁺ is high inside, so it drifts out through the channel and ' +
             'nothing stops it. Downhill costs nothing.');
      noteAt(REST_PUMP_X, T.height * 0.98, 'pumps K⁺ back, paid', [42, -30],
             'The pump carries K⁺ back in and Na⁺ out, burning one ATP a ' +
             'turn. It is undoing the leak next door, over and over.');
      /* ON THE TALLY IT IS ABOUT, in pixels — the corner tallies are chrome,
         not scene (annotate.js's atPx). Anchored in the cytosol it lands on
         a patch of anions and water, and "the counts hold still" points at
         no counts.

         AND IT NAMES K⁺, not "the counts": paintIons() tallies K⁺ and Cl⁻
         only, there is no Cl⁻ in this cast, and the sodium — the most
         visible ion on screen — is not counted at all.

         NO NUMBERS IN THE LABEL. It is pinned to the tally, so a number here
         is the same fact twice and a second copy that can go stale. The
         label says which ion and what it is doing; the tally says how
         many. */
      NOTES.add({
        text:'K⁺ holds', offset:[44, -26],
        atPx: () => {
          if (ionsInEl.hidden || ionsInEl.parentElement.hidden) return null;
          const b = ionsInEl.getBoundingClientRect();
          const st = NOTES.el.getBoundingClientRect();
          return [b.right - st.left, b.top - st.top + b.height / 2];
        },
        card:'Nothing here has settled — a leak and a pump are running flat ' +
             'out and cancelling. Switch the pump off and watch what ' +
             'equilibrium actually looks like.' });
    },
  },
];

/* ATP IS NOT AN OBJECT ON STAGE. At this scale its shape says nothing a
   student can read, and a lilac blob beside the protein invites "what is
   that molecule" — a question the step then has to answer instead of
   teaching the pump. What matters is the transaction, and the student
   performs it: a chip flies from the Spend button to the pump. */
/* ---- the pump's cargo is REAL IONS ----
   A spend RECRUITS travellers out of the solution: the three nearest sodiums
   inside and the two nearest potassiums outside. They are the same objects
   the rest of the page walks around, so setting them down on the far side
   changes the counts, grows the gradient and moves the voltage — the pump
   visibly builds what the channel step spent. A private cargo pool makes
   "3 Na⁺ out, 2 K⁺ in" an animation instead of a result, and leaves the
   corner census standing still.

   membrane/pump.js still owns the choreography — this only decides WHICH
   ions ride it. Nothing here can make the pump open at both ends. */
let pumpT = 0, running = false, atpSpent = 0;
/* THE PUMP RUNS ITSELF at rest, because a resting cell's does. The pump step
   keeps its one-turn-per-press rule — there the transaction is the lesson —
   but here the lesson is the standing cost, and a cost you have to click for
   is not a standing cost. The switch is what makes it visible: turn it off
   and watch the gradient come apart. */
let pumpOn = true;
const cargo = { NA: [], K: [] };
const PUMP_LOAD = { NA:-1, K:1 };       // the side each is picked up from

/* Nearest to the pump's axis, on the required side, not already aboard. */
function recruit(kind, n) {
  const side = PUMP_LOAD[kind];
  const pool = travellers
    .filter(t => t.kind === kind && !t.aboard && Math.sign(t.y) === side)
    .sort((a, b) => ((a.x - pumpX) ** 2 + a.y * a.y) -
                    ((b.x - pumpX) ** 2 + b.y * b.y));
  /* ALL OR NOTHING. The resting step calls this every frame until it gets
     three, so returning a short list with its ions already flagged aboard
     strands them: aboard ions are not advanced, so they freeze in place
     while the next frame grabs more. */
  if (pool.length < n) return [];
  const took = pool.slice(0, n);
  for (const t of took) t.aboard = true;
  return took;
}

/* Where a rider sits this frame. `u` is membrane/pump.js's own coordinate,
   mapped to the PROTEIN rather than to the frame: these ions arrive under
   their own steam and leave the same way, so the ends of the path are the
   two mouths, not the edges of the screen. */
function seatRider(t, c, i, n) {
  const rr = n > 1 ? ionRadius(t.kind) * 1.15 : 0;
  const th = (i / n) * Math.PI * 2;
  const tx = pumpX + Math.cos(th) * rr, tz = Math.sin(th) * rr;
  const ty = c.u * T.height;
  /* Eased, not snapped: a recruit is somewhere in the cytosol when it is
     called, and it has to be seen arriving at the mouth. */
  const k = 0.16;
  t.x += (tx - t.x) * k; t.z += (tz - t.z) * k; t.y += (ty - t.y) * k;
  t.obj.position.set(t.x, t.y, t.z);
}

/* Set down on the FAR side and let go — ONE SPECIES AT A TIME, on the
   cycle's own boundaries: sodium leaves during release-na, potassium during
   release-k. Unloading both at the end of the turn parks the sodium back at
   the mouth it came in by, visibly pushed into the cell it just left. */
function deliver(kind) {
  const to = -PUMP_LOAD[kind];
  for (const t of cargo[kind]) {
    t.aboard = false;
    t.y = to * T.height * 1.15;
    t.x = pumpX + rnd(-18, 18); t.z = rnd(-8, 8);
    t.obj.position.set(t.x, t.y, t.z);
    repick(t);
    t.vy = Math.abs(t.vy) * to;         // moving away from the pump, not into it
  }
  cargo[kind].length = 0;
}
function finishCycle() {
  /* ELECTROGENIC, the number membrane/pump.js calls un-roundable: three
     positive charges out against two in leaves the inside one charge more
     negative every turn. The pump builds part of the voltage, not just the
     concentration gradient. */
  chargeOut += 1;
  mV = Math.max(-95, MV_PER_ION * chargeOut);
  atpSpent++;
}

/* Which phase we were in last frame, so a boundary can be acted on once. */
let lastPhase = '';

/* ---- one frame of the cycle ----
   Shared by the pump step and the resting step. They differ in what STARTS a
   turn — a button there, the pump's own appetite here — and in nothing else,
   which is the point: the machine is the same machine. */
function runPumpCycle(dt) {
  if (running) {
    pumpT += dt / 11;                   // seconds for one full turn
    if (pumpT >= 1) {                   // one ATP bought exactly one turn
      pumpT = 0; running = false;
      deliver('K');                     // the last drop-off of the turn
      finishCycle();
      lastPhase = '';
      spendEl.disabled = false;
    }
  }
  const st = Pump.at(pumpT);
  T.setGates(st.gates.top, st.gates.bottom);

  /* THE HANDOVER, ON THE CYCLE'S OWN BOUNDARY. Sodium is outside by the time
     load-k begins, so that is where it is set down and where the potassium is
     called for — the pump attracts one cargo, carries it, lets it go, and
     only then asks for the next. Reading the boundary off the phase name
     means the page cannot get the order wrong: membrane/pump.js decides when, and this
     only decides who. */
  if (running && st.phase !== lastPhase) {
    if (st.phase === 'load-k') {
      deliver('NA');                    // three sodiums land outside
      cargo.K = recruit('K', 2);        // and only now are two K⁺ called
    }
    lastPhase = st.phase;
  }

  /* FAN THE CARGO ROUND THE AXIS: membrane/pump.js spreads ions in normalised
     units and has no idea how big one is drawn, so at this page's
     exaggeration the site's ions fuse into a blob. Sideways rather than
     further apart along the path — the site is a round pocket and the ions
     sit BESIDE each other in it. */
  const used = { NA:0, K:0 };
  const seats = st.cargo.reduce((a, c) => (a[c.species] = (a[c.species] || 0) + 1, a), {});
  for (const c of st.cargo) {
    const i = used[c.species]++;
    const t = cargo[c.species][i];
    if (!t) continue;                   // nothing recruited: nothing rides
    seatRider(t, c, i, seats[c.species]);
  }
}

/* ---- spending an ATP ----
   The chip flies from the BUTTON to the pump, so the press and the
   phosphate arriving are visibly one event rather than two things that
   happened near each other. It is a DOM chip: it starts on a DOM button,
   and a mesh would have to be born in mid-air with no explanation. */
function flyATP(done) {
  const b = spendEl.getBoundingClientRect();
  const chip = document.createElement('div');
  chip.className = 'fly';
  chip.textContent = 'ATP';
  chip.style.left = (b.left + b.width / 2) + 'px';
  chip.style.top  = (b.top + b.height / 2) + 'px';
  document.body.appendChild(chip);

  /* Where the pump is, in page pixels — projected, so the chip lands on
     the protein wherever the camera has put it. */
  const p = new THREE.Vector3(0, -HALF * 0.6, 0).project(L.camera);
  const r = canvas.getBoundingClientRect();
  const x = r.left + (p.x * .5 + .5) * r.width;
  const y = r.top + (-p.y * .5 + .5) * r.height;

  requestAnimationFrame(() => {
    chip.style.left = x + 'px';
    chip.style.top = y + 'px';
    chip.style.opacity = '0';
  });
  /* Fires on the transition, with a timer as the backstop: a backgrounded
     tab never runs the transition, and the pump must still start. */
  let fired = false;
  const go1 = () => { if (fired) return; fired = true; chip.remove(); done(); };
  chip.addEventListener('transitionend', go1);
  setTimeout(go1, 1000);
}

spendEl.addEventListener('click', () => {
  if (running) return;
  spendEl.disabled = true;
  flyATP(() => {
    /* RECRUITED WHEN THE ATP LANDS, not before, so the press and the loading
       are one event. Each cargo is taken from the side its own gradient
       would carry it AWAY from — that is what "uphill" means, and the whole
       of what a channel cannot do.

       SODIUM ONLY here. The potassium is called at the load-k boundary, when
       the pump has turned and has somewhere to put it: gathering both up
       front holds five ions at once, which is not what the site does. */
    cargo.NA = recruit('NA', 3);
    pumpT = 0; running = true; lastPhase = '';
  });
});

/* ---- the osmosis overlay ----
   EVERY NUMBER HERE IS COUNTED, not typed. The free-water totals are the
   travellers actually on each side this frame, so they drift as water
   crosses and the two sides converge on their own — which is the point of
   the step, and a pair of typed constants would flatly contradict it the
   moment one molecule moved. */
const _op = new THREE.Vector3();
function paintOsmo() {
  /* "water", not "free water": with no shells on this step there is no bound
     water to distinguish it from. */
  let inside = 0, outside = 0;
  for (const t of travellers) {
    if (t.kind !== 'water') continue;
    if (t.y < 0) inside++; else outside++;
  }
  osmoOutEl.firstElementChild.textContent = outside;
  osmoInEl.firstElementChild.textContent = inside;

  /* THE WORD IS READ FROM THE COUNT, like every other number on this page.
     A typed "hypertonic" is a claim nothing checks, and it is WRONG by the
     end of the run — the two sides finish isotonic.

     Tonicity is a RELATION between two solutions, not a property one of them
     owns: the same salt water is hypertonic to a cell and hypotonic to
     seawater. The labels flip to "isotonic" together, because neither side
     can be it alone. */
  const gap = outside - inside;
  const tone = Math.abs(gap) <= 3 ? ['isotonic', 'isotonic']
             : gap < 0 ? ['hypertonic', 'hypotonic']   // less water outside
                       : ['hypotonic', 'hypertonic'];
  setHTML(osmoOutEl.lastElementChild, 'water · outside<br><em>' + tone[0] + '</em>');
  setHTML(osmoInEl.lastElementChild, 'water · inside<br><em>' + tone[1] + '</em>');

  /* Where the membrane is IN PIXELS. Projected rather than assumed: the
     chrome reserve pushes world y=0 above the centre of the canvas, and a
     tally hard-coded to 25%/75% of the box sits in the wrong compartment
     at some window sizes. */
  const r = canvas.getBoundingClientRect();
  const mid = _op.set(0, 0, 0).project(L.camera);
  const midY = (1 - (mid.y * .5 + .5)) * r.height;
  const x = r.width * 0.20;
  osmoOutEl.style.left = osmoInEl.style.left = x + 'px';
  osmoOutEl.style.top = clampY(midY * 0.5, 70) + 'px';
  osmoInEl.style.top = clampY(midY + (r.height - midY) * 0.5, 70) + 'px';

  /* The arrow states the NET, and only once the net has said something: at
     0-1 crossings it would spin on every molecule and read as the sim
     guessing. It points the way the counter went — nothing tells it which
     way osmosis "should" go. */
  const net = netRecent;
  const on = Math.abs(net) >= 3;
  /* FADES WITH THE NET, from a floor high enough to stay legible: the
     conclusion visibly weakens as the sides even up and goes out when they
     have, without dropping to an opacity that reads as a rendering fault.
     Keep the ramp tied to NET_HALFLIFE — a longer half-life settles
     netRecent proportionally larger, and a stale divisor pins the arrow at
     full strength, which is the frozen arrow the decay exists to fix. */
  osmoArrowEl.style.opacity =
    on ? Math.min(0.95, 0.62 + Math.abs(net) / (NET_HALFLIFE * 6)) : 0;
  if (on) {
    /* up = out of the cell. The SVG is drawn pointing up, so a downward
       net flips it rather than being drawn twice. */
    osmoArrowG.setAttribute('transform', net > 0 ? '' : 'rotate(180 23 75)');
    osmoNetEl.textContent = 'net ' + Math.abs(net).toFixed(0) + (net > 0 ? ' out' : ' in');
  }
  osmoArrowEl.style.left = (r.width * 0.78) + 'px';
  osmoArrowEl.style.top = midY + 'px';
}

/* THE BAND THE OVERLAYS MAY USE. Their vertical placement is solved from the
   projected membrane, which knows nothing about the caption floating over the
   bottom of the stage, so a low tally lands behind the text. */
function clampY(y, pad) {
  const top = pad, bot = canvas.clientHeight - chromeEl.offsetHeight - pad;
  return Math.max(top, Math.min(bot, y));
}

/* ---- the voltage overlay ----
   NO CHARGE SKINS. Rows of + and − along the faces are a bar gauge drawn
   with characters: it looks like a COUNT and is not one, so a student can
   count eighteen pluses beside a tally reading a different number. The two
   tallies carry the fact, and the caption carries the surface part in
   words. */
function paintVolt() {
  const r = canvas.getBoundingClientRect();
  const mid = _op.set(0, 0, 0).project(L.camera);
  const midY = (1 - (mid.y * .5 + .5)) * r.height;
  const face = _op.set(0, HALF, 0).project(L.camera);
  const faceY = (1 - (face.y * .5 + .5)) * r.height;
  const half = Math.max(6, Math.abs(midY - faceY));

  /* BOTH NUMBERS ARE COUNTED: the voltage is MV_PER_ION times the transits
     that actually happened, and the transit count is those transits — the
     second number is the first one's working.

     THE UNIT RIDES THE NUMBER. Two 46px figures stacked in one overlay read
     as one instrument in one unit, so "mV" belongs in the figure, not in the
     12px label under it. The label is for what the number measures. */
  setHTML(voltReadEl.firstElementChild, Math.round(mV) + '<small> mV</small>');
  /* "balanced", not "stopped". At equilibrium the pore is still open and
     ions still move through it both ways — what has gone is the NET, and
     "stopped" teaches that the channel shut. Name the ion, too: "leaking"
     names none and reads as a fault. */
  const stepId = STEPS[cur] && STEPS[cur].id;
  setHTML(voltReadEl.lastElementChild, 'inside<br><em>' +
    (stepId === 'rest'
      ? (pumpOn ? 'held by the pump' : 'running down')
      : stepId === 'pump'
      ? (atpSpent ? atpSpent + ' ATP spent building this' : 'nothing spent yet')
      : drive('K') <= 0.001 ? 'balanced · no net flow' : 'K⁺ still leaving') + '</em>');
  setHTML(voltRefEl.firstElementChild, '0<small> mV</small>');
  setHTML(voltRefEl.lastElementChild, 'outside<br><em>reference</em>');

  /* An arrow PER CURRENT, pointing the way that ion actually went — up is
     out of the cell, down is in, the page's convention throughout. The two
     are read from the transits and always add to the total beside them. */
  setHTML(voltCountEl, stepId === 'rest'
    ? '<span>ATP spent</span><b>' + atpSpent + '</b> · ' +
      'Na⁺ ↑ ' + (atpSpent * 3) + ' · K⁺ ↓ ' + (atpSpent * 2)
    : stepId === 'pump'
    ? '<span>carried uphill</span><b>' + (atpSpent * 5) + '</b> · ' +
      'Na⁺ ↑ ' + (atpSpent * 3) + ' · K⁺ ↓ ' + (atpSpent * 2)
    : '<span>ions crossed</span><b>' + chargeOut + '</b> · ' +
      'K⁺ ↑ ' + crossed.K + ' · Cl⁻ ↓ ' + crossed.CL);

  /* THE VOLTAGE SITS INSIDE, the BOTTOM half — the pump's u = −1 is the
     cytoplasmic mouth and every other step follows it. Drawn above the
     membrane, a label reading "mV inside" sits in the one place it is not
     true.

     THE VOLTAGE PAIR ON THE LEFT, THE TALLY ON THE RIGHT. The mV reading and
     its 0 mV reference are one measurement across the membrane, so they face
     each other on one axis. The transit count is a running total of events,
     so it sits well clear and cannot read as a third value in that
     comparison. */
  const x = r.width * 0.17;
  voltReadEl.style.left = voltRefEl.style.left = x + 'px';
  voltReadEl.style.top = clampY(midY + half + 74, 64) + 'px';   // inside, below
  voltRefEl.style.top  = clampY(midY - half - 74, 64) + 'px';   // outside, above
  /* No positioning: pinned to the stage's bottom-right corner in CSS, not
     solved against the membrane, because it measures nothing about a side. */
}

/* ---- the ion census ----
   COUNTED OFF THE TRAVELLERS, every frame, by which side of the membrane
   each one is actually on — including the ones currently in a pore, which
   belong to whichever side they have reached. Nothing here knows what the
   starting numbers were, so the two corners cannot disagree with the scene
   they are describing. */
function paintIons() {
  const n = { out:{ K:0, CL:0 }, in:{ K:0, CL:0 } };
  for (const t of travellers) {
    if (t.kind !== 'K' && t.kind !== 'CL') continue;
    n[t.y >= 0 ? 'out' : 'in'][t.kind]++;
  }
  const line = c => '<b>K⁺ ' + c.K + '</b> · <b>Cl⁻ ' + c.CL + '</b>';
  setHTML(ionsOutEl, '<span>outside</span>' + line(n.out));
  setHTML(ionsInEl, line(n.in) + '<span>inside</span>');
}

/* ---- has it arrived? ----
   TWO MODES, TWO EQUILIBRIA, and saying which is the point of the badge.
   With no voltage the flow stops when the concentrations level: chemical
   equilibrium, gradient spent. With the voltage it stops far earlier, at
   the point where the electrical pull cancels the concentration push —
   electrochemical equilibrium, and the gradient is still standing, which
   is the whole reason the cell has something to spend later.

   Read off the same state the traffic reads, so the badge cannot claim an
   equilibrium over a pore that is still passing ions. */
function equilibrium() {
  /* Not "no current" — two currents that cancel. */
  if (voltOn) return Math.abs(netPush()) < 0.04;
  return crowdedSide('K') === 0 && crowdedSide('CL') === 0;
}
function paintEqBadge() {
  const on = equilibrium();
  eqBadgeEl.classList.toggle('is-on', on);
  if (on) {
    /* TWO DIFFERENT EQUILIBRIA, and the word alone cannot tell them apart.
       With no voltage it is a DIFFUSION equilibrium: concentrations level,
       stored energy gone. With the voltage it is an ELECTROCHEMICAL one,
       and only for the two ions that have pores — the gradient survives,
       which is why the cell still has something to spend. Neither means the
       cell is finished; both mean it has finished LEAKING. */
    eqBadgeEl.firstElementChild.textContent = voltOn
      ? 'K⁺ and Cl⁻ at equilibrium'
      : 'Concentrations at equilibrium';
    eqBadgeEl.lastElementChild.textContent = voltOn
      ? 'two currents cancelling · the gradient survives'
      : 'levelled out · the stored gradient is gone';
  }
}

/* THE CONTROLS SIT ON TOP OF THE CHROME, whose height is whatever the
   tallest caption made it. Measured rather than typed: a fixed bottom offset
   is correct for exactly one caption length and wrong for the rest, and it is
   the kind of wrong that only shows up on one tab. */
function placeControls() {
  const h = chromeEl.offsetHeight;
  ctlEl.style.bottom = (h + 10) + 'px';
  spendEl.style.bottom = (h + 56) + 'px';
  /* The bottom-corner readouts clear the chrome too — at a fixed offset from
     the stage's edge they land under the caption. */
  ionsInEl.style.bottom = (h + 12) + 'px';
  voltCountEl.style.bottom = (h + 12) + 'px';
}

/* WRITE ONLY ON CHANGE. Assigning innerHTML rebuilds the node's children, so
   reassigning the same string sixty times a second reflows and flickers.
   Every live caption on this page goes through here. */
function setHTML(el, html) {
  if (el._html !== html) { el._html = html; el.innerHTML = html; }
}

/* ---- step machinery ---- */
let cur = -1;
STEPS.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = s.tab;
  b.addEventListener('click', () => go(i));
  stepsEl.appendChild(b);
});

function go(i) {
  cur = i;
  const s = STEPS[i];
  s.enter();
  setHTML(capEl, s.cap);
  [...stepsEl.children].forEach((b, j) =>
    j === i ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'));
  L.fit();
  liftScene();
  /* fit() moves the camera, so the offscreen line is only knowable after
     it. Re-enter the step so its molecules are placed against the frame
     that will actually be drawn. */
  solveOffscreen();
  s.enter();
  /* GLOBAL MEANS EVERY STEP: enter() has just built a fresh cast of
     travellers that know nothing about the setting. Applied here, once — a
     step that has to remember to ask is a step where the corner switch
     silently stops working. */
  setShells(shellsOn);
  /* SHOWN ONLY WHERE IT DOES SOMETHING, asked of the CAST rather than a list
     of step ids, so a step that gains or loses its shelled ions cannot fall
     out of sync. The bilayer draws no ions and osmosis draws them
     deliberately bare, so there the switch would visibly do nothing. */
  shellsTogEl.hidden = !travellers.some(
    t => t.obj.userData.shell && t.obj.userData.shell.length);
}

function tick(dt) {
  const s = STEPS[cur]; if (!s) return;
  kit.faceCamera(L.camera);               // badges are sprites; they must turn
  /* Only the sheet on stage: stirring the hidden ones is work nobody sees,
     and they are most of the lipid in the scene. */
  MEM.tick(dt);                           // the bilayer is a liquid, so it moves

  if (s.id === 'rest') {
    /* THE PUMP FEEDS ITSELF HERE. It re-arms the moment a turn ends, so long
       as the switch is on and there is sodium inside to carry — no button,
       because the point is that this never stops while the cell is alive. */
    if (pumpOn && !running && cargo.NA.length === 0) {
      const got = recruit('NA', 3);
      if (got.length) { cargo.NA = got; pumpT = 0; running = true; lastPhase = ''; }
    }
    runPumpCycle(dt);

    for (const t of travellers) if (!t.aboard) advance(t, dt);
    keepClear(travellers.filter(t => (ELEMENT_OF[t.kind] || t.kind === 'A') && !t.aboard));
    for (const t of travellers) keepOutOfPores(t);

    setHTML(capEl, pumpOn
      ? '<b>Even at rest, a cell constantly uses energy to maintain the proper flow of ions that is key to their function.</b>'
      : '<b>The pump is off — watch the counts level and the voltage fade.</b>');
  } else if (s.id === 'pump') {
    runPumpCycle(dt);
    /* Everything NOT aboard is ordinary solution and keeps walking — the pump
       is a machine standing in a crowd, not the only thing on stage. */
    for (const t of travellers) if (!t.aboard) advance(t, dt);
    keepClear(travellers.filter(t => ELEMENT_OF[t.kind] && !t.aboard));
    for (const t of travellers) keepOutOfPores(t);
    spendEl.hidden = false;

    /* The caption is READ from the cycle. Nothing on this page can say the
       pump is doing something the geometry is not. */
    const stc = Pump.at(pumpT);
    setHTML(capEl, running || stc.phosphate.on
      ? '<b>' + stc.label + '</b> — ' + stc.caption
      : '<b>Active transport uses ATP to move substances against their concentration gradient through membrane pumps. </b>');
  } else {
    spendEl.hidden = true;
    for (const t of travellers) {
      const was = t.y;
      advance(t, dt);
      if (s.id === 'osmosis' && !t.blocked) {
        if (was > 0 && t.y <= 0) { crossings.down++; netRecent -= 1; }
        if (was < 0 && t.y >= 0) { crossings.up++;   netRecent += 1; }
      }
    }
    if (s.id === 'osmosis')
      netRecent *= Math.pow(0.5, dt / NET_HALFLIFE);
    if (s.id === 'channel') {
      /* WALL EXCLUSION RUNS LAST. keepClear() pushes ions apart by moving
         them and knows nothing about the proteins, so run first it undoes
         the wall correction with a neighbour's shove. Whatever moves a
         traveller last decides where it is, so the hardest constraint has to
         be the final word. */
      keepClear(travellers.filter(t => ELEMENT_OF[t.kind]));
      for (const t of travellers) keepOutOfPores(t);
      /* WHERE THE COAT COMES OFF: at the mouth, not in the middle — an ion
         that sheds halfway down has already entered the filter wearing a
         shell that does not fit. Read off the protein's own height, so
         resizing the transporter cannot strand the moment above it. */
      const mouth = T.height * 0.9;
      for (const t of travellers) {
        if (!shellsOn) continue;
        /* An ion that has LEFT the pore still has a shell to get back, and
           it is no longer in a lane. Gate this on `lane` alone and every
           conducted ion stays stripped, wandering the cytosol as a bare
           charge — which nothing in a cell is. */
        if (t.lane == null && !t.shellOff) continue;
        if (!t.shellOff && Math.abs(t.y) < mouth) shedShell(t);
        /* Re-dressed on the far side: the ion pays the shell to get through
           and the solution it arrives in repays it. Whichever way it was
           travelling — the K⁺ queue runs out, the Cl⁻ queue in — so "past
           the mouth" is about DISTANCE from the membrane, not sign. */
        else if (t.shellOff && Math.abs(t.y) > mouth) growShell(t);
      }
    }
    tickShells(dt);
  }
  /* CHROME BELONGS OUT HERE, past the per-step branches above: a toggle
     hidden inside one branch stays on screen over the steps that return
     early. */
  placeControls();
  /* Hidden where the row would be empty — an empty pill row still reserves
     height and reads as a control that failed to load. */
  ctlEl.hidden = s.id !== 'channel' && s.id !== 'rest';
  /* THE CHANNEL STEP'S SWITCH, AND ONLY ITS. The potential is in play on
     both protein steps whether or not anyone asks — the pump moves charge
     every turn, and a resting cell has a voltage by definition — so there is
     nothing there to decide, and a dead control in a row of live ones
     invites a click that does nothing. Both steps print the mV on stage,
     which says the potential is in play better than a greyed tick would.

     voltOn is NOT forced here. Nothing downstream reads the box — the
     resting step's physics asks for the potential by name, see
     potentialOn() — and re-entering the channel step restores the student's
     own choice. */
  voltBox.parentElement.hidden = s.id !== 'channel';
  voltBox.parentElement.classList.remove('is-fixed');
  voltBox.disabled = false;
  /* The pump switch is the resting step's whole argument — stop paying and
     watch it come apart — so it belongs nowhere else. On the pump step the
     button already is the switch. */
  pumpBox.parentElement.hidden = s.id !== 'rest';
  /* THE SAME INSTRUMENTS AS THE CHANNEL STEP, deliberately: the student
     watched these numbers fall, the pump step is them going back up, and a
     second set of readouts would hide that it is the same quantity. */
  ionsEl.hidden = s.id !== 'channel' && s.id !== 'pump' && s.id !== 'rest';
  if (!ionsEl.hidden) paintIons();
  if (s.id === 'channel') paintEqBadge();      // a pumped cell is never at one
  else eqBadgeEl.classList.remove('is-on');
  voltEl.hidden = (s.id === 'pump' || s.id === 'rest') ? false
                : s.id !== 'channel' || !voltOn;
  if (!voltEl.hidden) paintVolt();
  NOTES.step();                           // trap 1: in the RENDER loop
  osmoEl.hidden = s.id !== 'osmosis';
  if (!osmoEl.hidden) paintOsmo();
}

go(0);
L.start();
</script>
</body>
</html>
