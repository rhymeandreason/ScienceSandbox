<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The membrane — what gets through, and what it costs</title>
<link rel="stylesheet" href="sandbox.css">
<style>
  html,body { height:100%; margin:0; }
  #page { display:flex; flex-direction:column; height:100vh; }
  #stage { position:relative; flex:1 1 auto; min-height:0; }
  canvas { width:100%; height:100%; display:block; }

  /* The chrome is ONE block at the bottom. kit/fit.js is told its height in
     pixels, so the camera frames the scene above it rather than behind it. */
  #chrome { flex:0 0 auto; padding:10px 18px 16px; text-align:center; }
  #cap { font-size:17px; line-height:1.35; min-height:2.6em;
         max-width:46em; margin:0 auto 10px; }
  #cap b { font-weight:600; }
  #readout { font-size:13px; opacity:.7; min-height:1.2em; margin:-6px 0 8px; }

  #steps { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  #steps button {
    font:inherit; font-size:13px; padding:7px 13px; border-radius:999px;
    border:1px solid rgba(0,0,0,.18); background:transparent; cursor:pointer;
    opacity:.55;
  }
  #steps button[aria-current=step] { opacity:1; font-weight:600;
    border-color:#2a7a6a; box-shadow:inset 0 0 0 1px #2a7a6a; }
  #steps button:hover { opacity:.85; }

  @media (max-width:920px){
    #cap { font-size:15px; }
    #steps button { padding:6px 10px; font-size:12px; }
  }
</style>
</head>
<body>
<div id="page">
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="chrome">
    <p id="cap"></p>
    <p id="readout"></p>
    <nav id="steps" aria-label="lesson steps"></nav>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="palette.js"></script>
<script src="molecules.js"></script>
<script src="mol-small.js"></script>
<script src="atomkit.js"></script>
<script src="scene.js"></script>
<script src="fx.js"></script>
<script src="kit/motion.js"></script>
<script src="kit/focus.js"></script>
<script src="kit/fit.js"></script>
<script src="kit/stagekit.js"></script>
<script src="membrane/parts.js"></script>
<script src="membrane/pump.js"></script>
<script>
'use strict';
/* =====================================================================
 *  membrane-lab.html — the bilayer, what crosses it, and what a crossing
 *  costs.
 *
 *  LESSONS-ROADMAP.md §2's conflict, in its own words: the bilayer drawn
 *  "as two rows of lollipops, at a geometry and scale that are simply
 *  false, proteins drawn as beans wedged in", and water movement drawn
 *  three contradictory ways. This page keeps the lollipops — they are how
 *  a student recognises a membrane — and fixes the two things that were
 *  actually wrong with them: the thickness is the one OPM measured off a
 *  real structure (membrane/tools/bake-pump.js), and nothing crosses
 *  without a reason the student has been shown.
 *
 *  THE ARC. Five steps, and each one exists to break a specific wrong
 *  idea:
 *    1 the bilayer      it is not a wall, it is oil with wet ends
 *    2 what gets through  "the membrane lets small things through" — no:
 *                       it lets OILY things through, and size is second
 *    3 osmosis          water crosses BOTH ways always; the net is the
 *                       only thing that ever changes
 *    4 a channel        a hole does not choose a direction. Down only.
 *    5 the pump         to go the other way, something has to pay
 *
 *  Steps 1-4 are click-driven, one beat each. Step 5 loops, because it is
 *  a cycle and a cycle shown once is a sequence.
 *
 *  NO SIDEBAR. All chrome is one block at the bottom, and its height in
 *  pixels goes to kit/fit.js, so the camera frames the scene above the
 *  words instead of behind them.
 * ===================================================================== */

const canvas = document.getElementById('c');
const capEl = document.getElementById('cap');
const readoutEl = document.getElementById('readout');
const stepsEl = document.getElementById('steps');
const chromeEl = document.getElementById('chrome');

const HALF = 15.3;                      // OPM's half-thickness, from the bake

/* The bilayer runs off both edges of the frame on purpose. A membrane with
   visible ends is a raft, and a student asks what is holding it together;
   a real one has no edge anywhere near the scale of one protein. The
   camera frames `boxes` below, not the lipids, so widening this overflows
   the view instead of zooming out to fit.

   Sized for a WIDE viewport. The fit is driven by height, so on a 21:9
   window the camera sees far more world horizontally than vertically, and
   150 left the bilayer ending mid-screen. Instances are free here — one
   draw call per leaflet either way — so this is set past the widest
   plausible window rather than tuned to one. */
const MEM_REACH = 340;

/* How far out molecules are scattered. Tied to the membrane's own reach
   rather than typed twice: the bilayer now runs off both edges, and a
   dozen molecules clustered in the middle of it read as a nearly empty
   cell with a crowd at the origin. */
const SPREAD = MEM_REACH * 0.55;

const L = Lesson.create(canvas, {
  cam:{ theta:0, phi:Math.PI/2 - 0.10, r:150 }, fx:false,
  rMin:50, rMax:400,
  reservePx: () => ({ bottom: chromeEl.offsetHeight + 14 }),
  boxes: () => ([{ x:0, y:0, rxz:60, hy:34 }]),
  frame: dt => tick(dt),
});
L.renderer.localClippingEnabled = true;

/* ---- the membrane ----
   TWO of them, and it is not duplication: steps 1-3 have no protein, and
   a membrane with a protein-shaped hole in it and no protein reads as a
   torn membrane. That is a worse lie than the cost of a second instance,
   because a student's first question becomes "what made the gap". Solid
   for the passive steps, holed once there is something standing in it. */
const memSolid = Parts.membrane({ half:HALF, reach:MEM_REACH });
const memHoled = Parts.membrane({ half:HALF, reach:MEM_REACH, exclude:(x,z) => Math.hypot(x,z) - 15.0 });
memHoled.group.visible = false;
L.root.add(memSolid.group, memHoled.group);
function showMembrane(withHole) {
  memSolid.group.visible = !withHole;
  memHoled.group.visible = withHole;
}

/* The cut belongs to the steps with a protein in them, and only those.
   Steps 1-3 are ABOUT the intact bilayer; slicing it there would answer a
   question nobody has asked yet. From step 4 the protein is the subject
   and its lumen is the whole point — uncut, the ions are sealed inside an
   opaque shape and the student is asked to take the pore on faith.

   The plane is the membrane's own (it laid the slab out, so it knows which
   axis is thin); the protein borrows it so one cut governs the scene. */
function setCut(on) {
  memHoled.cut.enable(on);
  for (const P of [CHANNEL, PUMP]) {
    P.mesh.material.clippingPlanes = on ? [memHoled.cut.plane] : [];
    P.mesh.material.side = on ? THREE.DoubleSide : THREE.FrontSide;
    P.mesh.material.needsUpdate = true;
  }
}

/* TWO proteins, and an earlier version had one — "same object, different
   gate rule" is a tidy line and it is wrong. A channel and a pump differ
   in the gates AND in how tightly the path holds an ion, and the second
   difference is why the first one matters: a channel conducts millions of
   ions a second BECAUSE its pore does not grip, and a pump manages a
   hundred BECAUSE its site does. Drawn at one width, the channel looked
   like a pump that had forgotten to close, and the ions queued through a
   pore they visibly did not fit.

   So the channel gets a wide pore and the pump a snug site. The gates
   still carry the argument; the width is what makes each of them the kind
   of protein it is. */
const CHANNEL = Parts.transporter({ half:HALF, site:7.2, mouth:8.8 });
const PUMP    = Parts.transporter({ half:HALF });
CHANNEL.group.visible = PUMP.group.visible = false;
L.root.add(CHANNEL.group, PUMP.group);
let T = PUMP;                                   // whichever is on stage
function showProtein(which) {
  CHANNEL.group.visible = which === CHANNEL;
  PUMP.group.visible    = which === PUMP;
  if (which) T = which;
}

/* ---------------------------------------------------------------------
   Small molecules. Real specs, not spheres — water, O2 and CO2 are in
   mol-small.js with measured geometry, and this page's whole claim in
   step 2 is about what those molecules ARE. Spheres would have made
   "oily slips through, charged does not" an assertion.

   TWO SCALINGS, both declared. molecules.js builds at MolLib.SCALE, so a
   molecule comes out ~1.9x its angstroms while parts.js works in raw
   angstroms; dividing puts them in one frame. Then everything crossing
   is enlarged by the SAME factor the ions already use, because a true
   3 A water against a 30 A membrane is a speck.
   --------------------------------------------------------------------- */
const SCALE = MolLib.SCALE || 1.9;
/* One exaggeration for everything that crosses, declared here rather than
   taken from parts.js: this page's stage is ~300 A wide so that the bilayer
   can run off both edges, and at parts.js's 2.6 an oxygen is about three
   pixels. Raising the single factor scales molecules, ions and their charge
   badges together, so every relative size on stage stays honest — only the
   comparison against the MEMBRANE is exaggerated, and the membrane is the
   one thing here whose size is measured and printed. */
const EXAG = 5.0;

/* ONE SIZE CONVENTION FOR EVERYTHING ON STAGE.

   molecules.js sizes atoms from PALETTE.radii; parts.js sizes ions from
   Shannon radii. Mixed, Na⁺ drew LARGER than O₂ — so step 2, whose whole
   claim is "charge stops it, not size", was showing a big sodium bouncing
   off and a small oxygen slipping through. It taught a size rule.

   Ions now take their radius from the same palette, through the same
   multiplier the molecule groups get, so every object in the scene is
   comparable and CO₂ is visibly the biggest thing that crosses. */
const ELEMENT_OF = { NA:'Na', K:'K', CL:'Cl', MG:'Mg' };
function ionRadius(kind) {
  const el = ELEMENT_OF[kind] || kind;
  const r = MolLib.PALETTE.radii[el];
  if (r == null) throw new Error('membrane-lab: no palette radius for ' + el);
  return r * (EXAG / SCALE);
}

/* Charge is a BADGE, not a size. atomkit draws the same +/− disc the
   bonding lessons use, so an ion means the same thing on every page. */
const kit = AtomKit.create(THREE);
function chargedIon(kind) {
  const g = new THREE.Group();
  g.add(Parts.ion(kind, { radius: ionRadius(kind) }));
  const el = ELEMENT_OF[kind] || kind;
  /* atomkit sizes badges for the bonding pages, where a handful of atoms
     fill the screen. Here they ride an ion drawn EXAG/SCALE bigger, so the
     badge and its shoulder offset are scaled by the same factor — matched
     to the ion rather than enlarged on its own. */
  const k = EXAG / SCALE;
  const b = kit.charge(kind === 'CL' ? '−' : '+',
                       '#' + Parts.ION[kind].color.toString(16).padStart(6, '0'), el, k);
  b.userData.base.multiplyScalar(k);
  b.userData.lift *= k;
  b.position.copy(b.userData.base);
  g.add(b);
  return g;
}

function smallMolecule(name) {
  const spec = MolLib.MOLECULES[name];
  if (!spec) throw new Error('membrane-lab: no spec named ' + name);
  const g = Stage.buildMolecule(spec, { center:true });
  g.scale.setScalar(EXAG / SCALE);
  return g;
}

/* ---------------------------------------------------------------------
   Travellers — one pool, reused by steps 2 and 3. Each carries where it
   is going and how fast, and NOTHING else: a traveller does not know
   which step it is in, so a step cannot leave one behind.
   --------------------------------------------------------------------- */
const travellers = [];
function traveller(kind, opts) {
  const o = Object.assign({ x:0, z:0, y:0, vy:0, blocked:false }, opts);
  const obj = (kind === 'NA' || kind === 'K' || kind === 'CL')
    ? chargedIon(kind) : smallMolecule(kind);
  obj.position.set(o.x, o.y, o.z);
  L.root.add(obj);
  const t = Object.assign({ kind, obj }, o);
  travellers.push(t);
  return t;
}
function clearTravellers() {
  for (const t of travellers) L.root.remove(t.obj);
  travellers.length = 0;
}
const rnd = (a, b) => a + Math.random() * (b - a);

/* An x well clear of the protein's column. Anything that is NOT going
   through the channel has to be somewhere the student cannot read as
   going through it: an ion bouncing at the head layer directly above the
   pore is standing inside the protein's upper barrel, and water crossing
   the lipid at x=0 looks like water using the pore. Both made step 4 read
   as "everything gets through", which is the opposite of its claim. */
const CHANNEL_KEEPOUT = 26;
function rndClear(span) {
  const x = rnd(CHANNEL_KEEPOUT, span);
  return Math.random() < .5 ? -x : x;
}

/* Ions in single file do not touch. They are all +1, so they repel — and
   in a real K⁺ channel they queue with a water molecule between each pair,
   which is roughly this gap. Spawning them spaced is not enough on its own:
   any drift in speed closes the line up over a few seconds, so a cheap
   relaxation pass keeps it open. Positions only, no forces — this is a
   spacing rule, not a physics claim. */
const ION_GAP = 2 * Parts.ION.K.r * Parts.ION.exaggeration + 2.6;
function keepApart(list) {
  const line = list.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 3; pass++)
    for (let i = 1; i < line.length; i++) {
      const d = line[i].y - line[i - 1].y;
      if (d < ION_GAP) {
        const push = (ION_GAP - d) / 2;
        line[i].y += push; line[i - 1].y -= push;
      }
    }
  for (const t of line) t.obj.position.y = t.y;
}

/* Where a traveller is allowed to be. The bilayer's interior is oily: a
   charged or strongly polar thing does not enter it, and this is the one
   rule that makes step 2 a demonstration instead of a caption. */
function advance(t, dt) {
  const inCore = Math.abs(t.y) < HALF;
  if (t.blocked) {
    /* Bounces off the head-group layer. Turned back AT the surface, not
       inside it — an ion that penetrates and returns has already told the
       student the interior is negotiable. */
    const edge = HALF + 2.4;
    if ((t.vy < 0 && t.y <= edge && t.y > 0) || (t.vy > 0 && t.y >= -edge && t.y < 0)) t.vy = -t.vy;
  }
  /* A walker re-picks its direction every so often. Nothing in here reads
     the concentration or knows where the solute is — which is the point,
     and is diffusion.js's point too: a crowd spreads out because there are
     more molecules on the crowded side to wander off it, not because
     anything is pulled. */
  if (t.walk && !inCore) {
    /* Re-picks direction only OUTSIDE the bilayer. Inside, it commits.

       Not a fudge — it is what makes the model work at all, and it is
       physically the right shape: the tails are 30 Å of oil, and a molecule
       part-way in has nothing to collide with that would turn it around.
       Letting it flip mid-membrane made a crossing need ~9 s of sustained
       travel against a 0.35 s flip, so in 30 s of running the counters read
       0-3 and the two sides never changed. The step showed nothing. */
    t.since = (t.since || 0) + dt;
    if (t.since > 0.8) { t.since = 0; t.vy = (Math.random() < .5 ? -1 : 1) * rnd(7, 12); }
  }

  t.y += t.vy * dt * (inCore && !t.blocked ? t.coreSpeed || 1 : 1);

  if (t.bounded) {
    const far = 44;
    if (t.y >  far) { t.y =  far; t.vy = -Math.abs(t.vy); }
    if (t.y < -far) { t.y = -far; t.vy =  Math.abs(t.vy); }
    t.obj.position.y = t.y;
    t.obj.rotation.y += dt * 0.6;
    return;
  }

  if (t.blocked) {
    /* A blocked traveller STAYS IN ITS COMPARTMENT, so it reflects at the
       far edge instead of wrapping. Wrapping sent solute off the bottom
       and back in at the top — the membrane held every ion at the heads,
       and then one strolled across the sky anyway. In osmosis that is not
       a cosmetic escape: "solute cannot cross" is the entire reason the
       net flow exists, and one ion crossing unmakes the step. */
    const far = 44;
    if (t.y >  far) { t.y =  far; t.vy = -Math.abs(t.vy); }
    if (t.y < -far) { t.y = -far; t.vy =  Math.abs(t.vy); }
    t.obj.position.y = t.y;
    return;
  }

  /* Anything that CAN cross wraps rather than being deleted: a traveller
     that vanishes at the edge reads as being consumed, and nothing here
     consumes anything. */
  if (t.y > 46) t.y = -46;
  if (t.y < -46) t.y = 46;
  t.obj.position.y = t.y;
  t.obj.rotation.y += dt * 0.6;
  t.obj.rotation.x += dt * 0.4;
}

/* ---------------------------------------------------------------------
   The steps.
   --------------------------------------------------------------------- */
let crossings = { up:0, down:0 };

const STEPS = [
  {
    id:'bilayer',
    tab:'the bilayer',
    cap:'Two layers of lipid. <b>Heads like water; tails hide from it.</b> ' +
        'The inside of a membrane is oil.',
    enter() {
      clearTravellers();
      showProtein(null); showMembrane(false); setCut(false);
      /* Water on both sides, so "heads face the water" is something on
         screen rather than a word in the caption. */
      for (let i = 0; i < 64; i++)
        traveller('water', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11),
                             y:(i % 2 ? 1 : -1) * rnd(HALF + 6, 42), vy:0, blocked:true });
    },
    readout: () => 'bilayer ' + (HALF * 2).toFixed(1) + ' Å thick — measured, not drawn to taste',
  },

  {
    id:'through',
    tab:'what gets through',
    cap:'<b>Oily things cross. Charged things do not.</b> ' +
        'CO₂ is the biggest thing here and goes straight through. ' +
        'Na⁺ is the smallest and cannot.',
    enter() {
      clearTravellers();
      showProtein(null); showMembrane(false); setCut(false);
      /* Kept in bands so the three species stay tellable apart — all three
         shuffled across the width is a snowstorm, not a comparison. */
      for (let i = 0; i < 20; i++)
        traveller('o2', { x:rnd(-SPREAD, -SPREAD*0.15), z:rnd(-10,10), y:rnd(-40,40), vy:rnd(6,10) });
      for (let i = 0; i < 16; i++)
        traveller('co2', { x:rnd(-SPREAD*0.12, SPREAD*0.35), z:rnd(-10,10), y:rnd(-40,40), vy:-rnd(6,10) });
      for (let i = 0; i < 22; i++)
        traveller('NA', { x:rnd(SPREAD*0.4, SPREAD), z:rnd(-10,10),
                          y:rnd(HALF + 5, 40), vy:-rnd(7,11), blocked:true });
    },
    readout: () => 'size is not the rule — the largest crosses, the smallest is turned back',
  },

  {
    id:'osmosis',
    tab:'osmosis',
    cap:'<b>Water crosses both ways, always.</b> ' +
        'Solute below holds water, so fewer free molecules are down there — ' +
        'and more wander down than up. Nothing pulls.',
    enter() {
      clearTravellers();
      showProtein(null); showMembrane(false); setCut(false);
      crossings = { up:0, down:0 };
      /* THE NET IS NOT SCRIPTED, and an earlier version of this step got
         that wrong in the exact way LESSONS-ROADMAP.md §2 warns about: it
         gave each water a fixed direction with a 58/42 bias, so "more goes
         down" was typed in rather than shown, and over a long run it
         drifted net UPWARD and contradicted its own caption.

         Now every water walks at random and reads nothing. The only
         asymmetry is the COUNT: solute below binds water, so there is less
         free water below than above. More free molecules above means more
         of them wander down. That is osmosis, and it is why water is never
         "pulled toward solute".

         Closed box, not wrapping: a molecule leaving the bottom and
         reappearing at the top is not a crossing, and it made the counter
         mean nothing. */
      const FREE_ABOVE = 42, FREE_BELOW = 18;
      for (let i = 0; i < FREE_ABOVE; i++)
        traveller('water', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11), y:rnd(HALF+3, 42),
                             walk:true, bounded:true, coreSpeed:1.0 });
      for (let i = 0; i < FREE_BELOW; i++)
        traveller('water', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11), y:rnd(-42, -HALF-3),
                             walk:true, bounded:true, coreSpeed:1.0 });
      for (let i = 0; i < 28; i++)
        traveller('NA', { x:rnd(-SPREAD,SPREAD), z:rnd(-11,11), y:rnd(-40,-HALF-5),
                          vy:rnd(-2,2), blocked:true, bounded:true });
    },
    readout: () => `water crossings — down ${crossings.down}, up ${crossings.up}, ` +
                   `net ${crossings.down - crossings.up} downward`,
  },

  {
    id:'channel',
    tab:'a channel',
    cap:'<b>A channel is a hole with a preference.</b> ' +
        'K⁺ goes through. Na⁺ and Cl⁻ do not — and Na⁺ is the smaller ion. ' +
        'It picks which, never which way.',
    enter() {
      clearTravellers();
      showProtein(CHANNEL); showMembrane(true); setCut(true);
      T.setGates(1, 1);                 // open through: that IS a channel
      /* Spawned already spaced, and at ONE speed. Random speeds meant the
         fast ones drove into the slow ones and the queue fused into a
         single yellow column — which says two K⁺ can occupy the same
         space, and they are both +1. See keepApart(). */
      for (let i = 0; i < 6; i++)
        traveller('K', { x:0, z:0, y:44 - i * ION_GAP, vy:-11, coreSpeed:1 });

      /* THE ONES THAT DO NOT GET IN. Without them "a hole with a
         preference" is a caption over a picture of a hole: everything on
         screen was going through, so nothing was being preferred.

         Na⁺ is deliberately among them, and it is drawn SMALLER than the
         K⁺ sailing past it. That is the real fact — a potassium channel
         excludes sodium — and it is why this page never draws a
         size-sieve pinch: the filter matches the ion's hydration shell,
         and the smaller ion is the one that cannot be matched. The
         student is not told this here; they are just shown that size is
         not doing the work, which is what stops the wrong rule forming. */
      for (let i = 0; i < 14; i++)
        traveller('NA', { x:rndClear(SPREAD*0.75), z:rnd(-10,10),
                          y:rnd(HALF + 4, 42), vy:-rnd(6,10), blocked:true, bounded:true });
      for (let i = 0; i < 10; i++)
        traveller('CL', { x:rndClear(SPREAD*0.75), z:rnd(-10,10),
                          y:rnd(HALF + 4, 42), vy:-rnd(6,10), blocked:true, bounded:true });
      /* Water stays out of the pore too. It genuinely does cross the
         bilayer, and that is step 3's point, not this one — here it would
         only look like a second thing the channel is passing. */
      for (let i = 0; i < 16; i++)
        traveller('water', { x:rndClear(SPREAD), z:rnd(-11,11),
                             y:(i % 2 ? 1 : -1) * rnd(HALF + 5, 42),
                             walk:true, bounded:true, coreSpeed:0.5 });
    },
    readout: () => 'K⁺ through · Na⁺ and Cl⁻ turned away · both ends open at once, which a pump never does',
  },

  {
    id:'pump',
    tab:'the pump',
    cap:'',                             // pump.js writes this, per phase
    loops:true,
    enter() {
      clearTravellers();
      showProtein(PUMP); showMembrane(true); setCut(true);
      pumpT = 0;
    },
    readout: () => '3 Na⁺ out, 2 K⁺ in, 1 ATP — uphill, and paid for',
  },
];

/* ---- the pump's own actors ---- */
let pumpT = 0;
const pumpPool = { NA: [], K: [] };
function pumpIon(species, i) {
  const p = pumpPool[species];
  while (p.length <= i) { const m = Parts.ion(species); m.visible = false; L.root.add(m); p.push(m); }
  return p[i];
}
function hidePumpIons() {
  Object.values(pumpPool).forEach(list => list.forEach(m => m.visible = false));
}

/* ---- step machinery ---- */
let cur = -1;
STEPS.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = s.tab;
  b.addEventListener('click', () => go(i));
  stepsEl.appendChild(b);
});

function go(i) {
  cur = i;
  const s = STEPS[i];
  hidePumpIons();
  s.enter();
  capEl.innerHTML = s.cap;
  [...stepsEl.children].forEach((b, j) =>
    j === i ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'));
  L.fit();
}

function tick(dt) {
  const s = STEPS[cur]; if (!s) return;
  kit.faceCamera(L.camera);               // badges are sprites; they must turn
  memSolid.tick(dt); memHoled.tick(dt);   // the bilayer is a liquid, so it moves

  if (s.id === 'pump') {
    pumpT += dt / 13;                   // seconds per cycle
    const st = Pump.at(pumpT);
    T.setGates(st.gates.top, st.gates.bottom);
    hidePumpIons();
    /* FAN THE CARGO ROUND THE AXIS, don't stack it up one.

       pump.js spreads ions by 0.06-0.09 in normalised units — about 2 A —
       because it works in units and has no idea how big an ion is drawn.
       At this page's exaggeration a K⁺ is 4.5 A across, so the site's two
       ions fused into one blob. The page knows the drawn radius, so the
       page is what solves it.

       Sideways rather than further apart along the path: the site is a
       round pocket and the ions sit BESIDE each other in it. Stacking
       them axially would push one out of the pocket and through the wall
       the moment the gates shut. */
    const used = { NA:0, K:0 };
    const seats = st.cargo.reduce((a, c) => (a[c.species] = (a[c.species] || 0) + 1, a), {});
    for (const c of st.cargo) {
      const i = used[c.species]++;
      const n = seats[c.species];
      const m = pumpIon(c.species, i);
      const rr = n > 1 ? ionRadius(c.species) * 1.15 : 0;
      const th = (i / n) * Math.PI * 2;
      m.position.set(Math.cos(th) * rr, c.u * T.height, Math.sin(th) * rr);
      m.visible = c.alpha > .02;
      m.material.transparent = c.alpha < 1;
      m.material.opacity = c.alpha;
    }
    /* The caption is READ from the cycle. Nothing on this page can say
       the pump is doing something the geometry is not. */
    capEl.innerHTML = '<b>' + st.label + '</b> — ' + st.caption;
  } else {
    for (const t of travellers) {
      const was = t.y;
      advance(t, dt);
      if (s.id === 'osmosis' && !t.blocked) {
        if (was > 0 && t.y <= 0) crossings.down++;
        if (was < 0 && t.y >= 0) crossings.up++;
      }
    }
    if (s.id === 'channel') keepApart(travellers.filter(t => t.kind === 'K'));
  }
  readoutEl.textContent = s.readout ? s.readout() : '';
}

go(0);
L.start();
</script>
