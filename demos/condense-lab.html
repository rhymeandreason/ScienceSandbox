<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building Big Molecules — Kodolab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="main.css">          <!-- design system: tokens, type, buttons -->
<link rel="stylesheet" href="sandbox.css">
<style>
  /* Layout is molecule-builder.html's, deliberately: this is the lesson that
     comes after it, and a student who has built a bond by hand should find the
     same desk when they come back to build a polymer. The card strip, the notes
     rail, the toast and the dock are that page's, trimmed to what this one uses
     (no 2D/3D switch — a condensation is a motion between two molecules, and
     flattening it would lose the face the linkage leaves on). */

  /* ---------- goal cards, top-center: one per lesson, as a dealt hand ---- */
  #goals{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:12;
    display:flex;gap:0;align-items:stretch;padding:10px 6px 12px}
  .goal{text-align:center;background:#f7f2e7;border:none;
    border-radius:3px 4px 3px 4px;padding:10px 12px 12px;min-width:150px;max-width:196px;
    font-family:inherit;cursor:pointer;
    box-shadow:0 1px 1px rgba(43,39,35,.16), 0 3px 5px -2px rgba(43,39,35,.20),
      0 12px 20px -14px rgba(43,39,35,.55);
    transition:background .13s ease,transform .13s ease,box-shadow .13s ease}
  .goal + .goal{margin-left:-14px}
  /* separates the two sugars from the amino acids: same reaction, different
     class of molecule, and the gap is the only thing saying so */
  .goal[data-lesson="peptide"]{margin-left:20px}
  .goal{--tilt:0deg;--dy:0px;transform:translateY(var(--dy)) rotate(var(--tilt))}
  .goal:nth-child(5n+1){--tilt:-0.7deg;--dy:2px}
  .goal:nth-child(5n+2){--tilt:0.5deg; --dy:4px}
  .goal:nth-child(5n+3){--tilt:-0.3deg;--dy:0px}
  .goal:hover{background:#fbf7ee;z-index:2}
  .goal:not(.on):hover{animation:cardLift .26s cubic-bezier(.32,.72,.4,1) forwards}
  @keyframes cardLift{
    0%  {transform:translateY(var(--dy))              rotate(var(--tilt))}
    55% {transform:translateY(calc(var(--dy) - 7px))  rotate(var(--tilt))}
    100%{transform:translateY(calc(var(--dy) - 4px))  rotate(var(--tilt))}}
  .goal.on{background:#fffdf7;z-index:3;
    transform:translateY(calc(var(--dy) - 5px)) rotate(0deg);
    box-shadow:0 2px 2px rgba(43,39,35,.14), 0 8px 14px -6px rgba(43,39,35,.30),
      0 22px 30px -18px rgba(43,39,35,.55)}
  .goal .gname{font-family:var(--font-slab);font-size:18px;line-height:1.1;color:#a19686}
  .goal .gform{font-family:var(--font-sans);font-weight:700;font-size:15px;
    color:#b9ae9d;margin-top:8px}
  .goal:hover .gname{color:#6f6557}
  .goal.on .gname{color:var(--ink)}
  .goal.on .gform{color:var(--muted)}
  .goal.done{background:#f2f7f1}
  .goal.done.on{background:#f8fcf7}
  .goal.done .gname,.goal.done.on .gname{color:#2e8b57}

  /* ---------- notes: the left rail, earned on completion ---------------- */
  #notes{position:absolute;left:26px;top:200px;z-index:11;width:216px;
    display:none;opacity:0;transition:opacity .25s ease}
  #notes.show{display:block;opacity:1}
  #notes .ntitle{font-family:var(--font-marker);font-size:22px;color:var(--ink);
    line-height:1.1;margin-bottom:7px}
  #notes .ntags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
  #notes .ntag{font-weight:700;font-size:10px;letter-spacing:.7px;text-transform:uppercase;
    padding:3px 7px;border-radius:5px;border:1.5px solid var(--ink);background:#fff;color:var(--ink)}
  #notes .ntag.covalent{background:#e8e2d4}
  #notes .ntag.sugar{background:#f6dcb4}
  #notes .ntag.protein{background:#cfe4f2}
  #notes .ntag.alpha{background:#f7d9d0}
  #notes .ntag.beta{background:#d6e8d4}
  #notes .ntag.schematic{background:#eceae4;color:var(--muted);border-color:var(--hair)}
  #notes ul{list-style:none;margin:0;padding:0}
  #notes li{font-family:var(--font-sans);font-size:15px;line-height:1.32;
    color:var(--ink);padding-left:13px;position:relative;margin-bottom:4px}
  #notes li::before{content:'·';position:absolute;left:2px;top:-2px;color:var(--muted);
    font-weight:700;font-size:22px;line-height:1}
  #notes li b{font-weight:600}

  /* ---------- feedback toast ---------------------------------------------- */
  #say{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);z-index:12;
    pointer-events:none;text-align:center;width:min(760px,86%);opacity:0;
    font-family:var(--font-sans);font-size:21px;line-height:1.35;color:var(--muted)}
  #say b{font-weight:600;color:var(--ink)}
  #say.show{animation:sayFade 3.4s ease-out forwards}
  @keyframes sayFade{
    0%{opacity:0;transform:translateX(-50%) translateY(6px)}
    9%{opacity:1;transform:translateX(-50%) translateY(0)}
    78%{opacity:1;transform:translateX(-50%) translateY(0)}
    100%{opacity:0;transform:translateX(-50%) translateY(4px)}}

  #dock{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:12;
    display:flex;align-items:center;gap:22px}
  #dock button.act{font-family:var(--font-sans);font-weight:600;font-size:13px;
    padding:8px 14px;border:1.5px solid var(--ink);border-radius:8px;
    background:#fff;color:var(--ink);cursor:pointer;
    box-shadow:0 5px 16px -8px rgba(0,0,0,.4)}
  #dock button.act:hover{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="goals"></div>
    <div id="notes" aria-live="polite"></div>
    <div id="say" aria-live="polite"></div>

    <div id="dock">
      <button class="act" id="clearmol">Reset</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="palette.js"></script>
<script src="tokens-from-palette.js"></script>
<script src="molecules.js"></script>
<script src="skel.js"></script>
<script src="mol-monomers.js"></script>
<script src="mol-pathways.js"></script>
<script src="mol-contrast.js"></script>
<script src="scene.js"></script>
<script src="fx.js"></script>
<script src="kit/motion.js"></script>
<script src="kit/leaving.js"></script>
<script src="condense/frame.js"></script>
<script src="condense-drag.js"></script>
<script>
"use strict";
/* =============================================================
 *  BUILDING BIG MOLECULES — one reaction, three cards
 *
 *  molecule-builder.html ends with a finished molecule. This page starts with
 *  two of them and asks what it costs to join them, which is the question every
 *  macromolecule in the course is an answer to.
 *
 *  Cellulose / Starch .. the SAME reaction on two reagents. β-glucose gives
 *                        cellobiose, α-glucose gives maltose, and the only
 *                        difference is which side of the ring C1's oxygen sits
 *                        on. Two cards rather than one with a switch, because
 *                        they are two molecules — see the tray note below.
 *  Peptide ............. the same table again on a different pair of groups.
 *                        If a student sees that the sugar card and this one are
 *                        the same move, the page has done its job.
 *
 *  All chemistry is in condense-drag.js and in the specs' own `condense:`
 *  blocks; this file is UI. It narrates what the hands did and prints what the
 *  molecules say — every name, formula and configuration below is read from a
 *  spec at render time, never typed (CLAUDE.md).
 * ============================================================= */

const canvas=document.getElementById('gl');
/* NO ORBIT, and the camera is face-on. dna-lab.html's step 1 settled this for
   the same reason: the pointer moves a MOLECULE, and a molecule is dragged in
   one plane. Let the view turn and that plane turns with it, so pieces that
   were reachable a moment ago are suddenly separated along the view axis by
   more than the acceptor's capture radius — a card where dragging silently
   stops working, with nothing on screen to say why.

   Face-on also costs nothing here: each spec's `view:` is already baked into
   its meshes by buildMolecule, so the chair a student sees is the angle the
   molecule declares rather than one this page picked. */
const { scene, camera, renderer, root, cam, applyCam, resize } =
  Stage.create(canvas, { cam:{ theta:0, phi:Math.PI/2, r:24 }, rMax:220,
                         orbit:false });
const FXi=FX.create(THREE, root, camera);
const motion=Motion.create();

const elNotes=document.getElementById('notes');
const elSay=document.getElementById('say');
const elGoals=document.getElementById('goals');

/* The lesson table. A card is a RECIPE plus which reagent it opens on — the
   two sugar cards run one recipe and differ only by that index, which is the
   same statement the chemistry makes. `notes` is the keyword card a student
   earns by finishing; facts that name a molecule pull it from the spec. */
const LESSONS={
  cellulose:{ recipe:'sugar', donor:0,
    name:'Cellulose',
    tags:['sugar','covalent','beta'],
    lead:'<b>β</b>-glucose donates. Bring the ringed oxygen to the ringed carbon.',
    facts:m=>[
      'A <b>glycosidic bond</b>: two sugars joined through one oxygen.',
      'The bridge leaves C1 <b>equatorial</b> — straight out, in the ring plane.',
      'Chain these and the backbone stays flat. Cellulose ribbons stack into '
      + 'fibres no human enzyme opens. <b>Wood is glucose we cannot reach.</b>' ] },
  starch:{ recipe:'sugar', donor:1,
    name:'Starch',
    tags:['sugar','covalent','alpha'],
    lead:'<b>α</b>-glucose donates this time — the same reaction on a different '
       + 'molecule. Watch which way C1’s oxygen points.',
    facts:m=>[
      'The same <b>glycosidic bond</b>, built from the other anomer.',
      'The bridge leaves C1 <b>axial</b> — down, out of the ring plane.',
      'Chain these and the backbone has to curl: starch coils into a helix '
      + 'loose enough for amylase to reach into. <b>Bread is food.</b>' ] },
  peptide:{ recipe:'peptide', donor:0,
    name:'Peptide',
    tags:['protein','covalent','schematic'],
    lead:'Carboxyl to amino — the same reaction again, on a different pair of groups.',
    facts:m=>[
      'A <b>peptide bond</b>: the carboxyl keeps its carbon, the amino its nitrogen.',
      'It is drawn at <b>1.33 Å</b>, not an amine’s 1.47: the carbonyl’s electrons '
      + 'spread over it, which is why a peptide bond cannot twist.',
      'Repeat it a few hundred times and the chain is a <b>protein backbone</b>.' ] },
};

let key='cellulose', drag=null, earned={};

/* ---- the card strip, built from the table so it cannot list a card the
   page will not run ---------------------------------------------------- */
/* The card's second line is the LINKAGE, read off the product spec rather than
   typed. Two reasons it is not "α-glucose + α-glucose": only the DONOR's anomer
   decides the bond — both sugar cards accept onto an ordinary β-glucose, which
   is what maltose's own spec builds at its reducing end — and a typed label is
   a claim nothing checks, which is how it came to say the wrong thing here in
   the first place. */
function subOf(L){
  const R=CondenseDrag.RECIPES[L.recipe];
  const prodKey=R.donors[L.donor||0].product;
  const prod=prodKey && MolLib.MOLECULES[prodKey];
  if(prod && prod.glycosidic)
    return `${prod.glycosidic.config==='alpha'?'α':'β'}-${prod.glycosidic.link||'1→4'} linkage`;
  return 'peptide bond';
}
elGoals.innerHTML=Object.entries(LESSONS).map(([k,L])=>
  `<button class="goal${k===key?' on':''}" data-lesson="${k}">`
  + `<div class="gname">${L.name}</div><div class="gform">${subOf(L)}</div></button>`).join('');

function say(html){ elSay.innerHTML=html; elSay.classList.remove('show');
  void elSay.offsetWidth; elSay.classList.add('show'); }

/* Notes are printed from the spec, so a re-baked molecule cannot leave the
   keyword card claiming something the geometry no longer does. */
function showNotes(s){
  const L=LESSONS[key];
  const prod=s.product ? MolLib.MOLECULES[s.product] : null;
  const title=prod ? prod.name : 'Dipeptide';
  const tags=L.tags.slice();
  elNotes.innerHTML=
    `<div class="nblock"><div class="ntitle">${title}</div>`
    + `<div class="ntags">${tags.map(t=>`<span class="ntag ${t}">${t}</span>`).join('')}</div>`
    + `<ul>${L.facts(s).map(f=>`<li>${f}</li>`).join('')}</ul></div>`;
  elNotes.classList.add('show');
}
function hideNotes(){ elNotes.classList.remove('show'); }

let last={};
function report(s){
  if(s.joined && !last.joined){
    const prod=s.product ? MolLib.MOLECULES[s.product] : null;
    fit();                              // the subject is one molecule now
    say(prod ? `<b>${prod.name}</b> — and one water left to pay for it.`
             : `A <b>peptide bond</b> — and one water left to pay for it.`);
    showNotes(s);
    earned[key]=true;
    document.querySelector(`.goal[data-lesson="${key}"]`).classList.add('done');
  } else if(!s.joined && !earned[key]){
    hideNotes();
  }
  last=s;
}

/* ---- mounting a card -------------------------------------------------- */
/* The two rails and the card strip sit OVER the canvas, so the molecules have
   to be framed into what is left. Stage.frame solves against world extents, not
   pixels, so the chrome is converted once here: a rail is a fraction of the
   canvas width, and a box widened by that fraction is a box the rail cannot
   cover. Read from the stylesheet's own numbers via getBoundingClientRect, so
   moving a rail in CSS re-frames the scene instead of quietly cropping it. */
function chromePad(){
  const w=canvas.clientWidth||1, h=canvas.clientHeight||1;
  const railW=elNotes.classList.contains('show')
    ? elNotes.getBoundingClientRect().width+34 : 0;
  const stripH=elGoals.getBoundingClientRect().height+30;
  // both rails can be up at once, so the usable width loses the wider one twice
  return { x:1/Math.max(0.25, 1-(2*railW)/w), y:1/Math.max(0.35, 1-stripH/h) };
}
function fit(){
  const L=LESSONS[key], R=CondenseDrag.RECIPES[L.recipe];
  const s=drag.state();
  const pad=chromePad();
  resize();
  /* Once joined, the product is ONE molecule sitting centred at the origin —
     the module poses it exactly where Stage.buildMolecule would — so frame it
     as one. Holding the two-reactant framing would leave the finished molecule
     small and off to one side, at the moment it is the thing to look at. */
  if(s.joined && s.product){
    const e=Stage.measure(MolLib.MOLECULES[s.product]);
    Stage.frame(camera, cam, [{ x:0, y:0, rxz:e.rxz*pad.x, hy:e.hy*pad.y }]);
  } else {
    const eA=Stage.measure(MolLib.MOLECULES[R.a]);
    const eB=Stage.measure(MolLib.MOLECULES[s.donor.mol]);
    const d=drag.deal();
    Stage.frame(camera, cam, [
      { x:0,    y:0,    rxz:eA.rxz*pad.x, hy:eA.hy*pad.y },
      { x:d[0], y:d[1], rxz:eB.rxz*pad.x, hy:eB.hy*pad.y } ]);
  }
  applyCam();
}

function mount(k){
  if(drag) drag.destroy();
  key=k; last={};
  const L=LESSONS[k];
  /* The CARD is the reagent choice — "starch" and "cellulose" are already the
     names of it. Passed at construction rather than set afterwards, so the card
     deals the molecule it means instead of building one and replacing it. */
  drag=CondenseDrag.create({ THREE, root, camera, canvas, fx:FXi, motion,
                             recipe:L.recipe, donor:L.donor||0, onChange:report });
  document.querySelectorAll('.goal').forEach(c=>
    c.classList.toggle('on', c.dataset.lesson===k));
  hideNotes();
  if(earned[k]) showNotes(drag.state());
  fit();
  say(L.lead);
}

document.querySelectorAll('.goal').forEach(c=>{
  c.addEventListener('click', ()=>mount(c.dataset.lesson));
});
document.getElementById('clearmol').addEventListener('click', ()=>{
  drag.reset(); fit(); hideNotes(); earned[key]=false;
  document.querySelector(`.goal[data-lesson="${key}"]`).classList.remove('done');
});

new ResizeObserver(()=>fit()).observe(canvas);
mount('cellulose');

let prev=performance.now();
(function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.1,(now-prev)/1000); prev=now;
  motion.step(dt); drag.step(dt); FXi.step(dt);
  renderer.render(scene,camera);
})(prev);
</script>
</body>
</html>
