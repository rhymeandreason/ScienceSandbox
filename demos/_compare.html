<meta charset="utf-8">
<title>SDF converter comparison — old vs generated specs</title>
<style>
  body{margin:0;background:#efe7d9;font:14px/1.4 system-ui,sans-serif;color:#333}
  #ui{position:fixed;top:10px;left:10px;z-index:9;background:#fffc;padding:10px 14px;border-radius:8px}
  button{font:inherit;padding:4px 10px;margin-right:6px;cursor:pointer}
  b{font-size:16px}
  #lbl{position:fixed;bottom:14px;width:100%;text-align:center;font-size:15px;z-index:9}
</style>
<div id="ui">
  <b>old (hand-written, pre-conversion)</b> — left &nbsp;|&nbsp; <b>generated (PubChem, now live)</b> — right<br><br>
  <span id="btns"></span><br><br>
  <button id="spin">toggle spin</button>
  <button id="flat">toggle flatten Z on generated</button>
</div>
<div id="lbl"></div>
<canvas id="cv" style="position:fixed;inset:0;width:100%;height:100%"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="palette.js"></script>
<script src="molecules.js"></script>
<script src="skel.js"></script>
<script src="mol-monomers.js"></script>
<script src="mol-glycolysis.js"></script>
<script src="scene.js"></script>
<script>
const S = Stage.create(document.getElementById('cv'), {cam:{theta:0,phi:1.5708,r:34}, rMax:120});
S.resize();
let gen = {}, old = {}, cur = null, genG = null, spin = true, flat = false, key = 'glycine';

Promise.all([fetch('_generated-specs.json').then(r=>r.json()),
             fetch('_old-specs.json').then(r=>r.json())])
  .then(([a,b])=>{ gen = a; old = b; build(); });

['glycine','alanine','serine','cysteine','glucose'].forEach(k=>{
  const b = document.createElement('button');
  b.textContent = k; b.onclick = ()=>{ key = k; build(); };
  document.getElementById('btns').appendChild(b);
});
document.getElementById('spin').onclick = ()=> spin = !spin;
document.getElementById('flat').onclick = ()=>{ flat = !flat; build(); };

function build(){
  while(S.root.children.length) S.root.remove(S.root.children[0]);
  const a = Stage.buildMolecule(old[key]);
  a.position.x = -9; S.root.add(a); cur = a;
  const g = JSON.parse(JSON.stringify(gen[key]));
  if(flat) g.atoms.forEach(at=>at.pos[2] = 0);
  const b = Stage.buildMolecule(g);
  b.position.x = 9; S.root.add(b); genG = b;
  const angs = (spec)=>{
    if(key === 'glucose') return '(ring — see axial/equatorial check in the console)';
    const P = spec.atoms.map(x=>x.pos), V=(p,q)=>[p[0]-q[0],p[1]-q[1],p[2]-q[2]];
    const ang=(i,j,k)=>{const u=V(P[i],P[j]),v=V(P[k],P[j]);
      const d=(u[0]*v[0]+u[1]*v[1]+u[2]*v[2])/(Math.hypot(...u)*Math.hypot(...v));
      return (Math.acos(Math.max(-1,Math.min(1,d)))*180/Math.PI).toFixed(1);};
    return `N-Ca-C ${ang(0,3,5)}°  ·  C-O-H ${ang(5,7,8)}°  ·  N-Ca-H ${ang(0,3,4)}°`;
  };
  document.getElementById('lbl').innerHTML =
    `<b>${key}</b> &nbsp;&nbsp; old: ${angs(old[key])}` +
    ` &nbsp;&nbsp;|&nbsp;&nbsp; generated: ${angs(gen[key])}` +
    ` &nbsp;&nbsp; (flatten Z: ${flat ? 'ON' : 'off'})`;
}
(function loop(){
  requestAnimationFrame(loop);
  if(spin && cur && genG){ cur.rotation.y += 0.006; genG.rotation.y += 0.006; }
  S.renderer.render(S.scene, S.camera);
})();
</script>
