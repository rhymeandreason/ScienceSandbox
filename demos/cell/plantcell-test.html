<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>plantcell-test — a plant cell cut open, as one box</title>
<!-- TEST BENCH. Not a lesson, not linked from the index. cell/plantcell.js
     through PlantCell.mount, full window. Four tissues, and one state axis
     from turgid to plasmolysed that the slider can stop between. Hover an
     organelle, click it, double-click to come home. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f2ef; }
  #stage { position: absolute; inset: 0; }
  #ui { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        display: flex; flex-direction: column; gap: 8px; align-items: center; user-select: none;
        font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  .row { display: flex; gap: 6px; background: rgba(255,255,255,.72); backdrop-filter: blur(8px);
         padding: 6px; border-radius: 999px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .row button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px;
                font: inherit; color: #456; cursor: pointer; }
  .row button.on { background: var(--organelle-chloroplast-outer, #4f8a33); color: #fff; }
  #t { width: 260px; accent-color: var(--organelle-chloroplast-outer, #4f8a33); opacity: .8; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">
  <div class="row" id="tissues"></div>
  <div class="row" id="states"></div>
  <input id="t" type="range" min="0" max="2" step="0.001" value="0">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../lib/palette.js"></script>
<script src="../lib/tokens-from-palette.js"></script>
<script src="../lib/molecules.js"></script>
<script src="../lib/scene.js"></script>
<script src="../kit/card-stage.js"></script>
<script src="../cell/organelles.js"></script>
<script src="../cell/plantcell.js"></script>
<script>
const C = PlantCell.mount(document.getElementById('stage'));

// The buttons are built from the module's own tables, so the bench cannot
// offer a tissue or a state the model does not have.
const slider = document.getElementById('t');
const mkRow = (el, names, onPick) => names.map(n => {
  const b = document.createElement('button');
  b.textContent = n[0].toUpperCase() + n.slice(1);
  b.onclick = () => onPick(n);
  el.appendChild(b);
  return { n, b };
});
const tissueBtns = mkRow(document.getElementById('tissues'), Object.keys(PlantCell.TISSUES), n => C.set({ tissue: n }));
const stateBtns = mkRow(document.getElementById('states'), Object.keys(PlantCell.STATES), n => C.set({ state: n }));

function sync() {
  const s = C.state();
  tissueBtns.forEach(x => x.b.classList.toggle('on', x.n === s.tissue));
  stateBtns.forEach(x => x.b.classList.toggle('on', Math.abs(PlantCell.STATES[x.n] - s.t) < 0.02));
  slider.value = s.t;
}
C.on('t', sync).on('tissue', sync);
slider.oninput = () => C.set({ t: parseFloat(slider.value), now: true });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const tis = Object.keys(PlantCell.TISSUES)[parseInt(k, 10) - 1];
  if (tis) C.set({ tissue: tis });
  const st = { t: 'turgid', f: 'flaccid', p: 'plasmolysis' }[k];
  if (st) C.set({ state: st });
});
sync();
window.cell = C;
</script>
</body>
</html>
