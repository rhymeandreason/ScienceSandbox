<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molecule Sandbox — Spot the Difference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Zilla+Slab:wght@500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="sandbox.css">
<style>
  /* One accent per PAIR, not per molecule — the two halves are supposed to look
     like the same thing, so giving them different colours would do the lesson's
     job for it and give the difference away before the student looks. */
  :root{ --sugar:#2f8f6f; --nucl:#b03a86; --base:#6a5acd; }

  /* the lesson line, bottom-centre — the "so what" of the pair */
  #lesson{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;
    max-width:min(620px,76%);text-align:center;
    background:rgba(255,255,255,.66);border:2px solid var(--ink);border-radius:8px 12px 9px 11px;
    padding:11px 17px 12px;box-shadow:0 4px 14px -6px rgba(0,0,0,.35);backdrop-filter:blur(2px)}
  #lesson .lbody{font-family:var(--font-sans);font-size:14px;line-height:1.45;color:#3a352f}

  /* Molecule names are PAGE CHROME, not geometry: HTML sitting over the canvas,
     tracking each model's position but never parented to it. As 3D sprites they
     inherited the model's tilt and idle spin, so the caption drifted around the
     thing it was naming — and they rendered as blurry canvas textures next to
     crisp DOM type everywhere else on the page. */
  .molname{position:absolute;z-index:5;transform:translate(-50%,-100%);
    pointer-events:none;white-space:nowrap;text-align:center}
  .molname .mnname{font-family:var(--font-marker);font-weight:400;font-size:26px;line-height:1.05}
  /* Formula in the slab face, muted — it is a label for the name above it, not a
     second heading competing with it. */
  .molname .mnform{font-family:var(--font-slab);font-weight:700;font-size:14px;
    color:var(--muted);margin-top:3px}
  @media (max-width:920px){
    .molname .mnname{font-size:20px}
    .molname .mnform{font-size:12px}
  }

  /* Each molecule's note, directly under it. Same reasoning as the name plate:
     it describes ONE molecule, so it belongs beside that molecule rather than in
     a sidebar where the reader has to carry "the first one" across the screen.
     Width is capped so a long note wraps into a column over its own half instead
     of running under its partner. */
  .molnote{position:absolute;z-index:5;transform:translate(-50%,0);
    pointer-events:none;text-align:center;
    max-width:min(330px,38%);
    font-family:var(--font-sans);font-size:13.5px;line-height:1.45;color:#3a352f}
  @media (max-width:920px){ .molnote{font-size:12px;max-width:44%} }

  #stage{min-height:0}

  /* Sidebar removed: this is a single-stage page now, pairs are browsed with
     the arrow buttons instead of a picked-from-a-list panel. */
  #app{grid-template-columns:1fr}

  #toggles{position:absolute;right:28px;bottom:26px;z-index:5;display:flex;
    flex-direction:column;align-items:flex-end;gap:8px}
  #toggles label{display:flex;align-items:center;gap:6px;
    font-size:13px;opacity:.75;cursor:pointer;background:rgba(255,255,255,.66);
    border:1.5px solid var(--hair);border-radius:8px;padding:7px 11px}

  .navbtn{position:absolute;top:50%;transform:translateY(-50%);z-index:5;
    width:44px;height:44px;border-radius:50%;cursor:pointer;
    border:2px solid var(--ink);background:rgba(255,255,255,.7);color:var(--ink);
    font-size:18px;display:flex;align-items:center;justify-content:center}

  /* Debug scratch panel — rotation state and the VIEW-tuning readout.
     Not part of the lesson; hidden by default, toggled by #debugtoggle. */
  #debugpanel{position:absolute;right:16px;top:60px;z-index:9;margin:0;
    font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:11.5px;line-height:1.6;
    color:#eee;background:rgba(20,18,16,.82);border-radius:8px;padding:10px 13px;
    white-space:pre;pointer-events:none;display:none}
  #debugtoggle{position:absolute;right:16px;top:16px;z-index:10;
    width:34px;height:34px;border-radius:50%;cursor:pointer;
    border:2px solid var(--ink);background:rgba(255,255,255,.7);color:var(--ink);
    font-size:15px;display:flex;align-items:center;justify-content:center}
  #debugtoggle:hover{background:rgba(255,255,255,.95)}
  #debugtoggle.on{background:var(--ink);color:#fff}
  .navbtn:hover{background:rgba(255,255,255,.95)}
  #navprev{left:22px}
  #navnext{right:22px}

  @media (max-width:920px){
    #lesson{bottom:14px;max-width:88%}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="brand"><span class="drop"><i class="ph-bold ph-magnifying-glass"></i></span><h1>Spot the Difference</h1></div>
    <div id="nameL" class="molname"></div>
    <div id="nameR" class="molname"></div>
    <div id="noteL" class="molnote"></div>
    <div id="noteR" class="molnote"></div>
    <div id="lesson"></div>
    <button id="navprev" class="navbtn" aria-label="previous pair"><i class="ph-bold ph-caret-left"></i></button>
    <button id="navnext" class="navbtn" aria-label="next pair"><i class="ph-bold ph-caret-right"></i></button>
    <div id="toggles">
      <label><input type="checkbox" id="highlightdiff"> highlight difference</label>
      <label><input type="checkbox" id="showh"> show C–H hydrogens</label>
    </div>
    <button id="savepng"><i class="ph-bold ph-download-simple"></i> PNG</button>
    <button id="debugtoggle" aria-label="toggle debug panel"><i class="ph-bold ph-bug"></i></button>
    <pre id="debugpanel"></pre>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="molecules.js"></script>
<script src="scene.js"></script>
<script>
"use strict";
/* =============================================================
 *  SPOT THE DIFFERENCE — the contrast pairs
 *
 *  This page renders SCIENCE.md's Tier-2 table: pairs of near-identical
 *  molecules where exactly one feature is the entire lesson. It is a
 *  comparison gallery like macromolecule-lab.html, not a simulation — no
 *  physics loop, no reactions. It therefore does NOT load fx.js, which is the
 *  one place this page departs from the standard four-script head: nothing on
 *  it forms or breaks a bond, and §9's rule is that a non-event stays visually
 *  silent.
 *
 *  Two rules make this page work, and both are enforced elsewhere:
 *
 *   1. BOTH HALVES MUST BE THE SAME SCALE FAMILY. Every spec here is
 *      family B (real Å × 1.9), so "these are the same size except here"
 *      is a true statement. A family-A molecule on this page would make
 *      the comparison a lie. See the note at the top of molecules.js.
 *
 *   2. THE DIFFERENCE IS ASSERTED, NOT DRAWN. Each spec declares its
 *      distinguishing feature (`stereo` / `topology`) and
 *      check-molecules.js fails if the geometry disagrees. This file
 *      never decides what the difference IS — it reads `contrast.diff`
 *      off the spec and dims everything else. That index map lives with
 *      the geometry for the same reason `pep` and `gly` do: re-ordering
 *      a build would silently point the highlight at the wrong atoms.
 * ============================================================= */

/* ---------- shared stage (scene.js) ---------- */
const canvas=document.getElementById('gl');
const {scene,camera,renderer,root,cam,applyCam,resize}=Stage.create(canvas,{
  // Orthographic, not perspective: this page's entire claim is "these two are
  // the same size except for one feature", and a perspective lens quietly
  // undermines that at the edges of a wide stage — whichever molecule sits
  // further from screen-centre reads slightly smaller than its partner even
  // when they are geometrically identical. An orthographic projection has no
  // depth-based scaling at all, so shape and relative size read the same
  // wherever a molecule lands on screen.
  ortho:true,
  // Face-on by default, NOT the livelier three-quarter angle the other pages
  // open at. The user can still spin to any angle; the default just must not
  // present the two at different attitudes. phi is free, because the two are
  // separated along X: raising the camera tilts both equally and keeps them at
  // the same depth. 1.30 is glycolysis-lab's angle, which together with the
  // specs' own baked orientation is what makes a pyranose read as a 3/4 chair
  // rather than a flat hexagon.
  cam:{theta:0,phi:1.30,r:30}, phiMin:0.3, phiMax:2.7, rMin:6, rMax:220,
  // Dragging turns the MOLECULES, not the camera (see the drag handler below).
  orbit:false });

// Zoom disabled: fitCamera() is what sizes each pair (from the real geometry,
// re-solved on every resize/pair switch), so a free scroll-zoom would just let
// a student "fix" a size difference that's supposed to be read off the models,
// not the camera. scene.js's own wheel listener is already bound to the canvas
// (rMin/rMax there only clamp it, they can't turn it off), so this listener is
// added on the stage in the CAPTURE phase — capture on an ancestor always runs
// before a bubble listener on the descendant target, so stopping propagation
// here keeps scene.js's handler from ever firing.
document.getElementById('stage').addEventListener('wheel',e=>{
  e.preventDefault(); e.stopPropagation();
},{capture:true,passive:false});

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const hx=n=>'#'+n.toString(16).padStart(6,'0');

/* ---------- the pairs ----------
 * `left`/`right` index MolLib.MOLECULES. Everything chemical — what differs,
 * which atoms differ, and why it matters — comes off the specs' own `contrast`
 * blocks; only the framing question lives here.                              */
const PAIRS=[
  { left:'glucose', right:'galactose', accent:0x2f8f6f, kind:'Sugars',
    ask:'Same formula, same ring, same five hydroxyls. One of these you burn for '
      + 'energy without thinking. The other, if you are missing one enzyme, '
      + 'poisons you. Which atom is doing that?' },
  { left:'ribose', right:'deoxyribose', accent:0xb03a86, kind:'Sugars',
    ask:'These two sugars build RNA and DNA respectively. One oxygen is the '
      + 'difference — and it is the reason your genome is written in one of them '
      + 'and not the other.' },
  { left:'purine', right:'pyrimidine', accent:0x6a5acd, kind:'Bases',
    ask:'The two shapes every DNA base is built on. A and G are one, C and T the '
      + 'other. Count the rings, then think about what a ladder needs.' },
  { left:'alanine', right:'dAlanine', accent:0xc2762a, kind:'Amino acids',
    ask:'Same four groups on the same carbon — amino, carboxyl, hydrogen, methyl. '
      + 'Mirror images, not rotations of each other. Only one of these is what '
      + 'your ribosomes actually build with.' },
  // Maltose/cellobiose, not "starch"/"cellulose": the pair renders two repeats,
  // and a polymer's coil-vs-ribbon shape is a property of hundreds (SCIENCE.md
  // rule 1). The linkage IS rendered exactly, and it is the whole lesson.
  { left:'maltose', right:'cellobiose', accent:0x2f8f6f, kind:'Sugars',
    ask:'Two glucoses, joined at the same two carbons through the same oxygen. '
      + 'One of these is the link in starch, the other the link in cellulose. '
      + 'You can digest one and not the other — look at where the bridge leaves '
      + 'the ring.' },
  { left:'palmitate', right:'palmitoleate', accent:0xc9962e, kind:'Lipids',
    ask:'Same sixteen-carbon chain, same carboxyl head. One is dead straight; '
      + 'the other bends partway down. Find the one bond that is not like the '
      + 'others.' },
];
const specOf=k=>MolLib.MOLECULES[k];
const membersOf=p=>[p.left,p.right];

/* ---------- layout ---------- */
// Same true-relative-size discipline as macromolecule-lab: nothing here
// normalises the two halves to a common size, because "these are the same size"
// is part of what the student is checking.
// Extents and framing come from scene.js (Stage.measure / Stage.frame) — this
// page used to carry its own copy of both, as macromolecule-lab still does.
// `rxz` is the horizontal radius swept by the turntable and `hy` the half-height
// a vertical spin never changes; see the notes on measure() for why a cylinder
// and not a sphere.
// Registration point: the centroid of the atoms this molecule shares with its
// partner (`contrast.align`, declared in molecules.js), which keeps the shared
// skeleton in the same place in both columns as the molecule turns. Falls back
// to the molecule's OWN bounding box (Stage.centerOf) when a spec declares no
// `align` — which is now purine/pyrimidine's case on purpose: registering
// purine on the ring it shares with pyrimidine put the pivot well off purine's
// own centre, and the extra (fused) ring swung around it under drag instead of
// the molecule just turning in place. Losing registration for that one pair was
// worth it for a drag that feels right on every pair.
//
// Always resolve to a concrete [x,y,z] array here, never a bare `true` — unlike
// Stage.buildMolecule, Stage.measure does `opts.center||centerOf(spec)`, so a
// literal `true` short-circuits the `||` and silently measures against `true`
// instead of a point, producing NaN extents.
function alignCenter(spec){
  const idx=spec.contrast&&spec.contrast.align;
  if(!idx||!idx.length) return Stage.centerOf(spec);
  const c=[0,0,0];
  idx.forEach(i=>{ c[0]+=spec.atoms[i].pos[0]; c[1]+=spec.atoms[i].pos[1]; c[2]+=spec.atoms[i].pos[2]; });
  return c.map(v=>v/idx.length);
}
const CENTER={};
PAIRS.forEach(p=>membersOf(p).forEach(k=>{ CENTER[k]=alignCenter(specOf(k)); }));

const EXT={};
PAIRS.forEach(p=>membersOf(p).forEach(k=>{ EXT[k]=Stage.measure(specOf(k),{center:CENTER[k]}); }));

const GAP=3.0;             // gutter between the two halves
// Headroom above each model, in world units, for the HTML name plate to sit in
// without covering the molecule or colliding with the stage's top chrome.
const NAME_ROOM=4.6;
// How far above the molecule's top the plate's baseline sits, in world units.
// The plate grows UPWARD from this point (translate -100%), so the two-line
// version needs both a bigger offset and more NAME_ROOM in the camera fit.
const NAME_LIFT=1.8;
// Room under each molecule for its note. Reserved whether or not the note is
// currently shown: sizing the frame to the note's presence would zoom the camera
// every time "Show the difference" is pressed, and a comparison that changes
// size at the moment of the reveal is exactly the wrong thing to do.
const NOTE_ROOM=6.2;
const NOTE_GAP=0.6;      // gap between the molecule's underside and the text
// The stage chrome is HTML sitting ON TOP of the canvas: the lesson card runs
// along the bottom centre and the atom counts along the bottom left. Both are in
// the same band the name sprites want. Lifting the whole pair buys that band
// back — cheaper than fighting it in CSS, and it keeps the molecules optically
// centred in the space actually left over for them.
const LIFT=0;

/* ---------- build every molecule once ---------- */
// All of them up front, shown/hidden per pair — same reasoning as the gallery: it is
// nothing to hold in memory, and rebuilding would drop the highlight and the
// C–H toggle on every click.
const built={};
PAIRS.forEach(p=>membersOf(p).forEach(k=>{
  const spec=specOf(k);
  // CENTER[k] puts the group's origin at its registration point (see above) so
  // it turns on the spot when dragged, and buildMolecule sets the YXZ rotation
  // order that keeps a leaned molecule spinning upright. Both used to be done
  // by hand here.
  const g=Stage.buildMolecule(spec,{center:CENTER[k]});
  g.userData.atomMeshes.forEach(m=>{ if(m) m.userData.baseColor=m.material.color.getHex(); });
  g.userData.bondMeshes.forEach(m=>m.traverse(o=>{ if(o.isMesh) o.userData.baseColor=o.material.color.getHex(); }));
  root.add(g);
  built[k]=g;
}));

/* ---------- state ---------- */
let selected=0;      // index into PAIRS
let showDiff=false;
let showH=false;
// Orientation is ONE pair of numbers driving BOTH halves, not a per-molecule
// value. The whole page rests on the two being seen from the same angle, so
// there is deliberately no way to turn one without the other.
let spin=0;          // shared turntable angle (about the vertical)
let lean=0;          // user's extra tilt, added to the pair's own `tilt`

/* ---------- the highlight ----------
 * Dim to GREY, in place — not hidden, not ghosted. The claim being made is
 * "everything else about these two is identical", and that claim is only
 * visible while everything else is still on screen. Hiding the shared skeleton
 * would leave two lone hydroxyls floating in space, which proves nothing.
 *
 * Grey rather than transparent for the same reason: two dozen translucent
 * spheres sort against each other into a muddy stack, and the shape stops being
 * readable at exactly the moment the student needs to confirm it is unchanged.  */
// A NEUTRAL grey, and a hard fade. The paper here is warm cream, so an earlier
// warm grey left the dimmed oxygens reading as distinctly pink — which on a page
// whose entire instruction is "find the one coloured thing" is the worst
// possible failure mode. Shared skeleton must read as unmistakably colourless.
const GREY=new THREE.Color(0x8d8a86);
const MIX=0.9;       // how far the shared skeleton fades toward grey
function applyHighlight(){
  const p=PAIRS[selected];
  membersOf(p).forEach(k=>{
    const g=built[k], spec=specOf(k);
    const set=new Set((spec.contrast&&spec.contrast.diff)||[]);
    const paint=(m,on)=>{
      if(!m) return;
      m.traverse(o=>{
        if(!o.isMesh||!o.material) return;
        const base=o.userData.baseColor;
        if(base===undefined) return;
        o.material.color.setHex(base);
        if(showDiff&&!on) o.material.color.lerp(GREY,MIX);
        if(o.material.emissive){
          const glow=showDiff&&on;
          o.material.emissive.setHex(glow?base:0x000000);
          o.material.emissiveIntensity=glow?0.45:0;
        }
      });
    };
    g.userData.atomMeshes.forEach((m,i)=>paint(m,set.has(i)));
    // A bond is part of the difference only when BOTH ends are. A bond with one
    // end in the shared skeleton is the attachment, not the feature — colouring
    // it would draw the boundary one atom too wide.
    g.userData.bondMeshes.forEach(m=>paint(m,m.userData.pair.every(q=>set.has(q))));
  });
}

/* ---------- camera ---------- */
function fitCamera(){
  const ks=membersOf(PAIRS[selected]);
  Stage.frame(camera, cam, ks.map(k=>({x:posOf(k).x, y:LIFT, rxz:EXT[k].rxz, hy:EXT[k].hy})),
    { pad:1.12, top:NAME_ROOM, bottom:NOTE_ROOM, min:6, max:220 });
  applyCam();
}
// Each half sits in its own column, sized from ITS OWN width, so the pair is
// centred as a whole rather than each molecule being centred in an equal cell —
// purine is visibly wider than pyrimidine and the gutter should stay even.
function posOf(k){
  const p=PAIRS[selected], ks=membersOf(p);
  if(!ks.includes(k)) return V(0,0,0);
  // GAP is the clear space BETWEEN the two, so each centre sits its own
  // half-width plus half the gutter out from the middle. (Offsetting the centres
  // by GAP instead leaves the two overlapping whenever a molecule is wider than
  // the gutter — which every one of these is.)
  // Spaced on each molecule's BOUNDING RADIUS, not its x half-width. A drag
  // can turn either molecule to any angle, so an extent measured on the
  // spec's static orientation is only correct for the one frame it was
  // measured in. Half a turn later the pair overlaps and the edges clip. The
  // radius is the only number that holds at every angle.
  const [a,b]=ks;
  return k===a ? V(-(GAP/2+EXT[a].rxz),LIFT,0) : V(GAP/2+EXT[b].rxz,LIFT,0);
}

/* Resting orientation is the SPEC'S OWN — no per-pair correction at all.
 *
 * Each spec already ends with a rotate() chosen to present the molecule well
 * (glucose's `rotate(1.05,0.45,-0.2)` is what makes the pyranose read as a 3/4
 * chair), and with the camera at glycolysis-lab's phi that is exactly the view
 * that page shows. Two earlier attempts to "improve" on it were both wrong:
 *
 *   · an X tilt, to swing an axial -OH into view — it laid the ring on its side,
 *     and a pyranose that no longer reads as a chair costs more than the
 *     substituent gains;
 *   · a Y phase solved to put the differing bond in the screen plane — it scored
 *     0.97 on that metric and turned the ring edge-on, which is worse still.
 *
 * Both optimised one bond's visibility against the legibility of the whole
 * molecule. The difference does not need to be maximally exposed at rest: the
 * pair turns continuously, the reveal colours it, and the note names it.
 *
 * The camera may be raised (phi) but never swung (theta): the halves are
 * separated along X, so phi tilts both equally while theta puts one nearer than
 * the other and perspective magnifies it. */
function applyLayout(){
  Object.keys(built).forEach(k=>{
    const on=membersOf(PAIRS[selected]).includes(k);
    built[k].visible=on;
    if(on) built[k].position.copy(posOf(k));
    Stage.setOptionalH(built[k],showH);
  });
  const ks=membersOf(PAIRS[selected]);
  [nameL,nameR].forEach((el,i)=>{
    const sp=specOf(ks[i]);
    el.innerHTML=`<div class="mnname">${sp.name}</div>`
      +`<div class="mnform">${sp.formula}</div>`;
    el.style.color=hx(PAIRS[selected].accent);
  });
  [noteL,noteR].forEach((el,i)=>{
    el.textContent=specOf(ks[i]).contrast.note;
  });
  applySpin();
  fitCamera();
  placeNames();
}

/* ---------- name plates ----------
 * Projected from the world point directly above each model to a pixel position
 * on the stage. Done every frame rather than once per layout because the user
 * can orbit and zoom the camera, and a caption that stops tracking its molecule
 * is worse than no caption. It is only two elements — the cost is nothing.     */
const nameL=document.getElementById('nameL'), nameR=document.getElementById('nameR');
const noteL=document.getElementById('noteL'), noteR=document.getElementById('noteR');
const _p=new THREE.Vector3();
function placeNames(){
  if(!isFinite(camera.aspect)) return;
  const ks=membersOf(PAIRS[selected]);
  const w=canvas.clientWidth, h=canvas.clientHeight;
  if(!w||!h) return;
  // ONE baseline for the pair, taken from the taller half. Sitting each caption
  // at its own molecule's height puts the two names a few pixels apart, and on a
  // page whose whole job is "these two are the same except here" a stray
  // misalignment reads as a difference.
  const top=Math.max(...ks.map(k=>EXT[k].hy));
  const bottom=Math.min(...ks.map(k=>-EXT[k].hy));   // shared baseline, lower half
  const put=(el,worldY,i)=>{
    _p.set(posOf(ks[i]).x, worldY, 0).project(camera);
    el.style.left=((_p.x*0.5+0.5)*w).toFixed(1)+'px';
    el.style.top =((-_p.y*0.5+0.5)*h).toFixed(1)+'px';
  };
  [nameL,nameR].forEach((el,i)=>put(el, LIFT+top+NAME_LIFT, i));
  [noteL,noteR].forEach((el,i)=>put(el, LIFT+bottom-NOTE_GAP, i));
}

/* ---------- drag: turn the models, never the camera ----------
 * The shared stage's orbit is switched off for this page. Orbiting swings the
 * camera around the SCENE origin, which on a two-up comparison does two bad
 * things: the pair wheels around a point that belongs to neither molecule, and
 * one of them ends up nearer the camera and is perspective-magnified — which
 * quietly falsifies the "same size except here" claim the page is built on.
 *
 * So a drag drives the same spin/lean into both molecules and the camera holds
 * still. Each one turns on the spot, about its own centre, in lockstep.        */
let drag=null;
canvas.addEventListener('pointerdown',e=>{
  drag={x:e.clientX,y:e.clientY};
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(!drag) return;
  spin+=(e.clientX-drag.x)*0.008;
  lean=Math.max(-1.2,Math.min(1.2, lean+(e.clientY-drag.y)*0.008));
  drag={x:e.clientX,y:e.clientY};
  applySpin();
});
canvas.addEventListener('pointerup',()=>{drag=null;});
canvas.addEventListener('pointercancel',()=>{drag=null;});

// Push the shared orientation onto both halves. Assigned, never accumulated, so
// the two can't drift out of phase over a long session.
function applySpin(){
  membersOf(PAIRS[selected]).forEach(k=>{
    built[k].rotation.y=spin;      // 0 at rest — the spec's own orientation
    built[k].rotation.x=lean;      // 0 at rest; only the user's drag leans it
  });
  updateDebug();
}

/* ---------- debug panel: rotation state + VIEW tuning readout ----------
 * Started as a scratch tool for a drag-axis question (shows each visible
 * molecule's Euler rotation, order included, since 'YXZ' vs 'XYZ' changes
 * what a single component means) and is kept on as the tuning tool for
 * VIEW.* in molecules.js: it's easy to assume the numbers here live in the
 * same space as spec.view and just add degrees to it, but they don't —
 * this rotation is the group's live drag (spin/lean), Euler order 'YXZ',
 * applied on TOP of geometry that already has spec.view baked in as a
 * separate 'ZYX' Euler (scene.js buildMolecule). Two different orders
 * composed at two different times: reading x/y off here and adding them to
 * VIEW's x/y does not reproduce what you see on screen.
 *
 * The "paste VIEW" line below does the composition for you: drag the
 * molecule to the pose you want, read that line, and paste it straight in
 * as the new VIEW.* array — it's the single 'ZYX' triplet that reproduces
 * the CURRENT on-screen pose with spin/lean back at zero, so there's no
 * order-mismatch math to do by hand. */
const debugEl=document.getElementById('debugpanel');
const debugToggle=document.getElementById('debugtoggle');
debugToggle.addEventListener('click',()=>{
  const on=debugEl.style.display==='none';
  debugEl.style.display=on?'block':'none';
  debugToggle.classList.toggle('on',on);
});
const deg=r=>(r*180/Math.PI).toFixed(1)+'°';
function updateDebug(){
  const ks=membersOf(PAIRS[selected]);
  const lines=[`spin=${spin.toFixed(3)}  lean=${lean.toFixed(3)}`, ''];
  const parent=built[ks[0]].parent;
  lines.push(`parent (${parent===root?'root':parent===scene?'scene':'?'}) order=${parent.rotation.order}`);
  lines.push(`  rot  x=${deg(parent.rotation.x)} y=${deg(parent.rotation.y)} z=${deg(parent.rotation.z)}`);
  lines.push(`  pos  ${parent.position.x.toFixed(2)}, ${parent.position.y.toFixed(2)}, ${parent.position.z.toFixed(2)}`);
  lines.push('');
  ks.forEach(k=>{
    const g=built[k];
    const spec=specOf(k);
    lines.push(`${k}  order=${g.rotation.order}`);
    lines.push(`  rot  x=${deg(g.rotation.x)} y=${deg(g.rotation.y)} z=${deg(g.rotation.z)}`);
    lines.push(`  pos  ${g.position.x.toFixed(2)}, ${g.position.y.toFixed(2)}, ${g.position.z.toFixed(2)}`);
    if(spec.view){
      // Fold the live drag (YXZ) onto the baked view (ZYX) into one combined
      // quaternion, then re-decompose it as a single ZYX Euler — the same
      // order buildMolecule reads spec.view in. That triplet, with drag at
      // zero, renders identically to the current dragged pose.
      const viewQ=new THREE.Quaternion().setFromEuler(
        new THREE.Euler(spec.view[0]||0, spec.view[1]||0, spec.view[2]||0, 'ZYX'));
      const dragQ=new THREE.Quaternion().setFromEuler(
        new THREE.Euler(g.rotation.x, g.rotation.y, g.rotation.z, 'YXZ'));
      const totalE=new THREE.Euler().setFromQuaternion(dragQ.multiply(viewQ), 'ZYX');
      lines.push(`  paste VIEW: [${deg(totalE.x)}, ${deg(totalE.y)}, ${deg(totalE.z)}]`);
      lines.push(`              [${totalE.x.toFixed(4)}, ${totalE.y.toFixed(4)}, ${totalE.z.toFixed(4)}]`);
    }
  });
  debugEl.textContent=lines.join('\n');
}

/* ---------- pair navigation ---------- */
document.getElementById('navprev').onclick=()=>{ selected=(selected-1+PAIRS.length)%PAIRS.length; refresh(); };
document.getElementById('navnext').onclick=()=>{ selected=(selected+1)%PAIRS.length; refresh(); };

const lessonEl=document.getElementById('lesson');
function buildStageChrome(){
  // No pair caption in the corner: each molecule now carries its own name and
  // formula on its plate, so a "Glucose vs Galactose · C6H12O6 · C6H12O6" block
  // was saying the same thing a second time, further from what it described.
  const p=PAIRS[selected], a=specOf(p.left);
  lessonEl.innerHTML = `<div class="lbody">${a.contrast.lesson.replace(/^why /,'Why ')}.</div>`;
}

document.getElementById('highlightdiff').onchange=e=>{ showDiff=e.target.checked; applyHighlight(); };
document.getElementById('showh').onchange=e=>{ showH=e.target.checked; applyLayout(); };

function refresh(){
  // A drag on one pair shouldn't carry over as a surprise tilt on the next —
  // each pair starts from its own rest pose (spec.view), not wherever the
  // last one was left spinning.
  spin=0; lean=0; applySpin();
  buildStageChrome();
  applyLayout(); applyHighlight();
  // No effect fires here on purpose. Revealing the difference is not a chemical
  // event — nothing forms, breaks or moves; the student's understanding changed,
  // not the molecule. SCIENCE.md §9 reserves spawnRing for bond break/form and
  // says never to dramatize a non-event, and a shockwave over a hydroxyl that is
  // simply being pointed at reads as "a reaction happened here". The dimming is
  // the whole signal.
}

/* ---------- render loop ---------- */
// Both halves turn on their OWN axis, in lockstep. Rotating `root` instead would
// swing the two columns through the camera at different depths, and the pair
// would stop being comparable at exactly the moment it is moving — which is when
// a student is trying to match one against the other.
function loop(){
  placeNames();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

// The canvas reflows when the window does, and fitCamera() solves against
// camera.aspect — so without this the framing is only ever right at the size the
// page happened to load at.
new ResizeObserver(()=>{ resize(); fitCamera(); placeNames(); }).observe(canvas);

// resize() first: fitCamera() reads camera.aspect, which is only correct once
// the canvas has actually been measured.
resize(); refresh(); requestAnimationFrame(loop);

document.getElementById('savepng').onclick=()=>{
  renderer.render(scene,camera);
  const a=document.createElement('a');
  a.download=PAIRS[selected].left+'-vs-'+PAIRS[selected].right+'.png';
  a.href=canvas.toDataURL('image/png'); a.click();
};
</script>
</body>
</html>
