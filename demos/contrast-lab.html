<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/sandbox.css">
<style>
  /* One accent per PAIR, not per molecule — the two halves are supposed to look
     like the same thing, so giving them different colours would do the lesson's
     job for it and give the difference away before the student looks. */
  :root{ --sugar:#2f8f6f; --nucl:#b03a86; --base:#6a5acd; }

  /* the lesson line, bottom-centre — the "so what" of the pair */
  #lesson{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;
    max-width:min(620px,76%);text-align:center;
    background:rgba(255,255,255,.66);border:2px solid var(--ink);border-radius:8px 12px 9px 11px;
    padding:11px 17px 12px;box-shadow:0 4px 14px -6px rgba(0,0,0,.35);backdrop-filter:blur(2px)}
  #lesson .lbody{font-family:var(--font-sans);font-size:14px;line-height:1.45;color:#3a352f}

  /* Molecule names are PAGE CHROME, not geometry: HTML sitting over the canvas. */
  .molname{position:absolute;z-index:5;transform:translate(-50%,0);
    pointer-events:none;white-space:nowrap;text-align:center}
  .molname .mnname{font-family:var(--font-marker);font-weight:400;font-size:26px;line-height:1.05}
  .molname .mnform{font-family:var(--font-slab);font-weight:700;font-size:14px;
    color:var(--muted);margin-top:3px}
  @media (max-width:920px){
    .molname .mnname{font-size:20px}
    .molname .mnform{font-size:12px}
  }

  /* Each molecule's note, directly under it.  */
  .molnote{position:absolute;z-index:5;transform:translate(-50%,0);
    pointer-events:none;text-align:center;
    max-width:min(330px,38%);
    font-family:var(--font-sans);font-size:13.5px;line-height:1.45;color:#3a352f}
  @media (max-width:920px){ .molnote{font-size:12px;max-width:44%} }

  /* The flat structure, directly under its own model. */
  .molflat{position:absolute;z-index:5;transform:translate(-50%,0);
    pointer-events:none;text-align:center;line-height:0}
  .molflat svg{max-width:100%;height:auto}
  @media (max-width:920px){ .molflat{display:none} }

  #stage{min-height:0}


  #toggles{position:absolute;right:28px;bottom:26px;z-index:5;display:flex;
    flex-direction:column;align-items:flex-end;gap:8px}
  #toggles label{display:flex;align-items:center;gap:6px;
    font-size:13px;opacity:.75;cursor:pointer;background:rgba(255,255,255,.66);
    border:1.5px solid var(--hair);border-radius:8px;padding:7px 11px}

  .navbtn{position:absolute;top:50%;transform:translateY(-50%);z-index:5;
    width:44px;height:44px;border-radius:50%;cursor:pointer;
    border:2px solid var(--ink);background:rgba(255,255,255,.7);color:var(--ink);
    font-size:18px;display:flex;align-items:center;justify-content:center}

  /* Debug scratch panel — rotation state and the VIEW-tuning readout.
     Not part of the lesson; hidden by default, toggled by #debugtoggle. */
  #debugpanel{position:absolute;right:16px;top:60px;z-index:9;margin:0;
    font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:11.5px;line-height:1.6;
    color:#eee;background:rgba(20,18,16,.82);border-radius:8px;padding:10px 13px;
    white-space:pre;pointer-events:none;display:none}
  #debugtoggle{position:absolute;right:16px;top:16px;z-index:10;
    width:34px;height:34px;border-radius:50%;cursor:pointer;
    border:2px solid var(--ink);background:rgba(255,255,255,.7);color:var(--ink);
    font-size:15px;display:flex;align-items:center;justify-content:center}
  #debugtoggle:hover{background:rgba(255,255,255,.95)}
  #debugtoggle.on{background:var(--ink);color:#fff}
  .navbtn:hover{background:rgba(255,255,255,.95)}
  #navprev{left:22px}
  #navnext{right:22px}

  @media (max-width:920px){
    #lesson{bottom:14px;max-width:88%}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="nameL" class="molname"></div>
    <div id="nameR" class="molname"></div>
    <div id="flatL" class="molflat"></div>
    <div id="flatR" class="molflat"></div>
    <div id="noteL" class="molnote"></div>
    <div id="noteR" class="molnote"></div>
    <div id="lesson"></div>
    <button id="navprev" class="navbtn" aria-label="previous pair"><i class="ph-bold ph-caret-left"></i></button>
    <button id="navnext" class="navbtn" aria-label="next pair"><i class="ph-bold ph-caret-right"></i></button>
    <div id="toggles">
      <label><input type="checkbox" id="highlightdiff"> highlight difference</label>
      <label><input type="checkbox" id="showh"> show C–H hydrogens</label>
    </div>
    <button id="savepng"><i class="ph-bold ph-download-simple"></i> PNG</button>
    <button id="debugtoggle" aria-label="toggle debug panel"><i class="ph-bold ph-bug"></i></button>
    <pre id="debugpanel"></pre>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="lib/palette.js"></script>
<script src="lib/tokens-from-palette.js"></script>
<script src="lib/molecules.js"></script>
<script src="lib/skel.js"></script>
<script src="lib/mol-monomers.js"></script>
<script src="lib/mol-pathways.js"></script>
<script src="lib/mol-sugars.js"></script>
<script src="lib/mol-contrast.js"></script>
<script src="lib/haworth.js"></script>
<!-- SmilesDrawer draws the flat structure of everything that is not a sugar
     (sugars get a Haworth projection from haworth.js instead — see paintFlat).
-->
<script src="https://unpkg.com/smiles-drawer@2.4.1/dist/smiles-drawer.min.js"></script>
<script src="lib/scene.js"></script>
<script>
"use strict";
/* =============================================================
 *  SPOT THE DIFFERENCE — the contrast pairs
 *
 *  Renders SCIENCE.md's Tier-2 table: near-identical molecule pairs where
 *  exactly one feature is the lesson. A comparison gallery, not a
 *  simulation — no physics loop, no reactions, so unlike the other pages
 *  it does not load fx.js.
 *
 *  Two rules, enforced elsewhere:
 *   1. Both halves must be the same scale family (real Å × 1.9), or "same
 *      size except here" stops being true. See the note atop molecules.js.
 *   2. The difference is asserted, not drawn: each spec declares its
 *      distinguishing feature and check-molecules.js fails if the geometry
 *      disagrees. This file just reads `contrast.diff` off the spec and
 *      dims everything else — it never decides what the difference is.
 * ============================================================= */

/* ---------- shared stage (scene.js) ---------- */
const canvas=document.getElementById('gl');
const {scene,camera,renderer,root,cam,applyCam,resize}=Stage.create(canvas,{
  // Orthographic, not perspective: a perspective lens shrinks whichever
  // molecule sits further from screen-centre, quietly breaking the "same
  // size except here" claim the page is built on.
  ortho:true,
  // Face-on by default (not the three-quarter angle other pages open at):
  // the two must present at the same attitude. phi is free — raising the
  // camera tilts both equally since they're separated along X, not depth.
  cam:{theta:0,phi:1.30,r:30}, phiMin:0.3, phiMax:2.7, rMin:6, rMax:220,
  // Dragging turns the MOLECULES, not the camera (see the drag handler below).
  orbit:false });

// Zoom disabled: fitCamera() is what sizes each pair. scene.js's own wheel
// listener is bound to the canvas and rMin/rMax there only clamp zoom, they
// can't turn it off — so this is added on an ancestor in the CAPTURE phase,
// which runs before scene.js's bubble-phase listener and stops it there.
document.getElementById('stage').addEventListener('wheel',e=>{
  e.preventDefault(); e.stopPropagation();
},{capture:true,passive:false});

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const hx=n=>'#'+n.toString(16).padStart(6,'0');

/* ---------- the pairs ----------
 * `left`/`right` index MolLib.MOLECULES. Everything chemical — what differs,
 * which atoms differ, and why it matters — comes off the specs' own `contrast`
 * blocks.                             */
const PAIRS=[
  { left:'glucose', right:'galactose', accent:0x2f8f6f, kind:'Sugars',
    ask:'Same formula, same ring, same five hydroxyls. One of these you burn for '
      + 'energy without thinking. The other, if you are missing one enzyme, '
      + 'poisons you. Which atom is doing that?' },
  { left:'ribose', right:'deoxyribose', accent:0xb03a86, kind:'Sugars',
    ask:'These two sugars build RNA and DNA respectively. One oxygen is the '
      + 'difference — and it is the reason your genome is written in one of them '
      + 'and not the other.' },
  { left:'purine', right:'pyrimidine', accent:0x6a5acd, kind:'Bases',
    ask:'The two shapes every DNA base is built on. A and G are one, C and T the '
      + 'other. Count the rings, then think about what a ladder needs.' },
  { left:'alanine', right:'dAlanine', accent:0xc2762a, kind:'Amino acids',
    ask:'Same four groups on the same carbon — amino, carboxyl, hydrogen, methyl. '
      + 'Mirror images, not rotations of each other. Only one of these is what '
      + 'your ribosomes actually build with.' },
  // Maltose/cellobiose, not "starch"/"cellulose": the pair renders two repeats,
  // and a polymer's coil-vs-ribbon shape is a property of hundreds (SCIENCE.md
  // rule 1). The linkage IS rendered exactly, and it is the whole lesson.
  { left:'maltose', right:'cellobiose', accent:0x2f8f6f, kind:'Sugars',
    ask:'Two glucoses, joined at the same two carbons through the same oxygen. '
      + 'One of these is the link in starch, the other the link in cellulose. '
      + 'You can digest one and not the other — look at where the bridge leaves '
      + 'the ring.' },
  { left:'palmitate', right:'palmitoleate', accent:0xc9962e, kind:'Lipids',
    ask:'Same sixteen-carbon chain, same carboxyl head. One is dead straight; '
      + 'the other bends partway down. Find the one bond that is not like the '
      + 'others.' },
  { left:'glycine', right:'proline', accent:0xc2762a, kind:'Amino acids',
    ask:'A digestive enzyme has to grip a straightened-out stretch of backbone '
      + 'before it can cut. One of these leaves the backbone free to straighten, '
      + 'and its nitrogen keeps a free N–H. The other’s side chain loops back and '
      + 'bonds into that nitrogen, closing a ring over it. Gluten leans on '
      + 'residues built like the second one.' },
  // second half of the gluten story — proline explains why the fragment survives
  // the gut, this pair explains why the survivor becomes an antigen
  { left:'glutamine', right:'glutamate', accent:0xb0553f, kind:'Amino acids',
    ask:'Everything here is identical until the very tip of the side chain. Follow '
      + 'each one down to its far end and look at what sits beside the '
      + 'double-bonded oxygen — one atom, swapped. An enzyme in your gut wall '
      + 'makes exactly this swap to gliadin, and only the second version is one '
      + 'your immune system can be taught to attack.' },
];
const specOf=k=>MolLib.MOLECULES[k];
const membersOf=p=>[p.left,p.right];

/* ---------- layout ---------- */
// Nothing here normalises the two halves to a common size — "these are the
// same size" is part of what the student is checking. Extents and framing
// come from scene.js (Stage.measure/Stage.frame).
//
// Registration point: the centroid of the atoms this molecule shares with its
// partner (`contrast.align`, declared in molecules.js), so the shared
// skeleton stays put in both columns as the molecule turns. Falls back to the
// molecule's own bounding box (Stage.centerOf) when a spec declares no
// `align` — purine/pyrimidine's case on purpose: registering purine on its
// shared ring put the pivot off-centre and the fused ring swung under drag.
//
// Always resolve to a concrete [x,y,z] array, never a bare `true` — unlike
// Stage.buildMolecule, Stage.measure does `opts.center||centerOf(spec)`, so a
// literal `true` short-circuits the `||` and silently measures against `true`,
// producing NaN extents.
function alignCenter(spec){
  const idx=spec.contrast&&spec.contrast.align;
  if(!idx||!idx.length) return Stage.centerOf(spec);
  const c=[0,0,0];
  idx.forEach(i=>{ c[0]+=spec.atoms[i].pos[0]; c[1]+=spec.atoms[i].pos[1]; c[2]+=spec.atoms[i].pos[2]; });
  return c.map(v=>v/idx.length);
}
const CENTER={};
PAIRS.forEach(p=>membersOf(p).forEach(k=>{ CENTER[k]=alignCenter(specOf(k)); }));

const EXT={};
PAIRS.forEach(p=>membersOf(p).forEach(k=>{ EXT[k]=Stage.measure(specOf(k),{center:CENTER[k]}); }));

/* ---------- fixed pixel layout ----------
 * The stage is a plain vertical stack in SCREEN pixels: name plate, then a box
 * of fixed size for the 3D model, then the flat structure, then the note. The
 * model is scaled to fit its box rather than the box being derived from the
 * model.
 *
 * An earlier version framed the camera against world-unit reserves and
 * solved for a fit, which coupled everything to everything — changing the
 * flat-structure reserve changed the zoom, which changed the notes' pixel
 * height, and so on. Sizes here are what they say they are, and CSS can be
 * tuned without re-deriving a camera.
 */
const NAME_TOP=50;               // px from the top of the stage to the name plate
const MODEL_TOP=124;             // px — top of the 3D band
const MODEL_W=500, MODEL_H=400;  // px — the box each model is scaled to fit
const MODEL_GAP=60;              // px of clear space between the two boxes
const FLAT_GAP=8;                // px between the model box and the flat structure
const NOTE_GAP=14;               // px between the flat structure and the note

// World units per screen pixel. This page's camera is ORTHOGRAPHIC (see
// Stage.create above), so apparent size comes from the frustum's half-height,
// not from standing distance — there is no fov to solve a distance against.
function worldPerPx(){
  const h=canvas.clientHeight||1;
  return (camera.top-camera.bottom)/h;
}

/* ---------- build every molecule once ---------- */
// All of them up front, shown/hidden per pair — same reasoning as the gallery: it is
// nothing to hold in memory, and rebuilding would drop the highlight and the
// C–H toggle on every click.
const built={};
PAIRS.forEach(p=>membersOf(p).forEach(k=>{
  const spec=specOf(k);
  // CENTER[k] puts the group's origin at its registration point (see above) so
  // it turns on the spot when dragged, and buildMolecule sets the YXZ rotation
  // order that keeps a leaned molecule spinning upright. Both used to be done
  // by hand here.
  const g=Stage.buildMolecule(spec,{center:CENTER[k]});
  g.userData.atomMeshes.forEach(m=>{ if(m) m.userData.baseColor=m.material.color.getHex(); });
  g.userData.bondMeshes.forEach(m=>m.traverse(o=>{ if(o.isMesh) o.userData.baseColor=o.material.color.getHex(); }));
  root.add(g);
  built[k]=g;
}));

/* ---------- state ---------- */
let selected=0;      // index into PAIRS
let showDiff=false;
let showH=false;
// Orientation is ONE pair of numbers driving BOTH halves, not a per-molecule
// value. The whole page rests on the two being seen from the same angle, so
// there is deliberately no way to turn one without the other.
let spin=0;          // shared turntable angle (about the vertical)
let lean=0;          // user's extra tilt, added to the pair's own `tilt`

/* ---------- the highlight ----------
 * Dim to GREY, in place — not hidden, not ghosted. The claim is "everything
 * else about these two is identical", which only holds up if everything
 * else stays on screen; hiding the shared skeleton would leave two lone
 * hydroxyls floating in space, and transparency sorts a couple dozen spheres
 * into a muddy, unreadable stack.
 *
 * A NEUTRAL grey specifically: against this page's warm cream paper, an
 * earlier warm grey left dimmed oxygens reading as pink — the one thing a
 * "find the coloured atom" page can't afford. */
const GREY=new THREE.Color(0x8d8a86);
const MIX=0.9;       // how far the shared skeleton fades toward grey
function applyHighlight(){
  const p=PAIRS[selected];
  membersOf(p).forEach(k=>{
    const g=built[k], spec=specOf(k);
    // `diff` entries are atom NAMES on migrated specs and raw indices on the
    // rest (see molecules.js's atom-references-by-name note); resolveAtoms
    // takes either, so this page never has to know which.
    const set=new Set(MolLib.resolveAtoms(spec,(spec.contrast&&spec.contrast.diff)||[]));
    const paint=(m,on)=>{
      if(!m) return;
      m.traverse(o=>{
        if(!o.isMesh||!o.material) return;
        const base=o.userData.baseColor;
        if(base===undefined) return;
        o.material.color.setHex(base);
        if(showDiff&&!on) o.material.color.lerp(GREY,MIX);
        if(o.material.emissive){
          const glow=showDiff&&on;
          o.material.emissive.setHex(glow?base:0x000000);
          o.material.emissiveIntensity=glow?0.45:0;
        }
      });
    };
    g.userData.atomMeshes.forEach((m,i)=>paint(m,set.has(i)));
    // A bond is part of the difference only when BOTH ends are. A bond with one
    // end in the shared skeleton is the attachment, not the feature — colouring
    // it would draw the boundary one atom too wide.
    g.userData.bondMeshes.forEach(m=>paint(m,m.userData.pair.every(q=>set.has(q))));
  });
}

/* ---------- camera ---------- */
/* Scale the models to the fixed box rather than fitting the box to them.
 * cam.r is solved so the LARGER of the pair exactly fills MODEL_W x MODEL_H —
 * one distance for both halves, so the two stay comparable in size. That is the
 * whole point of the page: a molecule drawn bigger than its partner reads as a
 * difference. */
function fitCamera(){
  const ks=membersOf(PAIRS[selected]);
  const H=canvas.clientHeight||1;
  if(!isFinite(camera.aspect)||!camera.aspect) return;
  // Orthographic: set the frustum half-height directly. Whichever constraint
  // binds — the box's height or its width — the scale is uniform, so one figure
  // covers both.
  const halfH=Math.max(...ks.map(k=>Math.max(EXT[k].hy*H/MODEL_H,
                                             EXT[k].rxz*H/MODEL_W)));
  camera.top=halfH; camera.bottom=-halfH;
  camera.left=-halfH*camera.aspect; camera.right=halfH*camera.aspect;
  camera.updateProjectionMatrix();
  applyCam();
}
// Column centres are FIXED pixel positions converted into world x, so the two
// boxes sit MODEL_GAP apart whatever the molecules happen to measure. Spacing
// them on their own radii (as before) made the gutter breathe from pair to
// pair. Y puts the box centre at MODEL_TOP + MODEL_H/2 down the screen.
function posOf(k){
  const ks=membersOf(PAIRS[selected]);
  if(!ks.includes(k)) return V(0,0,0);
  const wpp=worldPerPx(), H=canvas.clientHeight||1;
  const dx=(MODEL_W+MODEL_GAP)/2*wpp;
  const y=(H/2-(MODEL_TOP+MODEL_H/2))*wpp;
  return V(k===ks[0]?-dx:dx, y, 0);
}

/* Resting orientation is the SPEC'S OWN — no per-pair correction. Each spec's
 * rotate() is already chosen to present the molecule well (glucose's makes
 * the pyranose read as a 3/4 chair); tilting it further to expose the
 * differing bond isn't worth it — tried an X tilt (laid the ring on its
 * side) and a Y phase for the bond (turned the ring edge-on), both traded
 * whole-molecule legibility for one bond's visibility, and the difference
 * doesn't need to be maximal at rest anyway: the pair turns continuously,
 * the reveal colours it, and the note names it.
 *
 * Camera may be raised (phi) but never swung (theta): the halves sit along
 * X, so phi tilts both equally while theta would put one nearer and let
 * perspective magnify it. */
function applyLayout(){
  // fitCamera FIRST: it sets the orthographic frustum, and posOf() converts the
  // fixed pixel column centres into world units through that frustum. Placing
  // the models before the fit would space them by the previous pair's scale.
  fitCamera();
  Object.keys(built).forEach(k=>{
    const on=membersOf(PAIRS[selected]).includes(k);
    built[k].visible=on;
    if(on) built[k].position.copy(posOf(k));
    Stage.setOptionalH(built[k],showH);
  });
  const ks=membersOf(PAIRS[selected]);
  [nameL,nameR].forEach((el,i)=>{
    const sp=specOf(ks[i]);
    el.innerHTML=`<div class="mnname">${sp.name}</div>`
      +`<div class="mnform">${sp.formula}</div>`;
    el.style.color=hx(PAIRS[selected].accent);
  });
  [noteL,noteR].forEach((el,i)=>{
    el.textContent=specOf(ks[i]).contrast.note;
  });
  paintFlat();
  applySpin();
  placeNames();
}

/* ---------- name plate, flat structure, note ----------
 * All three sit at FIXED pixel offsets down the stage — they no longer chase a
 * projected world point.  */
const nameL=document.getElementById('nameL'), nameR=document.getElementById('nameR');
const noteL=document.getElementById('noteL'), noteR=document.getElementById('noteR');
const flatL=document.getElementById('flatL'), flatR=document.getElementById('flatR');

// Element colours shared by BOTH flat renderers, so a Haworth ring and a
// SmilesDrawer skeleton read as one visual language rather than two libraries.
const FLAT_INK='#2b2b2b';
const FLAT_COLORS={ C:FLAT_INK, O:'#b03a2e', N:'#2b6cb0', S:'#b8860b', H:'#6a6257' };
// The highlight disc. Grey, so it spotlights without competing with the element
// colours.
const FLAT_HL='#cfc7b6';

// The box a SmilesDrawer panel is fitted into. It is a BOX, not a size: the
// drawing keeps its own aspect inside it, so palmitate's 16-carbon chain gets
// the width it needs and an amino acid does not float in whitespace.
const FLAT_MAX_W=430, FLAT_MAX_H=140;

/* SmilesDrawer emits a SQUARE viewBox whatever width and height it was asked
 * for, so a long chain arrives letterboxed into a sliver of the panel. Re-fit
 * the viewBox to what was actually drawn, then size the element to that
 * aspect inside FLAT_MAX_W x FLAT_MAX_H. Measured rather than assumed, since
 * the extent depends on the molecule and on how the layout engine folded it. */
function fitSvgToContent(svg){
  let bb; try{ bb=svg.getBBox(); }catch(e){ return; }
  if(!bb||!bb.width||!bb.height) return;
  const pad=7, vw=bb.width+pad*2, vh=bb.height+pad*2;
  svg.setAttribute('viewBox',`${bb.x-pad} ${bb.y-pad} ${vw} ${vh}`);
  const s=Math.min(FLAT_MAX_W/vw, FLAT_MAX_H/vh);
  svg.setAttribute('width', Math.round(vw*s));
  svg.setAttribute('height', Math.round(vh*s));
}

/* Vertical mirror of a finished SmilesDrawer panel, with the glyphs kept
 * upright. SmilesDrawer chooses its own layout direction, and for palmitoleate
 * it sends the Δ9 kink DOWN while the hand-built coordinates send it UP — two
 * views of one molecule disagreeing about which way the chain bends is exactly
 * the confusion this page exists to remove. The flat drawing is the view that
 * gives: the 3D coordinates are asserted geometry (the cis torsion, the head
 * shared with palmitate) and are not moved to suit a layout engine.
 *
 * Opt-in per spec (`flatFlipY`), never automatic, because a mirror is a
 * REFLECTION — only safe where there is no chirality to invert. It must never
 * reach the enantiomer pair, whose whole lesson is that the mirror image is a
 * different molecule.
 */
function flipSvgY(svg){
  const vb=(svg.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);
  if(vb.length!==4||!vb[3]) return;
  const axis=2*vb[1]+vb[3];              // mirror about the viewBox centre line
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('transform',`matrix(1,0,0,-1,0,${axis})`);
  while(svg.firstChild) g.appendChild(svg.firstChild);
  svg.appendChild(g);
  /* Un-mirror each label about its own anchor, so 'HO' does not read upside
   * down. Counter-flipping the <text> restores the ordinary frame for its
   * whole subtree, so tspan dy subscripts come back the right way up too. */
  g.querySelectorAll('text').forEach(t=>{
    const y=parseFloat(t.getAttribute('y'))||0;
    t.setAttribute('transform',`matrix(1,0,0,-1,0,${2*y})`);
  });
}

// The highlight set, resolved exactly as the 3D view resolves it, then folded
// so every entry lands on something a flat drawing actually draws: a hydrogen
// has no glyph of its own there, it is part of its parent's -NH2 / -OH label.
function flatHighlight(spec){
  const idx=MolLib.resolveAtoms(spec,(spec.contrast&&spec.contrast.diff)||[]);
  const adj=spec.atoms.map(()=>[]);
  spec.bonds.forEach(([i,j])=>{ adj[i].push(j); adj[j].push(i); });
  return new Set(idx.map(i=>spec.atoms[i].el==='H'
    ? adj[i].find(j=>spec.atoms[j].el!=='H') : i));
}

/* ---------- the flat structure under each model ----------
 * A second VIEW of the same spec, never a second source of truth. Sugars get a
 * Haworth projection (haworth.js), because their whole lesson is which face an
 * -OH sits on and a skeletal drawing can only mumble that with a wedge. Every
 * other class gets SmilesDrawer, from the `smiles` string generated off the
 * same spec by tools/spec2smiles.js — with the highlight carried in the string
 * as atom-map class 1, which is what SmilesDrawer keys on.
 */
function paintFlat(){
  const ks=membersOf(PAIRS[selected]);
  [flatL,flatR].forEach((el,i)=>{
    const spec=specOf(ks[i]);
    el.innerHTML='';
    if(!spec.names) return;

    if(spec.class==='sugar'){
      if(typeof Haworth==='undefined') return;
      try{
        el.innerHTML=Haworth.haworth(spec,{
          highlight: showDiff?flatHighlight(spec):new Set(),
          showH: showH,
          width: spec.glycosidic?344:184, height:112,
          ink:FLAT_INK, paper:'#f4ecdf',
          highlightColour: hx(PAIRS[selected].accent),
          highlightFill: FLAT_HL,
          colors: FLAT_COLORS,
        });
      }catch(e){}
      return;
    }

    if(!spec.smiles||typeof SmilesDrawer==='undefined') return;
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    el.appendChild(svg);
    try{
      SmilesDrawer.parse(spec.smiles, tree=>{
        new SmilesDrawer.SvgDrawer({
          width:FLAT_MAX_W, height:FLAT_MAX_H,
          bondThickness:1.1, terminalCarbons:false, compactDrawing:false,
          themes:{ light:Object.assign({}, FLAT_COLORS,
            { BACKGROUND:'#00000000', BOND:FLAT_INK }) },
        }).draw(tree, svg, 'light', null, false,
                showDiff?[[1, FLAT_HL]]:[]);
        fitSvgToContent(svg);
        if(spec.flatFlipY) flipSvgY(svg);
      }, ()=>{ el.innerHTML=''; });
    }catch(e){ el.innerHTML=''; }
  });
}
function placeNames(){
  const w=canvas.clientWidth, h=canvas.clientHeight;
  if(!w||!h) return;
  // Straight pixel arithmetic — the overlays no longer chase the projection of
  // a world point. Both columns share every Y, so nothing can drift a few
  // pixels out of line and read as a difference between the two molecules.
  const cx=[w/2-(MODEL_W+MODEL_GAP)/2, w/2+(MODEL_W+MODEL_GAP)/2];
  const put=(el,top,i)=>{ el.style.left=cx[i].toFixed(1)+'px';
                          el.style.top=top.toFixed(1)+'px'; };
  const flatTop=MODEL_TOP+MODEL_H+FLAT_GAP;
  [nameL,nameR].forEach((el,i)=>put(el, NAME_TOP, i));
  [flatL,flatR].forEach((el,i)=>put(el, flatTop, i));
  // ONE note baseline for the pair, from the taller of the two panels: letting
  // each note sit under its own diagram would stagger them whenever the panels
  // differ in height.
  const flatH=Math.max(...[flatL,flatR].map(el=>el.firstChild?el.offsetHeight:0));
  [noteL,noteR].forEach((el,i)=>put(el, flatTop+flatH+(flatH?NOTE_GAP:0), i));
}

/* ---------- drag: turn the models, never the camera ----------
 * The shared stage's orbit is switched off for this page. Orbiting swings the
 * camera around the SCENE origin, which on a two-up comparison does two bad
 * things: the pair wheels around a point that belongs to neither molecule, and
 * one of them ends up nearer the camera and is perspective-magnified — which
 * quietly falsifies the "same size except here" claim the page is built on.
 *
 * So a drag drives the same spin/lean into both molecules and the camera holds
 * still. Each one turns on the spot, about its own centre, in lockstep.        */
let drag=null;
canvas.addEventListener('pointerdown',e=>{
  drag={x:e.clientX,y:e.clientY};
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(!drag) return;
  spin+=(e.clientX-drag.x)*0.008;
  lean=Math.max(-1.2,Math.min(1.2, lean+(e.clientY-drag.y)*0.008));
  drag={x:e.clientX,y:e.clientY};
  applySpin();
});
canvas.addEventListener('pointerup',()=>{drag=null;});
canvas.addEventListener('pointercancel',()=>{drag=null;});

// Push the shared orientation onto both halves. Assigned, never accumulated, so
// the two can't drift out of phase over a long session.
function applySpin(){
  membersOf(PAIRS[selected]).forEach(k=>{
    built[k].rotation.y=spin;      // 0 at rest — the spec's own orientation
    built[k].rotation.x=lean;      // 0 at rest; only the user's drag leans it
  });
  updateDebug();
}

/* ---------- debug panel: rotation state + VIEW tuning readout ----------
 * Started as a scratch tool for a drag-axis question (shows each visible
 * molecule's Euler rotation, order included, since 'YXZ' vs 'XYZ' changes
 * what a single component means) and is kept on as the tuning tool for
 * VIEW.* in molecules.js: it's easy to assume the numbers here live in the
 * same space as spec.view and just add degrees to it, but they don't —
 * this rotation is the group's live drag (spin/lean), Euler order 'YXZ',
 * applied on TOP of geometry that already has spec.view baked in as a
 * separate 'ZYX' Euler (scene.js buildMolecule). Two different orders
 * composed at two different times: reading x/y off here and adding them to
 * VIEW's x/y does not reproduce what you see on screen.
 *
 * The "paste VIEW" line below does the composition for you: drag the
 * molecule to the pose you want, read that line, and paste it straight in
 * as the new VIEW.* array — it's the single 'ZYX' triplet that reproduces
 * the CURRENT on-screen pose with spin/lean back at zero, so there's no
 * order-mismatch math to do by hand. */
const debugEl=document.getElementById('debugpanel');
const debugToggle=document.getElementById('debugtoggle');
debugToggle.addEventListener('click',()=>{
  const on=debugEl.style.display==='none';
  debugEl.style.display=on?'block':'none';
  debugToggle.classList.toggle('on',on);
});
const deg=r=>(r*180/Math.PI).toFixed(1)+'°';
function updateDebug(){
  const ks=membersOf(PAIRS[selected]);
  const lines=[`spin=${spin.toFixed(3)}  lean=${lean.toFixed(3)}`, ''];
  const parent=built[ks[0]].parent;
  lines.push(`parent (${parent===root?'root':parent===scene?'scene':'?'}) order=${parent.rotation.order}`);
  lines.push(`  rot  x=${deg(parent.rotation.x)} y=${deg(parent.rotation.y)} z=${deg(parent.rotation.z)}`);
  lines.push(`  pos  ${parent.position.x.toFixed(2)}, ${parent.position.y.toFixed(2)}, ${parent.position.z.toFixed(2)}`);
  lines.push('');
  ks.forEach(k=>{
    const g=built[k];
    const spec=specOf(k);
    lines.push(`${k}  order=${g.rotation.order}`);
    lines.push(`  rot  x=${deg(g.rotation.x)} y=${deg(g.rotation.y)} z=${deg(g.rotation.z)}`);
    lines.push(`  pos  ${g.position.x.toFixed(2)}, ${g.position.y.toFixed(2)}, ${g.position.z.toFixed(2)}`);
    if(spec.view){
      // Fold the live drag (YXZ) onto the baked view (ZYX) into one combined
      // quaternion, then re-decompose it as a single ZYX Euler — the same
      // order buildMolecule reads spec.view in. That triplet, with drag at
      // zero, renders identically to the current dragged pose.
      const viewQ=new THREE.Quaternion().setFromEuler(
        new THREE.Euler(spec.view[0]||0, spec.view[1]||0, spec.view[2]||0, 'ZYX'));
      const dragQ=new THREE.Quaternion().setFromEuler(
        new THREE.Euler(g.rotation.x, g.rotation.y, g.rotation.z, 'YXZ'));
      const totalE=new THREE.Euler().setFromQuaternion(dragQ.multiply(viewQ), 'ZYX');
      lines.push(`  paste VIEW: [${deg(totalE.x)}, ${deg(totalE.y)}, ${deg(totalE.z)}]`);
      lines.push(`              [${totalE.x.toFixed(4)}, ${totalE.y.toFixed(4)}, ${totalE.z.toFixed(4)}]`);
    }
  });
  debugEl.textContent=lines.join('\n');
}

/* ---------- pair navigation ---------- */
document.getElementById('navprev').onclick=()=>{ selected=(selected-1+PAIRS.length)%PAIRS.length; refresh(); };
document.getElementById('navnext').onclick=()=>{ selected=(selected+1)%PAIRS.length; refresh(); };

const lessonEl=document.getElementById('lesson');
function buildStageChrome(){
  // No pair caption in the corner: each molecule now carries its own name and
  // formula on its plate, so a "Glucose vs Galactose · C6H12O6 · C6H12O6" block
  // was saying the same thing a second time, further from what it described.
  const p=PAIRS[selected], a=specOf(p.left);
  lessonEl.innerHTML = `<div class="lbody">${a.contrast.lesson.replace(/^why /,'Why ')}.</div>`;
}

// both views answer the one toggle — a flat diagram still showing the plain
// structure while the model beside it is lit up would read as a disagreement
document.getElementById('highlightdiff').onchange=e=>{
  showDiff=e.target.checked; applyHighlight(); paintFlat(); placeNames(); };
document.getElementById('showh').onchange=e=>{ showH=e.target.checked; applyLayout(); };

function refresh(){
  // A drag on one pair shouldn't carry over as a surprise tilt on the next —
  // each pair starts from its own rest pose (spec.view), not wherever the
  // last one was left spinning.
  spin=0; lean=0; applySpin();
  buildStageChrome();
  applyLayout(); applyHighlight();
  // No effect fires here on purpose. Revealing the difference is not a chemical
  // event — nothing forms, breaks or moves; the student's understanding changed,
  // not the molecule. SCIENCE.md §9 reserves spawnRing for bond break/form and
  // says never to dramatize a non-event, and a shockwave over a hydroxyl that is
  // simply being pointed at reads as "a reaction happened here". The dimming is
  // the whole signal.
}

/* ---------- render loop ---------- */
// Both halves turn on their OWN axis, in lockstep. Rotating `root` instead would
// swing the two columns through the camera at different depths, and the pair
// would stop being comparable at exactly the moment it is moving — which is when
// a student is trying to match one against the other.
function loop(){
  placeNames();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

// The canvas reflows when the window does, and fitCamera() solves against
// camera.aspect — so without this the framing is only ever right at the size the
// page happened to load at.
// applyLayout, not just fitCamera: the models' world positions are derived from
// FIXED PIXEL column centres through the current frustum, so a size change moves
// them, not only the camera. Re-fitting alone left the pair at the previous
// size's spacing — and at startup, before the canvas has been measured, at a
// spacing computed from a 1px-tall fallback.
new ResizeObserver(()=>{ resize(); applyLayout(); }).observe(canvas);

// resize() first: fitCamera() reads camera.aspect, which is only correct once
// the canvas has actually been measured.
resize(); refresh(); requestAnimationFrame(loop);

document.getElementById('savepng').onclick=()=>{
  renderer.render(scene,camera);
  const a=document.createElement('a');
  a.download=PAIRS[selected].left+'-vs-'+PAIRS[selected].right+'.png';
  a.href=canvas.toDataURL('image/png'); a.click();
};
</script>
</body>
</html>
