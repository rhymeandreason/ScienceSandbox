<style>
/* The inset: a picture-in-picture of the OTHER scale. On the bulk steps it
   holds the single labelled molecule; on step 1 it holds the bulk, so the tile
   is always the way back to where you were. */
#insetbox {
  position: absolute; left: 22px; bottom: 22px; width: 246px; z-index: 4;
  border-radius: 12px; overflow: hidden; cursor: pointer;
  background: color-mix(in srgb, var(--paper, #f6f1e7) 88%, transparent);
  border: 1px solid var(--rule, #ded6c8);
  box-shadow: 0 6px 20px rgba(40,32,20,.10);
  transition: transform .18s ease, box-shadow .18s ease;
}
#insetbox:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(40,32,20,.16); }
#insetbox canvas { display: block; width: 100%; height: 165px; }
#insetcap {
  display: flex; align-items: baseline; gap: .5em;
  padding: 7px 10px 9px; border-top: 1px solid var(--rule, #ded6c8);
  font-size: 12px; line-height: 1.25; color: var(--ink-2, #6b6459);
}
#insetcap b { color: var(--ink, #2e2a24); font-weight: 600; white-space: nowrap; }
#insetcap .go { margin-left: auto; opacity: .7; }

/* The experiment log, drawn as a sheet of notepaper: brighter stock than the
   stage (--surface-card), each line on its own printed rule. The sheet keeps
   the ask sheet's exact footprint
   (chat.css: top 96, right 18, width 316) — it is what the rail says until the
   student asks something, and the sheet covers it the moment they do. */
#trylist {
  position: absolute; top: 96px; right: 18px; width: 316px; z-index: 3;
  box-sizing: border-box; padding: 15px 18px 12px 20px;
  font-family: var(--font-sans);
  font-size: 12.5px; line-height: 1.45; color: var(--muted, #6b6459);
  background: var(--surface-card, #fffdf7);
  border: 1px solid var(--hair, #ded6c8);
  border-radius: 2px;                       /* paper has corners, not radii */
  box-shadow: 0 12px 26px rgba(52,40,24,.10), 0 1px 3px rgba(52,40,24,.09);
}
#tryhead {
  display: flex; align-items: baseline; gap: .5em;
  margin-bottom: 4px; padding-bottom: 6px;
  border-bottom: 1px solid var(--paper-line, #e6dccb);
  font-family: var(--font-hand, cursive); font-size: 21px; line-height: 1;
  color: var(--ink, #2e2a24);
}
#tryhead .count {
  margin-left: auto; font-family: var(--font-sans); font-size: 11px;
  color: var(--muted, #6b6459); opacity: .8;
}
#trylist ol { list-style: none; margin: 0; padding: 0; }
/* every line sits on its own rule, the way a page is printed */
#trylist li {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 8px 0 7px;
  border-bottom: 1px solid var(--paper-line, #e6dccb);
  transition: opacity .3s ease;
}
#trylist li:last-child { border-bottom: 0; }
/* the box is drawn, not an <input>: nothing here is submitted, and a real
   checkbox invites clicking the list instead of doing the thing */
#trylist li::before {
  content: ''; flex: none; margin-top: 2px;
  width: 12px; height: 12px; border-radius: 2px;
  border: 1.2px solid var(--hair, #ded6c8);
  background: var(--surface-card, #fffdf7);
}
#trylist li.done { opacity: .5; }
#trylist li.done::before {
  content: '✓'; font-size: 9.5px; line-height: 11px; text-align: center;
  border-color: var(--muted, #6b6459); color: var(--muted, #6b6459);
}
#trylist li.done .txt { text-decoration: line-through; }

/* The challenge stays out of the DOM's flow until the scene makes it possible
   to attempt — a to-do you cannot do yet is just a spoiler. */
#trylist li.locked { display: none; }
#trylist li.challenge {
  color: var(--ink, #2e2a24);
  animation: tryin .45s ease both;
}
#trylist li.challenge .tag {
  display: block; font-family: var(--font-hand, cursive);
  font-size: 15px; line-height: 1; color: var(--hot, #c1662a); margin-bottom: 2px;
}
@keyframes tryin { from { opacity: 0; transform: translateY(-4px) } to { opacity: 1 } }
</style>

<body>
<div id="app-sidebar">
  <div id="stage">
    <canvas id="gl"></canvas>

    <!-- One block, on its own scrim: the lesson's name, where the student is in
         it, and what this step is called. It sits over the model, so it carries
         its own ground rather than relying on empty paper behind it. -->

      <div id="brand">

    <div id="tempbar">

    <div id="chips"></div>

    <!-- picture-in-picture: the scale the stage is NOT showing -->

      <div id="insetcap"><b id="insetttl"></b><span id="insetsub"></span><span class="go">⤢</span></div>
    </div>

    <!-- Add a thing: one pill each, and the undo under it as plain text. Salt
         first, so water keeps the same place when salt appears at step 5. -->

  <!-- The rail holds the tutor and nothing else: the lesson's own text is on
       the model, as annotations, where the thing it describes is. -->

    <!-- what the rail says until the student asks something; the sheet covers it -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="palette.js"></script>
<script src="tokens-from-palette.js"></script>
<script src="molecules.js"></script>
<script src="mol-solvation.js"></script>
<script src="scene.js"></script>
<script src="fx.js"></script>
<script src="atomkit.js"></script>
<script src="annotate.js"></script>      <!-- callouts pinned to atoms: the lesson’s text, on the model -->
<script src="kit/focus.js"></script>       <!-- one vocabulary for "look here": ghost the rest, light the chosen -->
   <!-- step-1 element letters + δ badges (same as the bonding builder) -->
<script src="ask/chat.js"></script>          <!-- the tutor drawer; DOM only, never touches the scene -->
<script>
"use strict";
/* =============================================================
 *  THE CHEMISTRY OF WATER — one continuous simulation
 *  Each step adds molecules / reveals controls on the SAME sim.
 * ============================================================= */

/* ---------- scene setup (shared stage, scene.js) ---------- */
// Stage.create owns the renderer/scene/camera/lights/orbit/resize boilerplate,
// destructured into the same names the rest of this file already uses. This page
// keeps its OWN builder below (outlines, hydration userData, Debug recolour/toon)
// — only the bootstrap is shared. See SCIENCE.md §10.
const canvas = document.getElementById('gl');
const {scene,camera,renderer,root,cam,applyCam,resize}=Stage.create(canvas,{
  cam:{theta:0.5, phi:1.15, r:9}, onZoom:r=>{ S.targetR=r; } });   // manual zoom sticks
// shared transient-effect system (fx.js) — bond-break flashes etc.; step() in loop()
const FXi=FX.create(THREE, root, camera);

/* ---------- geometry helpers + material system ---------- */
const Rsphere = new THREE.SphereGeometry(1,32,24);
// Atom colours tuned for legibility on the light cream stage: deeper, more
// saturated than the original neon set so they don't wash out. `state` stays
// the single source of truth (water()/addSalt() read it; the Debug ▸ Colors
// tab writes it live).
// atom + bond colours come from the shared palette (molecules.js) so they
// stay identical across pages; the Debug ▸ Colours tab mutates these in place.
const state = MolLib.PALETTE.atoms;                 // element → hex (O/H/Na/Cl/…)
let bondColor=MolLib.PALETTE.bonds.covalent;        // covalent stick, muted stone on cream
let hbColor=MolLib.PALETTE.bonds.hbond;             // hydrogen bond, deep blue
let ionColor=MolLib.PALETTE.bonds.iondipole;        // ion–dipole bond, deep amber
// step-1 detail decorations (electrons + charge text)
// δ badges wear their own atom's colour (red O, steel H) so the sign reads as
// belonging to that atom rather than as a separate annotation layer
let eBondColor=0xe0a92e, eLoneColor=0x444444,
    dNegColor=MolLib.PALETTE.atoms.O, dPosColor=MolLib.PALETTE.atoms.H;
const hx=n=>'#'+n.toString(16).padStart(6,'0');

// MATTE: a tight specular highlight reads as wet plastic at these sizes, and on
// a big atom it competes with the element letter beside it. Same numbers as
// Stage.atomMat in scene.js — this page predates that extraction and still owns
// its own factories, so the value lives in two places by history.
function atomMat(color){ return new THREE.MeshStandardMaterial({color,roughness:.92,metalness:0}); }
function bondMat(color){ return new THREE.MeshStandardMaterial({color,roughness:.5}); }
function glowMat(color,ei){
  return new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:ei,roughness:.4}); }

function atom(color, radius, pos, role){
  const m=new THREE.Mesh(Rsphere, atomMat(color));
  m.scale.setScalar(radius); if(pos)m.position.copy(pos);
  if(role) m.userData.role=role;
  return m;
}
function bond(a,b,color=bondColor,rad=0.13,order=1,perpHint=null){
  const dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
  const normDir=dir.clone().normalize();
  if(order===2){
    const g=new THREE.Group();
    g.userData.role='covalent';
    let perp=perpHint?perpHint.clone():null;
    if(!perp || perp.lengthSq()<0.001){
      // A LINEAR molecule (CO2) has no neighbouring bond to define a plane, so
      // any perpendicular is geometrically arbitrary — but not visually. Offset
      // the pair ACROSS the view, not along it: crossing with +Z for a bond that
      // isn't already pointing at the camera splays the sticks vertically, so the
      // double bond reads as double from the default angle instead of hiding one
      // stick directly behind the other.
      const helper=Math.abs(normDir.z)<0.9?new THREE.Vector3(0,0,1):new THREE.Vector3(0,1,0);
      perp=new THREE.Vector3().crossVectors(normDir,helper);
    }
    perp.normalize();
    const offset=0.15;
    const r2=rad*0.75;
    [-offset, offset].forEach(off=>{
      const shift=perp.clone().multiplyScalar(off);
      const aOff=a.clone().add(shift);
      const m=new THREE.Mesh(new THREE.CylinderGeometry(r2,r2,len,16),bondMat(color));
      m.userData.role='covalent';
      m.position.copy(aOff).add(dir.clone().multiplyScalar(.5));
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),normDir);
      g.add(m);
    });
    return g;
  }
  const g=new THREE.CylinderGeometry(rad,rad,len,16);
  const m=new THREE.Mesh(g, bondMat(color)); m.userData.role='covalent';
  m.position.copy(a).add(dir.clone().multiplyScalar(.5));
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),normDir);
  return m;
}
// visible dashed hydrogen bond, built from short cylinder segments. _hbMat/_ionMat
// are `let` and rebuilt on render-mode / colour change; the tubes are recreated
// every frame, so new tubes pick up the current shared material automatically.
const _hbGeo=new THREE.CylinderGeometry(0.07,0.07,1,8);
let _hbMat=glowMat(hbColor,.55);
// ion–water (ion–dipole) bonds get their own colour so they read as a distinct
// interaction from the teal hydrogen bonds
let _ionMat=glowMat(ionColor,.6);
const _up=new THREE.Vector3(0,1,0);

function dashTube(a,b,mat=_hbMat){
  const g=new THREE.Group();
  const dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
  const n=Math.max(5,Math.round(len/0.26)), q=new THREE.Quaternion().setFromUnitVectors(_up,dir.clone().normalize());
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(_hbGeo,mat);
    m.position.copy(a).add(dir.clone().multiplyScalar((i+0.5)/n));
    m.quaternion.copy(q); m.scale.set(1,len/n*0.6,1); g.add(m);
  }
  return g;
}
const hbondTube=(a,b)=>dashTube(a,b,_hbMat);
function arrow(from,to,color=0x6fe3c4){
  const dir=new THREE.Vector3().subVectors(to,from);
  return new THREE.ArrowHelper(dir.clone().normalize(),from,dir.length(),color,0.35,0.22);
}
const eGeo=new THREE.SphereGeometry(0.17,16,12);
function electron(pos,color=0xffe14d,role){
  const m=new THREE.Mesh(eGeo,new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.6,roughness:.3}));
  m.position.copy(pos); if(role) m.userData.role=role; return m;
}
function ePair(center,along,color,role){
  const g=new THREE.Group();
  const perp=new THREE.Vector3(0,0,1).cross(along).normalize();
  if(perp.lengthSq()<0.01) perp.set(1,0,0);
  g.add(electron(center.clone().add(perp.clone().multiplyScalar(0.22)),color,role),
        electron(center.clone().add(perp.clone().multiplyScalar(-0.22)),color,role));
  return g;
}

// Water molecule: O at local origin, two H's at 104.5°.
const ANG=104.5*Math.PI/180, HL=1.55, half=ANG/2;
const H1L=new THREE.Vector3(Math.sin(half)*HL,-Math.cos(half)*HL,0);
const H2L=new THREE.Vector3(-Math.sin(half)*HL,-Math.cos(half)*HL,0);
function water(){
  const g=new THREE.Group();
  const O=atom(state.O,0.95,new THREE.Vector3(0,0,0),'O');
  const Ha=atom(state.H,0.55,H1L,'H'), Hb=atom(state.H,0.55,H2L,'H');
  const ba=bond(new THREE.Vector3(0,0,0),H1L), bb=bond(new THREE.Vector3(0,0,0),H2L);
  g.add(ba,bb);
  g.add(O,Ha,Hb);
  // atomMeshes/bondMeshes/pair are what kit/focus.js reads to light one atom
  // rather than a whole molecule. Indices are 0=O, 1=Ha, 2=Hb, and a bond
  // belongs to a set only when both its ends do, which is Focus's rule and the
  // reason `pair` has to be here rather than inferred.
  ba.userData.pair=[0,1]; bb.userData.pair=[0,2];
  g.userData={O,Ha,Hb, atomMeshes:[O,Ha,Hb], bondMeshes:[ba,bb],
    oWorld:()=>O.getWorldPosition(new THREE.Vector3()),
    hWorld:i=>(i?Hb:Ha).getWorldPosition(new THREE.Vector3())};
  return g;
}

// Generic molecule builder driven by a MolLib spec (atoms + bonds + sites).
// Used for SOLUTE molecules (ethanol, ammonia, methane, CO₂…). Water keeps its
// dedicated water() above because the H-bond/ice engine leans on oWorld/hWorld.
// userData exposes each atom's world position plus the donor/acceptor site
// indices, so the H-bond engine can later be pointed at a solute's polar sites.
function buildMolecule(spec){
  const g=new THREE.Group();
  const P=MolLib.PALETTE;
  const meshes=spec.atoms.map(a=>atom(state[a.el], P.radii[a.el]||0.7,
    new THREE.Vector3(a.pos[0],a.pos[1],a.pos[2]), a.el));
  (spec.bonds||[]).forEach(bSpec=>{
    const i=bSpec[0], j=bSpec[1], order=bSpec[2]||1;
    const posI=new THREE.Vector3().fromArray(spec.atoms[i].pos);
    const posJ=new THREE.Vector3().fromArray(spec.atoms[j].pos);
    let perpHint=null;
    if(order===2){
      const kBond=(spec.bonds||[]).find(b=>(b[0]===i||b[1]===i||b[0]===j||b[1]===j) && !(b[0]===i&&b[1]===j) && !(b[0]===j&&b[1]===i));
      if(kBond){
        const kIdx=[kBond[0],kBond[1]].find(idx=>idx!==i && idx!==j);
        if(kIdx!=null){
          const posK=new THREE.Vector3().fromArray(spec.atoms[kIdx].pos);
          const bondVec=new THREE.Vector3().subVectors(posJ,posI).normalize();
          const otherVec=new THREE.Vector3().subVectors(posK,posI).normalize();
          const planeNorm=new THREE.Vector3().crossVectors(bondVec,otherVec);
          if(planeNorm.lengthSq()>0.001){
            perpHint=new THREE.Vector3().crossVectors(planeNorm,bondVec).normalize();
          }
        }
      }
    }
    g.add(bond(posI, posJ, bondColor, 0.13, order, perpHint));
  });
  meshes.forEach(m=>g.add(m));
  const wp=idx=>meshes[idx].getWorldPosition(new THREE.Vector3());
  const sites=spec.sites||{donors:[],acceptors:[]};
  const bonds=spec.bonds||[];
  // the heavy atom a donor H is bonded to (gives the O–H / N–H direction)
  const parentOf=hi=>{ const b=bonds.find(([i,j])=>i===hi||j===hi); return b?(b[0]===hi?b[1]:b[0]):hi; };
  g.userData={ spec, meshes, atomWorld:wp,
    donors:(sites.donors||[]).map(d=>({h:d.atom, parent:parentOf(d.atom)})),
    acceptors:(sites.acceptors||[]).map(a=>({atom:a.atom, cap:a.lonePairs||2})) };
  return g;
}

/* ============================================================= *
 *  WaterSim — reusable molecule simulation engine
 * ============================================================= */
function createWaterSim(cfg={}){
  const o=Object.assign({
    centroidPull:0.001, jitter:0.01, MIN:3.3, stericK:0.03,
    EQ:3.9, kHB:0.007, hbThreshold:2.5, hbForce:true, spin:0, collisionMin:0
  },cfg);
  const mols=[]; let lines=[]; const forces=[];
  const V=(x,y,z)=>new THREE.Vector3(x,y,z);
  function spawn(pos,rot){
    const w=water();
    w.position.copy(pos||V((Math.random()-.5)*5,(Math.random()-.5)*5,(Math.random()-.5)*3));
    if(rot)w.rotation.copy(rot); else w.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);
    w.userData.vel=V(0,0,0); root.add(w); mols.push(w); return w;
  }
  function remove(){ if(mols.length){ const w=mols.pop(); root.remove(w); return w; } }
  function clearLines(){ lines.forEach(l=>root.remove(l)); lines=[]; }
  function step({hook, showHbonds=true, hbScale=1}={}){
    const c=V(0,0,0); mols.forEach(m=>c.add(m.position)); if(mols.length)c.multiplyScalar(1/mols.length);
    forces.length=mols.length;
    for(let i=0;i<mols.length;i++) forces[i]=(forces[i]||V()).set(0,0,0);
    mols.forEach((w,i)=>{
      forces[i].add(V().subVectors(c,w.position).multiplyScalar(o.centroidPull));
      forces[i].add(V((Math.random()-.5)*o.jitter,(Math.random()-.5)*o.jitter,(Math.random()-.5)*o.jitter));
      if(hook) hook(w,i,forces[i]);
    });
    for(let i=0;i<mols.length;i++)for(let j=i+1;j<mols.length;j++){
      const d=V().subVectors(mols[i].position,mols[j].position), dist=Math.max(0.4,d.length());
      if(dist<o.MIN){ const push=d.normalize().multiplyScalar((o.MIN-dist)*o.stericK);
        forces[i].add(push); forces[j].sub(push); }
    }
    mols.forEach((w,i)=>{ w.userData.vel.add(forces[i]).multiplyScalar(0.9);
      w.position.add(w.userData.vel); w.rotation.y+=o.spin; });
    if(o.collisionMin>0){ const m=o.collisionMin;
      for(let it=0;it<3;it++)for(let i=0;i<mols.length;i++)for(let j=i+1;j<mols.length;j++){
        const d=V().subVectors(mols[i].position,mols[j].position), dist=d.length();
        if(dist<m&&dist>1e-4){ d.multiplyScalar((m-dist)/dist*0.5);
          mols[i].position.add(d); mols[j].position.sub(d); } } }
    clearLines(); let n=0;
    // Each oxygen has only two lone pairs, so it can ACCEPT at most two H-bonds
    // (a water tops out at 4 total: 2 as donor, 2 as acceptor). Cap acceptors so
    // counts stay physical in a dense cluster.
    // A single pair of waters shares at most ONE H-bond (each of water's 4 bonds
    // goes to a different neighbour), so also forbid a second bond between a pair.
    const accepted=new Map(), bonded=new Set();
    // Per-molecule H-bond tally, read next frame. `hbBonds` records WHICH
    // hydrogen went to WHICH molecule, because the matcher below already knows
    // and anything reading it back off geometry would be re-deriving a decision
    // that has already been made, and can disagree with it.
    mols.forEach((m,idx)=>{ m.userData._i=idx; m.userData.hb=0; m.userData.hbBonds=[]; });
    const pairKey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
    for(const donor of mols){ if(donor.userData.escaped) continue;   // gas-phase molecule: no H-bonds
      const oD=donor.userData.oWorld();
      for(let hi=0;hi<2;hi++){ const h=donor.userData.hWorld(hi);
        let best=null,bestMol=null,bestD=o.hbThreshold,bestLin=0;
        for(const acc of mols){ if(acc===donor||acc.userData.escaped)continue;   // can't bond to a molecule that's left
          if((accepted.get(acc)||0)>=2) continue;   // this oxygen's lone pairs are full
          if(bonded.has(pairKey(donor.userData._i,acc.userData._i))) continue;   // pair already H-bonded
          const oA=acc.userData.oWorld(), dd=h.distanceTo(oA);
          if(dd<bestD){ const oh=V().subVectors(h,oD).normalize(), ha=V().subVectors(oA,h).normalize();
            const lin=oh.dot(ha); if(lin>0.5){ best=oA;bestMol=acc;bestD=dd;bestLin=lin; } }
        }
        if(best){ n++; accepted.set(bestMol,(accepted.get(bestMol)||0)+1);
          bonded.add(pairKey(donor.userData._i,bestMol.userData._i));
          donor.userData.hb++; bestMol.userData.hb++;   // both partners gain a bond
          donor.userData.hbBonds.push({acc:bestMol, h:hi});
          if(showHbonds){ const l=hbondTube(h,best); lines.push(l); root.add(l); }
          if(o.hbForce&&hbScale>0){ const ax=V().subVectors(bestMol.position,donor.position);
            const dist=ax.length()||1; ax.multiplyScalar((dist-o.EQ)*o.kHB*bestLin*hbScale/dist);
            donor.userData.vel.add(ax); bestMol.userData.vel.sub(ax); }
        }
      }
    }
    return {hbondCount:n, centroid:c};
  }
  return {mols, cfg:o, spawn, remove, clearLines, step};
}

/* ---- ice Iₕ lattice (built to fit the current molecule count) ---- */
function frameQuat(u,v){
  const x=u.clone().normalize();
  const z=new THREE.Vector3().crossVectors(u,v); if(z.lengthSq()<1e-6)z.set(0,0,1); z.normalize();
  const y=new THREE.Vector3().crossVectors(z,x).normalize();
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z));
}
const qLocalInv=frameQuat(H1L.clone().add(H2L), H1L.clone()).invert();
function buildIceSites(n){
  const b=DBG.iceBond,dxy=0.9428*b,alat=Math.sqrt(3)*dxy, R=4;
  const A1x=alat,A1z=0,A2x=alat/2,A2z=1.5*dxy, P=[];
  for(let k=0;k<5;k++){ const base=k*(4*b/3), upA=(k%2===0);
    for(let nn=-R;nn<=R;nn++)for(let mm=-R;mm<=R;mm++){
      const ax=A1x*nn+A2x*mm, az=A1z*nn+A2z*mm, bx=ax, bz=az+dxy;
      const up=upA?[ax,az]:[bx,bz], lo=upA?[bx,bz]:[ax,az];
      P.push(new THREE.Vector3(up[0],base+b/6,up[1]));
      P.push(new THREE.Vector3(lo[0],base-b/6,lo[1]));
    }
  }
  const ctr=new THREE.Vector3(); P.forEach(p=>ctr.add(p)); ctr.multiplyScalar(1/P.length); P.forEach(p=>p.sub(ctr));
  P.sort((a,b)=>a.lengthSq()-b.lengthSq());
  const sites=P.slice(0,n);
  const c2=new THREE.Vector3(); sites.forEach(p=>c2.add(p)); c2.multiplyScalar(1/sites.length); sites.forEach(p=>p.sub(c2));
  // ---- Bernal–Fowler proton assignment ----
  // Orient every O···O link donor→acceptor so each interior oxygen DONATES exactly
  // two bonds (its two covalent, "near" H's) and ACCEPTS two (neighbours' "far" H's).
  // That's a bounded-out-degree (≤2) orientation of the H-bond graph: it guarantees
  // exactly one proton per link, so no two hydrogens ever share an O···O channel.
  const adj=sites.map(()=>[]), edges=[];
  for(let i=0;i<sites.length;i++)for(let j=i+1;j<sites.length;j++){
    if(sites[i].distanceTo(sites[j])<b*1.15){ adj[i].push(j); adj[j].push(i); edges.push([i,j]); }
  }
  const out=sites.map(()=>0), donor={};                 // out[i]=donor count, donor["i,j"]=donor index
  const key=(a,c)=>a<c?a+','+c:c+','+a;
  for(const [i,j] of edges){ const d=out[i]<=out[j]?i:j; donor[key(i,j)]=d; out[d]++; }   // greedy seed
  // Rebalance: any oxygen donating >2 pushes the excess along an augmenting path of
  // donor-directed edges to an oxygen with spare capacity, flipping edges en route.
  function reduce(v){
    const prev=new Map([[v,-1]]), stack=[v];
    while(stack.length){
      const u=stack.pop();
      for(const w of adj[u]){
        if(donor[key(u,w)]===u && !prev.has(w)){
          prev.set(w,u);
          if(out[w]<2){ let cur=w; while(prev.get(cur)!==-1){ const p=prev.get(cur); donor[key(p,cur)]=cur; cur=p; }
            out[v]--; out[w]++; return true; }
          stack.push(w);
        }
      }
    }
    return false;
  }
  let guard=sites.length*8;
  for(let v=0;v<sites.length;v++){ while(out[v]>2 && guard-->0){ if(!reduce(v)) break; } }
  const quats=sites.map((_,i)=>{
    const dd=[], accept=[];
    for(const jn of adj[i]){ const dir=sites[jn].clone().sub(sites[i]).normalize();
      (donor[key(i,jn)]===i?dd:accept).push(dir); }        // donor dirs = near H's
    // Surface molecule short of two donor bonds: keep both covalent H's but aim the
    // spare one(s) into open space (a real dangling O–H) — never back along a link
    // this molecule is accepting on, which is what caused overlapping protons.
    while(dd.length<2){
      let best=new THREE.Vector3(0,1,0), bestScore=1e9;
      for(let s=0;s<48;s++){ const c=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5);
        if(c.lengthSq()<1e-4) continue; c.normalize();
        let sc=0; for(const a of accept) sc=Math.max(sc,c.dot(a)); for(const d0 of dd) sc=Math.max(sc,c.dot(d0));
        if(sc<bestScore){ bestScore=sc; best=c; } }
      dd.push(best);
    }
    return frameQuat(dd[0].clone().add(dd[1]), dd[0].clone()).multiply(qLocalInv);
  });
  return {sites,quats};
}
let iceFor=-1;
function assignIce(){
  const n=sim.mols.length; const {sites,quats}=buildIceSites(n);
  const free=sites.map((_,i)=>i);
  sim.mols.forEach(w=>{
    let bi=free[0],bk=0,bd=1e9;
    free.forEach((si,k)=>{ const d=w.position.distanceToSquared(sites[si]); if(d<bd){bd=d;bi=si;bk=k;} });
    free.splice(bk,1);
    w.userData.iceSite=sites[bi]; w.userData.iceQuat=quats[bi];
  });
  iceFor=n;
}

/* ---- salt (step 5): Na⁺ / Cl⁻ ions ----
   Each ion holds a first hydration shell of 6 water molecules in an
   octahedral arrangement (the textbook coordination number for both Na⁺
   and Cl⁻ in dilute solution). Waters are RECRUITED from those already in
   the scene — add water first, then add salt.
     • Na⁺ (cation): each water points its O (δ−) straight at the ion.
     • Cl⁻ (anion):  each water points ONE O–H bond (δ+) at the ion —
       a near-linear Cl⁻···H–O hydrogen bond, not the H–H bisector.        */
const salt=[]; const saltBonds=[];
const bisLocal=H1L.clone().add(H2L).normalize();   // molecule bisector (points toward the H's)
const h1Local=H1L.clone().normalize();             // one O–H direction, for anion orientation
const WSHELL=1.15;                                  // water-O half-thickness for contact/shell
const SHELL_N=6;                                    // octahedral coordination number, Na⁺ & Cl⁻
// six octahedral vertex directions for seating the shell
const OCTA=[new THREE.Vector3(1,0,0),new THREE.Vector3(-1,0,0),
            new THREE.Vector3(0,1,0),new THREE.Vector3(0,-1,0),
            new THREE.Vector3(0,0,1),new THREE.Vector3(0,0,-1)];
// This page teaches the solvent lesson with NaCl only; the other library entries
// (KCl, ethanol, ammonia, methane, CO₂) live in molecule-lab.html.
const currentSalt='nacl';
// display radius for an ion: Na/Cl stay tied to their live Debug sliders; any
// other ion (e.g. K⁺) uses its own spec radius.
function ionRadius(ion, specR){ return ion==='Na'?DBG.naRad : ion==='Cl'?DBG.clRad : specR; }
function addSalt(specKey=currentSalt){
  const spec=MolLib.MOLECULES[specKey];

  const anDef =spec.dissociates.find(d=>d.charge<0);   // anion
  const catR=ionRadius(catDef.ion,catDef.radius), anR=ionRadius(anDef.ion,anDef.radius);
  // drop the crystal in from above the cluster so it drifts down into the water
  let maxY=0; sim.mols.forEach(w=>maxY=Math.max(maxY,w.position.y));
  const base=new THREE.Vector3((Math.random()-.5)*2, maxY+6, (Math.random()-.5)*2);
  // seat the pair at contact distance (surfaces just touching) so the spheres don't overlap
  const half=(catR+anR)/2+0.05;
  const na=atom(state[catDef.ion],catR, base.clone().add(new THREE.Vector3(-half,0,0)),catDef.ion);
  const cl=atom(state[anDef.ion], anR, base.clone().add(new THREE.Vector3(half,0,0)), anDef.ion);
  // `descending` is per-ion so an already-settled crystal keeps its normal physics
  // (and its hydration shells) while a newly-added one is still falling in.
  na.userData={role:catDef.ion, charge:catDef.charge, vel:new THREE.Vector3(), rad:catR, baseRad:catDef.radius, shellCount:0, descending:true};
  cl.userData={role:anDef.ion,  charge:anDef.charge,  vel:new THREE.Vector3(), rad:anR,  baseRad:anDef.radius,  shellCount:0, descending:true};
  root.add(na,cl); salt.push(na,cl);

  // so dropping a second crystal never resets the first back to a contact pair.
  const stick=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,1,12),
    new THREE.MeshStandardMaterial({color:0xe0cf8a,emissive:0x4a3d12,roughness:.45}));
  root.add(stick); saltBonds.push({na,cl,stick,dissociated:false});

const anyDescending=()=>salt.some(m=>m.userData.descending);
// once a crystal reaches the water, clear its descending flag and lock in shells
function checkSaltArrival(){
  let arrived=false;
  saltBonds.forEach(b=>{
    if(!b.na.userData.descending) return;
    const both=[b.na,b.cl].every(ion=>sim.mols.some(w=>ion.position.distanceTo(w.position)<3.0));
    if(both){ b.na.userData.descending=b.cl.userData.descending=false; arrived=true; }
  });

}
function clearSalt(){ salt.forEach(m=>root.remove(m)); salt.length=0;
  saltBonds.forEach(b=>root.remove(b.stick)); saltBonds.length=0;
  sim.mols.forEach(w=>{ w.userData.shellIon=null; w.userData.shellSlot=-1; }); clearIonBonds();
  updateTempRange(); }   // back to pure water → standard 0–100°C bar
// A water "bridges" a Na⁺–Cl⁻ pair once its O has wedged onto the bond axis
// between the two ions: projection lands in the mid-section of the axis and the
// O sits close to that line. This is the real contact→solvent-separated ion-pair
// transition — the first bridging water screens the pair and pries it apart.
function bridgingWater(na,cl){
  const axis=new THREE.Vector3().subVectors(cl.position,na.position);
  const len=axis.length()||1; axis.multiplyScalar(1/len);
  return sim.mols.some(w=>{
    const rel=new THREE.Vector3().subVectors(w.userData.oWorld(),na.position);
    const t=rel.dot(axis)/len;                       // fractional position along Na→Cl
    if(t<0.3||t>0.7) return false;                   // must sit between the ions, not beside
    const perp=rel.addScaledVector(axis,-t*len).length();
    return perp<1.2;                                 // O close to the bond line
  });

function checkDissociation(){

    if(!bridgingWater(b.na,b.cl)) return;                   // wait for a water to wedge this pair apart
    b.dissociated=true;
    // one-time "pop apart" impulse outward from this pair's midpoint
    const c=new THREE.Vector3().addVectors(b.na.position,b.cl.position).multiplyScalar(0.5);
    [b.na,b.cl].forEach(m=>{ const d=new THREE.Vector3().subVectors(m.position,c);
      if(d.lengthSq()<1e-4) d.set(Math.random()-.5,Math.random()-.5,Math.random()-.5);
      m.userData.vel.add(d.normalize().multiplyScalar(0.25)); });
    // the bond snapping is its own event — shockwave + sparks at the break point,
    // each ion flaring in its own palette colour as water tears them apart
    FXi.spawnRing(c, FXi.colorOf(b.na));
    FXi.popGlow(b.na, FXi.colorOf(b.na)); FXi.popGlow(b.cl, FXi.colorOf(b.cl));

// ion–dipole bonds: each shell water → its ion, drawn to the atom that faces
// the ion (O for Na⁺, the inward H for Cl⁻) so the polarity reads correctly
let ionBondLines=[];
function clearIonBonds(){ ionBondLines.forEach(l=>root.remove(l)); ionBondLines=[]; }
function updateIonBonds(){

  sim.mols.forEach(w=>{
    const ion=w.userData.shellIon; if(!ion) return;
    let atomPos;
    if(ion.userData.charge>0){ atomPos=w.userData.oWorld(); }              // Na⁺ ↔ O
    else { const h0=w.userData.hWorld(0), h1=w.userData.hWorld(1);          // Cl⁻ ↔ nearer O–H

// Assign each ion its 6 nearest un-claimed waters as an octahedral shell.
function assignShells(){
  sim.mols.forEach(w=>{ w.userData.shellIon=null; w.userData.shellSlot=-1; });

    if(ion.userData.descending){ ion.userData.shellCount=0; return; }   // no shell while still falling in
    const cand=sim.mols.filter(w=>!taken.has(w))
      .sort((a,b)=>a.position.distanceToSquared(ion.position)-b.position.distanceToSquared(ion.position))
      .slice(0,SHELL_N);

function updateSaltBonds(){

  for(const ion of salt){
    const d=new THREE.Vector3().subVectors(w.position,ion.position), dist=d.length()||1;
    if(dist<8){
      const shell=ion.userData.rad+WSHELL;                 // resting hydration distance (contact)
      const k = dist<shell ? 0.16 : 0.018;                 // hard repulsion inside, soft pull outside
      f.addScaledVector(d.multiplyScalar(1/dist), -(dist-shell)*k);  // spring toward the shell
    }
  }
}
function orientShells(){
  sim.mols.forEach(w=>{
    const ion=w.userData.shellIon; if(!ion) return;
    const toIon=new THREE.Vector3().subVectors(ion.position,w.position).normalize();
    let q;
    if(ion.userData.charge>0){
      // cation: O (δ−) toward ion → bisector (toward H's) points away
      q=new THREE.Quaternion().setFromUnitVectors(bisLocal, toIon.clone().multiplyScalar(-1));
    } else {
      // anion: one O–H bond (δ+) points straight at the ion (linear Cl⁻···H–O)
      q=new THREE.Quaternion().setFromUnitVectors(h1Local, toIon);
    }
    w.quaternion.slerp(q,DBG.orientSlerp);
  });
}
function updateIons(){
  // A freshly-added crystal falls as one rigid body (no ion–ion or water forces yet)
  // so the pair stays bonded until it reaches the water. Only its own ions descend —
  // already-settled crystals below keep their normal physics.
  const descending=salt.filter(m=>m.userData.descending);
  if(descending.length){
    // centre on the descending crystal's centroid, not each ion, so the horizontal
    // pull doesn't squeeze Na⁺ and Cl⁻ toward each other on the way down
    const c=new THREE.Vector3(); descending.forEach(a=>c.add(a.position)); c.multiplyScalar(1/descending.length);
    const cen=new THREE.Vector3(c.x*-0.0008,0,c.z*-0.0008);
    descending.forEach(a=>{
      const f=new THREE.Vector3(0,-0.012,0).add(cen);   // gravity + slack horizontal centering (shared)
      a.userData.vel.add(f).multiplyScalar(0.9); a.position.add(a.userData.vel);
    });
  }
  const settled=salt.filter(m=>!m.userData.descending);
  const fz=S.fz||0;
  // brine rejection: as ice grows it excludes the salt, so freezing pushes the
  // ions out to just beyond the lattice (leaving nearly-fresh ice + salty brine)
  let iceR=0; if(fz>0.2) sim.mols.forEach(w=>iceR=Math.max(iceR,w.position.length()));
  settled.forEach(a=>{
    let f;
    if(fz>0.2){ const r=a.position.length()||1, Rrej=iceR+1.5;
      f=a.position.clone().multiplyScalar((Rrej-r)/r*0.012*fz); }   // spring outward to the ice surface
    else f=new THREE.Vector3().copy(a.position).multiplyScalar(-0.004);   // gentle containment
    // An ion is "shielded" once it carries a substantial hydration shell: water's
    // dielectric + the shell's steric bulk then cut the ion–ion pull to a few percent.
    // Screening is per-ion (not a global switch), so a hydrated ion never gets yanked
    // back to contact even while another pair is still dissociating.
    const aShielded=a.userData.shellCount>=3;
    settled.forEach(b=>{ if(a===b)return;
      const dir=new THREE.Vector3().subVectors(b.position,a.position), dist=Math.max(1,dir.length()); dir.normalize();
      const shielded = aShielded || b.userData.shellCount>=3;
      const sc = shielded ? DBG.screen : 1;   // water's dielectric screens ion–ion pull once either ion is hydrated
      f.addScaledVector(dir, -a.userData.charge*b.userData.charge*0.012*sc/dist);  // unlike attract / like repel
      if(dist<a.userData.rad+b.userData.rad+0.4) f.addScaledVector(dir,-0.05);  // ion–ion steric
      if(shielded){   // hydrated ions carry shells that can't interpenetrate → they stay apart
        const ra=a.userData.charge>0?DBG.naShellDist:DBG.clShellDist;
        const rb=b.userData.charge>0?DBG.naShellDist:DBG.clShellDist;
        const reach=ra+rb; if(dist<reach) f.addScaledVector(dir,-(reach-dist)*0.03);
      }
    });
    // water pushes back on the ion — no passing through molecules; also wedges pairs apart
    sim.mols.forEach(w=>{
      const dir=new THREE.Vector3().subVectors(a.position,w.position), dist=dir.length()||1;
      const shell=a.userData.rad+WSHELL;
      if(dist<shell) f.addScaledVector(dir.multiplyScalar(1/dist),(shell-dist)*0.09);
    });
    a.userData.vel.add(f).multiplyScalar(0.9); a.position.add(a.userData.vel);
  });
}
// Hard constraint: no water ATOM (O or either H) may overlap an ion sphere.
// This matters most for Cl⁻, whose inward-pointing H is the closest atom and
// would otherwise poke into the large anion. Shoves the whole molecule out.
const WO_RAD=0.95, WH_RAD=0.55;
function separateIonsFromWater(){
  salt.forEach(ion=>{
    sim.mols.forEach(w=>{
      const atoms=[[w.userData.oWorld(),WO_RAD],[w.userData.hWorld(0),WH_RAD],[w.userData.hWorld(1),WH_RAD]];
      let pen=0, dir=null;
      for(const [p,rad] of atoms){
        const d=new THREE.Vector3().subVectors(p,ion.position), dist=d.length()||1;
        const minD=ion.userData.rad+rad+0.08;
        if(minD-dist>pen){ pen=minD-dist; dir=d.multiplyScalar(1/dist); }
      }
      if(dir) w.position.addScaledVector(dir,pen);   // push molecule out until the offending atom clears
    });
  });
}

/* ============================================================= *
 *  Temperature model (one continuum: cold → ice, hot → vapour)
 * ============================================================= */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
// Colligative shift from dissolved salt: NaCl → 2 free particles, so it both
// depresses the freezing point and elevates the boiling point in proportion to
// concentration. ΔTf = Kf·m (Kf=1.86), capped at the −21°C NaCl/water eutectic;
// ΔTb = ΔTf·(Kb/Kf) since Kf/Kb ≈ 3.63.
function saltShift(){
  if(!salt.length) return {dTf:0,dTb:0,molal:0};
  const waterKg=Math.max(0.05, sim.mols.length*0.018);   // ~18 g per water molecule
  const molal=salt.length/waterKg;                        // free particles (Na⁺+Cl⁻) per kg
  const dTf=Math.min(1.86*molal, 21);
  return {dTf, dTb:dTf/3.63, molal};
}
function tempParams(){
  const T=S.tempEnabled ? S.temperature : 22;
  const {dTf,dTb,molal}=saltShift();
  // Sharp freeze: stay liquid until ~3° above the (salt-depressed) freezing point,
  // then a narrow ramp to full ice right AT the freezing point (0°C for pure water).
  // The old 8° ramp made water look and read "frozen" as high as 4°C — where it's
  // actually still liquid (and densest at 4°C).
  const FB=3;
  const fz=S.freezeEnabled ? clamp((FB-dTf-T)/FB,0,1) : 0;
  const warm=clamp((T-20)/80,0,1);
  // curved rather than linear: motion stays fairly calm through the middle of the
  // range and then visibly ramps up as T approaches boiling, so heating reads as
  // molecules "speeding up" rather than a flat jiggle increase
  const kinetic=Math.pow(warm,1.7)*0.2;
  // Boiling is anchored at the true 100°C (raised by ΔTb once salt is dissolved)
  // on every step — the 0–100°C slider tops out exactly at the boiling point.
  const saltMode=(S.step===4 && salt.length>0);
  const boilBase=100;
  const boilProxy=boilBase+dTb;
  // In salt mode boiling ramps to a full rolling boil within ~2°C of the boiling
  // point (boiling is nearly a threshold), so it visibly boils right at ~102°C.
  const evapProb = T>=boilProxy
    ? (saltMode ? Math.min(0.025, 0.012*(T-boilProxy)) : Math.min(0.02, 0.01*(T-boilProxy)+0.003))
    : 0;
  const hbScale=clamp(1-(T-40)/60,0.15,1)*(1-0.7*fz);
  return {T,fz,warm,kinetic,evapProb,hbScale,dTf,dTb,molal};
}

      tdescEl=document.getElementById('tdesc'),
      tcoldEl=document.getElementById('tcold'), thotEl=document.getElementById('thot');
tinput.oninput=()=>{ S.temperature=parseFloat(tinput.value); tvalEl.textContent=S.temperature+'°C'; };
const PX_PER_DEG=3.4;   // 340px / 100°C baseline — keeps the bar proportional at any range
// absolute-temperature colour scale: dark blue (deep freeze) → cold → warm yellow → hot → magenta (near-boiling)
// the bar's gradient is sampled from this fixed scale, so it always shows what a given
// temperature *means* rather than just stretching cold..hot across whatever range is active
const TEMP_COLOR_STOPS=[[-25,'#1c3a66'],[0,'#4a90d9'],[50,'#e9d98f'],[100,'#e5533a'],[110,'#ff3d7f']];
function lerpHex(a,b,t){ const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const ar=(pa>>16)&255,ag=(pa>>8)&255,ab=pa&255, br=(pb>>16)&255,bg=(pb>>8)&255,bb=pb&255;
  const r=Math.round(ar+(br-ar)*t),g=Math.round(ag+(bg-ag)*t),bl=Math.round(ab+(bb-ab)*t);
  return '#'+[r,g,bl].map(v=>v.toString(16).padStart(2,'0')).join(''); }
function colorAtTemp(t){
  const s=TEMP_COLOR_STOPS;
  if(t<=s[0][0]) return s[0][1];
  if(t>=s[s.length-1][0]) return s[s.length-1][1];
  for(let i=0;i<s.length-1;i++){ const [t0,c0]=s[i],[t1,c1]=s[i+1];
    if(t>=t0 && t<=t1) return lerpHex(c0,c1,(t-t0)/(t1-t0)); }
  return s[s.length-1][1];
}
// paint the bar for a given (possibly fractional, mid-tween) range
function paintRange(min,max){ tinput.min=min; tinput.max=max;
  tcoldEl.textContent=Math.round(min)+'°C'; thotEl.textContent=Math.round(max)+'°C';
  tinput.style.height=((max-min)*PX_PER_DEG)+'px';
  const STEPS=8, stops=[];
  for(let i=0;i<=STEPS;i++){ const t=min+(max-min)*i/STEPS;
    stops.push(colorAtTemp(t)+' '+(i/STEPS*100)+'%'); }
  tinput.style.background='linear-gradient(to top,'+stops.join(',')+')';
  tinput.value=S.temperature; tvalEl.textContent=S.temperature+'°C'; }
// smoothly tween min/max/height together so the thumb glides instead of snapping to
// its new fractional position (a native range can't animate a min/max change on its own)
let rangeAnim=null;
function setTempRange(min,max){
  const from={min:parseFloat(tinput.min)||min, max:parseFloat(tinput.max)||max};
  S.temperature=clamp(S.temperature,min,max);
  if(rangeAnim) cancelAnimationFrame(rangeAnim);
  if(from.min===min && from.max===max){ paintRange(min,max); return; }
  const t0=performance.now(), dur=450, ease=x=>1-Math.pow(1-x,3);
  (function frame(now){
    const k=Math.min(1,(now-t0)/dur), e=ease(k);
    paintRange(from.min+(min-from.min)*e, from.max+(max-from.max)*e);
    rangeAnim = k<1 ? requestAnimationFrame(frame) : null;
  })(t0);
}

  return 'Liquid\nH-bonds forming\n& reforming';
}

/* ============================================================= *
 *  The lesson's text, on the model (annotate.js)
 *
 *  The rail belongs to the tutor, so what used to be a paragraph in the
 *  sidebar is a label on the atom it describes: the label says WHAT, the
 *  card says WHY, two sentences at most. Every anchor is a FUNCTION
 *  returning a live world point — every molecule here is being pushed
 *  around by the sim, so a baked coordinate comes adrift on frame one.
 * ============================================================= */
const NOTES=Annot.create(THREE, stage, camera, {mode:'on'});
const _wp=new THREE.Vector3();

/* The first hydrogen bond a given donor currently holds. Bonds are recomputed
   every frame, so this is re-read per frame rather than captured: a label that
   names a bond has to sit on the bond that is there NOW. */
function hbOf(donor){ return (donor && donor.userData.hbBonds || [])[0] || null; }

/* THE BOND UNDER THE LABEL, HELD AS LONG AS IT LASTS. Hydrogen bonds are
   re-solved every frame and a liquid breaks them constantly, so picking the
   first one each frame makes the label hop across the cluster, and capturing
   one donor for the whole step leaves the label stranded on a bare oxygen the
   moment that molecule lets go. Keep the current pair while it is still bonded;
   take the next one only when it is not. */
let hbDonor=null;
function hbAnchor(){
  if(!hbOf(hbDonor)) hbDonor=sim.mols.find(w=>hbOf(w))||null;
  const b=hbOf(hbDonor);
  if(!b) return _wp.copy((sim.mols[0]||{position:_wp}).position);
  return _wp.copy(hbDonor.userData.hWorld(b.h)).lerp(b.acc.userData.oWorld(),0.5);
}

/* THE BADGE'S EDGE, ON THE SIDE THE LABEL HANGS OFF. The charge callouts point
   at the badge rather than the atom under it — the badge is what the sentence
   is about, and the atom already carries its own letter — but a dot on the
   badge's centre lands on the glyph and hides it. So walk out from the centre
   by the sprite's radius, along the leader's own direction, in the camera's
   plane: a Sprite's scale IS its world size, and the badge always faces the
   camera, so the two basis vectors are the whole of the maths.

   `get` is a getter, not a sprite: buildCharges() replaces the badges whenever
   a colour changes in Debug ▸ Colors, and a captured sprite would be the old
   one, left in place and no longer drawn. */
const _cr=new THREE.Vector3(), _cu=new THREE.Vector3(), _cf=new THREE.Vector3();
function badgeEdge(get, dir){
  const n=Math.hypot(dir[0],dir[1])||1, ux=dir[0]/n, uy=dir[1]/n;   // screen y is DOWN
  return ()=>{
    const sp=get();
    if(!sp) return _wp.copy(sim.mols[0].userData.oWorld());
    sp.getWorldPosition(_wp);
    camera.matrixWorld.extractBasis(_cr,_cu,_cf);
    const r=sp.scale.x*0.5;
    return _wp.addScaledVector(_cr, r*ux).addScaledVector(_cu, -r*uy);
  };
}

/* The temperature slider's right edge, in the layer's own pixels. atPx, and

  return [b.right-st.left, b.top-st.top+b.height*0.5];

/* A GIVEN TEMPERATURE on the bar, not the bar's middle: "drag down to 0°C"
   should point at the 0°C the student is being sent to. The track is the range
   input itself, cold at the bottom, and its min/max move when salt depresses

  const lo=parseFloat(tinput.min), hi=parseFloat(tinput.max);
  const f=clamp((degC-lo)/((hi-lo)||1),0,1);
  return [r.right-st.left, r.bottom-st.top-f*r.height];
}

/* ---- the hydrogen bond, labelled once one exists ----
   Plus a beat after that, so the student watches the bond form rather than
   reading its name over a pair that is still drifting together. */
let hbNoted=false, hbNote=null, stepT0=0, hbSeenAt=0;
const HB_NOTE_WAIT=900;                    // ms after the step opens
const HB_NOTE_GRACE=700;                   // ms a label survives with no bond under it
function syncHbNote(){
  if(S.step!==1){ hbNoted=false; hbNote=null; return; }
  const now=performance.now();
  const live=sim.mols.some(hbOf);
  if(live) hbSeenAt=now;
  /* The label leaves with the bond. A liquid breaks and remakes these
     constantly, so it waits out a short grace period rather than blinking on
     every gap — but a callout left over a pair that has drifted apart is
     naming something that is not there. */
  if(hbNoted && !live && now-hbSeenAt > HB_NOTE_GRACE){
    if(hbNote) hbNote.remove();
    hbNoted=false; hbNote=null; stepT0=now;
    return;
  }
  if(hbNoted || now-stepT0 < HB_NOTE_WAIT || !live) return;
  hbNoted=true;
  hbNote=NOTES.add({text:'hydrogen bond', offset:[58,-30], at:hbAnchor,
    card:'Attraction between molecules, with no electrons shared. Each one is about 1/20 the strength of the covalent O–H and breaks constantly, so it is trillions of them at once that give water its properties.'});
  NOTES.setMode('reveal'); NOTES.play();
}

/* ---- the lattice, labelled when the water is actually frozen ----
   Until then the only callout is on the slider, because the claim this step
   makes ("ice is the open one") is not on screen yet and a label saying so
   over moving liquid is a caption arguing with the picture. The hint asks for
   the one action that makes it true. Warming back up puts the hint back. */
let iceState=null;                    // null | 'hint' | 'ice' — what is on screen now
function syncIceNotes(){
  if(S.step!==3) return;
  const frozen = (S.fz||0) >= 1;      // fz hits 1 at the freezing point itself
  const want = frozen ? 'ice' : 'hint';
  if(want===iceState) return;
  iceState=want;
  NOTES.clear();
  if(!frozen){
    /* On the bar's own 0°C caption rather than on the track: the caption is
       where the student's eye already is, and sitting on its line lets the
       leader run straight out to the right. */
    // No card: it is an instruction, and the whole answer is what happens when
    // the student follows it.
    NOTES.add({text:'drag down to freeze', offset:[120,0],
      atPx:()=>{ const st=NOTES.el.getBoundingClientRect(), c=tcoldEl.getBoundingClientRect();
                 return [c.right-st.left+14, c.top-st.top+c.height*0.5]; }});
  } else {
    const w=sim.mols[0]; if(!w) return;
    NOTES.add({text:'open hexagonal lattice', offset:[64,-36],
      at:()=>w.userData.oWorld(),
      card:'Frozen, each molecule is held by four neighbours at fixed arm\u2019s length. The cage props them farther apart than jostling liquid water does.'});
    const far=()=>{ let best=sim.mols[0], r=-1;
      sim.mols.forEach(m=>{ const d=m.position.length(); if(d>r){ r=d; best=m; } });
      return best.userData.oWorld(); };
    NOTES.add({text:'fewer molecules per litre', offset:[-64,40], at:far,
      card:'Wider spacing equals lower density, which is why ice floats on its own liquid. Almost nothing else does this.'});
  }
  NOTES.setMode('reveal'); NOTES.play();
}

/* ---- the ions, labelled when their shell exists ---- */
const saltNoted=new Map();
function syncSaltNotes(){
  if(S.step!==4){ if(saltNoted.size){ saltNoted.forEach(nt=>nt.remove()); saltNoted.clear(); } return; }
  // gone, or wedged back below a shell: the label goes with the fact
  saltNoted.forEach((nt,ion)=>{
    if(!salt.includes(ion) || ion.userData.shellCount<1){ nt.remove(); saltNoted.delete(ion); }
  });
  /* ONE LABEL PER SPECIES, not one per ion. Whichever ion gets a shell first carries it, and if
     that one loses its shell the next one takes over. */
  const labelled=ion=>[...saltNoted.keys()].some(k=>
    (k.userData.charge>0)===(ion.userData.charge>0));
  for(const ion of salt){
    if(saltNoted.has(ion) || ion.userData.shellCount<1 || labelled(ion)) continue;
    const cation=ion.userData.charge>0;
    /* No card */
    const nt=NOTES.add({
      text: cation ? 'Na⁺ attracts O' : 'Cl⁻ attracts H',
      offset: cation ? [-70,-34] : [70,34],
      at: ()=>_wp.copy(ion.position)});
    saltNoted.set(ion,nt);
  }
}

/* ---- one pair, seated in a hydrogen bond ----
   The acceptor sits at the origin and the donor an equilibrium O···O away,
   turned so ONE of its O–H bonds points back down the line between them: that
   is the geometry, and it puts the H about 2.0 from the acceptor's O, inside
   the engine's own 3.25 threshold, so the bond registers on the next frame
   rather than being drawn by decree. Everything after that is the sim's. */
function seatHBondPair(){
  const acc=sim.mols[0], don=sim.mols[1];
  if(!acc||!don) return;
  acc.position.set(0,0,0); acc.userData.vel.set(0,0,0);
  const axis=new THREE.Vector3(1,0.35,0).normalize();
  don.position.copy(axis).multiplyScalar(DBG.liquidEQ); don.userData.vel.set(0,0,0);
  // the donor's H1 points back at the acceptor; the acceptor turns its lone-pair
  // side (the O's back, away from its own H's) toward the incoming H
  don.quaternion.setFromUnitVectors(H1L.clone().normalize(), axis.clone().negate());
  acc.quaternion.setFromUnitVectors(H1L.clone().add(H2L).normalize(), axis.clone().negate());
}

let cur=-1;
const stepR=[8,18,20,24,20];
function applyStep(n){
  /* Leaving for step 1: it culls the sim down to one molecule, so there is no
     liquid left to draw once we are there. Take the inset tile's picture first
     and remember where we came from — the tile is the way back, and it should
     show the water the student was actually looking at. (Guarded because the
     inset is built after this function.) */
  if(n===0 && S.step!==0 && typeof drawBulk==='function'){ insetReturn=S.step; drawBulk(); }
  S.step=n;
  if(n===0){ while(sim.mols.length>1) sim.remove();
    // the surviving molecule may have drifted while part of a larger cluster on
    // other steps — recentre it so it rotates in place instead of off-axis
    // …and ENTER the step front-on: O up, both H's square to the viewer, which
    // is the portrait the text describes. Zero the molecule's rotation and put
    // the camera on its plane (theta 0, phi 90°); dragging still orbits from
    // there, so the student can turn it and come back by re-entering step 1.
    const w=sim.mols[0]; if(w){ w.position.set(0,0,0); w.userData.vel.set(0,0,0); w.rotation.set(0,0,0); }
    cam.theta=0; cam.phi=Math.PI/2; applyCam(); }
  else { while(sim.mols.length<3) sim.spawn(new THREE.Vector3((Math.random()-.5)*4,(Math.random()-.5)*4,(Math.random()-.5)*4)); }
  // Steps 2 and 3 are ABOUT a hydrogen bond, and the callout names one — so
  // hand the sim a pair already in the geometry rather than hoping three
  // randomly-thrown molecules land in it. From there the physics owns them.
  if(n===1||n===2) seatHBondPair();
  if(n===4){ while(sim.mols.length<16) sim.spawn(outerPoint(2.5)); }
  if(n<4) clearSalt();
  S.tempEnabled=n>=2; S.freezeEnabled=n>=3; S.saltEnabled=n>=4;
  applyDetail();

  saltcardEl.style.display=n>=4?'flex':'none';

  const m=stepMeta[n];
  stepClaimEl.textContent=m.claim;

/* ---------- where the model sits ----------
 *  The canvas is the whole window, so closed, the model is centred with no help
 *  at all. Open, the sheet takes the right-hand strip and the model slides left
 *  to clear it.
 *
 *  The slide is the camera's view offset, not a resize: the same-sized window is
 *  taken from further right in the frustum, which moves the content left without
 *  touching the canvas, the aspect, or one pixel of the lesson's chrome.
 *  Everything that projects through the camera — annotate.js's callouts
 *  included — comes along, since the offset is in the projection matrix.
 */
const ASK_EASE=0.16;
const ASK_GAP=18;               // the sheet's inset from the window edge, per ask/chat.css
let sheetW=334;
let askShift=0;                 // 0 = centred on the window, 1 = pushed clear of the sheet
let lastShiftPx=-1;
function applyAskShift(){
  const target=(ASK && ASK.el.classList.contains('on'))?1:0;
  askShift+=(target-askShift)*ASK_EASE;
  if(Math.abs(askShift-target)<0.002) askShift=target;
  /* Half the sheet's real footprint, measured rather than assumed: the sheet is
     narrower than the rail it sits in, and half of the wrong number leaves the
     model off-centre in the space that is actually left. offsetWidth is 0 while
     it is display:none, so the last measurement stands. */
  if(ASK && ASK.el.offsetWidth) sheetW=ASK.el.offsetWidth+ASK_GAP;
  const px=sheetW*0.5*askShift;
  if(Math.abs(px-lastShiftPx)<0.25) return;
  lastShiftPx=px;
  // the add-a-thing pills ride the same number, so they and the model move as one
  document.documentElement.style.setProperty('--shift', px.toFixed(1)+'px');
  const w=stage.clientWidth, h=stage.clientHeight;
  if(px<0.5) camera.clearViewOffset();
  else camera.setViewOffset(w,h,px,0,w,h);   // same size, taken further right
  camera.updateProjectionMatrix();
}

/* =============================================================
 *  THE EXPERIMENT LOG
 *

let didInset=false;

// c: {p (temperature params), hb (bonds this frame), escaping}
const TRIALS=[
 {text:'Open the single molecule. Read the two charges.',    test:()=>didInset},
 {text:'Heat it to 100°C. The bonds stretch before they go.',test:c=>S.temperature>=95},
 {text:'Boil it. Nothing escapes until its bonds are gone.', test:c=>c.escaping>0},
 {text:'Cool it to 0°C. Watch the lattice push apart.',      test:c=>c.p.fz>0.6},
 {text:'Add salt. Count the waters in one shell.',           test:()=>salt.some(m=>m.userData.shellCount>=5)},
 {text:'Freeze the salt water. 0°C is no longer cold enough.',test:c=>salt.length>0 && c.p.fz>0.3},
 /* THE CHALLENGE. It appears only once there is ice on the stage, because
    before that it is a riddle about nothing. `iceT` is the temperature the ice
    formed at: melting it by nudging the slider up is not the trick, so the win
    only counts while the water is still as cold as it was. */
 {text:'Melt the ice. Do not warm it.', tag:'Challenge', hidden:true,
  reveal:c=>c.p.fz>0.85,
  test:c=>salt.length>0 && c.p.fz<0.15 && S.temperature<=iceT},
];
let iceT=0;
const tryItemsEl=document.getElementById('tryitems'), tryCountEl=document.getElementById('trycount');
TRIALS.forEach(t=>{ const li=document.createElement('li');
  li.innerHTML='<div>'+(t.tag?'<span class="tag"></span>':'')+'<span class="txt"></span></div>';
  const body=li.firstChild;

  if(t.hidden) li.classList.add('locked');
  t.el=li; tryItemsEl.appendChild(li); });
function syncTrials(c){
  if(c.p.fz>0.85) iceT=S.temperature;   // the temperature the standing ice formed at
  let n=0, shown=0;
  for(const t of TRIALS){
    if(t.hidden && !t.shown){ if(!t.reveal(c)) continue; t.shown=true; t.el.classList.remove('locked'); }
    shown++;

    if(t.done) n++;
  }

}
syncTrials({p:{fz:0},escaping:0});   // draw the list before the first frame

/* ---------- main loop ---------- */
// Evaporating molecules rise well above the cluster and fade out over a tall band
// near the top before being recycled to the bottom, so they don't pop out abruptly.
const EVAP_FADE_LO=12, EVAP_TOP=22;   // start fading at LO, fully gone (and recycled) at TOP
function setMolOpacity(w,op){
  w.traverse(o=>{ if(o.isMesh && o.material){ o.material.transparent=(op<1); o.material.opacity=op; } });
}
let wasFreezing=false, wasBoiling=false;
function renderReadout(p,r,escaping){
  // handwritten phase descriptor beside the temperature readout
  if(S.tempEnabled && tdescEl) tdescEl.textContent=tempDescriptor(p);
  // step-5 salt readout: ion:water ratio + calculated (colligative) phase-change points
  if(S.step===4 && salt.length){
    const na=salt.find(m=>m.userData.charge>0), cl=salt.find(m=>m.userData.charge<0);
    const fp=Math.round(-p.dTf), bp=Math.round(100+p.dTb);
    saltinfoEl.innerHTML=
      `<b>${salt.length/2}</b> ${MolLib.MOLECULES[currentSalt].formula} : <b>${sim.mols.length}</b> H₂O `
      +`<span class="muted">· ${p.molal.toFixed(1)} m molality</span>`
      +`&nbsp;&nbsp;<span class="muted">|</span>&nbsp;&nbsp;`
 //     +`Na⁺ <b>${na.userData.shellCount}/6</b> · Cl⁻ <b>${cl.userData.shellCount}/6</b>`
 //     +`&nbsp;&nbsp;<span class="muted">|</span>&nbsp;&nbsp;`
      +`freezes <b class="cold">${fp}°C</b> · boils <b class="hot">${bp}°C</b> `;
    saltinfoEl.style.display='block';
  } else saltinfoEl.style.display='none';
}
function loop(){
  const solvent=(S.step===4);
  // Roomier spacing on every multi-molecule step (not just the solvent scene) so
  // the network reads clearly: gentler cluster pull + a larger steric minimum.
  sim.cfg.centroidPull = DBG.centroidPull;
  sim.cfg.kHB          = solvent?DBG.kHB:0.008;
  sim.cfg.MIN          = DBG.stericMIN;
  sim.cfg.EQ           = solvent?3.6:DBG.liquidEQ;
  sim.cfg.hbThreshold  = DBG.hbThreshold;
  const want=Math.max(S.targetR, fitDistance()); // live auto-fit; manual wheel zoom (S.targetR) always wins
  cam.r += (want - cam.r)*0.05; applyCam();
  const p=tempParams();
  // Heat loosens the H-bond network: rest length and draw reach stretch with warmth,
  // so bonds visibly lengthen before breaking (the weaker force + jitter still thin
  // the count out, so hotter water shows fewer, longer, strained bonds — as in reality).
  const warmStretch=1+p.warm*DBG.warmStretch;
  sim.cfg.EQ*=warmStretch; sim.cfg.hbThreshold*=warmStretch;
  S.fz=p.fz;
  if(salt.length && wasFreezing && p.fz<0.05) assignShells();   // melting: re-form hydration shells
  wasFreezing = p.fz>0.3;
  // condensing back below the boiling point re-forms depleted shells
  if(salt.length && wasBoiling && p.evapProb<=0 && !anyDescending()) assignShells();
  wasBoiling = p.evapProb>0;
  // base thermal jiggle: quieted by freezing, amplified by warmth so heating visibly
  // speeds molecules up well before the boiling threshold kicks in escape behavior
  sim.cfg.jitter = (S.step===0)?0:(solvent?DBG.jitter:0.006)*(1-p.fz*0.92)*(1+p.warm*1.4);
  if(S.freezeEnabled && p.fz>0.02){ if(iceFor!==sim.mols.length) assignIce(); } else iceFor=-1;
  let escaping=0;
  const r=sim.step({ showHbonds:S.hbondsOn && S.step>=1, hbScale:p.hbScale, hook:(w,i,f)=>{
    if(S.tempEnabled && p.kinetic>0) f.add(new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).multiplyScalar(p.kinetic));
    if(p.fz>0 && w.userData.iceSite) f.add(new THREE.Vector3().subVectors(w.userData.iceSite,w.position).multiplyScalar(0.035*p.fz));
    if(w.userData.escaped){ if(p.evapProb<=0){ w.userData.escaped=false; setMolOpacity(w,1); } else { f.set(0,0.055,0); escaping++; } }
    // A molecule can only break free once it's lost most of its H-bonds: escape
    // chance falls off with how many bonds it still holds (last frame's tally), so
    // you see bonds break BEFORE a molecule leaves — the energy-of-vaporization story.
    else if(p.evapProb>0){
      const bondFactor=clamp(1-(w.userData.hb||0)*0.5,0,1);   // 0 bonds→1×, 1→0.5×, ≥2→0
      if(bondFactor>0 && Math.random()<p.evapProb*bondFactor){ w.userData.escaped=true; releaseFromShell(w); }
    }
    // escaping waters break free of the hydration shell (boiling leaves the salt behind)
    if(salt.length && !w.userData.escaped){
      const ion=w.userData.shellIon;
      if(ion){ // spring toward this water's octahedral seat in the ion's shell
        const cat=ion.userData.charge>0;
        const sd=cat?DBG.naShellDist:DBG.clShellDist, sk=(cat?DBG.naShellK:DBG.clShellK)*(1-p.fz);
        const site=ion.position.clone().addScaledVector(OCTA[w.userData.shellSlot], sd);
        f.add(new THREE.Vector3().subVectors(site,w.position).multiplyScalar(sk));   // shells release as ice takes over
      } else ionForceOnWater(w,f);
    }
  }});
  if(p.fz>0.02) sim.mols.forEach(w=>{ if(w.userData.iceQuat) w.quaternion.slerp(w.userData.iceQuat,0.08*p.fz); });
  else if(salt.length) orientShells();
  sim.mols.forEach(w=>{ if(!w.userData.escaped) return;
    if(w.position.y>=EVAP_TOP){   // faded out at the top → recycle back into the pool
      w.position.set((Math.random()-.5)*4,-5,(Math.random()-.5)*4);
      w.userData.vel.set(0,0,0); w.userData.escaped=false; setMolOpacity(w,1);
    } else {                      // fade with height as it drifts up past the cluster
      setMolOpacity(w, clamp((EVAP_TOP-w.position.y)/(EVAP_TOP-EVAP_FADE_LO),0,1));
    } });
  if(salt.length){ checkSaltArrival(); checkDissociation(); updateIons(); separateIonsFromWater(); updateSaltBonds(); updateIonBonds(); } else clearIonBonds();
  renderReadout(p,r,escaping);
  syncTrials({p, hb:r.hbondCount, escaping});
  FXi.step();
  // letters/badges ride just proud of their own atom's front surface — see
  // atomkit.js faceCamera(); needs the camera's final position for this frame
  if(detail.visible) kit.faceCamera(camera);
  applyAskShift(); syncWaterNudge();
  syncHbNote(); syncIceNotes(); syncSaltNotes();
  NOTES.step();                 // trap 1: the RENDER loop, so orbiting keeps the labels on their atoms
  renderer.render(scene,camera); renderInset(); requestAnimationFrame(loop);
}

applyCam(); resize(); applyStep(4); syncInset(); requestAnimationFrame(loop);

/* =============================================================================
 *  The tutor drawer
 * =============================================================================
 *  `ask/chat.js` owns the panel, the transcript and the network. This block is
 *  the lesson's half: what each of its own target ids MEANS on this scene.
 *  Everything below reads the lesson's existing state and calls its existing
 *  functions, so the tutor has no privileged access and cannot reach anything
 *  a student could not.
 * ========================================================================== */

/* A molecular point is made by dimming, not by drawing: everything else fades
   to a ghost for a few seconds so the thing named is the only thing lit. That
   reuses the fade the evaporation code already applies per molecule, so nothing
   new has to know how a water molecule is built. */
// Stamped by its own frame request, so it pauses exactly when the lesson's loop
// does and the state provider can tell a still scene from a stopped one.
let lastFrame = 0;
(function stamp() { lastFrame = performance.now(); requestAnimationFrame(stamp); })();

/* kit/focus.js is the vocabulary: ghost the rest to 13% without depth-write,
   light the chosen so they emit their OWN colour, and light a bond only when
   both its ends are lit. A lit oxygen stays red, which is the point: the
   highlight must never recolour chemistry. */
const focus = Focus.create({ glow: 0.55 });
let spotTimer = null;

function unfocus() {
  clearTimeout(spotTimer);
  focus.clear();
}

/* Whole molecules against each other, for a group whose meaning is the group:
   a hydration shell is six waters and their orientation, not six oxygens. */
function spotMolecules(keep, ms = 3600) {
  unfocus();
  focus.among([...sim.mols, ...salt], keep);
  spotTimer = setTimeout(unfocus, ms);
}

/* Named atoms inside named molecules. `picks` is [[molecule, [indices]], …]
   with 0=O, 1=Ha, 2=Hb; every other molecule ghosts whole. This is the level
   the three molecular targets actually wanted: "that oxygen", not "that
   molecule with an oxygen in it". */
function spotAtoms(picks, ms = 3600) {
  unfocus();
  const involved = picks.map(p => p[0]);
  focus.among([...sim.mols, ...salt], involved);
  picks.forEach(([mol, idx]) => focus.atoms(mol, idx));
  spotTimer = setTimeout(unfocus, ms);
}

/* A ring over a control, in screen space. The controls live on the stage rather
   than in the rail, so the drawer never covered them and this only has to say
   "here", not move anything out of the way. */
/* A control only exists from the step that introduces it: the temperature bar
   appears at Specific Heat, the salt card at The Universal Solvent. Pointing at
   one from step 1 would ring an empty rectangle, so take the student to the step
   that has it first. */
const uiStep = { trange: 2, addsalt: 4, addwater: 1 };

const ping = Ask.ping;   // the gesture is the module's; which control is this page's

/* One hydrogen bond the sim made this frame: which molecule donated, which
   hydrogen it donated, and which molecule accepted. Read straight off the
   matcher's own record, so the atoms lit are the atoms the bond was drawn
   between. Null when nothing is bonded, which is a real answer on a sparse
   scene rather than something to paper over. */
function aHydrogenBond() {
  for (const w of sim.mols) {
    const b = (w.userData.hbBonds || [])[0];
    if (b) return { donor: w, hIndex: b.h + 1, acceptor: b.acc };   // 0=O, so H is h+1
  }
  return null;
}

const ASK = Ask.chat({
  rail: document.getElementById('side'),
  slot: document.getElementById('askslot'),
  lesson: 'water-lab',

  /* Two questions a student actually arrives with, and one that shows the box
     is worth more than a search bar: methane is nearly the same size as water
     and is a gas at room temperature, which is hydrogen bonding's whole point
     and lives in another lesson, so it also demonstrates being sent there. */
  examples: [
    'Is that the same bond the whole time?',
    'If it dissolves everything, why not oil?',
    'How do we make ice cream?',
  ],
  step: () => cur,
  stepName: () => stepMeta[cur] ? stepMeta[cur].tab : '',

  /* What the student can see, read from the readouts they are reading. The
     temperature and the phase come off the DOM rather than off S and a second
     copy of tempDescriptor's thresholds, so the tutor and the student are
     quoting the same string, and a change to the descriptor reaches both.
     Counts come from the sim, which is where a count actually lives. */
  state() {
    const txt = id => (document.getElementById(id)?.textContent || '').trim();
    const st = { molecules: sim.mols.length };

    // The lesson judges its own scene rather than shipping a threshold for the
    // model to compare against. Asked to do the arithmetic, it told a student
    // with thirteen molecules to add more; given the word, it stops.
    const n = sim.mols.length;
    st.crowding = n < 3 ? 'nearly empty, almost nothing to bond to'
                : n < 8 ? 'sparse, too few neighbours for the bonding to look like much'
                        : 'a comfortable crowd, enough for the network to show';

    // Anything the render loop computes is only true while the loop is running,
    // and a background tab pauses rAF. A paused frame would report zero bonds
    // and no phase, which reads as "the bonds broke" rather than "nobody
    // looked". Report those only when a frame is actually recent.
    if (performance.now() - lastFrame < 900) {
      const bonds = sim.mols.reduce((n, w) => n + (w.userData.hb || 0), 0);
      st.hydrogenBonds = Math.round(bonds / 2);   // each bond is counted at both ends
    }
    if (S.tempEnabled) {
      st.temperature = txt('tval');
      const phase = txt('tdesc').split('\n')[0];   // "Frozen", "Boiling", "Liquid"…
      if (phase) st.phase = phase;
    }
    if (S.saltEnabled) {
      st.saltAdded = salt.length ? `yes, ${salt.length} ions` : 'not yet';
      const info = txt('saltinfo');
      if (info) st.saltReadout = info;
    }
    return st;
  },

  /* Return false and the drawer says so rather than pretending it acted. */
  act(t) {
    const id = t.id.split('/')[1];

    if (t.kind === 'step') { applyStep(t.at); return true; }

    if (t.kind === 'ui') {
      // The temperature bar runs hot at the top, so its maximum is at the end a
      // slider's value maps to LAST. Only this page can know that, so it says.
      const o = { invert: true };
      const need = uiStep[t.el] || 0;
      if (cur < need) { applyStep(need); setTimeout(() => ping(t.el, o), 550); return true; }
      return ping(t.el, o);
    }

    // The molecular three. Each needs its own step to be on screen at all, so
    // each takes the student there first when they are somewhere else, then
    // waits for the scene to settle before lighting anything.
    const after = (ms, fn) => setTimeout(fn, ms);

    // The oxygen alone, with its own two hydrogens ghosted. That contrast IS
    // the claim: this end of the molecule is the negative one. Lighting the
    // whole molecule would have said "this molecule", which nobody asked.
    if (id === 'the-charges') {
      if (cur > 1) applyStep(1);
      after(cur > 1 ? 600 : 0, () => { if (sim.mols[0]) spotAtoms([[sim.mols[0], [0]]]); });
      return true;
    }

    // The two atoms the bond runs between, one from each molecule: the donated
    // hydrogen and the oxygen accepting it. Everything else on both molecules
    // ghosts, so what is left lit is the bond's own geometry.
    if (id === 'a-hydrogen-bond') {
      if (cur < 1) applyStep(1);
      after(cur < 1 ? 900 : 0, () => {
        const b = aHydrogenBond();
        if (b) spotAtoms([[b.donor, [b.hIndex]], [b.acceptor, [0]]]);
      });
      return true;
    }

    if (id === 'hydration-shell') {
      if (cur !== 4) applyStep(4);
      after(cur !== 4 ? 900 : 0, () => {
        if (!salt.length) addSalt();
        after(700, () => {
          const ion = salt[0];
          if (!ion) return;
          // The shell the sim SEATED, not the six waters that happen to be
          // nearest. Those are usually the same set and sometimes are not, and
          // when they differ the nearest-six is the wrong answer: a water can
          // sit close without being in the shell, and a seated one can drift.
          //
          // Seating happens when the crystal reaches the water, which is a
          // second or two after it is dropped, so wait for it rather than
          // lighting nothing. If it never seats, light the ion alone: still
          // true, and still shows the student where to look.
          let tries = 0;
          (function whenSeated() {
            const shell = sim.mols.filter(w => w.userData.shellIon === ion);
            if (shell.length) return spotMolecules([ion, ...shell], 4400);
            if (++tries < 20) return setTimeout(whenSeated, 250);
            spotMolecules([ion], 3000);
          })();
        });
      });
      return true;
    }

    return false;
  },
});
</script>
