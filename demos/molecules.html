<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script defer src="/demos/lib/site.js"></script>
<!-- Served at /molecules by a vercel.json rewrite, which does not move the file. -->
<base href="/demos/">
<title>Molecules — Kodolab</title>
<meta name="description" content="Every molecule Kodolab draws, grouped by where it is used, each one turnable.">

<!-- ===================================================================
     EVERY MOLECULE, GROUPED. library.html shows a shelf of ten and sends
     the reader here; this page is the whole of MolLib.MOLECULES.

     THE CARDS ARE READ FROM THE REGISTRY, so a new mol-*.js spec appears
     here by being registered. Every card is a baked still
     (media/molecules); a molecule becomes turnable in the modal, on the
     one live context this page makes, on the two views lib/molview.js
     offers: the model, and the same spheres slid onto the diagram's flat
     layout. `#key` in the URL opens that molecule, which is the link
     library.html's cards carry.
     =================================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/kodo.css">

<style>
  :root { --page-max: 1180px }

  /* The same track library.html's molecule shelf uses, so a card is the same
     size on both pages. */
  .grid{display:grid;gap:calc(var(--page-gap) * .7);
    grid-template-columns:repeat(3,1fr)}
  @media (min-width:900px){ .grid{grid-template-columns:repeat(5,1fr)} }

  .card{background:var(--surface-card);border:1px solid var(--border-hair);border-radius:4px;
    overflow:hidden;display:flex;flex-direction:column;color:inherit;text-decoration:none;
    transition:border-color .18s,transform .18s,box-shadow .18s;cursor:pointer}
  .card:hover{border-color:var(--accent);transform:translateY(-3px);
    box-shadow:0 10px 26px rgba(20,22,26,.07)}
  /* A fixed-height stage: a grid whose rows are sized by their picture reflows
     as the stills land, and every card jumps. */
  .stage{position:relative;height:140px;background:var(--paper);
    border-bottom:1px solid var(--border-hair);
    background-size:contain;background-position:center;background-repeat:no-repeat}
  .body{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;flex:1}
  .name{font-family:var(--font-display);font-size:1.05rem;font-weight:500;letter-spacing:-0.02em;
    line-height:1.12;margin:0}
  .does{display:inline-block;align-self:flex-start;margin:.5rem 0 0;
    font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
    font-weight:600;color:var(--accent)}
  .facts{display:flex;flex-wrap:wrap;gap:6px;margin:auto 0 0}
  .fact{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
    padding:3px 8px;border-radius:999px;border:1px solid var(--border-hair);
    background:var(--paper);color:var(--muted)}
  /* The formula in the UI face, not the mono: a mono's subscripts are drawn on
     the same fixed advance as its capitals, so C27H33N9O15P2 comes out as a
     line of code rather than as a formula. The mono is for the recipe. */
  .formula{font-size:.8rem;color:var(--text-muted);margin:.35rem 0 0}

  /* One group of molecules: a small caption over its part of the grid. */
  .group{grid-column:1/-1;margin:1.2rem 0 -.2rem;font-size:.7rem;letter-spacing:.16em;
    text-transform:uppercase;font-weight:600;color:var(--text-muted)}
  .group:first-child{margin-top:0}

  /* ---- the molecule modal: proteins/index.html's sheet, one molecule -----
     `.mmodal`, not `.modal`: kodo.css §10.3 owns `.modal` and its heading. */
  .mmodal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;
    justify-content:center;padding:clamp(1rem,4vw,3rem);
    background:rgba(20,22,26,.55);backdrop-filter:blur(3px)}
  .mmodal[hidden]{display:none}
  .sheet{position:relative;background:var(--surface-card);
    border:1px solid var(--border-hair);border-radius:6px;
    box-shadow:0 24px 70px rgba(20,22,26,.28);
    width:min(900px,100%);height:min(100%,560px);overflow:hidden;
    display:grid;grid-template-columns:1.1fr 1fr}
  .mstage{position:relative;background:var(--paper);
    border-right:1px solid var(--border-hair);min-height:0}
  .mstage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .stagebar{position:absolute;z-index:2;left:0;right:0;bottom:1rem;
    display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;align-items:center}
  .stagebar:empty,.stagebar[hidden]{display:none}
  /* Both instruments stand on the model's paper, so the ghost capsule carries
     the card's own surface: over a molecule, a transparent chip is a floating
     outline. */
  .stagebar .pill--check,
  .stagebar .pill--check:hover:not([disabled]){background:var(--surface-card)}
  .mbody{padding:clamp(1.4rem,3vw,2.2rem);display:flex;flex-direction:column;
    min-height:0;overflow-y:auto}
  @media (max-width:800px){
    .sheet{grid-template-columns:1fr;height:auto;max-height:100%;overflow:auto}
    .mstage{height:300px;border-right:0;border-bottom:1px solid var(--border-hair)}
    .mbody{overflow:visible}
  }
  .mbody .does{margin:0 0 .5rem}
  .mbody .name{font-weight:400;font-size:clamp(26px,3vw,36px);color:var(--text-strong)}
  .mbody .formula{font-size:1rem;margin:.5rem 0 0}
  .measure{display:flex;gap:1.1rem 1.9rem;flex-wrap:wrap;margin:1.3rem 0 1.4rem;
    padding:1.1rem 0 0;border-top:1px solid var(--border-hair)}
  .measure div{min-width:6.5rem}
  .measure b{display:block;font-family:var(--font-display);font-weight:500;
    font-size:1.35rem;line-height:1.1;letter-spacing:-0.02em;color:var(--ink)}
  .measure span{display:block;margin-top:.3rem;font-size:.76rem;color:var(--muted)}
  .hint{font-size:.78rem;color:var(--muted);margin:0 0 1rem}
  /* How to ask for it: the words the codebase uses, for whoever builds with it. */
  .recipe{margin-top:auto;font-family:var(--font-mono,ui-monospace,monospace);font-size:.78rem;
    line-height:1.6;color:var(--text-body);background:var(--paper);
    border:1px solid var(--border-hair);border-radius:4px;padding:.7rem .9rem;white-space:pre-wrap}
  .x{position:absolute;top:.6rem;right:.7rem;z-index:2;width:32px;height:32px;border-radius:999px;
    cursor:pointer;border:1px solid var(--border-hair);background:var(--surface-card);
    color:var(--muted);font-size:1.1rem;line-height:1}
  .x:hover{color:var(--ink);border-color:var(--accent)}
</style>
</head>
<body class="kodo">
<div class="page">
  <nav class="sitenav">
    <a class="mark" href="/"><img src="/kodolab-wordmark.svg" alt="kodolab"></a>
    <span class="crumb">biology</span>
  </nav>

  <header class="pagehead">
    <h1>molecules</h1>
    <p class="meta" id="tally">&mdash;</p>
  </header>

  <p class="lede">Every molecule the lessons and generated apps draw, grouped by where it is
    used. Open one to turn it.</p>

  <main>
    <div class="grid" id="mol-grid"></div>
  </main>
</div>

<div class="mmodal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-name">
    <button class="x" id="m-close" aria-label="Close">&times;</button>
    <div class="mstage" id="m-stage">
      <!-- On-stage instruments (kodo.css §.segmented, §.pill), each shown only
           where the spec supports it: a molecule with no `flat2d` cannot lie
           down, and one with no `optH` has no C-H hydrogens to hide. -->
      <div class="stagebar" id="m-bar">
        <div class="segmented segmented--sm" id="m-modes" role="group" aria-label="View" hidden>
          <button type="button" data-mode="3d" aria-pressed="true">3D</button>
          <button type="button" data-mode="2d" aria-pressed="false">2D</button>
        </div>
        <label class="pill pill--ghost pill--check" id="m-hyd" hidden>
          <input type="checkbox" id="m-hyd-in"> C&ndash;H hydrogens</label>
      </div>
    </div>
    <div class="mbody">
      <p class="does" id="m-does"></p>
      <h2 class="name" id="m-name"></h2>
      <p class="formula" id="m-formula"></p>
      <div class="measure" id="m-measure"></div>
      <p class="hint" id="m-hint"></p>
      <pre class="recipe" id="m-recipe"></pre>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="lib/palette.js"></script>
<script src="lib/tokens-from-palette.js"></script>
<script src="lib/molecules.js"></script>
<!-- Every domain file, in MolLib.DOMAINS order. tools/molecule-stills.html
     loads the same list, so a still exists for everything drawn here. -->
<script src="lib/skel.js"></script>
<script src="lib/mol-small.js"></script>
<script src="lib/mol-aminoacids.js"></script>
<script src="lib/mol-pathways.js"></script>
<script src="lib/mol-krebs.js"></script>
<script src="lib/mol-carriers.js"></script>
<script src="lib/mol-sugars.js"></script>
<script src="lib/mol-glycans.js"></script>
<script src="lib/mol-lipids.js"></script>
<script src="lib/mol-nucleic.js"></script>
<script src="lib/scene.js"></script>
<script src="lib/molview.js"></script>
<script src="kit/card-stage.js"></script>
<script src="lib/mol-shelf.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const MOLS = MolShelf.list();
const BY_KEY = new Map(MOLS.map(m => [m.key, m]));

const molGrid = $('mol-grid');
let lastDomain = null;
for (const m of MOLS) {
  if (m.spec.domain !== lastDomain) {
    const h = document.createElement('div');
    h.className = 'group';
    h.textContent = MolShelf.groupOf(m.spec.domain);
    molGrid.appendChild(h);
    lastDomain = m.spec.domain;
  }
  const el = MolShelf.card(m, document.createElement('article'));
  el.addEventListener('click', () => openModal(m));
  molGrid.appendChild(el);
}
$('tally').textContent = `${MOLS.length} molecules`;

/* ---- the molecule modal ---------------------------------------------------
   THE BOX IS lib/molview.js's, not a stage of our own. It owns the two views
   this modal offers and the morph between them: 2D is the same spheres sliding
   onto the diagram's layout, so the reader watches one molecule lie down rather
   than being shown a second picture of it. It also owns the opening pose (the
   spec's declared `view:`, or MolView.flatPose where it declares none, which is
   the pose the card's still was baked in) and the drag, which turns the MODEL.

   kit/card-stage.js owns everything around it: one canvas, the loop, and a
   destroy that hands the WebGL context back — a canvas that has lost one is
   never granted another, so the box is new on every open. */
const modal = $('modal'), modes = $('m-modes'), bar = $('m-bar');
const hyd = $('m-hyd'), hydIn = $('m-hyd-in');
let box = null, view = null;

const HINT = { '3d': 'Drag to turn.',
               '2d': 'The layout is the diagram\u2019s. Only the bond lengths are the molecule\u2019s.' };

function setMode(next) {
  if (!view) return;
  view.setMode(next);
  for (const b of modes.children) b.setAttribute('aria-pressed', String(b.dataset.mode === next));
  /* The flat layout folds every hydrogen into the atom it hangs on, so the
     checkbox has nothing to say there. Disabled rather than hidden: a control
     that vanishes reads as one you imagined. The attribute is on the label too,
     because that is what carries the dimming. */
  hydIn.disabled = next !== '3d';
  hyd.toggleAttribute('disabled', next !== '3d');
  $('m-hint').textContent = HINT[next];
}
modes.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) setMode(b.dataset.mode);
});

/* The nonpolar C-H's, which a spec lists in `optH`. Off to begin with, the way
   a textbook figure leaves them out: they are most of the atoms and none of the
   chemistry. An H on N or O is never in that list, so the H-bond donors stay. */
function setHydrogens(on) {
  if (!view) return;
  view.setOptionalH(on);
  hydIn.checked = on;
}
hydIn.addEventListener('change', () => setHydrogens(hydIn.checked));

function openModal(m) {
  const s = m.spec;
  $('m-name').textContent = s.name;
  $('m-formula').textContent = s.formula || '';
  const does = $('m-does');
  does.className = 'does'; does.textContent = s.class || '';
  $('m-recipe').textContent = `MolLib.MOLECULES.${m.key}\nlib/${s.domain}`;

  /* Counted or measured at render, never typed. Span is in real ångströms:
     Stage.measure divides SCALE back out. */
  const heavy = s.atoms.filter(a => a.el !== 'H').length;
  const rings = (s.topology && s.topology.rings) || [];
  const tiles = [
    [s.atoms.length, 'atoms'],
    [heavy, 'heavy atoms'],
  ];
  /* A span needs two heavy atoms to be between: methane's one carbon would
     report 0.0 Å, which reads as a measurement rather than as nothing. */
  if (heavy > 1) tiles.push([Stage.measure(s).span.toFixed(1) + ' Å', 'widest span']);
  if (rings.length) tiles.push([rings.length, rings.length === 1 ? 'ring' : 'rings']);
  const measure = $('m-measure');
  measure.innerHTML = '';
  for (const [n, label] of tiles) {
    const d = document.createElement('div');
    d.innerHTML = '<b></b><span></span>';
    d.querySelector('b').textContent = n;
    d.querySelector('span').textContent = label;
    measure.appendChild(d);
  }

  const mount = $('m-stage');
  mount.style.background = `url(media/molecules/${m.key}.webp) center/contain no-repeat var(--paper)`;
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
  $('m-close').focus();

  /* Built after the modal is shown: a box with no size cannot be fitted.
     `orbit:false` because MolView turns the MODEL — a camera that also moved
     would make the flat layout tiltable, and a layout you can tilt has stopped
     saying that its angles are not the molecule's. */
  box = CardStage.create({
    mount,
    stage: { ortho: true, cam: { theta: 0, phi: Math.PI / 2, r: 40 }, orbit: false },
    step: () => { if (view) view.step(); },
    onResize: () => { if (view) view.fit(); },
  });
  modes.hidden = !(s.flat2d && s.flat2d.length);
  hyd.hidden = !(s.optH && s.optH.length);
  bar.hidden = modes.hidden && hyd.hidden;
  /* The instruments stand ON the stage, so the frame the molecule is fitted
     into stops above them — which is what `usable` is for, and it matters most
     for a wide flat layout. A hidden bar has a zero-sized box, and a zero box
     measured as an edge reserves the whole stage, so skip it. */
  const around = MolView.usableAround($('m-stage'), { bottom: [bar] });
  view = MolView.create({ canvas: box.canvas, camera: box.stage.camera,
                          applyCam: box.stage.applyCam, root: box.stage.root,
                          usable: () => bar.hidden ? { fw: 1, fh: 1 } : around() });
  view.show(s);
  view.fit();
  setMode('3d');
  setHydrogens(false);
  // One frame now, so the box is never blank in the gap before the loop runs.
  box.draw();
  mount.style.backgroundImage = '';
}

function closeModal() {
  if (modal.hidden) return;
  if (box) { box.destroy(); box = null; view = null; }
  $('m-stage').style.background = '';
  modal.hidden = true;
  document.body.style.overflow = '';
}
$('m-close').addEventListener('click', closeModal);
modal.addEventListener('mousedown', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* library.html's shelf links here as /molecules#<key>. */
function openFromHash() {
  const m = BY_KEY.get(decodeURIComponent(location.hash.slice(1)));
  if (m) { closeModal(); openModal(m); }
}
window.addEventListener('hashchange', openFromHash);
openFromHash();
</script>
</body>
</html>
