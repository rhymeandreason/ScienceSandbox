<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA replication — copying a strand</title>

<!-- ===================================================================
     WHERE PAIRING AND THE BACKBONE HAPPEN AT ONCE, which is the honest
     order and the one the other DNA pages cannot show. A strand is a
     covalent chain and pairing is what holds two chains together, so
     "pairs assemble, then get stitched" is backwards — and here it is
     visibly backwards: every nucleotide the student adds makes its
     hydrogen bonds to the template AND its phosphodiester bond to the
     strand in the same beat.

     THE MOLECULE IS 1BNA, as everywhere else in this family. The new
     strand's nucleotides land on the record's own coordinates for the
     partner they replace, so the finished copy is the crystal's, and the
     bond lengths the page quotes are measured rather than asserted.

     WHAT THE STUDENT DOES is choose a letter, not drag a piece. Twelve
     drags is tedium; twelve choices is the pairing rule, twelve times.
     =================================================================== -->

<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/sandbox.css">
<link rel="stylesheet" href="css/annotate.css">
<style>
  /* No side panel: the stage is the whole page. */
  #app{grid-template-columns:1fr}
  #stage{grid-column:1}

  /* Step rail, down the left, out of the way of the molecule. */
  #steps{position:absolute;left:20px;top:50%;transform:translateY(-50%);z-index:7;
    display:flex;flex-direction:column;gap:7px}
  #steps button{display:block;cursor:pointer;text-align:left;width:180px;
    font-family:var(--font-sans);font-size:12.5px;font-weight:600;
    padding:8px 13px;border-radius:10px;
    border:2px solid transparent;background:transparent;color:var(--muted)}
  #steps button span{display:block;font-weight:400;font-size:11px;opacity:.75}
  #steps button:hover:not(:disabled){color:var(--ink);background:rgba(0,0,0,.04)}
  #steps button[aria-current="true"]{color:var(--ink);border-color:var(--ink);
    background:rgba(255,255,255,.62)}
  #steps button:disabled{opacity:.38;cursor:default}

  /* ---- THE STRIP: the sequence, as a thing you can read ------------------
     The 3D says what a nucleotide IS; the strip says where in the strand this
     one goes. Two rows, because the claim is an alignment: the template on
     top, what has been built under it, and the gap between them travelling
     left to right as the copy is made. */
  #strip{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:7;
    display:none;flex-direction:column;align-items:center;gap:9px;
    background:rgba(255,255,255,.86);border:2px solid var(--ink);border-radius:12px;
    padding:12px 16px 13px}
  #strip.on{display:flex}
  #strip .rows{display:flex;flex-direction:column;gap:3px}
  #strip .row{display:flex;gap:3px}
  #strip .cell{width:23px;height:23px;display:grid;place-items:center;border-radius:5px;
    font-family:var(--font-slab);font-size:13px;color:var(--ink);
    background:rgba(0,0,0,.05)}
  #strip .row.built .cell{background:transparent;border:1px dashed rgba(0,0,0,.18);
    color:var(--muted)}
  #strip .row.built .cell.done{background:#0042aa;border-color:#0042aa;color:#fff}
  /* The cursor is on BOTH rows: the template letter being read, and the empty
     slot it is being read into. */
  #strip .cell.at{outline:2px solid var(--ink);outline-offset:1px}
  #strip .cell.wrong{background:#b3261e;color:#fff}
  /* A letter the fork has not reached yet is still paired up, and cannot be
     read: the strip says so rather than offering it. */
  #strip .row.template .cell.shut{opacity:.32}
  #strip .picks{display:flex;gap:7px;margin-top:2px}
  #strip .picks button{cursor:pointer;width:34px;height:28px;border-radius:7px;
    border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);
    font-family:var(--font-slab);font-size:14px}
  #strip .picks button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
  #strip .picks button:disabled{opacity:.35;cursor:default}
  #strip .ends{display:flex;justify-content:space-between;width:100%;
    font-family:var(--font-sans);font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted)}

  /* THE ONE BUTTON. It sits where the strip will be, because it is the same
     slot in the lesson: the thing the student acts on. Pressing it is what
     starts the fork, so the opening reads as something they did. */
  #start{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);z-index:7;
    display:none;cursor:pointer;padding:11px 22px;border-radius:10px;
    border:2px solid var(--ink);background:var(--ink);color:var(--paper);
    font-family:var(--font-sans);font-size:13.5px;font-weight:600}
  #start.on{display:block}
  #start:hover{background:var(--paper);color:var(--ink)}

  /* What is happening, in a sentence. Same slot and same object as the other
     DNA pages, so the three read as one lesson. */
  #note{position:absolute;left:50%;bottom:160px;transform:translateX(-50%);
    z-index:7;display:none;max-width:min(620px,66vw);text-align:center;
    font-family:var(--font-sans);font-size:13.5px;line-height:1.5;color:var(--ink);
    background:var(--paper);padding:8px 17px;border-radius:9px}
  #note.on{display:block}
  #note b{font-weight:600}
  #note.low{bottom:26px}
</style>

<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <nav id="steps"></nav>
    <div id="note"></div>
    <button id="start" type="button">Open the fork</button>
    <div id="strip">
      <div class="rows">
        <div class="row template"></div>
        <div class="row built"></div>
      </div>
      <div class="ends"><span>template 3′</span><span>5′</span></div>
      <div class="picks"></div>
    </div>
    <div id="brand"><span class="drop"><i class="ph-bold ph-dna"></i></span><h1>Replication</h1></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="lib/palette.js"></script>
<script src="lib/tokens-from-palette.js"></script>
<script src="lib/molecules.js"></script>
<script src="lib/skel.js"></script>
<script src="lib/mol-nucleic.js"></script>
<script src="lib/mol-sugars.js"></script>
<script src="lib/scene.js"></script>
<script src="lib/fx.js"></script>
<script src="lib/annotate.js"></script>
<script src="kit/motion.js"></script>
<script src="kit/stagekit.js"></script>
<script src="kit/hbond.js"></script>
<script src="dna/attach.js"></script>
<script src="dna/nucleotide.js"></script>
<script src="dna/data/bdna.js"></script>
<script>
"use strict";

const S = MolLib.SCALE;
const bdna = window.BDNA;
const stage = document.getElementById('stage');
const note = document.getElementById('note');
const stripEl = document.getElementById('strip');
const startEl = document.getElementById('start');

/* DROP `view:` WHEN BUILDING, for dna-lab's reason: buildMolecule bakes a
 * spec's view rotation into the meshes, and every pose here comes from the
 * record instead. */
const flat = s => ({ ...s, view:null });

let step = 1;
let forkOut = 0;                 // 0 the closed duplex · 1 the arm fully swung out

const L = Lesson.create(document.getElementById('gl'), {
  cam:{ theta:0, phi:1.5708, r:34 }, rMax:400, orbit:false,
  // The frame OPENS WITH THE FORK. A duplex is 17 units across and the splayed
  // arm swings out past 30, so a fixed frame either crops the fork or draws the
  // closed duplex tiny for the whole lesson.
  boxes:()=>[{ x:0, y:0, rxz:17 + 15 * forkOut, hy:58 }],
  reservePx:()=>({ bottom: stripEl.classList.contains('on') ? 190 : 90 }),
  afterFrame:()=>NOTES.step(),
});

/* =============================================================================
 *  THE MOLECULE — THREE STRANDS, NOT TWO
 * =============================================================================
 *  Twelve pairs of 1BNA, built as individual nucleotides rather than as rungs:
 *  this page takes the duplex apart along the join a cell takes it apart along,
 *  so a residue has to be its own object.
 *
 *  TEMPLATE is one parental strand and never moves. PARTNER is the other
 *  parental strand, which swings away behind the fork. COPY is the new strand
 *  the student builds, and it lands on the partner's own coordinates — because
 *  that is the claim: the new strand has the old partner's sequence, and it has
 *  it because the template dictated it, base by base.
 *
 *  So partner and copy are the same molecule twice, in the same places, and
 *  that is not a duplicate to be cleaned up: one of them is what was there and
 *  the other is what gets made. Watching one leave and the other arrive IS
 *  semiconservative replication.
 * ========================================================================== */
const SPIN = new THREE.Group();
L.root.add(SPIN);
const G = new THREE.Group();
SPIN.add(G);

const LETTER = { DA:'adenine', DT:'thymine', DG:'guanine', DC:'cytosine' };
const CODE = { adenine:'A', thymine:'T', guanine:'G', cytosine:'C' };
const PAIRS_WITH = { adenine:'thymine', thymine:'adenine',
                     guanine:'cytosine', cytosine:'guanine' };
const keyAt = (pair, strand) => LETTER[bdna.pairs[pair].seq.split('-')[strand]];

/* One nucleotide, on the record's own coordinates. The three steps are
 * dna/nucleotide.js's — build the spec, fit it onto the residue it is, then
 * wear the record's coordinates, which is what makes the backbone bonds come
 * out at 1.6 Å instead of anywhere between 1.47 and 2.73. */
function residue(pair, strand){
  const key = keyAt(pair, strand);
  const built = Nucleo.build(key);
  const f = Nucleo.fit(built, pair, strand);
  const spec = f.ok ? Nucleo.wearRecord(built, pair, strand, f) : built;
  const res = { key, pair, strand, spec,
                home:new THREE.Vector3(), quat:new THREE.Quaternion() };
  if(f.ok){ res.home.set(...f.pos); res.quat.set(...f.quat); }
  res.mol = Stage.buildMolecule(flat(spec), { center:false });
  res.mol.position.copy(res.home);
  res.mol.quaternion.copy(res.quat);
  G.add(res.mol);
  return res;
}

/* WHAT HAS LET GO STEPS BACK. Once a pair's hydrogen bonds are gone the old
 * partner is no longer part of anything on stage, and at full colour it argues
 * with the duplex being built beside it. Greyed IN PLACE, the same treatment
 * dna-structure uses for a part that is present but not the subject — no
 * transparency, so nothing sorts wrongly through twelve pairs of depth. */
const GREY = new THREE.Color(0x9a9186);
function ghost(res, u){
  res.mol.traverse(o => {
    if(!o.isMesh || !o.material) return;
    if(o.userData.base === undefined) o.userData.base = o.material.color.getHex();
    o.material.color.setHex(o.userData.base);
    if(u > 0) o.material.color.lerp(GREY, u);
  });
}

const template = bdna.pairs.map((_, i) => residue(i, 0));
const partner  = bdna.pairs.map((_, i) => residue(i, 1));
const copy      = bdna.pairs.map((_, i) => residue(i, 1));
for(const res of copy) res.mol.visible = false;

const atomOf = (res, name) => res.spec.names.indexOf(name);
const posOf = (res, i) => new THREE.Vector3(...res.spec.atoms[i].pos)
  .applyQuaternion(res.mol.quaternion).add(res.mol.position);
// At HOME, whatever the mesh is doing: which atoms bond is a question about the
// finished strand, not about where a nucleotide is being held.
const homeOf = (res, i) => new THREE.Vector3(...res.spec.atoms[i].pos)
  .applyQuaternion(res.quat).add(res.home);
const worldOf = (res, i) => G.localToWorld(posOf(res, i));

/* ---- the rails ------------------------------------------------------------
 * A phosphodiester bond runs between two nucleotides, so it belongs to neither
 * and is drawn here. The parental strands' rails exist from the start — they
 * are finished molecules — and the copy's appear as the student makes them.
 * The partner's are re-placed every frame, because that strand moves and its
 * backbone is the one thing that must be seen NOT to break. */
const stickGeo = new THREE.CylinderGeometry(0.15, 0.15, 1, 8);
const UP = new THREE.Vector3(0, 1, 0);
function rail(a, b, colour){
  const m = new THREE.Mesh(stickGeo, new THREE.MeshStandardMaterial(
    { color:colour, roughness:.55 }));
  m.userData.link = [a, b];
  G.add(m);
  placeRail(m);
  return m;
}
const _d = new THREE.Vector3();
function placeRail(m){
  const [a, b] = m.userData.link;
  const from = posOf(a, atomOf(a, 'O3′')), to = posOf(b, atomOf(b, 'Pᴾ'));
  _d.subVectors(to, from);
  m.position.copy(from).addScaledVector(_d, 0.5);
  m.quaternion.setFromUnitVectors(UP, _d.clone().normalize());
  m.scale.set(1, _d.length(), 1);
}
const COVALENT = 0xbfae8e;
// Strand 0 runs 0→1→…→11; strand 1 runs the other way, which is what
// antiparallel means and what the record's own links say.
for(let i = 0; i < bdna.n - 1; i++) rail(template[i], template[i + 1], COVALENT);
const partnerRails = [];
for(let i = bdna.n - 1; i > 0; i--) partnerRails.push(rail(partner[i], partner[i - 1], COVALENT));

/* ---- the hydrogen bonds ---------------------------------------------------
 * kit/hbond.js's dashes, the same object dna-structure draws, at the same navy.
 * Which atoms is dna/nucleotide.js's `baseContacts`: mutual nearest, so a pair
 * shows the two or three bonds it has rather than every close contact. Gap and
 * radius are scaled to this molecule, whose lengths have been through SCALE —
 * the module's defaults are for a scene built in ångströms. */
const HB = HBond.create(THREE, { gap:0.95, radius:0.085, fill:0.55 });
G.add(HB.group);
// A question about the finished pair, so it is asked once: the same two bases
// at the same coordinates, whether the partner is leaving or the copy arriving.
const CONTACTS = bdna.pairs.map((_, p) =>
  Nucleo.baseContacts(template[p], partner[p],
    (r, i) => (r === template[p] ? homeOf(template[p], i) : homeOf(partner[p], i)).toArray()));
const HB_TOTAL = CONTACTS.reduce((n, c) => n + c.length, 0);

/* STAND IT UP, SOLVED, and centre on the pair origins — dna-structure's reason:
 * the crystallographers' cell points the axis wherever it points, so a typed
 * rotation is right for one bake and silently wrong for the next. */
{
  const axis = new THREE.Vector3(...bdna.pairs[bdna.n - 1].origin)
    .sub(new THREE.Vector3(...bdna.pairs[0].origin)).normalize();
  G.quaternion.setFromUnitVectors(axis, UP);
  const mid = new THREE.Vector3();
  for(const p of bdna.pairs) mid.add(new THREE.Vector3(...p.origin));
  mid.multiplyScalar(S / bdna.n).applyQuaternion(G.quaternion);
  G.position.sub(mid);
}
// Chosen at the stage: which face of a duplex reads best is a question about
// the picture, not about the record.
SPIN.rotation.y = 1.145;

const NOTES = Annot.create(THREE, stage, L.camera, { mode:'on' });

/* =============================================================================
 *  THE ORDER, AND WHY IT IS THAT ONE
 * =============================================================================
 *  Read off the record's own links rather than chosen. On strand 1 every bond
 *  runs from a pair to the one BELOW it (11→10→…), so 11 is that strand's 5′
 *  end and 0 is its 3′ end — and a strand only grows at its 3′ end. So the copy
 *  is made 11, 10, 9 … and the template is read the other way, 3′ to 5′, which
 *  is the fact this page is for.
 * ========================================================================== */
const ORDER = (() => {
  const links = bdna.links.filter(l => l.strand === 1);
  const downwards = links.every(l => l.to.pair < l.from.pair);
  const idx = bdna.pairs.map((_, i) => i);
  return downwards ? idx.slice().reverse() : idx;
})();
const N = ORDER.length;
const kOf = pair => ORDER.indexOf(pair);

/* =============================================================================
 *  THE FORK, WHICH IS A JUNCTION AND NOT AN EVENT
 * =============================================================================
 *  A cell does not unwind a chromosome and then copy it. Helicase opens a
 *  short stretch — about twenty base pairs — and the polymerase copies each
 *  strand immediately behind it, so finished duplex trails the fork and closed
 *  parental duplex runs ahead of it. Copying the whole thing after opening the
 *  whole thing is the CONSERVATIVE model, which Meselson and Stahl ruled out in
 *  1958, and it is exactly the shape a page gets if it opens everything in one
 *  step and copies in the next.
 *
 *  So the fork here is a POSITION, kept a couple of pairs ahead of what the
 *  student has built, and it advances because they build. At any moment:
 *
 *      ahead of it   parental duplex, closed, paired
 *      at it         one or two pairs letting go
 *      behind it     template + copy, paired again, and the old partner
 *                    swinging away as the other arm of the Y
 *
 *  THE ARM HINGES AT THE JUNCTION. A departing nucleotide's displacement grows
 *  with how far BEHIND the fork it is, so the two arms open at a widening angle
 *  from a travelling point, which is what a zip does. Displacing every open
 *  nucleotide by the same amount reads as a wall being moved instead.
 * ========================================================================== */
// Helicase runs AHEAD of the polymerase — a real fork has a stretch of open
// single strand between them — so the fork is kept a few pairs in front of the
// cursor rather than one. It is also what makes the opening visible: a pair
// does not come apart until the bend has had two or three joints to work with.
const LEAD = 4;                  // pairs open ahead of the cursor
const RAMP = 3.5;                // pairs it takes the arm to reach full swing
const SPLAY = 26;                // how far out the arm swings, in scene units
let openF = 0;                   // the fork, in ORDER positions, animated
let made = 0;                    // nucleotides the student has added

/* ---- THE ARM BENDS, IT DOES NOT STRETCH ----------------------------------
 * The first version moved each open nucleotide outward along its own radius,
 * which pulled the backbone between it and its neighbour to twenty ångströms —
 * a covalent bond drawn stretched, in a step whose whole claim is that no
 * covalent bond breaks. The picture contradicted the caption.
 *
 * So the arm is a HINGED CHAIN. Each phosphodiester bond gets a few degrees of
 * turn, and every nucleotide outside that joint is carried rigidly with it —
 * which is what a rotation about a point on the bond does, and it leaves every
 * length in the strand exactly what it was. Bend enough joints and the arm
 * swings clear of the duplex; the backbone is never anything but intact, and
 * the opening reads as a zip because the bend accumulates from the junction
 * outward.
 *
 * WHERE THE PIVOT IS. For the joint between an open nucleotide and the one
 * still paired, the pivot is the phosphorus on the PAIRED side. A rotation
 * about that atom cannot change its distance to anything, so the bond across
 * the junction — the one bond that would otherwise take the strain — is exactly
 * as long after the turn as before it. */
/* HOW THE BEND IS SPREAD, and this is the difference between a zip and a curl.
 * If every joint behind the fork holds the same angle the arm rolls up like a
 * watch spring. A zip's arms are STRAIGHT: all of the bending is in the few
 * joints at the junction, and a joint straightens again once the fork has moved
 * well past it, handing the turn to the joints now at the front. So a joint's
 * angle is a bump — nothing at the junction itself, most of it a bond or two
 * behind, nothing again further back — and the bump's total is the angle the
 * arm ends up at. */
const BEND_SPAN = 4;             // joints the bend is spread over
const ARM_ANGLE = 1.05;          // radians the open arm finally sits at
const bendAt = d => (d <= 0 || d >= BEND_SPAN) ? 0
  : ARM_ANGLE * Math.pow(Math.sin(Math.PI * d / BEND_SPAN), 2) / (BEND_SPAN / 2);
const ease = u => u * u * (3 - 2 * u);

// Which way a joint turns: about the tangent, so the arm swings out of the
// duplex rather than around it or along it. Read off the helix, in G's frame.
const gi = G.quaternion.clone().invert();
const AXIS_UP = new THREE.Vector3(0, 1, 0).applyQuaternion(gi).normalize();
const HINGE_AXIS = partner.map(res => {
  const v = res.home.clone().applyQuaternion(G.quaternion);
  const rad = new THREE.Vector3(v.x, 0, v.z);
  if(rad.lengthSq() < 1e-6) rad.set(1, 0, 0);
  rad.normalize().applyQuaternion(gi);
  return new THREE.Vector3().crossVectors(AXIS_UP, rad).normalize();
});
// Kept for one job only: the direction an arriving nucleotide comes in from.
const PEEL = partner.map((res, i) => {
  const v = res.home.clone().applyQuaternion(G.quaternion);
  const rad = new THREE.Vector3(v.x, 0, v.z);
  if(rad.lengthSq() < 1e-6) rad.set(1, 0, 0);
  return rad.normalize().multiplyScalar(SPLAY).applyQuaternion(gi);
});

/* Fold the open arm, joint by joint, from the junction outward. `T` is the
 * transform in force for everything further out than the joint being applied,
 * and each joint composes one more rotation onto it — so a nucleotide ten
 * bonds back from the fork carries the sum of ten small turns. */
const _tq = new THREE.Quaternion(), _tp = new THREE.Vector3();
const _piv = new THREE.Vector3(), _rq = new THREE.Quaternion();
function foldArm(){
  const j = Math.min(N - 1, Math.floor(openF));
  _tq.identity(); _tp.set(0, 0, 0);
  const apply = (v, out) => out.copy(v).applyQuaternion(_tq).add(_tp);
  for(let k = j; k >= 0; k--){
    const res = partner[ORDER[k]];
    const inner = k + 1 < N ? partner[ORDER[k + 1]] : res;
    // The pivot is where that atom is NOW — the joint nearer the fork has
    // already been folded, and this one turns about the arm it is holding.
    apply(homeOf(inner, atomOf(inner, 'Pᴾ')), _piv);
    /* THE LAST NUCLEOTIDE HAS NOTHING AHEAD OF IT. Every other joint hands its
     * turn on to the joints in front as the fork passes; this one has none, so
     * it keeps the whole arm angle instead of letting the bump run off the end.
     * Without it one pair of the twelve was still holding hands after
     * everything else had let go, and the tally stopped at 29 of 32. */
    const last = k === N - 1;
    const turn = last ? ARM_ANGLE * ease(Math.max(0, Math.min(1, (openF - k) / 2)))
                      : bendAt(openF - k);
    _rq.setFromAxisAngle(HINGE_AXIS[ORDER[k]], turn);
    // Compose about the pivot: rotate, then put the pivot back where it was.
    _tq.premultiply(_rq);
    _tp.sub(_piv).applyQuaternion(_rq).add(_piv);
    apply(res.home, res.mol.position);
    res.mol.quaternion.copy(_tq).multiply(res.quat);
  }
  // Everything the fork has not reached is still where the record put it.
  for(let k = j + 1; k < N; k++){
    const res = partner[ORDER[k]];
    res.mol.position.copy(res.home);
    res.mol.quaternion.copy(res.quat);
  }
}

// A hydrogen bond stretched this far past its resting length is not one any
// more. Its own contacts say what it started at, so this is a ratio.
const BREAK_AT = 2.4;
const broken = new Set();

/* Everything that depends on where the fork is, in one place and called on
 * every frame of every animation: the arm's position, the rails that follow it,
 * which pairs are still holding, and how wide the stage has to be. */
function layout(){
  foldArm();
  for(const m of partnerRails) placeRail(m);

  const segs = [];
  for(let p = 0; p < bdna.n; p++){
    const k = kOf(p);
    // Ahead of the fork and at it: the parental pair, until it lets go.
    if(!broken.has(p)){
      if(stretch(p) > BREAK_AT){ broken.add(p); snap(p); ghost(partner[p], 0.55); }
      else for(const [i, j] of CONTACTS[p])
        segs.push([posOf(template[p], i), posOf(partner[p], j)]);
    }
    // Behind it: the pair the student has just made, which is the same pair
    // again — same two bases, same two or three bonds.
    if(k < made) for(const [i, j] of CONTACTS[p])
      segs.push([posOf(template[p], i), posOf(copy[p], j)]);
  }
  HB.setVisible(segs.length > 0);
  if(segs.length) HB.set(segs);

  // How wide the stage has to be: measured off the arm rather than guessed
  // from the fork position, because a hinged arm's reach is what the frame has
  // to hold and that depends on how many joints have turned.
  let reach = 0;
  for(const res of partner) reach = Math.max(reach, res.mol.position.distanceTo(res.home));
  forkOut = Math.max(0, Math.min(1, reach / SPLAY));
  L.fit();
}

// How far past its resting length this pair's hydrogen bonds are, as a ratio:
// the same contacts that are drawn, measured where they are now.
function stretch(pair){
  const cs = CONTACTS[pair];
  if(!cs.length) return 0;
  let now = 0, rest = 0;
  for(const [i, j] of cs){
    now  += posOf(template[pair], i).distanceTo(posOf(partner[pair], j));
    rest += homeOf(template[pair], i).distanceTo(homeOf(partner[pair], j));
  }
  return rest ? now / rest : 0;
}

/* The moment a pair lets go, at the gap it was holding. Navy, which is this
 * repo's hydrogen bond wherever one is drawn: the flash is that object
 * disappearing, not a new kind of event. */
function snap(pair){
  if(!L.fx) return;
  const cs = CONTACTS[pair];
  if(!cs.length) return;
  const at = new THREE.Vector3();
  for(const [i, j] of cs) at.add(worldOf(template[pair], i)).add(worldOf(partner[pair], j));
  L.fx.spawnBurst(at.multiplyScalar(1 / (cs.length * 2)),
                  MolLib.PALETTE.bonds.hbond, 9, null, 0.7, { blend:'normal' });
}

// The fork moves at a pace, not in jumps: the junction travelling is the whole
// picture, and a junction that teleports is two pictures.
function moveFork(to, dur, then){
  const from = openF;
  if(Math.abs(to - from) < 1e-4){ if(then) then(); return; }
  L.motion.seq([{ dur:dur == null ? 0.5 : dur, ease:'inOutCubic',
    onUpdate:u=>{ openF = from + (to - from) * u; layout(); say(); },
    onDone:then || null }], { tag:'fork' });
}

/* =============================================================================
 *  THE STRIP
 * =============================================================================
 *  Two rows and four buttons. The top row is the template as the polymerase
 *  reads it; the bottom is what has been built under it. Both are written from
 *  the molecule — the letters are the record's sequence — so the strip cannot
 *  drift from the thing on stage.
 * ========================================================================== */
const rowT = stripEl.querySelector('.row.template');
const rowB = stripEl.querySelector('.row.built');
const picks = stripEl.querySelector('.picks');

for(const p of ORDER){
  const t = document.createElement('div');
  t.className = 'cell';
  t.textContent = CODE[keyAt(p, 0)];
  rowT.appendChild(t);
  rowB.appendChild(Object.assign(document.createElement('div'), { className:'cell' }));
}
for(const key of ['adenine', 'thymine', 'guanine', 'cytosine']){
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = CODE[key];
  b.dataset.key = key;
  b.onclick = () => choose(key);
  picks.appendChild(b);
}
const cellsT = [...rowT.children], cellsB = [...rowB.children];

function paintStrip(){
  cellsT.forEach((c, i) => {
    c.classList.toggle('at', i === made);
    // A letter the fork has not reached is still paired up and cannot be read.
    c.classList.toggle('shut', i >= openF);
  });
  cellsB.forEach((c, i) => {
    c.classList.toggle('at', i === made);
    c.classList.toggle('done', i < made);
    c.textContent = i < made ? CODE[keyAt(ORDER[i], 1)] : '';
  });
  const done = made >= N;
  for(const b of picks.children) b.disabled = done || busy || step !== 2;
}

/* =============================================================================
 *  ADDING ONE NUCLEOTIDE
 * =============================================================================
 *  The two bonds in one beat, which is the argument of the page: the incoming
 *  nucleotide pairs with the template AND joins the strand, and there is no
 *  moment in between where a bare pair waits to be stitched in. Then the fork
 *  advances, because the polymerase is what opens the next pair.
 * ========================================================================== */
let busy = false;

function choose(key){
  if(busy || step !== 2 || made >= N) return;
  const pair = ORDER[made];
  const want = PAIRS_WITH[keyAt(pair, 0)];
  if(key !== want){ refuse(key, pair); return; }
  place(pair);
}

/* A WRONG LETTER IS REFUSED BY THE RULE, not by a score. What is said is which
 * bonds would have to form and cannot, because that is the only reason it is
 * wrong. */
function refuse(key, pair){
  const t = keyAt(pair, 0);
  // THE CELL, NOT THE CURSOR: the flash clears on a timer, and by then the
  // student may have played the right letter and moved the cursor on.
  const cell = cellsB[made];
  cell.classList.add('wrong');
  cell.textContent = CODE[key];
  setTimeout(() => { cell.classList.remove('wrong'); paintStrip(); }, 700);
  note.innerHTML = `<b>${CODE[key]} cannot sit opposite ${CODE[t]}.</b> `
    + 'The donors and acceptors along the two edges have to line up, and only '
    + `one of the four bases does that with ${CODE[t]}.`;
}

// Out of open solution, from the side the fork is open on.
const arriveFrom = pair => partner[pair].home.clone().addScaledVector(PEEL[pair], 1.6);

function place(pair){
  busy = true;
  paintStrip();
  const res = copy[pair];
  const from = arriveFrom(pair);
  const prev = made > 0 ? copy[ORDER[made - 1]] : null;
  res.mol.visible = true;
  res.mol.position.copy(from);
  L.motion.seq([
    { dur:0.5, ease:'outCubic',
      onUpdate:u=>{ res.mol.position.lerpVectors(from, res.home, u); layout(); } },
    { call:()=>{
        res.mol.position.copy(res.home);
        made++;
        /* The phosphodiester bond, made at the 3′ end of what is already there
         * — and NO LEAVING WATER DRAWN, which is the one place this page
         * simplifies. Everywhere else in this repo a condensation shows its
         * water going; here the incoming nucleotide is a triphosphate in a
         * cell and what leaves is pyrophosphate, whose hydrolysis pays for the
         * bond. Ours carries one phosphate, so the page flares the bond and
         * says the rest in words rather than drawing a molecule that is not
         * the one that leaves. */
        if(prev){
          rail(prev, res, MolLib.PALETTE.bonds.condense);
          const at = worldOf(prev, atomOf(prev, 'O3′'))
            .add(worldOf(res, atomOf(res, 'Pᴾ'))).multiplyScalar(0.5);
          if(L.fx) L.fx.condense(at, null, { size:1.0 });
        }
        busy = false;
        paintStrip();
        // The polymerase opens what it is about to read: one more pair, kept
        // LEAD ahead of the cursor.
        // Past the end at the end: the fork's lead is what stretches a pair
        // apart, so stopping it at the last one leaves that pair still holding.
        moveFork(Math.max(openF, Math.min(N + RAMP, made + LEAD)), 0.45);
        layout();
        say();
      } },
  ], { tag:'place' });
}

/* =============================================================================
 *  WHAT THE PAGE SAYS
 * =============================================================================
 *  Every number in here is read at render time off the molecule: how many
 *  hydrogen bonds have gone, how long the bond just made is, how many pairs are
 *  open. A typed number is a claim nothing checks.
 * ========================================================================== */
const brokenCount = () => [...broken].reduce((n, p) => n + CONTACTS[p].length, 0);

function say(){
  if(step === 1) return say1();
  if(step === 2) return say2();
  return say3();
}

function say1(){
  if(openF === 0){
    note.innerHTML = 'A finished double helix, and nothing holding the two '
      + `strands together but <b>${HB_TOTAL} hydrogen bonds</b>. Open it and `
      + 'watch what has to give: the bonds between the strands, and not one of '
      + 'the covalent bonds along them.';
    return;
  }
  note.innerHTML = 'A fork, not a split: helicase opens a few pairs at a time '
    + `— <b>${brokenCount()} of ${HB_TOTAL} hydrogen bonds</b> so far, and not `
    + 'one covalent bond. The backbones are untouched, so each arm is a whole '
    + 'chain carrying the whole sequence. <b>That is what makes a template.</b>';
}

function say2(){
  if(made === 0){
    note.innerHTML = `Now copy it. The fork runs ${LEAD} pairs ahead of you, `
      + 'the way helicase runs ahead of the polymerase. Choose the base that '
      + 'pairs with the letter under the cursor, and watch what it takes: '
      + '<b>hydrogen bonds to the template and a phosphodiester bond to the '
      + 'strand, in the same move.</b>';
    return;
  }
  if(made < N){
    const pair = ORDER[made - 1];
    const d = bondLength(made - 1);
    note.innerHTML = `${CODE[keyAt(pair, 1)]} paired with ${CODE[keyAt(pair, 0)]}: `
      + `<b>${CONTACTS[pair].length} hydrogen bonds</b>`
      + (d ? `, and a phosphodiester bond of <b>${d.toFixed(2)} Å</b> onto the 3′ end` : '')
      + `. The fork opens as you go — finished duplex behind it, parental helix `
      + `ahead. ${N - made} to go.`;
    return;
  }
  note.innerHTML = 'Finished. Every base is the one the template chose, and '
    + 'nothing about the backbone carries any of that information. <b>The old '
    + 'strand and the new one are now a double helix</b> — and the parental '
    + 'strand that swung away is being copied the same way, which is why each '
    + 'daughter molecule keeps one old strand. In a cell each arriving '
    + 'nucleotide carries three phosphates, and the two it loses pay for the bond.';
}

// Measured off the molecule, never typed: the bond that was just made.
function bondLength(k){
  if(k < 1) return null;
  const a = copy[ORDER[k - 1]], b = copy[ORDER[k]];
  return homeOf(a, atomOf(a, 'O3′')).distanceTo(homeOf(b, atomOf(b, 'Pᴾ'))) / S;
}

function say3(){
  note.innerHTML = 'The copy grew in one direction only: every nucleotide went '
    + 'onto the <b>3′</b> end, because that is the end with the free –OH the '
    + 'incoming phosphate reacts with. So the template was read the other way, '
    + '3′ to 5′ — which is what antiparallel is FOR, and why the two strands at '
    + 'a real fork are copied by different tricks.';
}

/* =============================================================================
 *  THE STEPS
 * =============================================================================
 *  One scene throughout: the fork does not reset between steps, because a fork
 *  that reappears closed after the student opened it says the opening was a
 *  demonstration rather than the thing they are doing.
 * ========================================================================== */
const STEPS = [
  { n:1, title:'The fork opens', sub:'hydrogen bonds only' },
  { n:2, title:'Copy as it opens', sub:'pair and join, together' },
  { n:3, title:'One direction', sub:'5′ to 3′, always' },
];

function showStep(n){
  step = n;
  L.motion.cancel('place');
  L.motion.cancel('fork');
  NOTES.clear();
  note.classList.add('on');
  note.classList.toggle('low', n === 3);
  stripEl.classList.toggle('on', n === 2);
  startEl.classList.toggle('on', n === 1);

  if(n === 1){
    // Back to the closed duplex. It does not open until the student says so:
    // an animation that plays on arrival is a thing that happened TO them, and
    // this one is the first half of the move they are about to make twelve
    // times.
    made = 0;
    broken.clear();
    for(const res of partner) ghost(res, 0);
    for(const res of copy) res.mol.visible = false;
    openF = 0; layout();
  }
  if(n === 2){
    // The fork never goes backwards: what the student opened stays open.
    moveFork(Math.max(openF, Math.min(N + RAMP, made + LEAD)), 0.6);
    layout();
  }
  if(n === 3){
    // The finished thing: the copy complete, the old partner swung clear.
    made = N;
    openF = N + RAMP;
    for(const res of copy) res.mol.visible = true;
    for(const res of partner) ghost(res, 0.55);
    for(let k = 1; k < N; k++){
      const a = copy[ORDER[k - 1]], b = copy[ORDER[k]];
      if(!a.railed){ rail(a, b, MolLib.PALETTE.bonds.condense); a.railed = true; }
    }
    layout();
    const end = (res, name) => () => worldOf(res, atomOf(res, name));
    NOTES.add({ text:'3′ — added here', at:end(copy[ORDER[N - 1]], 'O3′'),
      card:'Every nucleotide arrived at this end. A strand cannot grow the other way: nothing reacts with a phosphate that is already esterified.',
      offset:[62, 16] });
    NOTES.add({ text:'5′ — where it started', at:end(copy[ORDER[0]], 'Pᴾ'),
      card:'The first nucleotide of the copy. Its phosphate is free, which is why this end is called 5′.',
      offset:[-62, -16] });
    NOTES.add({ text:'The other parental strand', at:()=>worldOf(partner[ORDER[Math.floor(N / 2)]], atomOf(partner[0], 'Pᴾ')),
      card:'Copied the same way, against its own new partner. That is why each daughter molecule is one old strand and one new one.',
      offset:[70, -20] });
  }
  paintStrip();
  say();
  for(const b of document.querySelectorAll('#steps button'))
    b.setAttribute('aria-current', String(+b.dataset.n === n));
  L.fit();
}

/* The fork opens, and the page moves straight on to the copying: the strip
 * arriving as the last pair lets go is the same event continuing, and making
 * the student find the next step in the rail would break it in half. */
startEl.onclick = () => {
  startEl.classList.remove('on');
  moveFork(LEAD + 1, 2.2, () => showStep(2));
};

const navEl = document.getElementById('steps');
for(const st of STEPS){
  const b = document.createElement('button');
  b.dataset.n = st.n;
  b.innerHTML = `${st.title}<span>${st.sub}</span>`;
  b.onclick = () => showStep(st.n);
  navEl.appendChild(b);
}

/* Turning it is the point on every page in this family, and it is the same
 * gesture on all of them: yaw about the duplex's own axis. */
const canvas = document.getElementById('gl');
let turn = null;
canvas.addEventListener('pointerdown', e => {
  turn = { x:e.clientX };
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
});
canvas.addEventListener('pointermove', e => {
  if(!turn) return;
  SPIN.rotation.y += (e.clientX - turn.x) * 0.008;
  turn = { x:e.clientX };
});
addEventListener('pointerup', () => { turn = null; });

showStep(1);
L.resize(); L.fit(); L.start();
</script>
</body>
</html>
